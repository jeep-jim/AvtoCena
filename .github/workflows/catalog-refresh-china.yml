name: Catalog refresh china
on:
  workflow_dispatch:
  schedule:
    # 21:00 Asia/Novokuznetsk (UTC+7), three hours earlier by owner request 30.10.2026.
    - cron: "0 14 * * *"
  push:
    branches: [main]
    paths: ['.github/market-runs/china-refresh.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-china
  cancel-in-progress: false
jobs:
  refresh:
    uses: ./.github/workflows/catalog-market-refresh.yml
    with:
      market: china
    secrets: inherit
