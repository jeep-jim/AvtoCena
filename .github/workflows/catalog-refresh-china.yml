name: Catalog refresh china
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Source mirror or existing recovery publisher
        type: choice
        default: mirror
        options: [mirror, recover_existing_intake]
  schedule:
    # 21:00 Asia/Novokuznetsk (UTC+7), three hours earlier by owner request 30.10.2026.
    - cron: "0 14 * * *"
  push:
    branches: [main]
    paths: ['.github/market-runs/china-refresh.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-china
  cancel-in-progress: false
jobs:
  download:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'recover_existing_intake'
    environment: regcloud-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download paid Che168 changes from the saved source cursor into REG
        env:
          AUTO_API_CHE168_KEY: ${{ secrets.AUTO_API_CHE168_KEY }}
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/catalog-download-owned-china.mjs

  recover_existing_intake:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover_existing_intake'
    uses: ./.github/workflows/catalog-market-refresh.yml
    with:
      market: china
    secrets: inherit
