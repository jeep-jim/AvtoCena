name: One-shot Europe AutoScout HQ safe refresh

on:
  push:
    branches:
      - ops/europe-autoscout-hq-refresh-20260814
    paths:
      - .github/workflows/oneshot-europe-autoscout-hq-refresh-safe.yml

permissions:
  contents: read

concurrency:
  group: catalog-europe-autoscout-hq-refresh-20260814
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      AUTOSCOUT_HQ_CONCURRENCY: "8"
      AUTOSCOUT_HQ_RETRIES: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-autoscout-hq-refresh-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate AutoScout exact HQ contract
        run: node --import tsx --test tests/catalog-autoscout-hq-gallery.test.ts
      - name: Validate isolated refresh script syntax
        run: node --check scripts/oneshot-europe-autoscout-hq-refresh-safe.mjs
      - name: Refresh current Europe AutoScout rows and preserve six markets exactly
        run: npx tsx scripts/oneshot-europe-autoscout-hq-refresh-safe.mjs
      - name: Wait for production manifest cache to roll
        run: sleep 75
      - name: Verify production Europe cards and market counts
        shell: bash
        run: |
          set -euo pipefail
          expected_europe="$(jq -r '.europeAfter' europe-autoscout-hq-refresh-result.json)"
          first_id="$(jq -r '.firstUpdated[0].id // empty' europe-autoscout-hq-refresh-result.json)"
          first_source="$(jq -r '.firstUpdated[0].sourceOfferId // empty' europe-autoscout-hq-refresh-result.json)"
          test -n "$first_id"
          for attempt in $(seq 1 12); do
            curl --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 -fsS 'https://avtocena.com/api/catalog/search?market=europe&pageSize=48&page=1&sort=updatedAt' > /tmp/europe.json || true
            total="$(jq -r '.total // 0' /tmp/europe.json 2>/dev/null || echo 0)"
            card="$(jq -r --arg id "$first_id" '.items[]? | select(.id==$id) | (.cardImageUrl // .images[0].url // "")' /tmp/europe.json 2>/dev/null | head -1)"
            if [ "$total" = "$expected_europe" ] && [[ "$card" == *"prod.pictures.autoscout24.net/listing-images/${first_source}_"* ]] && [[ "$card" == *"/1280x960."* ]]; then
              break
            fi
            sleep 10
          done
          test "$(jq -r '.total // 0' /tmp/europe.json)" = "$expected_europe"
          card="$(jq -r --arg id "$first_id" '.items[]? | select(.id==$id) | (.cardImageUrl // .images[0].url // "")' /tmp/europe.json | head -1)"
          [[ "$card" == *"prod.pictures.autoscout24.net/listing-images/${first_source}_"* ]]
          [[ "$card" == *"/1280x960."* ]]
          page="$(curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -fsS "https://avtocena.com/cars/offer/$first_id")"
          [[ "$page" == *"1280x960"* ]]
          for market in korea china japan uae georgia kyrgyzstan; do
            expected="$(jq -r --arg m "$market" '.preservation[$m].count' europe-autoscout-hq-refresh-result.json)"
            actual="$(curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -fsS "https://avtocena.com/api/catalog/search?market=${market}&pageSize=1&page=1&sort=updatedAt" | jq -r '.total // 0')"
            test "$actual" = "$expected"
          done
          jq '{total, sample: [.items[0:12][] | {id, cardImageUrl, images}]}' /tmp/europe.json > europe-production-hq-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-autoscout-hq-refresh-proof
          path: |
            europe-autoscout-hq-refresh-result.json
            europe-production-hq-proof.json
          if-no-files-found: warn
          retention-days: 5
