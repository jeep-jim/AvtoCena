name: One-shot offer banner and live brands

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneshot-offer-banner-live-brands.yml

permissions:
  contents: write

concurrency:
  group: oneshot-offer-banner-live-brands
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Apply targeted changes
        run: python3 .github/oneshot/offer-banner-live-brands.py

      - name: Install and typecheck
        run: |
          npm ci
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo

      - name: Verify targeted diff
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | grep -c '^apps/web/components/home/BuyerGallery.tsx$' || true)" = "0"
          test "$(git diff --name-only | grep -c '^.github/workflows/catalog' || true)" = "0"

      - name: Commit once and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-offer-banner-live-brands.yml
          git rm .github/oneshot/offer-banner-live-brands.py
          git add apps/web/components/leads/PublicLeadCaptureV2.tsx
          git add apps/web/components/catalog/BrandLogoRail.tsx
          git add apps/web/app/api/catalog/models/route.ts
          git add apps/web/lib/catalog/storage.ts
          git add 'apps/web/app/(public)/cars/page.tsx'
          git add 'apps/web/app/(public)/results/results-impl.tsx'
          git add apps/web/components/home/HomePageClient.tsx
          git commit -m "fix: move fallback lead CTA and hide unavailable brands"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
