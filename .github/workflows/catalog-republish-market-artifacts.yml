name: Catalog V3 · republish collected market artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/republish-artifacts"
  workflow_dispatch:
    inputs:
      market:
        description: Market to publish
        required: true
        type: choice
        options: [korea, china, japan, uae, europe, georgia]
      source_run_id:
        description: Completed Catalog V3 run containing five shard artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-v3-republish-artifacts
  cancel-in-progress: false

env:
  CATALOG_V2_PRIORITY_TARGET: "1"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "15000000"
  CATALOG_PUBLIC_ABSOLUTE_MAX_TOTAL_RUB: "15000000"
  CATALOG_PUBLIC_MAX_TOTAL_TO_CAR_PRICE_RATIO: "8"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "10000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "10000"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "10000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "100000"
  CATALOG_DEFAULT_RETENTION_MS: "259200000"
  CATALOG_JAPAN_RETENTION_MS: "2592000000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "5"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      market: ${{ steps.config.outputs.market }}
      run_id: ${{ steps.config.outputs.run_id }}
      retention_ms: ${{ steps.config.outputs.retention_ms }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        env:
          DISPATCH_MARKET: ${{ inputs.market }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const allowed = new Set(['korea','china','japan','uae','europe','georgia']);
          let market = String(process.env.DISPATCH_MARKET || '').trim();
          let runId = String(process.env.DISPATCH_RUN_ID || '').trim();
          if (!market || !runId) {
            const marker = JSON.parse(fs.readFileSync('.github/market-runs/republish-artifacts', 'utf8'));
            market = String(marker.market || '').trim();
            runId = String(marker.runId || '').trim();
          }
          if (!allowed.has(market)) throw new Error(`republish_market_invalid:${market}`);
          if (!/^\d+$/.test(runId)) throw new Error(`republish_run_id_invalid:${runId}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `market=${market}\nrun_id=${runId}\nretention_ms=${market === 'japan' ? '2592000000' : '259200000'}\n`);
          NODE

  publish:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_OFFER_RETENTION_MS: ${{ needs.config.outputs.retention_ms }}
      CATALOG_REBUILD_INPUT_DIR: catalog-v3-input
      CATALOG_REBUILD_MARKETS: ${{ needs.config.outputs.market }}
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-v3-republish-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-v3-republish-publish-report.json
      NODE_OPTIONS: "--max-old-space-size=5120"
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "12"
      CATALOG_INDEX_WRITE_CONCURRENCY: "6"
      CATALOG_STORAGE_EMERGENCY: "true"
      CATALOG_ENCYCLOPEDIA_IDENTITY_MASTER: "1"
      CATALOG_IDENTITY_PREPARE_CONCURRENCY: "12"
      CATALOG_PUBLISH_LOCK_TTL_MS: "1800000"
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: "300000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the completed collection without crawling sources again
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.config.outputs.run_id }}
          pattern: catalog-v3-${{ needs.config.outputs.market }}-[0-4]
          path: catalog-v3-input
          merge-multiple: true
      - name: Require all five collected shards
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const market=process.env.CATALOG_REBUILD_MARKETS;
          const files=fs.readdirSync(process.env.CATALOG_REBUILD_INPUT_DIR).filter(x=>new RegExp(`^catalog-rebuild-${market}-[0-4]\\.json$`).test(x));
          const total=files.reduce((n,f)=>{const p=JSON.parse(fs.readFileSync(path.join(process.env.CATALOG_REBUILD_INPUT_DIR,f)));return n+Number(p.count||p.offers?.length||0)},0);
          console.log({market,files:files.length,total});
          if(files.length!==5||total<=0) process.exit(1);
          NODE
      - name: Apply Encyclopedia Identity Master
        run: npx tsx scripts/catalog-apply-encyclopedia-identity-master.mjs
      - run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish market
        run: npx tsx scripts/catalog-publish-market.mjs
      - name: Require safe publication
        run: |
          node <<'NODE'
          const fs=require('fs');
          const market=process.env.CATALOG_REBUILD_MARKETS;
          const report=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,'utf8'));
          const count=Number(report.byMarket?.[market]||0);
          const state={market,published:report.published===true,generationId:report.generationId||null,count,publicationError:report.publicationError||''};
          console.log(JSON.stringify(state,null,2));
          if(!state.published||!state.generationId||state.count<=0||state.publicationError) process.exit(1);
          NODE
      - name: Audit published market
        env:
          CATALOG_AUDIT_ASSERT_MARKETS: ${{ needs.config.outputs.market }}
          CATALOG_AUDIT_OUTPUT: catalog-v3-republish-postpublish-audit.json
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v3-${{ needs.config.outputs.market }}-republish-reports
          path: |
            catalog-v3-republish-validation-report.json
            catalog-v3-republish-publish-report.json
            catalog-v3-republish-postpublish-audit.json
          retention-days: 3
