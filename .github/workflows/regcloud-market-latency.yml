name: Regcloud — isolate market page latency once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-market-latency.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the exact requested release
        run: |
          python3 - <<'PY'
          import json,re,os
          release=json.load(open('.github/market-runs/regcloud-market-latency.json'))['release']
          assert re.fullmatch('[a-f0-9]{40}',release)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EXPECTED_RELEASE='+release+'\n')
          PY
      - name: Wait for this exact runtime without starting or changing it
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,os
          deadline=time.monotonic()+15*60
          while True:
              try:
                  with urllib.request.urlopen('https://avtocena.com/api/health',timeout=15) as r:h=json.load(r)
                  if h.get('releaseSha')==os.environ['EXPECTED_RELEASE']:break
              except Exception:pass
              if time.monotonic()>deadline:raise RuntimeError('exact_runtime_not_installed')
              time.sleep(30)
          PY
      - name: Measure bounded VM requests after activation releases its lock
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 bash -s -- "$EXPECTED_RELEASE" <<'REMOTE'
          set -euo pipefail
          expected=$1
          exec 9>/run/lock/avtocena-runtime-change.lock
          flock -w 300 9
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' avtocena-production)
          source_ip=$(curl -4 -fsS --max-time 15 https://api.ipify.org)
          test "$source_ip" = 151.248.113.177
          python3 - "$port" "$expected" "$source_ip" <<'PY'
          import urllib.request,time,json,sys
          base='http://127.0.0.1:'+sys.argv[1]
          headers={'Host':'avtocena.com','X-Real-IP':sys.argv[3]}
          def read(path):
              start=time.monotonic()
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as r:
                  first=time.monotonic()-start;body=r.read()
                  value=json.loads(body) if path.startswith('/api/') else None
                  print('MARKET_HTTP',json.dumps({'path':path,'status':r.status,'firstSeconds':round(first,3),'totalSeconds':round(time.monotonic()-start,3),'bytes':len(body),'timing':r.headers.get('Server-Timing'),'items':len(value.get('items',[])) if value else None,'hasMore':value.get('hasMore') if value else None,'complete':bool(value.get('ok')) if value else b'</html>' in body and b'$RX(' not in body}),flush=True)
                  return value
          assert read('/api/health')['releaseSha']==sys.argv[2]
          for path in ['/cars?market=korea','/api/catalog/search?market=korea&pageSize=24','/api/catalog/search?market=korea&make=HYUNDAI&pageSize=24','/api/catalog/search?market=korea&budget=2000000&pageSize=24','/cars?market=japan']:
              read(path)
          assert read('/api/health')['releaseSha']==sys.argv[2]
          PY
          docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}}' avtocena-production
          REMOTE
      - name: Measure category click and actual brand filter on mobile and desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/market-live" --no-package-lock --ignore-scripts playwright@1.55.0
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/market-live/node_modules/playwright/index.mjs" CHROME_BIN="$(command -v google-chrome)" node tests/browser/catalog-interaction-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-interaction
          path: artifacts/catalog-interaction
          retention-days: 7
