name: Publish recovered Japan details
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/proauctions-detail-patches.json']
  workflow_run:
    workflows: ['Recover auction sheets from saved Japan HTML']
    types: [completed]
permissions:
  contents: read
  actions: read
# Detail recovery may overlap a read-only collection phase. The publisher still
# acquires catalog/import-lock.json atomically, shared with every catalog writer.
concurrency:
  group: catalog-japan-detail-maintenance
  cancel-in-progress: false
jobs:
  publish:
    # Only this owner-authorized archive recovery can trigger the automatic write.
    # The script independently rejects incomplete patches for published lots.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.id == 35321658779 &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_PUBLICATION_PROGRESS: '1'
      CATALOG_APPEND_RETAINED_PUBLIC: '1'
      CATALOG_PUBLICATION_DRY_RUN: '0'
      CATALOG_REBUILD_MARKETS: japan
      CATALOG_REBUILD_INPUT_DIR: proauctions-ready
      CATALOG_REBUILD_PUBLISH_REPORT: proauctions-publication.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '8'
      CATALOG_PUBLISH_LOCK_WAIT_MS: '14400000'
      CATALOG_PUBLISH_LOCK_TTL_MS: '5400000'
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: '300000'
      CATALOG_READ_CONCURRENCY: '4'
      YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '60000'
      NODE_OPTIONS: --max-old-space-size=11000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: proauctions-detail-patches
          path: proauctions-detail-patches
          run-id: 35321658779
          github-token: ${{ github.token }}
      - name: Preserve source power and append verified sheets under shared lock
        run: node --import tsx scripts/publish-proauctions-detail-patches.mjs
      - name: Verify all read models, prices and sampled Japan details
        run: |
          node --import tsx scripts/catalog-audit-current-readmodel-parity.mjs
          node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
          node --import tsx scripts/catalog-verify-current-offers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-detail-recovery
          path: |
            japan-detail-recovery-report.json
            catalog-current-readmodel-parity.json
            catalog-visible-calculation-coverage.json
            catalog-offer-detail-verify.json
          retention-days: 14
