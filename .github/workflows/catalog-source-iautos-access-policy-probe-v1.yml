name: Research iAutos access policy 20260906
on:
  push:
    branches: [chore/iautos-access-policy-v1-20260906]
    paths:
      - .github/workflows/catalog-source-iautos-access-policy-probe-v1.yml
      - scripts/catalog-source-iautos-access-policy-probe-v1.mjs
      - scripts/catalog-source-chngoodcar-access-policy-probe-v1.mjs
permissions:
  contents: read
concurrency:
  group: research-iautos-access-policy-20260906
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/chore/iautos-access-policy-v1-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/catalog-source-iautos-access-policy-probe-v1.mjs
            scripts/catalog-source-chngoodcar-access-policy-probe-v1.mjs
            data/catalog/source-qualification-v1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Offline request envelope regression
        run: node scripts/catalog-source-chngoodcar-access-policy-probe-v1.mjs --self-test
      - name: Bounded iAutos policy discovery
        run: node scripts/catalog-source-iautos-access-policy-probe-v1.mjs
      - name: Verify iAutos boundary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('catalog-source-iautos-access-policy-probe-v1.json','utf8'));
          assert.equal(p.sourceId,'iautos_china_candidate');
          assert.equal(p.completed,true);
          assert.equal(p.requestCount,p.requests.length);
          assert(p.requestCount<=p.maxRequests && p.maxRequests<=4);
          if(p.maxRequests===4) assert.notEqual(new URL(p.selectedPolicyLink.url).origin,'https://m.iautos.cn');
          assert(p.requests.filter(r=>r.kind==='policy').length<=1);
          assert(p.requests.every(r=>r.method==='GET'));
          for(const k of ['productionWrites','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','manifestWrites','cleanupStarted','rawBodiesStored','redirectsFollowed','guessedRoutes']) assert.equal(p[k],false);
          for(const k of ['listingRequests','detailRequests','apiRequests','paginationRequests','japanRequests']) assert.equal(p[k],0);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-iautos-access-policy-20260906
          path: catalog-source-iautos-access-policy-probe-v1.json
          retention-days: 30
          if-no-files-found: error
