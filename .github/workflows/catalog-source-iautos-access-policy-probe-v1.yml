name: Research iAutos access policy checkpoint 20260906
on:
  push:
    branches: [chore/iautos-access-policy-v1-20260906]
    paths:
      - .github/workflows/catalog-source-iautos-access-policy-probe-v1.yml
      - scripts/catalog-source-iautos-access-policy-checkpoint-v1.mjs
permissions:
  contents: read
concurrency:
  group: research-iautos-access-policy-20260906
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.ref == 'refs/heads/chore/iautos-access-policy-v1-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout: |
            scripts/catalog-source-chngoodcar-access-policy-probe-v1.mjs
            scripts/catalog-source-iautos-access-policy-checkpoint-v1.mjs
            data/catalog/source-qualification-v1.json
            data/catalog/source-partial-classification-v1.json
            data/catalog/source-access-policy-evidence/
            roadmap.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Offline safety regression
        run: node scripts/catalog-source-chngoodcar-access-policy-probe-v1.mjs --self-test
      - name: Validate manual decision and unchanged production files
        run: node scripts/catalog-source-iautos-access-policy-checkpoint-v1.mjs
      - name: Verify no tracked mutations
        run: |
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: research-iautos-access-policy-checkpoint-20260906
          path: catalog-source-iautos-access-policy-checkpoint-v1.json
          retention-days: 30
          if-no-files-found: error
