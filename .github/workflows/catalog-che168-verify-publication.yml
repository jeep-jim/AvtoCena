name: Verify committed Che168 publication
on:
  workflow_run:
    workflows: ['Catalog refresh china']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-committed-che168-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CHE168_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-quality-rebuild-reports-china
          path: che168-verification-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify active generation and committed feed cursor
        run: node --import tsx scripts/catalog-verify-che168-publication.mjs
      - name: Audit published calculation coverage
        run: node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
      - name: Reconcile paid-feed status after successful verification
        env:
          CHE168_RECONCILE_OUTCOME: '1'
        run: node --import tsx scripts/catalog-verify-che168-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: che168-publication-verification
          path: |
            che168-publication-verification.json
            catalog-visible-calculation-coverage.json
          retention-days: 14
