name: Verify committed Che168 publication
run-name: Verify Che168 source or publication · ${{ github.event.workflow_run.id }}
on:
  workflow_run:
    workflows: ['Catalog refresh china']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-committed-che168-publication
  cancel-in-progress: false
jobs:
  verify:
    # A deliberately skipped scheduled China refresh had no collection and no artifact.
    # Keep normal verification (and required artifacts) for every actual attempt.
    if: >-
      ${{
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        !(
          github.event.workflow_run.conclusion == 'skipped' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.path == '.github/workflows/catalog-refresh-china.yml'
        )
      }}
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      CHE168_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          # The verifier runs its exact controller revision. Producer identity
          # is authenticated separately; older downloads lack the new verifier.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify completed source mirror or require the actual publication artifact
        id: operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/catalog-verify-owned-china.mjs
      - uses: actions/download-artifact@v4
        if: steps.operation.outputs.mode == 'publication'
        with:
          name: catalog-quality-rebuild-reports-china
          path: che168-verification-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify active generation and committed feed cursor
        if: steps.operation.outputs.mode == 'publication'
        run: node --import tsx scripts/catalog-verify-che168-publication.mjs
      - name: Audit published calculation coverage
        if: steps.operation.outputs.mode == 'publication'
        run: node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
      - name: Reconcile paid-feed status after successful verification
        if: steps.operation.outputs.mode == 'publication'
        env:
          CHE168_RECONCILE_OUTCOME: '1'
        run: node --import tsx scripts/catalog-verify-che168-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: che168-publication-verification
          path: |
            che168-publication-verification.json
            che168-source-download-verification.json
            catalog-visible-calculation-coverage.json
          retention-days: 14
