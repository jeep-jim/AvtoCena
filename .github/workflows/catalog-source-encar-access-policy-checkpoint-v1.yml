name: Catalog source qualification · Encar access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/encar-access-policy-v1-20260904
    paths:
      - ".github/workflows/catalog-source-encar-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-encar-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-encar-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Encar permitted-route decision
        run: node scripts/catalog-source-encar-access-policy-checkpoint-v1.mjs
      - name: Normalize roadmap EOF
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='roadmap.md'; fs.writeFileSync(p, `${fs.readFileSync(p,'utf8').replace(/\s*$/,'')}\n`);
          NODE
      - name: Verify safety and next step
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='encar_direct');
          const d=l.decisions.find(x=>x.sourceId==='encar_direct');
          if(!row||row.class!=='research_pending'||row.publishAllowed!==false)throw new Error('Encar registry invalid');
          if(row.permittedRouteCandidate!=='official_price_data_partnership_price@encar.com')throw new Error('Encar permitted route missing');
          if(!d||d.class!=='research_pending'||d.publishAllowed!==false||d.permittedRouteCandidate?.email!=='price@encar.com')throw new Error('Encar ledger invalid');
          const japan=r.candidates.filter(x=>x.market==='japan');
          if(!japan.length||japan.some(x=>x.qualificationPaused!==true))throw new Error('Japan pause missing');
          if(!/K Car Korea/i.test(r.next||''))throw new Error('K Car next missing');
          if(!m.includes('## 40.42 — Encar Korea: official data-partnership path exists; public automation permission is not proven'))throw new Error('roadmap 40.42 missing');
          if(r.candidates.some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Record Encar official data-partnership route"
          git push origin HEAD:chore/encar-access-policy-v1-20260904
