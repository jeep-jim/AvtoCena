name: One-shot dispatch Japan from Prestige 31441089365

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-dispatch-japan-from-prestige-31441089365.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated Japan cumulative recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-live-recovery-japan-from-prestige.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id=31441089365
