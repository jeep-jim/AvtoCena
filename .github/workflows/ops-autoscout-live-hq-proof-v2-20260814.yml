name: Ops · AutoScout live HQ proof v2 20260814

on:
  push:
    branches:
      - ops/autoscout-live-hq-proof-v2-20260814
    paths:
      - ".github/workflows/ops-autoscout-live-hq-proof-v2-20260814.yml"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download proven HQ artifact
        run: gh run download 31767749354 --repo jeep-jim/AvtoCena --name autoscout-live-hq-proof --dir hq-v1
      - name: Apply source-bound model identity and re-check all gates
        run: npx tsx scripts/ops-autoscout-hq-proof-v2.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-live-hq-proof-v2
          path: |
            autoscout-hq-v2-candidate.json
            autoscout-hq-v2-report.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
