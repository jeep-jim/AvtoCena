name: Catalog V3 · Europe · 10k
run-name: Catalog V3 · Europe · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

# Daily independent market refresh. Each successful run keeps recently seen
# offers and adds newly discovered unique offers.
permissions:
  contents: read

jobs:
  europe:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
    secrets: inherit
