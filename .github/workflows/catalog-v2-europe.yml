name: Catalog V3 · Europe · 10k
run-name: Catalog V3 · Europe · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/europe"

# Automatic scheduling lives only in catalog-v3-sequential-queue.yml.
permissions:
  contents: read

jobs:
  europe:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
      reset_cursor: ${{ github.event_name != 'schedule' }}
      priority_target: "500"
    secrets: inherit
