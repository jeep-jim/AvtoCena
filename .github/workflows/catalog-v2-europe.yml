name: Catalog V3 · Europe · 10k
run-name: Catalog V3 · Europe · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/europe"
  schedule:
    - cron: "17 0 * * *"

# Daily independent market refresh. Existing rows remain only inside the
# configured three-day window; expired and policy-rejected cards are removed.
permissions:
  contents: read

jobs:
  europe:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
    secrets: inherit
