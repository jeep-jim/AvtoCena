name: Catalog V2 · Europe
run-name: Catalog V2 · Europe · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-europe.yml

# Independent daily market. 12:05 Asia/Novokuznetsk (UTC+7).
permissions:
  contents: read

jobs:
  europe:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: europe
      display_name: Европа
    secrets: inherit
