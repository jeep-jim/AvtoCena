name: Catalog V3 · Europe · 10k
run-name: Catalog V3 · Europe · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "55 2 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-europe.yml

# Recovery marker: guarded-publication-2026-08-06.
permissions:
  contents: read

jobs:
  europe:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
    secrets: inherit
