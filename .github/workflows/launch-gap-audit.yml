name: Launch gap audit Korea and Japan
on:
  push:
    branches: [fix/launch-gap-audit-20260920, main]
    paths: [.github/workflows/launch-gap-audit.yml, scripts/catalog-launch-gap-audit.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      JSON_STORAGE_DRIVER: object
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node --import tsx scripts/catalog-launch-gap-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-gap-audit
          retention-days: 14
          path: |
            catalog-launch-gap-report.json
            korean-untranslated-corpus.json
            japan-sheet-gaps.json
