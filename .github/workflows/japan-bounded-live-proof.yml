name: Japan bounded live page and offer proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/japan-bounded-live-proof.yml'
      - 'scripts/catalog-next/japan-one-page-and-detail-verify.mjs'
permissions:
  contents: read
concurrency:
  group: japan-bounded-live-proof
  cancel-in-progress: true
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: node scripts/catalog-next/japan-one-page-and-detail-verify.mjs
