name: Patch catalog filter follow-up 20260812
on:
  push:
    branches: [ui/catalog-filter-followup-20260812]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/catalog-filter-followup-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply requested UI fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          filters_path = Path('apps/web/components/catalog/CatalogFilters.tsx')
          filters = filters_path.read_text()
          old_badge = '<span className="flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-black tracking-normal text-white">{chips.length}</span>'
          new_badge = '<span className="ac-filter-count-badge flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-black tracking-normal text-white" style={{ color: "#fff", WebkitTextFillColor: "#fff" }}>{chips.length}</span>'
          assert old_badge in filters, 'count badge anchor missing'
          filters = filters.replace(old_badge, new_badge, 1)

          old_range_header = '''    <div className="ac-range-fields-shell mt-2.5">\n      <div className="flex items-end justify-between gap-3"><div className="text-[10px] font-black uppercase tracking-[.13em] text-[var(--ac-muted)]">Диапазоны</div><div className="text-right text-[10px] font-bold text-[var(--ac-muted)]">Введите «от» и/или «до» — пустое поле не ограничивает выдачу</div></div>\n      <div className="mt-2 grid gap-3 md:grid-cols-2 xl:grid-cols-4">'''
          new_range_header = '''    <div className="ac-range-fields-shell mt-2.5">\n      <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-4">'''
          assert old_range_header in filters, 'range header anchor missing'
          filters = filters.replace(old_range_header, new_range_header, 1)

          css_anchor = '      .ac-filter-chip:hover{background:var(--ac-surface-3)}\n'
          css_insert = '      .ac-filter-chip:hover{background:var(--ac-surface-3)}\n      .ac-filter-count-badge{background:#ff353d!important;color:#fff!important;-webkit-text-fill-color:#fff!important}\n'
          assert css_anchor in filters, 'filter css anchor missing'
          filters = filters.replace(css_anchor, css_insert, 1)
          filters_path.write_text(filters)

          brand_path = Path('apps/web/components/catalog/CatalogBrandMultiSelect.tsx')
          brand = brand_path.read_text()
          old_join = '''function joinMakes(values: string[]) {\n  return [...new Set(values.map(clean).filter(Boolean))].join(",");\n}\n\n'''
          assert old_join in brand, 'joinMakes anchor missing'
          brand = brand.replace(old_join, '', 1)
          old_selected = '''  const selected = useMemo(() => splitMakes(value), [value]);\n  const selectedKeys = useMemo(() => new Set(selected.map((make) => make.toLocaleLowerCase("ru-RU"))), [selected]);'''
          new_selected = '''  const selected = useMemo(() => splitMakes(value), [value]);\n  const selectedKey = selected.length === 1 ? selected[0].toLocaleLowerCase("ru-RU") : "";'''
          assert old_selected in brand, 'selected keys anchor missing'
          brand = brand.replace(old_selected, new_selected, 1)
          old_toggle = '''  const toggle = (make: string) => {\n    const key = make.toLocaleLowerCase("ru-RU");\n    const next = selectedKeys.has(key)\n      ? selected.filter((item) => item.toLocaleLowerCase("ru-RU") !== key)\n      : [...selected, make];\n    onChange(joinMakes(next));\n  };'''
          new_toggle = '''  const choose = (make: string) => {\n    onChange(make);\n    setOpen(false);\n    setQuery("");\n  };'''
          assert old_toggle in brand, 'toggle anchor missing'
          brand = brand.replace(old_toggle, new_toggle, 1)
          brand = brand.replace('      : `Выбрано марок: ${selected.length}`;', '      : `Выбрано марок: ${selected.length}`;', 1)
          old_search = '''      <div className="mb-1.5 flex items-center gap-2">\n        <input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Найти марку" className="ac-filter-search h-10 min-w-0 flex-1 rounded-xl px-3 text-sm font-bold outline-none" />\n        {selected.length ? <button type="button" onClick={() => onChange("")} className="h-10 shrink-0 rounded-xl border border-red-500/35 px-3 text-[11px] font-black text-red-500">Очистить</button> : null}\n      </div>\n      <div className="ac-hide-scrollbar max-h-72 overflow-y-auto">'''
          new_search = '''      <div className="mb-1.5">\n        <input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Найти марку" className="ac-filter-search h-10 w-full rounded-xl px-3 text-sm font-bold outline-none" />\n      </div>\n      <div className="ac-hide-scrollbar max-h-72 overflow-y-auto">\n        {selected.length ? <button type="button" onClick={() => choose("")} className="ac-filter-option mb-1 flex min-h-10 w-full items-center justify-between rounded-xl px-3 py-2 text-left text-sm font-black"><span>Любая марка</span><span className="text-[var(--ac-muted)]">×</span></button> : null}'''
          assert old_search in brand, 'search/clear anchor missing'
          brand = brand.replace(old_search, new_search, 1)
          old_row = '''          const active = selectedKeys.has(option.value.toLocaleLowerCase("ru-RU"));\n          const modelCount = Number(stats.modelCounts[option.value] || 0);\n          return <button key={option.value} type="button" data-facet-value={option.value} onClick={() => toggle(option.value)} className={`ac-filter-option flex min-h-12 w-full items-center gap-2 rounded-xl px-2.5 py-1.5 text-left ${active ? "is-active" : ""}`} aria-pressed={active}>'''
          new_row = '''          const active = selectedKey === option.value.toLocaleLowerCase("ru-RU");\n          const modelCount = Number(stats.modelCounts[option.value] || 0);\n          return <button key={option.value} type="button" data-facet-value={option.value} onClick={() => choose(option.value)} className={`ac-filter-option flex min-h-12 w-full items-center gap-2 rounded-xl px-2.5 py-1.5 text-left ${active ? "is-active" : ""}`} aria-pressed={active}>'''
          assert old_row in brand, 'brand option row anchor missing'
          brand = brand.replace(old_row, new_row, 1)
          brand_path.write_text(brand)

          rail_path = Path('apps/web/components/catalog/BrandLogoRail.tsx')
          rail = rail_path.read_text()
          old_clear = 'className="min-h-10 rounded-xl border border-red-500/45 px-4 text-sm font-black text-red-500">Очистить</button>'
          new_clear = 'className="mr-7 min-h-10 rounded-xl border border-red-500/45 px-4 text-sm font-black text-red-500 md:mr-14">Очистить</button>'
          assert old_clear in rail, 'brand modal clear anchor missing'
          rail = rail.replace(old_clear, new_clear, 1)
          old_check = '<span className="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-red-500 text-[12px] font-black text-white" aria-label="Выбрано">✓</span>'
          new_check = '<span className="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-red-500 text-[12px] font-black text-white" style={{ color: "#fff", WebkitTextFillColor: "#fff" }} aria-label="Выбрано">✓</span>'
          assert old_check in rail, 'brand check anchor missing'
          rail = rail.replace(old_check, new_check, 1)
          rail_path.write_text(rail)

          globals_path = Path('apps/web/app/globals.css')
          globals_css = globals_path.read_text()
          contract = '''\n/* Filled red UI is a site-wide semantic contract: its text is always white. */\n:where([class~="bg-red-400"],[class~="bg-red-500"],[class~="bg-red-600"],[class~="bg-red-700"],[class~="bg-red-800"],[class~="bg-red-900"]) {\n  color: #fff !important;\n  -webkit-text-fill-color: #fff !important;\n}\n:where([class~="bg-red-400"],[class~="bg-red-500"],[class~="bg-red-600"],[class~="bg-red-700"],[class~="bg-red-800"],[class~="bg-red-900"]) :where(span,strong,small,p) {\n  color: #fff !important;\n  -webkit-text-fill-color: #fff !important;\n}\n'''
          if 'Filled red UI is a site-wide semantic contract' not in globals_css:
            globals_css += contract
          globals_path.write_text(globals_css)

          test_path = Path('tests/catalog-filter-brand-polish.test.ts')
          test = test_path.read_text()
          test = test.replace('// Final regression guards for the compact catalog filtering UI and its catalog-only brand multiselect.', '// Regression guards for the compact catalog filtering UI: single brand select above, multi-brand quick filter below.')
          old_test = '''test("catalog brand picker is a multiselect with logos and live compatible model counts", () => {\n  assert.match(filters, /CatalogBrandMultiSelect/);\n  assert.match(brandSelect, /BrandLogoVisual/);\n  assert.match(brandSelect, /modelCounts/);\n  assert.match(brandSelect, /Object\\.keys\\(stats\\.counts\\)/);\n  assert.match(brandSelect, /aria-pressed=\\{active\\}/);\n  assert.match(storage, /modelCounts/);\n});'''
          new_test = '''test("top brand picker selects exactly one brand while quick rail remains multi-select", () => {\n  assert.match(filters, /CatalogBrandMultiSelect/);\n  assert.match(brandSelect, /BrandLogoVisual/);\n  assert.match(brandSelect, /modelCounts/);\n  assert.match(brandSelect, /const choose = \\(make: string\\)/);\n  assert.match(brandSelect, /onChange\\(make\\)/);\n  assert.doesNotMatch(brandSelect, /const toggle =/);\n  assert.match(rail, /\\[\\.\\.\\.selectedBrands, brand\\]/);\n  assert.match(storage, /modelCounts/);\n});'''
          assert old_test in test, 'brand regression test anchor missing'
          test = test.replace(old_test, new_test, 1)
          test = test.replace('  assert.match(filters, /Выбрано[\\s\\S]*\\{chips\\.length\\}/);', '  assert.match(filters, /ac-filter-count-badge[\\s\\S]*text-white/);\n  assert.doesNotMatch(filters, />Диапазоны</);\n  assert.doesNotMatch(filters, /Введите «от»/);')
          test += '''\n\ntest("filled red UI contract forces white text and brand modal clear is separated from close", () => {\n  const globals = fs.readFileSync(new URL("../apps/web/app/globals.css", import.meta.url), "utf8");\n  assert.match(globals, /Filled red UI is a site-wide semantic contract/);\n  assert.match(globals, /bg-red-500/);\n  assert.match(globals, /-webkit-text-fill-color: #fff !important/);\n  assert.match(rail, /mr-7[\\s\\S]*md:mr-14[\\s\\S]*>Очистить<\\/button>/);\n});\n'''
          test_path.write_text(test)
          PY
      - name: Validate targeted UI contract
        run: |
          npx tsx --test tests/catalog-filter-brand-polish.test.ts
          npm -w apps/web run typecheck
          git diff --check
      - name: Commit patched branch
        run: |
          rm .github/workflows/patch-catalog-filter-followup-20260812.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/CatalogFilters.tsx apps/web/components/catalog/CatalogBrandMultiSelect.tsx apps/web/components/catalog/BrandLogoRail.tsx apps/web/app/globals.css tests/catalog-filter-brand-polish.test.ts .github/workflows/patch-catalog-filter-followup-20260812.yml
          git commit -m 'UI: correct brand filter roles and red contrast'
          git push origin HEAD:ui/catalog-filter-followup-20260812