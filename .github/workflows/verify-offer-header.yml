name: Verify offer header actions
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/components/catalog/OfferContactActions.tsx'
      - 'apps/web/components/dealers/DealerOfferView.tsx'
      - 'tests/browser/offer-header.mjs'
      - 'apps/web/lib/account/**'
      - 'apps/web/app/api/account/**'
      - 'apps/web/components/account/**'
      - '.github/workflows/verify-offer-header.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify account recovery and CRM account access
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/customer-auth-flow.test.ts tests/customer-telegram.test.ts tests/account-recovery-registration.test.ts tests/crm-registration-avatar.test.ts tests/crm-polling.test.ts tests/registered-customers.test.ts
      - run: npm install --prefix "$RUNNER_TEMP/header-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Verify dealer order and stock header in both themes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/header-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/offer-header.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-header-preview
          path: artifacts/offer-header/*.png
          if-no-files-found: ignore
