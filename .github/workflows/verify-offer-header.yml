name: Verify offer header actions
on:
  # Owner cost-control policy: run only on explicit manual request.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify account recovery and CRM account access
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/customer-auth-flow.test.ts tests/customer-telegram.test.ts tests/account-recovery-registration.test.ts tests/crm-registration-avatar.test.ts tests/crm-polling.test.ts tests/registered-customers.test.ts
      - run: npm install --prefix "$RUNNER_TEMP/header-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Verify dealer order and stock header in both themes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/header-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/offer-header.mjs
      - name: Verify the actual deployed dealer header
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/header-browser/node_modules/playwright/index.mjs
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/offer-header-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-header-preview
          path: |
            artifacts/offer-header/*.png
            artifacts/offer-header-live/*.png
          if-no-files-found: ignore
