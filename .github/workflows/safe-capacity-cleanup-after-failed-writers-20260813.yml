name: Safe capacity cleanup after failed writers 20260813
run-name: Reclaim unreachable catalog generations safely · ${{ github.sha }}

on:
  push:
    branches:
      - audit/catalog-integrity-after-failed-writers-20260813
    paths:
      - .github/workflows/safe-capacity-cleanup-after-failed-writers-20260813.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_FAILED_GENERATION_CLEANUP_REPORT: capacity-cleanup-20260813.json
  CATALOG_FAILED_GENERATION_MAX_DELETES: "300000"
  CATALOG_FAILED_GENERATION_KEEP: "2"
  YC_OBJECT_STORAGE_DELETE_CONCURRENCY: "16"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate cleanup implementation
        run: node --check scripts/catalog-clean-failed-generations.mjs
      - name: Reclaim only unreachable generations and orphan internal chunks
        run: npx tsx scripts/catalog-clean-failed-generations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-cleanup-20260813
          path: capacity-cleanup-20260813.json
          if-no-files-found: warn
          retention-days: 3
