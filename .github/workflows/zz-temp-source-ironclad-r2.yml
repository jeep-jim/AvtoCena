name: TEMP source allowlist ironclad r2

on:
  push:
    branches:
      - fix/strict-market-source-whitelist-20260825-r2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-market-source-whitelist-20260825-r2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ironclad source provenance gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}\n{old[:180]}")
              p.write_text(text.replace(old, new, 1))

          oq = "apps/web/lib/catalog/offer-quality.ts"
          replace_exact(
              oq,
              '''export function isCatalogMarketSourceAllowed(offer: Pick<VehicleOffer, "market" | "sourceId">) {\n  return isAllowedCatalogSourceId(offer.market, offer.sourceId);\n}\n''',
              '''export function isCatalogMarketSourceAllowed(offer: Pick<VehicleOffer, "market" | "sourceId">) {\n  return isAllowedCatalogSourceId(offer.market, offer.sourceId);\n}\n\nexport function hasAllowedCatalogSourceProvenance(offer: VehicleOffer) {\n  return isCatalogMarketSourceAllowed(offer)\n    && isAllowedCatalogSourceUrl(offer.market, offer.sourceId, offer.operational?.sourceUrl);\n}\n''',
          )
          replace_exact(
              oq,
              '''export function hasCredibleOfferContent(offer: VehicleOffer) {\n  return credibleCoreContent(offer)\n    && isAllowedCatalogSourceUrl(offer.market, offer.sourceId, offer.operational?.sourceUrl)\n    && mandatorySourcePhotoIdentityVerified(offer);\n}\n\nexport function isCrediblePublicOffer(offer: VehicleOffer) {\n  const compactProjection = Number((offer as any).cardProjectionVersion || 0) >= 1;\n  if (compactProjection) return offer.status === "active" && credibleCoreContent(offer, false, false);\n  return offer.status === "active" && credibleCoreContent(offer, true);\n}\n''',
              '''export function hasCredibleOfferContent(offer: VehicleOffer) {\n  return hasAllowedCatalogSourceProvenance(offer)\n    && credibleCoreContent(offer, false)\n    && mandatorySourcePhotoIdentityVerified(offer);\n}\n\nexport function isCrediblePublicOffer(offer: VehicleOffer) {\n  if (offer.status !== "active" || !hasAllowedCatalogSourceProvenance(offer)) return false;\n  const compactProjection = Number((offer as any).cardProjectionVersion || 0) >= 1;\n  if (compactProjection) return credibleCoreContent(offer, false, false);\n  return credibleCoreContent(offer, false);\n}\n''',
          )

          storage = "apps/web/lib/catalog/storage.ts"
          replace_exact(
              storage,
              '''import { hasCredibleOfferContent, isCatalogYearAllowed } from "./offer-quality";''',
              '''import { hasAllowedCatalogSourceProvenance, hasCredibleOfferContent, isCatalogYearAllowed } from "./offer-quality";''',
          )
          replace_exact(
              storage,
              '''  const publicOffers = nextOffers.filter((offer) => !exactPreserveMarkets.has(offer.market) && !protectedPublicIds.has(String(offer.id)) && isPublicOffer(offer));\n  for (const [market, rows] of Object.entries(preservedPublicOffersByMarket)) {\n    for (const offer of rows || []) {\n      if (!offer?.id || String(offer.market || "") !== market) throw new Error(`catalog_preserved_public_row_invalid:${market}:${String(offer?.id || "missing")}`);\n      publicOffers.push(offer);\n    }\n  }\n  for (const [market, rows] of Object.entries(appendPublicOffersByMarket)) {\n    for (const offer of rows || []) {\n      if (!offer?.id || String(offer.market || "") !== market) throw new Error(`catalog_append_public_row_invalid:${market}:${String(offer?.id || "missing")}`);\n      publicOffers.push(offer);\n    }\n  }\n''',
              '''  const publicOffers = nextOffers.filter((offer) => !exactPreserveMarkets.has(offer.market) && !protectedPublicIds.has(String(offer.id)) && isPublicOffer(offer));\n  for (const [market, rows] of Object.entries(preservedPublicOffersByMarket)) {\n    for (const offer of rows || []) {\n      if (!offer?.id || String(offer.market || "") !== market) throw new Error(`catalog_preserved_public_row_invalid:${market}:${String(offer?.id || "missing")}`);\n      // Preservation is byte-stable only for owner-approved provenance. Legacy\n      // rows from removed sites are deliberately purged instead of being carried\n      // into another immutable public generation.\n      if (!hasAllowedCatalogSourceProvenance(offer)) continue;\n      publicOffers.push(offer);\n    }\n  }\n  for (const [market, rows] of Object.entries(appendPublicOffersByMarket)) {\n    for (const offer of rows || []) {\n      if (!offer?.id || String(offer.market || "") !== market) throw new Error(`catalog_append_public_row_invalid:${market}:${String(offer?.id || "missing")}`);\n      if (!hasAllowedCatalogSourceProvenance(offer)) throw new Error(`catalog_append_public_source_forbidden:${market}:${String(offer?.sourceId || "missing")}:${String(offer?.id || "missing")}`);\n      publicOffers.push(offer);\n    }\n  }\n''',
          )
          replace_exact(
              storage,
              '''  await persistInternalCatalog(storage, generationId, nextOffers);''',
              '''  const sourceAllowedInternalOffers = nextOffers.filter(hasAllowedCatalogSourceProvenance);\n  await persistInternalCatalog(storage, generationId, sourceAllowedInternalOffers);''',
          )
          replace_exact(
              storage,
              '''  const protectedRows = storedOffers.filter((offer) => protectedPublicIds.has(String(offer.id)));\n  const mutableRows = storedOffers.filter((offer) => !protectedPublicIds.has(String(offer.id)));''',
              '''  const protectedRows = storedOffers.filter((offer) => protectedPublicIds.has(String(offer.id)) && hasAllowedCatalogSourceProvenance(offer));\n  const mutableRows = storedOffers.filter((offer) => !protectedPublicIds.has(String(offer.id)));''',
          )

          filt = "tests/catalog-filter-search.test.ts"
          replace_exact(
              filt,
              '''      firstSeenAt: now, updatedAt: now, operational: { sourceUrl: "https://www.encar.com/dc/dc_cardetailview.do?carid=FILTER" },''',
              '''      firstSeenAt: now, updatedAt: now, operational: { sourceUrl: "https://www.encar.com/dc/dc_cardetailview.do?carid=FILTER", photoIdentityVerified: true },''',
          )

          scale = "tests/catalog-source-scale.test.ts"
          replace_exact(
              scale,
              '''  assert.equal(isAllowedCatalogSourceUrl("china", "guazi_china_open", "https://en.guazi.com/products/test.html"), true);\n});''',
              '''  assert.equal(isAllowedCatalogSourceUrl("china", "guazi_china_open", "https://en.guazi.com/products/test.html"), true);\n  assert.match(offerQuality, /hasAllowedCatalogSourceProvenance/);\n  assert.match(offerQuality, /if \(offer\.status !== "active" \|\| !hasAllowedCatalogSourceProvenance\(offer\)\) return false/);\n  assert.match(storage, /sourceAllowedInternalOffers = nextOffers\.filter\(hasAllowedCatalogSourceProvenance\)/);\n  assert.match(storage, /catalog_append_public_source_forbidden/);\n  assert.match(storage, /protectedPublicIds\.has\(String\(offer\.id\)\) && hasAllowedCatalogSourceProvenance\(offer\)/);\n});''',
          )
          replace_exact(
              scale,
              '''  assert.match(offerQuality, /return offer\\.status === "active" && credibleCoreContent\\(offer, true\\)/);''',
              '''  assert.match(offerQuality, /if \\(offer\\.status !== "active" \\|\\| !hasAllowedCatalogSourceProvenance\\(offer\\)\\) return false/);\n  assert.match(offerQuality, /return credibleCoreContent\\(offer, false\\)/);''',
          )
          PY
      - name: Verify source allowlist gates
        run: |
          node --import tsx --test tests/catalog-source-scale.test.ts tests/catalog-probe-source-shard.test.ts tests/catalog-filter-search.test.ts tests/catalog-estimated-power-publication.test.ts tests/catalog-production-hardening.test.ts
      - name: Commit non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/offer-quality.ts apps/web/lib/catalog/storage.ts tests/catalog-filter-search.test.ts tests/catalog-source-scale.test.ts
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Harden source provenance at every catalog boundary"
          git push origin HEAD:fix/strict-market-source-whitelist-20260825-r2
