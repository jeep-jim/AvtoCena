name: Catalog · public identity and price audit
run-name: Full China names, routes and prices · ${{ github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Catalog · refresh current read models"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: catalog-public-identity-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_PUBLIC_IDENTITY_AUDIT_OUTPUT: catalog-public-identity-audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate audit and identity contracts
        run: |
          node --check scripts/catalog-audit-public-identity.mjs
          node --import tsx --test tests/catalog-display-identity.test.ts tests/catalog-brand-routing.test.ts
      - name: Audit every China name, every brand route and all stored prices
        run: npx tsx scripts/catalog-audit-public-identity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-public-identity-audit
          path: catalog-public-identity-audit.json
          if-no-files-found: error
          retention-days: 7
