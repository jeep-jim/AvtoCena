name: ProAuctions live import smoke
on:
  push:
    branches: [fix/proauctions-resume-batch-20260917]
    paths: ['.github/workflows/proauctions-live-import-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: proauctions-collection
          path: proauctions-collection
          run-id: 35252573605
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: japan-proauctions-results
          path: saved-proauctions
          run-id: 35105995247
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: fresh-japan-jptrade
          path: saved-jptrade
          run-id: 35167936226
          github-token: ${{ github.token }}
      - name: Resume the next three details and verify all concurrent worker positions
        env: {PROAUCTIONS_SECONDS: '600', PROAUCTIONS_MAX_DETAILS: '14'}
        run: node --import tsx scripts/collect-proauctions.mjs
      - run: node --import tsx scripts/prepare-proauctions-publication.mjs
      - name: Require an actual three-detail advance from the saved production checkpoint
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('proauctions-collection/offers/30198001.json'));
          const report=JSON.parse(fs.readFileSync('proauctions-collection/admission.json'));
          const summary=JSON.parse(fs.readFileSync('proauctions-collection/summary.json'));
          if(row.sourcePrice!==353000 || row.auctionResult!=='sold' || report.admitted<11 || summary.details!==14 || summary.pending!==1713)throw Error('live_resume_contract_failed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proauctions-collection
          path: proauctions-collection
          retention-days: 14
  publication-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_PUBLICATION_DRY_RUN: '1'
      CATALOG_REBUILD_MARKETS: japan
      CATALOG_REBUILD_INPUT_DIR: proauctions-ready
      CATALOG_REBUILD_PUBLISH_REPORT: proauctions-publication.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '8'
      CATALOG_PUBLISH_LOCK_WAIT_MS: '14400000'
      CATALOG_PUBLISH_LOCK_TTL_MS: '5400000'
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: '300000'
      NODE_OPTIONS: --max-old-space-size=11000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: proauctions-collection
          path: proauctions-collection
          run-id: 35252573605
          github-token: ${{ github.token }}
      - run: node --import tsx scripts/prepare-proauctions-publication.mjs
      - name: Read-only publication preview against the current Japan catalog
        run: node --import tsx scripts/catalog-publish-market.mjs
      - name: Require retained catalog and all eleven verified new lots
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('proauctions-publication.json'));
          if(!r.dryRun || r.published || !r.previousManifestPreserved || r.retained<1847 || r.canonical<1858 || r.lostRetained.length || r.freshOfferAudit.summary.admitted!==11)throw Error('retained_japan_preflight_failed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proauctions-publication-preflight
          path: proauctions-publication.json
          retention-days: 14
