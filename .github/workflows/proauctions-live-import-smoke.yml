name: ProAuctions live import smoke
on:
  push:
    branches: [fix/proauctions-resume-batch-20260917]
    paths: ['.github/workflows/proauctions-live-import-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: proauctions-collection
          path: proauctions-collection
          run-id: 35252573605
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: japan-proauctions-results
          path: saved-proauctions
          run-id: 35105995247
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: fresh-japan-jptrade
          path: saved-jptrade
          run-id: 35167936226
          github-token: ${{ github.token }}
      - name: Resume the next three details and verify all concurrent worker positions
        env: {PROAUCTIONS_SECONDS: '600', PROAUCTIONS_MAX_DETAILS: '14'}
        run: node --import tsx scripts/collect-proauctions.mjs
      - run: node --import tsx scripts/prepare-proauctions-publication.mjs
      - name: Require an actual three-detail advance from the saved production checkpoint
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('proauctions-collection/offers/30198001.json'));
          const report=JSON.parse(fs.readFileSync('proauctions-collection/admission.json'));
          const summary=JSON.parse(fs.readFileSync('proauctions-collection/summary.json'));
          if(row.sourcePrice!==353000 || row.auctionResult!=='sold' || report.admitted<11 || summary.details!==14 || summary.pending!==1713)throw Error('live_resume_contract_failed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proauctions-collection
          path: proauctions-collection
          retention-days: 14
