name: Final small UAE and Kyrgyzstan pass
run-name: Small strict UAE + Kyrgyzstan pass · ${{ github.sha }}

on:
  push:
    branches:
      - ops/final-uae-kg-small-20260816
    paths:
      - .github/workflows/final-small-uae-kg-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "4"
  RECOVERY_TARGET: "600"
  RECOVERY_MAX_PAGES: "80"
  RECOVERY_TIME_LIMIT_MS: "1800000"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate scripts and current seven-market baseline
        env:
          CATALOG_AUDIT_OUTPUT: small-uaekg-preflight.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":9759,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: |
          set -euo pipefail
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-uaekg-preflight
          path: small-uaekg-preflight.json
          retention-days: 3

  collect:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: uae
            source: dubizzle_uae_open
            mode: generic
          - market: uae
            source: dubicars_uae_exact
            mode: direct
          - market: kyrgyzstan
            source: mashina_kyrgyzstan_exact
            mode: generic
    env:
      RECOVERY_MARKET: ${{ matrix.market }}
      RECOVERY_DIRECT_MARKET: ${{ matrix.market }}
      RECOVERY_SOURCE_IDS: ${{ matrix.source }}
      RECOVERY_OUTPUT: shard-${{ matrix.market }}-${{ matrix.source }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect strict exact-bound shard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.mode }}" == "direct" ]]; then
            npx tsx scripts/catalog-live-recovery-direct-exact.mjs
          else
            npx tsx scripts/catalog-live-recovery-market.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.market }}-${{ matrix.source }}
          path: shard-${{ matrix.market }}-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3

  merge:
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: shard-input
          merge-multiple: true
      - name: Merge available strict shards
        shell: bash
        run: |
          set -euo pipefail
          merged=""
          for market in uae kyrgyzstan; do
            export RECOVERY_MERGE_MARKET="$market"
            export RECOVERY_MERGE_INPUT_DIR="shard-input"
            export RECOVERY_MERGE_OUTPUT="catalog-rebuild-$market.json"
            if node scripts/catalog-live-recovery-merge-shards.mjs; then merged="$merged $market"; fi
          done
          echo "merged=$merged" >> "$GITHUB_STEP_SUMMARY"
          test -n "$merged"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-uaekg-merged
          path: catalog-rebuild-*.json
          if-no-files-found: warn
          retention-days: 3

  publish-uae:
    needs: [validate, merge]
    if: always() && needs.validate.result == 'success' && needs.merge.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: small-uaekg-merged
          path: recovery-input
      - name: Publish UAE cumulatively
        env:
          RECOVERY_PUBLISH_MARKET: uae
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-uae.json
          RECOVERY_PUBLISH_REPORT: small-uae-publish.json
          RECOVERY_PUBLISH_MAX: "30000"
          CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit UAE and preserved markets
        if: always()
        env:
          CATALOG_AUDIT_OUTPUT: small-uae-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: uae
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":9759,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-uae-reports
          path: |
            small-uae-publish.json
            small-uae-audit.json
          if-no-files-found: warn
          retention-days: 3

  publish-kyrgyzstan:
    needs: [validate, merge, publish-uae]
    if: always() && needs.validate.result == 'success' && needs.merge.result == 'success' && needs.publish-uae.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: small-uaekg-merged
          path: recovery-input
      - name: Publish Kyrgyzstan cumulatively
        env:
          RECOVERY_PUBLISH_MARKET: kyrgyzstan
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-kyrgyzstan.json
          RECOVERY_PUBLISH_REPORT: small-kyrgyzstan-publish.json
          RECOVERY_PUBLISH_MAX: "30000"
          CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit Kyrgyzstan and preserved markets
        if: always()
        env:
          CATALOG_AUDIT_OUTPUT: small-kyrgyzstan-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: kyrgyzstan
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":9759,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-kyrgyzstan-reports
          path: |
            small-kyrgyzstan-publish.json
            small-kyrgyzstan-audit.json
          if-no-files-found: warn
          retention-days: 3
