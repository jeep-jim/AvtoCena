name: Verify published mobile catalog after hydration
on:
  push:
    branches: [verify/mobile-catalog-live-20260913]
    paths: ['.github/workflows/verify-mobile-catalog-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm published revision
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const response=await fetch('https://avtocena.com/api/health',{signal:AbortSignal.timeout(20000)});
          const data=await response.json();
          if(!data.ok||data.releaseSha!=='f85e2309dd7b2a47ff173c325379e7f20b5857f3')throw Error('Expected release not live');
          fs.mkdirSync('artifacts/mobile-filter-release',{recursive:true});
          fs.writeFileSync('artifacts/mobile-filter-release/health.json',JSON.stringify(data,null,2));
          JS
      - name: Wait for client-mounted filters before the first test click
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/mobile-filter-overlays.mjs')
          s=p.read_text()
          anchor='async function openSheet(page){'
          assert s.count(anchor)==1
          guard='''async function openSheet(page){
          // The tray marker is added by a client effect, not present in SSR HTML.
          // Do not click an SSR-only button before hydration owns its handler.
          if(live){
            await page.waitForFunction(()=>{
              const b=document.querySelector('.ac-filter-more-button');
              return b?.querySelector('.ac-filter-tray-main') && Object.keys(b).some(k=>k.startsWith('__reactProps$')&&typeof b[k]?.onClick==='function');
            },null,{timeout:60000});
            await page.evaluate(()=>document.fonts.ready);
          }
          '''
          p.write_text(s.replace(anchor,guard))
          PY
      - name: Browser dependency
        run: npm install --prefix "$RUNNER_TEMP/filter-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Existing full live geometry and selection assertions
        env:
          LIVE_ORIGIN: https://avtocena.com
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/filter-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/mobile-filter-overlays.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-filter-live-after-hydration
          path: artifacts/mobile-filter-*
          retention-days: 7
