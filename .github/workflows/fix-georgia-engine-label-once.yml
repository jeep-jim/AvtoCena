name: Validate AUTO.GE engine label

on:
  push:
    branches:
      - "fix/georgia-auto-ge-engine-label"
    paths:
      - ".github/workflows/fix-georgia-engine-label-once.yml"

permissions:
  contents: write

jobs:
  patch-and-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL: "20"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      RECOVERY_REQUEST_TIMEOUT_MS: "35000"
      RECOVERY_RETRY_ATTEMPTS: "3"
      RECOVERY_PREPARE_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic exact-label patch
        run: python .github/patches/fix-georgia-engine-label.py
      - name: Validate syntax and types
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo || true
      - name: Live AUTO.GE smoke without publishing
        env:
          RECOVERY_MARKET: georgia
          RECOVERY_SOURCE_IDS: auto_georgia_open
          RECOVERY_OUTPUT: georgia-live-smoke.json
          RECOVERY_TARGET: "3"
          RECOVERY_MAX_PAGES: "12"
          RECOVERY_TIME_LIMIT_MS: "900000"
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Require exact calculated progress
        run: node .github/patches/verify-georgia-live-smoke.mjs
      - name: Commit validated fix to branch
        run: |
          rm .github/workflows/fix-georgia-engine-label-once.yml
          rm .github/patches/fix-georgia-engine-label.py
          rm .github/patches/verify-georgia-live-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-live-recovery-market.mjs .github/workflows/fix-georgia-engine-label-once.yml .github/patches/fix-georgia-engine-label.py .github/patches/verify-georgia-live-smoke.mjs
          git commit -m "Parse exact AUTO.GE Engine labels for customs"
          git push origin HEAD:fix/georgia-auto-ge-engine-label
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-engine-label-live-smoke
          path: georgia-live-smoke.json
          if-no-files-found: warn
          retention-days: 3
