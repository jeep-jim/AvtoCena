name: Audit Georgia adapters on Yandex

on:
  push:
    branches:
      - audit/georgia-adapters-yandex-result-20260812
    paths:
      - .github/workflows/audit-georgia-adapters-yandex-result-20260812.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed adapter dry-run after exact MyAuto Yandex fingerprint
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 90 -fsS 'https://avtocena.com/api/internal/georgia-adapters-dryrun-6a91d7' -o /tmp/result.json
          cat /tmp/result.json | jq .
