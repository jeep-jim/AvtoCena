name: Diagnose Encar exact power fields

on:
  push:
    branches:
      - diag/encar-power-fields-20260810
    paths:
      - ".github/workflows/diag-encar-power-fields.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect exact Encar detail field names only
        shell: bash
        run: |
          cat > /tmp/probe.mjs <<'NODE'
          const ids = [
            '42316687', // Morning Urban 2023 combustion
            '42305406', // Tucson 1.6T 2021 combustion
            '42196711', // BMW 320i 2024 combustion
            '42057808', // Santa Fe HEV 2023
            '42477566', // EV6 2023
          ];
          const headers = {
            accept: 'application/json, text/plain, */*',
            'accept-language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7',
            origin: 'https://fem.encar.com',
            referer: 'https://fem.encar.com/',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36',
          };
          const interesting = /(power|horse|ps|kw|output|engine|displacement|fuel|motor|electric|hybrid|spec)/i;
          function walk(value, path = '', depth = 0, out = []) {
            if (depth > 10 || value == null) return out;
            if (Array.isArray(value)) {
              value.slice(0, 30).forEach((item, index) => walk(item, `${path}[${index}]`, depth + 1, out));
              return out;
            }
            if (typeof value !== 'object') return out;
            for (const [key, child] of Object.entries(value)) {
              const next = path ? `${path}.${key}` : key;
              if (interesting.test(key) && (typeof child === 'string' || typeof child === 'number' || typeof child === 'boolean' || child == null)) {
                out.push({ path: next, value: child });
              }
              if (typeof child === 'object' && child != null) walk(child, next, depth + 1, out);
            }
            return out;
          }
          for (const id of ids) {
            const response = await fetch(`https://api.encar.com/v1/readside/vehicle/${id}`, { headers });
            if (!response.ok) throw new Error(`detail_${id}_http_${response.status}`);
            const data = await response.json();
            const rows = walk(data).slice(0, 300);
            console.log(JSON.stringify({ id, fields: rows }, null, 2));
            await new Promise((resolve) => setTimeout(resolve, 1500));
          }
          NODE
          node /tmp/probe.mjs | tee encar-power-field-probe.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-power-field-probe
          path: encar-power-field-probe.jsonl
          if-no-files-found: warn
          retention-days: 2
