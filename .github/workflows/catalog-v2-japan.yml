name: Catalog V3 · Japan · 30k+ four times monthly
run-name: Catalog V3 · Japan · 30k+ four times monthly · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/japan"
  schedule:
    - cron: "17 5 1,8,15,22 * *"

# Japan is refreshed exactly four times per calendar month. Active/current rows
# and completed auction history may accumulate for 30 days. 30k is the target,
# not a publish floor: the crawl may publish a smaller complete run and may grow
# well beyond 30k when the sources expose more valid vehicles.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      reset_cursor: ${{ github.event_name != 'schedule' }}
      retention_ms: "2592000000"
      target_per_source: "100000"
      target_per_market: "30000"
      maximum_per_market: "100000"
    secrets: inherit
