name: Catalog V2 · Japan
run-name: Catalog V2 · Japan · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 20 * * *"

# Independent daily market. 03:05 Asia/Novokuznetsk (UTC+7).
# Only completed/sold auction results with positive final deal prices are publishable.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: japan
      display_name: Япония
    secrets: inherit
