name: Catalog V3 · Japan · 10k
run-name: Catalog V3 · Japan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "10 2 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-japan.yml

# Recovery marker: guarded-publication-2026-08-06.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
    secrets: inherit
