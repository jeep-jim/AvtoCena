name: Catalog V3 · Japan · 30k
run-name: Catalog V3 · Japan · 30k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/japan"

# Automatic scheduling lives only in catalog-v3-sequential-queue.yml so two
# markets never crawl at the same time. Japan retains 30 days and targets 30k.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      reset_cursor: ${{ github.event_name != 'schedule' }}
      retention_ms: "2592000000"
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
      priority_target: "24000"
    secrets: inherit
