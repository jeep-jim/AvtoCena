name: Catalog V3 · Japan · 10k
run-name: Catalog V3 · Japan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1,8,15,22 * *"

# Japan is refreshed four times per month. Auction rows use a longer retention
# window so daily refreshes of the other markets do not erase Japan between runs.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      retention_ms: "2592000000"
    secrets: inherit
