name: Catalog V2 · Japan
run-name: Catalog V2 · Japan · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 20 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-japan.yml

# Independent daily market. 03:05 Asia/Novokuznetsk (UTC+7).
# Japan probes completed auction results with final deal prices and publishes only sold lots with positive final prices.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: japan
      display_name: Япония
    secrets: inherit
