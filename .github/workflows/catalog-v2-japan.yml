name: Catalog V3 · Japan · 30k weekly
run-name: Catalog V3 · Japan · 30k weekly · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

# Japan is refreshed once a week and completed auction rows remain available
# for 30 days. Duplicate lots collapse by stable source identity.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      retention_ms: "2592000000"
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit
