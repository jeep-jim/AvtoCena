name: Catalog V3 · Japan · 10k
run-name: Catalog V3 · Japan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-japan.yml
      - .github/workflows/catalog-v3-market-10k-reusable.yml
      - scripts/catalog-publish-market.mjs
      - apps/web/lib/catalog/storage.ts
  schedule:
    - cron: "17 5,17 * * *"

# Japan is refreshed twice daily and completed auction rows remain available
# for six months. Every pass appends new unique lots without replacing history.
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      retention_ms: "15552000000"
    secrets: inherit
