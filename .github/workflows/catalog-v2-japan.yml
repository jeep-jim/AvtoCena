name: Catalog V2 · Japan
run-name: Catalog V2 · Japan · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-japan.yml
      - .github/workflows/catalog-v2-market-reusable.yml
      - apps/web/lib/catalog/catalog-v2-policy.ts
      - apps/web/lib/catalog/catalog-v2-source-registry.ts
      - scripts/catalog-probe-source-shard.mjs

# Japan rollout collects completed auction results with final deal prices.
# rollout-retry: 2026-08-03T02:57+07:00
permissions:
  contents: read

jobs:
  japan:
    uses: ./.github/workflows/catalog-v2-market-reusable.yml
    with:
      market: japan
      display_name: Япония
    secrets: inherit
