name: Fix PR360 CI once

on:
  push:
    branches:
      - audit/georgia-canonical-exact-routes-20260812
    paths:
      - .github/workflows/fix-pr360-ci-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-banned-georgia-scale-sources-20260812
          fetch-depth: 0
      - name: Patch remaining Georgia source-count assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/catalog-source-scale.test.ts')
          s = path.read_text()
          old = '  for (const market of PUBLIC_CATALOG_MARKETS) {\n    assert.ok((byMarket.get(market)?.size || 0) >= 3, `${market} must have at least three registered sources`);\n  }\n'
          new = '  for (const market of PUBLIC_CATALOG_MARKETS) {\n    const minimum = market === "georgia" ? 2 : 3;\n    assert.ok((byMarket.get(market)?.size || 0) >= minimum, `${market} must have at least ${minimum} registered sources`);\n  }\n'
          if old not in s:
              raise SystemExit('remaining source-count block not found')
          path.write_text(s.replace(old, new, 1))
          PY
      - name: Run focused tests
        run: |
          npm ci
          node --import tsx --test tests/catalog-source-scale.test.ts tests/georgia-canonical-source-policy-20260812.test.ts
      - name: Commit and push PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/catalog-source-scale.test.ts
          git diff --cached --check
          git commit -m 'test: allow canonical two-source Georgia registry'
          git push origin HEAD:fix/remove-banned-georgia-scale-sources-20260812
