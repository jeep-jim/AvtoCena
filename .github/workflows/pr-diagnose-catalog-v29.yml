name: Diagnose catalog v29 patch

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'automation/catalog-listing-first-v29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/catalog-listing-first-v29
          fetch-depth: 0
      - name: Capture patch error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr-apply-catalog-v29-final.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          Path('/tmp/patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n', encoding='utf-8')
          PY
          set +e
          python /tmp/patch.py > /tmp/patch-output.log 2>&1
          status=$?
          set -e
          git reset --hard HEAD
          cp /tmp/patch-output.log patch-v29-error.log
          printf '\nexit_status=%s\n' "$status" >> patch-v29-error.log
          rm -f .github/workflows/pr-diagnose-catalog-v29.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add patch-v29-error.log .github/workflows/pr-diagnose-catalog-v29.yml
          git commit -m "Диагностика патчера каталога v29"
          git push origin HEAD:automation/catalog-listing-first-v29
