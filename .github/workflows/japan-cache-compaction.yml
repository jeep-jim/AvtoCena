name: Compact expired Japan cache payloads with guarded conditional writes
on:
  push:
    branches: [main]
    paths: [.github/market-runs/japan-cache-compaction.json]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        description: Exact reviewed main controller SHA; continue an initialized operation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  compact:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: regcloud-staging
    env:
      EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify exact invocation and offline storage fences before credentials
        run: |
          set -euo pipefail
          node scripts/verify-frozen-speed-baselines.mjs
          node --check scripts/catalog-next/japan-cache-compaction-entry.mjs
          node --check scripts/catalog-next/japan-cache-compaction.mjs
          node scripts/catalog-next/japan-cache-compaction-entry.mjs --verify
          node --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/catalog-next-japan-cache-compaction.test.mjs tests/catalog-next-japan-cache-compaction-entry.test.mjs tests/catalog-next-japan-cache-compaction-workflow.test.mjs tests/readonly-marker-invocation.test.mjs
      - name: Compact only expired payloads after confirmed acceptance
        env:
          REGCLOUD_S3_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          REGCLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalog-next/japan-cache-compaction-entry.mjs --compact
      - name: Preserve only the sanitized compaction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-cache-compaction
          path: japan-cache-compaction-report.json
          if-no-files-found: ignore
          retention-days: 14
