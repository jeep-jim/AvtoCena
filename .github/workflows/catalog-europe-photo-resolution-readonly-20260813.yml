name: Europe photo resolution read-only audit 20260813
run-name: Read-only Europe photo resolution audit · ${{ github.sha }}

on:
  push:
    branches:
      - audit/catalog-capacity-readonly-20260813
    paths:
      - .github/workflows/catalog-europe-photo-resolution-readonly-20260813.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit current Europe image metadata and delivery URLs without writes
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const rows = await storage.readMarketOffers('europe');
          const sourceStats = new Map();
          const thumbnailRe = /(?:[?&](?:w|width|h|height|size)=\d{2,4}\b|\/(?:120|160|180|200|240|300|320|360|400|480|600)x(?:0|\d{2,4})(?:[_/.-]|$)|[_/-](?:120|160|180|200|240|300|320|360|400|480|600)x(?:0|\d{2,4})(?:[_/.-]|$)|(?:thumb|thumbnail|small|preview))/i;
          const hostOf = (value) => { try { return new URL(String(value||'')).hostname.toLowerCase(); } catch { return ''; } };
          const init = () => ({offers:0,images:0,offersBelow5:0,offersWithAnyUnknownDimensions:0,imagesUnknownDimensions:0,imagesUnknownBytes:0,imagesBelow640Wide:0,imagesBelow900Wide:0,imagesAtLeast1200Wide:0,imagesBelow28000Bytes:0,thumbnailPatternImages:0,hosts:{},samples:[]});
          for (const offer of rows) {
            const source = String(offer.sourceId||'unknown');
            const stat = sourceStats.get(source) || init();
            stat.offers++;
            const images = Array.isArray(offer.images) ? offer.images : [];
            if (images.length < 5) stat.offersBelow5++;
            if (images.some((image)=>!(Number(image?.width||0)>0 && Number(image?.height||0)>0))) stat.offersWithAnyUnknownDimensions++;
            for (const image of images) {
              stat.images++;
              const width = Number(image?.width||0), height = Number(image?.height||0), bytes = Number(image?.size||0);
              if (!(width>0 && height>0)) stat.imagesUnknownDimensions++;
              if (!(bytes>0)) stat.imagesUnknownBytes++;
              if (width>0 && width<640) stat.imagesBelow640Wide++;
              if (width>0 && width<900) stat.imagesBelow900Wide++;
              if (width>=1200) stat.imagesAtLeast1200Wide++;
              if (bytes>0 && bytes<28000) stat.imagesBelow28000Bytes++;
              const url = String(image?.url||'');
              if (thumbnailRe.test(url)) stat.thumbnailPatternImages++;
              const host = hostOf(url);
              if (host) stat.hosts[host] = Number(stat.hosts[host]||0)+1;
            }
            if (stat.samples.length < 12) stat.samples.push({
              id:offer.sourceOfferId, make:offer.make, model:offer.model, year:offer.year, sourceUrl:offer.operational?.sourceUrl,
              imageCount:images.length,
              firstImages:images.slice(0,3).map((image)=>({url:image.url,width:image.width||0,height:image.height||0,size:image.size||0})),
            });
            sourceStats.set(source, stat);
          }
          const bySource = Object.fromEntries([...sourceStats.entries()].sort((a,b)=>a[0].localeCompare(b[0])));
          const totals = [...sourceStats.values()].reduce((acc,s)=>{
            for (const key of ['offers','images','offersBelow5','offersWithAnyUnknownDimensions','imagesUnknownDimensions','imagesUnknownBytes','imagesBelow640Wide','imagesBelow900Wide','imagesAtLeast1200Wide','imagesBelow28000Bytes','thumbnailPatternImages']) acc[key]+=Number(s[key]||0);
            return acc;
          }, init());
          delete totals.hosts; delete totals.samples;
          const report={version:1,checkedAt:new Date().toISOString(),market:'europe',...totals,bySource};
          fs.writeFileSync('catalog-europe-photo-resolution-readonly.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if (!rows.length) throw new Error('europe_empty');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-europe-photo-resolution-readonly
          path: catalog-europe-photo-resolution-readonly.json
          if-no-files-found: warn
          retention-days: 3
