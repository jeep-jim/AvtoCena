name: Catalog market marker merge dispatch
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
    paths:
      - ".github/market-runs/*-refresh.json"
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pull = context.payload.pull_request;
            const mergedMarker = context.payload.action === 'closed' && pull.merged === true;
            const explicitRepeat = context.payload.action !== 'closed'
              && pull.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
              && pull.base.ref === 'main'
              && pull.title === 'ops: repeat current catalog marker';
            if (!mergedMarker && !explicitRepeat) {
              core.info('No trusted merged marker or explicit same-repository repeat request.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const allowed = new Set(['china', 'korea', 'uae', 'georgia', 'europe']);
            const markets = new Set();
            for (const file of files) {
              const match = file.filename.match(/^\.github\/market-runs\/(china|korea|uae|georgia|europe)-refresh\.json$/);
              if (match && allowed.has(match[1])) markets.add(match[1]);
            }
            const mergeSha = context.payload.pull_request.merge_commit_sha;
            for (const market of markets) {
              const workflow_id = `catalog-refresh-${market}.yml`;
              if (explicitRepeat) {
                const path = `.github/market-runs/${market}-refresh.json`;
                const [mainFile, headFile] = await Promise.all([
                  github.rest.repos.getContent({...context.repo, path, ref: 'main'}),
                  github.rest.repos.getContent({...context.repo, path, ref: pull.head.sha}),
                ]);
                const normalized = response => {
                  const marker = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
                  delete marker.operation;
                  return JSON.stringify(marker);
                };
                if (normalized(mainFile) !== normalized(headFile)) {
                  throw new Error(`${market}: explicit repeat may change only the operation nonce`);
                }
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  ref: 'main',
                });
                core.info(`${market}: explicitly repeated current main marker`);
                continue;
              }
              let pushRunExists = false;
              for (let attempt = 0; attempt < 6 && !pushRunExists; attempt += 1) {
                if (attempt) await new Promise(resolve => setTimeout(resolve, 5000));
                const existing = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  branch: 'main',
                  event: 'push',
                  per_page: 20,
                });
                pushRunExists = existing.data.workflow_runs.some(run => run.head_sha === mergeSha);
              }
              if (pushRunExists) {
                core.info(`${market}: push workflow already exists for ${mergeSha}`);
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main',
              });
              core.info(`${market}: dispatched after marker merge ${mergeSha}`);
            }
