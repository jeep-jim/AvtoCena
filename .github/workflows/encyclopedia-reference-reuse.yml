name: Encyclopedia — reuse saved exact specifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/encyclopedia-reference-reuse.json']
permissions:
  contents: read
concurrency:
  group: permanent-encyclopedia-research
  cancel-in-progress: false
jobs:
  reuse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact reuse and provenance guards
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/encyclopedia-reference-reuse.test.ts tests/encyclopedia-calculation-index.test.ts
      - name: Inspect or apply the reviewed existing-record plan
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/encyclopedia/reuse-saved-references.mjs
      - name: Preserve counts and revision verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-reference-reuse
          path: reports/encyclopedia-reference-reuse.json
          if-no-files-found: ignore
