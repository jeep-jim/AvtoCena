name: Regcloud — remove two reviewed orphan b5 images
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply the exact reviewed inventory plan
      expected_plan_sha256:
        type: string
        default: ''
        description: Exact reviewed plan hash; required for apply
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-b5-orphan-image-cleanup.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: regcloud-failed-encar-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact image and retained-container safeguards
        run: |
          python3 tests/regcloud-failed-encar-retention.test.py
          python3 tests/regcloud-b5-orphan-image-cleanup.test.py
      - name: Bind successful read-only inventory and prepare fixed cleanup code
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,urllib.request
          spec=importlib.util.spec_from_file_location('cleanup','scripts/regcloud-b5-orphan-image-cleanup.py')
          cleanup=importlib.util.module_from_spec(spec);spec.loader.exec_module(cleanup)
          assert cleanup.plan_digest(cleanup.APPROVED_PLAN)==cleanup.APPROVED_PLAN_SHA256
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME']=='push':
              marker=json.loads(pathlib.Path('.github/market-runs/regcloud-b5-orphan-image-cleanup.json').read_text())
              assert marker.get('inventoryRunId')==cleanup.APPROVED_PLAN['inventoryRunId']
              assert marker.get('inventorySource')==cleanup.APPROVED_PLAN['inventorySource']
              apply=marker.get('apply')
              assert isinstance(apply,bool)
              expected=marker.get('expectedPlanSha256','')
          else:
              inputs=event.get('inputs',{})
              assert inputs.get('apply','false') in ['false','true',False,True]
              apply=inputs.get('apply','false') in ['true',True]
              expected=inputs.get('expected_plan_sha256','')
          assert (apply and expected==cleanup.APPROVED_PLAN_SHA256) or (not apply and expected in ['',cleanup.APPROVED_PLAN_SHA256])
          url='https://api.github.com/repos/jeep-jim/AvtoCena/actions/runs/'+str(cleanup.APPROVED_PLAN['inventoryRunId'])
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'AvtoCena-Reviewed-Image-Cleanup'})
          with urllib.request.urlopen(req,timeout=30) as response:run=json.load(response)
          assert run['id']==cleanup.APPROVED_PLAN['inventoryRunId']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==cleanup.APPROVED_PLAN['inventorySource'] and run['head_branch']=='main'
          assert run['path']=='.github/workflows/regcloud-failed-encar-retention-inventory.yml'
          safe=pathlib.Path('scripts/regcloud-failed-encar-retention.py').read_text()
          assert hashlib.sha256(safe.encode()).hexdigest()==cleanup.SAFEGUARDS_SHA256
          source=pathlib.Path('scripts/regcloud-b5-orphan-image-cleanup.py').read_text()
          # Pass reviewed Python source through stdin; no remote temp files or env copies.
          bootstrap='import json,types,sys\n'
          bootstrap+='safe=types.ModuleType("retention_safeguards")\nexec(compile('+repr(safe)+',"retention_safeguards","exec"),safe.__dict__)\n'
          bootstrap+='cleanup=types.ModuleType("reviewed_orphan_cleanup")\nexec(compile('+repr(source)+',"reviewed_orphan_cleanup","exec"),cleanup.__dict__)\n'
          bootstrap+='try:\n cleanup.main(safe)\nexcept Exception as error:\n print(json.dumps({"event":"reviewed_b5_orphan_cleanup_refused","error":str(error) if isinstance(error,(cleanup.Refused,safe.GuardError)) else type(error).__name__}),flush=True)\n sys.exit(1)\n'
          compile(bootstrap,'reviewed_orphan_cleanup_bundle','exec')
          pathlib.Path(os.environ['RUNNER_TEMP'],'reviewed-orphan-cleanup.py').write_text(bootstrap)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('apply='+str(apply).lower()+'\nplan='+cleanup.APPROVED_PLAN_SHA256+'\n')
          print(json.dumps({'inventoryRunId':run['id'],'inventorySource':run['head_sha'],'apply':apply,'planSha256':cleanup.APPROVED_PLAN_SHA256,'orderedImages':[row['imageId'] for row in cleanup.APPROVED_PLAN['images']]}))
          PY
      - name: Recheck production and remove only reviewed unreferenced images if selected
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          APPLY: ${{ steps.plan.outputs.apply }}
          EXPECTED_PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file" "$RUNNER_TEMP/reviewed-orphan-cleanup.py"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          args=(python3 -)
          if [ "$APPLY" = true ]; then
            [[ "$EXPECTED_PLAN" =~ ^[a-f0-9]{64}$ ]]
            args+=(--apply --expected-plan-sha256 "$EXPECTED_PLAN")
          else
            test "$APPLY" = false
          fi
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 "${args[@]}" < "$RUNNER_TEMP/reviewed-orphan-cleanup.py" | tee reviewed-b5-orphan-cleanup.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-b5-orphan-cleanup
          path: reviewed-b5-orphan-cleanup.jsonl
          retention-days: 14
