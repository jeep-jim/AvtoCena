name: Inspect Japan usability failure history - read only
on:
  push:
    branches: [main]
    paths: [.github/workflows/japan-usability-failure-history-20261126.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: japan-usability-failure-history-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify standalone diagnostic syntax
        run: node --check scripts/catalog-next/japan-usability-failure-history-20261126.mjs
      - name: Read only the fixed failure object histories
        env:
          REGCLOUD_S3_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          REGCLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalog-next/japan-usability-failure-history-20261126.mjs --run | tee japan-usability-failure-history.json
      - name: Preserve sanitized incident evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-usability-failure-history
          path: japan-usability-failure-history.json
          if-no-files-found: ignore
          retention-days: 14
