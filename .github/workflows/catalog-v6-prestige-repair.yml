name: Catalog V6 · Prestige repair failed chunks

on:
  workflow_run:
    workflows:
      - "Catalog V6 · Prestige exact sold up-to-30k"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Prestige up-to-30k workflow run ID to repair"
        required: true
        default: "31247872502"

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-v6-prestige-repair
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      repair_count: ${{ steps.plan.outputs.repair_count }}
      source_chunk_count: ${{ steps.plan.outputs.source_chunk_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
      PRESTIGE_REPAIR_SOURCE_DIR: prestige-source-chunks
    steps:
      - uses: actions/checkout@v4
      - name: Download exact chunk artifacts from source run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          rm -rf "$PRESTIGE_REPAIR_SOURCE_DIR"
          mkdir -p "$PRESTIGE_REPAIR_SOURCE_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'prestige-japan-chunk-*' \
            --dir "$PRESTIGE_REPAIR_SOURCE_DIR"
          source_chunk_count="$(find "$PRESTIGE_REPAIR_SOURCE_DIR" -type f -name 'prestige-japan-chunk-*.json' | wc -l | tr -d ' ')"
          test "$source_chunk_count" -gt 0
          echo "Downloaded $source_chunk_count source chunk artifacts from run $SOURCE_RUN_ID"
      - id: plan
        name: Build repair matrix from exact missing ranges
        run: node scripts/prestige-japan-build-repair-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-source-chunks
          path: |
            prestige-source-chunks
            prestige-japan-repair-matrix.json
          if-no-files-found: error
          retention-days: 5

  repair:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PRESTIGE_CHUNK_ID: repair-${{ matrix.repairOf }}
      PRESTIGE_CHUNK_START_CURSOR: ${{ matrix.startCursor }}
      PRESTIGE_CHUNK_MAKE_INDEX: ${{ matrix.makeIndex }}
      PRESTIGE_CHUNK_MODEL_INDEX: ${{ matrix.modelIndex }}
      PRESTIGE_CHUNK_END_OFFSET: ${{ matrix.endOffset }}
      PRESTIGE_CHUNK_MAX_PAGES: ${{ matrix.maxPages }}
      PRESTIGE_CHUNK_OUTPUT: prestige-japan-repair-${{ matrix.repairOf }}.json
      PRESTIGE_JAPAN_DETAIL_CONCURRENCY: "2"
      PRESTIGE_CHUNK_RETRY_ATTEMPTS: "6"
      PRESTIGE_CHUNK_RETRY_BASE_MS: "5000"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "120000"
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ matrix.skip != true }}
        with:
          node-version: 24
          cache: npm
      - if: ${{ matrix.skip != true }}
        run: npm ci
      - name: Cool down source before exact repair
        if: ${{ matrix.skip != true }}
        run: sleep 30
      - name: Repair only the uncovered exact source range
        if: ${{ matrix.skip != true }}
        run: npx tsx scripts/prestige-japan-strict-chunk.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.skip != true }}
        with:
          name: prestige-japan-repair-${{ matrix.repairOf }}
          path: prestige-japan-repair-${{ matrix.repairOf }}.json
          if-no-files-found: warn
          retention-days: 5

  aggregate:
    needs: [prepare, repair]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRESTIGE_REPAIR_SOURCE_DIR: prestige-source-chunks
      PRESTIGE_REPAIR_RESULT_DIR: prestige-repair-chunks
      PRESTIGE_REPAIR_MERGE_OUTPUT: prestige-japan-exact-sold-repaired.json
      PRESTIGE_REPAIR_TARGET: "30000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prestige-source-chunks
          path: prestige-source-chunks
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: prestige-japan-repair-*
          path: prestige-repair-chunks
          merge-multiple: true
      - name: Merge original partials plus repaired exact ranges
        run: node scripts/prestige-japan-repair-merge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-japan-exact-sold-repaired
          path: prestige-japan-exact-sold-repaired.json
          if-no-files-found: warn
          retention-days: 5
