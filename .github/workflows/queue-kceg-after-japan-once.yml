name: Queue KCEG safely after Japan starts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/queue-kceg-after-japan-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  wait-and-dispatch:
    if: ${{ github.event.head_commit.message == 'Queue KCEG safely after Japan starts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait until Japan no longer occupies pending slot
        env:
          GH_TOKEN: ${{ github.token }}
          JAPAN_RUN_ID: "31324236121"
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 540); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$JAPAN_RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$JAPAN_RUN_ID" --jq '.conclusion // ""')"
            echo "Japan run $JAPAN_RUN_ID: status=$status conclusion=$conclusion"
            if [ "$status" = "in_progress" ] || [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for Japan pending slot to clear" >&2
          exit 1
      - name: Dispatch KCEG behind Japan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/catalog-live-daily-working-markets.yml/dispatches" -f ref=main
