name: Audit Japan cache retention without changing stored data
on:
  push:
    branches: [main]
    paths: [.github/market-runs/japan-cache-retention-audit.json]
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        description: Exact reviewed main controller SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: catalog-next-japan-cache-retention-verification
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: regcloud-staging
    env:
      EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify the exact invocation and offline storage fences before credentials
        run: |
          set -euo pipefail
          node scripts/verify-frozen-speed-baselines.mjs
          node --check scripts/catalog-next/japan-cache-retention-audit.mjs
          node scripts/catalog-next/japan-cache-retention-audit.mjs --verify-audit
          node --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/catalog-next-japan-cache-retention.test.mjs tests/catalog-next-japan-cache-retention-workflow.test.mjs tests/readonly-marker-invocation.test.mjs
      - name: Inspect only bounded Japan cache metadata and expiry samples
        env:
          REGCLOUD_S3_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          REGCLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalog-next/japan-cache-retention-audit.mjs --audit
      - name: Preserve only the sanitized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-cache-retention-audit
          path: japan-cache-retention-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
