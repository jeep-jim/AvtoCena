name: Verify catalog failure isolation
on:
  pull_request:
    paths:
      - 'apps/web/components/catalog/CatalogUnavailable.tsx'
      - 'apps/web/components/catalog/RetainedCatalogResults.tsx'
      - 'apps/web/components/catalog/CatalogSidebar.tsx'
      - 'apps/web/components/catalog/CatalogContent.tsx'
      - 'apps/web/components/catalog/AjesCatalog.tsx'
      - 'tests/browser/catalog-resilience*'
      - '.github/workflows/verify-catalog-resilience.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/resilience-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Fail and retry catalog without losing visible results
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/resilience-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/catalog-resilience.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-resilience
          path: artifacts/catalog-resilience
          retention-days: 7
