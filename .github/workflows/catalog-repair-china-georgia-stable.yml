name: Catalog repair · China + Georgia stable
run-name: Stable China + Georgia restore · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-repair-china-georgia-stable.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-repair-china-georgia-stable
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_MAX_MODELS_PER_MAKE: "10"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check scripts/catalog-live-recovery-publish-batch-stable.mjs
      - name: Download verified China recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-live-recovery-china
          path: recovery-input
          repository: ${{ github.repository }}
          run-id: 31261508825
          github-token: ${{ github.token }}
      - name: Download verified Georgia direct recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-direct-recovery-georgia
          path: recovery-input
          repository: ${{ github.repository }}
          run-id: 31264261523
          github-token: ${{ github.token }}
      - name: Preflight and atomically restore China and Georgia while preserving current Japan
        env:
          RECOVERY_BATCH_MARKETS: china,georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-china-georgia-stable-repair-report.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch-stable.mjs
      - name: Verify actual persisted counts and recovery baseline
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { PUBLIC_CATALOG_MARKETS } = await import('./apps/web/lib/catalog/runtime-config.ts');
          const report = JSON.parse(fs.readFileSync('catalog-china-georgia-stable-repair-report.json', 'utf8'));
          const actual = {};
          for (const market of PUBLIC_CATALOG_MARKETS) actual[market] = (await readMarketOffers(market)).length;
          const expected = { korea: 451, china: 819, japan: 78, uae: 82, europe: 350, georgia: 6, kyrgyzstan: 6 };
          const problems = [];
          for (const [market, count] of Object.entries(expected)) if (actual[market] !== count) problems.push(`${market}:${actual[market]}!=${count}`);
          for (const [market, count] of Object.entries(report.manifestCounts || {})) if (actual[market] !== Number(count)) problems.push(`manifest:${market}:${actual[market]}!=${count}`);
          console.log(JSON.stringify({ generationId: report.generationId, actual, expected, manifestCounts: report.manifestCounts, problems }, null, 2));
          if (problems.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-china-georgia-stable-repair-report
          path: catalog-china-georgia-stable-repair-report.json
          if-no-files-found: warn
          retention-days: 3
