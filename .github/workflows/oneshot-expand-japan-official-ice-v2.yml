name: One-shot expand Japan official ICE chassis v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-expand-japan-official-ice-v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add only exact manufacturer chassis rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/prestige-japan-official-chassis-enrich.mjs')
          s = p.read_text()
          anchor = 'const RULES = [\n'
          addition = (
              '  ["L235S", "DAIHATSU", "ESSE", 2011, 2011, 658, 10, 58, 43, "DBA-L235S", ["https://u-catch.daihatsu.co.jp/catalog/ESSE/GRADE__10061324/"]],\n'
              '  ["ZRT272W", "TOYOTA", "AVENSIS WAGON", 2011, 2016, 1986, 20, 152, 112, "DBA-ZRT272W", ["https://toyota.jp/ucar/catalog/brand-TOYOTA/car-AVEVSIS_WAGON/201109/10070440/", "https://toyota.jp/ucar/catalog/brand-TOYOTA/car-AVEVSIS_WAGON/201510/10099909/"]],\n'
          )
          if '"L235S", "DAIHATSU", "ESSE"' not in s:
              if anchor not in s:
                  raise SystemExit('RULES anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s)
          PY
      - name: Validate code
        run: |
          node --check scripts/prestige-japan-official-chassis-enrich.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Download repaired 3157 sold lots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "31338331776"
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o prestige.zip
          unzip -qo prestige.zip -d prestige-input
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_SOURCE=$source_file" >> "$GITHUB_ENV"
      - name: NO-PUBLISH exact enrichment and strict conversion
        shell: bash
        run: |
          set -euo pipefail
          PRESTIGE_OFFICIAL_INPUT="$PRESTIGE_SOURCE" PRESTIGE_OFFICIAL_OUTPUT=prestige-japan-v2-power.json node scripts/prestige-japan-official-chassis-enrich.mjs
          PRESTIGE_RECOVERY_INPUT=prestige-japan-v2-power.json PRESTIGE_RECOVERY_OUTPUT=catalog-rebuild-japan-v2-validation.json PRESTIGE_RECOVERY_TARGET=3000 PRESTIGE_RECOVERY_CONCURRENCY=12 npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const enriched = JSON.parse(fs.readFileSync('prestige-japan-v2-power.json','utf8'));
          const result = JSON.parse(fs.readFileSync('catalog-rebuild-japan-v2-validation.json','utf8'));
          const gained = Number(enriched?.report?.officialPowerEnrichment?.enriched || 0);
          const calculated = Number(result?.report?.calculatedCount || result?.report?.count || 0);
          const by = enriched?.report?.officialPowerEnrichment?.byChassis || {};
          const distinctModels = Number(result?.report?.distinctModels || 0);
          const documentedPowerCount = Number(result?.report?.documentedPowerCount || 0);
          console.log(JSON.stringify({gained, calculated, distinctModels, documentedPowerCount, byChassis: by, report: result.report}, null, 2));
          if (Number(by.L235S || 0) !== 32) throw new Error(`L235S_exact_match_regressed:${by.L235S || 0}`);
          if (Number(by.ZRT272W || 0) < 20) throw new Error(`ZRT272W_exact_match_regressed:${by.ZRT272W || 0}`);
          if (gained < 179) throw new Error(`japan_v2_enrichment_regressed:${gained}`);
          if (calculated < 138) throw new Error(`japan_v2_calculated_regressed:${calculated}`);
          if (distinctModels < 22) throw new Error(`japan_v2_model_diversity_regressed:${distinctModels}`);
          if (documentedPowerCount < 130) throw new Error(`japan_v2_documented_power_regressed:${documentedPowerCount}`);
          NODE
      - name: Commit only validated manufacturer rules
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prestige-japan-official-chassis-enrich.mjs
          git commit -m "Expand exact Japan manufacturer chassis power v2 [skip actions]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-official-ice-v2-validation
          path: |
            prestige-japan-v2-power.json
            catalog-rebuild-japan-v2-validation.json
          if-no-files-found: warn
          retention-days: 3
