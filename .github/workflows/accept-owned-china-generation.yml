name: Publish the verified owned China generation
on:
  workflow_run:
    workflows: [Prepare the saved China inventory for publication, Prepare and accept exact home UI catalog-0509]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/market-runs/accept-owned-china.json']
  workflow_dispatch:
    inputs:
      stage_run:
        description: Completed private China generation run
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: owned-china-public-switch
  cancel-in-progress: false
jobs:
  accept:
    if: >-
      github.repository_id == '1289722938' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == 1289722938 && (
          (github.event.workflow_run.path == '.github/workflows/stage-owned-china-generation.yml' &&
           (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_run')) ||
          (github.event.workflow_run.path == '.github/workflows/home-ui-activation.yml' &&
           github.event.workflow_run.id == 45134976110 && github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_sha == '347093f58180fdf2174222e1b6b40859b8219332')
        )
      ))
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    env:
      # This verified private stage completed while clients were still on the retained release.
      STAGE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/home-ui-activation.yml' && '45150223558' || github.event.workflow_run.id || inputs.stage_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0509e76cb02523157c98804c52edd7eb784916ba
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d7b193855b37aa83bf79a3afb38902ee2f20ba30
          path: writer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the selected previously verified stage
        if: github.event_name == 'push'
        working-directory: source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {verifyReadonlyInvocation} from './scripts/lib/readonly-marker-invocation.mjs';
          const markerPath='.github/market-runs/accept-owned-china.json';
          const {operation}=JSON.parse(fs.readFileSync(markerPath,'utf8'));
          const match=/^publish-owned-china-stage-([1-9][0-9]{0,19})$/.exec(operation);
          if(!match)throw Error('invalid stage run');
          verifyReadonlyInvocation({root:process.cwd(),markerPath,operation});
          fs.appendFileSync(process.env.GITHUB_ENV,'STAGE_RUN_ID='+match[1]+'\n');
          JS
      - uses: actions/download-artifact@v4
        with:
          name: owned-china-stage
          run-id: ${{ env.STAGE_RUN_ID }}
          github-token: ${{ github.token }}
          path: proof
      - name: Verify the conditional switch and same-owner rollback
        run: |
          set -euo pipefail
          git -C runtime fetch --no-tags --depth=1 origin 18e81af30cb9187b139924217a777de1c9819bca b4d226491bcfa03eca73d72480ff3bd867d3c6fb 05f289a875866be0be84800c8644dee5f38a1059 59f7e8fd0f7a6a9d8d2de545618962830c7866ea a05987cc725c950614ac7310c7de782b73cb093a
          test "$(git -C writer rev-parse HEAD)" = d7b193855b37aa83bf79a3afb38902ee2f20ba30
          git -C writer apply --include=apps/web/lib/data.ts "$GITHUB_WORKSPACE/source/.github/operations/china-rev5-own-cut-once/pinned-native-rev5-writer-overlay.patch"
          (cd source && npm ci --no-audit --no-fund)
          for tree in runtime writer; do
            if cmp -s source/package-lock.json "$tree/package-lock.json"; then
              ln -s "$GITHUB_WORKSPACE/source/node_modules" "$tree/node_modules"
            else
              (cd "$tree" && npm ci --no-audit --no-fund)
            fi
          done
          cd source
          node --test tests/owned-china-cut.test.mjs tests/owned-china-serving-runtime.test.mjs
      - name: Compare the candidate with the guest catalog and open the verified cut
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          AVTOCENA_CHINA_REGCLOUD_RUNTIME: '1'
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/accept-owned-china-market.mjs "$GITHUB_WORKSPACE/runtime" "$GITHUB_WORKSPACE/writer" "$GITHUB_WORKSPACE/proof/owned-china-stage.json"
