name: Catalog V3 · China · 10k
run-name: Catalog V3 · China · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

# Daily independent market refresh. Each successful run keeps recently seen
# offers and adds newly discovered unique offers.
permissions:
  contents: read

jobs:
  china:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: china
      display_name: Китай
    secrets: inherit
