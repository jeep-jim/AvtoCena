name: Catalog V3 · China · 10k
run-name: Catalog V3 · China · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-china.yml

# Recovery marker: guarded-publication-2026-08-06.
permissions:
  contents: read

jobs:
  china:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: china
      display_name: Китай
    secrets: inherit
