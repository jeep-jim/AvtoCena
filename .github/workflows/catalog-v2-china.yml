name: Catalog V2 · China
run-name: Catalog V2 · China · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 23 * * *"

# Independent daily market. 06:05 Asia/Novokuznetsk (UTC+7).
permissions:
  contents: read

jobs:
  china:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: china
      display_name: Китай
    secrets: inherit
