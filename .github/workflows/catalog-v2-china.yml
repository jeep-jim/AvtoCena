name: Catalog V3 · China · 10k
run-name: Catalog V3 · China · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/china"

# Automatic scheduling lives only in catalog-v3-sequential-queue.yml.
permissions:
  contents: read

jobs:
  china:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: china
      display_name: Китай
      reset_cursor: ${{ github.event_name != 'schedule' }}
      priority_target: "8000"
    secrets: inherit
