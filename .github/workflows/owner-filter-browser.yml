name: Verify owner budget filters in browsers once
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/owner-filter-browser.json']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify actual mobile and desktop filter changes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/filter-browser/node_modules/playwright/index.mjs
        run: |
          npm install --prefix "$RUNNER_TEMP/filter-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          CHROME_BIN=$(command -v google-chrome) node tests/browser/owner-filter-speed-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-filter-browser
          path: owner-filter-browser-report.json
