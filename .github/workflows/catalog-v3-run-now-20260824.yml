name: Catalog V3 · One-time all-market refresh 2026-08-24

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/catalog-v3-run-now-20260824.yml

permissions:
  contents: read

concurrency:
  group: catalog-v3-sequential-production
  cancel-in-progress: false

jobs:
  japan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      retention_ms: "2592000000"
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
      priority_target: "24000"
      reset_cursor: true
    secrets: inherit

