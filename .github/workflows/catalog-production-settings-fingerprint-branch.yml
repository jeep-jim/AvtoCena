name: Catalog settings fingerprint (read only)
on:
  push:
    branches: [feat/catalog-china-saved-evidence-v1-20260906]
    paths:
      - .github/workflows/catalog-production-settings-fingerprint-branch.yml
      - scripts/catalog-production-settings-fingerprint.mjs
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read two settings objects and print fingerprints
        run: node --import tsx scripts/catalog-production-settings-fingerprint.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-fingerprint
          path: settings-fingerprint.json
          retention-days: 14
