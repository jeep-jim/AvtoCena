name: Diagnose Korea brand facets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag-korea-brands-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: npm ci
      - name: Print Korea facets and live offer makes
        shell: bash
        run: |
          cat > diag-korea-brands.ts <<'TS'
          import { readCatalogFacets, readMarketOffers } from "./apps/web/lib/catalog/storage";
          import { isCrediblePublicOffer } from "./apps/web/lib/catalog/offer-quality";
          void (async () => {
            const facets = await readCatalogFacets({ market: "korea" });
            const rows = (await readMarketOffers("korea")).filter((offer:any) => offer.status === "active" && isCrediblePublicOffer(offer));
            const counts = new Map<string, number>();
            for (const row of rows as any[]) {
              const make = String(row.make || "").trim() || "<EMPTY>";
              counts.set(make, (counts.get(make) || 0) + 1);
            }
            console.log("FACETS_MAKES", JSON.stringify(facets.makes));
            console.log("LIVE_MAKE_COUNTS", JSON.stringify([...counts.entries()].sort((a,b)=>b[1]-a[1])));
            console.log("LIVE_TOTAL", rows.length);
          })();
          TS
          npx tsx diag-korea-brands.ts
