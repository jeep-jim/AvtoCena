name: One-shot loader straight stripes

on:
  push:
    branches:
      - fix/loader-straight-stripes-20260812

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/loader-straight-stripes-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Make loader straight, directional and softer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/components/layout/RoutePreloader.tsx')
          text = path.read_text()
          old = '''/* The route loader deliberately covers the complete 64px public header.
             The red/white diagonal sweep is readable in both themes and on mobile. */
          .ac-route-loader{
            height:64px!important;
            overflow:hidden!important;
            background:#111827!important;
            isolation:isolate!important;
          }
          .ac-route-loader__candy{
            position:absolute!important;
            inset:0!important;
            background:repeating-linear-gradient(125deg,#ff303b 0 17px,#ff303b 34px,#fff 34px,#fff 51px,#ff303b 51px,#ff303b 68px)!important;
            background-size:96px 96px!important;
            animation:ac-route-candy-sweep .72s linear infinite!important;
            box-shadow:inset 0 -1px 0 rgba(0,0,0,.32),0 8px 24px rgba(0,0,0,.18)!important;
          }
          .ac-route-loader__candy::after{
            content:"";
            position:absolute;
            inset:0;
            background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08));
          }
          .ac-route-loader__label{
            position:absolute!important;
            left:50%!important;
            top:50%!important;
            z-index:1!important;
            transform:translate(-50%,-50%)!important;
            max-width:calc(100vw - 32px)!important;
            white-space:nowrap!important;
            border:1px solid rgba(255,255,255,.42)!important;
            border-radius:999px!important;
            background:rgba(12,18,30,.78)!important;
            color:#fff!important;
            -webkit-text-fill-color:#fff!important;
            padding:7px 13px!important;
            font-size:12px!important;
            font-weight:900!important;
            line-height:1!important;
            letter-spacing:.04em!important;
            box-shadow:0 4px 14px rgba(0,0,0,.24)!important;
            backdrop-filter:blur(6px)!important;
            -webkit-backdrop-filter:blur(6px)!important;
          }
          @keyframes ac-route-candy-sweep{
            from{background-position:0 0}
            to{background-position:96px 0}
          }
          '''
          new = '''/* Route loading occupies exactly the same 64px as the public header.
             Use plain straight diagonal bands; the oversized stripe sheet moves only
             on the X axis, so the visual direction is unambiguously left to right. */
          .ac-route-loader{
            height:64px!important;
            min-height:64px!important;
            max-height:64px!important;
            overflow:hidden!important;
            background:rgba(15,23,42,.18)!important;
            isolation:isolate!important;
          }
          .ac-route-loader__candy{
            position:absolute!important;
            top:0!important;
            bottom:0!important;
            left:-64px!important;
            right:-64px!important;
            height:64px!important;
            background:repeating-linear-gradient(120deg,#ff353d 0 34px,#fff 34px 52px)!important;
            opacity:.72!important;
            animation:ac-route-candy-sweep .86s linear infinite!important;
            will-change:transform!important;
            box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)!important;
          }
          .ac-route-loader__candy::after{
            content:none!important;
          }
          .ac-route-loader__label{
            position:absolute!important;
            left:50%!important;
            top:50%!important;
            z-index:1!important;
            transform:translate(-50%,-50%)!important;
            max-width:calc(100vw - 32px)!important;
            white-space:nowrap!important;
            border:1px solid rgba(255,255,255,.30)!important;
            border-radius:999px!important;
            background:rgba(12,18,30,.66)!important;
            color:#fff!important;
            -webkit-text-fill-color:#fff!important;
            padding:7px 13px!important;
            font-size:12px!important;
            font-weight:900!important;
            line-height:1!important;
            letter-spacing:.04em!important;
            box-shadow:0 3px 10px rgba(0,0,0,.16)!important;
            backdrop-filter:blur(5px)!important;
            -webkit-backdrop-filter:blur(5px)!important;
          }
          @keyframes ac-route-candy-sweep{
            from{transform:translate3d(-60px,0,0)}
            to{transform:translate3d(0,0,0)}
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one loader css block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Loader regression assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('apps/web/components/layout/RoutePreloader.tsx','utf8');
          const must = [
            'height:64px!important',
            'min-height:64px!important',
            'max-height:64px!important',
            'repeating-linear-gradient(120deg,#ff353d 0 34px,#fff 34px 52px)',
            'opacity:.72!important',
            'from{transform:translate3d(-60px,0,0)}',
            'to{transform:translate3d(0,0,0)}',
            'content:none!important'
          ];
          for (const token of must) if (!s.includes(token)) throw new Error(`missing ${token}`);
          if (s.includes('background-size:96px 96px')) throw new Error('old lightning-like tile still present');
          NODE
      - name: Web typecheck
        run: npm --workspace apps/web run typecheck
      - name: Production build
        run: npm --workspace apps/web run build
      - name: Commit validated source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/layout/RoutePreloader.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'fix(ui): use straight softer moving loader stripes'
          git push origin HEAD:fix/loader-straight-stripes-20260812
