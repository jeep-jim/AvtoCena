name: Catalog V6 · Japan live read-only audit

on:
  push:
    branches: [main]
    paths:
      - .github/market-runs/japan-live-readonly-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit live Japan generation without writing
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-live-readonly-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: japan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "100"
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1,"china":1,"japan":8700,"uae":1,"europe":1,"georgia":1}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Smoke public Japan list and offer routes
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl -L --max-redirs 3 --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -fsS)
          payload="$("${CURL[@]}" 'https://avtocena.com/api/catalog/search?market=japan&pageSize=3')"
          total="$(jq -r '.total // .totalCount // .pagination.total // 0' <<<"$payload")"
          test "$total" -ge 8700
          mapfile -t ids < <(jq -r '.items[0:3][]?.id // empty' <<<"$payload")
          test "${#ids[@]}" -eq 3
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars?market=japan'
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars/autocatalog'
          for id in "${ids[@]}"; do
            "${CURL[@]}" -o /dev/null "https://avtocena.com/cars/offer/$id"
          done
          jq -n --argjson total "$total" --argjson ids "$(printf '%s\n' "${ids[@]}" | jq -R . | jq -s .)"             '{total:$total,sampleOfferIds:$ids}' > catalog-japan-live-route-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-japan-live-readonly-audit
          path: |
            catalog-japan-live-readonly-audit.json
            catalog-japan-live-route-smoke.json
          if-no-files-found: warn
          retention-days: 7
