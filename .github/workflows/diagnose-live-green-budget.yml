name: Diagnose live green budget
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-green-budget.yml', 'tests/browser/green-budget.mjs']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/green-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Reproduce live desktop and mobile controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/green-browser/node_modules/playwright/index.mjs
          LIVE_ORIGIN: https://avtocena.com
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/green-budget.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-budget-live-diagnostics
          path: artifacts/green-budget-live-*
