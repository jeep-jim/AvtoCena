name: Japan Allion single response shape
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/japan-single-response-shape.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - name: Bundle the exact source with a bounded shape-only wrapper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83ff17075e9188dcf227c8752dc064248d5f42e0
          cat > /tmp/japan-single-response-shape.ts <<'PROBE_SOURCE'
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {getJsonStorage} from './apps/web/lib/data';
          import {createAjesClient,AjesUnavailable} from './apps/web/lib/catalog/ajes-client';
          import {ajesPassword} from './apps/web/lib/catalog/ajes-settings';
          import {ajesEndpoint} from './apps/web/lib/catalog/ajes-routing';
          import {ajesQuery} from './apps/web/lib/catalog/ajes-query';
          import {assertCollectionEnabled,clearCollectionControlsCache} from './apps/web/lib/catalog/collection-controls';
          import {reserveAjesRequest} from './apps/web/lib/catalog/ajes-quota';
          
          const MAX_BYTES=2*1024*1024;
          const exactInput={table:'stats',make:'Toyota',model:'Allion',page:1,pageSize:24} as const;
          function textFlags(text:unknown,secret:string|undefined){
            const value=typeof text==='string'?text:'';
            return {present:typeof text==='string',shortBotOrBan:value.length<=512&&/^\s*(?:bot|ban)\d*(?:\s|$)/i.test(value),limitOrQuota:/\b(?:quota|limit(?:ed)?|too many requests|rate.?limit)\b/i.test(value),sqlSyntax:/sql\s*syntax|syntax\s*error|SQLSTATE|you have an error in your sql|mysql(?:i)?[ _]?(?:error|query)/i.test(value),accessRefusal:/\b(?:forbidden|banned|blocked|access denied|unauthorized)\b/i.test(value),credentialEcho:!!secret&&value.includes(secret),credentialError:/\b(?:invalid|wrong|expired|missing)\s+(?:api\s*)?(?:key|code|password|token)|\b(?:authentication|authorization)\s+(?:error|failed)/i.test(value),unknownColumn:/unknown\s+column|no such column/i.test(value),tableDoesNotExist:/table\b[\s\S]{0,96}does(?:n't| not)\s+exist|no such table/i.test(value),unsupportedQuery:/unsupported\s+(?:sql|query|statement)|(?:sql|query|statement)\s+(?:is\s+)?not\s+supported/i.test(value)};
          }
          function safeSupplierError(value:unknown,secret:string|undefined){
            if(typeof value!=='string')return null;
            let text=value;
            if(secret){
              const base64=Buffer.from(secret,'utf8').toString('base64');
              const variants=[secret,encodeURIComponent(secret),new URLSearchParams({v:secret}).toString().slice(2),base64,base64.replace(/=+$/,'')];
              for(const token of new Set(variants.filter(Boolean)))text=text.split(token).join('[credential]');
            }
            text=text.replace(/\bhttps?:\/\/[^\s<>"']+/gi,'[url]')
              .replace(/[A-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,'[email]')
              .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g,'[ip]')
              .replace(/\b(?:[a-f0-9]{0,4}:){2,7}[a-f0-9]{0,4}\b/gi,'[ip]')
              .replace(/[A-Za-z0-9_+\/-]{20,}={0,2}/g,'[token]')
              .replace(/[\p{Cc}\p{Cf}]/gu,' ')
              .replace(/\s+/g,' ').trim();
            return text.slice(0,256);
          }
          function jsonShape(text:string,secret:string|undefined){
            let value:any;let parsedRaw=false,parsedAfterBom=false;
            try{value=JSON.parse(text);parsedRaw=true;}catch{if(text.charCodeAt(0)===0xfeff)try{value=JSON.parse(text.slice(1));parsedAfterBom=true;}catch{}}
            const parsed=parsedRaw||parsedAfterBom;
