            const object=root==='object'?value:null,keys=object?Object.keys(object):[],numericKeys=keys.filter(key=>/^(?:0|[1-9]\d*)$/.test(key));
            const indices=numericKeys.map(Number).sort((a,b)=>a-b),numericValues=numericKeys.map(key=>object[key]);
            const first=numericKeys.length?object[String(indices[0])]:null;
            const has=(obj:any,key:string)=>!!obj&&typeof obj==='object'&&Object.prototype.hasOwnProperty.call(obj,key);
            return {parsedRaw,parsedAfterBom,root,arrayLength:Array.isArray(value)?value.length:null,badRowCount:Array.isArray(value)?value.filter(row=>!row||typeof row!=='object'||Array.isArray(row)).length:null,keyCount:object?keys.length:null,numericKeyCount:object?numericKeys.length:null,allNumericKeys:!!object&&keys.length>0&&numericKeys.length===keys.length,contiguousFromZero:indices.length>0&&indices.every((n,i)=>Number.isSafeInteger(n)&&n===i),contiguousFromOne:indices.length>0&&indices.every((n,i)=>Number.isSafeInteger(n)&&n===i+1),numericRowValuesObjects:numericValues.length>0&&numericValues.every(row=>!!row&&typeof row==='object'&&!Array.isArray(row)),numericValueArrayCount:numericValues.filter(Array.isArray).length,firstNumericValueFieldFlags:{ID:has(first,'ID'),MARKA_NAME:has(first,'MARKA_NAME'),MODEL_NAME:has(first,'MODEL_NAME')},hasError:has(object,'error'),hasMessage:has(object,'message'),hasData:has(object,'data'),hasResult:has(object,'result'),dataIsArray:Array.isArray(object?.data),resultIsArray:Array.isArray(object?.result),rootStringFlags:textFlags(typeof value==='string'?value:undefined,secret),errorFlags:textFlags(object?.error,secret),messageFlags:textFlags(object?.message,secret),safeSupplierError:safeSupplierError(object?.error,secret)};
          }
