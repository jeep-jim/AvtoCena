          node --check /tmp/japan-single-response-shape.cjs
      - name: Make one accounted Allion request from the genuine serving host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          chmod 600 "$key_file"
          timeout 130s ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'set -eu; release=$(docker inspect --format "{{ index .Config.Labels \"org.opencontainers.image.revision\" }}" avtocena-production); test "$release" = 83ff17075e9188dcf227c8752dc064248d5f42e0; server_ip=$(curl -4 -fsS --max-time 15 https://api.ipify.org); test "$server_ip" = 151.248.113.177; printf "JAPAN_DIAGNOSTIC_IDENTITY verified\n"; timeout 105s docker exec -i -e AJES_DIAG_IP="$server_ip" avtocena-production node' < /tmp/japan-single-response-shape.cjs
