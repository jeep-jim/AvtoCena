name: Catalog V6 · Prestige exact sold up-to-30k

on:
  workflow_dispatch:
  schedule:
    - cron: "40 19 * * *"
  push:
    paths:
      - ".github/workflows/catalog-v6-prestige-up-to-30k.yml"
      - "scripts/prestige-japan-strict-partition-plan.mjs"
      - "scripts/prestige-japan-strict-chunk.mjs"
      - "scripts/prestige-japan-strict-merge.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-v6-prestige-exact-sold-up-to-30k
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned_rows: ${{ steps.plan.outputs.planned_rows }}
      partition_count: ${{ steps.plan.outputs.partition_count }}
      complete: ${{ steps.plan.outputs.complete }}
    env:
      PRESTIGE_PLAN_CHUNK_PAGES: "60"
      PRESTIGE_PLAN_RAW_BUDGET: "100000"
      PRESTIGE_PLAN_MAX_PARTITIONS: "220"
      PRESTIGE_PLAN_MAX_MAKES: "30"
      PRESTIGE_PLAN_RAW_PER_MODEL: "200"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - id: plan
        name: Build round-robin partitions across all available models
        run: npx tsx scripts/prestige-japan-strict-partition-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prestige-japan-up-to-30k-plan
          path: prestige-japan-strict-partition-plan.json
          if-no-files-found: error
          retention-days: 5

  chunks:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      PRESTIGE_CHUNK_ID: ${{ matrix.id }}
      PRESTIGE_CHUNK_START_CURSOR: ${{ matrix.startCursor }}
      PRESTIGE_CHUNK_MAKE_INDEX: ${{ matrix.makeIndex }}
      PRESTIGE_CHUNK_MODEL_INDEX: ${{ matrix.modelIndex }}
      PRESTIGE_CHUNK_END_OFFSET: ${{ matrix.endOffset }}
      PRESTIGE_CHUNK_MAX_PAGES: ${{ matrix.maxPages }}
      PRESTIGE_CHUNK_OUTPUT: prestige-japan-chunk-${{ matrix.id }}.json
      PRESTIGE_JAPAN_DETAIL_CONCURRENCY: "2"
      PRESTIGE_CHUNK_RETRY_ATTEMPTS: "4"
      PRESTIGE_CHUNK_RETRY_BASE_MS: "1000"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact sold-result partition without publishing
        run: npx tsx scripts/prestige-japan-strict-chunk.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-japan-chunk-${{ matrix.id }}
          path: prestige-japan-chunk-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 5

  aggregate:
    needs: [plan, chunks]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRESTIGE_MERGE_INPUT_DIR: prestige-japan-chunks
      PRESTIGE_MERGE_OUTPUT: prestige-japan-exact-sold-up-to-30000.json
      PRESTIGE_MERGE_TARGET: "30000"
      PRESTIGE_EXPECTED_CHUNKS: ${{ needs.plan.outputs.partition_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: prestige-japan-chunk-*
          path: prestige-japan-chunks
          merge-multiple: true
      - name: Merge and deduplicate exact sold results up to 30k
        run: node scripts/prestige-japan-strict-merge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-japan-exact-sold-up-to-30000
          path: prestige-japan-exact-sold-up-to-30000.json
          if-no-files-found: warn
          retention-days: 5

  publish:
    needs: aggregate
    if: needs.aggregate.result == 'success'
    concurrency:
      group: catalog-publish-prestige-up-to-30k
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL: "100"
      CATALOG_OFFER_RETENTION_MS: "259200000"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: prestige-japan-exact-sold-up-to-30000
          path: prestige-live-input
      - name: Verify all seven markets before the single catalog write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-scale-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Enrich exact sold lots with documented chassis power
        env:
          PRESTIGE_OFFICIAL_INPUT: prestige-live-input/prestige-japan-exact-sold-up-to-30000.json
          PRESTIGE_OFFICIAL_OUTPUT: prestige-japan-exact-sold-official-power.json
        run: node scripts/prestige-japan-official-chassis-enrich.mjs
      - name: Calculate up to 30k exact or explicitly preliminary Japan cards
        env:
          PRESTIGE_RECOVERY_INPUT: prestige-japan-exact-sold-official-power.json
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "30000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Publish Japan cumulatively and preserve the other six markets
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-japan-scale-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Verify the published generation and every market year gate
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-scale-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: japan
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-japan-scale-publish-reports
          path: |
            catalog-japan-scale-preflight-audit.json
            prestige-japan-exact-sold-official-power.json
            catalog-rebuild-japan.json
            catalog-japan-scale-publish-report.json
            catalog-japan-scale-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
