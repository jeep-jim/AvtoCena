name: Catalog V6 · Prestige exact sold up-to-30k

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v6-prestige-up-to-30k.yml
  schedule:
    # The highest-demand auction market is collected twice every day. Sold-lot
    # history is append-only and retained for six months.
    - cron: "40 7,19 * * *"

permissions:
  contents: read

concurrency:
  group: catalog-v6-prestige-exact-sold-up-to-30k
  # A corrective push must stop an already-running collector before any stale
  # (<2015) artifact can reach the publish job.
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned_rows: ${{ steps.plan.outputs.planned_rows }}
      partition_count: ${{ steps.plan.outputs.partition_count }}
      complete: ${{ steps.plan.outputs.complete }}
    env:
      PRESTIGE_PLAN_CHUNK_PAGES: "60"
      PRESTIGE_PLAN_RAW_BUDGET: "18000"
      PRESTIGE_PLAN_MAX_PARTITIONS: "90"
      PRESTIGE_PLAN_MAX_MAKES: "30"
      PRESTIGE_PLAN_RAW_PER_MODEL: "200"
      PRESTIGE_PLAN_CONCURRENCY: "4"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Validate circular model-band planning
        run: node --import tsx --test tests/prestige-japan-partition-plan.test.ts
      - name: Rotate the bounded daily model band
        shell: bash
        run: |
          set -euo pipefail
          day_of_year=$(date -u +%j)
          start_model_index=$(( (10#$day_of_year % 40) * 3 ))
          echo "PRESTIGE_PLAN_START_MODEL_INDEX=$start_model_index" >> "$GITHUB_ENV"
          echo "Daily Japan model band starts at index $start_model_index" >> "$GITHUB_STEP_SUMMARY"
      - id: plan
        name: Build round-robin partitions across all available models
        run: npx tsx scripts/prestige-japan-strict-partition-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prestige-japan-up-to-30k-plan
          path: prestige-japan-strict-partition-plan.json
          if-no-files-found: error
          retention-days: 5

  chunks:
    needs: plan
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      PRESTIGE_CHUNK_ID: ${{ matrix.id }}
      PRESTIGE_CHUNK_START_CURSOR: ${{ matrix.startCursor }}
      PRESTIGE_CHUNK_MAKE_INDEX: ${{ matrix.makeIndex }}
      PRESTIGE_CHUNK_MODEL_INDEX: ${{ matrix.modelIndex }}
      PRESTIGE_CHUNK_END_OFFSET: ${{ matrix.endOffset }}
      PRESTIGE_CHUNK_MAX_PAGES: ${{ matrix.maxPages }}
      PRESTIGE_CHUNK_OUTPUT: prestige-japan-chunk-${{ matrix.id }}.json
      PRESTIGE_JAPAN_DETAIL_CONCURRENCY: "2"
      PRESTIGE_CHUNK_RETRY_ATTEMPTS: "4"
      PRESTIGE_CHUNK_RETRY_BASE_MS: "1000"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact sold-result partition without publishing
        # One isolated source timeout must not discard the other healthy
        # partitions. The aggregate still enforces 95% artifact coverage.
        continue-on-error: true
        run: npx tsx scripts/prestige-japan-strict-chunk.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-japan-chunk-${{ matrix.id }}
          path: prestige-japan-chunk-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 5

  aggregate:
    needs: [plan, chunks]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRESTIGE_MERGE_INPUT_DIR: prestige-japan-chunks
      PRESTIGE_MERGE_OUTPUT: prestige-japan-exact-sold-up-to-30000.json
      PRESTIGE_MERGE_TARGET: "30000"
      PRESTIGE_EXPECTED_CHUNKS: ${{ needs.plan.outputs.partition_count }}
      PRESTIGE_MIN_CHUNK_COVERAGE: "0.95"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: prestige-japan-chunk-*
          path: prestige-japan-chunks
          merge-multiple: true
      - name: Merge and deduplicate exact sold results up to 30k
        run: node scripts/prestige-japan-strict-merge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-japan-exact-sold-up-to-30000
          path: prestige-japan-exact-sold-up-to-30000.json
          if-no-files-found: warn
          retention-days: 5

  publish:
    needs: aggregate
    if: needs.aggregate.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
      CATALOG_OFFER_RETENTION_MS: "15552000000"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      RECOVERY_PUBLISH_MIN_PREVIOUS_RATIO: "0.90"
      CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: prestige-japan-exact-sold-up-to-30000
          path: prestige-live-input
      - name: Verify the six untouched markets before replacing Japan
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-scale-preflight-audit.json
          # Japan is the repair target. Requiring its desired post-publish floor
          # here deadlocks a recovery whenever the current public count is below
          # that floor. The unchanged six markets stay gated here; Japan keeps
          # the same 2,200-card floor in the post-persist audit below.
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":5000,"japan":0,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Enrich exact sold lots with documented chassis power when available
        shell: bash
        env:
          PRESTIGE_OFFICIAL_INPUT: prestige-live-input/prestige-japan-exact-sold-up-to-30000.json
          PRESTIGE_OFFICIAL_OUTPUT: prestige-japan-exact-sold-official-power.json
        run: |
          set +e
          node scripts/prestige-japan-official-chassis-enrich.mjs
          status=$?
          set -e
          test -s prestige-japan-exact-sold-official-power.json
          if [ "$status" -ne 0 ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('prestige-japan-exact-sold-official-power.json', 'utf8'));
          const offers = Array.isArray(payload?.offers) ? payload.offers : [];
          const enriched = Number(payload?.report?.officialPowerEnrichment?.enriched ?? -1);
          if (!offers.length || enriched !== 0) throw new Error(`official_power_enrichment_failed_with_invalid_passthrough: offers=${offers.length} enriched=${enriched}`);
          console.log(`No optional official chassis power match; continuing fail-closed with ${offers.length} unchanged offers.`);
          NODE
          fi
      - name: Calculate up to 30k exact or explicitly preliminary Japan cards
        env:
          PRESTIGE_RECOVERY_INPUT: prestige-japan-exact-sold-official-power.json
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "30000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Publish Japan cumulatively and preserve the other six markets
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-japan-scale-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Verify the published generation and every market year gate
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-scale-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":5000,"japan":2200,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-japan-scale-publish-reports
          path: |
            catalog-japan-scale-preflight-audit.json
            prestige-japan-exact-sold-official-power.json
            catalog-rebuild-japan.json
            catalog-japan-scale-publish-report.json
            catalog-japan-scale-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
