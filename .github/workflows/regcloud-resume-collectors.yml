name: Regcloud — restore required collectors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-resume-collectors.json']
permissions:
  contents: read
  actions: write
concurrency:
  group: regcloud-restore-collectors
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore only prior active required schedules with verified REG destinations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/regcloud-resume-collectors.py
