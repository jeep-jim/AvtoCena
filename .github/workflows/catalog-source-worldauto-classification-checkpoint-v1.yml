name: Catalog source qualification · WorldAuto classification checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/worldauto-detail-route-probe-v1-20260904
    paths:
      - ".github/workflows/catalog-source-worldauto-classification-checkpoint-v1.yml"
      - "scripts/catalog-source-worldauto-classification-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-worldauto-classification-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply WorldAuto lead-only decision and Japan pause
        run: node scripts/catalog-source-worldauto-classification-checkpoint-v1.mjs
      - name: Verify classification safety
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json', 'utf8'));
          const ledger = JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json', 'utf8'));
          const roadmap = fs.readFileSync('roadmap.md', 'utf8');
          const worldAuto = registry.candidates.find((row) => row.sourceId === 'worldauto_georgia_candidate');
          const decision = ledger.decisions.find((row) => row.sourceId === 'worldauto_georgia_candidate');
          if (!worldAuto || worldAuto.class !== 'lead_only' || worldAuto.publishAllowed !== false) throw new Error('WorldAuto registry decision invalid');
          if (!decision || decision.class !== 'lead_only' || decision.publishAllowed !== false) throw new Error('WorldAuto ledger decision invalid');
          if (!/Japan is paused by owner direction/i.test(registry.next || '')) throw new Error('Japan pause missing from registry next');
          if (!roadmap.includes('## 40.31 — WorldAuto Georgia: technical field contract proven, commercial reuse blocked; Japan paused')) throw new Error('roadmap 40.31 missing');
          if ((registry.candidates || []).some((row) => row.publishAllowed === true)) throw new Error('unexpected publishAllowed=true');
          if (registry.productionWrites !== false || ledger.productionWrites !== false || ledger.publishAllowedMutations !== false) throw new Error('safety flag changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
          git diff -- data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then
            echo "Checkpoint already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Classify WorldAuto lead-only and pause Japan qualification"
          git push origin HEAD:chore/worldauto-detail-route-probe-v1-20260904
