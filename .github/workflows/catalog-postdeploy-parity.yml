name: Catalog · post-deploy seven-market parity
run-name: Catalog post-deploy parity · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows:
      - "Deploy to Yandex Cloud"
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-postdeploy-parity-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_CURRENT_READMODEL_PARITY_OUTPUT: catalog-current-readmodel-parity.json

jobs:
  parity:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Require immutable manifest and current read-model parity
        run: node --import tsx scripts/catalog-audit-current-readmodel-parity.mjs

      - name: Require every live market to return at least one card
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl -L --max-redirs 3 --retry 4 --retry-delay 4 --retry-all-errors --max-time 30 -fsS)
          for market in korea china japan uae europe georgia kyrgyzstan; do
            catalog_json="$("${CURL[@]}" "https://avtocena.com/api/catalog/search?market=$market&pageSize=1")"
            jq -e '.total > 0 and (.items | length) > 0' <<<"$catalog_json" >/dev/null
            offer_id="$(jq -r '.items[0].id // empty' <<<"$catalog_json")"
            test -n "$offer_id"
            "${CURL[@]}" -o /dev/null "https://avtocena.com/cars?market=$market"
          done

      - name: Upload current read-model parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-current-readmodel-parity-${{ github.event.workflow_run.head_sha }}
          path: catalog-current-readmodel-parity.json
          if-no-files-found: warn
          retention-days: 7

      - name: Keep Yandex deploy status green only after seven-market parity
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          payload="$(jq -nc --arg url "$run_url" '{state:"success",context:"deploy/yandex",description:"Yandex live + all 7 catalog markets match manifest",target_url:$url}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/statuses/$DEPLOY_SHA" -d "$payload" >/dev/null

      - name: Mark Yandex deploy status failed on catalog parity error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          payload="$(jq -nc --arg url "$run_url" '{state:"failure",context:"deploy/yandex",description:"Yandex live but seven-market catalog parity failed",target_url:$url}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/statuses/$DEPLOY_SHA" -d "$payload" >/dev/null
