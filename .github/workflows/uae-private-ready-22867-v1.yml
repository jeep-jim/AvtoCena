name: Materialize exact UAE private READY
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/uae-private-ready-22867-v1.sha256']
permissions:
  contents: read
  actions: read
concurrency:
  group: uae-private-buyer-qualification-22867-v1
  cancel-in-progress: false
env:
  UAE_BUYER_OPS: .github/operations/uae-private-ready-22867-v1
jobs:
  materialize:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Materialize exact UAE private READY without activation'
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify sole pinned marker and exact prior completed UAE source and qualification stages
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker=.github/market-runs/uae-private-ready-22867-v1.sha256
          [[ "$BEFORE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $BEFORE"
          test "$(git show -s --format=%B HEAD)" = 'Materialize exact UAE private READY without activation'
          test "$(git diff --no-renames --name-status "$BEFORE" "$GITHUB_SHA" --)" = "$(printf 'A\t%s' "$marker")"
          printf '%s  %s\n' b8c256259df34018fc0a3bb80cffe8d45c2a675669700dc145aa753ac7914365 "$marker" | sha256sum --strict -c -
          sha256sum --strict -c "$marker"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/136724327745" | jq -e '(.id==136724327745 and .run_id==44864273301 and .conclusion=="success")' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/136738367831" | jq -e '(.id==136738367831 and .run_id==44868777867 and .conclusion=="success")' >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 22867cbcfaee27b2e8917b6bf880e44827f67b60
          path: .native-22867
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.1'}
      - name: Verify source scope and load exact native installed modules
        shell: bash
        run: |
          set -euo pipefail
          node --test "$UAE_BUYER_OPS/qualify.test.mjs" "$UAE_BUYER_OPS/ready.test.mjs"
          test "$(git -C .native-22867 rev-parse HEAD)" = 22867cbcfaee27b2e8917b6bf880e44827f67b60
          test "$(git -C .native-22867 rev-parse HEAD:apps/web/lib/catalog/prepare-seller-inventory.ts)" = e1b53ede554455a3be3314eba0e129c560205101
          test "$(git -C .native-22867 rev-parse HEAD:apps/web/lib/catalog/storage.ts)" = f402e951d56998efb75c7ac8cd1187ddc7726532
          mkdir -p ".native-22867/$UAE_BUYER_OPS"
          cp "$UAE_BUYER_OPS"/* ".native-22867/$UAE_BUYER_OPS/"
          cd .native-22867 && npm ci --ignore-scripts --no-audit --no-fund
      - name: Create empty private temporary directory only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          local_root="$(mktemp -d "$RUNNER_TEMP/uae-private-ready.XXXXXX")"
          printf 'UAE_BUYER_PRIVATE=%s\n' "$local_root" >> "$GITHUB_ENV"
      - name: Write only exact default-off private READY and verify its real persisted bytes
        working-directory: .native-22867
        shell: bash
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '8000'
          YC_OBJECT_STORAGE_MAX_ATTEMPTS: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: node --import tsx "$UAE_BUYER_OPS/run.mts" "$UAE_BUYER_PRIVATE"
