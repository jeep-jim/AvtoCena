name: Dry-run canonical stability repair 20260813
run-name: Dry-run all-market canonical repair · ${{ github.sha }}

on:
  push:
    branches:
      - audit/catalog-integrity-after-failed-writers-20260813
    paths:
      - .github/workflows/dryrun-canonical-stability-repair-20260813.yml

permissions:
  contents: read
  actions: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      DRYRUN_REVISION: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Project a canonical, age-safe, source-safe, post-enrichment 20-per-model generation
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const qualityModule = await import('./apps/web/lib/catalog/offer-quality.ts');
          const qualityApi = qualityModule.default || qualityModule;
          const knowledgeModule = await import('./apps/web/lib/catalog/vehicle-knowledge.ts');
          const knowledge = knowledgeModule.default || knowledgeModule;
          const normalizationModule = await import('./apps/web/lib/catalog/spec-normalization.ts');
          const normalization = normalizationModule.default || normalizationModule;
          const runtimeModule = await import('./apps/web/lib/catalog/runtime-config.ts');
          const runtime = runtimeModule.default || runtimeModule;

          const markets = [...runtime.PUBLIC_CATALOG_MARKETS];
          const allowedGeorgia = new Set(['myauto_georgia_list','myauto_georgia_exact','autopapa_georgia_open']);
          const MAX = 20;
          const preferredMaxRub = 8_000_000;
          const clean = (v) => String(v || '').replace(/\s+/g,' ').trim().toLocaleLowerCase('en-US');
          const keyOf = (o) => clean(o.make) && clean(o.model) ? `${clean(o.make)}|${clean(o.model)}` : '';
          const freshness = (o) => Date.parse(String(o?.operational?.sourcePublishedAt || o?.updatedAt || o?.firstSeenAt || '')) || 0;
          const rank = (a,b) => {
            const ap = Number(a.totalRub||0)>0 && Number(a.totalRub)<=preferredMaxRub ? 0 : 1;
            const bp = Number(b.totalRub||0)>0 && Number(b.totalRub)<=preferredMaxRub ? 0 : 1;
            return ap-bp || Number(b.year||0)-Number(a.year||0) || freshness(b)-freshness(a)
              || Number(b.images?.length||0)-Number(a.images?.length||0)
              || Number(a.totalRub||Number.MAX_SAFE_INTEGER)-Number(b.totalRub||Number.MAX_SAFE_INTEGER)
              || String(a.id||'').localeCompare(String(b.id||''));
          };
          function sourceUrl(o) { return String(o?.operational?.sourceUrl || o?.operational?.raw?.url || o?.operational?.raw?.detailUrl || ''); }
          function uaeSourceYear(o) {
            if (String(o?.sourceId||'') !== 'dubicars_uae_exact') return null;
            try {
              const u = new URL(sourceUrl(o));
              if (!/(^|\.)dubicars\.com$/i.test(u.hostname)) return null;
              const m = u.pathname.match(/^\/((?:19|20)\d{2})-[^/]*-\d{5,}\.html$/i);
              return m ? Number(m[1]) : null;
            } catch { return null; }
          }
          function sourceSafe(o) {
            if (o.market === 'georgia' && !allowedGeorgia.has(String(o.sourceId||''))) return false;
            if (o.market === 'uae') {
              const y = uaeSourceYear(o);
              if (y && (y < qualityApi.catalogMinYearForMarket('uae') || y !== Number(o.year||0))) return false;
            }
            return true;
          }
          async function canonicalize(o) {
            return normalization.normalizeVehicleOfferSpecs(await knowledge.enrichOfferWithVehicleKnowledge(structuredClone(o)));
          }
          function select(rows, market) {
            const candidates = rows.filter((o) => o.market === market && sourceSafe(o)
              && qualityApi.isCatalogYearAllowed(o.year, market)
              && qualityApi.hasCredibleOfferContent({...o,status:'active'}))
              .sort(rank);
            const counts = new Map();
            const selected = [];
            for (const o of candidates) {
              const k = keyOf(o);
              if (!k) continue;
              const n = Number(counts.get(k)||0);
              if (n >= MAX) continue;
              counts.set(k,n+1);
              selected.push(o);
            }
            return {selected, max: counts.size ? Math.max(...counts.values()) : 0, distinct: counts.size};
          }

          const report = {mode:'read_only_canonical_repair_projection', maxPerExactModel:MAX, markets:{}};
          const final = [];
          for (const market of markets) {
            const raw = await storage.readMarketOffers(market);
            const canonical = await Promise.all(raw.map(canonicalize));
            const first = select(canonical, market);
            const secondCanonical = await Promise.all(first.selected.map(canonicalize));
            const second = select(secondCanonical, market);
            const sourceCounts = Object.fromEntries([...new Set(second.selected.map(o=>String(o.sourceId||'')))].map(s=>[s,second.selected.filter(o=>String(o.sourceId||'')===s).length]));
            const uaeContradictions = market === 'uae' ? raw.filter(o=>{const y=uaeSourceYear(o);return y && (y<qualityApi.catalogMinYearForMarket('uae')||y!==Number(o.year||0));}).length : 0;
            report.markets[market] = {
              before: raw.length,
              afterFirstPass: first.selected.length,
              projected: second.selected.length,
              distinctModels: second.distinct,
              maxPerExactModel: second.max,
              belowMinYear: second.selected.filter(o=>!qualityApi.isCatalogYearAllowed(o.year,market)).length,
              belowFiveImages: second.selected.filter(o=>(o.images||[]).length<5).length,
              uaeContradictions,
              sourceCounts,
            };
            if (!second.selected.length) throw new Error(`projected_empty:${market}`);
            if (second.max > MAX) throw new Error(`model_cap:${market}:${second.max}`);
            if (report.markets[market].belowMinYear) throw new Error(`age_gate:${market}`);
            if (market === 'georgia' && Object.keys(sourceCounts).some(s=>!allowedGeorgia.has(s))) throw new Error(`georgia_source:${JSON.stringify(sourceCounts)}`);
            if (market === 'uae' && second.selected.some(o=>{const y=uaeSourceYear(o);return y && (y<qualityApi.catalogMinYearForMarket('uae')||y!==Number(o.year||0));})) throw new Error('uae_source_year_contradiction');
            final.push(...second.selected);
          }
          report.totalBefore = Object.values(report.markets).reduce((s,x)=>s+x.before,0);
          report.totalProjected = final.length;
          fs.writeFileSync('canonical-repair-dryrun.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-repair-dryrun
          path: canonical-repair-dryrun.json
          if-no-files-found: warn
          retention-days: 3