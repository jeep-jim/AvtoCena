name: Catalog source live probe · SBT Japan v1

on:
  push:
    branches:
      - feat/sbtjapan-japan-qualification-v1-20260904
    paths:
      - ".github/workflows/catalog-source-sbtjapan-japan-live-probe-v1.yml"
      - "scripts/catalog-source-sbtjapan-japan-qualification-v1.mjs"
      - "scripts/catalog-source-access-probe-v1.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-source-sbtjapan-japan-live-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Qualify SBT Japan read-only
        env:
          CATALOG_SOURCE_SBTJAPAN_JAPAN_TIMEOUT_MS: "20000"
          CATALOG_SOURCE_SBTJAPAN_JAPAN_MAX_BODY_BYTES: "1800000"
          CATALOG_SOURCE_SBTJAPAN_JAPAN_SAMPLE_COUNT: "4"
        run: node scripts/catalog-source-sbtjapan-japan-qualification-v1.mjs
      - name: Verify fail-closed no-write envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-sbtjapan-japan-qualification-v1.json', 'utf8'));
          for (const key of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) {
            if (p[key] !== false) throw new Error(`${key} must be false`);
          }
          if (p.sourcePublishAllowed !== false) throw new Error('sourcePublishAllowed must remain false');
          console.log(JSON.stringify({ sourceVerdict: p.sourceVerdict, summary: p.summary, list: p.list }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-sbtjapan-japan-live-probe-v1
          path: catalog-source-sbtjapan-japan-qualification-v1.json
          if-no-files-found: error
          retention-days: 7
