name: Verify accepted-speed release guards without deployment
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/owner-speed-guard-tests.json']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate staged controller syntax and fixed activation boundary
        run: |
          python3 -m pip install --quiet PyYAML==6.0.2
          python3 - <<'CHECK_CONTROLLER'
          import json,pathlib,re,subprocess,tempfile,yaml
          path=pathlib.Path('.github/workflows/owner-navigation-release.yml')
          workflow=yaml.safe_load(path.read_text())
          assert workflow['env']['RELEASE_SOURCE_SHA']=='3d01d708dc47fc9ff0465021110f940383e0369e'
          trigger=workflow.get('on',workflow.get(True))
          assert trigger=={'push':{'branches':['main'],'paths':['.github/market-runs/owner-navigation-release.json']}}
          assert workflow['permissions']=={'contents':'read','actions':'read'}
          assert workflow['concurrency']=={'group':'regcloud-production-release','cancel-in-progress':False}
          assert workflow['jobs']['prepare']['timeout-minutes']==150
          scripts=0;guards=0
          with tempfile.TemporaryDirectory() as temp:
              for job in workflow['jobs'].values():
                  for step in job['steps']:
                      script=step.get('run')
                      if not script:continue
                      subprocess.run(['bash','-n'],input=script,text=True,check=True)
                      scripts+=1
                      for match in re.finditer(r"<<'([A-Z_]+)'\n([\s\S]*?)^\1$",script,re.M):
                          label,body=match.groups()
                          if label=='SOURCE_GUARD':
                              compile(body,label,'exec');guards+=1
                              assert "api('pulls/1769')" in body and "1756" in body and all(str(number) in body for number in [1758,1759,1760,1762,1763,1754,1764,1766,1768])
                              assert "actions/runs/43255467223" in body and "a182cd21b21ecf612b63613d263e5bdd817ea4c0" in body
                          elif label=='REMOTE':
                              subprocess.run(['bash','-n'],input=body,text=True,check=True)
                          else:
                              file=pathlib.Path(temp)/(label+'.mjs');file.write_text(body)
                              subprocess.run(['node','--check',str(file)],check=True)
          assert guards==3 and scripts==27
          print(json.dumps({'stagedControllerValid':True,'source':'3d01d708dc47fc9ff0465021110f940383e0369e','shellBlocks':scripts,'exactSourceGuards':guards,'activation':'unchanged marker-only boundary'}))
          CHECK_CONTROLLER
      - name: Require immutable private release evidence despite optional mirrors
        run: node --test tests/release-evidence-durability.test.mjs
      - name: Check warm and expired server regression guards
        run: |
          node scripts/verify-frozen-speed-baselines.mjs
          node --test tests/release-speed-guard-contract.test.mjs
          python3 tests/regcloud-performance-gate.test.py
      - name: Reject slow visible cards and missing browser results
        run: node --test tests/accepted-browser-speed.test.mjs
      - name: Check bounded browser handshake identity and failures
        run: python3 tests/regcloud-browser-verdict.test.py
      - name: Exercise release handoff with simulated success, slowdown and missing browser output
        run: python3 tests/regcloud-browser-handoff.test.py
      - name: Keep the accepted rollback container and image during future cleanup
        run: python3 tests/regcloud-release-retention.test.py
      - name: Check release scripts and browser syntax
        run: |
          bash -n scripts/regcloud-deploy-production.sh scripts/regcloud-deploy-with-browser.sh
          node --check tests/browser/owner-filter-speed-live.mjs
          python3 tests/regcloud-response-buffers.test.py
