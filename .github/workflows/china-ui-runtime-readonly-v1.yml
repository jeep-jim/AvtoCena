# Exact single historical readback; imports are inert until the incident marker
# is changed under the exact reviewed main push below.
name: Reconcile exact China grid runtime
on:
  push:
    branches: [main]
    paths: [.github/market-runs/china-ui-runtime-readonly-v1.sha256]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Reconcile exact China grid runtime without changes'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact approved observation code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          readonly ops=.github/operations/china-ui-preflight-v1
          readonly marker=.github/market-runs/china-ui-runtime-readonly-v1.sha256
          readonly observer=0133abc89bf0df3bb6cd3967ad9be81004b098d357fbc975d7765c3d5ae63678
          readonly wrapper=c2046db680499285b6afe25c0c5b03652cc90652cbdb161f2c8829d3390c61f3
          cmp -s "$marker" <(printf '%s\n' "$observer")
          printf '%s  %s\n' "$observer" "$ops/preflight.py" "$wrapper" "$ops/read-via-ssh.sh" | sha256sum --check --status
      - name: Read runtime roles and headroom without any host mutations
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        shell: bash
        run: /usr/bin/bash .github/operations/china-ui-preflight-v1/read-via-ssh.sh
