name: Japan JPAuc · publish 100 verified cards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_REBUILD_MARKET: japan
      CATALOG_REBUILD_SOURCE_IDS: jpauc_japan_past_open
      CATALOG_REBUILD_TARGET_PER_MARKET: "100"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "100"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "30"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "1"
      CATALOG_REBUILD_TIME_LIMIT_MS: "1500000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "12"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_GALLERY_TIMEOUT_MS: "30000"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-japan-0.json
      CATALOG_KNOWLEDGE_DISABLED: "1"
      CATALOG_RAW_LISTING_MODE: "1"
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect JPAuc exact cards
        run: npx tsx scripts/catalog-simple-source-market.mjs
      - name: Validate 100 exact cards
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('catalog-rebuild-japan-0.json','utf8'));
          const rows=Array.isArray(p.offers)?p.offers:[];
          const invalid=rows.filter(o=>o.sourceId!=='jpauc_japan_past_open'||!o.sourceOfferId||!o.operational?.sourceUrl||Number(o.sourcePrice||0)<=0||o.sourceCurrency!=='JPY'||Number(o.year||0)<2011||(o.images||[]).length<3||(o.images||[]).some(i=>!/^https?:\/\//.test(String(i.url||''))));
          console.log(JSON.stringify({count:rows.length,invalid:invalid.length,report:p.report},null,2));
          if(rows.length<100||invalid.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: japan-jpauc-verified-100
          path: catalog-rebuild-japan-0.json
          retention-days: 3

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: catalog-raw-shared-manifest-publish
      cancel-in-progress: false
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_REBUILD_INPUT_DIR: japan-publish-input
      CATALOG_REBUILD_MARKETS: japan
      CATALOG_REBUILD_PUBLISH_REPORT: japan-jpauc-publish-report.json
      CATALOG_PUBLISH_MAX_PER_MARKET: "30000"
      CATALOG_OFFER_RETENTION_MS: "2592000000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: japan-jpauc-verified-100
          path: japan-publish-input
      - name: Publish Japan without replacing other markets
        run: npx tsx scripts/catalog-publish-raw-market.mjs
      - name: Verify Japan publication
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('japan-jpauc-publish-report.json','utf8'));
          console.log(JSON.stringify(p,null,2));
          if(!p.published||Number(p.byMarket?.japan||0)<100||p.publicationError) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-jpauc-publish-report
          path: japan-jpauc-publish-report.json
          if-no-files-found: warn
          retention-days: 3
