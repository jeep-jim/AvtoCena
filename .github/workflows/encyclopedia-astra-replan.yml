name: Encyclopedia — bulk technical facts from saved ASTRA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/encyclopedia-astra-replan.json']
permissions:
  contents: read
concurrency:
  group: permanent-encyclopedia-research
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/encyclopedia-astra-import.test.mjs tests/encyclopedia-spec-consensus.test.ts tests/encyclopedia-technical-match.test.ts
      - name: Reconcile all existing annual records without downloading or cloning trims
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          corpus=$(node -e 'const m=require("./.github/market-runs/encyclopedia-astra-replan.json");if(!/^[a-f0-9]{64}$/.test(m.corpusDigest))throw Error("invalid_corpus");process.stdout.write(m.corpusDigest)')
          node --import tsx scripts/encyclopedia/apply-astra-corpus.mjs --mode replan --corpus-digest "$corpus" --reports reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-technical-replan
          path: reports/astra-import-preview.json
          retention-days: 30
