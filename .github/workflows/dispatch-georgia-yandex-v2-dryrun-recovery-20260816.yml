name: Dispatch Georgia Yandex v2 dry-run after Yandex recovery

on:
  push:
    branches:
      - ops/avtocena-domain-recovery-20260816
    paths:
      - .github/workflows/dispatch-georgia-yandex-v2-dryrun-recovery-20260816.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm there is no active catalog writer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100")"
          bad="$(jq -r '[.workflow_runs[] | select((.name | ascii_downcase | test("catalog|recovery|publish|writer")) and (.name | test("Georgia Yandex v2") | not))] | length' <<<"$payload")"
          if [[ "$bad" != "0" ]]; then
            jq -r '.workflow_runs[] | [.id,.name,.status] | @tsv' <<<"$payload"
            echo "active catalog-capable workflow detected" >&2
            exit 1
          fi

      - name: Dispatch read-only Georgia recovery v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-live-recovery-georgia-yandex-v2.yml/dispatches" \
            -d '{"ref":"main","inputs":{"apply":"false"}}'
