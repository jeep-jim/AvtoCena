name: TEMP homepage priced showcase selfpatch

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-selfpatch-home-priced-showcase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Prefer safe priced cards on homepage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/lib/catalog/storage.ts')
          s=p.read_text()
          anchor='export async function readHomeCatalogSnapshot(perMarket = 6) {'
          helper='''function selectHomepageShowcase(rows: CatalogSearchProjection[], limit: number) {\n  // The homepage is a sales showcase, not a diagnostics queue. Prefer rows whose\n  // compact public projection already contains a validated delivered RUB total.\n  // Unpriced/pending inventory remains available in the catalog and may fill a\n  // showcase only when a market genuinely has fewer than `limit` priced rows.\n  const priced = rows.filter((row) => Number(row.totalRub || 0) > 0);\n  const pricedSelection = selectCatalogShowcaseDiversity(priced, limit);\n  if (pricedSelection.length >= limit) return pricedSelection;\n  const selectedIds = new Set(pricedSelection.map((row) => row.id));\n  const pending = rows.filter((row) => Number(row.totalRub || 0) <= 0 && !selectedIds.has(row.id));\n  return [...pricedSelection, ...selectCatalogShowcaseDiversity(pending, limit - pricedSelection.length)].slice(0, limit);\n}\n\n'''
          if helper not in s:
              if anchor not in s: raise SystemExit('readHomeCatalogSnapshot anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          old='return selectCatalogShowcaseDiversity(rows, limit).map(publicOfferFromProjection);'
          new='return selectHomepageShowcase(rows, limit).map(publicOfferFromProjection);'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('fast homepage showcase call missing')
          old2='const diverse = selectCatalogShowcaseDiversity(candidates, limit);'
          new2='const diverse = selectHomepageShowcase(candidates, limit);'
          if old2 in s: s=s.replace(old2,new2,1)
          elif new2 not in s: raise SystemExit('fallback homepage showcase call missing')
          p.write_text(s)
          PY
          cat > tests/home-showcase-priced-first.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const storage = fs.readFileSync(new URL("../apps/web/lib/catalog/storage.ts", import.meta.url), "utf8");
          const card = fs.readFileSync(new URL("../apps/web/components/catalog/CatalogCard.tsx", import.meta.url), "utf8");

          test("homepage prefers safe delivered-price projections before pending inventory", () => {
            assert.match(storage, /function selectHomepageShowcase\(rows: CatalogSearchProjection\[\], limit: number\)/);
            assert.match(storage, /const priced = rows\.filter\(\(row\) => Number\(row\.totalRub \|\| 0\) > 0\)/);
            assert.match(storage, /const pending = rows\.filter\(\(row\) => Number\(row\.totalRub \|\| 0\) <= 0/);
            assert.match(storage, /return selectHomepageShowcase\(rows, limit\)\.map\(publicOfferFromProjection\)/);
            assert.match(storage, /const diverse = selectHomepageShowcase\(candidates, limit\)/);
          });

          test("pending inventory still fails closed instead of inventing a customer price", () => {
            assert.match(card, /const visibleRub = catalogOfferVisibleRub\(offer\)/);
            assert.match(card, /visibleRub > 0 \? formatRub\(visibleRub\) : "Цена по запросу"/);
          });
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/storage.ts tests/home-showcase-priced-first.test.ts
          git diff --cached --check
          git commit -m 'Prefer priced inventory in homepage showcase'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
