name: One-shot roadmap append · Good Car 40.27

on:
  push:
    branches:
      - feat/chngoodcar-exact-adapter-v1-20260903
    paths:
      - ".github/workflows/roadmap-append-chngoodcar-40-27.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chngoodcar-exact-adapter-v1-20260903
      - name: Append checkpoint without rewriting prior roadmap history
        env:
          ROADMAP_BLOCK_B64: "轿车/SUV/MPV/两厢车/三厢车/旅行车/跑车`);    bmdvb2RjYXJfY2hpbmFfY2FuZGlkYXRlYCDQsiBwcm9kdWN0aW9uIHNvdXJjZSByZWdpc3RyeS4K"
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('roadmap.md')
          text = path.read_text(encoding='utf-8')
          marker = '### 40.27. Guangdong Good Car: exact passenger ICE adapter только в no-write режиме'
          if marker in text:
              print('40.27 already present; no-op')
          else:
              block = base64.b64decode(os.environ['ROADMAP_BLOCK_B64']).decode('utf-8')
              path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
              print('appended roadmap 40.27')
          PY
      - name: Commit roadmap checkpoint
        shell: bash
        run: |
          if git diff --quiet -- roadmap.md; then
            echo "No roadmap change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap.md
          git commit -m "docs(roadmap): record Good Car exact adapter checkpoint"
          git push origin HEAD:feat/chngoodcar-exact-adapter-v1-20260903
