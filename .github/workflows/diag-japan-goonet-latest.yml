name: Diagnose Japan Goo-net rerun

on:
  pull_request:
    paths:
      - '.github/workflows/diag-japan-goonet-latest.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find target Japan run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8f3a7e44acb6e7ea66f7bd8e822f69155d84e318
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-v2-japan.yml/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.head_sha == env.TARGET_SHA) | {id,run_number,status,conclusion,event,head_sha,created_at,updated_at,html_url}'

      - name: Probe exact numeric Goo-net gallery frames
        env:
          PAGE: https://www.goo-net-exchange.com/usedcars/HONDA/FIT/402026080500704382002/
          PREFIX: https://picture1.goo-net.com/4020260805/00704382/J/402026080500704382002
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          status=$(curl -L -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36' -sS -o "$tmp" -w '%{http_code}' "$PAGE")
          echo "page_status=$status bytes=$(wc -c < "$tmp")"
          echo '--- exact-page alphanumeric J family sample ---'
          grep -Eo 'https?://[^"'"'"'<> ]+\.(jpg|jpeg|png|webp)(\?[^"'"'"'<> ]*)?' "$tmp" | sed 's/&amp;/\&/g' | grep -E '/J/[A-Za-z0-9]+[0-9]{2}\.(jpg|jpeg|png|webp)' | sort -u | head -12 || true
          echo '--- synthetic 21-digit numeric frame probe ---'
          for frame in 00 01 02 03 04 05 10 20 29; do
            url="${PREFIX}${frame}.jpg"
            curl -L -A 'Mozilla/5.0' -sS -o /tmp/goonet-frame.bin -w "frame=${frame} status=%{http_code} type=%{content_type} bytes=%{size_download} effective=%{url_effective}\n" "$url" || true
          done
