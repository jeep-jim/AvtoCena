name: Diagnostic public image quality

on:
  push:
    branches: [diag/catalog-image-quality-20260810]
    paths:
      - .github/workflows/diag-public-image-quality.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/catalog-image-quality-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit China public galleries
        env:
          DIAG_MARKET: china
        run: npx tsx scripts/diag-public-image-quality.mts
      - name: Audit Georgia public galleries
        env:
          DIAG_MARKET: georgia
        run: npx tsx scripts/diag-public-image-quality.mts
      - uses: actions/upload-artifact@v4
        with:
          name: public-image-quality-diagnostic
          path: diag-public-image-quality-*.json
          retention-days: 3
