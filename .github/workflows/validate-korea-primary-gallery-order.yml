name: Diagnose KCar primary gallery shape

on:
  push:
    branches: [fix/korea-primary-gallery-order-20260810]
    paths:
      - .github/workflows/validate-korea-primary-gallery-order.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/korea-primary-gallery-order-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Raw exact-detail image-path diagnostic (NO-PUBLISH)
        run: npx tsx scripts/kcar-gallery-shape-diagnostic.ts
