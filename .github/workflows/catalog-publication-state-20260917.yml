name: Inspect catalog publication state
on:
  push:
    branches: [fix/finish-fresh-catalog-20260917]
    paths: ['.github/workflows/catalog-publication-state-20260917.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Read publication lock and active generation
        run: |
          node --import tsx --input-type=module <<'JS'
          import { readDataJson } from './apps/web/lib/data.ts';
          const lock=await readDataJson('catalog/import-lock.json',{});
          const manifest=await readDataJson('catalog/manifest.json',{});
          console.log(JSON.stringify({lock,generationId:manifest.generationId,updatedAt:manifest.updatedAt,markets:manifest.markets},null,2));
          JS
