name: TEMP CarSwitch retry condition selfpatch

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-selfpatch-carswitch-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restrict retry to observed HTTP 202 shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/lib/catalog/carswitch-exact-source.ts')
          s=p.read_text()
          old='const transientShell = response.status === 202 || (response.status === 200 && markup.length < 50_000);'
          new='const transientShell = response.status === 202;'
          if old not in s: raise SystemExit('transient expression not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/carswitch-exact-source.ts
          git diff --cached --check
          git commit -m 'Retry only observed CarSwitch 202 shell'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
