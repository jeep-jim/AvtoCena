name: One-shot deploy exact power guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-deploy-exact-power-20260811.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current main deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-yandex.yml --repo "$GITHUB_REPOSITORY" --ref main
