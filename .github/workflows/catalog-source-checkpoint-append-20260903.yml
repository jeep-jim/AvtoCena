name: Catalog source checkpoint append 2026-09-03

on:
  push:
    branches:
      - chore/source-deficit-recon-v1-20260903
    paths:
      - ".github/workflows/catalog-source-checkpoint-append-20260903.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append durable source-qualification checkpoint
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '### Run 33746996319 — финальный зелёный deficit resolution checkpoint' docs/catalog-source-deficit-recon-v1.md; then
            cat >> docs/catalog-source-deficit-recon-v1.md <<'EOF'

          ### Run 33746766296 — regression postprocess, исправлен

          Postprocess test остановился до live probe: regex для корейской мощности не распознавал `190마력` / `282마력` из уже сохранённого offer-bound контекста. Live source requests не выполнялись, artifact не создавался, production не затрагивался. Исправлен только нормализатор evidence; regression test сохранён.

          ### Run 33746996319 — финальный зелёный deficit resolution checkpoint

          - status: `success`;
          - head: `e3dd6e1c68363f9bb8fca445cfb2ae6aafb14d16`;
          - artifact: `9890047197`;
          - digest: `sha256:63a090905f0b55585a2683e16c8c08ffeb45ab53f93ddb20904c65c23211be17`;
          - contract tests, 8-offer live evidence pass, conservative postprocess, no-write envelope и artifact upload — `success`;
          - итоговая машиночитаемая сводка: `data/catalog/source-deficit-resolution-v1-summary.json`.

          Финальный результат этого блока:

          - **Bobaedream:** собственные detail pages повторно доказывают `2,359 cc / 190마력` и `3,342 cc / 282마력`; offer-bound gallery series устойчивы и содержат больше пяти изображений. Но найденные same-origin spec routes не дают отдельного canonical body field. Поэтому источник не повышается до `exact_catalog`: unresolved остаётся `canonicalBody`.
          - **CarSwitch:** exact offer pages устойчиво содержат `1.5L` и `5.7L`, цену, валюту, body/fuel и галерею. Но exact `engineCc` и offer-bound `powerHp` на этих двух предложениях не доказаны. Литры не конвертируются в cc по предположению.
          - **CARS24 UAE:** оба offer pages устойчиво связывают hero price с embedded offer state (`31,499 AED` и `64,999 AED`) и явно показывают `1.5L / 1.8L`. Таким образом прежний price deficit закрыт на evidence-level. Exact cc и source-bound power остаются отсутствующими.
          - **DubiCars:** iX1 стабильно показывает peak `313 HP`, но EV certified/utilization/30-minute power не найден. Для gallery DOM-window содержит 17 UUID при source `image_count=11/14`, поэтому окно признано contaminated и не принимается за точную listing gallery. ICE exact cc/power также не доказаны.

          **Классификационное решение:** ни один из четырёх источников этим этапом не переводится в `exact_catalog`; все остаются `research_pending`, `publishAllowed=false`. Бесконечное лечение без конкретного source-bound route запрещено: следующий основной этап переходит к partial-signal группе, а к этим четырём возвращаемся только при появлении конкретного разрешённого доказательства.
          EOF
          fi

          if ! grep -q '^### 40.26. Deficit resolution' roadmap.md; then
            cat >> roadmap.md <<'EOF'

          ### 40.26. Deficit resolution: что реально удалось доказать после PR #826

          - **Дата checkpoint:** 2026-09-03. Продолжение раздела 40.25 без перезапуска исследования и без изменения production.
          - **Исходная точка:** PR #826 влит в `main`, merge SHA `3826f80b04371ba8c4c0b8a3321292fa93bf5db2`. После него четыре strongest detail-signal кандидата — Bobaedream, DubiCars, CarSwitch и CARS24 UAE — оставались `research_pending`, `publishAllowed=false`.
          - **Targeted recon:** run `33744960785` — success; artifact `9889257990`; digest `sha256:d7008f31989b6fac8f941349122c1da63a72e2593866b199ed73140310b010db`. Проверены только те же 8 detail offers; найдены offer-bound gallery evidence, embedded source keys и два реальные same-origin Bobaedream spec routes.
          - **Bobaedream discovered-route probe:** run `33745638721` — success; artifact `9889505193`; digest `sha256:5ec558b74397826ba513f1798e0a078615f97fc9ec4f8fe1da3e0056a7ea50d5`. Два реально найденных spec routes стабильны, но canonical body field не найден; generic `승용/SUV/쿠페` навигация не считается offer evidence.
          - **Final deficit resolution:** run `33746996319` — success; artifact `9890047197`; digest `sha256:63a090905f0b55585a2683e16c8c08ffeb45ab53f93ddb20904c65c23211be17`. Перед ним run `33746766296` упал только на regression test корейского `마력`; live probe не запускался, причина исправлена тестом.
          - **Bobaedream:** exact engine/power подтверждены самим offer (`2359 cc / 190 hp`, `3342 cc / 282 hp`), gallery series offer-bound и >5 изображений; **blocker = canonical body**.
          - **CarSwitch:** offer-bound `1.5L / 5.7L`, price/currency/body/fuel/gallery доказаны; **blockers = exact engineCc и offer-bound powerHp**. Маркетинговый литраж не превращается автоматически в cc.
          - **CARS24 UAE:** `31 499 AED` и `64 999 AED` доказаны одновременно hero price + embedded offer state; `1.5L / 1.8L` доказаны; **blockers = exact engineCc и source-bound powerHp**.
          - **DubiCars:** EV peak `313 HP` доказан, но certified/utilization/30-minute power нет; ICE exact cc/power нет. Gallery window содержит лишние UUID относительно source `image_count=11/14`, поэтому gallery evidence пока contaminated и не повышается до exact.
          - **Вердикт этапа:** ни один из 4 источников не получает `exact_catalog`; у всех `publishAllowed=false`. Текущий public generation, manifest, Object Storage, cleanup и production catalog не менялись.
          - **Следующий основной блок:** не лечить эти четыре бесконечно. Перейти к partial-signal группе `carvector_japan_stat_open`, `chngoodcar_china_candidate`, `iautos_china_candidate`, `exportcar_japan_candidate` и применить тот же read-only source-bound field contract. К strongest-группе возвращаться только при наличии конкретного разрешённого route/evidence, способного закрыть оставшееся поле без inference.
          EOF
          fi

          if git diff --quiet; then
            echo 'Checkpoint already present; nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md docs/catalog-source-deficit-recon-v1.md
          git commit -m 'Record source deficit resolution checkpoint'
          git push origin HEAD:chore/source-deficit-recon-v1-20260903
