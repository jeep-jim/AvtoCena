name: Ops · Europe source identity quota publish 20260814

on:
  push:
    branches:
      - ops/europe-model-quota-publish-20260814
    paths:
      - ".github/workflows/ops-europe-model-quota-publish-20260814.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-model-quota-publish-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guarded atomic all-market publication
        run: npx tsx scripts/oneshot-europe-model-quota-publish-20260814.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-model-quota-publish-result
          path: europe-model-quota-publish-result.json
          if-no-files-found: warn
          retention-days: 5
