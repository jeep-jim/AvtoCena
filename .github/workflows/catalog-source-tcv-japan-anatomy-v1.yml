name: Catalog source anatomy · TCV Japan v1

on:
  push:
    branches:
      - feat/tcv-japan-anatomy-v1-20260904
    paths:
      - .github/workflows/catalog-source-tcv-japan-anatomy-v1.yml
      - scripts/catalog-source-tcv-japan-anatomy-v1.mjs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only TCV Japan anatomy probe
        env:
          CATALOG_SOURCE_TCV_JAPAN_ANATOMY_TIMEOUT_MS: '20000'
          CATALOG_SOURCE_TCV_JAPAN_ANATOMY_SAMPLE_COUNT: '4'
        run: node scripts/catalog-source-tcv-japan-anatomy-v1.mjs
      - name: Verify fail-closed envelope
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const row = JSON.parse(fs.readFileSync('catalog-source-tcv-japan-anatomy-v1.json', 'utf8'));
          const falseFlags = [
            'productionWrites',
            'classificationMutations',
            'publishAllowedMutations',
            'objectStorageWrites',
            'catalogGenerationWrites',
            'rawBodiesStored',
            'guessedRoutes',
            'sourcePublishAllowed',
          ];
          for (const key of falseFlags) {
            if (row[key] !== false) throw new Error(`${key} must be false`);
          }
          if (row.sourceId !== 'tcv_japan_candidate') throw new Error('unexpected sourceId');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-source-tcv-japan-anatomy-v1
          path: catalog-source-tcv-japan-anatomy-v1.json
          if-no-files-found: error
          retention-days: 7
