name: Catalog V2 smoke9 reusable

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false
      CATALOG_IMAGE_CDN_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-v2-smoke9-${{ inputs.market }}
  cancel-in-progress: false

env:
  CATALOG_V2_PRIORITY_TARGET: "9"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "100000000"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "9"
  CATALOG_REBUILD_TARGET_PER_MARKET: "9"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "9"
  CATALOG_PUBLISH_MAX_PER_MARKET: "9"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"

jobs:
  smoke9:
    name: Publish exactly 9 · ${{ inputs.display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_SHARD_INDEX: "0"
      CATALOG_REBUILD_SHARD_COUNT: "1"
      CATALOG_V2_SOURCE_SLOTS_ONLY: "0"
      CATALOG_REBUILD_IGNORE_PROBE: "0"
      CATALOG_REBUILD_RESET_CURSOR: "0"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "100"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "1000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "25"
      CATALOG_REBUILD_MAX_SOURCE_ERRORS: "8"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "50"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "12"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "4"
      CATALOG_REBUILD_TIME_LIMIT_MS: "900000"
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_TIMEOUT_MS: "20000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "8"
      CATALOG_GALLERY_FAST_PATH: "false"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-0.json
      CATALOG_PROBE_OUTPUT: catalog-v2-probe-${{ inputs.market }}-0.json
      CATALOG_REBUILD_INPUT_DIR: catalog-v2-input
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-v2-${{ inputs.market }}-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-v2-${{ inputs.market }}-publish-report.json
      CATALOG_FAILED_GENERATION_CLEANUP_REPORT: catalog-v2-${{ inputs.market }}-failed-generation-cleanup.json
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "12"
      CATALOG_INDEX_WRITE_CONCURRENCY: "8"
      CATALOG_STORAGE_EMERGENCY: "true"
      CATALOG_STORAGE_CLEANUP_DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate smoke pipeline
        run: |
          node --check scripts/catalog-probe-source-shard.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-publish-market.mjs
          node --check scripts/catalog-clean-failed-generations.mjs
      - name: Probe registered sources
        run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Collect at least 9 real offers
        shell: bash
        run: |
          set +e
          rm -f "$CATALOG_REBUILD_OUTPUT"
          timeout --signal=TERM --kill-after=60s 900s npx tsx scripts/catalog-rebuild-source-shard.mjs
          status=$?
          count=0
          if [ -s "$CATALOG_REBUILD_OUTPUT" ]; then
            count=$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT,"utf8"));process.stdout.write(String(Number(p.count||p.offers?.length||0)))')
          fi
          echo "::notice::${CATALOG_REBUILD_MARKET}: collector exit=${status}, offers=${count}"
          test "$count" -ge 9
      - name: Prepare smoke input
        run: |
          mkdir -p "$CATALOG_REBUILD_INPUT_DIR"
          cp "$CATALOG_REBUILD_OUTPUT" "$CATALOG_REBUILD_INPUT_DIR/"
      - name: Validate calculations and galleries
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish exactly 9 with storage recovery
        shell: bash
        run: |
          set +e
          for attempt in 1 2; do
            rm -f "$CATALOG_REBUILD_PUBLISH_REPORT"
            timeout --signal=TERM --kill-after=60s 600s npx tsx scripts/catalog-publish-market.mjs
            status=$?
            state=$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,"utf8"));const m=process.env.CATALOG_REBUILD_MARKETS;process.stdout.write(`${p.published===true?1:0}:${p.generationId?1:0}:${Number(p.byMarket?.[m]||0)}:${String(p.publicationError||"")}`)}catch{process.stdout.write("0:0:0:missing_report")}')
            echo "::notice::attempt=${attempt} exit=${status} state=${state}"
            IFS=: read -r published generation count error <<< "$state"
            if [ "$published" = "1" ] && [ "$generation" = "1" ] && [ "$count" = "9" ] && [ -z "$error" ]; then exit 0; fi
            if echo "$error" | grep -Eiq 'quota|max size|storage.*full|object_storage_.*(409|413|507)'; then
              npx tsx scripts/catalog-clean-failed-generations.mjs || true
            fi
            sleep 10
          done
          exit 1
      - name: Require exactly 9 published cards
        run: |
          node <<'NODE'
          const fs = require('fs');
          const market = process.env.CATALOG_REBUILD_MARKETS;
          const report = JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT, 'utf8'));
          const count = Number(report.byMarket?.[market] || 0);
          const state = {
            market,
            generationId: report.generationId || null,
            published: report.published === true,
            count,
            total: Number(report.total || 0),
            byMarketAndSource: report.byMarketAndSource?.[market] || {},
            priorityCount: Number(report.marketQuality?.[market]?.priorityCount || 0),
            recentCount: Number(report.marketQuality?.[market]?.recentCount || 0),
            extendedCount: Number(report.marketQuality?.[market]?.extendedCount || 0),
            auctionCount: Number(report.marketQuality?.[market]?.auctionCount || 0),
            calculatedShare: report.marketQuality?.[market]?.calculatedShare ?? 0,
            imageStats: report.marketQuality?.[market]?.imageStats || {},
            rejectionReasons: report.rejectionReasons || {},
            sourceErrors: report.sourceErrors || [],
            publicationError: report.publicationError || '',
          };
          console.log(JSON.stringify(state, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Smoke9: ${market}\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n`);
          if (!state.published || !state.generationId || count !== 9 || state.publicationError) process.exit(1);
          NODE
      - name: Upload smoke9 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-smoke9-${{ inputs.market }}
          path: |
            catalog-v2-probe-${{ inputs.market }}-0.json
            catalog-rebuild-${{ inputs.market }}-0.json
            catalog-v2-${{ inputs.market }}-validation-report.json
            catalog-v2-${{ inputs.market }}-publish-report.json
            catalog-v2-${{ inputs.market }}-failed-generation-cleanup.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
