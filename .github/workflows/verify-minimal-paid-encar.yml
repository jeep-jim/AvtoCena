name: Verify minimal paid Korea candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-minimal-paid-encar.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
          ref: 56a95d571bc531d024ab2f2abe1de5d249b5f075
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact retained baseline and nine-file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 56a95d571bc531d024ab2f2abe1de5d249b5f075
          test "$(git rev-parse HEAD^^)" = a182cd21b21ecf612b63613d263e5bdd817ea4c0
          test "$(git rev-parse HEAD^{tree})" = 767a3861b85d85e53536440d2889c000afaf076c
          git diff --check HEAD^^ HEAD
          python3 - <<'SCOPE'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^^','HEAD'],text=True).splitlines()
          expected={
           'apps/web/app/(public)/api/catalog/search/route.ts',
           'apps/web/app/(public)/cars/offer/[id]/page.tsx',
           'apps/web/lib/catalog/ajes-catalog.ts',
           'apps/web/lib/catalog/ajes-market-selection.ts',
           'apps/web/lib/catalog/collection-controls-schema.ts',
           'apps/web/lib/catalog/collection-controls.ts',
           'apps/web/lib/catalog/storage.ts',
           'tests/catalog-market-brand-projection.test.ts',
           'tests/china-source-switch.test.ts'
          }
          assert set(paths)==expected,paths
          print('EXACT_PAID_SCOPE',len(paths))
          SCOPE
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm test
      - name: Build the exact production candidate
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
