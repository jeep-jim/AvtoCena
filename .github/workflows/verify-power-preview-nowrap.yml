name: Verify one-line preview chips
on:
  push:
    branches: [verify/power-preview-nowrap-20260912]
    paths: ['.github/workflows/verify-power-preview-nowrap.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - name: Confirm this production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          url='https://api.github.com/repos/jeep-jim/AvtoCena/actions/runs/34685679604'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: run=json.load(response)
          assert run['head_sha']=='8594340505cd23577cf801ff2b7fca2d28e04078'
          assert run['status']=='completed' and run['conclusion']=='success'
          Path('artifacts/deploy.json').write_text(json.dumps({k:run[k] for k in ['id','html_url','head_sha','status','conclusion']},indent=2))
          PY
      - name: Check catalog, similar previews and unchanged detail power
        run: |
          python - <<'PY'
          import json, shutil, traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          origin='https://avtocena.com'
          pages=[('catalog','/cars?market=china&make=Volkswagen&model=T-Roc',None),('white','/cars/offer/15691a619182935d97aa25c7',True),('red','/cars/offer/e140a617a1c22609b44c4495',False)]
          results=[]
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          assert chrome, 'Chromium is required'
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
              try:
                  for name,path,paired_expected in pages:
                      context=browser.new_context(viewport={'width':390,'height':900},service_workers='block')
                      page=context.new_page()
                      errors=[]
                      page.on('pageerror',lambda e: errors.append(str(e)))
                      page.route('**/*',lambda route: route.continue_() if route.request.method in ['GET','HEAD'] else route.abort())
                      theme='dark'; width=390
                      try:
                          response=page.goto(origin+path,wait_until='domcontentloaded',timeout=90000)
                          assert response and response.status==200
                          chips=page.locator('article [data-recycling-power-chip="true"]')
                          chips.first.wait_for(state='visible',timeout=60000)
                          if paired_expected is not None:
                              page.wait_for_function('''() => {const el=document.querySelector('.ac-inline-parameters summary[aria-label^="Мощность:"]');return el && Object.keys(el).some(k=>k.startsWith('__reactProps$'));}''',timeout=45000)
                          else:
                              page.wait_for_function('''() => {const el=document.querySelector('article [data-recycling-power-chip="true"]')?.closest('a');return el && Object.keys(el).some(k=>k.startsWith('__reactProps$'));}''',timeout=45000)
                          page.wait_for_timeout(1000)
                          cookie=page.locator('[role="dialog"][aria-labelledby="avtocena-cookie-title"]')
                          if cookie.is_visible():
                              cookie.get_by_role('button',name='Понятно',exact=True).click()
                              cookie.wait_for(state='hidden')
                          for theme in ['dark','light']:
                              for width in [320,390,1280]:
                                  page.set_viewport_size({'width':width,'height':900})
                                  page.evaluate('(theme)=>document.documentElement.dataset.theme=theme',theme)
                                  page.wait_for_timeout(250)
                                  chips.first.wait_for(state='visible',timeout=45000)
                                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'), (name,theme,width,'page overflow')
                                  rail_results=[]
                                  for chip in chips.all()[:10]:
                                      data=chip.evaluate('''el=>{
                                        const row=el.parentElement,style=getComputedStyle(row);
                                        const children=[...row.children].map(x=>x.getBoundingClientRect());
                                        const units=[...el.querySelectorAll('[data-recycling-power] > span')].map(x=>x.getBoundingClientRect());
                                        const card=el.closest('article'),price=card.querySelector('.ac-price-trend');
                                        const before=el.getBoundingClientRect();
                                        row.scrollLeft=row.scrollWidth;
                                        const reachable=el.getBoundingClientRect().right<=row.getBoundingClientRect().right+1;
                                        row.scrollLeft=0;
                                        return {text:el.innerText,wrap:style.flexWrap,overflowX:style.overflowX,
                                          singleRow:Math.max(...children.map(x=>x.top))-Math.min(...children.map(x=>x.top))<1,
                                          singleLabelLine:units.length===2&&Math.abs(units[0].top-units[1].top)<1,
                                          noVerticalOverflow:row.scrollHeight<=row.clientHeight+1,
                                          belowPrice:!price||before.top>=price.getBoundingClientRect().bottom-1,
                                          clipped:row.scrollWidth>row.clientWidth,reachable};
                                      }''')
                                      assert data['wrap']=='nowrap' and data['overflowX']=='auto', (name,theme,width,data)
                                      assert all(data[k] for k in ['singleRow','singleLabelLine','noVerticalOverflow','belowPrice','reachable']), (name,theme,width,data)
                                      assert '118 кВт' in data['text'], data
                                      rail_results.append(data)
                                  assert rail_results, (name,theme,width,'preview rows not ready')
                                  detail_label=None
                                  if paired_expected is not None:
                                      summary=page.locator('.ac-inline-parameters summary[aria-label^="Мощность:"]')
                                      summary.wait_for(state='visible')
                                      assert summary.locator('[data-recycling-power="paired"]').count()==int(paired_expected)
                                      detail_label=summary.inner_text()
                                      if paired_expected:
                                          assert '160 л.с.' in detail_label and '118 кВт' in detail_label
                                          assert summary.evaluate('''el=>{const a=el.getBoundingClientRect();return [...el.querySelectorAll('[data-recycling-power] > span')].every(x=>{const b=x.getBoundingClientRect();return b.left>=a.left-1&&b.right<=a.right+1&&b.top>=a.top-1&&b.bottom<=a.bottom+1;});}''')
                                      else: assert '150 л.с.' in detail_label
                                  chips.first.locator('xpath=ancestor::article').scroll_into_view_if_needed()
                                  chips.first.evaluate('el=>el.parentElement.scrollLeft=0')
                                  page.screenshot(path=f'artifacts/{name}-{theme}-{width}.png')
                                  result={'page':name,'theme':theme,'width':width,'detailPower':detail_label,'rails':rail_results,'pageErrors':list(errors)}
                                  results.append(result)
                                  Path('artifacts/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
                                  print(json.dumps(result,ensure_ascii=False),flush=True)
                      except Exception as error:
                          Path('artifacts/failure.json').write_text(json.dumps({'page':name,'theme':theme,'width':width,'error':str(error),'traceback':traceback.format_exc(),'pageErrors':errors},ensure_ascii=False,indent=2))
                          page.screenshot(path='artifacts/failure.png')
                          raise
                      finally: context.close()
              finally: browser.close()
          assert len(results)==18
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-preview-nowrap-live
          path: artifacts
          retention-days: 7
