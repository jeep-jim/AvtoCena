name: Review date editor clarity and mobile calendar
on:
  push:
    branches: [fix/date-editor-clarity-20260913]
    paths: ['scripts/review-date-editor.py', '.github/workflows/review-date-editor.yml', 'apps/web/components/catalog/CalculationDateControl.tsx']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded UI edits and date-reset regression
        run: |
          python3 scripts/review-date-editor.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/components/catalog/InlineOfferParameters.tsx')
          text=p.read_text()
          old='const dirty=JSON.stringify(draft)!==JSON.stringify(initial);'
          assert text.count(old)==1
          text=text.replace(old,'// Empty optional values equal omitted values, so returning to today restores the original scenario.\n const dirty=Object.keys({...initial,...draft}).some(key=>(draft[key]??"")!==(initial[key]??""));')
          p.write_text(text)
          p=Path('tests/browser/attached-parameter-dropdowns.mjs');text=p.read_text()
          old='<html lang="ru"><head><meta name="viewport"'
          assert text.count(old)==1
          text=text.replace(old,'<html lang="ru"><head><meta charset="utf-8"><meta name="viewport"')
          text=text.replace("      assert.ok(cb.right===undefined); // Playwright boxes expose x/width, not DOMRect.right.\n",'')
          old="   if(!live&&kind==='petrol'){"
          assert text.count(old)==1
          text=text.replace(old,old+'''
              await triggers.nth(0).click();
              const date=grid.getByLabel('Дата таможенного расчёта',{exact:true});
              await date.fill('2026-09-24');await page.waitForTimeout(850);
              assert.equal(requests.at(-1)?.customsCalculationDate,'2026-09-24');
              assert.equal(requests.at(-1)?.year,'2026');
              assert.equal(requests.at(-1)?.powerKw,'118');
              await grid.getByRole('button',{name:'Считать таможню на сегодня',exact:true}).click();
              await page.waitForTimeout(100);
              assert.equal(await date.inputValue(),'');
              assert.equal(await page.getByRole('button',{name:'Вернуть исходные данные',exact:true}).count(),0,'return to today restores the initial scenario, including omitted optional fields');
              await page.keyboard.press('Escape');
          ''')
          p.write_text(text)
          PY
      - run: npm ci
      - name: Types and unchanged calculation regressions
        run: |
          npm run typecheck
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/recycling-power-ui.test.ts tests/russia-customs.test.ts
      - name: Production build
        run: npm run build
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/date-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/date-browser/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Chromium responsive date and dropdown checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/date-browser/node_modules/playwright/index.mjs
        run: |
          CHROME_BIN=$(command -v google-chrome) node tests/browser/attached-parameter-dropdowns.mjs
          mv artifacts/attached-parameters-local artifacts/date-chromium
      - name: WebKit responsive date and dropdown checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/date-browser/node_modules/playwright/index.mjs
          PARAMETER_BROWSER: webkit
        run: |
          node tests/browser/attached-parameter-dropdowns.mjs
          mv artifacts/attached-parameters-local artifacts/date-webkit
      - name: Commit reviewed UI changes on this branch only
        run: |
          test "${GITHUB_REF}" = refs/heads/fix/date-editor-clarity-20260913
          git diff --check
          git diff > artifacts/date-editor.patch
          cp apps/web/components/catalog/InlineOfferParameters.tsx artifacts/InlineOfferParameters.tsx
          cp apps/web/components/catalog/InlineParameterPanels.module.css artifacts/InlineParameterPanels.module.css
          rm scripts/review-date-editor.py .github/workflows/review-date-editor.yml
          git config user.name 'jeep-jim'
          git config user.email '173029176+jeep-jim@users.noreply.github.com'
          git add apps/web/components/catalog/InlineOfferParameters.tsx apps/web/components/catalog/InlineParameterPanels.module.css 'apps/web/app/(public)/cars/offer/[id]/page.tsx' tests/browser/attached-parameters-fixture.tsx tests/browser/attached-parameter-dropdowns.mjs roadmap.md scripts/review-date-editor.py .github/workflows/review-date-editor.yml
          git commit -m 'fix(ui): clarify calculation date and preserve labelled seller price until quote is ready'
          git push origin HEAD:refs/heads/fix/date-editor-clarity-20260913
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-editor-review
          path: artifacts
          retention-days: 7
