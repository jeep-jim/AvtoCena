name: Catalog fresh source collection 20260917
on:
  push:
    branches: [fix/kcar-power-evidence-20260916]
    paths: ['.github/workflows/catalog-fresh-20260917.yml']
permissions:
  contents: read
concurrency:
  group: catalog-fresh-20260917
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 225
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        market: [korea, china, uae, europe, georgia]
    env:
      CATALOG_INTAKE_MARKET: ${{ matrix.market }}
      CATALOG_INTAKE_RESUME: '0'
      CATALOG_INTAKE_TIME_MS: '10800000'
      CATALOG_INTAKE_MAX_ROWS_PER_SOURCE: '100000'
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: '20000'
      CATALOG_SOURCE_TIMEOUT_MS: '25000'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_MAX_IMAGES_PER_OFFER: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/catalog-source-intake.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-${{ matrix.market }}
          path: catalog-intake-${{ matrix.market }}/
          retention-days: 14
  japan:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - name: Fresh sold-history collection, no Drom
        env:
          SWEEP_SECONDS: '10800'
        run: python3 scripts/japan-free-html-sweep.py jptrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-japan-jptrade
          path: japan-free-results/
          retention-days: 14
