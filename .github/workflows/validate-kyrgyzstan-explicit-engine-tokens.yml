name: Validate Kyrgyzstan explicit engine tokens

on:
  push:
    branches:
      - "fix/kyrgyzstan-explicit-engine-tokens"
    paths:
      - ".github/workflows/validate-kyrgyzstan-explicit-engine-tokens.yml"
      - ".github/patches/fix-kyrgyzstan-explicit-engine-tokens.py"

permissions:
  contents: write

concurrency:
  group: validate-kyrgyzstan-explicit-engine-tokens
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact source-token patch
        run: python .github/patches/fix-kyrgyzstan-explicit-engine-tokens.py
      - name: Validate source and types
        run: |
          node --check apps/web/lib/catalog/mashina-kyrgyzstan-list-source.ts
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo || true
      - name: Verify explicit token parser guards
        run: |
          cat > /tmp/check-mashina.ts <<'EOF'
          import { parseMashinaExplicitEngineLiters } from "${{ github.workspace }}/apps/web/lib/catalog/mashina-kyrgyzstan-list-source.ts";
          const cases = [
            ["Lexus ES350 3.5 AT", 3.5],
            ["Toyota RAV4 2.5hyb", 2.5],
            ["Volkswagen Tiguan 2.0d", 2.0],
            ["BMW X5 3.0 DCT", 3.0],
            ["Tesla Model 3", 0],
            ["Audi Q5 2022", 0],
            ["Mazda CX-5 2021", 0],
            ["Toyota Crown 2018", 0]
          ];
          for (const [text, expected] of cases) {
            const actual = parseMashinaExplicitEngineLiters(text);
            if (actual !== expected) throw new Error(`${text}: expected ${expected}, got ${actual}`);
          }
          console.log(JSON.stringify(cases.map(([text]) => [text, parseMashinaExplicitEngineLiters(text)])));
          EOF
          npx tsx /tmp/check-mashina.ts
      - name: Commit validated source fix to branch
        run: |
          rm .github/workflows/validate-kyrgyzstan-explicit-engine-tokens.yml
          rm .github/patches/fix-kyrgyzstan-explicit-engine-tokens.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/mashina-kyrgyzstan-list-source.ts .github/workflows/validate-kyrgyzstan-explicit-engine-tokens.yml .github/patches/fix-kyrgyzstan-explicit-engine-tokens.py
          git commit -m "Parse exact Mashina engine tokens without model pollution"
          git push origin HEAD:fix/kyrgyzstan-explicit-engine-tokens
