name: Ops · AutoScout HQ v4 gate fix 20260814

on:
  push:
    branches:
      - ops/autoscout-hq-v4-gate-fix-20260814
    paths:
      - ".github/workflows/ops-autoscout-hq-v4-gate-fix-20260814.yml"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/autoscout-hq-v4-gate-fix-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download failed v4 proof artifact
        run: gh run download 31771157260 --repo jeep-jim/AvtoCena --name autoscout-live-hq-proof-v4 --dir hq-v4
      - name: Recheck current generation and apply corrected Europe-only gates
        run: npx tsx scripts/ops-autoscout-hq-proof-v4-gate-fix.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-hq-v4-fixed
          path: |
            autoscout-hq-v4-fixed-candidate.json
            autoscout-hq-v4-fixed-report.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
