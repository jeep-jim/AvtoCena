name: One-shot rerun UAE Georgia after gate fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-rerun-uae-georgia-after-gate-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ensure no shared live writer then dispatch once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Source-sharded cumulative catalog · Korea China Europe Georgia" or .workflowName == "Catalog live recovery · UAE + Kyrgyzstan" or .workflowName == "Catalog live recovery · Japan from Prestige" or .workflowName == "Catalog live recovery · UAE + Georgia direct")] | length')"
          queued="$(gh run list --repo "$GITHUB_REPOSITORY" --status queued --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Source-sharded cumulative catalog · Korea China Europe Georgia" or .workflowName == "Catalog live recovery · UAE + Kyrgyzstan" or .workflowName == "Catalog live recovery · Japan from Prestige" or .workflowName == "Catalog live recovery · UAE + Georgia direct")] | length')"
          test "$active" = "0"
          test "$queued" = "0"
          gh workflow run catalog-live-recovery-uae-georgia-direct.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Remove dispatcher
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm .github/workflows/oneshot-rerun-uae-georgia-after-gate-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oneshot-rerun-uae-georgia-after-gate-fix.yml
          git commit -m "Remove one-shot UAE Georgia rerun dispatcher [skip actions]"
          git push origin HEAD:main
