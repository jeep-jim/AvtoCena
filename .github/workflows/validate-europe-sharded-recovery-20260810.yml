name: Validate Europe sharded recovery no publish

on:
  push:
    branches: [ops/europe-sharded-recovery-20260810]
    paths:
      - .github/workflows/validate-europe-sharded-recovery-20260810.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-sharded-recovery-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Current seven-market audit
        env:
          CATALOG_AUDIT_OUTPUT: europe-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":2832,"china":8130,"japan":423,"uae":173,"europe":4676,"georgia":51,"kyrgyzstan":2337}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs

  mobile:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECOVERY_MARKET: europe
      RECOVERY_SOURCE_IDS: mobile_de_open
      RECOVERY_OUTPUT: catalog-shard-europe-mobile_de_open.json
      RECOVERY_TARGET: "1200"
      RECOVERY_MAX_PAGES: "80"
      RECOVERY_TIME_LIMIT_MS: "2400000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-sharded-recovery-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: europe-mobile-shard
          path: catalog-shard-europe-mobile_de_open.json

  autoscout:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECOVERY_MARKET: europe
      RECOVERY_SOURCE_IDS: autoscout_europe_open
      RECOVERY_OUTPUT: catalog-shard-europe-autoscout_europe_open.json
      RECOVERY_TARGET: "1200"
      RECOVERY_MAX_PAGES: "80"
      RECOVERY_TIME_LIMIT_MS: "2400000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-sharded-recovery-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: europe-autoscout-shard
          path: catalog-shard-europe-autoscout_europe_open.json

  otomoto:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECOVERY_OUTPUT: catalog-shard-europe-otomoto_europe_exact.json
      RECOVERY_TARGET: "1200"
      RECOVERY_MAX_PAGES: "80"
      RECOVERY_TIME_LIMIT_MS: "2400000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-sharded-recovery-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/catalog-live-recovery-europe-otomoto.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: europe-otomoto-shard
          path: catalog-shard-europe-otomoto_europe_exact.json

  merge:
    needs: [mobile, autoscout, otomoto]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-sharded-recovery-20260810
      - uses: actions/download-artifact@v4
        with:
          pattern: europe-*-shard
          path: shard-input
      - name: Merge exact Europe shards only
        env:
          RECOVERY_MERGE_MARKET: europe
          RECOVERY_MERGE_INPUT_DIR: shard-input
          RECOVERY_MERGE_OUTPUT: catalog-rebuild-europe.json
        run: node scripts/catalog-live-recovery-merge-shards.mjs
      - name: Assert useful safe inventory
        run: |
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('catalog-rebuild-europe.json','utf8')); const rows=Array.isArray(x)?x:(x.offers||x.items||[]); console.log({rows:rows.length,sources:[...new Set(rows.map(r=>r.sourceId))]}); if(rows.length<100) throw new Error('Europe no-publish inventory too small'); if(rows.some(r=>!r.sourceOfferId || !r.operational?.sourceUrl || !(Number(r.sourcePrice)>0) || !(r.images?.length))) throw new Error('unsafe Europe row');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: europe-sharded-validated
          path: catalog-rebuild-europe.json
