      - name: Preserve public encyclopedia verification
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-public-release
          path: reports/encyclopedia-public-release.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-encar-release-cards
          path: paid-encar-acceptance.json
          if-no-files-found: ignore
  verify-and-retire:
    needs: release
    uses: ./.github/workflows/verify-finish-paid-encar.yml
    secrets: inherit
  resume-existing-china:
    needs: [release, verify-and-retire]
    if: ${{ always() && needs.release.outputs.deferred_china_job != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Resume only the cancelled publisher using its existing saved intake
        env:
          GH_TOKEN: ${{ github.token }}
          DEFERRED_JOB: ${{ needs.release.outputs.deferred_china_job }}
        run: |
          python3 - <<'RESUME'
          import os,json,subprocess,re,time
          repo='jeep-jim/AvtoCena';job=os.environ['DEFERRED_JOB'];assert re.fullmatch('[0-9]+',job)
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          value=api('actions/jobs/'+job)
          assert value['run_id']==43753103164 and value['name']=='refresh / publish (china)'
          if value['status']=='completed' and value['conclusion']=='cancelled':
           artifact=api('actions/runs/43753103164/artifacts')['artifacts']
           assert any(a['id']==14178273080 and a['digest']=='sha256:62f2ca35af55a75130d661d9a7cc267f282d6132af1c143aeb28b39b6ca974e6' and not a['expired'] for a in artifact)
           subprocess.check_call(['gh','api','--method','POST','repos/'+repo+'/actions/jobs/'+job+'/rerun'])
           print(json.dumps({'resumedExistingChinaPublisher':job,'savedIntake':14178273080,'recollection':False}))
          else:print(json.dumps({'ordinaryPublisherAlreadyContinuesOrFinished':True,'status':value['status'],'conclusion':value['conclusion']}))
          RESUME
