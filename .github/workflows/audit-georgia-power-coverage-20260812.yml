name: Audit Georgia power coverage 20260812

on:
  push:
    branches: [audit/georgia-power-coverage-20260812]
    paths:
      - ".github/workflows/audit-georgia-power-coverage-20260812.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read current Georgia and measure power enrichment only
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const knowledgeModule = await import('./apps/web/lib/catalog/vehicle-knowledge.ts');
          const knowledge = knowledgeModule.default || knowledgeModule;
          const certifiedModule = await import('./apps/web/lib/catalog/power-reference.ts');
          const certified = certifiedModule.default || certifiedModule;
          const powerModule = await import('./apps/web/lib/catalog/power-knowledge.ts');
          const power = powerModule.default || powerModule;

          const rows = await storage.readMarketOffers('georgia');
          const [models, variants, powerKnowledge] = await Promise.all([
            knowledge.readVehicleKnowledgeModels(),
            knowledge.readVehicleKnowledgeVariants(),
            power.readVehiclePowerKnowledge(),
          ]);

          const stats = {
            total: rows.length,
            sourceCounts: {},
            currentPower: 0,
            currentPreliminary: 0,
            vehicleKnowledgeMatched: 0,
            vehicleVariantMatched: 0,
            representativePowerUsed: 0,
            vehicleKnowledgeFilledPower: 0,
            certifiedFilledPower: 0,
            standalonePowerKnowledgeFilledPower: 0,
            finalPower: 0,
            finalMissingPower: 0,
            powertrain: {},
          };
          const missingSamples = [];
          const filledSamples = [];
          const concurrency = 8;
          let cursor = 0;
          async function worker() {
            while (true) {
              const index = cursor++;
              if (index >= rows.length) return;
              const row = rows[index];
              stats.sourceCounts[row.sourceId] = (stats.sourceCounts[row.sourceId] || 0) + 1;
              if (Number(row.powerHp || 0) > 0) stats.currentPower++;
              if (row.calculationStatus === 'preliminary_power_pending') stats.currentPreliminary++;

              const byVehicle = await knowledge.enrichOfferWithVehicleKnowledge(row);
              const raw = byVehicle?.operational?.raw || {};
              if (raw.vehicleKnowledgeModel) stats.vehicleKnowledgeMatched++;
              if (raw.vehicleKnowledgeVariant) stats.vehicleVariantMatched++;
              if (String(byVehicle.powerDataSource || '').startsWith('vehicle-model-representative:')) stats.representativePowerUsed++;
              if (!(Number(row.powerHp || 0) > 0) && Number(byVehicle.powerHp || 0) > 0) stats.vehicleKnowledgeFilledPower++;

              const byCertified = await certified.enrichOfferWithCertifiedPower(byVehicle);
              if (!(Number(byVehicle.powerHp || 0) > 0) && Number(byCertified.powerHp || 0) > 0) stats.certifiedFilledPower++;
              const byPower = await power.enrichOfferWithPowerKnowledge(byCertified);
              if (!(Number(byCertified.powerHp || 0) > 0) && Number(byPower.powerHp || 0) > 0) stats.standalonePowerKnowledgeFilledPower++;
              if (Number(byPower.powerHp || 0) > 0) stats.finalPower++;
              else stats.finalMissingPower++;
              const kind = String(byPower.powertrainKind || 'unknown');
              stats.powertrain[kind] = (stats.powertrain[kind] || 0) + 1;

              const sample = {
                id: row.id,
                sourceOfferId: row.sourceOfferId,
                make: row.make,
                model: row.model,
                trim: row.trim,
                year: row.year,
                engineCc: row.engineCc,
                fuel: row.fuel,
                transmission: row.transmission,
                drive: row.drive,
                currentPowerHp: row.powerHp,
                finalPowerHp: byPower.powerHp,
                finalPowerKw: byPower.powerKw,
                powerDataSource: byPower.powerDataSource,
                powerDataConfidence: byPower.powerDataConfidence,
                knowledgeModel: raw.vehicleKnowledgeModel || null,
                knowledgeVariant: raw.vehicleKnowledgeVariant || null,
              };
              if (Number(byPower.powerHp || 0) > 0) {
                if (filledSamples.length < 40) filledSamples.push(sample);
              } else if (missingSamples.length < 60) {
                missingSamples.push(sample);
              }
            }
          }
          await Promise.all(Array.from({ length: concurrency }, worker));

          const report = {
            checkedAt: new Date().toISOString(),
            knowledge: { models: models.length, variants: variants.length, standalonePowerRows: powerKnowledge.length },
            stats,
            filledSamples,
            missingSamples,
          };
          await fs.writeFile('georgia-power-coverage.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (rows.length < 2000) throw new Error(`georgia_count_unexpected_${rows.length}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-power-coverage
          path: georgia-power-coverage.json
          retention-days: 3
