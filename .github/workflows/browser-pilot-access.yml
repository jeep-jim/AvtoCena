name: Browser pilot access diagnostics
on:
  push:
    branches: [ops/browser-pilot-access]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install cloud CLI
        run: |
          curl -fsSL --max-time 60 https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o "$RUNNER_TEMP/install-yc.sh"
          bash "$RUNNER_TEMP/install-yc.sh" -i "$RUNNER_TEMP/yc" -n
      - name: Identify deployment account and read resource availability
        env:
          YC_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          node <<'JS'
          const fs=require('fs'), cp=require('child_process');
          const creds=JSON.parse(process.env.YC_CREDENTIALS);
          const file=process.env.RUNNER_TEMP+'/pilot-access-key.json', yc=process.env.RUNNER_TEMP+'/yc/bin/yc';
          fs.writeFileSync(file,JSON.stringify(creds),{mode:0o600});
          function run(args) { try {return {ok:true,value:JSON.parse(cp.execFileSync(yc,[...args,'--folder-id','b1g9vq73onqb7dp5hgqg','--format','json'],{encoding:'utf8',timeout:40000,stdio:['ignore','pipe','pipe']}))};} catch(e){return {ok:false,error:/PermissionDenied/.test(String(e.stderr))?'PermissionDenied':'command_failed'};} }
          try {
            cp.execFileSync(yc,['config','profile','create','browser-access'],{stdio:'ignore'});
            cp.execFileSync(yc,['config','set','service-account-key',file],{stdio:'ignore'});
            const account=run(['iam','service-account','get','--id',creds.service_account_id]);
            console.log(JSON.stringify({deploymentServiceAccountId:creds.service_account_id,accountName:account.ok?account.value.name:null}));
            for(const args of [['compute','instance','list'],['vpc','subnet','list'],['vpc','security-group','list']]) {
              const result=run(args); console.log(JSON.stringify({operation:args.join(' '),ok:result.ok,error:result.error,count:result.ok&&Array.isArray(result.value)?result.value.length:null}));
            }
            const instances=run(['compute','instance','list']);
            for(const vm of (instances.ok?instances.value:[]).filter(v=>v.name==='avtocena-browser-pilot')) {
              console.log(JSON.stringify({pilotId:vm.id,status:vm.status,createdAt:vm.created_at}));
              try {
                const serial=cp.execFileSync(yc,['compute','instance','get-serial-port-output','--id',vm.id,'--port','1','--folder-id','b1g9vq73onqb7dp5hgqg'],{encoding:'utf8',timeout:40000,stdio:['ignore','pipe','pipe']});
                const lines=serial.split(/\r?\n/).filter(l=>/error|failed|denied|cloud-init|docker|iptables|avtocena-browser/i.test(l)&& !/PRIVATE KEY|BROWSER_WORKER_KEY|access_token|AUTH_SECRET|password|token|worker.env/i.test(l));
                console.log(lines.slice(-35).map(l=>l.replace(/[a-f0-9]{48,}/g,'[redacted]')).join('\n').slice(-6500));
              } catch {console.log('Serial output unavailable');}
            }
          } finally {fs.rmSync(file,{force:true});}
          JS
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public pilot availability
        run: |
          node <<'JS'
          (async () => {
            const response = await fetch('https://avtocena.com/api/browser-pilot', {signal: AbortSignal.timeout(30000)});
            const body = await response.json();
            console.log(JSON.stringify({status: response.status, enabled: body.enabled, maxSessions: body.maxSessions, idleSeconds: body.idleSeconds, maxMinutes: body.maxMinutes}));
            if (!response.ok || body.enabled !== true) process.exitCode = 1;
          })().catch(() => { console.error('Public pilot availability failed'); process.exitCode = 1; });
          JS
