name: Catalog source qualification · mobile.de access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/mobilede-access-policy-v1-20260904
    paths:
      - ".github/workflows/catalog-source-mobilede-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-mobilede-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-mobilede-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply mobile.de lead-only access-policy decision
        run: node scripts/catalog-source-mobilede-access-policy-checkpoint-v1.mjs
      - name: Normalize roadmap EOF
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p='roadmap.md';
          fs.writeFileSync(p, `${fs.readFileSync(p,'utf8').replace(/\s*$/,'')}\n`);
          NODE
      - name: Verify safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='mobile_de_open');
          const d=l.decisions.find(x=>x.sourceId==='mobile_de_open');
          if(!row||row.class!=='lead_only'||row.publishAllowed!==false)throw new Error('mobile.de registry invalid');
          if(!d||d.class!=='lead_only'||d.publishAllowed!==false)throw new Error('mobile.de ledger invalid');
          if(!/Japan remains paused/i.test(r.next||''))throw new Error('Japan pause missing');
          if(!m.includes('## 40.33 — mobile.de Europe: public scraping blocked; official partner Search-API is the permitted path'))throw new Error('roadmap 40.33 missing');
          if((r.candidates||[]).some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety flag changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Classify mobile.de lead-only by access policy"
          git push origin HEAD:chore/mobilede-access-policy-v1-20260904
