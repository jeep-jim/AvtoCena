name: Audit Yandex Georgia egress result

on:
  push:
    branches:
      - audit/yandex-georgia-egress-result-20260812
    paths:
      - .github/workflows/audit-yandex-georgia-egress-result-20260812.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed MyAuto exact detail gallery diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 90 -fsS 'https://avtocena.com/api/internal/georgia-egress-8d4c2f' -o /tmp/result.json
          cat /tmp/result.json | jq .
