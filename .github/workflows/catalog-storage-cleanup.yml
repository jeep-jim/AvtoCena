name: Catalog Object Storage cleanup
run-name: Catalog storage cleanup · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-storage-cleanup.yml"
      - "scripts/catalog-clean-object-storage.mjs"
      - "apps/web/lib/data.ts"
  schedule:
    - cron: "40 2 * * *"

permissions:
  actions: write
  contents: read

# Cleanup protects the current/previous manifests and has a six-hour grace
# period for new objects, so it can use its own queue without being cancelled by
# an unrelated catalog collector waiting to publish.
concurrency:
  group: catalog-object-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove expired generations and orphan images
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_STORAGE_CLEANUP_DRY_RUN: "false"
      CATALOG_STORAGE_KEEP_GENERATIONS: "2"
      CATALOG_STORAGE_EMERGENCY: "false"
      CATALOG_STORAGE_CLEANUP_GRACE_MS: "21600000"
      CATALOG_STORAGE_STAGING_RETENTION_MS: "259200000"
      CATALOG_STORAGE_CLEANUP_MAX_DELETES: "250000"
      CATALOG_STORAGE_DELETE_CONCURRENCY: "32"
      YC_OBJECT_STORAGE_DELETE_CONCURRENCY: "16"
      CATALOG_STORAGE_CLEANUP_REPORT: catalog-storage-cleanup-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Object Storage credentials
        shell: bash
        run: |
          if [ -z "$YC_OBJECT_STORAGE_BUCKET" ] || [ -z "$YC_OBJECT_STORAGE_ACCESS_KEY_ID" ] || [ -z "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY" ]; then
            echo "Object Storage credentials are required for cleanup."
            exit 78
          fi
      - name: Validate cleanup script
        run: node --check scripts/catalog-clean-object-storage.mjs
      - name: Clean expired catalog objects safely
        run: timeout --signal=TERM --kill-after=120s 13800s npx tsx scripts/catalog-clean-object-storage.mjs
      - name: Write cleanup summary
        if: always()
        shell: bash
        run: |
          echo "### Catalog Object Storage cleanup" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$CATALOG_STORAGE_CLEANUP_REPORT" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$CATALOG_STORAGE_CLEANUP_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cleanup report was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-storage-cleanup-report
          path: catalog-storage-cleanup-report.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14
