name: Launch repaired Prestige source preparation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-prestige-repair-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired Prestige chunk recovery through Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/catalog-v6-prestige-repair.yml/dispatches" \
            -f ref=main \
            -f 'inputs[source_run_id]=31289609485'
