name: One-shot force dark offer price panel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-force-dark-price-panel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: git pull --ff-only origin main

      - name: Apply panel fix in component
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/web/components/catalog/PriceTrend.tsx')
          s = p.read_text(encoding='utf-8')

          old = '  const trendRoot = useRef<HTMLSpanElement>(null);\n'
          new = old + '  const panelRoot = useRef<HTMLDivElement>(null);\n'
          if 'const panelRoot = useRef<HTMLDivElement>(null);' not in s:
              if old not in s:
                  raise SystemExit('trendRoot anchor not found')
              s = s.replace(old, new, 1)

          anchor = '  const direction = trend?.direction;\n'
          effect = '''  const direction = trend?.direction;\n  useEffect(() => {\n    const node = panelRoot.current;\n    if (!node || !panel) return;\n    if (!lightTheme && direction === "up") {\n      node.style.setProperty("background", "#3d3644", "important");\n      node.style.setProperty("background-color", "#3d3644", "important");\n    } else {\n      node.style.removeProperty("background");\n      node.style.removeProperty("background-color");\n    }\n    return () => {\n      node.style.removeProperty("background");\n      node.style.removeProperty("background-color");\n    };\n  }, [panel, lightTheme, direction]);\n'''
          if 'node.style.setProperty("background", "#3d3644", "important")' not in s:
              if anchor not in s:
                  raise SystemExit('direction anchor not found')
              s = s.replace(anchor, effect, 1)

          old_return = '  return <div\n    className={`relative ${panel ? "ac-price-trend-panel cursor-pointer rounded-[1.35rem] p-4 shadow-[0_14px_38px_rgba(0,0,0,.14)]" : ""} ${stateClass} ${className}`}\n'
          new_return = '  return <div\n    ref={panelRoot}\n    className={`relative ${panel ? "ac-price-trend-panel cursor-pointer rounded-[1.35rem] p-4 shadow-[0_14px_38px_rgba(0,0,0,.14)]" : ""} ${stateClass} ${className}`}\n'
          if 'ref={panelRoot}' not in s:
              if old_return not in s:
                  raise SystemExit('return div anchor not found')
              s = s.replace(old_return, new_return, 1)

          p.write_text(s, encoding='utf-8')

          # Remove the two previous CSS-only attempts so the component is the single source of truth.
          layout = Path('apps/web/app/(public)/cars/layout.tsx')
          ls = layout.read_text(encoding='utf-8')
          block = '''      /* Dark price-rise surface matches the financing payment accent sampled from the approved mock. */\n      html:not([data-theme="light"]) .ac-offer-page .ac-offer-price-panel.is-up {\n        background: #3d3644 !important;\n      }\n\n'''
          block2 = '''      /* Softer price-rise surface on the dark theme, shared by phone and desktop. */\n      html:not([data-theme="light"]) .ac-offer-page .ac-offer-price-panel.is-up {\n        background: #3d3644 !important;\n      }\n\n'''
          ls = ls.replace(block, '').replace(block2, '')
          layout.write_text(ls, encoding='utf-8')

          page = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          ps = page.read_text(encoding='utf-8')
          ps = ps.replace('      html:not([data-theme="light"]) .ac-offer-page .ac-offer-price-panel.is-up{background:#3d3644!important}\n', '')
          page.write_text(ps, encoding='utf-8')
          PY

      - name: Install and typecheck
        run: |
          npm ci --ignore-scripts
          git restore package-lock.json 2>/dev/null || true
          npm run typecheck
          git restore apps/web/tsconfig.tsbuildinfo packages/engine/tsconfig.tsbuildinfo 2>/dev/null || true

      - name: Publish safely
        run: |
          grep -q 'ref={panelRoot}' apps/web/components/catalog/PriceTrend.tsx
          grep -q 'setProperty("background", "#3d3644", "important")' apps/web/components/catalog/PriceTrend.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/PriceTrend.tsx 'apps/web/app/(public)/cars/layout.tsx' 'apps/web/app/(public)/cars/offer/[id]/page.tsx'
          git rm .github/workflows/oneshot-force-dark-price-panel.yml
          git commit -m 'Force dark offer price-rise panel color in component'
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
