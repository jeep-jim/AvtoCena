name: Che168 archived CSV and checkpoint audit

on:
  push:
    branches: [audit/che168-feed-20261009]
    paths:
      - .github/workflows/che168-bulk-audit.yml
      - scripts/catalog-che168-bulk-audit.mjs
      - scripts/lib/che168-bulk-audit.mjs
      - tests/che168-bulk-audit.test.ts

permissions:
  contents: read

concurrency:
  group: che168-bulk-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify read-only audit and quarantine accounting
        run: node --import tsx --test tests/che168-bulk-audit.test.ts
      - name: Read the existing private archive and frozen checkpoint
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
        run: node --import tsx scripts/catalog-che168-bulk-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: che168-bulk-audit-summary
          path: che168-bulk-audit-report.json
          if-no-files-found: warn
          retention-days: 14
