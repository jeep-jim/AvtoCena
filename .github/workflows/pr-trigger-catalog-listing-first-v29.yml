name: PR trigger catalog listing-first v29

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-branch:
    if: github.head_ref == 'automation/catalog-listing-first-v29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/catalog-listing-first-v29
          fetch-depth: 0
      - name: Execute embedded patch and push branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-catalog-listing-first-v29.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          exec(compile(code, 'embedded-catalog-v29.py', 'exec'), {'__name__': '__main__'})
          PY
          rm -f .github/workflows/apply-catalog-listing-first-v29.yml .github/workflows/pr-trigger-catalog-listing-first-v29.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add -A
          git commit -m "Каталог: публиковать реальные объявления до готового расчёта"
          git push origin HEAD:automation/catalog-listing-first-v29
