name: Record owner catalog recovery plan 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-recovery-plan-20261107.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-owner-plan-20261107
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read current instructions and append without replacing history
        env:
          PLAN: |
            ## 07.11.2026 — утверждённый план восстановления АвтоЦены с этой даты

            Основание: владелец повторно поручил не ограничиваться отчётами, записать порядок работ и восстановить каталог. Эта задача имеет приоритет над несвязанными функциями. GitHub сохраняется для истории, проверок и обратимого выпуска; разработка напрямую в production не принимается как средство ускорения каталога.

            ### Порядок выполнения и критерии
            1. Выпустить проверенный пакет PR1714: Onest, нормальные веса текста, H1/title по выбранной стране/марке/модели, совместимые канонические адреса и изоляция отказа отдельного рынка. На начале этапа все 15 проверок точного head 68e62ca1825a1aec88d7e0533b856aa4410fb4c9 завершились SUCCESS. Это готовность к выпуску, не подтверждение установки или исправления всего каталога.
            2. Устранить конкретную лишнюю работу: двойной responsive-рендер полосы марок, повторяющиеся подписки на тему и ненужное ожидание локально готовых данных в очереди внешнего поставщика. Сохранить полный список марок, расположение контролов, доступность, город, дилера и состояние выбора. Каждая оптимизация имеет отдельный тест и измерение; не просто прятать содержимое/индикаторы.
            3. Разобрать поиск <=160 в Корее/Японии по этапам: исходный запрос, разрешённый кеш, сопоставление с энциклопедией, подтверждённая мощность, фильтрация, продолжение и счётчик. Не угадывать характеристики и не выдавать выборку за весь рынок. Не увеличивать supplier concurrency/таймауты и не подменять IP ради видимого успеха. Исправления должны сохранять действующие источники и их договорные ограничения.
            4. Найти и устранить периодическую ошибку /cars по точному запросу, release SHA и безопасному стеку. Одиночный HTTP200/health не является доказательством исправления. Уже загруженные направления и предыдущая выдача сохраняются при отказе одного запроса; отказ нельзя превращать в точный ноль.
            5. Согласовать SEO полностью: H1/title/description/canonical, внутренние переходы, sitemap, старые URL/постоянные редиректы, карточки, короткие ссылки, формы договора, калькулятор, АвтоБот, дилер и город. Полезные публичные посадочные отделяются от произвольных комбинаций фильтров и персональных расчётов. Не включать общий кеш авторизованного HTML.
            6. Приёмка установленной версии: /cars и шесть рынков с/без <=160, Китай+Новокузнецк, прямой вход/переход/назад/сброс/пагинация/показать ещё, карточки и расчёт. Desktop/mobile/light/dark; отдельно cold/warm/35s/305s, TTFB и время до правильных видимых карточек, HTML/запросы/ошибки. Медленные корректные ответы фиксируются как незакрытая оптимизация по политике 28.10; функциональные ошибки, неверные данные/права и потеря релиза блокируют активацию. VPN-паритет не заявлять без замеров обоих подключений.

            ### Неизменяемые границы
            Сохранить объявления и ID, текущие источники/переключатели, энциклопедию и ручные правки, формулы/сборы/пошлины/комиссии, авторизацию/роли/CRM/заявки, изоляцию дилеров, правила свежести и хранения. Нет массового копирования ограниченных фидов, запуска новых сборов или снятия защиты. Не откатывать всю систему и не выключать рынки ради скорости. Один согласованный выпуск, без отмены здоровых задач и дублирования deploy.

            ### Что считаем результатом
            Для каждого этапа отдельно записывать: код подготовлен; проверки пройдены; установлен точный release SHA; подтверждены конкретные пользовательские сценарии. «Всё исправлено» допустимо только после фактической приёмки, а не по цвету GitHub. Начальные незакрытые задачи: полнота <=160 Корея/Япония и счётчики, периодическая ошибка /cars, лишний HTML, полная SEO/live-проверка. HTTP/2 уже установлен отдельным PR1713; его наличие сохраняется при следующих выпусках.

            Доказательства исходного разбора: docs/operations/2026-11-07-catalog-reference-readback.md и docs/operations/2026-11-07-zma-architecture-and-github.md. Этот план не подтверждает ещё не выполненные исправления.
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main --depth=1
            git checkout --detach origin/main
            tail -n 100 roadmap.md
            cat AGENTS.md
            python3 - <<'PY'
          import os
          from pathlib import Path
          note=os.environ['PLAN'].strip()+'\n'
          marker=note.splitlines()[0]
          p=Path('roadmap.md'); before=p.read_bytes()
          if marker.encode() not in before:
              p.write_bytes(before+b'\n\n'+note.encode())
              assert p.read_bytes().startswith(before)
          report=Path('docs/operations/2026-11-07-catalog-recovery-plan.md')
          if report.exists():
              assert report.read_text()==note, 'plan conflict: review instead of overwrite'
          else:
              report.write_text(note)
          PY
            git diff --check
            git add -- roadmap.md docs/operations/2026-11-07-catalog-recovery-plan.md
            if git diff --cached --quiet; then echo PLAN_ALREADY_RECORDED; exit 0; fi
            test "$(git diff --cached --name-only | wc -l)" -le 2
            git commit -m 'docs: owner catalog recovery plan starts 2026-11-07'
            if git push origin HEAD:main; then
              git fetch origin main --depth=1
              git show origin/main:roadmap.md | tail -n 55
              git log -1 --format='PLAN_COMMIT=%H'
              exit 0
            fi
          done
          echo 'Concurrent main edits: no force push; plan not confirmed' >&2
          exit 1
