name: Patch recovery combustion preliminary 20260813

on:
  push:
    branches:
      - fix/recovery-combustion-preliminary-20260813
    paths:
      - ".github/workflows/patch-recovery-combustion-preliminary-20260813.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-combustion-preliminary-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply generic preliminary-power recovery patch
        run: python3 .github/patches/fix-recovery-combustion-preliminary-20260813.py
      - name: Validate recovery behavior
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --import tsx --test tests/catalog-model-year-quota.test.ts tests/catalog-global-model-cap.test.ts
          npm run typecheck
      - name: Commit production and test files only
        run: |
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"
          git add scripts/catalog-live-recovery-market.mjs tests/catalog-model-year-quota.test.ts
          git diff --cached --check
          git commit -m "Retain combustion recovery offers with preliminary power pricing"
          git push origin HEAD:fix/recovery-combustion-preliminary-20260813
