name: Validate KB ChaChaCha detail backoff 20260812

on:
  push:
    branches:
      - fix/kbchachacha-detail-backoff-20260812

permissions:
  contents: read

jobs:
  validate-no-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: KB exact-source regression tests
        run: node --import tsx --test tests/kbchachacha-exact-source.test.ts tests/catalog-required-adapters-contract.test.ts
      - name: Web typecheck
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: KB exact source smoke (NO PUBLISH)
        env:
          KBCHACHACHA_DETAIL_MIN_INTERVAL_MS: "750"
          KBCHACHACHA_DETAIL_PAUSE_MS: "60000"
          CATALOG_SOURCE_TIMEOUT_MS: "30000"
        run: |
          cat > .kbchachacha-source-smoke.mts <<'TS'
          import { kbChaChaChaExactSource as source } from "./apps/web/lib/catalog/kbchachacha-exact-source.ts";

          const page = await source.fetchPage("1");
          const rows = page.items.slice(0, 8);
          if (!rows.length) throw new Error("kb_smoke_no_rows");
          let checked = 0;
          let enriched = 0;
          let listingFallback = 0;
          let minImages = Number.POSITIVE_INFINITY;
          let maxImages = 0;
          for (const row of rows) {
            const offer = source.normalizeOffer(row);
            if (!offer) continue;
            const images = await source.fetchImages(offer);
            const carSeq = String(offer.sourceOfferId || "");
            if (!carSeq || !images.length) throw new Error(`kb_smoke_missing_gallery_${carSeq}`);
            for (const image of images) {
              const url = new URL(image.url);
              if (url.hostname !== "img.kbchachacha.com" || !url.pathname.includes(`/${carSeq}_`)) {
                throw new Error(`kb_smoke_cross_identity_${carSeq}`);
              }
            }
            checked += 1;
            minImages = Math.min(minImages, images.length);
            maxImages = Math.max(maxImages, images.length);
            if (offer.operational?.gallerySafetyMode === "kbchachacha_exact_product_gallery_car_seq_v1") enriched += 1;
            if (offer.operational?.gallerySafetyMode === "kbchachacha_exact_listing_card_car_seq_v1") listingFallback += 1;
          }
          const report = { pageCount: page.count, checked, enriched, listingFallback, minImages: Number.isFinite(minImages) ? minImages : 0, maxImages };
          console.log(JSON.stringify(report, null, 2));
          if (checked < 1) throw new Error("kb_smoke_checked_zero");
          TS
          npx tsx .kbchachacha-source-smoke.mts
          rm -f .kbchachacha-source-smoke.mts
