name: Catalog V6 · JPAuc result contract probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/catalog-v6-jpauc-result-contract-probe.yml"
      - "scripts/jpauc-result-contract-probe.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-v6-jpauc-result-contract-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe JPAuc completed result data without publishing
        run: node scripts/jpauc-result-contract-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpauc-result-contract-probe
          path: jpauc-result-contract-probe.json
          if-no-files-found: warn
          retention-days: 3
