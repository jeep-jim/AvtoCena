name: Verify hidden power30 calculator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/components/power30/**'
      - 'apps/web/lib/power30/**'
      - 'apps/web/app/api/power30/**'
      - 'apps/web/app/(public)/cars/30sec/**'
      - 'tests/power30.test.ts'
      - 'tests/browser/power30*'
      - '.github/workflows/verify-power30.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/power30.test.ts
      - run: npm install --prefix "$RUNNER_TEMP/power30-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Calculator interaction and responsive layout
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/power30-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/power30.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power30-browser
          path: artifacts/power30/*.png
          retention-days: 2
