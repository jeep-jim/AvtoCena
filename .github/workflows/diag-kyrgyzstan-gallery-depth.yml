name: Diagnose Kyrgyzstan gallery depth

on:
  push:
    branches: [diag/kg-gallery-depth-20260811]
    paths:
      - .github/workflows/diag-kyrgyzstan-gallery-depth.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      KG_GALLERY_DIAG_LIMIT: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/kg-gallery-depth-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only exact detail gallery diagnostic
        run: npx tsx scripts/diag-kyrgyzstan-gallery-depth.mts
      - uses: actions/upload-artifact@v4
        with:
          name: kg-gallery-depth-report
          path: kg-gallery-depth-report.json
          retention-days: 2
