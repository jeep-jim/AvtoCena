name: Knowledge CORE Korea Energy Agency snapshot

on:
  push:
    branches:
      - fix/catalog-core-recovery-20260822
    paths:
      - scripts/catalog-download-korea-energy-models.mjs
      - .github/workflows/knowledge-korea-energy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-core-source-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-core-recovery-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/catalog-download-korea-energy-models.mjs
        env:
          KNOWLEDGE_OUTPUT_ROOT: data/catalog/knowledge-source-snapshots/generated
      - name: Commit Korea energy model evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s data/catalog/knowledge-source-snapshots/generated/korea/energy-agency-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/catalog-core-recovery-20260822
          git rebase origin/fix/catalog-core-recovery-20260822
          git add data/catalog/knowledge-source-snapshots/generated/korea/energy-agency-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Snapshot Korea Energy Agency vehicle models"
          git push origin HEAD:fix/catalog-core-recovery-20260822
