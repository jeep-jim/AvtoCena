name: Catalog publication diagnosis
on:
  push:
    branches: [fix/catalog-complete-specifications-20260909]
    paths: ['.github/workflows/catalog-publication-diagnosis.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_PUBLICATION_DRY_RUN: '1'
      CATALOG_REBUILD_INPUT_DIR: catalog-intake-publish
      CATALOG_INTAKE_INPUT_DIR: catalog-intake-input
      CATALOG_PUBLISH_TARGET_PER_MARKET: '10000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_PRIORITY_MAX_TOTAL_RUB: '15000000'
      CATALOG_V2_HARD_MAX_TOTAL_RUB: '15000000'
      CATALOG_V2_PRIORITY_TARGET: '8000'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-intake-*
          path: catalog-intake-input
          run-id: 34248468346
          github-token: ${{ github.token }}
      - run: node --import tsx scripts/catalog-intake-to-publication.mjs
      - name: Diagnose six markets without publication
        run: |
          for market in korea china uae europe georgia japan; do
            CATALOG_REBUILD_MARKETS=$market CATALOG_REBUILD_PUBLISH_REPORT=catalog-diagnosis-$market.json node --import tsx scripts/catalog-publish-market.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-publication-diagnosis
          path: catalog-diagnosis-*.json

