name: Record feed storage checkpoint once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/record-feed-storage-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: record-feed-storage-checkpoint
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Append the verified checkpoint without changing earlier history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker = '## 16.11.2026 — первая новая выгрузка проверена в REG; очистка raw остаётся выключенной'
          path = Path('roadmap.md')
          before = path.read_bytes()
          entry = '''


          ## 16.11.2026 — первая новая выгрузка проверена в REG; очистка raw остаётся выключенной

          - PR1786 принят как 784887ab99c2bf522748937d95ca50f8e4f07c98. Точный head29b57760cd7b0a82459f30b089badcb10f07f280 прошёл все6workflow, включая CI43873941281:3247/3247tests, TypeScript и production build. Это source/tooling, весьmain на VM не устанавливался.
          - Фактический первый полный свежий own-storage цикл: UAE run43876472124, sourcef6d207361f6f5a484aaac89facfdf44274c0d8d4, collect job133331077561SUCCESS. Paid API завершён13:48:06.429UTC:1365pages,27285unique observed IDs,27733observations,675changes, rejectedIdentity0, source_finished/completed=true. Observed IDs не называются текущим количеством опубликованных машин. В13:54:23.167UTC own_intake_archive_verified:catalog/nonjp-intake/v1/uae/43876472124/1, manifestSHA256c2a52c95cdf6f0e8b2b9cde703e5fac037f0c7e90072a4b3b424520ba3c21b41. Helper проверил сохранённые bytes без supplier requests; publish job133344138242 отдельно успешно восстановил этот архив и выполнил conversion. Переключение public manifest этим checkpoint не подтверждается.
          - Запущены Europe43879552529 и Georgia43879552700 с marker commitb2fe8f29448dd9ae7cc2ac0525ff55dcf765d38d после проверки отсутствия активных прежних запусков. На14:00UTC Europe ещё в setup-node plan, Georgia в source collection. Штатные source switches, расписания, фотографии по URL и ограничения сохранены. China43753103164/attempt12/sourcef1a926e4de5df6502f764150115b8bf9e2a43dd3 не отменялся и не перезапускался. Японские источники не запускались.
          - F45 prepare-only43873810298/job133321530272 завершилсяFAIL13:50:51UTC: bounded lease wait остановлен shell timeout exit12413:50:40; last wait13:50:26 secondsRemaining1708,writes0. Candidate/private-after receipts produced:false; prepare/build/deploy skipped. Владелец lease из этого журнала не установлен. При последней root-проверке health сообщил HTTP200/ok=true, installed83ff17075e9188dcf227c8752dc064248d5f42e0/calculator4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90. Это не измерение общей скорости сайта. Korea repair43868009686 ранее закончился readonly deadline13:11:35 без plan/approval/apply; старые83/705receipts не применять после смены runtime.
          - Уточнено прежнее решение о raw runtime guard: дополнительный application successor ради producer slot не нужен. Exact83 и exactf45 отдельно исполнили по3actual negative tests: HTTP/importer не могут записать manifest, direct persistence отвергается доstorage; служебный import lock остаётся отдельной записью. Git-backed evidence лежит в docs/evidence. Единственный изолированный app candidate остаётсяf45/PR1783; его strict source/server/browser/nonce/context/rollback gates сохранены. Этот source audit не заменяет инвентаризацию реальных VM процессов и Actions.
          - Добавлены source-only независимые contribution proofs: actual paid input → conversion → normalization → internal/public bytes; Che168 full replica restore/SQLite integrity и все emitted rows, включая реальный повторный цикл без исходногоCSV. Borrowed fields, unknown source или source/producer mismatch сохраняют прежние dependencies. Private trusted source capabilities обязательны в обеих фазах; caller snapshot/verify, другой tracker и произвольный factory profile не дают права убрать старые roots. Generic reader проверяет сохранённые report/parts/chunks через bounded own-REG reads. Все encar-reports защищены до durable reader protocol, включая старые armed plans до любыхwrites.
          - Bounded S3 adapter и read-only acceptance проверяют точные REG endpoint/bucket/prefix, GET/LIST/HEAD, identity encoding, byte/deadline limits и metadata precision. Отдельный main-only diagnostic workflow имеет только read port, не регистрирует roots и не включаетGC; его live результат должен проверяться отдельно. Полныйbucket inventory, bootstrap, verified writer coverage, required policy и реальные raw DELETE этим выпуском не выполнены. Legacy inline Encar diagnostic закрывается при существующих policy/state; его self-push trigger удалён, чтобы изменениеworkflow не запускало дублирующий paid сбор. Обычный Korea cron не меняется.
          - Полная ротация ещё не готова: unknown nonempty internal source блокирует GC для всех roots, а не только своего рынка. Нужны terminal evidence старыхjobs, реальные current/previous/7pointers, полныйwriter/readers coverage и независимые input/materialization proofs остальных источников. Замороженный repair705 остаётся blocker, а не исключением. Общая persisted FX/settings/asOf authority и подготовка до её активации также остаются незавершённым этапом. Не выдавать code merge, mock tests или artifact archive за live price readiness либо завершённую автоматическую очистку.
          '''
          if marker.encode() not in before:
              addition = '\n'.join(line.removeprefix('          ') for line in entry.splitlines()) + '\n'
              with path.open('ab') as output:
                  output.write(addition.encode())
              after = path.read_bytes()
              assert after.startswith(before) and after.count(marker.encode()) == 1
          PY
          test -z "$(git diff --name-only -- . ':!roadmap.md')"
          if git diff --quiet -- roadmap.md; then exit 0; fi
          test "$(git diff --numstat -- roadmap.md | awk '{print $2}')" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          git commit -m 'docs: record actual owned feed archive and conservative raw rollout'
          git push origin HEAD:main
