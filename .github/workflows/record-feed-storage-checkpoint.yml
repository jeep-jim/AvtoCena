name: Record feed storage checkpoint once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/record-feed-storage-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: record-feed-storage-checkpoint
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Append the verified checkpoint without changing earlier history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker = '## 16.11.2026 — диск очищен; начат переход к подготовленной выдаче пяти рынков'
          path = Path('roadmap.md')
          before = path.read_bytes()
          entry = '''

          ## 16.11.2026 — диск очищен; начат переход к подготовленной выдаче пяти рынков

          - Новое прямое поручение владельца: выяснить 92% VM disk, очистить лишнее, продолжить ранее согласованное сохранение и предрасчёт всех неяпонских фидов в нашем REG Object Storage с обновлением по циклу. Япония исключена. Ранее согласованная ёмкость S3 — 1 TB; это отдельное хранилище от VM около102.9 GB. Фото остаются ссылками по прежнему решению. Не выдавать старые или несогласованные цены ради скорости.
          - Read-only inventory43842173449/133213291918 (c3df53d3) установил26 контейнеров,33 образа, около91.036GB в /var/lib/containerd. Непривязанные старые слои и остановленные копии занимали основной объём. Свежий повтор attempt2/job133221832336 в10:00UTC подтвердил все исходные fingerprints; временный diagnostic clone5111 уже отсутствовал. Число Docker reclaimable не использовалось как разрешение удалить всё.
          - Exact reviewed cleanup source5cff28c7b28fa73ad89f5f6be8a8347ea233f7eb, run43845182604/job133223446818 SUCCESS. Plan SHA256 dabf125648bc7b56562886bef911a56dd9a90a47d8462a21480975b67b67b00f. Удалены только9 остановленных контейнеров и20 образов; без force/prune/volumes/S3, под обоими VM locks. Освобождено48,180,248,576bytes; free8,350,244,864→56,530,493,440bytes. Все17 оставшихся контейнеров и13 образов, production fingerprint и Nginx сохранились. Current83, accepted a182, реальные463/17a и e4 evidence сохранены.
          - Независимый disk audit43809998612 attempt4/job133225091946 SUCCESS10:05:56UTC: total102,916,472,832, used46,369,923,072, available56,529,772,544bytes, df Use%=46% вместо92%. Public health10:05:37UTC HTTP200/ok=true, release83ff17075e9188dcf227c8752dc064248d5f42e0, calculation4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90. Это проверка после очистки, не заявление о более позднем выпуске.
          - Постоянная VM retention опубликована main2c1d37f42a316106ffaf748e8d9c087b6bd9774f после17 behavioral tests и root review: current/accepted baseline, две rollback-копии, две последние failed image groups и exact e4 hold; максимум16 контейнеров/16 образов; orphan требует точного app ownership, чужой generic OCI revision недостаточен. Динамический localhost health до/после, fingerprints/Nginx, оба flock и запрет работы во время release/trace сохранены. Новые builders должны добавлять org.opencontainers.image.source=https://github.com/jeep-jim/AvtoCena и avtocena.application=web. Не считать автоматическую очистку уже исполненной без нового run result.
          - Runtime PR1776: sourcee8462585e8998eaae5a003831a38d79263ca5649, treec9919c21927ba5f303524569a4df99ca0174a710, parent7f9165;31 reviewed paths относительно83,11 относительно7f. Calculation2a0a3eecd966a1c6a5ffed3760740983803ff172fcf023fc30aefbc102a6e4f2. Сохранены7f homepage и страховая история; добавлены готовые компактные бюджетные selectors и два узких dealer read улучшения. Все13 exact-head CI SUCCESS к10:24UTC; локально2886/2886 до последнего follow-up,24/24 после, final web TypeScript PASS. Fixture64,012 исходных/12 priced:65 полных частей→1 подготовленная, те же IDs/цены/facets/count/sort,0 visitor writes. Это fixture, не production timing. Кандидат ещё не активирован этим этапом.
          - Pipeline PR1777: source5c32bf66d94032171ecdeeb20693fc8c1789ae67, treeaa39dc6c582877e6c3b890cb31e0d5d3b474a9db,11 paths поверх3dbd519. Prepare exact installed calculator до mutable aliases, независимое чтение persisted budget/sort/selector, проверка полной immutable projection и eligible IDs, повтор перед каждым manifest CAS. Child не пишет offers/manifest/cursors/manual и не обращается к поставщикам; Япония исключена.33 профильных combined tests PASS; actual83 child отдельно11/11. На момент этой записи PR проходит CI, не считать main/VM установленными без merge/health evidence. Manual active-generation job и candidate-isolated overlay различают установленный runtime и тест кандидата.
          - Незакрытые части явно сохранены: при смене UTC дня, live CBR/stored rates, settings/effectiveFrom, manual seller price или China CNY anchors старый точный whole-market fallback ещё возможен. Нужна общая persisted pricing authority/asOf с подготовкой до активации нового контекста; нельзя просто увеличить TTL, подменить часы, отключить fallback или показывать неверные цены. Для candidate2a0a3e требуется собственная реальная S3 preparation/fresh readback, прежние4654 snapshots её не доказывают.
          - Raw rotation ещё не завершена: ordinary generation/internal cleanup защищает public/previous/nested refs, но не доказывает удаляемость provider-snapshots/replicas, intake-staging/encar и paid-encar-reports. China cursor хранит current replica без previous pointer; Encar checkpoint терял snapshotRun/Attempt; reports связаны с freshness всех current+previous offers. Следующий безопасный шаг — immutable generation provenance и loading pins, затем bounded unreachable-group plan. Удаления сырья по одному возрасту нет.
          - Продолжить один согласованный выпуск: подготовить exact candidate данные до старта, сохранить неизменные frozen server/browser/source/nonce/context/rollback gates и реальные insurance checks. Не выкладывать весь main, не повторять e4 без исправления, не менять эталоны. Параллельный7f controller и существующий China publisher43753103164 требуют проверки фактического terminal/resume; этот этап не запускал новый сбор и не дублировал их управление. Довести background pipeline, raw rotation и измерение рабочей выдачи, различая code/installed/live verification.
          '''
          if marker.encode() not in before:
              addition = '\n'.join(line.removeprefix('          ') for line in entry.splitlines()) + '\n'
              with path.open('ab') as output:
                  output.write(addition.encode())
              after = path.read_bytes()
              assert after.startswith(before) and after.count(marker.encode()) == 1
          PY
          test -z "$(git diff --name-only -- . ':!roadmap.md')"
          if git diff --quiet -- roadmap.md; then exit 0; fi
          test "$(git diff --numstat -- roadmap.md | awk '{print $2}')" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          git commit -m 'docs: record verified VM cleanup and prepared feed rollout'
          git push origin HEAD:main
