name: Record feed storage checkpoint once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/record-feed-storage-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: record-feed-storage-checkpoint
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Append the verified checkpoint without changing earlier history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker = '## 16.11.2026 — подтверждены поля поставщика Кореи; предрасчёт опубликован, выпуск остановлен проверкой ОАЭ'
          path = Path('roadmap.md')
          before = path.read_bytes()
          entry = '''

          ## 16.11.2026 — подтверждены поля поставщика Кореи; предрасчёт опубликован, выпуск остановлен проверкой ОАЭ

          - Фактическая автоматическая VM retention после завершённого release: run43852381418/job133247942091 SUCCESS, 16.11.2026 10:50:45UTC. Сохранены current/accepted, две rollback и две failed evidence groups; удалены11 остановленных копий и7 образов. Освобождено18,477,375,488bytes; итог used30,371,557,376/free72,528,138,240/total102,916,472,832bytes. Это отдельный второй запуск после ручной exact очистки48,180,248,576bytes. Не складывать free из разных моментов как независимую проверку без учёта фоновой записи.
          - Pipeline PR1777 исправил три устаревшие статические проверки без изменения их смысла. Final head3bea908bb07ed9dac7ea6790905f249d9edb58b6: все6 exact-head workflows SUCCESS, CI43850368447; локально3050/3050 tests PASS. PR слит в main33e07dc1f847be95f17cbba30cc9a4506a4b1d31. Будущие неяпонские публикации готовят budget/sort/компактные selectors на actual installed calculator и читают результат заново до mutable aliases и manifest CAS. Старый уже выполнявшийся China attempt12 этим изменением задним числом не обновляется.
          - Exact runtime e8462585e8998eaae5a003831a38d79263ca5649 по-прежнему НЕ принят на VM этим этапом. Первый controller b9f3647/run43852165044 остановился на transient45s health read до writes/build/activation. В ff9dac4c450e55953a5fede44a6047308b254764 добавлены ограниченные retries только transient transport/502/503/504 в source preflight,9 tests PASS; замороженные server/browser gates неизменны. Новый workflow зарегистрирован в release-speed-guard-contract и CI. Повтор43853845882/job133252961311 прошёл source/health/private index/history и остановился ДО candidate writes/build/VM switch: staged_budget_eligible_source_missing:uae. Причина несовпадения eligible projection IDs и сохранённого v3 selector исследуется; gate не ослаблять, shared selector вслепую не перестраивать.
          - Ответ поставщика новой Кореи проверен по реальным данным audit43852979549/job133250013080 SUCCESS10:58:09UTC: raw snapshot43570782014/1 и свежие два API detail совпали. ID42799484: бензин,998cm³,power76,power_ice_hp76; ID42760061: бензин,1598cm³,power193,power_ice_hp193,drive_type2WD. В current gen_1794665184205_cfd76b47 (69386 Korea) Morning fuel/engineCc/powerHp=null, Seltos fuel=petrol, engineCc/powerHp=null,drive=fwd. Manifest unchanged, storageWrites0, health83ff17075e9188dcf227c8752dc064248d5f42e0/calc4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90. Provider credential из пользовательского скриншота нигде не сохранять и не цитировать.
          - Причина в нашем paid restorer: power не передавался, source-exact evidence технических полей терялось при последующей normalization; generic2WD необоснованно становился fwd. PR1778 draft/head2135f01f179d803664a0d2cc518e793ac2fef273 содержит отдельный v3 mapper и raw provenance/pins,19 files, без приложения/расписаний/внешнего запуска.102 combined offline tests PASS; независимый raw review PASS, actuale846 mapping6 PASS. Дополнительный review нашёл coarse hybrid label vs exact series-hybrid trim false conflict; узкий follow-up требуется до merge. PR/source не означает исправленные production записи.
          - Raw provenance сохраняет producer IDs China snapshot/replica/journal и Korea run/attempt; по всем current Korea chunks находит ВСЕ используемые paid-report observations, включая заимствованные old-generation chunks. Loading/ready pins закрываются только после доказанного published manifest и совпадения roots/checksums; неизвестная historic provenance защищена. Пока нет активного raw DELETE. Разрабатывается общий CAS coordinator для producer claims, publication refs и GC deleting/deleted tombstones; нужна доказанная writer coverage и bounded inventory/executor, age не разрешает удаление.
          - Existing Korea исправлять только technical repair по CURRENT ID-set intersect pinned raw, сохраняя source prices/currency/freshness/media/status/manual/verified overrides; не replay старый импорт полностью и не воскрешать удалённые объявления. Проверять before/after digests, current manual/editorial revision и publication lease; cursor не продвигать; новые расчёты подготовить до cutover. Actual runtime определять после terminal release, не подменять calculator версиями.
          - Незакрытый этап прежний: общая persisted FX/settings/asOf authority для worker и VM и подготовка до её активации. Context miss fallback пока существует. Не заявлять мгновенную production выдачу на основании fixture или code merge. Япония исключена; новых JP/provider обходов, массового копирования фото и управления чужим China publisher не было.
          '''
          if marker.encode() not in before:
              addition = '\n'.join(line.removeprefix('          ') for line in entry.splitlines()) + '\n'
              with path.open('ab') as output:
                  output.write(addition.encode())
              after = path.read_bytes()
              assert after.startswith(before) and after.count(marker.encode()) == 1
          PY
          test -z "$(git diff --name-only -- . ':!roadmap.md')"
          if git diff --quiet -- roadmap.md; then exit 0; fi
          test "$(git diff --numstat -- roadmap.md | awk '{print $2}')" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          git commit -m 'docs: record actual Korea evidence and staged rollout checkpoint'
          git push origin HEAD:main
