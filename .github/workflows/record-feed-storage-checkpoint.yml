name: Record feed storage checkpoint once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/record-feed-storage-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: record-feed-storage-checkpoint
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Append the verified checkpoint without changing earlier history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker = "## 16.11.2026 — новая Корея запущена; фактические результаты хранения и оставшиеся ограничения"
          path = Path('roadmap.md')
          before = path.read_bytes()
          entry = '''

          ## 16.11.2026 — новая Корея запущена; фактические результаты хранения и оставшиеся ограничения
          
          - PR 1787 принят как 7c3839a2816d6248ede2b9dd24225df32b808a81. Его точный head 3f3e65e41504d0224d20732badc21ed51eb6f40c прошёл все шесть workflow; CI 43888743269 — 3360/3360 tests, web/engine TypeScript и production build. Это исходники и инструменты обработчиков; весь main на VM не устанавливался. Первые два отказа общего CI устранены изоляцией точного checkout в тестах; рабочая проверка происхождения исходников не ослаблена. История первого browser-scroll отказа и одного успешного повторного запуска сохранена в PR.
          - После проверки отсутствия активного Korea refresh опубликован только marker .github/market-runs/korea-refresh.json: commit 95a61b0a146b1b851650f059ff1ca492bd65177f, parent ef7d2ae2102529ae196535482b5e420814ec440d. Новый run 43891050994 создан 14:56:19 UTC; plan 133382015938 подтвердил run=true, paid_source_due, encar_feed и controlsRevision 15. collect_initial 133382776045 действительно перешёл к получению нового полного snapshot. В снимке Actions 16:06:31 UTC collector всё ещё in_progress. Итоги полного сбора, подготовки и публикации пока не подтверждены. Используются исправления supplier displacement_cc/displacement, power и неоднозначного 2WD; manual specs, source switches и расписания сохранены.
          - Проверка поставщика (run 43852979549) ранее сопоставила saved raw и свежие ответы для ID 42799484/42760061: 998 см³/76 л.с. и 1598 см³/193 л.с.; в старых опубликованных карточках часть полей терялась. Наличие исправленного mapper в исходниках не означает уже выполненный repair старого каталога. Repair run 43868009686 завершился readonly deadline без plan/approval/apply; после смены runtime требуется новый план на точном установленном SHA/calculator.
          - UAE run 43876472124 действительно завершил полный сбор: 1365 pages, 27285 unique observed IDs, 27733 observations, 675 changes, rejectedIdentity=0. В REG сохранён и перечитан catalog/nonjp-intake/v1/uae/43876472124/1, manifest SHA256 c2a52c95cdf6f0e8b2b9cde703e5fac037f0c7e90072a4b3b424520ba3c21b41. Publisher восстановил собственный архив и выполнил conversion; переключение public manifest этим счётчиком не подтверждается.
          - Georgia run 43879552700 завершил collection в 14:40:01.786 UTC с qualityStatus=partial: MyAuto blocked (upstream 403), Autopapa list_failed после трёх ошибок страницы 850 (bridge 502). Сохранены 1030 observations; 14:44:24 UTC подтверждено own_intake_archive_verified, root catalog/nonjp-intake/v1/georgia/43879552700/1, manifest SHA256 40ab748d258191e555db7aa54b3d996548ad68732329ef3a6802f9cd3a94b654. Проверенный архив неполного сбора не является полной заменой рынка и не даёт права удалить прежние зависимости.
          - Europe run 43879552529 завершил настроенные маршруты Mobile.de и AutoScout 14:56:41.207 UTC с qualityStatus=configured_routes_finished. Отчёты содержат 30752+3630=34382 observations; это не число опубликованных машин и не вся мировая база поставщиков. В 15:25:50.113 UTC подтверждено own_intake_archive_verified: catalog/nonjp-intake/v1/europe/43879552529/1, manifest SHA256 f1fc5e1f59a39036053b7530010b5ff18ec3244e41c9ed1daa7a20b4c750ebc5. В отчётах сохранены отдельные HTTP errors; publisher 133400799198 успешно прошёл восстановление собственного архива и перешёл к guarded publication; итоговая публикация ещё не подтверждена. China run 43753103164 / attempt 12 / source f1a926e4de5df6502f764150115b8bf9e2a43dd3 не отменялся и не перезапускался; его publisher 133235321361 остаётся отдельным старым процессом. Японские источники не запускались, новые dump/provider requests для Японии не добавлялись. Фотографии остаются URL.
          - Первый readonly storage run 43890601103 остановился до LIST на raw_storage_check_saved_receipt_changed с storageWrites=0/deleteRequests=0. Причина подтверждена exact producer 6a720ec3aa4823ef2808848018bc5b877fb520ad: complete.json имеет только pages/count/completedAt. Проверка ошибочно требовала современную обёртку. Исправление PR 1788 закрепляет ровно три ключа и значения 10270/205385/2026-11-14T12:55:40.904Z; root 43570782014/1 фиксирован. Отчёт об отказе содержит только разрешённые метаданные; unchanged=null до реального повторного чтения controls. PR 1788 принят как c7674b9f4f16fffdd8f8fab689d440ea95701de8; CI 43893556562 — 3363/3363 tests, types и build. Run 43895497703 подтвердил исходный receipt, затем остановился на неизвестном XML field. PR 1789 / merge 00ec523ee1a03349743e2e3bacd317d1af106420 / CI 43898654996 (3367/3367) добавил ограниченную диагностику; run 43900268300 достоверно установил тег Contents/Type. PR 1790 / merge d76ae8fdee208d67381a04ea505c8f57e494ff13 / CI 43901272027 (3369/3369, types/build) принимает только отсутствующий Type либо единственный scalar Normal; другие типы и malformed fields отклоняются. Итоговый run 43903729901 / job 133426870488 в 16:06:41.596 UTC завершился BLOCKED с head_list_metadata_mismatch: 6 GET + 2 LIST + 4 HEAD, 2702 bytes response body, ноль PUT/POST/storageWrites/deleteRequests. У четырёх объектов ETag и size совпали; LIST сохранил миллисекунды (.380/.211/.829/.607), HEAD сообщил соответствующую целую секунду (.000). Точность не округлялась ради прохождения: live acceptance пока не пройдена. Policy и registry отсутствуют, повторное чтение подтвердило unchanged=true. Прямое чтение lease в 16:06:35.483 UTC подтвердило active catalog_v3_publish_china, heartbeat 16:03:57.090 UTC, lockedUntil 16:33:57.090 UTC; Проверка lease не изменяла. Это проверка четырёх объектов фиксированного root, не полный bucket inventory. Фактические ограниченные отчёты сохранены в docs/evidence/2026-11-16-raw-storage-readonly.json.
          - Последний успешный ответ health 16:05:22 UTC: HTTP 200, ok=true, release 83ff17075e9188dcf227c8752dc064248d5f42e0, calculator 4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90. Это подтверждение версии в этот момент, не приёмка общей скорости сайта. F45/PR 1783 остаётся единственным изолированным app candidate; prepare-only run 43873810298 завершился FAIL в 13:50:51 UTC после lease wait/exit124, candidate preparation/build/deploy skipped. Эти source/tooling merges не устанавливали новое приложение.
          - Очистка VM и ограниченное хранение старых Docker-копий ранее выполнены; run 43852381418 подтвердил 72528138240 bytes свободного места. Это системный диск VM, отдельно от owner-stated 1000 GB REG storage и 200 GB резерва.
          - Raw GC и DELETE не включались. Для UAE/Europe/Georgia собственные archive/restore и общий проверяющий reader уже есть, но независимые input → transformations → materialized rows proofs ещё не подключены: private contribution authority допускает только reviewed paid Encar/Che168. Их отсутствие сохраняет прежние roots и неопределённую историю. Actual writer coverage, terminal evidence старых policy-off процессов и зависимости current/previous/internal/семи pointers остаются обязательны. Проверяющий internal protocol уже существует; blocker — неизвестное происхождение конкретных источников, а не любой непустой internal каталог. Все encar-reports защищены до durable reader protocol. Полная ротация остаётся незавершённой.
          - Подготовка цен staged catalog до переключения manifest уже реализована через точный runtime/calculator. Общая сохраняемая authority курсов/настроек/asOf и подготовка до её отдельного переключения остаются незавершённым этапом: fingerprint ещё использует текущий UTC day процесса, а live rates могут обновляться отдельно. В f45 уже исправлено различие эквивалентных cbr_live/cbr и влияние исторических полей графика; это не открытый blocker. Ускорение всех кликов, отсутствие первого пересчёта при смене даты/курсов/настроек и live performance acceptance пока не подтверждены.
          
          '''
          if marker.encode() not in before:
              addition = '\n'.join(line.removeprefix('          ') for line in entry.splitlines()) + '\n'
              with path.open('ab') as output:
                  output.write(addition.encode())
              after = path.read_bytes()
              assert after.startswith(before) and after.count(marker.encode()) == 1
          PY
          test -z "$(git diff --name-only -- . ':!roadmap.md')"
          if git diff --quiet -- roadmap.md; then exit 0; fi
          test "$(git diff --numstat -- roadmap.md | awk '{print $2}')" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          git commit -m 'docs: record actual owned feed archive and conservative raw rollout'
          git push origin HEAD:main

