name: Record feed storage checkpoint once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/record-feed-storage-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: record-feed-storage-checkpoint
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Append the verified checkpoint without changing earlier history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker = '## 16.11.2026 — восстановление выгрузок и общие блокировки подготовлены; удаление фидов выключено'
          path = Path('roadmap.md')
          before = path.read_bytes()
          entry = '''

          ## 16.11.2026 — восстановление выгрузок и общие блокировки подготовлены; удаление фидов выключено

          - Продолжена задача владельца: сохранять пять неяпонских источников в собственном REG, готовить данные до выдачи и удалять только доказанно неиспользуемые старые выгрузки. Япония исключена. Сохраняются 1000 GB общей ёмкости, резерв 200 GB, URLs фотографий, обычные источники и сроки обновлений.
          - Исправлен фактический путь восстановления в catalog-market-refresh: используется CATALOG_INTAKE_INPUT_DIR. Уже архивированный input не редактируется на месте: проверяется исходный архив, создаётся отдельная рабочая копия, прежние bytes/receipt/journal сохраняются, dependencies и handoff переходят в новый отчёт. Это необходимо для повторной обработки после истечения GitHub artifact.
          - Добавлены выключенные по умолчанию raw producer/read sessions: writing claim не передаётся другому процессу, seal ждёт все начатые I/O, после неоднозначной записи остаются pending references. Общий CAS теперь учитывает также catalog/internal/manifest.json как седьмой pointer, поскольку эти строки используются следующей публикацией. Приложение проверяет реальные reservations до internal/public CAS; произвольного callback недостаточно. Cursor/config commits и settled receipts связаны с тем же registry. При отсутствующих policy и registry каждый session делает только два контрольных чтения, а последующие 100 PUT не добавляют coordinator reads.
          - Добавлен bounded raw GC executor с режимом plan по умолчанию, точной REG namespace, полными inventory/receipt/ETag proofs, CAS ownership, per-key подтверждениями и постоянными tombstones. В этой контрольной точке реальные DELETE, bootstrap, verified coverage и required policy НЕ включены. Nonempty internal lineage по первому контракту остаётся unknown: одного checksum или complete=true от вызывающего кода недостаточно. Исполнитель не может удалить такие зависимости. Реальный bounded S3 adapter и независимые contribution proofs готовятся отдельно.
          - Перенесены закрывающие scripts/tests для isolated prepared-source supplement: три недостающих UAE ID должны получать реальные immutable card/replay объекты; выдуманные block references и исключение машин из проверки покрытия не допускаются. Source candidate a2610af5f5f88afa11c53989ddff1684f28e344a прошёл все 13 exact-source workflows, включая CI43865728506, но НЕ установлен. Для final successor добавляется внутренний raw guard; требуются новый calculator, точная подготовка и неизменная server/browser/SHA/nonce/rollback приёмка. Весь main не устанавливать.
          - Проверено локально: raw lifecycle 218/218, bounded GC с pure contracts 77/77; независимый executor review 26/26. Root integration TypeScript PASS, preparation/write guards 14/14, preservation/runtime gates 36/36. Два устаревших статических теста приведены к фактической форме guard без изменения запретов записи или порядка проверок; полный CI на точном PR head обязателен перед merge.
          - Фактическое состояние на 16.11.2026 13:04 UTC: repair43868009686/job133301474946 ждёт освобождения import lease, controller18037b935b26711a4ce23e1b674bf59e98c6363c/source7052907fb11d58ff919be11a43747d43df01b41e. Реального plan artifact, approval и apply ещё нет. Старый наш readonly waiter43866071844 отменён до plan/apply после проверки точной идентичности; active China43753103164 attempt12/job133235321361 не отменялся и не перезапускался. Supplier sample998/76 и1598/193 уже подтверждён сохранённым raw и двумя detail; merge mapper не является исправлением опубликованных карточек.
          - Общая persisted FX/settings/asOf authority и подготовка до смены расчётного контекста остаются отдельным незакрытым этапом. Нельзя объявлять мгновенную production выдачу по локальным fixtures или зелёному CI. Удаление старых фидов разрешается только после реальной полноты dependencies, покрытия всех writers, принятого replacement и проверенного плана.
          '''
          if marker.encode() not in before:
              addition = '\n'.join(line.removeprefix('          ') for line in entry.splitlines()) + '\n'
              with path.open('ab') as output:
                  output.write(addition.encode())
              after = path.read_bytes()
              assert after.startswith(before) and after.count(marker.encode()) == 1
          PY
          test -z "$(git diff --name-only -- . ':!roadmap.md')"
          if git diff --quiet -- roadmap.md; then exit 0; fi
          test "$(git diff --numstat -- roadmap.md | awk '{print $2}')" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          git commit -m 'docs: record verified raw sessions and pending storage rollout'
          git push origin HEAD:main
