name: One-shot Europe AutoScout HQ live probe

on:
  push:
    branches:
      - ops/europe-autoscout-hq-refresh-20260814
    paths:
      - .github/workflows/oneshot-europe-autoscout-hq-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-autoscout-hq-refresh-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe exact listing-bound HQ galleries
        run: npx tsx scripts/oneshot-europe-autoscout-hq-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-autoscout-hq-probe
          path: europe-autoscout-hq-probe.json
          if-no-files-found: error
          retention-days: 3
