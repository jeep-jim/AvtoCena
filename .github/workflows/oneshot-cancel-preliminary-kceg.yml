name: One-shot cancel stale preliminary KCEG writer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-cancel-preliminary-kceg.yml"

permissions:
  actions: write
  contents: write

jobs:
  cancel-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cancel stale preliminary writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/31361354007 --jq .status)"
          echo "status_before=$status"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ] || [ "$status" = "pending" ]; then
            gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/31361354007/cancel
          fi
      - name: Remove one-shot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-cancel-preliminary-kceg.yml
          git commit -m 'Remove stale-writer cancellation one-shot [skip actions]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
