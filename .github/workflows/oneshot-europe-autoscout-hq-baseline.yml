name: One-shot Europe AutoScout HQ baseline

on:
  push:
    branches:
      - ops/europe-autoscout-hq-refresh-20260814
    paths:
      - .github/workflows/oneshot-europe-autoscout-hq-baseline.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-autoscout-hq-refresh-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static HQ gallery regression tests
        run: node --import tsx --test tests/catalog-autoscout-hq-gallery.test.ts
      - name: Baseline current production storage and writer safety
        run: npx tsx scripts/oneshot-europe-autoscout-hq-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-autoscout-hq-baseline
          path: europe-autoscout-hq-baseline.json
          if-no-files-found: error
          retention-days: 3

# Fresh read-only verification after the completed HQ refresh.
