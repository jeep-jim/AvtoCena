name: Catalog live recovery · Georgia via Yandex
run-name: Guarded Georgia Yandex recovery · ${{ github.sha }} · apply=${{ inputs.apply }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Persist a new full catalog generation after the strict dry-run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  GEORGIA_YANDEX_ROUTE: https://avtocena.com/api/internal/georgia-recovery-e2f913
  GEORGIA_YANDEX_PAGES_PER_SHARD: "20"
  GEORGIA_YANDEX_MIN_FRESH: "1000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  RECOVERY_PUBLISH_MAX: "5000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Yandex recovery and publication contracts
        run: |
          node --check scripts/catalog-georgia-yandex-merge.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --import tsx --test tests/catalog-georgia-yandex-recovery-workflow.test.ts tests/georgia-canonical-source-policy-20260812.test.ts tests/catalog-recovery-preservation-hardening.test.ts

  strict-preflight:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require a clean six-market baseline before Georgia collection
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-preflight.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-georgia-yandex-preflight
          path: catalog-georgia-yandex-preflight.json
          if-no-files-found: warn
          retention-days: 3

  collect:
    needs: strict-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [myauto, autopapa]
        startPage: [1, 21, 41, 61, 81, 101, 121, 141, 161, 181, 201, 221, 241, 261, 281]
    steps:
      - name: Fetch a canonical listing-bound shard through Yandex runtime
        shell: bash
        run: |
          set -euo pipefail
          output="snapshot-${{ matrix.source }}-${{ matrix.startPage }}.json"
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 -fsS \
            "${GEORGIA_YANDEX_ROUTE}?source=${{ matrix.source }}&pages=${GEORGIA_YANDEX_PAGES_PER_SHARD}&startPage=${{ matrix.startPage }}" \
            -o "$output"
          node - "$output" "${{ matrix.source }}" "${{ matrix.startPage }}" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSource, expectedStart] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (doc.market !== 'georgia' || !Array.isArray(doc.offers)) throw new Error('georgia_yandex_bad_snapshot');
          if (String(doc.report?.source || '') !== expectedSource) throw new Error(`georgia_yandex_source_mismatch:${doc.report?.source}:${expectedSource}`);
          if (Number(doc.report?.startPage || 0) !== Number(expectedStart)) throw new Error(`georgia_yandex_start_mismatch:${doc.report?.startPage}:${expectedStart}`);
          if (Number(doc.report?.pagesPerSource || 0) !== 20) throw new Error(`georgia_yandex_page_span_mismatch:${doc.report?.pagesPerSource}`);
          console.log({ source: expectedSource, startPage: Number(expectedStart), count: doc.offers.length, imageStats: doc.report?.imageStats, rejected: doc.report?.rejected });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: georgia-yandex-shard-${{ matrix.source }}-${{ matrix.startPage }}
          path: snapshot-${{ matrix.source }}-${{ matrix.startPage }}.json
          retention-days: 3

  merge:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: georgia-yandex-shard-*
          path: georgia-yandex-shards
          merge-multiple: true
      - name: Merge exact sourceOfferId shards and reject cross-listing image contamination
        env:
          GEORGIA_YANDEX_INPUT_DIR: georgia-yandex-shards
          GEORGIA_YANDEX_OUTPUT: catalog-rebuild-georgia.json
          GEORGIA_YANDEX_REPORT: catalog-georgia-yandex-merge-report.json
        run: node scripts/catalog-georgia-yandex-merge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-yandex-recovery-georgia
          path: |
            catalog-rebuild-georgia.json
            catalog-georgia-yandex-merge-report.json
          retention-days: 3

  dry-run:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-yandex-recovery-georgia
          path: recovery-input
      - name: Snapshot all six markets immediately before dry-run
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Dry-run Georgia replacement inside the full six-market state
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-georgia-yandex-dry-run.json
          RECOVERY_BATCH_DRY_RUN: "true"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Require no Georgia shrink and exact untouched-market preservation plan
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('catalog-georgia-yandex-before.json','utf8'));
          const dry = JSON.parse(fs.readFileSync('catalog-georgia-yandex-dry-run.json','utf8'));
          const merged = JSON.parse(fs.readFileSync('recovery-input/catalog-georgia-yandex-merge-report.json','utf8'));
          if (dry.dryRun !== true || dry.published !== false) throw new Error('georgia_yandex_expected_dry_run');
          const georgia = dry.byMarket?.georgia;
          if (!georgia) throw new Error('georgia_yandex_missing_dry_market');
          if (Number(merged.freshCount || 0) < 1000) throw new Error(`georgia_yandex_fresh_floor:${merged.freshCount}`);
          if (Number(georgia.incomingCount || 0) < 1000) throw new Error(`georgia_yandex_incoming_floor:${georgia.incomingCount}`);
          if (Number(georgia.count || 0) < Number(before.markets?.georgia?.count || 0)) throw new Error(`georgia_yandex_would_shrink:${georgia.count}:${before.markets?.georgia?.count}`);
          if (Number(georgia.imageStats?.belowMinimum || 0) !== 0 || Number(georgia.imageStats?.min || 0) < 5) throw new Error('georgia_yandex_dry_photo_gate');
          if (Number(georgia.maxOffersPerModelYear || 0) !== 20) throw new Error(`georgia_yandex_quota_contract:${georgia.maxOffersPerModelYear}`);
          for (const source of ['myauto_georgia_list','autopapa_georgia_open']) {
            if (!(Number(georgia.sourceCounts?.[source] || 0) > 0)) throw new Error(`georgia_yandex_missing_source:${source}`);
          }
          for (const market of ['korea','china','japan','uae','europe']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const planned = Number(dry.preservedByMarket?.[market] || 0);
            if (planned !== expected) throw new Error(`georgia_yandex_preservation_count:${market}:${planned}:${expected}`);
            if (!String(dry.preservedPublicHashByMarket?.[market] || '')) throw new Error(`georgia_yandex_preservation_hash_missing:${market}`);
          }
          console.log({ fresh: merged.freshCount, candidate: georgia.count, incoming: georgia.incomingCount, retained: georgia.retainedCount, sourceCounts: georgia.sourceCounts, imageStats: georgia.imageStats });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-georgia-yandex-dry-run
          path: |
            catalog-georgia-yandex-before.json
            catalog-georgia-yandex-dry-run.json
            recovery-input/catalog-georgia-yandex-merge-report.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: dry-run
    if: inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-yandex-recovery-georgia
          path: recovery-input
      - name: Recheck strict all-seven baseline immediately before persistence
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-publish-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Publish Georgia while preserving the other six public snapshots exactly
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-georgia-yandex-publish.json
          RECOVERY_BATCH_DRY_RUN: "false"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Strict post-persist six-market audit
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-publish-after.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Assert Georgia quality and untouched-market counts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('catalog-georgia-yandex-publish-before.json','utf8'));
          const after = JSON.parse(fs.readFileSync('catalog-georgia-yandex-publish-after.json','utf8'));
          const publish = JSON.parse(fs.readFileSync('catalog-georgia-yandex-publish.json','utf8'));
          if (publish.published !== true || !publish.generationId) throw new Error('georgia_yandex_publish_missing_generation');
          if (Number(publish.byMarket?.georgia?.imageStats?.belowMinimum || 0) !== 0) throw new Error('georgia_yandex_publish_sparse_images');
          for (const market of ['korea','china','japan','uae','europe']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const actual = Number(after.markets?.[market]?.count || 0);
            if (actual !== expected) throw new Error(`georgia_yandex_post_count:${market}:${actual}:${expected}`);
          }
          const g = after.markets?.georgia || {};
          if (Number(g.belowMarketMinYearCount || 0) !== 0) throw new Error(`georgia_yandex_post_age:${g.belowMarketMinYearCount}`);
          if (Number(g.nonVehicleCount || 0) !== 0) throw new Error(`georgia_yandex_post_nonvehicle:${g.nonVehicleCount}`);
          if (Number(g.belowFiveImagesCount || 0) !== 0) throw new Error(`georgia_yandex_post_images:${g.belowFiveImagesCount}`);
          if (Number(g.invalidIdentityCount || 0) !== 0 || Number(g.renderedIdentityFailureCount || 0) !== 0) throw new Error('georgia_yandex_post_identity');
          if (Number(g.maxPerExactModelYear || 0) > 20) throw new Error(`georgia_yandex_post_quota:${g.maxPerExactModelYear}`);
          console.log({ generationId: publish.generationId, georgia: g, preservedByMarket: publish.preservedByMarket });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-georgia-yandex-publish
          path: |
            catalog-georgia-yandex-publish-before.json
            catalog-georgia-yandex-publish.json
            catalog-georgia-yandex-publish-after.json
          if-no-files-found: warn
          retention-days: 7
