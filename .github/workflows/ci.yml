name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Customs tests
        run: node --import tsx --test tests/russia-customs.test.ts
      - name: Power normalization tests
        run: node --import tsx --test tests/catalog-power-normalization.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
