name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Customs tests
        run: node --import tsx --test tests/russia-customs.test.ts
      - name: Catalog calculation integrity tests
        run: node --import tsx --test tests/catalog-calculation-integrity.test.ts
      - name: CRM market defaults and live pricing tests
        run: node --import tsx --test tests/market-defaults-and-live-pricing.test.ts
      - name: Full seven-market pricing tests
        run: node --import tsx --test tests/catalog-full-market-pricing.test.ts
      - name: Price trend direction tests
        run: node --import tsx --test tests/price-trend-direction.test.ts
      - name: Catalog image quality tests
        run: node --import tsx --test tests/catalog-image-quality.test.ts
      - name: Catalog source-scale tests
        run: node --import tsx --test tests/catalog-source-scale.test.ts
      - name: Catalog live sources v23 tests
        run: node --import tsx --test tests/catalog-live-sources-v19.test.ts
      - name: Guazi China RU listing tests
        run: node --import tsx --test tests/guazi-ru-source.test.ts
      - name: MyAuto Georgia listing tests
        run: node --import tsx --test tests/myauto-list-source.test.ts
      - name: Catalog probe v23 tests
        run: node --import tsx --test tests/catalog-probe-source-shard.test.ts
      - name: Catalog publication gate tests
        run: node --import tsx --test tests/catalog-publication-gate.test.ts
      - name: Open source model normalization tests
        run: node --import tsx --test tests/open-source-normalizer.test.ts
      - name: Power normalization tests
        run: node --import tsx --test tests/catalog-power-normalization.test.ts
      - name: Public 30-minute power display tests
        run: node --import tsx --test tests/catalog-power-display.test.ts
      - name: Estimated EV publication tests
        run: node --import tsx --test tests/catalog-estimated-power-publication.test.ts
      - name: Vehicle knowledge and model search tests
        run: node --import tsx --test tests/vehicle-knowledge.test.ts
      - name: Live offer display enrichment tests
        run: node --import tsx --test tests/catalog-display-enrichment.test.ts
      - name: Drom generation and horsepower parser tests
        run: node --import tsx --test tests/drom-vehicle-knowledge.test.ts
      - name: Validate catalog automation scripts
        run: node --check scripts/catalog-configure-source-limits.mjs && node --check scripts/catalog-daily-full.mjs && node --check scripts/catalog-daily-incremental.mjs && node --check scripts/catalog-reindex-vehicle-knowledge.mjs && node --check scripts/catalog-rebuild-market.mjs && node --check scripts/catalog-publish-fresh.mjs && node --check scripts/catalog-business-audit.mjs && node --check scripts/catalog-sync-vehicle-knowledge-seed.mjs && node --check scripts/catalog-probe-source-shard.mjs && node --check scripts/catalog-rebuild-source-shard.mjs && node --check scripts/catalog-validate-source-scale.mjs && node --check scripts/catalog-publish-source-scale.mjs
      - name: Web typecheck diagnostics
        id: web_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false > web-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat web-typecheck.log
          exit $code
      - name: Upload web typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-log
          path: web-typecheck.log
      - name: Fail on web typecheck errors
        if: steps.web_typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Engine typecheck
        run: npm --workspace=@avtocena/engine exec tsc -- --noEmit
      - name: Production build diagnostics
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > production-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat production-build.log
          exit $code
      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: production-build.log
      - name: Fail on production build errors
        if: steps.production_build.outputs.exit_code != '0'
        run: exit 1

  catalog_candidate_smoke:
    name: Candidate smoke ${{ matrix.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: china
            sources: che168_dealer_exact,sohu_auto_china_open,guazi_china_export,guazi_china_ru
          - market: japan
            sources: goonet_japan_exact,goonet_japan,tcv_japan_open,carvector_japan_stat_open,japan_partner_open
          - market: georgia
            sources: auto_georgia_open
    env:
      JSON_STORAGE_DRIVER: local
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "4"
      CATALOG_MAX_IMAGES_PER_OFFER: "6"
      CATALOG_GALLERY_FAST_PATH: "true"
      CATALOG_SOURCE_TIMEOUT_MS: "18000"
      CATALOG_IMAGE_TIMEOUT_MS: "12000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      SMOKE_MARKET: ${{ matrix.market }}
      SMOKE_SOURCE_IDS: ${{ matrix.sources }}
      SMOKE_OUTPUT: candidate-smoke-${{ matrix.market }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build one fully publishable live card
        shell: bash
        run: |
          cat > /tmp/catalog-candidate-smoke.mjs <<'NODE'
          import fs from "node:fs/promises";
          const { catalogImportSources } = await import(`${process.cwd()}/apps/web/lib/catalog/importer.ts`);
          const { credibleCatalogImages, isCrediblePublicOffer } = await import(`${process.cwd()}/apps/web/lib/catalog/offer-quality.ts`);
          const { normalizeVehicleOfferSpecs } = await import(`${process.cwd()}/apps/web/lib/catalog/spec-normalization.ts`);
          const { calculateOfferWithRussiaCustoms } = await import(`${process.cwd()}/apps/web/lib/catalog/customs-pricing.ts`);
          const sourceIds = String(process.env.SMOKE_SOURCE_IDS || "").split(",").map((value) => value.trim()).filter(Boolean);
          const market = process.env.SMOKE_MARKET;
          const attempts = [];
          let valid = null;
          for (const sourceId of sourceIds) {
            const source = catalogImportSources.find((row) => row.sourceId === sourceId);
            if (!source) { attempts.push({sourceId,stage:"source",error:"missing"}); continue; }
            let fetched;
            try { fetched = await source.fetchPage(null); }
            catch (error) { attempts.push({sourceId,stage:"list",error:String(error?.message||error)}); continue; }
            const rows = Array.isArray(fetched?.items) ? fetched.items.slice(0, 6) : [];
            for (const raw of rows) {
              let offer;
              try { offer = source.normalizeOffer(raw); } catch (error) { attempts.push({sourceId,stage:"normalize",error:String(error?.message||error)}); continue; }
              if (!offer || offer.market !== market) continue;
              const before = {make:offer.make,model:offer.model,trim:offer.trim,powerHp:offer.powerHp,engineCc:offer.engineCc,fuel:offer.fuel};
              try {
                let gallery = credibleCatalogImages(offer.images || []);
                if ((gallery.length < 4 || !Number(offer.powerHp || 0) || !Number(offer.engineCc || 0)) && source.fetchImages) {
                  gallery = credibleCatalogImages([...gallery, ...((await source.fetchImages(offer)) || [])]);
                }
                const now = new Date().toISOString();
                offer = normalizeVehicleOfferSpecs({...offer,status:"active",images:gallery,updatedAt:now,operational:{...offer.operational,fullRebuildAt:now,galleryVerified:true,galleryImageCount:gallery.length,gallerySourceImageCount:gallery.length,galleryPreferredCount:6,galleryPreferredReached:gallery.length>=6,galleryRebuiltFrom:"fresh_listing",seoEligible:gallery.length>=4}});
                const calculated = normalizeVehicleOfferSpecs(await calculateOfferWithRussiaCustoms(offer));
                const ok = isCrediblePublicOffer(calculated);
                attempts.push({sourceId,id:calculated.id,before,after:{make:calculated.make,model:calculated.model,powerHp:calculated.powerHp,engineCc:calculated.engineCc,fuel:calculated.fuel,powerSource:calculated.powerDataSource,totalRub:calculated.totalRub,calculationStatus:calculated.calculationStatus},images:gallery.length,ok});
                if (ok) { valid = calculated; break; }
              } catch (error) { attempts.push({sourceId,id:offer?.id,before,stage:"prepare",error:String(error?.message||error)}); }
            }
            if (valid) break;
          }
          const report = {market,sourceIds,valid:Boolean(valid),validId:valid?.id || null,validSourceId:valid?.sourceId || null,validImages:valid?.images?.length || 0,validTotalRub:valid?.totalRub || null,attempts};
          await fs.writeFile(process.env.SMOKE_OUTPUT, JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if (!valid) throw new Error(`no_publishable_candidate_${market}`);
          NODE
          npx tsx /tmp/catalog-candidate-smoke.mjs
      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-smoke-${{ matrix.market }}
          path: ${{ env.SMOKE_OUTPUT }}
          if-no-files-found: warn
