name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Customs tests
        run: node --import tsx --test tests/russia-customs.test.ts
      - name: Catalog calculation integrity tests
        run: node --import tsx --test tests/catalog-calculation-integrity.test.ts
      - name: CRM market defaults and live pricing tests
        run: node --import tsx --test tests/market-defaults-and-live-pricing.test.ts
      - name: CRM market settings save tests
        run: node --import tsx --test tests/business-settings.test.ts tests/crm-market-settings-route.test.ts
      - name: Full seven-market pricing tests
        run: node --import tsx --test tests/catalog-full-market-pricing.test.ts
      - name: Price trend direction tests
        run: node --import tsx --test tests/price-trend-direction.test.ts
      - name: Catalog UI state tests
        run: node --import tsx --test tests/catalog-ui-neutral-preliminary-20260812.test.ts
      - name: Yandex Metrika installation tests
        run: node --import tsx --test tests/yandex-metrika.test.ts
      - name: Catalog image quality tests
        run: node --import tsx --test tests/catalog-image-quality.test.ts tests/catalog-gallery-storage-contract.test.ts tests/goonet-listing-bound-gallery.test.ts tests/carused-gallery-sanitization.test.ts
      - name: Public image proxy tests
        run: node --import tsx --test tests/catalog-public-image-proxy.test.ts
      - name: Catalog source-scale tests
        run: node --import tsx --test tests/catalog-source-scale.test.ts
      - name: Catalog production hardening tests
        run: node --import tsx --test tests/storage.test.ts tests/catalog-production-hardening.test.ts tests/catalog-v2-market-recovery.test.ts tests/catalog-v6-shared-publish-lock.test.ts tests/catalog-operations.test.ts tests/catalog-source-retention.test.ts tests/catalog-current-pipeline-contract.test.ts
      - name: Catalog market preflight parity tests
        run: |
          node --import tsx --test \
            tests/catalog-calculation-integrity.test.ts \
            tests/catalog-image-quality.test.ts \
            tests/catalog-v2-policy.test.ts \
            tests/catalog-v2-market-recovery.test.ts \
            tests/catalog-encyclopedia-identity-application.test.ts \
            tests/catalog-encyclopedia-identity-runtime.test.ts \
            tests/catalog-encyclopedia-identity-data.test.ts \
            tests/catalog-encyclopedia-identity-master.test.ts \
            tests/catalog-knowledge-core-contract.test.ts \
            tests/catalog-public-truth-seo.test.ts \
            tests/catalog-power-authority-contract.test.ts \
            tests/catalog-safe-model-label.test.ts \
            tests/catalog-source-page-partition.test.ts \
            tests/catalog-public-safety.test.ts \
            tests/catalog-publication-gate.test.ts
      - name: Catalog model-year inventory quota tests
        run: node --import tsx --test tests/catalog-model-year-quota.test.ts tests/catalog-global-model-cap.test.ts
      - name: Japan auction statistics tests
        run: node --import tsx --test tests/japan-auction-statistics-source.test.ts tests/catalog-japan-fixed-price-policy.test.ts
      - name: Japan Prestige partition rotation tests
        run: node --import tsx --test tests/prestige-japan-partition-plan.test.ts
      - name: Catalog live sources v23 tests
        run: node --import tsx --test tests/catalog-live-sources-v19.test.ts tests/carswitch-detail-gallery.test.ts
      - name: Guazi China RU listing tests
        run: node --import tsx --test tests/guazi-ru-source.test.ts
      - name: MyAuto Georgia listing tests
        run: node --import tsx --test tests/myauto-list-source.test.ts
      - name: Georgia canonical recovery tests
        run: node --import tsx --test tests/georgia-yandex-recovery.test.ts tests/georgia-yandex-recovery-myauto-fallback-20260812.test.ts tests/autopapa-georgia-current-parser-20260812.test.ts tests/catalog-preliminary-power-recovery.test.ts tests/georgia-vpic-power-recovery.test.ts
      - name: Regional live route tests
        run: node --import tsx --test tests/catalog-regional-live-overrides.test.ts
      - name: Catalog probe v23 tests
        run: node --import tsx --test tests/catalog-probe-source-shard.test.ts
      - name: Catalog publication gate tests
        run: node --import tsx --test tests/catalog-publication-gate.test.ts
      - name: Open source model normalization tests
        run: node --import tsx --test tests/open-source-normalizer.test.ts
      - name: Power normalization and public truth tests
        run: node --import tsx --test tests/catalog-power-normalization.test.ts tests/catalog-knowledge-power-conflict.test.ts tests/catalog-public-truth-seo.test.ts tests/catalog-power-authority-contract.test.ts tests/catalog-public-safety.test.ts tests/catalog-editable-power-scenario.test.ts
      - name: Public 30-minute power display tests
        run: node --import tsx --test tests/catalog-power-display.test.ts
      - name: Estimated EV publication tests
        run: node --import tsx --test tests/catalog-estimated-power-publication.test.ts
      - name: Vehicle Knowledge CORE and model search tests
        run: node --import tsx --test tests/vehicle-knowledge.test.ts tests/catalog-knowledge-core-contract.test.ts tests/knowledge-source-master-runtime.test.ts tests/catalog-encyclopedia-identity-master.test.ts
      - name: Live offer display enrichment tests
        run: node --import tsx --test tests/catalog-display-enrichment.test.ts tests/catalog-display-identity.test.ts tests/catalog-public-offer-deduplication.test.ts tests/catalog-brand-routing.test.ts tests/autocatalog-ui.test.ts tests/autocatalog-flat-ui.test.ts tests/catalog-safe-model-label.test.ts
      - name: Current read-model and AI product feed tests
        run: node --import tsx --test tests/offer-navigation-performance.test.ts tests/catalog-filter-search.test.ts tests/catalog-current-read-model-empty-market-policy.test.ts tests/catalog-visible-calculation-audit-contract.test.ts tests/ai-product-feed.test.ts
      - name: Drom generation and horsepower parser tests
        run: node --import tsx --test tests/drom-vehicle-knowledge.test.ts
      - name: Single active catalog pipeline tests
        run: node --import tsx --test tests/catalog-single-active-pipeline.test.ts
      - name: Validate catalog automation scripts
        run: node --check scripts/catalog-configure-source-limits.mjs && node --check scripts/catalog-daily-full.mjs && node --check scripts/catalog-daily-incremental.mjs && node --check scripts/catalog-sync-vehicle-models.mjs && node --check scripts/catalog-sync-vehicle-knowledge-seed.mjs && node --check scripts/catalog-build-vehicle-variants.mjs && node --check scripts/catalog-build-power-knowledge.mjs && node --check scripts/catalog-audit-vehicle-knowledge.mjs && node --check scripts/catalog-clean-object-storage.mjs && node --check scripts/catalog-reindex-vehicle-knowledge.mjs && node --check scripts/catalog-rebuild-market.mjs && node --check scripts/catalog-publish-fresh.mjs && node --check scripts/catalog-business-audit.mjs && node --check scripts/catalog-probe-source-shard.mjs && node --check scripts/catalog-rebuild-source-shard.mjs && node --check scripts/catalog-validate-source-scale.mjs && node --check scripts/catalog-publish-source-scale.mjs && node --check scripts/catalog-publish-market.mjs && node --check scripts/catalog-build-knowledge-gaps.mjs && node --check scripts/catalog-verify-current-offers.mjs && node --check scripts/catalog-compile-knowledge-core.mjs && node --check scripts/catalog-audit-visible-calculation-coverage.mjs
      - name: Web typecheck diagnostics
        id: web_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false > web-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat web-typecheck.log
          exit $code
      - name: Upload web typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-log
          path: web-typecheck.log
      - name: Fail on web typecheck errors
        if: steps.web_typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Engine typecheck
        run: npm --workspace=@avtocena/engine exec tsc -- --noEmit
      - name: Production build diagnostics
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > production-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat production-build.log
          exit $code
      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: production-build.log
      - name: Fail on production build errors
        if: steps.production_build.outputs.exit_code != '0'
        run: exit 1
