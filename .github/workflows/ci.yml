name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Customs tests
        run: node --import tsx --test tests/russia-customs.test.ts
      - name: Catalog calculation integrity tests
        run: node --import tsx --test tests/catalog-calculation-integrity.test.ts
      - name: CRM market defaults and live pricing tests
        run: node --import tsx --test tests/market-defaults-and-live-pricing.test.ts
      - name: Full seven-market pricing tests
        run: node --import tsx --test tests/catalog-full-market-pricing.test.ts
      - name: Price trend direction tests
        run: node --import tsx --test tests/price-trend-direction.test.ts
      - name: Catalog image quality tests
        run: node --import tsx --test tests/catalog-image-quality.test.ts
      - name: Catalog source-scale tests
        run: node --import tsx --test tests/catalog-source-scale.test.ts
      - name: Catalog live sources v23 tests
        run: node --import tsx --test tests/catalog-live-sources-v19.test.ts
      - name: Guazi China RU listing tests
        run: node --import tsx --test tests/guazi-ru-source.test.ts
      - name: MyAuto Georgia listing tests
        run: node --import tsx --test tests/myauto-list-source.test.ts
      - name: Catalog probe v23 tests
        run: node --import tsx --test tests/catalog-probe-source-shard.test.ts
      - name: Catalog publication gate tests
        run: node --import tsx --test tests/catalog-publication-gate.test.ts
      - name: Open source model normalization tests
        run: node --import tsx --test tests/open-source-normalizer.test.ts
      - name: Power normalization tests
        run: node --import tsx --test tests/catalog-power-normalization.test.ts
      - name: Public 30-minute power display tests
        run: node --import tsx --test tests/catalog-power-display.test.ts
      - name: Estimated EV publication tests
        run: node --import tsx --test tests/catalog-estimated-power-publication.test.ts
      - name: Vehicle knowledge and model search tests
        run: node --import tsx --test tests/vehicle-knowledge.test.ts
      - name: Live offer display enrichment tests
        run: node --import tsx --test tests/catalog-display-enrichment.test.ts
      - name: Drom generation and horsepower parser tests
        run: node --import tsx --test tests/drom-vehicle-knowledge.test.ts
      - name: Validate catalog automation scripts
        run: node --check scripts/catalog-configure-source-limits.mjs && node --check scripts/catalog-daily-full.mjs && node --check scripts/catalog-daily-incremental.mjs && node --check scripts/catalog-reindex-vehicle-knowledge.mjs && node --check scripts/catalog-rebuild-market.mjs && node --check scripts/catalog-publish-fresh.mjs && node --check scripts/catalog-business-audit.mjs && node --check scripts/catalog-probe-source-shard.mjs && node --check scripts/catalog-rebuild-source-shard.mjs && node --check scripts/catalog-validate-source-scale.mjs && node --check scripts/catalog-publish-source-scale.mjs
      - name: Web typecheck diagnostics
        id: web_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false > web-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat web-typecheck.log
          exit $code
      - name: Upload web typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-log
          path: web-typecheck.log
      - name: Fail on web typecheck errors
        if: steps.web_typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Engine typecheck
        run: npm --workspace=@avtocena/engine exec tsc -- --noEmit
      - name: Production build diagnostics
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > production-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat production-build.log
          exit $code
      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: production-build.log
      - name: Fail on production build errors
        if: steps.production_build.outputs.exit_code != '0'
        run: exit 1

  catalog_live_probe:
    name: Live probe ${{ matrix.market }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        market: [china, japan, georgia]
        shard: [0, 1, 2, 3]
    env:
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "4"
      CATALOG_PROBE_TIMEOUT_MS: "12000"
      CATALOG_PROBE_ATTEMPTS: "1"
      CATALOG_PROBE_CONCURRENCY: "6"
      CATALOG_SOURCE_TIMEOUT_MS: "12000"
      CATALOG_PROBE_OUTPUT: catalog-probe-${{ matrix.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe live source registry
        run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Print compact probe result
        if: always()
        run: |
          if [ -s "$CATALOG_PROBE_OUTPUT" ]; then
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.env.CATALOG_PROBE_OUTPUT,"utf8"));console.log(JSON.stringify({market:p.market,shard:p.shardIndex,planned:p.plannedSourceIds,active:p.activeSourceIds,inactive:p.inactiveSourceIds,results:p.results},null,2))'
          fi
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-probe-${{ matrix.market }}-${{ matrix.shard }}
          path: ${{ env.CATALOG_PROBE_OUTPUT }}
          if-no-files-found: warn
