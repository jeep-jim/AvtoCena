name: Review full-width offer parameter panels
on:
  push:
    branches: [fix/fullwidth-offer-panels-20260913]
    paths:
      - scripts/review-wide-offer-editors.py
      - tests/browser/wide-parameter-panels.mjs
      - .github/workflows/review-wide-offer-editors.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fullwidth-offer-panels-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded UI-only patch on review branch
        run: python3 scripts/review-wide-offer-editors.py
      - run: npm ci
      - run: npm run typecheck
      - name: Preserve power and customs regression tests
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/recycling-power-ui.test.ts tests/russia-customs.test.ts
      - name: Production build before publication
        run: npm run build
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
      - name: Check full-width panels in both themes on desktop and mobile
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/wide-parameter-panels.mjs
      - name: Record tested UI source only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('roadmap.md')
          entry='## 2026-09-13 — Панели параметров на всю ширину блока\n- Год, объём, топливо и мощность: одна широкая панель под сеткой, четыре переключателя остаются доступны.\n- Закрытие: повторное нажатие, крестик, вне панели и Escape; переключение без нескольких открытых панелей.\n- Только компонент Tile и scoped CSS; расчёты, цена, счётчик и чипы каталога не изменены.\n- Перед публикацией пройдены typecheck, регрессии мощности/таможни, production build и браузерная проверка обеих тем на шести ширинах. Живой сайт проверяется отдельно после слияния.\n\n'
          p.write_text(entry+p.read_text())
          PY
          rm scripts/review-wide-offer-editors.py .github/workflows/review-wide-offer-editors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/InlineOfferParameters.tsx apps/web/components/catalog/InlineParameterPanels.module.css tests/browser/wide-parameter-panels.mjs roadmap.md
          git add -u scripts/review-wide-offer-editors.py .github/workflows/review-wide-offer-editors.yml
          git commit -m 'fix(ui): full-width offer editor panels after build and responsive tests'
          git push origin HEAD:fix/fullwidth-offer-panels-20260913
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-parameter-panels-review
          path: artifacts/wide-parameter-panels
          retention-days: 7
