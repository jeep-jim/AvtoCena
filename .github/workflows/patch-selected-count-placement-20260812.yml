name: Move selected count beside filter chips

on:
  push:
    branches: [ui/catalog-filter-brand-polish-20260812]
    paths: [.github/workflows/patch-selected-count-placement-20260812.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/catalog-filter-brand-polish-20260812
      - name: Move count badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/components/catalog/CatalogFilters.tsx')
          s=p.read_text()
          old='''  return <div className={`flex min-w-0 flex-wrap items-center gap-2 ${compact ? "" : "mt-3"}`} aria-label="Выбранные параметры">{!compact ? <span className="mr-1 text-[10px] font-black uppercase tracking-[0.14em] text-[var(--ac-muted)]">Выбрано</span> : null}{chips.map((item) => <button key={item.key} type="button" onClick={() => onRemove(item.key)} className="ac-filter-chip flex min-h-8 max-w-full items-center gap-1.5 rounded-full px-3 text-xs font-black"><span className="truncate">{item.label}</span><span className="text-base leading-none opacity-55">×</span></button>)}</div>;'''
          new='''  return <div className={`flex min-w-0 flex-wrap items-center gap-2 ${compact ? "" : "mt-3"}`} aria-label="Выбранные параметры">{!compact ? <span className="mr-1 inline-flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.14em] text-[var(--ac-muted)]"><span>Выбрано</span><span className="flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-black tracking-normal text-white">{chips.length}</span></span> : null}{chips.map((item) => <button key={item.key} type="button" onClick={() => onRemove(item.key)} className="ac-filter-chip flex min-h-8 max-w-full items-center gap-1.5 rounded-full px-3 text-xs font-black"><span className="truncate">{item.label}</span><span className="text-base leading-none opacity-55">×</span></button>)}</div>;'''
          if s.count(old)!=1: raise SystemExit(f'filter chips match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/patch-selected-count-placement-20260812.yml').unlink()
          PY
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI: move filter count beside selected chips"
          git push origin HEAD:ui/catalog-filter-brand-polish-20260812
