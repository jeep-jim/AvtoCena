name: Repair Dubicars publication report
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed UAE collection run
        required: true
        type: string
      expected_generation:
        description: Currently published generation
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: repair-dubicars-outcome
  cancel-in-progress: false
env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
  YC_OBJECT_STORAGE_REGION: us-east-1
  YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_OVERVIEW_CANDIDATES_PER_MARKET: "24"
  CATALOG_OVERVIEW_SKIP_READY: "true"

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-intake-uae
          path: repair-intake
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Correct only the verified publication outcome
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
        run: npx tsx scripts/repair-dubicars-outcome.mjs
