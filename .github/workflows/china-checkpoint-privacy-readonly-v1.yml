name: Inspect China checkpoint privacy metadata readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/china-checkpoint-privacy-readonly-v1.yml']
permissions:
  contents: read
concurrency:
  group: china-checkpoint-privacy-readonly-v1
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Inspect China checkpoint bucket privacy metadata only'))
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize fixed reviewed reader without printing private metadata
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/reader.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/classify.py"
      - name: Classify two bounded GET responses only
        env:
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: timeout --signal=TERM --kill-after=5s 45s node "$RUNNER_TEMP/reader.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-checkpoint-privacy-classification-v1
          path: checkpoint-privacy.json
          if-no-files-found: warn
