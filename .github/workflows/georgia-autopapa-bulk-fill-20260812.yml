name: Fill Georgia with AutoPapa 2020+ cards once

on:
  push:
    branches:
      - ops/georgia-autopapa-bulk-fill-20260812
    paths:
      - .github/workflows/georgia-autopapa-bulk-fill-20260812.yml

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Snapshot all seven markets before write
        env:
          CATALOG_AUDIT_OUTPUT: georgia-before-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: ""
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Collect 300 dense AutoPapa pages in bounded recovery batches
        run: |
          set -euo pipefail
          mkdir -p autopapa-batches recovery-input
          for start in $(seq 1 20 281); do
            file="autopapa-batches/start-${start}.json"
            echo "collecting startPage=${start} pages=20"
            curl --connect-timeout 10 --max-time 300 --retry 3 --retry-delay 5 --retry-all-errors -fsS               "https://avtocena.com/api/internal/georgia-egress-8d4c2f?mode=recovery&source=autopapa&startPage=${start}&pages=20"               -o "${file}"
            jq -e --argjson start "${start}" '
              .market == "georgia"
              and .report.source == "autopapa"
              and .report.startPage == $start
              and .report.pagesPerSource == 20
              and .report.rawSourceCounts.autopapa_georgia_open > 0
              and .count > 0
              and ([.offers[] | select(
                .sourceId != "autopapa_georgia_open"
                or .year < 2020
                or .sourcePrice <= 0
                or .totalRub <= 0
                or (.images | length) == 0
              )] | length == 0)
            ' "${file}" >/dev/null
            jq '{startPage:.report.startPage,raw:.report.rawSourceCounts.autopapa_georgia_open,accepted:.count,rejected:.report.rejected,images:.report.imageStats}' "${file}"
          done
      - name: Merge batches, deduplicate and require source-bound galleries
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.readdirSync('autopapa-batches').filter((name) => name.endsWith('.json')).sort((a, b) => {
            const n = (value) => Number(value.match(/\d+/)?.[0] || 0);
            return n(a) - n(b);
          });
          const offers = new Map();
          const rejected = {};
          let rawCount = 0;
          let endpointAccepted = 0;
          const addRejected = (reason) => { rejected[reason] = Number(rejected[reason] || 0) + 1; };
          for (const name of files) {
            const payload = JSON.parse(fs.readFileSync(path.join('autopapa-batches', name), 'utf8'));
            rawCount += Number(payload.report?.rawSourceCounts?.autopapa_georgia_open || 0);
            endpointAccepted += Number(payload.count || 0);
            for (const [reason, count] of Object.entries(payload.report?.rejected || {})) {
              rejected['endpoint_' + reason] = Number(rejected['endpoint_' + reason] || 0) + Number(count || 0);
            }
            for (const offer of payload.offers || []) {
              if (offer?.sourceId !== 'autopapa_georgia_open') { addRejected('source'); continue; }
              if (Number(offer?.year || 0) < 2020) { addRejected('year'); continue; }
              if (!(Number(offer?.sourcePrice || 0) > 0) || !String(offer?.sourceCurrency || '')) { addRejected('source_price'); continue; }
              if (!(Number(offer?.totalRub || 0) > 0)) { addRejected('calculation'); continue; }
              if (!Array.isArray(offer?.images) || offer.images.length < 5) { addRejected('gallery_below_five'); continue; }
              const raw = offer?.operational?.raw || {};
              if (raw.recoveryExactSourceUrl !== true || raw.recoveryExactPhotoIdentity !== true || raw.recoveryCalculatedRub !== true) {
                addRejected('source_binding');
                continue;
              }
              const previous = offers.get(offer.id);
              if (!previous || offer.images.length > previous.images.length) offers.set(offer.id, offer);
            }
          }
          const rows = [...offers.values()];
          const payload = {
            market: 'georgia',
            count: rows.length,
            partial: false,
            report: {
              mode: 'autopapa_300_page_atomic_input',
              batchCount: files.length,
              firstPage: 1,
              lastPage: 300,
              rawCount,
              endpointAccepted,
              uniquePublishableInput: rows.length,
              rejected,
            },
            offers: rows,
          };
          fs.writeFileSync('recovery-input/catalog-rebuild-georgia.json', JSON.stringify(payload));
          fs.writeFileSync('georgia-autopapa-aggregate-report.json', JSON.stringify(payload.report, null, 2));
          console.log(JSON.stringify(payload.report, null, 2));
          if (rows.length < 2000) throw new Error('autopapa_input_below_2000:' + rows.length);
          NODE
      - name: Dry-run exact publication selection and require 2000 cards
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: georgia-dry-run-report.json
          RECOVERY_BATCH_DRY_RUN: "1"
          RECOVERY_PUBLISH_MAX: "5000"
          CATALOG_MAX_OFFERS_PER_MODEL: "20"
          CATALOG_OFFER_RETENTION_MS: "315360000000"
        run: |
          set -euo pipefail
          npx tsx scripts/catalog-live-recovery-publish-batch.mjs
          jq '.byMarket.georgia' georgia-dry-run-report.json
          jq -e '
            .dryRun == true
            and .byMarket.georgia.count >= 2000
            and .byMarket.georgia.preliminaryCount >= 1900
            and .byMarket.georgia.maxOffersPerModel == 20
            and ([.byMarket.georgia.sourceCounts | keys[] | select(. != "autopapa_georgia_open" and . != "myauto_georgia_list")] | length == 0)
          ' georgia-dry-run-report.json >/dev/null
      - name: Publish Georgia in one atomic seven-market generation
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: georgia-publish-report.json
          RECOVERY_PUBLISH_MAX: "5000"
          CATALOG_MAX_OFFERS_PER_MODEL: "20"
          CATALOG_OFFER_RETENTION_MS: "315360000000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Audit all seven markets after write
        env:
          CATALOG_AUDIT_OUTPUT: georgia-after-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: georgia
          CATALOG_AUDIT_MAX_PER_MODEL: "20"
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"georgia":2000}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Assert preservation, canonical sources and gallery quality
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('georgia-before-all7.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('georgia-after-all7.json', 'utf8'));
          const publish = JSON.parse(fs.readFileSync('georgia-publish-report.json', 'utf8'));
          const preserved = ['korea', 'china', 'japan', 'uae', 'europe', 'kyrgyzstan'];
          for (const market of preserved) {
            const beforeCount = Number(before.markets?.[market]?.count || 0);
            const afterCount = Number(after.markets?.[market]?.count || 0);
            const manifestCount = Number(publish.manifestCounts?.[market] || 0);
            if (afterCount !== beforeCount || manifestCount !== beforeCount) {
              throw new Error('preservation_mismatch:' + market + ':' + beforeCount + ':' + afterCount + ':' + manifestCount);
            }
          }
          const georgia = after.markets?.georgia || {};
          const expected = Number(publish.manifestCounts?.georgia || 0);
          if (!publish.published || !publish.generationId || expected < 2000 || Number(georgia.count || 0) !== expected) throw new Error('georgia_publish_mismatch');
          if (Number(georgia.belowFiveImagesCount || 0) !== 0) throw new Error('georgia_gallery_below_five');
          if (Number(georgia.belowMarketMinYearCount || 0) !== 0) throw new Error('georgia_year');
          if (Number(georgia.nonVehicleCount || 0) !== 0 || Number(georgia.nonPositiveSourcePriceCount || 0) !== 0) throw new Error('georgia_quality');
          if (Number(georgia.maxPerExactModel || 0) > 20) throw new Error('georgia_model_cap');
          if (Number(georgia.preliminaryCount || 0) < 1900) throw new Error('georgia_preliminary_count');
          const canonical = new Set(['myauto_georgia_list', 'autopapa_georgia_open']);
          if (Object.keys(georgia.sourceCounts || {}).some((sourceId) => !canonical.has(sourceId))) throw new Error('georgia_noncanonical_source');
          console.log(JSON.stringify({generationId:publish.generationId, before:before.markets, after:after.markets, publication:publish.byMarket?.georgia}, null, 2));
          NODE
      - name: Verify public API and rendered catalog reflect the new generation
        run: |
          set -euo pipefail
          expected="$(jq -r '.manifestCounts.georgia' georgia-publish-report.json)"
          matched=0
          for attempt in {1..20}; do
            curl --connect-timeout 10 --max-time 60 -fsS -H 'cache-control: no-cache'               "https://avtocena.com/api/catalog/home?verify=${attempt}" -o public-home.json
            actual="$(jq -r '.marketCounts.georgia // -1' public-home.json)"
            generation="$(jq -r '.generationId // ""' public-home.json)"
            echo "attempt=${attempt} expected=${expected} actual=${actual} generation=${generation}"
            if [ "${actual}" = "${expected}" ]; then matched=1; break; fi
            sleep 5
          done
          test "${matched}" = "1"
          curl --connect-timeout 10 --max-time 60 -fsS -H 'cache-control: no-cache'             "https://avtocena.com/cars?market=georgia&verify=${expected}" -o public-georgia.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public-georgia.html', 'utf8');
          const articles = (html.match(/<article\b/gi) || []).length;
          const empty = html.includes('Подходящих предложений сейчас нет.');
          console.log(JSON.stringify({bytes:Buffer.byteLength(html), articles, empty}));
          if (articles < 1 || empty) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-autopapa-bulk-fill-reports
          path: |
            georgia-before-all7.json
            georgia-autopapa-aggregate-report.json
            georgia-dry-run-report.json
            georgia-publish-report.json
            georgia-after-all7.json
            public-home.json
            public-georgia.html
          if-no-files-found: warn
          retention-days: 7
