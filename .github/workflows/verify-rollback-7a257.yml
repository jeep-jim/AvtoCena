name: Verify rollback after release 43177669836
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-rollback-7a257.yml']
permissions:
  contents: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a182cd21b21ecf612b63613d263e5bdd817ea4c0
          persist-credentials: false
      - name: Independently verify retained runtime and failed candidate without changing either
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'python3 -' <<'REMOTE'
          import json,subprocess,datetime,urllib.request,time,shutil
          expected='a182cd21b21ecf612b63613d263e5bdd817ea4c0'
          calculator='c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6'
          expected_image='sha256:e36c969dc5a21a1654d738a2fe76c4657cd75ad48ffeff4c87845f67035c6f6f'
          def identity():
              value=json.loads(subprocess.check_output(['docker','inspect','avtocena-production'],text=True))[0]
              assert value['State']['Running'] and value['Config']['Labels'].get('org.opencontainers.image.revision')==expected
              assert value['Image']==expected_image
              port=value['HostConfig']['PortBindings']['3000/tcp'][0]
              assert port['HostIp']=='127.0.0.1' and port['HostPort'] in ['3000','3001']
              return {'release':expected,'image':value['Image'],'port':int(port['HostPort'])}
          before=identity();base='http://127.0.0.1:'+str(before['port'])
          def health(origin):
              with urllib.request.urlopen(origin+'/api/health',timeout=20) as response:value=json.load(response)
              assert value.get('ok') is True and value.get('releaseSha')==expected and value.get('calculationVersion')==calculator
              return {k:value.get(k) for k in ['ok','releaseSha','calculationVersion']}
          failed=json.loads(subprocess.check_output(['docker','inspect','avtocena-release-7a25739b4476'],text=True))[0]
          assert failed['State']['Running'] is False
          disk=shutil.disk_usage('/opt/avtocena')
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'readOnly':True,'identityBefore':before,'localHealthBefore':health(base),'publicHealthBefore':health('https://avtocena.com'),'failedCandidateRunning':failed['State']['Running'],'diskBytes':dict(zip(['total','used','free'],disk)),'loginSamples':[]}
          for phase,delay in [('first',0),('repeat',0),('after35s',35)]:
              if delay:time.sleep(delay)
              started=time.monotonic()
              with urllib.request.urlopen(base+'/login',timeout=15) as response:
                  body=response.read();assert response.status==200 and b'</html>' in body and b'$RX(' not in body and len(body)>50000
              report['loginSamples'].append({'phase':phase,'seconds':time.monotonic()-started,'bytes':len(body)})
          report['identityAfter']=identity();assert report['identityAfter']==before
          report['localHealthAfter']=health(base);report['publicHealthAfter']=health('https://avtocena.com')
          report['scope']='Independent rollback verification; three retained login requests on serving host, not isolated causal evidence or replacement baseline. No deployment/restart/configuration changes.'
          print('ROLLBACK_7A257_REPORT '+json.dumps(report),flush=True)
          REMOTE
