name: Catalog V6 · Japan approved exact scale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/market-runs/japan-approved-exact-scale

permissions:
  contents: read

concurrency:
  group: catalog-v6-japan-approved-exact-scale
  cancel-in-progress: true

jobs:
  chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scope: ["recent-30000"]
    env:
      JAPAN_EXACT_RECENT_LIMIT: "30000"
      JAPAN_EXACT_CHUNK_OUTPUT: japan-exact-${{ matrix.scope }}.json
      JAPAN_EXACT_MIN_YEAR: "2010"
      JAPAN_EXACT_JPAUC_CONCURRENCY: "10"
      JAPAN_EXACT_CARVECTOR_CONCURRENCY: "2"
      JAPAN_EXACT_CARVECTOR_PAGE_DELAY_MS: "1000"
      JAPAN_EXACT_MAX_FALLBACK_PAGES: "500"
      JAPAN_EXACT_REQUEST_TIMEOUT_MS: "45000"
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Join exact JPAuc sold lots to exact CarVector results
        run: npx tsx scripts/japan-carvector-jpauc-exact-chunk.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-approved-exact-${{ matrix.scope }}
          path: japan-exact-${{ matrix.scope }}.json
          if-no-files-found: warn
          retention-days: 5

  aggregate:
    needs: chunks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAPAN_EXACT_MERGE_INPUT_DIR: japan-exact-chunks
      JAPAN_EXACT_MERGE_OUTPUT: japan-carvector-jpauc-exact.json
      JAPAN_EXACT_EXPECTED_SCOPES: recent-30000
      JAPAN_EXACT_MIN_CHUNK_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: japan-approved-exact-*
          path: japan-exact-chunks
          merge-multiple: true
      - name: Require the complete bounded recent window and merge exact joined lots
        run: node scripts/japan-carvector-jpauc-exact-merge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-carvector-jpauc-exact
          path: japan-carvector-jpauc-exact.json
          if-no-files-found: warn
          retention-days: 5

  publish:
    needs: aggregate
    if: needs.aggregate.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "3"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "100"
      CATALOG_PUBLIC_ABSOLUTE_MAX_TOTAL_RUB: "15000000"
      CATALOG_PUBLIC_MAX_TOTAL_TO_CAR_PRICE_RATIO: "8"
      CATALOG_OFFER_RETENTION_MS: "2592000000"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      RECOVERY_PUBLISH_MIN_PREVIOUS_RATIO: "0.90"
      CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: japan-carvector-jpauc-exact
          path: japan-live-input
      - name: Verify all seven markets are readable before replacement
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-approved-preflight.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1,"china":1,"japan":0,"uae":1,"europe":1,"georgia":1,"kyrgyzstan":1}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Calculate exact Russia-delivered prices
        env:
          JAPAN_EXACT_RECOVERY_INPUT: japan-live-input/japan-carvector-jpauc-exact.json
          JAPAN_EXACT_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          JAPAN_EXACT_RECOVERY_TARGET: "30000"
          JAPAN_EXACT_RECOVERY_CONCURRENCY: "16"
        run: npx tsx scripts/catalog-live-recovery-japan-jpauc-carvector.mjs
      - name: Require 8700 safe cards before obtaining writer lease
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('catalog-rebuild-japan.json', 'utf8'));
          const offers = Array.isArray(payload?.offers) ? payload.offers : [];
          const invalid = offers.filter((offer) => {
            const raw = offer?.operational?.raw || {};
            return offer?.sourceId !== 'jpauc_japan_past_open'
              || raw?.carvectorEvidenceSourceId !== 'carvector_japan_stat_open'
              || raw?.exactJoinVersion !== 1
              || raw?.carvectorExactFinalPrice !== true
              || raw?.carvectorExactPower !== true
              || raw?.recoveryExactPhotoIdentity !== true
              || raw?.recoveryCalculatedRub !== true
              || offer?.calculationStatus !== 'ready'
              || offer?.calculationSnapshot?.pricingConfidence !== 'exact'
              || !(Number(offer?.totalRub) > 0)
              || (offer?.images || []).length < 3
              || /goo-?net/i.test(`${offer?.powerDataSource || ''} ${JSON.stringify(raw)}`);
          });
          if (offers.length < 8700 || invalid.length) throw new Error(`japan_approved_exact_prewrite_failed count=${offers.length} invalid=${invalid.length}`);
          console.log(`Japan approved exact prewrite passed: ${offers.length} cards.`);
          NODE
      - name: Atomically replace Japan and preserve six other markets
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-japan-approved-publish.json
          RECOVERY_PUBLISH_MAX: "30000"
          RECOVERY_PUBLISH_MIN_COUNT: "8700"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit the new generation
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-approved-postaudit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "100"
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1,"china":1,"japan":8700,"uae":1,"europe":1,"georgia":1,"kyrgyzstan":1}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-japan-approved-exact-reports
          path: |
            catalog-japan-approved-preflight.json
            catalog-rebuild-japan.json
            catalog-japan-approved-publish.json
            catalog-japan-approved-postaudit.json
          if-no-files-found: warn
          retention-days: 3
