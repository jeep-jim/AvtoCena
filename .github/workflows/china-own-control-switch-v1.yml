# Review-only draft. Do not arm until the actual private READY has been accepted,
# the exact operator code directory is pinned and rollout authority is recorded.
name: Switch exact China cut without traffic
on:
  push:
    branches: [main]
    paths: [.github/market-runs/china-own-control-switch-v1.sha256]
permissions:
  contents: read
  actions: read
concurrency:
  group: avtocena-own-china-dark-control-v1
  cancel-in-progress: false
jobs:
  switch:
    name: Switch exact China cut without traffic
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Switch exact China cut without traffic'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f4dc98aaab916b29419d173994d66562aa5901f1
          path: writer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 85296f6b8797aaa93227b69da7e9e9e928e8f9b5
          path: reader
          persist-credentials: false
      - name: Build only reviewed operator sources, without service credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$GITHUB_WORKSPACE"
          ops="$root/.github/operations/china-dark-actor-v1"
          test "$(sha256sum "$ops/APPROVED_CODE.sha256" | cut -d ' ' -f 1)" = ff6ec62fbb5b93759d92d26f10413e04f1358108b41d05514001ea3b97e8e72a
          (cd "$ops"; sha256sum --strict --check --status APPROVED_CODE.sha256)
          [[ "$(git -C writer rev-parse HEAD)" == f4dc98aaab916b29419d173994d66562aa5901f1 ]]
          [[ "$(git -C reader rev-parse HEAD)" == 85296f6b8797aaa93227b69da7e9e9e928e8f9b5 ]]
          git -C writer apply --check "$ops/dark-actor-overlay.patch"
          git -C writer apply "$ops/dark-actor-overlay.patch"
          (cd writer; npm ci --ignore-scripts --no-audit --no-fund)
          (cd reader; npm ci --ignore-scripts --no-audit --no-fund)
          stage="$(mktemp -d "$RUNNER_TEMP/china-operator-build.XXXXXXXX")"
          node "$ops/build-control-bundle.mjs" "$root/writer" "$root/writer" "$stage/china-dark-control-switch.mjs" > "$stage/actor-build.json"
          node "$ops/build-private-preview.mjs" "$root/reader" "$stage/preview.cjs" > "$stage/preview-build.json"
          python3 - "$stage" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);a=json.loads((p/'actor-build.json').read_text());r=json.loads((p/'preview-build.json').read_text())
          assert a['base']=='f4dc98aaab916b29419d173994d66562aa5901f1' and a['externalModules']=='node-builtins-only'
          assert r['appSha']=='85296f6b8797aaa93227b69da7e9e9e928e8f9b5'
          assert hashlib.sha256((p/'china-dark-control-switch.mjs').read_bytes()).hexdigest()==a['sha256']
          assert hashlib.sha256((p/'preview.cjs').read_bytes()).hexdigest()==r['bundleSha256']
          print(json.dumps({'operatorSourcesVerified':True,'actorProjectInputs':a['projectInputs'],'previewProjectInputs':r['inputFiles']}))
          PY
          printf 'CHINA_OPERATOR_BUILD=%s\n' "$stage" >> "$GITHUB_ENV"
      - name: Execute exact dark China control and ordinary loopback proof, without ingress
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Exact privately reviewed project code only, no plan, credentials
          # or catalog data in artifacts. The initial import remains inert.
          readonly ops=.github/operations/china-dark-actor-v1
          readonly build="$CHINA_OPERATOR_BUILD"
          readonly actorpin="$(sha256sum "$build/china-dark-control-switch.mjs" | cut -d ' ' -f 1)"
          readonly hostpin="$(sha256sum "$ops/host-control-dispatch.py" | cut -d ' ' -f 1)"
          readonly previewpin="$(sha256sum "$build/preview.cjs" | cut -d ' ' -f 1)"
          readonly release=85296f6b8797aaa93227b69da7e9e9e928e8f9b5
          readonly target=root@151.248.113.177
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum "$ops/APPROVED_CODE.sha256" | cut -d ' ' -f 1)" = ff6ec62fbb5b93759d92d26f10413e04f1358108b41d05514001ea3b97e8e72a
          (cd "$ops"; sha256sum --strict --check --status APPROVED_CODE.sha256)
          scratch="$(mktemp -d "$RUNNER_TEMP/china-dark-switch.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$scratch/key"
          unset SSH_PRIVATE_KEY
          test -s "$scratch/key"
          # approved-switch.json is authored/reviewed separately after the exact
          # producer READY and load/start-only receipts. Marker contains its SHA.
          CHINA_LOCAL_SCRATCH="$scratch" CHINA_PREVIEW_PIN="$previewpin" python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,time
          ops=Path('.github/operations/china-dark-actor-v1')
          marker=Path('.github/market-runs/china-own-control-switch-v1.sha256').read_text()
          raw=(ops/'approved-switch.json').read_bytes()
          assert re.fullmatch(r'[a-f0-9]{64}\n',marker) and hashlib.sha256(raw).hexdigest()==marker.strip()
          assert 0<len(raw)<=32*1024
          s=json.loads(raw);assert set(s)=={'version','ownerScopeSha256','target','previous','archiveSha256','manifestSha256','pricingReceiptSha256','admittedRows','query','legacyQuery','validBefore','authorizesIngress','ownerIngressApprovalSha256'}
          assert s['version']==1 and s['target']['runId'].startswith('full-fresh-') and re.fullmatch(r'[a-f0-9]{64}',s['ownerScopeSha256'])
          assert all(re.fullmatch(r'[a-f0-9]{64}',s[k]) for k in ('archiveSha256','manifestSha256','pricingReceiptSha256'))
          assert 0<s['admittedRows']<=290044 and s['previous']=={'kind':'legacy-unmodified','generationId':'gen_1794878284419_a611dfcf','manifestSha256':'4c34c20d9784b571414390cab450ceeeaee60b00c168476100419ec5c05cb038'}
          assert s['archiveSha256']=='b8a2a25dc27390845dd5a423efa323c9472a338b1b97f413ba96aefa7f3b65ca'
          assert all(set(s[k])=={'make','model'} and all(isinstance(v,str) and 0<len(v)<=64 for v in s[k].values()) for k in ('query','legacyQuery'))
          def write(file,data):
           b=json.dumps(data,separators=(',',':')).encode()
           with (Path(os.environ['CHINA_LOCAL_SCRATCH'])/file).open('xb') as f:f.write(b)
           return hashlib.sha256(b).hexdigest()
          now=int(time.time()*1000);valid=min(s['validBefore'],now+12*60_000);assert valid>now+120_000
          stage={'runId':s['target']['runId'],'generationId':s['target']['generationId'],'readySha256':s['target']['readySha256']}
          old='83ff17075e9188dcf227c8752dc064248d5f42e0';new='85296f6b8797aaa93227b69da7e9e9e928e8f9b5';calc='4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90'
          old_image='4a055ba772496c7de89594acbbc1c1bc02ac2d2b20050cfad7f637d1f5646dfd';new_image='0bfe542a991a69aaa4f416726a221e4e845986cc15c98a414e24ea7cff462984'
          scope={'endpoint':'https://s3.regru.cloud','bucket':'avtocena-staging-8120751','prefix':'migration-staging/full-20261011','region':'us-east-1'}
          grant={'version':1,'kind':'china-private-preview-grant-v1','stage':stage,'storage':scope,'appSha':new,'legacyRuntimeSha256':calc,'imageSha256':new_image,
           'expiresAt':valid,'archiveSha256':s['archiveSha256'],'manifestSha256':s['manifestSha256'],'pricingReceiptSha256':s['pricingReceiptSha256'],
           'admittedRows':s['admittedRows'],**s['query'],'publicationAuthorized':False,'cursorAdvanceAuthorized':False}
          g=write('grant.json',grant)
          ingress=s['authorizesIngress'];auth=s['ownerIngressApprovalSha256']
          assert type(ingress) is bool and ((ingress and re.fullmatch(r'[a-f0-9]{64}',auth)) or (not ingress and auth=='none'))
          write('ingress-authorization.json',{'version':1,'ownerIngressApprovalSha256':auth,'authorizesIngress':ingress,'authorizesDataWrite':False})
          keys='GITHUB_REPOSITORY GITHUB_REPOSITORY_ID GITHUB_SHA GITHUB_REF GITHUB_WORKFLOW_REF GITHUB_JOB GITHUB_RUN_ID GITHUB_RUN_ATTEMPT GITHUB_TOKEN'.split()
          job={k:os.environ[k] for k in keys};write('job.json',job)
          p={'version':1,'kind':'china-dark-switch-approved-v1','approvedScopeSha256':s['ownerScopeSha256'],
           'ownerJob':{'runId':job['GITHUB_RUN_ID'],'headSha':job['GITHUB_SHA'],'workflow':'.github/workflows/china-own-control-switch-v1.yml'},
           'target':stage,'previous':s['previous'],'expectedArchiveSha256':s['archiveSha256'],'expectedManifestSha256':s['manifestSha256'],
           'expectedPricingReceiptSha256':s['pricingReceiptSha256'],'expectedAdmittedRows':s['admittedRows'],
           'expectedBaseSha256':hashlib.sha256(b'null').hexdigest(),'validUntil':valid,'rollbackUntil':valid+3*60_000,
           'previewBundleSha256':os.environ['CHINA_PREVIEW_PIN'],'previewGrantSha256':g,
           'candidate':{'release':new,'calculationVersion':calc,'imageSha256':new_image,'name':'avtocena-china-candidate-'+new[:12],'port':3000},
           'incumbent':{'release':old,'calculationVersion':calc,'imageSha256':old_image,'name':'avtocena-production','port':3001},
           'query':s['query'],'legacyQuery':s['legacyQuery'],'writeExactly':'china-independent-control-only','noIngressChange':True,'cursorAdvanceAuthorized':False}
          write('plan.json',p)
          PY
          unset GITHUB_TOKEN
          ingress="$(python3 -c 'import json,sys;print(str(json.load(open(sys.argv[1]))["authorizesIngress"]).lower())' "$scratch/ingress-authorization.json")"
          ingress_owner="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["ownerIngressApprovalSha256"])' "$scratch/ingress-authorization.json")"
          readonly flip_pin="$(sha256sum "$ops/flip_ingress.py" | cut -d ' ' -f 1)"
          readonly compose_pin="$(sha256sum "$ops/compose-ingress.py" | cut -d ' ' -f 1)"
          readonly chain_pin="$(sha256sum "$ops/run-chain.sh" | cut -d ' ' -f 1)"
          pin="$(sha256sum "$scratch/plan.json" | cut -d ' ' -f1)"
          host="/opt/avtocena/releases/$release/china-switch-runs/$GITHUB_RUN_ID"
          ssh_args=(-i "$scratch/key" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3
             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          ssh "${ssh_args[@]}" "$target" "set -euo pipefail; umask 077; install -d -m 0700 '/opt/avtocena/releases/$release/china-switch-runs'; test ! -e '$host'; mkdir -m 0700 '$host'"
          cleanup(){
            status=$?
            ssh "${ssh_args[@]}" "$target" "rm -f -- '$host/job.json'" >/dev/null 2>&1 || true
            rm -rf -- "$scratch"
            return "$status"
          }
          trap cleanup EXIT
          scp "${ssh_args[@]}" "$build/china-dark-control-switch.mjs" "$ops/host-control-dispatch.py" "$build/preview.cjs" \
            "$ops/flip_ingress.py" "$ops/compose-ingress.py" "$ops/run-chain.sh" "$scratch/ingress-authorization.json" \
            "$scratch/job.json" "$scratch/plan.json" "$scratch/grant.json" "$target:$host/"
          if ! ssh "${ssh_args[@]}" "$target" "test -x /usr/bin/node && test \"\$(/usr/bin/node --version)\" = v24.22.1"; then
            node_bin="$(command -v node)"
            test "$(node --version)" = v24.22.1
            node_pin="$(sha256sum "$node_bin" | cut -d ' ' -f1)"
            scp "${ssh_args[@]}" "$node_bin" "$target:$host/node"
            ssh "${ssh_args[@]}" "$target" "set -euo pipefail; test \"\$(sha256sum '$host/node' | cut -d ' ' -f1)\" = '$node_pin'; chmod 0500 '$host/node'"
          fi
          # Same protected job and authenticated host; ingress is a separate
          # phase and requires its own pinned approval in approved-switch.json.
          timeout 810s ssh "${ssh_args[@]}" "$target" "set -euo pipefail; umask 077; chmod 0500 '$host/china-dark-control-switch.mjs'; chmod 0400 '$host/host-control-dispatch.py' '$host/preview.cjs' '$host/job.json' '$host/plan.json' '$host/grant.json' '$host/flip_ingress.py' '$host/compose-ingress.py' '$host/run-chain.sh' '$host/ingress-authorization.json'; test \"\$(sha256sum '$host/run-chain.sh' | cut -d ' ' -f 1)\" = '$chain_pin'; /usr/bin/bash '$host/run-chain.sh' '$host' '$pin' '$actorpin' '$hostpin' '$flip_pin' '$compose_pin' '$ingress' '$ingress_owner'"
