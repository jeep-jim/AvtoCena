name: ProAuctions collect and publish
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths: ['.github/market-runs/proauctions.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[catalog-metadata-only]') && format('catalog-metadata-{0}', github.run_id) || 'catalog-refresh-japan' }}
  cancel-in-progress: false
jobs:
  collect:
    # Renaming an operation label must not launch a duplicate collection.
    if: "!contains(github.event.head_commit.message, '[catalog-metadata-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      due: ${{ steps.operation.outputs.due }}
    env:
      PROAUCTIONS_DURABLE: '1'
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Restore durable checkpoint or start a due collection
        id: operation
        run: node --import tsx scripts/proauctions-restore-state.mjs
      - name: Verify auction price, source links and incomplete specifications
        run: node --import tsx --test tests/proauctions-import.test.ts tests/proauctions-detail-evidence.test.ts
      - name: Collect all discovered details with resumable checkpoints
        if: steps.operation.outputs.due == 'true'
        env:
          PROAUCTIONS_SECONDS: '2400'
        run: node scripts/run-transient-retry.mjs node --import tsx scripts/collect-proauctions.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.operation.outputs.due == 'true'
        with:
          name: proauctions-collection
          path: proauctions-collection
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  publish:
    needs: collect
    if: needs.collect.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_APPEND_RETAINED_PUBLIC: '1'
      CATALOG_PUBLICATION_DRY_RUN: '0'
      CATALOG_REBUILD_MARKETS: japan
      CATALOG_REBUILD_INPUT_DIR: proauctions-ready
      CATALOG_REBUILD_PUBLISH_REPORT: proauctions-publication.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '8'
      CATALOG_PUBLISH_LOCK_WAIT_MS: '14400000'
      CATALOG_PUBLISH_LOCK_TTL_MS: '5400000'
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: '300000'
      NODE_OPTIONS: --max-old-space-size=11000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: {name: proauctions-collection, path: proauctions-collection}
      - name: Build source-bound publication shards and reject cross-lot photo duplicates
        id: admission
        run: node --import tsx scripts/prepare-proauctions-publication.mjs
      - name: Require at least one verified completed sale
        run: test '${{ steps.admission.outputs.count }}' -gt 0
      - name: Check existing storage, price and publication protections
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/catalog-inventory-regression.test.ts tests/catalog-internal-stream.test.ts
          tests/catalog-safe-public-pricing.test.ts tests/catalog-publication-gate.test.ts
      - name: Verify storage reserve before publication
        run: node scripts/run-transient-retry.mjs node --import tsx scripts/catalog-storage-preflight.mjs
      - name: Publish Japan cumulatively through the shared storage lock
        run: node scripts/run-transient-retry.mjs node --import tsx scripts/catalog-publish-market.mjs
      - name: Verify persisted cards, current read models and invalidReady
        run: |
          node --import tsx scripts/catalog-audit-current-readmodel-parity.mjs
          node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
          node --import tsx scripts/catalog-verify-current-offers.mjs
      - name: Record successful publication of the durable checkpoint
        run: |
          node --import tsx --input-type=module <<'JS'
          import {getJsonStorage} from './apps/web/lib/data.ts';
          import {proAuctionsStateKey} from './scripts/lib/proauctions-durable-state.mjs';
          const storage=getJsonStorage();const state=await storage.readJson(proAuctionsStateKey,null);
          if(!state)throw Error('missing_durable_checkpoint');
          await storage.writeJson(proAuctionsStateKey,{...state,published:true,publishedAt:new Date().toISOString()});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proauctions-publication
          path: |
            proauctions-publication.json
            proauctions-collection/admission.json
            catalog-current-readmodel-parity.json
            catalog-visible-calculation-coverage.json
            catalog-offer-detail-verify.json
          overwrite: true
          retention-days: 14
