name: Catalog V6 · Che168 Global exact readiness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/catalog-v6-che168-exact-readiness.yml"
      - "apps/web/lib/catalog/che168-global-exact-source.ts"
      - "apps/web/lib/catalog/importer.ts"
      - "scripts/catalog-simple-source-market.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-v6-che168-exact-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_REBUILD_MARKET: china
      CATALOG_REBUILD_SOURCE_IDS: autohome_used_china_open
      CATALOG_REBUILD_OUTPUT: readiness-china-autohome_used_china_open.json
      CATALOG_REBUILD_TARGET_PER_MARKET: "3"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "3"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "2"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "1"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "2"
      CATALOG_REBUILD_TIME_LIMIT_MS: "600000"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_GALLERY_TIMEOUT_MS: "30000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_COLLECTION_IMAGE_LIMIT: "30"
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Collect exact Che168 cards without publishing
        run: npx tsx scripts/catalog-simple-source-market.mjs
      - name: Enforce Che168 exact source-only readiness
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.CATALOG_REBUILD_OUTPUT;
          const expected = 'autohome_used_china_open';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const source = (data.report?.sources || []).find((row) => row.sourceId === expected);
          const problems = [];
          const clean = (value) => String(value ?? '').replace(/\s+/g, ' ').trim();
          const hasRaw = (evidence, value) => (evidence?.rawValues || []).some((raw) => clean(raw) === clean(value));
          const canonicalFuels = new Set(['petrol', 'diesel', 'lpg', 'electric', 'hybrid']);
          if (data?.report?.fieldPolicy !== 'preserve_adapter_source_fields_no_generic_spec_normalization') problems.push('collector_field_policy_not_source_only');
          if (offers.length < 3) problems.push(`cards_${offers.length}`);
          if (!source || Number(source.saved || 0) < 3) problems.push(`saved_${source?.saved || 0}`);
          for (const offer of offers) {
            const detail = offer?.operational?.raw?.detail || {};
            if (offer.sourceId !== expected) problems.push('source_identity_mismatch');
            if (!/^https:\/\/global\.che168\.com\/en\/detail\/\d+$/.test(String(offer?.operational?.sourceUrl || ''))) problems.push('source_url_not_exact_che168_global');
            if (String(detail.infoid || '') !== String(offer.sourceOfferId || '')) problems.push('detail_identity_mismatch');
            if (!(Number(offer.sourcePrice) > 0) || offer.sourceCurrency !== 'USD') problems.push('price_currency_invalid');
            if (Number(detail.price) > 0 && Number(offer.sourcePrice) !== Number(detail.price)) problems.push('price_rewritten');
            if (!offer.make || !offer.model || !Number(offer.year)) problems.push('core_identity_missing');
            if (!Array.isArray(offer.images) || offer.images.length < 5) problems.push('gallery_below_5');
            if ((offer.images || []).some((img) => !/^https:\/\/erscglobal2\.autoimg\.cn\/escimg\/auto\/.+\/1400x0_c42_autohomecar__.+\.(?:jpe?g|webp|png|avif)(?:[?#].*)?$/i.test(String(img?.url || '')))) problems.push('gallery_not_exact_carinfo');
            if (offer?.operational?.exactDetail !== true) problems.push('detail_not_verified');
            if (offer?.operational?.photoIdentityVerified !== true) problems.push('photo_identity_not_verified');
            if (offer?.operational?.sourceOnlyFieldsPreserved !== true) problems.push('source_fields_not_preserved');
            if (clean(detail.engine) && clean(offer.engineType) !== clean(detail.engine)) problems.push('engine_text_rewritten');
            if (clean(detail.gearbox) && clean(offer.transmission) !== clean(detail.gearbox)) problems.push('transmission_rewritten');
            if (clean(detail.drivingmode) && clean(offer.drive) !== clean(detail.drivingmode)) problems.push('drive_rewritten');
            if (clean(detail.structure) && clean(offer.bodyType) !== clean(detail.structure)) problems.push('body_rewritten');
            const evidence = offer?.operational?.semanticEvidence || {};
            if (evidence?.year?.status !== 'exact' || Number(evidence?.year?.value) !== Number(offer.year)) problems.push('year_evidence_not_exact');
            if (evidence?.fuel?.status !== 'exact' || !canonicalFuels.has(clean(offer.fuel))) problems.push('fuel_evidence_not_exact');
            if (clean(detail.fuelname) && !hasRaw(evidence?.fuel, detail.fuelname)) problems.push('fuel_not_bound_to_carinfo');
            if (clean(detail.engine) && (!hasRaw(evidence?.engineCc, detail.engine) || !hasRaw(evidence?.powerHp, detail.engine))) problems.push('metrics_not_bound_to_carinfo');
            if (offer.engineCc != null && (evidence?.engineCc?.status !== 'exact' || Number(evidence?.engineCc?.value) !== Number(offer.engineCc))) problems.push('engine_evidence_not_exact');
            if (evidence?.engineCc?.status !== 'exact' && offer.engineCc != null) problems.push('unsafe_engine_promoted');
            if (offer.powerHp != null && (evidence?.powerHp?.status !== 'exact' || Math.abs(Number(evidence?.powerHp?.value) - Number(offer.powerHp)) > 1)) problems.push('power_evidence_not_exact');
            if (evidence?.powerHp?.status !== 'exact' && offer.powerHp != null) problems.push('unsafe_power_promoted');
            const hp = Number(clean(detail.engine).match(/\b(\d{2,4})\s*(?:hp|ps|bhp)\b/i)?.[1] || 0);
            if (hp && Number(offer.powerHp) !== hp) problems.push('power_value_not_exact_detail');
            if (offer.powerHp && offer.powerDataConfidence !== 'source_exact') problems.push('power_not_source_exact');
          }
          console.log(JSON.stringify({ count: offers.length, source, problems: [...new Set(problems)], sample: offers.slice(0, 3).map((offer) => ({ id: offer.sourceOfferId, title: offer.sourceTitle, year: offer.year, price: offer.sourcePrice, currency: offer.sourceCurrency, engineType: offer.engineType, engineCc: offer.engineCc, powerHp: offer.powerHp, transmission: offer.transmission, drive: offer.drive, bodyType: offer.bodyType, fuel: offer.fuel, images: offer.images?.length, sourceUrl: offer.operational?.sourceUrl })) }, null, 2));
          if (problems.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-che168-global-exact
          path: readiness-china-autohome_used_china_open.json
          if-no-files-found: warn
          retention-days: 3
