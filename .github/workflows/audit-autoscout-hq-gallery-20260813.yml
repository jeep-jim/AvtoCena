name: Audit AutoScout exact gallery renditions read-only
run-name: AutoScout HQ gallery audit · ${{ github.sha }}

on:
  push:
    branches:
      - audit/autoscout-hq-gallery-20260813
    paths:
      - .github/workflows/audit-autoscout-hq-gallery-20260813.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect exact AutoScout page image schema and source order
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const offers = await storage.readMarketOffers('europe');
          const autoscout = offers.filter((offer) => String(offer.sourceId || '') === 'autoscout_europe_open');
          const thumbnailRows = autoscout.filter((offer) => (offer.images || []).some((image) => /\/250x188\.webp(?:[?#]|$)/i.test(String(image.url || ''))));
          const samples = (thumbnailRows.length ? thumbnailRows : autoscout).slice(0, 5);
          const headers = {
            accept: 'text/html,application/xhtml+xml,application/json;q=0.9,image/avif,image/webp,*/*;q=0.8',
            'accept-language': 'en-GB,en;q=0.9,de;q=0.7',
            'cache-control': 'no-cache', pragma: 'no-cache',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
          };
          const clean = (value) => String(value || '').replace(/\\\//g, '/').replace(/&amp;/g, '&').trim();
          const resolution = (url) => clean(url).match(/\/(\d{2,5}x\d{2,5})\.(?:webp|jpe?g|png|avif)(?:[?#]|$)/i)?.[1] || '';
          const imageIdentity = (url) => clean(url).match(/listing-images\/([^/?#]+\.(?:jpe?g|png|webp|avif))/i)?.[1] || '';
          function collect(value, path = '$', out = [], depth = 0) {
            if (value == null || depth > 14) return out;
            if (typeof value === 'string') {
              const raw = clean(value);
              if (/listing-images\//i.test(raw)) out.push({ path, raw: raw.slice(0, 1200) });
              return out;
            }
            if (Array.isArray(value)) { value.forEach((item, index) => collect(item, `${path}[${index}]`, out, depth + 1)); return out; }
            if (typeof value === 'object') for (const [key, item] of Object.entries(value)) collect(item, `${path}.${key}`, out, depth + 1);
            return out;
          }
          function allUrls(markup) {
            const rows = [];
            const normalized = clean(markup);
            for (const match of normalized.matchAll(/https?:\/\/prod\.pictures\.autoscout24\.net\/listing-images\/[^\"'\\\s<>]+/gi)) {
              const url = clean(match[0]).replace(/[),;]+$/g, '');
              rows.push({ url, resolution: resolution(url), identity: imageIdentity(url), index: match.index || 0 });
            }
            return [...new Map(rows.map((row) => [row.url, row])).values()];
          }
          const report = { currentEuropeCount: offers.length, currentAutoScoutCount: autoscout.length, currentAutoScoutThumbnailCount: thumbnailRows.length, samples: [] };
          for (const offer of samples) {
            const id = String(offer.sourceOfferId || '');
            const sourceUrl = clean(offer.operational?.sourceUrl);
            const response = await fetch(sourceUrl, { headers, redirect: 'follow', signal: AbortSignal.timeout(30000) });
            const markup = await response.text();
            const nextMatch = markup.match(/<script[^>]+id=[\"']__NEXT_DATA__[\"'][^>]*>([\s\S]*?)<\/script>/i);
            let next = null;
            if (nextMatch?.[1]) { try { next = JSON.parse(nextMatch[1]); } catch {} }
            const offerRows = allUrls(markup).filter((row) => row.identity.startsWith(`${id}_`));
            const firstSeenIdentities = [...new Map(offerRows.map((row) => [row.identity, row])).values()];
            const bestByIdentity = firstSeenIdentities.map((first) => {
              const variants = offerRows.filter((row) => row.identity === first.identity);
              return variants.sort((a,b) => {
                const [aw,ah]=a.resolution.split('x').map(Number), [bw,bh]=b.resolution.split('x').map(Number);
                return (bw*bh)-(aw*ah) || bw-aw;
              })[0];
            });
            const nextContainers = next ? collect(next).filter((row) => row.raw.includes(id)).slice(0, 30) : [];
            report.samples.push({
              id, sourceUrl, status: response.status, bytes: markup.length,
              currentCount: (offer.images || []).length,
              currentFirst: (offer.images || []).slice(0,3).map((image) => clean(image.url)),
              nextDataFound: Boolean(next), nextContainers,
              offerBoundUrlCount: offerRows.length,
              sourceOrderIdentityCount: firstSeenIdentities.length,
              sourceOrderFirst10: firstSeenIdentities.slice(0,10).map((row) => row.identity),
              bestDeclaredFirst10: bestByIdentity.slice(0,10),
              maxDeclaredWidth: Math.max(0, ...offerRows.map((row) => Number(row.resolution.split('x')[0] || 0))),
            });
          }
          fs.writeFileSync('autoscout-hq-gallery-audit.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (!samples.length) throw new Error('no_live_autoscout_samples');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-hq-gallery-audit
          path: autoscout-hq-gallery-audit.json
          if-no-files-found: warn
          retention-days: 3
