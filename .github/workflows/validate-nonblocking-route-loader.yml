name: Validate nonblocking route loader

on:
  push:
    branches: [fix/nonblocking-route-loader-20260811]
    paths:
      - .github/workflows/validate-nonblocking-route-loader.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nonblocking-route-loader-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/patch-nonblocking-route-loader.py
      - name: Typecheck
        run: npm run typecheck
      - name: Static loader checks
        run: |
          grep -q 'REVEAL_DELAY_MS = 180' apps/web/components/layout/RoutePreloader.tsx
          grep -q 'pointer-events-none fixed left-0 right-0 top-0' apps/web/components/layout/RoutePreloader.tsx
          grep -q 'bg-\[var(--ac-surface)\]' apps/web/components/layout/RoutePreloader.tsx
          ! grep -q 'fixed inset-0 z-\[2147483646\]' apps/web/components/layout/RoutePreloader.tsx
          grep -q 'Загружаем страницу' apps/web/components/layout/RoutePreloader.tsx
      - name: Commit validated production file only
        run: |
          git checkout -- . || true
          python3 scripts/patch-nonblocking-route-loader.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/layout/RoutePreloader.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make route loading delayed and nonblocking [skip actions]"
          git push origin HEAD:fix/nonblocking-route-loader-20260811
