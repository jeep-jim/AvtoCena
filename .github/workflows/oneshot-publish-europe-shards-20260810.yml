name: One-shot publish validated Europe shards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-publish-europe-shards-20260810.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: europe-sharded-validated
          path: recovery-input
          repository: jeep-jim/AvtoCena
          run-id: "31407161273"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Europe exact source shards cumulatively
        env:
          RECOVERY_PUBLISH_MARKET: europe
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-europe.json
          RECOVERY_PUBLISH_REPORT: europe-sharded-live-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit all seven markets after publish
        env:
          CATALOG_AUDIT_OUTPUT: europe-sharded-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: europe
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":2832,"china":8130,"japan":423,"uae":173,"europe":4676,"georgia":51,"kyrgyzstan":2337}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-sharded-live-reports
          path: |
            europe-sharded-live-publish-report.json
            europe-sharded-postpersist-audit.json
          retention-days: 3
      - name: Remove one-shot workflow after success
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-publish-europe-shards-20260810.yml
          git commit -m "Remove one-shot Europe publisher [skip actions]"
          git push origin HEAD:main
