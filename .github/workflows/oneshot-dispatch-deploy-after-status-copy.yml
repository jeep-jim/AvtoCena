name: One-shot dispatch deploy after status copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-dispatch-deploy-after-status-copy.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update from current main
        run: git pull --ff-only origin main
      - name: Remove one-shot workflow and publish
        run: |
          rm .github/workflows/oneshot-dispatch-deploy-after-status-copy.yml
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"
          git add -A
          git commit -m "Remove deploy dispatch helper"
          git push origin HEAD:main
      - name: Dispatch production deploy from final main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-yandex.yml --ref main
