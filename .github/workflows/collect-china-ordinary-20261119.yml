name: China ordinary feed collection only (no publication)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-china-ordinary-20261119.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-china
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Collect one ordinary China delta without publication'
    environment: regcloud-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CATALOG_INTAKE_MARKET: china
      CATALOG_INTAKE_RESUME: '1'
      CATALOG_INTAKE_TIME_MS: '12600000'
      AUTO_API_CHE168_STOP_ON_QUOTA: '1'
      AUTO_API_CHE168_REQUIRE_REPLICA: '1'
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          path: china-archive-implementation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm ci
      - name: Bind tested China-only archive limit without changing main shared archive
        run: |
          set -euo pipefail
          test "$(git -C china-archive-implementation rev-parse HEAD)" = bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          test "$(git -C china-archive-implementation hash-object scripts/lib/nonjp-intake-archive.mjs)" = e986f30a4392b85d0e7f6fcbc71ea383e386a663
          cp china-archive-implementation/scripts/lib/nonjp-intake-archive.mjs scripts/lib/nonjp-intake-archive.mjs
          node --import tsx --test tests/catalog-auto-api-che168.test.ts tests/catalog-market-workflow-policy.test.ts
      - name: Refuse a second live China job before calling supplier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/jeep-jim/AvtoCena/actions/runs?status=in_progress&per_page=100' > "$RUNNER_TEMP/china-live-runs.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pages=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/china-live-runs.json','utf8'));
          const active=pages.flatMap(p=>p.workflow_runs).filter(r=>String(r.id)!==process.env.GITHUB_RUN_ID && /china|che168/i.test(r.name+' '+r.path));
          if(active.length)throw Error('competing_china_workflow');
          JS
      - name: Refuse a malformed or active catalog writer lease without changing it
        env:
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { createReadOnlyRawGcS3Transport } from './scripts/lib/catalog-raw-gc-s3.mjs';
          import { RAW_GC_TARGET } from './scripts/lib/catalog-raw-gc.mjs';
          const io=createReadOnlyRawGcS3Transport({limits:{requests:1,responseBytes:16384}});
          const {value}=await io.readJson({target:RAW_GC_TARGET,key:'catalog/import-lock.json',maxBytes:16384,deadline:Date.now()+15000});
          if(value!==null && typeof value?.lockedUntil!=='string')throw Error('unknown_catalog_writer_lease');
          if(value?.lockedUntil){const expiry=Date.parse(value.lockedUntil);if(!Number.isFinite(expiry)||expiry>Date.now())throw Error('catalog_writer_lease_not_free');}
          console.log('catalog_writer_lease_inactive_no_mutation');
          JS
      - name: Sync existing saved inventory and provider deltas only
        env:
          AUTO_API_CHE168_KEY: ${{ secrets.AUTO_API_CHE168_KEY }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/catalog-auto-api-che168-bulk-intake.mjs
      - name: Seal full immutable input and read back against scoped receipt
        env:
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node --import tsx scripts/catalog-archive-intake.mjs archive china catalog-intake-china
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const root='catalog-intake-china';
          const report=JSON.parse(await fs.readFile(root+'/report.json','utf8'));
          const receipt=JSON.parse(await fs.readFile(root+'/own-storage-receipt.json','utf8'));
          const source=report.sources?.find(s=>s.provider==='auto_api_che168');
          if(!report.completed||source?.stopReason!=='source_finished'||source.completeInventory!==true||!source.replica)throw Error('unsealed_china_source');
          console.log(JSON.stringify({market:'china',complete:true,observedAt:report.completedAt,offers:source.uniqueOffers,changes:source.changes,
            manifestSha256:receipt.manifestSha256,reportDigest:receipt.reportDigest,publicationAttempted:false}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: china-collection-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: catalog-intake-china/own-storage-receipt.json
          if-no-files-found: error
          retention-days: 14
