name: Ops · AutoScout Europe HQ live refresh 20260813
run-name: AutoScout Europe HQ live refresh · ${{ github.sha }}

on:
  push:
    branches:
      - ops/autoscout-europe-hq-live-refresh-20260813
    paths:
      - ".github/workflows/ops-autoscout-europe-hq-live-refresh-20260813.yml"

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
  CATALOG_GALLERY_TIMEOUT_MS: "30000"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Typecheck and AutoScout HQ regression tests
        run: |
          npm run typecheck
          node --import tsx --test tests/catalog-autoscout-hq-gallery.test.ts

      - name: Read-only writer/storage safety preflight
        env:
          CATALOG_AUTOSCOUT_HQ_BASELINE: catalog-autoscout-europe-hq-baseline.json
          CATALOG_AUTOSCOUT_HQ_SAFETY_REPORT: catalog-autoscout-europe-hq-safety-pre.json
        run: npx tsx scripts/catalog-autoscout-europe-hq-safety.mts pre

      - name: Read-only seven-market audit before write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-autoscout-europe-hq-audit-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs

      - name: Live AutoScout HQ smoke without publishing
        env:
          CATALOG_REBUILD_MARKET: europe
          CATALOG_REBUILD_SOURCE_IDS: autoscout_europe_open
          CATALOG_REBUILD_OUTPUT: catalog-autoscout-europe-hq-readiness.json
          CATALOG_REBUILD_TARGET_PER_MARKET: "3"
          CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "5"
          CATALOG_REBUILD_MAX_EMPTY_PAGES: "3"
          CATALOG_REBUILD_SOURCE_CONCURRENCY: "1"
          CATALOG_IMAGE_FETCH_CONCURRENCY: "4"
          CATALOG_REBUILD_TIME_LIMIT_MS: "600000"
          CATALOG_COLLECTION_IMAGE_LIMIT: "30"
          CATALOG_KNOWLEDGE_DISABLED: "1"
        run: npx tsx scripts/catalog-simple-source-market.mjs

      - name: Enforce read-only AutoScout smoke contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('catalog-autoscout-europe-hq-readiness.json', 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const problems = [];
          if (offers.length < 3) problems.push(`count_${offers.length}`);
          for (const offer of offers) {
            if (offer.sourceId !== 'autoscout_europe_open') problems.push('source_identity');
            if (Number(offer.year) < 2020) problems.push(`year_${offer.year}`);
            if (!Array.isArray(offer.images) || offer.images.length < 5) problems.push('gallery');
            if (offer.images?.some((image) => !/^https:\/\/prod\.pictures\.autoscout24\.net\/listing-images\//i.test(String(image?.url || '')))) problems.push('foreign_image');
            if (offer.images?.some((image) => Number(image?.width || 0) < 900 || Number(image?.height || 0) < 600)) problems.push('low_resolution');
            if (offer?.operational?.raw?.photoIdentityVerified !== true) problems.push('photo_identity');
            if (offer?.operational?.raw?.photoResolutionVerified !== true) problems.push('photo_resolution');
          }
          console.log(JSON.stringify({count: offers.length, problems}, null, 2));
          if (problems.length) process.exit(1);
          NODE

      - name: Harden one-shot gallery writer before production write
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/catalog-refresh-galleries.mjs')
          text = p.read_text()
          old = '    const forceReplace = offer.operational?.galleryForceReplace === true;'
          new = '    const forceReplace = offer.operational?.galleryForceReplace === true || (offer.sourceId === "autoscout_europe_open" && process.env.CATALOG_GALLERY_AUTOSCOUT_FORCE_REPLACE === "1");'
          if text.count(old) != 1:
              raise SystemExit('expected forceReplace block not found exactly once')
          text = text.replace(old, new, 1)
          old2 = '    await Promise.all(workers);\n    await persistCatalogOffers([...byId.values()]);'
          new2 = '    await Promise.all(workers);\n    if (report.failed > 0 || report.refreshed < end) throw new Error(`catalog_gallery_chunk_incomplete:${report.refreshed}:${end}:${report.failed}`);\n    await persistCatalogOffers([...byId.values()]);'
          if text.count(old2) != 1:
              raise SystemExit('expected persist block not found exactly once')
          p.write_text(text.replace(old2, new2, 1))
          PY
          node --check scripts/catalog-refresh-galleries.mjs

      - name: Replace public AutoScout Europe galleries with listing-bound HQ images
        shell: bash
        env:
          CATALOG_GALLERY_MARKETS: __autoscout_public_only__
          CATALOG_GALLERY_SOURCE_IDS: autoscout_europe_open
          CATALOG_GALLERY_MIN_IMAGES: "5"
          CATALOG_MAX_IMAGES_PER_OFFER: "30"
          CATALOG_GALLERY_FORCE: "true"
          CATALOG_GALLERY_PERSIST_EVERY: "10000"
          CATALOG_GALLERY_CONCURRENCY: "4"
          CATALOG_GALLERY_AUTOSCOUT_FORCE_REPLACE: "1"
          CATALOG_GROW_ONLY_MARKETS: ""
          CATALOG_GALLERY_REPORT_FILE: catalog-autoscout-europe-hq-refresh.json
        run: |
          target_ids="$(jq -r '.targetIds | join(",")' catalog-autoscout-europe-hq-baseline.json)"
          target_count="$(jq -r '.targetCount' catalog-autoscout-europe-hq-baseline.json)"
          test -n "$target_ids"
          test "$target_count" -gt 0
          export CATALOG_GALLERY_OFFER_IDS="$target_ids"
          export CATALOG_GALLERY_MAX_OFFERS="$target_count"
          export CATALOG_GALLERY_MAX_PER_MARKET="$target_count"
          npx tsx scripts/catalog-refresh-galleries.mjs
          test "$(jq -r '.failed' catalog-autoscout-europe-hq-refresh.json)" = "0"
          test "$(jq -r '.selected' catalog-autoscout-europe-hq-refresh.json)" = "$target_count"
          test "$(jq -r '.refreshed' catalog-autoscout-europe-hq-refresh.json)" = "$target_count"

      - name: Exact post-write preservation and HQ verification
        env:
          CATALOG_AUTOSCOUT_HQ_BASELINE: catalog-autoscout-europe-hq-baseline.json
          CATALOG_AUTOSCOUT_HQ_SAFETY_REPORT: catalog-autoscout-europe-hq-safety-post.json
        run: npx tsx scripts/catalog-autoscout-europe-hq-safety.mts post

      - name: Seven-market audit after write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-autoscout-europe-hq-audit-after.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs

      - name: Verify production web renders refreshed AutoScout HQ gallery
        shell: bash
        run: |
          sample_id="$(jq -r '.sample[0].id // empty' catalog-autoscout-europe-hq-safety-post.json)"
          test -n "$sample_id"
          ok=0
          for attempt in $(seq 1 12); do
            if curl --retry 2 --retry-delay 2 --retry-all-errors --max-time 30 -fsS "https://avtocena.com/cars/offer/$sample_id" -o production-offer.html; then
              if grep -q 'prod.pictures.autoscout24.net/listing-images/' production-offer.html && ! grep -qE '/250x188\.(jpg|jpeg|webp|avif|png)' production-offer.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          curl --retry 4 --retry-delay 3 --retry-all-errors --max-time 30 -fsS -o production-europe-search.json 'https://avtocena.com/api/catalog/search?market=europe&pageSize=1'
          jq -e '.items | length >= 1' production-europe-search.json >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-europe-hq-live-refresh-20260813
          path: |
            catalog-autoscout-europe-hq-baseline.json
            catalog-autoscout-europe-hq-safety-pre.json
            catalog-autoscout-europe-hq-readiness.json
            catalog-autoscout-europe-hq-refresh.json
            catalog-autoscout-europe-hq-safety-post.json
            catalog-autoscout-europe-hq-audit-before.json
            catalog-autoscout-europe-hq-audit-after.json
            production-europe-search.json
          if-no-files-found: warn
          retention-days: 3
