name: Validate Japan strict preservation no-publish

on:
  push:
    branches: [fix/japan-strict-preserve-all-markets-20260811]
    paths:
      - scripts/catalog-japan-strict-merge-publish.mjs
      - .github/workflows/validate-japan-strict-preservation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check scripts/catalog-japan-strict-merge-publish.mjs
      - name: Assert no make-level quota, no 5000 truncation, hard exact-model cap 20
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('scripts/catalog-japan-strict-merge-publish.mjs','utf8');
          if (!/const maxOffersPerModel = 20;/.test(s)) throw new Error('hard exact-model cap 20 missing');
          if (/CATALOG_MAX_MODELS_PER_MAKE|maxModelsPerMake|make_model_quota/.test(s)) throw new Error('make-level model quota still present');
          if (/slice\(0,\s*5_000\)/.test(s)) throw new Error('arbitrary preserved-market 5000 truncation still present');
          if (!/hasCredibleOfferContent/.test(s)) throw new Error('canonical preservation gate missing');
          console.log('japan_strict_static_invariants_ok');
          NODE
      - name: Read-only project canonical preserved-market counts
        run: |
          npx tsx -e '(async()=>{const {readMarketOffers}=await import("./apps/web/lib/catalog/storage.ts"); const {credibleCatalogImages,hasCredibleOfferContent,isCatalogYearAllowed}=await import("./apps/web/lib/catalog/offer-quality.ts"); const {normalizeVehicleOfferSpecs}=await import("./apps/web/lib/catalog/spec-normalization.ts"); const markets=["korea","china","uae","europe","georgia","kyrgyzstan"]; const out={}; for(const market of markets){const rows=await readMarketOffers(market); const kept=rows.filter(o=>["active","stale"].includes(String(o?.status||""))).map(o=>normalizeVehicleOfferSpecs({...o,status:"active",images:credibleCatalogImages(o?.images||[]).slice(0,30)})).filter(o=>o?.id&&isCatalogYearAllowed(o.year,market)&&hasCredibleOfferContent({...o,status:"active"})); out[market]={current:rows.length,canonicalPreserved:kept.length,delta:kept.length-rows.length}; if(kept.length>rows.length) throw new Error(`${market}:preserved_gt_current`);} console.log(JSON.stringify(out,null,2));})().catch(e=>{console.error(e);process.exit(1)})'
      - name: Read-only all7 invariant audit
        env:
          CATALOG_AUDIT_OUTPUT: japan-strict-preservation-readonly-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-strict-preservation-validation
          path: japan-strict-preservation-readonly-audit.json
          if-no-files-found: warn
          retention-days: 2
