name: Issue241 Europe cap fast audit 20260814
# inspect live Benz-2020 rows against PR463 source-bound Mercedes resolver

on:
  push:
    branches: [ops/issue241-europe-cap-fast-audit-20260814]
    paths:
      - '.github/workflows/issue241-europe-cap-fast-audit-20260814.yml'

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  RECOVERY_PREFERRED_MAX_RUB: '8000000'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only Europe post-enrichment cap audit
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { credibleCatalogImages, hasCredibleOfferContent, isCatalogOfferBusinessLiquid, isCatalogYearAllowed } = await import('./apps/web/lib/catalog/offer-quality.ts');
          const { normalizeVehicleOfferSpecs } = await import('./apps/web/lib/catalog/spec-normalization.ts');
          const { enrichOfferWithVehicleKnowledge } = await import('./apps/web/lib/catalog/vehicle-knowledge.ts');
          const { canonicalSourceModelIdentity } = await import('./apps/web/lib/catalog/open-source-normalizer.ts');
          const { CATALOG_MAX_OFFERS_PER_MODEL_YEAR, catalogModelYearQuotaKey } = await import('./apps/web/lib/catalog/inventory-quota.ts');
          const market='europe';
          const preferredMaxRub=8_000_000;
          const freshness=offer=>Date.parse(String(offer?.operational?.sourcePublishedAt||offer?.updatedAt||offer?.firstSeenAt||''))||0;
          const quality=(a,b)=>{
            const ap=Number(a?.totalRub||0)>0&&Number(a.totalRub)<=preferredMaxRub?0:1;
            const bp=Number(b?.totalRub||0)>0&&Number(b.totalRub)<=preferredMaxRub?0:1;
            return ap-bp || Number(b?.year||0)-Number(a?.year||0) || freshness(b)-freshness(a) || Number(b?.images?.length||0)-Number(a?.images?.length||0) || Number(a?.totalRub||Number.MAX_SAFE_INTEGER)-Number(b?.totalRub||Number.MAX_SAFE_INTEGER) || String(a?.id||'').localeCompare(String(b?.id||''));
          };
          const raw=await readMarketOffers(market);
          const benz2020=raw.filter(r=>String(r?.make||'').toLowerCase()==='mercedes-benz'&&String(r?.model||'').toLowerCase()==='benz'&&Number(r?.year)===2020).map(r=>({
            id:r.id,sourceId:r.sourceId,sourceOfferId:r.sourceOfferId,sourceUrl:r.sourceUrl,sourceTitle:r.sourceTitle,trim:r.trim,year:r.year,
            resolvedModel:canonicalSourceModelIdentity(String(r?.sourceTitle||r?.trim||''),String(r?.make||''),String(r?.model||'')),images:r?.images?.length||0,totalRub:r.totalRub
          }));
          const normalized=await Promise.all(raw.map(async row=>normalizeVehicleOfferSpecs({...await enrichOfferWithVehicleKnowledge(row),status:'active',images:credibleCatalogImages(row?.images||[]).slice(0,30)})));
          const rejectedQuality=[];
          const candidates=[];
          for(const offer of normalized){
            const ok=offer?.id&&offer?.market===market&&offer?.make&&offer?.model&&isCatalogYearAllowed(offer?.year,market)&&isCatalogOfferBusinessLiquid(offer)&&hasCredibleOfferContent({...offer,status:'active'});
            if(ok)candidates.push(offer); else rejectedQuality.push(offer);
          }
          candidates.sort(quality);
          const rawBuckets=new Map();
          for(const offer of candidates){const k=catalogModelYearQuotaKey(offer,market); if(k)rawBuckets.set(k,[...(rawBuckets.get(k)||[]),offer]);}
          const overCapBefore=[...rawBuckets.entries()].filter(([,rows])=>rows.length>CATALOG_MAX_OFFERS_PER_MODEL_YEAR).sort((a,b)=>b[1].length-a[1].length).map(([key,rows])=>({key,count:rows.length,sample:rows.slice(0,5).map(r=>({id:r.id,make:r.make,model:r.model,year:r.year,sourceId:r.sourceId,totalRub:r.totalRub,images:r.images?.length||0}))}));
          const counts=new Map(); const selected=[]; const rejectedQuota=[];
          for(const offer of candidates){const key=catalogModelYearQuotaKey(offer,market); if(!key){rejectedQuality.push(offer);continue;} const n=Number(counts.get(key)||0); if(n>=CATALOG_MAX_OFFERS_PER_MODEL_YEAR){rejectedQuota.push(offer);continue;} counts.set(key,n+1);selected.push(offer);}
          const sourceDist=rows=>rows.reduce((o,r)=>{const k=String(r?.sourceId||'<missing>');o[k]=(o[k]||0)+1;return o;},{});
          const resolvedDist=benz2020.reduce((o,r)=>{const k=String(r.resolvedModel||'<unresolved>');o[k]=(o[k]||0)+1;return o;},{});
          const report={mode:'read_only_europe_cap_fast_audit',before:raw.length,postQuality:candidates.length,selected:selected.length,removedByQuality:rejectedQuality.length,removedByModelYearQuota:rejectedQuota.length,maxBefore:Math.max(0,...[...rawBuckets.values()].map(x=>x.length)),maxAfter:Math.max(0,...counts.values()),overCapBefore,sourceBefore:sourceDist(raw),sourceSelected:sourceDist(selected),benz2020ResolvedDist:resolvedDist,benz2020,rejectedQuota:rejectedQuota.map(r=>({id:r.id,make:r.make,model:r.model,year:r.year,sourceId:r.sourceId,totalRub:r.totalRub,images:r.images?.length||0}))};
          fs.writeFileSync('issue241-europe-cap-fast-audit.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.maxAfter>20) throw new Error(`post_cap_still_over:${report.maxAfter}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-europe-cap-fast-audit
          path: issue241-europe-cap-fast-audit.json
          if-no-files-found: error
          retention-days: 2
