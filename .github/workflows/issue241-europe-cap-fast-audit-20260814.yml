name: Issue241 Europe cap fast audit 20260814
# read-only projection of the exact live Mercedes-Benz/Benz/2020 identity migration

on:
  push:
    branches: [ops/issue241-europe-cap-fast-audit-20260814]
    paths:
      - '.github/workflows/issue241-europe-cap-fast-audit-20260814.yml'

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only Europe Mercedes identity migration projection
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { canonicalSourceModelIdentity } = await import('./apps/web/lib/catalog/open-source-normalizer.ts');
          const { CATALOG_MAX_OFFERS_PER_MODEL_YEAR, catalogModelYearQuotaKey } = await import('./apps/web/lib/catalog/inventory-quota.ts');
          const { isCatalogYearAllowed } = await import('./apps/web/lib/catalog/offer-quality.ts');

          const expectedIds=new Set([
            '6906d7d816052a5b2610666f','7b737a21efadae84bc00104e','8b29e7fa08328ea7a4d16ed1','8a1b9bbd4ce168a51136acd4','22548d939e36f93b2d23053e','c835149813ac708e08b77c14','f228176becb418e474e18b64','e04352f15be8d6355936a213','40c1138f805b48b80f36e801','3061cad0b39c3bae276f8808','39d626b9ee8a070564d1952c','9fdd0a08b1efc2b8a83e4ef6','beb7379dbe7bcf373627ed45','32c64c33b90badffffe9de75','a1fdbf847f3c2b26d7e864b3','88e2dd1d739bbebce517db83','0c4dbe2ffba19fd4c1bb1577','92c84da829bb66e7e82d6e98','0638f8764fc2d2e8b88952c6','794f491d05c214dc565e3e78','8408cab3872e99690c2f371a','832ae9f292172221aa6d6b70','ca61c88592911c1f4099b5a6'
          ]);
          const expectedDist={'A-Class':6,'B-Class':6,'C-Class':1,'E-Class':4,'Sprinter':3,'Vito':3};
          const rows=await readMarketOffers('europe');
          if(rows.length!==3604) throw new Error(`europe_count_drift:${rows.length}`);
          const targets=rows.filter(r=>String(r?.make||'').toLowerCase()==='mercedes-benz'&&String(r?.model||'').toLowerCase()==='benz'&&Number(r?.year)===2020);
          const targetIds=new Set(targets.map(r=>String(r.id)));
          if(targetIds.size!==expectedIds.size||[...expectedIds].some(id=>!targetIds.has(id))) throw new Error(`benz2020_identity_drift:${targetIds.size}`);

          const resolved=[];
          const projected=rows.map(r=>{
            if(!expectedIds.has(String(r.id))) return r;
            const model=canonicalSourceModelIdentity(String(r?.sourceTitle||r?.trim||''),String(r?.make||''),String(r?.model||''));
            if(!model||model.toLowerCase()==='benz') throw new Error(`unresolved_target:${r.id}:${r.sourceTitle||r.trim||''}`);
            resolved.push({id:r.id,sourceId:r.sourceId,sourceOfferId:r.sourceOfferId,from:r.model,to:model,sourceTitle:r.sourceTitle,images:r.images?.length||0,totalRub:r.totalRub});
            return {...r,model};
          });
          const dist=resolved.reduce((o,r)=>(o[r.to]=(o[r.to]||0)+1,o),{});
          if(JSON.stringify(Object.fromEntries(Object.entries(dist).sort()))!==JSON.stringify(Object.fromEntries(Object.entries(expectedDist).sort()))) throw new Error(`unexpected_resolved_distribution:${JSON.stringify(dist)}`);
          const counts=new Map();
          for(const r of projected){
            if(!isCatalogYearAllowed(r?.year,'europe')) throw new Error(`bad_year:${r.id}:${r.year}`);
            const key=catalogModelYearQuotaKey(r,'europe');
            if(!key) throw new Error(`missing_quota_key:${r.id}`);
            counts.set(key,(counts.get(key)||0)+1);
          }
          const over=[...counts.entries()].filter(([,n])=>n>CATALOG_MAX_OFFERS_PER_MODEL_YEAR).sort((a,b)=>b[1]-a[1]);
          const max=Math.max(0,...counts.values());
          const report={mode:'read_only_europe_mercedes_identity_projection',before:rows.length,after:projected.length,targetCount:targets.length,resolvedCount:resolved.length,resolvedDistribution:dist,maxPerExactModelYearAfter:max,overCapAfter:over,resolved};
          fs.writeFileSync('issue241-europe-cap-fast-audit.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(over.length) throw new Error(`projected_overcap:${JSON.stringify(over.slice(0,10))}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-europe-cap-fast-audit
          path: issue241-europe-cap-fast-audit.json
          if-no-files-found: error
          retention-days: 2
