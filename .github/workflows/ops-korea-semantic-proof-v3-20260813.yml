name: Ops · Korea semantic proof v3 20260813
run-name: Korea semantic proof v3 · ${{ github.sha }}

on:
  push:
    branches:
      - ops/korea-semantic-live-refresh-v3-20260813
    paths:
      - ".github/workflows/ops-korea-semantic-proof-v3-20260813.yml"

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate current semantic and quota contracts
        run: |
          set -euo pipefail
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --import tsx --test tests/catalog-source-price-and-body-contract.test.ts tests/catalog-production-hardening.test.ts tests/catalog-model-year-quota.test.ts tests/catalog-global-model-cap.test.ts
      - name: Strict current all-seven baseline
        env:
          CATALOG_AUDIT_OUTPUT: korea-v3-preflight-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v3-preflight
          path: korea-v3-preflight-all7.json
          if-no-files-found: warn
          retention-days: 3

  collect:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [encar_direct, kcar_korea_open, kbchachacha_korea_open]
    env:
      RECOVERY_MARKET: korea
      RECOVERY_SOURCE_IDS: ${{ matrix.source }}
      RECOVERY_OUTPUT: catalog-shard-korea-${{ matrix.source }}.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect one fresh Korea source shard without catalog writes
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v3-source-${{ matrix.source }}
          path: catalog-shard-korea-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3

  gate:
    needs: [preflight, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: korea-v3-source-*
          path: korea-shards
      - name: Merge all three fresh Korea shards
        env:
          RECOVERY_MERGE_MARKET: korea
          RECOVERY_MERGE_INPUT_DIR: korea-shards
          RECOVERY_MERGE_OUTPUT: catalog-rebuild-korea.json
        run: node scripts/catalog-live-recovery-merge-shards.mjs
      - name: Enforce semantic provenance gate
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('catalog-rebuild-korea.json','utf8'));
          const rows=Array.isArray(p.offers)?p.offers:[];
          const dist=(field,subset=rows)=>subset.reduce((o,r)=>{const k=String(r?.[field]??'<missing>').trim()||'<missing>';o[k]=(o[k]||0)+1;return o;},{});
          const sources=dist('sourceId');
          const encar=rows.filter(r=>r.sourceId==='encar_direct');
          const suv=encar.filter(r=>/^(?:suv|crossover)$/i.test(String(r.bodyType||''))).length;
          const ratio=encar.length?suv/encar.length:1;
          const known=(r)=>/(?:genesis\s*)?g80|grandeur|그랜저|ioniq\s*6|아이오닉\s*6/i.test(`${r.make||''} ${r.model||''} ${r.sourceTitle||''}`);
          const knownRows=rows.filter(known);
          const badSedans=knownRows.filter(r=>/^(?:suv|crossover|offroad)$/i.test(String(r.bodyType||'')));
          const isHyundai=(v)=>/hyundai|현대|хенд[эе]/i.test(String(v||''));
          const isCasper=(v)=>/casper|캐스퍼|каспер/i.test(String(v||''));
          const casper2022=rows.filter(r=>Number(r.year)===2022&&isHyundai(r.make)&&isCasper(r.model));
          const badYears=rows.filter(r=>Number(r.year)<2020);
          const foreign=rows.filter(r=>r.market!=='korea');
          const report={total:rows.length,sources,bodyType:dist('bodyType'),drive:dist('drive'),transmission:dist('transmission'),fuel:dist('fuel'),encar:{count:encar.length,suvOrCrossover:suv,suvRatio:Number(ratio.toFixed(4))},knownSedans:{count:knownRows.length,violations:badSedans.length,sample:badSedans.slice(0,10).map(r=>({sourceId:r.sourceId,make:r.make,model:r.model,year:r.year,bodyType:r.bodyType,id:r.sourceOfferId}))},casper2022:casper2022.length,badYears:badYears.length,foreign:foreign.length};
          fs.writeFileSync('korea-v3-semantic-gate.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          for(const source of ['encar_direct','kcar_korea_open','kbchachacha_korea_open']) if(!(Number(sources[source]||0)>0)) throw new Error(`missing_source:${source}`);
          if(badYears.length||foreign.length) throw new Error(`market_or_age_violation:${badYears.length}:${foreign.length}`);
          if(encar.length<100||ratio>0.75) throw new Error(`encar_body_distribution_still_corrupt:${encar.length}:${ratio}`);
          if(knownRows.length&&badSedans.length) throw new Error(`known_sedan_body_violation:${badSedans.length}`);
          if(!casper2022.length) throw new Error('casper_2022_missing');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: korea-v3-preflight
          path: korea-baseline
      - name: Make batch dry-run preserve untouched markets exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-publish-batch.mjs')
          s=p.read_text()
          old='''.filter((offer) => offer.id && offer.make && offer.model && isCatalogYearAllowed(offer.year, other) && offer.images.length > 0 && withinRetention(offer) && canonicalPublic(offer) && isCatalogOfferBusinessLiquid(offer))'''
          new='''.filter((offer) => offer.id && offer.make && offer.model && isCatalogYearAllowed(offer.year, other) && offer.images.length > 0)'''
          if s.count(old)!=1: raise SystemExit('batch preservation filter not found exactly once')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Dry-run Korea publication only
        env:
          RECOVERY_BATCH_MARKETS: korea
          RECOVERY_BATCH_INPUT_DIR: .
          RECOVERY_BATCH_REPORT: korea-v3-publish-dry-run.json
          RECOVERY_BATCH_DRY_RUN: "1"
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Require all six untouched market counts unchanged in dry-run
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const before=JSON.parse(fs.readFileSync('korea-baseline/korea-v3-preflight-all7.json','utf8'));
          const dry=JSON.parse(fs.readFileSync('korea-v3-publish-dry-run.json','utf8'));
          const k=dry.byMarket?.korea||{};
          if(!dry.dryRun||Number(k.count||0)<=0||Number(k.maxOffersPerModelYear||0)!==20) throw new Error('korea_dry_run_invalid');
          for(const market of ['china','japan','uae','europe','georgia','kyrgyzstan']) {
            const a=Number(before.markets?.[market]?.count||0), b=Number(dry.preservedByMarket?.[market]||0);
            if(a!==b) throw new Error(`dry_run_would_change_${market}:${a}->${b}`);
          }
          console.log(JSON.stringify({korea:k,preserved:dry.preservedByMarket},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v3-proof
          path: |
            catalog-rebuild-korea.json
            korea-v3-semantic-gate.json
            korea-v3-publish-dry-run.json
            korea-baseline/korea-v3-preflight-all7.json
          if-no-files-found: warn
          retention-days: 3
