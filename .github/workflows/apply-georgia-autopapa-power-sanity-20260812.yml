name: Apply Georgia AutoPapa power sanity fix 20260812

on:
  push:
    branches:
      - fix/georgia-autopapa-power-sanity-20260812
    paths:
      - .github/workflows/apply-georgia-autopapa-power-sanity-20260812.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georgia-autopapa-power-sanity-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch parser and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('apps/web/lib/catalog/autopapa-georgia-source.ts')
          text = source.read_text()
          old = 'return Number.isFinite(value) && value > 0 && value <= 2_500 ? value : undefined;'
          new = 'return Number.isFinite(value) && value >= 20 && value <= 2_500 ? value : undefined;'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected AutoPapa power guard count: {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('tests/autopapa-georgia-current-parser-20260812.test.ts')
          test_text = test.read_text()
          marker = 'AutoPapa seller power below the catalog plausibility floor stays unknown'
          addition = r'''

test("AutoPapa seller power below the catalog plausibility floor stays unknown", () => {
  const oneHp = `<div>Body Type: suv Power: 1 hp Engine Vol: 1.5 l</div><div>Car description</div>`;
  const twoHp = `<div>Body Type: sedan Power: 2 hp Engine Vol: 2.0 l</div><div>Car description</div>`;
  const boundary = `<div>Body Type: hatchback Power: 20 hp Engine Vol: 1.0 l</div><div>Car description</div>`;
  assert.equal(autoPapaDetailPowerHp(oneHp), undefined);
  assert.equal(autoPapaDetailPowerHp(twoHp), undefined);
  assert.equal(autoPapaDetailPowerHp(boundary), 20);
});
'''
          if marker not in test_text:
              test.write_text(test_text.rstrip() + addition)
          PY
      - name: Test AutoPapa parser
        run: node --import tsx --test tests/autopapa-georgia-current-parser-20260812.test.ts
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/autopapa-georgia-source.ts tests/autopapa-georgia-current-parser-20260812.test.ts
          git diff --cached --check
          git commit -m 'fix(georgia): reject implausible AutoPapa seller power'
          git push origin HEAD:fix/georgia-autopapa-power-sanity-20260812
