name: TEMP UAE rebuild watch

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-uae-run-watch.yml'

permissions:
  actions: read
  contents: write

jobs:
  patch-carswitch-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/carswitch-transient-202-retry-20260824
      - name: Restrict transient retry to observed 202 response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/lib/catalog/carswitch-exact-source.ts')
          s=p.read_text()
          old='const transientShell = response.status === 202 || (response.status === 200 && markup.length < 50_000);'
          new='const transientShell = response.status === 202;'
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('transient expression missing')
          p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/carswitch-exact-source.ts
          git diff --cached --check
          git commit -m 'Retry only observed CarSwitch 202 shell'
          git push origin HEAD:fix/carswitch-transient-202-retry-20260824

  inspect:
    needs: patch-carswitch-retry
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Inspect UAE rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/jeep-jim/AvtoCena'
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          curl -fsS "${hdr[@]}" "$api/actions/runs/32747455843" | jq '{id,status,conclusion,run_attempt,created_at,updated_at,html_url}'
          curl -L --retry 2 --max-time 45 -fsS 'https://avtocena.com/cars/offer/243f5ab811ee7e86251ba6f7' -o offer.html || true
          grep -Eo '.{0,100}(959.?682|2.?219.?245|12900).{0,100}' offer.html 2>/dev/null | head -30 || true
