name: Owner cooperative stop of two catalog refreshes (Nov 20)
on:
  push:
    branches: ['ops/owner-cooperative-stop-20261120']
    paths: ['.github/workflows/owner-cooperative-stop-20261120.yml']
permissions: {}
jobs:
  cancel:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/ops/owner-cooperative-stop-20261120' && github.event.before == '15f51970fb68555ad56b7c40f622517a15643377' && github.event.head_commit.message == 'Cancel two in-flight scheduled catalog writers by owner direction'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_RUN_CANCEL_TOKEN: ${{ github.token }}
    steps:
      - name: Cooperatively cancel exact active Europe and Georgia runs only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          BASE='https://api.github.com/repos/jeep-jim/AvtoCena/actions/runs/'
          HEAD='15f51970fb68555ad56b7c40f622517a15643377'
          REPO=1289722938
          targets=[
            (44637245131,363942889,135967261650,'.github/workflows/catalog-refresh-europe.yml'),
            (44636687252,363942890,135977714373,'.github/workflows/catalog-refresh-georgia.yml'),
          ]
          headers={'Authorization':'Bearer '+os.environ['GH_RUN_CANCEL_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*_args,**_kwargs):
                  return None
          opener=urllib.request.build_opener(NoRedirect())
          def get_json(url):
              with opener.open(urllib.request.Request(url,headers=headers),timeout=20) as response:
                  return json.loads(response.read(1000000))
          for rid,wid,jid,path in targets:
              url=BASE+str(rid)
              run=get_json(url)
              if (run.get('id'),run.get('workflow_id'),run.get('path'),run.get('run_attempt'),run.get('head_sha'),run.get('head_branch'),run.get('event'),(run.get('repository') or {}).get('id')) != (rid,wid,path,1,HEAD,'main','schedule',REPO):
                  raise SystemExit('Aborted: exact run identity did not match')
              if run.get('status') != 'in_progress':
                  print(json.dumps({'run_id':rid,'action':'not_requested','status':run.get('status'),'conclusion':run.get('conclusion')}))
                  continue
              jobs=get_json(url+'/jobs?per_page=20')['jobs']
              if not any(j.get('id')==jid and j.get('status')=='in_progress' and j.get('run_id')==rid for j in jobs):
                  print(json.dumps({'run_id':rid,'action':'not_requested','reason':'publish_job_no_longer_active'}))
                  continue
              try:
                  with opener.open(urllib.request.Request(url+'/cancel',data=b'',headers=headers,method='POST'),timeout=20) as response:
                      if response.status!=202: raise SystemExit('Cancellation was not accepted')
                      print(json.dumps({'run_id':rid,'action':'normal_cancel_accepted','confirmed_terminal':False}))
              except urllib.error.HTTPError as exc:
                  if exc.code!=409: raise SystemExit('Cancellation API HTTP '+str(exc.code))
                  after=get_json(url)
                  if after.get('status') not in ('completed','cancelled'): raise SystemExit('Cancellation conflicted; not retried')
                  print(json.dumps({'run_id':rid,'action':'already_finished','status':after.get('status'),'conclusion':after.get('conclusion')}))
          PY
