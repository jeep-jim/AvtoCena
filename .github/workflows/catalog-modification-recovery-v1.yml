name: Catalog modification recovery v1 — no write

on:
  push:
    branches: [feat/catalog-modification-recovery-v1-20260906]
    paths:
      - .github/workflows/catalog-modification-recovery-v1.yml
      - scripts/catalog-saved-recovery-audit-v1.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-modification-recovery-v1
  cancel-in-progress: false

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CATALOG_LIVE_RATE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify modification isolation and existing calculation contracts
        run: node --import tsx --test tests/catalog-modification-recovery.test.ts tests/catalog-editable-power-scenario.test.ts tests/customs-representative-power-safety.test.ts tests/catalog-source-fuel-evidence.test.ts tests/catalog-customs-identity.test.ts tests/catalog-public-offer-deduplication.test.ts tests/catalog-filter-search.test.ts tests/catalog-autoscout-specification-evidence.test.ts tests/catalog-che168-specification-evidence.test.ts tests/catalog-encar-specification-evidence.test.ts tests/catalog-dubizzle-specification-evidence.test.ts
      - run: npm run typecheck
      - run: npm run build
  saved-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read saved non-Japan generation with GET-only guard
        env:
          JSON_STORAGE_DRIVER: object
          CATALOG_LIVE_RATE_DISABLED: 'true'
          YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
        run: node --import tsx scripts/catalog-saved-recovery-audit-v1.mjs
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-modification-recovery-v1-${{ github.sha }}
          path: catalog-saved-recovery-audit-v1.json
          if-no-files-found: error
          retention-days: 14
