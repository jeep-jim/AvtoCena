name: Build source retirement data migration
on:
  push:
    branches: [fix/remove-legacy-source]
    paths: ['.github/workflows/source-removal-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Remove retired records and rebuild validated search data
        run: |
          python scripts/retire-provider-data-once.py
          node scripts/vehicle-encyclopedia/validate.mjs --write-reports
          node scripts/vehicle-encyclopedia/build-search-index.mjs
      - name: Commit generated data on the isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs roadmap.md
          git commit -m 'data: remove retired source records and rebuild validated indexes'
          git push origin HEAD:fix/remove-legacy-source
