name: Catalog V2 strict Smoke10 reusable

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false
      CATALOG_IMAGE_CDN_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  CATALOG_REBUILD_TARGET_PER_SOURCE: "10"
  CATALOG_REBUILD_TARGET_PER_MARKET: "10"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "10"
  CATALOG_PUBLISH_MAX_PER_MARKET: "10"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "10"
  CATALOG_MAX_IMAGES_PER_OFFER: "10"
  CATALOG_COLLECTION_IMAGE_LIMIT: "10"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "100000000"

jobs:
  smoke10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_SHARD_INDEX: "0"
      CATALOG_REBUILD_SHARD_COUNT: "1"
      CATALOG_V2_SOURCE_SLOTS_ONLY: "0"
      CATALOG_REBUILD_IGNORE_PROBE: "0"
      CATALOG_REBUILD_RESET_CURSOR: "0"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "100"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "500"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "10"
      CATALOG_REBUILD_MAX_SOURCE_ERRORS: "3"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "30"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "10"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "4"
      CATALOG_REBUILD_TIME_LIMIT_MS: "1200000"
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_TIMEOUT_MS: "20000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "6"
      CATALOG_GALLERY_FAST_PATH: "false"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-0.json
      CATALOG_PROBE_OUTPUT: catalog-smoke10-probe-${{ inputs.market }}.json
      CATALOG_REBUILD_INPUT_DIR: catalog-smoke10-input
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-smoke10-${{ inputs.market }}-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-smoke10-${{ inputs.market }}-publish-report.json
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "10"
      CATALOG_INDEX_WRITE_CONCURRENCY: "8"
      CATALOG_STORAGE_EMERGENCY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Smoke10 pipeline
        run: |
          node --check scripts/catalog-probe-source-shard.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-publish-market.mjs
          node --import tsx --test tests/catalog-calculation-integrity.test.ts tests/catalog-image-quality.test.ts
      - name: Probe real sources
        run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Collect real offers
        run: npx tsx scripts/catalog-rebuild-source-shard.mjs
      - name: Require at least ten collected real offers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT,'utf8'));
          const offers=Array.isArray(p.offers)?p.offers:[];
          if(offers.length<10) throw new Error(`smoke10_collected_only_${offers.length}`);
          p.offers=offers.slice(0,10);
          p.count=10;
          fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT,JSON.stringify(p,null,2));
          NODE
      - name: Prepare publication input
        run: |
          mkdir -p "$CATALOG_REBUILD_INPUT_DIR"
          cp "$CATALOG_REBUILD_OUTPUT" "$CATALOG_REBUILD_INPUT_DIR/"
      - name: Validate calculations and galleries
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish exactly ten
        run: npx tsx scripts/catalog-publish-market.mjs
      - name: Require strict Smoke10 publication
        run: |
          node <<'NODE'
          const fs=require('fs');
          const market=process.env.CATALOG_REBUILD_MARKETS;
          const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,'utf8'));
          const count=Number(p.byMarket?.[market]||0);
          const state={market,published:p.published===true,generationId:p.generationId||null,count,publicationError:p.publicationError||'',sources:p.byMarketAndSource?.[market]||{}};
          console.log(JSON.stringify(state,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Smoke10 ${market}\n\n\`\`\`json\n${JSON.stringify(state,null,2)}\n\`\`\`\n`);
          if(!state.published||!state.generationId||state.count!==10||state.publicationError||Object.keys(state.sources).length<1) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-smoke10-${{ inputs.market }}-reports
          path: |
            catalog-smoke10-probe-${{ inputs.market }}.json
            catalog-rebuild-${{ inputs.market }}-0.json
            catalog-smoke10-${{ inputs.market }}-validation-report.json
            catalog-smoke10-${{ inputs.market }}-publish-report.json
          retention-days: 7
