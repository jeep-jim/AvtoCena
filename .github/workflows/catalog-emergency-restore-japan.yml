name: Catalog emergency · restore Japan baseline
run-name: Restore Japan from verified full generation · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_OFFER_RETENTION_MS: "2592000000"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recovery code before storage access
        run: |
          node --check scripts/catalog-recover-generations.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
      - name: Recover Japan and retain every currently valid market card
        env:
          CATALOG_RECOVERY_GENERATIONS: "gen_1786426826475_e390aa80"
          CATALOG_RECOVERY_MARKETS: "korea,china,japan,uae,europe,georgia"
          CATALOG_RECOVERY_MAX_CHUNKS: "50"
          CATALOG_RECOVERY_FORCE: "true"
          CATALOG_RECOVERY_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4}'
          CATALOG_GROW_ONLY_MARKETS: ""
        run: npx tsx scripts/catalog-recover-generations.mjs | tee catalog-emergency-japan-restore.log
      - name: Verify Japan and all six preserved markets
        env:
          CATALOG_AUDIT_OUTPUT: catalog-emergency-japan-restore-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: japan
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-emergency-japan-restore-report
          path: |
            catalog-emergency-japan-restore.log
            catalog-emergency-japan-restore-audit.json
          if-no-files-found: warn
          retention-days: 7
