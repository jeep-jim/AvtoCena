name: Catalog · Restore pre-inventory checkpoint 20260908
on:
  push:
    branches: [fix/catalog-preinventory-recovery-20260908]
    paths:
      - scripts/catalog-restore-preinventory-20260908.mjs
      - .github/workflows/catalog-preinventory-recovery-20260908.yml
permissions:
  contents: read
concurrency:
  group: catalog-weekly-six-markets
  cancel-in-progress: false
env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check scripts/catalog-restore-preinventory-20260908.mjs
      - name: Restore exact verified checkpoint under catalog lock
        run: node --import tsx scripts/catalog-restore-preinventory-20260908.mjs
      - name: Verify all read models match restored generation
        run: node --import tsx scripts/catalog-audit-current-readmodel-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-preinventory-recovery
          path: catalog-*report.json
          retention-days: 30
