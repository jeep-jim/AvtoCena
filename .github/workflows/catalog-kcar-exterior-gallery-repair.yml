name: Catalog Korea · K Car exterior gallery repair
run-name: K Car exterior-first v3 repair · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_GROW_ONLY_MARKETS: korea

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild stored K Car galleries with exterior-first covers
        env:
          CATALOG_GALLERY_MARKETS: korea
          CATALOG_GALLERY_SOURCE_IDS: kcar_korea_open
          CATALOG_GALLERY_OFFER_IDS: ea47a6479af9573f028be640
          CATALOG_GALLERY_MAX_OFFERS: "1000"
          CATALOG_GALLERY_MAX_PER_MARKET: "1000"
          CATALOG_GALLERY_MIN_IMAGES: "1"
          CATALOG_MAX_IMAGES_PER_OFFER: "30"
          CATALOG_GALLERY_PERSIST_EVERY: "500"
          CATALOG_GALLERY_CONCURRENCY: "8"
          CATALOG_GALLERY_RETIRE_CONFIRMED_UNAVAILABLE: "true"
          CATALOG_GALLERY_DROP_CREDENTIAL_SCANS: "true"
          CATALOG_GROW_ONLY_MARKETS: ""
          CATALOG_GALLERY_REPORT_FILE: catalog-kcar-exterior-gallery-refresh.json
        run: npx tsx scripts/catalog-refresh-galleries.mjs
      - name: Audit all six markets after gallery repair
        if: always()
        env:
          CATALOG_AUDIT_OUTPUT: catalog-kcar-exterior-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-kcar-exterior-gallery-repair
          path: |
            catalog-kcar-exterior-gallery-refresh.json
            catalog-kcar-exterior-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
