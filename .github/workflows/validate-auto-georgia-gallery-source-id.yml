name: Validate AUTO.GE source-bound gallery identity

on:
  push:
    branches: [fix/georgia-gallery-source-id-scope-20260811]
    paths:
      - .github/workflows/validate-auto-georgia-gallery-source-id.yml

permissions:
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "12"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georgia-gallery-source-id-scope-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply production patch
        run: python3 scripts/patch-auto-georgia-gallery-source-id.py
      - name: Typecheck
        run: npm run typecheck
      - name: Synthetic source-ID filter smoke
        run: |
          npx tsx -e 'import {autoGeorgiaImageMatchesListing as m} from "./apps/web/lib/catalog/auto-georgia-source.ts"; const good="https://fra1.digitaloceanspaces.com/www.auto.ge/listings/01-2026/ad1421177/ford.webp"; const bad="https://fra1.digitaloceanspaces.com/www.auto.ge/listings/02-2025/ad1122742/jeep.webp"; if(!m(good,"1421177")) throw new Error("exact image rejected"); if(m(bad,"1421177")) throw new Error("cross-listing image accepted"); console.log("synthetic_gallery_identity_ok")'
      - name: Collect current AUTO.GE shard without publishing
        env:
          RECOVERY_MARKET: georgia
          RECOVERY_SOURCE_IDS: auto_georgia_open
          RECOVERY_OUTPUT: auto-georgia-source-id-smoke.json
          RECOVERY_TARGET: "40"
          RECOVERY_MAX_PAGES: "12"
          RECOVERY_TIME_LIMIT_MS: "600000"
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Assert every accepted image belongs to the exact sourceOfferId
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('auto-georgia-source-id-smoke.json','utf8'));
          const offers=Array.isArray(d.offers)?d.offers:[];
          if(!offers.length) throw new Error('no accepted AUTO.GE offers');
          let images=0;
          const bad=[];
          for(const o of offers){
            const sid=String(o.sourceOfferId||'');
            for(const im of (o.images||[])){
              images++;
              const u=String(im.url||'');
              const m=u.match(/\/ad(\d+)\//i);
              if(!m || m[1]!==sid) bad.push({sid,url:u});
            }
          }
          console.log({offers:offers.length,images,bad:bad.slice(0,5)});
          if(!images) throw new Error('accepted AUTO.GE offers have no source-bound images');
          if(bad.length) throw new Error(`cross-listing images survived: ${bad.length}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-georgia-source-id-smoke
          path: auto-georgia-source-id-smoke.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated production file only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/auto-georgia-source.ts
          git diff --cached --quiet && exit 0
          git commit -m "Scope AUTO.GE gallery images to exact listing ID [skip actions]"
          git push origin HEAD:fix/georgia-gallery-source-id-scope-20260811
