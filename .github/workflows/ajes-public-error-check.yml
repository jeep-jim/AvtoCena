name: AJ System — bounded public error codes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ajes-public-error-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only allowlisted application error codes
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 "docker logs --since 15m --tail 1000 avtocena-production 2>&1 | grep -Eo 'AJES_(PUBLIC|DIRECTORY)_FAILURE (client_ip_missing|not_configured|invalid_response|visitor_restricted|request_failed|request_timeout|connect_timeout|response_too_large|empty_response|identity_mismatch|quota_invalid|quota_exhausted|quota_busy|operation_failed)' | tail -20"
