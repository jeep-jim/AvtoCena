name: Dry Run Live Catalog Identity Reprojection

on:
  push:
    branches:
      - recovery/encyclopedia-v2-staging-20260818
    paths:
      - .github/workflows/dry-run-live-catalog-identity-reprojection.yml

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-encyclopedia-identity-resolver-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read live offers and dry-run canonical identity
        id: reprojection
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --import tsx <<'NODE'
            const { readAllOffersForMaintenance } = await import('./apps/web/lib/catalog/storage.ts');
            const { readEncyclopediaIdentityResolver } = await import('./apps/web/lib/catalog/encyclopedia-identity-data.ts');
            const { planEncyclopediaIdentityReprojection } = await import('./apps/web/lib/catalog/encyclopedia-identity-reprojection.ts');
            const offers = await readAllOffersForMaintenance();
            const resolver = await readEncyclopediaIdentityResolver();
            if (!resolver) throw new Error('identity_resolver_unavailable');
            const { rows, report } = planEncyclopediaIdentityReprojection(resolver, offers);
            if (rows.length !== offers.length) throw new Error(`offer_count_changed:${offers.length}:${rows.length}`);
            const result = { verifiedFeatureSha: process.env.GITHUB_SHA || null, resolverCollisions: resolver.collisions, report };
            require('fs').writeFileSync('/tmp/live-identity-reprojection-dry-run.json', JSON.stringify(result,null,2)+'\n');
            console.log(JSON.stringify(result,null,2));
            NODE
            test -s /tmp/live-identity-reprojection-dry-run.json
          } 2>&1 | tee /tmp/live-identity-reprojection-dry-run.log
      - name: Persist dry-run diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEP_OUTCOME: ${{ steps.reprojection.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin recovery/encyclopedia-v2-staging-20260818
          git worktree add /tmp/recovery origin/recovery/encyclopedia-v2-staging-20260818
          cd /tmp/recovery
          mkdir -p recovery-assets/encyclopedia-v2-20260818/audits
          if [ -s /tmp/live-identity-reprojection-dry-run.json ]; then cp /tmp/live-identity-reprojection-dry-run.json recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.json; fi
          if [ -s /tmp/live-identity-reprojection-dry-run.log ]; then cp /tmp/live-identity-reprojection-dry-run.log recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.log; fi
          printf 'verified_feature_sha=%s\njob_status=%s\nstep_outcome=%s\nverified_at=%s\n' "$VERIFIED_SHA" "$JOB_STATUS" "$STEP_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.meta.txt
          git add recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.meta.txt
          [ ! -f recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.json ] || git add recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.json
          [ ! -f recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.log ] || git add recovery-assets/encyclopedia-v2-20260818/audits/live-identity-reprojection-dry-run.log
          git commit -m 'chore(recovery): record live identity reprojection dry-run diagnostics' || true
          git push origin HEAD:recovery/encyclopedia-v2-staging-20260818
      - name: Fail if dry-run failed
        if: steps.reprojection.outcome != 'success'
        run: exit 1
