name: Verify China saved input freshness (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-fresh-input-readonly-20261119.yml']
permissions:
  contents: read
concurrency:
  group: china-fresh-input-readonly-20261119
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Verify China input against deployed archive receipt format'
    environment: regcloud-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          path: archive-reader
          persist-credentials: false
      - name: Bind the previously reviewed China archive reader to this probe
        run: |
          set -euo pipefail
          test "$(git -C archive-reader rev-parse HEAD)" = bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          test "$(git -C archive-reader hash-object scripts/lib/nonjp-intake-archive.mjs)" = e986f30a4392b85d0e7f6fcbc71ea383e386a663
          cp archive-reader/scripts/lib/nonjp-intake-archive.mjs scripts/lib/nonjp-intake-archive-probe.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise real read-only policy with fake transport
        run: node --test scripts/catalog-china-fresh-input-readonly.test.mjs
      - name: Read only the latest known China receipt and cursor metadata
        env:
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/catalog-china-fresh-input-readonly.mjs 44404227672:1 44185989741:1 44121174584:1 43977412840:1
