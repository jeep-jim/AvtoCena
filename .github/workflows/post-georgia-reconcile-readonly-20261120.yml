        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: "set -euo pipefail\numask 077\ngh api /repos/jeep-jim/AvtoCena/actions/runs/44636687252 > \"$RUNNER_TEMP/georgia-run.json\"\
        \ngh api /repos/jeep-jim/AvtoCena/actions/runs/44637245131 > \"$RUNNER_TEMP/europe-run.json\"\npython\
        \ - \"$RUNNER_TEMP/georgia-run.json\" \"$RUNNER_TEMP/europe-run.json\" <<'PYRUN' \nimport json,sys\n\
        r=json.load(open(sys.argv[1]))\nassert (r['id'],r['repository']['id'],r['run_attempt'],r['head_sha'],r['event'],r['head_branch'],r['path'],r['status'],r['conclusion'])==(44636687252,1289722938,1,'15f51970fb68555ad56b7c40f622517a15643377','schedule','main','.github/workflows/catalog-refresh-georgia.yml','completed','cancelled')\n\
        e=json.load(open(sys.argv[2]))\nassert (e['id'],e['repository']['id'],e['run_attempt'],e['head_sha'],e['event'],e['head_branch'],e['path'],e['status'])==(44637245131,1289722938,1,'15f51970fb68555ad56b7c40f622517a15643377','schedule','main','.github/workflows/catalog-refresh-europe.yml','completed')\
        \ and e['conclusion']\nPYRUN\ncat > \"$RUNNER_TEMP/inspect.mjs\" <<'READER'\nimport {createHash,createHmac}\
        \ from 'node:crypto';\nconst g='gen_1795139106795_31f0f85d',root='catalog/raw-feed-coordination/v1/',key='catalog/internal/manifest.json',lockKey='catalog/import-lock.json',stateKey=root+'state.json',policyKey=root+'policy.json',proofKey=root+'internal/'+g+'/provenance.json',sessionKey=root+'internal/'+g+'/session.json';\n\
        const pubKey='catalog/manifest.json',cursorNames=['china','uae','europe','georgia'],cursorKeys=cursorNames.map(m=>'catalog/intake-cursors/v1/'+m+'.json'),oldProofKey=root+'internal/gen_1794888961200_1ea2a688/provenance.json';\n\
        const keys=new Set([pubKey,key,lockKey,stateKey,policyKey,proofKey,sessionKey,oldProofKey,...cursorKeys]);\n\
        const sha=b=>createHash('sha256').update(b).digest('hex'),hmac=(k,s)=>createHmac('sha256',k).update(s).digest(),digest=v=>sha(JSON.stringify(v));\n\
        const require=(condition,code)=>{if(!condition)throw Error(code);};\nexport async function readExact(key,env=process.env,receiptKey=null){\n\
        \ require(keys.has(key)||(receiptKey===key&&/^catalog\\/raw-feed-coordination\\/v1\\/pointer-receipts\\\
