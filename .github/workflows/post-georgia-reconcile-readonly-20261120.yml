name: Reconcile exact post-Georgia internal and public state without writes
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/post-georgia-reconcile-readonly-20261120.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: post-georgia-reconcile-readonly-20261120
  cancel-in-progress: false
jobs:
  inspect:
