name: One-shot dispatch validated Japan Prestige recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-dispatch-japan-from-prestige-31418667417.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Japan live recovery from validated repaired Prestige artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run catalog-live-recovery-japan-from-prestige.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_run_id=31418667417
