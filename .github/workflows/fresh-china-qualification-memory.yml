name: Fresh China qualification memory fix
on:
  push:
    branches: [ops/fresh-artifact-qualification-20260917]
    paths: ['.github/workflows/fresh-china-qualification-memory.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: fresh-china-qualification-memory
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        market: [china]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_PUBLICATION_DRY_RUN: '1'
      CATALOG_REBUILD_INPUT_DIR: catalog-intake-publish
      CATALOG_INTAKE_INPUT_DIR: catalog-intake-input
      CATALOG_REBUILD_MARKETS: ${{ matrix.market }}
      CATALOG_REBUILD_PUBLISH_REPORT: qualification-${{ matrix.market }}.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '8'
      CATALOG_READ_CONCURRENCY: '4'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - name: Size verification heap from runner memory
        run: |
          node -e 'const fs=require("fs"); const m=Number(fs.readFileSync("/proc/meminfo","utf8").match(/MemTotal:\s+(\d+)/)[1]); const heap=Math.floor(m/1024*0.75); if(heap<7000) throw new Error("Runner memory insufficient for saved China verification"); fs.appendFileSync(process.env.GITHUB_ENV, `NODE_OPTIONS=--max-old-space-size=${heap}\n`); console.log({physicalMemoryMiB:Math.floor(m/1024),heapMiB:heap});'
      - run: npm ci
      - name: Verify baseline and compact storage contracts
        run: node --import tsx --test tests/catalog-inventory-regression.test.ts tests/catalog-internal-stream.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: fresh-${{ matrix.market }}
          path: catalog-intake-input/catalog-intake-${{ matrix.market }}
          run-id: 35167936226
          github-token: ${{ github.token }}
      - name: Convert saved observations without recrawling
        run: node --import tsx scripts/catalog-intake-to-publication.mjs
      - name: Calculate and compare with current catalog without publication
        run: node --import tsx scripts/catalog-publish-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.market }}
          path: qualification-*.json
          retention-days: 30
