name: One-shot Georgia VIN power audit read-only
run-name: Georgia VIN power audit read-only · ${{ github.sha }}

on:
  push:
    branches:
      - ops/georgia-power-audit-readonly-20260813
    paths:
      - .github/workflows/oneshot-georgia-power-audit-readonly-20260813.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch four bounded AutoPapa VIN-power batches
        run: |
          set -euo pipefail
          for start in 1 6 11 16; do
            echo "batch startPage=$start"
            curl -fsS --retry 1 --retry-delay 2 --max-time 240 \
              "https://avtocena.com/api/internal/georgia-vin-recovery-5c7d21?source=autopapa&pages=5&startPage=${start}" \
              -o "recovery-vin-${start}.json"
          done
      - name: Summarize read-only results
        run: |
          python3 - <<'PY'
          import glob,json
          totals={'count':0,'calculated':0,'preliminary':0,'converted':0}
          outcomes={}
          converted=[]
          for fn in sorted(glob.glob('recovery-vin-*.json')):
              r=json.load(open(fn)); rep=r.get('report') or {}; vin=rep.get('vinPower') or {}
              row={
                  'file':fn,'count':r.get('count'),'rawSourceCounts':rep.get('rawSourceCounts'),'sourceCounts':rep.get('sourceCounts'),
                  'rejected':rep.get('rejected'),'imageStats':rep.get('imageStats'),
                  'calculatedCount':rep.get('calculatedCount'),'preliminaryCount':rep.get('preliminaryCount'),'vinPower':vin,
              }
              print('BATCH',json.dumps(row,ensure_ascii=False))
              totals['count']+=int(r.get('count') or 0)
              totals['calculated']+=int(rep.get('calculatedCount') or 0)
              totals['preliminary']+=int(rep.get('preliminaryCount') or 0)
              totals['converted']+=int(vin.get('convertedCount') or 0)
              for k,v in (vin.get('outcomes') or {}).items(): outcomes[k]=outcomes.get(k,0)+int(v or 0)
              for o in r.get('offers') or []:
                  if str(o.get('powerDataSource') or '').startswith('nhtsa-vpic:'):
                      raw=((o.get('operational') or {}).get('raw') or {})
                      converted.append({
                          'id':o.get('sourceOfferId'),'make':o.get('make'),'model':o.get('model'),'year':o.get('year'),
                          'engineCc':o.get('engineCc'),'powerHp':o.get('powerHp'),'powerSource':o.get('powerDataSource'),
                          'status':o.get('calculationStatus'),'images':len(o.get('images') or []),
                          'vinTail':raw.get('autoPapaVinTail'),'vpicYear':raw.get('autoPapaVpicModelYear'),
                          'vpicDisplacementL':raw.get('autoPapaVpicDisplacementL')
                      })
          print('TOTAL',json.dumps({**totals,'outcomes':outcomes},ensure_ascii=False))
          for row in converted[:100]: print('CONVERTED',json.dumps(row,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-vin-power-audit-readonly
          path: recovery-vin-*.json
          if-no-files-found: warn
          retention-days: 1
