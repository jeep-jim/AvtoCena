name: One-shot Georgia VIN power audit read-only
run-name: Georgia VIN power audit read-only · ${{ github.sha }}

on:
  push:
    branches:
      - ops/georgia-power-audit-readonly-20260813
    paths:
      - .github/workflows/oneshot-georgia-power-audit-readonly-20260813.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch bounded canonical AutoPapa recovery with strict VIN power
        run: |
          set -euo pipefail
          curl -fsS --retry 1 --retry-delay 2 --max-time 720 \
            'https://avtocena.com/api/internal/georgia-vin-recovery-5c7d21?source=autopapa&pages=20&startPage=1' \
            -o recovery-vin.json
      - name: Summarize read-only results
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('recovery-vin.json'))
          rep=r.get('report') or {}
          vin=rep.get('vinPower') or {}
          offers=r.get('offers') or []
          print('RECOVERY_VIN',json.dumps({
              'count':r.get('count'),'rawSourceCounts':rep.get('rawSourceCounts'),'sourceCounts':rep.get('sourceCounts'),
              'rejected':rep.get('rejected'),'imageStats':rep.get('imageStats'),
              'calculatedCount':rep.get('calculatedCount'),'preliminaryCount':rep.get('preliminaryCount'),
              'vinPower':vin,
          },ensure_ascii=False))
          converted=[o for o in offers if str(o.get('powerDataSource') or '').startswith('nhtsa-vpic:')]
          print('CONVERTED_COUNT',len(converted))
          for o in converted[:50]:
              raw=((o.get('operational') or {}).get('raw') or {})
              print('CONVERTED',json.dumps({
                  'id':o.get('sourceOfferId'),'make':o.get('make'),'model':o.get('model'),'year':o.get('year'),
                  'engineCc':o.get('engineCc'),'powerHp':o.get('powerHp'),'powerSource':o.get('powerDataSource'),
                  'status':o.get('calculationStatus'),'images':len(o.get('images') or []),
                  'vinTail':raw.get('autoPapaVinTail'),'vpicYear':raw.get('autoPapaVpicModelYear'),
                  'vpicDisplacementL':raw.get('autoPapaVpicDisplacementL')
              },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-vin-power-audit-readonly
          path: recovery-vin.json
          if-no-files-found: warn
          retention-days: 1
