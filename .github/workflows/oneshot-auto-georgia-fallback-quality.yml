name: One-shot AUTO.GE fallback quality

on:
  push:
    branches:
      - fix/auto-georgia-fallback-quality-20260812

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-georgia-fallback-quality-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply AUTO.GE exact fallback quality guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/lib/catalog/auto-georgia-strict-source.ts')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              text = text.replace(old, new, 1)

          replace_once(r'''function integer(value: unknown) {
            const parsed = Number(String(value || "").replace(/[^0-9]/g, ""));
            return Number.isFinite(parsed) && parsed > 0 ? parsed : undefined;
          }
          function moneyAmount(value: unknown) {''', r'''function integer(value: unknown) {
            const parsed = Number(String(value || "").replace(/[^0-9]/g, ""));
            return Number.isFinite(parsed) && parsed > 0 ? parsed : undefined;
          }
          export function parseAutoGeorgiaMileageKm(value: string) {
            // Match the number immediately attached to the km unit. The previous
            // permissive expression could swallow the listing year as part of a
            // spaced odometer, e.g. "2024 60 000 km" -> 202460000.
            const match = String(value || "").match(/(?:^|[^\d])([0-9]{1,3}(?:[ .,'’\u00a0][0-9]{3})+|[0-9]{1,7})\s*km\b/i);
            const parsed = integer(match?.[1]);
            return parsed && parsed <= 2_000_000 ? parsed : undefined;
          }
          function moneyAmount(value: unknown) {''', 'mileage helper')

          replace_once(r'''function identityFromTitle(value: string, detailUrl: string) {
            const clean = plainText(value).replace(/^(?:TOP\s+VIP\s+BOOST|SUPER\s+VIP|VIP|BOOST)\s+/i, "").trim();
            const comma = clean.match(/^([^,]{2,45}),\s*([^,|$]{1,80})/);
            if (comma) return { make: comma[1].trim(), model: comma[2].trim() };
            return identityFromUrl(detailUrl);
          }
          function parseMoney(text: string) {''', r'''function identityFromTitle(value: string, detailUrl: string) {
            const clean = plainText(value).replace(/^(?:TOP\s+VIP\s+BOOST|SUPER\s+VIP|VIP|BOOST)\s+/i, "").trim();
            const comma = clean.match(/^([^,]{2,45}),\s*([^,|$]{1,80})/);
            if (comma) return { make: comma[1].trim(), model: comma[2].trim() };
            return identityFromUrl(detailUrl);
          }
          function exactAutoGeorgiaIdentity(identity: { make: string; model: string }) {
            const make = compact(identity.make);
            const model = compact(identity.model);
            return Boolean(make && model && !/^(?:other|othermodel|unknown|na|notset)$/.test(model));
          }
          function parseMoney(text: string) {''', 'exact identity guard')

          replace_once(r'''function listingImageUrls(markup: string, base: string, listingId: unknown) {
            return imageUrls(markup, base).filter((url) => autoGeorgiaImageBelongsToListing(url, listingId));
          }
          function sourceCatalogImage(urlValue: string): CatalogImage | null {''', r'''export function autoGeorgiaImageIdentity(value: string) {
            try {
              const parsed = new URL(String(value || ""));
              const pathname = decodeURIComponent(parsed.pathname).toLocaleLowerCase("en-US")
                .replace(/_(?:x2|large)(?=\.[a-z0-9]+$)/i, "");
              return `${parsed.hostname.toLocaleLowerCase("en-US")}${pathname}`;
            } catch { return ""; }
          }
          function autoGeorgiaImageVariantScore(value: string) {
            try {
              const pathname = new URL(String(value || "")).pathname;
              if (/_large(?=\.[a-z0-9]+$)/i.test(pathname)) return 3;
              if (/_x2(?=\.[a-z0-9]+$)/i.test(pathname)) return 2;
              return 1;
            } catch { return 0; }
          }
          export function dedupeAutoGeorgiaListingImages(values: string[], listingId: unknown) {
            const selected = new Map<string, string>();
            for (const raw of values) {
              const url = String(raw || "").trim();
              if (!autoGeorgiaImageBelongsToListing(url, listingId)) continue;
              const identity = autoGeorgiaImageIdentity(url);
              if (!identity) continue;
              const current = selected.get(identity);
              if (!current || autoGeorgiaImageVariantScore(url) > autoGeorgiaImageVariantScore(current)) selected.set(identity, url);
            }
            return [...selected.values()];
          }
          function listingImageUrls(markup: string, base: string, listingId: unknown) {
            return dedupeAutoGeorgiaListingImages(imageUrls(markup, base), listingId);
          }
          function sourceCatalogImage(urlValue: string): CatalogImage | null {''', 'image identity dedupe')

          replace_once(r'''    if (!identity.make || !identity.model || !money || !year || !/\bSale\b/i.test(text)) continue;''', r'''    if (!exactAutoGeorgiaIdentity(identity) || !money || !year || !/\bSale\b/i.test(text)) continue;''', 'generic model rejection')
          replace_once(r'''      mileageKm: integer(text.match(/([0-9][0-9\s,.']+)\s*km\b/i)?.[1]),''', r'''      mileageKm: parseAutoGeorgiaMileageKm(text),''', 'mileage parser use')
          replace_once(r'''    let urls = [...new Set((row.images || []).map(String).filter((url) => autoGeorgiaImageBelongsToListing(url, row.id)))];''', r'''    let urls = dedupeAutoGeorgiaListingImages((row.images || []).map(String), row.id).slice(0, limit);''', 'initial image dedupe')
          replace_once(r'''        urls = [...new Set([...urls, ...listingImageUrls(detail.markup, detail.response.url || detailUrl, row.id)])];''', r'''        urls = dedupeAutoGeorgiaListingImages([...urls, ...listingImageUrls(detail.markup, detail.response.url || detailUrl, row.id)], row.id);''', 'detail image dedupe')
          replace_once(r'''    urls = urls.filter((url) => autoGeorgiaImageBelongsToListing(url, row.id)).slice(0, limit);''', r'''    urls = dedupeAutoGeorgiaListingImages(urls, row.id).slice(0, limit);''', 'final image dedupe')

          path.write_text(text)

          test_path = Path('tests/auto-georgia-price.test.ts')
          tests = test_path.read_text()
          marker = 'AUTO.GE mileage parsing keeps the listing year out of the odometer'
          if marker not in tests:
              tests += r'''

          test("AUTO.GE mileage parsing keeps the listing year out of the odometer", () => {
            const markup = `
              <html><body>
                <a href="/en/auto/toyota/rav4/toyota-rav4-1172033.html">Toyota, RAV4</a>
                <div>Sale 2024 60 000 km 14,000.00 $</div>
              </body></html>`;
            const rows = parseAutoGeorgiaStrictListing(markup, pageUrl);
            assert.equal(rows.length, 1);
            assert.equal(rows[0].mileageKm, 60_000);
          });

          test("AUTO.GE rejects generic Other model identities instead of creating make-level catch-all offers", () => {
            const markup = `
              <html><body>
                <a href="/en/auto/changan/other/changan-other-1432716.html">CHANGAN</a>
                <div>Sale 2026 606 km 20,000.00 $</div>
              </body></html>`;
            assert.equal(parseAutoGeorgiaStrictListing(markup, pageUrl).length, 0);
          });

          test("AUTO.GE collapses base, x2 and large URLs for the same listing photo", () => {
            const first = "https://fra1.digitaloceanspaces.com/www.auto.ge/listings/02-2026/ad1172033/toyota-rav4-111.webp";
            const firstX2 = "https://fra1.digitaloceanspaces.com/www.auto.ge/listings/02-2026/ad1172033/toyota-rav4-111_x2.webp";
            const firstLarge = "https://fra1.digitaloceanspaces.com/www.auto.ge/listings/02-2026/ad1172033/toyota-rav4-111_large.webp";
            const secondLarge = "https://fra1.digitaloceanspaces.com/www.auto.ge/listings/02-2026/ad1172033/toyota-rav4-222_large.webp";
            const markup = `
              <html><body>
                <a href="/en/auto/toyota/rav4/toyota-rav4-1172033.html">Toyota, RAV4</a>
                <div>Sale 2024 966 km 14,000.00 $</div>
                <img src="${first}" />
                <img src="${firstX2}" />
                <img src="${firstLarge}" />
                <img src="${secondLarge}" />
              </body></html>`;
            const rows = parseAutoGeorgiaStrictListing(markup, pageUrl);
            assert.equal(rows.length, 1);
            assert.deepEqual(rows[0].images, [firstLarge, secondLarge]);
          });
          '''
              test_path.write_text(tests)
          PY
          git diff --check
      - name: AUTO.GE regression tests
        run: node --import tsx --test tests/auto-georgia-price.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/auto-georgia-strict-source.ts tests/auto-georgia-price.test.ts
          git commit -m "Fix AUTO.GE fallback mileage and photo identity"
          git push origin HEAD:fix/auto-georgia-fallback-quality-20260812
