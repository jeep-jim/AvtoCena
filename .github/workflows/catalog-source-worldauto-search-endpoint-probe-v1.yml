name: Catalog source qualification · WorldAuto exact search endpoint probe v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/worldauto-detail-route-probe-v1-20260904
    paths:
      - ".github/workflows/catalog-source-worldauto-search-endpoint-probe-v1.yml"
      - "scripts/catalog-source-worldauto-search-endpoint-probe-v1.mjs"
      - "tests/catalog-source-worldauto-search-endpoint-probe-v1.test.ts"
      - "scripts/catalog-source-access-probe-v1.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-source-worldauto-search-endpoint-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public-response summarizer
        run: node --test tests/catalog-source-worldauto-search-endpoint-probe-v1.test.ts
      - name: Probe exactly one source-declared WorldAuto search endpoint with no params
        run: node scripts/catalog-source-worldauto-search-endpoint-probe-v1.mjs
      - name: Verify single-request no-write endpoint envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-worldauto-search-endpoint-probe-v1.json','utf8'));
          for (const key of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) {
            if (p[key] !== false) throw new Error(`${key} must be false`);
          }
          if (p.paginationRequests !== 0 || p.detailRequests !== 0) throw new Error('probe escaped endpoint envelope');
          if ((p.apiRequests || 0) > 1) throw new Error(`apiRequests ${p.apiRequests}`);
          if ((p.requestCount || 0) > 3) throw new Error(`requestCount ${p.requestCount}`);
          if (p.endpointPath !== '/search/sell/car/get') throw new Error(`endpointPath ${p.endpointPath}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-worldauto-search-endpoint-probe-v1
          path: catalog-source-worldauto-search-endpoint-probe-v1.json
          if-no-files-found: error
          retention-days: 7
