name: Retire two proven obsolete China host deployments
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/catalog-next-obsolete-deployments-20261127-retire.json']
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  retire:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install reviewed controller dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact invocation and retirement refusals without credentials
        run: |
          node scripts/catalog-next/retire-obsolete-deployments-20261127.mjs --verify
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-next-obsolete-deployments-retire.test.mjs tests/catalog-next-generation-update-host.test.mjs tests/readonly-marker-invocation.test.mjs
      - name: Retire the two exact saved predecessor deployments under China lease
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/catalog-next/retire-obsolete-deployments-20261127.mjs --run
      - name: Preserve sanitized exact retirement evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-next-obsolete-deployments-20261127-retire
          path: catalog-next-obsolete-deployments-20261127-retire-report.json
          if-no-files-found: ignore
          retention-days: 14
