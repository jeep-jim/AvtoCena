name: Measure exact China draft size without publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/china-private-stage-native-observe-20261120.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Measure exact China draft size without publication'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/china-reader-off-v1/observe-stage.mjs
          sparse-checkout-cone-mode: false
      - name: Return three redacted metadata observations, zero writes
        env:
          REG_ACCESS: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          REG_SECRET: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node .github/china-reader-off-v1/observe-stage.mjs
