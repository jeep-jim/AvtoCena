name: Catalog V3 · Japan · republish collected
run-name: Catalog V3 · Japan · republish collected · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/market-republish/japan"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-v3-japan
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REBUILD_INPUT_DIR: catalog-v3-input
  CATALOG_REBUILD_MARKETS: japan
  CATALOG_REBUILD_VALIDATION_REPORT: catalog-v3-japan-validation-report.json
  CATALOG_REBUILD_PUBLISH_REPORT: catalog-v3-japan-publish-report.json
  CATALOG_KNOWLEDGE_GAPS_OUTPUT: catalog-v3-japan-knowledge-gaps.json
  CATALOG_OFFER_DETAIL_VERIFY_OUTPUT: catalog-v3-japan-offer-detail-verify.json
  CATALOG_AUDIT_OUTPUT: catalog-v3-japan-postpublish-audit.json
  CATALOG_REBUILD_TARGET_PER_SOURCE: "30000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "30000"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "30000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "30000"
  CATALOG_V2_PRIORITY_TARGET: "24000"
  CATALOG_V2_LOW_POWER_MIN_SHARE: "0.8"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PUBLIC_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "15000000"
  CATALOG_PUBLIC_ABSOLUTE_MAX_TOTAL_RUB: "15000000"
  CATALOG_PUBLIC_MAX_TOTAL_TO_CAR_PRICE_RATIO: "8"
  CATALOG_OFFER_RETENTION_MS: "2592000000"
  CATALOG_DEFAULT_RETENTION_MS: "259200000"
  CATALOG_JAPAN_RETENTION_MS: "2592000000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "2"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_PUBLISH_PREPARE_CONCURRENCY: "24"
  CATALOG_INDEX_WRITE_CONCURRENCY: "12"
  CATALOG_STORAGE_EMERGENCY: "true"
  CATALOG_ENCYCLOPEDIA_IDENTITY_MASTER: "1"
  CATALOG_IDENTITY_PREPARE_CONCURRENCY: "24"

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve source collector run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(tr -dc '0-9' < .github/market-republish/japan)"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Reusing collector artifacts from run $run_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Download completed Japan collector artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: catalog-v3-japan-[0-4]
          path: catalog-v3-input
          merge-multiple: true
      - name: Require all five collected shards
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4; do
            test -s "catalog-v3-input/catalog-rebuild-japan-${shard}.json"
            test -s "catalog-v3-input/catalog-v3-probe-japan-${shard}.json"
          done
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync(process.env.CATALOG_REBUILD_INPUT_DIR).filter(x=>/^catalog-rebuild-japan-\d+\.json$/.test(x));
          const total=files.reduce((n,f)=>{const p=JSON.parse(fs.readFileSync(path.join(process.env.CATALOG_REBUILD_INPUT_DIR,f)));return n+Number(p.count||p.offers?.length||0)},0);
          console.log({files:files.length,total});
          if(files.length!==5||total<=0) process.exit(1);
          NODE
      - name: Apply Encyclopedia Identity Master + Knowledge CORE
        run: npx tsx scripts/catalog-apply-encyclopedia-identity-master.mjs
      - name: Build Knowledge CORE gap report
        run: npx tsx scripts/catalog-build-knowledge-gaps.mjs
      - name: Validate collected source continuity and inventory
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish Japan from collected artifacts
        run: npx tsx scripts/catalog-publish-market.mjs
      - name: Require safe publication
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,'utf8'));
          const q=p.marketQuality?.japan||{};
          const count=Number(p.byMarket?.japan||0);
          const lowPowerShare=Number(q.lowPowerShare||0);
          const state={published:p.published===true,generationId:p.generationId||null,count,lowPowerShare,regressionBlocked:q.regressionBlocked===true,publicationError:p.publicationError||''};
          console.log(JSON.stringify(state,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Japan republish\n\n\`\`\`json\n${JSON.stringify(state,null,2)}\n\`\`\`\n`);
          if(!state.published||!state.generationId||count<=0||state.lowPowerShare<0.8||state.regressionBlocked||state.publicationError) process.exit(1);
          NODE
      - name: Verify offer detail read models
        env:
          CATALOG_AUDIT_ASSERT_MARKETS: japan
        run: npx tsx scripts/catalog-verify-current-offers.mjs
      - name: Audit published Japan
        env:
          CATALOG_AUDIT_ASSERT_MARKETS: japan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v3-japan-republish-reports
          path: |
            catalog-v3-japan-validation-report.json
            catalog-v3-japan-publish-report.json
            catalog-v3-japan-knowledge-gaps.json
            catalog-v3-japan-offer-detail-verify.json
            catalog-v3-japan-postpublish-audit.json
          retention-days: 3
