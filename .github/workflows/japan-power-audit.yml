name: Japan supplier power — bounded owner verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/japan-power-audit.json']
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Bundle diagnostic without production secrets
        run: |
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          await build({entryPoints:['scripts/ajes-japan-power-audit.ts'],outfile:'/tmp/ajes-japan-power-audit.cjs',bundle:true,platform:'node',format:'cjs',plugins:[{name:'server-only',setup(b){b.onResolve({filter:/^server-only$/},()=>({path:'empty',namespace:'empty'}));b.onLoad({filter:/.*/,namespace:'empty'},()=>({contents:''}));}}]});
          JS
      - name: Bounded requests using supplier-approved genuine server address
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file" /tmp/ajes-japan-power-audit.cjs' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'set -eu; server_ip=$(curl -4 -fsS --max-time 15 https://api.ipify.org); test "$server_ip" = 151.248.113.177; docker exec -i -e AJES_DIAG_IP="$server_ip" avtocena-production node' < /tmp/ajes-japan-power-audit.cjs
