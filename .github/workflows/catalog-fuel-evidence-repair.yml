name: Catalog — addressed fuel evidence repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/catalog-fuel-evidence-repair.json']
permissions:
  contents: read
concurrency:
  group: catalog-addressed-fuel-evidence-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact evidence and conditional writes
        run: node --import tsx --test tests/catalog-fuel-evidence-repair.test.ts tests/catalog-fuel-evidence-apply.test.ts tests/catalog-fuel-projection-evidence.test.ts
      - name: Apply only the reviewed immutable preview plan
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/apply-catalog-fuel-evidence-repair.ts
      - name: Preserve exact repair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-fuel-evidence-repair-apply
          path: reports/catalog-fuel-evidence-repair-apply.json
          if-no-files-found: ignore
