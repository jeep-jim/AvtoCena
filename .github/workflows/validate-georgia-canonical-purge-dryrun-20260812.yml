name: Validate Georgia canonical purge dry-run
run-name: Georgia canonical purge dry-run · ${{ github.sha }}

on:
  push:
    branches:
      - fix/catalog-allow-explicit-empty-georgia-20260812
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_GLOBAL_MODEL_CAP_DRY_RUN: "1"
  CATALOG_ALLOW_EMPTY_MARKETS: georgia
  CATALOG_GLOBAL_MODEL_CAP_REPORT: georgia-canonical-purge-dryrun.json
  CATALOG_PUBLISH_LOCK_WAIT_MS: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-enforce-global-model-cap.mjs
          node --import tsx --test tests/catalog-global-model-cap-empty-market-policy.test.ts
          node --import tsx --test tests/georgia-canonical-source-policy-20260812.test.ts
          npm run typecheck
      - name: Read current catalog and project canonical purge without publishing
        run: npx tsx scripts/catalog-enforce-global-model-cap.mjs
      - name: Assert Georgia only is allowed to become empty
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('georgia-canonical-purge-dryrun.json','utf8'));
          if (!report.dryRun) throw new Error('expected_dry_run');
          if (JSON.stringify(report.allowedEmptyMarkets) !== JSON.stringify(['georgia'])) throw new Error(`unexpected_allowlist:${JSON.stringify(report.allowedEmptyMarkets)}`);
          if (Number(report.beforeByMarket?.georgia || 0) <= 0) throw new Error('expected_existing_georgia_rows');
          if (Number(report.selectedByMarket?.georgia || 0) !== 0) throw new Error(`georgia_noncanonical_rows_survived:${report.selectedByMarket?.georgia}`);
          for (const [market,count] of Object.entries(report.selectedByMarket || {})) {
            if (market !== 'georgia' && Number(report.beforeByMarket?.[market] || 0) > 0 && Number(count || 0) <= 0) {
              throw new Error(`unexpected_empty_market:${market}`);
            }
          }
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-canonical-purge-dryrun
          path: georgia-canonical-purge-dryrun.json
          if-no-files-found: warn
          retention-days: 3
