name: Diagnose dead-market source coverage

on:
  push:
    branches:
      - diag/dead-markets-20260810
    paths:
      - ".github/workflows/dead-market-source-diag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: georgia-myauto
            market: georgia
            source: myauto_georgia_list
          - label: georgia-autopapa
            market: georgia
            source: autopapa_georgia_open
          - label: uae-dubizzle
            market: uae
            source: dubizzle_uae_open
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL: "20"
      RECOVERY_MARKET: ${{ matrix.market }}
      RECOVERY_SOURCE_IDS: ${{ matrix.source }}
      RECOVERY_TARGET: "50"
      RECOVERY_MAX_PAGES: "6"
      RECOVERY_TIME_LIMIT_MS: "1200000"
      RECOVERY_REQUEST_TIMEOUT_MS: "35000"
      RECOVERY_RETRY_ATTEMPTS: "3"
      RECOVERY_PREPARE_CONCURRENCY: "3"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      RECOVERY_OUTPUT: diag-${{ matrix.label }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add diagnostic-only exact host allowlist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/catalog-live-recovery-market.mjs')
          s = p.read_text()
          anchor = '  dubicars_uae_exact: ["dubicars.com"],\n'
          repl = anchor + '  dubizzle_uae_open: ["dubizzle.com"],\n  myauto_georgia_list: ["myauto.ge"],\n  autopapa_georgia_open: ["autopapa.ge"],\n'
          if anchor not in s:
              raise SystemExit('host allowlist anchor missing')
          p.write_text(s.replace(anchor, repl, 1))
          PY
          node --check scripts/catalog-live-recovery-market.mjs
      - name: Probe source with full strict calculator but NO publish
        shell: bash
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dead-market-${{ matrix.label }}
          path: diag-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 3
