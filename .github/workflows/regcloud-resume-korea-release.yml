name: Regcloud — resume exact prepared Korea release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-resume-korea-release.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: regcloud-staging
    env:
      EXPECTED_RELEASE: f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac
      PREPARED_RELEASE: f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac
          persist-credentials: false
      - name: Require completed original run and successful exact preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jeep-jim/AvtoCena/actions/runs/41084069907 > /tmp/original-run.json
          gh api repos/jeep-jim/AvtoCena/actions/runs/41084069907/jobs > /tmp/original-jobs.json
          python3 - <<'PYVERIFY'
          import json
          run=json.load(open('/tmp/original-run.json'))
          assert run['head_sha']=='f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac'
          assert run['status']=='completed' and run['conclusion'] in ['failure','cancelled','timed_out']
          jobs=json.load(open('/tmp/original-jobs.json'))['jobs']
          assert any(j['name']=='wait-for-astra' and j['conclusion']=='success' for j in jobs)
          prepare=next(j for j in jobs if j['name']=='prepare')
          steps=prepare['steps']
          for name in ['Verify exact encyclopedia matching','Verify stream disconnect and gateway buffer regressions','Verify production dependency security','Verify catalog storage and bounded projection integrity','Prepare private encyclopedia index for this release','Build existing application without production credentials']:
            assert any(s['name']==name and s['conclusion']=='success' for s in steps),name
          print('Exact prior preparation verified')
          PYVERIFY
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Restore exact immutable encyclopedia index for prepared image
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
        run: |
          node --import tsx --input-type=module <<'RESTORE'
          import {getJsonStorage} from './apps/web/lib/data.ts';
          import {restoreReleaseEncyclopedia} from './scripts/encyclopedia/restore-calculation-index.mjs';
          const digest=await restoreReleaseEncyclopedia(getJsonStorage(),process.cwd(),process.env.PREPARED_RELEASE);
          if(!digest)throw Error('prepared_index_missing');
          console.log('Exact prepared encyclopedia restored',digest);
          RESTORE
          node --import tsx scripts/encyclopedia/assert-release-batches.mjs
      - name: Reuse verified image or transfer exact rebuilt image through private storage
        timeout-minutes: 30
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          url_file=$(mktemp)
          trap 'rm -f "$key_file" "$url_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          state=$(ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -s -- '$PREPARED_RELEASE'" <<'CHECKIMAGE'
          set -eu
          release=$1
          if docker image inspect "avtocena-regcloud:$release" >/dev/null 2>&1; then
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "avtocena-regcloud:$release")" = "$release"
            echo READY
          else
            echo MISSING
          fi
          CHECKIMAGE
          )
          if test "$state" = READY; then echo 'Exact verified image reused'; exit 0; fi
          test "$state" = MISSING
          docker build --label "org.opencontainers.image.revision=$PREPARED_RELEASE" -t "avtocena-regcloud:$PREPARED_RELEASE" .
          export IMAGE_ARCHIVE="$RUNNER_TEMP/avtocena-image.tar.gz"
          docker save "avtocena-regcloud:$PREPARED_RELEASE" | gzip -1 > "$IMAGE_ARCHIVE"
          digest=$(sha256sum "$IMAGE_ARCHIVE" | cut -d' ' -f1)
          export IMAGE_DIGEST="$digest" IMAGE_URL_FILE="$url_file"
          python3 -m pip install --quiet boto3
          python3 - <<'UPLOAD'
          import os,hashlib,pathlib,urllib.parse
          import boto3
          from botocore.config import Config
          from boto3.s3.transfer import TransferConfig
          release=os.environ['PREPARED_RELEASE'];assert release=='f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac'
          archive=pathlib.Path(os.environ['IMAGE_ARCHIVE']);size=archive.stat().st_size
          assert 0<size<2*1024**3
          key=f"migration-staging/full-20261011/operations/release-transport/{release}/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}/image.tar.gz"
          client=boto3.client('s3',endpoint_url='https://s3.regru.cloud',region_name='us-east-1',aws_access_key_id=os.environ['YC_OBJECT_STORAGE_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['YC_OBJECT_STORAGE_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4',connect_timeout=15,read_timeout=120,retries={'max_attempts':2},s3={'addressing_style':'path'}))
          client.upload_file(str(archive),'avtocena-staging-8120751',key,ExtraArgs={'ContentType':'application/gzip','Metadata':{'sha256':os.environ['IMAGE_DIGEST']}},Config=TransferConfig(multipart_threshold=16*1024**2,multipart_chunksize=16*1024**2,max_concurrency=2))
          obj=client.head_object(Bucket='avtocena-staging-8120751',Key=key)
          assert obj['ContentLength']==size and obj['Metadata']['sha256']==os.environ['IMAGE_DIGEST']
          url=client.generate_presigned_url('get_object',Params={'Bucket':'avtocena-staging-8120751','Key':key},ExpiresIn=900)
          assert urllib.parse.urlsplit(url).hostname=='s3.regru.cloud'
          pathlib.Path(os.environ['IMAGE_URL_FILE']).write_text(url+'\n')
          print('Private image uploaded and size verified:',size)
          UPLOAD
          url=$(cat "$url_file")
          printf '::add-mask::%s\n' "$url"
          unset url
          remote_dir="/opt/avtocena/staging/incoming/resume-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'; test \$(df --output=avail -k / | tail -1) -gt 8388608"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -c 'set -euo pipefail; umask 077; read -r url; printf \"url = \\\"%s\\\"\\n\" \"\$url\" | curl --config - --fail --silent --show-error --connect-timeout 15 --max-time 900 --output \"\$1/avtocena-image.tar.gz\"' -- '$remote_dir'" < "$url_file"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -s -- '$remote_dir' '$PREPARED_RELEASE' '$digest'" <<'LOADIMAGE'
          set -euo pipefail
          incoming=$1;release=$2;digest=$3
          exec 9>/run/lock/avtocena-staging-prepare.lock
          flock -n 9
          cd "$incoming"
          printf '%s  avtocena-image.tar.gz\n' "$digest" | sha256sum -c -
          gzip -dc avtocena-image.tar.gz | docker load
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "avtocena-regcloud:$release")" = "$release"
          docker image inspect --format 'Image verified: {{.Id}}; size {{.Size}} bytes' "avtocena-regcloud:$release"
          rm -- avtocena-image.tar.gz
          LOADIMAGE
          python3 - <<'CLEANUP'
          import os,boto3
          from botocore.config import Config
          release=os.environ['PREPARED_RELEASE']
          key=f"migration-staging/full-20261011/operations/release-transport/{release}/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}/image.tar.gz"
          client=boto3.client('s3',endpoint_url='https://s3.regru.cloud',region_name='us-east-1',aws_access_key_id=os.environ['YC_OBJECT_STORAGE_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['YC_OBJECT_STORAGE_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4',connect_timeout=15,read_timeout=60,retries={'max_attempts':1},s3={'addressing_style':'path'}))
          client.delete_object(Bucket='avtocena-staging-8120751',Key=key)
          print('This run transport object removed after verified image load')
          CLEANUP
      - name: Prepare exact price indexes before activating the release
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
          AVTOCENA_RELEASE_SHA: f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac
        run: |
          node --import tsx --input-type=module <<'WAIT'
          const data=await import('./apps/web/lib/data.ts');
          const getJsonStorage=data.getJsonStorage||data.default?.getJsonStorage;
          if(typeof getJsonStorage!=='function')throw Error('storage_module_unavailable');
          const storage=getJsonStorage(),deadline=Date.now()+40*60_000;
          for (;;) {
            const lock=await storage.readJson('catalog/import-lock.json',null);
            const until=lock?.lockedUntil?Date.parse(lock.lockedUntil):0;
            if (!Number.isFinite(until)) throw Error('publication_lock_invalid');
            if (until<=Date.now()) break;
            console.log('WAIT_FOR_PUBLICATION',JSON.stringify({operationType:lock.operationType,lockedUntil:lock.lockedUntil}));
            if (Date.now()>=deadline) throw Error('publication_wait_deadline');
            await new Promise(resolve=>setTimeout(resolve,30_000));
          }
          WAIT
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS=120000 npx tsx scripts/archive-runtime-reference-sources.mjs
          export AVTOCENA_CALCULATION_VERSION=$(node scripts/catalog-calculation-version.mjs)
          npx tsx scripts/regcloud-verify-conditional-read.ts
          # Offline authoritative parity reads full market projections; keep a bounded
          # two-minute storage deadline here, without changing visitor request budgets.
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS=120000 npx tsx scripts/regcloud-prepare-prices.mjs
          npx tsx scripts/prepare-catalog-colors.mjs
          node --import tsx --input-type=module <<'CUTOVER'
          const module=await import('./apps/web/lib/catalog/china-feed-cutover.ts');
          await (module.applyChinaFeedCutover||module.default.applyChinaFeedCutover)();
          console.log('China supplier switch applied');
          CUTOVER
          CATALOG_OVERVIEW_SKIP_READY=true npx tsx scripts/catalog-refresh-generation-pages.mjs
      - name: Reject replacing an unrelated newer production release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://avtocena.com/api/health > /tmp/current-health.json
          python3 - <<'CHECK'
          import json
          health=json.load(open('/tmp/current-health.json'))
          assert health.get('ok') is True
          assert health.get('releaseSha') in ['5e45cd9478a7d38a6c57adc7d81061e475055cf9','f6cc2d81f44ed9b7b4d0412ef6b5940df2c740ac'], 'unrelated_production_release'
          print('Production release permits exact continuation')
          CHECK
      - name: Deploy with rollback and resource measurements
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/releases/$PREPARED_RELEASE"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'"
          scp "${ssh_opts[@]}" scripts/regcloud-deploy-production.sh scripts/regcloud-performance-gate.py scripts/regcloud-resource-sampler.py "root@151.248.113.177:$remote_dir/"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash '$remote_dir/regcloud-deploy-production.sh' '$PREPARED_RELEASE' '$(node scripts/catalog-calculation-version.mjs)' 1"
      - name: Verify published encyclopedia fields against this exact release
        env:
          ENCYCLOPEDIA_PUBLIC_COMPACT_VERIFY: '1'
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        run: node --import tsx scripts/encyclopedia/verify-public-release.mjs
      - name: Preserve public encyclopedia verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-public-release
          path: reports/encyclopedia-public-release.json
          if-no-files-found: ignore
      - name: Bound retained application releases after successful deployment
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'python3 - --apply' < scripts/regcloud-release-retention.py
      - name: Publish GPT completion notes for this installed release
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: GITHUB_SHA="$PREPARED_RELEASE" npx tsx scripts/crm-gpt-release-report.ts
