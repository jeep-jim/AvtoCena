name: China exact startup diagnosis - read only
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/catalog-next-china-startup-diagnosis.json']
permissions:
  contents: read
concurrency:
  group: catalog-next-china-startup-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install reviewed controller dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact invocation, unchanged baselines and read-only protocol
        run: |
          node scripts/catalog-next/diagnose-startup.mjs --verify
          node --test tests/readonly-marker-invocation.test.mjs tests/catalog-next-startup-diagnosis.test.mjs tests/catalog-next-startup-diagnose-host.test.mjs tests/catalog-next-saved-speed-diagnosis.test.mjs tests/catalog-next-release-ssh.test.mjs tests/release-speed-guard-contract.test.mjs
      - name: Read the exact failed startup metadata
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: node scripts/catalog-next/diagnose-startup.mjs --run
      - name: Preserve sanitized diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-next-china-startup-diagnosis-report
          path: catalog-next-china-startup-diagnosis-report.json
          if-no-files-found: ignore
          retention-days: 14
