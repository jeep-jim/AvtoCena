name: Catalog saved power pipeline evidence 2026-11-07
on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog-power-pipeline-evidence-20261107.yml']
permissions:
  contents: read
concurrency:
  group: catalog-saved-power-pipeline-20261107
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bundle read-only technical pipeline without supplier clients
        run: |
          cat > scripts/power-pipeline-evidence.tmp.ts <<'TS'
          import {getJsonStorage} from '../apps/web/lib/data';
          import {readCalculationIndex,modelKey,applyEncyclopediaCalculation,hasEncyclopediaCalculationEvidence} from '../apps/web/lib/encyclopedia/calculation-index';
          import {ajesCatalogQuery,ajesQuery} from '../apps/web/lib/catalog/ajes-query';
          import {readAjesQueryCache} from '../apps/web/lib/catalog/ajes-query-cache';
          import {ajesOffer} from '../apps/web/lib/catalog/ajes-offer';
          import {newerKoreaDetail} from '../apps/web/lib/catalog/ajes-korea-detail-cache';
          import {enrichJapanDrive} from '../apps/web/lib/catalog/japan-drive';
          import {applyJapanFactoryFuel} from '../apps/web/lib/encyclopedia/japan-fuel-reference';
          import {enrichOfferWithKnowledgeCore} from '../apps/web/lib/catalog/knowledge-core';
          import {normalizeVehicleOfferSpecs} from '../apps/web/lib/catalog/spec-normalization';
          import {readCatalogEditorial,applyCatalogEditorial,editorialHidden} from '../apps/web/lib/catalog/editorial';
          import {applyJapanOwnerSpecifications} from '../apps/web/lib/catalog/japan-owner-specifications';
          import {catalogInventoryAgeDecision,catalogVehicleExcluded} from '../apps/web/lib/catalog/inventory-admission';
          import {ajesResultFilter} from '../apps/web/lib/catalog/ajes-result-filter';
          const safe=(v:unknown)=>String(v??'').replace(/[^\p{L}\p{N} ._+&()-]/gu,'').slice(0,70);
          const power=(v:any)=>Number.isFinite(Number(v?.powerHp))&&Number(v.powerHp)>0;
          async function main(){
            const index=readCalculationIndex();if(!index)throw Error('index_missing');
            const storage=getJsonStorage();const editorial=await readCatalogEditorial();
            console.log('SCOPE',JSON.stringify({readOnly:true,supplierRequests:0,queries:2,maxLots:48,pricesComputed:false,indexDigest:index.digest,rateSentinel:'Constructor-only rate=1; no price or monetary output; technical fields only'}));
            for(const market of ['japan','korea']){
              const query=ajesQuery(ajesCatalogQuery({market,page:'1',pageSize:'24'}));
              const saved:any=await readAjesQueryCache(storage,query.sql);
              const summary:any={market,found:!!saved,observedAt:safe(saved?.observedAt),partial:!!saved?.partial,stale:!!saved?.stale,examined:0,detailPresent:0,detailUsed:0,annualModelMissing:0,powerAt:{constructor:0,calculationIndex:0,knowledgeCore:0,normalized:0,editorial:0,owner:0},knowledgeReasons:{},knownUnder160:0,eligibleUnder160:0,hidden:0,ageExcluded:0,vehicleExcluded:0,samples:[],errors:0};
              for(const original of (Array.isArray(saved?.items)?saved.items:[]).slice(0,24)){
                if(original.table!==query.table||typeof original.id!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(original.id))continue;
                try{
                  summary.examined++;let lot=original;
                  if(market==='korea'){
                    const detail:any=await storage.readJson('catalog/partner-cache/ajes/korea/'+lot.id+'.json',null);
                    if(detail)summary.detailPresent++;
                    lot=newerKoreaDetail(lot,saved.observedAt,detail);if(lot!==original)summary.detailUsed++;
                  }
                  // Required by constructor only. Nothing using the sentinel money is emitted or saved.
                  const amount=lot.finalPriceJpy||lot.sourcePrice;
                  const rate:any={rateSource:'cbr',currency:lot.currency,sourcePrice:amount,effectiveRate:1};
                  const initial=ajesOffer(lot,rate,saved.observedAt);summary.powerAt.constructor+=Number(power(initial));
                  const annual=(index.models[modelKey(initial.make,initial.model)]||[]).filter(v=>v.year===initial.year);
                  if(!annual.length)summary.annualModelMissing++;
                  let value=applyJapanFactoryFuel(applyEncyclopediaCalculation(enrichJapanDrive(initial,index),index));
                  summary.powerAt.calculationIndex+=Number(power(value));
                  const evidenceBeforeCore=hasEncyclopediaCalculationEvidence(value);
                  if(market==='korea')value=await enrichOfferWithKnowledgeCore(value);
                  summary.powerAt.knowledgeCore+=Number(power(value));
                  const reason=market==='japan'?'not_used_for_japan':evidenceBeforeCore?'calculation_evidence_short_circuit':safe(value.operational?.knowledgeCore?.variantResolution?.reason||'matched_or_core_absent');
                  summary.knowledgeReasons[reason]=(summary.knowledgeReasons[reason]||0)+1;
                  if(market==='korea')value=normalizeVehicleOfferSpecs(value);
                  summary.powerAt.normalized+=Number(power(value));
                  const hidden=editorialHidden(value,editorial);summary.hidden+=Number(hidden);
                  value=applyCatalogEditorial(value,editorial);summary.powerAt.editorial+=Number(power(value));
                  value=applyJapanOwnerSpecifications(value);summary.powerAt.owner+=Number(power(value));
                  const under=ajesResultFilter({market,powerTo:160}).matchesPower(value),age=catalogInventoryAgeDecision(value).eligible,excluded=catalogVehicleExcluded(value);
                  summary.knownUnder160+=Number(under);summary.eligibleUnder160+=Number(under&&age&&!excluded&&!hidden);summary.ageExcluded+=Number(!age);summary.vehicleExcluded+=Number(excluded);
                  if(summary.samples.length<8)summary.samples.push({make:safe(value.make),model:safe(value.model),year:initial.year,annualCandidates:annual.length,annualHasPower:annual.filter(f=>Number(f.values.powerHp)>0).length,evidenceBeforeCore,reason,finalPowerKnown:power(value),under160:under,sourceVariantLinkPresent:!!value.operational?.knowledgeIdentity,coreModelResolved:!!value.operational?.knowledgeCore?.modelId,referenceVariants:Number(value.operational?.knowledgeCore?.variantResolution?.referenceVariants||0),verifiedVariants:Number(value.operational?.knowledgeCore?.variantResolution?.verifiedVariants||0)});
                }catch{summary.errors++;}
              }
              console.log('TECHNICAL_PIPELINE',JSON.stringify(summary));
            }
            console.log('DONE_READ_ONLY_NO_SUPPLIER_NO_PRICE_WRITES');
          }
          main().catch(()=>{console.log('TECHNICAL_PIPELINE_READ_FAILED');process.exitCode=1;});
          TS
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          await build({entryPoints:['scripts/power-pipeline-evidence.tmp.ts'],outfile:'/tmp/power-pipeline-evidence.cjs',bundle:true,platform:'node',format:'cjs',plugins:[{name:'server-only',setup(b){b.onResolve({filter:/^server-only$/},()=>({path:'empty',namespace:'empty'}));b.onLoad({filter:/.*/,namespace:'empty'},()=>({contents:''}));}}]});
          JS
      - name: Read bounded saved lists in current container without mutating data
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key" /tmp/power-pipeline-evidence.cjs' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          unset SSH_PRIVATE_KEY
          curl --fail --silent --show-error --max-time 15 https://avtocena.com/api/health | tee health-before.json
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'timeout 180 docker exec -i avtocena-production node' < /tmp/power-pipeline-evidence.cjs | tee power-pipeline.log
          curl --fail --silent --show-error --max-time 15 https://avtocena.com/api/health | tee health-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-saved-power-pipeline
          path: |
            power-pipeline.log
            health-before.json
            health-after.json
          retention-days: 7
