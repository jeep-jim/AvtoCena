name: Japan additional public sources probe
on:
  push:
    branches: [ops/japan-free-sweep-20260916]
    paths: [.github/workflows/japan-proauctions-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request,pathlib,json,concurrent.futures
          urls={'proauctions-detail':'https://demo.pro-auctions.ru/statistika/suzuki/swift/30164101.html','japantransit':'https://japantransit.ru/','jpcenter':'https://jp.center/','auctiondatasearch-statistics':'https://auctiondatasearch.jp/statistics/'}
          root=pathlib.Path('data/japan-free-discovery/additional');root.mkdir(exist_ok=True)
          def fetch(item):
            name,url=item
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AvtoCena catalog research/1.0'}),timeout=30) as r:
                body=r.read(3000000).decode('utf-8','replace')
                (root/(name+'.html')).write_text(body)
                return {'source':name,'url':url,'status':r.status,'bytes':len(body)}
            except Exception as e:return {'source':name,'url':url,'error':str(e)}
          results=list(concurrent.futures.ThreadPoolExecutor(max_workers=4).map(fetch,urls.items()))
          (root/'summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan-free-discovery/additional
          git commit -m "Save additional public Japan source inspection"
          git pull --rebase origin ops/japan-free-sweep-20260916
          git push origin HEAD:ops/japan-free-sweep-20260916
