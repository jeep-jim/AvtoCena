name: Catalog V2 market recovery reusable

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false
      CATALOG_IMAGE_CDN_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  CATALOG_V2_PRIORITY_TARGET: "1000"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "100000000"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "100000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "100000"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "100000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "100000"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"

jobs:
  validate:
    name: Validate ${{ inputs.display_name }} recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recovery pipeline
        run: |
          node --check scripts/catalog-probe-source-shard.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-publish-market.mjs
          node --check scripts/catalog-clean-failed-generations.mjs
          node --import tsx --test tests/catalog-calculation-integrity.test.ts tests/catalog-image-quality.test.ts tests/catalog-probe-source-shard.test.ts tests/catalog-v2-market-recovery.test.ts
          npm --workspace=@avtocena/engine exec tsc -- --noEmit

  collect:
    name: Collect ${{ inputs.display_name }} shard ${{ matrix.shard }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "5"
      CATALOG_V2_SOURCE_SLOTS_ONLY: "0"
      CATALOG_REBUILD_IGNORE_PROBE: "0"
      CATALOG_REBUILD_RESET_CURSOR: "0"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "100000"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "1000000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "1000"
      CATALOG_REBUILD_MAX_SOURCE_ERRORS: "8"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "100000"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "30"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "8"
      CATALOG_REBUILD_TIME_LIMIT_MS: "6300000"
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_TIMEOUT_MS: "20000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "10"
      CATALOG_GALLERY_FAST_PATH: "false"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-${{ matrix.shard }}.json
      CATALOG_PROBE_OUTPUT: catalog-v2-probe-${{ inputs.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe registered sources
        run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Collect maximum real offers with checkpoints
        shell: bash
        run: |
          set +e
          rm -f "$CATALOG_REBUILD_OUTPUT"
          timeout --signal=TERM --kill-after=120s 6600s npx tsx scripts/catalog-rebuild-source-shard.mjs
          status=$?
          count=0
          if [ -s "$CATALOG_REBUILD_OUTPUT" ]; then
            count=$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT,"utf8"));process.stdout.write(String(Number(p.count||p.offers?.length||0)))}catch{process.stdout.write("0")}')
          fi
          echo "::notice::${CATALOG_REBUILD_MARKET} shard ${CATALOG_REBUILD_SHARD_INDEX}: exit=${status}, offers=${count}"
          if [ ! -s "$CATALOG_REBUILD_OUTPUT" ]; then
            node -e 'const fs=require("fs");fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT,JSON.stringify({version:43,market:process.env.CATALOG_REBUILD_MARKET,shardIndex:Number(process.env.CATALOG_REBUILD_SHARD_INDEX||0),shardCount:5,generatedAt:new Date().toISOString(),count:0,partial:true,stopReason:`collector_exit_${process.argv[1]}`,report:{saved:0,rejectionReasons:{},sources:[],sourceErrors:[{stage:"collector",error:`exit_${process.argv[1]}`}]},offers:[]},null,2))' "$status"
          fi
          exit 0
      - name: Upload market shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-${{ inputs.market }}-${{ matrix.shard }}
          path: |
            catalog-v2-probe-${{ inputs.market }}-${{ matrix.shard }}.json
            catalog-rebuild-${{ inputs.market }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

  publish:
    name: Publish ${{ inputs.display_name }} independently
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-v2-input
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-v2-${{ inputs.market }}-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-v2-${{ inputs.market }}-publish-report.json
      CATALOG_FAILED_GENERATION_CLEANUP_REPORT: catalog-v2-${{ inputs.market }}-failed-generation-cleanup.json
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "24"
      CATALOG_INDEX_WRITE_CONCURRENCY: "12"
      CATALOG_STORAGE_EMERGENCY: "true"
      CATALOG_STORAGE_CLEANUP_DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download only current market shards
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-v2-${{ inputs.market }}-[0-4]
          path: catalog-v2-input
          merge-multiple: true
      - name: Require at least one collected real offer
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.CATALOG_REBUILD_INPUT_DIR;
          const files = fs.readdirSync(dir).filter((name) => /^catalog-rebuild-.*-\d+\.json$/.test(name));
          let totalCollected = 0;
          const shards = [];
          for (const file of files) {
            const payload = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            const count = Number(payload.count || payload.offers?.length || 0);
            totalCollected += count;
            shards.push({ file, count, stopReason: payload.stopReason || '', sourceErrors: payload.report?.sourceErrors || [] });
          }
          console.log(JSON.stringify({ totalCollected, shards }, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Collection diagnostics\n\n\`\`\`json\n${JSON.stringify({ totalCollected, shards }, null, 2)}\n\`\`\`\n`);
          if (totalCollected <= 0) process.exit(1);
          NODE
      - name: Validate calculations and galleries
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish and recover only from Object Storage capacity errors
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            rm -f "$CATALOG_REBUILD_PUBLISH_REPORT"
            timeout --signal=TERM --kill-after=90s 720s npx tsx scripts/catalog-publish-market.mjs
            status=$?
            published=0
            publication_error=""
            if [ -s "$CATALOG_REBUILD_PUBLISH_REPORT" ]; then
              published=$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,"utf8"));const m=process.env.CATALOG_REBUILD_MARKETS;process.stdout.write(String(p.published===true&&p.generationId&&Number(p.byMarket?.[m]||0)>0?1:0))}catch{process.stdout.write("0")}')
              publication_error=$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,"utf8"));process.stdout.write(String(p.publicationError||""))}catch{}')
            fi
            echo "::notice::Publication attempt ${attempt}: exit=${status}, published=${published}, error=${publication_error}"
            if [ "$published" -eq 1 ]; then exit 0; fi
            if [ "$attempt" -eq 1 ] && echo "$publication_error" | grep -Eiq 'quota|max size|storage.*full|object_storage_.*(409|413|507)'; then
              npx tsx scripts/catalog-clean-failed-generations.mjs || true
            fi
            sleep 15
          done
          exit 0
      - name: Require a non-empty market publication
        run: |
          node <<'NODE'
          const fs = require('fs');
          const market = process.env.CATALOG_REBUILD_MARKETS;
          const report = JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT, 'utf8'));
          const count = Number(report.byMarket?.[market] || 0);
          const state = {
            market,
            generationId: report.generationId || null,
            published: report.published === true,
            count,
            total: Number(report.total || 0),
            byMarketAndSource: report.byMarketAndSource?.[market] || {},
            priorityCount: Number(report.marketQuality?.[market]?.priorityCount || 0),
            recentCount: Number(report.marketQuality?.[market]?.recentCount || 0),
            extendedCount: Number(report.marketQuality?.[market]?.extendedCount || 0),
            auctionCount: Number(report.marketQuality?.[market]?.auctionCount || 0),
            calculatedShare: report.marketQuality?.[market]?.calculatedShare ?? 0,
            imageStats: report.marketQuality?.[market]?.imageStats || {},
            rejectionReasons: report.rejectionReasons || {},
            sourceErrors: report.sourceErrors || [],
            publicationError: report.publicationError || '',
          };
          console.log(JSON.stringify(state, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Catalog V2: ${market}\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n`);
          if (!state.published || !state.generationId || count <= 0 || state.publicationError) process.exit(1);
          NODE
      - name: Upload market reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-${{ inputs.market }}-reports
          path: |
            catalog-v2-${{ inputs.market }}-validation-report.json
            catalog-v2-${{ inputs.market }}-publish-report.json
            catalog-v2-${{ inputs.market }}-failed-generation-cleanup.json
          if-no-files-found: warn
          retention-days: 3

  health:
    name: ${{ inputs.display_name }} health
    if: always()
    needs: [validate, collect, publish]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "market: ${{ inputs.market }}" >> "$GITHUB_STEP_SUMMARY"
          echo "validate: ${{ needs.validate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "collect: ${{ needs.collect.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.publish.result }}" = "success"
