name: Patch AutoPapa exact gallery binding once

on:
  push:
    branches:
      - fix/autopapa-source-bound-gallery-20260812
    paths:
      - .github/workflows/patch-autopapa-gallery-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autopapa-source-bound-gallery-20260812
          fetch-depth: 0
      - name: Bind detail gallery to exact listing photo family
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/catalog/autopapa-georgia-source.ts')
          s = path.read_text()
          anchor = 'export function parseAutoPapaGeorgiaListing(markup: string, pageUrl = `${BASE_URL}/en/usd/search?page=1`): AutoPapaGeorgiaRow[] {'
          if anchor not in s:
              raise SystemExit('parse anchor not found')
          helper = r'''function autoPapaPhotoIdentity(url: string) {
            try {
              return new URL(url).pathname.match(/(\/system\/car\/photos\/\d+\/\d+\/\d+)\//i)?.[1] || new URL(url).pathname;
            } catch { return url; }
          }

          function autoPapaListingOwnerPrefix(url: string) {
            try {
              return new URL(url).pathname.match(/(\/system\/car\/photos\/\d+\/\d+)\/\d+\//i)?.[1] || "";
            } catch { return ""; }
          }

          export function selectAutoPapaGeorgiaGallery(markup: string, base: string, listingImages: string[]) {
            const safeListingImages = [...new Set(listingImages.filter((url) => {
              try {
                const parsed = new URL(url);
                return parsed.host === "autopapa.ge" && /\/system\/car\/photos\//i.test(parsed.pathname) && !BAD_IMAGE_RE.test(parsed.pathname);
              } catch { return false; }
            }))];
            const ownerPrefix = safeListingImages.map(autoPapaListingOwnerPrefix).find(Boolean) || "";
            if (!ownerPrefix) return safeListingImages;
            const exactOriginals = listingPhotoUrls(markup, base).filter((url) => {
              try {
                const pathname = new URL(url).pathname;
                return pathname.startsWith(`${ownerPrefix}/`) && /\/original\.jpg$/i.test(pathname);
              } catch { return false; }
            });
            const seen = new Set<string>();
            return [...safeListingImages, ...exactOriginals].filter((url) => {
              const identity = autoPapaPhotoIdentity(url);
              if (seen.has(identity)) return false;
              seen.add(identity);
              return true;
            });
          }

          '''
          if 'selectAutoPapaGeorgiaGallery' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          old = '      if (detail) urls = [...new Set([...urls, ...listingPhotoUrls(detail.markup, detail.response.url || detailUrl)])];'
          new = '      if (detail) urls = selectAutoPapaGeorgiaGallery(detail.markup, detail.response.url || detailUrl, urls);'
          if old not in s:
              raise SystemExit('fetchImages detail expansion line not found')
          s = s.replace(old, new, 1)
          path.write_text(s)
          PY
      - name: Focused tests
        run: |
          npm ci
          node --import tsx --test tests/autopapa-georgia-gallery-binding-20260812.test.ts tests/autopapa-georgia-current-parser-20260812.test.ts tests/georgia-current-route-contract-20260812.test.ts tests/georgia-canonical-source-policy-20260812.test.ts
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/patch-autopapa-gallery-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/autopapa-georgia-source.ts tests/autopapa-georgia-gallery-binding-20260812.test.ts .github/workflows/patch-autopapa-gallery-once.yml
          git diff --cached --check
          git commit -m 'fix(georgia): bind AutoPapa gallery to exact listing family'
          git push origin HEAD:fix/autopapa-source-bound-gallery-20260812
