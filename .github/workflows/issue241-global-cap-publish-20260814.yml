name: Issue241 guarded global cap publication 20260814

on:
  push:
    branches: [ops/issue241-global-cap-publish-20260814]
    paths:
      - '.github/workflows/issue241-global-cap-publish-20260814.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  RECOVERY_PREFERRED_MAX_RUB: '8000000'
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: '20'
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: '20'
  CATALOG_PUBLISH_LOCK_WAIT_MS: '7200000'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac8fdb23bfecd6756d799afbd10e3ff60af5920d
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Download successful guarded read-only projection
        uses: actions/download-artifact@v4
        with:
          name: model-year-quota-dryrun-20260814
          path: dryrun
          github-token: ${{ github.token }}
          repository: jeep-jim/AvtoCena
          run-id: '31736918464'

      - name: Gate fresh post-enrichment projection
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('dryrun/catalog-global-model-cap-dryrun.json','utf8'));
          const before={korea:8934,china:7534,japan:2491,uae:1042,europe:5385,georgia:2282,kyrgyzstan:2481};
          const selected={korea:8934,china:7534,japan:2491,uae:1042,europe:5382,georgia:2282,kyrgyzstan:2481};
          if(!r.dryRun||r.postEnrichmentQuota!==true||Number(r.maxOffersPerModelYear)!==20) throw new Error('fresh_projection_mode_gate');
          for(const [m,n] of Object.entries(before)) if(Number(r.beforeByMarket?.[m])!==n) throw new Error(`fresh_before_${m}:${r.beforeByMarket?.[m]}!=${n}`);
          for(const [m,n] of Object.entries(selected)) if(Number(r.selectedByMarket?.[m])!==n) throw new Error(`fresh_selected_${m}:${r.selectedByMarket?.[m]}!=${n}`);
          for(const m of Object.keys(selected)) {
            const s=r.byMarket?.[m]||{};
            if(Number(s.removedByQuality||0)!==0) throw new Error(`fresh_quality_${m}:${s.removedByQuality}`);
            if(Number(s.maxPerExactModelYear||0)>20) throw new Error(`fresh_quota_${m}:${s.maxPerExactModelYear}`);
            const expectedRemoved=m==='europe'?3:0;
            if(Number(s.removedByModelYearQuota||0)!==expectedRemoved) throw new Error(`fresh_removed_${m}:${s.removedByModelYearQuota}`);
          }
          console.log(JSON.stringify({before:r.beforeByMarket,selected:r.selectedByMarket,byMarket:r.byMarket},null,2));
          NODE

      - name: Fail if another catalog writer is active or queued
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const https=require('node:https');
          const token=process.env.GH_TOKEN;
          const current=Number(process.env.GITHUB_RUN_ID||0);
          const get=(path)=>new Promise((resolve,reject)=>{const req=https.request({hostname:'api.github.com',path,headers:{'user-agent':'AvtoCena-issue241-writer-guard','authorization':`Bearer ${token}`,'accept':'application/vnd.github+json'}},res=>{let body='';res.on('data',d=>body+=d);res.on('end',()=>res.statusCode>=200&&res.statusCode<300?resolve(JSON.parse(body)):reject(new Error(`github_${res.statusCode}:${body.slice(0,200)}`)));});req.on('error',reject);req.end();});
          (async()=>{
            const all=[];
            for(const status of ['in_progress','queued']){
              const data=await get(`/repos/jeep-jim/AvtoCena/actions/runs?status=${status}&per_page=100`);
              for(const r of data.workflow_runs||[]) if(Number(r.id)!==current) all.push(r);
            }
            const writerRe=/(?:catalog.*(?:daily|recovery|publish|publication|repair|writer|cleanup)|(?:daily|recovery|publish|publication|repair|writer|cleanup).*catalog|korea.*(?:publish|publication)|global.*cap.*publish)/i;
            const writers=all.filter(r=>writerRe.test(`${r.name||''} ${r.path||''} ${r.display_title||''}`));
            console.log(JSON.stringify({current,otherActiveOrQueued:all.map(r=>({id:r.id,status:r.status,name:r.name,path:r.path})),writers:writers.map(r=>({id:r.id,status:r.status,name:r.name,path:r.path}))},null,2));
            if(writers.length) throw new Error(`other_catalog_writer_present:${writers.map(r=>r.id).join(',')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Current all-seven snapshot before write
        env:
          CATALOG_AUDIT_OUTPUT: issue241-prewrite-all7.json
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs

      - name: Gate exact current counts and blocker identity
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('issue241-prewrite-all7.json','utf8'));
          const expected={korea:8934,china:7534,japan:2491,uae:1042,europe:5385,georgia:2282,kyrgyzstan:2481};
          for(const [m,n] of Object.entries(expected)) if(Number(r.markets?.[m]?.count)!==n) throw new Error(`prewrite_count_${m}:${r.markets?.[m]?.count}!=${n}`);
          for(const m of Object.keys(expected)) {
            const max=Number(r.markets?.[m]?.maxPerExactModelYear||0);
            if(m==='europe') { if(max!==23) throw new Error(`prewrite_europe_quota:${max}`); }
            else if(max>20) throw new Error(`prewrite_quota_${m}:${max}`);
          }
          const ks=r.markets?.korea?.sourceCounts||{};
          if(Number(ks.encar_direct)!==7261||Number(ks.kcar_korea_open)!==1658||Number(ks.kbchachacha_korea_open)!==15) throw new Error(`prewrite_korea_sources:${JSON.stringify(ks)}`);
          console.log(JSON.stringify({counts:Object.fromEntries(Object.entries(r.markets).map(([m,s])=>[m,s.count])),max:Object.fromEntries(Object.entries(r.markets).map(([m,s])=>[m,s.maxPerExactModelYear])),koreaSources:ks},null,2));
          NODE

      - name: Create Korea semantic gate helper
        shell: bash
        run: |
          cat > issue241-korea-semantic.mjs <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { catalogModelYearQuotaKey } = await import('./apps/web/lib/catalog/inventory-quota.ts');
          const output=process.env.ISSUE241_SEMANTIC_OUTPUT||'issue241-korea-semantic.json';
          const rows=await readMarketOffers('korea');
          const text=r=>`${r.make||''} ${r.model||''} ${r.trim||''} ${r.sourceTitle||''} ${JSON.stringify(r?.operational?.raw||{})}`;
          const dist=(key,source=rows)=>Object.fromEntries([...new Set(source.map(r=>String(r?.[key]||'<missing>')))].sort().map(v=>[v,source.filter(r=>String(r?.[key]||'<missing>')===v).length]));
          const sources=dist('sourceId');
          const badYears=rows.filter(r=>Number(r.year||0)<2020);
          const foreign=rows.filter(r=>String(r.market||'')!=='korea');
          const badImages=rows.filter(r=>!Array.isArray(r.images)||r.images.length<5);
          const encar=rows.filter(r=>String(r.sourceId||'')==='encar_direct');
          const suv=encar.filter(r=>/^(?:suv|crossover)$/i.test(String(r.bodyType||''))).length;
          const ratio=encar.length?suv/encar.length:1;
          const known=r=>/(?:genesis|제네시스)[\s_-]*g80|(?:hyundai|현대)[\s_-]*(?:grandeur|그랜저)|(?:hyundai|현대)[\s_-]*(?:ioniq\s*6|아이오닉\s*6)|(?:kia|기아)[\s_-]*(?:k9|k900|quoris|퀴리스)/i.test(text(r));
          const badSedans=rows.filter(r=>known(r)&&/^(?:suv|crossover|offroad)$/i.test(String(r.bodyType||'')));
          const casper2022=rows.filter(r=>Number(r.year)===2022&&/(?:hyundai|현대)/i.test(text(r))&&/(?:casper|캐스퍼)/i.test(text(r)));
          const quota=new Map();
          for(const r of rows){const k=catalogModelYearQuotaKey(r,'korea');if(k) quota.set(k,(quota.get(k)||0)+1);}
          const maxQuota=Math.max(0,...quota.values());
          const isK933=r=>/(?:\bk9\b|k900|quoris|퀴리스)/i.test(text(r))&&/(?:\b3[.,]3\b[^\n]{0,40}\bgdi\b|\bgdi\b[^\n]{0,40}\b3[.,]3\b)/i.test(text(r));
          const k933=rows.filter(isK933);
          const badK9=k933.filter(r=>[3000,3300].includes(Number(r.engineCc||0)));
          const exactK9=k933.filter(r=>Number(r.engineCc||0)===3342);
          const report={count:rows.length,sources,minYear:rows.length?Math.min(...rows.map(r=>Number(r.year||0))):0,badYears:badYears.length,foreign:foreign.length,maxPerExactModelYear:maxQuota,below5Images:badImages.length,encar:{count:encar.length,suvOrCrossover:suv,ratio:Number(ratio.toFixed(4))},knownSedanViolations:badSedans.length,casper2022:casper2022.length,k9_3_3_gdi:{count:k933.length,engineCc:dist('engineCc',k933),roundedUnsafe:badK9.length,exact3342:exactK9.length},bodyType:dist('bodyType'),drive:dist('drive'),transmission:dist('transmission'),fuel:dist('fuel')};
          fs.writeFileSync(output,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(rows.length!==8934) throw new Error(`korea_count:${rows.length}`);
          if(Number(sources.encar_direct)!==7261||Number(sources.kcar_korea_open)!==1658||Number(sources.kbchachacha_korea_open)!==15) throw new Error(`korea_sources:${JSON.stringify(sources)}`);
          if(badYears.length||foreign.length||badImages.length||maxQuota>20) throw new Error(`korea_age_market_image_quota:${badYears.length}:${foreign.length}:${badImages.length}:${maxQuota}`);
          if(ratio>0.75||badSedans.length||!casper2022.length) throw new Error(`korea_semantic:${ratio}:${badSedans.length}:${casper2022.length}`);
          if(badK9.length||exactK9.length===0) throw new Error(`korea_k9_engine:${badK9.length}:${exactK9.length}`);
          NODE

      - name: Live Korea semantic audit before cleanup
        env:
          ISSUE241_SEMANTIC_OUTPUT: issue241-korea-prewrite-semantic.json
        run: node --import tsx issue241-korea-semantic.mjs

      - name: Re-check writers immediately before write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const https=require('node:https');
          const token=process.env.GH_TOKEN;
          const current=Number(process.env.GITHUB_RUN_ID||0);
          const get=(path)=>new Promise((resolve,reject)=>{const req=https.request({hostname:'api.github.com',path,headers:{'user-agent':'AvtoCena-issue241-writer-guard','authorization':`Bearer ${token}`,'accept':'application/vnd.github+json'}},res=>{let body='';res.on('data',d=>body+=d);res.on('end',()=>res.statusCode>=200&&res.statusCode<300?resolve(JSON.parse(body)):reject(new Error(`github_${res.statusCode}:${body.slice(0,200)}`)));});req.on('error',reject);req.end();});
          (async()=>{
            const all=[];
            for(const status of ['in_progress','queued']){const data=await get(`/repos/jeep-jim/AvtoCena/actions/runs?status=${status}&per_page=100`);for(const r of data.workflow_runs||[]) if(Number(r.id)!==current) all.push(r);}
            const writerRe=/(?:catalog.*(?:daily|recovery|publish|publication|repair|writer|cleanup)|(?:daily|recovery|publish|publication|repair|writer|cleanup).*catalog|korea.*(?:publish|publication)|global.*cap.*publish)/i;
            const writers=all.filter(r=>writerRe.test(`${r.name||''} ${r.path||''} ${r.display_title||''}`));
            console.log(JSON.stringify({writers:writers.map(r=>({id:r.id,status:r.status,name:r.name,path:r.path}))},null,2));
            if(writers.length) throw new Error(`other_catalog_writer_present:${writers.map(r=>r.id).join(',')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish canonical global model-year cap atomically
        env:
          CATALOG_GLOBAL_MODEL_CAP_DRY_RUN: '0'
          CATALOG_GLOBAL_MODEL_CAP_REPORT: issue241-global-cap-publication.json
        run: npx tsx scripts/catalog-enforce-global-model-cap.mjs

      - name: Gate publication counts and exact change scope
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('issue241-global-cap-publication.json','utf8'));
          const before={korea:8934,china:7534,japan:2491,uae:1042,europe:5385,georgia:2282,kyrgyzstan:2481};
          const after={korea:8934,china:7534,japan:2491,uae:1042,europe:5382,georgia:2282,kyrgyzstan:2481};
          if(!r.published||r.postEnrichmentQuota!==true||Number(r.maxOffersPerModelYear)!==20||!r.generationId||r.failures?.length) throw new Error(`publish_report_gate:${JSON.stringify(r.failures||[])}`);
          for(const [m,n] of Object.entries(before)) if(Number(r.beforeByMarket?.[m])!==n) throw new Error(`publish_before_${m}:${r.beforeByMarket?.[m]}!=${n}`);
          for(const [m,n] of Object.entries(after)) {
            if(Number(r.selectedByMarket?.[m])!==n||Number(r.afterByMarket?.[m])!==n) throw new Error(`publish_after_${m}:${r.selectedByMarket?.[m]}:${r.afterByMarket?.[m]}!=${n}`);
            if(Number(r.byMarket?.[m]?.removedByQuality||0)!==0) throw new Error(`publish_quality_${m}:${r.byMarket?.[m]?.removedByQuality}`);
            const expectedRemoved=m==='europe'?3:0;
            if(Number(r.byMarket?.[m]?.removedByModelYearQuota||0)!==expectedRemoved) throw new Error(`publish_removed_${m}:${r.byMarket?.[m]?.removedByModelYearQuota}`);
          }
          console.log(JSON.stringify({generationId:r.generationId,before:r.beforeByMarket,after:r.afterByMarket,byMarket:r.byMarket},null,2));
          NODE

      - name: Strict postpublish all-seven audit
        env:
          CATALOG_AUDIT_OUTPUT: issue241-postpublish-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs

      - name: Gate exact postpublish counts
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('issue241-postpublish-all7.json','utf8'));
          const expected={korea:8934,china:7534,japan:2491,uae:1042,europe:5382,georgia:2282,kyrgyzstan:2481};
          if(r.failures?.length) throw new Error(`post_failures:${r.failures.join(',')}`);
          for(const [m,n] of Object.entries(expected)) {
            const s=r.markets?.[m]||{};
            if(Number(s.count)!==n) throw new Error(`post_count_${m}:${s.count}!=${n}`);
            if(Number(s.maxPerExactModelYear||0)>20) throw new Error(`post_quota_${m}:${s.maxPerExactModelYear}`);
          }
          console.log(JSON.stringify({counts:Object.fromEntries(Object.entries(r.markets).map(([m,s])=>[m,s.count])),max:Object.fromEntries(Object.entries(r.markets).map(([m,s])=>[m,s.maxPerExactModelYear]))},null,2));
          NODE

      - name: Live Korea semantic audit after cleanup
        env:
          ISSUE241_SEMANTIC_OUTPUT: issue241-korea-postpublish-semantic.json
        run: node --import tsx issue241-korea-semantic.mjs

      - name: Confirm Korea semantic invariants stayed green
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('issue241-korea-prewrite-semantic.json','utf8'));
          const b=JSON.parse(fs.readFileSync('issue241-korea-postpublish-semantic.json','utf8'));
          for(const k of ['count','badYears','foreign','maxPerExactModelYear','below5Images','knownSedanViolations','casper2022']) if(Number(a[k])!==Number(b[k])) throw new Error(`korea_semantic_changed_${k}:${a[k]}->${b[k]}`);
          for(const s of ['encar_direct','kcar_korea_open','kbchachacha_korea_open']) if(Number(a.sources?.[s])!==Number(b.sources?.[s])) throw new Error(`korea_source_changed_${s}:${a.sources?.[s]}->${b.sources?.[s]}`);
          if(Number(b.k9_3_3_gdi?.roundedUnsafe||0)!==0||Number(b.k9_3_3_gdi?.exact3342||0)<=0) throw new Error('korea_k9_post_gate');
          console.log(JSON.stringify({before:a,after:b},null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-global-cap-publication-20260814
          path: |
            dryrun/catalog-global-model-cap-dryrun.json
            issue241-prewrite-all7.json
            issue241-korea-prewrite-semantic.json
            issue241-global-cap-publication.json
            issue241-postpublish-all7.json
            issue241-korea-postpublish-semantic.json
          if-no-files-found: warn
          retention-days: 7
