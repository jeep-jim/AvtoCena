name: Catalog V3 · UAE · 10k
run-name: Catalog V3 · UAE · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10,22 * * *"

# Twice-daily independent market refresh. Existing rows remain only inside the
# configured three-day window; expired and policy-rejected cards are removed.
permissions:
  contents: read

jobs:
  uae:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
    secrets: inherit
