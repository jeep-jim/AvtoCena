name: Catalog V3 · UAE · 10k
run-name: Catalog V3 · UAE · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "40 2 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-uae.yml

# Recovery marker: guarded-publication-2026-08-06.
permissions:
  contents: read

jobs:
  uae:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
    secrets: inherit
