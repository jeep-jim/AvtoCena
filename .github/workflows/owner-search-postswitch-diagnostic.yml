name: Inspect failed owner catalog switch once
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/owner-search-postswitch-diagnostic.json']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
      - name: Read only the stopped candidate error interval
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 python3 - < .github/owner-search-recovery/read-failed.py | tee failed-switch-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-switch-diagnostic
          path: failed-switch-diagnostic.log
