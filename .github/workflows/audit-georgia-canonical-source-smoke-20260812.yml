name: Audit Georgia canonical sources only
run-name: Georgia canonical source smoke · ${{ github.sha }}

on:
  push:
    branches:
      - audit/georgia-canonical-source-smoke-20260812-r2
  workflow_dispatch:

permissions:
  contents: read

env:
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  RECOVERY_MARKET: georgia
  RECOVERY_TARGET: "20"
  RECOVERY_MAX_PAGES: "5"
  RECOVERY_TIME_LIMIT_MS: "300000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "2"
  RECOVERY_PREPARE_CONCURRENCY: "2"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source:
          - myauto_georgia_list
          - autopapa_georgia_open
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe canonical source without publishing
        shell: bash
        env:
          RECOVERY_SOURCE_IDS: ${{ matrix.source }}
          RECOVERY_OUTPUT: georgia-${{ matrix.source }}.json
        run: |
          set +e
          npx tsx scripts/catalog-live-recovery-market.mjs
          status=$?
          set -e
          node - "$RECOVERY_OUTPUT" "$status" <<'NODE'
          const fs = require('node:fs');
          const [file, status] = process.argv.slice(2);
          let payload = {};
          try { payload = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          console.log(JSON.stringify({
            source: process.env.RECOVERY_SOURCE_IDS,
            exitStatus: Number(status),
            count: Number(payload.count || 0),
            sourceReports: payload.report?.sources || [],
            rejections: payload.report?.rejections || {},
            errors: payload.report?.errors || [],
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-canonical-smoke-${{ matrix.source }}
          path: georgia-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3
