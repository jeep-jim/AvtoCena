name: Audit production catalog brand filter contract

on:
  push:
    branches: [audit/catalog-filter-brand-prod-20260812]
    paths: [.github/workflows/audit-catalog-filter-brand-prod-20260812.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate production brand stats and multi-make OR
        run: |
          set -euo pipefail
          curl --fail-with-body -sS 'https://avtocena.com/api/catalog/brand-counts' -o /tmp/brands.json
          curl --fail-with-body -sS 'https://avtocena.com/api/catalog/search?make=Audi%2CBMW&pageSize=48' -o /tmp/multi.json
          node <<'NODE'
          const fs=require('fs');
          const brands=JSON.parse(fs.readFileSync('/tmp/brands.json','utf8'));
          if (!brands.counts || !brands.modelCounts) throw new Error('brand counts/modelCounts missing');
          for (const make of ['Audi','BMW']) {
            if (!(Number(brands.counts[make])>0)) throw new Error(`${make} live count missing`);
            if (!(Number(brands.modelCounts[make])>0)) throw new Error(`${make} model count missing`);
          }
          const multi=JSON.parse(fs.readFileSync('/tmp/multi.json','utf8'));
          if (!(Number(multi.total)>0)) throw new Error('multi-brand total missing');
          const makes=[...new Set((multi.items||[]).map(x=>String(x.make||'')))];
          if (makes.some(make=>!['Audi','BMW'].includes(make))) throw new Error(`unexpected make: ${makes.join(',')}`);
          console.log(JSON.stringify({generationId:brands.generationId,audi:{cars:brands.counts.Audi,models:brands.modelCounts.Audi},bmw:{cars:brands.counts.BMW,models:brands.modelCounts.BMW},multiBrandTotal:multi.total,pageMakes:makes},null,2));
          NODE
