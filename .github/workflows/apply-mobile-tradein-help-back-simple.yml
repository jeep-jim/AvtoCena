name: Apply mobile trade-in help back simple

on:
  push:
    branches:
      - ui/mobile-tradein-help-back-20260814

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-tradein-help-back-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 .github/scripts/apply_tradein_help_back.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only change
        shell: bash
        run: |
          rm .github/workflows/apply-mobile-tradein-help-back-once.yml
          rm .github/workflows/apply-mobile-tradein-help-back-simple.yml
          rm .github/scripts/apply_tradein_help_back.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish inline Trade-in help navigation"
          git push origin HEAD:ui/mobile-tradein-help-back-20260814
