name: Validate Mashina source gallery dedupe

on:
  push:
    branches:
      - fix/mashina-gallery-identity-20260810
    paths:
      - ".github/workflows/mashina-gallery-identity-branch.yml"
      - ".github/patches/apply-mashina-gallery-identity.py"

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply source-only patch
        run: python .github/patches/apply-mashina-gallery-identity.py
      - name: Typecheck
        run: npm run typecheck
      - name: Verify known Mashina rendition identities
        shell: bash
        run: |
          cat > /tmp/mashina-gallery-check.ts <<'TS'
          import { dedupeMashinaImageUrls } from process.env.GITHUB_WORKSPACE + "/apps/web/lib/catalog/mashina-kyrgyzstan-list-source.ts";
          const storage = dedupeMashinaImageUrls([
            "https://storage.mashina.kg/catalog/images/2026-08-02/10102361/abc_small.webp",
            "https://storage.mashina.kg/catalog/images/2026-08-02/10102361/abc_medium.webp",
            "https://storage.mashina.kg/catalog/images/2026-08-02/10102361/abc_large.webp",
            "https://storage.mashina.kg/catalog/images/2026-08-02/10102361/def_medium.webp",
          ]);
          if (storage.length !== 2 || !storage[0].includes("abc_large.webp")) throw new Error(`storage dedupe failed: ${JSON.stringify(storage)}`);
          const legacy = dedupeMashinaImageUrls([
            "https://im.mashina.kg/tachka/images/1/3/8/hash_640x480.jpg",
            "https://im.mashina.kg/tachka/images/1/3/8/hash_1200x900.jpg",
          ]);
          if (legacy.length !== 1 || !legacy[0].includes("1200x900.jpg")) throw new Error(`legacy dedupe failed: ${JSON.stringify(legacy)}`);
          const bogus = dedupeMashinaImageUrls(["https://mashina.kg/cdn-cgi/challenge-platform/scripts/jsd/main.js"]);
          if (bogus.length !== 0) throw new Error(`bogus asset accepted: ${JSON.stringify(bogus)}`);
          console.log(JSON.stringify({ storage, legacy, bogus }, null, 2));
          TS
          npx tsx /tmp/mashina-gallery-check.ts
      - name: Commit validated source patch to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/mashina-kyrgyzstan-list-source.ts
          git commit -m "Deduplicate Mashina source photo renditions"
          git push origin HEAD:fix/mashina-gallery-identity-20260810
