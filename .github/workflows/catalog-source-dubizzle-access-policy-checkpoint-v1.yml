name: Catalog source qualification · Dubizzle access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/dubizzle-access-policy-v1-20260905
    paths:
      - ".github/workflows/catalog-source-dubizzle-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-dubizzle-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-dubizzle-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Dubizzle lead-only access-policy decision
        run: node scripts/catalog-source-dubizzle-access-policy-checkpoint-v1.mjs
      - name: Verify safety, roadmap and next step
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='dubizzle_uae_open');
          const d=l.decisions.find(x=>x.sourceId==='dubizzle_uae_open');
          if(!row||row.class!=='lead_only'||row.publishAllowed!==false)throw new Error('Dubizzle registry invalid');
          if(row.qualificationBlocker!=='public_scraping_database_compilation_and_commercial_exploitation_prohibited_plus_exact_engine_power_contract_failed')throw new Error('Dubizzle blocker missing');
          if(!d||d.class!=='lead_only'||d.publishAllowed!==false)throw new Error('Dubizzle ledger invalid');
          const japan=r.candidates.filter(x=>x.market==='japan');
          if(!japan.length||japan.some(x=>x.qualificationPaused!==true))throw new Error('Japan pause missing');
          if(!/Che168 China/i.test(r.next||''))throw new Error('Che168 next missing');
          if(!m.includes('## 40.46 — Dubizzle UAE: official Terms block scraping/database reuse; strict exact contract already failed'))throw new Error('roadmap 40.46 missing');
          if(r.candidates.some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Classify Dubizzle public route lead-only"
          git push origin HEAD:chore/dubizzle-access-policy-v1-20260905
