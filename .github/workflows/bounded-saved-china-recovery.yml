# Frozen source pins remain placeholders until final independent review.
name: Bounded saved China recovery on exact live83
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bounded-saved-china-recovery.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
env:
  OPERATIONAL_PACKAGE_BLOB: 5eb3d5f1e616824e6e8f64f72f72c6948a903672
  OPERATIONAL_MANIFEST_SHA256: 60c7a30647e3ff7bff192d52d8b5804b6ec82e898de2c913a7543d6add2f8b39
  CONTROLLER_PACKAGE_BLOB: 3dfa5fbfe562ede35c8b182b832fa9baf0c48873
  CI_TEST_PACKAGE_BLOB: 7edbad0f6bad7d691e14e02fac36fad8255de203
jobs:
  ci:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run bounded saved China recovery 20261118-v6')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Materialize exact hash-bound code without storage credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -m700 "$RUNNER_TEMP/china-job"
          cat > "$RUNNER_TEMP/unpack-frozen.py" <<'PY'
          #!/usr/bin/env python3
          """Decode an exact Git blob containing reviewed source only. No archive authority."""
          import base64,hashlib,json,os,pathlib,re,sys
          
          def unpack(response,expected_blob,destination):
              if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')
              response=pathlib.Path(response);destination=pathlib.Path(destination)
              if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute() or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')
              envelope=json.loads(response.read_bytes())
              if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob: raise ValueError('blob_binding')
              content=base64.b64decode(''.join(envelope['content'].split()),validate=True)
              if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()!=expected_blob: raise ValueError('blob_hash')
              bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]
              if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise ValueError('bundle_schema')
              for e in entries:
                  name=e['path'];parts=name.split('/')
                  if not re.fullmatch(r'[A-Za-z0-9_.\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data') for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')): raise ValueError('bundle_path')
                  data=e['contents'].encode('utf-8');total+=len(data)
                  if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']: raise ValueError('bundle_file_binding')
                  prepared.append((parts,data));seen.add(name)
              destination.mkdir(mode=0o700)
              # Only immutable hash-pinned controller-authored names enter this fresh private root.
              for parts,data in prepared:
                  out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                  fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
                  try:
                      view=memoryview(data)
                      while view:
                          n=os.write(fd,view)
                          if n<=0: raise ValueError('bundle_short_write')
                          view=view[n:]
                  finally: os.close(fd)
              return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}
          if __name__=='__main__':
              try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))
              except Exception:
                  print('{"ok":false,"code":"frozen_bundle_unpack_failed"}',file=sys.stderr);sys.exit(1)
          PY
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$OPERATIONAL_PACKAGE_BLOB" > "$RUNNER_TEMP/package-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/package-blob.json" "$OPERATIONAL_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/package"
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$CONTROLLER_PACKAGE_BLOB" > "$RUNNER_TEMP/controller-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/controller-blob.json" "$CONTROLLER_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/controller"
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$CI_TEST_PACKAGE_BLOB" > "$RUNNER_TEMP/tests-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/tests-blob.json" "$CI_TEST_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/tests"
      - name: Install exact locked test toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.22.1
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.9.0
          export PATH="$RUNNER_TEMP/pinned-npm/node_modules/.bin:$PATH"
          echo "$RUNNER_TEMP/pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(npm --version)" = 11.9.0
          (cd publisher && npm ci)
      - name: Run separately pinned portable regression suite
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job'
          manifest_bytes=(root/'package'/'SOURCE_MANIFEST.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest()==os.environ['OPERATIONAL_MANIFEST_SHA256']
          manifest=json.loads(manifest_bytes);assert manifest['dynamicSitesReviewed'] is True
          for directory,entries in [(root/'package'/'operational',manifest['operational']['files']),*( (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/k,manifest['native'][k]['files']) for k in ['publisher','runtime'])]:
              for e in entries:
                  b=(directory/e['path']).read_bytes();assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
          envelope=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'tests-blob.json'))
          bundle=json.loads(base64.b64decode(envelope['content']))
          assert bundle['kind']=='selected-portable-ci-tests-not-whole-publication'
          inventory={e['path'] for e in bundle['files']}
          tests=bundle['tests'];assert tests and len(tests)==len(set(tests))
          assert all(t in inventory and t.endswith('.test.mjs') and not t.startswith('-') for t in tests)
          for e in bundle['files']:
              source=root/'tests'/e['path'];target=root/'package'/'operational'/e['path']
              assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True)
              with target.open('xb') as f:f.write(source.read_bytes())
          subprocess.run(['node','--test','--test-concurrency=1',*tests],cwd=root/'package'/'operational',check=True)
          PY
  recover:
    needs: ci
    if: github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Materialize exact hash-bound code without storage credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -m700 "$RUNNER_TEMP/china-job"
          cat > "$RUNNER_TEMP/unpack-frozen.py" <<'PY'
          #!/usr/bin/env python3
          """Decode an exact Git blob containing reviewed source only. No archive authority."""
          import base64,hashlib,json,os,pathlib,re,sys
          
          def unpack(response,expected_blob,destination):
              if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')
              response=pathlib.Path(response);destination=pathlib.Path(destination)
              if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute() or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')
              envelope=json.loads(response.read_bytes())
              if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob: raise ValueError('blob_binding')
              content=base64.b64decode(''.join(envelope['content'].split()),validate=True)
              if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()!=expected_blob: raise ValueError('blob_hash')
              bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]
              if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise ValueError('bundle_schema')
              for e in entries:
                  name=e['path'];parts=name.split('/')
                  if not re.fullmatch(r'[A-Za-z0-9_.\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data') for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')): raise ValueError('bundle_path')
                  data=e['contents'].encode('utf-8');total+=len(data)
                  if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']: raise ValueError('bundle_file_binding')
                  prepared.append((parts,data));seen.add(name)
              destination.mkdir(mode=0o700)
              # Only immutable hash-pinned controller-authored names enter this fresh private root.
              for parts,data in prepared:
                  out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                  fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
                  try:
                      view=memoryview(data)
                      while view:
                          n=os.write(fd,view)
                          if n<=0: raise ValueError('bundle_short_write')
                          view=view[n:]
                  finally: os.close(fd)
              return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}
          if __name__=='__main__':
              try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))
              except Exception:
                  print('{"ok":false,"code":"frozen_bundle_unpack_failed"}',file=sys.stderr);sys.exit(1)
          PY
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$OPERATIONAL_PACKAGE_BLOB" > "$RUNNER_TEMP/package-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/package-blob.json" "$OPERATIONAL_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/package"
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$CONTROLLER_PACKAGE_BLOB" > "$RUNNER_TEMP/controller-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/controller-blob.json" "$CONTROLLER_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/controller"
      - name: Install exact locked native toolchains without storage credentials
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.22.1
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.9.0
          export PATH="$RUNNER_TEMP/pinned-npm/node_modules/.bin:$PATH"
          echo "$RUNNER_TEMP/pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(npm --version)" = 11.9.0
          (cd publisher && npm ci)
          (cd runtime && npm ci)
      - name: Refuse competing writers and retrieve retained original input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/jeep-jim/AvtoCena/actions/runs?status=in_progress&per_page=100' > "$RUNNER_TEMP/active-runs.json"
          python - <<'PY'
          import json,os
          pages=json.load(open(os.environ['RUNNER_TEMP']+'/active-runs.json'))
          conflicts=[r['id'] for p in pages for r in p['workflow_runs'] if str(r['id'])!=os.environ['GITHUB_RUN_ID'] and any(x in (r.get('name','')+' '+r.get('path','')).lower() for x in ('regcloud','deploy','catalog','publication','restore','recovery'))]
          assert not conflicts,'competing_catalog_workflow'
          PY
          gh api 'repos/jeep-jim/AvtoCena/actions/artifacts/14283314696/zip' > "$RUNNER_TEMP/china-job/original.zip"
          python "$RUNNER_TEMP/china-job/controller/extract-verified-source.py" "$RUNNER_TEMP/china-job/original.zip" "$RUNNER_TEMP/china-job/restored" 605ebd83e04da61c0138fe73f2cc85cfae82f4fe6dc368a872d3df358d5a6163 579 2748251915 > "$RUNNER_TEMP/china-job/source-extraction.json"
      - name: Bind exact package, toolchain, current request and resource ceilings
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job';workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          request={'jobRoot':str(root),'publisherRoot':str(workspace/'publisher'),'runtimeRoot':str(workspace/'runtime'),'packageDirectory':str(root/'package'),'controllerDirectory':str(root/'controller'),'expectedManifestSha256':os.environ['OPERATIONAL_MANIFEST_SHA256'],'runId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'revision':os.environ['GITHUB_SHA'],'receiptFile':str(root/'controller'/'archive-receipt.json')}
          with (root/'request.json').open('x') as f:json.dump(request,f)
          PY
          node "$RUNNER_TEMP/china-job/controller/materialize-job.mjs" "$RUNNER_TEMP/china-job/request.json" > "$RUNNER_TEMP/china-job/materialized.json"
          node "$RUNNER_TEMP/china-job/package/operational/production/runner-resources.mjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TEMP/china-job/evidence/startup-resources.json"
          cat "$RUNNER_TEMP/china-job/evidence/startup-resources.json"
          python - <<'PYRES'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job';c=json.load(open(root/'config.json'));r=json.load(open(root/'evidence'/'startup-resources.json'))
          m=r['memory'];status=m['cgroupMemoryStatus'];assert status in ('finite','unlimited'),'startup_cgroup_unverified'
          available=min(m['availableBytes'],m['cgroupMemoryAvailable'] if status=='finite' else m['availableBytes'])
          assert available>=c['minMemoryBytes'],'startup_memory_refused'
          assert min(f['availableBytes'] for f in r['filesystems'].values())>=c['minFreeDiskBytes'],'startup_disk_refused'
          print('startup_resources_verified_no_storage_access')
          PYRES
      - name: Same-process bounded prepare, native checks and guarded cutover
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job';m=json.load(open(root/'materialized.json'))
          subprocess.run(['node',str(root/'controller'/'run-bounded.mjs'),m['planFile'],m['planSha256']],check=True)
          PY
      - name: Retain bounded allowlisted evidence, never raw source
        if: always()
        uses: actions/upload-artifact@v4
        with:
