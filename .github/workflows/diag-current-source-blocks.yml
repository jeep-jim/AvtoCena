name: Diagnose current source shard blockers
on:
  push:
    branches: [diag/source-blocks-20260810-1529]
    paths: [.github/workflows/diag-current-source-blocks.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe source APIs without publishing
        shell: bash
        run: |
          node <<'NODE'
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36';
          async function req(label,url,init={}){
            try{
              const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(20000),...init,headers:{'user-agent':ua,'accept-language':'en-US,en;q=0.9,zh-CN;q=0.7',...(init.headers||{})}});
              const text=await r.text();
              let json=null; try{json=JSON.parse(text)}catch{}
              const keys=json&&typeof json==='object'?Object.keys(json).slice(0,20):[];
              console.log(JSON.stringify({label,url,status:r.status,finalUrl:r.url,type:r.headers.get('content-type'),bytes:text.length,keys,preview:text.slice(0,1200).replace(/\s+/g,' ')},null,2));
              return {r,text,json};
            }catch(e){console.log(JSON.stringify({label,url,error:String(e)}));return null}
          }

          // Dongchedi used-car consumer API: current HTML route redirects to login-required,
          // so verify whether the same public data endpoint still works anonymously.
          const dcd='https://www.dongchedi.com/motor/pc/sh/sh_sku_list?aid=1839&app_name=auto_web_pc';
          await req('dcd_form',dcd,{method:'POST',headers:{accept:'application/json,text/plain,*/*','content-type':'application/x-www-form-urlencoded',origin:'https://www.dongchedi.com',referer:'https://www.dongchedi.com/usedcar'},body:new URLSearchParams({sh_city_name:'全国',page:'1',limit:'20'})});
          await req('dcd_json',dcd,{method:'POST',headers:{accept:'application/json,text/plain,*/*','content-type':'application/json',origin:'https://www.dongchedi.com',referer:'https://www.dongchedi.com/usedcar'},body:JSON.stringify({sh_city_name:'全国',page:1,limit:20})});

          // MyAuto SPA API is on a separate host; HTML is Cloudflare-blocked on GitHub runners.
          for(const url of [
            'https://api2.myauto.ge/en/products?page=1',
            'https://api2.myauto.ge/ka/products?page=1',
            'https://api2.myauto.ge/en/appdata/other.json',
            'https://api2.myauto.ge/ka/appdata/other.json',
          ]) await req('myauto_api',url,{headers:{accept:'application/json',origin:'https://www.myauto.ge',referer:'https://www.myauto.ge/'}});

          // mobile.de consumer BFF. Probe likely URL parameter spellings; error payloads reveal the active contract.
          const classic='https://suchen.mobile.de/fahrzeuge/search.html?dam=false&isSearchRequest=true&vc=Car&fr=2020%3A&pw=%3A118&pageNumber=1';
          for(const [name,qs] of [
            ['none',''],['url','?url='+encodeURIComponent(classic)],['searchUrl','?searchUrl='+encodeURIComponent(classic)],['searchQuery','?searchQuery='+encodeURIComponent(classic)],['query','?query='+encodeURIComponent(classic)]
          ]) await req('mobile_bff_'+name,'https://www.mobile.de/consumer/api/search/srp'+qs,{headers:{accept:'application/json','x-mobile-client':'de.mobile.consumer-webapp',referer:'https://www.mobile.de/'}});
          NODE