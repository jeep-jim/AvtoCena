name: Ops · Audit bad gallery frames 20260814
run-name: Audit Japan placeholders and Europe promo gallery · ${{ github.sha }}

on:
  push:
    branches:
      - ops/final-six-markets-20260814

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect exact live galleries and source metadata
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const japan = await readMarketOffers('japan');
          const europe = await readMarketOffers('europe');
          const honda = japan.filter(o => /honda/i.test(String(o.make||'')) && /wr[- ]?v/i.test(String(o.model||'')) && /black style/i.test(String(o.trim||o.sourceTitle||''))).slice(0,4);
          const tesla = europe.filter(o => /tesla/i.test(String(o.make||'')) && /model y/i.test(String(o.model||o.sourceTitle||''))).slice(0,10);
          async function probe(url) {
            try {
              const r = await fetch(url, {headers:{range:'bytes=0-15','user-agent':'Mozilla/5.0'}, signal:AbortSignal.timeout(12000)});
              const b = new Uint8Array(await r.arrayBuffer());
              const sig = [...b.slice(0,8)].map(x=>x.toString(16).padStart(2,'0')).join('');
              return {url,status:r.status,type:r.headers.get('content-type'),bytes:b.length,sig};
            } catch (e) { return {url,error:String(e?.message||e)}; }
          }
          const japanRows=[];
          for (const o of honda) {
            const probes=[];
            for (const img of (o.images||[])) probes.push(await probe(String(img.url||'')));
            japanRows.push({id:o.id,title:[o.make,o.model,o.trim].filter(Boolean).join(' '),sourceUrl:o.operational?.sourceUrl,images:o.images?.length,probes});
          }
          const europeRows=tesla.map(o=>({
            id:o.id,title:o.sourceTitle,sourceUrl:o.operational?.sourceUrl,images:o.images?.map(i=>i.url),
            galleryImages:o.operational?.raw?.vip?.galleryImages || o.operational?.raw?.srp?.galleryImages || null,
            vipKeys:o.operational?.raw?.vip ? Object.keys(o.operational.raw.vip) : [],
          }));
          console.log(JSON.stringify({japanRows,europeRows},null,2));
          NODE
