        import assert from 'node:assert/strict';
        import {createHash} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import fs from 'node:fs';
        import path from 'node:path';
        import {fileURLToPath} from 'node:url';

        const hash = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
        const MARKETS = ['china', 'europe', 'georgia', 'korea', 'uae'];
        const HEX = /^[a-f0-9]{64}$/;

        /** Validate the exact durable candidate context; preparation is never installation. */
        export function validateCandidatePreparationReport(report, {spec, reuse, action, healthPhase, prepared, now = Date.now()}) {
          assert.equal(report?.version, 1, 'candidate_preparation_report_version');
          assert.equal(report.verified, true, 'candidate_preparation_unverified');
          assert.equal(report.candidatePrepared, true, 'candidate_preparation_missing');
          assert.equal(report.installed, false, 'preparation_cannot_claim_installation');
          assert.equal(report.liveReady, false, 'preparation_cannot_claim_live_readiness');
          assert.equal(report.published, false, 'preparation_cannot_claim_publication');
          assert.equal(report.action, action, 'candidate_preparation_action');
          assert.equal(report.healthPhase, healthPhase, 'candidate_preparation_health_phase');
          assert.ok(['prepare', 'verify'].includes(action));
          assert.ok(['before-activation', 'after-activation'].includes(healthPhase));
          assert.ok(action === 'verify' || healthPhase === 'before-activation', 'preparation_after_activation_forbidden');
          assert.ok(Number.isSafeInteger(report.derivedWrites) && report.derivedWrites >= 0, 'candidate_preparation_write_count');
          if (action === 'verify') assert.equal(report.derivedWrites, 0, 'candidate_verification_wrote_objects');
          const core = report.core;
          assert.equal(core?.version, 1, 'candidate_preparation_core_version');
          assert.match(report.receiptSha256 || '', HEX, 'candidate_preparation_receipt_missing');
          assert.equal(hash(core), report.receiptSha256, 'candidate_preparation_receipt_corrupt');
          assert.equal(core.release, spec.source, 'candidate_preparation_source');
          assert.equal(core.calculationVersion, spec.calculationVersion, 'candidate_preparation_calculator');
          assert.equal(reuse.releaseSha, spec.source, 'private_preparation_source');
          assert.equal(reuse.calculationVersion, spec.calculationVersion, 'private_preparation_calculator');
