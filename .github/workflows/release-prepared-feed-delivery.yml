        import fs from 'node:fs/promises';import path from 'node:path';import {createReadStream} from 'node:fs';import {Readable}from 'node:stream';import {createHash,randomUUID}from 'node:crypto';
        const sha=x=>createHash('sha256').update(x).digest('hex');
        const fail=c=>{throw Error(c);};
        export const canonical=v=>JSON.stringify(v&&typeof v==='object'?(Array.isArray(v)?v.map(x=>JSON.parse(canonical(x))):Object.fromEntries(Object.keys(v).sort().map(k=>[k,JSON.parse(canonical(v[k]))]))):v);
        function meta(r){const length=r.headers.get('content-length'),etag=r.headers.get('etag');if(r.status!==200||!/^"[^"\r\n]+"$/.test(etag??'')||!/^\d+$/.test(length??'')||!Number.isSafeInteger(Number(length)))fail('cache_metadata_invalid');if(![null,'identity'].includes(r.headers.get('content-encoding')))fail('cache_encoding_unsupported');return {etag,length:Number(length),version:r.headers.get('x-amz-version-id')};}
        const same=(a,b)=>a.etag===b.etag&&a.length===b.length&&a.version===b.version;
        const limit=4*1024*1024;
        const checkAbort=s=>{if(s?.aborted)fail('cache_request_aborted');};
        async function parallel(items,fn,signal){let cursor=0;const workers=Array.from({length:Math.min(8,items.length)},async()=>{for(;;){checkAbort(signal);const i=cursor++;if(i>=items.length)return;await fn(items[i]);}});const results=await Promise.allSettled(workers);const error=results.find(x=>x.status==='rejected');if(error)throw error.reason;}
        // Atomic directory lock: no stale-lock reclamation. Crash fails closed for operator review.
        export async function persistentCache({directory,binding,mode,head,maxBytes=2*1024**3,maxObjects=4096,lockWaitMs=30000,expectedSeal=null}){
         if(!['prime','verify','replay'].includes(mode)||!/^gen_\d+_[a-z0-9]+$/.test(binding.generation??''))fail('cache_inputs');
