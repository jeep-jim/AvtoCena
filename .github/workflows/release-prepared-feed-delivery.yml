    - name: Confirm final candidate, unchanged paid inventory and unchanged CRM switches
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        set -euo pipefail
        node --import tsx --input-type=module <<'FINAL_STATE'
        import assert from 'node:assert/strict';import fs from 'node:fs';
        import {createHash} from 'node:crypto';
        import {getJsonStorage} from './apps/web/lib/data.ts';
        const response=await fetch('https://avtocena.com/api/health',{headers:{'cache-control':'no-cache'},redirect:'error',signal:AbortSignal.timeout(30000)});
        assert.equal(response.status,200);const health=await response.json();
        assert.equal(health.releaseSha,process.env.RELEASE_SOURCE_SHA);assert.equal(health.calculationVersion,process.env.AVTOCENA_CALCULATION_VERSION);
        const storage=getJsonStorage();storage.writeJson=async()=>{throw Error('final_verification_must_not_write');};
        const controls=await storage.readJson('catalog/operations/collection-controls-v1.json',null);
        const manifest=await storage.readJson('catalog/manifest.json',null);
        const prior=JSON.parse(fs.readFileSync('private-index-reuse-before.json','utf8'));
        const hash=v=>createHash('sha256').update(JSON.stringify(v)).digest('hex');
        assert.equal(hash(manifest),prior.snapshot.manifestSha256);assert.equal(hash(controls),prior.snapshot.controlsSha256);
        assert.equal(controls.markets.korea.enabled,true);assert.equal(controls.sources.encar_feed.enabled,true);assert.equal(controls.sources.ajes_korea_feed.enabled,false);
        assert.equal(manifest.markets.korea.provider,'auto_api_encar');assert.equal(manifest.markets.korea.count,69386);
        const report={passed:true,releaseSha:health.releaseSha,calculationVersion:health.calculationVersion,generationId:manifest.generationId,koreaCount:69386,controlsRevision:controls.revision,encar:true,ajesKorea:false,manifestUnchanged:true,controlsUnchanged:true,writes:0};
        fs.writeFileSync('paid-korea-history-final-state.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
        FINAL_STATE
      if: ${{ success() && env.ACTIVATE_CANDIDATE == 'true' }}
