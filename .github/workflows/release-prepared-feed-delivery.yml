        def read_retained_health(opener=urllib.request.urlopen, pause=time.sleep, clock=time.monotonic, report=print):
            """Retry only bounded transport failures before preparation, never bad identity/data.

            This is the source preflight, not the unchanged timed server/browser gate.
            Each request retains its original 45-second timeout and 32-KiB body bound.
            """
            for attempt in range(1, 4):
                start = clock()
                request = urllib.request.Request('https://avtocena.com/api/health', headers={'Cache-Control': 'no-cache'})
                try:
                    with opener(request, timeout=45) as response:
                        assert response.status == 200, 'retained_health_http'
                        raw = response.read(32769)
                        assert len(raw) <= 32768, 'retained_health_size'
                        value = json.loads(raw)
                    report(json.dumps({'stage': 'retained_health_preflight', 'attempt': attempt,
                                       'http': 200, 'seconds': round(clock() - start, 3)}), flush=True)
                    return value
                except (TimeoutError, ConnectionResetError, ConnectionAbortedError, urllib.error.URLError) as error:
                    if isinstance(error, urllib.error.HTTPError):
                        retryable = error.code in (502, 503, 504)
                    elif isinstance(error, urllib.error.URLError):
                        retryable = isinstance(error.reason, (TimeoutError, ConnectionResetError, ConnectionAbortedError))
                    else:
                        retryable = True
                    report(json.dumps({'stage': 'retained_health_preflight', 'attempt': attempt,
                                       'error': type(error).__name__, 'seconds': round(clock() - start, 3),
                                       'willRetry': retryable and attempt < 3}), flush=True)
                    if not retryable or attempt == 3:
                        raise
                    pause(attempt * 2)


        def validate_spec(spec):
            assert re.fullmatch('[a-f0-9]{40}', spec['source']), 'candidate_source_not_pinned'
            assert spec['source'] not in (RETAINED, INSURANCE_SOURCE), 'new_fastpath_successor_required'
            assert spec.get('retainedSource') == RETAINED, 'retained_source_pin_changed'
            assert spec.get('retainedCalculationVersion') == RETAINED_CALCULATOR, 'retained_calculator_pin_changed'
            assert spec.get('insuranceSource') == INSURANCE_SOURCE, 'insurance_source_pin_changed'
            assert re.fullmatch('[a-f0-9]{64}', spec.get('calculationVersion', '')), 'candidate_calculator_not_pinned'
            assert spec['calculationVersion'] != RETAINED_CALCULATOR, 'candidate_requires_new_calculator'
            assert re.fullmatch('[a-f0-9]{64}', spec.get('encyclopediaCompatibilityDigest', '')), 'compatibility_digest_not_pinned'
            assert sorted(spec.get('requiredChecks', [])) == sorted(REQUIRED), 'required_source_checks_changed'
            assert re.fullmatch('[a-f0-9]{40}', spec['tree']), 'candidate_tree_not_pinned'
            assert type(spec['pr']) is int and spec['pr'] > 1774, 'separate_candidate_pr_required'
            paths = spec['allowedPaths']
            assert paths and len(paths) == len(set(paths)), 'candidate_path_manifest_invalid'
            assert all('..' not in p.split('/') and not p.startswith('/') for p in paths), 'candidate_path_invalid'
            assert all(p.startswith(('apps/web/app/', 'apps/web/components/', 'tests/')) or
                       p == '.github/workflows/verify-korea-reports.yml' or p in FASTPATH_RUNTIME_PATHS for p in paths), 'candidate_scope_exceeds_reviewed_fastpath'
            extra = spec.get('supplementPaths', [])
            assert extra and len(extra) == len(set(extra)) and set(extra) <= set(paths), 'candidate_supplement_paths_invalid'
            assert FASTPATH_RUNTIME_PATHS <= set(extra), 'candidate_fastpath_runtime_missing'
            assert any(p.startswith('apps/web/') for p in paths), 'candidate_app_changes_missing'
            return spec


        def verify_candidate(spec, api, health, clock=time.monotonic, pause=time.sleep, wait_seconds=1200):
            validate_spec(spec)
            sha = spec['source']
            commit = api('commits/' + sha)
            assert commit['sha'] == sha and commit['commit']['tree']['sha'] == spec['tree'], 'candidate_commit_changed'
            deadline = clock() + wait_seconds
            while True:
                pr = api('pulls/' + str(spec['pr']))
                assert pr['state'] == 'open' and pr['head']['sha'] == sha and pr['base']['sha'] == RETAINED, 'candidate_pr_changed'
                runs = api('actions/runs?head_sha=' + sha + '&per_page=100')
                assert 0 < runs['total_count'] <= 100, 'source_check_inventory_invalid'
                rows = runs['workflow_runs']
                assert len(rows) == runs['total_count'], 'source_check_inventory_incomplete'
                for row in rows:
                    assert row['head_sha'] == sha, 'source_check_identity_changed'
                    assert row['status'] != 'completed' or row['conclusion'] == 'success', 'exact_source_check_failed:' + str(row['id'])
                if REQUIRED <= {row['name'] for row in rows} and all(row['status'] == 'completed' and row['conclusion'] == 'success' for row in rows):
                    break
                assert clock() < deadline, 'source_checks_wait_deadline'
                print(json.dumps({'stage': 'waiting_exact_source_checks', 'source': sha}), flush=True)
                pause(20)
            value = health()
            assert value.get('ok') is True and value.get('releaseSha') == RETAINED, 'retained_release_changed'
            assert value.get('calculationVersion') == RETAINED_CALCULATOR, 'retained_calculator_changed'
            return {'source': sha, 'tree': spec['tree'], 'pr': spec['pr'], 'checks': len(rows),
                    'requiredChecks': sorted(REQUIRED), 'retained': RETAINED, 'calculationVersion': spec['calculationVersion']}


        def verify_local_source(spec, git, calculator):
            validate_spec(spec)
            assert git(['rev-parse', 'HEAD']) == spec['source'], 'candidate_checkout_changed'
            assert git(['rev-parse', 'HEAD^{tree}']) == spec['tree'], 'candidate_checkout_tree_changed'
            for base in (RETAINED, INSURANCE_SOURCE):
                git(['merge-base', '--is-ancestor', base, 'HEAD'])
            assert sorted(git(['diff', '--name-only', RETAINED, 'HEAD']).splitlines()) == sorted(spec['allowedPaths']), 'candidate_allowed_paths_changed'
            assert sorted(git(['diff', '--name-only', INSURANCE_SOURCE, 'HEAD']).splitlines()) == sorted(spec['supplementPaths']), 'candidate_supplement_paths_changed'
            assert calculator == spec['calculationVersion'], 'candidate_calculator_mismatch'
            records = []
            for ref in (RETAINED, spec['source']):
                rows = git(['ls-tree', '-rz', '--full-tree', ref, '--', *COMPATIBILITY_PATHS]).split('\0')
                rows = sorted(row for row in rows if row)
                assert any(row.endswith('\tapps/web/lib/encyclopedia/calculation-index.ts') for row in rows), 'encyclopedia_compatibility_tree_missing'
                records.append(rows)
            assert records[0] == records[1], 'encyclopedia_compiler_or_schema_changed'
            digest = hashlib.sha256(('avtocena-encyclopedia-content-v1\0' + '\0'.join(records[0])).encode()).hexdigest()
            assert digest == spec['encyclopediaCompatibilityDigest'], 'encyclopedia_compatibility_pin_changed'
            return {'schemaVersion': 1, 'retainedSource': RETAINED, 'source': spec['source'],
                    'calculationVersion': calculator, 'digest': digest, 'files': len(records[0]),
                    'paths': list(COMPATIBILITY_PATHS), 'unchanged': True}


        def main():
            spec = validate_spec(json.loads(os.environ['HISTORY_RELEASE_MANIFEST']))
            assert os.environ['RELEASE_SOURCE_SHA'] == spec['source'], 'controller_source_environment_changed'
            assert os.environ['GITHUB_REPOSITORY'] == 'jeep-jim/AvtoCena', 'repository_changed'
            def git(args):
