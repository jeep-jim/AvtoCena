          for (const name of ['putBinary', 'deleteJson', 'deleteBinary', 'deleteObjects', 'deletePrefix', 'abortMultipartUpload']) {
            if (typeof storage[name] === 'function') storage[name] = async () => { throw Error('staged_budget_write_forbidden'); };
          }
        }

