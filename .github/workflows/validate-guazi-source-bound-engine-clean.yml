name: Validate clean Guazi source-bound engine fix
on:
  push:
    branches: [prod/guazi-source-bound-engine-20260810]
    paths:
      - .github/workflows/validate-guazi-source-bound-engine-clean.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/guazi-source-bound-engine-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply production patch
        run: python3 scripts/apply-guazi-source-bound-engine-clean.py
      - name: Typecheck
        run: npm run typecheck
      - name: Source-bound normalization smoke
        shell: bash
        run: |
          npx tsx --eval "import { openMarketSources } from './apps/web/lib/catalog/open-market-sources.ts'; const s=openMarketSources.find(x=>x.sourceId==='guazi_china_open'); if(!s) throw new Error('guazi_missing'); const now=new Date().toISOString(); const o=s.normalizeOffer({id:'guazi-20l-smoke',title:'Toyota Camry 2022 2.0L',make:'Toyota',model:'Camry',year:2022,mileageKm:25000,price:100000,currency:'CNY',images:['https://example.com/a.jpg'],detailUrl:'https://www.guazi.com/buy/toyota-camry-20l-smoke/12345',status:'active'}); console.log(JSON.stringify({engineCc:o?.engineCc,make:o?.make,model:o?.model})); if(o?.engineCc!==2000) throw new Error('guazi_engine_cc_not_source_bound:'+o?.engineCc);"
      - name: Commit validated production file only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm -f .github/workflows/validate-guazi-source-bound-engine-clean.yml scripts/apply-guazi-source-bound-engine-clean.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/open-market-sources.ts
          git commit -m 'Use Guazi listing identity for exact engine displacement'
          git push origin HEAD:prod/guazi-source-bound-engine-20260810
