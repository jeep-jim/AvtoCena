name: Encyclopedia — audit annual specification transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/encyclopedia-spec-transfer.json']
permissions:
  contents: read
concurrency:
  group: encyclopedia-spec-transfer
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/encyclopedia-spec-consensus.test.ts tests/encyclopedia-technical-match.test.ts tests/encyclopedia-calculation-index.test.ts
      - name: Compare installed facts against all saved markets and Japanese cache
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node --import tsx scripts/encyclopedia/audit-spec-transfer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encyclopedia-spec-transfer
          path: reports/encyclopedia-spec-transfer.json
          if-no-files-found: ignore
