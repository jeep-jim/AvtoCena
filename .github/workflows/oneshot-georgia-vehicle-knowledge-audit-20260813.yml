name: One-shot Georgia vehicle knowledge audit read-only
run-name: Georgia vehicle knowledge audit · ${{ github.sha }}

on:
  push:
    branches:
      - audit/georgia-vehicle-knowledge-coverage-20260813
    paths:
      - .github/workflows/oneshot-georgia-vehicle-knowledge-audit-20260813.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit current Georgia preliminary coverage against production vehicle knowledge
        run: |
          node --import tsx --input-type=module <<'NODE'
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const knowledgeModule = await import('./apps/web/lib/catalog/vehicle-knowledge.ts');
          const knowledge = knowledgeModule.default || knowledgeModule;
          const pricingModule = await import('./apps/web/lib/catalog/customs-pricing.ts');
          const pricing = pricingModule.default || pricingModule;

          const [models, variants, offers] = await Promise.all([
            knowledge.readVehicleKnowledgeModels(),
            knowledge.readVehicleKnowledgeVariants(),
            storage.readMarketOffers('georgia'),
          ]);

          const pending = offers.filter((offer) => offer.sourceId === 'autopapa_georgia_open' && pricing.isPreliminaryPowerPendingCalculation(offer));
          const combustion = pending.filter((offer) => String(offer.powertrainKind || '') === 'combustion');
          const counters = { modelMatched: 0, variantMatched: 0, enrichPowerRecovered: 0, noModel: 0, modelNoVariant: 0 };
          const recoveredBySource = {};
          const unresolvedModels = new Map();
          const recoveredSamples = [];

          for (const offer of combustion) {
            const match = await knowledge.findVehicleModel(offer);
            if (!match) {
              counters.noModel++;
              const key = `${offer.make}|${offer.model}|${offer.engineCc || 0}|${offer.year || 0}`;
              unresolvedModels.set(key, (unresolvedModels.get(key) || 0) + 1);
              continue;
            }
            counters.modelMatched++;
            const variant = await knowledge.findVehicleVariant(match.model, offer);
            if (variant) counters.variantMatched++;
            else counters.modelNoVariant++;
            const enriched = await knowledge.enrichOfferWithVehicleKnowledge(offer);
            if (Number(enriched.powerHp || 0) > 0) {
              counters.enrichPowerRecovered++;
              const source = String(enriched.powerDataSource || 'unknown');
              recoveredBySource[source.split(':')[0]] = (recoveredBySource[source.split(':')[0]] || 0) + 1;
              if (recoveredSamples.length < 40) recoveredSamples.push({
                id: offer.sourceOfferId, make: offer.make, model: offer.model, year: offer.year, engineCc: offer.engineCc,
                oldPowerHp: offer.powerHp || null, newPowerHp: enriched.powerHp || null, powerDataSource: enriched.powerDataSource || null,
                matchedModelId: match.model.id, variantId: variant?.id || null,
              });
            }
          }

          const topUnresolved = [...unresolvedModels.entries()].sort((a,b) => b[1]-a[1]).slice(0,50).map(([key,count]) => ({ key, count }));
          console.log('KNOWLEDGE_COUNTS', JSON.stringify({ models: models.length, variants: variants.length }));
          console.log('GEORGIA_COUNTS', JSON.stringify({ total: offers.length, pending: pending.length, pendingCombustion: combustion.length }));
          console.log('MATCH_COUNTS', JSON.stringify(counters));
          console.log('RECOVERED_BY_SOURCE', JSON.stringify(recoveredBySource));
          console.log('RECOVERED_SAMPLES', JSON.stringify(recoveredSamples));
          console.log('TOP_UNRESOLVED', JSON.stringify(topUnresolved));
          NODE
