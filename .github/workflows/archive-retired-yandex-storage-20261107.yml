name: Preserve retired Yandex storage 2026-11-07
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-retired-yandex-storage-20261107.yml']
permissions:
  contents: read
concurrency:
  group: retired-yandex-storage-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check boto3==1.40.68
      - name: Validate archive is restricted to non-runtime prefix
        run: |
          python3 -m py_compile scripts/archive-retired-yandex-storage.py
          python3 - <<'PY'
          import ast, pathlib
          s=pathlib.Path('scripts/archive-retired-yandex-storage.py').read_text();tree=ast.parse(s)
          forbidden={'delete_object','delete_objects','delete_bucket','delete_bucket_policy'}
          assert not any(isinstance(n,ast.Attribute) and n.attr in forbidden for n in ast.walk(tree))
          assert "BASE='retired/yandex-20261107/'" in s
          assert "'ACL':'private'" in s and "ACL='private'" in s
          assert 'archive_readback_mismatch' in s and 'source_changed_during_archive' in s
          assert 'max_workers=4' in s
          # Test the actual streaming hash adapter without invoking credentials.
          body=[n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='HashReader']
          import hashlib,io
          env={'hashlib':hashlib};exec(compile(ast.Module(body=body,type_ignores=[]),'adapter','exec'),env)
          r=env['HashReader'](io.BytesIO(b'abc123'));assert r.read(3)==b'abc';assert r.read(10)==b'123';assert r.size==6;assert r.digest.hexdigest()==hashlib.sha256(b'abc123').hexdigest()
          print('Archive destination, no-delete surface and stream integrity checks passed')
          PY
      - name: Archive old data without overwriting current application records
        env:
          SOURCE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          SOURCE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          SOURCE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          SOURCE_ACCESS: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          SOURCE_SECRET: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          TARGET_ACCESS: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          TARGET_SECRET: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: python3 scripts/archive-retired-yandex-storage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-yandex-archive-summary
          path: legacy-archive-report/report.json
          retention-days: 14
