name: Catalog live recovery · Georgia via Yandex v2
run-name: Guarded Georgia Yandex v2 · ${{ github.sha }} · event=${{ github.event_name }} · apply=${{ inputs.apply }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Persist a new full catalog generation after the strict dry-run
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/market-runs/georgia-yandex"

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  GEORGIA_YANDEX_ROUTE: https://avtocena.com/api/internal/georgia-recovery-e2f913
  GEORGIA_YANDEX_MIN_FRESH: "1000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  RECOVERY_PUBLISH_MAX: "5000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recovery and preservation contracts
        run: |
          node --check scripts/catalog-georgia-yandex-merge.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --import tsx --test tests/catalog-georgia-yandex-v2-workflow.test.ts tests/georgia-canonical-source-policy-20260812.test.ts tests/catalog-recovery-preservation-hardening.test.ts

  strict-preflight:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require a clean seven-market baseline before Georgia collection
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-v2-preflight.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-georgia-yandex-v2-preflight
          path: catalog-georgia-yandex-v2-preflight.json
          if-no-files-found: warn
          retention-days: 3

  collect-myauto:
    needs: strict-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        startPage: [1, 21, 41, 61, 81, 101, 121, 141, 161, 181, 201, 221, 241, 261, 281]
    steps:
      - name: Fetch 20-page MyAuto shard through Yandex runtime
        shell: bash
        run: |
          set -euo pipefail
          output="snapshot-myauto-${{ matrix.startPage }}.json"
          curl --retry 7 --retry-delay 3 --retry-all-errors --connect-timeout 20 --max-time 300 -fsS \
            "${GEORGIA_YANDEX_ROUTE}?source=myauto&pages=20&startPage=${{ matrix.startPage }}" \
            -o "$output"
          node - "$output" "myauto" "${{ matrix.startPage }}" "20" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSource, expectedStart, expectedSpan] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (doc.market !== 'georgia' || !Array.isArray(doc.offers)) throw new Error('georgia_yandex_bad_snapshot');
          if (String(doc.report?.source || '') !== expectedSource) throw new Error(`georgia_yandex_source_mismatch:${doc.report?.source}:${expectedSource}`);
          if (Number(doc.report?.startPage || 0) !== Number(expectedStart)) throw new Error(`georgia_yandex_start_mismatch:${doc.report?.startPage}:${expectedStart}`);
          if (Number(doc.report?.pagesPerSource || 0) !== Number(expectedSpan)) throw new Error(`georgia_yandex_page_span_mismatch:${doc.report?.pagesPerSource}:${expectedSpan}`);
          const before = doc.offers.length;
          doc.offers = doc.offers.filter((offer) => {
            const op = offer?.operational || {};
            const raw = op.raw || {};
            const images = Array.isArray(offer?.images) ? offer.images : [];
            return offer?.market === 'georgia'
              && offer?.sourceId === 'myauto_georgia_list'
              && Number(offer?.year || 0) >= 2020
              && images.length >= 5 && images.length <= 30
              && op.photoIdentityVerified === true
              && raw.listingBoundImages === true
              && raw.recoveryExactSourceUrl === true
              && raw.recoveryExactPhotoIdentity === true;
          });
          const dropped = before - doc.offers.length;
          doc.count = doc.offers.length;
          doc.report = doc.report || {};
          doc.report.workflowDropped = dropped;
          doc.report.sourceCounts = { myauto_georgia_list: doc.offers.length, autopapa_georgia_open: 0 };
          const counts = doc.offers.map((offer) => offer.images.length);
          doc.report.imageStats = counts.length ? { min: Math.min(...counts), max: Math.max(...counts), average: Number((counts.reduce((sum, n) => sum + n, 0) / counts.length).toFixed(2)) } : { min: 0, max: 0, average: 0 };
          if (doc.offers.some((offer) => offer.images.length < 5)) throw new Error('georgia_yandex_sparse_gallery_in_snapshot');
          fs.writeFileSync(file, JSON.stringify(doc));
          console.log({ source: expectedSource, startPage: Number(expectedStart), kept: doc.offers.length, dropped, imageStats: doc.report.imageStats, rejected: doc.report?.rejected });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: georgia-yandex-v2-shard-myauto-${{ matrix.startPage }}
          path: snapshot-myauto-${{ matrix.startPage }}.json
          retention-days: 3

  collect-autopapa:
    needs: strict-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        startPage: [1, 6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86, 91, 96, 101, 106, 111, 116, 121, 126, 131, 136, 141, 146, 151, 156, 161, 166, 171, 176, 181, 186, 191, 196, 201, 206, 211, 216, 221, 226, 231, 236, 241, 246, 251, 256, 261, 266, 271, 276, 281, 286, 291, 296]
    steps:
      - name: Fetch bounded 5-page AutoPapa shard through Yandex runtime
        shell: bash
        run: |
          set -euo pipefail
          output="snapshot-autopapa-${{ matrix.startPage }}.json"
          curl --retry 7 --retry-delay 3 --retry-all-errors --connect-timeout 20 --max-time 180 -fsS \
            "${GEORGIA_YANDEX_ROUTE}?source=autopapa&pages=5&startPage=${{ matrix.startPage }}" \
            -o "$output"
          node - "$output" "autopapa" "${{ matrix.startPage }}" "5" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSource, expectedStart, expectedSpan] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (doc.market !== 'georgia' || !Array.isArray(doc.offers)) throw new Error('georgia_yandex_bad_snapshot');
          if (String(doc.report?.source || '') !== expectedSource) throw new Error(`georgia_yandex_source_mismatch:${doc.report?.source}:${expectedSource}`);
          if (Number(doc.report?.startPage || 0) !== Number(expectedStart)) throw new Error(`georgia_yandex_start_mismatch:${doc.report?.startPage}:${expectedStart}`);
          if (Number(doc.report?.pagesPerSource || 0) !== Number(expectedSpan)) throw new Error(`georgia_yandex_page_span_mismatch:${doc.report?.pagesPerSource}:${expectedSpan}`);
          const before = doc.offers.length;
          doc.offers = doc.offers.filter((offer) => {
            const op = offer?.operational || {};
            const raw = op.raw || {};
            const images = Array.isArray(offer?.images) ? offer.images : [];
            return offer?.market === 'georgia'
              && offer?.sourceId === 'autopapa_georgia_open'
              && Number(offer?.year || 0) >= 2020
              && images.length >= 5 && images.length <= 30
              && op.photoIdentityVerified === true
              && raw.listingBoundImages === true
              && raw.recoveryExactSourceUrl === true
              && raw.recoveryExactPhotoIdentity === true;
          });
          const dropped = before - doc.offers.length;
          doc.count = doc.offers.length;
          doc.report = doc.report || {};
          doc.report.workflowDropped = dropped;
          doc.report.sourceCounts = { myauto_georgia_list: 0, autopapa_georgia_open: doc.offers.length };
          const counts = doc.offers.map((offer) => offer.images.length);
          doc.report.imageStats = counts.length ? { min: Math.min(...counts), max: Math.max(...counts), average: Number((counts.reduce((sum, n) => sum + n, 0) / counts.length).toFixed(2)) } : { min: 0, max: 0, average: 0 };
          if (doc.offers.some((offer) => offer.images.length < 5)) throw new Error('georgia_yandex_sparse_gallery_in_snapshot');
          fs.writeFileSync(file, JSON.stringify(doc));
          console.log({ source: expectedSource, startPage: Number(expectedStart), kept: doc.offers.length, dropped, imageStats: doc.report.imageStats, rejected: doc.report?.rejected });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: georgia-yandex-v2-shard-autopapa-${{ matrix.startPage }}
          path: snapshot-autopapa-${{ matrix.startPage }}.json
          retention-days: 3

  merge:
    needs: [collect-myauto, collect-autopapa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: georgia-yandex-v2-shard-*
          path: georgia-yandex-v2-shards
          merge-multiple: true
      - name: Merge exact sourceOfferId shards and reject cross-listing image contamination
        env:
          GEORGIA_YANDEX_INPUT_DIR: georgia-yandex-v2-shards
          GEORGIA_YANDEX_OUTPUT: catalog-rebuild-georgia.json
          GEORGIA_YANDEX_REPORT: catalog-georgia-yandex-v2-merge-report.json
        run: node scripts/catalog-georgia-yandex-merge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-yandex-v2-recovery-georgia
          path: |
            catalog-rebuild-georgia.json
            catalog-georgia-yandex-v2-merge-report.json
          retention-days: 3

  dry-run:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-yandex-v2-recovery-georgia
          path: recovery-input
      - name: Snapshot all seven markets immediately before dry-run
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-v2-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Dry-run Georgia replacement inside the full seven-market state
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-georgia-yandex-v2-dry-run.json
          RECOVERY_BATCH_DRY_RUN: "true"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Require no Georgia shrink and exact untouched-market preservation plan
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('catalog-georgia-yandex-v2-before.json','utf8'));
          const dry = JSON.parse(fs.readFileSync('catalog-georgia-yandex-v2-dry-run.json','utf8'));
          const merged = JSON.parse(fs.readFileSync('recovery-input/catalog-georgia-yandex-v2-merge-report.json','utf8'));
          if (dry.dryRun !== true || dry.published !== false) throw new Error('georgia_yandex_v2_expected_dry_run');
          const georgia = dry.byMarket?.georgia;
          if (!georgia) throw new Error('georgia_yandex_v2_missing_dry_market');
          if (Number(merged.freshCount || 0) < 1000) throw new Error(`georgia_yandex_v2_fresh_floor:${merged.freshCount}`);
          if (Number(georgia.incomingCount || 0) < 1000) throw new Error(`georgia_yandex_v2_incoming_floor:${georgia.incomingCount}`);
          if (Number(georgia.count || 0) < Number(before.markets?.georgia?.count || 0)) throw new Error(`georgia_yandex_v2_would_shrink:${georgia.count}:${before.markets?.georgia?.count}`);
          if (Number(georgia.imageStats?.belowMinimum || 0) !== 0 || Number(georgia.imageStats?.min || 0) < 5) throw new Error('georgia_yandex_v2_dry_photo_gate');
          if (Number(georgia.maxOffersPerModelYear || 0) !== 20) throw new Error(`georgia_yandex_v2_quota_contract:${georgia.maxOffersPerModelYear}`);
          for (const source of ['myauto_georgia_list','autopapa_georgia_open']) {
            if (!(Number(georgia.sourceCounts?.[source] || 0) > 0)) throw new Error(`georgia_yandex_v2_missing_source:${source}`);
          }
          for (const market of ['korea','china','japan','uae','europe','kyrgyzstan']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const planned = Number(dry.preservedByMarket?.[market] || 0);
            if (planned !== expected) throw new Error(`georgia_yandex_v2_preservation_count:${market}:${planned}:${expected}`);
            if (!String(dry.preservedPublicHashByMarket?.[market] || '')) throw new Error(`georgia_yandex_v2_preservation_hash_missing:${market}`);
          }
          console.log({ fresh: merged.freshCount, candidate: georgia.count, incoming: georgia.incomingCount, retained: georgia.retainedCount, sourceCounts: georgia.sourceCounts, imageStats: georgia.imageStats });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-georgia-yandex-v2-dry-run
          path: |
            catalog-georgia-yandex-v2-before.json
            catalog-georgia-yandex-v2-dry-run.json
            recovery-input/catalog-georgia-yandex-v2-merge-report.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: dry-run
    if: github.event_name == 'push' || inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-yandex-v2-recovery-georgia
          path: recovery-input
      - name: Recheck strict all-seven baseline immediately before persistence
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-v2-publish-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Publish Georgia while preserving the other six public snapshots exactly
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-georgia-yandex-v2-publish.json
          RECOVERY_BATCH_DRY_RUN: "false"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Strict post-persist seven-market audit
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-yandex-v2-publish-after.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Assert Georgia quality and untouched-market counts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('catalog-georgia-yandex-v2-publish-before.json','utf8'));
          const after = JSON.parse(fs.readFileSync('catalog-georgia-yandex-v2-publish-after.json','utf8'));
          const publish = JSON.parse(fs.readFileSync('catalog-georgia-yandex-v2-publish.json','utf8'));
          if (publish.published !== true || !publish.generationId) throw new Error('georgia_yandex_v2_publish_missing_generation');
          if (Number(publish.byMarket?.georgia?.imageStats?.belowMinimum || 0) !== 0) throw new Error('georgia_yandex_v2_publish_sparse_images');
          for (const market of ['korea','china','japan','uae','europe','kyrgyzstan']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const actual = Number(after.markets?.[market]?.count || 0);
            if (actual !== expected) throw new Error(`georgia_yandex_v2_post_count:${market}:${actual}:${expected}`);
          }
          const g = after.markets?.georgia || {};
          if (Number(g.belowMarketMinYearCount || 0) !== 0) throw new Error(`georgia_yandex_v2_post_age:${g.belowMarketMinYearCount}`);
          if (Number(g.nonVehicleCount || 0) !== 0) throw new Error(`georgia_yandex_v2_post_nonvehicle:${g.nonVehicleCount}`);
          if (Number(g.belowFiveImagesCount || 0) !== 0) throw new Error(`georgia_yandex_v2_post_images:${g.belowFiveImagesCount}`);
          if (Number(g.invalidIdentityCount || 0) !== 0 || Number(g.renderedIdentityFailureCount || 0) !== 0) throw new Error('georgia_yandex_v2_post_identity');
          if (Number(g.maxPerExactModelYear || 0) > 20) throw new Error(`georgia_yandex_v2_post_quota:${g.maxPerExactModelYear}`);
          console.log({ generationId: publish.generationId, georgia: g, preservedByMarket: publish.preservedByMarket });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-georgia-yandex-v2-publish
          path: |
            catalog-georgia-yandex-v2-publish-before.json
            catalog-georgia-yandex-v2-publish.json
            catalog-georgia-yandex-v2-publish-after.json
          if-no-files-found: warn
          retention-days: 7
