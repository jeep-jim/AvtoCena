name: TEMP AutoPapa typefix

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-autopapa-typefix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/autopapa-seller-cena-authority-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix optional identity type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/lib/catalog/autopapa-georgia-source.ts')
          s=p.read_text()
          old='export function autoPapaStructuredPrimaryPriceUsd(markup: string, identity?: Pick<VehicleOffer, "make" | "model">) {'
          new='export function autoPapaStructuredPrimaryPriceUsd(markup: string, identity?: Partial<Pick<VehicleOffer, "make" | "model">>) {'
          if old not in s: raise SystemExit('signature anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify parser and typecheck
        shell: bash
        run: |
          node --import tsx --test tests/autopapa-georgia-current-parser-20260812.test.ts tests/catalog-autopapa-seller-price-authority.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Commit type fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/autopapa-georgia-source.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Allow partial AutoPapa identity in exact price parser'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
