name: Verify model search controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/browser/model-search-controls.mjs'
      - 'apps/web/components/catalog/VehicleModelSearch.tsx'
      - 'apps/web/components/catalog/CatalogFilters.tsx'
      - 'apps/web/lib/catalog/model-suggestion-search.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/model-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Desktop and mobile search controls in both themes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/model-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/model-search-controls.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-search-controls
          path: artifacts/model-controls/*.png
          retention-days: 2
