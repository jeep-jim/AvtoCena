name: Issue241 Europe Mercedes identity migration 20260814

on:
  push:
    branches: [ops/issue241-europe-mercedes-identity-migration-20260814]
    paths:
      - '.github/workflows/issue241-europe-mercedes-identity-migration-20260814.yml'

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  ISSUE241_EUROPE_MERCEDES_REPORT: issue241-europe-mercedes-identity-migration.json
  ISSUE241_EUROPE_MERCEDES_DRY_RUN: 'true'

jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/issue241-europe-mercedes-identity-migration-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate migration script
        run: node --check scripts/issue241-europe-mercedes-identity-migration.mjs
      - name: Read-only full seven-market migration dry-run
        run: node --import tsx scripts/issue241-europe-mercedes-identity-migration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-europe-mercedes-identity-migration
          path: issue241-europe-mercedes-identity-migration.json
          if-no-files-found: error
          retention-days: 3
