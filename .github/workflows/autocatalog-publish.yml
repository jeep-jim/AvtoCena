name: Publish Autocatalog JSON and licensed covers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/catalog/vehicle-encyclopedia-v2/**"
      - "scripts/autocatalog-publication-lib.mjs"
      - "scripts/publish-autocatalog.mjs"
      - ".github/workflows/autocatalog-publish.yml"

permissions:
  contents: read

concurrency:
  group: autocatalog-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      AUTOCATALOG_MAX_MEDIA_DOWNLOADS: "60"
      AUTOCATALOG_DOWNLOAD_DELAY_MS: "1250"
      AUTOCATALOG_MAX_SOURCE_BYTES: "8388608"
      AUTOCATALOG_MAX_TOTAL_SOURCE_BYTES: "262144000"
      AUTOCATALOG_MAX_OUTPUT_BYTES: "26214400"
      AUTOCATALOG_MAX_STORAGE_WRITES: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate storage configuration
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Validate publication contracts
        run: node --test tests/autocatalog-publication.test.mjs
      - name: Publish bounded Autocatalog release
        run: npm run autocatalog:publish
