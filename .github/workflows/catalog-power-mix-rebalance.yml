name: Rebalance existing public inventory to 80 percent low power
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/power-mix-rebalance.json']
permissions:
  contents: read
concurrency:
  group: catalog-six-market-quality-rebuild
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_REBALANCE_EXISTING: '1'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_INPUT_DIR: no-new-intake
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '1'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '12'
      CATALOG_INDEX_WRITE_CONCURRENCY: '8'
      CATALOG_PUBLISH_LOCK_TTL_MS: '1800000'
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: '300000'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebalance existing inventory without source collection
        shell: bash
        run: |
          failures=0
          for market in europe korea china uae georgia; do
            node --import tsx scripts/catalog-storage-preflight.mjs || exit 1
            export CATALOG_REBUILD_MARKETS="$market"
            export CATALOG_REBUILD_PUBLISH_REPORT="catalog-power-mix-$market.json"
            node --import tsx scripts/catalog-publish-market.mjs || failures=$((failures + 1))
          done
          test "$failures" -eq 0
      - name: Audit visible calculations
        if: always()
        run: node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-power-mix-reports
          path: |
            catalog-power-mix-*.json
            catalog-visible-calculation-coverage.json
          retention-days: 14
