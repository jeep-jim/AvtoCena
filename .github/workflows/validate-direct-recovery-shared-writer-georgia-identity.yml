name: Validate Georgia direct recovery safety

on:
  push:
    branches: [fix/direct-recovery-shared-writer-georgia-identity-20260811]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-recovery-shared-writer-georgia-identity-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and Georgia identity smoke
        run: |
          npm run typecheck
          node --import tsx --test tests/auto-georgia-price.test.ts
      - name: Verify manual-only shared writer serialization
        run: |
          grep -q 'group: catalog-live-daily-working-markets' .github/workflows/catalog-live-recovery-uae-georgia-direct.yml
          grep -q 'cancel-in-progress: false' .github/workflows/catalog-live-recovery-uae-georgia-direct.yml
          grep -q '^  workflow_dispatch:' .github/workflows/catalog-live-recovery-uae-georgia-direct.yml
          ! grep -q '^  push:' .github/workflows/catalog-live-recovery-uae-georgia-direct.yml
          grep -q "if: always() && needs.validate.result == 'success' && needs.collect.result != 'cancelled'" .github/workflows/catalog-live-recovery-uae-georgia-direct.yml
