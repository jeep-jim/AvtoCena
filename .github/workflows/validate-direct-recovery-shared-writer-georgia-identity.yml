name: Validate Georgia direct recovery safety

on:
  push:
    branches: [fix/direct-recovery-shared-writer-georgia-identity-20260811]

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-recovery-shared-writer-georgia-identity-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and Georgia identity smoke
        run: |
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          node --import tsx --test tests/auto-georgia-price.test.ts
      - name: Verify manual-only shared writer and all-seven guards
        run: |
          f=.github/workflows/catalog-live-recovery-uae-georgia-direct.yml
          grep -q 'group: catalog-live-daily-working-markets' "$f"
          grep -q 'cancel-in-progress: false' "$f"
          grep -q '^  workflow_dispatch:' "$f"
          ! grep -q '^  push:' "$f"
          grep -q "if: always() && needs.validate.result == 'success' && needs.collect.result != 'cancelled'" "$f"
          grep -q 'Snapshot all seven markets before batch write' "$f"
          grep -q 'Audit all seven markets after batch write' "$f"
          grep -q 'cross_market_loss' "$f"
          grep -q "\['korea','china','japan','europe','kyrgyzstan'\]" "$f"
          grep -q 'maxPerExactModel' "$f"
          grep -q 'nonVehicleCount' "$f"
      - name: Collect Georgia exact source without publishing
        env:
          RECOVERY_DIRECT_MARKET: georgia
          RECOVERY_OUTPUT: catalog-rebuild-georgia.json
          RECOVERY_TARGET: "160"
          RECOVERY_MAX_PAGES: "55"
          RECOVERY_TIME_LIMIT_MS: "360000"
        run: npx tsx scripts/catalog-live-recovery-direct-exact.mjs
      - name: Dry-run batch selection and preserve preliminary EV HEV
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: batch-dry-run.json
          RECOVERY_BATCH_DRY_RUN: "true"
          RECOVERY_PUBLISH_MAX: "3000"
        run: |
          mkdir -p recovery-input
          cp catalog-rebuild-georgia.json recovery-input/catalog-rebuild-georgia.json
          npx tsx scripts/catalog-live-recovery-publish-batch.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const source=JSON.parse(fs.readFileSync('catalog-rebuild-georgia.json','utf8'));
          const report=JSON.parse(fs.readFileSync('batch-dry-run.json','utf8'));
          const rows=source.offers||[];
          const badImages=rows.filter(o=>!(o.images||[]).length || !(o.images||[]).every(img=>String(img.url||'').toLowerCase().includes(`/ad${String(o.operational?.raw?.id||'').toLowerCase()}/`)));
          if (badImages.length) throw new Error(`gallery_identity_mismatch:${badImages.length}`);
          const srcPre=rows.filter(o=>o.calculationStatus==='preliminary_power_pending').length;
          const selectedPre=Number(report.byMarket?.georgia?.preliminaryCount||0);
          if (!(srcPre>0)) throw new Error('source_preliminary_missing');
          if (!(selectedPre>0)) throw new Error(`batch_dropped_preliminary:${srcPre}->${selectedPre}`);
          if (!report.dryRun || report.published) throw new Error('dry_run_persist_guard_failed');
          if (Number(report.byMarket?.georgia?.count||0)<=0) throw new Error('empty_georgia_selection');
          console.log({source:rows.length,srcPre,selected:report.byMarket.georgia.count,selectedPre,badImages:badImages.length});
          NODE
