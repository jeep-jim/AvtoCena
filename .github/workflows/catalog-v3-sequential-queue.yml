name: Catalog V3 · Sequential production queue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/catalog-v3-run-all"
  # Production collection is intentionally paused while the five-market
  # identity/specification pipeline is being repaired. Re-enabling automation
  # requires a separate reviewed change; workflow_dispatch remains available
  # but the preflight refuses collection while the central writer freeze is on.
  # Resume cadence after acceptance: weekly (Sunday 20:17 UTC), five markets.
  # Japan is excluded; non-Japan retention is fourteen days.

permissions:
  contents: read

concurrency:
  group: catalog-v3-sequential-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refuse a production crawl while publication is paused
        run: |
          node --import tsx --input-type=module -e '
            const { CATALOG_PRODUCTION_WRITES_PAUSED } = await import("./apps/web/lib/catalog/storage.ts");
            if (CATALOG_PRODUCTION_WRITES_PAUSED) {
              console.error("Production refresh is paused. Run catalog-five-market-restart-check-branch.yml for fresh diagnostics.");
              process.exit(1);
            }
          '

  korea:
    needs: plan
    if: needs.plan.result == 'success'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: korea
      display_name: Корея
      retention_ms: "1209600000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  china:
    needs: [plan, korea]
    if: always() && needs.plan.result == 'success'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: china
      display_name: Китай
      retention_ms: "1209600000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  uae:
    needs: [plan, china]
    if: always() && needs.plan.result == 'success'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
      retention_ms: "1209600000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  europe:
    needs: [plan, uae]
    if: always() && needs.plan.result == 'success'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
      retention_ms: "1209600000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  georgia:
    needs: [plan, europe]
    if: always() && needs.plan.result == 'success'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
      retention_ms: "1209600000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit
