name: Catalog V3 · Sequential production queue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/catalog-v3-run-all"
  schedule:
    # 04:17 in the product timezone (+07). Japan joins on local days 1/8/15/22.
    - cron: "17 21 * * *"

permissions:
  contents: read

concurrency:
  group: catalog-v3-sequential-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_japan: ${{ steps.plan.outputs.run_japan }}
    steps:
      - id: plan
        shell: bash
        run: |
          local_day="$(TZ=Asia/Bangkok date +%d)"
          case "$local_day" in
            01|08|15|22) run_japan=true ;;
            *) run_japan=false ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then run_japan=true; fi
          echo "run_japan=$run_japan" >> "$GITHUB_OUTPUT"
          echo "Local day: $local_day; Japan: $run_japan" >> "$GITHUB_STEP_SUMMARY"

  japan:
    needs: plan
    if: needs.plan.outputs.run_japan == 'true'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      retention_ms: "2592000000"
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
      priority_target: "24000"
      page_partition_count: "5"
      # Weekly automation must continue from persisted source cursors so the
      # 30-day Japan inventory expands instead of re-reading the first pages.
      reset_cursor: false
    secrets: inherit

  korea:
    needs: [plan, japan]
    if: always() && needs.plan.result == 'success'
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: korea
      display_name: Корея
      retention_ms: "259200000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  china:
    needs: korea
    if: always()
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: china
      display_name: Китай
      retention_ms: "259200000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  uae:
    needs: china
    if: always()
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
      retention_ms: "259200000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  europe:
    needs: uae
    if: always()
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
      retention_ms: "259200000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  georgia:
    needs: europe
    if: always()
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
      retention_ms: "259200000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit

  kyrgyzstan:
    needs: georgia
    if: always()
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
      retention_ms: "259200000"
      target_per_source: "10000"
      target_per_market: "10000"
      maximum_per_market: "10000"
      priority_target: "8000"
      reset_cursor: false
    secrets: inherit
