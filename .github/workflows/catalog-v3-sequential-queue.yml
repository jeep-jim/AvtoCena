name: Catalog V3 · Sequential queue

on:
  workflow_run:
    workflows:
      - Catalog V3 · Korea · 10k
      - Catalog V3 · Japan · 10k
      - Catalog V3 · China · 10k
      - Catalog V3 · UAE · 10k
      - Catalog V3 · Europe · 10k
      - Catalog V3 · Georgia · 10k
      - Catalog V3 · Kyrgyzstan · 10k
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-v3-sequential-queue
  cancel-in-progress: false

jobs:
  dispatch-next:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next market only
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ github.event.workflow_run.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$CURRENT" in
            "Catalog V3 · Korea · 10k") NEXT="catalog-v2-japan.yml" ;;
            "Catalog V3 · Japan · 10k") NEXT="catalog-v2-china.yml" ;;
            "Catalog V3 · China · 10k") NEXT="catalog-v2-uae.yml" ;;
            "Catalog V3 · UAE · 10k") NEXT="catalog-v2-europe.yml" ;;
            "Catalog V3 · Europe · 10k") NEXT="catalog-v2-georgia.yml" ;;
            "Catalog V3 · Georgia · 10k") NEXT="catalog-v2-kyrgyzstan.yml" ;;
            "Catalog V3 · Kyrgyzstan · 10k") echo "All seven markets completed"; exit 0 ;;
            *) echo "Unknown completed workflow: $CURRENT"; exit 1 ;;
          esac
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/$NEXT/dispatches" \
            -d '{"ref":"main"}'
          echo "Queued $NEXT after successful $CURRENT" >> "$GITHUB_STEP_SUMMARY"
