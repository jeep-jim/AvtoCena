name: Catalog stitch · restore verified preserved markets
run-name: Restore verified preserved markets · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-stitch-preserved-markets.yml"
      - "scripts/catalog-stitch-verified-markets.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-stitch-preserved-markets
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate stitch script
        run: node --check scripts/catalog-stitch-verified-markets.mjs
      - name: Restore China and Georgia from the last verified generation without touching other markets
        env:
          CATALOG_STITCH_SOURCE_GENERATION: gen_1786208862324_bceac3d7
          CATALOG_STITCH_MARKETS: china,georgia
          CATALOG_STITCH_EXPECTED_COUNTS: china=812,georgia=6
        run: npx tsx scripts/catalog-stitch-verified-markets.mjs
