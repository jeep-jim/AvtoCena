name: Ops · Issue241 current Europe final audit 20260814

on:
  push:
    branches:
      - audit/issue241-europe-current-final-20260814
    paths:
      - ".github/workflows/ops-issue241-europe-current-final-audit-20260814.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue241-europe-current-final-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Current public/internal Europe + AutoScout audit
        run: npx tsx scripts/oneshot-issue241-europe-current-final-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-europe-current-final-audit
          path: issue241-europe-current-final-audit.json
          if-no-files-found: warn
          retention-days: 5
