name: Catalog speed ready-data verification 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-speed-ready-verify-20261107.yml']
permissions:
  contents: write
concurrency:
  group: catalog-speed-ready-verify-20261107
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-speed-ready-metadata-20261107
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preparation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Inspect instructions and apply exact bounded patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6e18f0249814c8ffb6c0b2ccc7065cae4943d69b
          tail -n 40 AGENTS.md
          mkdir -p speed-ready-evidence
          tail -n 200 roadmap.md > speed-ready-evidence/roadmap-before.md
          python3 preparation/.github/patches/catalog-speed-ready-20261107.py
          python3 preparation/.github/patches/catalog-speed-ready-tests-20261107.py
          git diff --check
      - run: npm ci
      - name: Web and engine typecheck
        run: npm run typecheck > speed-ready-evidence/typecheck.log 2>&1 || { cat speed-ready-evidence/typecheck.log; exit 1; }
      - name: Queue, cache, source-link, filter and model regressions
        run: |
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/ajes-ready-metadata.test.ts tests/ajes-prepared-admission.test.ts tests/ajes-queue-fallback.test.ts tests/ajes-model-recovery.test.ts tests/ajes-stock-feed.test.ts tests/ajes-detail-queue-recovery.test.ts tests/ajes-recovery-isolation.test.ts tests/ajes-count-display.test.ts tests/catalog-filter-facets-wire.test.ts tests/catalog-japan-filter-rail.test.ts tests/model-suggestion-search.test.ts tests/ajes-model-loader.test.ts > speed-ready-evidence/targeted.log 2>&1 || { tail -n 120 speed-ready-evidence/targeted.log; exit 1; }
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build > speed-ready-evidence/build.log 2>&1 || { tail -n 120 speed-ready-evidence/build.log; exit 1; }
      - name: Browser model-picker and sidebar regression
        run: |
          npm install --prefix /tmp/speed-ready-browser --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.56.1
          PLAYWRIGHT_MODULE=/tmp/speed-ready-browser/node_modules/playwright/index.mjs CHROME_BIN=$(command -v google-chrome) node tests/browser/catalog-sidebar-check.mjs > speed-ready-evidence/sidebar.log 2>&1 || { tail -n 100 speed-ready-evidence/sidebar.log; exit 1; }
      - name: Commit verified preflight candidate for standard full PR CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          note='''

          ## 07.11.2026 — ускорение готовых данных без изменения расчётов и источников

          Владелец подтвердил исправление дилерского «Зелёного угла» и поручил продолжить скорость. Прочитаны AGENTS и актуальный конец roadmap. Выпуск 393/42367668990 и внешний браузер 42367789665 завершились SUCCESS. Прочитаны оба JSON artifact13573666770: installed a5f9a645, первый переход к аукционам8.486с, следующие0.886/1.183с; разные контексты, не статистическая гарантия. /cars:198логотипов/42карточки/875982байта распакованного HTML; Китай133/24/504477байт.

          Диагностика42371868730/artifact13573624398 выполнила10последовательных публичных API-запросов без нагрузочного теста, записи или обхода поставщика. Release a5f9a645 до/после совпал. Japan Nissan query-resolution152.4/1063.3мс, ответы stale. Korea unfiltered total1091.7/147.5мс; detail-cache-sum5412.1/2.9мс — сумма параллельных операций, не wall time. China<=160: read707.2/0.1мс, pricing11.2/7.5мс. Быстрая пустая Korea<=160 не является исправлением мощности.

          Изменение1: точные свежие сохранённые makes/models/colors/count используют существующую bounded prepared-очередь независимо от двух supplier slots; 30-минутный observedAt deadline не продлевается. Повторная stale-выдача того же IP во время существующего cooldown читает существующий30-секундный visitor cache до повторного I/O. Shared fresh имеет приоритет. Source/password/IP checks сохранены; детали и LOT provenance не затрагиваются. Concurrency, retention, cooldown и квоты не увеличены.

          Изменение2: обычный CatalogContent не отправляет неиспользуемую копию facets.models через client boundary. CatalogFilters уже игнорировал её; полный model-picker сохраняет прежнюю загрузку справочника при открытии. Source-only Green/AJES модели/aliases/КПП и остальные facets сохранены. Это удаление лишней копии, не удаление моделей. Синтетическая экономия не выдаётся за измеренное ускорение production.

          Проверки: локально36адресных тестов; negative-control прежнего AJES выявил9/11новых сценариев. Первый полный runner42372518522 остановился на двух fixtures, отвергавших одновременно supplier и новую prepared очередь. В fixtures теперь отказывает только supplier admission; stale-сценарий использует часовую запись, все проверки stale/expiry/page/source-switch сохранены. Повторный42373293056 прошёл2830/2830полных тестов, но typecheck выявил недостижимую non-detail ветку TS2339. Эта ветка удалена: !inspectPrepared теперь однозначно detail. Никакая выполняемая ветка не удалена.

          Preflight RUN_ID прошёл typecheck, адресные тесты, production build и браузерный sidebar/model-picker после исправления типов. Полный npm test на окончательном SHA должен пройти стандартный PR CI; старый успех не переносится автоматически. Runtime ещё НЕ установлен этим документом. Формулы, цены, комиссии, источник, ограничения, объявления, ручные данные, энциклопедия, роли и дилерская вёрстка не изменяются.

          Остаются полнота<=160Korea/Japan и счётчики, per-card Korea detail I/O, intermittent/cars, полный SEO/VPN/performance контроль. Один выпуск после зелёного стандартного CI, затем exact-release readback и замеры корректных видимых карточек, первого/повторного перехода и объёма ответа. Не включать общий кеш авторизованного HTML и не подставлять неизвестную мощность.
          '''
          note='\n'.join(x[10:] if x.startswith('          ') else x for x in note.splitlines()).replace('RUN_ID',os.environ['GITHUB_RUN_ID'])+'\n'
          p=Path('roadmap.md');before=p.read_bytes();p.write_bytes(before+note.encode());assert p.read_bytes().startswith(before)
          Path('docs/operations/2026-11-07-catalog-speed-ready.md').write_text(note.lstrip())
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/lib/catalog/ajes-client.ts apps/web/lib/catalog/filter-facets-wire.ts apps/web/components/catalog/CatalogContent.tsx tests/ajes-ready-metadata.test.ts tests/ajes-model-recovery.test.ts tests/catalog-filter-facets-wire.test.ts docs/operations/2026-11-07-catalog-speed-ready.md roadmap.md
          git diff --cached --stat
          git commit -m 'perf: serve ready catalog metadata without supplier queue and trim unused model payload'
          git push origin HEAD:fix/catalog-speed-ready-metadata-20261107
          git rev-parse HEAD > speed-ready-evidence/verified-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-speed-ready-verification
          path: |
            speed-ready-evidence
            artifacts/mobile-filter-local-chromium
          retention-days: 7
