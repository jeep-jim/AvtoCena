name: K Car ordinary list and detail validation
on:
  workflow_dispatch:
  push:
    branches: [fix/launch-final-audit-20260920]
    paths: [.github/workflows/kcar-list-validation.yml]
permissions:
  contents: read
concurrency:
  group: catalog-kcar-registry-recovery
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_KCAR_REQUEST_RPM: '60'
      CATALOG_READ_CONCURRENCY: '4'
      AUDIT_SKIP_SOURCE_SAMPLES: '1'
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Check source pages of older cars without sheets
        run: node --import tsx scripts/catalog-kcar-list-validation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcar-list-validation
          retention-days: 14
          path: |
            kcar-list-validation.json
