name: Observe exact Japan release 46051339049 accepted pair - read only
on:
  push:
    branches: [main]
    paths: [.github/market-runs/japan-accepted-pair-46051339049-readonly.json]
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        description: Exact reviewed main controller SHA for this read-only observation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: regcloud-staging
    env:
      EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify exact invocation and read-only refusal cases before credentials
        run: |
          set -euo pipefail
          node scripts/catalog-next/observe-japan-accepted-pair-46051339049.mjs --verify
          node --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/catalog-next-japan-accepted-pair-readonly.test.mjs tests/readonly-marker-invocation.test.mjs
      - name: Read only the exact accepted current and rollback references
        env:
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalog-next/observe-japan-accepted-pair-46051339049.mjs --observe
      - name: Preserve only sanitized accepted-pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-accepted-pair-46051339049-readonly
          path: japan-accepted-pair-46051339049-readonly-report.json
          if-no-files-found: ignore
          retention-days: 14
