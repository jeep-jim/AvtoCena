name: Catalog Japan strict merge publish
run-name: Japan strict merge publish · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Verified exact-frame recovery workflow run ID"
        required: true

permissions:
  actions: read
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download verified Japan exact-frame recovery artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf recovery-input
          mkdir -p recovery-input
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name catalog-japan-exact-frame-recovery \
            --dir recovery-input
          test -s recovery-input/catalog-rebuild-japan-exact-frame.json
      - name: Merge with currently verified sold Japan rows, reapply strict model-year diversity, publish atomically
        env:
          JAPAN_STRICT_MERGE_INPUT: recovery-input/catalog-rebuild-japan-exact-frame.json
          JAPAN_STRICT_MERGE_REPORT: catalog-japan-strict-merge-publish-report.json
          JAPAN_STRICT_MIN_PUBLISH_COUNT: "193"
          CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-japan-strict-merge-publish.mjs
      - name: Audit all six markets after strict publish
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-strict-merge-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-japan-strict-merge-publish-report
          path: |
            catalog-japan-strict-merge-publish-report.json
            catalog-japan-strict-merge-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
