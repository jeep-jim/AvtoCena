name: Europe AutoScout HQ galleries safe run 20260814

on:
  push:
    branches:
      - ops/europe-autoscout-hq-20260814
    paths:
      - '.github/workflows/ui-home-finance-pixel-match-20260813.yml'
      - 'scripts/europe-autoscout-hq-refresh-once.ts'

permissions:
  contents: read

concurrency:
  group: europe-autoscout-hq-safe-run-20260814
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  EUROPE_HQ_MAX_TARGETS: '500'
  EUROPE_HQ_CONCURRENCY: '3'
  CATALOG_GALLERY_REPORT_FILE: europe-autoscout-hq-refresh-report.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate AutoScout listing-bound HQ parser, image gates, and model-year quota
        run: node --import tsx --test tests/catalog-autoscout-hq-gallery.test.ts tests/catalog-image-quality.test.ts tests/catalog-model-year-inventory-quota.test.ts
      - name: Refresh only current Europe AutoScout galleries with rollback guards
        run: npx tsx scripts/europe-autoscout-hq-refresh-once.ts
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-autoscout-hq-refresh-report
          path: europe-autoscout-hq-refresh-report.json
          if-no-files-found: ignore
          retention-days: 7
