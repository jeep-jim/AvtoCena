name: UI home finance pixel match 20260813

on:
  push:
    branches:
      - ui/home-finance-pixel-match-20260813

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/home-finance-pixel-match-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact supplied PNG assets
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/home
          curl -fsSL --retry 3 --retry-delay 2 'https://filebin.net/avtocena-assets-20260813-9e7b4c2a1d/credit-mascot.png' -o apps/web/public/home/credit-mascot.png
          curl -fsSL --retry 3 --retry-delay 2 'https://filebin.net/avtocena-assets-20260813-9e7b4c2a1d/osago-mascot.png' -o apps/web/public/home/osago-mascot.png
          echo '7d7a8da384a7d8f8374f46030374b91e841ca621ff8a7c1c2ce6b82be7e58772  apps/web/public/home/credit-mascot.png' | sha256sum -c -
          echo '1f6042dad23b094ab9ba0348ce4cc86ba5b4cd3c8d6c723d77909563dc527666  apps/web/public/home/osago-mascot.png' | sha256sum -c -
          rm -f apps/web/public/home/credit-mascot.webp apps/web/public/home/osago-mascot.webp

      - name: Match mobile budget and desktop finance layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/home/HomePageClient.tsx')
          text = path.read_text()

          old_sig = 'function HomeSelect({ value, options, onChange, searchable = false, searchPlaceholder = "Поиск" }: { value: string; options: Option[]; onChange: (value: string) => void; searchable?: boolean; searchPlaceholder?: string }) {'
          new_sig = 'function HomeSelect({ value, options, onChange, searchable = false, searchPlaceholder = "Поиск", emptyLabel = "" }: { value: string; options: Option[]; onChange: (value: string) => void; searchable?: boolean; searchPlaceholder?: string; emptyLabel?: string }) {'
          if text.count(old_sig) != 1:
              raise SystemExit(f'HomeSelect signature anchor count={text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)

          old_label = '<span className="min-w-0 truncate">{active?.label}</span><Chevron open={open} />'
          new_label = '<span className="min-w-0 truncate">{!value && emptyLabel ? emptyLabel : active?.label}</span><Chevron open={open} />'
          if text.count(old_label) != 1:
              raise SystemExit(f'HomeSelect label anchor count={text.count(old_label)}')
          text = text.replace(old_label, new_label, 1)

          old_top = '<div className="ac-budget-select hidden w-full min-w-0 max-w-none lg:block"><HomeSelect value={budget} options={budgets} onChange={setBudget} /></div>'
          new_top = '<div className="ac-budget-desktop hidden w-full min-w-0 max-w-none lg:block"><HomeSelect value={budget} options={budgets} onChange={setBudget} /></div>'
          if text.count(old_top) != 1:
              raise SystemExit(f'desktop budget anchor count={text.count(old_top)}')
          text = text.replace(old_top, new_top, 1)

          old_mobile = '<div className="ac-budget-mobile min-w-0"><HomeSelect value={budget} options={budgets} onChange={setBudget} /></div>'
          new_mobile = '<div className="ac-budget-mobile min-w-0"><HomeSelect value={budget} options={budgets} onChange={setBudget} emptyLabel="Бюджет" /></div>'
          if text.count(old_mobile) != 1:
              raise SystemExit(f'mobile budget anchor count={text.count(old_mobile)}')
          text = text.replace(old_mobile, new_mobile, 1)

          start_token = '        <section className="grid min-h-[176px] grid-cols-2 gap-4" aria-label="Финансовые сервисы">'
          end_token = '        </section>\n        <CurrencyRatesStrip rates={rates} variant="desktop" className="hidden lg:block" />'
          start = text.find(start_token)
          end_anchor = text.find(end_token, start)
          if start < 0 or end_anchor < 0:
              raise SystemExit(f'finance anchors not found start={start} end={end_anchor}')
          end = end_anchor + len('        </section>')

          finance = '''        <section className="grid min-h-[206px] grid-cols-2 gap-4" aria-label="Финансовые сервисы">
          <article className="ac-executor-block relative min-h-[206px] overflow-hidden rounded-[1.6rem] px-6 py-6">
            <div className="relative z-10 h-full min-h-[158px] pr-[205px]">
              <div className="flex items-start gap-7">
                <div className="flex h-[46px] w-[46px] shrink-0 items-center justify-center text-[#35c932]" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 48 48" fill="none"><rect x="7" y="5" width="34" height="38" rx="4" stroke="currentColor" strokeWidth="3.5"/><path d="M14 13h20M15 23h6M18 20v6M28 20l6 6M34 20l-6 6M15 34h6M28 34h6" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/></svg></div>
                <h3 className="min-w-0 pt-0.5 text-[23px] font-black leading-[1.08] text-[var(--ac-text)]">Кредитный<br />калькулятор</h3>
              </div>
              <p className="mt-8 max-w-[345px] text-[15px] font-medium leading-[1.45] text-[var(--ac-muted)]">Рассчитайте платёж и подберите<br className="hidden xl:block" /> удобные условия покупки автомобиля.</p>
            </div>
            <img src="/home/credit-mascot.png" alt="" className="pointer-events-none absolute bottom-[-2px] right-4 h-[190px] w-[190px] object-contain object-bottom xl:right-5 xl:h-[198px] xl:w-[198px]" aria-hidden="true" />
          </article>
          <article className="ac-executor-block relative min-h-[206px] overflow-hidden rounded-[1.6rem] px-6 py-6">
            <div className="relative z-10 h-full min-h-[158px] pr-[215px]">
              <div className="flex items-start gap-7">
                <div className="flex h-[46px] w-[46px] shrink-0 items-center justify-center text-[#ffd21f]" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 48 48" fill="none"><path d="M24 5 38 10v10.5c0 9-5.7 16.4-14 20.5-8.3-4.1-14-11.5-14-20.5V10l14-5Z" stroke="currentColor" strokeWidth="3.5" strokeLinejoin="round"/><path d="m17 23 5 5 10-10" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
                <h3 className="min-w-0 pt-0.5 text-[23px] font-black leading-[1.08] text-[var(--ac-text)]">Страховой полис<br />ОСАГО</h3>
              </div>
              <p className="mt-8 max-w-[345px] text-[15px] font-medium leading-[1.45] text-[var(--ac-muted)]">Быстрый расчёт стоимости полиса<br className="hidden xl:block" /> для выбранного автомобиля.</p>
            </div>
            <img src="/home/osago-mascot.png" alt="" className="pointer-events-none absolute bottom-[-3px] right-2 h-[202px] w-[202px] object-contain object-bottom xl:right-3 xl:h-[210px] xl:w-[210px]" aria-hidden="true" />
          </article>
        </section>'''
          text = text[:start] + finance + text[end:]

          css_old = '@media(max-width:1023px){.ac-home-page .ac-budget-select,.ac-home-page .ac-budget-select>div,.ac-home-page .ac-budget-select .ac-filter-control{width:100%!important;max-width:none!important;min-width:0!important}.ac-home-page .ac-budget-mobile'
          css_new = '@media(max-width:1023px){.ac-home-page .ac-budget-desktop{display:none!important}.ac-home-page .ac-budget-mobile'
          if text.count(css_old) != 1:
              raise SystemExit(f'budget css anchor count={text.count(css_old)}')
          text = text.replace(css_old, css_new, 1)

          required = [
              'emptyLabel="Бюджет"',
              '.ac-budget-desktop{display:none!important}',
              '/home/credit-mascot.png',
              '/home/osago-mascot.png',
              'h-[46px] w-[46px]',
              'min-h-[206px]',
              'bottom:calc(100% + 7px)!important',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing token: {token}')
          if '/home/credit-mascot.webp' in text or '/home/osago-mascot.webp' in text:
              raise SystemExit('lossy finance assets still referenced')

          path.write_text(text)
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

      - name: Commit UI-only changes and exact assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/home/HomePageClient.tsx apps/web/public/home/credit-mascot.png apps/web/public/home/osago-mascot.png apps/web/public/home/credit-mascot.webp apps/web/public/home/osago-mascot.webp
          git diff --cached --quiet && exit 1
          git commit -m "Pixel-match finance cards and keep supplied PNGs lossless"
          git push origin HEAD:ui/home-finance-pixel-match-20260813
