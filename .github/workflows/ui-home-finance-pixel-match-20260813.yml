name: Restore exact finance mascot assets once

on:
  push:
    branches:
      - fix/finance-originals-offer-mobile-20260813
    paths:
      - '.mascot-upload/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-originals-offer-mobile-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rebuild exact supplied PNG assets
        shell: bash
        run: |
          set -euo pipefail
          cat .mascot-upload/credit_*.txt | tr -d '\n\r ' | base64 -d > apps/web/public/home/credit-mascot.png
          cat .mascot-upload/osago_*.txt | tr -d '\n\r ' | base64 -d > apps/web/public/home/osago-mascot.png
          echo '3393c48834755d30b41e05ee890d5d6f24a5affa4d59aac6129020938ba1f28b  apps/web/public/home/credit-mascot.png' | sha256sum -c -
          echo '7e9e9f4a63e4b34c96f3fe8db776bdf418b22e7e165839513204078f6f462bc7  apps/web/public/home/osago-mascot.png' | sha256sum -c -
          rm -f apps/web/public/home/credit-mascot.webp apps/web/public/home/osago-mascot.webp

      - name: Keep both finance cards clipped and use PNG originals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('apps/web/components/home/HomePageClient.tsx'),
              Path('apps/web/components/catalog/OfferFinanceCards.tsx'),
          ]
          for path in files:
              text = path.read_text()
              text = text.replace(
                  'ac-executor-block relative min-h-[206px] overflow-hidden rounded-[1.6rem] px-6 py-6',
                  'ac-finance-card relative min-h-[206px] overflow-hidden rounded-[1.6rem] bg-[var(--ac-surface)] px-6 py-6',
              )
              text = text.replace('/home/credit-mascot.webp', '/home/credit-mascot.png')
              text = text.replace('/home/osago-mascot.webp', '/home/osago-mascot.png')
              text = text.replace('absolute bottom-[-2px] right-3', 'absolute bottom-0 right-3')
              text = text.replace('absolute bottom-[-3px] right-1', 'absolute bottom-0 right-1')
              text = text.replace('absolute bottom-[-2px] right-4', 'absolute bottom-0 right-4')
              text = text.replace('absolute bottom-[-3px] right-2', 'absolute bottom-0 right-2')
              path.write_text(text)

          home = Path('apps/web/components/home/HomePageClient.tsx').read_text()
          if '<div className="hidden w-full min-w-0 max-w-none lg:block"><HomeSelect value={budget}' not in home:
              raise SystemExit('desktop-only top budget selector guard missing')
          if 'emptyLabel="Бюджет"' not in home:
              raise SystemExit('mobile bottom budget label missing')
          for token in ['/home/credit-mascot.png', '/home/osago-mascot.png', 'ac-finance-card']:
              if token not in home:
                  raise SystemExit(f'homepage missing {token}')

          offer = Path('apps/web/components/catalog/OfferFinanceCards.tsx').read_text()
          for token in ['/home/credit-mascot.png', '/home/osago-mascot.png', 'overflow-hidden', 'bottom-0']:
              if token not in offer:
                  raise SystemExit(f'offer finance cards missing {token}')
          PY

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

      - name: Commit verified UI-only result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mascot-upload
          git fetch origin main
          git checkout origin/main -- .github/workflows/ui-home-finance-pixel-match-20260813.yml .github/workflows/apply-buyer-gallery-fullres-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/home/HomePageClient.tsx apps/web/components/catalog/OfferFinanceCards.tsx apps/web/public/home/credit-mascot.png apps/web/public/home/osago-mascot.png .github/workflows/ui-home-finance-pixel-match-20260813.yml .github/workflows/apply-buyer-gallery-fullres-once.yml
          git add -u apps/web/public/home .mascot-upload || true
          git commit -m 'Use original finance mascots and clip cards'
          git push origin HEAD:fix/finance-originals-offer-mobile-20260813
