name: Restore full resolution finance mascot assets once

on:
  push:
    branches:
      - fix/finance-originals-offer-mobile-20260813
    paths:
      - '.mascot-upload/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-originals-offer-mobile-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install supplied full-resolution PNG assets without lossy conversion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/home
          curl -fsSL --retry 3 --retry-delay 2 'https://filebin.net/avtocena-assets-20260813-9e7b4c2a1d/credit-mascot.png' -o apps/web/public/home/credit-mascot.png
          curl -fsSL --retry 3 --retry-delay 2 'https://filebin.net/avtocena-assets-20260813-9e7b4c2a1d/osago-mascot.png' -o apps/web/public/home/osago-mascot.png
          echo '7d7a8da384a7d8f8374f46030374b91e841ca621ff8a7c1c2ce6b82be7e58772  apps/web/public/home/credit-mascot.png' | sha256sum -c -
          echo '1f6042dad23b094ab9ba0348ce4cc86ba5b4cd3c8d6c723d77909563dc527666  apps/web/public/home/osago-mascot.png' | sha256sum -c -
          file apps/web/public/home/credit-mascot.png apps/web/public/home/osago-mascot.png
          rm -f apps/web/public/home/credit-mascot.webp apps/web/public/home/osago-mascot.webp

      - name: Fix finance card clipping and asset references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ['apps/web/components/home/HomePageClient.tsx', 'apps/web/components/catalog/OfferFinanceCards.tsx']:
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  'ac-executor-block relative min-h-[206px] overflow-hidden rounded-[1.6rem] px-6 py-6',
                  'ac-finance-card relative min-h-[206px] overflow-hidden rounded-[1.6rem] bg-[var(--ac-surface)] px-6 py-6',
              )
              text = text.replace('/home/credit-mascot.webp', '/home/credit-mascot.png')
              text = text.replace('/home/osago-mascot.webp', '/home/osago-mascot.png')
              text = text.replace('bottom-[-2px]', 'bottom-0')
              text = text.replace('bottom-[-3px]', 'bottom-0')
              path.write_text(text)

          home = Path('apps/web/components/home/HomePageClient.tsx').read_text()
          required_home = [
              'hidden w-full min-w-0 max-w-none lg:block',
              'emptyLabel="Бюджет"',
              '/home/credit-mascot.png',
              '/home/osago-mascot.png',
              'ac-finance-card',
              'overflow-hidden',
              'bottom-0',
          ]
          for token in required_home:
              if token not in home:
                  raise SystemExit(f'homepage missing required token: {token}')

          offer = Path('apps/web/components/catalog/OfferFinanceCards.tsx').read_text()
          for token in ['/home/credit-mascot.png', '/home/osago-mascot.png', 'ac-finance-card', 'overflow-hidden', 'bottom-0']:
              if token not in offer:
                  raise SystemExit(f'offer finance cards missing required token: {token}')
          PY

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

      - name: Commit verified UI-only result and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mascot-upload
          git fetch origin main
          git checkout origin/main -- .github/workflows/ui-home-finance-pixel-match-20260813.yml .github/workflows/apply-buyer-gallery-fullres-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/home/HomePageClient.tsx apps/web/components/catalog/OfferFinanceCards.tsx apps/web/public/home/credit-mascot.png apps/web/public/home/osago-mascot.png .github/workflows/ui-home-finance-pixel-match-20260813.yml .github/workflows/apply-buyer-gallery-fullres-once.yml
          git add -u apps/web/public/home .mascot-upload || true
          git commit -m 'Use full resolution finance mascots and clip cards'
          git push origin HEAD:fix/finance-originals-offer-mobile-20260813
