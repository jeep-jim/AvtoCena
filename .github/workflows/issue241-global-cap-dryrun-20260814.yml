name: Issue241 global cap dry-run 20260814

on:
  push:
    branches: [ops-issue241-global-cap-dryrun-20260814]
    paths:
      - '.github/workflows/issue241-global-cap-dryrun-20260814.yml'

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_PUBLISH_LOCK_WAIT_MS: '7200000'

jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate global cap script
        run: |
          node --check scripts/catalog-enforce-global-model-cap.mjs
          node --import tsx --test tests/catalog-global-model-cap.test.ts tests/catalog-model-year-quota.test.ts
      - name: Read-only global model-year dry-run
        env:
          CATALOG_GLOBAL_MODEL_CAP_DRY_RUN: 'true'
          CATALOG_GLOBAL_MODEL_CAP_REPORT: catalog-global-model-cap-dryrun.json
        run: npx tsx scripts/catalog-enforce-global-model-cap.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-global-cap-dryrun
          path: catalog-global-model-cap-dryrun.json
          if-no-files-found: error
          retention-days: 3
