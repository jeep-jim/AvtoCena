name: Catalog live recovery · UAE + Georgia direct
run-name: Direct recovery UAE + Georgia · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-live-recovery-uae-georgia-direct.yml"

permissions:
  contents: read

concurrency:
  group: catalog-live-recovery-uae-georgia-direct
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_TARGET: "1000"
  RECOVERY_MAX_PAGES: "120"
  RECOVERY_TIME_LIMIT_MS: "2700000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          npm run typecheck

  collect:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        market: [uae, georgia]
    env:
      RECOVERY_DIRECT_MARKET: ${{ matrix.market }}
      RECOVERY_OUTPUT: catalog-rebuild-${{ matrix.market }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect directly from the exact adapter without generic refetch wrappers
        run: npx tsx scripts/catalog-live-recovery-direct-exact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-direct-recovery-${{ matrix.market }}
          path: catalog-rebuild-${{ matrix.market }}.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-direct-recovery-*
          path: recovery-input
          merge-multiple: true
      - name: Publish each non-empty recovered market independently
        shell: bash
        run: |
          set +e
          failed=""
          for market in uae georgia; do
            input="recovery-input/catalog-rebuild-${market}.json"
            if [ ! -s "$input" ]; then
              echo "$market has no artifact"
              failed="$failed $market(no-artifact)"
              continue
            fi
            export RECOVERY_PUBLISH_MARKET="$market"
            export RECOVERY_PUBLISH_INPUT="$input"
            export RECOVERY_PUBLISH_REPORT="catalog-direct-recovery-${market}-publish-report.json"
            export RECOVERY_PUBLISH_MAX="3000"
            if npx tsx scripts/catalog-live-recovery-publish.mjs; then
              echo "$market published"
            else
              echo "$market failed publication"
              failed="$failed $market"
            fi
          done
          echo "failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-direct-recovery-publish-reports
          path: catalog-direct-recovery-*-publish-report.json
          if-no-files-found: warn
          retention-days: 3
