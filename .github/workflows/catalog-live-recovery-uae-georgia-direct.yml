name: Catalog live recovery · UAE + Georgia direct
run-name: Direct recovery UAE + Georgia · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_TARGET: "3000"
  RECOVERY_MAX_PAGES: "300"
  RECOVERY_TIME_LIMIT_MS: "5100000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --import tsx --test tests/auto-georgia-price.test.ts
          node --import tsx --test tests/catalog-live-sources-v19.test.ts
          node --import tsx --test tests/catalog-direct-recovery.test.ts
          npm run typecheck

  collect:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        market: [uae, georgia]
    env:
      RECOVERY_DIRECT_MARKET: ${{ matrix.market }}
      RECOVERY_OUTPUT: catalog-rebuild-${{ matrix.market }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect canonical company sources first; fallback only when both Georgia anchors are unavailable
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RECOVERY_DIRECT_MARKET" != "georgia" ]; then
            npx tsx scripts/catalog-live-recovery-direct-exact.mjs
            exit 0
          fi

          PRIMARY_OUTPUT="catalog-rebuild-georgia-canonical.json"
          FINAL_OUTPUT="catalog-rebuild-georgia.json"
          FALLBACK_OUTPUT="catalog-rebuild-georgia-fallback.json"
          SELECTION_REPORT="catalog-georgia-source-selection.json"

          set +e
          RECOVERY_MARKET=georgia \
          RECOVERY_SOURCE_IDS="myauto_georgia_list,autopapa_georgia_open" \
          RECOVERY_OUTPUT="$PRIMARY_OUTPUT" \
          npx tsx scripts/catalog-live-recovery-market.mjs
          primary_status=$?
          set -e

          primary_count=$(node -e "const fs=require('fs');let n=0;try{n=Number(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).count||0)}catch{};process.stdout.write(String(n))" "$PRIMARY_OUTPUT")
          canonical_unavailable=$(node -e "const fs=require('fs');let p={};try{p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'))}catch{};const expected=['myauto_georgia_list','autopapa_georgia_open'];const rows=p.report?.sources||[];const unavailable=expected.every(id=>{const row=rows.find(x=>x.sourceId===id);return !row||row.stopReason==='source_error'});process.stdout.write(unavailable?'1':'0')" "$PRIMARY_OUTPUT")

          if [ "$primary_count" -gt 0 ]; then
            cp "$PRIMARY_OUTPUT" "$FINAL_OUTPUT"
            node - "$PRIMARY_OUTPUT" "$SELECTION_REPORT" "$primary_status" <<'NODE'
          const fs = require('fs');
          const [input, output, status] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(input, 'utf8'));
          fs.writeFileSync(output, JSON.stringify({
            canonicalSourceIds: ['myauto_georgia_list', 'autopapa_georgia_open'],
            fallbackSourceId: 'auto_georgia_open',
            canonicalExitStatus: Number(status),
            canonicalCount: Number(payload.count || 0),
            canonicalDiagnostics: payload.report?.sources || [],
            usedFallback: false,
            fallbackReason: null,
          }, null, 2));
          NODE
          elif [ "$canonical_unavailable" = "1" ]; then
            echo "Both canonical Georgia anchors are unavailable; AUTO.GE fallback is now allowed."
            RECOVERY_DIRECT_MARKET=georgia RECOVERY_OUTPUT="$FALLBACK_OUTPUT" npx tsx scripts/catalog-live-recovery-direct-exact.mjs
            cp "$FALLBACK_OUTPUT" "$FINAL_OUTPUT"
            node - "$PRIMARY_OUTPUT" "$FALLBACK_OUTPUT" "$SELECTION_REPORT" "$primary_status" <<'NODE'
          const fs = require('fs');
          const [primaryPath, fallbackPath, output, status] = process.argv.slice(2);
          let primary = {};
          try { primary = JSON.parse(fs.readFileSync(primaryPath, 'utf8')); } catch {}
          const fallback = JSON.parse(fs.readFileSync(fallbackPath, 'utf8'));
          fs.writeFileSync(output, JSON.stringify({
            canonicalSourceIds: ['myauto_georgia_list', 'autopapa_georgia_open'],
            fallbackSourceId: 'auto_georgia_open',
            canonicalExitStatus: Number(status),
            canonicalCount: Number(primary.count || 0),
            canonicalDiagnostics: primary.report?.sources || [],
            usedFallback: true,
            fallbackReason: 'both_canonical_sources_unavailable',
            fallbackCount: Number(fallback.count || 0),
          }, null, 2));
          NODE
          else
            node - "$PRIMARY_OUTPUT" "$SELECTION_REPORT" "$primary_status" <<'NODE'
          const fs = require('fs');
          const [primaryPath, output, status] = process.argv.slice(2);
          let primary = {};
          try { primary = JSON.parse(fs.readFileSync(primaryPath, 'utf8')); } catch {}
          fs.writeFileSync(output, JSON.stringify({
            canonicalSourceIds: ['myauto_georgia_list', 'autopapa_georgia_open'],
            fallbackSourceId: 'auto_georgia_open',
            canonicalExitStatus: Number(status),
            canonicalCount: Number(primary.count || 0),
            canonicalDiagnostics: primary.report?.sources || [],
            usedFallback: false,
            fallbackReason: 'canonical_source_available_but_zero_publishable_rows',
          }, null, 2));
          NODE
            cat "$SELECTION_REPORT"
            echo "At least one canonical Georgia source is reachable but yielded zero publishable rows; refusing to hide that problem behind fallback."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-direct-recovery-${{ matrix.market }}
          path: |
            catalog-rebuild-${{ matrix.market }}.json
            catalog-georgia-source-selection.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-direct-recovery-*
          path: recovery-input
          merge-multiple: true
      - name: Snapshot all seven markets before batch write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-direct-before-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: ""
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Publish UAE and Georgia in one atomic generation
        env:
          RECOVERY_BATCH_MARKETS: uae,georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-direct-recovery-batch-publish-report.json
          RECOVERY_PUBLISH_MAX: "5000"
          CATALOG_MAX_OFFERS_PER_MODEL: "20"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Audit all seven markets after batch write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-direct-after-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: uae,georgia
          CATALOG_AUDIT_MAX_PER_MODEL: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Assert atomic manifest preservation and global invariants
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('catalog-direct-before-all7.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('catalog-direct-after-all7.json', 'utf8'));
          const publish = JSON.parse(fs.readFileSync('catalog-direct-recovery-batch-publish-report.json', 'utf8'));
          const preserved = ['korea','china','japan','europe','kyrgyzstan'];
          for (const market of preserved) {
            const expectedAfter = Number(publish.preservedByMarket?.[market] ?? publish.manifestCounts?.[market] ?? 0);
            const actualAfter = Number(after.markets?.[market]?.count || 0);
            if (actualAfter !== expectedAfter) throw new Error(`preserved_manifest_mismatch:${market}:expected=${expectedAfter},actual=${actualAfter}`);
          }
          for (const market of ['uae','georgia']) {
            const expectedAfter = Number(publish.manifestCounts?.[market] || 0);
            const actualAfter = Number(after.markets?.[market]?.count || 0);
            if (actualAfter !== expectedAfter) throw new Error(`published_manifest_mismatch:${market}:expected=${expectedAfter},actual=${actualAfter}`);
          }
          for (const [market, stats] of Object.entries(after.markets || {})) {
            if (Number(stats.belowMarketMinYearCount || 0) !== 0) throw new Error(`below_market_min_year:${market}:${stats.belowMarketMinYearCount}`);
            if (Number(stats.nonPositiveSourcePriceCount || 0) !== 0) throw new Error(`nonpositive_source_price:${market}`);
            if (Number(stats.nonVehicleCount || 0) !== 0) throw new Error(`nonvehicle:${market}`);
            if (Number(stats.maxPerExactModel || 0) > 20) throw new Error(`model_cap:${market}:${stats.maxPerExactModel}`);
          }
          console.log({preSnapshot:Object.fromEntries(preserved.map(m=>[m,before.markets?.[m]?.count||0])), atomicPreserved:publish.preservedByMarket, uae:after.markets.uae, georgia:after.markets.georgia});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-direct-recovery-publish-reports
          path: |
            catalog-direct-recovery-batch-publish-report.json
            catalog-direct-before-all7.json
            catalog-direct-after-all7.json
            recovery-input/catalog-georgia-source-selection.json
          if-no-files-found: warn
          retention-days: 3
