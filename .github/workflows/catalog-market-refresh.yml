name: Catalog independent market worker
on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reuse_run_id: ${{ steps.policy.outputs.reuse_run_id }}
      collect_markets: ${{ steps.policy.outputs.collect_markets }}
      publish_markets: ${{ steps.policy.outputs.publish_markets }}
      publish_matrix: ${{ steps.policy.outputs.publish_matrix }}
      reset_cursors: ${{ steps.policy.outputs.reset_cursors }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_MARKET: ${{ inputs.market }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { catalogRefreshDue } from './scripts/lib/catalog-refresh-schedule.mjs';
          const run = ['push','workflow_dispatch'].includes(process.env.EVENT_NAME) || (process.env.EVENT_NAME === 'schedule' && catalogRefreshDue());
          const market = process.env.TARGET_MARKET;
          const marker = process.env.EVENT_NAME === 'push' ? JSON.parse(fs.readFileSync(`.github/market-runs/${market}-refresh.json`,'utf8')) : {};
          if (!['china','korea','uae','georgia','europe'].includes(market)) throw Error('invalid_market');
          const reuse = marker.reuseRunId || '';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`reset_cursors=${marker.resetCursors === true}\n`);
          if (reuse && !/^\d+$/.test(String(reuse))) throw Error('invalid_reuse_run_id');
          const allowed = [market];
          const publish = marker.publishMarkets || allowed;
          if (!Array.isArray(publish) || !publish.length || publish.some(market => !allowed.includes(market)) || new Set(publish).size !== publish.length) throw Error('invalid_publish_markets');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`publish_matrix=${JSON.stringify(publish)}\n`);
          const collect = reuse ? (marker.refreshMarkets || []) : publish;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`publish_markets=${publish.join(' ')}\n`);
          if (!Array.isArray(collect) || collect.some(market => !allowed.includes(market)) || new Set(collect).size !== collect.length) throw Error('invalid_refresh_markets');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`collect_markets=${JSON.stringify(collect)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${run}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`reuse_run_id=${reuse}\n`);
          JS
  collect:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.collect_markets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Keep source collectors concurrent inside one market, not five markets.
      max-parallel: 1
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.collect_markets) }}
    env:
      CATALOG_INTAKE_MARKET: ${{ matrix.market }}
      # UAE and Georgia are finite, newest-first seller inventories. Restart
      # them at page 1 on every approved pass so a saved end cursor cannot turn
      # the next refresh into an empty or tail-only scan.
      # China can continue a published budget-limited slice. Completed scans
      # restart at page 1; uncommitted or blocked cursors are never resumed.
      CATALOG_INTAKE_RESUME: ${{ matrix.market == 'china' && '1' || '0' }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_INTAKE_TIME_MS: '12600000'
      CATALOG_INTAKE_MAX_ROWS_PER_SOURCE: '100000'
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: '20000'
      CATALOG_SOURCE_TIMEOUT_MS: '25000'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '1'
      CATALOG_MAX_IMAGES_PER_OFFER: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect listing, exact detail and technical tables
        run: node --import tsx scripts/catalog-source-intake.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-intake-${{ matrix.market }}
          path: catalog-intake-${{ matrix.market }}/
          overwrite: true
          retention-days: 14
  publish:
    needs: [plan, collect]
    if: always() && needs.plan.outputs.run == 'true' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    # Each market gets its own budget; a large Georgia publish must not consume
    # Europe's turn. The workflow and object-store publication locks are retained.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.publish_matrix) }}
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_PUBLICATION_DRY_RUN: '0'
      CATALOG_REBUILD_INPUT_DIR: catalog-intake-publish
      CATALOG_INTAKE_INPUT_DIR: catalog-intake-input
      CATALOG_REBUILD_TARGET_PER_SOURCE: '100000'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '10000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '1'
      CATALOG_PRIORITY_MAX_TOTAL_RUB: '15000000'
      CATALOG_V2_HARD_MAX_TOTAL_RUB: '15000000'
      CATALOG_V2_PRIORITY_TARGET: '8000'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '4'
      CATALOG_INDEX_WRITE_CONCURRENCY: '8'
      CATALOG_PUBLISH_LOCK_WAIT_MS: '14400000'
      CATALOG_PUBLISH_LOCK_TTL_MS: '1800000'
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: '300000'
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Report publication resource budget
        run: |
          free -m
          df -h .
          node -e 'console.log(JSON.stringify({heapLimitMiB:Math.round(require("node:v8").getHeapStatistics().heap_size_limit/1048576),availableMiB:Math.round(require("node:os").freemem()/1048576)}))'
      - name: Restore collected observations without repeating source requests
        uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse_run_id != ''
        with:
          pattern: catalog-intake-${{ matrix.market }}
          path: catalog-intake-input
          run-id: ${{ needs.plan.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Overlay explicitly refreshed markets
        uses: actions/download-artifact@v4
        if: contains(fromJSON(needs.plan.outputs.collect_markets), matrix.market)
        with:
          pattern: catalog-intake-${{ matrix.market }}
          path: catalog-intake-input
      - run: node --import tsx scripts/catalog-intake-to-publication.mjs
      - name: Check bucket reserve without deleting objects
        run: node scripts/run-transient-retry.mjs node --import tsx scripts/catalog-storage-preflight.mjs
      - name: Publish markets through calculation and retention guards
        env:
          CATALOG_PUBLISH_MARKETS: ${{ matrix.market }}
        shell: bash
        run: |
          failures=0
          for market in $CATALOG_PUBLISH_MARKETS; do
            node scripts/run-transient-retry.mjs node --import tsx scripts/catalog-storage-preflight.mjs || exit 1
            export CATALOG_REBUILD_MARKETS="$market"
            export CATALOG_REBUILD_PUBLISH_REPORT="catalog-weekly-$market-publish-report.json"
            if node scripts/run-transient-retry.mjs node --import tsx scripts/catalog-publish-market.mjs; then
              node --import tsx scripts/catalog-commit-intake-cursor.mjs || failures=$((failures + 1))
            else
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
      - name: Record collection and publication outcome even after failure
        if: always()
        env:
          CATALOG_REBUILD_MARKETS: ${{ matrix.market }}
          CATALOG_REBUILD_PUBLISH_REPORT: catalog-weekly-${{ matrix.market }}-publish-report.json
        run: node --import tsx scripts/record-market-refresh.mjs
      - name: Audit the active catalog after all market publications
        run: node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-quality-rebuild-reports-${{ matrix.market }}
          path: |
            catalog-storage-maintenance.json
            catalog-storage-preview.json
            catalog-storage-cleanup-report.json
            catalog-weekly-*.json
            catalog-refresh-outcome-*.json
            catalog-storage-preflight.json
            catalog-visible-calculation-coverage.json
          overwrite: true
          retention-days: 14
