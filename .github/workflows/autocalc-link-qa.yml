name: AutoCalc link QA
on:
  push:
    branches: [feature/autocalc-link]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/autocalc-link.test.ts tests/autocalc-route.test.ts
      - run: npm install --no-save playwright esbuild
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/autocalc-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocalc-preview
          path: artifacts/autocalc/
