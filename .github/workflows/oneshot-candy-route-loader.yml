name: One-shot candy route loader

on:
  push:
    branches:
      - fix/candy-route-loader-20260812
    paths:
      - .github/workflows/oneshot-candy-route-loader.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candy-route-loader-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply full-header candy loader
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/layout/RoutePreloader.tsx')
          text = path.read_text()
          text = text.replace('import { BrandMark } from "@/components/brand/BrandMark";\n', '')
          text = text.replace('const REVEAL_DELAY_MS = 320;', 'const REVEAL_DELAY_MS = 100;')
          text = text.replace('const MIN_VISIBLE_MS = 120;', 'const MIN_VISIBLE_MS = 80;')

          old_css = '''html[data-theme="light"] .ac-route-loader__pill{\n  background:#fff!important;\n  background-color:#fff!important;\n  border-color:rgba(30,36,48,.14)!important;\n  color:#171b24!important;\n  -webkit-text-fill-color:#171b24!important;\n  box-shadow:0 8px 24px rgba(30,36,48,.14)!important;\n}\n'''
          new_css = '''/* The route loader deliberately covers the complete 64px public header.\n   The red/white diagonal sweep is readable in both themes and on mobile. */\n.ac-route-loader{\n  height:64px!important;\n  overflow:hidden!important;\n  background:#111827!important;\n  isolation:isolate!important;\n}\n.ac-route-loader__candy{\n  position:absolute!important;\n  inset:0!important;\n  background:repeating-linear-gradient(125deg,#ff303b 0 17px,#ff303b 34px,#fff 34px,#fff 51px,#ff303b 51px,#ff303b 68px)!important;\n  background-size:96px 96px!important;\n  animation:ac-route-candy-sweep .72s linear infinite!important;\n  box-shadow:inset 0 -1px 0 rgba(0,0,0,.32),0 8px 24px rgba(0,0,0,.18)!important;\n}\n.ac-route-loader__candy::after{\n  content:"";\n  position:absolute;\n  inset:0;\n  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08));\n}\n.ac-route-loader__label{\n  position:absolute!important;\n  left:50%!important;\n  top:50%!important;\n  z-index:1!important;\n  transform:translate(-50%,-50%)!important;\n  max-width:calc(100vw - 32px)!important;\n  white-space:nowrap!important;\n  border:1px solid rgba(255,255,255,.42)!important;\n  border-radius:999px!important;\n  background:rgba(12,18,30,.78)!important;\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n  padding:7px 13px!important;\n  font-size:12px!important;\n  font-weight:900!important;\n  line-height:1!important;\n  letter-spacing:.04em!important;\n  box-shadow:0 4px 14px rgba(0,0,0,.24)!important;\n  backdrop-filter:blur(6px)!important;\n  -webkit-backdrop-filter:blur(6px)!important;\n}\n@keyframes ac-route-candy-sweep{\n  from{background-position:0 0}\n  to{background-position:96px 0}\n}\n@media(max-width:420px){\n  .ac-route-loader__label{padding:6px 10px!important;font-size:11px!important}\n}\n@media(prefers-reduced-motion:reduce){\n  .ac-route-loader__candy{animation:none!important}\n}\n'''
          assert old_css in text, 'old route-loader pill CSS not found'
          text = text.replace(old_css, new_css, 1)

          old_jsx = ''' return <div className={`ac-route-loader pointer-events-none fixed left-0 right-0 top-0 z-[2147483646] transition-opacity duration-150 ${visible?"opacity-100":"opacity-0"}`} aria-hidden={!visible} aria-live="polite"><div className="ac-route-loader__bar h-[3px] w-full origin-left bg-red-500 shadow-[0_1px_8px_rgba(239,68,68,.45)]"/><div className="ac-route-loader__pill mx-auto mt-2 flex w-fit max-w-[calc(100vw-24px)] items-center gap-2 rounded-full border border-[var(--ac-border)] bg-[var(--ac-surface)]/95 px-3 py-2 text-[var(--ac-text)] shadow-lg backdrop-blur-md"><BrandMark className="h-5 w-5 shrink-0"/><span className="text-xs font-black">Загружаем страницу</span><span className="ac-route-loader__dot h-1.5 w-1.5 shrink-0 rounded-full bg-red-500" aria-hidden="true"/></div></div>;\n'''
          new_jsx = ''' return <div className={`ac-route-loader pointer-events-none fixed left-0 right-0 top-0 z-[2147483646] transition-opacity duration-75 ${visible?"opacity-100":"opacity-0"}`} aria-hidden={!visible} aria-live="polite" role="status"><div className="ac-route-loader__candy" aria-hidden="true"/><div className="ac-route-loader__label">Загружаем страницу</div><span className="sr-only">Загружаем страницу</span></div>;\n'''
          assert old_jsx in text, 'old route-loader JSX not found'
          text = text.replace(old_jsx, new_jsx, 1)
          path.write_text(text)

          test = Path('tests/route-preloader-candy.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst source = fs.readFileSync("apps/web/components/layout/RoutePreloader.tsx", "utf8");\n\ntest("route loader covers the complete public header with moving red-white candy stripes", () => {\n  assert.match(source, /height:64px!important/);\n  assert.match(source, /repeating-linear-gradient\\(125deg,#ff303b/);\n  assert.match(source, /@keyframes ac-route-candy-sweep/);\n  assert.match(source, /background-position:96px 0/);\n  assert.match(source, /prefers-reduced-motion:reduce/);\n  assert.match(source, /ac-route-loader__label.*Загружаем страницу/s);\n  assert.doesNotMatch(source, /ac-route-loader__pill/);\n  assert.doesNotMatch(source, /BrandMark/);\n});\n\ntest("loader does not artificially keep a completed route on screen", () => {\n  assert.match(source, /const REVEAL_DELAY_MS = 100/);\n  assert.match(source, /const MIN_VISIBLE_MS = 80/);\n  assert.match(source, /router\\.prefetch\\(route\\)/);\n});\n''')
          PY
      - name: Loader regression test
        run: node --import tsx --test tests/route-preloader-candy.test.ts
      - name: Web typecheck
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Commit validated source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/layout/RoutePreloader.tsx tests/route-preloader-candy.test.ts
          git diff --cached --check
          git commit -m "fix(ui): make route loading unmistakable"
          git push origin HEAD:fix/candy-route-loader-20260812
