name: Check exact China daily prerequisites without changes
on:
  push:
    branches: [main]
    paths: [.github/market-runs/china-daily-early-checkpoint-v1.sha256]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.run_attempt == '1' && github.event.head_commit.message == 'Check exact China daily prerequisites without changes'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 22867cbcfaee27b2e8917b6bf880e44827f67b60
          path: actor
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Check exact authorized source and install locked dependencies before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY2'
          import json, os, subprocess
          with open(os.environ['GITHUB_EVENT_PATH']) as f:
              event = json.load(f)
          commits = event.get('commits') or []
          head = event.get('head_commit') or {}
          assert event.get('ref') == 'refs/heads/main' and event.get('forced') is False and event.get('deleted') is False
          assert len(commits) == 1 and head.get('id') == commits[0].get('id') == os.environ['GITHUB_SHA']
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert event.get('before') == parent
          PY2
          test "$(git rev-parse HEAD^^)" = 5cf6f3e4e79c5d72c1d1062bb16bfc3832628eda
          test "$(git show -s --format=%P HEAD^ | wc -w)" = 1
          cmp -s <(git diff-tree --no-commit-id -r --name-status --no-renames -z HEAD^^ HEAD^) <(printf 'A\0%s\0' .github/workflows/china-daily-early-checkpoint-v1.yml)
          test "$(git -C actor rev-parse HEAD)" = 22867cbcfaee27b2e8917b6bf880e44827f67b60
          pin=f58505328e60d49df97394f66880636c88d4546fffe7c9926d9c17d2c7bfd53c
          test "$(git show -s --format=%P HEAD | wc -w)" = 1
