name: Compare the saved China inventory with the public catalog
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/china-source-coverage.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-owned-china-source-coverage
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the invocation
        working-directory: source
        run: |
          node --input-type=module <<'JS'
          import {verifyReadonlyInvocation} from './scripts/lib/readonly-marker-invocation.mjs';
          verifyReadonlyInvocation({root:process.cwd(),env:process.env,markerPath:'.github/market-runs/china-source-coverage.json',operation:'compare-owned-china-with-published-inventory'});
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fdb1bc1b98c97256e7b94988aeeeab996f2f9e4b
          path: native
          persist-credentials: false
      - name: Install and verify both readers
        run: |
          (cd native && npm ci --no-audit --no-fund)
          cd source
          npm ci --no-audit --no-fund
          node --import tsx --test tests/owned-china-publication-source.test.mjs tests/owned-china-active-coverage.test.mjs tests/che168-replica-witness.test.ts
      - name: Verify the saved replica and classify previously published cars
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          AVTOCENA_CHINA_REGCLOUD_RUNTIME: '1'
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/check-owned-china-publication-source.mjs "$GITHUB_WORKSPACE/native"
