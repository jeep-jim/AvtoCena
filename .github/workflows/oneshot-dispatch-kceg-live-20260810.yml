name: One-shot dispatch source-sharded KCEG live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-dispatch-kceg-live-20260810.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch one KCEG live run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify no active shared writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '[.workflow_runs[] | select((.status == "in_progress" or .status == "queued" or .status == "pending") and (.name == "Catalog live daily · working markets" or .name == "Catalog live recovery · UAE + Kyrgyzstan" or .name == "Catalog live recovery · Japan from Prestige" or .name == "Catalog live recovery · Japan now"))] | length')"
          echo "active_shared_writers=$active"
          test "$active" = "0"
      - name: Dispatch exactly one KCEG writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run catalog-live-daily-working-markets.yml --ref main
          sleep 5
          gh run list --workflow catalog-live-daily-working-markets.yml --limit 3 --json databaseId,status,conclusion,headSha,displayTitle
      - name: Remove one-shot dispatcher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/oneshot-dispatch-kceg-live-20260810.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove KCEG one-shot dispatcher [skip actions]'
          git pull --rebase origin main
          git push origin HEAD:main
