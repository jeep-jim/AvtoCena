name: AJ System — owner connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/ajes-connection-check.json']
permissions:
  contents: read
concurrency:
  group: ajes-owner-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bundle read-only publication lock check
        run: |
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          await build({stdin:{contents:"import {getJsonStorage} from './apps/web/lib/data'; async function main(){const x=await getJsonStorage().readJson('catalog/import-lock.json',null);console.log('PUBLICATION_LOCK',JSON.stringify({locked:Boolean(x&&Date.parse(x.lockedUntil)>Date.now()),until:x?.lockedUntil,operation:/^[a-zA-Z0-9_-]+$/.test(x?.operationType||'')?x.operationType:'other'}));} main().catch(()=>console.log('PUBLICATION_LOCK unavailable'));",resolveDir:process.cwd()},outfile:'/tmp/publication-lock.cjs',bundle:true,platform:'node',format:'cjs'});
          JS
      - name: Read only sanitized Japan failure codes
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'docker exec -i avtocena-production node; stat --printf="DEPLOY_UPLOAD_BYTES %s\n" /opt/avtocena/staging/incoming/38757025874-1/avtocena-image.tar.gz; ps -C docker -o etimes=,comm=; docker logs --since 10m avtocena-production 2>&1 | grep -Eo "^AJES_PUBLIC_FAILURE [a-z_]+$" | tail -20; true' < /tmp/publication-lock.cjs
