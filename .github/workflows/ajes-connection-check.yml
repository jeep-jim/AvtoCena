name: AJ System — owner connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/ajes-connection-check.json']
permissions:
  contents: read
concurrency:
  group: ajes-owner-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bundle bounded supplier response check
        run: |
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          await build({stdin:{contents:`import {ajesPassword} from './apps/web/lib/catalog/ajes-settings'; import {createAjesClient} from './apps/web/lib/catalog/ajes-client'; import {assertCollectionEnabled} from './apps/web/lib/catalog/collection-controls'; import {reserveAjesRequest} from './apps/web/lib/catalog/ajes-quota'; import {getJsonStorage} from './apps/web/lib/data'; import {gunzipSync} from 'node:zlib'; async function main(){ const client=createAjesClient({password:ajesPassword,assertEnabled:()=>assertCollectionEnabled('ajes_japan_feed'),reserve:t=>reserveAjesRequest(getJsonStorage(),t),fetcher:async(...args)=>{const r=await fetch(...args); let b=Buffer.from(await r.clone().arrayBuffer());if(b[0]===31&&b[1]===139)b=gunzipSync(b);let d;try{d=JSON.parse(b.toString())}catch{}const e=String(typeof d==='string'?d:d?.error||d?.ERROR||d?.message||(d===undefined&&b.length<=256?b.toString():'' )).toLowerCase();console.log('SUPPLIER_SHAPE',JSON.stringify({status:r.status,jsonType:typeof d,bytes:b.length,bom:b[0]===239&&b[1]===187&&b[2]===191,xml:b.toString().trimStart().startsWith('<'),arrayPrefix:b.toString().trimStart().startsWith('['),objectPrefix:b.toString().trimStart().startsWith('{'),gzip:b[0]===31&&b[1]===139,zlib:b[0]===120,array:Array.isArray(d),rows:Array.isArray(d)?d.length:null,error:Boolean(e),words:e.split(/[^a-z]+/).filter(w=>['invalid','ip','required','country','limit','wrong','access','code','ban','error','forbidden','not','allowed','try','later','bad','response','sql','query','authorization','server','database','password','too','many','requests','retry','api','rate','test','permission','captcha','address','security','check','denied'].includes(w)),ip:/ip|address/.test(e),password:/code|password/.test(e),sql:/sql|query|select/.test(e),limit:/limit|quota/.test(e),denied:/denied|access|allow|block/.test(e),country:/country|region/.test(e)}));return r;}});const r=await client.read({table:'stats',make:'HONDA',pageSize:24},process.env.AJES_DIAG_IP||'');console.log('SUPPLIER_ACCEPTED',r.items.length)}main().catch(()=>console.log('SUPPLIER_CHECK failed'));`,resolveDir:process.cwd()},outfile:'/tmp/ajes-probe.cjs',bundle:true,platform:'node',format:'cjs',plugins:[{name:'server-only',setup(b){b.onResolve({filter:/^server-only$/},()=>({path:'empty',namespace:'empty'}));b.onLoad({filter:/.*/,namespace:'empty'},()=>({contents:''}));}}]});
          JS
      - name: Check actual visitor address without retaining it
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          cat > /tmp/ajes-location.py <<'PYCODE'
          import pathlib,sys,subprocess
          p=pathlib.Path('/etc/nginx/conf.d/avtocena-prepare.conf')
          block='  location = /__ajes_probe_93bc2cd6169b { add_header X-Ajes-Diagnostic-IP $remote_addr always; return 204; }\n'
          before=p.read_text()
          if sys.argv[1]=='add':
              anchor='  location / {\n    limit_req zone='
              assert before.count(anchor)==1 and block not in before
              after=before.replace(anchor,block+anchor)
          else:after=before.replace(block,'')
          p.write_text(after)
          try:subprocess.run(['nginx','-t'],check=True,capture_output=True)
          except:
              p.write_text(before)
              raise
          subprocess.run(['systemctl','reload','nginx'],check=True)
          PYCODE
          cleanup(){ ssh "${opts[@]}" root@151.248.113.177 'python3 - remove' < /tmp/ajes-location.py; rm -f "$key_file" /tmp/ajes-headers; }
          trap cleanup EXIT
          ssh "${opts[@]}" root@151.248.113.177 'python3 - add' < /tmp/ajes-location.py
          curl --fail --silent --show-error --max-time 20 -D /tmp/ajes-headers -o /dev/null https://avtocena.com/__ajes_probe_93bc2cd6169b
          client_ip=$(python3 -c 'import pathlib,re; s=pathlib.Path("/tmp/ajes-headers").read_text();m=re.search(r"(?im)^x-ajes-diagnostic-ip: ([0-9.]+)$",s);assert m;print(m[1])')
          ssh "${opts[@]}" root@151.248.113.177 'python3 - remove' < /tmp/ajes-location.py
          ssh "${opts[@]}" root@151.248.113.177 "docker exec -i -e AJES_DIAG_IP=$client_ip avtocena-production node" < /tmp/ajes-probe.cjs
