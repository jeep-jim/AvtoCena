name: AJ System — owner connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/ajes-connection-check.json']
permissions:
  contents: read
concurrency:
  group: ajes-owner-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
      - name: Read only sanitized Japan failure codes
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'docker logs --since 10m avtocena-production 2>&1 | grep -Eo "^AJES_PUBLIC_FAILURE [a-z_]+$" | tail -20; true'
