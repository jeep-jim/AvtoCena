name: Append verified recovery checkpoint to roadmap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/append-roadmap-recovery.yml']
permissions:
  contents: write
concurrency:
  group: append-roadmap-recovery-20261117
  cancel-in-progress: false
jobs:
  append:
    if: github.event.head_commit.message == 'Append verified AvtoCena recovery checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Append only to the unchanged roadmap
        run: |
          set -euo pipefail
          test "$(git hash-object roadmap.md)" = 526ab33ffe45f3817c6e14511f13d9199db55ff3
          python3 - <<'PY'
          from pathlib import Path
          p=Path('roadmap.md');old=p.read_bytes()
          entry=Path('docs/operations/recovery-status-20261117-1525.md').read_bytes()
          p.write_bytes(old+entry)
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          test "$(git diff --cached --name-only)" = roadmap.md
          git commit -m 'Record verified preparation timeout and bounded China Korea recovery progress'
          git push origin HEAD:main
