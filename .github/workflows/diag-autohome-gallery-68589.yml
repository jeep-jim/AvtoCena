name: Diagnose Autohome gallery 68589
on:
  push:
    branches: [fix/china-quality-scale-20260810]
    paths: [.github/workflows/diag-autohome-gallery-68589.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact Autohome pages and embedded gallery data
        shell: bash
        run: |
          node <<'NODE'
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
            'accept-language':'zh-CN,zh;q=0.9,en;q=0.7',
          };
          const pages=[
            ['spec','https://www.autohome.com.cn/spec/68589/'],
            ['legacyExact','https://car.autohome.com.cn/pic/series-s68589/7768.html'],
            ['modernSeries','https://www.autohome.com.cn/cars/imglist-x-x-7768-x-x-x-x-x-x-1.html'],
          ];
          const snippet=(text,needle,radius=240)=>{
            const i=text.toLowerCase().indexOf(needle.toLowerCase());
            return i<0?'':text.slice(Math.max(0,i-radius),Math.min(text.length,i+needle.length+radius)).replace(/\s+/g,' ');
          };
          for (const [label,url] of pages) {
            try {
              const r=await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(30000)});
              const text=await r.text();
              const rawUrls=[...text.matchAll(/(?:https?:)?\\?\/\\?\/[^"'\\s<>]+?(?:\.jpe?g|\.png|\.webp|\.avif|cardfs\/product\/[^"'\\s<>]+)/gi)].map(m=>m[0].replaceAll('\\/','/'));
              const product=[...new Set(rawUrls.filter(x=>/cardfs\/product|autoimg\.cn/i.test(x)))];
              const nextMatch=text.match(/<script[^>]+id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i);
              let nextKeys=[];
              if(nextMatch){ try { const obj=JSON.parse(nextMatch[1]); const walk=(v,p='')=>{ if(!v||typeof v!=='object') return; for(const [k,x] of Object.entries(v)){ const q=p?`${p}.${k}`:k; if(/pic|img|image|photo|spec|series/i.test(k)) nextKeys.push(q); if(nextKeys.length<500) walk(x,q); } }; walk(obj); } catch{} }
              const apiStrings=[...new Set([...text.matchAll(/(?:https?:)?\\?\/\\?\/[^"'\\s<>]*(?:api|pic|image)[^"'\\s<>]*/gi)].map(m=>m[0].replaceAll('\\/','/')).filter(x=>/autohome|autoimg/i.test(x)))];
              console.log(JSON.stringify({label,status:r.status,finalUrl:r.url,bytes:text.length,productCount:product.length,productSamples:product.slice(0,60),nextKeys:nextKeys.slice(0,120),apiStrings:apiStrings.slice(0,80),snippets:{spec68589:snippet(text,'68589'),count189:snippet(text,'189张'),picList:snippet(text,'picList'),imageList:snippet(text,'imageList'),imgUrl:snippet(text,'imgUrl'),picUrl:snippet(text,'picUrl'),cardfs:snippet(text,'cardfs/product')}},null,2));
            } catch(e) { console.log(JSON.stringify({label,error:String(e)})); }
          }
          NODE