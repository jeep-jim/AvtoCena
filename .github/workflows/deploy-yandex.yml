name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/**
      - scripts/**
      - data/catalog/imports/**
  workflow_dispatch:

env:
  IMAGE: cr.yandex/crp73he0q1blh1mujo4s/avtocena-web:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy Serverless Container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: b1g9vq73onqb7dp5hgqg
          container-name: avtocena-web
          revision-service-account-id: ajekvv7ulcilmppf8qj3
          revision-image-url: ${{ env.IMAGE }}
          revision-cores: 1
          revision-memory: 2Gb
          revision-core-fraction: 100
          # Next.js spends most of its time waiting for object storage. Limit one
          # warm instance to four simultaneous SSR/RSC requests so a page burst
          # has enough heap headroom instead of risking a runtime signal kill.
          revision-concurrency: 4
          # The catalog is a public storefront: keep one initialized instance
          # ready so the first visitor does not pay the 4-6 second cold start.
          revision-provisioned: 1
          revision-execution-timeout: 30
          revision-env: |
            NODE_ENV=production
            NEXT_PUBLIC_SITE_URL=https://avtocena.com
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_ACCESS_KEY=${{ secrets.AUTH_ACCESS_KEY }}
            DADATA_API_KEY=${{ vars.DADATA_API_KEY }}
            JSON_STORAGE_DRIVER=object
            YC_OBJECT_STORAGE_ENDPOINT=${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
            YC_OBJECT_STORAGE_REGION=${{ secrets.YC_OBJECT_STORAGE_REGION }}
            YC_OBJECT_STORAGE_BUCKET=${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
            YC_OBJECT_STORAGE_ACCESS_KEY_ID=${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
            YC_OBJECT_STORAGE_SECRET_ACCESS_KEY=${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
            YC_OBJECT_STORAGE_PREFIX=${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

      - name: Warm public catalog and verify AI discovery
        run: |
          set -euo pipefail

          catalog_json="$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS 'https://avtocena.com/api/catalog/search?market=korea&pageSize=1')"
          offer_id="$(jq -r '.items[0].id // empty' <<<"$catalog_json")"
          test -n "$offer_id"
          curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS -o /dev/null 'https://avtocena.com/cars'
          curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS -o /dev/null "https://avtocena.com/cars/offer/$offer_id"

          robots="$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS 'https://avtocena.com/robots.txt')"
          grep -q 'User-Agent: OAI-SearchBot' <<<"$robots"
          grep -q 'Sitemap: https://avtocena.com/sitemap.xml' <<<"$robots"

          curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS -o /dev/null 'https://avtocena.com/sitemap.xml'
          curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS -o /dev/null 'https://avtocena.com/cars/sitemap/0.xml'

          llms="$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS 'https://avtocena.com/llms.txt')"
          grep -q '# АвтоЦена' <<<"$llms"

          feed_header="$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS 'https://avtocena.com/feeds/openai-products.csv' | head -n 1)"
          grep -q 'id,title,description,link,image_link,availability,price,brand,identifier_exists,product_type' <<<"$feed_header"

          mcp_init="$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"avtocena-deploy-check","version":"1.0.0"}}}' \
            'https://avtocena.com/mcp')"
          jq -e '.result.serverInfo.name == "avtocena"' <<<"$mcp_init" >/dev/null

          mcp_tools="$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -fsS \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            'https://avtocena.com/mcp')"
          jq -e '.result.tools | map(.name) | index("search_cars") != null' <<<"$mcp_tools" >/dev/null
