name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - scripts/**
      - data/catalog/imports/**
  workflow_dispatch:

concurrency:
  group: avtocena-production
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  IMAGE: cr.yandex/crp73he0q1blh1mujo4s/avtocena-web:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for production audit
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install production audit dependencies
        run: npm ci

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy Serverless Container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: b1g9vq73onqb7dp5hgqg
          container-name: avtocena-web
          revision-service-account-id: ajekvv7ulcilmppf8qj3
          revision-image-url: ${{ env.IMAGE }}
          revision-cores: 1
          revision-memory: 2Gb
          revision-core-fraction: 100
          revision-concurrency: 4
          revision-provisioned: 1
          revision-execution-timeout: 30
          revision-env: |
            NODE_ENV=production
            NEXT_PUBLIC_SITE_URL=https://avtocena.com
            AVTOCENA_RELEASE_SHA=${{ github.sha }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_ACCESS_KEY=${{ secrets.AUTH_ACCESS_KEY }}
            DADATA_API_KEY=${{ vars.DADATA_API_KEY }}
            TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            JSON_STORAGE_DRIVER=object
            YC_OBJECT_STORAGE_ENDPOINT=${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
            YC_OBJECT_STORAGE_REGION=${{ secrets.YC_OBJECT_STORAGE_REGION }}
            YC_OBJECT_STORAGE_BUCKET=${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
            YC_OBJECT_STORAGE_ACCESS_KEY_ID=${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
            YC_OBJECT_STORAGE_SECRET_ACCESS_KEY=${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
            YC_OBJECT_STORAGE_PREFIX=${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

      - name: Warm public catalog and verify AI discovery
        run: |
          set -euo pipefail
          CURL=(curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 -fsS)

          echo '1/9 health + exact release'
          health_json="$("${CURL[@]}" 'https://avtocena.com/api/health')"
          jq -e --arg sha '${{ github.sha }}' '.ok == true and .service == "avtocena-web" and .releaseSha == $sha' <<<"$health_json" >/dev/null

          echo '2/9 public catalog'
          catalog_json="$("${CURL[@]}" 'https://avtocena.com/api/catalog/search?market=korea&pageSize=1')"
          offer_id="$(jq -r '.items[0].id // empty' <<<"$catalog_json")"
          test -n "$offer_id"
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars'
          "${CURL[@]}" -o /dev/null "https://avtocena.com/cars/offer/$offer_id"

          echo '2b/9 encyclopedia routes'
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars/encyclopedia'
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars/brand/toyota'
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars/brand/toyota/model/land-cruiser-250'

          echo '3/9 OpenAI crawler rules'
          robots="$("${CURL[@]}" 'https://avtocena.com/robots.txt')"
          grep -qi '^User-agent: OAI-SearchBot$' <<<"$robots"
          grep -q 'Sitemap: https://avtocena.com/sitemap.xml' <<<"$robots"
          grep -q 'Sitemap: https://avtocena.com/cars/models-sitemap.xml' <<<"$robots"
          grep -q 'Sitemap: https://avtocena.com/cars/sitemap.xml' <<<"$robots"

          echo '4/9 sitemaps'
          echo '4a root sitemap'
          root_sitemap="$("${CURL[@]}" 'https://avtocena.com/sitemap.xml')"
          grep -q 'https://avtocena.com/cars/encyclopedia' <<<"$root_sitemap"
          echo '4b model sitemap index'
          model_sitemap_index="$("${CURL[@]}" 'https://avtocena.com/cars/models-sitemap.xml')"
          grep -q '<sitemapindex' <<<"$model_sitemap_index"
          grep -q 'https://avtocena.com/cars/models-sitemap/0.xml' <<<"$model_sitemap_index"
          echo '4c model sitemap shard 0'
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars/models-sitemap/0.xml'
          echo '4d offer sitemap index'
          sitemap_index="$("${CURL[@]}" 'https://avtocena.com/cars/sitemap.xml')"
          grep -q '<sitemapindex' <<<"$sitemap_index"
          grep -q 'https://avtocena.com/cars/sitemap/0.xml' <<<"$sitemap_index"
          echo '4e offer sitemap shard 0'
          "${CURL[@]}" -o /dev/null 'https://avtocena.com/cars/sitemap/0.xml'

          echo '5/9 llms guide'
          llms="$("${CURL[@]}" 'https://avtocena.com/llms.txt')"
          grep -q '# АвтоЦена' <<<"$llms"

          echo '6/9 OpenAI product feed'
          feed_gz="$(mktemp)"
          feed_csv="$(mktemp)"
          "${CURL[@]}" -o "$feed_gz" 'https://avtocena.com/feeds/openai-products.csv.gz'
          gzip -t "$feed_gz"
          gzip -dc "$feed_gz" > "$feed_csv"
          feed_header="$(head -n 1 "$feed_csv")"
          grep -q 'id,title,description,link,image_link,availability,price,brand,identifier_exists,product_type' <<<"$feed_header"
          test "$(wc -l < "$feed_csv")" -gt 1
          rm -f "$feed_gz" "$feed_csv"

          echo '7/9 MCP initialize'
          mcp_init="$("${CURL[@]}" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"avtocena-deploy-check","version":"1.0.0"}}}' \
            'https://avtocena.com/mcp')"
          jq -e '.result.serverInfo.name == "avtocena"' <<<"$mcp_init" >/dev/null

          echo '8/9 MCP tools'
          mcp_tools="$("${CURL[@]}" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            'https://avtocena.com/mcp')"
          jq -e '.result.tools | map(.name) | index("search_cars") != null' <<<"$mcp_tools" >/dev/null
          jq -e '.result.tools | map(.name) | index("get_import_calculation") != null' <<<"$mcp_tools" >/dev/null
          jq -e '.result.tools | map(.name) | index("get_vehicle_specs") != null' <<<"$mcp_tools" >/dev/null

          echo '9/9 live MCP search'
          mcp_search="$("${CURL[@]}" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_cars","arguments":{"market":"korea","limit":1}}}' \
            'https://avtocena.com/mcp')"
          jq -e '.result.isError == false' <<<"$mcp_search" >/dev/null
          jq -e '.result.structuredContent.items | length >= 1' <<<"$mcp_search" >/dev/null
          jq -e '.result.structuredContent.items[0].url | startswith("https://avtocena.com/cars/offer/")' <<<"$mcp_search" >/dev/null

      - name: Audit every visible catalog calculation
        id: visible_calculation_audit
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
          CATALOG_VISIBLE_CALCULATION_AUDIT_OUTPUT: catalog-visible-calculation-coverage.json
        run: node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs

      - name: Upload visible calculation coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-calculation-coverage-${{ github.sha }}
          path: catalog-visible-calculation-coverage.json
          if-no-files-found: warn
          retention-days: 7

      - name: Mark Yandex deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          description='Yandex live: ${{ steps.visible_calculation_audit.outputs.visible_offers }} visible; exact ${{ steps.visible_calculation_audit.outputs.ready_exact }}; needs ${{ steps.visible_calculation_audit.outputs.needs_data }}'
          payload="$(jq -nc --arg url "$run_url" --arg description "$description" '{state:"success",context:"deploy/yandex",description:$description,target_url:$url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload" >/dev/null

      - name: Mark Yandex deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          payload="$(jq -nc --arg url "$run_url" '{state:"failure",context:"deploy/yandex",description:"Yandex deploy, live smoke or calculation coverage failed",target_url:$url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload" >/dev/null
