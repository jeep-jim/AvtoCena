name: Apply mobile budget chips once

on:
  push:
    branches:
      - ui/mobile-budget-chips-20260814
    paths:
      - .github/workflows/apply-mobile-budget-chips-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-budget-chips-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply mobile UI patch
        run: python3 .github/scripts/apply-mobile-budget-chips.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only change
        shell: bash
        run: |
          rm .github/workflows/apply-mobile-budget-chips-once.yml
          rm .github/scripts/apply-mobile-budget-chips.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/home/HomePageClient.tsx .github/workflows/apply-mobile-budget-chips-once.yml .github/scripts/apply-mobile-budget-chips.py
          git commit -m "Refine mobile budget picker and spacing"
          git push origin HEAD:ui/mobile-budget-chips-20260814
