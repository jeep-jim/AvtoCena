name: Verify Encyclopedia Identity Integration

on:
  push:
    branches:
      - recovery/encyclopedia-v2-staging-20260818
    paths:
      - .github/workflows/verify-encyclopedia-identity-integration.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-encyclopedia-identity-resolver-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Encyclopedia V2 validator and tests
        run: |
          node scripts/vehicle-encyclopedia/validate.mjs
          node --test tests/vehicle-encyclopedia/*.test.mjs
      - name: Catalog identity tests
        run: node --import tsx --test tests/catalog-encyclopedia-identity-*.test.ts
      - name: Shadow audit syntax
        run: node --check scripts/catalog-audit-encyclopedia-identity.mjs
      - name: Web typecheck
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Engine typecheck
        run: npm --workspace=@avtocena/engine exec tsc -- --noEmit
      - name: Production build
        run: npm run build
      - name: Persist verification result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin recovery/encyclopedia-v2-staging-20260818
          git worktree add /tmp/recovery origin/recovery/encyclopedia-v2-staging-20260818
          cd /tmp/recovery
          mkdir -p recovery-assets/encyclopedia-v2-20260818
          printf 'verified_feature_sha=%s\nverified_at=%s\nstatus=%s\n' "$VERIFIED_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$JOB_STATUS" > recovery-assets/encyclopedia-v2-20260818/IDENTITY_INTEGRATION_VERIFY_RESULT.txt
          git add recovery-assets/encyclopedia-v2-20260818/IDENTITY_INTEGRATION_VERIFY_RESULT.txt
          git commit -m 'chore(recovery): record identity integration verification result' || true
          git push origin HEAD:recovery/encyclopedia-v2-staging-20260818
