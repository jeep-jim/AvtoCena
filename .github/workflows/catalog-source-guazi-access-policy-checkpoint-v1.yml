name: Catalog source qualification · Guazi access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/guazi-access-policy-v1-20260905
    paths:
      - ".github/workflows/catalog-source-guazi-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-guazi-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-guazi-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Guazi lead-only access-policy decision
        run: node scripts/catalog-source-guazi-access-policy-checkpoint-v1.mjs
      - name: Verify safety, roadmap and next step
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='guazi_china_open');
          const d=l.decisions.find(x=>x.sourceId==='guazi_china_open');
          if(!row||row.class!=='lead_only'||row.publishAllowed!==false)throw new Error('Guazi registry invalid');
          if(row.qualificationBlocker!=='official_guazi_user_agreement_requires_explicit_special_written_permission_for_scraping_copying_linking_and_other_content_use')throw new Error('Guazi blocker missing');
          if(!d||d.class!=='lead_only'||d.publishAllowed!==false||d.evidence?.runId!==33938425009)throw new Error('Guazi ledger invalid');
          const japan=r.candidates.filter(x=>x.market==='japan');
          if(!japan.length||japan.some(x=>x.qualificationPaused!==true))throw new Error('Japan pause missing');
          if(!/Autohome new-cars/i.test(r.next||''))throw new Error('Autohome new-cars next missing');
          if(!m.includes('## 40.49 — Guazi China: official user agreement expressly blocks scraping/content reuse without written permission'))throw new Error('roadmap 40.49 missing');
          if(r.candidates.some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Classify Guazi public route lead-only"
          git push origin HEAD:chore/guazi-access-policy-v1-20260905
