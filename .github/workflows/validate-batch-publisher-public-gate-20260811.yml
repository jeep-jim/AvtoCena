name: Validate batch publisher public gate

on:
  push:
    branches: [fix/batch-publisher-public-gate-20260811]
    paths:
      - .github/workflows/validate-batch-publisher-public-gate-20260811.yml

permissions:
  contents: write
  actions: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch-publisher-public-gate-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply canonical publisher patch
        run: python3 scripts/patch-batch-publisher-public-gate-20260811.py
      - name: Static and type validation
        run: |
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          npm run typecheck
          npx tsx -e 'import {catalogMinYearForMarket,isCatalogYearAllowed} from "./apps/web/lib/catalog/offer-quality.ts"; if(catalogMinYearForMarket("uae")!==2020||catalogMinYearForMarket("georgia")!==2020) throw new Error("non-japan floor"); if(isCatalogYearAllowed(2019,"uae")) throw new Error("2019 UAE leaked"); if(!isCatalogYearAllowed(2011,"japan")||isCatalogYearAllowed(2010,"japan")) throw new Error("Japan rolling floor"); console.log({uae:catalogMinYearForMarket("uae"),japan:catalogMinYearForMarket("japan")})'
      - uses: actions/download-artifact@v4
        with:
          name: catalog-direct-recovery-uae
          path: recovery-input
          github-token: ${{ github.token }}
          repository: jeep-jim/AvtoCena
          run-id: 31449038529
      - uses: actions/download-artifact@v4
        with:
          name: catalog-direct-recovery-georgia
          path: recovery-input
          github-token: ${{ github.token }}
          repository: jeep-jim/AvtoCena
          run-id: 31449038529
      - name: Dry-run exact previous failing inputs against current live catalog
        env:
          RECOVERY_BATCH_MARKETS: uae,georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-direct-recovery-batch-dry-run.json
          RECOVERY_PUBLISH_MAX: "3000"
          RECOVERY_BATCH_DRY_RUN: "true"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Assert canonical filtering and 2020 floors
        run: |
          node - <<'NODE'
          const r=require('./catalog-direct-recovery-batch-dry-run.json');
          if(!r.dryRun) throw new Error('not dry run');
          for(const market of ['uae','georgia']) {
            const m=r.byMarket?.[market];
            if(!m || Number(m.count||0)<1) throw new Error(`empty ${market}`);
            if(Number(m.minYear)!==2020) throw new Error(`bad floor ${market}:${m.minYear}`);
          }
          if(Number(r.byMarket?.georgia?.rejected?.public_quality||0)<1) throw new Error('expected Georgia canonical public-quality rejects not detected');
          console.log(JSON.stringify({uae:r.byMarket.uae,georgia:r.byMarket.georgia,preserved:r.preservedByMarket},null,2));
          NODE
      - name: Commit production file only
        run: |
          git checkout -- . || true
          python3 scripts/patch-batch-publisher-public-gate-20260811.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-live-recovery-publish-batch.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Align batch publisher with canonical public gate [skip actions]"
          git push origin HEAD:fix/batch-publisher-public-gate-20260811
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-publisher-public-gate-dry-run
          path: catalog-direct-recovery-batch-dry-run.json
          if-no-files-found: warn
          retention-days: 3
