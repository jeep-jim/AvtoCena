name: Diagnose market power coverage

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect current public markets and Korea sources
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          const { readCurrentPublicCatalogProjection } = await import('./apps/web/lib/catalog/storage.ts');
          const p = await readCurrentPublicCatalogProjection();
          const rows = p.rows || [];
          const markets = {};
          for (const row of rows) {
            const m=String(row.market||'unknown');
            const r=markets[m] ||= {count:0,priceReady:0,priceRequest:0,missingPower:0,sources:{}};
            r.count++;
            if(Number(row.publicVisibleRub||0)>0) r.priceReady++; else r.priceRequest++;
            if(!(Number(row.powerHp||0)>0) && !(Number(row.utilizationPowerKw||0)>0) && !(Number(row.power30MinKw||0)>0)) r.missingPower++;
            const s=String(row.sourceId||'unknown'); r.sources[s]=(r.sources[s]||0)+1;
          }
          console.log(JSON.stringify({generationId:p.generationId,markets},null,2));
          NODE
      - name: Show latest sequential and Korea runs
        shell: bash
        run: |
          for wf in catalog-v3-sequential-queue.yml catalog-v2-korea.yml; do
            echo "--- $wf ---"
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=5" --jq '.workflow_runs[] | {id,run_number,status,conclusion,event,head_sha,created_at,updated_at,html_url}' || true
          done
