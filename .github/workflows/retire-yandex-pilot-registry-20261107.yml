name: Retire expired Yandex pilot and images 2026-11-07
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-yandex-pilot-registry-20261107.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: owner-yandex-runtime-retirement
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1}
      - run: npm ci --ignore-scripts
      - name: Verify the pilot runtime is disabled or expired; never print access material
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          mkdir -p pilot-retirement
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {getJsonStorage} from './apps/web/lib/data.ts';import {decryptConfig} from './apps/web/lib/browser-pilot/config.ts';
          const envelope=await getJsonStorage().readJson('browser-pilot/runtime.json',null);assert.ok(envelope,'pilot_config_required');
          const config=decryptConfig(envelope,process.env.AUTH_SECRET);
          assert.equal(config.instanceId,'fhmvvsmoc6vpu3jbbhkc','pilot_identity_mismatch');
          assert.ok(config.enabled===false||Number(config.expiresAt)<Date.now(),'pilot_still_active');
          const source=fs.readFileSync('scripts/browser-pilot-provision.ts','utf8');
          for(const guard of ['--read-only','--tmpfs /tmp:','--tmpfs /home/browser:','-v /opt/avtocena-browser/tls:/run/browser:ro'])assert.ok(source.includes(guard));
          fs.writeFileSync('pilot-retirement/precondition.json',JSON.stringify({id:config.instanceId,enabled:config.enabled,expired:Number(config.expiresAt)<Date.now(),ephemeralBrowserContract:true},null,2));
          JS
      - name: Delete exact expired pilot and its auto-delete runtime disk, then unused registry
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const report={at:new Date().toISOString(),authorization:'owner-2026-11-07 unused Yandex infrastructure removal',deletedImages:[],dataBucketsTouched:false,completed:false};const save=()=>fs.writeFileSync('pilot-retirement/report.json',JSON.stringify(report,null,2));
          const health=async()=>{const r=await fetch('https://avtocena.com/api/health',{signal:AbortSignal.timeout(15000)}),h=await r.json();assert.equal(r.status,200);assert.equal(h.ok,true);return {releaseSha:h.releaseSha,calculationVersion:h.calculationVersion};};
          try{
           report.before=await health();
           const github='https://api.github.com/repos/jeep-jim/AvtoCena/actions/workflows/',gh={Authorization:'Bearer '+process.env.GITHUB_TOKEN};
           const w=await fetch(github+'browser-pilot.yml',{headers:gh,signal:AbortSignal.timeout(15000)});assert.equal(w.ok,true);const wf=await w.json();assert.equal(wf.path,'.github/workflows/browser-pilot.yml');
           const rr=await fetch(github+wf.id+'/runs?status=in_progress&per_page=1',{headers:gh,signal:AbortSignal.timeout(15000)});assert.equal(rr.ok,true);assert.equal((await rr.json()).total_count,0,'pilot_job_running');
           if(wf.state==='active'){const r=await fetch(github+wf.id+'/disable',{method:'PUT',headers:gh,signal:AbortSignal.timeout(15000)});assert.equal(r.status,204);}
           const ws=await fetch(github+wf.id,{headers:gh});assert.notEqual((await ws.json()).state,'active');report.pilotWorkflowDisabled=true;save();
           const key=JSON.parse(process.env.YC_SA_JSON_CREDENTIALS||'{}'),iam='https://iam.api.cloud.yandex.net/iam/v1/tokens',now=Math.floor(Date.now()/1000),enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
           const unsigned=enc({alg:'PS256',typ:'JWT',kid:key.id})+'.'+enc({iss:key.service_account_id,aud:iam,iat:now,exp:now+1200});const signature=crypto.sign('sha256',Buffer.from(unsigned),{key:key.private_key.slice(key.private_key.indexOf('-----BEGIN')),padding:crypto.constants.RSA_PKCS1_PSS_PADDING,saltLength:32}).toString('base64url');
           const ir=await fetch(iam,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jwt:unsigned+'.'+signature}),signal:AbortSignal.timeout(15000)});assert.equal(ir.ok,true);const {iamToken}=await ir.json(),headers={Authorization:'Bearer '+iamToken};
           const get=async url=>{const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});if(r.status===404)return null;assert.equal(r.ok,true,'read_http_'+r.status);return r.json();};
           const remove=async url=>{const r=await fetch(url,{method:'DELETE',headers,signal:AbortSignal.timeout(30000)});assert.equal(r.ok,true,'delete_http_'+r.status);let op=await r.json();for(let n=0;!op.done&&n<120;n++){await new Promise(resolve=>setTimeout(resolve,2000));op=await get('https://operation.api.cloud.yandex.net/operations/'+encodeURIComponent(op.id));assert.ok(op);}assert.equal(op.done,true,'delete_pending');assert.ok(!op.error,'delete_operation_error');assert.equal(await get(url),null,'resource_still_present');};
           const vmUrl='https://compute.api.cloud.yandex.net/compute/v1/instances/fhmvvsmoc6vpu3jbbhkc',diskUrl='https://compute.api.cloud.yandex.net/compute/v1/disks/fhmj3k1481pt5qfu9ek7';
           const vm=await get(vmUrl);if(vm){assert.equal(vm.name,'avtocena-browser-pilot');assert.equal(vm.folderId,'b1g9vq73onqb7dp5hgqg');assert.equal(vm.status,'STOPPED');assert.equal(vm.bootDisk.diskId,'fhmj3k1481pt5qfu9ek7');assert.equal(vm.bootDisk.autoDelete,true);assert.equal((vm.secondaryDisks||[]).length,0);const disk=await get(diskUrl);assert.equal(disk.folderId,vm.folderId);assert.equal(disk.sourceImageId,'fd8g39rqnaa88u265oic');assert.deepEqual(disk.instanceIds,[vm.id]);assert.equal(String(disk.size),'32212254720');await remove(vmUrl);report.vmDeleted=true;}else report.vmAlreadyAbsent=true;
           assert.equal(await get(diskUrl),null,'runtime_disk_still_present');report.runtimeDiskDeleted=true;save();
           const ipUrl='https://vpc.api.cloud.yandex.net/vpc/v1/addresses/e9bi1j785vdm42vubl1q',ip=await get(ipUrl);if(ip&&!ip.used){assert.equal(ip.folderId,'b1g9vq73onqb7dp5hgqg');await remove(ipUrl);report.addressDeleted=true;}else report.addressStatus=ip?'still_used_not_deleted':'already_absent';save();
           const containerList=await get('https://serverless-containers.api.cloud.yandex.net/containers/v1/containers?folderId=b1g9vq73onqb7dp5hgqg&pageSize=100');assert.equal((containerList.containers||[]).length,0,'container_still_references_registry');assert.ok(!containerList.nextPageToken);
           const registry='crp73he0q1blh1mujo4s',registryUrl='https://container-registry.api.cloud.yandex.net/container-registry/v1/registries/'+registry;
           const reg=await get(registryUrl);if(reg){assert.equal(reg.name,'avtocena-registry');assert.equal(reg.folderId,'b1g9vq73onqb7dp5hgqg');const imageUrl='https://container-registry.api.cloud.yandex.net/container-registry/v1/images';const data=await get(imageUrl+'?registryId='+registry+'&pageSize=1000');assert.ok(!data.nextPageToken);assert.ok((data.images||[]).length<=30);
             for(const image of data.images||[]){assert.ok([registry+'/avtocena-web',registry+'/avtocena-browser'].includes(image.name),'unexpected_image_repository');await remove(imageUrl+'/'+encodeURIComponent(image.id));report.deletedImages.push(image.id);save();}
             const after=await get(imageUrl+'?registryId='+registry+'&pageSize=1000');assert.equal((after.images||[]).length,0);assert.ok(!after.nextPageToken);await remove(registryUrl);report.registryDeleted=true;
           }else report.registryAlreadyAbsent=true;
           report.after=await health();assert.deepEqual(report.after,report.before,'REG_runtime_changed');report.completed=true;
          }catch(e){report.error=String(e.message).slice(0,240);process.exitCode=1;}finally{save();console.log(JSON.stringify(report));}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yandex-pilot-retirement
          path: pilot-retirement
          retention-days: 14
