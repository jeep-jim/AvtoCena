name: Ops · Fix PR472 model evidence 20260814

on:
  push:
    branches:
      - fix/vehicle-knowledge-model-make-leak-20260814
    paths:
      - ".github/workflows/ops-fix-pr472-model-evidence-20260814.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vehicle-knowledge-model-make-leak-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restrict model identity evidence to model and generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/lib/catalog/vehicle-knowledge.ts')
          s = p.read_text()
          old = '''  // Model identity must come from model/generation/trim evidence only. Including
  // the make here lets a knowledge model such as "Benz" match the "Benz" token
  // in make="Mercedes-Benz" and overwrite exact source models like Vito/Sprinter.
  const combined = vehicleKnowledgeToken([offer.model, offer.generation, offer.trim].filter(Boolean).join(" "));'''
          new = '''  // Model identity must come from model/generation evidence only. Make tokens can
  // falsely match Benz inside Mercedes-Benz, while trim tokens such as 316 CDI
  // are variant evidence and can falsely replace an exact Sprinter/Vito model.
  const combined = vehicleKnowledgeToken([offer.model, offer.generation].filter(Boolean).join(" "));'''
          if old not in s:
              raise SystemExit('expected PR472 scoring block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Focused regression
        run: node --import tsx --test tests/vehicle-knowledge.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/catalog/vehicle-knowledge.ts
          git diff --cached --check
          git commit -m "Keep trim tokens out of model identity matching"
          git push origin HEAD:fix/vehicle-knowledge-model-make-leak-20260814
