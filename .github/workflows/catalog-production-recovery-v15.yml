name: Catalog source-scale daily
run-name: Catalog 7 markets · 3 sources × 1000 cars · ${{ github.sha }}

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-production-recovery-v15.yml
      - apps/web/lib/catalog/**
      - packages/engine/src/calculation/**
      - data/catalog/vehicle-knowledge/**
      - scripts/catalog-sync-vehicle-knowledge-seed.mjs
      - scripts/catalog-probe-source-shard.mjs
      - scripts/catalog-rebuild-source-shard.mjs
      - scripts/catalog-validate-source-scale.mjs
      - scripts/catalog-publish-source-scale.mjs

permissions:
  contents: read

concurrency:
  group: catalog-source-scale-daily
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source-scale pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate scripts and types
        run: |
          node --check scripts/catalog-sync-vehicle-knowledge-seed.mjs
          node --check scripts/catalog-probe-source-shard.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-validate-source-scale.mjs
          node --check scripts/catalog-publish-source-scale.mjs
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm --workspace=@avtocena/engine exec tsc -- --noEmit

  knowledge:
    name: Sync vehicle knowledge to JSON storage
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require object storage configuration
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Sync seed models and verified variants
        run: npx tsx scripts/catalog-sync-vehicle-knowledge-seed.mjs

  collect:
    name: Collect ${{ matrix.market }} shard ${{ matrix.shard }}
    needs: [validate, knowledge]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        market: [korea, china, japan, uae, europe, georgia, kyrgyzstan]
        shard: [0, 1, 2]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "3"
      CATALOG_PROBE_TIMEOUT_MS: "15000"
      CATALOG_PROBE_ATTEMPTS: "2"
      CATALOG_PROBE_CONCURRENCY: "8"
      CATALOG_PROBE_OUTPUT: catalog-probe-${{ matrix.market }}-${{ matrix.shard }}.json
      CATALOG_REBUILD_TARGET_PER_SOURCE: "1000"
      CATALOG_REBUILD_TARGET_PER_MARKET: "3000"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "300"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "9000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "4"
      CATALOG_OFFER_RETENTION_MS: "259200000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "8"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_COLLECTION_IMAGE_LIMIT: "30"
      CATALOG_GALLERY_FAST_PATH: "false"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "100"
      CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
      CATALOG_PRIORITY_MAX_POWER_HP: "160"
      CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
      CATALOG_SOURCE_TIMEOUT_MS: "18000"
      CATALOG_IMAGE_TIMEOUT_MS: "12000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "6"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "16"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "6"
      CATALOG_REBUILD_CHECKPOINT_EVERY: "25"
      CATALOG_REBUILD_TIME_LIMIT_MS: "3300000"
      CATALOG_ENCAR_DIRECT_PAGE_SIZE: "50"
      CATALOG_ENCAR_DIRECT_LIST_RPM: "30"
      CATALOG_ENCAR_DIRECT_DETAIL_RPM: "120"
      CATALOG_ENCAR_DIRECT_IMAGE_RPM: "120"
      CATALOG_CHE168_GLOBAL_PAGE_SIZE: "64"
      CATALOG_CHE168_GLOBAL_MAX_BRANDS: "64"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require object storage configuration
        shell: bash
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Probe every registered source in this shard
        id: probe
        continue-on-error: true
        run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Collect listings, calculations and progressive galleries safely
        id: collect
        continue-on-error: true
        env:
          CATALOG_REBUILD_SOURCE_IDS: ${{ steps.probe.outputs.source_ids }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=120s 3600s npx tsx scripts/catalog-rebuild-source-shard.mjs
          status=$?
          export CATALOG_COLLECT_EXIT_CODE="$status"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ ! -s "$CATALOG_REBUILD_OUTPUT" ]; then
            node <<'NODE'
          const fs = require('fs');
          const market = String(process.env.CATALOG_REBUILD_MARKET || 'unknown');
          const shardIndex = Number(process.env.CATALOG_REBUILD_SHARD_INDEX || 0);
          const shardCount = Number(process.env.CATALOG_REBUILD_SHARD_COUNT || 3);
          const targetPerSource = Number(process.env.CATALOG_REBUILD_TARGET_PER_SOURCE || 1000);
          const minimumMarketTarget = Number(process.env.CATALOG_REBUILD_TARGET_PER_MARKET || 3000);
          const exitCode = Number(process.env.CATALOG_COLLECT_EXIT_CODE || 1);
          const generatedAt = new Date().toISOString();
          const stopReason = `safe_fallback_exit_${exitCode}`;
          const payload = {
            version: 33,
            market,
            shardIndex,
            shardCount,
            generatedAt,
            targetPerSource,
            minimumMarketTarget,
            count: 0,
            sourceIds: [],
            liveSourceIds: [],
            retentionSourceIds: [],
            partial: true,
            stopReason,
            report: {
              version: 33,
              market,
              shardIndex,
              shardCount,
              targetPerSource,
              saved: 0,
              sourceErrors: [{ stage: 'workflow_safe_fallback', error: `collector_exit_${exitCode}` }],
              rejectionReasons: {},
              publicBySource: {},
              freshBySource: {},
              restoredBySource: {},
              sources: [],
              stopReason,
              generatedAt,
            },
            offers: [],
          };
          fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT, JSON.stringify(payload, null, 2));
          NODE
          fi

          # Сетевой сбой отдельного сайта или shard не должен красить весь production-проход.
          # Точная причина остаётся в exit_code и fallback-отчёте, а publish использует retention.
          exit 0
      - name: Verify shard envelope without stopping other markets
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = process.env.CATALOG_REBUILD_OUTPUT;
          if (!fs.existsSync(file)) throw new Error(`missing_shard_output_${file}`);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (payload.market !== process.env.CATALOG_REBUILD_MARKET) throw new Error('shard_market_mismatch');
          if (!Array.isArray(payload.offers)) throw new Error('shard_offers_missing');
          console.log(JSON.stringify({
            market: payload.market,
            shard: payload.shardIndex,
            count: payload.offers.length,
            live: payload.liveSourceIds,
            bySource: payload.report?.publicBySource,
            detailLimitPerSource: payload.report?.detailLimitPerSource,
            detailSuccessBySource: payload.report?.detailSuccessBySource,
            detailDeferredBySource: payload.report?.detailDeferredBySource,
            imageStats: payload.report?.imageStats,
            collectExitCode: '${{ steps.collect.outputs.exit_code }}',
            stop: payload.stopReason,
          }, null, 2));
          NODE
      - name: Upload source diagnostics and verified offers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}
          path: |
            catalog-probe-${{ matrix.market }}-${{ matrix.shard }}.json
            catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 1

  publish:
    name: Publish verified catalog or preserve previous manifest
    if: always()
    needs: [validate, knowledge, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-rebuild
      CATALOG_REBUILD_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
      CATALOG_REBUILD_TARGET_PER_SOURCE: "1000"
      CATALOG_PUBLISH_TARGET_PER_MARKET: "3000"
      CATALOG_PUBLISH_MAX_PER_MARKET: "30000"
      CATALOG_OFFER_RETENTION_MS: "259200000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "8"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
      CATALOG_PRIORITY_MAX_POWER_HP: "160"
      CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
      CATALOG_INDEX_WRITE_CONCURRENCY: "16"
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "24"
      CATALOG_PUBLISH_MIN_PRODUCTIVE_SOURCES: "3"
      CATALOG_PUBLISH_MIN_FRESH_BY_MARKET: '{"korea":3,"china":3,"japan":3,"uae":3,"europe":3,"georgia":3,"kyrgyzstan":3}'
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-source-scale-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-source-scale-publish-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download available source shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-rebuild-*
          path: catalog-rebuild
          merge-multiple: true
      - name: Audit calculations, customs, utilization fee and galleries
        continue-on-error: true
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish verified offers with three-day retention
        run: npx tsx scripts/catalog-publish-source-scale.mjs
      - name: Confirm publication or safe retention
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT, 'utf8'));
          const markets = ['korea','china','japan','uae','europe','georgia','kyrgyzstan'];
          const safeRetention = !report.published
            && report.previousManifestPreserved
            && report.publicationError === 'no_verified_offers_keep_previous_manifest';

          if (!report.published && !safeRetention) {
            throw new Error(`catalog_storage_or_publication_failure_${report.publicationError || 'unknown'}`);
          }

          if (report.published) {
            if (!report.generationId) throw new Error('catalog_generation_missing');
            if (!(Number(report.total || 0) > 0)) throw new Error('catalog_total_empty');
          } else {
            console.warn('catalog_no_new_verified_offers: previous manifest preserved safely; next daily run will retry');
          }

          const missing = markets.filter((market) => !(Number(report.byMarket?.[market] || 0) > 0));
          const belowThreeSources = markets.filter((market) => Object.keys(report.byMarketAndSource?.[market] || {}).length < 3);
          if (missing.length) console.warn(`catalog_markets_empty_${missing.join('_')}: previous verified market data remains and the next run will retry`);
          console.log(JSON.stringify({
            published: report.published,
            previousManifestPreserved: report.previousManifestPreserved,
            generationId: report.generationId,
            total: report.total,
            byMarket: report.byMarket,
            byMarketAndSource: report.byMarketAndSource,
            belowTarget: report.marketsBelowTarget,
            missing,
            belowThreeSources,
          }, null, 2));
          NODE
      - name: Run production catalog smoke checks
        continue-on-error: true
        run: npm run catalog:smoke
      - name: Upload catalog reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-source-scale-reports
          path: |
            catalog-source-scale-validation-report.json
            catalog-source-scale-publish-report.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 1
