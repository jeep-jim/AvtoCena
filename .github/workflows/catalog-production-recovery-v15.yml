name: Catalog source-scale emergency cancel guard

on:
  workflow_dispatch:
  push:
    branches:
      - codex-strict-catalog-source-only
    paths:
      - ".github/workflows/catalog-production-recovery-v15.yml"

permissions:
  contents: read

concurrency:
  group: catalog-source-scale-daily
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Emergency second cancellation pass: stop legacy raw/source-scale publication on the strict certification branch."
