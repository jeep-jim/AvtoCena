name: Legacy catalog source-scale (manual only)
run-name: Legacy catalog disabled · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-catalog-source-scale
  cancel-in-progress: true

jobs:
