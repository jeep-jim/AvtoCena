name: Catalog seven-market recovery

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/lib/catalog/customs-pricing.ts
      - apps/web/lib/catalog/offer-quality.ts
      - apps/web/lib/catalog/regional-market-sources.ts
      - apps/web/lib/catalog/runtime-config.ts
      - apps/web/lib/catalog/spec-normalization.ts
      - apps/web/lib/catalog/power-display.ts
      - apps/web/lib/catalog/otomoto-detail-source.ts
      - scripts/catalog-rebuild-market.mjs
      - scripts/catalog-publish-fresh.mjs
      - .github/workflows/catalog-production-recovery-v15.yml

permissions:
  contents: read

concurrency:
  group: catalog-seven-market-recovery
  cancel-in-progress: true

jobs:
  rebuild-market:
    name: Rebuild ${{ matrix.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        market:
          - korea
          - china
          - japan
          - uae
          - europe
          - georgia
          - kyrgyzstan
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_TARGET: "1000"
      CATALOG_REBUILD_MAX_PAGES: "80"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "120"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "6"
      CATALOG_REBUILD_SEED_SCAN_LIMIT: "5000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_MAX_IMAGES_PER_OFFER: "10"
      CATALOG_SOURCE_TIMEOUT_MS: "20000"
      CATALOG_IMAGE_TIMEOUT_MS: "15000"
      CATALOG_IMAGE_MAX_BYTES: "10000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "4"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "4"
      CATALOG_REBUILD_CHECKPOINT_EVERY: "40"
      CATALOG_REBUILD_TIME_LIMIT_MS: "2400000"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ matrix.market }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check object storage configuration
        shell: bash
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Validate market rebuild script
        run: node --check scripts/catalog-rebuild-market.mjs
      - name: Rebuild market with checkpoints
        id: rebuild
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsx scripts/catalog-rebuild-market.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -s "$CATALOG_REBUILD_OUTPUT" ]; then
            node <<'NODE'
          const fs = require("fs");
          const market = process.env.CATALOG_REBUILD_MARKET;
          const now = new Date().toISOString();
          fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT, JSON.stringify({
            version: 7,
            market,
            generatedAt: now,
            target: Number(process.env.CATALOG_REBUILD_TARGET || 1000),
            count: 0,
            partial: true,
            stopReason: "rebuild_process_failed",
            report: {
              market,
              startedAt: now,
              finishedAt: now,
              partial: true,
              stopReason: "rebuild_process_failed",
              processExitCode: Number(process.env.REBUILD_EXIT_CODE || 1),
              saved: 0,
              sourceErrors: [{ stage: "process", error: "rebuild_process_failed_before_checkpoint" }]
            },
            offers: []
          }, null, 2));
          NODE
          fi
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT,"utf8"));if(!Array.isArray(p.offers))process.exit(1);console.log(`prepared ${p.offers.length}/${p.target} offers for ${p.market}; partial=${Boolean(p.partial)}; stop=${p.stopReason||p.report?.stopReason||"unknown"}`)'
          exit 0
      - name: Upload market generation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-rebuild-${{ matrix.market }}
          path: catalog-rebuild-${{ matrix.market }}.json
          if-no-files-found: error
          retention-days: 3
      - name: Add rebuild summary
        if: always()
        shell: bash
        run: |
          echo "### $CATALOG_REBUILD_MARKET" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT,"utf8"));console.log(`- Собрано: ${p.offers.length}/${p.target}\n- Частичная сборка: ${Boolean(p.partial)}\n- Причина остановки: ${p.stopReason||p.report?.stopReason||"unknown"}`)' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish available catalog and retain every market
    if: always()
    needs: rebuild-market
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-rebuild
      CATALOG_REBUILD_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
      CATALOG_REBUILD_TARGET: "1000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_REBUILD_MIN_SPEC_SCORE: "1"
      CATALOG_INDEX_WRITE_CONCURRENCY: "10"
      CATALOG_GROW_ONLY_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-fresh-publish-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download every available market generation
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-rebuild-*
          path: catalog-rebuild
          merge-multiple: true
      - name: Validate resilient publisher
        run: node --check scripts/catalog-publish-fresh.mjs
      - name: Publish fresh offers and retain unavailable markets
        run: npx tsx scripts/catalog-publish-fresh.mjs
      - name: Run production catalog smoke checks
        continue-on-error: true
        run: npm run catalog:smoke
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-seven-market-publish-report
          path: catalog-fresh-publish-report.json
          if-no-files-found: warn
          retention-days: 7
