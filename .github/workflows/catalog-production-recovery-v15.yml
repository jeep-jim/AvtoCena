name: Catalog stable 7 markets
run-name: Catalog stable 7 × 250 · ${{ github.sha }}

# Production commits made through the GitHub App may not emit a new push workflow run.
# A same-repository pull request to the dedicated trigger file reliably starts this workflow
# and retains access to repository secrets.
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - data/catalog-production-trigger.txt
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-production-recovery-v15.yml
      - data/catalog-production-trigger.txt
      - data/markets/markets.json
      - apps/web/lib/effective-market-settings.ts
      - apps/web/lib/catalog/importer.ts
      - apps/web/lib/catalog/offer-quality.ts
      - apps/web/lib/catalog/spec-normalization.ts
      - apps/web/lib/catalog/customs-pricing.ts
      - apps/web/lib/catalog/encar-complete-source.ts
      - apps/web/lib/catalog/guazi-export-source.ts
      - apps/web/lib/catalog/guazi-ru-source.ts
      - apps/web/lib/catalog/goonet-exact-source.ts
      - apps/web/lib/catalog/priority-market-sources.ts
      - apps/web/lib/catalog/myauto-list-source.ts
      - apps/web/lib/catalog/regional-market-sources.ts
      - apps/web/lib/catalog/dubicars-current-source.ts
      - apps/web/lib/catalog/otomoto-current-source.ts
      - apps/web/lib/catalog/otomoto-detail-source.ts
      - packages/engine/src/calculation/calculateAvtocena.ts
      - packages/engine/src/calculation/russiaCustoms.ts
      - scripts/catalog-rebuild-market.mjs
      - scripts/catalog-rebuild-market-retry.mjs
      - scripts/catalog-publish-fresh.mjs
      - scripts/catalog-business-audit.mjs

permissions:
  contents: read

concurrency:
  group: catalog-stable-seven-market
  cancel-in-progress: true

jobs:
  validate:
    name: Validate stable catalog pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate scripts and types
        run: |
          node --check scripts/catalog-rebuild-market.mjs
          node --check scripts/catalog-rebuild-market-retry.mjs
          node --check scripts/catalog-publish-fresh.mjs
          node --check scripts/catalog-business-audit.mjs
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm --workspace=@avtocena/engine exec tsc -- --noEmit

  collect:
    name: Collect ${{ matrix.market }} 250
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - market: korea
            sourceIds: encar_direct
            imageConcurrency: "8"
          - market: china
            sourceIds: guazi_china_ru,guazi_china_export,che168_china_exact
            imageConcurrency: "6"
          - market: japan
            sourceIds: carused_japan_open,tcv_japan_open,goonet_japan_exact,beforward_japan,beforward_public
            imageConcurrency: "6"
          - market: uae
            sourceIds: dubicars_uae_exact,beforward_uae
            imageConcurrency: "4"
          - market: europe
            sourceIds: otomoto_europe_exact,beforward_uk,beforward_belgium
            imageConcurrency: "3"
          - market: georgia
            sourceIds: myauto_georgia_list,myauto_georgia_exact,autopapa_georgia_open
            imageConcurrency: "5"
          - market: kyrgyzstan
            sourceIds: mashina_kyrgyzstan_exact
            imageConcurrency: "5"
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_SOURCE_IDS: ${{ matrix.sourceIds }}
      CATALOG_REBUILD_TARGET: "250"
      CATALOG_REBUILD_ATTEMPTS: "3"
      CATALOG_REBUILD_RETRY_BUDGET_MS: "5040000"
      CATALOG_REBUILD_MAX_PAGES: "500"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "1200"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "12"
      CATALOG_REBUILD_SEED_SCAN_LIMIT: "5000"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ matrix.market }}.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "4"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_SOURCE_TIMEOUT_MS: "60000"
      CATALOG_IMAGE_TIMEOUT_MS: "45000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: ${{ matrix.imageConcurrency }}
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "10"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "2"
      CATALOG_REBUILD_CHECKPOINT_EVERY: "10"
      CATALOG_REBUILD_TIME_LIMIT_MS: "1680000"
      CATALOG_ENCAR_DIRECT_PAGE_SIZE: "50"
      CATALOG_ENCAR_DIRECT_LIST_RPM: "30"
      CATALOG_ENCAR_DIRECT_DETAIL_RPM: "120"
      CATALOG_ENCAR_DIRECT_IMAGE_RPM: "120"
      CATALOG_CHE168_GLOBAL_PAGE_SIZE: "64"
      CATALOG_CHE168_GLOBAL_MAX_BRANDS: "64"
      CATALOG_GROW_ONLY_MARKETS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect and accumulate 250 verified cars
        run: npx tsx scripts/catalog-rebuild-market-retry.mjs
      - name: Require 250 verified offers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = process.env.CATALOG_REBUILD_OUTPUT;
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const count = Array.isArray(payload.offers) ? payload.offers.length : 0;
          const invalid = (payload.offers || []).filter((offer) => !offer.totalRub || !Array.isArray(offer.images) || offer.images.length < 4);
          console.log(JSON.stringify({ market: payload.market, count, invalid: invalid.length, report: payload.report }, null, 2));
          if (count < 250) throw new Error(`market_under_250_${payload.market}_${count}`);
          if (invalid.length) throw new Error(`market_invalid_offers_${payload.market}_${invalid.length}`);
          NODE
      - name: Upload completed market
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-rebuild-${{ matrix.market }}
          path: catalog-rebuild-${{ matrix.market }}.json
          if-no-files-found: error
          retention-days: 3
      - name: Market summary
        if: always()
        run: |
          if [ -s "$CATALOG_REBUILD_OUTPUT" ]; then
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT,"utf8"));console.log(`### ${p.market}\n- Проверено: ${(p.offers||[]).length}/250\n- Источники: ${JSON.stringify(p.report?.publicBySource||{})}\n- Попытки: ${JSON.stringify((p.report?.attempts||[]).map(x=>({attempt:x.attempt,added:x.added,accumulated:x.accumulated,stop:x.childStopReason})))}\n- Причина остановки: ${p.stopReason||p.report?.stopReason||"unknown"}`)' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Audit and atomically publish 7 × 250
    if: always()
    needs: [validate, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-rebuild
      CATALOG_REBUILD_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
      CATALOG_REBUILD_TARGET: "250"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "4"
      CATALOG_REBUILD_MIN_SPEC_SCORE: "1"
      CATALOG_MIN_KNOWLEDGE_RECORDS: "6800"
      CATALOG_BUSINESS_AUDIT_REPORT: catalog-business-audit-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-fresh-publish-report.json
      CATALOG_INDEX_WRITE_CONCURRENCY: "10"
      CATALOG_GROW_ONLY_MARKETS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all seven completed markets
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-rebuild-*
          path: catalog-rebuild
          merge-multiple: true
      - name: Require seven complete 250-offer artifacts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const markets = ['korea','china','japan','uae','europe','georgia','kyrgyzstan'];
          const summary = {};
          for (const market of markets) {
            const file = `catalog-rebuild/catalog-rebuild-${market}.json`;
            if (!fs.existsSync(file)) throw new Error(`missing_market_artifact_${market}`);
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            const count = Array.isArray(payload.offers) ? payload.offers.length : 0;
            summary[market] = count;
            if (count < 250) throw new Error(`market_under_250_${market}_${count}`);
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Audit CRM profiles, knowledge, customs and utilization fee
        id: business_audit
        run: npx tsx scripts/catalog-business-audit.mjs
      - name: Atomically publish exactly 250 per market
        if: steps.business_audit.outputs.publication_safe == 'true'
        run: npx tsx scripts/catalog-publish-fresh.mjs
      - name: Require published 7 × 250 manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT, 'utf8'));
          const markets = ['korea','china','japan','uae','europe','georgia','kyrgyzstan'];
          for (const market of markets) {
            if (Number(report.byMarket?.[market] || 0) !== 250) throw new Error(`published_market_not_250_${market}_${report.byMarket?.[market] || 0}`);
          }
          if (!report.generationId) throw new Error('published_generation_missing');
          if (Number(report.total || 0) !== 1750) throw new Error(`published_total_not_1750_${report.total || 0}`);
          console.log(JSON.stringify({ generationId: report.generationId, total: report.total, byMarket: report.byMarket }, null, 2));
          NODE
      - name: Upload publication and calculation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-stable-seven-market-reports
          path: |
            catalog-business-audit-report.json
            catalog-fresh-publish-report.json
          if-no-files-found: warn
          retention-days: 14
