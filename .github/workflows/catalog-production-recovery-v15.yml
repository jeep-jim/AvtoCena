name: Catalog source-scale daily
run-name: Catalog 7 markets · 3 sources × 1000 cars · ${{ github.sha }}

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-production-recovery-v15.yml
      - apps/web/lib/catalog/**
      - packages/engine/src/calculation/**
      - data/catalog/vehicle-knowledge/**
      - data/catalog/power-reference/**
      - scripts/catalog-sync-vehicle-models.mjs
      - scripts/catalog-sync-vehicle-knowledge-seed.mjs
      - scripts/catalog-build-vehicle-variants.mjs
      - scripts/catalog-build-power-knowledge.mjs
      - scripts/catalog-audit-vehicle-knowledge.mjs
      - scripts/catalog-probe-source-shard.mjs
      - scripts/catalog-rebuild-source-shard.mjs
      - scripts/catalog-validate-source-scale.mjs
      - scripts/catalog-publish-source-scale.mjs

permissions:
  contents: read

concurrency:
  group: catalog-source-scale-daily
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source-scale pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate scripts and types
        run: |
          node --check scripts/catalog-sync-vehicle-models.mjs
          node --check scripts/catalog-sync-vehicle-knowledge-seed.mjs
          node --check scripts/catalog-build-vehicle-variants.mjs
          node --check scripts/catalog-build-power-knowledge.mjs
          node --check scripts/catalog-audit-vehicle-knowledge.mjs
          node --check scripts/catalog-probe-source-shard.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-validate-source-scale.mjs
          node --check scripts/catalog-publish-source-scale.mjs
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm --workspace=@avtocena/engine exec tsc -- --noEmit

  knowledge:
    name: Rebuild and audit vehicle knowledge
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      VEHICLE_KNOWLEDGE_CHUNK_SIZE: "250"
      VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: "1990"
      CATALOG_VEHICLE_KNOWLEDGE_MIN_MODELS: "5000"
      CATALOG_VEHICLE_KNOWLEDGE_MIN_RETAINED_RATIO: "0.85"
      CATALOG_VEHICLE_KNOWLEDGE_AUDIT_OUTPUT: catalog-vehicle-knowledge-audit.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Object Storage credentials
        shell: bash
        run: |
          if [ -z "$YC_OBJECT_STORAGE_BUCKET" ] || [ -z "$YC_OBJECT_STORAGE_ACCESS_KEY_ID" ] || [ -z "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY" ]; then
            echo "Object Storage credentials are required for the production knowledge gate."
            exit 78
          fi
      - name: Sync complete vehicle model knowledge
        run: timeout --signal=TERM --kill-after=60s 1800s npx tsx scripts/catalog-sync-vehicle-models.mjs
      - name: Apply protected manual knowledge seed
        run: timeout --signal=TERM --kill-after=60s 1200s npx tsx scripts/catalog-sync-vehicle-knowledge-seed.mjs
      - name: Build trusted vehicle variants from retained catalog evidence
        run: timeout --signal=TERM --kill-after=60s 1200s npx tsx scripts/catalog-build-vehicle-variants.mjs
      - name: Build power knowledge from exact multi-source evidence
        run: timeout --signal=TERM --kill-after=60s 1200s npx tsx scripts/catalog-build-power-knowledge.mjs
      - name: Require healthy vehicle knowledge
        run: timeout --signal=TERM --kill-after=60s 600s npx tsx scripts/catalog-audit-vehicle-knowledge.mjs
      - name: Write vehicle knowledge summary
        if: always()
        shell: bash
        run: |
          echo "### Vehicle knowledge" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$CATALOG_VEHICLE_KNOWLEDGE_AUDIT_OUTPUT" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$CATALOG_VEHICLE_KNOWLEDGE_AUDIT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit report was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload vehicle knowledge audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-vehicle-knowledge-audit
          path: catalog-vehicle-knowledge-audit.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

  collect:
    name: Collect ${{ matrix.market }} shard ${{ matrix.shard }}
    needs: [validate, knowledge]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        market: [korea, china, japan, uae, europe, georgia, kyrgyzstan]
        shard: [0, 1, 2]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "3"
      CATALOG_PROBE_TIMEOUT_MS: "15000"
      CATALOG_PROBE_ATTEMPTS: "2"
      CATALOG_PROBE_CONCURRENCY: "8"
      CATALOG_PROBE_OUTPUT: catalog-probe-${{ matrix.market }}-${{ matrix.shard }}.json
      CATALOG_REBUILD_TARGET_PER_SOURCE: "1000"
      CATALOG_REBUILD_TARGET_PER_MARKET: "3000"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "300"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "9000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "4"
      CATALOG_OFFER_RETENTION_MS: "259200000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "8"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_COLLECTION_IMAGE_LIMIT: "30"
      CATALOG_GALLERY_FAST_PATH: "false"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "100"
      CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
      CATALOG_PRIORITY_MAX_POWER_HP: "160"
      CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
      CATALOG_SOURCE_TIMEOUT_MS: "18000"
      CATALOG_IMAGE_TIMEOUT_MS: "12000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "6"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "16"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "6"
      CATALOG_REBUILD_CHECKPOINT_EVERY: "25"
      CATALOG_REBUILD_TIME_LIMIT_MS: "3000000"
      CATALOG_ENCAR_DIRECT_PAGE_SIZE: "50"
      CATALOG_ENCAR_DIRECT_LIST_RPM: "30"
      CATALOG_ENCAR_DIRECT_DETAIL_RPM: "120"
      CATALOG_ENCAR_DIRECT_IMAGE_RPM: "120"
      CATALOG_CHE168_GLOBAL_PAGE_SIZE: "64"
      CATALOG_CHE168_GLOBAL_MAX_BRANDS: "64"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe every registered source in this shard
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsx scripts/catalog-probe-source-shard.mjs
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect listings, calculations and progressive galleries
        id: collect_step
        continue-on-error: true
        env:
          CATALOG_REBUILD_SOURCE_IDS: ${{ steps.probe.outputs.source_ids }}
        shell: bash
        run: |
          set +e
          status=0
          if [ -z "$YC_OBJECT_STORAGE_BUCKET" ] || [ -z "$YC_OBJECT_STORAGE_ACCESS_KEY_ID" ] || [ -z "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY" ]; then
            status=78
          else
            timeout --signal=TERM --kill-after=120s 3300s npx tsx scripts/catalog-rebuild-source-shard.mjs
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ ! -s "$CATALOG_REBUILD_OUTPUT" ]; then
            export CATALOG_COLLECT_EXIT_CODE="$status"
            node <<'NODE'
          const fs = require('fs');
          const market = String(process.env.CATALOG_REBUILD_MARKET || 'unknown');
          const shardIndex = Number(process.env.CATALOG_REBUILD_SHARD_INDEX || 0);
          const shardCount = Number(process.env.CATALOG_REBUILD_SHARD_COUNT || 3);
          const generatedAt = new Date().toISOString();
          const exitCode = Number(process.env.CATALOG_COLLECT_EXIT_CODE || 1);
          const stopReason = `safe_fallback_exit_${exitCode}`;
          fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT, JSON.stringify({
            version: 37, market, shardIndex, shardCount, generatedAt,
            targetPerSource: Number(process.env.CATALOG_REBUILD_TARGET_PER_SOURCE || 1000),
            minimumMarketTarget: Number(process.env.CATALOG_REBUILD_TARGET_PER_MARKET || 3000),
            count: 0, sourceIds: [], liveSourceIds: [], retentionSourceIds: [], partial: true, stopReason,
            report: { version: 37, market, shardIndex, shardCount, saved: 0,
              sourceErrors: [{ stage: 'workflow_safe_fallback', error: `collector_exit_${exitCode}` }],
              rejectionReasons: {}, publicBySource: {}, freshBySource: {}, restoredBySource: {}, sources: [], stopReason, generatedAt },
            offers: [],
          }, null, 2));
          NODE
          fi
          exit 0
      - name: Shard summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = process.env.CATALOG_REBUILD_OUTPUT;
          if (!fs.existsSync(file)) process.exit(0);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const summary = {
            market: payload.market, shard: payload.shardIndex,
            count: Array.isArray(payload.offers) ? payload.offers.length : 0,
            live: payload.liveSourceIds, bySource: payload.report?.publicBySource,
            imageStats: payload.report?.imageStats, galleriesAccumulated: payload.report?.galleriesAccumulated,
            detailSuccessBySource: payload.report?.detailSuccessBySource,
            detailDeferredBySource: payload.report?.detailDeferredBySource,
            stop: payload.stopReason,
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${summary.market} shard ${summary.shard}\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\`\n`);
          NODE
      - name: Upload source diagnostics and verified offers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}
          path: |
            catalog-probe-${{ matrix.market }}-${{ matrix.shard }}.json
            catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 1

  publish:
    name: Publish and require a new seven-market generation
    needs: [validate, knowledge, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-rebuild
      CATALOG_REBUILD_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
      CATALOG_REBUILD_TARGET_PER_SOURCE: "1000"
      CATALOG_PUBLISH_TARGET_PER_MARKET: "3000"
      CATALOG_PUBLISH_MAX_PER_MARKET: "30000"
      CATALOG_OFFER_RETENTION_MS: "259200000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "8"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
      CATALOG_PRIORITY_MAX_POWER_HP: "160"
      CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
      CATALOG_INDEX_WRITE_CONCURRENCY: "16"
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "24"
      CATALOG_PUBLISH_MIN_PRODUCTIVE_SOURCES: "3"
      CATALOG_PUBLISH_MIN_FRESH_BY_MARKET: '{"korea":3,"china":3,"japan":3,"uae":3,"europe":3,"georgia":3,"kyrgyzstan":3}'
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-source-scale-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-source-scale-publish-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download available source shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-rebuild-*
          path: catalog-rebuild
          merge-multiple: true
      - name: Audit calculations, customs, utilization fee and galleries
        continue-on-error: true
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish verified offers with three-day retention
        id: publish_step
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          if [ -z "$YC_OBJECT_STORAGE_BUCKET" ] || [ -z "$YC_OBJECT_STORAGE_ACCESS_KEY_ID" ] || [ -z "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY" ]; then
            status=78
          else
            timeout --signal=TERM --kill-after=120s 4800s npx tsx scripts/catalog-publish-source-scale.mjs
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ ! -s "$CATALOG_REBUILD_PUBLISH_REPORT" ]; then
            export CATALOG_PUBLISH_EXIT_CODE="$status"
            node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT, JSON.stringify({
            version: 37, mode: 'previous_manifest_preserved', publishedAt: new Date().toISOString(), published: false,
            publicationError: `publisher_exit_${Number(process.env.CATALOG_PUBLISH_EXIT_CODE || 1)}`,
            generationId: null, previousManifestPreserved: true, total: 0, byMarket: {}, byMarketAndSource: {},
            marketsBelowTarget: ['korea','china','japan','uae','europe','georgia','kyrgyzstan'], marketQuality: {},
          }, null, 2));
          NODE
          fi
          exit 0
      - name: Require newly published generation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = process.env.CATALOG_REBUILD_PUBLISH_REPORT;
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const markets = ['korea','china','japan','uae','europe','georgia','kyrgyzstan'];
          const missing = markets.filter((market) => !(Number(report.byMarket?.[market] || 0) > 0));
          const imageStats = Object.fromEntries(markets.map((market) => {
            const quality = report.marketQuality?.[market] || {};
            return [market, {
              minimum: Number(quality.minimumImages || 0),
              maximum: Number(quality.maximumImages || 0),
              average: Number(quality.averageImages || 0),
              preferredShare: Number(quality.preferredImagesShare || 0),
            }];
          }));
          const state = {
            published: report.published === true,
            generationId: report.generationId || null,
            total: Number(report.total || 0),
            byMarket: report.byMarket || {},
            byMarketAndSource: report.byMarketAndSource || {},
            calculatedShare: Object.fromEntries(markets.map((market) => [market, report.marketQuality?.[market]?.calculatedShare ?? null])),
            imageStats,
            missing,
            marketsBelowTarget: report.marketsBelowTarget || [],
            publicationError: report.publicationError || '',
            publisherExitCode: '${{ steps.publish_step.outputs.exit_code || 'unknown' }}',
          };
          console.log(JSON.stringify(state, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Catalog publication\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n`);
          if (!state.published || !state.generationId || state.total <= 0 || missing.length) {
            console.error(`catalog_new_generation_required:${JSON.stringify(state)}`);
            process.exit(1);
          }
          NODE
      - name: Run production catalog smoke checks
        continue-on-error: true
        run: npm run catalog:smoke
      - name: Upload catalog reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-source-scale-reports
          path: |
            catalog-source-scale-validation-report.json
            catalog-source-scale-publish-report.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

  health:
    name: Catalog health summary
    if: always()
    needs: [validate, knowledge, collect, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful knowledge and publication jobs
        shell: bash
        run: |
          echo "### Catalog workflow completed" >> "$GITHUB_STEP_SUMMARY"
          echo "validate: ${{ needs.validate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "knowledge: ${{ needs.knowledge.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "collect: ${{ needs.collect.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.validate.result }}" != "success" ] || [ "${{ needs.knowledge.result }}" != "success" ] || [ "${{ needs.publish.result }}" != "success" ]; then
            echo "A healthy knowledge base and a new production generation were not confirmed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "A healthy vehicle knowledge base and a new seven-market generation were published and verified." >> "$GITHUB_STEP_SUMMARY"
