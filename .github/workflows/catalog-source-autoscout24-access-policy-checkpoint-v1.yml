name: Catalog source qualification · AutoScout24 access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/autoscout24-access-field-audit-v1-20260904
    paths:
      - ".github/workflows/catalog-source-autoscout24-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-autoscout24-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-autoscout24-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply AutoScout24 lead-only access-policy decision
        run: node scripts/catalog-source-autoscout24-access-policy-checkpoint-v1.mjs
      - name: Verify safety and Japan pause
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const ledger = JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const roadmap = fs.readFileSync('roadmap.md','utf8');
          const row = registry.candidates.find((candidate) => candidate.sourceId === 'autoscout_europe_open');
          const decision = ledger.decisions.find((candidate) => candidate.sourceId === 'autoscout_europe_open');
          if (!row || row.class !== 'lead_only' || row.publishAllowed !== false) throw new Error('AutoScout24 registry decision invalid');
          if (!decision || decision.class !== 'lead_only' || decision.publishAllowed !== false) throw new Error('AutoScout24 ledger decision invalid');
          if (!/Japan remains paused/i.test(registry.next || '')) throw new Error('Japan pause missing');
          if (!roadmap.includes('## 40.32 — AutoScout24 Europe: official terms block automated query and commercial database reuse')) throw new Error('roadmap 40.32 missing');
          if ((registry.candidates || []).some((candidate) => candidate.publishAllowed === true)) throw new Error('unexpected publishAllowed=true');
          if (registry.productionWrites !== false || ledger.productionWrites !== false || ledger.publishAllowedMutations !== false) throw new Error('safety flag changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then
            echo "Checkpoint already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Classify AutoScout24 lead-only by access policy"
          git push origin HEAD:chore/autoscout24-access-field-audit-v1-20260904
