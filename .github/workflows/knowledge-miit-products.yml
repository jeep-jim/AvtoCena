name: Knowledge CORE MIIT product batches

on:
  push:
    branches:
      - fix/catalog-core-recovery-20260822
    paths:
      - scripts/catalog-download-miit-products.mjs
      - .github/workflows/knowledge-miit-products.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-core-source-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-core-recovery-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download MIIT product batches 328-410
        env:
          KNOWLEDGE_OUTPUT_ROOT: data/catalog/knowledge-source-snapshots/generated
          KNOWLEDGE_MIIT_FIRST_BATCH: "328"
          KNOWLEDGE_MIIT_LAST_BATCH: "410"
          KNOWLEDGE_MIIT_PAGE_SIZE: "1000"
          KNOWLEDGE_MIIT_MAX_PAGES_PER_BATCH: "100"
        run: node scripts/catalog-download-miit-products.mjs
      - name: Validate MIIT result
        run: |
          node --check scripts/catalog-download-miit-products.mjs
          test -s data/catalog/knowledge-source-snapshots/generated/miit/products-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/catalog/knowledge-source-snapshots/generated/miit/products-manifest.json','utf8'));
          console.log(JSON.stringify(m,null,2));
          if(Number(m.counts?.products||0)===0 && Number(m.counts?.blockedBatches||0)===0) throw new Error('MIIT returned neither products nor an explicit access block');
          NODE
      - name: Commit MIIT source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/catalog-core-recovery-20260822
          git rebase origin/fix/catalog-core-recovery-20260822
          git add data/catalog/knowledge-source-snapshots/generated/miit/products data/catalog/knowledge-source-snapshots/generated/miit/products-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Snapshot MIIT public vehicle product batches"
          git push origin HEAD:fix/catalog-core-recovery-20260822
