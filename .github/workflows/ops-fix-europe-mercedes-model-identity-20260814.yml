name: Ops · Fix Europe Mercedes model identity 20260814

on:
  push:
    branches:
      - fix/europe-mercedes-model-identity-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/europe-mercedes-model-identity-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply model identity patch
        run: python scripts/ops-fix-europe-mercedes-model-identity-20260814.py
      - name: Focused model normalization test
        run: node --import tsx --test tests/open-source-normalizer.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build --workspace @avtocena/web
      - name: Commit code patch
        shell: bash
        run: |
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"
          git add apps/web/lib/catalog/open-source-normalizer.ts apps/web/lib/catalog/autoscout-exact-source-base.ts apps/web/lib/catalog/mobile-de-exact-source.ts apps/web/lib/catalog/otomoto-exact-source.ts tests/open-source-normalizer.test.ts
          if git diff --cached --quiet; then
            echo "No code changes"
            exit 0
          fi
          git commit -m "Fix Mercedes model identity across Europe sources"
          git push origin HEAD:fix/europe-mercedes-model-identity-20260814
