name: Audit offer route latency 20260812 r2

on:
  push:
    branches:
      - audit/offer-route-latency-20260812-r2
    paths:
      - .github/workflows/audit-offer-route-latency-20260812-r2.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure public navigation and offer route latency
        shell: bash
        run: |
          set -euo pipefail
          base='https://avtocena.com'
          for path in '/' '/cars' '/cars?market=korea' '/cars?market=china' '/cars?market=japan' '/cars?market=uae'; do
            for attempt in 1 2 3; do
              curl -sS -o /dev/null --max-time 30 -w "PUBLIC_ROUTE path=$path attempt=$attempt http=%{http_code} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\n" "$base$path"
            done
          done

          : > /tmp/live-ids.txt
          for market in korea china japan uae; do
            api="$base/api/catalog/search?market=$market&pageSize=2"
            for attempt in 1 2 3; do
              curl -sS -o /tmp/api.json --max-time 30 -w "SEARCH_API market=$market attempt=$attempt http=%{http_code} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\n" "$api"
            done
            jq -r --arg m "$market" '.items[]? | [$m,.id] | @tsv' /tmp/api.json >> /tmp/live-ids.txt
          done

          while IFS=$'\t' read -r market id; do
            [ -n "$id" ] || continue
            for attempt in 1 2 3; do
              curl -sS -o /dev/null --max-time 30 -w "OFFER_ROUTE market=$market id=$id attempt=$attempt http=%{http_code} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\n" "$base/cars/offer/$id"
            done
          done < /tmp/live-ids.txt

          OFFER_IDS="$(cut -f2 /tmp/live-ids.txt | paste -sd, -)" node --import tsx --input-type=module <<'NODE'
          const { getOffer } = await import('./apps/web/lib/catalog/storage.ts');
          const { enrichOfferForDisplay } = await import('./apps/web/lib/catalog/display-enrichment.ts');
          const ids = String(process.env.OFFER_IDS || '').split(',').filter(Boolean).slice(0, 8);
          for (const id of ids) {
            for (let attempt = 1; attempt <= 2; attempt++) {
              const t0 = performance.now();
              const offer = await getOffer(id);
              const t1 = performance.now();
              const enriched = offer ? await enrichOfferForDisplay(offer) : null;
              const t2 = performance.now();
              console.log(JSON.stringify({event:'direct_offer_timing',id,attempt,found:Boolean(offer),getOfferMs:Number((t1-t0).toFixed(1)),enrichMs:Number((t2-t1).toFixed(1)),totalMs:Number((t2-t0).toFixed(1)),market:enriched?.market,make:enriched?.make,model:enriched?.model}));
            }
          }
          NODE
