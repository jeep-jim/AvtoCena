name: Regcloud — prepare current catalog pages
on:
  schedule:
    # Refresh date-sensitive derived pages after Krasnoyarsk midnight.
    - cron: '5 17 * * *'
  workflow_run:
    workflows: [Catalog refresh china, Catalog refresh korea, Catalog refresh europe, Catalog refresh uae, Catalog refresh georgia, Catalog refresh green]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-overview.json']
permissions:
  contents: read

concurrency:
  group: regcloud-overview-read-model
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
  YC_OBJECT_STORAGE_REGION: us-east-1
  YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_OVERVIEW_CANDIDATES_PER_MARKET: "24"
  CATALOG_OVERVIEW_SKIP_READY: "true"

jobs:
  build:
    # Publication can commit before a later cursor or audit step fails. Inspect
    # the active immutable generation after every completion; never recollect.
    if: github.ref == 'refs/heads/main'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check immutable source validation
        run: node --test tests/catalog-overview-source-validation.test.mjs tests/catalog-refresh-generation-pages.test.mjs
      - name: Validate overview builder syntax
        run: node --check scripts/catalog-refresh-generation-pages.mjs
      - name: Build compact current overview read model
        env:
          CATALOG_PREPARE_EDITORIAL_HOME: 'false'
        run: npx tsx scripts/catalog-refresh-generation-pages.mjs
      - name: Verify installed editorial preparation guards offline
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-editorial-runtime.test.mjs
      - name: Resolve exact installed release and calculator
        id: installed
        timeout-minutes: 1
        run: node scripts/catalog-editorial-runtime.mjs --resolve
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.installed.outputs.release }}
          path: installed-editorial-runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: installed-editorial-runtime/package-lock.json
      - name: Install exact runtime dependencies
        timeout-minutes: 4
        working-directory: installed-editorial-runtime
        run: npm ci
      - name: Prepare current-day editorial home using installed source and immutable index
        timeout-minutes: 6
        working-directory: installed-editorial-runtime
        env:
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '60000'
          CATALOG_HOME_PHASE_TIMING: '0'
          CATALOG_STORAGE_TIMING: '0'
          CATALOG_PUBLICATION_PROGRESS: '0'
        run: |
          umask 077
          timeout --signal=TERM --kill-after=10s 300s node --import tsx ../scripts/catalog-editorial-runtime.mjs . '${{ steps.installed.outputs.release }}' '${{ steps.installed.outputs.calculation }}'
      - name: Remove private installed-runtime preparation files
        if: always()
        run: rm -rf -- installed-editorial-runtime
