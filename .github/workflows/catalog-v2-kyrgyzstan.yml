name: Catalog V3 · Kyrgyzstan · 10k
run-name: Catalog V3 · Kyrgyzstan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/kyrgyzstan"

# Automatic scheduling lives only in catalog-v3-sequential-queue.yml.
permissions:
  contents: read

jobs:
  kyrgyzstan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
      reset_cursor: true
      priority_target: "8000"
    secrets: inherit
