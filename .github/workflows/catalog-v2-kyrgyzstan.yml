name: Catalog V2 · Kyrgyzstan
run-name: Catalog V2 · Kyrgyzstan · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 11 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-kyrgyzstan.yml

# Independent daily market. 18:05 Asia/Novokuznetsk (UTC+7).
permissions:
  contents: read

jobs:
  kyrgyzstan:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
