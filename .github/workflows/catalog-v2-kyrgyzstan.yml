name: Catalog V3 · Kyrgyzstan · 10k
run-name: Catalog V3 · Kyrgyzstan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4,16 * * *"

# Twice-daily independent market refresh. Public rows are append-only between
# explicit maintenance passes, so a refresh cannot make the catalog smaller.
permissions:
  contents: read

jobs:
  kyrgyzstan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
