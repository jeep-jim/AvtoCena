name: Catalog V3 · Kyrgyzstan · 10k
run-name: Catalog V3 · Kyrgyzstan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

# Daily independent market refresh. Each successful run keeps recently seen
# offers and adds newly discovered unique offers.
permissions:
  contents: read

jobs:
  kyrgyzstan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
