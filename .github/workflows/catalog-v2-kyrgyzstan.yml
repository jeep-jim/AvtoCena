name: Catalog V3 · Kyrgyzstan · 10k
run-name: Catalog V3 · Kyrgyzstan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/kyrgyzstan"
  schedule:
    - cron: "17 4 * * *"

# Daily independent market refresh. Existing rows remain only inside the
# configured three-day window; expired and policy-rejected cards are removed.
permissions:
  contents: read

jobs:
  kyrgyzstan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
