name: Catalog V3 · Kyrgyzstan · 10k
run-name: Catalog V3 · Kyrgyzstan · 10k · ${{ github.sha }}

on:
  workflow_dispatch:

# Automatic schedule and push triggers are intentionally disabled.
# Run this market only from the Actions UI when needed.
permissions:
  contents: read

jobs:
  kyrgyzstan:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
