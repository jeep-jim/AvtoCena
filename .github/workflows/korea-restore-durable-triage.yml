        node --test "$RUNNER_TEMP/restore-triage/tests/triage.test.mjs"
    - name: Read only seven fixed metadata objects within two minutes
      timeout-minutes: 3
      env:
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        NODE_OPTIONS: --max-old-space-size=256
      run: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=5s 115s node "$RUNNER_TEMP/restore-triage/scripts/korea-restore-triage.mjs"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: korea-restore-durable-triage-44056968938
        path: korea-restore-durable-triage.json
        retention-days: 14
