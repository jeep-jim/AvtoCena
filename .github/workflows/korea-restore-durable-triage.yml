name: Read fixed Korea restore durable boundaries
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/korea-restore-durable-triage.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: korea-restore-durable-triage
  cancel-in-progress: false
jobs:
  triage:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Read durable boundaries after
      Korea restore 44056968938')
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 6
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Verify terminal restore and successful original collection
      uses: actions/github-script@v7
      with:
        script: |
          const assert=require('assert/strict'); const {owner,repo}=context.repo;
          const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:44056968938});
          assert.equal(r.head_sha,'32fe1c71a4d102c677a1f67686f2190d4102f086');assert.equal(r.run_attempt,1);assert.equal(r.status,'completed');assert.equal(r.conclusion,'failure');assert.equal(r.path,'.github/workflows/prepare-saved-encar-reconciliation-only.yml');assert.equal(r.head_repository.full_name,`${owner}/${repo}`);
          const {data:j}=await github.rest.actions.getJobForWorkflowRun({owner,repo,job_id:133948715566});assert.equal(j.run_id,44056968938);assert.equal(j.head_sha,r.head_sha);assert.ok(['failure','timed_out'].includes(j.conclusion));assert.ok(j.steps.some(s=>s.name==='Restore saved source, archive and verify prepare-only checkpoint'&&['failure','timed_out'].includes(s.conclusion)));
          const {data:s}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:43989797288});assert.equal(s.head_sha,'e51f589f892babdcd6c1251e1ebb06c6d7c91e6d');assert.equal(s.run_attempt,1);assert.equal(s.status,'completed');assert.equal(s.head_repository.full_name,`${owner}/${repo}`);
          const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{owner,repo,run_id:43989797288,attempt_number:1,per_page:100});for(const id of[133727443324,133845674226])assert.equal(jobs.find(j=>j.id===id)?.conclusion,'success');
    - name: Materialize exact reviewed code and offline tests before secrets
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/restore-triage/scripts" "$RUNNER_TEMP/restore-triage/tests"
        cat > "$RUNNER_TEMP/restore-triage/scripts/triage-sign-read.mjs" <<'FILE_da8f107453658b85'
        import{createHash,createHmac}from'node:crypto';const fail=c=>{throw Error(c);},sha=x=>createHash('sha256').update(x).digest('hex'),hmac=(k,v)=>createHmac('sha256',k).update(v).digest();
        export function signRead(url,method,env,extra={},now=new Date()){
         if(!['GET','HEAD'].includes(method)||url.protocol!=='https:'||url.search||url.username||url.password)fail('range_sign_inputs');
         const namesExtra=Object.keys(extra);if(namesExtra.some(k=>!['range','if-match'].includes(k)))fail('range_sign_headers');
         if(!env.YC_OBJECT_STORAGE_ACCESS_KEY_ID||!env.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY||!env.YC_OBJECT_STORAGE_REGION)fail('range_sign_credentials');
         const stamp=now.toISOString().replace(/[:-]|\.\d{3}/g,''),day=stamp.slice(0,8),scope=`${day}/${env.YC_OBJECT_STORAGE_REGION}/s3/aws4_request`,payload=sha('');
         const headers={host:url.host,'x-amz-date':stamp,'x-amz-content-sha256':payload,...extra},names=Object.keys(headers).sort();
         const canonical=[method,url.pathname,'',names.map(k=>`${k}:${headers[k]}\n`).join(''),names.join(';'),payload].join('\n');
