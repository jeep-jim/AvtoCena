        export async function triage({fetchImpl,env,deadlineMs=110000}){assert.ok(deadlineMs>0&&deadlineMs<=110000);const started=Date.now(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),deadlineMs);let requests=0;const rows=[];
        async function read(name){const key=KEYS[name],url=new URL('https://s3.regru.cloud/avtocena-staging-8120751/migration-staging/full-20261011/'+key);assert.ok(allowed(url,'GET'));assert.ok(++requests<=7);const r=await fetchImpl(url,{method:'GET',headers:signRead(url,'GET',env),redirect:'error',signal:controller.signal});const row={name,status:r.status};if(r.status===404){await r.body?.cancel();rows.push(row);if(name==='snapshot')throw Error('triage_snapshot_missing');return;}assert.equal(r.status,200,'triage_http_status');assert.ok(!r.headers.get('content-encoding')||r.headers.get('content-encoding')==='identity','triage_encoding');const cap=4*1024**2;let size=0;const chunks=[];try{const reader=r.body.getReader();for(;;){const{done,value}=await reader.read();if(done)break;size+=value.length;if(size>cap){await reader.cancel();throw Error('triage_body_bound');}chunks.push(value);}}catch(e){await r.body?.cancel().catch(()=>{});throw e;}const raw=Buffer.concat(chunks);rows.push({...row,bytes:size,bodySha256:sha(raw),etagSha256:r.headers.get('etag')?sha(r.headers.get('etag')):null,...summary(name,JSON.parse(raw.toString('utf8')))});}
        try{await read('snapshot');const names=Object.keys(KEYS).filter(x=>x!=='snapshot');let i=0;const done=await Promise.allSettled(Array.from({length:4},async()=>{while(i<names.length){const n=names[i++];await read(n);}}));const failed=done.find(x=>x.status==='rejected');if(failed)throw failed.reason;return {version:1,failedRun:44056968938,attempt:1,source:SOURCE,snapshotSha256:SNAPSHOT,rows:rows.sort((a,b)=>a.name.localeCompare(b.name)),requests,elapsedMs:Date.now()-started,publicationAcceptance:false,archiveVerified:false,supplierRequests:0,writes:0};}finally{clearTimeout(timer);controller.abort();}}
        if(process.argv[1]&&import.meta.url===pathToFileURL(process.argv[1]).href){let forbidden=0;const native=globalThis.fetch.bind(globalThis),deny=()=>{forbidden++;throw Error('triage_forbidden');};globalThis.fetch=(input,options={})=>{const u=typeof input==='string'||input instanceof URL?input:input.url,m=String(options.method||input?.method||'GET').toUpperCase();if(!allowed(u,m)||options.redirect!=='error')return deny();return native(input,options);};for(const mod of[http,https])for(const k of['request','get'])mod[k]=deny;syncBuiltinESMExports();try{const report=await triage({fetchImpl:globalThis.fetch,env:process.env});assert.equal(forbidden,0);await fs.writeFile('korea-restore-durable-triage.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));}catch{console.error(JSON.stringify({stage:'restore_durable_triage_failed',accepted:false,forbidden}));process.exitCode=1;}}
