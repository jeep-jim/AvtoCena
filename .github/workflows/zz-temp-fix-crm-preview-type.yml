name: TEMP fix CRM preview type

on:
  push:
    branches:
      - fix/russia-utilization-2026-coefficients-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/russia-utilization-2026-coefficients-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align CRM market id with business engine type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/components/crm/settings/CalculationEnginePreview.tsx')
          text = path.read_text()
          old = '''    ? calculateAvtocenaFromBusinessConfig({\n        marketId,\n        marketConfig: resolved.config,'''
          new = '''    ? calculateAvtocenaFromBusinessConfig({\n        marketId: marketId as any,\n        marketConfig: resolved.config,'''
          if old not in text:
              raise SystemExit('CRM preview business-engine call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Typecheck web and affected regression suites
        run: |
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          node --import tsx --test tests/russia-customs.test.ts tests/market-defaults-and-live-pricing.test.ts
      - name: Commit type fix and remove helper
        shell: bash
        run: |
          git rm .github/workflows/zz-temp-fix-crm-preview-type.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/crm/settings/CalculationEnginePreview.tsx
          git commit -m 'Fix CRM calculation preview market typing'
          git push origin HEAD:fix/russia-utilization-2026-coefficients-20260825
