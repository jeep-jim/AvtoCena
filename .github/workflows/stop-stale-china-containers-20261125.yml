name: Stop only unused China standby containers (free RAM)
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/stop-stale-china-containers-20261125.json']
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  retire:
    if: >-
      github.repository_id == '1289722938' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'Stop exact unused China standby containers after ingress and health verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check narrow server action syntax
        run: python3 -m py_compile scripts/regcloud-stop-stale-china-memory-20261125.py
      - name: Stop only two verified unused old China containers; preserve images/data
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -F /dev/null -T -i "$key_file" -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" -o ForwardAgent=no -o ClearAllForwardings=yes root@151.248.113.177 'python3 -I -B -' < scripts/regcloud-stop-stale-china-memory-20261125.py
