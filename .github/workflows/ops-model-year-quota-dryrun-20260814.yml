name: Ops model-year quota dry-run 20260814

on:
  push:
    branches: [ops/model-year-quota-dryrun-20260814]
    paths:
      - '.github/workflows/ops-model-year-quota-dryrun-20260814.yml'

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  RECOVERY_PREFERRED_MAX_RUB: '8000000'
  CATALOG_PUBLISH_LOCK_WAIT_MS: '7200000'
  CATALOG_GLOBAL_MODEL_CAP_DRY_RUN: '1'
  CATALOG_GLOBAL_MODEL_CAP_REPORT: 'catalog-global-model-cap-dryrun.json'

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate quota code
        run: |
          node --check scripts/catalog-enforce-global-model-cap.mjs
          node --import tsx --test tests/catalog-global-model-cap.test.ts tests/catalog-model-year-quota.test.ts
      - name: Dry-run exact model-year quota against current full seven-market catalog
        run: npx tsx scripts/catalog-enforce-global-model-cap.mjs
      - name: Print projection summary
        if: always()
        run: |
          if [ -f catalog-global-model-cap-dryrun.json ]; then
            node -e "const r=require('./catalog-global-model-cap-dryrun.json'); console.log(JSON.stringify({before:r.beforeByMarket,selected:r.selectedByMarket,byMarket:r.byMarket},null,2))"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-year-quota-dryrun-20260814
          path: catalog-global-model-cap-dryrun.json
          if-no-files-found: warn
          retention-days: 7
