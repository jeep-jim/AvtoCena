name: Dispatch Dongchedi structure probe
run-name: Dispatch Dongchedi structure probe · ${{ github.sha }}

on:
  push:
    paths:
      - .github/workflows/dispatch-dongchedi-structure-probe-20260816.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch current main read-only probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-v6-dongchedi-structure-probe.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "${code}" != "204" ]; then
            cat response.json
            echo "workflow_dispatch_failed_http_${code}" >&2
            exit 1
          fi
          echo "Dongchedi structure probe dispatched"
