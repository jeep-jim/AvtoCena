name: DIAG AutoPapa production price

on:
  pull_request:
    paths:
      - '.github/workflows/zz-diag-autopapa-price-production.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diag/autopapa-958003-production-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find latest Georgia market runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/catalog-v2-georgia.yml/runs?branch=main&per_page=5" \
            | jq '{runs:[.workflow_runs[]|{id,status,conclusion,head_sha,created_at,updated_at,html_url}]}'

      - name: Verify exact AutoPapa 958003 price through deployed Yandex recovery
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for page in $(seq 1 30); do
            json="$(curl -L --retry 2 --retry-delay 2 --max-time 90 -fsS "https://avtocena.com/api/internal/georgia-recovery-e2f913?source=autopapa&pages=1&startPage=$page")"
            count="$(jq -r '.count // 0' <<<"$json")"
            rejected="$(jq -c '.report.rejected // {}' <<<"$json")"
            echo "AUTOPAPA_PAGE page=$page count=$count rejected=$rejected"
            if jq -e '.offers[]? | select((.sourceOfferId|tostring)=="958003")' <<<"$json" >/dev/null; then
              row="$(jq -c '.offers[] | select((.sourceOfferId|tostring)=="958003") | {id,sourceOfferId,sourcePrice,sourceCurrency,year,mileageKm,engineCc,powerHp,calculationStatus,totalRub,detailPriceVerified:.operational.raw.autoPapaDetailPriceVerified,detailPriceUsd:.operational.raw.autoPapaDetailPriceUsd,listPriceUsd:.operational.raw.autoPapaListPriceUsd,sourceUrl:.operational.sourceUrl}' <<<"$json")"
              echo "AUTOPAPA_958003 $row"
              jq -e '.sourcePrice == 4938 and .sourceCurrency == "USD" and .operational.raw.autoPapaDetailPriceVerified == true and .operational.raw.autoPapaDetailPriceUsd == 4938' <<<"$(jq -c '.offers[] | select((.sourceOfferId|tostring)=="958003")' <<<"$json")" >/dev/null
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo 'AUTOPAPA_958003_NOT_FOUND_IN_FIRST_30_PAGES'
          fi
