name: Review catalog result counter
on:
  push:
    branches: [fix/catalog-result-count-20260912]
    paths:
      - '.github/workflows/review-catalog-result-count.yml'
      - 'scripts/apply-catalog-result-count.py'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow guarded edits on review branch
        run: python3 scripts/apply-catalog-result-count.py
      - run: npm ci
      - run: npm run typecheck
      - name: Test counts and preserve previous power UI contracts
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-count-format.test.ts tests/recycling-power-ui.test.ts
      - name: Commit verified source changes only to review branch
        run: |
          git diff --check
          git diff --stat
          git diff > artifacts/catalog-result-count/applied.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/web/app/(public)/cars/page.tsx' apps/web/components/home/HomePageClient.tsx
          git rm scripts/apply-catalog-result-count.py .github/workflows/review-catalog-result-count.yml
          git commit -m 'fix(catalog): show result count on mobile with homepage dot and grouped numbers'
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-result-count-review
          path: artifacts/catalog-result-count
          retention-days: 7
