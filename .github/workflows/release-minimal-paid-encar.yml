      - name: Deploy with rollback and resource measurements
        id: deploy_acceptance
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/release-browser/node_modules/playwright/index.mjs
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          # Measure the retained version on the same server before starting the candidate.
          # Only response timings are logged. Candidate acceptance still uses its frozen budgets.
          ssh "${ssh_opts[@]}" root@151.248.113.177 'python3 -' <<'MEASURE_RETAINED'
          import json, time, urllib.request
          for sample in range(4):
              start = time.monotonic()
              with urllib.request.urlopen('https://avtocena.com/', timeout=30) as response:
                  size = len(response.read())
                  print(json.dumps({'version': 'retained', 'sample': sample + 1,
                                    'status': response.status, 'bytes': size,
                                    'seconds': round(time.monotonic() - start, 4)}), flush=True)
          MEASURE_RETAINED
          remote_dir="/opt/avtocena/releases/$GITHUB_SHA"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'"
          scp "${ssh_opts[@]}" scripts/regcloud-deploy-production.sh scripts/regcloud-performance-gate.py scripts/regcloud-resource-sampler.py scripts/regcloud-browser-verdict.py "root@151.248.113.177:$remote_dir/"
          scp "${ssh_opts[@]}" docs/operations/2026-11-11-accepted-speed-baseline.json "root@151.248.113.177:$remote_dir/accepted-speed-baseline.json"
          # Correlate slow requests with CPU pressure and memory on this candidate.
          # Only cgroup counters are recorded. No requests, headers or process arguments.
          ssh "${ssh_opts[@]}" root@151.248.113.177 "python3 - '$GITHUB_SHA'" <<'SAMPLE' > "$RUNNER_TEMP/encar-resource-samples.log" &
          import datetime, json, pathlib, re, subprocess, sys, time
          sha = sys.argv[1]
          assert re.fullmatch('[0-9a-f]{40}', sha)
          name = 'avtocena-release-' + sha[:12]
          for _ in range(900):
              try:
                  pid = int(subprocess.check_output(['docker','inspect','-f','{{.State.Pid}}',name], stderr=subprocess.DEVNULL))
                  if pid:
                      groups = pathlib.Path(f'/proc/{pid}/cgroup').read_text().splitlines()
                      path = next(line[3:] for line in groups if line.startswith('0::'))
                      group = pathlib.Path('/sys/fs/cgroup') / path.lstrip('/')
                      fields = dict(line.split() for line in (group/'cpu.stat').read_text().splitlines())
                      print(json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            'cpuUsec':int(fields['usage_usec']), 'throttledUsec':int(fields['throttled_usec']),
                            'memoryBytes':int((group/'memory.current').read_text())}), flush=True)
              except (subprocess.CalledProcessError, OSError, ValueError, KeyError, StopIteration):
                  pass
              time.sleep(3)
          SAMPLE
          sampler_pid=$!
          deploy_status=0
          bash scripts/regcloud-deploy-with-browser.sh "$key_file" "$GITHUB_SHA" "$(node scripts/catalog-calculation-version.mjs)" "$RELEASE_PREPARATION_MARKETS" || deploy_status=$?
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          if [ "$deploy_status" != 0 ]; then
            echo "Candidate resource readings before rollback"
            tail -65 "$RUNNER_TEMP/encar-resource-samples.log"
          fi
          exit "$deploy_status"
