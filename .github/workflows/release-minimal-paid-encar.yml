      - name: Install exact controller-only selector readiness verifier
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prepare-paid-selector-readiness.mjs" <<'PAID_SELECTOR_HELPER'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {fileURLToPath, pathToFileURL} from 'node:url';
          
          export const CALCULATOR = '4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90';
          const LOCAL_MARKETS = ['china', 'korea', 'uae', 'europe', 'georgia'];
          const digest = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          function partitionIdentities(index, market) {
            const hash = createHash('sha256'), ids = new Set();
            for (const [kind, rows] of [['rows', index.rows], ['otherRows', index.otherRows || []]]) {
              hash.update(kind + '\0');
              for (const row of rows) {
                assert.equal(row[0], market, `selector_identity_market:${market}`);
                const id = row[5]?.id;
                assert.ok(typeof id === 'string' && id && !ids.has(id), `selector_identity_invalid:${market}`);
                ids.add(id); hash.update(JSON.stringify(id) + '\0');
              }
            }
            return hash.digest('hex');
          }
          
          /** Controller-only task. Use candidate implementations; never copy app logic. */
          export async function ensurePaidSelectorReadiness({storage, backfill, readCompressedSelector,
            selectorDirectory, indexDigest, expectedSource, verifyOnly = false, verifyPrices = false,
            budgetPricingFingerprint, readPreparedBudgetPrices, progress = () => {}}) {
            assert.match(expectedSource, /^[a-f0-9]{40}$/, 'expected_source_required');
            if (verifyPrices) {
              assert.equal(verifyOnly, true, 'price_readback_requires_verify_only');
              assert.equal(typeof budgetPricingFingerprint, 'function', 'candidate_price_fingerprint_required');
              assert.equal(typeof readPreparedBudgetPrices, 'function', 'candidate_prepared_price_reader_required');
            }
            assert.equal(storage.driver, 'object', 'object_storage_required');
            assert.match(indexDigest, /^[a-f0-9]{64}$/, 'private_index_digest_required');
            assert.match(selectorDirectory, /^budget-markets-v7\/[a-f0-9]{64}$/, 'exact_v7_directory_required');
            const readMeta = key => storage.readJsonWithMeta(key, null);
            const manifestKey = 'catalog/manifest.json';
            const controlsKey = 'catalog/operations/collection-controls-v1.json';
            const beforeManifest = await readMeta(manifestKey);
            const beforeControls = await readMeta(controlsKey);
            assert.ok(beforeManifest.found && beforeManifest.etag, 'manifest_readback_required');
            assert.ok(beforeControls.found && beforeControls.etag, 'controls_readback_required');
            const manifest = beforeManifest.value;
            assert.match(manifest?.generationId || '', /^[A-Za-z0-9_-]+$/, 'generation_required');
            assert.equal(manifest.markets?.korea?.provider, 'auto_api_encar', 'paid_korea_provider_required');
            assert.ok(manifest.markets.korea.count > 0, 'paid_korea_inventory_required');
            const entries = Object.entries(manifest.markets || {});
            assert.ok(entries.length && entries.every(([, value]) => Number.isSafeInteger(value?.count) && value.count >= 0), 'manifest_market_counts_invalid');
            const required = entries.filter(([, value]) => value.count > 0).map(([market]) => market).sort();
            assert.ok(required.every(market => LOCAL_MARKETS.includes(market)), 'nonempty_nonlocal_partition_requires_separate_preparation');
            const prefix = `catalog/generations/${manifest.generationId}/indexes/${selectorDirectory}/`;
            const readyPath = `${prefix}ready.json`;
            const sourcePrefix = `catalog/generations/${manifest.generationId}/indexes/budget-markets-v3/`;
            const sourceReadyPath = `${sourcePrefix}ready.json`;
            const sourceReady = await readMeta(sourceReadyPath);
            assert.ok(sourceReady.found && sourceReady.etag, 'persisted_source_readiness_missing');
            assert.ok([3, 4].includes(sourceReady.value?.version), 'persisted_source_readiness_version');
            assert.equal(sourceReady.value?.generationId, manifest.generationId, 'persisted_source_readiness_generation');
            assert.deepEqual(Object.keys(sourceReady.value.markets || {}).sort(), required, 'persisted_source_readiness_incomplete');
            const manifestDigest = digest(manifest), controlsDigest = digest(beforeControls.value);
            async function fence() {
              const [currentManifest, currentControls] = await Promise.all([readMeta(manifestKey), readMeta(controlsKey)]);
              assert.ok(currentManifest.found && currentManifest.etag === beforeManifest.etag && digest(currentManifest.value) === manifestDigest, 'manifest_changed_during_preparation');
              assert.ok(currentControls.found && currentControls.etag === beforeControls.etag && digest(currentControls.value) === controlsDigest, 'collection_controls_changed_during_preparation');
            }
            const originalWrite = storage.writeJson;
            const writes = [];
            storage.writeJson = async (key, value, condition) => {
              assert.equal(verifyOnly, false, 'verification_must_not_write');
              assert.ok(typeof key === 'string' && key.startsWith(prefix), 'write_outside_exact_v7_generation');
              const relative = key.slice(prefix.length);
              if (relative === 'ready.json') {
                assert.ok(condition?.ifMatch || condition?.ifNoneMatch === '*', 'readiness_requires_conditional_write');
                assert.equal(value?.version, 4, 'readiness_version');
                assert.equal(value?.generationId, manifest.generationId, 'readiness_generation');
                assert.equal(value?.encyclopediaDigest, indexDigest, 'readiness_private_index');
              } else {
                assert.match(relative, /^parts\/(china|korea|uae|europe|georgia)\/[a-f0-9]{64}\.json$/, 'selector_part_scope');
                assert.equal(condition?.ifNoneMatch, '*', 'selector_parts_must_be_immutable');
              }
              await fence();
              const result = await originalWrite.call(storage, key, value, condition);
              writes.push(relative === 'ready.json' ? 'ready' : relative.split('/')[1]);
              return result;
            };
            try {
              const prior = await readMeta(readyPath);
              progress({stage: 'selector_readiness_before', generationId: manifest.generationId, requiredMarkets: required,
                persistedMarkets: Object.keys(prior.value?.markets || {}).sort(), verifyOnly});
              if (!verifyOnly) {
                // Explicit scope selects mergeSpecificationReadiness's ETag CAS path.
                // Unscoped backfill uses create-only readiness and can leave a prior
                // Korea-only directory unchanged even after all other parts are built.
                for (const market of required) {
                  await fence();
                  await backfill([market]);
                  progress({stage: 'selector_partition_prepared', market});
                }
              }
              // Read persisted bytes directly, not the returned directory or a module cache.
              const saved = await readMeta(readyPath);
              assert.ok(saved.found && saved.etag, 'persisted_readiness_missing');
              assert.equal(saved.value?.version, 4, 'persisted_readiness_version');
              assert.equal(saved.value?.generationId, manifest.generationId, 'persisted_readiness_generation');
              assert.equal(saved.value?.encyclopediaDigest, indexDigest, 'persisted_readiness_private_index');
              assert.deepEqual(Object.keys(saved.value.markets || {}).sort(), required, 'persisted_readiness_incomplete');
              const partitions = [];
              for (const market of required) {
                const part = await readCompressedSelector(saved.value, market, name => {
                  assert.match(name, new RegExp(`^parts/${market}/[a-f0-9]{64}$`), 'read_outside_partition');
                  return storage.readJson(`${prefix}${name}.json`, null);
                });
                assert.ok(part, `persisted_selector_invalid:${market}`);
                assert.equal(part.version, 3, `selector_index_version:${market}`);
                assert.equal(part.generationId, manifest.generationId, `selector_generation:${market}`);
                for (const field of ['specificationFilterVersion', 'bodyFilterVersion', 'displayOrderVersion']) {
                  assert.equal(part[field], 1, `selector_${field}:${market}`);
                }
                assert.equal(part.rows.length + (part.otherRows?.length || 0), part.sourceRows, `selector_complete_count:${market}`);
                const sourcePart = await readCompressedSelector(sourceReady.value, market, name => {
                  assert.match(name, new RegExp(`^(?:${market}|parts/${market}/[a-f0-9]{64})$`), 'read_outside_source_partition');
                  return storage.readJson(`${sourcePrefix}${name}.json`, null);
                });
                assert.ok(sourcePart && sourcePart.version === 3 && sourcePart.generationId === manifest.generationId, `persisted_source_selector_invalid:${market}`);
                assert.ok(sourcePart.sourceRows > 0 && sourcePart.sourceRows === sourcePart.rows.length + (sourcePart.otherRows?.length || 0), `source_selector_complete_count:${market}`);
                assert.equal(part.sourceRows, sourcePart.sourceRows, `selector_source_count:${market}`);
                assert.equal(part.rows.length, sourcePart.rows.length, `selector_source_rows:${market}`);
                assert.equal(part.otherRows?.length || 0, sourcePart.otherRows?.length || 0, `selector_source_other_rows:${market}`);
                const identities = partitionIdentities(part, market);
                assert.equal(identities, partitionIdentities(sourcePart, market), `selector_source_identities:${market}`);
                let prices;
                if (verifyPrices) {
                  const fingerprint = await budgetPricingFingerprint(market);
                  assert.match(fingerprint || '', /^[a-f0-9]{64}$/, `price_fingerprint_missing:${market}`);
                  // This mode is a fresh-process readback after warmup. The candidate's
                  // prepared reader validates storage identity/checksum and never replays.
                  // An empty validated array is a valid zero-priced-row snapshot; null is
                  // a missing/invalid snapshot and must fail without triggering recovery.
                  const budget = await readPreparedBudgetPrices(part, market, fingerprint, false);
                  assert.ok(Array.isArray(budget), `persisted_budget_prices_missing:${market}`);
                  const sorted = await readPreparedBudgetPrices(part, market, fingerprint, true);
                  assert.ok(Array.isArray(sorted), `persisted_sort_prices_missing:${market}`);
                  assert.equal(await budgetPricingFingerprint(market), fingerprint, `price_context_changed:${market}`);
                  prices = {fingerprint, budgetRows: budget.length, sortRows: sorted.length};
                }
                partitions.push({market, sourceRows: part.sourceRows, rows: part.rows.length,
                  otherRows: part.otherRows?.length || 0, manifestCount: manifest.markets[market].count,
                  identitySha256: identities, chunks: saved.value.markets[market].chunks.length, ...(prices ? {prices} : {})});
              }
              const finalReadiness = await readMeta(readyPath);
              assert.ok(finalReadiness.found && finalReadiness.etag === saved.etag && digest(finalReadiness.value) === digest(saved.value), 'readiness_changed_during_validation');
              const finalSourceReadiness = await readMeta(sourceReadyPath);
              assert.ok(finalSourceReadiness.found && finalSourceReadiness.etag === sourceReady.etag && digest(finalSourceReadiness.value) === digest(sourceReady.value), 'source_readiness_changed_during_preparation');
              await fence();
              const report = {schemaVersion: 1, releaseSha: expectedSource, calculationVersion: CALCULATOR,
                generationId: manifest.generationId, encyclopediaDigest: indexDigest, selectorDirectory,
                requiredMarkets: required, partitions, readySha256: digest(saved.value), manifestSha256: manifestDigest,
                sourceReadySha256: digest(sourceReady.value),
                controlsUnchanged: true, manifestUnchanged: true, verifyOnly, pricesVerified: verifyPrices,
                writes: writes.length, passed: true};
              progress({stage: 'persisted_selector_readiness_verified', ...report});
              return report;
            } finally {
              storage.writeJson = originalWrite;
            }
          }
          
          async function main() {
            assert.ok(process.argv.slice(2).every(value => ['--verify-only', '--verify-prices'].includes(value)), 'unsupported_arguments');
            const verifyOnly = process.argv.includes('--verify-only'), verifyPrices = process.argv.includes('--verify-prices');
            assert.ok(!verifyPrices || verifyOnly, 'price_readback_requires_verify_only');
            const root = path.resolve(process.env.PAID_CANDIDATE_ROOT || process.cwd());
            const expectedSource = process.env.PAID_EXPECTED_SOURCE_SHA || '';
            assert.match(expectedSource, /^[a-f0-9]{40}$/, 'controller_pinned_source_required');
            const git = args => execFileSync('git', args, {cwd: root, encoding: 'utf8'}).trim();
            assert.equal(git(['rev-parse', 'HEAD']), expectedSource, 'candidate_head_changed');
            git(['diff', '--exit-code', 'HEAD', '--', 'apps', 'packages', 'scripts/catalog-calculation-version.mjs']);
            assert.equal(execFileSync(process.execPath, ['scripts/catalog-calculation-version.mjs'], {cwd: root, encoding: 'utf8'}).trim(), CALCULATOR, 'candidate_calculator_changed');
            assert.ok(!process.env.AVTOCENA_RELEASE_SHA || process.env.AVTOCENA_RELEASE_SHA === expectedSource, 'release_environment_changed');
            assert.ok(!process.env.AVTOCENA_CALCULATION_VERSION || process.env.AVTOCENA_CALCULATION_VERSION === CALCULATOR, 'calculator_environment_changed');
            process.env.AVTOCENA_RELEASE_SHA = expectedSource;
            process.env.AVTOCENA_CALCULATION_VERSION = CALCULATOR;
            const expectedDigest = process.env.PAID_EXPECTED_ENCYCLOPEDIA_DIGEST || '';
            assert.match(expectedDigest, /^[a-f0-9]{64}$/, 'expected_private_index_digest_required');
            const load = filename => import(pathToFileURL(path.join(root, filename)).href);
            const [data, catalog, publication, codec, calculation, prices] = await Promise.all([
              load('apps/web/lib/data.ts'), load('apps/web/lib/catalog/storage.ts'),
              load('apps/web/lib/catalog/budget-selector-publication.ts'), load('apps/web/lib/catalog/budget-selector-codec.ts'),
              load('apps/web/lib/encyclopedia/calculation-index.ts'),
              load('apps/web/lib/catalog/shared-budget-prices.ts'),
            ]);
            const index = calculation.readCalculationIndex();
            assert.equal(index?.digest, expectedDigest, 'candidate_private_index_changed');
            const report = await ensurePaidSelectorReadiness({storage: data.getJsonStorage(),
              backfill: catalog.backfillBudgetSpecificationSelectors, readCompressedSelector: publication.readCompressedSelector,
              selectorDirectory: codec.specificationSelectorDirectory(index.digest, CALCULATOR), indexDigest: index.digest, expectedSource,
              verifyOnly, verifyPrices, budgetPricingFingerprint: prices.budgetPricingFingerprint,
              readPreparedBudgetPrices: prices.readPreparedBudgetPrices, progress: value => console.log(JSON.stringify(value))});
            const output = process.env.PAID_SELECTOR_READINESS_REPORT;
            if (output) await fs.writeFile(output, JSON.stringify(report, null, 2) + '\n', {mode: 0o600});
          }
          
          if (process.argv[1] && path.resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {
            main().catch(error => {
              // Do not emit private storage URLs, credentials, or exception body text.
              console.error(JSON.stringify({stage: 'selector_readiness_failed', code: error?.code || error?.name || 'Error',
                guard: error instanceof assert.AssertionError ? String(error.message).split('\n')[0] : undefined}));
              process.exitCode = 1;
            });
          }
          PAID_SELECTOR_HELPER
          printf '%s  %s\n' 05665ac11572e4ba0c188af7365737d1eae922c31a0937212ab03a3cc49b6ab4 "$RUNNER_TEMP/prepare-paid-selector-readiness.mjs" | sha256sum --check
      - name: Prepare exact price indexes before activating the release
