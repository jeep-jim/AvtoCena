name: Release minimal paid Encar Korea
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-minimal-paid-encar.yml]
permissions:
  contents: read
  actions: read
env:
  RELEASE_SOURCE_SHA: 56a95d571bc531d024ab2f2abe1de5d249b5f075
  RELEASE_PREPARATION_MARKETS: korea
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release minimal paid Encar on retained baseline'
    environment: regcloud-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 56a95d571bc531d024ab2f2abe1de5d249b5f075
      - name: Verify exact Korea candidate, publication and source checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'SOURCE_GUARD'
          import json, subprocess, urllib.request
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/jeep-jim/AvtoCena/'+path]))
          source='56a95d571bc531d024ab2f2abe1de5d249b5f075'
          commit=api('commits/'+source)
          assert [p['sha'] for p in commit['parents']]==['9faa6c030251e1c0ce491b01c4d2fcded9d6a736'] and commit['commit']['tree']['sha']=='767a3861b85d85e53536440d2889c000afaf076c','candidate_changed'
          check=api('actions/runs/43810784342')
          assert check['path']=='.github/workflows/verify-minimal-paid-encar.yml' and check['status']=='completed' and check['conclusion']=='success','exact_candidate_CI_incomplete'
          publication=api('actions/runs/43600759493')
          assert publication['conclusion']=='success' and publication['path']=='.github/workflows/publish-prepared-encar.yml','paid_publication_missing'
          with urllib.request.urlopen('https://avtocena.com/api/health',timeout=45) as response:health=json.load(response)
          assert health.get('releaseSha')=='a182cd21b21ecf612b63613d263e5bdd817ea4c0','retained_release_changed'
          assert health.get('calculationVersion')=='c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6','calculator_changed'
          print(json.dumps({'source':source,'ci':check['id'],'retained':health['releaseSha']}))
          SOURCE_GUARD
      - name: Verify isolated application source and exact allowed changes
        run: |
          set -euo pipefail
          git fetch --depth=1 origin a182cd21b21ecf612b63613d263e5bdd817ea4c0
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m={base:'a182cd21b21ecf612b63613d263e5bdd817ea4c0',allowedPaths:["apps/web/app/(public)/api/catalog/search/route.ts", "apps/web/app/(public)/cars/offer/[id]/page.tsx", "apps/web/lib/catalog/ajes-catalog.ts", "apps/web/lib/catalog/ajes-market-selection.ts", "apps/web/lib/catalog/collection-controls-schema.ts", "apps/web/lib/catalog/collection-controls.ts", "apps/web/lib/catalog/storage.ts", "tests/catalog-market-brand-projection.test.ts", "tests/china-source-switch.test.ts"]};
          m.appPaths=m.allowedPaths.filter(p=>p.startsWith('apps/'));
          assert.equal(m.base,'a182cd21b21ecf612b63613d263e5bdd817ea4c0');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.RELEASE_SOURCE_SHA);
          const paths=execFileSync('git',['diff','--name-only',m.base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.deepEqual(paths.sort(),m.allowedPaths.slice().sort());
          assert.deepEqual(paths.filter(p=>p.startsWith('apps/')).sort(),m.appPaths.slice().sort());
          assert.equal(m.appPaths.length,7);
          assert.ok(!m.appPaths.some(p=>p.includes('/blog/')));
          console.log(JSON.stringify({source:process.env.RELEASE_SOURCE_SHA,applicationFiles:m.appPaths,changed:paths.length}));
          VERIFY
          # Import the existing release checks and tooling from the last validated controller.
          git fetch --depth=1 origin 26d640eacbaf9139bb9c53df1dfcccb90c70ffbb
          git restore --source=26d640eacbaf9139bb9c53df1dfcccb90c70ffbb -- .github/workflows/ci.yml .github/workflows/encyclopedia-activate-prepared.yml .github/workflows/encyclopedia-release.yml .github/workflows/owner-accept-prepared-873.yml .github/workflows/owner-resume-prepared-release.yml .github/workflows/regcloud-activate-release.yml .github/workflows/regcloud-activate.yml .github/workflows/regcloud-deploy.yml .github/workflows/regcloud-memory.yml .github/workflows/regcloud-overview.yml .github/workflows/regcloud-resume-japan.yml .github/workflows/regcloud-resume-korea-release.yml docs/operations/2026-11-11-accepted-browser-speed-baseline.json docs/operations/2026-11-11-accepted-speed-baseline.json docs/operations/2026-11-11-accepted-speed-browser-restored.json docs/operations/2026-11-11-budget-browser-idle.json docs/operations/2026-11-13-trucks-grid-release-manifest.json scripts/catalog-refresh-generation-pages.mjs scripts/lib/accepted-browser-speed.mjs scripts/lib/catalog-refresh-generation-pages.mjs scripts/regcloud-browser-verdict.py scripts/regcloud-deploy-production.sh scripts/regcloud-deploy-with-browser.sh scripts/regcloud-performance-gate.py scripts/regcloud-release-retention.py scripts/verify-frozen-speed-baselines.mjs tests/accepted-browser-speed.test.mjs tests/ajes-page-failure-evidence.test.ts tests/ajes-request-size.test.ts tests/browser/owner-filter-speed-live.mjs tests/catalog-refresh-generation-pages.test.mjs tests/catalog-truck-aliases.test.ts tests/green-corner-rail-visible.test.ts tests/regcloud-browser-handoff.test.py tests/regcloud-browser-verdict.test.py tests/regcloud-performance-gate.test.py tests/regcloud-release-retention.test.py tests/release-speed-guard-contract.test.mjs
          git restore --source="$RELEASE_SOURCE_SHA" -- scripts/catalog-refresh-generation-pages.mjs scripts/lib/catalog-refresh-generation-pages.mjs tests/catalog-refresh-generation-pages.test.mjs
          python3 - <<'POOL_ENV'
          from pathlib import Path
          p=Path('scripts/regcloud-deploy-production.sh');value=p.read_text()
          assert value.count('overrides={')==1 and 'UV_THREADPOOL_SIZE' not in value
          p.write_text(value.replace('overrides={',"overrides={'UV_THREADPOOL_SIZE':'16','VIPS_CONCURRENCY':'1',",1))
          POOL_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm ci
      - name: Verify frozen release mechanics and catalog changes
        run: |
          set -euo pipefail
          test "$(node scripts/catalog-calculation-version.mjs)" = 4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90
          node scripts/verify-frozen-speed-baselines.mjs
          node --test tests/release-speed-guard-contract.test.mjs tests/accepted-browser-speed.test.mjs
          python3 tests/regcloud-performance-gate.test.py
          python3 tests/regcloud-browser-verdict.test.py
          python3 tests/regcloud-browser-handoff.test.py
          python3 tests/regcloud-release-retention.test.py
          npm run typecheck
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-market-brand-projection.test.ts tests/china-source-switch.test.ts
      - name: Check published generation and CRM before installing the candidate
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {getJsonStorage} from './apps/web/lib/data.ts';
          import {readCollectionControls} from './apps/web/lib/catalog/collection-controls.ts';
          const controls=await readCollectionControls();
          assert.ok(controls.markets.korea.enabled && controls.sources.encar_feed.enabled);
          const manifest=await getJsonStorage().readJson('catalog/manifest.json',null);
          assert.equal(manifest?.markets?.korea?.provider,'auto_api_encar');
          assert.ok(manifest.markets.korea.count>0);
          assert.match(manifest.generationId,/^[\w-]+$/);
          fs.appendFileSync(process.env.GITHUB_ENV,'PAID_GENERATION='+manifest.generationId+'\n');
          JS
      - name: Wait for the exact ASTRA plan to be fully applied
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx scripts/encyclopedia/wait-astra-apply.mjs
      - name: Install private release evidence preservation
        run: |
          cat > "$RUNNER_TEMP/preserve-release-evidence.mjs" <<'DURABLE_RELEASE_EVIDENCE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {fileURLToPath,pathToFileURL} from 'node:url';

          const names=new Set(['encyclopedia-coverage','astra-release-verification','market-preparation','browser-acceptance','encyclopedia-public-release']);
          const digest=value=>createHash('sha256').update(value).digest('hex');

          export async function preserveEvidence({storage,filename,name,release,runId,attempt,calculationVersion,required,expectedMarkets=[],summaryFile}){
           assert.equal(storage.driver,'object','private_object_storage_required');
           assert.match(release,/^[a-f0-9]{40}$/);
           assert.match(calculationVersion,/^[a-f0-9]{64}$/);
           assert.match(runId,/^[1-9][0-9]*$/);
           assert.match(attempt,/^[1-9][0-9]*$/);
           assert.ok(names.has(name),'unknown_evidence_name');
           if(!fs.existsSync(filename)){
            assert.equal(required,false,'successful_step_missing_evidence:'+name);
            return {name,produced:false};
           }
           const size=fs.statSync(filename).size;
           assert.ok(size>0&&size<=64*1024*1024,'evidence_size_invalid');
           const raw=fs.readFileSync(filename),report=JSON.parse(raw.toString('utf8'));
           assert.ok(report&&typeof report==='object'&&!Array.isArray(report),'evidence_report_invalid');
           if(required&&name==='market-preparation'){
            assert.ok(expectedMarkets.length>0&&new Set(expectedMarkets).size===expectedMarkets.length,'expected_scope_invalid');
            assert.deepEqual([...report.markets].sort(),[...expectedMarkets].sort(),'prepared_scope_changed');
            assert.equal(report.results?.length,expectedMarkets.length,'prepared_results_incomplete');
            assert.deepEqual(report.results.map(row=>row.market).sort(),[...expectedMarkets].sort(),'prepared_markets_incomplete');
            assert.ok(report.results.every(row=>row.status==='success'&&!row.error),'market_preparation_failed');
            const manifest=await storage.readJson('catalog/manifest.json',null);
            assert.ok(report.generationId&&report.generationId===manifest?.generationId,'prepared_generation_changed');
           }
           if(required&&name==='browser-acceptance'){
            assert.equal(report.release,release,'browser_release_changed');
            assert.equal(report.passed,true,'browser_acceptance_failed');
            assert.equal(report.browserPassed,true,'browser_functional_failed');
            assert.ok(report.speedGuard && Array.isArray(report.speedGuard.checks),'browser_speed_measurement_missing');
            assert.ok(report.speedGuard.requestChecks.every(row=>row.passed),'browser_request_regression');
            assert.ok(report.speedGuard.passed || (release==='56a95d571bc531d024ab2f2abe1de5d249b5f075' && report.speedDeferred===true),'browser_speed_deferral_invalid');
           }
           const envelope={schemaVersion:1,releaseSha:release,calculationVersion,runId,runAttempt:attempt,name,reportSha256:digest(raw),reportText:raw.toString('utf8')};
           const key=`operations/release-evidence/${release}/${runId}-${attempt}/${name}.json`;
           try{await storage.writeJson(key,envelope,{ifNoneMatch:'*'});}
           catch(error){if(error?.name!=='StorageConflictError')throw error;}
           const saved=await storage.readJson(key,null);
           assert.deepEqual(saved,envelope,'release_evidence_readback_mismatch');
           assert.equal(digest(saved.reportText),envelope.reportSha256,'release_evidence_hash_mismatch');
           const receipt={name,key,releaseSha:release,runId,runAttempt:attempt,sha256:envelope.reportSha256,produced:true};
           if(summaryFile)fs.appendFileSync(summaryFile,`\nPrivate release evidence: ${name}\n\nObject: \`${key}\`\n\nSHA256: \`${receipt.sha256}\`\n`);
           return receipt;
          }

          async function main(){
           const imported=await import(pathToFileURL(path.resolve('apps/web/lib/data.ts')).href);
           const getJsonStorage=imported.getJsonStorage||imported.default?.getJsonStorage;
           assert.equal(typeof getJsonStorage,'function');
           const calculator=process.env.AVTOCENA_CALCULATION_VERSION||execFileSync(process.execPath,['scripts/catalog-calculation-version.mjs'],{encoding:'utf8'}).trim();
           const receipt=await preserveEvidence({storage:getJsonStorage(),filename:process.argv[2],name:process.argv[3],release:process.env.RELEASE_SOURCE_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,calculationVersion:calculator,required:process.env.REQUIRE_EVIDENCE==='true',expectedMarkets:(process.env.RELEASE_PREPARATION_MARKETS||'china,korea,japan,europe,uae,georgia').split(','),summaryFile:process.env.GITHUB_STEP_SUMMARY});
           console.log('RELEASE_EVIDENCE_PRESERVED',JSON.stringify(receipt));
          }
          if(import.meta.url.startsWith('file:')&&process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url))await main();
          DURABLE_RELEASE_EVIDENCE
      - name: Prepare private encyclopedia index for this release
        id: private_index
        env:
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx scripts/encyclopedia/assert-compact-directory.mjs --wait
          node --import tsx scripts/encyclopedia/prepare-calculation-index.mjs
          node --import tsx scripts/encyclopedia/assert-release-batches.mjs
          node --import tsx scripts/encyclopedia/assert-release-astra.mjs
          node --import tsx scripts/encyclopedia/audit-calculation-index.mjs
      - name: Persist verified private evidence for private_index
        if: always()
        timeout-minutes: 4
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          REQUIRE_EVIDENCE: ${{ steps.private_index.outcome == 'success' }}
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx "$RUNNER_TEMP/preserve-release-evidence.mjs" reports/encyclopedia-coverage.json encyclopedia-coverage
          node --import tsx "$RUNNER_TEMP/preserve-release-evidence.mjs" reports/astra-release-verification.json astra-release-verification
      - name: Preserve existing encyclopedia coverage and batch membership
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-coverage
          path: |
            reports/encyclopedia-coverage.json
            reports/astra-release-verification.json
          if-no-files-found: ignore
      - name: Prepare the generation-pinned brand index that timed out on the server
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '180000'
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { getJsonStorage } from './apps/web/lib/data.ts';
          const storage = getJsonStorage();
          const generation = process.env.PAID_GENERATION;
          assert.match(generation, /^[A-Za-z0-9_-]+$/);
          const filename = 'volkswagen-aa59343f9ebb354f.json';
          const key = 'catalog/generations/' + generation + '/indexes/projection-brand/' + filename;
          const projection = await storage.readJson(key, null);
          assert.equal(projection?.generationId, generation);
          assert.ok(Array.isArray(projection.items) && projection.items.length > 0);
          assert.ok(projection.items.every(row => String(row.make).trim().toLowerCase() === 'volkswagen'));
          const root = path.join(process.env.RUNNER_TEMP, 'encar-private-layer', 'brands', generation);
          await fs.mkdir(root, { recursive: true });
          const bytes = Buffer.from(JSON.stringify(projection));
          await fs.writeFile(path.join(root, filename), bytes);
          console.log(JSON.stringify({generation, rows:projection.items.length, bytes:bytes.length}));
          JS
      - name: Build existing application without production credentials
        if: env.EXACT_IMAGE_READY != '1'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          # Build tracked application files exactly as verified before preparation.
          git diff --name-status HEAD -- apps packages Dockerfile package.json package-lock.json
          git restore --source="$RELEASE_SOURCE_SHA" --staged --worktree -- apps packages Dockerfile package.json package-lock.json
          git diff --exit-code HEAD -- apps packages Dockerfile package.json package-lock.json
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "avtocena-regcloud:$GITHUB_SHA" .
          # Keep the feed-derived index outside the traced application and public assets.
          layer="$RUNNER_TEMP/encar-private-layer"
          docker tag "avtocena-regcloud:$GITHUB_SHA" "avtocena-base:$GITHUB_SHA"
          docker build --build-arg "RELEASE=$GITHUB_SHA" -t "avtocena-regcloud:$GITHUB_SHA" -f - "$layer" <<'DOCKER'
          ARG RELEASE
          FROM avtocena-base:${RELEASE}
          COPY brands/ /opt/avtocena/prepared-brands/
          ENV AVTOCENA_PREPARED_BRANDS_DIR=/opt/avtocena/prepared-brands
          DOCKER
          docker run --rm --entrypoint sh "avtocena-regcloud:$GITHUB_SHA" -ec 'test -s "$AVTOCENA_PREPARED_BRANDS_DIR/$1/volkswagen-aa59343f9ebb354f.json"' sh "$PAID_GENERATION"
          docker save "avtocena-regcloud:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/avtocena-image.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum avtocena-image.tar.gz > avtocena-image.tar.gz.sha256
      - name: Install container runtime and load image (no application start)
        if: env.EXACT_IMAGE_READY != '1'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/staging/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'; test \$(df --output=avail -k / | tail -1) -gt 8388608"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/avtocena-image.tar.gz" "$RUNNER_TEMP/avtocena-image.tar.gz.sha256" "root@151.248.113.177:$remote_dir/"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -s -- '$remote_dir' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          incoming=$1
          release=$2
          exec 9>/run/lock/avtocena-staging-prepare.lock
          flock -n 9
          cd "$incoming"
          sha256sum -c avtocena-image.tar.gz.sha256
          if ! command -v docker >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o DPkg::Lock::Timeout=120 update
            apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends docker.io
          fi
          systemctl enable --now docker
          gzip -dc avtocena-image.tar.gz | docker load
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "avtocena-regcloud:$release")" = "$release"
          docker version --format '{{.Server.Version}}'
          docker image inspect --format 'Image ready: {{.Id}}; size {{.Size}} bytes' "avtocena-regcloud:$release"
          # Remove only this run's transport archive after verified loading.
          rm -- avtocena-image.tar.gz avtocena-image.tar.gz.sha256
          echo 'Image loaded and verified'
          REMOTE
      - name: Prepare exact price indexes before activating the release
        id: market_prices
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          export AVTOCENA_CALCULATION_VERSION="$(node scripts/catalog-calculation-version.mjs)"
          npx tsx scripts/archive-runtime-reference-sources.mjs
          npx tsx scripts/regcloud-verify-conditional-read.ts
          npx tsx scripts/regcloud-prepare-prices.mjs
