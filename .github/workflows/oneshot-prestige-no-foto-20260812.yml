name: One-shot Prestige NO FOTO filter 20260812

on:
  push:
    branches:
      - fix/prestige-no-foto-20260812

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prestige-no-foto-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch-prestige-no-foto-20260812.py
      - run: node --import tsx --test tests/prestige-japan-no-foto-20260812.test.ts
      - run: npm run typecheck
      - run: npm --workspace apps/web run build
      - name: Commit validated source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/catalog/prestige-japan-exact-source.ts tests/prestige-japan-no-foto-20260812.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(japan): reject AJES NO FOTO auction covers"
          git push origin HEAD:fix/prestige-no-foto-20260812
