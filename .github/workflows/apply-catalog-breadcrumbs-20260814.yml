name: Apply catalog breadcrumbs 20260814

on:
  push:
    branches:
      - ui/catalog-breadcrumbs-20260814
    paths:
      - .github/workflows/apply-catalog-breadcrumbs-20260814.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/catalog-breadcrumbs-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply catalog breadcrumb UI
        run: python3 .github/scripts/apply_catalog_breadcrumbs_20260814.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified catalog breadcrumbs
        shell: bash
        run: |
          rm .github/workflows/apply-catalog-breadcrumbs-20260814.yml
          rm .github/scripts/apply_catalog_breadcrumbs_20260814.py
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web/app/(public)/cars/page.tsx' .github/workflows/apply-catalog-breadcrumbs-20260814.yml .github/scripts/apply_catalog_breadcrumbs_20260814.py
          git diff --cached --check
          git commit -m "Add responsive catalog breadcrumbs"
          git push origin HEAD:ui/catalog-breadcrumbs-20260814
