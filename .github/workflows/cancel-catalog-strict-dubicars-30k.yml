name: Cancel strict DubiCars 30k

on:
  push:
    branches:
      - codex-strict-catalog-source-only
    paths:
      - ".github/workflows/cancel-catalog-strict-dubicars-30k.yml"

permissions:
  contents: read

concurrency:
  group: catalog-strict-dubicars-30k
  cancel-in-progress: true

jobs:
  canceler:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cancel previous strict DubiCars 30k run and stop here."
