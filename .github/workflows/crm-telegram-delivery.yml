name: CRM Telegram delivery retries
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Deliver notices, check credentials, or configure existing webhook"
        type: choice
        options: [deliver, check, setup-webhook]
        default: deliver
permissions:
  contents: read
concurrency:
  group: avtocena-crm-telegram-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deliver short CRM notices directly from GitHub
        env:
          AUTH_ACCESS_KEY: ${{ secrets.AUTH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPERATION: ${{ inputs.operation || 'deliver' }}
        run: |
          set -euo pipefail
          node scripts/crm-telegram-delivery.mjs "$OPERATION"
