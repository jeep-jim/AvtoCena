name: CRM Telegram delivery retries
on:
  schedule:
    # Avoid the busiest round-minute slots. GitHub still does not guarantee timing.
    - cron: "2-59/5 * * * *"
  workflow_run:
    workflows: ["Deploy to Yandex Cloud"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Deliver and poll, check credentials, or enable the external bot"
        type: choice
        options: [deliver, notify, check, check-group, setup-webhook, enable-polling, enable-events]
        default: deliver
permissions:
  contents: read
concurrency:
  group: avtocena-crm-telegram-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install worker dependencies
        run: npm ci --ignore-scripts
      - name: Process bot commands and deliver CRM notices from GitHub
        env:
          JSON_STORAGE_DRIVER: object
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
          AUTH_ACCESS_KEY: ${{ secrets.AUTH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          OPERATION: ${{ inputs.operation || 'deliver' }}
          ACCEPTANCE_RUN: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "deliver" ] || [ "$OPERATION" = "notify" ]; then
            node --import tsx scripts/crm-web-push.ts || true
          fi
          if [ "$OPERATION" = "enable-events" ]; then
            node --import tsx scripts/crm-enable-events.ts
          elif [ "$OPERATION" = "notify" ]; then
            node scripts/crm-telegram-delivery.mjs deliver
          elif [ "$OPERATION" = "enable-polling" ]; then
            node --import tsx scripts/crm-telegram-poll.ts enable-polling
            node scripts/crm-telegram-delivery.mjs deliver
          elif [ "$OPERATION" = "deliver" ]; then
            # Website notices must not wait behind slow customer update handling.
            delivery_status=0
            node scripts/crm-telegram-delivery.mjs deliver || delivery_status=$?
            poll_status=0
            node --import tsx scripts/crm-telegram-poll.ts poll || poll_status=$?
            node scripts/crm-telegram-delivery.mjs deliver
            if [ "$ACCEPTANCE_RUN" = "1" ]; then
              CRM_SERVICE_RUN_SECONDS=120 node --import tsx scripts/crm-bot-service.ts
            fi
            if [ "$poll_status" != "0" ]; then exit "$poll_status"; fi
            exit "$delivery_status"
          else
            node scripts/crm-telegram-delivery.mjs "$OPERATION"
          fi
