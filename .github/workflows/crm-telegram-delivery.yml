name: CRM Telegram delivery retries
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avtocena-crm-telegram-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retry persisted CRM notifications
        env:
          AUTH_ACCESS_KEY: ${{ secrets.AUTH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          curl --retry 2 --retry-delay 5 --retry-all-errors --max-time 40 -fsS \
            -X POST -H "x-auth-key: ${AUTH_ACCESS_KEY}" \
            'https://avtocena.com/api/internal/crm/delivery'
