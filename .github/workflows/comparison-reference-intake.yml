name: Encyclopedia — collect comparison tables
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/comparison-reference-intake.json']
permissions:
  contents: read
concurrency:
  group: encyclopedia-comparison-reference-intake
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect factual tables with resumable private checkpoints
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          REFERENCE_PAGE_LIMIT: '3000'
          REFERENCE_SOURCE: comparison
        run: node --import tsx scripts/encyclopedia/collect-technical-references.mjs
