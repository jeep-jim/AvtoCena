name: Encar pagination recovery smoke
run-name: Encar pagination recovery smoke · ${{ github.sha }}

on:
  push:
    branches:
      - codex-encar-pagination-recovery
    paths:
      - ".github/workflows/encar-pagination-recovery-smoke.yml"
      - "apps/web/lib/catalog/encar-complete-source.ts"
      - "scripts/encar-pagination-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch at least 120 unique Encar listings without publication
        run: npx tsx scripts/encar-pagination-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-pagination-smoke
          path: encar-pagination-smoke.json
          if-no-files-found: warn
          retention-days: 3
