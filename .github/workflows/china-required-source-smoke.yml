name: China listing shape diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/china-required-source-smoke.yml"

permissions:
  contents: read

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source:
          - guazi
          - che168
    env:
      CHINA_SHAPE_SOURCE: ${{ matrix.source }}
      CHINA_SHAPE_OUTPUT: china-shape-${{ matrix.source }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect server HTML shape
        run: npx tsx scripts/china-html-shape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-shape-${{ matrix.source }}
          path: china-shape-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3
