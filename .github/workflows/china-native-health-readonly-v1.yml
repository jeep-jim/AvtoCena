name: Inspect exact native health connectivity readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/china-native-health-readonly-v1.yml']
permissions:
  contents: read
concurrency:
  group: china-native-health-readonly-v1
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Inspect exact China native health connectivity'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read only fixed public health with native timeout
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/health-probe.mjs"
          echo 'ded060d55658c29a92c6a70a9a0ea375da045ebce5c061793d166762fe0a35fa  '"$RUNNER_TEMP/health-probe.mjs" | sha256sum --check --strict
          timeout --signal=TERM --kill-after=5s 30s node "$RUNNER_TEMP/health-probe.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-native-health-readonly-v1
          path: health-probe.json
          if-no-files-found: warn
          retention-days: 7
