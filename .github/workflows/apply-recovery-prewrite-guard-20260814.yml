name: Apply recovery prewrite preservation guard 20260814

on:
  push:
    branches:
      - fix/recovery-preservation-prewrite-20260814
    paths:
      - .github/workflows/apply-recovery-prewrite-guard-20260814.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-preservation-prewrite-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fail-before-write preservation guard
        run: python3 .github/scripts/apply-recovery-prewrite-guard-20260814.py
      - run: npm ci
      - name: Recovery and production hardening tests
        run: npx tsx --test tests/catalog-production-hardening.test.ts tests/catalog-recovery-publisher-min-images.test.ts tests/catalog-recovery-min-images.test.ts tests/storage.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified guard
        shell: bash
        run: |
          rm .github/scripts/apply-recovery-prewrite-guard-20260814.py
          rm .github/workflows/apply-recovery-prewrite-guard-20260814.yml
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/storage.ts scripts/catalog-live-recovery-publish.mjs scripts/catalog-live-recovery-publish-batch.mjs tests/catalog-production-hardening.test.ts .github/scripts/apply-recovery-prewrite-guard-20260814.py .github/workflows/apply-recovery-prewrite-guard-20260814.yml
          git diff --cached --check
          git commit -m "Fail recovery preservation before catalog writes"
          git push origin HEAD:fix/recovery-preservation-prewrite-20260814
