name: Smoke preliminary EV + hybrid · 7 real markets

on:
  push:
    branches:
      - fix/preliminary-electrified-20260810
    paths:
      - ".github/workflows/smoke-preliminary-electrified-7-markets.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "3"
  RECOVERY_PREPARE_CONCURRENCY: "4"

jobs:
  smoke-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - market: korea
            mode: generic
            source_ids: encar_direct,kcar_korea_open
            target: 600
            pages: 30
          - market: china
            mode: generic
            source_ids: autohome_used_china_open,guazi_china_open,autohome_new_china_open
            target: 800
            pages: 20
          - market: europe
            mode: europe
            source_ids: otomoto_europe_exact
            target: 600
            pages: 30
          - market: georgia
            mode: generic
            source_ids: auto_georgia_open
            target: 500
            pages: 30
          - market: uae
            mode: direct
            source_ids: dubicars_uae_current
            target: 400
            pages: 30
          - market: kyrgyzstan
            mode: kg
            source_ids: mashina_kyrgyzstan_exact
            target: 700
            pages: 35
    env:
      RECOVERY_MARKET: ${{ matrix.market }}
      RECOVERY_DIRECT_MARKET: ${{ matrix.market }}
      RECOVERY_SOURCE_IDS: ${{ matrix.source_ids }}
      RECOVERY_OUTPUT: smoke-${{ matrix.market }}.json
      RECOVERY_TARGET: ${{ matrix.target }}
      RECOVERY_MAX_PAGES: ${{ matrix.pages }}
      RECOVERY_TIME_LIMIT_MS: "2100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect real source cards without publishing
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.mode }}" in
            generic) npx tsx scripts/catalog-live-recovery-market.mjs ;;
            europe) npx tsx scripts/catalog-live-recovery-europe-otomoto.mjs ;;
            direct) npx tsx scripts/catalog-live-recovery-direct-exact.mjs ;;
            kg) npx tsx scripts/catalog-live-recovery-kyrgyzstan-direct.mjs ;;
            *) exit 2 ;;
          esac
      - name: Report true electrified coverage
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = `smoke-${process.env.RECOVERY_MARKET}.json`;
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const electric = offers.filter(o => o.powertrainKind === 'electric');
          const hybrid = offers.filter(o => ['series_hybrid','other_hybrid'].includes(o.powertrainKind));
          const prelim = offers.filter(o => o.calculationStatus === 'preliminary_power_pending');
          const exact = offers.filter(o => ['ready','estimated','auction_start','calculated'].includes(String(o.calculationStatus || '')) && o.calculationSnapshot?.customs?.status === 'ready');
          const summary = {
            market: process.env.RECOVERY_MARKET,
            total: offers.length,
            electric: electric.length,
            hybrid: hybrid.length,
            preliminary: prelim.length,
            exact: exact.length,
            electricModels:[...new Set(electric.map(o=>`${o.make} ${o.model}`))].slice(0,20),
            hybridModels:[...new Set(hybrid.map(o=>`${o.make} ${o.model}`))].slice(0,20),
            preliminaryModels:[...new Set(prelim.map(o=>`${o.make} ${o.model}`))].slice(0,20),
          };
          console.log(JSON.stringify(summary,null,2));
          fs.writeFileSync(`smoke-${process.env.RECOVERY_MARKET}-summary.json`, JSON.stringify(summary,null,2));
          if (!offers.length) process.exit(2);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-smoke-${{ matrix.market }}
          path: |
            smoke-${{ matrix.market }}.json
            smoke-${{ matrix.market }}-summary.json
          retention-days: 3
          if-no-files-found: warn

  smoke-japan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_RUN_ID: "31338331776"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      PRESTIGE_RECOVERY_OUTPUT: smoke-japan.json
      PRESTIGE_RECOVERY_TARGET: "3000"
      PRESTIGE_RECOVERY_CONCURRENCY: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download newest repaired strict Prestige artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > prestige.zip
          unzip -qo prestige.zip -d prestige-input
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_OFFICIAL_INPUT=$source_file" >> "$GITHUB_ENV"
      - name: Apply exact official chassis ICE enrichment
        shell: bash
        run: |
          export PRESTIGE_OFFICIAL_OUTPUT=prestige-japan-official-smoke.json
          node scripts/prestige-japan-official-chassis-enrich.mjs
          echo "PRESTIGE_RECOVERY_INPUT=$PRESTIGE_OFFICIAL_OUTPUT" >> "$GITHUB_ENV"
      - name: Convert real strict sold lots without publishing
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Report Japan electrified and preliminary coverage
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('smoke-japan.json','utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const electric = offers.filter(o=>o.powertrainKind==='electric');
          const hybrid = offers.filter(o=>['series_hybrid','other_hybrid'].includes(o.powertrainKind));
          const prelim = offers.filter(o=>o.calculationStatus==='preliminary_power_pending');
          const summary={market:'japan',total:offers.length,electric:electric.length,hybrid:hybrid.length,preliminary:prelim.length,electricModels:[...new Set(electric.map(o=>`${o.make} ${o.model}`))].slice(0,30),hybridModels:[...new Set(hybrid.map(o=>`${o.make} ${o.model}`))].slice(0,30)};
          console.log(JSON.stringify(summary,null,2));
          fs.writeFileSync('smoke-japan-summary.json',JSON.stringify(summary,null,2));
          if(!offers.length) process.exit(2);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-smoke-japan
          path: |
            smoke-japan.json
            smoke-japan-summary.json
          retention-days: 3
          if-no-files-found: warn
