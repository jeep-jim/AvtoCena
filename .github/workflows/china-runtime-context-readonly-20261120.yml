name: Diagnose exact China pricing inputs without accessing the source archive
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/china-runtime-context-readonly-20261120.yml
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
      && github.run_attempt == '1' && github.event.before == '182afa41b96f008fab1471bb82b46b68812a2c6d' && github.event.head_commit.message
      == 'Diagnose exact China pricing inputs without accessing the source archive'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 182afa41b96f008fab1471bb82b46b68812a2c6d
        path: orchestrator
        persist-credentials: false
        sparse-checkout: .github/operations/china-full-fresh-v1
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 40e86a1bd28ca5759ac00cd09f665a45f66afb0a
        path: candidate
        persist-credentials: false
        sparse-checkout: scripts
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
        path: installed
        persist-credentials: false
        sparse-checkout: data/catalog/vehicle-knowledge
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Read only existing immutable price inputs with exact scoped signer
      env:
        REG_ACCESS: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        REG_SECRET: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: 'set -euo pipefail

        umask 077

        root="$RUNNER_TEMP/china-context-probe"

        mkdir -m 0700 "$root"

        install -m 0600 orchestrator/.github/operations/china-full-fresh-v1/runtime-context-plan.json "$root/plan.json"

        test "$(sha256sum "$root/plan.json" | cut -d '' '' -f 1)" = cb45a5f988a58711a1e8a26f322708ec48fc6e3b3b214b92576ceea9daca5271

        test "$(git -C candidate rev-parse HEAD)" = 40e86a1bd28ca5759ac00cd09f665a45f66afb0a

        test "$(git -C installed rev-parse HEAD)" = 83ff17075e9188dcf227c8752dc064248d5f42e0

        python - "$root/credentials.json" <<''PYCODE''

        import os,sys,json

        with open(sys.argv[1],''x'') as f: json.dump({''access'':os.environ[''REG_ACCESS''],''secret'':os.environ[''REG_SECRET'']},f)

        PYCODE

        unset REG_ACCESS REG_SECRET

        node candidate/scripts/catalog-china-materialize-runtime.mjs --plan "$root/plan.json" --expect-plan-sha
        cb45a5f988a58711a1e8a26f322708ec48fc6e3b3b214b92576ceea9daca5271 --release-root "$GITHUB_WORKSPACE/installed"
        --out "$root/avtocena-china-context-probe" --secrets "$root/credentials.json"

        '
