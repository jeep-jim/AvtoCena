# Observe China daily 45655051136 lease, reservation and public health during the prolonged update.
name: China publication state proof (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-publication-state-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: regcloud-staging
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read publication state, not data or host
        run: node scripts/catalog-next/verify-publication-state-readonly.mjs

      - name: Read bounded public application health
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://avtocena.com/api/health', {
            redirect: 'error', signal: AbortSignal.timeout(15000)
          });
          if (response.status !== 200) throw Error('public_health_http_' + response.status);
          const chunks = []; let size = 0;
          for await (const chunk of response.body) {
            size += chunk.byteLength;
            if (size > 65536) throw Error('public_health_size');
            chunks.push(Buffer.from(chunk));
          }
          const value = JSON.parse(Buffer.concat(chunks).toString('utf8'));
          if (value.ok !== true || value.releaseSha !== 'd536c1547c4d82a339ed68ced7d8503f09b6810b'
              || value.calculationVersion !== '4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90')
            throw Error('public_health_identity');
          console.log(JSON.stringify({kind: 'china_daily_wait_public_health', observedAt: new Date().toISOString(),
            status: response.status, ok: value.ok, releaseSha: value.releaseSha, calculationVersion: value.calculationVersion}));
          JS
