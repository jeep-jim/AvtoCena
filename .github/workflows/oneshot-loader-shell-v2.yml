name: One-shot loader shell v2

on:
  push:
    branches:
      - fix/loader-shell-v2-20260812

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/loader-shell-v2-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch-loader-shell-v2-20260812.py
      - run: npm run typecheck
      - run: npm --workspace apps/web run build
      - name: Commit validated app change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/layout/RoutePreloader.tsx apps/web/app/\(public\)/loading.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): show route shell and stop loader on commit"
          git push origin HEAD:fix/loader-shell-v2-20260812
