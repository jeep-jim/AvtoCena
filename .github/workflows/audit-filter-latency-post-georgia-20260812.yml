name: Public filter latency audit post Georgia

on:
  push:
    branches:
      - audit/filter-latency-post-georgia-20260812

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only public catalog filter and route audit
        shell: bash
        run: |
          node - <<'NODE'
          const base = 'https://avtocena.com';
          const headers = { 'user-agent': 'AvtoCena-readonly-filter-audit/20260812', accept: 'text/html,*/*;q=0.8' };
          function articles(html) {
            return [...html.matchAll(/<article\b[^>]*class="[^"]*ac-catalog-card[^"]*"[^>]*>([\s\S]*?)<\/article>/g)].map((m) => m[1]);
          }
          function titles(html) {
            return articles(html).map((block) => block.match(/<img\b[^>]*\balt="([^"]+)"/i)?.[1] || '').filter(Boolean);
          }
          function years(html) {
            return articles(html).map((block) => Number(block.match(/\b(20\d{2})\s*г\./)?.[1] || 0)).filter(Boolean);
          }
          async function request(path) {
            const started = performance.now();
            const response = await fetch(`${base}${path}`, { headers, redirect: 'follow', signal: AbortSignal.timeout(30000) });
            const text = await response.text();
            return { status: response.status, ms: Math.round(performance.now() - started), bytes: Buffer.byteLength(text), text };
          }
          const cases = [
            { label: 'cars-default', path: '/cars' },
            { label: 'georgia', path: '/cars?market=georgia' },
            { label: 'georgia-toyota', path: '/cars?market=georgia&make=Toyota' },
            { label: 'georgia-year-2025', path: '/cars?market=georgia&yearFrom=2025' },
            { label: 'china', path: '/cars?market=china' },
          ];
          const summary = [];
          for (const item of cases) {
            const runs = [];
            let last = null;
            for (let i = 0; i < 3; i += 1) {
              last = await request(item.path);
              runs.push(last.ms);
              if (last.status !== 200) throw new Error(`${item.label}_http_${last.status}`);
            }
            const sorted = [...runs].sort((a,b) => a-b);
            const articleCount = articles(last.text).length;
            const cardTitles = titles(last.text);
            const cardYears = years(last.text);
            if (item.label === 'georgia' && articleCount < 1) throw new Error('georgia_rendered_zero_cards');
            if (item.label === 'georgia-toyota') {
              if (!articleCount || !cardTitles.length) throw new Error('georgia_toyota_rendered_zero_cards');
              const foreign = cardTitles.filter((title) => !/^Toyota\b/i.test(title));
              if (foreign.length) throw new Error(`georgia_toyota_filter_leak:${foreign.slice(0,5).join('|')}`);
            }
            if (item.label === 'georgia-year-2025') {
              if (!articleCount || !cardYears.length) throw new Error('georgia_year_filter_rendered_zero_cards');
              const old = cardYears.filter((year) => year < 2025);
              if (old.length) throw new Error(`georgia_year_filter_leak:${old.slice(0,10).join(',')}`);
            }
            summary.push({ label: item.label, status: last.status, runsMs: runs, p50Ms: sorted[1], maxMs: sorted[2], bytes: last.bytes, articleCount, titleSample: cardTitles.slice(0,6), yearSample: cardYears.slice(0,10) });
          }
          const removedRoutes = [
            '/api/internal/georgia-egress-8d4c2f',
            '/api/internal/georgia-adapters-dryrun-6a91d7',
          ];
          const removed = [];
          for (const path of removedRoutes) {
            const result = await request(path);
            removed.push({ path, status: result.status, ms: result.ms, bytes: result.bytes });
            if (result.status !== 404) throw new Error(`temporary_route_still_public:${path}:${result.status}`);
          }
          console.log(JSON.stringify({ checkedAt: new Date().toISOString(), summary, removed }, null, 2));
          NODE
