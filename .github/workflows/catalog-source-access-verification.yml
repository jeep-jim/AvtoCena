name: Catalog source access verification
on:
  push:
    branches: [probe/catalog-access-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CATALOG_ENCAR_DIRECT_LIST_RETRIES: '1'
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: '20000'
      CATALOG_SOURCE_TIMEOUT_MS: '25000'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node --import tsx scripts/catalog-source-access-verification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-access
          path: catalog-source-access.json
          retention-days: 14
