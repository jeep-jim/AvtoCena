name: Catalog UAE Georgia stable republish
run-name: UAE Georgia stable republish · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-uae-georgia-republish-stable.yml"
      - "scripts/catalog-live-recovery-publish-batch-stable.mjs"

permissions:
  actions: read
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  SOURCE_RUN_ID: "31264261523"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the completed UAE and Georgia collector artifacts only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p recovery-input .recovery-zips
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name == "catalog-direct-recovery-uae" or .name == "catalog-direct-recovery-georgia") | [.id,.name] | @tsv' > recovery-artifacts.tsv
          test "$(wc -l < recovery-artifacts.tsv)" -eq 2
          while IFS=$'\t' read -r artifact_id artifact_name; do
            zip_path=".recovery-zips/${artifact_id}.zip"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$zip_path"
            unzip -qo "$zip_path" -d recovery-input
          done < recovery-artifacts.tsv
          test -s recovery-input/catalog-rebuild-uae.json
          test -s recovery-input/catalog-rebuild-georgia.json
      - name: Preflight the exact same public gate and publish atomically
        env:
          RECOVERY_BATCH_MARKETS: uae,georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-uae-georgia-stable-republish-report.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch-stable.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-uae-georgia-stable-republish-report
          path: catalog-uae-georgia-stable-republish-report.json
          if-no-files-found: warn
          retention-days: 3
