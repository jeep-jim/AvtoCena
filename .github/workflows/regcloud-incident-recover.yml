name: Regcloud — recover stalled application once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-incident-recover.json']
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect and restart only an unresponsive production application
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'bash -s' <<'REMOTE'
          set -euo pipefail
          exec 9>/run/lock/avtocena-runtime-change.lock
          flock -w 30 9
          test -e /opt/avtocena/PRODUCTION_ACTIVE
          test "$(docker inspect --format '{{index .Config.Labels "avtocena.role"}}' avtocena-production)" = production
          port=$(docker inspect --format '{{(index (index .HostConfig.PortBindings "3000/tcp") 0).HostPort}}' avtocena-production)
          [[ "$port" = 3000 || "$port" = 3001 ]]
          docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}}' avtocena-production
          docker logs --since 40m --tail 5000 avtocena-production 2>&1 | python3 -c 'import sys,json; rows=[];errors=0
          for line in sys.stdin:
              if "catalog_storage_read " in line:
                  try: rows.append(json.loads(line.split("catalog_storage_read ",1)[1]))
                  except: pass
              if "object_storage_response_timeout" in line:errors+=1
          print("STORAGE_TIMEOUTS",errors);print("SLOW_READS",json.dumps(sorted(rows,key=lambda x:x["ms"],reverse=True)[:25]))'
          healthy=0
          for attempt in 1 2; do
            if curl -fsS --max-time 5 "http://127.0.0.1:$port/api/health"; then healthy=1; break; fi
          done
          if [ "$healthy" = 0 ]; then
            echo 'Direct health failed twice; restarting the same container once, preserving image, settings and data'
            docker restart --time 15 avtocena-production
          else
            echo 'Direct health is responsive; restart skipped'
          fi
          ready=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$port/api/health"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS --max-time 15 --resolve avtocena.com:443:127.0.0.1 https://avtocena.com/api/health
          docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}}' avtocena-production
          REMOTE
