name: Ops · Diagnose GMC Savana pricing 20260814
run-name: Diagnose GMC Savana pricing · ${{ github.sha }}

on:
  push:
    branches:
      - ops/diagnose-gmc-savana-price-20260814

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect exact live GMC Savana offers
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const rows = await readMarketOffers('korea');
          const matches = rows.filter((offer) => {
            const text = [offer.make, offer.model, offer.trim, offer.sourceTitle, offer.operational?.sourceTitle].filter(Boolean).join(' ');
            return /\bGMC\b/i.test(text) && /(?:사바나|savana)/i.test(text);
          });
          const pick = (offer) => ({
            id: offer.id,
            sourceId: offer.sourceId,
            sourceOfferId: offer.sourceOfferId,
            sourceUrl: offer.operational?.sourceUrl,
            make: offer.make,
            model: offer.model,
            trim: offer.trim,
            sourceTitle: offer.sourceTitle,
            year: offer.year,
            mileageKm: offer.mileageKm,
            engineCc: offer.engineCc,
            engineType: offer.engineType,
            fuel: offer.fuel,
            powerHp: offer.powerHp,
            powerKw: offer.powerKw,
            powerDataConfidence: offer.powerDataConfidence,
            powerDataSource: offer.powerDataSource,
            transmission: offer.transmission,
            drive: offer.drive,
            bodyType: offer.bodyType,
            sourcePrice: offer.sourcePrice,
            sourceCurrency: offer.sourceCurrency,
            totalRub: offer.totalRub,
            calculationStatus: offer.calculationStatus,
            calculationSnapshot: offer.calculationSnapshot,
            updatedAt: offer.updatedAt,
          });
          console.log(JSON.stringify(matches.map(pick), null, 2));
          console.log(`MATCH_COUNT=${matches.length}`);
          NODE
