name: Regcloud — activate production HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-activate.json']
permissions:
  contents: read
concurrency:
  group: regcloud-staging
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source has not changed since verified migration
        env:
          SOURCE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          SOURCE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          SOURCE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          SOURCE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
          SOURCE_ACCESS: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          SOURCE_SECRET: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/regcloud-source-final-check.py
      - name: Check DNS and issue TLS before exposing application
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          for host in avtocena.com www.avtocena.com; do
            answer=$(dig +time=5 +tries=1 +short @ns1.reg.ru "$host" A)
            echo "$host A: $answer"
            test "$answer" = 151.248.113.177
          done
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          scp "${ssh_opts[@]}" scripts/regcloud-activate-web.sh root@151.248.113.177:/opt/avtocena/staging/regcloud-activate-web.sh
          ssh "${ssh_opts[@]}" root@151.248.113.177 'bash /opt/avtocena/staging/regcloud-activate-web.sh'
      - name: Verify public website and certificate
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://avtocena.com/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["releaseSha"]=="dd63dc40f51ee97d33c12a86654ad60d3714053f"; print("Public release verified")'
          for path in / /cars /login; do
            curl -fsS --max-time 90 "https://avtocena.com$path" -o /dev/null
            echo "Public $path: HTTP 200"
          done
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://avtocena.com/api/crm/leads)" = 401
          curl -fsS --max-time 30 https://www.avtocena.com/api/health -o /dev/null
          echo 'Anonymous CRM denied; www TLS verified'
