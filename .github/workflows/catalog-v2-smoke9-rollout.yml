name: Catalog V2 · Smoke9 rollout
run-name: Catalog V2 · Smoke9 rollout · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-smoke9-rollout.yml

# rollout-marker: retry-2026-08-05T09:30+07:00

permissions:
  contents: read

concurrency:
  group: catalog-v2-smoke9-rollout
  cancel-in-progress: false

jobs:
  korea:
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: korea
      display_name: Korea
    secrets: inherit

  japan:
    needs: korea
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: japan
      display_name: Japan
    secrets: inherit

  china:
    needs: japan
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: china
      display_name: China
    secrets: inherit

  uae:
    needs: china
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: uae
      display_name: UAE
    secrets: inherit

  europe:
    needs: uae
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: europe
      display_name: Europe
    secrets: inherit

  georgia:
    needs: europe
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: georgia
      display_name: Georgia
    secrets: inherit

  kyrgyzstan:
    needs: georgia
    uses: ./.github/workflows/catalog-v2-smoke9-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Kyrgyzstan
    secrets: inherit
