name: Japan ProAuctions later pages v2
on:
  push:
    branches: [ops/japan-free-sweep-20260916]
    paths: [.github/workflows/japan-proauctions-fast.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python -m py_compile scripts/japan-proauctions-sweep.py
      - run: python scripts/japan-proauctions-sweep.py
        env:
          START_PAGE: '201'
          SWEEP_SECONDS: '10800'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-proauctions-later-pages
          path: japan-proauctions-results
          retention-days: 14
