name: Patch catalog multibrand and brand route performance r2

on:
  push:
    branches:
      - ui/catalog-multibrand-fast-brand-pages-20260812
    paths:
      - .github/workflows/patch-catalog-multibrand-fast-brand-pages-r2-20260812.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/catalog-multibrand-fast-brand-pages-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply corrected patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/patch-catalog-multibrand-fast-brand-pages-20260812.yml').read_text()
          source = source.replace("    '        label: make ? item.model : `${item.make} ${item.model}`,\\n',", "    '      label: make ? item.model : `${item.make} ${item.model}`,\\n',")
          marker = "          python3 - <<'PY'\n"
          if marker not in source:
              raise SystemExit('embedded patch start not found')
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<embedded-patch>', 'exec'))
          Path('.github/workflows/patch-catalog-multibrand-fast-brand-pages-r2-20260812.yml').unlink()
          PY
      - name: Validate targeted tests
        run: |
          npx tsx --test tests/catalog-filter-search.test.ts tests/catalog-brand-rail-ui.test.ts
          git diff --check
      - name: Commit patched branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI: multiselect brands and accelerate brand pages"
          git push origin HEAD:ui/catalog-multibrand-fast-brand-pages-20260812
