name: Finalize exact failed China release rollback (proof bound)
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/china-exact-rollback-45536536119.json']
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      github.repository_id == '1289722938'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == '1'
      && github.event.head_commit.message == 'Finalize exact China rollback 45536536119 with host proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: regcloud-staging
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify rollback code, state transitions and SSH protocol without credentials
        run: |
          node --check scripts/catalog-next/recover-failed-china-45536536119.mjs
          node --test tests/catalog-next-china-state.test.mjs tests/catalog-next-release-ssh.test.mjs
      - name: Recover only the exact stale China reservation with host proof
        run: node scripts/catalog-next/recover-failed-china-45536536119.mjs
