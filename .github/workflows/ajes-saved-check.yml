name: AJ System — saved detail inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/ajes-saved-check.json']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Bundle diagnostic without production secrets
        run: |
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          await build({entryPoints:['scripts/ajes-saved-check.ts'],outfile:'/tmp/ajes-saved-check.cjs',bundle:true,platform:'node',format:'cjs',plugins:[{name:'server-only',setup(b){b.onResolve({filter:/^server-only$/},()=>({path:'empty',namespace:'empty'}));b.onLoad({filter:/.*/,namespace:'empty'},()=>({contents:''}));}}]});
          JS
      - name: Read selected saved vehicle fields only
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file" /tmp/ajes-saved-check.cjs' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'set -- $SSH_CONNECTION; docker exec -i -e AJES_DIAG_IP="$1" avtocena-production node' < /tmp/ajes-saved-check.cjs
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'python3 -' <<'PYLOG'
          import subprocess,re,json,collections
          value=subprocess.run(['docker','logs','--since','2h','--tail','1500','avtocena-production'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=15).stdout.decode('utf-8','replace')
          reasons=collections.Counter(re.findall(r'\bajes_(?:visitor_restricted|invalid_response|request_failed|request_timeout|connect_timeout|quota_exhausted|invalid_query|currency_unavailable|invalid_offer)\b',value))
          classes=collections.Counter(re.findall(r'\b(TypeError|ReferenceError|SyntaxError):',value))
          safe_types=re.findall(r"TypeError: (Cannot read properties of (?:undefined|null) \(reading '[A-Za-z_]+'\)|Cannot convert undefined or null to object|[A-Za-z_$][A-Za-z0-9_.$]* is not a function|[A-Za-z_$][A-Za-z0-9_.$]* is not iterable|fetch failed)",value)
          print('AJES_PUBLIC_REASONS',json.dumps(dict(collections.Counter(re.findall(r'AJES_PUBLIC_FAILURE ([a-z_]+)',value)))))
          print('AJES_ERROR_FRAMES',json.dumps(re.findall(r'at ([^\n]{0,160}?(?:\.next/[^\n]{0,100}|page\.[a-z]+:[0-9:]+))',value)[:12]))
          print('AJES_RUNTIME_ERRORS',json.dumps({'reasons':dict(reasons),'classes':dict(classes),'safeTypeMessages':dict(collections.Counter(safe_types))}))
          PYLOG
