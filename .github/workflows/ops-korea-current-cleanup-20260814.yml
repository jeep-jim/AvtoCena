name: Ops · Korea current cleanup 20260814
run-name: Korea cumulative cleanup · source identity + 5 photos · ${{ github.sha }}

on:
  push:
    branches:
      - ops/korea-current-cleanup-20260814

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "31536000000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "8"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Korea production contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --import tsx --test \
            tests/catalog-image-quality.test.ts \
            tests/catalog-korea-body-semantic.test.ts \
            tests/kcar-gallery-order.test.ts \
            tests/kbchachacha-exact-source.test.ts \
            tests/catalog-production-hardening.test.ts
      - name: Snapshot current seven-market baseline
        env:
          CATALOG_AUDIT_OUTPUT: korea-cleanup-preflight.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":2200,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-cleanup-preflight
          path: korea-cleanup-preflight.json
          if-no-files-found: warn
          retention-days: 5

  collect:
    needs: validate
    if: needs.validate.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { source: encar_direct, target: 1000, max_pages: 120 }
          - { source: kcar_korea_open, target: 1000, max_pages: 120 }
          - { source: kbchachacha_korea_open, target: 250, max_pages: 80 }
    env:
      RECOVERY_MARKET: korea
      RECOVERY_SOURCE_IDS: ${{ matrix.source }}
      RECOVERY_OUTPUT: catalog-shard-korea-${{ matrix.source }}.json
      RECOVERY_TARGET: ${{ matrix.target }}
      RECOVERY_MAX_PAGES: ${{ matrix.max_pages }}
      RECOVERY_TIME_LIMIT_MS: "3000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact Korea source shard
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-cleanup-${{ matrix.source }}
          path: catalog-shard-korea-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 5

  merge:
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: korea-cleanup-*
          path: shard-input
          merge-multiple: true
      - name: Require current Encar and K Car source data
        shell: bash
        run: |
          set -euo pipefail
          for source in encar_direct kcar_korea_open; do
            file="shard-input/catalog-shard-korea-${source}.json"
            test -s "$file"
            count="$(node -e 'const p=require("./"+process.argv[1]); console.log(Number(p.count || (Array.isArray(p.offers) ? p.offers.length : 0)))' "$file")"
            echo "$source=$count" >> "$GITHUB_STEP_SUMMARY"
            test "$count" -gt 0
          done
          if [ -s shard-input/catalog-shard-korea-kbchachacha_korea_open.json ]; then
            node -e 'const p=require("./shard-input/catalog-shard-korea-kbchachacha_korea_open.json"); console.log("kbchachacha="+Number(p.count || (Array.isArray(p.offers) ? p.offers.length : 0)))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Merge successful Korea source shards
        env:
          RECOVERY_MERGE_MARKET: korea
          RECOVERY_MERGE_INPUT_DIR: shard-input
          RECOVERY_MERGE_OUTPUT: catalog-rebuild-korea.json
        run: node scripts/catalog-live-recovery-merge-shards.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: korea-cleanup-merged
          path: catalog-rebuild-korea.json
          retention-days: 5

  publish:
    needs: [validate, merge]
    if: needs.validate.result == 'success' && needs.merge.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: korea-cleanup-merged
          path: korea-input
      - name: Cumulative Korea publish through current quality gates
        env:
          RECOVERY_PUBLISH_MARKET: korea
          RECOVERY_PUBLISH_INPUT: korea-input/catalog-rebuild-korea.json
          RECOVERY_PUBLISH_REPORT: korea-cleanup-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
          CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Refresh stored K Car exterior-first galleries
        env:
          CATALOG_GALLERY_MARKETS: korea
          CATALOG_GALLERY_SOURCE_IDS: kcar_korea_open
          CATALOG_GALLERY_MAX_OFFERS: "250"
          CATALOG_GALLERY_MAX_PER_MARKET: "250"
          CATALOG_GALLERY_MIN_IMAGES: "5"
          CATALOG_MAX_IMAGES_PER_OFFER: "30"
          CATALOG_GALLERY_PERSIST_EVERY: "250"
          CATALOG_GALLERY_CONCURRENCY: "8"
          CATALOG_GALLERY_RETIRE_CONFIRMED_UNAVAILABLE: "true"
          CATALOG_GALLERY_REPORT_FILE: korea-kcar-exterior-refresh.json
        run: npx tsx scripts/catalog-refresh-galleries.mjs
      - name: Certify Korea and guard the remaining markets
        env:
          CATALOG_AUDIT_OUTPUT: korea-cleanup-postpersist.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":2200,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-cleanup-reports
          path: |
            korea-cleanup-publish-report.json
            korea-kcar-exterior-refresh.json
            korea-cleanup-postpersist.json
          if-no-files-found: warn
          retention-days: 5
