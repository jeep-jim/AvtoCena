name: One-shot accept verified Encar source gallery mode

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-accept-encar-source-gallery-mode.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "3"
  RECOVERY_PREPARE_CONCURRENCY: "2"

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Accept only the verified Encar source-order safety mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-market.mjs')
          s=p.read_text()
          old='["encar_source_urls_only", "encar_detail_only_v2"].includes(String(op.gallerySafetyMode || ""))'
          new='["encar_source_urls_only", "encar_detail_only_v2", "encar_source_cover_photolist_v3"].includes(String(op.gallerySafetyMode || ""))'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Encar photoBound anchor missing')
          p.write_text(s)
          PY
      - name: Validate code
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: NO-PUBLISH Korea Encar strict smoke
        shell: bash
        env:
          RECOVERY_MARKET: korea
          RECOVERY_SOURCE_IDS: encar_direct
          RECOVERY_OUTPUT: catalog-rebuild-korea-encar-mode-smoke.json
          RECOVERY_TARGET: "5"
          RECOVERY_MAX_PAGES: "2"
          RECOVERY_TIME_LIMIT_MS: "600000"
        run: |
          npx tsx scripts/catalog-live-recovery-market.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('catalog-rebuild-korea-encar-mode-smoke.json','utf8'));
          console.log(JSON.stringify(x.report,null,2));
          const rows=x.offers||[];
          if (!rows.length) throw new Error('encar_recovery_zero_after_gallery_mode');
          const bad=rows.filter(o=>o?.sourceId==='encar_direct' && o?.operational?.gallerySafetyMode!=='encar_source_cover_photolist_v3');
          if (bad.length) throw new Error(`encar_wrong_gallery_mode:${bad.length}`);
          NODE
      - name: Commit verified recovery acceptance
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-live-recovery-market.mjs
          git commit -m "Accept verified Encar source gallery mode [skip actions]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-source-gallery-mode-smoke
          path: catalog-rebuild-korea-encar-mode-smoke.json
          if-no-files-found: warn
          retention-days: 3
