name: Read only current China AJES collection switch
permissions:
  contents: read
concurrency:
  group: china-ajes-source-flag-readonly
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Read only current China AJES collection
      switch'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Read only China AJES control
      env:
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/flag.mjs\" <<'JS'\nimport {createHash,createHmac} from 'node:crypto';\n\
        import {writeFile} from 'node:fs/promises';\nimport {pathToFileURL} from 'node:url';\nconst ENDPOINT='https://s3.regru.cloud',BUCKET='avtocena-staging-8120751',PREFIX='migration-staging/full-20261011/';\n\
        export const RELEASE='83ff17075e9188dcf227c8752dc064248d5f42e0';\nexport const KEYS=Object.freeze(['catalog/operations/collection-controls-v1.json']);\n\
        const sha=s=>createHash('sha256').update(s).digest('hex'),hmac=(key,s)=>createHmac('sha256',key).update(s).digest();\n\
        export function signedGet(key,credentials,date=new Date()){\n if(!KEYS.includes(key))throw Error('probe_key_denied');\n\
        \ if(!credentials.accessKeyId||!credentials.secretAccessKey)throw Error('probe_credentials_missing');\n\
        \ const pathname='/'+BUCKET+'/'+PREFIX+key,url=ENDPOINT+pathname;\n const stamp=date.toISOString().replace(/[:-]|\\\
        .\\d{3}/g,''),day=stamp.slice(0,8),scope=`${day}/us-east-1/s3/aws4_request`;\n const headers={host:'s3.regru.cloud','x-amz-content-sha256':sha(''),'x-amz-date':stamp};\n\
        \ const names=Object.keys(headers).sort(),canonical=names.map(k=>`${k}:${headers[k]}\\n`).join('');\n const\
        \ request=['GET',pathname,'',canonical,names.join(';'),sha('')].join('\\n');\n const signing=hmac(hmac(hmac(hmac('AWS4'+credentials.secretAccessKey,day),'us-east-1'),'s3'),'aws4_request');\n\
        \ const signature=createHmac('sha256',signing).update(`AWS4-HMAC-SHA256\\n${stamp}\\n${scope}\\n${sha(request)}`).digest('hex');\n\
        \ headers.authorization=`AWS4-HMAC-SHA256 Credential=${credentials.accessKeyId}/${scope}, SignedHeaders=${names.join(';')},\
        \ Signature=${signature}`;\n return {url,options:{method:'GET',headers,redirect:'error'}};\n}\nconst token=v=>typeof\
        \ v==='string'&&v.length<=180&&/^[a-zA-Z0-9_:.+\\-TZ]*$/.test(v)?v:null;\nconst etag=v=>typeof v==='string'&&/^\"\
        ?[a-fA-F0-9-]{1,128}\"?$/.test(v)?v:null;\n\ntry{\n const req=signedGet(KEYS[0],{accessKeyId:process.env.YC_OBJECT_STORAGE_ACCESS_KEY_ID,secretAccessKey:process.env.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY});\n\
        \ const r=await fetch(req.url,{...req.options,signal:AbortSignal.timeout(12000)});\n if(r.status!==200||r.headers.get('content-encoding')||Number(r.headers.get('content-length')||0)>262144)throw\
        \ Error();\n let n=0;const parts=[];for await(const b of r.body){n+=b.length;if(n>262144)throw Error();parts.push(b);}\n\
        \ const v=JSON.parse(Buffer.concat(parts,n));\n if(v.version!==1||!Number.isSafeInteger(v.revision)||typeof\
        \ v.markets?.china?.enabled!=='boolean'||!v.sources||v.sources.ajes_china_feed!==undefined&&typeof v.sources.ajes_china_feed?.enabled!=='boolean')throw\
        \ Error();\n console.log(JSON.stringify({version:1,checkedAt:new Date().toISOString(),revision:v.revision,chinaMarketEnabled:v.markets.china.enabled,sourceDefined:!!v.sources.ajes_china_feed,sourceEnabled:v.sources.ajes_china_feed?.enabled===true,active:v.markets.china.enabled===true&&v.sources.ajes_china_feed?.enabled===true,storageWrites:0,supplierRequests:0}));\n\
        }catch{console.error('china_ajes_metadata_read_refused');process.exitCode=1;}\n\nJS\nnode \"$RUNNER_TEMP/flag.mjs\"\
        \n"
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/china-ajes-source-flag-readonly.yml
