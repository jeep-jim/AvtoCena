name: Catalog · refresh current read models
run-name: One-hop catalog read models · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-current-read-models.yml"
      - "scripts/catalog-publish-current-read-models.mjs"
      - "apps/web/lib/catalog/storage.ts"
  workflow_run:
    workflows:
      - "Catalog live recovery · UAE + Kyrgyzstan"
      - "Catalog live · daily working markets"
      - "Catalog Japan · publish verified Prestige aggregate"
      - "Catalog · apply certified 30-minute power"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: catalog-current-read-models
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_ALLOW_EMPTY_MARKETS: "georgia"

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate current read-model publisher
        run: |
          node --check scripts/catalog-publish-current-read-models.mjs
          node --import tsx --test tests/offer-navigation-performance.test.ts tests/catalog-filter-search.test.ts tests/catalog-current-read-model-empty-market-policy.test.ts tests/ai-product-feed.test.ts
          npm run typecheck
      - name: Publish one-hop projections and offer shards
        run: |
          set -o pipefail
          npx tsx scripts/catalog-publish-current-read-models.mjs | tee catalog-current-read-models.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-current-read-models
          path: catalog-current-read-models.log
          if-no-files-found: warn
          retention-days: 3
