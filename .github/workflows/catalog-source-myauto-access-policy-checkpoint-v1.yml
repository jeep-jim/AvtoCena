name: Catalog source qualification · MyAuto access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/myauto-access-policy-v1-20260904
    paths:
      - ".github/workflows/catalog-source-myauto-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-myauto-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-myauto-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply MyAuto access-policy blocker
        run: node scripts/catalog-source-myauto-access-policy-checkpoint-v1.mjs
      - name: Normalize roadmap EOF
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p='roadmap.md';
          fs.writeFileSync(p, `${fs.readFileSync(p,'utf8').replace(/\s*$/,'')}\n`);
          NODE
      - name: Verify safety and next step
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='myauto_georgia_list');
          const d=l.decisions.find(x=>x.sourceId==='myauto_georgia_list');
          if(!row||row.class!=='research_pending'||row.publishAllowed!==false)throw new Error('MyAuto registry invalid');
          if(row.qualificationBlocker!=='automation_access_and_reuse_permission_unproven_rules_routes_challenged')throw new Error('MyAuto blocker missing');
          if(!d||d.class!=='research_pending'||d.publishAllowed!==false)throw new Error('MyAuto ledger invalid');
          const japan=r.candidates.filter(x=>x.market==='japan');
          if(!japan.length||japan.some(x=>x.qualificationPaused!==true))throw new Error('Japan pause missing');
          if(!/AutoPapa Georgia/i.test(r.next||''))throw new Error('AutoPapa next missing');
          if(!m.includes('## 40.40 — MyAuto Georgia: rules routes challenge automation; permission remains unproven'))throw new Error('roadmap 40.40 missing');
          if(r.candidates.some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Record MyAuto access-policy blocker"
          git push origin HEAD:chore/myauto-access-policy-v1-20260904
