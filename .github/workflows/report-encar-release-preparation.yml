name: Report exact Encar release preparation
on:
  push:
    branches: [main]
    paths: [.github/workflows/report-encar-release-preparation.yml]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9f89a2f9ca601a4cb5595a832ab2b8a04fb09938
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Count verified preparation checkpoints without writing storage
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import {getJsonStorage} from './apps/web/lib/data.ts';
          const storage=getJsonStorage();
          const [manifest,lock]=await Promise.all([storage.readJson('catalog/manifest.json',null),storage.readJson('catalog/import-lock.json',null)]);
          console.log(JSON.stringify({readOnly:true,generation:manifest?.generationId,publicationActive:Date.parse(lock?.lockedUntil||'')>Date.now(),operationType:lock?.operationType,startedAt:lock?.startedAt,heartbeatAt:lock?.heartbeatAt,lockedUntil:lock?.lockedUntil}));
          for(const scope of ['catalog/runtime-budget-prices-v3/','catalog/runtime-sort-prices-v3/','catalog/generations/'+manifest.generationId+'/indexes/budget-markets-v3/']){
            const rows=await storage.listObjects(scope);
            const recent=rows.slice().sort((a,b)=>String(b.lastModified||'').localeCompare(String(a.lastModified||''))).slice(0,3);
            console.log(JSON.stringify({readOnly:true,scope,objects:rows.length,recent:recent.map(r=>({path:r.key,modified:r.lastModified,bytes:r.size}))}));
          }
          JS
