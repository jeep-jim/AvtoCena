name: Replace strict EV and hybrid catalog support

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-strict-ev-hybrid-support.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-after-current-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel superseded EV patch run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/31306822107 --jq '.status' 2>/dev/null || echo unknown)"
          echo "superseded_run_status=$status"
          if [ "$status" != "completed" ] && [ "$status" != "unknown" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/31306822107/cancel" || true
          fi

      - name: Wait for the already-running scaling wave
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wait_run() {
            local run_id="$1"
            for _ in $(seq 1 240); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""' 2>/dev/null || true)"
              echo "run=$run_id status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then return 0; fi
              sleep 60
            done
            echo "Timed out waiting for run $run_id" >&2
            return 1
          }
          wait_run 31304940273
          wait_run 31304953903

      - name: Sync latest main after current publishers finish
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Add safe strict EV and hybrid support
        run: python .github/patches/apply-safe-ev-hybrid-patch.py

      - name: Validate patched catalog paths
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          npm run typecheck

      - name: Commit safe strict EV and hybrid support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/spec-normalization.ts
          git add 'apps/web/app/(public)/cars/page.tsx'
          git add scripts/catalog-live-recovery-market.mjs
          git add scripts/catalog-live-recovery-europe-otomoto.mjs
          git add scripts/catalog-live-recovery-direct-exact.mjs
          git add scripts/catalog-live-recovery-japan-prestige.mjs
          git commit -m "Fix EV hybrid classification and certified power"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
