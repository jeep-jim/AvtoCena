name: Apply China Autohome quality v1
on:
  push:
    branches:
      - fix/china-quality-scale-20260810
    paths:
      - .github/workflows/apply-china-autohome-quality-v1.yml
permissions:
  contents: write
jobs:
  apply_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/china-quality-scale-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply production patch
        run: python3 scripts/apply-china-autohome-quality-v1.py
      - name: Typecheck
        run: npm run typecheck
      - name: Validate exact Autohome spec 68589
        shell: bash
        run: |
          cat > validate-autohome-68589.mts <<'TS'
          import { AutohomeNewExactAdapter } from './apps/web/lib/catalog/autohome-new-exact-source';
          import { catalogOfferTitle, catalogTransmissionName } from './apps/web/lib/catalog/presentation';
          const adapter = new AutohomeNewExactAdapter();
          const now = new Date().toISOString();
          const offer:any = {
            id:'diag', sourceId:'autohome_new_china_open', sourceOfferId:'68589', market:'china', offerType:'fixed', status:'active', catalogKind:'listing',
            sourceTitle:'2025款 2.0T 尊享版', make:'', model:'', trim:'2025款 2.0T 尊享版', year:2025,
            sourcePrice:298000, sourceCurrency:'CNY', priceMode:'fixed', images:[], totalRub:null, calculationStatus:'needs_data', firstSeenAt:now, updatedAt:now,
            operational:{sourceUrl:'https://www.autohome.com.cn/spec/68589/', raw:{listing:{specId:'68589',seriesId:'7768',trimTitle:'2025款 2.0T 尊享版',year:2025,priceWan:29.8,sourcePriceCny:298000,sourceUrl:'https://www.autohome.com.cn/spec/68589/',galleryUrl:'https://car.autohome.com.cn/pic/series-s68589/7768.html'}}}
          };
          const images = await adapter.fetchImages(offer);
          const title = catalogOfferTitle(offer);
          const transmission = catalogTransmissionName(offer.transmission);
          const direct = images.filter((x:any)=>/^https:\/\/car\d+\.autoimg\.cn\/cardfs\/product\//i.test(String(x.url)));
          console.log(JSON.stringify({title,make:offer.make,model:offer.model,transmissionRaw:offer.transmission,transmission,imageCount:images.length,directCount:direct.length,first:images.slice(0,5).map((x:any)=>x.url),gallerySafetyMode:offer.operational?.gallerySafetyMode,exactGalleryImageCount:offer.operational?.raw?.exactGalleryImageCount},null,2));
          if (images.length < 20) throw new Error(`too_few_exact_images:${images.length}`);
          if (direct.length !== images.length) throw new Error(`non_original_images:${direct.length}/${images.length}`);
          if (!/автомат/.test(transmission) || /[\u3400-\u9fff]/u.test(transmission)) throw new Error(`transmission_not_russian:${transmission}`);
          if (/Китайский бренд|\bмодель\b/i.test(title) || /[\u3400-\u9fff]/u.test(title)) throw new Error(`title_not_clean:${title}`);
          if (!/Juntian/i.test(title)) throw new Error(`title_identity_missing:${title}`);
          if (Number(offer.operational?.raw?.exactGalleryImageCount || 0) < 20) throw new Error('next_data_gallery_not_used');
          TS
          npx tsx validate-autohome-68589.mts
          rm validate-autohome-68589.mts
      - name: Commit validated production files
        shell: bash
        run: |
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm -f .github/workflows/apply-china-autohome-quality-v1.yml .github/workflows/diag-autohome-gallery-68589.yml scripts/apply-china-autohome-quality-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/autohome-new-exact-source.ts apps/web/lib/catalog/spec-normalization.ts apps/web/lib/catalog/presentation.ts
          git commit -m 'Fix China exact galleries and Russian transmission labels'
          git push origin HEAD:fix/china-quality-scale-20260810