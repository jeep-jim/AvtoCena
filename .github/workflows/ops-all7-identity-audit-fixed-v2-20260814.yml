name: Ops · All-7 identity audit fixed v2 20260814
run-name: Final all-7 identity proof · ${{ github.sha }}

on:
  push:
    branches:
      - ops/all7-identity-audit-fixed-v2-20260814

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run final read-only all-seven identity audit
        env:
          CATALOG_AUDIT_OUTPUT: all7-fixed-v2-audit.json
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Inspect exact invalid source identities without publishing
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { hasCredibleCatalogIdentity } = await import('./apps/web/lib/catalog/offer-quality.ts');
          const markets = ['japan','korea','china','uae','europe','georgia','kyrgyzstan'];
          const result = {};
          for (const market of markets) {
            const rows = await readMarketOffers(market);
            result[market] = rows
              .filter((offer) => !hasCredibleCatalogIdentity(offer))
              .slice(0, 100)
              .map((offer) => ({
                id: offer.id,
                sourceId: offer.sourceId,
                make: offer.make,
                model: offer.model,
                sourceTitle: offer.sourceTitle || offer.operational?.sourceTitle || '',
                sourceUrl: offer.operational?.sourceUrl || '',
              }));
          }
          fs.writeFileSync('all7-invalid-source-samples.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Summarize final pre-rerun identity state
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('all7-fixed-v2-audit.json','utf8'));
          console.log('| Market | Live | Source invalid | Rendered invalid | <5 photos |');
          console.log('|---|---:|---:|---:|---:|');
          for (const [market, row] of Object.entries(report.markets || {})) {
            console.log(`| ${market} | ${row.count} | ${row.invalidIdentityCount} | ${row.renderedIdentityFailureCount} | ${row.belowFiveImagesCount} |`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all7-fixed-v2-audit
          path: |
            all7-fixed-v2-audit.json
            all7-invalid-source-samples.json
          if-no-files-found: error
          retention-days: 5
