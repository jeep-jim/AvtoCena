name: Diagnose retained Volkswagen page after expiry once
# Read-only bounded diagnosis after rejected acceptance43168144361.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-retained-vw-expiry.yml']
permissions:
  contents: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 'a182cd21b21ecf612b63613d263e5bdd817ea4c0'
      - name: Read retained production identity and bounded candidate diagnostics
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'python3 -' <<'REMOTE'
          import json,subprocess,datetime,urllib.request,pathlib,time,os
          expected='a182cd21b21ecf612b63613d263e5bdd817ea4c0'
          def identity():
              value=json.loads(subprocess.check_output(['docker','inspect','avtocena-production'],text=True))[0]
              assert value['State']['Running'] and value['Config']['Labels'].get('org.opencontainers.image.revision')==expected
              port=value['HostConfig']['PortBindings']['3000/tcp'][0]
              assert port['HostIp']=='127.0.0.1' and port['HostPort'] in ['3000','3001']
              return {'source':expected,'image':value['Image'],'port':int(port['HostPort'])}
          before=identity();base='http://127.0.0.1:'+str(before['port'])
          def health():
              with urllib.request.urlopen(base+'/api/health',timeout=15) as response:value=json.load(response)
              assert value.get('ok') is True and value.get('releaseSha')==expected
              return {k:value.get(k) for k in ['ok','releaseSha','calculationVersion']}
          def cpu():
              total=list(map(int,pathlib.Path('/proc/stat').read_text().splitlines()[0].split()[1:9]))
              rows=subprocess.check_output(['docker','top','avtocena-production','-eo','pid,comm'],text=True).splitlines()[1:]
              ticks={}
              for row in rows:
                  fields=row.split(maxsplit=1)
                  if len(fields)==2:
                      try:
                          raw=pathlib.Path('/proc/'+fields[0]+'/stat').read_text().rsplit(')',1)[1].split()
                          ticks[fields[0]]=int(raw[11])+int(raw[12])
                      except (OSError,ValueError,IndexError):pass
              return {'total':sum(total),'idle':total[3]+total[4],'node':ticks}
          def throttling():
              value=json.loads(subprocess.check_output(['docker','inspect','avtocena-production'],text=True))[0]
              pid=value['State']['Pid']
              lines=pathlib.Path('/proc/'+str(pid)+'/cgroup').read_text().splitlines()
              unified=next((line.split(':',2)[2] for line in lines if line.startswith('0::')),None)
              if unified is None:return {'available':False}
              root=pathlib.Path('/sys/fs/cgroup')/unified.lstrip('/')
              stats={key:int(number) for key,number in (line.split() for line in (root/'cpu.stat').read_text().splitlines())}
              return {'available':True,'cpuMax':(root/'cpu.max').read_text().strip(),'stats':stats}
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'identityBefore':before,'healthBefore':health(),'readOnly':True,'scope':'Six sequential Volkswagen page/API requests on retained release, two 35s gaps. Serving host and concurrent traffic; no cold-process claim, no baseline replacement, no deployment. API is deliberately measured both after HTML and after its own expiry.','samples':[]}
          html='/cars?market=china&make=Volkswagen&page=2'
          api='/api/catalog/search?market=china&make=Volkswagen&page=2'
          for phase,delay,route in [('htmlFirst',0,html),('htmlRepeat',0,html),('htmlAfter35s',35,html),('apiAfterHtml',0,api),('apiAfter35s',35,api),('htmlAfterApi',0,html)]:
              if delay:time.sleep(delay)
              c0=cpu();th0=throttling();started=time.monotonic();observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
              try:
                  with urllib.request.urlopen(base+route,timeout=15) as response:
                      body=response.read();status=response.status;serverTiming=response.headers.get("Server-Timing")
                  seconds=time.monotonic()-started;c1=cpu();th1=throttling()
                  nodeTicks=sum(max(0,c1['node'].get(pid,n)-n) for pid,n in c0['node'].items())
                  record={'phase':phase,'route':route,'at':observed,'seconds':round(seconds,4),'status':status,'bytes':len(body),'serverTiming':serverTiming,'complete':status==200 and ((route==api and json.loads(body).get('ok') is True and len(json.loads(body).get('items',[]))>0 and isinstance(json.loads(body).get('total'),int)) or (route==html and b'</html>' in body and b'$RX(' not in body and len(body)>50000)),'cpuMax':th1.get('cpuMax'),'cpuStatDelta':{k:th1['stats'][k]-v for k,v in th0.get('stats',{}).items()} ,'containerProcessCount':len(c0['node']),'containerProcessCpuPercent':round(100*nodeTicks/os.sysconf('SC_CLK_TCK')/seconds,2) if c0['node'] else None,'hostCpuPercent':round(100*(1-(c1['idle']-c0['idle'])/max(1,c1['total']-c0['total'])),2)}
              except Exception as error:record={'phase':phase,'route':route,'at':observed,'seconds':round(time.monotonic()-started,4),'errorType':type(error).__name__}
              report['samples'].append(record);print('RETAINED_PAGE_CPU_SAMPLE',json.dumps(record),flush=True)
          assert all(row.get('complete') for row in report['samples']),'incomplete diagnostic response'
          report['healthAfter']=health();report['identityAfter']=identity()
          assert before==report['identityAfter'],'retained runtime changed during observation'
          print('RETAINED_PAGE_CPU_REPORT',json.dumps(report),flush=True)
          REMOTE
