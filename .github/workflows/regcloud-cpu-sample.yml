name: Regcloud — sample busy JavaScript once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-cpu-sample.json']
permissions:
  contents: read
jobs:
  sample:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sample CPU on container loopback and close the temporary listener
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          scp "${ssh_opts[@]}" scripts/regcloud-cpu-sample.mjs root@151.248.113.177:/opt/avtocena/cpu-sample-once.mjs
          expected=$(python3 -c 'import json,re;v=json.load(open(".github/market-runs/regcloud-cpu-sample.json"))["release"];assert re.fullmatch(r"[a-f0-9]{40}",v);print(v)')
          ssh "${ssh_opts[@]}" root@151.248.113.177 bash -s -- "$expected" <<'REMOTE'
          set -euo pipefail
          exec 9>/run/lock/avtocena-runtime-change.lock
          flock -w 30 9
          expected=$1
          actual=$(docker exec avtocena-production node -e 'console.log(process.env.AVTOCENA_RELEASE_SHA)')
          test "$actual" = "$expected"
          printf 'PROFILE_EXACT_RELEASE %s\n' "$actual"
          test "$(docker inspect --format '{{index .Config.Labels "avtocena.role"}}' avtocena-production)" = production
          # The inspector uses loopback inside the container, with no published port.
          docker inspect --format '{{json .HostConfig.PortBindings}}' avtocena-production | python3 -c 'import json,sys; p=json.load(sys.stdin);assert set(p)=={"3000/tcp"};assert p["3000/tcp"][0]["HostIp"]=="127.0.0.1"'
          docker exec avtocena-production node -e 'fetch("http://127.0.0.1:9229/json/list").then(()=>process.exit(1),()=>process.exit(0))'
          docker kill --signal=USR1 avtocena-production >/dev/null
          sleep 1
          timeout 45 docker exec -i avtocena-production node --input-type=module < /opt/avtocena/cpu-sample-once.mjs || { timeout 20 docker exec -i -e CPU_SAMPLE_CLOSE_ONLY=1 avtocena-production node --input-type=module < /opt/avtocena/cpu-sample-once.mjs; exit 1; }
          docker exec avtocena-production node -e 'fetch("http://127.0.0.1:9229/json/list").then(()=>{console.error("INSPECTOR_STILL_OPEN");process.exit(1)},()=>console.log("INSPECTOR_CLOSED"))'
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' avtocena-production)
          curl -sS --max-time 8 -o /dev/null -w 'HEALTH %{http_code} %{time_total}\n' "http://127.0.0.1:$port/api/health" || true
          test "$(docker exec avtocena-production node -e 'console.log(process.env.AVTOCENA_RELEASE_SHA)')" = "$expected"
          docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}}' avtocena-production
          docker logs --since 20m --tail 10000 avtocena-production 2>&1 | python3 -c 'import sys,json,collections;rows=[];errors=collections.Counter()
          for line in sys.stdin:
              if "catalog_storage_read " in line:
                  try:rows.append(json.loads(line.split("catalog_storage_read ",1)[1]))
                  except:pass
              for code in ["object_storage_response_timeout","fetch failed","TimeoutError","FATAL ERROR","heap out of memory"]:
                  if code in line:errors[code]+=1
          print("MARKET_SLOW_READS",json.dumps(sorted(rows,key=lambda x:x["ms"],reverse=True)[:30]));print("ERROR_COUNTS",json.dumps(errors))'
          REMOTE
