name: Validate China non-passenger cleanup no publish

on:
  push:
    branches: [ops/china-nonpassenger-cleanup-20260810]
    paths:
      - .github/workflows/validate-china-nonpassenger-cleanup-20260810.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/china-nonpassenger-cleanup-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Audit exact China non-passenger rows without write
        run: |
          npx tsx -e 'import {readMarketOffers} from "./apps/web/lib/catalog/storage.ts"; import {isNonPassengerCatalogBodyType,hasCredibleOfferContent} from "./apps/web/lib/catalog/offer-quality.ts"; (async()=>{ const rows=await readMarketOffers("china"); const bad=rows.filter(x=>isNonPassengerCatalogBodyType(x.bodyType)); const credible=rows.filter(x=>hasCredibleOfferContent({...x,status:"active"})); console.log(JSON.stringify({before:rows.length,nonPassenger:bad.map(x=>({id:x.id,sourceId:x.sourceId,sourceOfferId:x.sourceOfferId,make:x.make,model:x.model,bodyType:x.bodyType})),afterCredible:credible.length},null,2)); if(bad.length!==2) throw new Error(`expected 2 existing non-passenger rows, got ${bad.length}`); if(credible.length!==rows.length-bad.length) throw new Error(`credible cleanup mismatch ${credible.length}/${rows.length-bad.length}`); })().catch(e=>{console.error(e);process.exit(1)});'
      - name: Verify seven-market baseline remains readable
        env:
          CATALOG_AUDIT_OUTPUT: china-cleanup-preflight.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":2832,"china":8130,"japan":423,"uae":173,"europe":4676,"georgia":51,"kyrgyzstan":2337}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs || test -s china-cleanup-preflight.json
