name: Apply model-year inventory quota 20260813
# export validated generated changes because Actions token cannot push workflow edits
on:
  push:
    branches: [fix/model-year-quota-20260813]
    paths:
      - .github/workflows/apply-model-year-quota-20260813.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-year-quota-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic quota patch
        run: python3 .github/patches/run-model-year-quota-20260813.py
      - name: Validate quota scripts
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-enforce-global-model-cap.mjs
          node --check scripts/catalog-japan-strict-merge-publish.mjs
          node --check scripts/catalog-replace-georgia-atomic.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-recovery-publish-batch-stable.mjs
          node --import tsx --test tests/catalog-model-year-quota.test.ts tests/catalog-global-model-cap.test.ts
          npm run typecheck
      - name: Package validated generated files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status HEAD > generated-model-year-quota-name-status.txt
          git diff --binary HEAD > generated-model-year-quota.patch
          git diff --name-only --diff-filter=ACMRT HEAD > generated-model-year-quota-present-files.txt
          mkdir -p generated-model-year-quota-files
          while IFS= read -r file; do
            test -n "$file" || continue
            mkdir -p "generated-model-year-quota-files/$(dirname "$file")"
            cp "$file" "generated-model-year-quota-files/$file"
          done < generated-model-year-quota-present-files.txt
          tar -czf generated-model-year-quota-files.tgz generated-model-year-quota-files
          cat generated-model-year-quota-name-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validated-model-year-quota-patch
          path: |
            generated-model-year-quota-name-status.txt
            generated-model-year-quota.patch
            generated-model-year-quota-files.tgz
          if-no-files-found: error
          retention-days: 3
