name: Validate model-year inventory quota 20260813
# final validation after making K Car repair dispatch-only
on:
  push:
    branches: [fix/model-year-quota-20260813]
    paths:
      - .github/workflows/apply-model-year-quota-20260813.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-year-quota-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate model-year quota paths
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-enforce-global-model-cap.mjs
          node --check scripts/catalog-japan-strict-merge-publish.mjs
          node --check scripts/catalog-replace-georgia-atomic.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-recovery-publish-batch-stable.mjs
          node --import tsx --test tests/catalog-model-year-quota.test.ts tests/catalog-global-model-cap.test.ts
          npm run typecheck
