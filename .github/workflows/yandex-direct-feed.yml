name: Publish Yandex Direct feed
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-direct-feed.yml'
      - 'scripts/publish-yandex-direct-feed.mjs'
      - 'apps/web/lib/catalog/yandex-direct-*.ts'
  workflow_run:
    workflows: ['Catalog refresh green', 'Catalog refresh china', 'Catalog refresh korea', 'Catalog refresh uae', 'Catalog refresh georgia', 'Catalog refresh europe']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: yandex-direct-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node --import tsx scripts/publish-yandex-direct-feed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yandex-direct-feed-report
          path: yandex-direct-feed-report.json
          retention-days: 14
