name: Apply strict EV and hybrid catalog support

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ev-hybrid-catalog-support.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  patch-after-current-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the already-running scaling wave
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wait_run() {
            local run_id="$1"
            for _ in $(seq 1 240); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""' 2>/dev/null || true)"
              echo "run=$run_id status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then return 0; fi
              sleep 60
            done
            echo "Timed out waiting for run $run_id" >&2
            return 1
          }
          wait_run 31304940273
          wait_run 31304953903

      - name: Sync latest main after current publishers finish
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Add strict certified EV and hybrid support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, got {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          # Canonical fuel labels are important because public filtering/indexes use
          # `fuel=electric` and `fuel=hybrid`. e-POWER is a series hybrid.
          spec = 'apps/web/lib/catalog/spec-normalization.ts'
          replace_once(
              spec,
              'if (/phev|plug[ -]?in|hybrid|hev|mhev|reev|erev|range extender|гибрид|混合动力|增程|하이브리드/.test(text)) return "hybrid";',
              'if (/phev|plug[ -]?in|hybrid|hev|mhev|e[- ]?power|reev|erev|range extender|гибрид|混合动力|增程|하이브리드/.test(text)) return "hybrid";',
          )
          replace_once(
              spec,
              'if (/series[ -]?hybrid|range[ -]?extender|\\b(?:reev|erev)\\b|последовательн\\w*\\s+гибрид|增程/.test(text)) return "series_hybrid";',
              'if (/series[ -]?hybrid|range[ -]?extender|e[- ]?power|\\b(?:reev|erev)\\b|последовательн\\w*\\s+гибрид|增程/.test(text)) return "series_hybrid";',
          )
          replace_once(
              spec,
              '''  const powertrainKind = offer.powertrainKind && offer.powertrainKind !== "unknown"
            ? offer.powertrainKind
            : inferPowertrainKind(`${primary} ${full}`, engineCc);
          const thirtyMinute = exactThirtyMinutePowers(offer, full);''',
              '''  const powertrainKind = offer.powertrainKind && offer.powertrainKind !== "unknown"
            ? offer.powertrainKind
            : inferPowertrainKind(`${primary} ${full}`, engineCc);
          if (powertrainKind === "electric") fuel = "electric";
          else if (["series_hybrid", "other_hybrid"].includes(powertrainKind)) fuel = "hybrid";
          const thirtyMinute = exactThirtyMinutePowers(offer, full);''',
          )

          # Generic Korea/China/Georgia path: source-exact 30-minute
          # values are already parsed by normalization; certified reference is a
          # second strict route before customs calculation.
          generic = 'scripts/catalog-live-recovery-market.mjs'
          replace_once(
              generic,
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\n',
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\nconst { enrichOfferWithCertifiedPower } = await import("../apps/web/lib/catalog/power-reference.ts");\n',
          )
          replace_once(
              generic,
              '      offer = normalizeVehicleOfferSpecs(await safeVariantEnrich(offer));\n      let calculated;',
              '''      offer = normalizeVehicleOfferSpecs(await safeVariantEnrich(offer));
              if (["electric", "series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))) {
                offer = normalizeVehicleOfferSpecs(await enrichOfferWithCertifiedPower(offer));
              }
              let calculated;''',
          )
          replace_once(
              generic,
              '  count: offers.length,\n  preferredCount,',
              '''  count: offers.length,
          electricCount: offers.filter((offer) => String(offer.powertrainKind || "") === "electric").length,
          hybridCount: offers.filter((offer) => ["series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))).length,
          documentedPowerCount: offers.filter((offer) => String(offer.powerDataConfidence || "") === "documented").length,
          preferredCount,''',
          )

          # Europe uses its own exact Otomoto recovery path.
          europe = 'scripts/catalog-live-recovery-europe-otomoto.mjs'
          replace_once(
              europe,
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\n',
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\nconst { enrichOfferWithCertifiedPower } = await import("../apps/web/lib/catalog/power-reference.ts");\n',
          )
          replace_once(
              europe,
              '    offer = await fillOnlyUnambiguousSpecs(offer);\n    let calculated;',
              '''    offer = await fillOnlyUnambiguousSpecs(offer);
              if (["electric", "series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))) {
                offer = normalizeVehicleOfferSpecs(await enrichOfferWithCertifiedPower(offer));
              }
              let calculated;''',
          )
          replace_once(
              europe,
              '  count: offers.length,\n  preferredCount:',
              '''  count: offers.length,
          electricCount: offers.filter((offer) => String(offer.powertrainKind || "") === "electric").length,
          hybridCount: offers.filter((offer) => ["series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))).length,
          documentedPowerCount: offers.filter((offer) => String(offer.powerDataConfidence || "") === "documented").length,
          preferredCount:''',
          )

          # UAE direct-exact path uses the same certified power reference.
          direct = 'scripts/catalog-live-recovery-direct-exact.mjs'
          replace_once(
              direct,
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\n',
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\nconst { enrichOfferWithCertifiedPower } = await import("../apps/web/lib/catalog/power-reference.ts");\n',
          )
          replace_once(
              direct,
              '    offer = await fillOnlyUnambiguousSpecs(offer);\n    let calculated;',
              '''    offer = await fillOnlyUnambiguousSpecs(offer);
              if (["electric", "series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))) {
                offer = normalizeVehicleOfferSpecs(await enrichOfferWithCertifiedPower(offer));
              }
              let calculated;''',
          )
          replace_once(
              direct,
              '  count: offers.length,\n  preferredCount:',
              '''  count: offers.length,
          electricCount: offers.filter((offer) => String(offer.powertrainKind || "") === "electric").length,
          hybridCount: offers.filter((offer) => ["series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))).length,
          documentedPowerCount: offers.filter((offer) => String(offer.powerDataConfidence || "") === "documented").length,
          preferredCount:''',
          )

          # Japan remains strict sold-result only; this only adds a documented
          # OTTS/SBKTS/ZOETS/EPTS/COC/manufacturer-document power source and does
          # not infer a value from peak motor power.
          japan = 'scripts/catalog-live-recovery-japan-prestige.mjs'
          replace_once(
              japan,
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\n',
              'const { normalizeVehicleOfferSpecs } = await import("../apps/web/lib/catalog/spec-normalization.ts");\nconst { enrichOfferWithCertifiedPower } = await import("../apps/web/lib/catalog/power-reference.ts");\n',
          )
          replace_once(
              japan,
              '  offer = await uniqueVariantEnrich(offer);\n  let calculated;',
              '''  offer = await uniqueVariantEnrich(offer);
          if (["electric", "series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))) {
            offer = normalizeVehicleOfferSpecs(await enrichOfferWithCertifiedPower(offer));
          }
          let calculated;''',
          )
          replace_once(
              japan,
              '  calculatedCount: offers.filter(exactCalculation).length,\n  rejected,',
              '''  calculatedCount: offers.filter(exactCalculation).length,
          electricCount: offers.filter((offer) => String(offer.powertrainKind || "") === "electric").length,
          hybridCount: offers.filter((offer) => ["series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))).length,
          documentedPowerCount: offers.filter((offer) => String(offer.powerDataConfidence || "") === "documented").length,
          rejected,''',
          )

          # Japan's server-side post-filter must also recognize legacy rows by
          # powertrain kind until every preserved row has been republished.
          cars = 'apps/web/app/(public)/cars/page.tsx'
          replace_once(
              cars,
              '  if (common.fuel && String(offer.fuel || "") !== common.fuel) return false;',
              '''  if (common.fuel) {
              const kind = String(offer.powertrainKind || "");
              const canonicalFuel = kind === "electric" ? "electric" : ["series_hybrid", "other_hybrid"].includes(kind) ? "hybrid" : String(offer.fuel || "");
              if (canonicalFuel !== common.fuel) return false;
            }''',
          )
          PY

      - name: Validate patched catalog paths
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          npm run typecheck

      - name: Commit strict EV and hybrid support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/lib/catalog/spec-normalization.ts \
            'apps/web/app/(public)/cars/page.tsx' \
            scripts/catalog-live-recovery-market.mjs \
            scripts/catalog-live-recovery-europe-otomoto.mjs \
            scripts/catalog-live-recovery-direct-exact.mjs \
            scripts/catalog-live-recovery-japan-prestige.mjs
          git commit -m "Include certified EV and hybrid inventory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
