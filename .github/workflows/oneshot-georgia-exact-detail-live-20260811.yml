name: One-shot Georgia exact detail live
run-name: Georgia exact detail live · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-georgia-exact-detail-live-20260811.yml

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  RECOVERY_DIRECT_MARKET: georgia
  RECOVERY_OUTPUT: catalog-rebuild-georgia.json
  RECOVERY_TARGET: "1000"
  RECOVERY_MAX_PAGES: "120"
  RECOVERY_TIME_LIMIT_MS: "2700000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  georgia:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate exact Georgia path
        run: |
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
      - name: Snapshot all seven before Georgia write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-before-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: ""
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Collect Georgia with exact detail gallery
        run: npx tsx scripts/catalog-live-recovery-direct-exact.mjs
      - name: Assert collected Georgia galleries are exact and deep
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('catalog-rebuild-georgia.json','utf8'));
          const rows=Array.isArray(p.offers)?p.offers:[];
          if(!rows.length) throw new Error('georgia_no_collected_rows');
          const weak=rows.filter(x=>(x.images||[]).length<5);
          const badIdentity=rows.filter(x=>x?.operational?.raw?.recoveryExactPhotoIdentity!==true || x?.operational?.raw?.listingBoundImages!==true);
          if(weak.length) throw new Error(`georgia_weak_gallery:${weak.length}/${rows.length}`);
          if(badIdentity.length) throw new Error(`georgia_identity_missing:${badIdentity.length}/${rows.length}`);
          const counts=rows.map(x=>(x.images||[]).length);
          console.log({count:rows.length,min:Math.min(...counts),max:Math.max(...counts),avg:counts.reduce((a,b)=>a+b,0)/counts.length});
          NODE
      - name: Publish Georgia cumulative only
        env:
          RECOVERY_PUBLISH_MARKET: georgia
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-georgia.json
          RECOVERY_PUBLISH_REPORT: catalog-georgia-publish-report.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit all seven after Georgia write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-after-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Assert preservation, age, model and Georgia photo improvement
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const before=JSON.parse(fs.readFileSync('catalog-georgia-before-all7.json','utf8'));
          const after=JSON.parse(fs.readFileSync('catalog-georgia-after-all7.json','utf8'));
          for(const market of ['korea','china','japan','uae','europe','kyrgyzstan']){
            const b=Number(before.markets?.[market]?.count||0), a=Number(after.markets?.[market]?.count||0);
            if(a!==b) throw new Error(`unexpected_cross_market_change:${market}:${b}->${a}`);
          }
          for(const [market,s] of Object.entries(after.markets||{})){
            if(Number(s.belowMarketMinYearCount||0)!==0) throw new Error(`age:${market}:${s.belowMarketMinYearCount}`);
            if(Number(s.nonVehicleCount||0)!==0) throw new Error(`nonvehicle:${market}`);
            if(Number(s.nonPositiveSourcePriceCount||0)!==0) throw new Error(`sourceprice:${market}`);
            if(Number(s.maxPerExactModel||0)>20) throw new Error(`modelcap:${market}:${s.maxPerExactModel}`);
          }
          const gb=Number(before.markets?.georgia?.belowFiveImagesCount||0);
          const ga=Number(after.markets?.georgia?.belowFiveImagesCount||0);
          if(ga>=gb) throw new Error(`georgia_photo_not_improved:${gb}->${ga}`);
          console.log({georgiaBefore:before.markets.georgia,georgiaAfter:after.markets.georgia});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-exact-detail-live-reports
          path: |
            catalog-rebuild-georgia.json
            catalog-georgia-publish-report.json
            catalog-georgia-before-all7.json
            catalog-georgia-after-all7.json
          if-no-files-found: warn
          retention-days: 3
