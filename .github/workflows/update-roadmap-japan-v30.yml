name: Update roadmap Japan auction statistics v30

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/japan-auction-statistics-v30
          fetch-depth: 0
      - name: Update permanent project roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('roadmap.md')
          text = path.read_text(encoding='utf-8')
          old = '''### 4.3. Япония

Основные зарегистрированные направления:

- BE FORWARD;
- TCV;
- Goo-net / Goo-net Exchange;
- Carused.jp;
- Car From Japan;
- Japan Partner;
- Car Deal Page;
- PicknBuy24;
- Autocom Japan;
- EveryCar;
- Autorec;
- Nikkyo;
- JPAuc;
- CarVector;
- JP Center;
- Prestige Motorsport;
- другие зарегистрированные экспортные и статистические площадки.

Не смешивать легковые автомобили с грузовиками, автобусами и коммерческой техникой.
'''
          new = '''### 4.3. Япония

Главный публичный раздел Японии — **статистика отыгранных аукционных лотов**, а не смешанная витрина экспортных машин в наличии.

Приоритетные источники статистики:

- Japan Transit / `japantransit_japan_stat_open` — публичные результаты по маркам и моделям;
- JPAuc / `jpauc_japan_past_open` — прошедшие аукционы;
- CarVector / `carvector_japan_stat_open` — аукционная статистика;
- другие статистические источники только после подтверждения актуальным probe.

Дополнительные экспортные каталоги BE FORWARD, TCV, Goo-net, Carused.jp, Car From Japan, Japan Partner, Car Deal Page, PicknBuy24, Autocom Japan, EveryCar, Autorec, Nikkyo, JP Center и Prestige Motorsport могут использоваться для отдельных задач и пополнения базы знаний, но не должны вытеснять статистику торгов из основного японского раздела.

Обязательные поля аукционного результата, когда они опубликованы источником:

- марка, модель и год;
- цена результата торгов и исходная валюта;
- дата торгов;
- аукцион и номер лота;
- аукционная оценка;
- пробег;
- кузов / frame number;
- объём двигателя и коробка;
- фотография именно этого лота;
- ссылка на публичную страницу статистики.

Правила цены:

- `auctionPriceKind=hammer` использовать только для явно опубликованной цены удара молотка / end price;
- если сайт показывает собственную рублёвую цену результата без доказательства, что это чистая цена молотка, хранить `auctionPriceKind=published_result` и не переименовывать её в JPY;
- цена отыгранного лота показывается отдельно от расчёта «под ключ»;
- таможня и утильсбор рассчитываются нашим движком только при достаточных данных; иначе честно показывается статус уточнения;
- нельзя выдавать приблизительную экспортную цену или стартовую ставку за фактическую цену продажи.

Не смешивать легковые автомобили с грузовиками, автобусами и коммерческой техникой. Исторический аукционный результат хранится как активная запись каталога с `catalogKind=auction_result` и `auctionResult=sold`, а не как текущее объявление в продаже.
'''
          if old not in text:
              raise SystemExit('roadmap_japan_section_not_found')
          text = text.replace(old, new, 1)
          journal = '''

### 2026-07-28 — Japan auction statistics v30

Решение владельца продукта:

- публичный каталог Японии должен показывать статистику уже отыгранных аукционных лотов;
- главная цена карточки — опубликованный результат торгов;
- обычные экспортные объявления не должны смешиваться с основной японской выдачей, если доступны аукционные результаты.

Реализация:

- добавлен специализированный адаптер `japantransit_japan_stat_open`;
- источник обходит модельные страницы Japan Transit и накапливает историю через постоянный cursor;
- карточка хранит `catalogKind=auction_result`, `auctionResult=sold` и точный тип опубликованной цены;
- страница `/cars?market=japan` фильтрует японскую выдачу до аукционных результатов;
- JPAuc и CarVector остаются дополнительными зарегистрированными статистическими источниками;
- коммерческие лоты исключаются;
- добавлены parser/adapter тесты и отдельный шаг CI;
- production-объём и фактические источники записать после нового probe/rebuild/publish прохода.
'''
          marker = '### Шаблон новой записи'
          if '### 2026-07-28 — Japan auction statistics v30' not in text:
              pos = text.rfind(marker)
              text = text[:pos] + journal + '\n' + text[pos:] if pos >= 0 else text + journal
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/update-roadmap-japan-v30.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add roadmap.md .github/workflows/update-roadmap-japan-v30.yml
          git commit -m "Roadmap: Япония как статистика отыгранных аукционных лотов"
          git push origin HEAD:automation/japan-auction-statistics-v30
