name: Prepare missing current home overview once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-current-home-preparation.yml']
permissions:
  contents: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: regcloud-staging
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_OVERVIEW_SKIP_READY: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '8731103c0102886064c6a0a19a14182502e6e3be'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify unchanged generation and exact current-day scope
        run: |
          node --import tsx --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {getJsonStorage} from './apps/web/lib/data.ts';
          const storage=getJsonStorage();
          assert.equal(storage.driver,'object');
          assert.equal(new Date(Date.now()+7*3600000).toISOString().slice(0,10),'2026-11-12');
          const manifest=await storage.readJson('catalog/manifest.json',null);
          assert.equal(manifest?.generationId,'gen_1794357678562_9c0667cb');
          const health=await fetch('https://avtocena.com/api/health',{signal:AbortSignal.timeout(15000)}).then(r=>r.json());
          assert.equal(health.ok,true);
          assert.equal(health.releaseSha,'a182cd21b21ecf612b63613d263e5bdd817ea4c0');
          console.log(JSON.stringify({generation:manifest.generationId,production:health.releaseSha,scope:'derived pages only; today and next two days'}));
          CHECK
      - name: Preserve source, generation, date and conditional-write guards
        run: node --test tests/catalog-overview-source-validation.test.mjs tests/catalog-refresh-generation-pages.test.mjs
      - name: Prepare complete overview and dated pages from stored generation
        run: |
          set -euo pipefail
          unset RELEASE_PREPARATION_MARKETS
          node --import tsx scripts/catalog-refresh-generation-pages.mjs | tee current-home-preparation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-home-preparation
          path: current-home-preparation.log
