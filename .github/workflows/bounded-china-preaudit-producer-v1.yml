        '
    - name: Run separately pinned portable regression suite
      run: "set -euo pipefail\npython - <<'PY'\nimport base64,hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job'\n\
        manifest_bytes=(root/'package'/'SOURCE_MANIFEST.json').read_bytes()\nassert hashlib.sha256(manifest_bytes).hexdigest()==os.environ['OPERATIONAL_MANIFEST_SHA256']\n\
        manifest=json.loads(manifest_bytes);assert manifest['dynamicSitesReviewed'] is True\nfor directory,entries\
        \ in [(root/'package'/'operational',manifest['operational']['files']),*( (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/k,manifest['native'][k]['files'])\
        \ for k in ['publisher','runtime'])]:\n    for e in entries:\n        b=(directory/e['path']).read_bytes();assert\
        \ len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']\nenvelope=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'tests-blob.json'))\n\
        bundle=json.loads(base64.b64decode(envelope['content']))\nassert bundle['kind']=='selected-portable-ci-tests-not-whole-publication'\n\
        inventory={e['path'] for e in bundle['files']}\ntests=bundle['tests'];assert tests and len(tests)==len(set(tests))\n\
        assert all(t in inventory and t.endswith('.test.mjs') and not t.startswith('-') for t in tests)\n\
        for e in bundle['files']:\n    source=root/'tests'/e['path'];target=root/'package'/'operational'/e['path']\n\
        \    assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True)\n    with target.open('xb')\
        \ as f:f.write(source.read_bytes())\nsubprocess.run(['node','--test','--test-concurrency=1',*tests],cwd=root/'package'/'operational',check=True)\n\
        PY\n"
    - name: Exercise exact controller watchdog and prepare-only cut
      run: "set -euo pipefail\npython - <<'PYCI'\nimport base64,json,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job'\n\
        e=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'watchdog-tests-blob.json'));bundle=json.loads(base64.b64decode(e['content']))\n\
        assert bundle['kind']=='actual-controller-watchdog-regression-tests'\nallowed={'test.mjs','watchdog.test.mjs','rss-race.test.mjs','independent-rss-review.test.mjs','watchdog.before.mjs','watchdog-teardown.test.mjs'}\n\
        assert {x['path'] for x in bundle['files']}==allowed\nassert set(bundle['tests'])==allowed-{'watchdog.before.mjs'}\n\
        for f in bundle['files']:\n    dest=root/'controller'/f['path'];assert not dest.exists()\n    with\
        \ dest.open('xb') as out:out.write((root/'watchdog-tests'/f['path']).read_bytes())\ns=(root/'controller'/'materialize-job.mjs').read_text()\n\
        assert \"mode:'prepare',entry\" in s and \"authorizeCommit\" not in s and \"stopAfterPreauditCheckpoint:true\"\
        \ in s and \"checkpointLauncherFile:wrapper\" in s\nassert all(k not in s for k in ['stopAfterResourceAdmission','resumePreauditCheckpoint','checkpointMetadataFile'])\n\
        subprocess.run(['node','--test','--test-concurrency=1',*bundle['tests']],cwd=root/'controller',check=True)\n\
        PYCI\n"
  recover:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Seal new policy day China
      checkpoint from saved input'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Bind to new UTC+7 policy day before any archive storage access
      run: 'set -euo pipefail

        python - <<''PYDAY''

        from datetime import datetime, timezone, timedelta

        now=datetime.now(timezone.utc)

        assert now>=datetime(2026,11,19,17,tzinfo=timezone.utc),''prior_policy_day_still_active''

        assert (now+timedelta(hours=7)).date().isoformat()==''2026-11-20'',''new_policy_day_mismatch''

        assert now<datetime(2026,11,21,5,2,36,435000,tzinfo=timezone.utc),''source_expired''

        PYDAY

        '
    - name: Refuse pending fresh-commit code pins
      run: 'set -euo pipefail

        [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]

        [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$WATCHDOG_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        '
    - uses: actions/checkout@v4
      with:
        ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
        path: publisher
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
        path: runtime
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Materialize exact hash-bound code without storage credentials
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n[[ \"$OPERATIONAL_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CONTROLLER_PACKAGE_BLOB\"\
        \ =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CI_TEST_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$OPERATIONAL_MANIFEST_SHA256\"\
        \ =~ ^[a-f0-9]{64}$ ]]\nmkdir -m700 \"$RUNNER_TEMP/china-job\"\ncat > \"$RUNNER_TEMP/unpack-frozen.py\"\
        \ <<'PY'\n#!/usr/bin/env python3\n\"\"\"Decode an exact Git blob containing reviewed source only.\
        \ No archive authority.\"\"\"\nimport base64,hashlib,json,os,pathlib,re,sys\n\ndef unpack(response,expected_blob,destination):\n\
        \    if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')\n    response=pathlib.Path(response);destination=pathlib.Path(destination)\n\
        \    if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute()\
        \ or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')\n\
        \    envelope=json.loads(response.read_bytes())\n    if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob:\
        \ raise ValueError('blob_binding')\n    content=base64.b64decode(''.join(envelope['content'].split()),validate=True)\n\
        \    if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\\0'+content).hexdigest()!=expected_blob:\
        \ raise ValueError('blob_hash')\n    bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]\n\
        \    if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise\
        \ ValueError('bundle_schema')\n    for e in entries:\n        name=e['path'];parts=name.split('/')\n\
        \        if not re.fullmatch(r'[A-Za-z0-9_.\\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data')\
        \ for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')):\
        \ raise ValueError('bundle_path')\n        data=e['contents'].encode('utf-8');total+=len(data)\n \
        \       if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']:\
        \ raise ValueError('bundle_file_binding')\n        prepared.append((parts,data));seen.add(name)\n\
        \    destination.mkdir(mode=0o700)\n    # Only immutable hash-pinned controller-authored names enter\
        \ this fresh private root.\n    for parts,data in prepared:\n        out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)\n\
        \        fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)\n        try:\n    \
        \        view=memoryview(data)\n            while view:\n                n=os.write(fd,view)\n   \
        \             if n<=0: raise ValueError('bundle_short_write')\n                view=view[n:]\n   \
        \     finally: os.close(fd)\n    return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}\n\
        if __name__=='__main__':\n    try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))\n\
