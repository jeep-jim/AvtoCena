name: Save verified fresh China preaudit checkpoint
permissions:
  contents: read
  actions: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
env:
  OPERATIONAL_PACKAGE_BLOB: 90244a76115674672d58454c1fff5291d2bd1eef
  OPERATIONAL_MANIFEST_SHA256: d98289d7fb2345bdbcbab54e9c4fcf958c885b68d660d65cc7aa3cee626c971f
  CONTROLLER_PACKAGE_BLOB: 70b7da6073783d9f663e44fb2e0f23a243d77471
  CI_TEST_PACKAGE_BLOB: f67efc8179e73a63551c10227b876f08e62b60d5
  WATCHDOG_TEST_PACKAGE_BLOB: d7c040ab916b34ebf7f3d1d17cc3d3ea2e5e9ced
  CHINA_COLLECTOR_REVISION: 038574d914de2436cd10871629b1b0a8fe83a92c
  CHINA_COLLECTOR_RUN: '44457059256'
  CHINA_COLLECTOR_ATTEMPT: '1'
  CHINA_RECEIPT_ARTIFACT: '14500964905'
  CHINA_RECEIPT_ZIP_SHA256: c0802faab0b9ecc39e6d44b53d66f76c19cac485258f5ed2c80e5c2b59ac8097
  CHINA_EXPECTED_ARCHIVE_SHA256: b8a2a25dc27390845dd5a423efa323c9472a338b1b97f413ba96aefa7f3b65ca
  CHINA_EXPECTED_REPORT_FILE_SHA256: 894bb1eb1b37042de7ce611e19d8e33bfd58c01546d2a812f2c87f96cd906caf
  CHINA_EXPECTED_REPORT_DIGEST: 894bb1eb1b37042de7ce611e19d8e33bfd58c01546d2a812f2c87f96cd906caf
  CHINA_EXPECTED_RECEIPT_FILE_SHA256: 174893f63c5870628a3df1ab3a5241fe49847f01fa579a84d80a369383c3c49a
  CHINA_EXPECTED_SOURCE_ROWS: '290044'
  CHINA_EXPECTED_WITNESS_ABSENCE: che168_replica_witness_worker_source_unverified
  CHINA_EXPECTED_BASE_PUBLIC_SHA256: 4c34c20d9784b571414390cab450ceeeaee60b00c168476100419ec5c05cb038
  CHINA_EXPECTED_BASE_INTERNAL_SHA256: 0aa3524abf2aa0563811a7980ebe9eded7566a1d2ab36b057557dfb7caba6585
jobs:
  ci:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Seal new policy day China
      checkpoint from saved input'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Refuse pending fresh-commit code pins
      run: 'set -euo pipefail

        [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]

        [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$WATCHDOG_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        '
    - uses: actions/checkout@v4
      with:
        ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
        path: publisher
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
        path: runtime
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Materialize exact hash-bound code without storage credentials
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n[[ \"$OPERATIONAL_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CONTROLLER_PACKAGE_BLOB\"\
        \ =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CI_TEST_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$OPERATIONAL_MANIFEST_SHA256\"\
        \ =~ ^[a-f0-9]{64}$ ]]\nmkdir -m700 \"$RUNNER_TEMP/china-job\"\ncat > \"$RUNNER_TEMP/unpack-frozen.py\"\
        \ <<'PY'\n#!/usr/bin/env python3\n\"\"\"Decode an exact Git blob containing reviewed source only.\
        \ No archive authority.\"\"\"\nimport base64,hashlib,json,os,pathlib,re,sys\n\ndef unpack(response,expected_blob,destination):\n\
        \    if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')\n    response=pathlib.Path(response);destination=pathlib.Path(destination)\n\
        \    if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute()\
        \ or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')\n\
        \    envelope=json.loads(response.read_bytes())\n    if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob:\
        \ raise ValueError('blob_binding')\n    content=base64.b64decode(''.join(envelope['content'].split()),validate=True)\n\
        \    if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\\0'+content).hexdigest()!=expected_blob:\
        \ raise ValueError('blob_hash')\n    bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]\n\
        \    if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise\
        \ ValueError('bundle_schema')\n    for e in entries:\n        name=e['path'];parts=name.split('/')\n\
        \        if not re.fullmatch(r'[A-Za-z0-9_.\\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data')\
        \ for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')):\
        \ raise ValueError('bundle_path')\n        data=e['contents'].encode('utf-8');total+=len(data)\n \
        \       if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']:\
        \ raise ValueError('bundle_file_binding')\n        prepared.append((parts,data));seen.add(name)\n\
        \    destination.mkdir(mode=0o700)\n    # Only immutable hash-pinned controller-authored names enter\
        \ this fresh private root.\n    for parts,data in prepared:\n        out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)\n\
        \        fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)\n        try:\n    \
        \        view=memoryview(data)\n            while view:\n                n=os.write(fd,view)\n   \
        \             if n<=0: raise ValueError('bundle_short_write')\n                view=view[n:]\n   \
        \     finally: os.close(fd)\n    return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}\n\
        if __name__=='__main__':\n    try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))\n\
        \    except Exception:\n        print('{\"ok\":false,\"code\":\"frozen_bundle_unpack_failed\"}',file=sys.stderr);sys.exit(1)\n\
        PY\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$OPERATIONAL_PACKAGE_BLOB\" > \"$RUNNER_TEMP/package-blob.json\"\
        \npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/package-blob.json\" \"$OPERATIONAL_PACKAGE_BLOB\"\
        \ \"$RUNNER_TEMP/china-job/package\"\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$CONTROLLER_PACKAGE_BLOB\"\
        \ > \"$RUNNER_TEMP/controller-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/controller-blob.json\"\
        \ \"$CONTROLLER_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/controller\"\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$CI_TEST_PACKAGE_BLOB\"\
        \ > \"$RUNNER_TEMP/tests-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/tests-blob.json\"\
        \ \"$CI_TEST_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/tests\"\n[[ \"$WATCHDOG_TEST_PACKAGE_BLOB\" =~\
        \ ^[a-f0-9]{40}$ ]]\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$WATCHDOG_TEST_PACKAGE_BLOB\" > \"\
        $RUNNER_TEMP/watchdog-tests-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/watchdog-tests-blob.json\"\
        \ \"$WATCHDOG_TEST_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/watchdog-tests\"\n"
    - name: Install exact locked test toolchain
      run: 'set -euo pipefail

        test "$(node --version)" = v24.22.1

        npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.9.0

        export PATH="$RUNNER_TEMP/pinned-npm/node_modules/.bin:$PATH"

        echo "$RUNNER_TEMP/pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"

        test "$(npm --version)" = 11.9.0

