        }\nexport function validateNewChinaScope({pub,internal,lease,cursor,controls},now=Date.now()){\n require(pub?.digest===fixed.public&&pub.value?.generationId===fixed.publicGen&&pub.etag==='\"\
        de7be92050ed3919e2422e86b7fda737\"'&&\n  internal?.digest===fixed.internal&&internal.value?.generationId===fixed.internalGen&&internal.etag==='\"\
        dc38c32d0c3937415c811028f5e1684e\"','newday_baseline');\n const until=lease?.value?.lockedUntil;\n\
        \ require(lease===null||until===''||typeof until==='string'&&Date.parse(until)<=now,'newday_lease');\n\
        \ const sources=cursor?.value?.sources?.filter(x=>x.provider==='auto_api_che168')??[];\n require(cursor?.etag&&cursor.value.version===1&&cursor.value.market==='china'&&sources.length===1&&sources[0].cursor===12360638&&\n\
        \  typeof sources[0].snapshotBinding==='string'&&/^[0-9a-f]{64}$/.test(sources[0].snapshotBinding)&&sources[0].replica,'newday_cursor');\n\
        \ const c=controls?.value;\n require(c?.version===1&&c.markets?.china?.enabled===true&&c.sources?.che168_feed?.enabled===true&&c.sources?.ajes_china_feed?.enabled===false,'newday_controls');\n\
        \ return {baselineMatched:true,leaseNotActive:true,chinaCursor:12360638,ownerChinaAndChe168Enabled:true,ownerAjesDisabled:true};\n\
        }\nif(process.argv.includes('--verify')){\n try{\n  const [pub,internal,lease,cursor,controls]=await\
        \ Promise.all([...keys].map(k=>readChinaGoKey(k)));\n  console.log(JSON.stringify({stage:'private_new_policy_input_admission',at:new\
        \ Date().toISOString(),...validateNewChinaScope({pub,internal,lease,cursor,controls}),storageGets:5,storageWrites:0,supplierRequests:0}));\n\
        \ }catch(e){console.error(/^newday_[a-z_]+$/.test(e?.message||'')?e.message:'newday_admission_failed');process.exitCode=1;}\n\
        }\n\nJS\nnode \"$RUNNER_TEMP/china-new-day-go.mjs\" --verify\n"
    - name: Restore exact fresh complete archive before publication admission
      working-directory: publisher
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: node --import tsx "$RUNNER_TEMP/china-job/controller/restore-producer.mjs"
    - name: Bind exact package, toolchain, current request and resource ceilings
      run: 'set -euo pipefail

        python - <<''PY''

        import json,os,pathlib

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''china-job'';workspace=pathlib.Path(os.environ[''GITHUB_WORKSPACE''])

        request={''jobRoot'':str(root),''publisherRoot'':str(workspace/''publisher''),''runtimeRoot'':str(workspace/''runtime''),''packageDirectory'':str(root/''package''),''controllerDirectory'':str(root/''controller''),''expectedManifestSha256'':os.environ[''OPERATIONAL_MANIFEST_SHA256''],''runId'':os.environ[''GITHUB_RUN_ID''],''attempt'':os.environ[''GITHUB_RUN_ATTEMPT''],''revision'':os.environ[''GITHUB_SHA''],''receiptFile'':str(root/''producer-receipt.json'')}

        with (root/''request.json'').open(''x'') as f:json.dump(request,f)

        PY

        node "$RUNNER_TEMP/china-job/controller/materialize-job.mjs" "$RUNNER_TEMP/china-job/request.json"
        > "$RUNNER_TEMP/china-job/materialized.json"

        node "$RUNNER_TEMP/china-job/package/operational/production/runner-resources.mjs" "$GITHUB_WORKSPACE"
        "$RUNNER_TEMP" "$RUNNER_TEMP/china-job/evidence/startup-resources.json"

        cat "$RUNNER_TEMP/china-job/evidence/startup-resources.json"

        python - <<''PYRES''

        import json,os,pathlib

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''china-job'';c=json.load(open(root/''config.json''));r=json.load(open(root/''evidence''/''startup-resources.json''))

        m=r[''memory''];status=m[''cgroupMemoryStatus''];assert status in (''finite'',''unlimited''),''startup_cgroup_unverified''

        available=min(m[''availableBytes''],m[''cgroupMemoryAvailable''] if status==''finite'' else m[''availableBytes''])

        assert available>=c[''minMemoryBytes''],''startup_memory_refused''

        assert min(f[''availableBytes''] for f in r[''filesystems''].values())>=c[''minFreeDiskBytes''],''startup_disk_refused''

        print(''startup_resources_verified_no_storage_access'')

        PYRES

        '
    - name: Prepare and seal private checkpoint without audit or publication
