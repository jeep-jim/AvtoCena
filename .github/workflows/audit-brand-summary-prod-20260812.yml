name: Audit brand summary production 20260812
run-name: Read-only brand summary timing · ${{ github.sha }}

on:
  push:
    branches:
      - audit/brand-summary-prod-20260812
    paths:
      - ".github/workflows/audit-brand-summary-prod-20260812.yml"

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Time brand summary reads against production Object Storage
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/audit-brand-summary.ts <<'TS'
          (async () => {
            const storage = await import(process.cwd() + '/apps/web/lib/catalog/storage.ts');
            const time = async (label: string, fn: () => Promise<any>) => {
              const start = performance.now();
              const value = await fn();
              const ms = performance.now() - start;
              const size = Array.isArray(value) ? value.length : value?.models?.length ?? Object.keys(value?.counts || {}).length ?? null;
              console.log(JSON.stringify({ label, ms: Math.round(ms * 10) / 10, size, generationId: value?.generationId || null }));
            };
            await time('BMW cold model counts', () => storage.readCatalogBrandModelCounts('BMW'));
            await time('Audi warm model counts', () => storage.readCatalogBrandModelCounts('Audi'));
            await time('all brand counts warm', () => storage.readCatalogBrandCounts({}));
            storage.resetCatalogReadCachesForTests();
            await time('all brand counts cold reset', () => storage.readCatalogBrandCounts({}));
          })().catch((error) => { console.error(error); process.exit(1); });
          TS
          npx tsx /tmp/audit-brand-summary.ts
