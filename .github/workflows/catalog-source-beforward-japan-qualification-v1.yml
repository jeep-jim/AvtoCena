name: Catalog source qualification · BE FORWARD Japan v1

on:
  workflow_dispatch:
  push:
    branches:
      - feat/beforward-japan-qualification-v1-20260904
    paths:
      - ".github/workflows/catalog-source-beforward-japan-qualification-v1.yml"
      - "scripts/catalog-source-beforward-japan-qualification-v1.mjs"
      - "scripts/catalog-source-beforward-japan-classify-v1.mjs"
      - "tests/catalog-source-beforward-japan-qualification-v1.test.ts"
      - "tests/catalog-source-beforward-japan-classify-v1.test.ts"
      - "docs/catalog-source-beforward-japan-qualification-v1.md"
      - "data/catalog/source-qualification-v1.json"
      - "roadmap.md"
      - "scripts/catalog-source-access-probe-v1.mjs"
      - "scripts/catalog-source-field-audit-v1.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-source-beforward-japan-qualification-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify BE FORWARD qualification and classification contracts
        run: |
          node --import tsx --test tests/catalog-source-beforward-japan-qualification-v1.test.ts
          node --import tsx --test tests/catalog-source-beforward-japan-classify-v1.test.ts
      - name: Type-check project
        run: npm run typecheck
      - name: Verify durable BE FORWARD ledger and roadmap checkpoint
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const row=p.candidates.find(x=>x.sourceId==='beforward_japan_candidate');
          if(!row) throw new Error('BE FORWARD missing');
          if(row.class!=='lead_only') throw new Error(`class=${row.class}`);
          if(row.publishAllowed!==false) throw new Error('publishAllowed must remain false');
          const roadmap=fs.readFileSync('roadmap.md','utf8');
          if((roadmap.match(/### 40\.30\. BE FORWARD Japan:/g)||[]).length!==1) throw new Error('40.30 missing/duplicated');
          if(!roadmap.includes('33834993597') || !roadmap.includes('33835096407')) throw new Error('writer chronology missing');
          if(roadmap.endsWith('\n\n')) throw new Error('extra blank line at EOF');
          NODE
      - name: Qualify BE FORWARD Japan without production writes
        env:
          CATALOG_SOURCE_BEFORWARD_JAPAN_TIMEOUT_MS: "20000"
          CATALOG_SOURCE_BEFORWARD_JAPAN_MAX_BODY_BYTES: "1600000"
          CATALOG_SOURCE_BEFORWARD_JAPAN_SAMPLE_COUNT: "4"
        run: node scripts/catalog-source-beforward-japan-qualification-v1.mjs
      - name: Verify no-write evidence envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-beforward-japan-qualification-v1.json', 'utf8'));
          for (const key of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) {
            if (p[key] !== false) throw new Error(`${key} must be false`);
          }
          if (p.sourcePublishAllowed !== false && p.sourcePublishAllowed !== undefined) throw new Error('sourcePublishAllowed');
          if (!p.sourceVerdict) throw new Error('sourceVerdict missing');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-beforward-japan-qualification-v1
          path: catalog-source-beforward-japan-qualification-v1.json
          if-no-files-found: error
          retention-days: 7
