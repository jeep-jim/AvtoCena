name: Validate Japan official ICE power recovery

on:
  push:
    branches:
      - fix/japan-official-ice-power-20260810
    paths:
      - ".github/workflows/japan-official-ice-power-branch.yml"
      - ".github/patches/apply-japan-official-ice-power.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL: "20"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      PRESTIGE_RECOVERY_TARGET: "3000"
      PRESTIGE_RECOVERY_CONCURRENCY: "12"
      PRESTIGE_RECOVERY_OUTPUT: diag-japan-official-ice-power.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply strict branch-only Japan enrichment
        run: |
          python .github/patches/apply-japan-official-ice-power.py
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          npm run typecheck
      - name: Audit available official power knowledge
        shell: bash
        run: |
          cat > /tmp/audit-power.ts <<'TS'
          import { pathToFileURL } from "node:url";
          async function main() {
            const url = pathToFileURL(process.env.GITHUB_WORKSPACE + "/apps/web/lib/catalog/power-knowledge.ts").href;
            const { readVehiclePowerKnowledge } = await import(url);
            const rows = await readVehiclePowerKnowledge();
            const official = rows.filter((r:any) => ["manufacturer","registry"].includes(String(r.confidence || "")));
            console.log(JSON.stringify({ total: rows.length, official: official.length, samples: official.slice(0,20).map((r:any)=>({id:r.id,make:r.make,model:r.model,yearFrom:r.yearFrom,yearTo:r.yearTo,engineCc:r.engineCc,powerHp:r.powerHp,confidence:r.confidence})) }, null, 2));
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          TS
          npx tsx /tmp/audit-power.ts
      - name: Download newest repaired Prestige aggregate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          artifact_id="$(gh api 'repos/'"$GITHUB_REPOSITORY"'/actions/runs/31338331776/artifacts?per_page=100' --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output prestige.zip
          unzip -qo prestige.zip -d prestige-input
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_RECOVERY_INPUT=$source_file" >> "$GITHUB_ENV"
      - name: Convert strict sold lots without publishing
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-official-ice-power-diagnostic
          path: diag-japan-official-ice-power.json
          if-no-files-found: warn
          retention-days: 3
