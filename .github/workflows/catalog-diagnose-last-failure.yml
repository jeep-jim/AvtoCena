name: Diagnose last catalog failure

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Catalog source-scale daily", "Catalog Object Storage cleanup"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-diagnose-last-failure.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    name: Inspect completed catalog workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact result to telemetry issue
        uses: actions/github-script@v7
        env:
          TELEMETRY_ISSUE: "155"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.TELEMETRY_ISSUE);
            const marker = '<!-- catalog-last-failure -->';
            const workflowIds = [
              'catalog-production-recovery-v15.yml',
              'catalog-storage-cleanup.yml',
            ];

            let run = context.payload.workflow_run;
            if (!run || !['Catalog source-scale daily', 'Catalog Object Storage cleanup'].includes(run.name)) {
              const candidates = [];
              for (const workflowId of workflowIds) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: 'main',
                  per_page: 10,
                });
                candidates.push(...data.workflow_runs);
              }
              run = candidates.sort((left, right) => Date.parse(right.run_started_at || right.created_at) - Date.parse(left.run_started_at || left.created_at))[0];
            }
            if (!run) {
              core.notice('No catalog workflow found.');
              return;
            }

            const jobs = [];
            for (let page = 1; page <= 10; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
                page,
              });
              jobs.push(...response.data.jobs);
              if (response.data.jobs.length < 100) break;
            }
            const failedJobs = jobs.filter((job) => ['failure', 'timed_out', 'cancelled'].includes(String(job.conclusion || '')));
            const jobsToInspect = failedJobs.length ? failedJobs : jobs.slice(-2);
            const logSections = [];
            for (const job of jobsToInspect.slice(0, 8)) {
              let log = '';
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  owner,
                  repo,
                  job_id: job.id,
                  headers: { accept: 'application/vnd.github+json' },
                });
                log = typeof response.data === 'string'
                  ? response.data
                  : Buffer.from(response.data || []).toString('utf8');
              } catch (error) {
                log = `log_download_failed: ${error?.message || String(error)}`;
              }
              const failedSteps = (job.steps || [])
                .filter((step) => ['failure', 'timed_out', 'cancelled'].includes(String(step.conclusion || '')))
                .map((step) => `${step.number}. ${step.name}: ${step.conclusion}`);
              const important = log.split('\n').filter((line) => /##\[error\]|Error:|AssertionError|catalog_|object_storage_|BucketMaxSizeExceeded|blocked|planned|deleted|failed|failure|timed out|exit code/i.test(line));
              const tail = (important.length ? important : log.split('\n').slice(-140)).slice(-220).join('\n').slice(-20000);
              logSections.push(
                `### ${job.name}\n` +
                `job_id: \`${job.id}\` · status: \`${job.status}\` · conclusion: \`${job.conclusion}\`\n\n` +
                `Failed steps:\n${failedSteps.length ? failedSteps.map((line) => `- ${line}`).join('\n') : '- нет'}\n\n` +
                `<details><summary>Существенные строки лога</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`
              );
            }

            const status = run.status !== 'completed'
              ? `🟠 ${run.status}`
              : run.conclusion === 'success' ? '✅ успешно' : `❌ ${run.conclusion || 'unknown'}`;
            const body = `${marker}\n## Последний catalog workflow: ${status}\n\n` +
              `- workflow: **${run.name}**\n` +
              `- run: [#${run.run_number}](${run.html_url})\n` +
              `- run_id: \`${run.id}\`\n` +
              `- commit: \`${run.head_sha}\`\n` +
              `- started: \`${run.run_started_at || run.created_at}\`\n` +
              `- status: \`${run.status}\`\n` +
              `- conclusion: \`${run.conclusion}\`\n` +
              `- jobs: **${jobs.length}**, failed: **${failedJobs.length}**\n\n` +
              (logSections.join('\n\n') || 'Логи jobs не получены.');

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: issueNumber, per_page: 100 });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
