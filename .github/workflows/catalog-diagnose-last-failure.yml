name: Diagnose Catalog V2 (manual only)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    name: Inspect latest Catalog V2 production workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact Catalog V2 result to telemetry issue
        uses: actions/github-script@v7
        env:
          TELEMETRY_ISSUE: "155"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.TELEMETRY_ISSUE);
            const marker = '<!-- catalog-last-failure -->';
            const workflowId = 'catalog-v2-production.yml';

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch: 'main',
              per_page: 20,
            });
            const run = data.workflow_runs[0];
            if (!run) {
              core.notice('No Catalog V2 production run found.');
              return;
            }

            const jobs = [];
            for (let page = 1; page <= 10; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
                page,
              });
              jobs.push(...response.data.jobs);
              if (response.data.jobs.length < 100) break;
            }
            const failedJobs = jobs.filter((job) => ['failure', 'timed_out', 'cancelled'].includes(String(job.conclusion || '')));
            const jobsToInspect = failedJobs.length ? failedJobs : jobs.slice(-3);
            const logSections = [];
            for (const job of jobsToInspect.slice(0, 10)) {
              let log = '';
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  owner,
                  repo,
                  job_id: job.id,
                  headers: { accept: 'application/vnd.github+json' },
                });
                log = typeof response.data === 'string'
                  ? response.data
                  : Buffer.from(response.data || []).toString('utf8');
              } catch (error) {
                log = `log_download_failed: ${error?.message || String(error)}`;
              }
              const failedSteps = (job.steps || [])
                .filter((step) => ['failure', 'timed_out', 'cancelled'].includes(String(step.conclusion || '')))
                .map((step) => `${step.number}. ${step.name}: ${step.conclusion}`);
              const important = log.split('\n').filter((line) => /##\[error\]|Error:|AssertionError|catalog_v2|catalog_|object_storage_|BucketMaxSizeExceeded|published|generationId|byMarket|byMarketAndSource|priority|shortageToUnlock|calculatedShare|imageStats|knowledge|sourceErrors|failed|failure|timed out|exit code/i.test(line));
              const tail = (important.length ? important : log.split('\n').slice(-160)).slice(-280).join('\n').slice(-30000);
              logSections.push(
                `### ${job.name}\n` +
                `job_id: \`${job.id}\` · status: \`${job.status}\` · conclusion: \`${job.conclusion}\`\n\n` +
                `Failed steps:\n${failedSteps.length ? failedSteps.map((line) => `- ${line}`).join('\n') : '- нет'}\n\n` +
                `<details><summary>Существенные строки лога</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`
              );
            }

            const status = run.status !== 'completed'
              ? `🟠 ${run.status}`
              : run.conclusion === 'success' ? '✅ успешно' : `❌ ${run.conclusion || 'unknown'}`;
            const body = `${marker}\n## Последний Catalog V2 production: ${status}\n\n` +
              `- workflow: **${run.name}**\n` +
              `- run: [#${run.run_number}](${run.html_url})\n` +
              `- run_id: \`${run.id}\`\n` +
              `- commit: \`${run.head_sha}\`\n` +
              `- started: \`${run.run_started_at || run.created_at}\`\n` +
              `- status: \`${run.status}\`\n` +
              `- conclusion: \`${run.conclusion}\`\n` +
              `- jobs: **${jobs.length}**, failed: **${failedJobs.length}**\n\n` +
              (logSections.join('\n\n') || 'Логи jobs не получены.');

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: issueNumber, per_page: 100 });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
