name: Diagnose last catalog failure

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Catalog source-scale daily"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-diagnose-last-failure.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    name: Inspect completed production run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact result to telemetry issue
        uses: actions/github-script@v7
        env:
          TELEMETRY_ISSUE: "155"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.TELEMETRY_ISSUE);
            const marker = '<!-- catalog-last-failure -->';
            const workflowId = 'catalog-production-recovery-v15.yml';

            let run = context.payload.workflow_run;
            if (!run || run.name !== 'Catalog source-scale daily') {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                per_page: 30,
              });
              run = runs.workflow_runs[0];
            }
            if (!run) {
              core.notice('No Catalog source-scale daily run found.');
              return;
            }

            const jobs = [];
            for (let page = 1; page <= 10; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
                page,
              });
              jobs.push(...response.data.jobs);
              if (response.data.jobs.length < 100) break;
            }
            const failedJobs = jobs.filter((job) => ['failure', 'timed_out', 'cancelled'].includes(String(job.conclusion || '')));
            const logSections = [];
            for (const job of failedJobs.slice(0, 8)) {
              let log = '';
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  owner,
                  repo,
                  job_id: job.id,
                  headers: { accept: 'application/vnd.github+json' },
                });
                log = typeof response.data === 'string'
                  ? response.data
                  : Buffer.from(response.data || []).toString('utf8');
              } catch (error) {
                log = `log_download_failed: ${error?.message || String(error)}`;
              }
              const failedSteps = (job.steps || [])
                .filter((step) => ['failure', 'timed_out', 'cancelled'].includes(String(step.conclusion || '')))
                .map((step) => `${step.number}. ${step.name}: ${step.conclusion}`);
              const important = log.split('\n').filter((line) => /##\[error\]|Error:|AssertionError|catalog_|object_storage_|failed|failure|timed out|exit code/i.test(line));
              const tail = (important.length ? important : log.split('\n').slice(-120)).slice(-180).join('\n').slice(-16000);
              logSections.push(
                `### ${job.name}\n` +
                `job_id: \`${job.id}\` · conclusion: \`${job.conclusion}\`\n\n` +
                `Failed steps:\n${failedSteps.length ? failedSteps.map((line) => `- ${line}`).join('\n') : '- не определены'}\n\n` +
                `<details><summary>Существенные строки лога</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`
              );
            }

            const status = run.conclusion === 'success' ? '✅ успешно' : `❌ ${run.conclusion || 'unknown'}`;
            const body = `${marker}\n## Последний production-run каталога: ${status}\n\n` +
              `- workflow run: [#${run.run_number}](${run.html_url})\n` +
              `- run_id: \`${run.id}\`\n` +
              `- commit: \`${run.head_sha}\`\n` +
              `- started: \`${run.run_started_at || run.created_at}\`\n` +
              `- conclusion: \`${run.conclusion}\`\n` +
              `- jobs: **${jobs.length}**, failed: **${failedJobs.length}**\n\n` +
              (logSections.join('\n\n') || 'Упавших jobs нет.');

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: issueNumber, per_page: 100 });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
