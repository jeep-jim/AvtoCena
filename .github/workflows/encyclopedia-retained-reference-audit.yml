name: Encyclopedia — inspect retained technical groups
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/encyclopedia-retained-reference-audit.json']
permissions:
  contents: read
concurrency:
  group: encyclopedia-retained-reference-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test tests/encyclopedia-retained-reference-audit.test.mjs
      - name: Inventory saved reference groups without requests to suppliers
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/encyclopedia/audit-retained-references.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-reference-inventory
          path: reports/retained-reference-inventory.json
          retention-days: 14
