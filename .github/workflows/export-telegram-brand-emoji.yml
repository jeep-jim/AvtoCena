name: Export Telegram brand emoji
run-name: Export Telegram brand emoji · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build Telegram custom emoji archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, shutil, zipfile

          root = Path('apps/web/public/brand-logos/drom')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          out = Path('telegram-brand-emoji')
          if out.exists():
              shutil.rmtree(out)
          for folder in ('telegram-100x100/light', 'telegram-100x100/dark', 'original/light', 'original/dark'):
              (out / folder).mkdir(parents=True, exist_ok=True)

          def prepare(src, dst):
              image = Image.open(src).convert('RGBA')
              bbox = image.getchannel('A').getbbox()
              if bbox:
                  image = image.crop(bbox)
              image.thumbnail((84, 84), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (100, 100), (0, 0, 0, 0))
              canvas.alpha_composite(image, ((100 - image.width) // 2, (100 - image.height) // 2))
              canvas.save(dst, 'PNG', optimize=True)

          index, missing = [], []
          for slug, brand in sorted(manifest.get('brands', {}).items()):
              entry = {'slug': slug, 'name': brand.get('name', slug), 'files': {}}
              for theme in ('light', 'dark'):
                  rel = str(brand.get('themes', {}).get(theme, {}).get('path', '')).lstrip('/')
                  src = Path('apps/web/public') / rel
                  if not src.exists():
                      missing.append(str(src))
                      continue
                  shutil.copy2(src, out / 'original' / theme / f'{slug}{src.suffix.lower()}')
                  dst = out / 'telegram-100x100' / theme / f'{slug}.png'
                  prepare(src, dst)
                  entry['files'][theme] = str(dst.relative_to(out))
              index.append(entry)

          readme_lines = [
              'АвтоЦена — логотипы автомобильных брендов для Telegram Custom Emoji',
              '',
              f'Брендов: {len(index)}',
              'Формат: PNG, 100×100 px, прозрачный фон.',
              '',
              'telegram-100x100/light — для светлой темы Telegram.',
              'telegram-100x100/dark — для тёмной темы Telegram.',
              'original/light и original/dark — исходные файлы проекта.',
              'index.json — названия брендов и пути файлов.',
              '',
              'Загрузка: @Stickers → /newemojipack → Static emoji.',
          ]
          (out / 'README.txt').write_text('\n'.join(readme_lines), encoding='utf-8')
          (out / 'index.json').write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding='utf-8')
          if missing:
              (out / 'missing.txt').write_text('\n'.join(missing), encoding='utf-8')

          archive = Path('avtocena-brand-logos-telegram-emoji.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for file in sorted(out.rglob('*')):
                  if file.is_file():
                      z.write(file, file.relative_to(out.parent))
          print(json.dumps({'brands': len(index), 'missing': len(missing), 'bytes': archive.stat().st_size}))
          PY
      - name: Upload ready archive
        uses: actions/upload-artifact@v4
        with:
          name: avtocena-brand-logos-telegram-emoji
          path: avtocena-brand-logos-telegram-emoji.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
