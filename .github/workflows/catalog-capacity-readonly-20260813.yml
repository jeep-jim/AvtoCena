name: Catalog capacity read-only audit 20260813
run-name: Read-only catalog capacity audit · ${{ github.sha }}

on:
  push:
    branches:
      - audit/catalog-capacity-readonly-20260813
    paths:
      - .github/workflows/catalog-capacity-readonly-20260813.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit catalog storage without writes
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dataModule = await import('./apps/web/lib/data.ts');
          const data = dataModule.default || dataModule;
          const storage = data.getJsonStorage();
          if (!storage.listObjects) throw new Error(`list_objects_unsupported:${storage.driver}`);
          const [manifest, internalManifest, generationObjects, internalObjects, imageObjects, publicObjects] = await Promise.all([
            data.readDataJson('catalog/manifest.json', { generationId:'', markets:{} }),
            data.readDataJson('catalog/internal/manifest.json', { generationId:'', sources:{} }),
            storage.listObjects('catalog/generations'),
            storage.listObjects('catalog/internal/offers'),
            storage.listObjects('catalog/images'),
            storage.listObjects('catalog/public'),
          ]);
          const bytes = (rows) => rows.reduce((sum,row)=>sum+Math.max(0,Number(row?.size||0)),0);
          const generationIdFromKey = (key) => String(key||'').match(/^catalog\/generations\/(gen_(\d+)_[-a-z0-9]+)\//i)?.[1] || '';
          const ts = (id) => Number(String(id||'').match(/^gen_(\d+)_/)?.[1]||0);
          const generations = [...new Set(generationObjects.map(o=>generationIdFromKey(o.key)).filter(Boolean))].sort((a,b)=>ts(b)-ts(a));
          const liveGeneration = String(manifest?.generationId||'');
          const latestTwo = generations.slice(0,2);
          const protectedGenerations = new Set([liveGeneration, ...latestTwo].filter(Boolean));
          const cleanupCandidates = generations.filter(id=>!protectedGenerations.has(id));
          const candidateSet = new Set(cleanupCandidates);
          const candidateGenerationObjects = generationObjects.filter(o=>candidateSet.has(generationIdFromKey(o.key)));
          const protectedInternalPaths = new Set(Object.values(internalManifest?.sources||{}).flatMap(source=>Array.isArray(source?.chunks)?source.chunks.map(String):[]));
          const orphanInternal = internalObjects.filter(o=>o?.key && !protectedInternalPaths.has(String(o.key)));
          const perGeneration = Object.fromEntries(generations.map(id=>{
            const rows=generationObjects.filter(o=>generationIdFromKey(o.key)===id);
            return [id,{objects:rows.length,bytes:bytes(rows),protected:protectedGenerations.has(id)}];
          }));
          const report = {
            version:1,
            checkedAt:new Date().toISOString(),
            driver:storage.driver,
            currentPublicGeneration:liveGeneration||null,
            currentInternalGeneration:String(internalManifest?.generationId||'')||null,
            manifestCounts:Object.fromEntries(Object.entries(manifest?.markets||{}).map(([market,v])=>[market,Number(v?.count||0)])),
            discoveredGenerations:generations.length,
            latestTwo,
            protectedGenerations:[...protectedGenerations],
            totals:{
              generationObjects:generationObjects.length,
              generationBytes:bytes(generationObjects),
              internalObjects:internalObjects.length,
              internalBytes:bytes(internalObjects),
              imageObjects:imageObjects.length,
              imageBytes:bytes(imageObjects),
              publicObjects:publicObjects.length,
              publicBytes:bytes(publicObjects),
            },
            failedGenerationCleanupProjection:{
              generations:cleanupCandidates,
              generationObjects:candidateGenerationObjects.length,
              generationBytes:bytes(candidateGenerationObjects),
              orphanInternalObjects:orphanInternal.length,
              orphanInternalBytes:bytes(orphanInternal),
              totalObjects:candidateGenerationObjects.length+orphanInternal.length,
              totalBytes:bytes(candidateGenerationObjects)+bytes(orphanInternal),
            },
            perGeneration,
          };
          fs.writeFileSync('catalog-capacity-readonly.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if (!liveGeneration) throw new Error('live_generation_missing');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-capacity-readonly
          path: catalog-capacity-readonly.json
          if-no-files-found: warn
          retention-days: 3
