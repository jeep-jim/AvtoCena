name: Ops · Europe Benz quota diagnostic 20260814

on:
  push:
    branches:
      - ops/europe-benz-quota-diagnostic-20260814

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect malformed Mercedes-Benz/Benz 2020 bucket
        shell: bash
        run: |
          cat > /tmp/europe-benz.ts <<'TS'
          import { readMarketOffers } from "${{ github.workspace }}/apps/web/lib/catalog/storage";
          import { catalogModelYearQuotaKey } from "${{ github.workspace }}/apps/web/lib/catalog/inventory-quota";
          (async () => {
            const rows = await readMarketOffers("europe");
            const target = rows.filter((o:any) => catalogModelYearQuotaKey(o, "europe") === "europe|mercedes-benz|benz|2020");
            console.log(JSON.stringify({count:target.length, rows:target.map((o:any)=>({id:o.id,sourceId:o.sourceId,sourceOfferId:o.sourceOfferId,title:o.sourceTitle,make:o.make,model:o.model,year:o.year,sourceUrl:o.operational?.sourceUrl}))}, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          TS
          npx tsx /tmp/europe-benz.ts
