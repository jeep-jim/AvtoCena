name: Verify Japan AJ migration boundary (no provider calls)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-japan-aj-boundary.yml'
      - 'tests/catalog-next-japan-source-boundary.test.mjs'
      - 'apps/web/lib/catalog/ajes-access-policy.ts'
      - 'apps/web/lib/catalog/ajes-client.ts'
      - 'apps/web/lib/catalog/ajes-catalog.ts'
      - 'apps/web/lib/catalog/ajes-routing.ts'
      - 'apps/web/lib/catalog/ajes-query-cache.ts'
      - 'docs/markets/japan.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: japan-aj-source-boundary
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Source-only Japan boundaries
        run: node --test tests/catalog-next-japan-source-boundary.test.mjs
      - run: npm ci --no-audit --no-fund
      - name: Existing AJ access, visitor quota and prepared-cache regression
        run: |
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 \
            tests/ajes-japan-only.test.ts tests/ajes-retired-tables.test.ts \
            tests/ajes-provider-limit.test.ts tests/ajes-list-admission.test.ts \
            tests/ajes-prepared-admission.test.ts
