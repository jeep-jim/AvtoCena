name: Restore tsbuildinfo once

on:
  push:
    branches:
      - ui/mobile-tradein-help-back-20260814

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-tradein-help-back-20260814
          fetch-depth: 0
      - name: Restore generated build metadata
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- apps/web/tsconfig.tsbuildinfo
          rm .github/workflows/restore-tsbuildinfo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore generated build metadata"
          git push origin HEAD:ui/mobile-tradein-help-back-20260814
