name: Catalog — inspect saved recovery state
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/catalog-recovery-status.json']
permissions:
  contents: read
concurrency:
  group: catalog-recovery-status
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 12
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node --import tsx scripts/catalog-recovery-status.mjs
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-price-on-request-audit.test.ts tests/catalog-visible-calculation-audit-contract.test.ts
      - run: node --import tsx scripts/catalog-audit-visible-calculation-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-status
          path: |
            catalog-recovery-status.json
            catalog-visible-calculation-coverage.json
          retention-days: 14
