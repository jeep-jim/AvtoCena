name: Apply recovery exact preservation safety once

on:
  push:
    branches:
      - fix/recovery-exact-preserve-k9-20260814
    paths:
      - .github/workflows/apply-recovery-exact-preserve-k9-20260814.yml
      - .github/scripts/apply-recovery-exact-preserve-k9-20260814.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-exact-preserve-k9-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply safety patch
        run: python3 .github/scripts/apply-recovery-exact-preserve-k9-20260814.py
      - run: npm ci
      - name: Targeted recovery and quality tests
        run: node --import tsx --test tests/catalog-image-quality.test.ts tests/catalog-production-hardening.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified safety patch
        shell: bash
        run: |
          rm .github/workflows/apply-recovery-exact-preserve-k9-20260814.yml
          rm .github/scripts/apply-recovery-exact-preserve-k9-20260814.py
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/offer-quality.ts scripts/catalog-live-recovery-publish-batch.mjs tests/catalog-image-quality.test.ts tests/catalog-production-hardening.test.ts .github/workflows/apply-recovery-exact-preserve-k9-20260814.yml .github/scripts/apply-recovery-exact-preserve-k9-20260814.py
          git diff --cached --check
          git commit -m "Preserve untouched markets exactly in recovery publish"
          git push origin HEAD:fix/recovery-exact-preserve-k9-20260814
