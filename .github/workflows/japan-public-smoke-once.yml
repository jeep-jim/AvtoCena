name: Japan public live query (single bounded request)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/japan-public-smoke-once.yml'
      - 'scripts/catalog-next/japan-public-smoke-once.mjs'
permissions:
  contents: read
concurrency:
  group: japan-public-smoke-once
  cancel-in-progress: true
jobs:
  smoke:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Read exactly one Japanese public page as a real HTTP visitor
        run: node scripts/catalog-next/japan-public-smoke-once.mjs
