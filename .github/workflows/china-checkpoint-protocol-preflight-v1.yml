name: Qualify private checkpoint protocol
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/china-checkpoint-protocol-preflight-v1.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: china-checkpoint-protocol-preflight-v1
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'Qualify current job identity before producer'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Materialize exact reviewed modules
      run: 'set -euo pipefail

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/adapter-core.mjs"

        printf ''%s  %s\n'' ''794c8bc6c94c81b0060ca46b6838197765b228e9102d618642706e0cd8ab7abb'' "$RUNNER_TEMP/adapter-core.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/adapter.mjs"

        printf ''%s  %s\n'' ''d2b5c32e5ee998e9e378d81615109354e8ed43d19209cbe52cafd14f89350121'' "$RUNNER_TEMP/adapter.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/producer-identity.mjs"

        printf ''%s  %s\n'' ''90849d7f432bb42e73dfbe4b515b1ef6603b56c3248f993107ef7e3bca6b9fec'' "$RUNNER_TEMP/producer-identity.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/signed-io.mjs"

        printf ''%s  %s\n'' ''6ec330d1b917fe3fc0f6fc337496304eef7ab77fd65d4f2c14b08b406ad9c986'' "$RUNNER_TEMP/signed-io.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/privacy-classify.py"

        printf ''%s  %s\n'' ''bd5a73f34496338cea1ecc6f4b91ef51cc3fdcbdaf09b59623d91bd45e844728'' "$RUNNER_TEMP/privacy-classify.py" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/preflight.mjs"

        printf ''%s  %s\n'' ''d37be29e976eeb702cafa4d6f537bb983ab173dedb50633f0edf40bbe7189c1d'' "$RUNNER_TEMP/preflight.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/preflight-cli.mjs"

        printf ''%s  %s\n'' ''f91e000859cb171e4205a74aa2a1e9e9292c7fb455b904a245d2af7d667571d7'' "$RUNNER_TEMP/preflight-cli.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/store.mjs"

        printf ''%s  %s\n'' ''98287c96035ff49e8ac486a0e375c1d34a004e1fe01c3d9df6dcde80ea472a7a'' "$RUNNER_TEMP/store.mjs" | sha256sum --check --status

        printf ''%s'' '''' | base64 --decode > "$RUNNER_TEMP/identity-scope.mjs"

        printf ''%s  %s\n'' ''ff360849e4f22c342f7f65e6cd39039a989c5f74944fbfade51bc0873dfe584f'' "$RUNNER_TEMP/identity-scope.mjs" | sha256sum --check --status'
    - name: Qualify tiny private conditional object protocol
      env:
        GITHUB_TOKEN: ${{ github.token }}
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        CHECKPOINT_LAUNCHER_FILE: ${{ runner.temp }}/preflight-cli.mjs
      run: 'set -euo pipefail

        timeout --signal=TERM --kill-after=5s 240s node "$RUNNER_TEMP/preflight-cli.mjs" | tee checkpoint-protocol-result.json'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: china-checkpoint-protocol-preflight-v1
        path: checkpoint-protocol-result.json
        if-no-files-found: warn
        retention-days: 14
