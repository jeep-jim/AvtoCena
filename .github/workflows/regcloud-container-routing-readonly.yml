name: Attribute running containers to public ingress (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/regcloud-container-routing-readonly.py'
      - '.github/workflows/regcloud-container-routing-readonly.yml'
permissions:
  contents: read
concurrency:
  group: regcloud-container-routing-readonly
  cancel-in-progress: true
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate read-only source
        run: python3 -m py_compile scripts/regcloud-container-routing-readonly.py
      - name: Identify active and orphaned app containers without mutation
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -F /dev/null -T -i "$key_file" -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" -o ForwardAgent=no -o ClearAllForwardings=yes root@151.248.113.177 'nice -n 15 python3 -I -B -' < scripts/regcloud-container-routing-readonly.py
