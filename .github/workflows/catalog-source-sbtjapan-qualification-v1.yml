name: Catalog source qualification · SBT Japan v1

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sbtjapan-japan-qualification-v1-20260904
    paths:
      - ".github/workflows/catalog-source-sbtjapan-qualification-v1.yml"
      - "scripts/catalog-source-sbtjapan-qualification-v1.mjs"
      - "tests/catalog-source-sbtjapan-qualification-v1.test.ts"
      - "scripts/catalog-source-access-probe-v1.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-source-sbtjapan-qualification-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify SBT Japan qualification contract
        run: node --import tsx --test tests/catalog-source-sbtjapan-qualification-v1.test.ts
      - name: Type-check project
        run: npm run typecheck
      - name: Qualify SBT Japan without production writes
        env:
          CATALOG_SOURCE_SBTJAPAN_TIMEOUT_MS: "18000"
          CATALOG_SOURCE_SBTJAPAN_MAX_BODY_BYTES: "1900000"
          CATALOG_SOURCE_SBTJAPAN_SAMPLE_COUNT: "4"
        run: node scripts/catalog-source-sbtjapan-qualification-v1.mjs
      - name: Verify strict no-write evidence envelope
        run: |
          node - <<'NODE'
          const p=require('./catalog-source-sbtjapan-qualification-v1.json');
          for(const k of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) if(p[k]!==false) throw new Error(`${k} must be false`);
          if(p.sourcePublishAllowed!==false) throw new Error('sourcePublishAllowed');
          if(!p.sourceVerdict) throw new Error('sourceVerdict missing');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-sbtjapan-qualification-v1
          path: catalog-source-sbtjapan-qualification-v1.json
          if-no-files-found: error
          retention-days: 7
