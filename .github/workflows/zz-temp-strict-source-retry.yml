name: TEMP strict source retry

on:
  push:
    branches:
      - fix/strict-market-source-whitelist-20260825-r2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-market-source-whitelist-20260825-r2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reuse verified strict-source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/zz-temp-strict-market-source-whitelist.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = []
          for line in src[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/strict-source-patch.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/strict-source-patch.py
          git checkout -- .github/workflows/catalog-reindex-vehicle-knowledge.yml
      - name: Verify strict source contract
        run: |
          node --import tsx --test tests/catalog-source-scale.test.ts
          node --import tsx --test tests/catalog-production-hardening.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Commit only non-workflow changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/required-catalog-sources.ts apps/web/lib/catalog/catalog-v2-source-registry.ts apps/web/lib/catalog/importer.ts apps/web/lib/catalog/offer-quality.ts tests/catalog-source-scale.test.ts
          git commit -m 'Enforce exact market source allowlist'
          git push origin HEAD:fix/strict-market-source-whitelist-20260825-r2
