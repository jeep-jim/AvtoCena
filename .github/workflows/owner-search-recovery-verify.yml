name: Verify owner catalog recovery once
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/owner-search-recovery-verify.json']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact installed release, linked cards, names and crawler blocks
        run: python3 .github/owner-search-recovery/verify.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Verify public desktop/mobile offer navigation and deferred recommendations
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/owner-public-browser/node_modules/playwright/index.mjs
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/owner-public-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          CHROME_BIN=$(command -v google-chrome) node .github/owner-search-recovery/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-search-recovery-public
          path: |
            owner-search-recovery-public.json
            owner-search-recovery-browser.json
      - name: Preserve measured result and append roadmap
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B owner-search-recovery-result origin/main
          python3 .github/owner-search-recovery/record.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/2026-11-11-search-recovery-public.json roadmap.md
          if test -f docs/operations/2026-11-11-search-recovery-browser.json; then git add docs/operations/2026-11-11-search-recovery-browser.json; fi
          git commit -m 'docs: record actual public catalog recovery verification'
          git push origin HEAD:main
