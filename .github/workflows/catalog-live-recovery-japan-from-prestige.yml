name: Catalog live recovery · Japan from Prestige
run-name: Japan calculated recovery · ${{ github.event.workflow_run.id || inputs.source_run_id || github.sha }}

on:
  workflow_run:
    workflows:
      - "Catalog V6 · Prestige repair failed chunks"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Prestige repair workflow run ID"
        required: true

permissions:
  actions: read
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}

jobs:
  recover-and-publish:
    # workflow_run fires for success, failure and cancellation. A cancelled or
    # failed repair run cannot contain the required repaired artifact, so skip it
    # before acquiring the shared live-publisher slot. Successful/manual runs
    # remain serialized with every other read-preserve-write catalog publisher.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/prestige-japan-official-chassis-enrich.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
      - name: Download repaired strict Prestige result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          # A rerun of one failed repair job creates another artifact with the
          # same name under the same workflow run. GitHub returns artifacts in
          # API order, not oldest-to-newest order; selecting the last line can
          # therefore pick the stale failed-attempt aggregate. Artifact IDs are
          # monotonic, so always take the highest matching ID.
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          echo "Using repaired Prestige artifact id=$artifact_id from run=$SOURCE_RUN_ID"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output prestige.zip
          unzip -q prestige.zip -d prestige-input
          find prestige-input -maxdepth 3 -type f -print
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_RECOVERY_INPUT=$source_file" >> "$GITHUB_ENV"
      - name: Enrich strict sold lots with exact manufacturer chassis power
        shell: bash
        run: |
          set -euo pipefail
          export PRESTIGE_OFFICIAL_INPUT="$PRESTIGE_RECOVERY_INPUT"
          export PRESTIGE_OFFICIAL_OUTPUT="prestige-japan-exact-sold-official-power.json"
          node scripts/prestige-japan-official-chassis-enrich.mjs
          test -s "$PRESTIGE_OFFICIAL_OUTPUT"
          echo "PRESTIGE_RECOVERY_INPUT=$PRESTIGE_OFFICIAL_OUTPUT" >> "$GITHUB_ENV"
      - name: Convert strict sold lots into exact calculated ruble cards
        env:
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "3000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Publish Japan without touching recovered live markets
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-live-recovery-japan-publish-report.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-live-recovery-japan-reports
          path: |
            prestige-japan-exact-sold-official-power.json
            catalog-rebuild-japan.json
            catalog-live-recovery-japan-publish-report.json
          if-no-files-found: warn
          retention-days: 3
