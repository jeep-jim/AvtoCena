name: Catalog live recovery · Japan from Prestige
run-name: Japan calculated recovery · ${{ inputs.source_run_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Prestige repair workflow run ID"
        required: true

permissions:
  actions: read
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "2592000000"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}

jobs:
  recover-and-publish:
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Japan recovery and preflight all-seven preservation
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: |
          node --check scripts/prestige-japan-official-chassis-enrich.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Download repaired strict Prestige result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          echo "Using repaired Prestige artifact id=$artifact_id from run=$SOURCE_RUN_ID"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output prestige.zip
          unzip -q prestige.zip -d prestige-input
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_RECOVERY_INPUT=$source_file" >> "$GITHUB_ENV"
      - name: Enrich sold lots with documented chassis power where available
        shell: bash
        run: |
          set -euo pipefail
          export PRESTIGE_OFFICIAL_INPUT="$PRESTIGE_RECOVERY_INPUT"
          export PRESTIGE_OFFICIAL_OUTPUT="prestige-japan-exact-sold-official-power.json"
          node scripts/prestige-japan-official-chassis-enrich.mjs
          test -s "$PRESTIGE_OFFICIAL_OUTPUT"
          echo "PRESTIGE_RECOVERY_INPUT=$PRESTIGE_OFFICIAL_OUTPUT" >> "$GITHUB_ENV"
      - name: Convert sold lots into exact or preliminary calculated ruble cards
        env:
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "30000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Publish Japan cumulatively while preserving the other six markets
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-live-recovery-japan-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit all seven markets after Japan publish
        if: always()
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: japan
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-live-recovery-japan-reports
          path: |
            catalog-japan-preflight-audit.json
            prestige-japan-exact-sold-official-power.json
            catalog-rebuild-japan.json
            catalog-live-recovery-japan-publish-report.json
            catalog-japan-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
