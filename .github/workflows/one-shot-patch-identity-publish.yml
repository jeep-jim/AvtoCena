name: One Shot Patch Identity Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-patch-identity-publish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-encyclopedia-identity-publish-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore explicit preserved-row safety shape
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/web/lib/catalog/storage.ts')
          s = p.read_text()
          old = '''  const identityOnlyReprojection = options.identityOnlyReprojection === true;
  const normalized = await Promise.all(nextOffers.map(async (offer) => {
    if (exactPreserveMarkets.has(offer.market)) return offer;
    if (identityOnlyReprojection) return (await applyConfiguredEncyclopediaIdentity(offer)) as VehicleOffer;
    const enriched = normalizeVehicleOfferSpecs(await enrichOfferWithVehicleKnowledge(offer));
    return (await applyConfiguredEncyclopediaIdentity(enriched)) as VehicleOffer;
  }));
'''
          new = '''  const identityOnlyReprojection = options.identityOnlyReprojection === true;
  const normalized = await Promise.all(nextOffers.map(async (offer) => exactPreserveMarkets.has(offer.market)
    ? offer
    : identityOnlyReprojection
      ? (await applyConfiguredEncyclopediaIdentity(offer)) as VehicleOffer
      : (await applyConfiguredEncyclopediaIdentity(normalizeVehicleOfferSpecs(await enrichOfferWithVehicleKnowledge(offer)))) as VehicleOffer));
'''
          count = s.count(old)
          if count != 1:
            raise SystemExit(f'expected exactly one normalized writer block, got {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- apps/web/lib/catalog/storage.ts
      - run: npm ci
      - name: Production hardening safety test
        run: node --import tsx --test tests/catalog-production-hardening.test.ts
      - name: V2 identity tests
        run: node --import tsx --test tests/catalog-encyclopedia-identity-*.test.ts
      - name: Web typecheck
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Engine typecheck
        run: npm --workspace=@avtocena/engine exec tsc -- --noEmit
      - name: Production build
        run: npm run build
      - name: Commit preserved-row safety fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/storage.ts
          git commit -m 'fix(catalog): preserve recovery rows before V2 identity enrichment'
          git push origin HEAD:feat/catalog-encyclopedia-identity-publish-20260818
