name: Catalog recovery installed release readback 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-release-readback-20261107.yml']
permissions:
  contents: read
concurrency:
  group: catalog-recovery-live-readback-20261107
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Await the same release after preparation, never start another deployment
        env:
          EXPECTED_RELEASE: 11e3b4ed853518731c11aa1522068cc87cbb8ff4
          RELEASE_WAIT_SECONDS: '900'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Previous readback42357261786 ended only at its release wait deadline.
          # Price preparation is now SUCCESS; the deployment remains the same391.
          node scripts/wait-published-release.mjs
      - name: Install isolated supported browser
        run: |
          npm install --prefix /tmp/catalog-readback --no-audit --no-fund --ignore-scripts playwright@1.56.1
          /tmp/catalog-readback/node_modules/.bin/playwright install --with-deps chromium
      - name: Check exact release, six markets, legacy URLs, loaded font face and real card
        env:
          EXPECTED_RELEASE: 11e3b4ed853518731c11aa1522068cc87cbb8ff4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/diagnostics/catalog-release-readback-20261107.mjs');s=p.read_text()
          replacements=[
            ("await page.waitForTimeout(1500);", "await page.waitForTimeout(1500);await page.waitForFunction(()=>[...document.fonts].some(face=>face.family.includes('Onest')&&face.status==='loaded'),null,{timeout:8000}).catch(()=>{});"),
            ("title:document.title,canonical:", "onestLoaded:[...document.fonts].some(face=>face.family.includes('Onest')&&face.status==='loaded'),title:document.title,canonical:"),
            ("if(!row.font?.includes('Onest'))", "if(!row.font?.includes('Onest')||!row.onestLoaded)")
          ]
          for before,after in replacements:
              assert s.count(before)==1,(before,s.count(before));s=s.replace(before,after)
          p.write_text(s)
          PY
          node scripts/diagnostics/catalog-release-readback-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-live-readback
          path: |
            catalog-release-readback
            artifacts/mobile-filter-release
          retention-days: 7
