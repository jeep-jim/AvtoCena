name: One-shot apply Japan official chassis production enrichment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-apply-japan-official-chassis-production.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply production patch
        run: python .github/patches/apply-japan-official-chassis-production.py
      - name: Validate code
        run: |
          node --check scripts/prestige-japan-official-chassis-enrich.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          npm run typecheck
      - name: Download newest final repaired Prestige artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "31338331776"
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o prestige.zip
          unzip -qo prestige.zip -d prestige-input
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_SOURCE=$source_file" >> "$GITHUB_ENV"
      - name: Validate exact manufacturer enrichment and strict conversion no publish
        shell: bash
        run: |
          set -euo pipefail
          PRESTIGE_OFFICIAL_INPUT="$PRESTIGE_SOURCE" \
          PRESTIGE_OFFICIAL_OUTPUT=prestige-japan-exact-sold-official-power.json \
            node scripts/prestige-japan-official-chassis-enrich.mjs
          PRESTIGE_RECOVERY_INPUT=prestige-japan-exact-sold-official-power.json \
          PRESTIGE_RECOVERY_OUTPUT=catalog-rebuild-japan-official-validation.json \
          PRESTIGE_RECOVERY_TARGET=3000 \
          PRESTIGE_RECOVERY_CONCURRENCY=12 \
            npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const enriched = JSON.parse(fs.readFileSync('prestige-japan-exact-sold-official-power.json','utf8'));
          const result = JSON.parse(fs.readFileSync('catalog-rebuild-japan-official-validation.json','utf8'));
          const gained = Number(enriched?.report?.officialPowerEnrichment?.enriched || 0);
          const calculated = Number(result?.report?.calculatedCount || result?.report?.count || 0);
          console.log(JSON.stringify({ gained, calculated, report: result?.report }, null, 2));
          if (gained < 100) throw new Error(`official_chassis_enrichment_regressed:${gained}`);
          if (calculated < 100) throw new Error(`japan_strict_conversion_regressed:${calculated}`);
          NODE
      - name: Commit verified production flow only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prestige-japan-official-chassis-enrich.mjs .github/workflows/catalog-live-recovery-japan-from-prestige.yml
          git commit -m "Apply official chassis power before Japan customs [skip actions]"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
