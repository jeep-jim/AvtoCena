name: Verify attached compact parameter dropdowns
on:
  push:
    branches: [fix/pickups-all-markets-20261015,fix/catalog-storage-reserve-20260924, fix/offer-finance-hydration-20260921, fix/electrified-offer-polish-20260921, fix/staff-inbox-ui-20260920, fix/saved-offer-and-ui-20260920, fix/final-catalog-ui-20260920, fix/korea-continuous-enrichment-20260920, fix/city-delivery-scroll-20260919, fix/catalog-pages-parameter-ux, fix/attached-compact-parameters-20260913, fix/parameter-dropdown-gap-20260913, main]
    paths:
      - 'apps/web/components/catalog/InlineOfferParameters.tsx'
      - 'apps/web/components/catalog/CalculationDateControl.tsx'
      - 'apps/web/components/catalog/InlineParameterPanels.module.css'
      - 'tests/browser/attached-parameter*'
      - 'tests/browser/pickup-parameters*'
      - '.github/workflows/verify-attached-parameters.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the requested application release
        run: echo "EXPECTED_RELEASE=$(git log -1 --format=%H -- .github/market-runs/regcloud-deploy.json)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript and power/customs regressions
        run: |
          npm run typecheck
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/recycling-power-ui.test.ts tests/russia-customs.test.ts
      - name: Production build
        run: npm run build
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/parameter-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Test attachment and compact content with the real component and public styles
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/parameter-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/attached-parameter-dropdowns.mjs
      - name: Verify pickup parameters across all market fixtures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/parameter-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/pickup-parameters.mjs
      - name: Confirm the requested application release or verified descendant
        if: github.ref == 'refs/heads/main'
        run: node scripts/wait-published-release.mjs
      - name: Check published petrol and hybrid pages without submitting forms
        if: github.ref == 'refs/heads/main'
        env:
          LIVE_ORIGIN: https://avtocena.com
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/parameter-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/attached-parameter-dropdowns.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attached-parameter-dropdowns
          path: |
            artifacts/attached-parameters-*
            artifacts/pickup-parameters/*.png
            artifacts/mobile-filter-release/health.json
          retention-days: 7
