name: One-shot polish offer actions and rate points

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-polish-offer-actions-rate-points.yml

permissions:
  contents: write

concurrency:
  group: oneshot-polish-offer-actions-rate-points
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Apply UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Currency chart points: on dark theme use the chart surface color
          # for the ring instead of black/dark outlines. Light theme stays as-is.
          p = Path('apps/web/components/catalog/PriceTrend.tsx')
          s = p.read_text()
          old = 'stroke={selected ? (light ? "#ffffff" : "#0f1219") : light ? "#f1f3f7" : "#151821"}'
          new = 'stroke={light ? (selected ? "#ffffff" : "#f1f3f7") : "var(--ac-surface-2, #293444)"}'
          if old not in s:
              raise SystemExit('PriceTrend circle stroke pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Offer contact buttons: slightly squarer corners everywhere,
          # 54px mobile height, keep 56px desktop height, desktop-only icons.
          p = Path('apps/web/components/catalog/OfferContactActions.tsx')
          s = p.read_text()

          old_class = 'const buttonClass = "ac-offer-contact-button h-14 min-w-0 rounded-[1.35rem] px-3 text-[13px] font-black leading-none !text-white transition-[filter,transform] hover:brightness-95 active:scale-[.99] sm:text-sm md:text-base";'
          new_class = 'const buttonClass = "ac-offer-contact-button inline-flex h-[54px] min-w-0 items-center justify-center gap-2.5 rounded-[1.05rem] px-3 text-[13px] font-black leading-none !text-white transition-[filter,transform] hover:brightness-95 active:scale-[.99] sm:text-sm md:text-base xl:h-14";'
          if old_class not in s:
              raise SystemExit('OfferContactActions button class pattern not found')
          s = s.replace(old_class, new_class, 1)

          old_buttons = '''      >\n        Чат в мессенджере\n      </button>\n      <button\n        type="button"\n        data-offer-action="lead"\n        className={`${buttonClass} bg-[#22B14C]`}\n      >\n        Оставить заявку\n      </button>'''
          new_buttons = '''      >\n        <span className="hidden xl:inline-flex" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 5.5h14a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 19 17.5h-7.1L7 21v-3.5H5A2.5 2.5 0 0 1 2.5 15V8A2.5 2.5 0 0 1 5 5.5Z" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"/><path d="M7.5 10h9M7.5 13.5h6" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"/></svg></span>\n        <span>Чат в мессенджере</span>\n      </button>\n      <button\n        type="button"\n        data-offer-action="lead"\n        className={`${buttonClass} bg-[#22B14C]`}\n      >\n        <span>Оставить заявку</span>\n        <span className="hidden xl:inline-flex" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M7.2 3.8 10 8.3 8.4 10a14.7 14.7 0 0 0 5.6 5.6l1.7-1.6 4.5 2.8c.5.3.7.9.5 1.4-.5 1.4-1.8 2.4-3.3 2.5C10.1 21.1 2.9 13.9 3.3 6.6c.1-1.5 1.1-2.8 2.5-3.3.5-.2 1.1 0 1.4.5Z" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"/></svg></span>\n      </button>'''
          if old_buttons not in s:
              raise SystemExit('OfferContactActions button body pattern not found')
          s = s.replace(old_buttons, new_buttons, 1)

          old_anchor = '<div ref={anchorRef} className="relative mt-4 h-14 xl:hidden">'
          new_anchor = '<div ref={anchorRef} className="relative mt-4 h-[54px] xl:hidden">'
          if old_anchor not in s:
              raise SystemExit('Mobile action anchor pattern not found')
          s = s.replace(old_anchor, new_anchor, 1)

          old_style = '''        .ac-offer-contact-button {\n          color: #fff !important;\n        }'''
          new_style = '''        .ac-offer-contact-button {\n          color: #fff !important;\n        }\n        .ac-offer-page > section > section {\n          border-top: 1px solid rgba(255,255,255,.085) !important;\n          padding-top: 1rem;\n        }\n        html[data-theme="light"] .ac-offer-page > section > section {\n          border-top-color: rgba(35,42,55,.12) !important;\n        }'''
          if old_style not in s:
              raise SystemExit('OfferContactActions global style pattern not found')
          s = s.replace(old_style, new_style, 1)
          p.write_text(s)
          PY

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo packages/engine/tsconfig.tsbuildinfo 2>/dev/null || true

      - name: Verify and publish
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^apps/web/components/catalog/PriceTrend.tsx$' || true)" = "1"
          test "$(printf '%s\n' "$changed" | grep -c '^apps/web/components/catalog/OfferContactActions.tsx$' || true)" = "1"
          test "$(printf '%s\n' "$changed" | grep -c '^apps/web/components/home/BuyerGallery.tsx$' || true)" = "0"
          test "$(printf '%s\n' "$changed" | grep -c '^.github/workflows/catalog' || true)" = "0"
          grep -q 'var(--ac-surface-2, #293444)' apps/web/components/catalog/PriceTrend.tsx
          grep -q 'h-\[54px\]' apps/web/components/catalog/OfferContactActions.tsx
          grep -q 'hidden xl:inline-flex' apps/web/components/catalog/OfferContactActions.tsx
          grep -q 'border-top: 1px solid rgba(255,255,255,.085)' apps/web/components/catalog/OfferContactActions.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-polish-offer-actions-rate-points.yml
          git add apps/web/components/catalog/PriceTrend.tsx apps/web/components/catalog/OfferContactActions.tsx
          git commit -m "fix: polish offer actions and currency chart points"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
