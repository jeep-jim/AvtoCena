name: Apply exact recovery preservation 20260815

on:
  push:
    branches:
      - fix/recovery-exact-public-preservation-20260815
    paths:
      - scripts/apply-recovery-exact-public-preservation.mjs
      - .github/workflows/apply-recovery-exact-public-preservation-20260815.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact untouched-public preservation patch
        run: node scripts/apply-recovery-exact-public-preservation.mjs
      - name: Install dependencies
        run: npm ci
      - name: Recovery safety tests
        run: npx tsx --test tests/catalog-production-hardening.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/storage.ts scripts/catalog-live-recovery-publish.mjs scripts/catalog-live-recovery-publish-batch.mjs tests/catalog-production-hardening.test.ts
          git commit -m "Preserve untouched public catalog rows exactly"
          git push
