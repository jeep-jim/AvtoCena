name: UI home budget-only redesign 20260813

on:
  push:
    branches:
      - ui/remove-home-catalog-shortcuts-20260813

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-home-catalog-shortcuts-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply budget-only home UI redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/home/HomePageClient.tsx')
          text = path.read_text()

          form_start_token = '        <div id="form" className="ac-filter-panel rounded-[1.8rem] bg-white/[0.075] p-4 md:p-5">'
          form_end_token = '        </div>\n      </section>\n      <BuyerGallery images={buyers} />'
          start = text.find(form_start_token)
          end_anchor = text.find(form_end_token, start)
          if start < 0 or end_anchor < 0:
              raise SystemExit('home filter panel anchors not found')
          end = end_anchor + len('        </div>')
          new_form = '''        <div id="form" className="ac-filter-panel flex min-h-[416px] flex-col rounded-[1.8rem] bg-white/[0.075] p-4 md:p-5 lg:min-h-[438px]">
          <div className="mb-4 flex items-center justify-between gap-3"><BudgetLabel onInfo={() => setBudgetInfoOpen(true)} /><span className="flex items-center gap-2 text-[11px] font-black text-white/65"><span className="ac-pulse-dot ac-pulse-dot--status"><span /></span>{count === null ? "Считаем варианты" : `Нашли ${count} вариантов`}</span></div>
          <HomeSelect value={budget} options={budgets} onChange={setBudget} />
          <div className="mt-5 flex flex-1 flex-col">
            <h3 className="text-lg font-black leading-tight md:text-xl">АвтоЦена — подбор автомобиля под ваш бюджет</h3>
            <p className="mt-4 text-sm font-medium leading-6 text-white/78 md:text-base md:leading-6">Сервис помогает быстро понять, какой автомобиль можно привезти под ключ. Задайте параметры, система покажет варианты и актуальный расчёт.</p>
            <p className="mt-5 text-sm font-black leading-6 text-white md:text-base md:leading-6">Следующий шаг — менеджер TopAvto проверит автомобиль, подтвердит наличие и подготовит точный расчёт.</p>
            <div className="mt-auto flex items-end gap-4 pt-5"><button type="button" onClick={submit} className="avto-button h-[58px] min-w-0 flex-1 rounded-2xl px-4 text-sm font-black md:text-base">Узнать Цену Авто</button><img src="/brands/topavto-logo.png" alt="TopAvto" className="mb-1 hidden h-auto w-[108px] shrink-0 object-contain sm:block" /></div>
          </div>
        </div>'''
          text = text[:start] + new_form + text[end:]

          lower_start_token = '      <div className="mt-4 grid gap-4 lg:grid-cols-[minmax(0,1fr)_340px] lg:items-stretch">'
          catalog_start_token = '      <section className="mt-8">'
          lower_start = text.find(lower_start_token)
          catalog_start = text.find(catalog_start_token, lower_start)
          if lower_start < 0 or catalog_start < 0:
              raise SystemExit('lower executor block anchors not found')
          new_lower = '''      <div className="mt-4 grid gap-4 lg:grid-cols-[minmax(0,1fr)_340px] lg:items-stretch">
        <section className="grid min-h-[168px] grid-cols-2 gap-3 md:gap-4" aria-label="Будущие сервисы">
          <div className="ac-executor-block min-h-[168px] rounded-[1.6rem]" aria-hidden="true" />
          <div className="ac-executor-block min-h-[168px] rounded-[1.6rem]" aria-hidden="true" />
        </section>
        <CurrencyRatesStrip rates={rates} variant="desktop" className="hidden lg:block" />
      </div>
'''
          text = text[:lower_start] + new_lower + text[catalog_start:]

          desktop_shortcuts = '<div className="hidden gap-3 sm:grid-cols-[180px_220px_auto] lg:grid"><HomeSelect value={catalogMarket} options={marketOptions} onChange={setCatalogMarket} /><HomeSelect value={catalogMake} options={makeOptions} onChange={setCatalogMake} searchable searchPlaceholder="Найти марку" /><Link href={catalogHref} className="avto-button flex h-14 items-center justify-center rounded-2xl px-5 font-black">Показать</Link></div>'
          if text.count(desktop_shortcuts) != 1:
              raise SystemExit(f'expected one desktop catalog shortcut block, found {text.count(desktop_shortcuts)}')
          text = text.replace(desktop_shortcuts, '', 1)

          catalog_href = '  const catalogQuery = new URLSearchParams(); if (catalogMarket) catalogQuery.set("market", catalogMarket); if (catalogMake) catalogQuery.set("make", catalogMake); if (electricOnly) catalogQuery.set("fuel", "electric"); const catalogHref = `/cars${catalogQuery.toString() ? `?${catalogQuery}` : ""}`;\n'
          if text.count(catalog_href) != 1:
              raise SystemExit(f'expected one catalogHref line, found {text.count(catalog_href)}')
          text = text.replace(catalog_href, '', 1)

          drawer_start = text.find('    {mobileFiltersOpen ? <div className="fixed inset-0 z-[10040]')
          drawer_end_token = '    {budgetInfoOpen ?'
          drawer_end = text.find(drawer_end_token, drawer_start)
          if drawer_start < 0 or drawer_end < 0:
              raise SystemExit('mobile filter drawer anchors not found')
          text = text[:drawer_start] + text[drawer_end:]

          required = [
              'Узнать Цену Авто',
              'АвтоЦена — подбор автомобиля под ваш бюджет',
              'Сервис помогает быстро понять, какой автомобиль можно привезти под ключ.',
              '<div className="ac-executor-block min-h-[168px] rounded-[1.6rem]" aria-hidden="true" />',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing required token after patch: {token}')
          forbidden_visible = [
              'className="relative mt-4"><button type="button" onClick={submit} className="avto-button h-[58px] w-full rounded-2xl pr-16 text-base font-black">Узнать Цену</button>',
              desktop_shortcuts,
          ]
          for token in forbidden_visible:
              if token in text:
                  raise SystemExit(f'old UI token remained: {token[:80]}')

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit UI-only change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/home/HomePageClient.tsx
          git diff --cached --quiet && exit 1
          git commit -m "Redesign home hero around budget only"
          git push origin HEAD:ui/remove-home-catalog-shortcuts-20260813
