name: UI home budget-only redesign 20260813

on:
  push:
    branches:
      - ui/remove-home-catalog-shortcuts-20260813

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-home-catalog-shortcuts-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic home UI patch
        run: python3 .github/patches/apply-home-budget-ui-20260813.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit UI-only change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/home/HomePageClient.tsx
          git diff --cached --quiet && exit 1
          git commit -m "Redesign home hero around budget only"
          git push origin HEAD:ui/remove-home-catalog-shortcuts-20260813
