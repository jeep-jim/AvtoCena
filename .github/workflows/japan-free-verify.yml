name: Japan saved candidate verification
on:
  push:
    branches: [ops/japan-free-sweep-20260916]
    paths: [.github/workflows/japan-free-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35079001913
          pattern: japan-free-*
          path: audit-input/main
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35079213542
          name: japan-free-carvector
          path: audit-input/carvector-all
      - run: pip install Pillow
      - run: python scripts/japan-free-verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-free-verification
          path: japan-free-verification
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan-free-discovery/image-verification-summary.json
          git commit -m "Record Japan image verification"
          git pull --rebase origin ops/japan-free-sweep-20260916
          git push origin HEAD:ops/japan-free-sweep-20260916
