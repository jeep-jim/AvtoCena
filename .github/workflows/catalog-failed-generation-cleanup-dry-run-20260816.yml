name: Catalog failed-generation cleanup dry-run 2026-08-16
run-name: Safe failed-generation cleanup dry-run · ${{ github.sha }}

on:
  push:
    branches:
      - fix/catalog-failed-generation-cleanup-dry-run-20260816
    paths:
      - scripts/catalog-clean-failed-generations.mjs
      - tests/catalog-v2-market-recovery.test.ts
      - .github/workflows/catalog-failed-generation-cleanup-dry-run-20260816.yml

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

jobs:
  dry-run:
    name: Inspect unreachable generations without deleting
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_FAILED_GENERATION_CLEANUP_REPORT: catalog-failed-generation-cleanup-dry-run.json
      CATALOG_FAILED_GENERATION_CLEANUP_DRY_RUN: "true"
      CATALOG_FAILED_GENERATION_MAX_DELETES: "300000"
      CATALOG_FAILED_GENERATION_KEEP: "2"
      CATALOG_FAILED_GENERATION_PROTECT: "gen_1786426826475_e390aa80"
      YC_OBJECT_STORAGE_DELETE_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate safe cleanup logic
        run: |
          node --check scripts/catalog-clean-failed-generations.mjs
          node --import tsx --test tests/catalog-v2-market-recovery.test.ts
      - name: Inspect unreachable generations only
        run: npx tsx scripts/catalog-clean-failed-generations.mjs
      - name: Write dry-run summary
        if: always()
        shell: bash
        run: |
          echo "### Catalog failed-generation cleanup dry-run" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$CATALOG_FAILED_GENERATION_CLEANUP_REPORT" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$CATALOG_FAILED_GENERATION_CLEANUP_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cleanup report was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload cleanup dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-failed-generation-cleanup-dry-run
          path: catalog-failed-generation-cleanup-dry-run.json
          if-no-files-found: error
          retention-days: 7
