name: Repair compact encyclopedia observation identities
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/compact-encyclopedia-repair.json']
permissions:
  contents: read
concurrency:
  group: compact-encyclopedia-directory
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair only migration-appended collisions and verify original evidence
        run: |
          node --import tsx scripts/encyclopedia/repair-compact-observations.mjs
          node --import tsx scripts/encyclopedia/assert-compact-directory.mjs
          node --import tsx scripts/encyclopedia/prepare-calculation-index.mjs
          node --import tsx scripts/encyclopedia/assert-release-batches.mjs
          node --import tsx scripts/encyclopedia/assert-release-astra.mjs
          node --import tsx scripts/encyclopedia/audit-calculation-index.mjs
