name: Required catalog source smoke 20260816
run-name: Guazi and KB ChaChaCha source smoke · ${{ github.sha }}

on:
  push:
    branches:
      - ops/required-source-smoke-20260816
    paths:
      - .github/workflows/required-source-smoke-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "4"
  RECOVERY_TARGET: "100"
  RECOVERY_MAX_PAGES: "40"
  RECOVERY_TIME_LIMIT_MS: "1500000"

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: china
            source: guazi_china_open
          - market: korea
            source: kbchachacha_korea_open
    env:
      RECOVERY_MARKET: ${{ matrix.market }}
      RECOVERY_SOURCE_IDS: ${{ matrix.source }}
      RECOVERY_OUTPUT: source-smoke-${{ matrix.source }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect strict listing-bound source sample
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-smoke-${{ matrix.source }}
          path: source-smoke-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3
