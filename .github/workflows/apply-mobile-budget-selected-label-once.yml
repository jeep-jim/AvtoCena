name: Apply selected mobile budget label fix once

on:
  push:
    branches:
      - ui/mobile-budget-overlay-cleanup-20260814
    paths:
      - .github/workflows/apply-mobile-budget-selected-label-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-budget-overlay-cleanup-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Hide chevron after budget selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/components/home/HomePageClient.tsx')
          s = path.read_text()
          start = s.index('function MobileBudgetPicker(')
          end = s.index('\nfunction ElectricFilter(', start)
          chunk = s[start:end]
          old = '<span className="min-w-0 truncate">{value ? active?.label : "Бюджет"}</span><Chevron open={open} />'
          new = '<span className="min-w-0 whitespace-nowrap">{value ? active?.label : "Бюджет"}</span>{!value ? <Chevron open={open} /> : null}'
          if old not in chunk:
              raise SystemExit('mobile budget trigger anchor not found')
          chunk = chunk.replace(old, new, 1)
          s = s[:start] + chunk + s[end:]
          path.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only label fix
        shell: bash
        run: |
          rm .github/workflows/apply-mobile-budget-selected-label-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/home/HomePageClient.tsx .github/workflows/apply-mobile-budget-selected-label-once.yml
          git commit -m "Show full selected mobile budget"
          git push origin HEAD:ui/mobile-budget-overlay-cleanup-20260814
