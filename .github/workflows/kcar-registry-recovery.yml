name: K Car bound registry recovery
on:
  workflow_dispatch:
  push:
    branches: [fix/kcar-registry-recovery-20260919, main]
    paths: [.github/workflows/kcar-registry-recovery.yml, data/catalog/triggers/kcar-registry-recovery.json]
permissions:
  contents: read
concurrency:
  group: catalog-kcar-registry-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CATALOG_READ_CONCURRENCY: '4'
      NODE_OPTIONS: --max-old-space-size=6144
      JSON_STORAGE_DRIVER: object
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_INPUT_DIR: kcar-registry-input
      CATALOG_REBUILD_MARKETS: korea
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '1'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      KCAR_REGISTRY_RECOVERY_LIMIT: '60'
      CATALOG_KCAR_REQUEST_RPM: '60'
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Refresh and calculate a bounded existing-inventory sample
        run: node --import tsx scripts/catalog-kcar-registry-recovery.mjs
      - name: Check storage reserve
        if: github.ref == 'refs/heads/main'
        run: node --import tsx scripts/catalog-storage-preflight.mjs
      - name: Publish through all source retention and price guards
        if: github.ref == 'refs/heads/main'
        run: node --import tsx scripts/catalog-publish-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcar-registry-recovery
          retention-days: 14
          path: |
            kcar-registry-recovery-report.json
            catalog-v2-market-publish-report.json
            catalog-storage-preflight.json
