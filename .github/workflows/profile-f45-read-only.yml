name: Profile exact f45 saved reads only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-f45-read-only.yml']
permissions:
  contents: read
concurrency:
  group: owner-login-read-diagnostic
  cancel-in-progress: false
jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Profile f45 saved reads without publication'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve diagnostic and checkout exact f45
        run: |
          set -euo pipefail
          cp scripts/profile-f45-read-only.mjs /tmp/profile-f45-read-only.mjs
          git fetch --depth=1 origin f45efaf2b172af41d14987fb642e8e6b6df78cdd
          git checkout --detach FETCH_HEAD
          cp /tmp/profile-f45-read-only.mjs scripts/profile-f45-read-only.mjs
          test "$(git rev-parse HEAD)" = 'f45efaf2b172af41d14987fb642e8e6b6df78cdd'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Offline guard tests without credentials
        run: |
          node --check scripts/profile-f45-read-only.mjs
          node scripts/profile-f45-read-only.mjs --self-test
      - name: Compare independent login reads ABBA on saved data
        timeout-minutes: 13
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/profile-f45-read-only.mjs --compare
      - name: Measure fixed prepared China selection twice without recalculation
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          NODE_OPTIONS: --max-old-space-size=5120
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/profile-f45-read-only.mjs --china
