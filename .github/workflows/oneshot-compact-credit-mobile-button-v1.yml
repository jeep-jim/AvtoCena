name: One-shot compact credit placeholder

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-compact-credit-mobile-button-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: git pull --ff-only origin main

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          git restore package-lock.json 2>/dev/null || true

      - name: Apply compact credit UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/web/components/catalog/OfferContactActions.tsx')
          text = p.read_text()

          start = text.index('function CreditCalculatorMockup() {')
          end = text.index('function ActionButtons', start)
          compact = '''function CreditCalculatorMockup() {
  return (
    <section className="ac-credit-calculator-mock rounded-[1.35rem] border border-[var(--ac-border)] bg-[var(--ac-surface-2)] p-4" aria-label="Кредитный калькулятор">
      <div className="flex items-start justify-between gap-4">
        <div className="min-w-0">
          <div className="text-[10px] font-black uppercase tracking-[0.16em] text-red-500">Финансирование</div>
          <div className="mt-0.5 flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-1">
            <h2 className="text-xl font-black tracking-[-0.035em] text-[var(--ac-text)]">Кредитный калькулятор</h2>
            <span className="text-xs font-semibold text-[var(--ac-muted)]">Сюда подключим форму партнёра.</span>
          </div>
        </div>
        <span className="shrink-0 rounded-full bg-red-500/10 px-2.5 py-1 text-[10px] font-black uppercase tracking-[0.12em] text-red-500">Скоро</span>
      </div>

      <div className="mt-3 grid grid-cols-3 gap-2">
        <div className="rounded-xl border border-[var(--ac-border)] bg-[var(--ac-surface)] px-3 py-2.5">
          <div className="text-[10px] font-bold text-[var(--ac-muted)]">Стоимость авто</div>
          <div className="mt-0.5 text-sm font-black text-[var(--ac-text)]">из карточки</div>
        </div>
        <div className="rounded-xl border border-[var(--ac-border)] bg-[var(--ac-surface)] px-3 py-2.5">
          <div className="text-[10px] font-bold text-[var(--ac-muted)]">Первый взнос</div>
          <div className="mt-0.5 text-sm font-black text-[var(--ac-text)]">0 ₽</div>
        </div>
        <div className="rounded-xl border border-[var(--ac-border)] bg-[var(--ac-surface)] px-3 py-2.5">
          <div className="text-[10px] font-bold text-[var(--ac-muted)]">Срок</div>
          <div className="mt-0.5 text-sm font-black text-[var(--ac-text)]">60 мес</div>
        </div>
      </div>

      <div className="mt-2 flex items-stretch gap-2">
        <div className="flex min-w-0 flex-1 items-center justify-between gap-3 rounded-xl bg-red-500/10 px-3 py-2.5">
          <span className="text-xs font-black text-[var(--ac-text)]">Ежемесячный платёж</span>
          <span className="text-lg font-black text-red-500">— ₽</span>
        </div>
        <button type="button" aria-disabled="true" className="min-w-[176px] cursor-default rounded-xl bg-[#111318] px-4 py-2.5 text-xs font-black text-white">Подобрать кредит</button>
      </div>
    </section>
  );
}

'''
          text = text[:start] + compact + text[end:]

          text = text.replace(
            '    document.querySelectorAll<HTMLElement>("[data-offer-actions-host]").forEach((node) => node.remove());',
            '    document.querySelectorAll<HTMLElement>("[data-offer-actions-host], [data-offer-credit-host], [data-offer-credit-mobile-host]").forEach((node) => node.remove());'
          )

          if 'let mobileCreditHost: HTMLElement | null = null;' not in text:
            text = text.replace(
              '    let creditHost: HTMLElement | null = null;',
              '    let creditHost: HTMLElement | null = null;\n    let mobileCreditHost: HTMLElement | null = null;'
            )

          if 'const breakdown = page?.querySelector<HTMLElement>(".ac-offer-breakdown");' not in text:
            text = text.replace(
              '      const desktopSlot = page?.querySelector<HTMLElement>("[data-offer-desktop-actions-slot]");',
              '      const desktopSlot = page?.querySelector<HTMLElement>("[data-offer-desktop-actions-slot]");\n      const breakdown = page?.querySelector<HTMLElement>(".ac-offer-breakdown");'
            )

          marker = '      creditHost.dataset.offerCreditHost = "true";\n      mediaColumn.appendChild(creditHost);'
          if 'data-offer-credit-mobile-host' not in text[text.index(marker):text.index(marker)+1200]:
            insert = marker + '''

      if (breakdown) {
        mobileCreditHost = document.createElement("div");
        mobileCreditHost.dataset.offerCreditMobileHost = "true";
        const mobileCreditButton = document.createElement("button");
        mobileCreditButton.type = "button";
        mobileCreditButton.className = "ac-mobile-credit-button";
        mobileCreditButton.textContent = "Кредитный калькулятор";
        mobileCreditHost.appendChild(mobileCreditButton);
        breakdown.appendChild(mobileCreditHost);
      }'''
            text = text.replace(marker, insert)

          if '      mobileCreditHost?.remove();' not in text:
            text = text.replace('      creditHost?.remove();', '      creditHost?.remove();\n      mobileCreditHost?.remove();')

          css_start = text.index('        @media (min-width: 1280px) {')
          css_end = text.index('        .ac-offer-page > section > section {', css_start)
          old_css = text[css_start:css_end]
          spec_prefix_end = old_css.index('          .ac-offer-page [data-offer-credit-host] {')
          spec_css = old_css[:spec_prefix_end]
          new_credit_css = '''          .ac-offer-page:has(.ac-offer-breakdown[open]) [data-offer-credit-host] {
            display: block !important;
            margin-top: 1rem;
          }
          .ac-credit-calculator-mock {
            box-shadow: 0 12px 28px rgba(0,0,0,.10);
          }
          html[data-theme="light"] .ac-credit-calculator-mock {
            box-shadow: 0 12px 26px rgba(38,43,57,.07);
          }
        }
'''
          desktop_css = spec_css + new_credit_css
          base_css = '''        .ac-offer-page [data-offer-credit-host],
        .ac-offer-page [data-offer-credit-mobile-host] {
          display: none !important;
        }
        @media (max-width: 1279px) {
          .ac-offer-page [data-offer-credit-mobile-host] {
            display: block !important;
            padding: 0 1rem 1rem;
          }
          .ac-mobile-credit-button {
            display: flex;
            width: 100%;
            height: 46px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: .9rem;
            background: #0b0d11;
            color: #fff !important;
            font-size: 13px;
            font-weight: 900;
            line-height: 1;
            box-shadow: 0 8px 18px rgba(0,0,0,.12);
          }
          html[data-theme="light"] .ac-mobile-credit-button {
            border-color: #0b0d11;
            background: #0b0d11;
            color: #fff !important;
          }
        }
'''
          text = text[:css_start] + base_css + desktop_css + text[css_end:]

          p.write_text(text)
          PY

      - name: Typecheck
        run: |
          npm run typecheck
          git restore package-lock.json 2>/dev/null || true
          git restore apps/web/tsconfig.tsbuildinfo packages/engine/tsconfig.tsbuildinfo 2>/dev/null || true

      - name: Publish safely
        run: |
          grep -q 'Сюда подключим форму партнёра' apps/web/components/catalog/OfferContactActions.tsx
          grep -q 'data.offerCreditMobileHost' apps/web/components/catalog/OfferContactActions.tsx || grep -q 'offerCreditMobileHost' apps/web/components/catalog/OfferContactActions.tsx
          grep -q 'ac-mobile-credit-button' apps/web/components/catalog/OfferContactActions.tsx
          grep -q 'display: none !important' apps/web/components/catalog/OfferContactActions.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/OfferContactActions.tsx
          git rm .github/workflows/oneshot-compact-credit-mobile-button-v1.yml
          git commit -m 'Compact credit placeholder and add mobile credit entry'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
