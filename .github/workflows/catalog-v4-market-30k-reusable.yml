name: Catalog V4 simple market 30k

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false
      CATALOG_IMAGE_CDN_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-v4-simple-${{ inputs.market }}
  cancel-in-progress: false

env:
  CATALOG_V2_PRIORITY_TARGET: "0"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "999999999999"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "30000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "30000"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "1"
  CATALOG_PUBLISH_MAX_PER_MARKET: "30000"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "5"
      CATALOG_V2_SOURCE_SLOTS_ONLY: "0"
      CATALOG_REBUILD_IGNORE_PROBE: "1"
      CATALOG_REBUILD_RESET_CURSOR: "0"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "30000"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "150000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "100"
      CATALOG_REBUILD_MAX_SOURCE_ERRORS: "12"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "30000"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "30"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "10"
      CATALOG_REBUILD_TIME_LIMIT_MS: "4800000"
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_TIMEOUT_MS: "15000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "16"
      CATALOG_GALLERY_FAST_PATH: "true"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect and checkpoint real listings
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 5100s npx tsx scripts/catalog-rebuild-source-shard.mjs
          status=$?
          test -s "$CATALOG_REBUILD_OUTPUT" || node -e 'const fs=require("fs");fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT,JSON.stringify({market:process.env.CATALOG_REBUILD_MARKET,count:0,partial:true,offers:[],report:{sourceErrors:[{error:`exit_${process.argv[1]}`}]}}))' "$status"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v4-${{ inputs.market }}-${{ matrix.shard }}
          path: catalog-rebuild-${{ inputs.market }}-${{ matrix.shard }}.json
          retention-days: 3
          compression-level: 6

  publish:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-v4-input
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-v4-${{ inputs.market }}-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-v4-${{ inputs.market }}-publish-report.json
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "30"
      CATALOG_INDEX_WRITE_CONCURRENCY: "16"
      CATALOG_STORAGE_EMERGENCY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-v4-${{ inputs.market }}-*
          path: catalog-v4-input
          merge-multiple: true
      - name: Require at least one collected listing
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync(process.env.CATALOG_REBUILD_INPUT_DIR).filter(x=>/^catalog-rebuild-.*-\d+\.json$/.test(x));
          const total=files.reduce((n,f)=>{const p=JSON.parse(fs.readFileSync(path.join(process.env.CATALOG_REBUILD_INPUT_DIR,f)));return n+Number(p.count||p.offers?.length||0)},0);
          console.log({market:process.env.CATALOG_REBUILD_MARKETS,files:files.length,total});
          if(total<=0) process.exit(1);
          NODE
      - run: npx tsx scripts/catalog-validate-source-scale.mjs
      - run: npx tsx scripts/catalog-publish-market.mjs
      - name: Verify publication
        run: |
          node <<'NODE'
          const fs=require('fs');
          const market=process.env.CATALOG_REBUILD_MARKETS;
          const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,'utf8'));
          const count=Number(p.byMarket?.[market]||0);
          const state={market,published:p.published===true,generationId:p.generationId||null,count,publicationError:p.publicationError||''};
          console.log(JSON.stringify(state,null,2));
          if(!state.published||!state.generationId||state.count<=0||state.count>30000||state.publicationError) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v4-${{ inputs.market }}-reports
          path: |
            catalog-v4-${{ inputs.market }}-validation-report.json
            catalog-v4-${{ inputs.market }}-publish-report.json
          retention-days: 3
