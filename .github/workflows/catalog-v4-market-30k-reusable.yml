name: Catalog strict market · 10k

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-strict-market-${{ inputs.market }}
  cancel-in-progress: false

env:
  CATALOG_RAW_LISTING_MODE: "1"
  CATALOG_KNOWLEDGE_DISABLED: "1"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "10000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "10000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "10000"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "10000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "60"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "6"
      CATALOG_REBUILD_TIME_LIMIT_MS: "14400000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "20"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_GALLERY_TIMEOUT_MS: "30000"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-0.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect valid raw listings
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=60s 14700s npx tsx scripts/catalog-simple-source-market.mjs
          test -s "$CATALOG_REBUILD_OUTPUT"
      - name: Require exactly 10000 valid collected cards
        run: |
          node <<'NODE'
          const p = require('./' + process.env.CATALOG_REBUILD_OUTPUT);
          const offers = Array.isArray(p.offers) ? p.offers : [];
          if (p.count !== 10000 || offers.length !== 10000) {
            throw new Error(`Expected exactly 10000 cards, got report=${p.count} offers=${offers.length}`);
          }
          for (const [i, o] of offers.entries()) {
            const photos = Array.isArray(o.photos) ? o.photos : Array.isArray(o.images) ? o.images : [];
            const source = o.sourceUrl || o.url || o.source?.url;
            const sourceId = o.sourceId || o.id || o.source?.id;
            const hp = Number(o.powerHp ?? o.horsepower ?? o.power?.hp);
            const kw = Number(o.powerKw ?? o.power?.kw);
            if (!source || !sourceId || !o.make || !o.model || !Number(o.year) || Number(o.price) <= 0 || !o.currency) throw new Error(`Card ${i} misses required identity/price fields`);
            if (!(hp > 0 || kw > 0)) throw new Error(`Card ${i} has no convertible power value`);
            if (photos.length < 1 || photos.length > 30 || photos.some(x => typeof x !== 'string' || !/^https?:\/\//.test(x))) throw new Error(`Card ${i} has invalid real-photo gallery`);
          }
          const currentYear = new Date().getUTCFullYear();
          const priority = offers.filter(o => Number(o.year) >= currentYear - 6 && Number(o.powerHp ?? o.horsepower ?? o.power?.hp ?? (Number(o.powerKw ?? o.power?.kw) * 1.35962)) <= 160).length;
          if (priority <= 5000) throw new Error(`Priority share must exceed 50%, got ${priority}/10000`);
          if (offers.some(o => Number(o.year) < 2011)) throw new Error('Cards older than 2011 are not allowed');
          console.log(JSON.stringify({market:p.market,count:p.count,priority}, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-raw-${{ inputs.market }}-listings
          path: catalog-rebuild-${{ inputs.market }}-0.json
          retention-days: 3
          compression-level: 6

  publish:
    needs: collect
    concurrency:
      group: catalog-raw-shared-manifest-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_REBUILD_INPUT_DIR: catalog-raw-input
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-raw-${{ inputs.market }}-publish-report.json
      CATALOG_INDEX_WRITE_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-raw-${{ inputs.market }}-listings
          path: catalog-raw-input
      - name: Publish this market independently
        run: npx tsx scripts/catalog-publish-raw-market.mjs
      - name: Require confirmed 10000-card publication
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = process.env.CATALOG_REBUILD_PUBLISH_REPORT;
          if (!fs.existsSync(path)) throw new Error('Publication report missing');
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (p.published !== true) throw new Error('published must be true');
          if (p.publicationError) throw new Error(`publicationError: ${p.publicationError}`);
          if (!p.generationId) throw new Error('generationId missing');
          if (p.selectedCount !== 10000 || p.byMarket?.[process.env.CATALOG_REBUILD_MARKETS] !== 10000) throw new Error(`Expected 10000 published cards, got ${p.selectedCount}`);
          console.log(JSON.stringify(p, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-raw-${{ inputs.market }}-reports
          path: catalog-raw-${{ inputs.market }}-publish-report.json
          if-no-files-found: warn
          retention-days: 3
