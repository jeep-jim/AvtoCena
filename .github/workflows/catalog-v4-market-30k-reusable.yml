name: Catalog raw market · up to 30k

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-raw-market-${{ inputs.market }}
  cancel-in-progress: false

env:
  CATALOG_RAW_LISTING_MODE: "1"
  CATALOG_KNOWLEDGE_DISABLED: "1"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "30000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "30000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "30000"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "10000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "60"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "6"
      CATALOG_REBUILD_TIME_LIMIT_MS: "14400000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "20"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_GALLERY_TIMEOUT_MS: "30000"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-0.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect maximum valid raw listings
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 14700s npx tsx scripts/catalog-simple-source-market.mjs
          status=$?
          if [ ! -s "$CATALOG_REBUILD_OUTPUT" ]; then
            node -e 'const fs=require("fs");fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT,JSON.stringify({version:5,mode:"raw_listing_title_year_price_gallery",market:process.env.CATALOG_REBUILD_MARKET,count:0,partial:true,offers:[],report:{errors:[{stage:"process",error:`exit_${process.argv[1]}`}]}}))' "$status"
          fi
          echo "collector_exit=$status"
          exit 0
      - name: Validate artifact structure and report progress
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_OUTPUT, 'utf8'));
          const offers = Array.isArray(p.offers) ? p.offers : [];
          if (!p.market || p.market !== process.env.CATALOG_REBUILD_MARKET) throw new Error('Market mismatch in artifact');
          if (!Number.isFinite(Number(p.count)) || Number(p.count) !== offers.length) throw new Error('Artifact count mismatch');
          console.log(JSON.stringify({
            market: p.market,
            collected: offers.length,
            target: 30000,
            partial: offers.length < 30000,
            errors: p.report?.errors?.length || 0,
            sources: p.report?.sources || [],
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-raw-${{ inputs.market }}-listings
          path: catalog-rebuild-${{ inputs.market }}-0.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

  publish:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    concurrency:
      group: catalog-raw-shared-manifest-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_REBUILD_INPUT_DIR: catalog-raw-input
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-raw-${{ inputs.market }}-publish-report.json
      CATALOG_INDEX_WRITE_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-raw-${{ inputs.market }}-listings
          path: catalog-raw-input
      - name: Publish this market independently and accumulate three days
        run: npx tsx scripts/catalog-publish-raw-market.mjs
      - name: Report publication without blocking other markets
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = process.env.CATALOG_REBUILD_PUBLISH_REPORT;
          if (!fs.existsSync(file)) {
            console.log('::warning::Publication report missing');
            process.exit(0);
          }
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify(p, null, 2));
          if (!p.published) console.log(`::warning::${p.market} not published: ${p.publicationError || 'no valid cards'}`);
          else console.log(`Published ${p.selectedCount} accumulated cards for ${p.market}; generation ${p.generationId}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-raw-${{ inputs.market }}-reports
          path: catalog-raw-${{ inputs.market }}-publish-report.json
          if-no-files-found: warn
          retention-days: 3
