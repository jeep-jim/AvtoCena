name: Catalog source qualification · discovered route probe v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/source-deficit-recon-v1-20260903
    paths:
      - ".github/workflows/catalog-source-deficit-alt-probe-v1.yml"
      - "scripts/catalog-source-deficit-alt-probe-v1.mjs"
      - "tests/catalog-source-deficit-alt-probe-v1.test.ts"
      - "scripts/catalog-source-deficit-recon-v1.mjs"
      - "scripts/catalog-source-field-audit-v1.mjs"
      - "scripts/catalog-source-access-probe-v1.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-source-deficit-alt-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify discovered-route probe contract
        run: node --import tsx --test tests/catalog-source-deficit-alt-probe-v1.test.ts
      - name: Probe only routes discovered in the prior green artifact
        env:
          CATALOG_SOURCE_DEFICIT_ALT_TIMEOUT_MS: "15000"
          CATALOG_SOURCE_DEFICIT_ALT_MAX_BODY_BYTES: "900000"
        run: node scripts/catalog-source-deficit-alt-probe-v1.mjs
      - name: Verify no-write evidence envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-deficit-alt-probe-v1.json', 'utf8'));
          if (p.productionWrites !== false) throw new Error('productionWrites');
          if (p.classificationMutations !== false) throw new Error('classificationMutations');
          if (p.publishAllowedMutations !== false) throw new Error('publishAllowedMutations');
          if (p.rawBodiesStored !== false) throw new Error('rawBodiesStored');
          if (p.guessedRoutes !== false) throw new Error('guessedRoutes');
          if (p.routeOrigin !== 'discovered_in_run_33744960785') throw new Error('routeOrigin');
          if (p.sampleCount !== 2) throw new Error(`sampleCount=${p.sampleCount}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-deficit-alt-probe-v1
          path: catalog-source-deficit-alt-probe-v1.json
          if-no-files-found: error
          retention-days: 7
