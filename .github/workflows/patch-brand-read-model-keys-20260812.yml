name: Fix brand read-model keys 20260812

on:
  push:
    branches:
      - fix/catalog-brand-read-model-keys-20260812
    paths:
      - .github/workflows/patch-brand-read-model-keys-20260812.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-brand-read-model-keys-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply collision-safe brand keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(s,a,b,label):
            n=s.count(a)
            if n!=1: raise SystemExit(f'{label}: expected1 got{n}')
            return s.replace(a,b,1)
          p=Path('apps/web/lib/catalog/storage.ts'); s=p.read_text()
          s=once(s,
            'function currentProjectionPath(market: string) { return `catalog/public/projection/${cleanShard(market)}.json`; }\nfunction currentBrandProjectionPath(make: string) { return `catalog/public/projection-brand/${cleanShard(make)}.json`; }\n',
            'function currentProjectionPath(market: string) { return `catalog/public/projection/${cleanShard(market)}.json`; }\nfunction catalogBrandReadModelKey(value: unknown) { return cleanFacet(value).toLocaleLowerCase("ru-RU"); }\nfunction currentBrandProjectionPath(make: string) {\n  const normalized = catalogBrandReadModelKey(make);\n  const digest = crypto.createHash("sha256").update(normalized).digest("hex").slice(0, 16);\n  const label = cleanShard(make);\n  return `catalog/public/projection-brand/${label}-${digest}.json`;\n}\n',
            'projection collision-safe path')
          s=once(s,
            '    const brandKey = cleanShard(make);\n',
            '    const brandKey = catalogBrandReadModelKey(make);\n',
            'summary collision-safe key')
          s=once(s,
            '    const brand = summary.brands[cleanShard(make)];\n',
            '    const brand = summary.brands[catalogBrandReadModelKey(make)];\n',
            'summary collision-safe lookup')
          p.write_text(s)

          tp=Path('tests/catalog-brand-summary-read-model.test.ts')
          t=tp.read_text()
          t += '''\n\ntest("brand summary does not collapse non-latin makes onto one unknown key", () => {\n  const summary = buildCatalogBrandSummary("gen_i18n", [\n    { id:"1", market:"china", make:"奇瑞", model:"A", year:2024 },\n    { id:"2", market:"china", make:"吉利", model:"B", year:2024 },\n  ] as any);\n  assert.equal(Object.keys(summary.brands).length, 2);\n  assert.equal(Object.values(summary.brands).reduce((sum, brand) => sum + brand.count, 0), 2);\n});\n'''
          tp.write_text(t)
          sp=Path('tests/catalog-brand-projection-read-model.test.ts')
          st=sp.read_text()
          st=st.replace('assert.match(source, /catalog\\/public\\/projection-brand\\/\\$\\{cleanShard\\(make\\)\\}\\.json/);', 'assert.match(source, /projection-brand\\/\\$\\{label\\}-\\$\\{digest\\}\\.json/);\n  assert.match(source, /createHash\\("sha256"\\)\\.update\\(normalized\\)/);')
          sp.write_text(st)
          Path('.github/workflows/patch-brand-read-model-keys-20260812.yml').unlink()
          PY
      - name: Validate
        run: |
          node --import tsx --test tests/catalog-brand-summary-read-model.test.ts tests/catalog-brand-projection-read-model.test.ts tests/catalog-filter-search.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix collision-safe brand read-model keys"
          git push origin HEAD:fix/catalog-brand-read-model-keys-20260812
