name: Audit projection filter latency 20260811

on:
  push:
    branches: [audit/projection-filter-latency-20260811]
    paths:
      - scripts/catalog-projection-filter-smoke.mts
      - .github/workflows/audit-projection-filter-latency-20260811.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/projection-filter-latency-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Europe projection correctness and latency
        env:
          SMOKE_MARKET: europe
        run: npx tsx scripts/catalog-projection-filter-smoke.mts
      - name: China projection correctness and latency
        env:
          SMOKE_MARKET: china
        run: npx tsx scripts/catalog-projection-filter-smoke.mts
