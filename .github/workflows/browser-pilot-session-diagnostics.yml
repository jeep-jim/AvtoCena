name: Resume existing browser pilot and verify original Yandex answers
on:
  push:
    branches: [ops/pilot-session-diagnostics]
permissions:
  contents: read
concurrency:
  group: avtocena-browser-pilot
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test services/browser-pilot/test/*.test.mjs
      - name: Install Yandex Cloud CLI
        run: |
          curl -fsSL --max-time 60 https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o "$RUNNER_TEMP/yc-install.sh"
          bash "$RUNNER_TEMP/yc-install.sh" -i "$RUNNER_TEMP/yc" -n
          echo "YC_BIN=$RUNNER_TEMP/yc/bin/yc" >> "$GITHUB_ENV"
      - name: Configure existing deployment credentials
        env:
          YC_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/browser-yc-key.json",process.env.YC_CREDENTIALS,{mode:0o600})'
          "$YC_BIN" config profile create browser-pilot
          "$YC_BIN" config set service-account-key "$RUNNER_TEMP/browser-yc-key.json"
      - name: Resume exact stopped pilot and verify answers and cleanup
        run: node --import tsx scripts/browser-pilot-resume.ts
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/browser-yc-key.json"
