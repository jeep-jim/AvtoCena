name: Catalog emergency · reclaim failed-generation capacity
run-name: Safe catalog capacity recovery · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-emergency-capacity-cleanup.yml"
      - "scripts/catalog-clean-failed-generations.mjs"

permissions:
  contents: read

# The currently running legacy daily writer still uses this group. Because a
# full bucket cannot accept that writer's result, the one-shot cleanup stops it
# before deleting unreachable data. The interrupted collector is retried after
# recovery. New writers additionally use the Object Storage import lock.
concurrency:
  group: catalog-live-daily-working-markets
  # The bucket is already full, so an older collector cannot publish safely.
  # Stop that run first, reclaim capacity, then retry its interrupted job.
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_FAILED_GENERATION_CLEANUP_REPORT: catalog-emergency-capacity-cleanup.json
  CATALOG_FAILED_GENERATION_MAX_DELETES: "300000"
  CATALOG_FAILED_GENERATION_KEEP: "2"
  CATALOG_FAILED_GENERATION_PROTECT: "gen_1786426826475_e390aa80"
  YC_OBJECT_STORAGE_DELETE_CONCURRENCY: "16"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate capacity recovery
        run: |
          node --check scripts/catalog-clean-failed-generations.mjs
          node --import tsx --test tests/catalog-v2-market-recovery.test.ts
      - name: Remove only failed generations and orphan internal chunks
        run: npx tsx scripts/catalog-clean-failed-generations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-emergency-capacity-cleanup
          path: catalog-emergency-capacity-cleanup.json
          if-no-files-found: warn
          retention-days: 7
