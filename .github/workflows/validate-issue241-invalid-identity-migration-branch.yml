name: Validate issue241 identity migration read-only

on:
  push:
    branches:
      - fix/issue241-invalid-identity-migration-20260815
    paths:
      - "scripts/issue241-invalid-identity-migrate.mjs"
      - ".github/workflows/validate-issue241-invalid-identity-migration-branch.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      ISSUE241_IDENTITY_APPLY: "0"
      ISSUE241_IDENTITY_OUTPUT: issue241-invalid-identity-migration-plan.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run exact migration plan without writes
        run: npx tsx scripts/issue241-invalid-identity-migrate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-invalid-identity-migration-branch-plan
          path: issue241-invalid-identity-migration-plan.json
          if-no-files-found: warn
          retention-days: 2
