name: Catalog reindex from vehicle knowledge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-reindex-vehicle-knowledge.yml"
      - "apps/web/lib/catalog/customs-pricing.ts"
      - "packages/engine/src/calculation/russiaCustoms.ts"
      - "packages/engine/src/calculation/russiaCustomsV2.ts"
      - "scripts/catalog-reindex-vehicle-knowledge.mjs"
      - "scripts/catalog-rf-customs-live-card-proof.mjs"

permissions:
  contents: read
  statuses: write

jobs:
  reindex-production-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_KNOWLEDGE_REINDEX_CONCURRENCY: 8
      # The first honesty cleanup removes preliminary prices and cards without
      # calculation-critical engine/power data. Keep the write atomic and stop
      # if fewer than 35% of the current public rows survive all strict gates.
      CATALOG_REINDEX_MIN_PUBLIC_RATIO: 0.35
      CATALOG_REINDEX_MIN_PUBLIC_GUARD_COUNT: 50
      CATALOG_GROW_ONLY_MARKETS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check object storage configuration
        shell: bash
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Validate RF customs live-card proof
        run: node --check scripts/catalog-rf-customs-live-card-proof.mjs
      - name: RF customs live-card proof (read-only)
        id: rf_customs_proof
        env:
          CATALOG_RF_CUSTOMS_LIVE_PROOF_OUTPUT: catalog-rf-customs-live-card-proof.json
        run: node --import tsx scripts/catalog-rf-customs-live-card-proof.mjs
      - name: Upload RF customs live-card proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf-customs-live-card-proof-${{ github.run_id }}
          path: catalog-rf-customs-live-card-proof.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build missing certified 30-minute power queue
        run: npm run catalog:power-reference-queue
      - name: Recanonicalize and reprice current catalog
        run: npm run catalog:reindex-vehicle-knowledge
      - name: Probe external catalog sources (non-blocking after atomic publication)
        continue-on-error: true
        run: npm run catalog:smoke
      - name: Mark production reprice success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          description='RF live proof 3/3 + production reprice passed'
          payload="$(jq -nc --arg url "$run_url" --arg description "$description" '{state:"success",context:"catalog/reindex",description:$description,target_url:$url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload" >/dev/null
      - name: Mark production reprice failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          payload="$(jq -nc --arg url "$run_url" '{state:"failure",context:"catalog/reindex",description:"RF live proof or production reprice failed",target_url:$url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload" >/dev/null
