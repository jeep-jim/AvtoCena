name: Catalog reindex from vehicle knowledge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reindex-production-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_KNOWLEDGE_REINDEX_CONCURRENCY: 8
      CATALOG_REINDEX_MIN_PUBLIC_RATIO: 0.65
      CATALOG_REINDEX_MIN_PUBLIC_GUARD_COUNT: 50
      CATALOG_GROW_ONLY_MARKETS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check object storage configuration
        shell: bash
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Build missing certified 30-minute power queue
        run: npm run catalog:power-reference-queue
      - name: Recanonicalize and reprice current catalog
        run: npm run catalog:reindex-vehicle-knowledge
      - name: Run catalog smoke checks
        run: npm run catalog:smoke
