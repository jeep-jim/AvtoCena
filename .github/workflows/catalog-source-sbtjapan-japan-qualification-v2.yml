name: Catalog source qualification · SBT Japan v2

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sbtjapan-japan-qualification-v1-20260904
    paths:
      - ".github/workflows/catalog-source-sbtjapan-japan-qualification-v2.yml"
      - "scripts/catalog-source-sbtjapan-japan-qualification-v2.mjs"
      - "scripts/catalog-source-sbtjapan-japan-qualification-v1.mjs"
      - "scripts/catalog-source-access-probe-v1.mjs"
      - "tests/catalog-source-sbtjapan-japan-qualification-v2.test.ts"

permissions:
  contents: read

concurrency:
  group: catalog-source-sbtjapan-japan-qualification-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify SBT Japan v2 card-binding contract
        run: node --import tsx --test tests/catalog-source-sbtjapan-japan-qualification-v2.test.ts
      - name: Type-check project
        run: npm run typecheck
      - name: Qualify SBT Japan v2 without production writes
        env:
          CATALOG_SOURCE_SBTJAPAN_JAPAN_V2_TIMEOUT_MS: "20000"
          CATALOG_SOURCE_SBTJAPAN_JAPAN_V2_MAX_BODY_BYTES: "6000000"
          CATALOG_SOURCE_SBTJAPAN_JAPAN_V2_SAMPLE_COUNT: "4"
        run: node scripts/catalog-source-sbtjapan-japan-qualification-v2.mjs
      - name: Verify fail-closed evidence envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-sbtjapan-japan-qualification-v2.json', 'utf8'));
          for (const key of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) {
            if (p[key] !== false) throw new Error(`${key} must be false`);
          }
          if (p.sourcePublishAllowed !== false) throw new Error('sourcePublishAllowed must remain false');
          if (!p.sourceVerdict) throw new Error('sourceVerdict missing');
          if (!p.summary) throw new Error('summary missing');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-sbtjapan-japan-qualification-v2
          path: catalog-source-sbtjapan-japan-qualification-v2.json
          if-no-files-found: error
          retention-days: 7
