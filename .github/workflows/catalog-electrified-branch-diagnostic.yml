name: Catalog electrified branch diagnostic

on:
  push:
    branches:
      - catalog-electrified-recovery-20260809
    paths:
      - ".github/workflows/catalog-electrified-branch-diagnostic.yml"
      - ".github/patches/fix-georgia-details-and-pending-diagnostics.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "3"
  RECOVERY_PREPARE_CONCURRENCY: "4"

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply branch-only recovery patch
        run: python .github/patches/fix-georgia-details-and-pending-diagnostics.py
      - name: Validate code
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Inspect certified power reference inventory
        shell: bash
        run: |
          npx tsx -e 'import("./apps/web/lib/catalog/power-reference.ts").then(async (m) => { const rows = await m.getCertifiedPowerReferences(); console.log(JSON.stringify({ certifiedPowerReferenceCount: rows.length, byKind: rows.reduce((a,r)=>(a[r.powertrainKind]=(a[r.powertrainKind]||0)+1,a),{}), sample: rows.slice(0,20).map(r=>({make:r.make,model:r.model,yearFrom:r.yearFrom,yearTo:r.yearTo,powertrainKind:r.powertrainKind,sourceDocumentType:r.sourceDocumentType,sourceDocumentId:r.sourceDocumentId})) }, null, 2)); })'
      - name: Smoke Georgia with listing-bound images and detail specs
        continue-on-error: true
        env:
          RECOVERY_MARKET: georgia
          RECOVERY_SOURCE_IDS: auto_georgia_open
          RECOVERY_OUTPUT: catalog-rebuild-georgia-smoke.json
          RECOVERY_TARGET: "50"
          RECOVERY_MAX_PAGES: "3"
          RECOVERY_TIME_LIMIT_MS: "600000"
        run: |
          npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Print Georgia smoke report
        if: always()
        run: |
          node -e 'const fs=require("fs"); const p="catalog-rebuild-georgia-smoke.json"; if(fs.existsSync(p)){const x=JSON.parse(fs.readFileSync(p,"utf8")); console.log(JSON.stringify(x.report,null,2));} else {console.log("no smoke artifact");}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-electrified-branch-diagnostic
          path: catalog-rebuild-georgia-smoke.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/auto-georgia-strict-source.ts scripts/catalog-live-recovery-market.mjs
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Restore Georgia detail enrichment without image downloads"
          git push origin HEAD:catalog-electrified-recovery-20260809
