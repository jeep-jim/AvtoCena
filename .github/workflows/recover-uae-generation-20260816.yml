name: Guarded UAE immutable-generation recovery
run-name: Restore UAE without shrinking live catalog · ${{ github.sha }}

on:
  push:
    branches:
      - ops/recover-uae-generation-20260816
    paths:
      - .github/workflows/recover-uae-generation-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  restore-uae:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Validate restore code and current protected markets
        env:
          CATALOG_AUDIT_OUTPUT: uae-restore-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":9759,"uae":500,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: |
          set -euo pipefail
          node --check scripts/catalog-restore-market-from-generation.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          npx tsx scripts/catalog-live-postpersist-audit.mjs
          node -e 'const a=require("./uae-restore-preflight-audit.json"); if(a.markets?.japan?.count!==9759) throw new Error("japan_exact_count_changed:"+a.markets?.japan?.count)'

      - name: Rebuild UAE input from immutable pre-regression generation
        env:
          RECOVERY_RESTORE_MARKET: uae
          RECOVERY_RESTORE_GENERATION: gen_1786879550094_dc47db76
          RECOVERY_RESTORE_MIN_COUNT: "1042"
          RECOVERY_RESTORE_OUTPUT: catalog-rebuild-uae.json
          RECOVERY_RESTORE_REPORT: uae-generation-restore-report.json
        run: npx tsx scripts/catalog-restore-market-from-generation.mjs

      - name: Publish restored UAE cumulatively
        env:
          RECOVERY_PUBLISH_MARKET: uae
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-uae.json
          RECOVERY_PUBLISH_REPORT: uae-generation-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
          CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs

      - name: Audit restored UAE and all protected market minimums
        env:
          CATALOG_AUDIT_OUTPUT: uae-generation-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: uae
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":9759,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: |
          set -euo pipefail
          npx tsx scripts/catalog-live-postpersist-audit.mjs
          node -e 'const a=require("./uae-generation-postpersist-audit.json"); if(a.markets?.japan?.count!==9759) throw new Error("japan_exact_count_changed:"+a.markets?.japan?.count); if(a.markets?.uae?.count<900) throw new Error("uae_restore_below_900:"+a.markets?.uae?.count)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uae-generation-recovery-reports
          path: |
            uae-restore-preflight-audit.json
            uae-generation-restore-report.json
            uae-generation-publish-report.json
            uae-generation-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 7
