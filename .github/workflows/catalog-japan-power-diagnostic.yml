name: Catalog Japan exact power diagnostic
run-name: Japan power diagnostic · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-japan-power-diagnostic.yml"
      - "scripts/prestige-japan-power-diagnostic.mjs"

permissions:
  actions: read
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  PRESTIGE_SOURCE_RUN_ID: "31264677735"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download exact Prestige chunk artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prestige-source-chunks .prestige-zips
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRESTIGE_SOURCE_RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name | startswith("prestige-japan-chunk-")) | [.id,.name] | @tsv' > prestige-artifacts.tsv
          test -s prestige-artifacts.tsv
          while IFS=$'\t' read -r artifact_id artifact_name; do
            zip_path=".prestige-zips/${artifact_id}.zip"
            out_dir="prestige-source-chunks/$artifact_name"
            mkdir -p "$out_dir"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$zip_path"
            unzip -q "$zip_path" -d "$out_dir"
          done < prestige-artifacts.tsv
      - name: Merge individually valid strict sold lots
        env:
          PRESTIGE_PARTIAL_INPUT_DIR: prestige-source-chunks
          PRESTIGE_PARTIAL_OUTPUT: prestige-japan-exact-sold-partial-live.json
        run: node scripts/prestige-japan-partial-merge-for-live.mjs
      - name: Diagnose exact chassis and verified power references
        env:
          PRESTIGE_DIAGNOSTIC_INPUT: prestige-japan-exact-sold-partial-live.json
          PRESTIGE_DIAGNOSTIC_OUTPUT: prestige-japan-power-diagnostic.json
        run: npx tsx scripts/prestige-japan-power-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-japan-power-diagnostic
          path: prestige-japan-power-diagnostic.json
          if-no-files-found: error
          retention-days: 3
