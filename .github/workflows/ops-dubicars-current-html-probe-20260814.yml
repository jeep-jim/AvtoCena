name: Ops · DubiCars current HTML probe 20260814
run-name: DubiCars runner HTML probe · ${{ github.sha }}

on:
  push:
    branches:
      - ops/dubicars-current-html-probe-20260814

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect current DubiCars parser and image contract
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          const { parseDubicarsCurrentListing } = await import('./apps/web/lib/catalog/dubicars-current-source.ts');
          const headers = {
            accept: 'text/html,application/xhtml+xml,*/*;q=0.8',
            'accept-language': 'en-US,en;q=0.9',
            'cache-control': 'no-cache',
            pragma: 'no-cache',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36',
          };
          const listUrl = 'https://www.dubicars.com/uae/used?page=1';
          const response = await fetch(listUrl, { headers, redirect: 'follow' });
          const html = await response.text();
          const hrefs = [...html.matchAll(/href=["']([^"']+)["']/gi)].map((m) => m[1]);
          const links = [...new Set(hrefs.filter((v) => /-\d{5,}\.html(?:[?#]|$)/i.test(v)))];
          for (const raw of links.slice(0, 3)) {
            const detailUrl = new URL(raw, listUrl).toString();
            const detail = await fetch(detailUrl, { headers: { ...headers, referer: listUrl }, redirect: 'follow' });
            const markup = await detail.text();
            const parsed = parseDubicarsCurrentListing(markup, detailUrl);
            const rawImages = [...new Set([...markup.matchAll(/https?:\\?\/\\?\/[^"'<>\s\\]+\.(?:jpe?g|webp)(?:\?[^"'<>\s\\]*)?/gi)].map((m) => m[0].replace(/\\\//g,'/')))];
            const broad = rawImages.filter((v) => /\/images\/[a-f0-9]{6}\/(?:w_?\d+x\d+|\d+x\d+|f_?\d+x\d+)\//i.test(v));
            const oldStrict = broad.filter((v) => /\/images\/[a-f0-9]{6}\/(?:w_?\d+x\d+|\d+x\d+|f_?\d+x\d+)\/[^/?#]+\/[a-f0-9-]+\.(?:jpe?g|webp)(?:[?#]|$)/i.test(v));
            const plain = markup.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
            console.log(JSON.stringify({
              detailUrl,
              h1: markup.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),
              parsed: parsed ? { make: parsed.make, model: parsed.model, year: parsed.year, images: parsed.images.length } : null,
              parserYear: plain.match(/(?:^|\s)(?:Model year|Year)\s*[:：]?\s*((?:19|20)\d{2})\b/i)?.[1] || '',
              rawImages: rawImages.length,
              broadImages: broad.length,
              oldStrictImages: oldStrict.length,
              broadSample: broad.slice(0, 12),
            }, null, 2));
          }
          NODE
