name: Ops · DubiCars current HTML probe 20260814
run-name: DubiCars runner HTML probe · ${{ github.sha }}

on:
  push:
    branches:
      - ops/dubicars-current-html-probe-20260814

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect list and a few detail responses
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const headers = {
            accept: 'text/html,application/xhtml+xml,*/*;q=0.8',
            'accept-language': 'en-US,en;q=0.9',
            'cache-control': 'no-cache',
            pragma: 'no-cache',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36',
          };
          const url = 'https://www.dubicars.com/uae/used?page=1';
          const response = await fetch(url, { headers, redirect: 'follow' });
          const html = await response.text();
          const hrefs = [...html.matchAll(/href=["']([^"']+)["']/gi)].map((m) => m[1]);
          const exactOld = [...new Set(hrefs.filter((v) => /-\d{5,}\.html(?:[?#]|$)/i.test(v)))];
          const numericHtmlAnywhere = [...new Set([...html.matchAll(/(?:https?:\/\/www\.dubicars\.com)?\/[^"'<>\s]+-\d{5,}\.html/gi)].map((m) => m[0]))];
          const listingLike = [...new Set(hrefs.filter((v) => /\/\d{4}-[^?#]+-\d{5,}(?:\.html)?(?:[?#]|$)/i.test(v) || /-\d{5,}(?:\.html)?(?:[?#]|$)/i.test(v)))];
          console.log(JSON.stringify({
            status: response.status,
            finalUrl: response.url,
            bytes: html.length,
            title: html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g,' ').trim(),
            hrefCount: hrefs.length,
            exactOldCount: exactOld.length,
            numericHtmlAnywhereCount: numericHtmlAnywhere.length,
            listingLikeCount: listingLike.length,
            exactOldSample: exactOld.slice(0, 10),
            listingLikeSample: listingLike.slice(0, 20),
            challenge: /imperva|incapsula|captcha|challenge|access denied|verify you are human/i.test(html.slice(0, 10000)),
            hasResults: /results found|used cars for sale/i.test(html),
            scriptNextData: /__NEXT_DATA__/i.test(html),
            scriptNuxt: /__NUXT__/i.test(html),
          }, null, 2));
          const candidates = exactOld.length ? exactOld : listingLike;
          for (const raw of candidates.slice(0, 3)) {
            const detailUrl = new URL(raw, url).toString();
            const detail = await fetch(detailUrl, { headers: { ...headers, referer: url }, redirect: 'follow' });
            const markup = await detail.text();
            console.log(JSON.stringify({
              detailUrl,
              status: detail.status,
              bytes: markup.length,
              h1: markup.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),
              modelYear: markup.match(/Model year[\s\S]{0,160}?((?:19|20)\d{2})/i)?.[1],
              makeLabel: markup.match(/(?:>\s*)Make(?:\s*<)[\s\S]{0,260}?>([^<>]{2,60})</i)?.[1]?.trim(),
              imageAttrCount: [...markup.matchAll(/(?:data-src|data-original|data-lazy-src|src|content|poster)\s*=\s*["']([^"']+)["']/gi)].length,
              currentImagePatternCount: [...markup.matchAll(/\/images\/[a-f0-9]{6}\/(?:w_?\d+x\d+|\d+x\d+|f_?\d+x\d+)\/[^"'<>\s]+/gi)].length,
              challenge: /imperva|incapsula|captcha|challenge|access denied|verify you are human/i.test(markup.slice(0, 10000)),
            }, null, 2));
          }
          NODE
