name: Ops · DubiCars current HTML probe 20260814
run-name: DubiCars runner HTML probe · ${{ github.sha }}

on:
  push:
    branches:
      - ops/dubicars-current-html-probe-20260814

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect list and parser on a few detail responses
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          const { parseDubicarsCurrentListing } = await import('./apps/web/lib/catalog/dubicars-current-source.ts');
          const headers = {
            accept: 'text/html,application/xhtml+xml,*/*;q=0.8',
            'accept-language': 'en-US,en;q=0.9',
            'cache-control': 'no-cache',
            pragma: 'no-cache',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36',
          };
          const url = 'https://www.dubicars.com/uae/used?page=1';
          const response = await fetch(url, { headers, redirect: 'follow' });
          const html = await response.text();
          const hrefs = [...html.matchAll(/href=["']([^"']+)["']/gi)].map((m) => m[1]);
          const exactOld = [...new Set(hrefs.filter((v) => /-\d{5,}\.html(?:[?#]|$)/i.test(v)))];
          console.log(JSON.stringify({ status: response.status, bytes: html.length, hrefCount: hrefs.length, exactOldCount: exactOld.length, sample: exactOld.slice(0, 5) }, null, 2));
          for (const raw of exactOld.slice(0, 5)) {
            const detailUrl = new URL(raw, url).toString();
            const detail = await fetch(detailUrl, { headers: { ...headers, referer: url }, redirect: 'follow' });
            const markup = await detail.text();
            const parsed = parseDubicarsCurrentListing(markup, detailUrl);
            console.log(JSON.stringify({
              detailUrl,
              status: detail.status,
              bytes: markup.length,
              h1: markup.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),
              parsed: parsed ? {
                id: parsed.id,
                make: parsed.make,
                model: parsed.model,
                year: parsed.year,
                price: parsed.price,
                currency: parsed.currency,
                imageCount: parsed.images.length,
                firstImage: parsed.images[0],
              } : null,
              modelYear: markup.match(/Model year[\s\S]{0,160}?((?:19|20)\d{2})/i)?.[1],
              currentImagePatternCount: [...markup.matchAll(/\/images\/[a-f0-9]{6}\/(?:w_?\d+x\d+|\d+x\d+|f_?\d+x\d+)\/[^"'<>\s]+/gi)].length,
            }, null, 2));
          }
          NODE
