name: Ops · DubiCars current HTML probe 20260814
run-name: DubiCars parser gate probe · ${{ github.sha }}

on:
  push:
    branches:
      - ops/dubicars-current-html-probe-20260814

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect exact parser gate fields
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          const { parseDubicarsCurrentListing } = await import('./apps/web/lib/catalog/dubicars-current-source.ts');
          const headers = {
            accept: 'text/html,application/xhtml+xml,*/*;q=0.8',
            'accept-language': 'en-US,en;q=0.9',
            'cache-control': 'no-cache',
            pragma: 'no-cache',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36',
          };
          const MAKES = [
            'Mercedes-Benz','Land Rover','Rolls-Royce','Toyota','Lexus','Nissan','Infiniti','Honda','Mazda','Mitsubishi','Subaru','Suzuki','Hyundai','Genesis','Kia','BMW','Audi','Volkswagen','Volvo','Porsche','Ford','Chevrolet','Cadillac','Jeep','Dodge','Renault','Peugeot','Citroen','Skoda','MINI','BYD','Geely','Changan','Chery','GAC','Haval','Tesla','Jetour','RAM','GMC','Bentley','Lamborghini','Ferrari','Maserati','McLaren'
          ].sort((a,b)=>b.length-a.length);
          const clean = (value) => String(value || '')
            .replace(/\\u002f/gi,'/').replace(/\\u003a/gi,':').replace(/\\u0026/gi,'&').replace(/\\\//g,'/')
            .replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'")
            .replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          const makeModel = (raw) => {
            const title = clean(raw).replace(/^\s*(?:19|20)\d{2}\s+/,'').replace(/^used\s+/i,'').trim();
            const lower = title.toLowerCase();
            const make = MAKES.find((item)=>lower===item.toLowerCase() || lower.startsWith(`${item.toLowerCase()} `)) || '';
            const model = make ? title.slice(make.length).replace(/^\s*[-–—|]\s*/,'').split(/\s+/).slice(0,8).join(' ').trim() : '';
            return {make,model};
          };
          const listUrl = 'https://www.dubicars.com/uae/used?page=1';
          const list = await fetch(listUrl,{headers,redirect:'follow'});
          const listHtml = await list.text();
          const links = [...new Set([...listHtml.matchAll(/href=["']([^"']+-\d{5,}\.html)["']/gi)].map((m)=>m[1]))];
          for (const raw of links.slice(0,5)) {
            const detailUrl = new URL(raw,listUrl).toString();
            const response = await fetch(detailUrl,{headers:{...headers,referer:listUrl},redirect:'follow'});
            const markup = await response.text();
            const fullPlain = clean(markup);
            const plain = fullPlain.split(/\b(?:Similar cars|People also viewed|Related links)\b/i)[0];
            const rawTitle = clean(markup.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)?.[1] || markup.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)/i)?.[1]);
            const title = rawTitle.replace(/\s+(?:19|20)\d{2}\s+for sale.*$/i,'').trim();
            const identity = makeModel(title);
            const year = Number(plain.match(/(?:^|\s)(?:Model year|Year)\s*[:：]?\s*((?:19|20)\d{2})\b/i)?.[1] || 0);
            const attrs = [...markup.matchAll(/(?:data-src|data-original|data-lazy-src|src|content|poster)\s*=\s*["']([^"']+)["']/gi)].map((m)=>m[1]);
            const scriptUrls = [...markup.matchAll(/https?:\\?\/\\?\/[^"'<>\s\\]+\.(?:jpe?g|webp)(?:\?[^"'<>\s\\]*)?/gi)].map((m)=>m[0].replace(/\\\//g,'/'));
            const allUrls = [...new Set([...attrs,...scriptUrls])].map((v)=>{try{return new URL(v.replace(/&amp;/gi,'&').replace(/\\\//g,'/'),detailUrl).toString()}catch{return ''}}).filter(Boolean);
            const valid = allUrls.filter((v)=>/\/images\/[a-f0-9]{6}\/(?:w_?\d+x\d+|\d+x\d+|f_?\d+x\d+)\/[^/?#]+\/[a-f0-9-]+\.(?:jpe?g|webp)(?:[?#]|$)/i.test(v) && !/logo|icon|avatar|qrcode|qr-code|placeholder|banner|related|similar|people-also-viewed|dealer|tracking|pixel|calendar|calender|kilometers|share|email|heart|settings|feature_groups|social|homepage|mobile-mockup/i.test(v) && !/\/(?:130x76|f_500x282)\//i.test(v));
            console.log(JSON.stringify({detailUrl,title,identity,year,allUrlCount:allUrls.length,validImageCount:valid.length,validSample:valid.slice(0,8),parserResult:parseDubicarsCurrentListing(markup,detailUrl)},null,2));
          }
          NODE
