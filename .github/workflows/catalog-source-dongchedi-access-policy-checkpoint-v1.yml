name: Catalog source qualification · Dongchedi access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/dongchedi-access-policy-v1-20260905
    paths:
      - ".github/workflows/catalog-source-dongchedi-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-dongchedi-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-dongchedi-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Dongchedi access-policy decision
        run: node scripts/catalog-source-dongchedi-access-policy-checkpoint-v1.mjs
      - name: Verify safety, roadmap and next step
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='dongchedi_china_open');
          const d=l.decisions.find(x=>x.sourceId==='dongchedi_china_open');
          if(!row||row.class!=='research_pending'||row.publishAllowed!==false)throw new Error('Dongchedi registry invalid');
          if(row.qualificationBlocker!=='public_automation_permission_unproven_and_official_enterprise_platform_terms_prohibit_robots_without_operator_permission')throw new Error('Dongchedi blocker missing');
          if(row.permittedRouteCandidate!=='official_dongchedi_enterprise_open_platform_contact_open.dongchedi@bytedance.com')throw new Error('Dongchedi permitted route missing');
          if(!d||d.class!=='research_pending'||d.publishAllowed!==false||d.evidence?.runId!==33938264745)throw new Error('Dongchedi ledger invalid');
          const japan=r.candidates.filter(x=>x.market==='japan');
          if(!japan.length||japan.some(x=>x.qualificationPaused!==true))throw new Error('Japan pause missing');
          if(!/Guazi/i.test(r.next||''))throw new Error('Guazi next missing');
          if(!m.includes('## 40.48 — Dongchedi China: public permission is unproven; official business platform also blocks unauthorized robots'))throw new Error('roadmap 40.48 missing');
          if(r.candidates.some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Record Dongchedi access-policy blocker"
          git push origin HEAD:chore/dongchedi-access-policy-v1-20260905
