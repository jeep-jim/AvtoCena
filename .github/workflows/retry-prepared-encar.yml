name: Retry the verified prepared Encar intake
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/korea-prepared-retry.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-korea
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'jeep-jim/AvtoCena' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.verify.outputs.verified || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the approved source, saved intake and unchanged live catalog
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'VERIFY_PREPARED_ENCAR_RETRY'
          import fs from 'node:fs';
          const markerPath='.github/market-runs/korea-prepared-retry.json';
          const repository='jeep-jim/AvtoCena', repositoryId=1289722938;
          const sourceSha='c90dea655470d2970f5f22cc7d7f98c086874738';
          const preparedRun=45077320093, preparedAttempt=1, producerJobId=137403171884, artifactId=14779553850;
          const artifactDigest='sha256:9dafe4744cfaef0522f564978dc38152e28d52d55790fcd6a7d03a670a7d4aeb';
          const release='22867cbcfaee27b2e8917b6bf880e44827f67b60';
          const calculation='4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90';
          const generation='gen_1794878284419_a611dfcf';
          const api='https://api.github.com/repos/'+repository;
          const check=(condition,code)=>{if(!condition)throw Error(code);};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'verified=false\n');
          async function getJson(url,label) {
            const headers={'accept':'application/json','cache-control':'no-cache'};
            if(url.startsWith(api+'/')) {
              headers.authorization='Bearer '+process.env.GH_TOKEN;
              headers['X-GitHub-Api-Version']='2022-11-28';
            }
            const response=await fetch(url,{headers,redirect:'error',signal:AbortSignal.timeout(30000)});
            check(response.ok,label+'_http_'+response.status);
            const text=await response.text();
            check(text.length<=1048576,label+'_response_too_large');
            return JSON.parse(text);
          }
          function checkRun(run,id,workflow,event,conclusion) {
            check(run?.id===id && run.run_attempt===preparedAttempt && run.path===workflow
              && run.event===event && run.head_branch==='main' && run.head_sha===sourceSha
              && run.repository?.id===repositoryId && run.head_repository?.id===repositoryId,
              'retry_run_identity_'+id);
            check(run.status==='completed' && run.conclusion===conclusion,'retry_run_state_'+id);
          }
          try {
            check(process.env.GITHUB_REPOSITORY===repository
              && process.env.GITHUB_REPOSITORY_ID===String(repositoryId)
              && process.env.GITHUB_REF==='refs/heads/main'
              && process.env.GITHUB_EVENT_NAME==='push'
              && /^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA||'')
              && !!process.env.GH_TOKEN,'retry_event_invalid');
            check(fs.lstatSync(markerPath).isFile(),'retry_marker_type');
            const marker=JSON.parse(fs.readFileSync(markerPath,'utf8'));
            check(marker?.version===1 && marker.operation==='retry-prepared-encar-45077320093-1'
              && /^[a-f0-9]{40}$/.test(marker.approvedSourceSha||'')
              && Object.keys(marker).sort().join(',')==='approvedSourceSha,operation,version',
              'retry_marker_invalid');
            const commit=await getJson(api+'/commits/'+process.env.GITHUB_SHA,'retry_trigger_commit');
            check(commit.sha===process.env.GITHUB_SHA && commit.parents?.length===1
              && commit.parents[0].sha===marker.approvedSourceSha,'retry_source_parent_changed');
            check(commit.files?.length===1 && commit.files[0].filename===markerPath
              && ['added','modified'].includes(commit.files[0].status)
              && !commit.files[0].previous_filename,'retry_code_changed');
            const [prepared,producer,artifact,health,catalog]=await Promise.all([
              getJson(api+'/actions/runs/'+preparedRun,'retry_prepared_run'),
              getJson(api+'/actions/jobs/'+producerJobId,'retry_producer_job'),
              getJson(api+'/actions/artifacts/'+artifactId,'retry_intake_artifact'),
              getJson('https://avtocena.com/api/health','retry_live_health'),
              getJson('https://avtocena.com/api/catalog/search?market=korea&source=existing&page=1&pageSize=1','retry_live_catalog')
            ]);
            // This run prepared a complete intake, then failed during publication.
            checkRun(prepared,preparedRun,'.github/workflows/catalog-refresh-korea.yml','schedule','failure');
            check(producer?.id===producerJobId && producer.run_id===preparedRun
              && producer.run_attempt===preparedAttempt && producer.head_sha===sourceSha
              && producer.head_branch==='main' && producer.name==='refresh / prepare'
              && producer.workflow_name==='Catalog refresh korea','retry_producer_job_identity');
            check(producer.status==='completed' && producer.conclusion==='success','retry_producer_job_state');
            const criticalSteps=[
              [5,'Verify this completed snapshot and current CRM before restoration'],
              [6,'Restore paid listings and prepare their saved history and inspection'],
              [7,'Run actions/upload-artifact@v4'],
              [8,'Bind the prepared artifact to the successful producer attempt']
            ];
            for(const [number,name] of criticalSteps) {
              const steps=Array.isArray(producer.steps)?producer.steps.filter(step=>step.number===number):[];
              check(steps.length===1 && steps[0].name===name && steps[0].status==='completed'
                && steps[0].conclusion==='success','retry_producer_step_'+number);
            }
            check(producer.started_at==='2026-11-22T23:52:08Z'
              && producer.completed_at==='2026-11-23T00:12:18Z','retry_producer_job_time');
            check(artifact.id===artifactId && artifact.name==='catalog-intake-korea-45077320093-1'
              && artifact.expired===false && artifact.digest===artifactDigest
              && artifact.size_in_bytes===26217418
              && artifact.created_at==='2026-11-23T00:12:16Z' && artifact.updated_at===artifact.created_at
              && artifact.expires_at==='2026-11-26T00:12:12Z' && Date.parse(artifact.expires_at)>Date.now()
              && artifact.url===api+'/actions/artifacts/'+artifactId
              && artifact.archive_download_url===api+'/actions/artifacts/'+artifactId+'/zip'
              && artifact.workflow_run?.id===preparedRun
              && artifact.workflow_run.repository_id===repositoryId
              && artifact.workflow_run.head_repository_id===repositoryId
              && artifact.workflow_run.head_sha===sourceSha
              && artifact.workflow_run.head_branch==='main','retry_artifact_changed');
            check(health.ok===true && health.releaseSha===release,'retry_live_release_changed');
            check(health.calculationVersion===calculation,'retry_live_calculation_changed');
            check(catalog.ok===true && catalog.generationId===generation,'retry_live_generation_changed');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'verified=true\n');
            console.log(JSON.stringify({verified:true,approvedSourceSha:marker.approvedSourceSha,
              preparedRun,preparedAttempt,producerJobId,artifactId,release,calculation,generation,supplierRequests:0}));
          } catch(error) {
            console.error(error instanceof Error?error.message:'retry_verification_failed');
            process.exitCode=1;
          }
          VERIFY_PREPARED_ENCAR_RETRY
  publish:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.verified == 'true'
    uses: ./.github/workflows/catalog-market-refresh.yml
    with:
      market: korea
      prepared_encar_run: '45077320093'
      prepared_encar_self: false
      prepared_encar_source_sha: 'c90dea655470d2970f5f22cc7d7f98c086874738'
      prepared_encar_attempt: '1'
      prepared_encar_artifact_id: '14779553850'
      prepared_encar_artifact_digest: '9dafe4744cfaef0522f564978dc38152e28d52d55790fcd6a7d03a670a7d4aeb'
    secrets: inherit
  verify_public:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the published Morning and Seltos in the public site
        run: node scripts/verify-korea-public-characteristics.mjs | tee korea-public-characteristics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-public-characteristics-${{ github.run_id }}
          path: korea-public-characteristics.json
          if-no-files-found: error
          retention-days: 14
