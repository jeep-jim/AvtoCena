name: One-shot fix Encar non-cash price

on:
  push:
    branches:
      - fix/encar-noncash-price-contract-20260812
    paths:
      - .github/workflows/oneshot-fix-encar-noncash-price.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/encar-noncash-price-contract-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Encar rent/lease price guard
        run: |
          python - <<'PY'
          from pathlib import Path

          complete = Path('apps/web/lib/catalog/encar-complete-source.ts')
          text = complete.read_text()
          needle = 'import { normalizeVehicleOfferSpecs } from "./spec-normalization";\n'
          replacement = needle + 'import { encarNonCashContractReason } from "./encar-sale-contract";\n'
          if 'encarNonCashContractReason' not in text:
              assert needle in text
              text = text.replace(needle, replacement, 1)
          old = '''    const detail = await fetchDetail(String(offer.sourceOfferId || ""));\n    mergeDetail(offer, detail);\n'''
          new = '''    const detail = await fetchDetail(String(offer.sourceOfferId || ""));\n    const nonCashContractReason = encarNonCashContractReason(detail);\n    if (nonCashContractReason) {\n      offer.sourcePrice = null;\n      offer.sourceCurrency = null;\n      offer.totalRub = null;\n      offer.priceMode = "estimated";\n      offer.calculationStatus = "needs_data";\n      offer.operational = {\n        ...(offer.operational || {}),\n        raw: { offer: offer.operational?.raw, detail },\n        galleryVerified: false,\n        photoIdentityVerified: false,\n        nonCashContractRejected: true,\n        nonCashContractReason,\n      } as any;\n      return [];\n    }\n    mergeDetail(offer, detail);\n'''
          if 'nonCashContractRejected: true' not in text:
              assert old in text
              text = text.replace(old, new, 1)
          complete.write_text(text)

          quality = Path('apps/web/lib/catalog/offer-quality.ts')
          text = quality.read_text()
          needle = 'import { REQUIRED_CATALOG_SOURCES } from "./required-catalog-sources";\n'
          replacement = needle + 'import { isEncarNonCashContractOffer } from "./encar-sale-contract";\n'
          if 'isEncarNonCashContractOffer' not in text:
              assert needle in text
              text = text.replace(needle, replacement, 1)
          old = '''  const title = listingTitle(offer);\n  if (!meaningfulTitle(title)) return false;\n'''
          new = '''  const title = listingTitle(offer);\n  if (isEncarNonCashContractOffer(offer)) return false;\n  if (!meaningfulTitle(title)) return false;\n'''
          if 'if (isEncarNonCashContractOffer(offer)) return false;' not in text:
              assert old in text
              text = text.replace(old, new, 1)
          quality.write_text(text)
          PY
      - name: Regression test
        run: node --import tsx --test tests/encar-noncash-price.test.ts
      - name: Web typecheck
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Commit validated fix to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/catalog/encar-complete-source.ts apps/web/lib/catalog/offer-quality.ts
          git diff --cached --check
          git commit -m "fix(encar): reject rental and lease succession prices"
          git push origin HEAD:fix/encar-noncash-price-contract-20260812
