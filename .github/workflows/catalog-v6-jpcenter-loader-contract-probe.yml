name: Catalog V6 · JP Center loader contract probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/catalog-v6-jpcenter-loader-contract-probe.yml"
      - "scripts/jpcenter-loader-contract-probe.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-v6-jpcenter-loader-contract-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe current JP Center loader contract
        run: node scripts/jpcenter-loader-contract-probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: jpcenter-loader-contract-probe
          path: jpcenter-loader-contract-probe.json
          if-no-files-found: error
          retention-days: 3
      - name: Record probe run identity
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p scripts/probe-results
          printf 'run_id=%s\nhead_sha=%s\n' "$RUN_ID" "$HEAD_SHA" > scripts/probe-results/latest-jpcenter-loader-contract-probe-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/probe-results/latest-jpcenter-loader-contract-probe-run.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store JP Center loader probe run $RUN_ID"
          git push
