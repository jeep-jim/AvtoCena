name: One-shot canonical UAE Georgia age cleanup
run-name: Canonical age cleanup from validated UAE Georgia artifacts · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-republish-uae-georgia-age-cleanup-20260811.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-direct-recovery-uae
          path: recovery-input
          github-token: ${{ github.token }}
          repository: jeep-jim/AvtoCena
          run-id: 31449038529
      - uses: actions/download-artifact@v4
        with:
          name: catalog-direct-recovery-georgia
          path: recovery-input
          github-token: ${{ github.token }}
          repository: jeep-jim/AvtoCena
          run-id: 31449038529
      - name: Snapshot all seven before cleanup
        env:
          CATALOG_AUDIT_OUTPUT: catalog-age-cleanup-before.json
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Publish canonical UAE Georgia batch and preserve other markets through their own age gates
        env:
          RECOVERY_BATCH_MARKETS: uae,georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-age-cleanup-publish.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Audit all seven after cleanup
        env:
          CATALOG_AUDIT_OUTPUT: catalog-age-cleanup-after.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Assert market-specific age floors and global invariants
        run: |
          node - <<'NODE'
          const r=require('./catalog-age-cleanup-after.json');
          if((r.failures||[]).length) throw new Error(JSON.stringify(r.failures));
          for(const [market,s] of Object.entries(r.markets||{})) {
            const expected=market==='japan'?new Date().getFullYear()-15:2020;
            if(Number(s.marketMinYear)!==expected) throw new Error(`floor:${market}:${s.marketMinYear}:${expected}`);
            if(Number(s.belowMarketMinYearCount||0)!==0) throw new Error(`age:${market}:${s.belowMarketMinYearCount}`);
            if(Number(s.maxPerExactModel||0)>20) throw new Error(`modelcap:${market}:${s.maxPerExactModel}`);
            if(Number(s.nonVehicleCount||0)!==0) throw new Error(`nonvehicle:${market}:${s.nonVehicleCount}`);
            if(Number(s.nonPositiveSourcePriceCount||0)!==0) throw new Error(`price:${market}:${s.nonPositiveSourcePriceCount}`);
          }
          console.log(JSON.stringify(r.markets,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-age-cleanup-reports
          path: |
            catalog-age-cleanup-before.json
            catalog-age-cleanup-publish.json
            catalog-age-cleanup-after.json
          if-no-files-found: warn
          retention-days: 3
