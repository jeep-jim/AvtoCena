name: Catalog V3 · Korea · 10k
run-name: Catalog V3 · Korea · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

# Daily independent market refresh. Each successful run keeps recently seen
# offers and adds newly discovered unique offers.
permissions:
  contents: read

jobs:
  korea:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit
