name: Catalog V3 · Korea · 10k
run-name: Catalog V3 · Korea · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-korea.yml

# First independent 10k market rollout. Catalog does not depend on vehicle knowledge.
permissions:
  contents: read

jobs:
  korea:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit
