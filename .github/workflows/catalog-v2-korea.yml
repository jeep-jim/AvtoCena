name: Catalog V2 · Korea
run-name: Catalog V2 · Korea · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-korea.yml
      - .github/workflows/catalog-v2-market-reusable.yml

# Initial independent-market rollout starts with Korea.
# rollout-retry: 2026-08-03T09:48+07:00
permissions:
  contents: read

jobs:
  korea:
    uses: ./.github/workflows/catalog-v2-market-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit
