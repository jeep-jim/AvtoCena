name: Catalog V2 · Korea
run-name: Catalog V2 · Korea · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-korea.yml

# Independent daily market. 00:05 Asia/Novokuznetsk (UTC+7).
permissions:
  contents: read

jobs:
  korea:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit
