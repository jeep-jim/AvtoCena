name: Stop legacy Korea catalog run
run-name: Stop legacy Korea catalog run · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-korea.yml

permissions:
  contents: read

concurrency:
  group: catalog-v3-market-korea
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy Korea catalog run cancelled by concurrency replacement."
