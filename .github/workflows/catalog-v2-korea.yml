name: Catalog V2 · Korea
run-name: Catalog V2 · Korea · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-korea.yml
      - .github/workflows/catalog-v2-market-recovery-reusable.yml
      - scripts/catalog-clean-failed-generations.mjs

# rollout-recovery: 2026-08-04T03:29+07:00
permissions:
  contents: read

jobs:
  korea:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit
