name: Catalog V3 · Korea · 10k
run-name: Catalog V3 · Korea · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/korea"
  schedule:
    - cron: "17 6 * * *"

# Daily independent market refresh. Verified rows remain inside the configured
# 30-day window; expired and policy-rejected cards are removed.
permissions:
  contents: read

jobs:
  korea:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: korea
      display_name: Корея
      reset_cursor: ${{ github.event_name != 'schedule' }}
    secrets: inherit
