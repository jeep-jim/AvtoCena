name: Regcloud — measure production performance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-performance.json']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify running service without restart
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          ssh "${ssh_opts[@]}" root@151.248.113.177 'bash -s' <<'REMOTE'
          set -euo pipefail
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' avtocena-production)
          python3 - "$port" <<'PERF'
          import urllib.request,time,json,sys
          base='http://127.0.0.1:'+sys.argv[1]
          with urllib.request.urlopen(base+'/api/health',timeout=15) as r:print('HEALTH',r.read().decode(),flush=True)
          paths=['/api/catalog/search?market=korea&pageSize=24&sort=totalRub','/api/catalog/search?market=korea&pageSize=24&sort=totalRubDesc','/api/catalog/search?market=china&pageSize=24&sort=totalRub','/api/catalog/search?market=europe&pageSize=24&sort=totalRub','/api/catalog/search?market=korea&pageSize=24&budgetTo=3000000','/cars/offer/kia-k5-iii-benzin-2-0-prestige-2021--a877bac6f6ecedcd6101bca2','/cars/offer/kia-k5-iii-2-0-prestige-2023--c92ac81215cbc82107b7e6fb','/api/catalog/search?market=korea&pageSize=24&sort=totalRub']
          for path in paths:
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(base+path,timeout=60) as r:
                      body=r.read(); result={'path':path,'seconds':round(time.monotonic()-start,3),'status':r.status,'bytes':len(body),'timing':r.headers.get('Server-Timing')}
                      if path.startswith('/api/'):
                          value=json.loads(body);result.update(total=value.get('total'),items=len(value.get('items',[])),prices=[{'id':x['id'],'rub':x.get('totalRub'),'seller':x.get('sellerPriceRub'),'preview':(x.get('japanDeliveredPreview') or {}).get('totalRub')} for x in value.get('items',[])])
                      print('MEASURE',json.dumps(result),flush=True)
              except Exception as error:print('MEASURE',json.dumps({'path':path,'seconds':round(time.monotonic()-start,3),'error':str(error)}),flush=True)
          PERF
          docker logs --since 30m --tail 5000 avtocena-production 2>&1 | python3 -c 'import sys,json; rows=[]; errors=0
          for line in sys.stdin:
              if "catalog_storage_read " in line:
                  try: rows.append(json.loads(line.split("catalog_storage_read ",1)[1]))
                  except: pass
              if "heap out of memory" in line or "FATAL ERROR" in line: errors+=1
          print("SLOW_READS",json.dumps(sorted(rows,key=lambda x:x["ms"],reverse=True)[:45]));print("FATAL_COUNT",errors)'
          cat /opt/avtocena/metrics/resources.json
          docker inspect --format 'running={{.State.Running}} oomKilled={{.State.OOMKilled}} restarts={{.RestartCount}}' avtocena-production
          docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}}' avtocena-production
          REMOTE
