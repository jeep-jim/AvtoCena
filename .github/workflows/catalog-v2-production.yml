name: Catalog V2 · all markets disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Use independent market workflows
    runs-on: ubuntu-latest
    steps:
      - name: Explain rollout mode
        run: |
          echo "The combined seven-market production workflow is disabled."
          echo "Run Catalog V2 · Korea, Japan, China, UAE, Europe, Georgia or Kyrgyzstan independently."
          echo "Each successful market publication preserves every previously published market."
