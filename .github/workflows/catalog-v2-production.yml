name: Catalog V2 production
run-name: Catalog V2 · 7 markets · canonical sources · ${{ github.sha }}

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-production.yml
      - apps/web/lib/catalog/**
      - packages/engine/src/calculation/**
      - data/catalog/vehicle-knowledge/**
      - data/catalog/power-reference/**
      - scripts/catalog-sync-vehicle-models.mjs
      - scripts/catalog-enrich-drom-vehicle-variants.mjs
      - scripts/catalog-build-vehicle-variants.mjs
      - scripts/catalog-build-power-knowledge.mjs
      - scripts/catalog-audit-vehicle-knowledge.mjs
      - scripts/catalog-probe-source-shard.mjs
      - scripts/catalog-rebuild-source-shard.mjs
      - scripts/catalog-validate-source-scale.mjs
      - scripts/catalog-publish-source-scale.mjs

permissions:
  contents: read

concurrency:
  group: catalog-v2-production
  cancel-in-progress: false

env:
  CATALOG_V2_PRIORITY_TARGET: "1000"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "10"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "100000000"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "100000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "100000"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "100000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "100000"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "30"

jobs:
  validate:
    name: Validate Catalog V2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate V2 policy, sources, calculations and types
        run: |
          node --check scripts/catalog-enrich-drom-vehicle-variants.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-publish-source-scale.mjs
          node --import tsx --test tests/vehicle-knowledge.test.ts tests/catalog-v2-policy.test.ts tests/catalog-calculation-integrity.test.ts tests/russia-customs.test.ts tests/catalog-image-quality.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm --workspace=@avtocena/engine exec tsc -- --noEmit

  knowledge:
    name: Refresh and audit vehicle encyclopedia
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: catalog-v2-vehicle-knowledge
      cancel-in-progress: false
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_VEHICLE_KNOWLEDGE_MIN_MODELS: "6000"
      CATALOG_VEHICLE_KNOWLEDGE_MIN_RETAINED_RATIO: "0.90"
      VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: "1990"
      VEHICLE_KNOWLEDGE_RECENT_YEARS: "10"
      DROM_KNOWLEDGE_ONLY_RECENT: "1"
      DROM_KNOWLEDGE_LIMIT: "500"
      DROM_KNOWLEDGE_DELAY_MS: "900"
      CATALOG_VEHICLE_KNOWLEDGE_AUDIT_OUTPUT: catalog-v2-vehicle-knowledge-audit.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Object Storage credentials
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Refresh model encyclopedia
        run: timeout --signal=TERM --kill-after=60s 900s npx tsx scripts/catalog-sync-vehicle-models.mjs
      - name: Enrich recent model specifications
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=60s 2700s npx tsx scripts/catalog-enrich-drom-vehicle-variants.mjs
      - name: Accumulate model variants from verified listings
        run: timeout --signal=TERM --kill-after=60s 1200s npx tsx scripts/catalog-build-vehicle-variants.mjs
      - name: Accumulate power knowledge
        run: timeout --signal=TERM --kill-after=60s 1200s npx tsx scripts/catalog-build-power-knowledge.mjs
      - name: Audit encyclopedia
        run: timeout --signal=TERM --kill-after=60s 900s npx tsx scripts/catalog-audit-vehicle-knowledge.mjs
      - name: Upload encyclopedia audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-vehicle-knowledge-audit
          path: catalog-v2-vehicle-knowledge-audit.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  collect:
    name: Collect V2 ${{ matrix.market }} shard ${{ matrix.shard }}
    needs: [validate, knowledge]
    if: needs.validate.result == 'success' && needs.knowledge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        market: [korea, china, japan, uae, europe, georgia, kyrgyzstan]
        shard: [0, 1, 2, 3, 4]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "5"
      CATALOG_V2_SOURCE_SLOTS_ONLY: "1"
      CATALOG_REBUILD_IGNORE_PROBE: "1"
      CATALOG_REBUILD_RESET_CURSOR: "0"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "100000"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "1000000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "1000"
      CATALOG_REBUILD_MAX_SOURCE_ERRORS: "8"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "100000"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "30"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "8"
      CATALOG_REBUILD_TIME_LIMIT_MS: "6300000"
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_TIMEOUT_MS: "20000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "12"
      CATALOG_GALLERY_FAST_PATH: "false"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}.json
      CATALOG_PROBE_OUTPUT: catalog-v2-probe-${{ matrix.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Diagnose source routes without disabling live collection
        continue-on-error: true
        run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Collect every canonical source from fresh pages
        id: collect_step
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=120s 6600s npx tsx scripts/catalog-rebuild-source-shard.mjs
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ ! -s "$CATALOG_REBUILD_OUTPUT" ]; then
            export CATALOG_COLLECT_EXIT_CODE="$status"
            node <<'NODE'
          const fs = require('fs');
          const market = process.env.CATALOG_REBUILD_MARKET;
          const shardIndex = Number(process.env.CATALOG_REBUILD_SHARD_INDEX || 0);
          const shardCount = 5;
          fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT, JSON.stringify({
            version: 41, market, shardIndex, shardCount, generatedAt: new Date().toISOString(),
            count: 0, sourceIds: [], liveSourceIds: [], retentionSourceIds: [], partial: true,
            stopReason: `collector_exit_${process.env.CATALOG_COLLECT_EXIT_CODE || 1}`,
            report: { version: 41, market, shardIndex, shardCount, saved: 0, publicBySource: {},
              rejectionReasons: {}, sources: [], sourceErrors: [{ stage: 'catalog_v2_collector', error: `exit_${process.env.CATALOG_COLLECT_EXIT_CODE || 1}` }] },
            offers: [],
          }, null, 2));
          NODE
          fi
          exit 0
      - name: Upload V2 shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-${{ matrix.market }}-${{ matrix.shard }}
          path: |
            catalog-v2-probe-${{ matrix.market }}-${{ matrix.shard }}.json
            catalog-rebuild-${{ matrix.market }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

  publish:
    name: Atomically publish Catalog V2
    needs: [validate, knowledge, collect]
    if: always() && needs.validate.result == 'success' && needs.knowledge.result == 'success' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-v2-input
      CATALOG_REBUILD_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-v2-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-v2-publish-report.json
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "32"
      CATALOG_INDEX_WRITE_CONCURRENCY: "16"
      CATALOG_PUBLISH_MIN_PRODUCTIVE_SOURCES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all V2 shards
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-v2-*
          path: catalog-v2-input
          merge-multiple: true
      - name: Validate collected calculations and galleries
        continue-on-error: true
        run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish only a complete seven-market generation
        id: publish_step
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=120s 6600s npx tsx scripts/catalog-publish-source-scale.mjs
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Catalog V2 gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT, 'utf8'));
          const markets = ['korea','china','japan','uae','europe','georgia','kyrgyzstan'];
          const missing = markets.filter((market) => Number(report.byMarket?.[market] || 0) <= 0);
          const badFallback = markets.filter((market) => {
            const quality = report.marketQuality?.[market] || {};
            return quality.fallbackUnlocked === false && (Number(quality.recentCount || 0) > 0 || Number(quality.extendedCount || 0) > 0);
          });
          const state = {
            generationId: report.generationId || null,
            published: report.published === true,
            total: Number(report.total || 0),
            byMarket: report.byMarket || {},
            byMarketAndSource: report.byMarketAndSource || {},
            priority: Object.fromEntries(markets.map((market) => [market, report.marketQuality?.[market]?.priorityCount || 0])),
            shortageToTarget: Object.fromEntries(markets.map((market) => [market, report.marketQuality?.[market]?.shortage || 100000])),
            calculatedShare: Object.fromEntries(markets.map((market) => [market, report.marketQuality?.[market]?.calculatedShare ?? 0])),
            imageStats: Object.fromEntries(markets.map((market) => [market, {
              minimum: report.marketQuality?.[market]?.minimumImages || 0,
              maximum: report.marketQuality?.[market]?.maximumImages || 0,
              average: report.marketQuality?.[market]?.averageImages || 0,
            }])),
            missing,
            badFallback,
            publicationError: report.publicationError || '',
          };
          console.log(JSON.stringify(state, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Catalog V2 publication\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n`);
          if (!state.published || !state.generationId || state.total <= 0 || missing.length || badFallback.length) {
            console.error(`catalog_v2_gate_failed:${JSON.stringify(state)}`);
            process.exit(1);
          }
          NODE
      - name: Upload V2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-reports
          path: |
            catalog-v2-validation-report.json
            catalog-v2-publish-report.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  health:
    name: Catalog V2 health
    if: always()
    needs: [validate, knowledge, collect, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Require new V2 generation
        run: |
          echo "validate: ${{ needs.validate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "knowledge: ${{ needs.knowledge.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "collect: ${{ needs.collect.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.knowledge.result }}" = "success"
          test "${{ needs.publish.result }}" = "success"
