name: Catalog · apply certified 30-minute power
run-name: Certified power recalculation · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/lib/catalog/power-reference.ts"
      - "data/catalog/power-reference/30-minute-power.json"
      - "scripts/catalog-seed-certified-power-reference.mjs"
      - "scripts/catalog-apply-certified-power.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate exact variant matching before any write
        run: |
          node --check scripts/catalog-seed-certified-power-reference.mjs
          node --check scripts/catalog-apply-certified-power.mjs
          node --import tsx --test tests/catalog-certified-power-reference.test.ts
          npm run typecheck
      - name: Merge reviewed reference seed into object storage
        env:
          CATALOG_CERTIFIED_POWER_SEED: "1"
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/catalog-seed-certified-power-reference.mjs | tee catalog-certified-power-seed.log
      - name: Recalculate every exactly matched electrified card
        env:
          CATALOG_CERTIFIED_POWER_APPLY: "1"
          CATALOG_CERTIFIED_POWER_WRITE_REPORT: "1"
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/catalog-apply-certified-power.mjs | tee catalog-certified-power-apply.log
      - name: Rebuild the prioritized queue for variants still missing a document
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/catalog-build-certified-power-queue.mjs | tee catalog-certified-power-queue.log
      - name: Audit all seven markets and age limits after recalculation
        env:
          CATALOG_AUDIT_OUTPUT: catalog-certified-power-postpersist-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-certified-power-apply-report
          path: |
            catalog-certified-power-seed.log
            catalog-certified-power-apply.log
            catalog-certified-power-queue.log
            catalog-certified-power-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 7
