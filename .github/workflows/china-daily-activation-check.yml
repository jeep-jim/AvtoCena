name: Verify independent China daily schedule (no release)
on:
  push:
    branches: ['feat/china-independent-daily-20261125']
    paths:
      - '.github/workflows/china-daily-activation-check.yml'
      - '.github/workflows/catalog-next-china-daily.yml'
      - 'scripts/catalog-next/daily-entry.mjs'
      - 'tests/catalog-next-daily-entry.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-daily-activation-branch
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/feat/china-independent-daily-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove daily schedule identity, no Docker build and market-only CAS
        run: |
          node --check scripts/catalog-next/daily-entry.mjs
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-next-daily-entry.test.mjs tests/catalog-next-daily-controller.test.mjs tests/catalog-next-daily-release.test.mjs tests/catalog-next-market-policy.test.mjs
