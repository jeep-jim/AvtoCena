name: Ops · Europe post-HQ model quota audit 20260814

on:
  push:
    branches:
      - ops/europe-post-hq-model-audit-20260814
    paths:
      - ".github/workflows/ops-europe-post-hq-model-audit-20260814.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit current production without writes
        shell: bash
        run: |
          cat > /tmp/europe-post-hq-audit.ts <<'TS'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { getJsonStorage } from "./apps/web/lib/data";
          import { readMarketOffers } from "./apps/web/lib/catalog/storage";
          import { canonicalSourceModelIdentity } from "./apps/web/lib/catalog/open-source-normalizer";
          import { catalogModelYearQuotaKey, CATALOG_MAX_OFFERS_PER_MODEL_YEAR } from "./apps/web/lib/catalog/inventory-quota";
          import { PUBLIC_CATALOG_MARKETS } from "./apps/web/lib/catalog/runtime-config";

          const storage = getJsonStorage();
          const SOURCE = "autoscout_europe_open";
          const sha = (v: unknown) => crypto.createHash("sha256").update(JSON.stringify(v)).digest("hex");
          const clean = (v: unknown) => String(v || "").replace(/\s+/g, " ").trim();
          const genericMercedes = (v: unknown) => /^(?:benz|mercedes|mercedes[-\s]?benz)$/i.test(clean(v));
          const isMercedes = (v: unknown) => /mercedes|benz/i.test(clean(v));
          const imageUrls = (o: any) => (Array.isArray(o?.images) ? o.images : []).map((i: any) => clean(i?.url)).filter(Boolean);
          const unique = (a: string[]) => [...new Set(a)];
          function title(o: any) {
            const raw = o?.operational?.raw || {};
            return clean(o?.sourceTitle || raw?.originalCatalogTitle || raw?.title || raw?.name || o?.trim || "");
          }
          function exactHqImage(o: any, image: any) {
            const id = clean(o?.sourceOfferId).toLowerCase();
            const url = clean(image?.url);
            if (!id || !url || /\/250x188(?:\.|\/|\?|$)/i.test(url)) return false;
            let parsed: URL;
            try { parsed = new URL(url); } catch { return false; }
            if (parsed.hostname.toLowerCase() !== "prod.pictures.autoscout24.net") return false;
            if (!parsed.pathname.toLowerCase().startsWith(`/listing-images/${id}_`)) return false;
            const m = parsed.pathname.match(/\/(\d{2,5})x(\d{2,5})\.(?:jpe?g|webp|avif|png)$/i);
            const width = Number(image?.width || m?.[1] || 0), height = Number(image?.height || m?.[2] || 0);
            return width >= 900 && height >= 600;
          }
          function freshness(o: any) { return Date.parse(clean(o?.operational?.sourcePublishedAt || o?.updatedAt || o?.firstSeenAt)) || 0; }
          function quality(a: any, b: any) {
            const ap = Number(a?.totalRub || 0) > 0 && Number(a.totalRub) <= 8_000_000 ? 0 : 1;
            const bp = Number(b?.totalRub || 0) > 0 && Number(b.totalRub) <= 8_000_000 ? 0 : 1;
            return ap - bp || Number(b?.year || 0) - Number(a?.year || 0) || freshness(b) - freshness(a)
              || Number(b?.images?.length || 0) - Number(a?.images?.length || 0)
              || Number(a?.totalRub || Number.MAX_SAFE_INTEGER) - Number(b?.totalRub || Number.MAX_SAFE_INTEGER)
              || clean(a?.id).localeCompare(clean(b?.id));
          }
          const manifestStart: any = await storage.readJson("catalog/manifest.json", null);
          if (!manifestStart?.generationId) throw new Error("manifest_missing");
          const lock: any = await storage.readJson("catalog/import-lock.json", {});
          const lockActive = Date.parse(clean(lock?.lockedUntil)) > Date.now();
          if (lockActive) throw new Error(`catalog_writer_lock_active:${lock?.operationType || "unknown"}:${lock?.lockedUntil}`);
          const rowsByMarket = new Map<string, any[]>();
          const markets: Record<string, any> = {};
          for (const market of PUBLIC_CATALOG_MARKETS) {
            const rows = await readMarketOffers(market);
            rowsByMarket.set(market, rows);
            markets[market] = { count: rows.length, manifestCount: Number(manifestStart?.markets?.[market]?.count || 0), hash: sha(rows) };
            if (rows.length !== markets[market].manifestCount) throw new Error(`manifest_count_mismatch:${market}`);
          }
          const europe = rowsByMarket.get("europe") || [];
          const autoscout = europe.filter((o) => clean(o?.sourceId) === SOURCE);
          const currentBelow2020 = europe.filter((o) => Number(o?.year || 0) < 2020);
          const current250 = autoscout.filter((o) => imageUrls(o).some((u) => /\/250x188(?:\.|\/|\?|$)/i.test(u)));
          const currentBelow5 = autoscout.filter((o) => unique(imageUrls(o)).length < 5);
          const currentInvalidHq = autoscout.filter((o) => {
            const images = Array.isArray(o?.images) ? o.images : [];
            return images.length < 5 || unique(imageUrls(o)).length !== images.length || !images.every((i: any) => exactHqImage(o, i));
          });
          const currentCounts = new Map<string, number>();
          for (const o of europe) {
            const key = catalogModelYearQuotaKey(o, "europe");
            if (key) currentCounts.set(key, Number(currentCounts.get(key) || 0) + 1);
          }
          const currentQuota = [...currentCounts.entries()].filter(([,n]) => n > CATALOG_MAX_OFFERS_PER_MODEL_YEAR).sort((a,b) => b[1]-a[1]);

          const corrections: any[] = [];
          const corrected = europe.map((o) => {
            const t = title(o), before = clean(o?.model);
            if (!t) return o;
            const after = canonicalSourceModelIdentity(t, clean(o?.make), before);
            if (!after || after === before) return o;
            corrections.push({ id:o.id, sourceId:o.sourceId, sourceOfferId:o.sourceOfferId, title:t, make:o.make, year:o.year, before, after });
            return { ...o, model: after };
          });
          const sorted = [...corrected].sort(quality);
          const selected: any[] = [], removedByQuota: any[] = [], counts = new Map<string, number>();
          for (const o of sorted) {
            const key = catalogModelYearQuotaKey(o, "europe");
            if (!key) continue;
            const n = Number(counts.get(key) || 0);
            if (n >= CATALOG_MAX_OFFERS_PER_MODEL_YEAR) { removedByQuota.push({ id:o.id, sourceId:o.sourceId, sourceOfferId:o.sourceOfferId, make:o.make, model:o.model, year:o.year, key }); continue; }
            counts.set(key, n + 1); selected.push(o);
          }
          const maxSelected = counts.size ? Math.max(...counts.values()) : 0;
          const malformedAfter = selected.filter((o) => {
            if (!isMercedes(o?.make) || !genericMercedes(o?.model)) return false;
            const t = title(o); if (!t) return false;
            const r = canonicalSourceModelIdentity(t, clean(o?.make), clean(o?.model));
            return r && r !== clean(o?.model) && !genericMercedes(r);
          });
          const unresolvedGeneric = selected.filter((o) => isMercedes(o?.make) && genericMercedes(o?.model));
          const manifestEnd: any = await storage.readJson("catalog/manifest.json", null);
          const generationStable = clean(manifestEnd?.generationId) === clean(manifestStart.generationId);
          const report = {
            version:1, checkedAt:new Date().toISOString(), baselineGenerationId:manifestStart.generationId, endingGenerationId:manifestEnd?.generationId,
            markets,
            current:{ europe:europe.length, autoscout:autoscout.length, autoscout250:current250.length, autoscoutBelow5:currentBelow5.length, autoscoutInvalidHq:currentInvalidHq.length, europeBelow2020:currentBelow2020.length, maxModelYear:currentCounts.size?Math.max(...currentCounts.values()):0, quotaViolations:currentQuota.map(([key,count])=>({key,count})) },
            candidate:{ europe:selected.length, corrections:corrections.length, removedByQuota:removedByQuota.length, maxModelYear:maxSelected, provableMalformedMercedes:malformedAfter.length, unresolvedGenericMercedes:unresolvedGeneric.length },
            corrections, removedByQuota,
            unresolvedGenericMercedesSamples:unresolvedGeneric.slice(0,50).map((o)=>({id:o.id,sourceId:o.sourceId,sourceOfferId:o.sourceOfferId,title:title(o),make:o.make,model:o.model,year:o.year})),
            gates:{ generationStable, autoscoutExactHq:currentInvalidHq.length===0, noAutoscout250:current250.length===0, autoscoutFivePlus:currentBelow5.length===0, europe2020Plus:currentBelow2020.length===0, candidateQuota:maxSelected<=CATALOG_MAX_OFFERS_PER_MODEL_YEAR, noProvableMalformedMercedes:malformedAfter.length===0, sixOtherManifestExact:PUBLIC_CATALOG_MARKETS.filter((m)=>m!=="europe").every((m)=>markets[m].count===markets[m].manifestCount) }
          };
          fs.writeFileSync("europe-post-hq-model-audit.json", JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if (!Object.values(report.gates).every(Boolean)) throw new Error(`post_hq_audit_gate_failed:${JSON.stringify(report.gates)}`);
          TS
          npx tsx /tmp/europe-post-hq-audit.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-post-hq-model-audit
          path: europe-post-hq-model-audit.json
          if-no-files-found: warn
          retention-days: 3
