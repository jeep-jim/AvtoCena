name: Apply Georgia AutoPapa small shards 20260815

on:
  push:
    branches:
      - fix/georgia-autopapa-small-shards-20260815
    paths:
      - .github/workflows/apply-georgia-autopapa-small-shards-20260815.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georgia-autopapa-small-shards-20260815
      - name: Split MyAuto and AutoPapa recovery shard sizing
        run: |
          python3 <<'PY'
          from pathlib import Path

          wf = Path('.github/workflows/catalog-live-recovery-georgia-yandex.yml')
          s = wf.read_text()
          s = s.replace('  GEORGIA_YANDEX_PAGES_PER_SHARD: "20"\n', '  GEORGIA_YANDEX_MYAUTO_PAGES_PER_SHARD: "20"\n  GEORGIA_YANDEX_AUTOPAPA_PAGES_PER_SHARD: "5"\n')
          start = s.index('\n  collect:\n')
          end = s.index('\n  merge:\n', start)
          autopapa_starts = ', '.join(str(n) for n in range(1, 301, 5))
          replacement = f'''
  collect-myauto:
    needs: strict-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        startPage: [1, 21, 41, 61, 81, 101, 121, 141, 161, 181, 201, 221, 241, 261, 281]
    steps:
      - name: Fetch a canonical MyAuto listing-bound shard through Yandex runtime
        shell: bash
        run: |
          set -euo pipefail
          output="snapshot-myauto-${{{{ matrix.startPage }}}}.json"
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 -fsS \\
            "${{GEORGIA_YANDEX_ROUTE}}?source=myauto&pages=${{GEORGIA_YANDEX_MYAUTO_PAGES_PER_SHARD}}&startPage=${{{{ matrix.startPage }}}}" \\
            -o "$output"
          node - "$output" "myauto" "${{{{ matrix.startPage }}}}" "${{GEORGIA_YANDEX_MYAUTO_PAGES_PER_SHARD}}" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSource, expectedStart, expectedPages] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (doc.market !== 'georgia' || !Array.isArray(doc.offers)) throw new Error('georgia_yandex_bad_snapshot');
          if (String(doc.report?.source || '') !== expectedSource) throw new Error(`georgia_yandex_source_mismatch:${{doc.report?.source}}:${{expectedSource}}`);
          if (Number(doc.report?.startPage || 0) !== Number(expectedStart)) throw new Error(`georgia_yandex_start_mismatch:${{doc.report?.startPage}}:${{expectedStart}}`);
          if (Number(doc.report?.pagesPerSource || 0) !== Number(expectedPages)) throw new Error(`georgia_yandex_page_span_mismatch:${{doc.report?.pagesPerSource}}:${{expectedPages}}`);
          console.log({{ source: expectedSource, startPage: Number(expectedStart), pages: Number(expectedPages), count: doc.offers.length, imageStats: doc.report?.imageStats, rejected: doc.report?.rejected }});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: georgia-yandex-shard-myauto-${{{{ matrix.startPage }}}}
          path: snapshot-myauto-${{{{ matrix.startPage }}}}.json
          retention-days: 3

  collect-autopapa:
    needs: strict-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        startPage: [{autopapa_starts}]
    steps:
      - name: Fetch a canonical AutoPapa listing-bound shard through Yandex runtime
        shell: bash
        run: |
          set -euo pipefail
          output="snapshot-autopapa-${{{{ matrix.startPage }}}}.json"
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 -fsS \\
            "${{GEORGIA_YANDEX_ROUTE}}?source=autopapa&pages=${{GEORGIA_YANDEX_AUTOPAPA_PAGES_PER_SHARD}}&startPage=${{{{ matrix.startPage }}}}" \\
            -o "$output"
          node - "$output" "autopapa" "${{{{ matrix.startPage }}}}" "${{GEORGIA_YANDEX_AUTOPAPA_PAGES_PER_SHARD}}" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSource, expectedStart, expectedPages] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (doc.market !== 'georgia' || !Array.isArray(doc.offers)) throw new Error('georgia_yandex_bad_snapshot');
          if (String(doc.report?.source || '') !== expectedSource) throw new Error(`georgia_yandex_source_mismatch:${{doc.report?.source}}:${{expectedSource}}`);
          if (Number(doc.report?.startPage || 0) !== Number(expectedStart)) throw new Error(`georgia_yandex_start_mismatch:${{doc.report?.startPage}}:${{expectedStart}}`);
          if (Number(doc.report?.pagesPerSource || 0) !== Number(expectedPages)) throw new Error(`georgia_yandex_page_span_mismatch:${{doc.report?.pagesPerSource}}:${{expectedPages}}`);
          console.log({{ source: expectedSource, startPage: Number(expectedStart), pages: Number(expectedPages), count: doc.offers.length, imageStats: doc.report?.imageStats, rejected: doc.report?.rejected }});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: georgia-yandex-shard-autopapa-${{{{ matrix.startPage }}}}
          path: snapshot-autopapa-${{{{ matrix.startPage }}}}.json
          retention-days: 3
'''
          s = s[:start] + '\n' + replacement.rstrip() + s[end:]
          s = s.replace('  merge:\n    needs: collect\n', '  merge:\n    needs: [collect-myauto, collect-autopapa]\n')
          wf.write_text(s)

          test = Path('tests/catalog-georgia-yandex-recovery-workflow.test.ts')
          t = test.read_text()
          t = t.replace('  assert.match(workflow, /GEORGIA_YANDEX_PAGES_PER_SHARD: "20"/);\n', '  assert.match(workflow, /GEORGIA_YANDEX_MYAUTO_PAGES_PER_SHARD: "20"/);\n  assert.match(workflow, /GEORGIA_YANDEX_AUTOPAPA_PAGES_PER_SHARD: "5"/);\n')
          t = t.replace('  assert.match(workflow, /source: \\[myauto, autopapa\\]/);\n', '')
          t = t.replace('  const collectStart = workflow.indexOf("\\n  collect:\\n");\n', '  const collectStart = workflow.indexOf("\\n  collect-myauto:\\n");\n')
          t = t.replace('  assert.match(collect, /\\$\\{GEORGIA_YANDEX_ROUTE\\}\\?source=\\$\\{\\{ matrix\\.source \\}\\}&pages=\\$\\{GEORGIA_YANDEX_PAGES_PER_SHARD\\}&startPage=\\$\\{\\{ matrix\\.startPage \\}\\}/);\n', '  assert.match(collect, /source=myauto&pages=\\$\\{GEORGIA_YANDEX_MYAUTO_PAGES_PER_SHARD\\}/);\n  assert.match(collect, /source=autopapa&pages=\\$\\{GEORGIA_YANDEX_AUTOPAPA_PAGES_PER_SHARD\\}/);\n  assert.match(collect, /startPage: \\[1, 6, 11, 16/);\n  assert.match(collect, /281, 286, 291, 296\\]/);\n')
          test.write_text(t)
          PY
      - name: Validate targeted Georgia recovery tests
        run: |
          npm ci
          node --import tsx --test tests/catalog-georgia-yandex-recovery-workflow.test.ts
          git diff --check
      - name: Commit source-specific shard sizing
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/catalog-live-recovery-georgia-yandex.yml tests/catalog-georgia-yandex-recovery-workflow.test.ts
          git commit -m 'Bound AutoPapa Yandex recovery shards below runtime timeout'
          git push origin HEAD:fix/georgia-autopapa-small-shards-20260815
