name: Catalog strict · Encar exact source-only smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex-strict-catalog-source-only
    paths:
      - ".github/workflows/catalog-strict-encar-smoke.yml"

permissions:
  contents: read

concurrency:
  group: catalog-strict-encar-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_STRICT_MARKET: korea
      CATALOG_STRICT_SOURCE_ID: encar_direct
      CATALOG_STRICT_TARGET: "10"
      CATALOG_STRICT_MAX_PAGES: "8"
      CATALOG_STRICT_OUTPUT: catalog-strict-encar-10.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_KNOWLEDGE_DISABLED: "1"
      CATALOG_ENCAR_DIRECT_LIST_RETRIES: "5"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      ENCAR_SHAPE_OUTPUT: encar-exact-detail-shape.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck strict catalog changes
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Inspect exact Encar detail field paths
        continue-on-error: true
        run: npx tsx scripts/encar-exact-detail-shape.mjs
      - name: Verify 10 exact Encar cards and source-only RUB calculations
        run: npx tsx scripts/catalog-strict-source-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-strict-encar-10
          path: |
            catalog-strict-encar-10.json
            encar-exact-detail-shape.json
          if-no-files-found: warn
          retention-days: 3
