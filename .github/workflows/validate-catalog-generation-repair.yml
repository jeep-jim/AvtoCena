name: Validate catalog generation repair no-publish

on:
  push:
    branches: [fix/catalog-generation-repair-20260811]
    paths:
      - scripts/catalog-generation-repair.mjs
      - .github/workflows/validate-catalog-generation-repair.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REPAIR_SOURCE_GENERATION: gen_1786426826475_e390aa80
      CATALOG_REPAIR_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check scripts/catalog-generation-repair.mjs
      - name: Dry-run exact previous generation through current canonical gates
        run: npx tsx scripts/catalog-generation-repair.mjs | tee catalog-generation-repair-dry.json
      - name: Assert repair restores material inventory without weakening quality
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('catalog-generation-repair-dry.json','utf8');
          const start=text.indexOf('{');
          if(start<0) throw new Error('repair report missing');
          const r=JSON.parse(text.slice(start));
          const floors={korea:2200,china:6000,japan:500,uae:190,europe:4500,georgia:30,kyrgyzstan:1900};
          for(const [market,floor] of Object.entries(floors)){
            const m=r.markets?.[market];
            if(!m || Number(m.canonical||0)<floor) throw new Error(`${market}:canonical_too_low:${m?.canonical}:${floor}`);
            if(Number(m.maxPerExactModel||0)>20) throw new Error(`${market}:model_cap:${m.maxPerExactModel}`);
          }
          if(r.dryRun!==true) throw new Error('validation unexpectedly not dry-run');
          console.log(JSON.stringify(r.markets,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-generation-repair-dry-report
          path: catalog-generation-repair-dry.json
          if-no-files-found: warn
          retention-days: 2
