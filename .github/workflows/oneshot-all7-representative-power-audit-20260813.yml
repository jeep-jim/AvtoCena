name: One-shot all7 representative power audit read-only
run-name: All7 representative power audit · ${{ github.sha }}

on:
  push:
    branches:
      - audit/georgia-vehicle-knowledge-coverage-20260813
    paths:
      - .github/workflows/oneshot-all7-representative-power-audit-20260813.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit current public generation for model-representative power
        run: |
          node --import tsx --input-type=module <<'NODE'
          const module = await import('./apps/web/lib/catalog/storage.ts');
          const storage = module.default || module;
          const all = await storage.readAllOffersForMaintenance();
          const markets=['japan','china','korea','uae','europe','georgia','kyrgyzstan'];
          const summary={};
          for (const market of markets) {
            const rows=all.filter(o=>o.market===market);
            const representative=rows.filter(o=>String(o.powerDataSource||'').startsWith('vehicle-model-representative:'));
            const calculated=representative.filter(o=>['ready','estimated','auction_start'].includes(String(o.calculationStatus||'')) && Number(o.totalRub||0)>0);
            summary[market]={total:rows.length,representative:representative.length,calculated:calculated.length};
            for (const o of calculated.slice(0,25)) console.log('EXAMPLE',JSON.stringify({market,id:o.sourceOfferId,make:o.make,model:o.model,year:o.year,engineCc:o.engineCc,fuel:o.fuel,powerHp:o.powerHp,status:o.calculationStatus,totalRub:o.totalRub,powerDataSource:o.powerDataSource}));
          }
          console.log('SUMMARY',JSON.stringify(summary));
          NODE
