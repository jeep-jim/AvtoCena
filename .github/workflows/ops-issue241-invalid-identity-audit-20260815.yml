name: Ops · Issue241 invalid identity evidence 20260815

on:
  push:
    branches:
      - ops/issue241-invalid-identity-audit-20260815
    paths:
      - ".github/workflows/ops-issue241-invalid-identity-audit-20260815.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export exact invalid identity evidence
        run: npx tsx scripts/issue241-invalid-identity-evidence.mjs
      - name: Validate deterministic migration plan without writes
        run: npx tsx scripts/issue241-invalid-identity-migration-plan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-invalid-identity-audit
          path: |
            issue241-invalid-identity-evidence.json
            issue241-invalid-identity-migration-plan.json
          if-no-files-found: error
          retention-days: 2
