name: Knowledge CORE source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - fix/catalog-core-recovery-20260822
    paths:
      - scripts/catalog-download-knowledge-source-snapshot.mjs
      - scripts/catalog-download-korea-jeju-registry.mjs
      - scripts/catalog-download-western-knowledge-sources.mjs
      - scripts/catalog-download-vehiclesdb-csv.mjs
      - scripts/catalog-build-knowledge-denominator.mjs
      - scripts/catalog-extend-knowledge-denominator-west.mjs
      - data/catalog/knowledge-source-snapshots/SOURCES.json
      - .github/workflows/knowledge-source-snapshot.yml

permissions:
  contents: write

concurrency:
  group: knowledge-core-source-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: snapshot / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: [vehiclesdb, eea, miit, mlit, korea, western]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-core-recovery-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Snapshot public source
        if: matrix.source != 'western'
        env:
          KNOWLEDGE_SOURCE: ${{ matrix.source }}
          KNOWLEDGE_OUTPUT_ROOT: knowledge-output
          KNOWLEDGE_MAX_TEXT_BYTES: "25000000"
          KNOWLEDGE_FETCH_TIMEOUT_MS: "60000"
          KNOWLEDGE_EEA_PAGE_SIZE: "5000"
          KNOWLEDGE_EEA_MAX_PAGES_PER_YEAR: "250"
          KNOWLEDGE_MIIT_FIRST_BATCH: "328"
          KNOWLEDGE_MIIT_LAST_BATCH: "410"
          KNOWLEDGE_MLIT_MAX_PAGES: "150"
        run: node scripts/catalog-download-knowledge-source-snapshot.mjs
      - name: Download and compact Korean public registry
        if: matrix.source == 'korea'
        env:
          KNOWLEDGE_OUTPUT_ROOT: knowledge-output
          KNOWLEDGE_KOREA_MAX_BYTES: "100000000"
        run: node scripts/catalog-download-korea-jeju-registry.mjs
      - name: Snapshot US and Canada government sources
        if: matrix.source == 'western'
        env:
          KNOWLEDGE_OUTPUT_ROOT: knowledge-output
          KNOWLEDGE_WEST_MAX_BYTES: "60000000"
          KNOWLEDGE_WEST_TIMEOUT_MS: "90000"
        run: node scripts/catalog-download-western-knowledge-sources.mjs
      - name: Snapshot VehiclesDB bulk CSV
        if: matrix.source == 'vehiclesdb'
        env:
          KNOWLEDGE_OUTPUT_ROOT: knowledge-output
          KNOWLEDGE_VEHICLESDB_MAX_BYTES: "50000000"
        shell: bash
        run: |
          set +e
          node scripts/catalog-download-vehiclesdb-csv.mjs
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "VehiclesDB CSV snapshot failed; catalog JSON snapshot remains available for diagnostics."
          fi
          exit 0
      - name: Show source manifest
        if: always()
        shell: bash
        run: |
          find knowledge-output -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | head -250 || true
          if [ "${{ matrix.source }}" = "western" ]; then
            cat knowledge-output/us/snapshot-manifest.json || true
            cat knowledge-output/canada/snapshot-manifest.json || true
          else
            cat "knowledge-output/${{ matrix.source }}/snapshot-manifest.json" || true
          fi
          if [ "${{ matrix.source }}" = "korea" ]; then cat knowledge-output/korea/jeju-registry-manifest.json || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-source-${{ matrix.source }}
          path: knowledge-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  assemble:
    name: assemble denominator
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-core-recovery-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: knowledge-source-*
          path: assembled
          merge-multiple: true
      - name: Install raw snapshot set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/catalog/knowledge-source-snapshots/generated
          mkdir -p data/catalog/knowledge-source-snapshots/generated
          cp -a assembled/. data/catalog/knowledge-source-snapshots/generated/
          find data/catalog/knowledge-source-snapshots/generated -type f -printf '%p %s bytes\n' | sort | head -350
      - name: Build source-evidence denominator
        env:
          KNOWLEDGE_SNAPSHOT_ROOT: data/catalog/knowledge-source-snapshots/generated
          KNOWLEDGE_DENOMINATOR_ROOT: data/catalog/knowledge-source-snapshots/denominator
        run: |
          node scripts/catalog-build-knowledge-denominator.mjs
          node scripts/catalog-extend-knowledge-denominator-west.mjs
      - name: Build global snapshot manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root='data/catalog/knowledge-source-snapshots/generated';
          const sources=['vehiclesdb','eea','miit','mlit','korea','us','canada'];
          const manifests=sources.map(source=>{
            const file=path.join(root,source,'snapshot-manifest.json');
            try{return {source,...JSON.parse(fs.readFileSync(file,'utf8'))}}catch(error){return {source,status:'missing',errors:[{error:String(error.message||error)}]}}
          });
          const walk=(dir,out=[])=>{if(!fs.existsSync(dir))return out;for(const name of fs.readdirSync(dir)){const full=path.join(dir,name);const stat=fs.statSync(full);if(stat.isDirectory())walk(full,out);else out.push({path:full.replaceAll('\\','/'),bytes:stat.size})}return out};
          const files=walk(root);
          const payload={schemaVersion:1,builtAt:new Date().toISOString(),status:manifests.some(x=>x.status==='failed'||x.status==='missing')?'partial':manifests.some(x=>x.status==='partial')?'partial':'complete_snapshot_set',sources:manifests.map(x=>({source:x.source,status:x.status,fetchedAt:x.fetchedAt||null,counts:x.counts||{},errors:x.errors||[]})),files:files.length,totalBytes:files.reduce((n,x)=>n+x.bytes,0),contentDigest:crypto.createHash('sha256').update(JSON.stringify(files)).digest('hex')};
          fs.writeFileSync(path.join(root,'snapshot-manifest.json'),JSON.stringify(payload,null,2)+'\n');
          console.log(JSON.stringify(payload,null,2));
          NODE
      - name: Validate source corpus
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/catalog-download-knowledge-source-snapshot.mjs
          node --check scripts/catalog-download-korea-jeju-registry.mjs
          node --check scripts/catalog-download-western-knowledge-sources.mjs
          node --check scripts/catalog-download-vehiclesdb-csv.mjs
          node --check scripts/catalog-build-knowledge-denominator.mjs
          node --check scripts/catalog-extend-knowledge-denominator-west.mjs
          test -s data/catalog/knowledge-source-snapshots/denominator/coverage-report.json
          test -s data/catalog/knowledge-source-snapshots/denominator/western-coverage-report.json
          test -s data/catalog/knowledge-source-snapshots/generated/korea/jeju-registry-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/knowledge-source-snapshots/denominator/coverage-report.json','utf8'));
          const w=JSON.parse(fs.readFileSync('data/catalog/knowledge-source-snapshots/denominator/western-coverage-report.json','utf8'));
          const k=JSON.parse(fs.readFileSync('data/catalog/knowledge-source-snapshots/generated/korea/jeju-registry-manifest.json','utf8'));
          console.log(JSON.stringify({global:r,western:w,korea:k},null,2));
          if(Number(r.counts?.sourceBrands||0)<200) throw new Error('knowledge_denominator_brand_collapse');
          if(Number(r.counts?.sourceModels||0)<1500) throw new Error('knowledge_denominator_model_collapse');
          if(Number(w.counts?.sourceModels||0)<500) throw new Error('western_denominator_model_collapse');
          if(Number(k.counts?.rowsParsed||0)<100000) throw new Error('korea_registry_row_collapse');
          NODE
      - name: Commit raw snapshots and denominator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/catalog-core-recovery-20260822
          git rebase origin/fix/catalog-core-recovery-20260822
          git add data/catalog/knowledge-source-snapshots/generated data/catalog/knowledge-source-snapshots/denominator
          if git diff --cached --quiet; then
            echo "Knowledge source corpus is unchanged."
            exit 0
          fi
          git commit -m "Snapshot bulk vehicle knowledge sources"
          git push origin HEAD:fix/catalog-core-recovery-20260822
