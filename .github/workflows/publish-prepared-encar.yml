name: Publish completed paid Encar intake
on:
  workflow_run:
    workflows: ['Prepare completed Encar snapshot for Korea publication']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-korea
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/catalog-market-refresh.yml
    with:
      market: korea
      prepared_encar_run: ${{ format('{0}', github.event.workflow_run.id) }}
    secrets: inherit
