name: Catalog photo diagnostic — manual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/catalog-photo-diagnostic.json']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/photo-diagnostic --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Inspect four public photos on the exact published release
        run: |
          set -euo pipefail
          export EXPECTED_RELEASE=$(node -p 'require("./.github/market-runs/catalog-photo-diagnostic.json").release')
          export PLAYWRIGHT_MODULE=/tmp/photo-diagnostic/node_modules/playwright/index.mjs
          export CHROME_BIN=$(command -v google-chrome)
          node scripts/catalog-photo-diagnostic.mjs
