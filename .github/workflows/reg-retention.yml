name: REG bounded catalog retention
on:
  workflow_dispatch:
  push:
    branches: [main, fix/reg-retention-safe-20261107]
    paths:
      - scripts/reg-clean-catalog.mjs
      - scripts/lib/reg-retention-plan.mjs
      - scripts/lib/reg-complete-inventory.mjs
      - tests/reg-retention-plan.test.mjs
      - tests/reg-complete-inventory.test.mjs
      - .github/workflows/reg-retention.yml
      - .github/market-runs/reg-retention.json
permissions:
  contents: read
concurrency:
  group: catalog-object-storage-cleanup
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1}
      - run: npm ci --ignore-scripts
      - run: node --test tests/reg-retention-plan.test.mjs tests/reg-complete-inventory.test.mjs tests/catalog-storage-budget.test.mjs
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-internal-cleanup.test.ts tests/catalog-storage-maintenance.test.ts tests/storage.test.ts
      - run: node --check scripts/reg-clean-catalog.mjs
  execute:
    needs: safety
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1}
      - run: npm ci --ignore-scripts
      - name: Plan or apply only explicitly reviewed immutable keys
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_MAX_ATTEMPTS: '2'
          NODE_OPTIONS: --max-old-space-size=4096
        run: node --import tsx scripts/reg-clean-catalog.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reg-retention-report
          path: reg-retention-report
          retention-days: 14
