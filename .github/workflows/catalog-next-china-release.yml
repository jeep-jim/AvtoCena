name: China independent release - exact local generation
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/catalog-next-china-release.json']
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Exact reviewed main controller commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  release:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: regcloud-staging
    env:
      EXPECTED_CONTROLLER_SHA: ${{ inputs.controller_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install controller dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact invocation, frozen baselines and rollback protocol
        run: |
          node --input-type=module <<'JS'
          import {verifyReadonlyInvocation} from './scripts/lib/readonly-marker-invocation.mjs';
          verifyReadonlyInvocation({root:process.cwd(),markerPath:'.github/market-runs/catalog-next-china-release.json',operation:'activate-china-generation'});
          JS
          node scripts/verify-frozen-speed-baselines.mjs
          node --import tsx --test tests/catalog-next-*.test.mjs tests/release-speed-guard-contract.test.mjs
      - name: Checkout the exact runtime
        run: node scripts/catalog-next/checkout-runtime.mjs --serving
      - name: Check the actual runtime reader and calculation context
        working-directory: ${{ runner.temp }}/china-runtime
        run: |
          node --import tsx "$GITHUB_WORKSPACE/scripts/catalog-next/check-runtime-tests.mjs" "$RUNNER_TEMP/china-runtime"
          npm run typecheck
          git restore --source=HEAD --worktree -- apps/web/tsconfig.tsbuildinfo
      - name: Prepare Chromium for the public browser acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/release-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const chrome=execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_ENV,'CHROME_BIN='+fs.realpathSync(chrome)+'\nPLAYWRIGHT_MODULE='+process.env.RUNNER_TEMP+'/release-browser/node_modules/playwright/index.mjs\n');
          JS
      - name: Match the host image store in an isolated runner daemon
        id: china_docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.1.3
          runtime-basedir: ${{ runner.temp }}/china-docker
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Build the exact verified runtime privately
        env:
          CHINA_BUILD_DOCKER_HOST: ${{ steps.china_docker.outputs.sock }}
        run: node scripts/run-node-with-resources.mjs scripts/catalog-next/build-release-image.mjs "$RUNNER_TEMP/china-runtime"
      - name: Verify and publish the China generation with automatic rollback
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/catalog-next/release.mjs "$RUNNER_TEMP/china-runtime"
      - name: Preserve aggregate acceptance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-next-china-release-report
          path: |
            catalog-next-china-release-report.json
            owner-filter-browser-report.json
            china-browser-details-report.json
            ${{ runner.temp }}/china-release-build/image-receipt.json
          if-no-files-found: ignore
          retention-days: 14
