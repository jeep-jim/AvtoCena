name: One-shot roadmap append · Good Car 40.29

on:
  push:
    branches:
      - feat/chngoodcar-carslist-pagination-v1-20260903
    paths:
      - ".github/workflows/roadmap-append-chngoodcar-40-29.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chngoodcar-carslist-pagination-v1-20260903
      - name: Append checkpoint without rewriting prior roadmap history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('roadmap.md')
          staged = Path('.github/roadmap-append-chngoodcar-40-29.md')
          text = roadmap.read_text(encoding='utf-8')
          block = staged.read_text(encoding='utf-8').strip()
          marker = '### 40.29. Guangdong Good Car: post-40.28 price-review refinement'
          if marker in text:
              print('40.29 already present; no-op')
          else:
              roadmap.write_text(text.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
              print('appended roadmap 40.29')
          PY
      - name: Commit roadmap checkpoint
        shell: bash
        run: |
          if git diff --quiet -- roadmap.md; then
            echo "No roadmap change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap.md
          git commit -m "docs(roadmap): record Good Car post-40.28 refinement"
          git push origin HEAD:feat/chngoodcar-carslist-pagination-v1-20260903
