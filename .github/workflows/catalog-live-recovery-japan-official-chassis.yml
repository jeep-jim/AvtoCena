name: Catalog live recovery · Japan official chassis
run-name: Japan official chassis recovery · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-live-recovery-japan-official-chassis.yml"
      - "scripts/prestige-japan-official-chassis-enrich.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-live-recovery-japan-official-chassis
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_MAX_MODELS_PER_MAKE: "10"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  recover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate strict recovery scripts
        run: |
          node --check scripts/prestige-japan-official-chassis-enrich.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
      - name: Download isolated repaired Prestige sold results
        uses: actions/download-artifact@v4
        with:
          name: prestige-japan-exact-sold-isolated-repaired
          path: .
          repository: ${{ github.repository }}
          run-id: 31266526248
          github-token: ${{ github.token }}
      - name: Add only primary-manufacturer exact chassis power records
        env:
          PRESTIGE_OFFICIAL_INPUT: prestige-japan-exact-sold-repaired.json
          PRESTIGE_OFFICIAL_OUTPUT: prestige-japan-exact-sold-official-power.json
        run: node scripts/prestige-japan-official-chassis-enrich.mjs
      - name: Restrict fallback vehicle knowledge to primary official sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/catalog-live-recovery-japan-prestige.mjs')
          text = path.read_text()
          needle = '  if (!variant || !(Number(variant.engineCc) > 0)) return offer;\n'
          replacement = needle + '  if (!["manufacturer", "official_registry"].includes(String(variant.sourceType || ""))) return offer;\n'
          if needle not in text:
              raise SystemExit('strict_variant_patch_anchor_missing')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          grep -F 'official_registry' scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Calculate exact RUB for official-power sold lots only
        env:
          PRESTIGE_RECOVERY_INPUT: prestige-japan-exact-sold-official-power.json
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "1000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Publish strict Japan market
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-live-recovery-japan-official-publish-report.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Verify actual persisted counts for every market
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { PUBLIC_CATALOG_MARKETS } = await import('./apps/web/lib/catalog/runtime-config.ts');
          const report = JSON.parse(fs.readFileSync('catalog-live-recovery-japan-official-publish-report.json', 'utf8'));
          const actual = {};
          for (const market of PUBLIC_CATALOG_MARKETS) actual[market] = (await readMarketOffers(market)).length;
          const problems = [];
          if (actual[report.market] !== Number(report.count || 0)) problems.push(`${report.market}:${actual[report.market]}!=${report.count}`);
          for (const [market, expected] of Object.entries(report.preservedByMarket || {})) {
            if (actual[market] !== Number(expected)) problems.push(`${market}:${actual[market]}!=${expected}`);
          }
          console.log(JSON.stringify({ generationId: report.generationId, actual, expectedPreserved: report.preservedByMarket, problems }, null, 2));
          if (problems.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-live-recovery-japan-official-reports
          path: |
            prestige-japan-exact-sold-official-power.json
            catalog-rebuild-japan.json
            catalog-live-recovery-japan-official-publish-report.json
          if-no-files-found: warn
          retention-days: 5
