name: Audit Georgia canonical publish dry run 20260812

on:
  push:
    branches:
      - audit/georgia-canonical-collection-20260812-v2

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch calculated canonical snapshot through Yandex
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 300 -fsS 'https://avtocena.com/api/internal/georgia-egress-8d4c2f?mode=recovery&pages=2' -o recovery.json
          mkdir -p recovery-input
          cp recovery.json recovery-input/catalog-rebuild-georgia.json
          jq '{count,report}' recovery.json
      - name: Evaluate exact production publisher without writing
        env:
          RECOVERY_BATCH_MARKETS: georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: georgia-publish-dry-run.json
          RECOVERY_BATCH_DRY_RUN: "true"
          RECOVERY_PUBLISH_MAX: "5000"
          CATALOG_MAX_OFFERS_PER_MODEL: "20"
          CATALOG_OFFER_RETENTION_MS: "315360000000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Assert canonical Georgia and six-market preservation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('recovery.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('georgia-publish-dry-run.json', 'utf8'));
          const georgia = report.byMarket?.georgia || {};
          const canonical = new Set(['myauto_georgia_list', 'autopapa_georgia_open']);
          if (!(snapshot.count > 0)) throw new Error('snapshot_empty');
          if (!(georgia.count > 0) || !(georgia.incomingCount > 0)) throw new Error('publisher_selected_empty');
          if (Object.keys(georgia.sourceCounts || {}).some((sourceId) => !canonical.has(sourceId))) throw new Error('noncanonical_source');
          if (Number(georgia.imageStats?.min || 0) < 5) throw new Error('gallery_below_5');
          const current = { korea:3640, china:7579, japan:2557, uae:223, europe:5741, kyrgyzstan:2332 };
          for (const [market, expected] of Object.entries(current)) {
            if (Number(report.preservedByMarket?.[market] || 0) !== expected) {
              throw new Error(`preservation_mismatch:${market}:${report.preservedByMarket?.[market]}:${expected}`);
            }
          }
          console.log(JSON.stringify({snapshot:snapshot.report, publisher:georgia, preserved:report.preservedByMarket}, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-canonical-publish-dry-run
          path: |
            recovery.json
            georgia-publish-dry-run.json
          if-no-files-found: warn
          retention-days: 3
