name: Audit Georgia production egress 20260812

on:
  push:
    branches:
      - audit/georgia-canonical-collection-20260812-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch live Yandex adapter and gallery diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 120 -fsS 'https://avtocena.com/api/internal/georgia-adapters-dryrun-6a91d7' -o adapters.json
          curl --connect-timeout 10 --max-time 180 -fsS 'https://avtocena.com/api/internal/georgia-egress-8d4c2f' -o galleries.json
          curl --connect-timeout 10 --max-time 60 -fsS 'https://avtocena.com/api/catalog/home' -o public-home.json
          jq . adapters.json
          jq '{runtime,mode,myauto:{ok:.myauto.ok,id:.myauto.id,make:.myauto.make,model:.myauto.model,year:.myauto.year,apiStatus:.myauto.apiStatus,photo:.myauto.photo,photoVer:.myauto.photoVer,picNumber:.myauto.picNumber,safeSpecFields:.myauto.safeSpecFields},autopapa:{ok:.autopapa.ok,fetched:.autopapa.fetched,normalized2020Plus:.autopapa.normalized2020Plus,samples:[.autopapa.samples[]|{id,make,model,year,sourcePrice,detailStatus,originalCount}]}}' galleries.json
          jq '{generationId,marketCounts,total}' public-home.json
      - name: Assert live Georgia source access and exact gallery metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .runtime == "yandex-serverless"
            and ([.results[] | select(.sourceId == "myauto_georgia_list" and .ok == true and .canonical > 0 and .year2020Plus > 0)] | length == 1)
            and ([.results[] | select(.sourceId == "autopapa_georgia_open" and .ok == true and .canonical > 0 and .year2020Plus > 0)] | length == 1)
          ' adapters.json >/dev/null
          jq -e '
            .myauto.ok == true
            and .myauto.apiStatus == 200
            and (.myauto.picNumber | tonumber) > 0
            and .autopapa.ok == true
            and .autopapa.normalized2020Plus > 0
            and ([.autopapa.samples[] | select(.detailStatus == 200 and .originalCount >= 5)] | length) > 0
          ' galleries.json >/dev/null
          jq -e '(.marketCounts.georgia | tonumber) >= 0' public-home.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-production-egress-audit
          path: |
            adapters.json
            galleries.json
            public-home.json
          if-no-files-found: warn
          retention-days: 3
