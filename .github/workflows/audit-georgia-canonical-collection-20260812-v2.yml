name: Audit Georgia canonical collection 20260812 v2

on:
  push:
    branches:
      - audit/georgia-canonical-collection-20260812-v2

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_MARKET: georgia
  RECOVERY_SOURCE_IDS: myauto_georgia_list,autopapa_georgia_open
  RECOVERY_TARGET: "200"
  RECOVERY_MAX_PAGES: "30"
  RECOVERY_TIME_LIMIT_MS: "1500000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"
  RECOVERY_OUTPUT: catalog-rebuild-georgia.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Georgia source contracts
        run: |
          node --import tsx --test tests/georgia-canonical-source-policy-20260812.test.ts
          node --import tsx --test tests/myauto-list-source.test.ts
          node --import tsx --test tests/catalog-live-sources-v19.test.ts
      - name: Collect canonical Georgia without publication
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Audit exact identity, galleries, and calculations
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('catalog-rebuild-georgia.json', 'utf8'));
          const offers = Array.isArray(payload.offers) ? payload.offers : [];
          const canonical = new Set(['myauto_georgia_list', 'autopapa_georgia_open']);
          const expectedHosts = {
            myauto_georgia_list: ['myauto.ge'],
            autopapa_georgia_open: ['autopapa.ge'],
          };
          const failures = [];
          const bySource = {};
          for (const offer of offers) {
            const sourceId = String(offer.sourceId || '');
            const sourceOfferId = String(offer.sourceOfferId || '');
            const op = offer.operational || {};
            const raw = op.raw || {};
            const images = Array.isArray(offer.images) ? offer.images : [];
            const urls = images.map((image) => String(image?.url || image || '')).filter(Boolean);
            if (!canonical.has(sourceId)) failures.push(`noncanonical_source:${sourceId}`);
            let sourceHost = '';
            try { sourceHost = new URL(String(op.sourceUrl || '')).hostname.toLowerCase(); } catch {}
            if (!(expectedHosts[sourceId] || []).some((host) => sourceHost === host || sourceHost.endsWith(`.${host}`))) failures.push(`source_host:${sourceId}:${sourceHost}`);
            if (Number(offer.year || 0) < 2020) failures.push(`year:${sourceId}:${sourceOfferId}:${offer.year}`);
            if (!(Number(offer.sourcePrice || 0) > 0) || !String(offer.sourceCurrency || '')) failures.push(`price:${sourceId}:${sourceOfferId}`);
            if (!images.length) failures.push(`images:${sourceId}:${sourceOfferId}`);
            if (raw.recoveryExactSourceUrl !== true || raw.recoveryExactPhotoIdentity !== true || raw.recoveryCalculatedRub !== true || raw.recoveryBodySourceOnly !== true) failures.push(`recovery_flags:${sourceId}:${sourceOfferId}`);
            if (String(offer.calculationSnapshot?.customs?.status || '') !== 'ready' || !(Number(offer.totalRub || 0) > 0)) failures.push(`calculation:${sourceId}:${sourceOfferId}`);
            if (sourceId === 'myauto_georgia_list') {
              for (const url of urls) {
                const match = url.match(/\/myauto\/photos\/\d+\/\d+\/\d+\/\d+\/\d+\/large\/(\d+)_\d+\.jpg(?:\?v=\d+)?$/i);
                if (!match || match[1] !== sourceOfferId) failures.push(`myauto_image_identity:${sourceOfferId}:${url}`);
              }
            }
            const row = bySource[sourceId] ||= { count: 0, below5: 0, imageCounts: [], examples: [] };
            row.count += 1;
            row.below5 += images.length < 5 ? 1 : 0;
            row.imageCounts.push(images.length);
            if (row.examples.length < 3) row.examples.push({
              sourceOfferId,
              make: offer.make,
              model: offer.model,
              year: offer.year,
              sourcePrice: offer.sourcePrice,
              sourceCurrency: offer.sourceCurrency,
              totalRub: offer.totalRub,
              imageCount: images.length,
              sourceUrl: op.sourceUrl,
              firstImage: urls[0] || null,
            });
          }
          for (const sourceId of canonical) {
            if (!bySource[sourceId]?.count) failures.push(`source_empty:${sourceId}`);
          }
          for (const row of Object.values(bySource)) {
            row.minImages = Math.min(...row.imageCounts);
            row.maxImages = Math.max(...row.imageCounts);
            row.averageImages = Number((row.imageCounts.reduce((a, b) => a + b, 0) / row.imageCounts.length).toFixed(2));
            delete row.imageCounts;
          }
          const audit = {
            checkedAt: new Date().toISOString(),
            published: false,
            count: offers.length,
            canonicalOnly: offers.every((offer) => canonical.has(String(offer.sourceId || ''))),
            below5ImagesCount: offers.filter((offer) => !Array.isArray(offer.images) || offer.images.length < 5).length,
            minYear: offers.length ? Math.min(...offers.map((offer) => Number(offer.year || 0))) : null,
            bySource,
            collectorReport: payload.report,
            failures: [...new Set(failures)].slice(0, 100),
          };
          fs.writeFileSync('catalog-georgia-canonical-audit.json', JSON.stringify(audit, null, 2));
          console.log(JSON.stringify(audit, null, 2));
          if (!offers.length || failures.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: georgia-canonical-collection-audit
          path: |
            catalog-rebuild-georgia.json
            catalog-georgia-canonical-audit.json
          if-no-files-found: warn
          retention-days: 3
