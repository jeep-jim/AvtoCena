name: One-shot reject representative model power in customs
run-name: Reject representative model power · ${{ github.sha }}

on:
  push:
    branches:
      - fix/customs-reject-model-representative-power-20260813
    paths:
      - .github/workflows/oneshot-customs-reject-representative-power-20260813.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customs-reject-model-representative-power-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject model-wide representative horsepower before customs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/lib/catalog/customs-pricing.ts')
          s=p.read_text()
          anchor='''function positive(value: unknown) {\n  const parsed = Number(value);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;\n}\n'''
          helper='''function positive(value: unknown) {\n  const parsed = Number(value);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;\n}\n\nexport function discardRepresentativeModelPowerForCustoms<T extends VehicleOffer>(offer: T): T {\n  if (!String(offer.powerDataSource || "").startsWith("vehicle-model-representative:")) return offer;\n  return {\n    ...offer,\n    powerHp: undefined,\n    powerKw: undefined,\n    powerDataConfidence: undefined,\n    powerDataSource: undefined,\n  } as T;\n}\n'''
          if anchor not in s:
              raise SystemExit('positive helper anchor missing')
          s=s.replace(anchor,helper,1)
          old='''  const canonical = await enrichOfferWithVehicleKnowledge(enrichOfferWithExplicitEngineDisplacement(input));\n  const certified = await enrichOfferWithCertifiedPower(canonical);\n'''
          new='''  const canonical = discardRepresentativeModelPowerForCustoms(\n    await enrichOfferWithVehicleKnowledge(enrichOfferWithExplicitEngineDisplacement(input)),\n  );\n  const certified = await enrichOfferWithCertifiedPower(canonical);\n'''
          if old not in s:
              raise SystemExit('customs enrichment anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > tests/customs-representative-power-safety.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { discardRepresentativeModelPowerForCustoms } from "../apps/web/lib/catalog/customs-pricing";
          import type { VehicleOffer } from "../apps/web/lib/catalog/types";

          function offer(overrides: Partial<VehicleOffer> = {}): VehicleOffer {
            return {
              id: "rep-test",
              sourceId: "autopapa_georgia_open",
              sourceOfferId: "954125",
              market: "georgia",
              offerType: "fixed",
              status: "active",
              make: "Toyota",
              model: "Corolla",
              year: 2026,
              engineCc: 2000,
              fuel: "petrol",
              mileageKm: 1000,
              sourcePrice: 15_000,
              sourceCurrency: "USD",
              priceMode: "fixed",
              images: [],
              calculationStatus: "needs_data",
              firstSeenAt: "2026-08-13T00:00:00.000Z",
              updatedAt: "2026-08-13T00:00:00.000Z",
              operational: {},
              ...overrides,
            };
          }

          test("model-wide representative horsepower is not eligible for customs", () => {
            const result = discardRepresentativeModelPowerForCustoms(offer({
              powerHp: 94,
              powerKw: 69.14,
              powerDataConfidence: "estimated",
              powerDataSource: "vehicle-model-representative:toyota/corolla",
            }));
            assert.equal(result.powerHp, undefined);
            assert.equal(result.powerKw, undefined);
            assert.equal(result.powerDataConfidence, undefined);
            assert.equal(result.powerDataSource, undefined);
            assert.equal(result.engineCc, 2000);
          });

          test("exact and variant-bound horsepower remains eligible for customs", () => {
            const exact = discardRepresentativeModelPowerForCustoms(offer({
              powerHp: 155,
              powerKw: 114,
              powerDataConfidence: "source_exact",
              powerDataSource: "autopapa-detail:954125",
            }));
            assert.equal(exact.powerHp, 155);
            assert.equal(exact.powerDataSource, "autopapa-detail:954125");

            const variant = discardRepresentativeModelPowerForCustoms(offer({
              powerHp: 155,
              powerKw: 114,
              powerDataConfidence: "reference",
              powerDataSource: "vehicle-knowledge:drom_557278549f95be08442f2b86",
            }));
            assert.equal(variant.powerHp, 155);
            assert.equal(variant.powerDataSource, "vehicle-knowledge:drom_557278549f95be08442f2b86");
          });
          EOF
      - name: Validate focused tests and typecheck
        run: |
          node --import tsx --test tests/customs-representative-power-safety.test.ts tests/vehicle-knowledge.test.ts
          npm run typecheck
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/customs-pricing.ts tests/customs-representative-power-safety.test.ts
          git commit -m "Reject model representative power in customs"
          git push origin HEAD:fix/customs-reject-model-representative-power-20260813
