name: Validate strict electrified classification

on:
  push:
    branches:
      - "fix/strict-electrified-model-classification"
    paths:
      - ".github/workflows/validate-strict-electrified-classification.yml"

permissions:
  contents: write

concurrency:
  group: validate-strict-electrified-classification
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply strict classification patch
        run: python .github/patches/fix-strict-electrified-classification.py
      - name: Validate syntax and types
        run: |
          node --check apps/web/lib/catalog/spec-normalization.ts
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo || true
      - name: Verify HEV/EV guards and audit certified references
        run: npx tsx .github/patches/verify-strict-electrified-classification.ts
      - name: Commit validated source fix to branch
        run: |
          rm .github/workflows/validate-strict-electrified-classification.yml
          rm .github/patches/fix-strict-electrified-classification.py
          rm .github/patches/verify-strict-electrified-classification.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/spec-normalization.ts .github/workflows/validate-strict-electrified-classification.yml .github/patches/fix-strict-electrified-classification.py .github/patches/verify-strict-electrified-classification.ts
          git commit -m "Recognize strict HEV and known BEV model tokens"
          git push origin HEAD:fix/strict-electrified-model-classification
