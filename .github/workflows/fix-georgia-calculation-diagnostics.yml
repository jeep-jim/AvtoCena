name: Fix Georgia calculation recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-georgia-calculation-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply verified catalog patch
        run: python .github/patches/fix-georgia-and-etron.py
      - name: Validate patched catalog paths
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-live-recovery-market.mjs apps/web/lib/catalog/spec-normalization.ts
          git rm .github/workflows/fix-georgia-calculation-diagnostics.yml .github/patches/fix-georgia-and-etron.py
          git commit -m "Recover Georgia specs and reject misclassified e-tron customs"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
