name: Prepare locally stored China feed
on:
  workflow_run:
    workflows: ['Catalog refresh china']
    branches: [main]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/china-prepare-owned.json']
permissions:
  contents: read
concurrency:
  group: catalog-owned-china-materialization
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply the downloaded changes to the stored Che168 inventory
        env:
          AUTO_API_CHE168_KEY: ${{ secrets.AUTO_API_CHE168_KEY }}
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/catalog-prepare-owned-china.mjs
