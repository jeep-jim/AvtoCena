name: Catalog recovery observation
on:
  push:
    branches: [ops/catalog-recovery-observation-20260922]
    paths: [.github/workflows/catalog-recovery-observation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Read publication lease and checkpoint metadata
        run: |
          node --import tsx --input-type=module <<'JS'
          import {getJsonStorage} from './apps/web/lib/data.ts';
          const s=getJsonStorage();
          const [manifest,lock,japan]=await Promise.all([
            s.readJson('catalog/manifest.json',null),
            s.readJson('catalog/import-lock.json',null),
            s.readJson('catalog/collector-state/proauctions/current.json',null),
          ]);
          let archive=null;
          if(japan?.version===2&&/^catalog\/collector-state\/proauctions\/archive-[0-9a-f-]+\.json$/.test(japan.key)){
            const d=await s.readJson(japan.key,null);
            archive={bytes:d?.size,parts:d?.parts?.length};
          }
          const pick=(x,fields)=>Object.fromEntries(fields.map(k=>[k,x?.[k]??null]));
          const report={at:new Date().toISOString(),generation:manifest?.generationId,markets:manifest?.markets,
            lock:pick(lock,['operationId','operationType','lockedUntil','heartbeatAt','startedAt']),
            japan:pick(japan,['version','details','prepared','complete','published','startedAt','savedAt','publishedAt','stopReason']),archive};
          console.log(JSON.stringify(report));
          JS
      - name: Restore multipart checkpoint into isolated runner storage
        run: |
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {getJsonStorage} from './apps/web/lib/data.ts';
          import {restoreProAuctionsState,proAuctionsStateKey} from './scripts/lib/proauctions-durable-state.mjs';
          const metadata=await getJsonStorage().readJson(proAuctionsStateKey,null);
          assert.equal(metadata.version,2);
          const root='/tmp/japan-checkpoint-readonly-verification';
          await restoreProAuctionsState(root,metadata);
          const restored=JSON.parse(await fs.readFile(root+'/checkpoint.json','utf8'));
          assert.equal(restored.details,metadata.details);
          assert.equal(restored.prepared,metadata.prepared);
          console.log(JSON.stringify({verified:true,version:metadata.version,details:restored.details,prepared:restored.prepared,savedAt:metadata.savedAt,remoteWrites:false}));
          JS
