name: Catalog recovery observation
on:
  push:
    branches: [ops/catalog-recovery-observation-20260922]
    paths: [.github/workflows/catalog-recovery-observation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Read publication lease and checkpoint metadata
        run: |
          node --import tsx --input-type=module <<'JS'
          import {getJsonStorage} from './apps/web/lib/data.ts';
          const s=getJsonStorage();
          const [manifest,lock,japan,green,previous,maintenance]=await Promise.all([
            s.readJson('catalog/manifest.json',null),
            s.readJson('catalog/import-lock.json',null),
            s.readJson('catalog/collector-state/proauctions/current.json',null),
            s.readJson('catalog/green-corner/current.json',null),
            s.readJson('catalog/previous-manifest.json',null),
            s.readJson('catalog/storage-maintenance.json',null),
          ]);
          let archive=null;
          if(japan?.version===2&&/^catalog\/collector-state\/proauctions\/archive-[0-9a-f-]+\.json$/.test(japan.key)){
            const d=await s.readJson(japan.key,null);
            archive={bytes:d?.size,parts:d?.parts?.length};
          }
          const pick=(x,fields)=>Object.fromEntries(fields.map(k=>[k,x?.[k]??null]));
          const report={at:new Date().toISOString(),generation:manifest?.generationId,markets:Object.fromEntries(Object.entries(manifest?.markets||{}).map(([k,v])=>[k,{count:v.count,updatedAt:v.updatedAt}])),
            lock:pick(lock,['operationId','operationType','lockedUntil','heartbeatAt','startedAt']),
            japan:pick(japan,['version','details','prepared','complete','published','startedAt','savedAt','publishedAt','stopReason']),archive};
          const objects=await s.listBucketObjects('');
          const generations=new Map();
          for(const row of objects){const m=String(row.key).match(/(?:^|\/)catalog\/generations\/(gen_(\d+)_[-a-z0-9]+)\//);if(m)generations.set(m[1],{id:m[1],bytes:(generations.get(m[1])?.bytes||0)+Number(row.size||0),graceEndsAt:new Date(Number(m[2])+6*3600000).toISOString(),protected:[manifest?.generationId,previous?.generationId].includes(m[1])});}
          const example=green?.items?.find(o=>o.id==='green-727977');
          report.green={count:green?.items?.length,sourceCount:green?.sourceCount,updatedAt:green?.updatedAt,low:green?.items?.filter(o=>o.powerHp>0&&o.powerHp<=160).length,high:green?.items?.filter(o=>o.powerHp>160).length,example:example?{id:example.id,sourcePrice:example.sourcePrice,sellerPriceRub:example.sellerPriceRub,currencyRate:example.calculationSnapshot?.currencyRate}:null};
          report.storage={bytes:objects.reduce((n,o)=>n+Number(o.size||0),0),maintenance,generations:[...generations.values()]};
          console.log(JSON.stringify(report));
          JS
