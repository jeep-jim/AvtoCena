name: China — verify saved publication without rebuilding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/china-staged-recovery.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: china-staged-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the original run is terminal
        uses: actions/github-script@v7
        with:
          script: |
            const c=JSON.parse(require('fs').readFileSync('.github/market-runs/china-staged-recovery.json','utf8'));
            if(c.validatedRunId!==39840733509)throw Error('unexpected_recovery_scope');
            const failed=await github.rest.actions.getWorkflowRun({...context.repo,run_id:c.validatedRunId});
            if(failed.data.status!=='completed'||failed.data.conclusion!=='cancelled')throw Error('original_run_not_cancelled');
            const job=await github.rest.actions.getJobForWorkflowRun({...context.repo,job_id:120041080822});
            if(job.data.run_id!==c.validatedRunId||job.data.conclusion!=='cancelled')throw Error('original_job_not_cancelled');
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify saved chunks with bounded memory
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: node --import tsx scripts/catalog-resume-staged-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-staged-verification
          path: china-staged-verification.json
          if-no-files-found: ignore
