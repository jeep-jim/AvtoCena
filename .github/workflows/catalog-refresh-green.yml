name: Catalog refresh green
on:
  workflow_dispatch:
  schedule:
    - cron: '47 23 * * *'
  push:
    branches: [main]
    paths: ['.github/market-runs/green-refresh.json']
permissions:
  contents: read
concurrency:
  group: catalog-refresh-green
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {catalogRefreshDue} from './scripts/lib/catalog-refresh-schedule.mjs';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${process.env.EVENT_NAME !== 'schedule' || catalogRefreshDue()}\n`);
          JS
      - name: Wait for matching web release before CIF migration
        if: github.event_name == 'push'
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<90;i++){
            try{const r=await fetch('https://avtocena.com/api/health',{signal:AbortSignal.timeout(15000)});const d=await r.json();if(d.ok&&d.releaseSha===process.env.EXPECTED_RELEASE){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready)throw Error('CIF web release not confirmed; existing stock retained');
          JS
      - if: steps.plan.outputs.run == 'true'
        run: npm ci
      - if: steps.plan.outputs.run == 'true'
        run: node --import tsx scripts/catalog-refresh-green-corner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-green-report
          path: catalog-green-report.json
          retention-days: 14
