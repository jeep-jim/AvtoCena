name: Catalog refresh green
on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Novokuznetsk (UTC+7); existing source/cadence guards remain.
    - cron: "0 17 * * *"
  push:
    branches: [main]
    paths: ['.github/market-runs/green-refresh.json']
permissions:
  contents: read
concurrency:
  group: catalog-refresh-green
  cancel-in-progress: false
jobs:
  refresh:
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs';
          import {catalogRefreshDue} from './scripts/lib/catalog-refresh-schedule.mjs';
          const {readCollectionControls}=await import('./apps/web/lib/catalog/collection-controls.ts');
          const {collectionEnabled}=await import('./apps/web/lib/catalog/collection-controls-schema.ts');
          const enabled=collectionEnabled(await readCollectionControls(),'akebono_green');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${enabled && (process.env.EVENT_NAME !== 'schedule' || catalogRefreshDue())}\n`);
          JS
      # CIF migration is already installed. Data-only refreshes must not wait
      # for their marker commit to become a new application release.
      - name: Verify safe Green Corner refresh
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/green-refresh-snapshot.test.ts tests/green-corner.test.ts
      - if: steps.plan.outputs.run == 'true'
        run: node --import tsx scripts/catalog-refresh-green-corner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-green-report
          path: catalog-green-report.json
          retention-days: 14
