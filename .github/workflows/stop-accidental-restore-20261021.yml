name: Stop accidental restore jobs 20261021
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stop-accidental-restore-20261021.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel accidental restore runs only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,time
          root='https://api.github.com/repos/'+os.environ['GH_REPO']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          target='c0d18e13b23d5010fedf015e558b27b9dbc001bd'
          def call(path,method='GET'):
              req=urllib.request.Request(root+path,headers=headers,method=method,data=b'' if method=='POST' else None)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read()
                      return json.loads(data) if data else {}
              except urllib.error.HTTPError as e:
                  if method=='POST' and e.code in (409,422):return {}
                  raise
          for attempt in range(3):
              runs=[]
              for page in range(1,5):
                  chunk=call('/actions/runs?head_sha='+target+'&per_page=100&page='+str(page))['workflow_runs']
                  runs.extend(chunk)
                  if len(chunk)<100:break
              active=[r for r in runs if r['head_sha']==target and r['status']!='completed']
              print('Active accidental runs:',len(active),flush=True)
              for run in active:
                  call('/actions/runs/'+str(run['id'])+'/cancel','POST')
                  print('Cancel',run['id'],run['name'],flush=True)
              if not active:break
              time.sleep(10)
          PY
