name: Verify reviewed catalog code and required market checks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-china-photo-code.yml
      - .github/workflows/catalog-next-china-photo-release.yml
      - .github/operations/catalog-next/china-code-serving-plan.json
      - .github/operations/catalog-next/china-serving-plan.json
      - .github/operations/catalog-next/runtime-test-compatibility.patch
      - scripts/catalog-next/code-*.mjs
      - scripts/catalog-next/photo-code-scope.mjs
      - scripts/catalog-next/crm-china-code-scope.mjs
      - scripts/catalog-next/crm-china-status-proof.mjs
      - scripts/catalog-next/crm-japan-photo-code-scope.mjs
      - scripts/catalog-next/japan-photo-retry-proof.mjs
      - scripts/catalog-next/japan-pagination-code-scope.mjs
      - scripts/catalog-next/japan-stability-code-scope.mjs
      - scripts/catalog-next/japan-stability-browser.mjs
      - scripts/catalog-next/japan-filter-directory-proof.mjs
      - scripts/catalog-next/japan-pagination-fixture.mjs
      - scripts/catalog-next/check-photo-runtime-tests.mjs
      - scripts/catalog-next/check-runtime-tests.mjs
      - scripts/catalog-next/photo-japan-browser-acceptance.mjs
      - scripts/catalog-next/japan-browser-acceptance.mjs
      - scripts/catalog-next/build-release-image.mjs
      - scripts/catalog-next/restore-photo-image.mjs
      - scripts/catalog-next/daily-release.mjs
      - scripts/catalog-next/daily-entry.mjs
      - scripts/catalog-next/china-state.mjs
      - scripts/catalog-next/china-generation-gc.mjs
      - scripts/catalog-next/release-host.py
      - scripts/catalog-next/release-ssh.mjs
      - scripts/catalog-next/serving-compatibility.mjs
      - tests/catalog-next-code-*.test.mjs
      - tests/catalog-next-crm-china-*.test.mjs
      - tests/catalog-next-crm-japan-photo-*.test.mjs
      - tests/catalog-next-check-photo-runtime-tests.test.mjs
      - tests/catalog-next-check-runtime-tests.test.mjs
      - tests/catalog-next-restore-photo-image.test.mjs
      - tests/catalog-next-japan-*.test.mjs
      - tests/catalog-next-serving-compatibility.test.mjs
      - tests/release-speed-guard-contract.test.mjs
      - tests/browser/photo-japan-recovery-clock.mjs
permissions:
  contents: read
concurrency:
  group: verify-china-photo-code
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check publication, daily continuity, rollback and unchanged baselines
        run: |
          node scripts/verify-frozen-speed-baselines.mjs
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-next-*.test.mjs tests/release-speed-guard-contract.test.mjs
      - name: Checkout and verify the exact isolated code candidate
        run: |
          node --import tsx scripts/catalog-next/code-entry.mjs --checkout
          node --import tsx scripts/catalog-next/code-entry.mjs --verify
      - name: Select the verified code scope for its required checks
        id: photo_scope
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {checkedCatalogCodeScope} from './scripts/catalog-next/photo-code-scope.mjs';
          const plan = JSON.parse(fs.readFileSync('.github/operations/catalog-next/china-code-serving-plan.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'scope=' + checkedCatalogCodeScope(plan) + '\n');
          JS
      - name: Prepare Chromium for the required runtime browser fixture
        if: steps.photo_scope.outputs.scope == 'catalog-photo-recovery-v1' || steps.photo_scope.outputs.scope == 'catalog-photo-japan-power-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-completion-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-completion-v2' || steps.photo_scope.outputs.scope == 'catalog-japan-usability-v1' || steps.photo_scope.outputs.scope == 'catalog-crm-china-operations-v1' || steps.photo_scope.outputs.scope == 'catalog-crm-japan-photo-retry-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-pagination24-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1'
        run: |
          npm install --prefix "$RUNNER_TEMP/photo-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const chrome=execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_ENV,'CHROME_BIN='+fs.realpathSync(chrome)+'\nPLAYWRIGHT_MODULE='+process.env.RUNNER_TEMP+'/photo-browser/node_modules/playwright/index.mjs\n');
          JS
      - name: Test the native runtime and every required check for its reviewed scope
        env:
          CATALOG_CODE_SCOPE: ${{ steps.photo_scope.outputs.scope }}
        run: |
          set -euo pipefail
          PHOTO_SHA=$(node -p "JSON.parse(require('fs').readFileSync('.github/operations/catalog-next/china-code-serving-plan.json')).runtimeSha")
          if [[ "$CATALOG_CODE_SCOPE" == 'catalog-photo-recovery-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-photo-japan-power-v1' ]]; then
            PHOTO_RUNTIME_ROOT="$RUNNER_TEMP/china-serving-runtime-$PHOTO_SHA" node tests/browser/photo-japan-recovery-clock.mjs
          fi
          node --import tsx scripts/catalog-next/check-photo-runtime-tests.mjs "$RUNNER_TEMP/china-serving-runtime-$PHOTO_SHA"
          cd "$RUNNER_TEMP/china-serving-runtime-$PHOTO_SHA"
          npm run typecheck
          git restore --source=HEAD --worktree -- apps/web/tsconfig.tsbuildinfo
          if [[ "$CATALOG_CODE_SCOPE" == 'catalog-photo-recovery-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-photo-japan-power-v1' ]]; then
            node --import tsx tests/browser/catalog-photo-recovery.mjs
          fi
          if [[ "$CATALOG_CODE_SCOPE" == 'catalog-japan-completion-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-completion-v2' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-usability-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-pagination24-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-stability-v1' ]]; then
            JAPAN_CITY_REPORT="$RUNNER_TEMP/japan-catalog-city-report.json" node tests/browser/japan-catalog-city.mjs
          fi
          if [[ "$CATALOG_CODE_SCOPE" == 'catalog-japan-usability-v1' ]]; then
            JAPAN_BRAND_REPORT="$RUNNER_TEMP/japan-brand-directory-report.json" node tests/browser/japan-brand-directory.mjs
          fi
          if [[ "$CATALOG_CODE_SCOPE" == 'catalog-crm-china-operations-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-crm-japan-photo-retry-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-pagination24-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-stability-v1' ]]; then
            COLLECTION_CONTROLS_REPORT="$RUNNER_TEMP/china-crm-collection-controls-report.json" node --import tsx tests/browser/collection-controls.mjs
            cd "$GITHUB_WORKSPACE"
            node --import tsx --import ./tests/helpers/offline-fetch.mjs --input-type=module <<'JS'
          import fs from 'node:fs';
          import {checkedCrmChinaBrowserFixture, verifyCrmChinaMiddleware} from './scripts/catalog-next/crm-china-status-proof.mjs';
          checkedCrmChinaBrowserFixture(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/china-crm-collection-controls-report.json')));
          const plan = JSON.parse(fs.readFileSync('.github/operations/catalog-next/china-code-serving-plan.json'));
          await verifyCrmChinaMiddleware(process.env.RUNNER_TEMP + '/china-serving-runtime-' + plan.runtimeSha);
          JS
          fi
          if [[ "$CATALOG_CODE_SCOPE" == 'catalog-crm-japan-photo-retry-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-pagination24-v1' || "$CATALOG_CODE_SCOPE" == 'catalog-japan-stability-v1' ]]; then
            cd "$RUNNER_TEMP/china-serving-runtime-$PHOTO_SHA"
            JAPAN_PHOTO_RETRY_REPORT="$RUNNER_TEMP/japan-photo-retry-browser-report.json" node --import tsx tests/browser/catalog-photo-retry.mjs
            cd "$GITHUB_WORKSPACE"
            node --input-type=module <<'JS'
          import {readJapanPhotoRetryFixture} from './scripts/catalog-next/japan-photo-retry-proof.mjs';
          await readJapanPhotoRetryFixture(process.env.RUNNER_TEMP + '/japan-photo-retry-browser-report.json');
          JS
          fi
      - name: Verify ordinary Japan page filling on the exact candidate before host contact
        if: steps.photo_scope.outputs.scope == 'catalog-japan-pagination24-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1'
        run: |
          set -euo pipefail
          PAGINATION_SHA=$(node -p "JSON.parse(require('fs').readFileSync('.github/operations/catalog-next/china-code-serving-plan.json')).runtimeSha")
          cd "$RUNNER_TEMP/china-serving-runtime-$PAGINATION_SHA"
          JAPAN_PAGINATION24_REPORT="$RUNNER_TEMP/japan-pagination24-browser-report.json" node --import tsx tests/browser/ajes-pagination.mjs
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'JS'
          import {readJapanPaginationFixture} from './scripts/catalog-next/japan-pagination-fixture.mjs';
          await readJapanPaginationFixture(process.env.RUNNER_TEMP + '/japan-pagination24-browser-report.json');
          JS
      - name: Verify Japan supplier-only brand and model controls on the exact candidate
        if: steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1'
        run: |
          set -euo pipefail
          STABILITY_SHA=$(node -p "JSON.parse(require('fs').readFileSync('.github/operations/catalog-next/china-code-serving-plan.json')).runtimeSha")
          cd "$RUNNER_TEMP/china-serving-runtime-$STABILITY_SHA"
          JAPAN_FILTER_DIRECTORY_REPORT="$RUNNER_TEMP/japan-filter-directory-browser-report.json" node --import tsx tests/browser/japan-filter-directory.mjs
          node --import tsx tests/browser/model-suggestions.mjs
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'JS'
          import {readJapanFilterDirectoryFixture} from './scripts/catalog-next/japan-filter-directory-proof.mjs';
          await readJapanFilterDirectoryFixture(process.env.RUNNER_TEMP + '/japan-filter-directory-browser-report.json');
          JS
      - name: Preserve Japan source directory and retry fixture evidence
        if: always() && steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1'
        uses: actions/upload-artifact@v4
        with:
          name: japan-filter-directory-fixture
          path: ${{ runner.temp }}/japan-filter-directory-browser-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Japan page-fill and continuation fixture evidence
        if: always() && (steps.photo_scope.outputs.scope == 'catalog-japan-pagination24-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1')
        uses: actions/upload-artifact@v4
        with:
          name: japan-pagination24-fixture
          path: ${{ runner.temp }}/japan-pagination24-browser-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve China CRM controls fixture evidence
        if: always() && (steps.photo_scope.outputs.scope == 'catalog-crm-china-operations-v1' || steps.photo_scope.outputs.scope == 'catalog-crm-japan-photo-retry-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-pagination24-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1')
        uses: actions/upload-artifact@v4
        with:
          name: china-crm-collection-controls-fixture
          path: ${{ runner.temp }}/china-crm-collection-controls-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve bounded Japan image recovery fixture evidence
        if: always() && (steps.photo_scope.outputs.scope == 'catalog-crm-japan-photo-retry-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-pagination24-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1')
        uses: actions/upload-artifact@v4
        with:
          name: japan-photo-retry-fixture
          path: ${{ runner.temp }}/japan-photo-retry-browser-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Japan complete brand directory evidence
        if: always() && steps.photo_scope.outputs.scope == 'catalog-japan-usability-v1'
        uses: actions/upload-artifact@v4
        with:
          name: japan-brand-directory-fixture
          path: ${{ runner.temp }}/japan-brand-directory-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Japan city hydration and filter evidence
        if: always() && (steps.photo_scope.outputs.scope == 'catalog-japan-completion-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-completion-v2' || steps.photo_scope.outputs.scope == 'catalog-japan-usability-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-pagination24-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-stability-v1')
        uses: actions/upload-artifact@v4
        with:
          name: japan-catalog-city-fixture
          path: ${{ runner.temp }}/japan-catalog-city-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the browser recovery evidence
        if: always() && (steps.photo_scope.outputs.scope == 'catalog-photo-recovery-v1' || steps.photo_scope.outputs.scope == 'catalog-photo-japan-power-v1')
        uses: actions/upload-artifact@v4
        with:
          name: china-photo-recovery-fixture
          path: ${{ runner.temp }}/china-serving-runtime-*/artifacts/catalog-photo-recovery/**
          if-no-files-found: warn
          retention-days: 7
