name: Catalog ops · trigger Georgia canonical recovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-georgia-canonical-recovery-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical-first UAE + Georgia recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-live-recovery-uae-georgia-direct.yml --repo jeep-jim/AvtoCena --ref main
