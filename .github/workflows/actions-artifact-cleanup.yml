name: Actions artifact cleanup audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artifacts = [];
            for(let page=1;page<=100;page++){
              let data;
              for(let attempt=0;attempt<3;attempt++){
                try {({data}=await github.rest.actions.listArtifactsForRepo({...context.repo,per_page:100,page}));break;}
                catch(e){if(e.status<500||attempt===2)throw e;await new Promise(r=>setTimeout(r,1000));}
              }
              artifacts.push(...data.artifacts);
              if(data.artifacts.length<100)break;
              if(page===100)throw new Error('Inventory exceeded safety bound');
            }
            const live = artifacts.filter(a=>!a.expired);
            const groups = new Map();
            for (const a of live) {
              const g=groups.get(a.name)||{name:a.name,count:0,bytes:0,oldest:a.created_at,newest:a.created_at,ids:[]};
              g.count++;g.bytes+=a.size_in_bytes;g.oldest=[g.oldest,a.created_at].sort()[0];g.newest=[g.newest,a.created_at].sort().at(-1);
              groups.set(a.name,g);
            }
            console.log('AUDIT_TOTAL '+JSON.stringify({records:artifacts.length,live:live.length,bytes:live.reduce((n,a)=>n+a.size_in_bytes,0)}));
            for(const g of [...groups.values()].sort((a,b)=>b.bytes-a.bytes)) {delete g.ids;console.log('AUDIT_GROUP '+JSON.stringify(g));}
