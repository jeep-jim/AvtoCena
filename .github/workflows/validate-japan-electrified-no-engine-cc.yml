name: Validate Japan electrified no-engine route

on:
  push:
    branches:
      - "fix/japan-electrified-no-engine-cc"
    paths:
      - ".github/workflows/validate-japan-electrified-no-engine-cc.yml"

permissions:
  actions: read
  contents: write

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL: "20"
      PRESTIGE_RECOVERY_OUTPUT: japan-electrified-smoke.json
      PRESTIGE_RECOVERY_TARGET: "500"
      PRESTIGE_RECOVERY_CONCURRENCY: "12"
      SOURCE_ARTIFACT_ID: "9041021806"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply strict engine-less EV route and pending diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/catalog-live-recovery-japan-prestige.mjs')
          text = p.read_text()
          start = text.index('async function uniqueVariantEnrich(offer) {')
          end = text.index('\nasync function pool(rows, limit, worker) {', start)
          replacement = r'''async function uniqueVariantEnrich(offer) {
            const engineCc = Number(offer?.engineCc || 0);
            const year = Number(offer?.year || 0);
            if (!year) return offer;
            const match = await findVehicleModel(offer).catch(() => null);
            if (!match) return offer;
            const allVariants = await readVehicleKnowledgeVariants().catch(() => []);
            const baseVariants = allVariants.filter((variant) => {
              if (variant.active === false || variant.modelId !== match.model.id) return false;
              if (variant.yearFrom && year < variant.yearFrom) return false;
              if (variant.yearTo && year > variant.yearTo) return false;
              if (!compatibleText(variant.transmission, offer.transmission)) return false;
              if (!compatibleText(variant.fuel, offer.fuel)) return false;
              return true;
            });
            let variants = [];
            if (engineCc > 0) {
              variants = baseVariants.filter((variant) => {
                if (!(Number(variant.engineCc || 0) > 0)) return false;
                const tolerance = Math.max(20, Number(variant.engineCcTolerance || 80));
                return Math.abs(Number(variant.engineCc) - engineCc) <= tolerance;
              });
            } else {
              // Source-side EV auction results legitimately have no engine displacement.
              // Allow that only for an unambiguous exact/alias model match where every
              // active year-compatible knowledge variant is explicitly electric and
              // itself has no combustion displacement. This cannot turn mixed ICE/EV
              // model families into EVs by inference.
              const strictModelMatch = match.matchedBy !== "text" && Number(match.score || 0) >= 120;
              const allExplicitElectric = baseVariants.length > 0 && baseVariants.every((variant) =>
                String(variant.powertrainKind || "") === "electric" && !(Number(variant.engineCc || 0) > 0));
              if (strictModelMatch && allExplicitElectric) variants = baseVariants;
            }
            if (!variants.length) return offer;

            const powerHp = Number(offer.powerHp || 0) || uniqueNumber(variants, (variant) => variant.powerHp);
            const powerKw = Number(offer.powerKw || 0) || uniqueNumber(variants, (variant) => variant.powerKw) || (powerHp ? Math.round((powerHp / 1.359621617) * 10) / 10 : undefined);
            const fuel = offer.fuel || uniqueText(variants, (variant) => variant.fuel);
            const transmission = offer.transmission || uniqueText(variants, (variant) => variant.transmission);
            const drive = offer.drive || uniqueText(variants, (variant) => variant.drive);
            const generation = offer.generation || uniqueText(variants, (variant) => variant.generation);
            const powertrainKind = offer.powertrainKind && offer.powertrainKind !== "unknown" ? offer.powertrainKind : uniqueText(variants, (variant) => variant.powertrainKind) || offer.powertrainKind;
            const icePowerKw = Number(offer.icePowerKw || 0) || uniqueNumber(variants, (variant) => variant.icePowerKw);
            const power30MinKw = Number(offer.power30MinKw || 0) || uniqueNumber(variants, (variant) => variant.power30MinKw);
            const power30MinKwByMotor = offer.power30MinKwByMotor?.length ? offer.power30MinKwByMotor : uniqueNumberArray(variants, (variant) => variant.power30MinKwByMotor);
            const utilizationPowerKw = Number(offer.utilizationPowerKw || 0) || uniqueNumber(variants, (variant) => variant.utilizationPowerKw);
            const enriched = Boolean(powerHp || power30MinKw || utilizationPowerKw || icePowerKw || powertrainKind === "electric");

            return normalizeVehicleOfferSpecs({
              ...offer,
              powerHp: powerHp || offer.powerHp,
              powerKw: powerKw || offer.powerKw,
              fuel,
              transmission,
              drive,
              generation,
              powertrainKind,
              icePowerKw: icePowerKw || offer.icePowerKw,
              power30MinKw: power30MinKw || offer.power30MinKw,
              power30MinKwByMotor,
              utilizationPowerKw: utilizationPowerKw || offer.utilizationPowerKw,
              powerDataConfidence: offer.powerDataConfidence || (enriched ? "reference" : undefined),
              powerDataSource: offer.powerDataSource || (enriched ? uniqueText(variants, (variant) => variant.sourceUrl || variant.sourceType) || "vehicle-knowledge-unambiguous" : undefined),
              operational: {
                ...(offer.operational || {}),
                raw: {
                  ...(offer.operational?.raw || {}),
                  recoveryVariantIds: variants.map((variant) => variant.id).slice(0, 30),
                  recoveryVariantEngineCc: engineCc || null,
                  recoveryEngineLessElectricKnowledge: engineCc <= 0 && powertrainKind === "electric",
                  recoveryVehicleModelMatchScore: match.score,
                  recoveryVehicleModelMatchedBy: match.matchedBy,
                  recoveryUniquePowerHp: powerHp || null,
                  recoveryUniquePower30MinKw: power30MinKw || null,
                  recoveryUniqueUtilizationPowerKw: utilizationPowerKw || null,
                  recoveryBodySourceOnly: true,
                },
              },
            });
          }'''
          text = text[:start] + replacement + text[end:]
          old = '''  if (COMMERCIAL_RE.test(`${offer.make || ""} ${offer.model || ""} ${offer.trim || ""}`)) { reject("commercial"); return null; }
            if (!(Number(offer.engineCc || 0) > 0)) { reject("engine_cc"); return null; }
            offer = await uniqueVariantEnrich(offer);
            if (["electric", "series_hybrid", "other_hybrid"].includes(String(offer.powertrainKind || ""))) {
              offer = normalizeVehicleOfferSpecs(await enrichOfferWithCertifiedPower(offer));
            }
            let calculated;'''
          new = '''  if (COMMERCIAL_RE.test(`${offer.make || ""} ${offer.model || ""} ${offer.trim || ""}`)) { reject("commercial"); return null; }
            offer = await uniqueVariantEnrich(offer);
            // Certified documents may also classify a source-exact make/model/year
            // as electrified; calling this unconditionally is safe because the
            // reference matcher requires an exact make/model plus verified document.
            offer = normalizeVehicleOfferSpecs(await enrichOfferWithCertifiedPower(offer));
            if (!(Number(offer.engineCc || 0) > 0) && String(offer.powertrainKind || "") !== "electric") { reject("engine_cc"); return null; }
            let calculated;'''
          if text.count(old) != 1:
              raise SystemExit(f'prepared anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Validate patched source and types
        run: |
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          npm run typecheck
      - name: Download existing strict Prestige source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output prestige-source.zip
          mkdir -p prestige-source
          unzip -q prestige-source.zip -d prestige-source
          source_file="$(find prestige-source -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_RECOVERY_INPUT=$source_file" >> "$GITHUB_ENV"
      - name: Convert strict sold lots without publishing
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-electrified-no-engine-smoke
          path: japan-electrified-smoke.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated patch to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-live-recovery-japan-prestige.mjs
          git commit -m "Allow strictly identified engine-less EV auction lots" || exit 0
          git push origin HEAD:fix/japan-electrified-no-engine-cc
