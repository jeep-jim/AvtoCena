name: Patch catalog current-read generation guard
run-name: Patch current-read generation guard · ${{ github.sha }}

on:
  push:
    branches:
      - fix/catalog-current-read-generation-guard-r2-20260812

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic storage patch
        run: python3 scripts/patch-current-read-generation-guard-20260812.py
      - name: Add regression test if missing
        shell: bash
        run: |
          if [ ! -f tests/catalog-current-read-generation-guard.test.ts ]; then
            cat > tests/catalog-current-read-generation-guard.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const storage = fs.readFileSync(new URL("../apps/web/lib/catalog/storage.ts", import.meta.url), "utf8");

          test("current offer shard is trusted only for the active manifest generation", () => {
            assert.match(storage, /Promise\.all\(\[readManifest\(\), readCurrentOfferShard\(id\)\]\)/);
            assert.match(storage, /current\.generationId === manifest\.generationId/);
          });

          test("current search projection is trusted only for the active manifest generation", () => {
            assert.match(storage, /readCurrentSearchProjection\(currentProjectionScope\)/);
            assert.match(storage, /const \[manifest, current\] = await Promise\.all/);
            assert.ok((storage.match(/current\.generationId === manifest\.generationId/g) || []).length >= 2);
          });
          EOF
          fi
      - run: |
          node --import tsx --test tests/catalog-current-read-generation-guard.test.ts
          npm run typecheck
          npm run build
      - name: Commit patched code when changed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/lib/catalog/storage.ts tests/catalog-current-read-generation-guard.test.ts; then
            echo "storage already patched"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/catalog/storage.ts tests/catalog-current-read-generation-guard.test.ts
          git commit -m 'fix(catalog): reject stale mutable read aliases [generation-guard-patched]'
          git push origin HEAD:${GITHUB_REF_NAME}
