# Inert until this one exact reviewed approval marker is committed with the fixed title.
# Never add a cron or workflow_dispatch input to this source-only controller.
name: Collect one independent China delta with guarded recovery without publication
on:
  push:
    branches: [main]
    paths: [.github/market-runs/china-independent-daily-source-collect-v3.sha256]
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-china
  cancel-in-progress: false
jobs:
  collect:
    name: Collect one independent China delta with guarded recovery without publication
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Collect one independent China delta with guarded recovery without publication'
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f4dc98aaab916b29419d173994d66562aa5901f1
          path: daily-collect-worker
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify exact source worker and install locked deps with no service credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          readonly ops="$GITHUB_WORKSPACE/.github/operations/china-daily-source-collect-v1"
          readonly marker=".github/market-runs/china-independent-daily-source-collect-v3.sha256"
          readonly approved_sha="$(sha256sum "$ops/approved-collect.json" | cut -d ' ' -f 1)"
          printf '%s\n' "$approved_sha" | cmp -s - "$marker"
          (cd "$ops"; sha256sum --strict --check --status APPROVED_CODE.sha256)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD | wc -w)" = 1
          test "$(git rev-parse HEAD^^)" = af64ab02881540c39161de1e695c90e6ba465918
          test "$(git show -s --format=%P HEAD^ | wc -w)" = 1
          python3 - <<'PY3'
          import json,os,subprocess
          with open(os.environ['GITHUB_EVENT_PATH']) as f: event=json.load(f)
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          changes=event.get('commits') or []
          assert event.get('before')==parent and event.get('forced') is False and event.get('deleted') is False
          assert len(changes)==1 and event.get('head_commit',{}).get('id')==changes[0].get('id')==os.environ['GITHUB_SHA']
          PY3
          cmp -s <(git diff-tree --no-commit-id -r --name-status --no-renames -z HEAD^^ HEAD^) <(printf 'M\0%s\0M\0%s\0M\0%s\0M\0%s\0M\0%s\0'             .github/operations/china-daily-source-collect-v1/APPROVED_CODE.sha256             .github/operations/china-daily-source-collect-v1/approved-collect.json             .github/operations/china-daily-source-collect-v1/filter-source-result.py             .github/operations/china-daily-source-collect-v1/worker-overlay.patch             .github/workflows/china-independent-daily-source-collect-v1.yml)
          # Source-only overnight launch must fit genuine source authority from the accepted base.
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-20 23:30:00' +%s)"
          cmp -s <(git diff-tree --no-commit-id -r --name-status --no-renames -z HEAD^ HEAD) <(printf 'A\0%s\0' "$marker")
          test "$(git -C daily-collect-worker rev-parse HEAD)" = f4dc98aaab916b29419d173994d66562aa5901f1
          test "$(sha256sum daily-collect-worker/package-lock.json | cut -d ' ' -f 1)" = c0fa7c95f31d67a4025aec11095f7889842b32dfb1a6eb12fc64f3d89e9936eb
          git -C daily-collect-worker apply --check "$ops/worker-overlay.patch"
          git -C daily-collect-worker apply --index "$ops/worker-overlay.patch"
          expected_tree="$(jq -er '.workerTree' "$ops/approved-collect.json")"
          test "$(git -C daily-collect-worker write-tree)" = "$expected_tree"
          (cd daily-collect-worker; npm ci --ignore-scripts --no-audit --no-fund)
          git -C daily-collect-worker diff --exit-code
          test "$(git -C daily-collect-worker write-tree)" = "$expected_tree"
          test "$(df -Pm "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -ge 20000
      - name: Authenticate original immutable archive receipt (not supplier, no store credentials)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/china-daily-source-once.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' ERR
          readonly api=repos/jeep-jim/AvtoCena/actions
          (ulimit -f 128; timeout 40s gh api "$api/runs/44457059256" > "$scratch/run.json" 2>/dev/null)
          (ulimit -f 64; timeout 40s gh api "$api/artifacts/14500964905" > "$scratch/artifact.json" 2>/dev/null)
          (ulimit -f 32; timeout 40s gh api "$api/artifacts/14500964905/zip" > "$scratch/receipt.zip" 2>/dev/null)
          unset GH_TOKEN
          python3 .github/operations/china-daily-source-collect-v1/verify-original-receipt.py "$scratch"
          printf 'CHINA_DAILY_SOURCE_PRIVATE_TEMP=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Use existing protected private source scope; never publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_API_CHE168_KEY: ${{ secrets.AUTO_API_CHE168_KEY }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011
          YC_OBJECT_STORAGE_REGION: us-east-1
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_MAX_ATTEMPTS: '3'
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '35000'
          NODE_OPTIONS: ''
        run: |
          set -euo pipefail
          umask 077
          scratch="$CHINA_DAILY_SOURCE_PRIVATE_TEMP"
          [[ "$scratch" == "$RUNNER_TEMP"/china-daily-source-once.* ]]
          trap 'rm -rf -- "$scratch"' EXIT
          readonly ops="$GITHUB_WORKSPACE/.github/operations/china-daily-source-collect-v1"
          (cd "$ops"; sha256sum --strict --check --status APPROVED_CODE.sha256)
          readonly approved_sha="$(sha256sum "$ops/approved-collect.json" | cut -d ' ' -f 1)"
          rc=0
          export TMPDIR="$scratch"
          (cd daily-collect-worker; timeout -k 10s 19200s node --import tsx scripts/catalog-china-daily-source-once.mts \
            --approval "$ops/approved-collect.json" --approval-sha "$approved_sha" --dry-plan "$ops/approved-first-rev5.json" \
            --bootstrap-receipt "$scratch/original-receipt.json" --private-temp "$scratch" --private-result-file "$scratch/china-daily-archive-private.json") \
              > "$scratch/actor.stdout" 2> "$scratch/actor.stderr" || rc=$?
          unset GITHUB_TOKEN AUTO_API_CHE168_KEY YC_OBJECT_STORAGE_ACCESS_KEY_ID YC_OBJECT_STORAGE_SECRET_ACCESS_KEY
          python3 "$ops/filter-source-result.py" "$scratch" "$rc"
