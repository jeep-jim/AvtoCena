name: One-shot Georgia bundled knowledge conversion audit
run-name: Georgia bundled knowledge conversion audit · ${{ github.sha }}

on:
  push:
    branches:
      - audit/georgia-vehicle-knowledge-coverage-20260813
    paths:
      - .github/workflows/oneshot-georgia-bundled-knowledge-conversion-audit-20260813.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-bundled-vehicle-knowledge-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure current Georgia pending combustion coverage with bundled knowledge
        run: |
          node --import tsx --input-type=module <<'NODE'
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const knowledgeModule = await import('./apps/web/lib/catalog/vehicle-knowledge.ts');
          const knowledge = knowledgeModule.default || knowledgeModule;
          const pricingModule = await import('./apps/web/lib/catalog/customs-pricing.ts');
          const pricing = pricingModule.default || pricingModule;

          const [models, variants, offers] = await Promise.all([
            knowledge.readVehicleKnowledgeModels(),
            knowledge.readVehicleKnowledgeVariants(),
            storage.readMarketOffers('georgia'),
          ]);
          const pending = offers.filter((offer) => offer.sourceId === 'autopapa_georgia_open' && pricing.isPreliminaryPowerPendingCalculation(offer));
          const combustion = pending.filter((offer) => String(offer.powertrainKind || '') === 'combustion');
          const stats = { modelMatched:0, variantMatched:0, variantPowerRecovered:0, representativeOnlyRecovered:0, modelWithoutPower:0, noModel:0 };
          const variantExamples=[];
          const representativeExamples=[];
          const noVariant = new Map();
          for (const offer of combustion) {
            const match = await knowledge.findVehicleModel(offer);
            if (!match) { stats.noModel++; continue; }
            stats.modelMatched++;
            const variant = await knowledge.findVehicleVariant(match.model, offer);
            if (variant) {
              stats.variantMatched++;
              if (Number(variant.powerHp || 0) > 0) {
                stats.variantPowerRecovered++;
                if (variantExamples.length < 30) variantExamples.push({id:offer.sourceOfferId,make:offer.make,model:offer.model,year:offer.year,engineCc:offer.engineCc,fuel:offer.fuel,variantId:variant.id,powerHp:variant.powerHp,sourceType:variant.sourceType});
              }
              continue;
            }
            const representative=Number(match.model.representativePowerHp || 0);
            if (representative > 0) {
              stats.representativeOnlyRecovered++;
              if (representativeExamples.length < 30) representativeExamples.push({id:offer.sourceOfferId,make:offer.make,model:offer.model,year:offer.year,engineCc:offer.engineCc,fuel:offer.fuel,modelId:match.model.id,powerHp:representative,source:match.model.source});
            } else {
              stats.modelWithoutPower++;
              const key=`${offer.make}|${offer.model}|${offer.engineCc || 0}|${offer.year || 0}`;
              noVariant.set(key,(noVariant.get(key)||0)+1);
            }
          }
          const topNoVariant=[...noVariant.entries()].sort((a,b)=>b[1]-a[1]).slice(0,40).map(([key,count])=>({key,count}));
          console.log('KNOWLEDGE',JSON.stringify({models:models.length,variants:variants.length}));
          console.log('GEORGIA',JSON.stringify({total:offers.length,pending:pending.length,pendingCombustion:combustion.length}));
          console.log('COVERAGE',JSON.stringify(stats));
          console.log('VARIANT_EXAMPLES',JSON.stringify(variantExamples));
          console.log('REPRESENTATIVE_EXAMPLES',JSON.stringify(representativeExamples));
          console.log('TOP_MODEL_NO_VARIANT_POWER',JSON.stringify(topNoVariant));
          NODE
