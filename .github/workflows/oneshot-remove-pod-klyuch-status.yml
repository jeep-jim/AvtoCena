name: One-shot remove pod klyuch status copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-remove-pod-klyuch-status.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update from current main
        run: |
          git pull --ff-only origin main
      - name: Remove phrase from offer status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          s = p.read_text()
          old = 'Возможность покупки и финальную стоимость под ключ подтвердит менеджер.'
          new = 'Возможность покупки и финальную стоимость подтвердит менеджер.'
          if old not in s:
              raise SystemExit('target phrase not found')
          if s.count(old) != 1:
              raise SystemExit(f'unexpected target count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/oneshot-remove-pod-klyuch-status.yml
      - name: Publish safely
        run: |
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"
          git add -A
          git commit -m "Remove pod klyuch from offer status copy"
          git push origin HEAD:main
