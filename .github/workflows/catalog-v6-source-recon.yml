name: Catalog V6 · deep source reconnaissance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-v6-source-recon.yml"
      - "scripts/catalog-source-recon.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-v6-source-recon
  cancel-in-progress: true

jobs:
  recon:
    name: ${{ matrix.source_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        source_id:
          - kcar_korea_open
          - autoscout_europe_open
          - mobile_de_open
          - dubizzle_uae_open
          - myauto_georgia_list
          - autopapa_georgia_open
          - dongchedi_china_open
          - autohome_used_china_open
          - autohome_new_china_open
          - jpauc_japan_past_open
          - carvector_japan_stat_open
          - prestige_japan_auctions_open
          - auctiondatasearch_japan_open
          - jpcenter_japan_catalog_open
    env:
      CATALOG_RECON_SOURCE_ID: ${{ matrix.source_id }}
      CATALOG_RECON_OUTPUT_DIR: catalog-recon
      CATALOG_RECON_MAX_BODY_BYTES: "2500000"
      CATALOG_RECON_MAX_SCRIPTS: "12"
      CATALOG_RECON_TIMEOUT_MS: "30000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect live source structure without publishing
        run: node scripts/catalog-source-recon.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recon-${{ matrix.source_id }}
          path: catalog-recon/
          if-no-files-found: warn
          retention-days: 1
