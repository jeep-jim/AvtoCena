name: Regcloud — remove reviewed obsolete VM copies
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply the exact reviewed VM inventory
      expected_plan_sha256:
        type: string
        default: ''
        description: Exact reviewed plan hash required for apply
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-reviewed-vm-cleanup.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: regcloud-failed-encar-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact cleanup and preserved production safeguards
        run: |
          python3 tests/regcloud-reviewed-vm-cleanup.test.py
          python3 tests/regcloud-failed-encar-retention.test.py
      - name: Bind completed read-only inventory and exact reviewed plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,urllib.request
          spec=importlib.util.spec_from_file_location('cleanup','scripts/regcloud-reviewed-vm-cleanup.py')
          cleanup=importlib.util.module_from_spec(spec);spec.loader.exec_module(cleanup)
          plan=json.loads(pathlib.Path('docs/operations/2026-11-16-vm-cleanup-plan.json').read_text())
          assert cleanup.digest(plan)==cleanup.PLAN_SHA256
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME']=='push':
              marker=json.loads(pathlib.Path('.github/market-runs/regcloud-reviewed-vm-cleanup.json').read_text())
              assert marker['inventoryRunId']==plan['inventoryRunId'] and marker['inventorySource']==plan['inventorySource']
              apply=marker['apply'];assert isinstance(apply,bool)
              expected=marker.get('expectedPlanSha256','')
          else:
              inputs=event.get('inputs',{})
              assert inputs.get('apply','false') in ['false','true',False,True]
              apply=inputs.get('apply','false') in ['true',True]
              expected=inputs.get('expected_plan_sha256','')
          assert (apply and expected==cleanup.PLAN_SHA256) or (not apply and expected in ['',cleanup.PLAN_SHA256])
          url='https://api.github.com/repos/jeep-jim/AvtoCena/actions/runs/'+str(plan['inventoryRunId'])
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'AvtoCena-Reviewed-VM-Cleanup'})
          with urllib.request.urlopen(request,timeout=30) as response:run=json.load(response)
          assert run['id']==plan['inventoryRunId'] and run['head_sha']==plan['inventorySource']
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_branch']=='main'
          assert run['path']=='.github/workflows/regcloud-vm-storage-inventory.yml'
          safe=pathlib.Path('scripts/regcloud-failed-encar-retention.py').read_text()
          assert hashlib.sha256(safe.encode()).hexdigest()==cleanup.SAFEGUARDS_SHA256
          source=pathlib.Path('scripts/regcloud-reviewed-vm-cleanup.py').read_text()
          bundle='import json,types,sys\n'
          bundle+='safe=types.ModuleType("retention_safeguards")\nexec(compile('+repr(safe)+',"retention_safeguards","exec"),safe.__dict__)\n'
          bundle+='cleanup=types.ModuleType("reviewed_vm_cleanup")\nexec(compile('+repr(source)+',"reviewed_vm_cleanup","exec"),cleanup.__dict__)\n'
          bundle+='plan=json.loads('+repr(json.dumps(plan))+')\n'
          bundle+='try:\n cleanup.main(safe,plan)\nexcept Exception as error:\n print(json.dumps({"event":"reviewed_vm_cleanup_refused","error":str(error) if isinstance(error,(cleanup.Refused,safe.GuardError)) else type(error).__name__}),flush=True)\n sys.exit(1)\n'
          compile(bundle,'reviewed_vm_cleanup_bundle','exec')
          pathlib.Path(os.environ['RUNNER_TEMP'],'reviewed-vm-cleanup.py').write_text(bundle)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('apply='+str(apply).lower()+'\nplan='+cleanup.PLAN_SHA256+'\n')
          print(json.dumps({'inventoryRunId':run['id'],'inventorySource':run['head_sha'],'apply':apply,'planSha256':cleanup.PLAN_SHA256,'containers':len(plan['containers']),'images':len(plan['images']),'protectedReleases':plan['protectedReleases']}))
          PY
      - name: Recheck all references and remove only the reviewed copies if selected
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          APPLY: ${{ steps.plan.outputs.apply }}
          EXPECTED_PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file" "$RUNNER_TEMP/reviewed-vm-cleanup.py"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          args=(nice -n 15 python3 -)
          if [ "$APPLY" = true ]; then
            [[ "$EXPECTED_PLAN" =~ ^[a-f0-9]{64}$ ]]
            args+=(--apply --expected-plan-sha256 "$EXPECTED_PLAN")
          else
            test "$APPLY" = false
          fi
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 "${args[@]}" < "$RUNNER_TEMP/reviewed-vm-cleanup.py" | tee reviewed-vm-cleanup.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-vm-cleanup
          path: reviewed-vm-cleanup.jsonl
          retention-days: 14
          if-no-files-found: warn
