name: Catalog live recovery · UAE + Kyrgyzstan
run-name: Independent UAE + Kyrgyzstan recovery · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recovery and current seven-market baseline
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-uaekg-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":5000,"japan":0,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: |
          set -euo pipefail
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-uaekg-preflight-audit
          path: catalog-uaekg-preflight-audit.json
          if-no-files-found: warn
          retention-days: 3

  collect-uae-dubizzle:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_MARKET: uae
      RECOVERY_SOURCE_IDS: dubizzle_uae_open
      RECOVERY_OUTPUT: catalog-shard-uae-dubizzle_uae_open.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact-bound Dubizzle source shard
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-uae-dubizzle_uae_open
          path: catalog-shard-uae-dubizzle_uae_open.json
          if-no-files-found: warn
          retention-days: 3

  collect-uae-dubicars:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_DIRECT_MARKET: uae
      RECOVERY_OUTPUT: catalog-shard-uae-dubicars_uae_exact.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect DubiCars exact source shard
        run: npx tsx scripts/catalog-live-recovery-direct-exact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-uae-dubicars_uae_exact
          path: catalog-shard-uae-dubicars_uae_exact.json
          if-no-files-found: warn
          retention-days: 3

  collect-kyrgyzstan:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_MARKET: kyrgyzstan
      RECOVERY_SOURCE_IDS: mashina_kyrgyzstan_exact
      RECOVERY_OUTPUT: catalog-shard-kyrgyzstan-mashina_kyrgyzstan_exact.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect Mashina.kg exact-detail shard
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-kyrgyzstan-mashina_kyrgyzstan_exact
          path: catalog-shard-kyrgyzstan-mashina_kyrgyzstan_exact.json
          if-no-files-found: warn
          retention-days: 3

  merge-uae:
    needs: [validate, collect-uae-dubizzle, collect-uae-dubicars]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-shard-uae-*
          path: shard-input
          merge-multiple: true
      - name: Merge available UAE source shards
        env:
          RECOVERY_MERGE_MARKET: uae
          RECOVERY_MERGE_INPUT_DIR: shard-input
          RECOVERY_MERGE_OUTPUT: catalog-rebuild-uae.json
        run: node scripts/catalog-live-recovery-merge-shards.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-uae-merged
          path: catalog-rebuild-uae.json
          retention-days: 3

  merge-kyrgyzstan:
    needs: [validate, collect-kyrgyzstan]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-shard-kyrgyzstan-*
          path: shard-input
          merge-multiple: true
      - name: Merge Kyrgyzstan source shard
        env:
          RECOVERY_MERGE_MARKET: kyrgyzstan
          RECOVERY_MERGE_INPUT_DIR: shard-input
          RECOVERY_MERGE_OUTPUT: catalog-rebuild-kyrgyzstan.json
        run: node scripts/catalog-live-recovery-merge-shards.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-kyrgyzstan-merged
          path: catalog-rebuild-kyrgyzstan.json
          retention-days: 3

  publish-uae:
    needs: [validate, merge-uae]
    if: needs.validate.result == 'success' && needs.merge-uae.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-uae-merged
          path: recovery-input
      - name: Publish UAE while preserving all seven markets
        env:
          RECOVERY_PUBLISH_MARKET: uae
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-uae.json
          RECOVERY_PUBLISH_REPORT: catalog-live-recovery-uae-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
          CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit UAE and guard the seven-market baseline
        if: always()
        env:
          CATALOG_AUDIT_OUTPUT: catalog-uae-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: uae
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":5000,"japan":0,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-uae-publish-reports
          path: |
            catalog-live-recovery-uae-publish-report.json
            catalog-uae-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3

  publish-kyrgyzstan:
    needs: [validate, merge-kyrgyzstan]
    if: needs.validate.result == 'success' && needs.merge-kyrgyzstan.result == 'success'
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-kyrgyzstan-merged
          path: recovery-input
      - name: Publish Kyrgyzstan independently of UAE source health
        env:
          RECOVERY_PUBLISH_MARKET: kyrgyzstan
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-kyrgyzstan.json
          RECOVERY_PUBLISH_REPORT: catalog-live-recovery-kyrgyzstan-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
          CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit Kyrgyzstan and guard the seven-market baseline
        if: always()
        env:
          CATALOG_AUDIT_OUTPUT: catalog-kyrgyzstan-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: kyrgyzstan
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":5000,"japan":0,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-kyrgyzstan-publish-reports
          path: |
            catalog-live-recovery-kyrgyzstan-publish-report.json
            catalog-kyrgyzstan-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
