name: Catalog live recovery · UAE + Kyrgyzstan
run-name: Source-sharded UAE + Kyrgyzstan recovery · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "55 20 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-live-recovery-uae-kyrgyzstan.yml"

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recovery and current seven-market baseline
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-uaekg-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-uaekg-preflight-audit
          path: catalog-uaekg-preflight-audit.json
          if-no-files-found: warn
          retention-days: 3

  collect-uae-dubizzle:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_MARKET: uae
      RECOVERY_SOURCE_IDS: dubizzle_uae_open
      RECOVERY_OUTPUT: catalog-shard-uae-dubizzle_uae_open.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact-bound Dubizzle source shard
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-uae-dubizzle_uae_open
          path: catalog-shard-uae-dubizzle_uae_open.json
          if-no-files-found: warn
          retention-days: 3

  collect-uae-dubicars:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_DIRECT_MARKET: uae
      RECOVERY_OUTPUT: catalog-shard-uae-dubicars_uae_exact.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect DubiCars exact source shard
        run: npx tsx scripts/catalog-live-recovery-direct-exact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-uae-dubicars_uae_exact
          path: catalog-shard-uae-dubicars_uae_exact.json
          if-no-files-found: warn
          retention-days: 3

  collect-kyrgyzstan:
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_MARKET: kyrgyzstan
      RECOVERY_SOURCE_IDS: mashina_kyrgyzstan_exact
      RECOVERY_OUTPUT: catalog-shard-kyrgyzstan-mashina_kyrgyzstan_exact.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect Mashina.kg exact-detail shard
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-kyrgyzstan-mashina_kyrgyzstan_exact
          path: catalog-shard-kyrgyzstan-mashina_kyrgyzstan_exact.json
          if-no-files-found: warn
          retention-days: 3

  merge:
    needs: [validate, collect-uae-dubizzle, collect-uae-dubicars, collect-kyrgyzstan]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-shard-*
          path: shard-input
      - name: Merge successful source shards per market
        shell: bash
        run: |
          set -euo pipefail
          merged=""
          for market in uae kyrgyzstan; do
            RECOVERY_MERGE_MARKET="$market" RECOVERY_MERGE_INPUT_DIR="shard-input" RECOVERY_MERGE_OUTPUT="catalog-rebuild-${market}.json" node scripts/catalog-live-recovery-merge-shards.mjs && merged="$merged $market" || true
          done
          echo "merged=$merged" >> "$GITHUB_STEP_SUMMARY"
          test -n "$merged"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-uaekg-merged
          path: catalog-rebuild-*.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [validate, merge]
    if: always() && needs.validate.result == 'success' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-uaekg-merged
          path: recovery-input
      - name: Publish UAE then Kyrgyzstan serially while preserving all seven
        shell: bash
        run: |
          set +e
          published=""
          failed=""
          for market in uae kyrgyzstan; do
            input="recovery-input/catalog-rebuild-${market}.json"
            if [ ! -s "$input" ]; then failed="$failed $market(no-artifact)"; continue; fi
            export RECOVERY_PUBLISH_MARKET="$market"
            export RECOVERY_PUBLISH_INPUT="$input"
            export RECOVERY_PUBLISH_REPORT="catalog-live-recovery-${market}-publish-report.json"
            export RECOVERY_PUBLISH_MAX="30000"
            if npx tsx scripts/catalog-live-recovery-publish.mjs; then published="$published $market"; else failed="$failed $market"; fi
          done
          echo "published=$published" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          test -n "$published"
      - name: Audit all seven markets after publish
        if: always()
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-uaekg-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: uae,kyrgyzstan
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-uae-kyrgyzstan-publish-reports
          path: |
            catalog-live-recovery-*-publish-report.json
            catalog-uaekg-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
