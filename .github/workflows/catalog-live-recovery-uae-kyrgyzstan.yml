name: Catalog live recovery · UAE + Kyrgyzstan
run-name: UAE + Kyrgyzstan recovery · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "55 20 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-live-recovery-uae-kyrgyzstan.yml"
      - "scripts/catalog-live-recovery-kyrgyzstan-direct.mjs"
      - "scripts/catalog-live-recovery-direct-exact.mjs"
      - "scripts/catalog-live-recovery-publish.mjs"
      - "apps/web/lib/catalog/dubicars-current-source.ts"
      - "apps/web/lib/catalog/mashina-kyrgyzstan-list-source.ts"

permissions:
  contents: read

# This recovery and the daily Korea/China/Europe/Georgia recovery both perform
# read-preserve-write catalog publication. They must never overlap, otherwise
# a publisher that started from an older generation can restore stale counts
# for markets published by the other workflow while it was running.
concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          npm run typecheck

  collect-uae:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECOVERY_DIRECT_MARKET: uae
      RECOVERY_OUTPUT: catalog-rebuild-uae.json
      RECOVERY_TARGET: "3000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact UAE cards from DubiCars
        run: npx tsx scripts/catalog-live-recovery-direct-exact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-uae
          path: catalog-rebuild-uae.json
          if-no-files-found: warn
          retention-days: 3

  collect-kyrgyzstan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECOVERY_OUTPUT: catalog-rebuild-kyrgyzstan.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "240"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact Mashina.kg cards and safely enrich calculation fields
        run: npx tsx scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-kyrgyzstan
          path: catalog-rebuild-kyrgyzstan.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [validate, collect-uae, collect-kyrgyzstan]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-recovery-*
          path: recovery-input
          merge-multiple: true
      - name: Publish each successful market cumulatively and independently
        shell: bash
        run: |
          set +e
          published=""
          failed=""
          for market in uae kyrgyzstan; do
            input="recovery-input/catalog-rebuild-${market}.json"
            if [ ! -s "$input" ]; then
              echo "$market: no usable artifact"
              failed="$failed $market(no-artifact)"
              continue
            fi
            export RECOVERY_PUBLISH_MARKET="$market"
            export RECOVERY_PUBLISH_INPUT="$input"
            export RECOVERY_PUBLISH_REPORT="catalog-live-recovery-${market}-publish-report.json"
            export RECOVERY_PUBLISH_MAX="100000"
            if npx tsx scripts/catalog-live-recovery-publish.mjs; then
              published="$published $market"
            else
              failed="$failed $market"
            fi
          done
          echo "published=$published" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          test -n "$published"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-recovery-uae-kyrgyzstan-publish-reports
          path: catalog-live-recovery-*-publish-report.json
          if-no-files-found: warn
          retention-days: 3
