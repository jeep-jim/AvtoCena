# LOCAL REVIEW TEMPLATE: exact source and evidence pins required; strict frozen speed gates.
name: Release paid Korea insurance history
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/release-paid-korea-history.yml
permissions:
  contents: read
  actions: read
env:
  RELEASE_SOURCE_SHA: e4f2781ed52f12f53430118bea51ef150608ccfe
  RELEASE_PREPARATION_MARKETS: korea
  HISTORY_RELEASE_MANIFEST: '{"source":"e4f2781ed52f12f53430118bea51ef150608ccfe","tree":"9fd66cec3eee3fa887312dcc68704fe3cacc50b0","pr":1775,"allowedPaths":[".github/workflows/verify-korea-reports.yml","apps/web/app/(public)/cars/offer/[id]/history-identity.ts","apps/web/app/(public)/cars/offer/[id]/page.tsx","apps/web/app/api/catalog/korea-report/paid-report-reader.ts","apps/web/app/api/catalog/korea-report/route.ts","apps/web/app/api/catalog/recommendations/data.ts","apps/web/components/catalog/KoreaReportPanel.tsx","apps/web/components/catalog/PaidKoreaReportPanel.tsx","apps/web/components/catalog/paid-korea-report-contract.ts","tests/browser/paid-korea-report-fixture.tsx","tests/browser/paid-korea-report-live.mjs","tests/browser/paid-korea-report.mjs","tests/fixtures/paid-korea-report.json","tests/paid-korea-report-contract.test.ts","tests/paid-korea-report-live.test.ts","tests/paid-korea-report-reader.test.ts","tests/paid-korea-report-recommendations.test.ts","tests/paid-korea-report-render.test.ts"]}'
  HISTORY_BACKFILL_RUN_ID: '43823438297'
  HISTORY_BACKFILL_SOURCE_SHA: 49328a36d8943372a684b067346220fd0719a58b
  HISTORY_BACKFILL_ARTIFACT_ID: '14206780690'
  HISTORY_BACKFILL_ZIP_SHA256: b584e16a2c18a36701c4fccc17f4aa05efc4541ccf4d2ffd3283af02c709c79a
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release paid Korea insurance history
      from installed 83')
    environment: regcloud-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    outputs:
      deferred_china_job: ${{ steps.defer_china.outputs.job_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: e4f2781ed52f12f53430118bea51ef150608ccfe
        fetch-depth: 32
    - name: Install exact successor source guard
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/verify-history-candidate.py" <<'HISTORY_SOURCE_HELPER'
        import json
        import os
        import re
        import subprocess
        import time
        import urllib.request

        RETAINED = '83ff17075e9188dcf227c8752dc064248d5f42e0'
        CALCULATOR = '4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90'
        REQUIRED = {'CI', 'Verify site controls and chat', 'Verify green corner budget',
                    'Verify Korea report disclosure', 'Verify city picker',
                    'QR and gallery browser QA', 'Verify owner UI polish'}


        def validate_spec(spec):
            assert re.fullmatch('[a-f0-9]{40}', spec['source']), 'candidate_source_not_pinned'
            assert spec['source'] != RETAINED, 'successor_must_differ_from_retained'
            assert re.fullmatch('[a-f0-9]{40}', spec['tree']), 'candidate_tree_not_pinned'
            assert type(spec['pr']) is int and spec['pr'] > 1774, 'separate_candidate_pr_required'
            paths = spec['allowedPaths']
            assert paths and len(paths) == len(set(paths)), 'candidate_path_manifest_invalid'
            assert all('..' not in p.split('/') and not p.startswith('/') for p in paths), 'candidate_path_invalid'
            assert all(p.startswith(('apps/web/app/', 'apps/web/components/', 'tests/')) or
                       p == '.github/workflows/verify-korea-reports.yml' for p in paths), 'candidate_scope_exceeds_ui_api_tests'
            assert any(p.startswith('apps/web/') for p in paths), 'candidate_app_changes_missing'
            return spec


        def verify_candidate(spec, api, health, clock=time.monotonic, pause=time.sleep, wait_seconds=1200):
            validate_spec(spec)
            sha = spec['source']
            commit = api('commits/' + sha)
            assert commit['sha'] == sha and commit['commit']['tree']['sha'] == spec['tree'], 'candidate_commit_changed'
            deadline = clock() + wait_seconds
            while True:
                pr = api('pulls/' + str(spec['pr']))
                assert pr['state'] == 'open' and pr['head']['sha'] == sha and pr['base']['sha'] == RETAINED, 'candidate_pr_changed'
                runs = api('actions/runs?head_sha=' + sha + '&per_page=100')
                assert 0 < runs['total_count'] <= 100, 'source_check_inventory_invalid'
                rows = runs['workflow_runs']
                assert len(rows) == runs['total_count'], 'source_check_inventory_incomplete'
                for row in rows:
                    assert row['head_sha'] == sha, 'source_check_identity_changed'
                    assert row['status'] != 'completed' or row['conclusion'] == 'success', 'exact_source_check_failed:' + str(row['id'])
                if REQUIRED <= {row['name'] for row in rows} and all(row['status'] == 'completed' and row['conclusion'] == 'success' for row in rows):
                    break
                assert clock() < deadline, 'source_checks_wait_deadline'
                print(json.dumps({'stage': 'waiting_exact_source_checks', 'source': sha}), flush=True)
                pause(20)
            value = health()
            assert value.get('ok') is True and value.get('releaseSha') == RETAINED, 'retained_release_changed'
            assert value.get('calculationVersion') == CALCULATOR, 'retained_calculator_changed'
            return {'source': sha, 'tree': spec['tree'], 'pr': spec['pr'], 'checks': len(rows), 'retained': RETAINED}


        def main():
            spec = validate_spec(json.loads(os.environ['HISTORY_RELEASE_MANIFEST']))
            assert os.environ['RELEASE_SOURCE_SHA'] == spec['source'], 'controller_source_environment_changed'
            assert os.environ['GITHUB_REPOSITORY'] == 'jeep-jim/AvtoCena', 'repository_changed'
            def git(args):
                return subprocess.check_output(['git'] + args, text=True, timeout=30).strip()
            assert git(['rev-parse', 'HEAD']) == spec['source'], 'candidate_checkout_changed'
            assert git(['rev-parse', 'HEAD^{tree}']) == spec['tree'], 'candidate_checkout_tree_changed'
            git(['merge-base', '--is-ancestor', RETAINED, 'HEAD'])
            changed = git(['diff', '--name-only', RETAINED, 'HEAD']).splitlines()
            assert sorted(changed) == sorted(spec['allowedPaths']), 'candidate_allowed_paths_changed'
            actual = subprocess.check_output(['node', 'scripts/catalog-calculation-version.mjs'], text=True, timeout=30).strip()
            assert actual == CALCULATOR, 'calculation_closure_changed_prepare_separately'
            def api(path):
                return json.loads(subprocess.check_output(['gh', 'api', 'repos/jeep-jim/AvtoCena/' + path], timeout=60))
            def health():
                request = urllib.request.Request('https://avtocena.com/api/health', headers={'Cache-Control': 'no-cache'})
                with urllib.request.urlopen(request, timeout=45) as response:
                    assert response.status == 200, 'retained_health_http'
                    raw = response.read(32769)
                    assert len(raw) <= 32768, 'retained_health_size'
                    return json.loads(raw)
            print(json.dumps(verify_candidate(spec, api, health)))


        if __name__ == '__main__':
            main()
        HISTORY_SOURCE_HELPER
        printf '%s  %s\n' 7d2ef42fd6be0c538edffc9ac404599f08d8c21c76db056016342f03b0c7c4b2 "$RUNNER_TEMP/verify-history-candidate.py" | sha256sum --check
    - name: Verify reviewed successor, retained 83 and every source check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git fetch --depth=1 origin 83ff17075e9188dcf227c8752dc064248d5f42e0
        python3 "$RUNNER_TEMP/verify-history-candidate.py"
    - name: Restore the reviewed release tooling without changing candidate source
      run: |
        set -euo pipefail
        # Import the existing release checks and tooling from the last validated controller.
        git fetch --depth=1 origin 26d640eacbaf9139bb9c53df1dfcccb90c70ffbb
        git restore --source=26d640eacbaf9139bb9c53df1dfcccb90c70ffbb -- .github/workflows/ci.yml .github/workflows/encyclopedia-activate-prepared.yml .github/workflows/encyclopedia-release.yml .github/workflows/owner-accept-prepared-873.yml .github/workflows/owner-resume-prepared-release.yml .github/workflows/regcloud-activate-release.yml .github/workflows/regcloud-activate.yml .github/workflows/regcloud-deploy.yml .github/workflows/regcloud-memory.yml .github/workflows/regcloud-overview.yml .github/workflows/regcloud-resume-japan.yml .github/workflows/regcloud-resume-korea-release.yml docs/operations/2026-11-11-accepted-browser-speed-baseline.json docs/operations/2026-11-11-accepted-speed-baseline.json docs/operations/2026-11-11-accepted-speed-browser-restored.json docs/operations/2026-11-11-budget-browser-idle.json docs/operations/2026-11-13-trucks-grid-release-manifest.json scripts/catalog-refresh-generation-pages.mjs scripts/lib/accepted-browser-speed.mjs scripts/lib/catalog-refresh-generation-pages.mjs scripts/regcloud-browser-verdict.py scripts/regcloud-deploy-production.sh scripts/regcloud-deploy-with-browser.sh scripts/regcloud-performance-gate.py scripts/regcloud-release-retention.py scripts/verify-frozen-speed-baselines.mjs tests/accepted-browser-speed.test.mjs tests/ajes-page-failure-evidence.test.ts tests/ajes-request-size.test.ts tests/browser/owner-filter-speed-live.mjs tests/catalog-refresh-generation-pages.test.mjs tests/catalog-truck-aliases.test.ts tests/green-corner-rail-visible.test.ts tests/regcloud-browser-handoff.test.py tests/regcloud-browser-verdict.test.py tests/regcloud-performance-gate.test.py tests/regcloud-release-retention.test.py tests/release-speed-guard-contract.test.mjs
        git restore --source="$RELEASE_SOURCE_SHA" -- scripts/catalog-refresh-generation-pages.mjs scripts/lib/catalog-refresh-generation-pages.mjs tests/catalog-refresh-generation-pages.test.mjs
        python3 - <<'POOL_ENV'
        from pathlib import Path
        p=Path('scripts/regcloud-deploy-production.sh');value=p.read_text()
        assert value.count('overrides={')==1 and 'UV_THREADPOOL_SIZE' not in value
        p.write_text(value.replace('overrides={',"overrides={'UV_THREADPOOL_SIZE':'16','VIPS_CONCURRENCY':'1',",1))
        POOL_ENV
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
        cache: npm
    - run: |
        set -euo pipefail
        export GITHUB_SHA="$RELEASE_SOURCE_SHA"
        npm ci
    - name: Verify frozen release mechanics and catalog changes
      run: |
        set -euo pipefail
        test "$(node scripts/catalog-calculation-version.mjs)" = 4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90
        node scripts/verify-frozen-speed-baselines.mjs
        node --test tests/release-speed-guard-contract.test.mjs
        node --test tests/accepted-browser-speed.test.mjs
        python3 tests/regcloud-performance-gate.test.py
        python3 tests/regcloud-browser-verdict.test.py
        python3 tests/regcloud-browser-handoff.test.py
        python3 tests/regcloud-release-retention.test.py
        npm run typecheck
        node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-market-brand-projection.test.ts tests/china-source-switch.test.ts
    - name: Install private release evidence preservation
      run: |
        cat > "$RUNNER_TEMP/preserve-release-evidence.mjs" <<'DURABLE_RELEASE_EVIDENCE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import {createHash} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import {fileURLToPath,pathToFileURL} from 'node:url';

        const names=new Set(['encyclopedia-coverage','astra-release-verification','market-preparation','reused-store-readiness','private-index-reuse','paid-korea-history','browser-acceptance','encyclopedia-public-release']);
        const digest=value=>createHash('sha256').update(value).digest('hex');

        export async function preserveEvidence({storage,filename,name,release,runId,attempt,calculationVersion,required,expectedMarkets=[],summaryFile}){
         assert.equal(storage.driver,'object','private_object_storage_required');
         assert.match(release,/^[a-f0-9]{40}$/);
         assert.match(calculationVersion,/^[a-f0-9]{64}$/);
         assert.match(runId,/^[1-9][0-9]*$/);
         assert.match(attempt,/^[1-9][0-9]*$/);
         assert.ok(names.has(name),'unknown_evidence_name');
         if(!fs.existsSync(filename)){
          assert.equal(required,false,'successful_step_missing_evidence:'+name);
          return {name,produced:false};
         }
         const size=fs.statSync(filename).size;
         assert.ok(size>0&&size<=64*1024*1024,'evidence_size_invalid');
         const raw=fs.readFileSync(filename),report=JSON.parse(raw.toString('utf8'));
         assert.ok(report&&typeof report==='object'&&!Array.isArray(report),'evidence_report_invalid');
         if(required&&name==='market-preparation'){
          assert.ok(expectedMarkets.length>0&&new Set(expectedMarkets).size===expectedMarkets.length,'expected_scope_invalid');
          assert.deepEqual([...report.markets].sort(),[...expectedMarkets].sort(),'prepared_scope_changed');
          assert.equal(report.results?.length,expectedMarkets.length,'prepared_results_incomplete');
          assert.deepEqual(report.results.map(row=>row.market).sort(),[...expectedMarkets].sort(),'prepared_markets_incomplete');
          assert.ok(report.results.every(row=>row.status==='success'&&!row.error),'market_preparation_failed');
          const manifest=await storage.readJson('catalog/manifest.json',null);
          assert.ok(report.generationId&&report.generationId===manifest?.generationId,'prepared_generation_changed');
         }
         if(required&&name==='browser-acceptance'){
          assert.equal(report.release,release,'browser_release_changed');
          assert.equal(report.passed,true,'browser_acceptance_failed');
          assert.equal(report.browserPassed,true,'browser_functional_failed');
          assert.ok(report.speedGuard && Array.isArray(report.speedGuard.checks),'browser_speed_measurement_missing');
          assert.ok(report.speedGuard.requestChecks.every(row=>row.passed),'browser_request_regression');
          assert.equal(report.speedGuard.passed,true,'browser_speed_regression');
         }
         if(required&&name==='reused-store-readiness'){
          assert.equal(report.releaseSha,release);assert.equal(report.calculationVersion,calculationVersion);
          assert.equal(report.passed,true);assert.equal(report.verifyOnly,true);assert.equal(report.pricesVerified,true);assert.equal(report.writes,0);
          assert.ok(report.requiredMarkets.length>0&&report.partitions.length===report.requiredMarkets.length);
          assert.ok(report.partitions.every(row=>/^[a-f0-9]{64}$/.test(row.prices?.fingerprint||'')));
         }
         if(required&&name==='private-index-reuse'){assert.equal(report.releaseSha,release);assert.equal(report.passed,true);assert.equal(report.prepared,false);assert.equal(report.sourceStateUnchanged,true);}
         if(required&&name==='paid-korea-history'){assert.equal(report.release,release);assert.equal(report.passed,true);assert.match(report.nonce,/^[a-f0-9]{32}$/);assert.match(report.receiptSha256,/^[a-f0-9]{64}$/);}
         const envelope={schemaVersion:1,releaseSha:release,calculationVersion,runId,runAttempt:attempt,name,reportSha256:digest(raw),reportText:raw.toString('utf8')};
         const key=`operations/release-evidence/${release}/${runId}-${attempt}/${name}.json`;
         try{await storage.writeJson(key,envelope,{ifNoneMatch:'*'});}
         catch(error){if(error?.name!=='StorageConflictError')throw error;}
         const saved=await storage.readJson(key,null);
         assert.deepEqual(saved,envelope,'release_evidence_readback_mismatch');
         assert.equal(digest(saved.reportText),envelope.reportSha256,'release_evidence_hash_mismatch');
         const receipt={name,key,releaseSha:release,runId,runAttempt:attempt,sha256:envelope.reportSha256,produced:true};
         if(summaryFile)fs.appendFileSync(summaryFile,`\nPrivate release evidence: ${name}\n\nObject: \`${key}\`\n\nSHA256: \`${receipt.sha256}\`\n`);
         return receipt;
        }

        async function main(){
         const imported=await import(pathToFileURL(path.resolve('apps/web/lib/data.ts')).href);
         const getJsonStorage=imported.getJsonStorage||imported.default?.getJsonStorage;
         assert.equal(typeof getJsonStorage,'function');
         const calculator=process.env.AVTOCENA_CALCULATION_VERSION||execFileSync(process.execPath,['scripts/catalog-calculation-version.mjs'],{encoding:'utf8'}).trim();
         const receipt=await preserveEvidence({storage:getJsonStorage(),filename:process.argv[2],name:process.argv[3],release:process.env.RELEASE_SOURCE_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,calculationVersion:calculator,required:process.env.REQUIRE_EVIDENCE==='true',expectedMarkets:(process.env.RELEASE_PREPARATION_MARKETS||'china,korea,japan,europe,uae,georgia').split(','),summaryFile:process.env.GITHUB_STEP_SUMMARY});
         console.log('RELEASE_EVIDENCE_PRESERVED',JSON.stringify(receipt));
        }
        if(import.meta.url.startsWith('file:')&&process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url))await main();
        DURABLE_RELEASE_EVIDENCE
      id: evidence_helper
    - name: Install exact controller-only selector readiness verifier
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/prepare-paid-selector-readiness.mjs" <<'PAID_SELECTOR_HELPER'
        import assert from 'node:assert/strict';
        import {createHash} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import {fileURLToPath, pathToFileURL} from 'node:url';

        export const CALCULATOR = '4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90';
        const LOCAL_MARKETS = ['china', 'korea', 'uae', 'europe', 'georgia'];
        const digest = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
        function partitionIdentities(index, market) {
          const hash = createHash('sha256'), ids = new Set();
          for (const [kind, rows] of [['rows', index.rows], ['otherRows', index.otherRows || []]]) {
            hash.update(kind + '\0');
            for (const row of rows) {
              assert.equal(row[0], market, `selector_identity_market:${market}`);
              const id = row[5]?.id;
              assert.ok(typeof id === 'string' && id && !ids.has(id), `selector_identity_invalid:${market}`);
              ids.add(id); hash.update(JSON.stringify(id) + '\0');
            }
          }
          return hash.digest('hex');
        }

        /** Controller-only task. Use candidate implementations; never copy app logic. */
        export async function ensurePaidSelectorReadiness({storage, backfill, readCompressedSelector,
          selectorDirectory, indexDigest, expectedSource, verifyOnly = false, verifyPrices = false,
          budgetPricingFingerprint, readPreparedBudgetPrices, progress = () => {}}) {
          assert.match(expectedSource, /^[a-f0-9]{40}$/, 'expected_source_required');
          if (verifyPrices) {
            assert.equal(verifyOnly, true, 'price_readback_requires_verify_only');
            assert.equal(typeof budgetPricingFingerprint, 'function', 'candidate_price_fingerprint_required');
            assert.equal(typeof readPreparedBudgetPrices, 'function', 'candidate_prepared_price_reader_required');
          }
          assert.equal(storage.driver, 'object', 'object_storage_required');
          assert.match(indexDigest, /^[a-f0-9]{64}$/, 'private_index_digest_required');
          assert.match(selectorDirectory, /^budget-markets-v7\/[a-f0-9]{64}$/, 'exact_v7_directory_required');
          const readMeta = key => storage.readJsonWithMeta(key, null);
          const manifestKey = 'catalog/manifest.json';
          const controlsKey = 'catalog/operations/collection-controls-v1.json';
          const beforeManifest = await readMeta(manifestKey);
          const beforeControls = await readMeta(controlsKey);
          assert.ok(beforeManifest.found && beforeManifest.etag, 'manifest_readback_required');
          assert.ok(beforeControls.found && beforeControls.etag, 'controls_readback_required');
          const manifest = beforeManifest.value;
          assert.match(manifest?.generationId || '', /^[A-Za-z0-9_-]+$/, 'generation_required');
          assert.equal(manifest.markets?.korea?.provider, 'auto_api_encar', 'paid_korea_provider_required');
          assert.ok(manifest.markets.korea.count > 0, 'paid_korea_inventory_required');
          const entries = Object.entries(manifest.markets || {});
          assert.ok(entries.length && entries.every(([, value]) => Number.isSafeInteger(value?.count) && value.count >= 0), 'manifest_market_counts_invalid');
          const required = entries.filter(([, value]) => value.count > 0).map(([market]) => market).sort();
          assert.ok(required.every(market => LOCAL_MARKETS.includes(market)), 'nonempty_nonlocal_partition_requires_separate_preparation');
          const prefix = `catalog/generations/${manifest.generationId}/indexes/${selectorDirectory}/`;
          const readyPath = `${prefix}ready.json`;
          const sourcePrefix = `catalog/generations/${manifest.generationId}/indexes/budget-markets-v3/`;
          const sourceReadyPath = `${sourcePrefix}ready.json`;
          const sourceReady = await readMeta(sourceReadyPath);
          assert.ok(sourceReady.found && sourceReady.etag, 'persisted_source_readiness_missing');
          assert.ok([3, 4].includes(sourceReady.value?.version), 'persisted_source_readiness_version');
          assert.equal(sourceReady.value?.generationId, manifest.generationId, 'persisted_source_readiness_generation');
          assert.deepEqual(Object.keys(sourceReady.value.markets || {}).sort(), required, 'persisted_source_readiness_incomplete');
          const manifestDigest = digest(manifest), controlsDigest = digest(beforeControls.value);
          async function fence() {
            const [currentManifest, currentControls] = await Promise.all([readMeta(manifestKey), readMeta(controlsKey)]);
            assert.ok(currentManifest.found && currentManifest.etag === beforeManifest.etag && digest(currentManifest.value) === manifestDigest, 'manifest_changed_during_preparation');
            assert.ok(currentControls.found && currentControls.etag === beforeControls.etag && digest(currentControls.value) === controlsDigest, 'collection_controls_changed_during_preparation');
          }
          const originalWrite = storage.writeJson;
          const writes = [];
          storage.writeJson = async (key, value, condition) => {
            assert.equal(verifyOnly, false, 'verification_must_not_write');
            assert.ok(typeof key === 'string' && key.startsWith(prefix), 'write_outside_exact_v7_generation');
            const relative = key.slice(prefix.length);
            if (relative === 'ready.json') {
              assert.ok(condition?.ifMatch || condition?.ifNoneMatch === '*', 'readiness_requires_conditional_write');
              assert.equal(value?.version, 4, 'readiness_version');
              assert.equal(value?.generationId, manifest.generationId, 'readiness_generation');
              assert.equal(value?.encyclopediaDigest, indexDigest, 'readiness_private_index');
            } else {
              assert.match(relative, /^parts\/(china|korea|uae|europe|georgia)\/[a-f0-9]{64}\.json$/, 'selector_part_scope');
              assert.equal(condition?.ifNoneMatch, '*', 'selector_parts_must_be_immutable');
            }
            await fence();
            const result = await originalWrite.call(storage, key, value, condition);
            writes.push(relative === 'ready.json' ? 'ready' : relative.split('/')[1]);
            return result;
          };
          try {
            const prior = await readMeta(readyPath);
            progress({stage: 'selector_readiness_before', generationId: manifest.generationId, requiredMarkets: required,
              persistedMarkets: Object.keys(prior.value?.markets || {}).sort(), verifyOnly});
            if (!verifyOnly) {
              // Explicit scope selects mergeSpecificationReadiness's ETag CAS path.
              // Unscoped backfill uses create-only readiness and can leave a prior
              // Korea-only directory unchanged even after all other parts are built.
              for (const market of required) {
                await fence();
                await backfill([market]);
                progress({stage: 'selector_partition_prepared', market});
              }
            }
            // Read persisted bytes directly, not the returned directory or a module cache.
            const saved = await readMeta(readyPath);
            assert.ok(saved.found && saved.etag, 'persisted_readiness_missing');
            assert.equal(saved.value?.version, 4, 'persisted_readiness_version');
            assert.equal(saved.value?.generationId, manifest.generationId, 'persisted_readiness_generation');
            assert.equal(saved.value?.encyclopediaDigest, indexDigest, 'persisted_readiness_private_index');
