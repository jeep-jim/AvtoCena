  resume_existing_china:
    needs: release
    if: ${{ always() && needs.release.outputs.deferred_china_job != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - name: Resume only the captured canceled China publish job from the same saved intake
      env:
        GH_TOKEN: ${{ github.token }}
        DEFERRED_JOB: ${{ needs.release.outputs.deferred_china_job }}
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/defer-existing-china.py" <<'EXACT_CHINA_PUBLISHER_HELPER'
        """One exact already-collected publisher; never dispatches collection or another run."""
        import json
        import os
        import subprocess
        import sys
        import time

        RUN = 43753103164
        ATTEMPT = 9
        JOB = 133140943205
        SOURCE = 'f1a926e4de5df6502f764150115b8bf9e2a43dd3'
        ARTIFACT = 14178273080
        ARTIFACT_SHA256 = '62f2ca35af55a75130d661d9a7cc267f282d6132af1c143aeb28b39b6ca974e6'
        PUBLISH = 'refresh / publish (china)'
        PREFIX = 'actions/runs/' + str(RUN)


        def validate_run(value):
            assert value['id'] == RUN and value['head_sha'] == SOURCE, 'existing_china_identity_changed'
            assert value['path'] == '.github/workflows/catalog-refresh-china.yml', 'existing_china_workflow_changed'


        def validate_artifact(api):
            rows = api(PREFIX + '/artifacts')['artifacts']
            matches = [row for row in rows if row['name'] == 'catalog-intake-china']
            assert len(matches) == 1 and matches[0]['id'] == ARTIFACT, 'saved_china_intake_missing_or_replaced'
            row = matches[0]
            assert row['name'] == 'catalog-intake-china' and not row['expired'], 'saved_china_intake_unavailable'
            assert row['digest'] == 'sha256:' + ARTIFACT_SHA256, 'saved_china_intake_changed'
            assert row['size_in_bytes'] == 283660298, 'saved_china_intake_size_changed'


        def validate_jobs(api):
            jobs = api(PREFIX + '/jobs')['jobs']
            publishers = [job for job in jobs if job['name'] == PUBLISH]
            assert len(publishers) == 1 and publishers[0]['id'] == JOB, 'existing_china_publisher_changed'
            assert any(job['name'] == 'refresh / collect (china)' and job['status'] == 'completed' and job['conclusion'] == 'success' for job in jobs), 'saved_china_collection_not_successful'
            assert any(job['name'] == 'refresh / plan' and job['status'] == 'completed' and job['conclusion'] == 'success' for job in jobs), 'saved_china_plan_not_successful'
            assert all(job['id'] == JOB or job['status'] == 'completed' for job in jobs), 'another_china_job_active'
            return publishers[0]


        def defer(api, post, capture, pause=time.sleep):
            run = api(PREFIX); validate_run(run)
            assert run['run_attempt'] == ATTEMPT, 'existing_china_attempt_changed'
            validate_artifact(api)
            publisher = validate_jobs(api)
            if run['status'] == 'completed' or publisher['status'] == 'completed':
                assert publisher['status'] == 'completed' and publisher['conclusion'] == 'success', 'existing_china_terminal_failure_requires_review'
                return {'deferred': False, 'alreadySucceeded': True, 'recollection': False}
            assert run['status'] == 'in_progress' and publisher['status'] == 'in_progress', 'existing_china_not_running'
            # Always-finally restoration can see this even when cancellation or a later gate fails.
            capture(JOB)
            result = post(PREFIX + '/cancel')
            if result:
                state = api(PREFIX); validate_run(state)
                assert state['status'] == 'completed', 'exact_china_cancellation_rejected'
            for _ in range(3):
                state = api(PREFIX); validate_run(state)
                assert state['run_attempt'] == ATTEMPT, 'existing_china_attempt_changed_while_stopping'
                if state['status'] == 'completed': break
                pause(3)
            else:
                result = post(PREFIX + '/force-cancel')
                if result:
                    state = api(PREFIX); validate_run(state)
                    assert state['status'] == 'completed', 'exact_china_force_cancellation_rejected'
            for _ in range(30):
                state = api(PREFIX); validate_run(state)
                assert state['run_attempt'] == ATTEMPT, 'existing_china_attempt_changed_while_stopping'
                if state['status'] == 'completed':
                    final = api('actions/jobs/' + str(JOB))
                    assert final['run_id'] == RUN and final['id'] == JOB and final['name'] == PUBLISH, 'stopped_china_job_changed'
                    assert final['status'] == 'completed' and final['conclusion'] in ['cancelled', 'success'], 'stopped_china_job_failed_independently'
                    return {'deferred': final['conclusion'] == 'cancelled', 'alreadySucceeded': final['conclusion'] == 'success',
                            'jobId': JOB, 'savedIntakeArtifact': ARTIFACT, 'recollection': False}
                pause(2)
            raise AssertionError('exact_china_publisher_stop_pending')


        def resume(api, post, captured_job):
            assert str(captured_job) == str(JOB), 'captured_china_job_changed'
            run = api(PREFIX); validate_run(run)
            validate_artifact(api)
            job = api('actions/jobs/' + str(JOB))
            assert job['run_id'] == RUN and job['id'] == JOB and job['name'] == PUBLISH, 'captured_china_job_identity_changed'
            if run['run_attempt'] > ATTEMPT:
                # Another operator already resumed it. Never create another overlapping attempt.
                return {'resumeRequested': False, 'newerAttemptExists': run['run_attempt'], 'status': run['status'], 'recollection': False}
            assert run['run_attempt'] == ATTEMPT, 'existing_china_attempt_invalid'
            if job['status'] == 'completed' and job['conclusion'] == 'success':
                return {'resumeRequested': False, 'alreadySucceeded': True, 'recollection': False}
            if job['status'] != 'completed':
                return {'resumeRequested': False, 'publisherStillRunning': True, 'status': job['status'], 'recollection': False}
            assert run['status'] == 'completed' and job['conclusion'] == 'cancelled', 'existing_china_terminal_failure_requires_review'
            validate_jobs(api)
            result = post('actions/jobs/' + str(JOB) + '/rerun')
            if result:
                current = api(PREFIX); validate_run(current)
                assert current['run_attempt'] > ATTEMPT, 'exact_china_resume_rejected'
                return {'resumeRequested': False, 'newerAttemptExists': current['run_attempt'], 'recollection': False}
            return {'resumeRequested': True, 'jobId': JOB, 'savedIntakeArtifact': ARTIFACT, 'recollection': False}


        def main():
            assert len(sys.argv) == 2 and sys.argv[1] in ['defer', 'resume'], 'publisher_mode_invalid'
            assert os.environ['GITHUB_REPOSITORY'] == 'jeep-jim/AvtoCena', 'repository_changed'
            def api(path):
                return json.loads(subprocess.check_output(['gh', 'api', 'repos/jeep-jim/AvtoCena/' + path], timeout=60))
            def post(path):
                return subprocess.run(['gh', 'api', '--method', 'POST', 'repos/jeep-jim/AvtoCena/' + path],
                                      timeout=60, capture_output=True).returncode
            def capture(job):
                with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                    output.write('job_id=' + str(job) + '\n')
            result = defer(api, post, capture) if sys.argv[1] == 'defer' else resume(api, post, os.environ['DEFERRED_JOB'])
            print(json.dumps(result))


        if __name__ == '__main__':
            main()
        EXACT_CHINA_PUBLISHER_HELPER
        printf '%s  %s\n' b45f394d1c705ed8a99327a50632ac1a8a4f05e4024444ff5ae5f7d98e8bb5df "$RUNNER_TEMP/defer-existing-china.py" | sha256sum --check
        python3 "$RUNNER_TEMP/defer-existing-china.py" resume | tee china-publisher-resume.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: paid-korea-history-existing-publisher-resume
        path: china-publisher-resume.json
        if-no-files-found: ignore
