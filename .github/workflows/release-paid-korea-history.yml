    - name: Recheck the pinned history objects before switching
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        set -euo pipefail
        node --import tsx --input-type=module <<'HISTORY_READBACK'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import {createHash} from 'node:crypto';
        import {getJsonStorage} from './apps/web/lib/data.ts';
        const raw=fs.readFileSync(process.env.PAID_KOREA_REPORT_RECEIPT);
        const hash=value=>createHash('sha256').update(JSON.stringify(value)).digest('hex');
        assert.equal(createHash('sha256').update(raw).digest('hex'),process.env.PAID_KOREA_REPORT_RECEIPT_SHA256);
        const report=JSON.parse(raw),storage=getJsonStorage();
        assert.equal(storage.driver,'object');
        storage.writeJson=async()=>{throw Error('history_receipt_verification_must_not_write');};
        const complete=await storage.readJson(report.root+'complete.json',null);
        assert.equal(hash(complete),report.completeDigest,'durable_history_receipt_changed');
        assert.equal(complete.observedAtMs,report.observedAtMs);assert.equal(complete.observedAt,report.observedAt);
        assert.equal(complete.provider,'auto_api_encar');assert.equal(complete.rowCount,report.rowCount);
        assert.ok([2,3].includes(complete.bucketPrefixLength));
        for(const sample of Object.values(report.coverage.samples).filter(Boolean)){
         assert.match(sample.offerId,/^[a-f0-9]{24}$/);assert.match(sample.sourceOfferId,/^\d{6,10}$/);
         assert.equal(createHash('sha256').update('encar_direct:'+sample.sourceOfferId).digest('hex').slice(0,24),sample.offerId);
         const prefix=sample.offerId.slice(0,complete.bucketPrefixLength);
         for(const kind of ['history','inspection']){
          const bucket=await storage.readJson(report.root+kind+'/'+prefix+'.json',null);
          assert.equal(bucket?.observedAtMs,report.observedAtMs);assert.equal(bucket.kind,kind);assert.equal(bucket.prefix,prefix);
          assert.equal(bucket.rows.length,complete[kind][prefix].count);assert.equal(hash(bucket.rows),complete[kind][prefix].sha256);
          const rows=bucket.rows.filter(row=>row.offerId===sample.offerId);assert.equal(rows.length,1);assert.equal(rows[0].sourceOfferId,sample.sourceOfferId);
          if(kind==='history'){
           const h=rows[0].history;
           const summary=h?{report_date:h.report_date,own_damage_count:h.own_damage_count,own_damage_cost_won:h.own_damage_cost_won,other_damage_count:h.other_damage_count,other_damage_cost_won:h.other_damage_cost_won,accidentCount:Array.isArray(h.accidents)?h.accidents.length:null}:null;
           assert.deepEqual(summary,sample.history,'history_sample_changed');
          }else{
           const inspection=rows[0].inspection;
           assert.equal(Boolean(inspection),Boolean(sample.inspection));
           if(inspection)for(const [field,value] of Object.entries(sample.inspection))assert.deepEqual(inspection[field]??null,value,'inspection_sample_changed:'+field);
          }
         }
        }
        console.log(JSON.stringify({stage:'history_saved_sample_readback',passed:true,writes:0,observedAt:report.observedAt,categories:Object.entries(report.coverage.samples).filter(([,v])=>v).map(([k])=>k)}));
        HISTORY_READBACK
    - name: Deploy with rollback and resource measurements
      id: deploy_acceptance
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
        NODE_OPTIONS: --max-old-space-size=6144
        SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        PLAYWRIGHT_MODULE: ${{ runner.temp }}/release-browser/node_modules/playwright/index.mjs
      run: |
        export GITHUB_SHA="$RELEASE_SOURCE_SHA"
        set -euo pipefail
        umask 077
        key_file=$(mktemp)
        trap 'rm -f "$key_file"' EXIT
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
        unset SSH_PRIVATE_KEY
        ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
        # Measure the retained version on the same server before starting the candidate.
        # Only response timings are logged. Candidate acceptance still uses its frozen budgets.
        ssh "${ssh_opts[@]}" root@151.248.113.177 'python3 -' <<'MEASURE_RETAINED'
        import json, time, urllib.request
        for sample in range(4):
            start = time.monotonic()
            with urllib.request.urlopen('https://avtocena.com/', timeout=30) as response:
                size = len(response.read())
                print(json.dumps({'version': 'retained83', 'sample': sample + 1,
                                  'status': response.status, 'bytes': size,
                                  'seconds': round(time.monotonic() - start, 4)}), flush=True)
        MEASURE_RETAINED
        remote_dir="/opt/avtocena/releases/$GITHUB_SHA"
        ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'"
        scp "${ssh_opts[@]}" scripts/regcloud-deploy-production.sh scripts/regcloud-performance-gate.py scripts/regcloud-resource-sampler.py scripts/regcloud-browser-verdict.py "root@151.248.113.177:$remote_dir/"
        scp "${ssh_opts[@]}" docs/operations/2026-11-11-accepted-speed-baseline.json "root@151.248.113.177:$remote_dir/accepted-speed-baseline.json"
        # Correlate slow requests with CPU pressure and memory on this candidate.
        # Only cgroup counters are recorded. No requests, headers or process arguments.
        ssh "${ssh_opts[@]}" root@151.248.113.177 "python3 - '$GITHUB_SHA'" <<'SAMPLE' > "$RUNNER_TEMP/encar-resource-samples.log" &
        import datetime, json, pathlib, re, subprocess, sys, time
        sha = sys.argv[1]
        assert re.fullmatch('[0-9a-f]{40}', sha)
        name = 'avtocena-release-' + sha[:12]
        for _ in range(900):
            try:
                pid = int(subprocess.check_output(['docker','inspect','-f','{{.State.Pid}}',name], stderr=subprocess.DEVNULL))
                if pid:
                    groups = pathlib.Path(f'/proc/{pid}/cgroup').read_text().splitlines()
                    path = next(line[3:] for line in groups if line.startswith('0::'))
                    group = pathlib.Path('/sys/fs/cgroup') / path.lstrip('/')
                    fields = dict(line.split() for line in (group/'cpu.stat').read_text().splitlines())
                    print(json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                          'cpuUsec':int(fields['usage_usec']), 'throttledUsec':int(fields['throttled_usec']),
                          'memoryBytes':int((group/'memory.current').read_text())}), flush=True)
            except (subprocess.CalledProcessError, OSError, ValueError, KeyError, StopIteration):
                pass
            time.sleep(3)
        SAMPLE
        sampler_pid=$!
        deploy_status=0
        bash scripts/regcloud-deploy-with-browser.sh "$key_file" "$GITHUB_SHA" "$(node scripts/catalog-calculation-version.mjs)" "$RELEASE_PREPARATION_MARKETS" || deploy_status=$?
        kill "$sampler_pid" 2>/dev/null || true
        wait "$sampler_pid" 2>/dev/null || true
        if [ "$deploy_status" != 0 ]; then
          echo "Candidate resource readings before rollback"
          tail -65 "$RUNNER_TEMP/encar-resource-samples.log"
        fi
        exit "$deploy_status"
