name: Diagnostic Encar current detail contract

on:
  push:
    branches:
      - diag/encar-adapter-smoke-20260809
    paths:
      - ".github/workflows/diag-encar-detail-contract.yml"
      - "scripts/diag-encar-detail-contract.mjs"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe live Encar detail pages and frontend API strings
        env:
          ENCAR_DIAG_ID: "42508437"
        run: node scripts/diag-encar-detail-contract.mjs
