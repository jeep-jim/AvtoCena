name: Catalog source qualification · deficit resolution v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/source-deficit-recon-v1-20260903
    paths:
      - ".github/workflows/catalog-source-deficit-resolution-v1.yml"
      - "scripts/catalog-source-deficit-resolution-v1.mjs"
      - "scripts/catalog-source-deficit-resolution-v1-postprocess.mjs"
      - "tests/catalog-source-deficit-resolution-v1.test.ts"
      - "tests/catalog-source-deficit-resolution-v1-postprocess.test.ts"
      - "scripts/catalog-source-access-probe-v1.mjs"
      - "data/catalog/source-deficit-recon-v1-summary.json"

permissions:
  contents: read

concurrency:
  group: catalog-source-deficit-resolution-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify deficit resolution contract
        run: node --import tsx --test tests/catalog-source-deficit-resolution-v1.test.ts tests/catalog-source-deficit-resolution-v1-postprocess.test.ts
      - name: Re-check explicit offer-bound units, prices and galleries
        env:
          CATALOG_SOURCE_DEFICIT_RESOLUTION_TIMEOUT_MS: "15000"
          CATALOG_SOURCE_DEFICIT_RESOLUTION_MAX_BODY_BYTES: "1600000"
        run: node scripts/catalog-source-deficit-resolution-v1.mjs
      - name: Normalize evidence conservatively
        run: node scripts/catalog-source-deficit-resolution-v1-postprocess.mjs
      - name: Verify no-write evidence envelope
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('catalog-source-deficit-resolution-v1.json','utf8'));
          if(p.productionWrites!==false) throw new Error('productionWrites');
          if(p.classificationMutations!==false) throw new Error('classificationMutations');
          if(p.publishAllowedMutations!==false) throw new Error('publishAllowedMutations');
          if(p.rawBodiesStored!==false) throw new Error('rawBodiesStored');
          if(p.postprocessed!==true||Number(p.version||0)<2) throw new Error('postprocess');
          if(p.sampleCount!==8) throw new Error(`sampleCount=${p.sampleCount}`);
          if(!Array.isArray(p.results)||p.results.length!==8) throw new Error('results');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-deficit-resolution-v1
          path: catalog-source-deficit-resolution-v1.json
          if-no-files-found: error
          retention-days: 7
