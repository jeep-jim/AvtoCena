name: One-shot apply China labels and dispatch Japan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-apply-china-labels-dispatch-japan.yml

permissions:
  contents: write
  actions: write

jobs:
  apply-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fast-forward current main and apply validated presentation file
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git fetch origin fix/china-public-names-20260810
          git show origin/fix/china-public-names-20260810:apps/web/lib/catalog/presentation.ts > apps/web/lib/catalog/presentation.ts
          npx tsx -e 'import {catalogOfferTitle,catalogTransmissionName} from "./apps/web/lib/catalog/presentation.ts"; const cases=[[{market:"china",make:"零跑汽车",model:"零跑C16"},"Leapmotor C16"],[{market:"china",make:"智己汽车",model:"智己LS6"},"IM Motors LS6"],[{market:"china",make:"星途",model:"星纪元 ET"},"Exeed Exlantix ET"],[{market:"china",make:"丰田",model:"普拉多"},"Toyota Prado"]]; for (const [o,w] of cases){const g=catalogOfferTitle(o); if(g!==w) throw new Error(`${g} != ${w}`)}; const t=catalogTransmissionName("8挡手自一体"); if(t!=="8-ступ. автомат") throw new Error(t); console.log({passed:true,cases:cases.length,transmission:t})'
      - name: Remove helper and publish validated code
        run: |
          set -euo pipefail
          rm .github/workflows/oneshot-apply-china-labels-dispatch-japan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/presentation.ts .github/workflows/oneshot-apply-china-labels-dispatch-japan.yml
          git commit -m "Expand China public labels [skip actions]"
          git push origin HEAD:main
      - name: Ensure no current shared live writer and dispatch Japan exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 100 --json databaseId,workflowName --jq '[.[] | select(.workflowName == "Source-sharded cumulative catalog · Korea China Europe Georgia" or .workflowName == "Catalog live recovery · UAE + Kyrgyzstan" or .workflowName == "Catalog live recovery · Japan from Prestige")] | length')"
          test "$active" = "0"
          gh workflow run catalog-live-recovery-japan-from-prestige.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id=31338331776
