name: Bounded China runner environment proof
on:
  push:
    branches: [main]
    paths: [.github/workflows/bounded-china-environment-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: china-runner-environment-proof
  cancel-in-progress: false
env:
  OPERATIONAL_PACKAGE_BLOB: c00429a2010b1d90ed3f47f133943f4e0cb3c4e4
  OPERATIONAL_MANIFEST_SHA256: a224095f5a51c05af7c9ded78440acc17ecc7ff3521bd8bd1fbcfe369bbdfa42
  CONTROLLER_PACKAGE_BLOB: 9044d6b46a07e88bc0e74d8d859cc87c101dcfaf
  CI_TEST_PACKAGE_BLOB: d39eb0ad0407649e1f7871ec14b4ce416a0e73a1
jobs:
  proof:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Probe bounded China runner resources 20261118-v1')
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Materialize exact hash-bound code without storage credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -m700 "$RUNNER_TEMP/china-job"
          cat > "$RUNNER_TEMP/unpack-frozen.py" <<'PY'
          #!/usr/bin/env python3
          """Decode an exact Git blob containing reviewed source only. No archive authority."""
          import base64,hashlib,json,os,pathlib,re,sys
          
          def unpack(response,expected_blob,destination):
              if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')
              response=pathlib.Path(response);destination=pathlib.Path(destination)
              if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute() or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')
              envelope=json.loads(response.read_bytes())
              if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob: raise ValueError('blob_binding')
              content=base64.b64decode(''.join(envelope['content'].split()),validate=True)
              if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()!=expected_blob: raise ValueError('blob_hash')
              bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]
              if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise ValueError('bundle_schema')
              for e in entries:
                  name=e['path'];parts=name.split('/')
                  if not re.fullmatch(r'[A-Za-z0-9_.\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data') for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')): raise ValueError('bundle_path')
                  data=e['contents'].encode('utf-8');total+=len(data)
                  if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']: raise ValueError('bundle_file_binding')
                  prepared.append((parts,data));seen.add(name)
              destination.mkdir(mode=0o700)
              # Only immutable hash-pinned controller-authored names enter this fresh private root.
              for parts,data in prepared:
                  out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                  fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
                  try:
                      view=memoryview(data)
                      while view:
                          n=os.write(fd,view)
                          if n<=0: raise ValueError('bundle_short_write')
                          view=view[n:]
                  finally: os.close(fd)
              return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}
          if __name__=='__main__':
              try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))
              except Exception:
                  print('{"ok":false,"code":"frozen_bundle_unpack_failed"}',file=sys.stderr);sys.exit(1)
          PY
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$OPERATIONAL_PACKAGE_BLOB" > "$RUNNER_TEMP/package-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/package-blob.json" "$OPERATIONAL_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/package"
          gh api "repos/jeep-jim/AvtoCena/git/blobs/$CONTROLLER_PACKAGE_BLOB" > "$RUNNER_TEMP/controller-blob.json"
          python "$RUNNER_TEMP/unpack-frozen.py" "$RUNNER_TEMP/controller-blob.json" "$CONTROLLER_PACKAGE_BLOB" "$RUNNER_TEMP/china-job/controller"
      - name: Install exact locked native toolchains without storage credentials
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.22.1
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.9.0
          export PATH="$RUNNER_TEMP/pinned-npm/node_modules/.bin:$PATH"
          echo "$RUNNER_TEMP/pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(npm --version)" = 11.9.0
          (cd publisher && npm ci)
          (cd runtime && npm ci)
      - name: Read exact startup resources, no storage or supplier access
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';import path from 'node:path';import {pathToFileURL} from 'node:url';import {createHash} from 'node:crypto';
          const root=path.join(process.env.RUNNER_TEMP,'china-job'),pkg=path.join(root,'package');
          const raw=await fs.readFile(path.join(pkg,'SOURCE_MANIFEST.json'));if(createHash('sha256').update(raw).digest('hex')!==process.env.OPERATIONAL_MANIFEST_SHA256)throw Error('manifest_changed');
          const manifest=JSON.parse(raw),entry=manifest.operational.files.find(x=>x.path==='production/runner-resources.mjs'),file=path.join(pkg,'operational',entry.path);if(createHash('sha256').update(await fs.readFile(file)).digest('hex')!==entry.sha256)throw Error('resource_helper_changed');
          const {readRunnerResources}=await import(pathToFileURL(file));const resource=await readRunnerResources({workspace:process.env.GITHUB_WORKSPACE,temp:process.env.RUNNER_TEMP});
          const GiB=1024**3,requiredMemory=8*GiB,sourceBytes=285025402+2748251915,requiredDiskAfterSource=37*GiB,memory=Math.min(resource.memory.availableBytes??0,resource.memory.cgroupMemoryStatus==='unlimited'?Number.MAX_SAFE_INTEGER:resource.memory.cgroupMemoryAvailable??0),disk=Math.min(...Object.values(resource.filesystems).map(x=>x.availableBytes));
          const proof={...resource,installedToolchain:{node:process.version,npm:'11.9.0'},archiveNotDownloaded:true,storageCredentialsPresent:false,catalogWrites:0,supplierCalls:0,requiredMemoryBytes:requiredMemory,availableMemoryForAdmission:memory,requiredDiskBeforeSourceBytes:requiredDiskAfterSource+sourceBytes,availableDiskBytes:disk,memoryAdmitted:memory>=requiredMemory,diskAdmitted:disk>=requiredDiskAfterSource+sourceBytes,executionAuthorized:false};
          await fs.writeFile(path.join(root,'environment-proof.json'),JSON.stringify(proof,null,2),{flag:'wx',mode:0o600});console.log(JSON.stringify(proof));
          JS
      - name: Retain read-only environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-china-environment-${{ github.run_id }}
          path: ${{ runner.temp }}/china-job/environment-proof.json
          if-no-files-found: ignore
          retention-days: 14
