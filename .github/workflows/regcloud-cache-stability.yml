name: Regcloud — one-time cache expiry check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-cache-stability.json']
permissions:
  contents: read
concurrency:
  group: regcloud-cache-stability
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify public reads across the five-minute cache deadline
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,gzip
          expected=json.load(open('.github/market-runs/regcloud-cache-stability.json'))['release']
          base='https://avtocena.com'
          def read(path,timeout=60):
              started=time.monotonic()
              request=urllib.request.Request(base+path,headers={'Accept-Encoding':'gzip'})
              with urllib.request.urlopen(request,timeout=timeout) as response:
                  wire=response.read()
                  body=gzip.decompress(wire) if response.headers.get('Content-Encoding')=='gzip' else wire
                  return json.loads(body),round(time.monotonic()-started,3),len(wire)
          deadline=time.monotonic()+40*60
          while True:
              try:
                  health,_,_=read('/api/health',10)
                  if health.get('releaseSha')==expected:break
              except Exception:pass
              if time.monotonic()>deadline:raise RuntimeError('expected_release_not_active')
              time.sleep(30)
          # This filter takes the complete projection path, including on an empty result.
          route='/api/catalog/search?auctionGrade=4&pageSize=1'
          first,seconds,size=read(route)
          assert first.get('ok') and isinstance(first.get('items'),list)
          print('BEFORE_EXPIRY',json.dumps({'seconds':seconds,'wireBytes':size,'total':first.get('total')}),flush=True)
          for _ in range(11):time.sleep(30)
          health,_,_=read('/api/health',10)
          assert health.get('releaseSha')==expected,'release_changed_during_check'
          second,seconds,size=read(route)
          assert second.get('ok') and isinstance(second.get('items'),list)
          print('AFTER_EXPIRY',json.dumps({'seconds':seconds,'wireBytes':size,'total':second.get('total'),'sameGeneration':second.get('generationId')==first.get('generationId')}),flush=True)
          if seconds>1:raise RuntimeError('expiry_latency_over_one_second')
          PY
