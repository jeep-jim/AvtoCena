name: Catalog refresh korea
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"
  push:
    branches: [main]
    paths: ['.github/market-runs/korea-refresh.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-korea
  cancel-in-progress: false
jobs:
  refresh:
    uses: ./.github/workflows/catalog-market-refresh.yml
    with:
      market: korea
    secrets: inherit
