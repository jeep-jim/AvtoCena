name: One-shot offer credit polish v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-offer-credit-polish-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: git pull --ff-only origin main

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          git restore package-lock.json 2>/dev/null || true

      - name: Apply requested polish
        env:
          PATCH_B64: ""
        run: python3 -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]))'

      - name: Typecheck
        run: |
          npm run typecheck
          git restore package-lock.json 2>/dev/null || true
          git restore apps/web/tsconfig.tsbuildinfo packages/engine/tsconfig.tsbuildinfo 2>/dev/null || true

      - name: Publish safely
        run: |
          grep -q 'ac-credit-partner-button' apps/web/components/catalog/OfferContactActions.tsx
          grep -q 'grid-column: span 3 !important' apps/web/components/catalog/OfferContactActions.tsx
          grep -A8 'ac-mobile-credit-button' apps/web/components/catalog/OfferContactActions.tsx | grep -q 'border: 0;'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/OfferContactActions.tsx
          git rm .github/workflows/oneshot-offer-credit-polish-v2.yml
          git commit -m 'Polish desktop specs and credit button contrast'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
