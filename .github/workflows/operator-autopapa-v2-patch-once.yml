name: OPERATOR AutoPapa V2 patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operator-autopapa-v2-patch-once.yml'
      - '.github/patches/temp-autopapa-primary-price-v2.py'

permissions:
  contents: write

jobs:
  patch-target-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control commit
        uses: actions/checkout@v4
        with:
          path: control
      - name: Checkout target PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/autopapa-primary-price-v2-20260824
          path: work
          fetch-depth: 0
      - name: Apply patch to target branch
        working-directory: work
        run: python ../control/.github/patches/temp-autopapa-primary-price-v2.py
      - name: Commit target branch patch
        working-directory: work
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/autopapa-georgia-source.ts scripts/catalog-rebuild-source-shard.mjs .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'target branch already patched'
            exit 0
          fi
          git commit -m 'Bind AutoPapa V3 prices to exact detail title'
          git push origin HEAD:fix/autopapa-primary-price-v2-20260824
