name: Apply filter auto bottom sheet once

on:
  push:
    branches:
      - fix/catalog-filter-redesign-20260811
    paths:
      - .github/workflows/apply-filter-auto-bottom-sheet-once.yml

# retry after typecheck correction
permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply correction
        run: python .github/patches/apply-filter-auto-bottom-sheet.py
      - name: Filter tests
        run: node --import tsx --test tests/catalog-filter-ui.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/patches/apply-filter-auto-bottom-sheet.py
          rm -f .github/workflows/apply-filter-auto-bottom-sheet-once.yml
          git add -A
          git diff --cached --check
          git commit -m "Make catalog filters auto-apply in bottom sheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"
