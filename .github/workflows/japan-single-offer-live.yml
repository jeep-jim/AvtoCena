name: Japan single public offer route (no deploy)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/japan-single-offer-live.yml'
      - 'scripts/catalog-next/japan-public-offer-follow.mjs'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify one canonical Japan auction detail without vendor crawling
        run: node scripts/catalog-next/japan-public-offer-follow.mjs
