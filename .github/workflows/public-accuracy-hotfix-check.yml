name: Public accuracy hotfix check

on:
  push:
    branches:
      - codex-public-accuracy-hotfix
    paths:
      - "tests/catalog-public-safety.test.ts"
      - "tests/catalog-card-contract.test.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Targeted public safety tests
        run: node --import tsx --test tests/catalog-public-safety.test.ts tests/catalog-card-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
