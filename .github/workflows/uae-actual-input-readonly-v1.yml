name: Verify exact actual UAE inputs and capacity without changes
on:
  push:
    branches: [main]
    paths: [.github/market-runs/uae-actual-input-readonly-v1.sha256]
permissions:
  contents: read
  actions: read
jobs:
  bind:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Read exact UAE READY, static export and host capacity without changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify review-only one-file trigger and authoritative previous jobs
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          readonly marker=.github/market-runs/uae-actual-input-readonly-v1.sha256
          readonly expected=6d4f14cb58dd4b237ca364e9b22572d717a8dc16e7d4bd214d881b736e3d4f82
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD | wc -w)" = 1
          cmp -s <(git diff-tree --no-commit-id -r --name-status --no-renames -z HEAD^ HEAD) <(printf 'A\0%s\0' "$marker")
          cmp -s "$marker" <(printf '%s\n' "$expected" 23dde90f6a8230e6a2b027746edb4638c55a327d ceba3aab83516e1947562e8a3dbe7600fe0f7f13cacd5c19cc8d70b0dc717ee2)
          cd .github/operations/uae-actual-input-readonly-v1
          printf '%s  bundle.sha256\n' "$expected" | sha256sum --check --status
          sha256sum --check --strict --status bundle.sha256
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/136742399352" | jq -e '.id==136742399352 and .run_id==44870078327 and .conclusion=="success"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/136763497567" | jq -e '.id==136763497567 and .run_id==44876906208 and .conclusion=="success"' >/dev/null
  storage:
    needs: bind
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 8
    env: {UAE_PROBE_OP: '.github/operations/uae-actual-input-readonly-v1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 23dde90f6a8230e6a2b027746edb4638c55a327d
          path: exact-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.1'}
      - name: Verify package and installed reader sources without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C exact-app rev-parse HEAD)" = 23dde90f6a8230e6a2b027746edb4638c55a327d
          test "$(git -C exact-app rev-parse 'HEAD^{tree}')" = 894f03b41b1a0223e7e04d2734926d2e403d7451
          (cd "$UAE_PROBE_OP"; printf '%s  bundle.sha256\n' '6d4f14cb58dd4b237ca364e9b22572d717a8dc16e7d4bd214d881b736e3d4f82' | sha256sum --check --status; sha256sum --check --strict --status bundle.sha256; node --test repair.test.mjs)
          mkdir -p "exact-app/$UAE_PROBE_OP"
          cp "$UAE_PROBE_OP/"{probe.mts,repair.mjs,static-gzip.mjs} "exact-app/$UAE_PROBE_OP/"
          cd exact-app; npm ci --ignore-scripts --no-audit --no-fund
      - name: Read exact legacy asset and sampled UAE private stage only
        working-directory: exact-app
        shell: bash
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '30000'
          YC_OBJECT_STORAGE_MAX_ATTEMPTS: '1'
          AVTOCENA_INTERACTIVE_READ_BUDGET_MS: '40000'
          NODE_OPTIONS: --max-old-space-size=4096
        run: node --import tsx "$UAE_PROBE_OP/probe.mts"
  capacity:
    needs: bind
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Read only current runtime roles, memory, disk and prospective free loopback
        shell: bash
        env: {SSH_PRIVATE_KEY: '${{ secrets.REGCLOUD_SSH_KEY }}'}
        run: |
          set -euo pipefail
          readonly op=.github/operations/uae-actual-input-readonly-v1
          (cd "$op"; printf '%s  bundle.sha256\n' '6d4f14cb58dd4b237ca364e9b22572d717a8dc16e7d4bd214d881b736e3d4f82' | sha256sum --check --status; sha256sum --check --strict --status bundle.sha256)
          bash "$op/read-via-ssh.sh"
