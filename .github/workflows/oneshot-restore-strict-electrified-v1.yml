name: One-shot restore strict electrified gating v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-restore-strict-electrified-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  revert-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Revert only preliminary electrified merge in working tree
        shell: bash
        run: |
          set -euo pipefail
          if ! git revert -m 1 --no-commit 76ea2758e807552aac1dfba019d41601fd704b40; then
            echo 'Conflict while reverting preliminary electrified merge; refusing automatic write.' >&2
            git diff --name-only --diff-filter=U >&2 || true
            git revert --abort || true
            exit 1
          fi

      - name: Static strictness and regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          targets=(
            'apps/web/app/(public)/cars/offer/[id]/page.tsx'
            'apps/web/components/catalog/CatalogPrice.tsx'
            'apps/web/lib/catalog/customs-pricing.ts'
            'apps/web/lib/catalog/public-priority.ts'
            'packages/engine/src/calculation/russiaCustoms.ts'
            'scripts/catalog-live-recovery-direct-exact.mjs'
            'scripts/catalog-live-recovery-europe-otomoto.mjs'
            'scripts/catalog-live-recovery-japan-prestige.mjs'
            'scripts/catalog-live-recovery-kyrgyzstan-direct.mjs'
            'scripts/catalog-live-recovery-market.mjs'
            'scripts/catalog-live-recovery-publish.mjs'
          )
          if grep -nE 'preliminary_power_pending|isPreliminaryElectrifiedCalculation|PRELIMINARY_POWER_MISSING' "${targets[@]}"; then
            echo 'Preliminary electrified publication path still present after revert.' >&2
            exit 1
          fi
          grep -F 'const sourcePureElectric = /-electric-/i.test(sourceUrl)' apps/web/lib/catalog/autoscout-exact-source.ts
          grep -F '!/-(?:gasoline|petrol|diesel)-|hybrid|phev|hev/i.test(sourceUrl)' apps/web/lib/catalog/autoscout-exact-source.ts
          grep -F 'CATALOG_MAX_OFFERS_PER_MODEL' scripts/catalog-live-recovery-japan-prestige.mjs

      - name: Download repaired Prestige 3157 sold lots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "31338331776"
        run: |
          set -euo pipefail
          mkdir -p prestige-input
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-repaired") | .id' | sort -n | tail -n1)"
          test -n "$artifact_id"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o prestige.zip
          unzip -qo prestige.zip -d prestige-input
          source_file="$(find prestige-input -type f -name 'prestige-japan-exact-sold-repaired.json' | head -n1)"
          test -s "$source_file"
          echo "PRESTIGE_SOURCE=$source_file" >> "$GITHUB_ENV"

      - name: NO-PUBLISH strict Japan validation after rollback
        shell: bash
        run: |
          set -euo pipefail
          PRESTIGE_OFFICIAL_INPUT="$PRESTIGE_SOURCE" PRESTIGE_OFFICIAL_OUTPUT=prestige-japan-strict-rollback-power.json node scripts/prestige-japan-official-chassis-enrich.mjs
          PRESTIGE_RECOVERY_INPUT=prestige-japan-strict-rollback-power.json PRESTIGE_RECOVERY_OUTPUT=catalog-rebuild-japan-strict-rollback.json PRESTIGE_RECOVERY_TARGET=3000 PRESTIGE_RECOVERY_CONCURRENCY=12 npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const enriched = JSON.parse(fs.readFileSync('prestige-japan-strict-rollback-power.json','utf8'));
          const result = JSON.parse(fs.readFileSync('catalog-rebuild-japan-strict-rollback.json','utf8'));
          const report = result?.report || {};
          const gained = Number(enriched?.report?.officialPowerEnrichment?.enriched || 0);
          const calculated = Number(report.calculatedCount || report.count || 0);
          const preliminary = Number(report.preliminaryCount || 0);
          const electric = Number(report.electricCount || 0);
          const hybrid = Number(report.hybridCount || 0);
          const documented = Number(report.documentedPowerCount || 0);
          const maxOffersPerModel = Number(report.maxOffersPerModel || 0);
          const pending = Number(report?.rejected?.calculation_pending || 0);
          console.log(JSON.stringify({gained, calculated, preliminary, electric, hybrid, documented, maxOffersPerModel, pending, report}, null, 2));
          if (gained < 234) throw new Error(`official_chassis_enrichment_regressed:${gained}`);
          if (calculated < 174) throw new Error(`strict_calculated_regressed:${calculated}`);
          if (documented < 166) throw new Error(`documented_power_regressed:${documented}`);
          if (preliminary !== 0) throw new Error(`strict_preliminary_must_be_zero:${preliminary}`);
          if (electric !== 0) throw new Error(`strict_electric_without_certified_power:${electric}`);
          if (hybrid !== 0) throw new Error(`strict_hybrid_without_certified_power:${hybrid}`);
          if (pending < 2300) throw new Error(`strict_pending_unexpectedly_low:${pending}`);
          if (maxOffersPerModel > 20) throw new Error(`exact_model_quota_broken:${maxOffersPerModel}`);
          NODE

      - name: Commit validated strict rollback only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git rm -f .github/workflows/oneshot-restore-strict-electrified-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore strict official-power gating [skip actions]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-electrified-rollback-validation
          path: |
            prestige-japan-strict-rollback-power.json
            catalog-rebuild-japan-strict-rollback.json
          if-no-files-found: warn
          retention-days: 3
