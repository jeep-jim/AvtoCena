name: Finalize Japan roadmap command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  finalize:
    if: github.event.issue.number == 136 && contains(github.event.comment.body, '/finalize-japan-roadmap-v30')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update roadmap and auction result detail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path('roadmap.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          start = roadmap.index('### 4.3. Япония')
          end = roadmap.index('### 4.4. ОАЭ', start)
          japan = '''### 4.3. Япония

Главный публичный раздел Японии — **статистика отыгранных аукционных лотов**, а не смешанная витрина экспортных машин в наличии.

Приоритетные источники статистики:

- Japan Transit / `japantransit_japan_stat_open` — публичные результаты по маркам и моделям;
- JPAuc / `jpauc_japan_past_open` — прошедшие аукционы;
- CarVector / `carvector_japan_stat_open` — аукционная статистика;
- другие статистические источники только после подтверждения актуальным probe.

Экспортные каталоги BE FORWARD, TCV, Goo-net и остальные японские площадки могут использоваться для отдельных задач и базы знаний, но не должны вытеснять статистику торгов из основного японского раздела.

Для результата торгов сохранять опубликованные источником марку, модель, год, цену и валюту, дату, аукцион, номер лота, оценку, пробег, frame number, объём двигателя, коробку, фотографию конкретного лота и публичную ссылку.

Правила цены:

- `auctionPriceKind=hammer` разрешён только при явно подписанной цене `End Price / Продано за`;
- цена, опубликованная статистическим сайтом без подтверждения чистой цены молотка, хранится как `published_result`;
- ₽/руб. сохраняются как RUB, а ¥/￥/JPY/иены — как JPY без подмены валюты;
- цена лота показывается отдельно от расчёта «под ключ»;
- таможню и утильсбор рассчитывать нашим движком только при достаточных данных; иначе показывать статус уточнения;
- нельзя выдавать стартовую цену или среднюю цену за фактический результат продажи.

Не смешивать легковые автомобили с грузовиками, автобусами и коммерческой техникой. Исторический результат хранится с `catalogKind=auction_result` и `auctionResult=sold`.

'''
          roadmap = roadmap[:start] + japan + roadmap[end:]
          if '### 2026-07-28 — Japan auction statistics v30' not in roadmap:
              journal = '''
### 2026-07-28 — Japan auction statistics v30

- основной каталог Японии переведён на отыгранные аукционные лоты и опубликованную цену результата;
- добавлен `japantransit_japan_stat_open` с модельным cursor-обходом;
- JPAuc и CarVector подключены как дополнительные статистические источники;
- `/cars?market=japan` отбирает только `auction_result`;
- цена торгов отделена от таможни, утильсбора и расчёта «под ключ»;
- валюта результата определяется по обозначению источника и не подменяется;
- коммерческие лоты исключаются;
- parser, registry, TypeScript и production build прошли в PR #134 и PR #135;
- merge-коммиты: `c01c53957d8e196d81582f53ac4b9e5274690564`, `ce72aab880163a99ea43c017af19872679e39b86`;
- фактический объём записать после production probe/rebuild/publish.

'''
              marker = '### Шаблон новой записи'
              pos = roadmap.rfind(marker)
              roadmap = roadmap[:pos] + journal + roadmap[pos:] if pos >= 0 else roadmap + journal
          roadmap_path.write_text(roadmap, encoding='utf-8')

          detail_path = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          if 'function AuctionResultSummary' not in detail:
              marker = 'function MissingOffer() {'
              helper = '''function auctionSourceMoney(value: number, currency: string) {
  const symbols: Record<string, string> = { JPY: "¥", RUB: "₽", USD: "$", EUR: "€" };
  return `${money(value)} ${symbols[currency] || currency}`;
}

function auctionDateLabel(value: unknown) {
  const text = String(value || "").slice(0, 10);
  if (!text) return "";
  const parsed = new Date(`${text}T12:00:00`);
  return Number.isNaN(parsed.getTime()) ? text : parsed.toLocaleDateString("ru-RU");
}

function AuctionResultSummary({ offer }: { offer: any }) {
  const price = Number(offer?.sourcePrice || 0);
  const currency = String(offer?.sourceCurrency || "JPY").toUpperCase();
  const facts = [
    offer?.auctionDate ? `Дата торгов: ${auctionDateLabel(offer.auctionDate)}` : "",
    offer?.auctionName ? `Аукцион: ${offer.auctionName}` : "",
    offer?.lotNumber ? `Лот: ${offer.lotNumber}` : "",
    offer?.auctionGrade ? `Оценка: ${offer.auctionGrade}` : "",
    offer?.frameNumber ? `Кузов: ${offer.frameNumber}` : "",
  ].filter(Boolean);
  return <section className="ac-offer-price-panel rounded-[1.35rem] bg-[var(--ac-surface-2)] p-4 shadow-[0_14px_38px_rgba(0,0,0,.14)]">
    <div className="text-[10px] font-black uppercase tracking-[0.19em] text-[var(--ac-muted)]">Результат состоявшихся торгов</div>
    <div className="mt-1.5 text-3xl font-black leading-none tracking-[-0.05em] text-[var(--ac-text)] md:text-4xl">{price ? auctionSourceMoney(price, currency) : "Цена не опубликована"}</div>
    {facts.length ? <div className="mt-3 flex flex-wrap gap-2">{facts.map((fact) => <span key={fact} className="rounded-full bg-white/[0.06] px-2.5 py-1.5 text-[11px] font-bold text-[var(--ac-muted)]">{fact}</span>)}</div> : null}
    <p className="mt-3 text-xs font-medium leading-5 text-[var(--ac-muted)]">Это опубликованная цена отыгранного лота. Итоговая стоимость с таможней, утильсбором, логистикой и услугами рассчитывается отдельно нашим движком.</p>
    {Number(offer?.totalRub || 0) > 0 ? <div className="mt-3 border-t border-dotted border-[var(--ac-border)] pt-3 text-sm font-black text-[var(--ac-text)]">Расчёт под ключ: {money(Number(offer.totalRub))} ₽</div> : <div className="mt-3 border-t border-dotted border-[var(--ac-border)] pt-3 text-sm font-bold text-[var(--ac-muted)]">Расчёт таможни и утиля уточняется</div>}
  </section>;
}

'''
              if marker not in detail:
                  raise SystemExit('detail_helper_marker_missing')
              detail = detail.replace(marker, helper + marker, 1)
          state = '  const isHybrid = ["series_hybrid", "other_hybrid"].includes(powertrainKind) || /hybrid|гибрид|phev|hev/.test(fuelKind);\n'
          if 'const isAuctionResult =' not in detail:
              if state not in detail:
                  raise SystemExit('detail_state_marker_missing')
              detail = detail.replace(state, state + '  const isAuctionResult = raw.catalogKind === "auction_result" || (raw.offerType === "auction" && raw.auctionResult === "sold");\n', 1)
          old_panel = '          <PriceTrend offer={o} label="Ориентир стоимости" priceClassName="text-3xl md:text-4xl" className="ac-offer-price-panel" panel />\n'
          new_panel = '          {isAuctionResult ? <AuctionResultSummary offer={o} /> : <PriceTrend offer={o} label="Ориентир стоимости" priceClassName="text-3xl md:text-4xl" className="ac-offer-price-panel" panel />}\n'
          if old_panel in detail:
              detail = detail.replace(old_panel, new_panel, 1)
          elif new_panel not in detail:
              raise SystemExit('detail_panel_marker_missing')
          detail_path.write_text(detail, encoding='utf-8')
          PY
      - name: Verify
        run: |
          npm ci
          node --import tsx --test tests/japan-auction-statistics-source.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/finalize-japan-roadmap-command.yml
          rm -f .github/workflows/finalize-japan-auction-v30.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add -A
          git commit -m "Roadmap: закрепить каталог аукционной статистики Японии"
          git push origin HEAD:main
