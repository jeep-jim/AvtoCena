name: Sync catalog filter polish with newest main r2

on:
  push:
    branches: [ui/catalog-filter-brand-polish-20260812]
    paths: [.github/workflows/sync-catalog-filter-brand-polish-main-r2-20260812.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/catalog-filter-brand-polish-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Merge newest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git checkout origin/main -- apps/web/tsconfig.tsbuildinfo
          rm .github/workflows/sync-catalog-filter-brand-polish-main-r2-20260812.yml
      - name: Validate
        run: |
          node --import tsx --test tests/catalog-filter-brand-polish.test.ts tests/catalog-filter-search.test.ts tests/catalog-filter-layout-regression.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          git checkout origin/main -- apps/web/tsconfig.tsbuildinfo
          git diff --check
      - name: Push
        run: |
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Sync filter polish with newest main"; fi
          git push origin HEAD:ui/catalog-filter-brand-polish-20260812
