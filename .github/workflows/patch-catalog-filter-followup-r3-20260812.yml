name: Patch catalog filter follow-up r3
on:
  push:
    branches:
      - ui/catalog-filter-followup-20260812
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/catalog-filter-followup-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch_catalog_filter_followup_20260812.py
      - run: npx tsx --test tests/catalog-filter-followup.test.ts
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: git diff --check
      - name: Commit
        run: |
          rm -f scripts/patch_catalog_filter_followup_20260812.py
          rm -f .github/workflows/patch-catalog-filter-followup-20260812.yml
          rm -f .github/workflows/patch-catalog-filter-followup-r2-20260812.yml
          rm -f .github/workflows/patch-catalog-filter-followup-r3-20260812.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'UI: correct brand filter roles and red contrast'
          git push origin HEAD:ui/catalog-filter-followup-20260812
