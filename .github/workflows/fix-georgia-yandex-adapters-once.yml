name: Fix Georgia Yandex adapters once

on:
  push:
    branches:
      - fix/georgia-yandex-canonical-adapters-20260812
    paths:
      - .github/workflows/fix-georgia-yandex-adapters-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georgia-yandex-canonical-adapters-20260812
          fetch-depth: 0
      - name: Patch AutoPapa to observed canonical USD route shape
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/sourceId: "autopapa_georgia_open"/,/^  },$/ {
            s~    detailPattern: .*~    detailPattern: /\\/en\\/usd\\/[^/?#]+\\/[^/?#]+\\/\\d+(?:[/?#]|$)/i,~
            s~pageQuery("https://autopapa.ge/en/search", page),~pageQuery("https://autopapa.ge/en/usd/search", page),~
            /pageQuery("https:\/\/autopapa.ge\/en\/cars", page),/d
            /pageQuery("https:\/\/autopapa.ge\/search", page),/d
          }' apps/web/lib/catalog/scale-market-sources.ts
          grep -F 'pageQuery("https://autopapa.ge/en/usd/search", page)' apps/web/lib/catalog/scale-market-sources.ts
          grep -F 'detailPattern: /\/en\/usd\/[^/?#]+\/[^/?#]+\/\d+' apps/web/lib/catalog/scale-market-sources.ts
          ! grep -F 'https://autopapa.ge/en/search' apps/web/lib/catalog/scale-market-sources.ts
      - name: Focused tests
        run: |
          npm ci
          node --import tsx --test tests/myauto-list-source.test.ts tests/georgia-canonical-source-policy-20260812.test.ts tests/catalog-source-scale.test.ts
      - name: Commit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/scale-market-sources.ts
          git diff --cached --check
          git commit -m 'fix(georgia): follow current AutoPapa canonical routes'
          git push origin HEAD:fix/georgia-yandex-canonical-adapters-20260812
