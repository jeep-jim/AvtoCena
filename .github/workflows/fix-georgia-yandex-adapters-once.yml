name: Fix Georgia Yandex adapters once

on:
  push:
    branches:
      - fix/georgia-yandex-canonical-adapters-20260812
    paths:
      - .github/workflows/fix-georgia-yandex-adapters-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/georgia-yandex-canonical-adapters-20260812
          fetch-depth: 0
      - name: Patch MyAuto request fingerprint to verified Yandex egress
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/catalog/myauto-list-source.ts')
          s = path.read_text()
          start = s.index('const HEADERS = {')
          end = s.index('\n};', start) + 3
          new = 'const HEADERS = {\n  // Verified from the deployed Yandex Serverless egress. Extra navigation/cache headers\n  // trigger MyAuto Cloudflare 403 from the same runtime.\n  accept: "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",\n  "accept-language": "en-US,en;q=0.9,ka;q=0.8",\n  "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36",\n};'
          path.write_text(s[:start] + new + s[end:])
          PY
      - name: Focused tests
        run: |
          npm ci
          node --import tsx --test tests/myauto-list-source.test.ts tests/georgia-canonical-source-policy-20260812.test.ts
      - name: Commit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/myauto-list-source.ts
          git diff --cached --check
          git commit -m 'fix(georgia): use verified MyAuto Yandex request headers'
          git push origin HEAD:fix/georgia-yandex-canonical-adapters-20260812
