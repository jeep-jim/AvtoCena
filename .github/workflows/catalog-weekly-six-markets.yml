name: Catalog · Weekly six-market collection and publication
on:
  # Schedule held after partial five-market publication; Japan feed is not qualified.
  # Previous window: Sunday 18:00 UTC. Restore only after all market gates pass.
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy to Yandex Cloud]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-weekly-six-markets
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reuse_run_id: ${{ steps.policy.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const changed = process.env.EVENT_NAME === 'workflow_run'
            ? execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).split('\n') : [];
          const run = process.env.EVENT_NAME !== 'workflow_run' || changed.includes('.github/market-runs/weekly-six-market-catalog.json');
          const marker = process.env.EVENT_NAME === 'workflow_run' && run ? JSON.parse(fs.readFileSync('.github/market-runs/weekly-six-market-catalog.json','utf8')) : {};
          const reuse = marker.reuseRunId || '';
          if (reuse && !/^\d+$/.test(String(reuse))) throw Error('invalid_reuse_run_id');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${run}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`reuse_run_id=${reuse}\n`);
          JS
  collect:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.reuse_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        market: [korea, china, uae, europe, georgia, japan]
    env:
      CATALOG_INTAKE_MARKET: ${{ matrix.market }}
      CATALOG_INTAKE_TIME_MS: '9000000'
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: '20000'
      CATALOG_SOURCE_TIMEOUT_MS: '25000'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_MAX_IMAGES_PER_OFFER: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect listing, exact detail and technical tables
        run: node --import tsx scripts/catalog-source-intake.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-intake-${{ matrix.market }}
          path: catalog-intake-${{ matrix.market }}/
          retention-days: 14
  publish:
    needs: [plan, collect]
    if: always() && needs.plan.outputs.run == 'true' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_REBUILD_INPUT_DIR: catalog-intake-publish
      CATALOG_INTAKE_INPUT_DIR: catalog-intake-input
      CATALOG_REBUILD_TARGET_PER_SOURCE: '100000'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '10000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '2'
      CATALOG_PRIORITY_MAX_TOTAL_RUB: '15000000'
      CATALOG_V2_HARD_MAX_TOTAL_RUB: '15000000'
      CATALOG_V2_PRIORITY_TARGET: '8000'
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: '12'
      CATALOG_INDEX_WRITE_CONCURRENCY: '8'
      CATALOG_PUBLISH_LOCK_TTL_MS: '1800000'
      CATALOG_PUBLISH_LOCK_HEARTBEAT_MS: '300000'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse_run_id == ''
        with:
          pattern: catalog-intake-*
          path: catalog-intake-input
      - name: Restore collected observations without repeating source requests
        uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse_run_id != ''
        with:
          pattern: catalog-intake-*
          path: catalog-intake-input
          run-id: ${{ needs.plan.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - run: node --import tsx scripts/catalog-intake-to-publication.mjs
      - name: Publish each market with preservation of other markets
        shell: bash
        run: |
          failures=0
          for market in korea china uae europe georgia japan; do
            export CATALOG_REBUILD_MARKETS="$market"
            export CATALOG_REBUILD_PUBLISH_REPORT="catalog-weekly-$market-publish-report.json"
            if ! node --import tsx scripts/catalog-publish-market.mjs; then failures=$((failures + 1)); fi
          done
          node scripts/catalog-weekly-summary.mjs
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-weekly-publication-reports
          path: catalog-weekly-*.json
          retention-days: 30
