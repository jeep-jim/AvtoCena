name: Fix catalog visible cards v31

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-catalog-visible-cards-v31.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply catalog visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          storage = Path('apps/web/lib/catalog/storage.ts')
          text = storage.read_text()
          start = text.index('export async function searchOffers(params: CatalogSearchParams) {')
          end = text.index('function isPrivateHost(', start)
          replacement = r'''function offerMatchesSearch(offer: VehicleOffer, params: CatalogSearchParams) {
            const make = cleanFacet(offer.make).toLocaleLowerCase("ru-RU");
            const model = cleanFacet(offer.model).toLocaleLowerCase("ru-RU");
            const requestedMake = cleanFacet(params.make).toLocaleLowerCase("ru-RU");
            const requestedModel = cleanFacet(params.model).toLocaleLowerCase("ru-RU");
            return (!params.market || params.market === "any" || offer.market === params.market)
              && (!requestedMake || make === requestedMake)
              && (!requestedModel || model === requestedModel || model.includes(requestedModel))
              && (!params.budgetFrom || (offer.totalRub || 0) >= params.budgetFrom)
              && (!params.budgetTo || (offer.totalRub || Infinity) <= params.budgetTo)
              && (!params.yearFrom || offer.year >= params.yearFrom)
              && (!params.yearTo || offer.year <= params.yearTo)
              && (!params.mileageFrom || (offer.mileageKm || 0) >= params.mileageFrom)
              && (!params.mileageTo || (offer.mileageKm || Infinity) <= params.mileageTo)
              && (!params.engineFrom || (offer.engineCc || 0) >= params.engineFrom)
              && (!params.engineTo || (offer.engineCc || Infinity) <= params.engineTo)
              && (!params.powerFrom || (offer.powerHp || 0) >= params.powerFrom)
              && (!params.powerTo || (offer.powerHp || Infinity) <= params.powerTo)
              && (!params.fuel || cleanFacet(offer.fuel) === cleanFacet(params.fuel))
              && (!params.bodyType || cleanFacet(offer.bodyType) === cleanFacet(params.bodyType))
              && (!params.transmission || offer.transmission === params.transmission)
              && (!params.drive || offer.drive === params.drive)
              && (!params.auctionGrade || offer.auctionGrade === params.auctionGrade)
              && (!params.hasPrice || (params.hasPrice === "yes" ? Boolean(offer.totalRub) : !offer.totalRub));
          }

          function sortSearchOffers(items: VehicleOffer[], sort = "updatedAt") {
            return items.sort((a, b) => sort === "totalRub"
              ? (a.totalRub ?? Infinity) - (b.totalRub ?? Infinity)
              : sort === "year"
                ? b.year - a.year
                : sort === "mileage"
                  ? (a.mileageKm || 0) - (b.mileageKm || 0)
                  : String(b.auctionDate || (b.operational as any)?.sourcePublishedAt || b.updatedAt).localeCompare(String(a.auctionDate || (a.operational as any)?.sourcePublishedAt || a.updatedAt)));
          }

          async function searchOffersFromManifest(manifest: CatalogManifest, params: CatalogSearchParams, page: number, pageSize: number, reason: string) {
            const markets = params.market && params.market !== "any" ? [String(params.market)] : MARKETS;
            const rows = (await Promise.all(markets.map((market) => readMarketOffers(market)))).flat();
            const items = sortSearchOffers(rows.filter(isPublicOffer).filter((offer) => offerMatchesSearch(offer, params)), params.sort || "updatedAt");
            const total = items.length;
            const offset = (page - 1) * pageSize;
            return {
              generationId: manifest.generationId,
              total,
              page,
              pageSize,
              items: items.slice(offset, offset + pageSize).map(publicOffer),
              usedIndexShards: [`manifest-fallback:${reason}`],
            };
          }

          export async function searchOffers(params: CatalogSearchParams) {
            const manifest = await readManifest();
            const page = Math.max(1, Number(params.page || 1));
            const pageSize = Math.min(48, Math.max(1, Number(params.pageSize || 24)));
            const { ids, used } = await candidateIds(manifest, params);
            const byId = await readIndex<{ byId: Record<string, OfferLocation> }>(manifest.generationId, "offers-by-id.json", { byId: {} });
            const order = await readIndex<{ ids: string[] }>(manifest.generationId, "order-updatedAt.json", { ids: Object.keys(byId.byId) });
            const expectedCount = Object.entries(manifest.markets || {})
              .filter(([market]) => !params.market || params.market === "any" || market === params.market)
              .reduce((sum, [, value]) => sum + Number(value?.count || 0), 0);
            if (expectedCount > 0 && (!Object.keys(byId.byId).length || !order.ids.length)) {
              return searchOffersFromManifest(manifest, params, page, pageSize, "indexes-missing");
            }
            let idList = ids ? order.ids.filter((id) => ids.has(id)) : order.ids;
            const hasRangeFilters = Boolean(params.budgetFrom || params.budgetTo || params.yearFrom || params.yearTo || params.mileageFrom || params.mileageTo || params.engineFrom || params.engineTo || params.powerFrom || params.powerTo || params.transmission || params.auctionGrade || (params.sort && params.sort !== "updatedAt"));
            let total = idList.length;
            let pageIds = idList.slice((page - 1) * pageSize, page * pageSize);
            if (hasRangeFilters) pageIds = idList;
            const pageSet = new Set(pageIds);
            const chunkKeys = new Map<string, OfferLocation>();
            for (const id of pageIds) { const loc = byId.byId[id]; if (loc) chunkKeys.set(`${loc.market}/${loc.chunk}`, loc); }
            const loaded = (await Promise.all([...chunkKeys.values()].map((loc) => readDataJson<VehicleOffer[]>(offerPath(manifest.generationId, loc.market, loc.chunk), [])))).flat();
            let items = loaded.filter((o) => pageSet.has(o.id) && isPublicOffer(o));
            if (pageIds.length && !items.length && expectedCount > 0) {
              return searchOffersFromManifest(manifest, params, page, pageSize, "index-points-to-empty-chunks");
            }
            if (hasRangeFilters) {
              items = sortSearchOffers(items.filter((offer) => offerMatchesSearch(offer, params)), params.sort || "updatedAt");
              total = items.length;
              items = items.slice((page - 1) * pageSize, page * pageSize);
            } else {
              const rank = new Map(pageIds.map((id, index) => [id, index]));
              items.sort((a, b) => (rank.get(a.id) ?? 0) - (rank.get(b.id) ?? 0));
            }
            return { generationId: manifest.generationId, total, page, pageSize, items: items.map(publicOffer), usedIndexShards: used.length ? used : [`catalog/generations/${manifest.generationId}/indexes/order-updatedAt.json`] };
          }
          '''
          storage.write_text(text[:start] + replacement + text[end:])

          route = Path('apps/web/app/api/catalog/market-counts/route.ts')
          route.write_text('''import { NextResponse } from "next/server";\nimport { readDataJson } from "@/lib/data";\nimport { searchOffers } from "@/lib/catalog/storage";\nimport { PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";\n\ntype CatalogManifest = { generationId?: string; updatedAt?: string };\n\nexport const dynamic = "force-dynamic";\nexport const revalidate = 0;\n\nexport async function GET() {\n  const manifest = await readDataJson<CatalogManifest>("catalog/manifest.json", { generationId: "empty", updatedAt: "" });\n  const results = await Promise.all(PUBLIC_CATALOG_MARKETS.map((market) => searchOffers({ market, page: 1, pageSize: 1, sort: "updatedAt" })));\n  const markets = Object.fromEntries(PUBLIC_CATALOG_MARKETS.map((market, index) => [market, Math.max(0, Number(results[index]?.total || 0))]));\n  return NextResponse.json({\n    ok: true,\n    generationId: manifest.generationId || results[0]?.generationId || "empty",\n    updatedAt: manifest.updatedAt || null,\n    markets,\n    total: Object.values(markets).reduce((sum, count) => sum + count, 0),\n  });\n}\n''')

          test = Path('tests/catalog-public-counts-consistency.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\ntest("catalog search falls back to manifest chunks when indexes are unavailable", () => {\n  const source = readFileSync("apps/web/lib/catalog/storage.ts", "utf8");\n  assert.match(source, /searchOffersFromManifest/);\n  assert.match(source, /indexes-missing/);\n  assert.match(source, /index-points-to-empty-chunks/);\n});\n\ntest("CRM market counts use the same search path as public cards", () => {\n  const source = readFileSync("apps/web/app/api/catalog/market-counts/route.ts", "utf8");\n  assert.match(source, /searchOffers/);\n  assert.doesNotMatch(source, /manifest\\.markets\\?\\.\\[market\\]\\?\\.count/);\n});\n''')

          roadmap = Path('roadmap.md')
          roadmap.write_text(roadmap.read_text() + '''\n\n### 2026-07-28 — manifest показывал тысячи машин, но публичная выдача была пустой\n\n- Симптом: CRM читала `catalog/manifest.json` и показывала большие значения рынков, а `/api/catalog/search` и публичные карточки могли возвращать пустой список.\n- Причина: manifest с чанками был опубликован, но индексы `offers-by-id.json` / `order-updatedAt.json` отсутствовали, были ещё не видны в Object Storage либо указывали на пустые чанки. Счётчик и карточки использовали разные пути чтения.\n- Исправление: `searchOffers` получил резервное чтение непосредственно из manifest-чанков при отсутствующих/неконсистентных индексах. `/api/catalog/market-counts` теперь считает через тот же `searchOffers`, что и публичный сайт, поэтому число не может быть больше реально доступных карточек.\n- Регрессия: `tests/catalog-public-counts-consistency.test.ts`.\n- Критерий проверки: одинаковый `generationId`, ненулевые `items` при ненулевом `total`, совпадающие счётчики CRM и публичной выдачи по каждому рынку.\n''')
          PY
      - name: Install and verify
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-catalog-visible-cards-v31.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/catalog/storage.ts apps/web/app/api/catalog/market-counts/route.ts tests/catalog-public-counts-consistency.test.ts roadmap.md .github/workflows/fix-catalog-visible-cards-v31.yml
          git commit -m "Каталог: синхронизировать счётчики и публичные карточки"
          git push origin main
