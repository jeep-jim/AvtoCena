name: Catalog reference stage 1 preparation
on:
  push:
    branches: [fix/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-reference-stage1.yml', '.github/patches/catalog-reference-stage1.py', '.github/patches/catalog-reference-stage1-tests.py', 'apps/web/lib/catalog/market-section-result.ts', 'apps/web/app/public-typography.css']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-reference-stage1-preparation
  cancel-in-progress: false
jobs:
  prepare-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact presentation changes on the isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/catalog-reference-20261107
          python3 .github/patches/catalog-reference-stage1.py
          python3 .github/patches/catalog-reference-stage1-tests.py
          npm install --workspace=@avtocena/web --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund @fontsource-variable/onest@5.3.1
          git diff --check
      - run: npm ci
        id: dependencies
      - name: Production dependency security
        id: security
        run: npm audit --omit=dev --audit-level=high
      - name: Targeted routing, sharing, dealer, font and resilience regressions
        id: targeted
        continue-on-error: true
        run: |
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-reference-routes.test.ts tests/catalog-market-section-result.test.ts tests/search-snippets.test.ts tests/staff-avatar-presence-url.test.ts tests/short-share.test.ts tests/dealer-selection-share.test.ts tests/selection-city-persistence.test.ts tests/offer-share.test.ts tests/public-page-recovery.test.ts tests/crm-contracts.test.ts tests/telegram-miniapp.test.ts tests/ajes-catalog-progressive.test.ts tests/autobot.test.ts tests/catalog-japan-redirect.test.ts tests/power30.test.ts
      - name: Full regression suite
        id: regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: npm test > regression.log 2>&1 || { tail -n 240 regression.log; exit 1; }
      - name: Web and engine typecheck
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1 || { cat typecheck.log; exit 1; }
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build > build.log 2>&1 || { tail -n 200 build.log; exit 1; }
      - name: Require every acceptance check
        if: ${{ !cancelled() }}
        run: |
          test '${{ steps.security.outcome }}' = success
          test '${{ steps.targeted.outcome }}' = success
          test '${{ steps.regression.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
      - name: Commit verified code only to the same isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/patches/catalog-reference-stage1.py .github/patches/catalog-reference-stage1-tests.py .github/workflows/catalog-reference-stage1.yml
          git add apps/web tests package-lock.json docs/operations/2026-11-07-zma-reference-findings.md
          git commit -m 'fix: readable public typography, canonical catalog routes and isolated market failures'
          git push origin HEAD:fix/catalog-reference-20261107
          git log -1 --format='%H %s'
      - name: Preserve bounded diagnostic evidence
        if: always()
        run: |
          mkdir -p stage1-report
          git diff > stage1-report/candidate.patch
          cp regression.log typecheck.log build.log stage1-report/ 2>/dev/null || true
          git rev-parse HEAD > stage1-report/checked-commit.txt
          git status --short > stage1-report/worktree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-reference-stage1-checks
          path: stage1-report
          retention-days: 7
