name: Catalog · source specification audit
run-name: Read-only 17-source specification audit · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/market-runs/source-specification-audit

permissions:
  contents: read

concurrency:
  group: catalog-source-specification-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_SOURCE_SPECIFICATION_AUDIT_OUTPUT: catalog-source-specification-audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the read-only audit contract
        run: |
          node --check scripts/catalog-audit-source-specifications.mjs
          node --import tsx --test tests/catalog-source-specification-audit.test.ts tests/catalog-production-pause.test.ts tests/catalog-required-sources-contract.test.ts tests/catalog-six-market-contract.test.ts
      - name: Audit exact, ambiguous, conflict and missing specifications
        run: npx tsx scripts/catalog-audit-source-specifications.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-specification-audit
          path: catalog-source-specification-audit.json
          if-no-files-found: error
          retention-days: 14
