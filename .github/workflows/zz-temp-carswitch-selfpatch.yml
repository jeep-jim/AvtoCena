name: TEMP CarSwitch source selfpatch

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-carswitch-selfpatch.yml'
      - 'apps/web/lib/catalog/carswitch-exact-source.ts'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/carswitch-uae-exact-source-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire exact CarSwitch source and regression fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/lib/catalog/importer.ts')
          s=p.read_text()
          a='import { dubizzleUaeExactSource } from "./dubizzle-exact-source";\n'
          b=a+'import { carswitchUaeExactSource } from "./carswitch-exact-source";\n'
          if 'carswitchUaeExactSource' not in s:
              if a not in s: raise SystemExit('import anchor missing')
              s=s.replace(a,b,1)
          a='  dubizzleUaeExactSource,\n'
          b=a+'  carswitchUaeExactSource,\n'
          if '  carswitchUaeExactSource,\n' not in s:
              if a not in s: raise SystemExit('completeSources anchor missing')
              s=s.replace(a,b,1)
          a='  "dubizzle_uae_open",\n'
          b=a+'  "carswitch_uae_open",\n'
          block=s[s.index('const dedicatedDetailSourceIds'):]
          if '"carswitch_uae_open"' not in block:
              if a not in block: raise SystemExit('dedicated anchor missing')
              before,after=s.split('const dedicatedDetailSourceIds',1)
              after=after.replace(a,b,1)
              s=before+'const dedicatedDetailSourceIds'+after
          p.write_text(s)

          t=Path('tests/catalog-live-sources-v19.test.ts')
          s=t.read_text()
          imp='import { DubicarsCurrentAdapter, parseDubicarsCurrentListing } from "../apps/web/lib/catalog/dubicars-current-source";\n'
          repl=imp+'import { CarSwitchUaeExactAdapter, parseCarSwitchExactListing } from "../apps/web/lib/catalog/carswitch-exact-source";\n'
          if 'parseCarSwitchExactListing' not in s:
              if imp not in s: raise SystemExit('test import anchor missing')
              s=s.replace(imp,repl,1)
          marker='test("commercial vehicles are excluded from priority passenger-car sources", () => {'
          fixture=r'''
test("CarSwitch exact JSON-LD binds one vehicle cash price and rejects category/installment noise", () => {
  const markup = `
    <a href="/uae/used-cars/8-seater-cars-for-sale">8-seater cars Price 300 AED</a>
    <script type="application/ld+json" id="id-item-list-schema">{
      "@context":"https://schema.org","@type":"ItemList","itemListElement":[
        {"@type":"ItemPage","url":"https://carswitch.com/dubai/used-car/volkswagen/teramont/2023/862878","position":"1","mainEntity":{"@type":["Product","Car"],"name":"2023 Volkswagen Teramont SE","vehicleIdentificationNumber":"BUYWITHCS00862878","image":["https://d1esl34bhh6pms.cloudfront.net/cars/used/images/original/a.webp","https://d1esl34bhh6pms.cloudfront.net/cars/used/images/original/b.webp"],"mileageFromOdometer":{"@type":"QuantitativeValue","value":73700,"unitCode":"KMT"},"offers":{"@type":"Offer","availability":"https://schema.org/InStock","price":"101000","priceCurrency":"AED"}}},
        {"@type":"ItemPage","url":"https://carswitch.com/dubai/used-car/dodge/charger/2013/862241","position":"2","mainEntity":{"@type":["Product","Car"],"name":"2013 Dodge Charger","image":["https://d1esl34bhh6pms.cloudfront.net/cars/used/images/original/c.webp","https://d1esl34bhh6pms.cloudfront.net/cars/used/images/original/d.webp"],"offers":{"@type":"Offer","price":"18500","priceCurrency":"AED"}}}
      ]}
    </script>
    <div>Price 101,000 AED</div><div>Installments 1,980 AED / month</div>`;
  const rows = parseCarSwitchExactListing(markup);
  assert.equal(rows.length, 1);
  assert.equal(rows[0].id, "862878");
  assert.equal(rows[0].make, "Volkswagen");
  assert.equal(rows[0].model, "Teramont");
  assert.equal(rows[0].year, 2023);
  assert.equal(rows[0].price, 101_000);
  assert.equal(rows[0].currency, "AED");
  assert.equal(rows[0].mileageKm, 73_700);
  assert.equal(rows[0].images.length, 2);
  const offer = new CarSwitchUaeExactAdapter().normalizeOffer(rows[0]);
  assert.ok(offer);
  assert.equal(offer.sourcePrice, 101_000);
  assert.equal(offer.operational?.raw?.cashPriceAuthority, "schema_org_offer_price");
  assert.equal(offer.operational?.sourceUrl, "https://carswitch.com/dubai/used-car/volkswagen/teramont/2023/862878");
});

'''
          if 'CarSwitch exact JSON-LD binds one vehicle cash price' not in s:
              if marker not in s: raise SystemExit('test marker missing')
              s=s.replace(marker,fixture+marker,1)
          t.write_text(s)
          PY
      - name: Verify focused source tests
        run: node --import tsx --test tests/catalog-live-sources-v19.test.ts
      - name: Commit real source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/importer.ts tests/catalog-live-sources-v19.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire exact CarSwitch UAE source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
