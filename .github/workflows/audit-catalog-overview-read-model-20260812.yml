name: Audit catalog overview read model 20260812

on:
  push:
    branches:
      - audit/offer-route-latency-20260812-r2
    paths:
      - .github/workflows/audit-catalog-overview-read-model-20260812.yml
      - scripts/audit-catalog-overview-read-model-20260812.mjs

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  YC_OBJECT_STORAGE_MAX_ATTEMPTS: 3
  YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: 15000

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build, temporarily store, read and delete overview candidate
        run: node --import tsx scripts/audit-catalog-overview-read-model-20260812.mjs
