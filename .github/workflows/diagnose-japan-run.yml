name: Diagnose latest production failures

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show latest workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            --jq '.workflow_runs[] | {id,name,run_number,status,conclusion,event,head_sha,head_branch,created_at,updated_at,html_url}'
