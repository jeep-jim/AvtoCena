name: Catalog V4 · All markets · up to 30k
run-name: Catalog V4 · All markets · up to 30k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-v4-all-markets-30k.yml"

permissions:
  contents: read

concurrency:
  group: catalog-v4-all-markets-production
  cancel-in-progress: false

jobs:
  korea:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit

  japan:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: japan
      display_name: Япония
    secrets: inherit

  china:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: china
      display_name: Китай
    secrets: inherit

  uae:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
    secrets: inherit

  europe:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: europe
      display_name: Европа
    secrets: inherit

  georgia:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
    secrets: inherit

  kyrgyzstan:
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
