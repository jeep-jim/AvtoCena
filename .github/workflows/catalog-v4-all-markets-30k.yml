name: Catalog calculated · 6 markets · up to 30k each
run-name: Catalog calculated sequential recovery · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      reset_catalog:
        description: Delete the current catalog before collection
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-raw-all-markets-production
  cancel-in-progress: false

jobs:
  reset:
    name: Check storage and optionally clean catalog
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      YC_OBJECT_STORAGE_DELETE_CONCURRENCY: "16"
      CATALOG_RESET_CONFIRM: RESET_PUBLIC_CATALOG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete old catalog only when explicitly requested
        if: inputs.reset_catalog
        run: npx tsx scripts/catalog-reset-public.mjs
      - name: Keep current catalog and accumulate for three days
        if: ${{ !inputs.reset_catalog }}
        run: echo "Current catalog retained; new stable IDs will be accumulated for three days."

  korea:
    needs: reset
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: korea
      display_name: Корея
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit

  japan:
    needs: korea
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: japan
      display_name: Япония
      retention_ms: "2592000000"
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit

  china:
    needs: japan
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: china
      display_name: Китай
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit

  uae:
    needs: china
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit

  europe:
    needs: uae
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: europe
      display_name: Европа
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit

  georgia:
    needs: europe
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
      target_per_source: "30000"
      target_per_market: "30000"
      maximum_per_market: "30000"
    secrets: inherit
