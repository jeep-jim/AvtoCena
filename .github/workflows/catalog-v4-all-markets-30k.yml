name: Catalog raw · 7 markets · up to 30k each
run-name: Catalog raw rebuild · 7 markets · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      reset_catalog:
        description: Delete the current catalog before collection
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 20 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-v4-all-markets-30k.yml"

permissions:
  contents: read

concurrency:
  group: catalog-raw-all-markets-production
  cancel-in-progress: false

jobs:
  reset:
    name: Clean old catalog for the first rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_RESET_CONFIRM: RESET_PUBLIC_CATALOG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete old catalog, generations and stored photos
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.reset_catalog)
        run: npx tsx scripts/catalog-reset-public.mjs
      - name: Keep current catalog on normal daily refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.reset_catalog)
        run: echo "Daily refresh keeps the current catalog and its three-day retention window."

  korea:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: korea
      display_name: Корея
    secrets: inherit

  japan:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: japan
      display_name: Япония
    secrets: inherit

  china:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: china
      display_name: Китай
    secrets: inherit

  uae:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: uae
      display_name: ОАЭ
    secrets: inherit

  europe:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: europe
      display_name: Европа
    secrets: inherit

  georgia:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
    secrets: inherit

  kyrgyzstan:
    needs: reset
    uses: ./.github/workflows/catalog-v4-market-30k-reusable.yml
    with:
      market: kyrgyzstan
      display_name: Кыргызстан
    secrets: inherit
