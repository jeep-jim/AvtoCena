name: Catalog live recovery · Japan now
run-name: Immediate Japan live recovery · ${{ inputs.source_run_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Prestige source collection run ID"
        required: true
        default: "31261509359"

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_OFFER_RETENTION_MS: "2592000000"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  PRESTIGE_SOURCE_RUN_ID: ${{ inputs.source_run_id || '31261509359' }}

jobs:
  publish-japan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/prestige-japan-partial-merge-for-live.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
      - name: Restrict Japan fallback knowledge to primary official sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/catalog-live-recovery-japan-prestige.mjs')
          text = path.read_text()
          needle = '    if (variant.active === false || variant.modelId !== match.model.id) return false;\n'
          replacement = needle + '    if (!["manufacturer", "official_registry"].includes(String(variant.sourceType || "").trim().toLowerCase())) return false;\n'
          if text.count(needle) != 1:
              raise SystemExit(f'strict_variant_patch_anchor_count={text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          grep -F 'official_registry' scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Download all completed and partial strict Prestige chunks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prestige-source-chunks .prestige-zips
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRESTIGE_SOURCE_RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name | startswith("prestige-japan-chunk-")) | [.id,.name] | @tsv' > prestige-artifacts.tsv
          test -s prestige-artifacts.tsv
          echo "Artifacts: $(wc -l < prestige-artifacts.tsv)"
          while IFS=$'\t' read -r artifact_id artifact_name; do
            zip_path=".prestige-zips/${artifact_id}.zip"
            out_dir="prestige-source-chunks/$artifact_name/$artifact_id"
            mkdir -p "$out_dir"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$zip_path"
            unzip -q "$zip_path" -d "$out_dir"
          done < prestige-artifacts.tsv
      - name: Keep every individually valid sold lot even from timed-out chunks
        env:
          PRESTIGE_PARTIAL_INPUT_DIR: prestige-source-chunks
          PRESTIGE_PARTIAL_OUTPUT: prestige-japan-exact-sold-partial-live.json
        run: node scripts/prestige-japan-partial-merge-for-live.mjs
      - name: Calculate exact ruble totals for strict sold lots
        env:
          PRESTIGE_RECOVERY_INPUT: prestige-japan-exact-sold-partial-live.json
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "3000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - name: Enforce Japan max 20 offers per make-model and interleave every model
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path = 'catalog-rebuild-japan.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = Array.isArray(payload?.offers) ? payload.offers : [];
          const normalize = (value) => String(value || '').trim().toLocaleLowerCase('en-US').replace(/\s+/g, ' ');
          const groups = new Map();
          const groupOrder = [];
          const makes = new Set();
          let modelQuotaSkipped = 0;
          let invalidIdentitySkipped = 0;
          for (const offer of rows) {
            const make = normalize(offer?.make);
            const model = normalize(offer?.model);
            if (!make || !model) { invalidIdentitySkipped++; continue; }
            const modelKey = `${make}|${model}`;
            if (!groups.has(modelKey)) {
              groups.set(modelKey, []);
              groupOrder.push(modelKey);
            }
            const group = groups.get(modelKey);
            if (group.length >= 20) { modelQuotaSkipped++; continue; }
            group.push(offer);
            makes.add(make);
          }
          const kept = [];
          for (let round = 0; ; round++) {
            let added = false;
            for (const modelKey of groupOrder) {
              const offer = groups.get(modelKey)?.[round];
              if (!offer) continue;
              kept.push(offer);
              added = true;
            }
            if (!added) break;
          }
          const diversity = {
            countBefore: rows.length,
            countAfter: kept.length,
            distinctMakes: makes.size,
            distinctModels: groups.size,
            modelQuotaSkipped,
            invalidIdentitySkipped,
            maxOffersPerMakeModel: 20,
            modelOrdering: 'round_robin_all_models',
            maxModelsPerMake: null,
          };
          payload.offers = kept;
          payload.count = kept.length;
          payload.partial = Boolean(payload.partial) || kept.length < Number(payload?.report?.target || 3000);
          payload.report = {
            ...(payload.report || {}),
            count: kept.length,
            maxOffersPerModel: 20,
            maxModelsPerMake: null,
            modelOrdering: 'round_robin_all_models',
            strictDiversity: diversity,
          };
          fs.writeFileSync(path, JSON.stringify(payload, null, 2));
          console.log(JSON.stringify(diversity, null, 2));
          if (!kept.length) process.exit(1);
          NODE
      - name: Publish Japan market
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-live-recovery-japan-publish-report.json
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Verify actual persisted counts for every market
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { PUBLIC_CATALOG_MARKETS } = await import('./apps/web/lib/catalog/runtime-config.ts');
          const report = JSON.parse(fs.readFileSync('catalog-live-recovery-japan-publish-report.json', 'utf8'));
          const actual = {};
          for (const market of PUBLIC_CATALOG_MARKETS) actual[market] = (await readMarketOffers(market)).length;
          const problems = [];
          const japanExpected = Number(report?.count || report?.byMarket?.japan?.count || 0);
          if (!(japanExpected > 0)) problems.push('japan:empty_expected');
          if (actual.japan !== japanExpected) problems.push(`japan:${actual.japan}!=${japanExpected}`);
          for (const [market, expectedRaw] of Object.entries(report?.preservedByMarket || {})) {
            const expected = Number(expectedRaw || 0);
            if (market !== 'japan' && actual[market] !== expected) problems.push(`${market}:${actual[market]}!=${expected}`);
          }
          console.log(JSON.stringify({ generationId: report.generationId, actual, expectedJapan: japanExpected, preservedByMarket: report.preservedByMarket, problems }, null, 2));
          if (problems.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-live-recovery-japan-now-reports
          path: |
            prestige-japan-exact-sold-partial-live.json
            catalog-rebuild-japan.json
            catalog-live-recovery-japan-publish-report.json
          if-no-files-found: warn
          retention-days: 3
