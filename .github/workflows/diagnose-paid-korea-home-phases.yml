      - name: Trace four homepage reads on an owned loopback clone
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          remote_dir=''
          trace_dir="$RUNNER_TEMP/isolated-home-phases"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          cleanup() {
            if [[ "$remote_dir" =~ ^/opt/avtocena/diag-home-[A-Za-z0-9]{10}$ ]]; then
              # The Python finally owns container/env cleanup. This removes only
              # the two transferred nonsecret files, then an empty private folder.
              timeout 20s ssh -T -n "${ssh_opts[@]}" root@151.248.113.177 "rm -f -- '$remote_dir/diagnostic.py' '$remote_dir/home-phase-parser.py'; rmdir -- '$remote_dir'" >/dev/null 2>&1 || true
            fi
            rm -f -- "$key_file"
          }
          trap cleanup EXIT
          remote_dir=$(timeout 20s ssh -T -n "${ssh_opts[@]}" root@151.248.113.177 'umask 077; mktemp -d /opt/avtocena/diag-home-XXXXXXXXXX')
          [[ "$remote_dir" =~ ^/opt/avtocena/diag-home-[A-Za-z0-9]{10}$ ]]
          timeout 45s scp -q "${ssh_opts[@]}" "$trace_dir/diagnostic.py" "$trace_dir/home-phase-parser.py" "root@151.248.113.177:$remote_dir/"
          # No build/pull, original start/stop, public switch, Nginx reload or
          # provider collection. The copied image can make its normal cache PUTs.
          # Its 2 CPU/8 GiB timings are explicitly not production acceptance.
          set +e
          timeout 940s ssh -T -n "${ssh_opts[@]}" root@151.248.113.177 "timeout --signal=TERM --kill-after=20s 915s python3 -B '$remote_dir/diagnostic.py'" 2>"$RUNNER_TEMP/home-phase-transport-private.err" | tee -a "$trace_dir/trace.jsonl"
          result=${PIPESTATUS[0]}
          set -e
          printf '{"schemaVersion":1,"event":"controller_exit","exitCode":%d}\n' "$result" | tee -a "$trace_dir/trace.jsonl"
