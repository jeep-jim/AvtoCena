name: Catalog Japan · publish verified Prestige aggregate
run-name: Publish verified Japan aggregate · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PRESTIGE_SOURCE_RUN_ID: "31786381384"
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_MARKET_CONFIG_CACHE_MS: "600000"
  CATALOG_OFFER_RETENTION_MS: "2592000000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download completed 9292-offer aggregate from production run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prestige-live-input
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRESTIGE_SOURCE_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "prestige-japan-exact-sold-up-to-30000") | .id' | head -n1)"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > prestige-aggregate.zip
          unzip -qo prestige-aggregate.zip -d prestige-live-input
          test -s prestige-live-input/prestige-japan-exact-sold-up-to-30000.json
      - name: Revalidate every exact price, identity and v2 gallery binding
        env:
          PRESTIGE_AGGREGATE_INPUT: prestige-live-input/prestige-japan-exact-sold-up-to-30000.json
          PRESTIGE_AGGREGATE_OUTPUT: prestige-japan-exact-sold-verified-salvage.json
          PRESTIGE_AGGREGATE_MIN_COUNT: "5000"
          PRESTIGE_MIN_CHUNK_COVERAGE: "0.95"
        run: node scripts/prestige-japan-aggregate-salvage.mjs
      - name: Enrich exact sold lots with documented chassis power when available
        shell: bash
        env:
          PRESTIGE_OFFICIAL_INPUT: prestige-japan-exact-sold-verified-salvage.json
          PRESTIGE_OFFICIAL_OUTPUT: prestige-japan-exact-sold-official-power.json
        run: |
          set +e
          node scripts/prestige-japan-official-chassis-enrich.mjs
          status=$?
          set -e
          test -s prestige-japan-exact-sold-official-power.json
          if [ "$status" -ne 0 ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('prestige-japan-exact-sold-official-power.json', 'utf8'));
          const offers = Array.isArray(payload?.offers) ? payload.offers : [];
          const enrichment = payload?.report?.officialPowerEnrichment;
          const enriched = Number(enrichment?.enriched ?? -1);
          if (!offers.length || enriched !== 0) throw new Error(`official_power_enrichment_failed_with_invalid_passthrough: offers=${offers.length} enriched=${enriched}`);
          console.log(`No optional official chassis power match; continuing fail-closed with ${offers.length} unchanged offers.`);
          NODE
          fi
      - name: Calculate every verified exact or explicitly preliminary Japan card
        env:
          PRESTIGE_RECOVERY_INPUT: prestige-japan-exact-sold-official-power.json
          PRESTIGE_RECOVERY_OUTPUT: catalog-rebuild-japan.json
          PRESTIGE_RECOVERY_TARGET: "30000"
          PRESTIGE_RECOVERY_CONCURRENCY: "12"
        run: npx tsx scripts/catalog-live-recovery-japan-prestige.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-japan-verified-aggregate-ready
          path: |
            prestige-japan-exact-sold-verified-salvage.json
            prestige-japan-exact-sold-official-power.json
            catalog-rebuild-japan.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: prepare
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-japan-verified-aggregate-ready
          path: japan-ready
      - name: Verify all seven markets before the single catalog write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-aggregate-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":2200,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Publish Japan cumulatively and preserve the other six markets
        env:
          RECOVERY_PUBLISH_MARKET: japan
          RECOVERY_PUBLISH_INPUT: japan-ready/catalog-rebuild-japan.json
          RECOVERY_PUBLISH_REPORT: catalog-japan-aggregate-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Verify the published generation across all seven markets
        env:
          CATALOG_AUDIT_OUTPUT: catalog-japan-aggregate-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":8000,"china":6500,"japan":2200,"uae":900,"europe":3000,"georgia":2000,"kyrgyzstan":1900}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-japan-verified-aggregate-publish-reports
          path: |
            catalog-japan-aggregate-preflight-audit.json
            catalog-japan-aggregate-publish-report.json
            catalog-japan-aggregate-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
