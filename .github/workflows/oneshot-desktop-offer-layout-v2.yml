name: One-shot desktop offer layout redesign v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-desktop-offer-layout-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: git pull --ff-only origin main

      - name: Reuse validated patch from v1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/oneshot-desktop-offer-layout-v1.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'desktop-offer-layout-patch', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Verify and publish
        run: |
          grep -q 'data-offer-desktop-actions-slot' 'apps/web/app/(public)/cars/offer/[id]/page.tsx'
          grep -q 'lastWheelAt' apps/web/components/catalog/VehicleGallery.tsx
          grep -q 'ac-vehicle-desktop-thumbnails' apps/web/components/catalog/VehicleGallery.tsx
          grep -q 'stacked className="mt-4 hidden xl:grid"' apps/web/components/catalog/OfferContactActions.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/VehicleGallery.tsx apps/web/components/catalog/OfferContactActions.tsx 'apps/web/app/(public)/cars/offer/[id]/page.tsx'
          git rm .github/workflows/oneshot-desktop-offer-layout-v1.yml .github/workflows/oneshot-desktop-offer-layout-v2.yml
          git commit -m 'Redesign desktop offer gallery and details layout'
          git restore .
          git pull --rebase origin main
          git push origin main
