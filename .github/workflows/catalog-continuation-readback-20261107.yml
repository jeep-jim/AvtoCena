name: Catalog continuation record 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-continuation-readback-20261107.yml']
permissions:
  contents: write
concurrency:
  group: catalog-continuation-record-20261107
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append confirmed installation and keep unresolved failures visible
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tail -n 35 AGENTS.md
          cat docs/operations/2026-11-07-catalog-installed-readback.md
          python3 - <<'PY'
          import os,json,datetime,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/jeep-jim/AvtoCena'
          def read(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          evidence={}
          for name,run_id in [('deployment',42356872095),('installedBrowserReadback',42360024550),('isolatedSingleRailCandidate',42359906366)]:
              run=read('/actions/runs/'+str(run_id));jobs=read('/actions/runs/'+str(run_id)+'/jobs?per_page=20')['jobs']
              evidence[name]={'run':run_id,'status':run['status'],'conclusion':run['conclusion'],'jobs':[{'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'activeSteps':[s['name'] for s in j.get('steps',[]) if s['status']=='in_progress']} for j in jobs]}
          assert evidence['installedBrowserReadback']['conclusion']=='success'
          assert evidence['isolatedSingleRailCandidate']['conclusion']=='success'
          at=datetime.datetime.now(datetime.timezone.utc).isoformat()
          note='''

          ## 07.11.2026 — установлен PR1714/1715; фактическая приёмка каталога остаётся частичной

          Поручение владельца «продолжай» выполнено: единственный release11e3b4ed853518731c11aa1522068cc87cbb8ff4 установлен и подтверждён до/после внешнего браузерного прогона42360024550. Скачан и прочитан artifact13569575865, SHA256b40d981dee749bc2310e9e61660ad8506e0d9d628c5d659a1a621e1577b727d2; просмотрены снимки Китая, Кореи<=160, мобильного Китая и карточки. Отчёт в main: docs/operations/2026-11-07-catalog-installed-readback.md.

          15каталожных сценариев и1настоящая карточка: HTTP200, HTTP/2, загруженный Onest, тематические H1; query-входы3стран возвращают308 с сохранением city/page/powerTo. Проверенные строки общей ошибки и uncaught pageerror отсутствуют. Это не полная приёмка: Корея<=160=0карточек/неполный счётчик, Япония<=160=1/неполный; Китай<=160 в одиночном замере DOM5.909с. Есть учтённые неуспешные same-origin запросы, причина не записана этим аудитом; на раннем desktopChinaPNG замечено оформление меню диапазонов «Не важно», требующее проверки после гидратации. Не считать сеть/всю верстку/все цены/всю базу проверенными. Периодический /cars не воспроизведён, но первопричина окончательно не закрыта.

          PR1716/head97e53be924ce168f00f5f1eb985e0c41ecfb732f подготовлен отдельно, ещё не объединён/не установлен. Полный npm test, typecheck, build и браузерное сравнение5ширин×2темы SUCCESS в42359906366. В макете183марки сохранены,366элементовлоготипов→183, расположение/закрепление/retainedcards сохранены. Второго deploy нет; нужен стандартный CI и последующая live-проверка.

          Продолжаем по плану от07.11: точное сопоставление объявлений с проверенными вариантами из энциклопедии (19/24Korea model_identity_unresolved,5/24verified_variants_missing в сохранённой выборке), без подстановки PW; единые основания списка/счётчика; сокращение лишней разметки; сетевые/визуальные дефекты и холодный/прогретый замер; полный sitemap/canonical/redirect audit. Источники, допуск, тарифы, пошлины, комиссии, ручные правки, дилерские права и CRM не изменять ради визуально зелёного экрана. Несвязанные функции не продолжать.
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())+'\n'
          note+='\nСостояния запусков на '+at+':\n```json\n'+json.dumps(evidence,ensure_ascii=False,indent=2)+'\n```\n'
          p=Path('roadmap.md');before=p.read_bytes();p.write_bytes(before+note.encode());assert p.read_bytes().startswith(before)
          Path('docs/operations/2026-11-07-catalog-checkpoint.md').write_text(note.lstrip())
          Path('docs/operations/2026-11-07-catalog-checkpoint.json').write_text(json.dumps({'at':at,**evidence},ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md docs/operations/2026-11-07-catalog-checkpoint.md docs/operations/2026-11-07-catalog-checkpoint.json
          git commit -m 'docs: confirm installed catalog release and retain power, network and SEO blockers'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git rebase origin/main
          done
          git log -1 --format='%H %s'
          mkdir -p continuation-report
          tail -n 150 roadmap.md > continuation-report/roadmap-tail.md
          cp docs/operations/2026-11-07-catalog-checkpoint.* continuation-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-continuation-record
          path: continuation-report
          retention-days: 7
