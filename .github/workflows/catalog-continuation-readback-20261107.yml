name: Catalog continuation record 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-continuation-readback-20261107.yml']
permissions:
  contents: write
concurrency:
  group: catalog-continuation-record-20261107
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append dealer green regression and exact current PR states
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tail -n 35 AGENTS.md
          tail -n 85 roadmap.md
          python3 - <<'PY'
          import os,json,datetime,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/jeep-jim/AvtoCena'
          def read(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          evidence={}
          for number in [1716,1717]:
              pr=read('/pulls/'+str(number))
              runs=read('/actions/runs?head_sha='+pr['head']['sha']+'&event=pull_request&per_page=50')['workflow_runs']
              evidence[str(number)]={'state':pr['state'],'merged':pr['merged'],'head':pr['head']['sha'],'merge':pr['merge_commit_sha'],'checks':[{'run':r['id'],'name':r['name'],'status':r['status'],'conclusion':r['conclusion']} for r in runs]}
          at=datetime.datetime.now(datetime.timezone.utc).isoformat()
          note='''

          ## 07.11.2026 — регрессия «Зелёного угла» у дилера: ремонт по скриншотам владельца

          Владелец показал /dealers/avtograd?make=Nissan&market=japan&stock=green: заголовок, баннер и выдача сжаты в левую колонку; stock=all сохраняет правую выдачу. Причина в проверенных исходниках: GreenCornerCatalog повторно создавал DealerBrowsingProvider при embedded=true и не выдавал прямой dealer-shared-catalog. Это нарушает селектор #catalog>.dealer-shared-catalog и общую сетку DealerProfileStyles.

          PR1717 устраняет именно вложенную обёртку и возвращает общий embedded shell. Самостоятельная /cars/green сохраняет собственную шапку/provider. Расчёты, объявления, фильтры, город, проверка разрешённой Японии и права не меняются. 53 адресные проверки первого запуска прошли, включая новые регрессии embedded/standalone/дилерского допуска; браузерный стенд остановился на конфигурации CSS modules, до проверки вёрстки. Стенд исправляется без удаления проверок. На этой записи новый runtime ещё НЕ опубликован.

          PR1716 с одной адаптивной полосой марок прошёл восемь стандартных проверок и объединён коммитом69c9ccca21bb2c865260c775d32261db7c437691. Это объединение кода, не установка. Один согласованный выпуск после зелёных проверок PR1717 и проверки отсутствия действующего deploy; не запускать дубликаты и не отменять здоровые задачи.

          Приёмка: исходный URL владельца, переход аукционы→в наличии→назад, прямой вход и перезагрузка; сохранение Nissan/города/<=160/страницы; desktop/tablet/mobile, обе темы; фильтры слева, баннер/карточки справа и реквизиты после каталога, один provider/dock. Изолированный SSR-стенд не заменяет реальные гидратированные переходы после установки. Сохраняются обязательные незакрытые пункты плана07.11: полнота мощности Кореи/Японии, согласованность счётчика, холодная/прогретая скорость и SEO. Не подменять неизвестные характеристики и не отключать источники ради быстрого пустого экрана.
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())+'\n'
          note+='\nСостояние GitHub на '+at+':\n```json\n'+json.dumps(evidence,ensure_ascii=False,indent=2)+'\n```\n'
          marker='## 07.11.2026 — регрессия «Зелёного угла» у дилера: ремонт по скриншотам владельца'
          p=Path('roadmap.md');before=p.read_bytes()
          if marker.encode() not in before:p.write_bytes(before+note.encode())
          assert p.read_bytes().startswith(before)
          Path('docs/operations/2026-11-07-dealer-green-progress.md').write_text(note.lstrip())
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md docs/operations/2026-11-07-dealer-green-progress.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record dealer green layout regression and approved recovery scope'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git rebase origin/main
            done
          fi
          git log -1 --format='%H %s'
          mkdir -p continuation-report
          tail -n 170 roadmap.md > continuation-report/roadmap-tail.md
          cp docs/operations/2026-11-07-dealer-green-progress.md continuation-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-continuation-record
          path: continuation-report
          retention-days: 7
