name: Catalog continuation record 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-continuation-readback-20261107.yml']
permissions:
  contents: write
concurrency:
  group: catalog-continuation-record-20261107
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append factual checkpoint while preserving the recovery history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tail -n 35 AGENTS.md
          cat docs/operations/2026-11-07-catalog-recovery-plan.md
          python3 - <<'PY'
          import os,json,datetime,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/jeep-jim/AvtoCena'
          def read(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          evidence={}
          for name,run_id in [('deployment',42356872095),('publicBrowserReadback',42357261786)]:
              run=read('/actions/runs/'+str(run_id))
              jobs=read('/actions/runs/'+str(run_id)+'/jobs?per_page=20')['jobs']
              evidence[name]={'run':run_id,'status':run['status'],'conclusion':run['conclusion'],'head':run['head_sha'],'jobs':[{'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'activeSteps':[s['name'] for s in j.get('steps',[]) if s['status']=='in_progress']} for j in jobs]}
          at=datetime.datetime.now(datetime.timezone.utc).isoformat()
          text='## 07.11.2026 — контрольная запись продолжения восстановления\n\n'
          text+='Сверка '+at+'. План восстановления от07.11 остаётся обязательным; несвязанные функции не выполняются.\n\n'
          text+='Проверка42357690240/128359285650 прочитала только48уже сохранённых объявлений, без запросов к поставщику и без изменения данных. Корея:19/24неразрешённых идентичностей модели,5/24без проверенных вариантов; мощность не установлена для24/24на всех этапах технической цепочки. Япония:23/24без строки точной модели+года в установленном calculation index,1проходит существующее owner-правило. Это выборка, не вывод о всей базе; сырой PW не превращать в подтверждённую характеристику. Подробности и хеш артефакта: docs/operations/2026-11-07-catalog-power-pipeline-readback.md.\n\n'
          text+='Публикация391 запущена один раз, ожидаемый application release11e3b4ed853518731c11aa1522068cc87cbb8ff4. Реальные текущие состояния ниже получены из API; метаданные SUCCESS сами по себе не равны приёмке каталога.\n\n```json\n'+json.dumps(evidence,ensure_ascii=False,indent=2)+'\n```\n\n'
          text+='Открытые задачи: дождаться результата уже запущенного выпуска без дубликатов; прочитать браузерный отчёт точного установленного SHA и визуальные результаты; устранить точные разрывы сопоставления уже известных вариантов/доказанные пробелы фактов; обеспечить одинаковую основу фильтра и счётчика; затем убрать двойную разметку полосы марок с сохранением размещения/всехмарок и закончить sitemap/canonical/redirect audit. Не называть периодическое падение /cars или полноту<=160исправленными до фактической проверки.\n'
          p=Path('roadmap.md');before=p.read_bytes();p.write_bytes(before+b'\n\n'+text.encode());assert p.read_bytes().startswith(before)
          Path('docs/operations/2026-11-07-catalog-checkpoint.md').write_text(text)
          Path('docs/operations/2026-11-07-catalog-checkpoint.json').write_text(json.dumps({'at':at,**evidence},ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md docs/operations/2026-11-07-catalog-checkpoint.md docs/operations/2026-11-07-catalog-checkpoint.json
          git commit -m 'docs: checkpoint recovery release and confirmed power-matching gaps'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git rebase origin/main
          done
          git log -1 --format='%H %s'
          mkdir -p continuation-report
          tail -n 140 roadmap.md > continuation-report/roadmap-tail.md
          cp docs/operations/2026-11-07-catalog-checkpoint.* continuation-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-continuation-record
          path: continuation-report
          retention-days: 7
