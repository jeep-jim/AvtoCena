name: Catalog continuation record 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/catalog-continuation-readback-20261107.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-continuation-record-20261107
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read existing instructions and append verified recovery state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tail -n 40 AGENTS.md
          tail -n 100 roadmap.md
          python3 - <<'PY'
          import os,json,datetime,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/jeep-jim/AvtoCena'
          def read(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          evidence={}
          for number in [1716,1717]:
              pr=read('/pulls/'+str(number))
              runs=read('/actions/runs?head_sha='+pr['head']['sha']+'&event=pull_request&per_page=50')['workflow_runs']
              evidence['PR'+str(number)]={'state':pr['state'],'merged':pr['merged'],'head':pr['head']['sha'],'merge':pr['merge_commit_sha'],'checks':[{'run':r['id'],'name':r['name'],'status':r['status'],'conclusion':r['conclusion']} for r in runs]}
          for name,ident in [('deployment',42367668990),('liveReadback',42367789665)]:
              run=read('/actions/runs/'+str(ident));jobs=read('/actions/runs/'+str(ident)+'/jobs?per_page=20')['jobs']
              evidence[name]={'run':ident,'head':run['head_sha'],'status':run['status'],'conclusion':run['conclusion'],'jobs':[{'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'activeSteps':[s['name'] for s in j['steps'] if s['status']=='in_progress']} for j in jobs]}
          try:
              with urllib.request.urlopen('https://avtocena.com/api/health',timeout=15) as response:h=json.load(response)
              evidence['health']={k:h.get(k) for k in ['ok','releaseSha','calculationVersion']}
          except Exception:
              evidence['health']={'verified':False,'reason':'public_health_not_read'}
          at=datetime.datetime.now(datetime.timezone.utc).isoformat()
          note='''## 07.11.2026 — продолжение после обрыва ответа: исправление дилерского «Зелёного угла» сохранено

          Повторно проверены PR1716/1717, их фактический diff и результаты проверок. PR1717 исправляет лишний DealerBrowsingProvider и отсутствующий прямой dealer-shared-catalog при embedded=true; standalone-режим сохранён. Все шесть стандартных workflow точного head3f3a870834a746fb3cacade4553585fbde121099 завершились SUCCESS. Исправление и одна адаптивная полоса марок PR1716 объединены, но слияние не считается установкой.

          Единственный действующий выпуск —393/run42367668990, ожидаемый application release a5f9a645835ae636ab99dd1a7b1073ba24d851b4. Дополнительный deployment в этой сессии не запускался; release marker и формулы не менялись. Уже запущенный readback42367789665 ожидает завершения именно этого выпуска и проверяет исходный дилерский URL, реальный SPA-переход аукционы↔в наличии, город/марку, ширины1440/1024/390 и публичную единственную полосу марок. Результат браузерного прогона нужно прочитать, а снимки осмотреть до объявления live-приёмки.

          Тестовый снимок green-1600-dark показывает исправленную геометрию на изолированных данных, не установленный сайт. Прямая сеть из текущей среды недоступна; это не вывод о доступности сервиса, проверка ведётся внешним runner. Состояния ниже получены на указанную дату напрямую из GitHub и публичного health, не из старого сообщения.

          Главные незакрытые обязательства плана07.11 сохраняются: точное сопоставление мощности Кореи/Японии с проверенными вариантами, полнота<=160 и согласованность счётчика, устранение intermittent/cars, холодные/прогретые замеры, ошибки сети и полная SEO-приёмка. Не называть весь сайт быстрым/исправным по одному CI или HTTP200. Источники, права, энциклопедия/ручные данные, цены/пошлины/комиссии и сроки свежести не изменяются этим контрольным действием.
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())+'\n'
          note+='\nКонтроль на '+at+':\n```json\n'+json.dumps(evidence,ensure_ascii=False,indent=2)+'\n```\n'
          p=Path('roadmap.md');before=p.read_bytes();marker=note.splitlines()[0].encode()
          if marker not in before:p.write_bytes(before+b'\n\n'+note.encode())
          assert p.read_bytes().startswith(before)
          Path('docs/operations/2026-11-07-dealer-green-resume.md').write_text(note)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md docs/operations/2026-11-07-dealer-green-resume.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: checkpoint dealer green release and remaining catalog acceptance'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git rebase origin/main
            done
          fi
          git log -1 --format='%H %s'
          mkdir -p continuation-report
          tail -n 220 roadmap.md > continuation-report/roadmap-tail.md
          cp docs/operations/2026-11-07-dealer-green-resume.md continuation-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-continuation-record
          path: continuation-report
          retention-days: 7
