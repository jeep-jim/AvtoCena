name: Catalog V3 · Georgia · 10k
run-name: Catalog V3 · Georgia · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/market-runs/georgia"

# Automatic scheduling lives only in catalog-v3-sequential-queue.yml.
permissions:
  contents: read

jobs:
  georgia:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
      reset_cursor: ${{ github.event_name != 'schedule' }}
      priority_target: "100"
    secrets: inherit
