name: Catalog V3 · Georgia · 10k
run-name: Catalog V3 · Georgia · 10k · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "10 3 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-v2-georgia.yml

# Recovery marker: guarded-publication-2026-08-06.
permissions:
  contents: read

jobs:
  georgia:
    uses: ./.github/workflows/catalog-v3-market-10k-reusable.yml
    with:
      market: georgia
      display_name: Грузия
    secrets: inherit
