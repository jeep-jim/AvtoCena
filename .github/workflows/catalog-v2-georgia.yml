name: Catalog V2 · Georgia
run-name: Catalog V2 · Georgia · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "5 8 * * *"

# Independent daily market. 15:05 Asia/Novokuznetsk (UTC+7).
permissions:
  contents: read

jobs:
  georgia:
    uses: ./.github/workflows/catalog-v2-market-recovery-reusable.yml
    with:
      market: georgia
      display_name: Грузия
    secrets: inherit
