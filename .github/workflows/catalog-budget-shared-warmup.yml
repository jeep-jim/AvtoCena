name: Prepare shared budget prices
on:
  workflow_dispatch:
  push:
    branches: [main, fix/shared-budget-prices-20261009]
    paths: [apps/web/lib/catalog/shared-budget-prices.ts, apps/web/lib/catalog/budget-market-index.ts, scripts/catalog-budget-shared-warmup.mjs, .github/workflows/catalog-budget-shared-warmup.yml]
  workflow_run:
    workflows: [Deploy to Yandex Cloud]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: catalog-budget-shared-warmup
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVTOCENA_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - name: Test invalidation, identity and budget boundaries
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-shared-budget-prices.test.ts tests/catalog-live-budget-replay.test.ts tests/catalog-budget-combined.test.ts
        env:
          JSON_STORAGE_DRIVER: local
          CATALOG_LIVE_RATE_DISABLED: 'true'
      - name: Prepare selectors and validate cold-instance reuse without collecting sources
        run: node --import tsx scripts/catalog-budget-shared-warmup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-budget-shared-report
          path: catalog-budget-shared-report.json
          retention-days: 7
