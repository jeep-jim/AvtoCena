name: Prepare shared budget prices
on:
  workflow_dispatch:
  schedule:
    # The calculation fingerprint changes at UTC midnight.
    - cron: '11 0 * * *'
  push:
    branches: [main, perf/feed-budget-preparation-20261010]
    paths: [apps/web/lib/catalog/shared-budget-prices.ts, apps/web/lib/catalog/budget-market-index.ts, apps/web/lib/catalog/budget-selector-codec.ts, scripts/catalog-budget-shared-warmup.mjs, scripts/catalog-budget-runtime.mjs]
  workflow_run:
    workflows: [Deploy to Yandex Cloud, Verify committed Che168 publication, Catalog refresh china, Catalog refresh korea, Catalog refresh uae, Catalog refresh europe, Catalog refresh georgia, Catalog refresh green]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: catalog-budget-shared-warmup
  cancel-in-progress: false
jobs:
  prepare:
    # Retired duplicate: public health resolves REG, but this workflow reads the
    # old YC namespace (43118080350: live_encyclopedia_binding_missing).
    # Normal market workers -> regcloud-overview -> regcloud-prices use REG.
    # Re-enable only after a separate reviewed health/storage target is defined.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the actual deployed calculator version
        id: live
        run: node automation/scripts/catalog-budget-runtime.mjs --resolve
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.live.outputs.release }}
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
        working-directory: runtime
      - name: Test context guards and existing budget contracts offline
        working-directory: runtime
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test ../automation/tests/catalog-budget-runtime.test.ts tests/catalog-shared-budget-prices.test.ts tests/catalog-live-budget-replay.test.ts tests/catalog-budget-combined.test.ts
        env:
          JSON_STORAGE_DRIVER: local
          CATALOG_LIVE_RATE_DISABLED: 'true'
      - name: Prepare shared prices on GitHub and verify cold-instance reuse
        working-directory: runtime
        env:
          AVTOCENA_RELEASE_SHA: ${{ steps.live.outputs.release }}
        run: |
          # Use current orchestration while importing the exact live calculator.
          cp ../automation/scripts/catalog-budget-shared-warmup.mjs scripts/catalog-budget-shared-warmup.mjs
          node --import tsx ../automation/scripts/catalog-budget-runtime.mjs .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-budget-shared-report
          path: |
            runtime/catalog-budget-shared-report.json
            runtime/catalog-budget-runtime-report.json
          retention-days: 7
