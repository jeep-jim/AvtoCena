name: Validate UAE Georgia age purge publish order

on:
  push:
    branches: [fix/uae-georgia-preaudit-age-20260811]
    paths:
      - .github/workflows/validate-uae-georgia-age-publish-order.yml

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uae-georgia-preaudit-age-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Reuse exact successful collector artifacts from failed publish run
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-direct-recovery-*
          path: recovery-input
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: 31452856209
          github-token: ${{ github.token }}
      - name: Snapshot old catalog without asserting new age floor before cleanup
        env:
          CATALOG_AUDIT_OUTPUT: before.json
          CATALOG_AUDIT_ASSERT_MARKETS: ""
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Dry-run exact batch publisher on same UAE Georgia artifacts
        env:
          RECOVERY_BATCH_MARKETS: uae,georgia
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: dry.json
          RECOVERY_BATCH_DRY_RUN: "1"
          RECOVERY_PUBLISH_MAX: "3000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Assert deterministic age-purge plan
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('before.json','utf8'));
          const dry = JSON.parse(fs.readFileSync('dry.json','utf8'));
          if (before.failures?.length) throw new Error(`pre_snapshot_should_not_fail:${before.failures.join(',')}`);
          for (const market of ['uae','georgia']) {
            if (!(Number(dry.byMarket?.[market]?.count || 0) > 0)) throw new Error(`empty_target:${market}`);
            if (Number(dry.byMarket?.[market]?.minYear || 0) !== 2020) throw new Error(`bad_target_min_year:${market}:${dry.byMarket?.[market]?.minYear}`);
          }
          for (const market of ['korea','china','japan','europe','kyrgyzstan']) {
            const stats = before.markets?.[market] || {};
            const expected = Number(stats.count || 0) - Number(stats.belowMarketMinYearCount || 0);
            const planned = Number(dry.preservedByMarket?.[market] || 0);
            if (planned !== expected) throw new Error(`preserve_plan_mismatch:${market}:expected=${expected}:planned=${planned}`);
          }
          console.log({passed:true, targets:Object.fromEntries(['uae','georgia'].map(m=>[m,dry.byMarket[m].count])), preserved:dry.preservedByMarket});
          NODE
      - name: Static workflow ordering guard
        run: |
          grep -A4 'Snapshot all seven markets before batch write' .github/workflows/catalog-live-recovery-uae-georgia-direct.yml | grep -q 'CATALOG_AUDIT_ASSERT_MARKETS: ""'
          grep -q 'belowMarketMinYearCount' .github/workflows/catalog-live-recovery-uae-georgia-direct.yml
