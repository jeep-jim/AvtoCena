name: Finish verified paid Korea cutover
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-verified-paid-korea.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm exact live release and recovered encyclopedia
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          const origin='https://avtocena.com';
          async function check(path,validate){
           for(let attempt=1;attempt<=3;attempt++){
            try{
             const response=await fetch(origin+path,{signal:AbortSignal.timeout(45000),headers:{'Cache-Control':'no-cache'}});
             assert.equal(response.status,200,path+':'+response.status);
             const json=await response.json();
             validate(json);
             console.log('LIVE_OK',JSON.stringify({path,attempt,status:response.status}));
             return;
            }catch(error){
             if(attempt===3)throw error;
             await new Promise(resolve=>setTimeout(resolve,3000));
            }
           }
          }
          await check('/api/health',json=>assert.equal(json.releaseSha,'83ff17075e9188dcf227c8752dc064248d5f42e0'));
          await check('/api/catalog/search?market=korea&marketPage=1&page=1&pageSize=24',json=>{
           assert.ok(json.ok&&json.total>=3&&json.items.length>=3);
           assert.ok(json.items.slice(0,3).every(row=>row.paidEncar===true&&row.sourceCurrency==='KRW'));
          });
          await check('/api/encyclopedia/7efa3d4933728bc66771084b?year=2022',json=>assert.ok(json&&typeof json==='object'));
          CHECK
  verify-and-retire:
    needs: preflight
    uses: ./.github/workflows/verify-finish-paid-encar.yml
    secrets: inherit
