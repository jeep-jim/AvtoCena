        cat > "$RUNNER_TEMP/candidate-preparation.mjs" <<'PIN_2633117b6062e0fbfff5'
        import {configureProgress,progress} from './preparation-progress.mjs';
        import assert from 'node:assert/strict';
        import {readDiagnostics,safeDiagnostic} from './candidate-preparation-diagnostics.mjs';
        import {explain} from './scripts/safe-prepare-errors.mjs';
        import {createHash} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import fs from 'node:fs';
        import path from 'node:path';
        import {fileURLToPath} from 'node:url';

        const hash = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
        const MARKETS = ['china', 'europe', 'georgia', 'korea', 'uae'];
        const HEX = /^[a-f0-9]{64}$/;

        /** Validate the exact durable candidate context; preparation is never installation. */
        export function validateCandidatePreparationReport(report, {spec, reuse, action, healthPhase, prepared, now = Date.now()}) {
          assert.equal(report?.version, 1, 'candidate_preparation_report_version');
          assert.equal(report.verified, true, 'candidate_preparation_unverified');
          assert.equal(report.candidatePrepared, true, 'candidate_preparation_missing');
          assert.equal(report.installed, false, 'preparation_cannot_claim_installation');
          assert.equal(report.liveReady, false, 'preparation_cannot_claim_live_readiness');
          assert.equal(report.published, false, 'preparation_cannot_claim_publication');
          assert.equal(report.action, action, 'candidate_preparation_action');
          assert.equal(report.healthPhase, healthPhase, 'candidate_preparation_health_phase');
          assert.ok(['prepare', 'verify'].includes(action));
          assert.ok(['before-activation', 'after-activation'].includes(healthPhase));
          assert.ok(action === 'verify' || healthPhase === 'before-activation', 'preparation_after_activation_forbidden');
          assert.ok(Number.isSafeInteger(report.derivedWrites) && report.derivedWrites >= 0, 'candidate_preparation_write_count');
          if (action === 'verify') assert.equal(report.derivedWrites, 0, 'candidate_verification_wrote_objects');
          const core = report.core;
          assert.equal(core?.version, 1, 'candidate_preparation_core_version');
          assert.match(report.receiptSha256 || '', HEX, 'candidate_preparation_receipt_missing');
          assert.equal(hash(core), report.receiptSha256, 'candidate_preparation_receipt_corrupt');
          assert.equal(core.release, spec.source, 'candidate_preparation_source');
          assert.equal(core.calculationVersion, spec.calculationVersion, 'candidate_preparation_calculator');
          assert.equal(reuse.releaseSha, spec.source, 'private_preparation_source');
          assert.equal(reuse.calculationVersion, spec.calculationVersion, 'private_preparation_calculator');
          assert.equal(reuse.passed, true, 'private_preparation_failed');
          assert.equal(reuse.sourceStateUnchanged, true, 'private_preparation_context_changed');
          assert.equal(reuse.encyclopediaCompatibility?.digest, spec.encyclopediaCompatibilityDigest, 'private_preparation_compatibility');
          assert.equal(core.encyclopediaDigest, reuse.encyclopediaDigest, 'candidate_preparation_private_index');
          assert.equal(core.generationId, reuse.generationId, 'candidate_preparation_generation');
          assert.equal(core.manifestDigest, reuse.snapshot.manifestSha256, 'candidate_preparation_manifest');
          assert.equal(core.controlsRevision?.found, true, 'candidate_preparation_controls_missing');
          assert.ok(core.controlsRevision.etag && core.manifestEtag, 'candidate_preparation_etags_missing');
          assert.equal(core.controlsRevision.digest, reuse.snapshot.controlsSha256, 'candidate_preparation_controls');
          assert.deepEqual(core.baselineLiveIdentity, {release: spec.retainedSource, calculationVersion: spec.retainedCalculationVersion}, 'candidate_preparation_baseline');
          const observed = healthPhase === 'before-activation' ? core.baselineLiveIdentity : {release: spec.source, calculationVersion: spec.calculationVersion};
          assert.deepEqual(report.observedLiveIdentity, observed, 'candidate_preparation_observed_identity');
          assert.equal(core.utcDay, new Date(now).toISOString().slice(0, 10), 'candidate_preparation_utc_day_changed');
          assert.equal(core.policyDay, new Date(now + 7 * 3600000).toISOString().slice(0, 10), 'candidate_preparation_policy_day_changed');
          assert.ok(MARKETS.every(market => Number.isSafeInteger(reuse.marketCounts?.[market]) && reuse.marketCounts[market] >= 0), 'candidate_preparation_all_market_counts_required');
          const required = Object.entries(reuse.marketCounts || {}).filter(([, count]) => count > 0).map(([market]) => market).sort();
          assert.ok(required.length > 0 && required.every(market => MARKETS.includes(market)), 'candidate_preparation_market_scope');
          assert.deepEqual(Object.keys(core.markets || {}).sort(), required, 'candidate_preparation_markets_incomplete');
          assert.deepEqual(Object.keys(core.contract?.markets || {}).sort(), required, 'candidate_preparation_contract_incomplete');
          assert.equal(core.contract.release, spec.source, 'candidate_preparation_contract_source');
          assert.equal(core.contract.calculationVersion, spec.calculationVersion, 'candidate_preparation_contract_calculator');
          assert.equal(core.contract.encyclopediaDigest, core.encyclopediaDigest, 'candidate_preparation_contract_index');
          assert.equal(core.contract.generationId, core.generationId, 'candidate_preparation_contract_generation');
          assert.equal(core.contract.manifestDigest, core.manifestDigest, 'candidate_preparation_contract_manifest');
          const prefix = `catalog/generations/${core.generationId}/indexes/budget-markets-v7/${hash([core.encyclopediaDigest, core.calculationVersion])}/`;
          assert.equal(core.contract.specificationPrefix, prefix, 'candidate_preparation_selector_namespace');
          assert.equal(core.preparedSelections?.verified, true, 'candidate_prepared_selection_missing');
          assert.equal(core.preparedSelections.generationId, core.generationId, 'candidate_prepared_selection_generation');
          assert.ok(Array.isArray(core.preparedSelections.results), 'candidate_prepared_selection_receipts_missing');
          assert.deepEqual(core.preparedSelections.results.map(row => row.market).sort(), required, 'candidate_prepared_selection_scope');
          for (const market of required) {
            const row = core.markets[market], contract = core.contract.markets[market];
            assert.match(row.fingerprint || '', HEX, 'candidate_preparation_fingerprint');
            assert.match(row.sourceIds || '', HEX, 'candidate_preparation_source_ids');
            assert.match(row.selectorChecksum || '', HEX, 'candidate_preparation_selector_checksum');
            assert.ok(Number.isSafeInteger(row.sourceRows) && row.sourceRows > 0, 'candidate_preparation_source_count');
            assert.equal(contract.sourceRows, row.sourceRows, 'candidate_preparation_contract_count');
            assert.equal(contract.sourceIds, row.sourceIds, 'candidate_preparation_contract_ids');
            assert.equal(contract.fingerprint, row.fingerprint, 'candidate_preparation_contract_fingerprint');
            assert.deepEqual(contract.coverage, row.coverage, 'candidate_preparation_contract_coverage');
            assert.equal(row.coverage?.projectionRows, reuse.marketCounts[market], 'candidate_preparation_raw_inventory_count');
            assert.equal(row.coverage?.selectorRows, row.sourceRows, 'candidate_preparation_coverage_selector_count');
            assert.ok(Number.isSafeInteger(row.coverage?.eligibleRows) && row.coverage.eligibleRows >= 0 && row.coverage.eligibleRows <= row.sourceRows, 'candidate_preparation_eligible_count');
            assert.match(row.coverage.projectionIds || '', HEX, 'candidate_preparation_projection_identity');
            assert.match(row.coverage.eligibleIds || '', HEX, 'candidate_preparation_eligible_identity');
            const key = hash([core.generationId, market, row.fingerprint]);
            assert.equal(contract.selectionKey, key, 'candidate_preparation_selection_key');
            assert.equal(contract.selectionPrefix, `catalog/runtime-budget-selections-v1/${market}/${key}/`, 'candidate_preparation_selection_namespace');
            assert.equal(contract.budgetPath, `catalog/runtime-budget-prices-v3/${market}/${hash([core.generationId, market, row.fingerprint, row.sourceIds])}.json`, 'candidate_preparation_budget_namespace');
            assert.equal(contract.sortPath, `catalog/runtime-sort-prices-v3/${market}/${hash([core.generationId, market, row.fingerprint, row.sourceIds, 'display-price-v2'])}.json`, 'candidate_preparation_sort_namespace');
            for (const kind of ['budget', 'sort']) {
              assert.ok(Number.isSafeInteger(row[kind]?.rows) && row[kind].rows >= 0 && row[kind].rows <= row.sourceRows, 'candidate_preparation_numeric_count');
              assert.match(row[kind].checksum || '', HEX, 'candidate_preparation_numeric_checksum');
            }
            const selection = core.preparedSelections.results.find(value => value.market === market);
            assert.equal(selection.verified, true, 'candidate_preparation_selection_unverified');
            assert.equal(selection.fingerprint, row.fingerprint, 'candidate_preparation_selection_fingerprint');
          }
          if (action === 'verify') {
            assert.equal(prepared?.action, 'prepare', 'candidate_preparation_prior_required');
            assert.equal(prepared?.candidatePrepared, true, 'candidate_preparation_prior_unverified');
            assert.equal(prepared?.receiptSha256, report.receiptSha256, 'candidate_preparation_changed_since_prepare');
            assert.deepEqual(prepared?.core, core, 'candidate_preparation_core_changed_since_prepare');
          }
          return {receiptSha256: report.receiptSha256, core};
        }

        export async function runCandidatePreparation(action, healthPhase) {
          assert.ok(['prepare', 'verify'].includes(action), 'candidate_preparation_argument');
