name: One-shot source checkpoint · BE FORWARD 40.30

on:
  workflow_dispatch:
  push:
    branches:
      - feat/beforward-japan-qualification-v1-20260904
    paths:
      - ".github/workflows/roadmap-append-beforward-40-30-once.yml"

permissions:
  contents: write

# One-shot durable writer. Remove after the checkpoint is verified in-branch.
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beforward-japan-qualification-v1-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply BE FORWARD lead-only classification and append roadmap 40.30
        run: node scripts/catalog-source-beforward-japan-classify-v1.mjs
      - name: Verify exact mutation boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const row=p.candidates.find(x=>x.sourceId==='beforward_japan_candidate');
          if(!row) throw new Error('BE FORWARD missing');
          if(row.class!=='lead_only') throw new Error(`class=${row.class}`);
          if(row.publishAllowed!==false) throw new Error('publishAllowed changed');
          if(!String(row.qualificationDecision||'').includes('beforward-japan-qualification')) throw new Error('decision missing');
          const roadmap=fs.readFileSync('roadmap.md','utf8');
          const count=(roadmap.match(/### 40\.30\. BE FORWARD Japan:/g)||[]).length;
          if(count!==1) throw new Error(`40.30 count=${count}`);
          if(!roadmap.includes('33834734630')) throw new Error('detail run missing');
          if(roadmap.endsWith('\n\n')) throw new Error('extra blank line at EOF');
          NODE
      - name: Commit durable ledger and roadmap checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json roadmap.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Checkpoint already persisted"
            exit 0
          fi
          git commit -m "docs(catalog): record BE FORWARD lead-only qualification"
          git push origin HEAD:feat/beforward-japan-qualification-v1-20260904
