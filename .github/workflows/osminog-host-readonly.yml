name: OSMINOG shared host — read-only preflight
on:
  push:
    branches: ['ops/osminog-host-readonly-20261107']
    paths: ['.github/workflows/osminog-host-readonly.yml']
permissions:
  contents: read
concurrency:
  group: osminog-host-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: regcloud-staging
    steps:
      - name: Measure shared host without modifying applications or services
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp); hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          test -n "$SSH_PRIVATE_KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          printf '%s\n' '151.248.113.177 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAwiP6mOUcqHc5+Xvih7YY0Ikc7TyNsIoLoFTVx1JcSV' > "$hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" root@151.248.113.177 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== OSMINOG READ-ONLY PREFLIGHT ==='
          date -u +%Y-%m-%dT%H:%M:%SZ
          echo '-- memory MiB --'; free -m
          echo '-- disk MiB --'; df -Pm / /opt
          echo '-- load --'; uptime; getconf _NPROCESSORS_ONLN
          echo '-- Docker version --'; docker --version
          echo '-- bounded container statistics --'; timeout 15s docker stats --no-stream --format '{{.Name}} | {{.CPUPerc}} | {{.MemUsage}}'
          echo '-- listener on proposed pilot port 3081 --'; ss -ltn '( sport = :3081 )'
          echo '-- nginx configuration validity, no reload --'; nginx -t
          echo '-- dedicated OSMINOG path presence --'
          for p in /opt/osminog /etc/nginx/sites-available/osminog.red /etc/nginx/sites-enabled/osminog.red; do
            if test -e "$p"; then printf 'EXISTS %s\n' "$p"; else printf 'ABSENT %s\n' "$p"; fi
          done
          echo '-- domain resolution --'; getent ahostsv4 osminog.red | head -3 || true
          echo '-- existing site public health status only --'
          curl --connect-timeout 10 --max-time 20 --silent --output /dev/null --write-out 'avtocena_health_http=%{http_code} duration=%{time_total}\n' https://avtocena.com/api/health
          echo 'READ_ONLY_COMPLETE; no deploy, restart, nginx reload, credentials dump, S3 operation or file deletion'
          REMOTE
