name: One Shot Dry Run Identity Read Models

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-dry-run-identity-read-models.yml
  pull_request:
    paths:
      - .github/identity-live-dry-run.trigger

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_ENCYCLOPEDIA_IDENTITY_PUBLISH_REPORT: /tmp/identity-read-model-dry-run.json
      IDENTITY_DRY_RUN_GENERATION: "20260818-pr-observable"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate V2 checkpoint
        run: node scripts/vehicle-encyclopedia/validate.mjs
      - name: Dry-run live current-generation identity projection
        id: dryrun
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --import tsx scripts/catalog-publish-encyclopedia-identity-read-models.mjs
            test -s /tmp/identity-read-model-dry-run.json
            cat /tmp/identity-read-model-dry-run.json
          } 2>&1 | tee /tmp/identity-read-model-dry-run.log
      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-read-model-dry-run
          path: |
            /tmp/identity-read-model-dry-run.json
            /tmp/identity-read-model-dry-run.log
          if-no-files-found: warn
          retention-days: 7
      - name: Persist report and diagnostics to recovery branch
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.dryrun.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          FEATURE_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin recovery/encyclopedia-v2-staging-20260818
          git worktree add /tmp/recovery origin/recovery/encyclopedia-v2-staging-20260818
          cd /tmp/recovery
          mkdir -p recovery-assets/encyclopedia-v2-20260818/audits
          if [ -s /tmp/identity-read-model-dry-run.json ]; then cp /tmp/identity-read-model-dry-run.json recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.json; fi
          if [ -s /tmp/identity-read-model-dry-run.log ]; then cp /tmp/identity-read-model-dry-run.log recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.log; fi
          printf 'feature_sha=%s\nstatus=%s\ngeneration=%s\nverified_at=%s\n' "$FEATURE_SHA" "$STEP_OUTCOME" "$IDENTITY_DRY_RUN_GENERATION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.meta.txt
          git add recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.meta.txt
          [ ! -f recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.json ] || git add recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.json
          [ ! -f recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.log ] || git add recovery-assets/encyclopedia-v2-20260818/audits/identity-read-model-dry-run.log
          git commit -m 'chore(recovery): record observable live identity read-model dry-run' || true
          git push origin HEAD:recovery/encyclopedia-v2-staging-20260818 || true
      - name: Fail if dry-run failed
        if: steps.dryrun.outcome != 'success'
        run: exit 1
