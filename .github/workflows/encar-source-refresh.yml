name: Encar complete source refresh
on:
  workflow_dispatch:
  push:
    branches: [fix/korea-continuous-enrichment-20260920, main]
    paths: [.github/workflows/encar-source-refresh.yml, .github/market-runs/encar-source-refresh.json]
permissions:
  contents: read
concurrency:
  group: catalog-encar-source-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CATALOG_INTAKE_MARKET: korea
      CATALOG_INTAKE_SOURCE_IDS: encar_direct
      CATALOG_INTAKE_RESUME: '1'
      CATALOG_INTAKE_TIME_MS: ${{ github.ref == 'refs/heads/main' && '12600000' || '300000' }}
      CATALOG_INTAKE_MAX_ROWS_PER_SOURCE: ${{ github.ref == 'refs/heads/main' && '100000' || '200' }}
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: '20000'
      CATALOG_SOURCE_TIMEOUT_MS: '25000'
      CATALOG_READ_CONCURRENCY: '4'
      CATALOG_MAINTENANCE_IO_CONCURRENCY: '4'
      CATALOG_PUBLICATION_PROGRESS: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      JSON_STORAGE_DRIVER: object
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_INPUT_DIR: catalog-intake-korea
      CATALOG_REBUILD_MARKETS: korea
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '1'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Collect Encar listing, exact detail and inspection documents
        run: node --import tsx scripts/catalog-source-intake.mjs
      - name: Check storage reserve
        if: github.ref == 'refs/heads/main'
        run: node --import tsx scripts/catalog-storage-preflight.mjs
      - name: Publish through all source retention and price guards
        if: github.ref == 'refs/heads/main'
        run: node --import tsx scripts/catalog-publish-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-source-refresh
          retention-days: 14
          path: |
            catalog-intake-korea/
            catalog-v2-market-publish-report.json
            catalog-storage-preflight.json
