name: Verify Korea report disclosure
on:
  pull_request:
    paths:
      - 'scripts/catalog-prepare-paid-encar-reports.mjs'
      - 'scripts/lib/paid-korea-publication-guard.mjs'
      - 'tests/paid-encar-report-preparation.test.mjs'
      - 'tests/paid-korea-publication-guard.test.ts'
      - '.github/workflows/verify-korea-reports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify saved Auto API reports and paid-source publication guards
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/paid-encar-report-preparation.test.mjs tests/paid-korea-publication-guard.test.ts
