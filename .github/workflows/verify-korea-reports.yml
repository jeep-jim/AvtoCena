name: Verify Korea report disclosure
on:
  pull_request:
    paths:
      - 'apps/web/components/catalog/KoreaReportPanel.tsx'
      - 'apps/web/components/catalog/OfferSpecificationsDisclosure.tsx'
      - 'apps/web/lib/catalog/korea-report*'
      - 'apps/web/app/api/catalog/korea-report/**'
      - 'tests/korea-report*'
      - 'tests/browser/korea-report*'
      - '.github/workflows/verify-korea-reports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm install --prefix "$RUNNER_TEMP/korea-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Verify lazy report links and Russian controls
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/korea-browser/node_modules/playwright/index.mjs" node tests/browser/korea-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-report-browser
          path: artifacts/korea-report/
