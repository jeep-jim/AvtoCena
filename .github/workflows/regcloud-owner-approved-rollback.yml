name: Regcloud — apply owner-approved November 8 rollback
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-owner-approved-rollback.json']
permissions:
  contents: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact owner approval and operation
        run: |
          python3 - <<'PY'
          import json, pathlib
          marker=json.load(open('.github/market-runs/regcloud-owner-approved-rollback.json'))
          assert marker['release']=='463fd22559a2f9c5acd60f8f5e4b269689215c84'
          assert marker['ownerAcceptsKnownCatalogFailure'] is True
          compile(pathlib.Path('.github/owner-rollback/activate-approved.py').read_text(),'owner-approved-rollback','exec')
          print('Explicit owner acceptance is recorded for the exact historical release')
          PY
      - name: Restore original container with mandatory identity and access checks
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 "OWNER_ACCEPTS_KNOWN_CATALOG_FAILURE=463fd22559a2f9c5acd60f8f5e4b269689215c84 python3 - '$GITHUB_RUN_ID'" < .github/owner-rollback/activate-approved.py
      - name: Verify public historical release and record accepted catalogue condition
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://avtocena.com/api/health > owner-approved-rollback-health.json
          python3 - <<'PY'
          import json, time, urllib.request
          from html.parser import HTMLParser
          health=json.load(open('owner-approved-rollback-health.json'))
          assert health.get('ok') is True and health['releaseSha']=='463fd22559a2f9c5acd60f8f5e4b269689215c84'
          print('OWNER_APPROVED_ROLLBACK_PUBLIC_VERIFIED',json.dumps(health))
          class Cards(HTMLParser):
              def __init__(self): super().__init__(); self.count=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='article' and {'ac-catalog-card','ac-catalog-list-row'} & set(a.get('class','').split()): self.count+=1
          result={'path':'/cars?market=europe','blocking':False,'ownerAcceptedKnownFailure':True}
          started=time.monotonic()
          try:
              with urllib.request.urlopen('https://avtocena.com/cars?market=europe',timeout=25) as response:
                  body=response.read(20*1024*1024+1); result['status']=response.status
              parser=Cards(); parser.feed(body.decode('utf8','replace'))
              result.update(cards=parser.count,complete=b'</html>' in body)
          except Exception as error:
              result['error']=type(error).__name__
          result['seconds']=round(time.monotonic()-started,3)
          json.dump(result,open('owner-approved-catalog-observation.json','w'),indent=2)
          print('OWNER_ACCEPTED_CATALOG_OBSERVATION',json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-approved-rollback-receipt
          path: |
            owner-approved-rollback-health.json
            owner-approved-catalog-observation.json
          if-no-files-found: ignore
