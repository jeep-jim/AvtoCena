name: Ops · Europe post-HQ model quota audit v2 20260814

on:
  push:
    branches:
      - ops/europe-post-hq-model-audit-20260814
    paths:
      - ".github/workflows/ops-europe-post-hq-model-audit-v2-20260814.yml"
      - "scripts/ops-europe-post-hq-model-audit-20260814.ts"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/europe-post-hq-model-audit-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit current production without writes
        run: npx tsx scripts/ops-europe-post-hq-model-audit-20260814.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-post-hq-model-audit-v2
          path: europe-post-hq-model-audit.json
          if-no-files-found: warn
          retention-days: 3
