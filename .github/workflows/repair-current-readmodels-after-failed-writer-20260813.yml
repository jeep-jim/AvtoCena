name: Repair current read models after failed writer 20260813
run-name: Restore current read models from live manifest · ${{ github.sha }}

on:
  push:
    branches:
      - audit/catalog-integrity-after-failed-writers-20260813
    paths:
      - .github/workflows/repair-current-readmodels-after-failed-writer-20260813.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Republish only current read models from the live manifest
        run: |
          node --import tsx --input-type=module <<'NODE'
          const dataModule = await import('./apps/web/lib/data.ts');
          const data = dataModule.default || dataModule;
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storage = storageModule.default || storageModule;
          const runtimeModule = await import('./apps/web/lib/catalog/runtime-config.ts');
          const runtime = runtimeModule.default || runtimeModule;
          const before = await data.readDataJson('catalog/manifest.json',{generationId:'',markets:{}});
          if (!before.generationId) throw new Error('live_manifest_missing');
          const result = await storage.publishCurrentCatalogReadModels();
          const after = await data.readDataJson('catalog/manifest.json',{generationId:'',markets:{}});
          if (after.generationId !== before.generationId) throw new Error(`manifest_changed:${before.generationId}:${after.generationId}`);
          const facets = await data.readDataJson('catalog/public/facets.json',{generationId:''});
          const all = await data.readDataJson('catalog/public/projection/all.json',{generationId:'',items:[]});
          const projections = {};
          for (const market of runtime.PUBLIC_CATALOG_MARKETS) {
            const p = await data.readDataJson(`catalog/public/projection/${market}.json`,{generationId:'',items:[]});
            projections[market] = {generationId:p.generationId,count:(p.items||[]).length};
            if (p.generationId !== before.generationId) throw new Error(`projection_generation:${market}:${p.generationId}:${before.generationId}`);
          }
          if (facets.generationId !== before.generationId) throw new Error(`facets_generation:${facets.generationId}:${before.generationId}`);
          if (all.generationId !== before.generationId) throw new Error(`all_projection_generation:${all.generationId}:${before.generationId}`);
          console.log(JSON.stringify({beforeGeneration:before.generationId,result,facetsGeneration:facets.generationId,allProjectionGeneration:all.generationId,projections},null,2));
          NODE
