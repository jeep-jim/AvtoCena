name: Catalog source qualification · Good Car offer contract v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/source-partial-field-audit-v1-20260903
    paths:
      - ".github/workflows/catalog-source-chngoodcar-contract-probe-v1.yml"
      - "scripts/catalog-source-chngoodcar-contract-probe-v1.mjs"
      - "tests/catalog-source-chngoodcar-contract-probe-v1.test.ts"
      - "scripts/catalog-source-access-probe-v1.mjs"
      - "scripts/catalog-source-field-audit-v1.mjs"
      - "data/catalog/source-partial-field-audit-v1-summary.json"

permissions:
  contents: read

concurrency:
  group: catalog-source-chngoodcar-contract-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Good Car offer-core contract
        run: node --import tsx --test tests/catalog-source-chngoodcar-contract-probe-v1.test.ts
      - name: Probe four known or discovered Good Car offers without publishing
        env:
          CATALOG_SOURCE_CHNGOODCAR_CONTRACT_TIMEOUT_MS: "15000"
          CATALOG_SOURCE_CHNGOODCAR_CONTRACT_MAX_BODY_BYTES: "1300000"
        run: node scripts/catalog-source-chngoodcar-contract-probe-v1.mjs
      - name: Verify no-write evidence envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-chngoodcar-contract-probe-v1.json', 'utf8'));
          if (p.productionWrites !== false) throw new Error('productionWrites');
          if (p.classificationMutations !== false) throw new Error('classificationMutations');
          if (p.publishAllowedMutations !== false) throw new Error('publishAllowedMutations');
          if (p.rawBodiesStored !== false) throw new Error('rawBodiesStored');
          if (p.guessedRoutes !== false) throw new Error('guessedRoutes');
          if (p.sampleCount !== 4) throw new Error(`sampleCount=${p.sampleCount}`);
          if (!Array.isArray(p.results) || p.results.length !== 4) throw new Error('results');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-chngoodcar-contract-probe-v1
          path: catalog-source-chngoodcar-contract-probe-v1.json
          if-no-files-found: error
          retention-days: 7
