name: One-shot dispatch safe UAE Georgia direct

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-dispatch-safe-uae-georgia-direct-20260811.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated shared-writer direct recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run catalog-live-recovery-uae-georgia-direct.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 5
          gh run list --repo "$GITHUB_REPOSITORY" --workflow catalog-live-recovery-uae-georgia-direct.yml --limit 3
