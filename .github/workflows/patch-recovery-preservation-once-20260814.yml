name: Patch recovery publisher preservation once

on:
  push:
    branches:
      - fix/recovery-full-internal-preservation-20260814
    paths:
      - .github/workflows/patch-recovery-preservation-once-20260814.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-full-internal-preservation-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply fail-closed recovery preservation patch
        run: |
          python3 .github/scripts/patch_recovery_full_preservation_20260814.py
          python3 .github/scripts/augment_recovery_ci_assertions_20260814.py
          git checkout -- .github/workflows/ci.yml
      - run: npm ci
      - name: Targeted publisher safety tests
        run: node --import tsx --test tests/catalog-production-hardening.test.ts tests/catalog-recovery-publisher-min-images.test.ts
      - name: Syntax-check recovery publishers
        run: node --check scripts/catalog-live-recovery-publish.mjs && node --check scripts/catalog-live-recovery-publish-batch.mjs
      - name: Commit code-only safety patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-live-recovery-publish.mjs scripts/catalog-live-recovery-publish-batch.mjs tests/catalog-recovery-publisher-min-images.test.ts tests/catalog-production-hardening.test.ts
          git diff --cached --check
          git commit -m "Make recovery publishers preserve full internal state"
          git push origin HEAD:fix/recovery-full-internal-preservation-20260814
