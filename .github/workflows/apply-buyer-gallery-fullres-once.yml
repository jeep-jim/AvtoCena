name: Apply buyer gallery full resolution once

on:
  push:
    branches: [main]
    paths:
      - '.gallery-upload/buyers_16_24_45.zip'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply buyer photos 16-24
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.gallery-upload/buyers_16_24_45.zip'
          test -s "$ZIP"
          unzip -t "$ZIP"
          rm -rf /tmp/buyers-gallery
          mkdir -p /tmp/buyers-gallery
          unzip -q "$ZIP" -d /tmp/buyers-gallery
          for n in 16 17 18 19 20 21 22 23 24; do
            test -s "/tmp/buyers-gallery/$n.jpg"
          done
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              16:(1280,826), 17:(1280,960), 18:(1280,992),
              19:(1280,960), 20:(1280,951), 21:(1280,922),
              22:(1280,960), 23:(1195,896), 24:(1280,963),
          }

          def jpeg_size(path: Path):
              data = path.read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise RuntimeError(f'{path} is not JPEG')
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  seglen = struct.unpack('>H', data[i:i+2])[0]
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      h, w = struct.unpack('>HH', data[i+3:i+7])
                      return w, h
                  i += seglen
              raise RuntimeError(f'JPEG dimensions not found: {path}')

          for n, size in expected.items():
              p = Path(f'/tmp/buyers-gallery/{n}.jpg')
              got = jpeg_size(p)
              if got != size:
                  raise SystemExit(f'{n}.jpg dimensions {got} != {size}')
              if p.stat().st_size < 40000:
                  raise SystemExit(f'{n}.jpg suspiciously small: {p.stat().st_size} bytes')
              print(f'{n}.jpg: {got[0]}x{got[1]}, {p.stat().st_size} bytes')
          PY
          mkdir -p apps/web/public/buyers
          cp /tmp/buyers-gallery/{16,17,18,19,20,21,22,23,24}.jpg apps/web/public/buyers/
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/home/HomePageClient.tsx')
          s = p.read_text()
          old = 'const buyers = Array.from({ length: 16 }, (_, index) => `/buyers/${index + 1}.jpg`);'
          new = 'const buyers = Array.from({ length: 24 }, (_, index) => `/buyers/${index + 1}.jpg`);'
          if old not in s and new not in s:
              raise SystemExit('buyer count line not found')
          p.write_text(s.replace(old, new))
          PY
          rm -rf .gallery-upload
          git rm -f .github/workflows/apply-buyer-gallery-fullres-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/buyers apps/web/components/home/HomePageClient.tsx .gallery-upload || true
          git commit -m 'Add nine full-resolution buyer gallery photos'
          git push origin HEAD:main
