name: Apply mascot quality upload once

on:
  push:
    branches: [fix/finance-originals-offer-mobile-20260813]
    paths:
      - '.mascot-upload/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-originals-offer-mobile-20260813
          fetch-depth: 0
      - name: Restore high quality mascot assets
        shell: bash
        run: |
          set -euo pipefail
          test -f .mascot-upload/READY
          cat .mascot-upload/credit.*.b64 | base64 -d > apps/web/public/home/credit-mascot.webp
          cat .mascot-upload/osago.*.b64 | base64 -d > apps/web/public/home/osago-mascot.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'apps/web/public/home/credit-mascot.webp': (55072, 'bbeec0ad3b7f4cdf6c53fe85ae2cd198ceed98c70e959d82da72e4ca3d154d55'),
              'apps/web/public/home/osago-mascot.webp': (50732, 'f47d665da3721bf21c4edc6785fe7fa84834a0c57ee91485ab959617fa66f204'),
          }
          for name, (size, sha) in expected.items():
              data = Path(name).read_bytes()
              if len(data) != size:
                  raise SystemExit(f'{name}: size {len(data)} != {size}')
              got = hashlib.sha256(data).hexdigest()
              if got != sha:
                  raise SystemExit(f'{name}: sha256 {got} != {sha}')
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{name}: not a WebP RIFF file')
              print(f'{name}: {len(data)} bytes sha256={got}')
          PY
          rm -rf .mascot-upload
          git fetch origin main
          git checkout origin/main -- .github/workflows/apply-buyer-gallery-fullres-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/home/credit-mascot.webp apps/web/public/home/osago-mascot.webp .github/workflows/apply-buyer-gallery-fullres-once.yml
          git add -u .mascot-upload || true
          git commit -m 'Restore high quality finance mascots'
          git push origin HEAD:fix/finance-originals-offer-mobile-20260813
