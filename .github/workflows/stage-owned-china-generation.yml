name: Prepare the saved China inventory for publication
on:
  workflow_run:
    workflows: [Prepare locally stored China feed]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/market-runs/stage-owned-china.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-owned-china-generation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the invocation
        working-directory: source
        run: |
          node --input-type=module <<'JS'
          import {verifyChinaStageInvocation} from './scripts/lib/owned-china-stage-invocation.mjs';
          verifyChinaStageInvocation(process.cwd());
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fdb1bc1b98c97256e7b94988aeeeab996f2f9e4b
          path: native
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
          path: retained
          sparse-checkout: data/catalog/vehicle-knowledge
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d7b193855b37aa83bf79a3afb38902ee2f20ba30
          path: writer
          persist-credentials: false
      - name: Verify the model data for the serving releases
        working-directory: retained
        run: git fetch --no-tags --depth=1 origin 22867cbcfaee27b2e8917b6bf880e44827f67b60 0509e76cb02523157c98804c52edd7eb784916ba 18e81af30cb9187b139924217a777de1c9819bca b4d226491bcfa03eca73d72480ff3bd867d3c6fb 05f289a875866be0be84800c8644dee5f38a1059
      - name: Install and verify both readers
        run: |
          (cd source && npm ci --no-audit --no-fund)
          for tree in native writer; do
            if cmp -s source/package-lock.json "$tree/package-lock.json"; then
              ln -s "$GITHUB_WORKSPACE/source/node_modules" "$tree/node_modules"
            else
              (cd "$tree" && npm ci --no-audit --no-fund)
            fi
          done
          cd source
          node --import tsx --test tests/owned-china-publication-source.test.mjs tests/owned-china-active-coverage.test.mjs tests/che168-replica-witness.test.ts tests/owned-china-frozen-pricing.test.mjs tests/owned-china-stage-invocation.test.mjs tests/owned-china-serving-runtime.test.mjs
      - name: Price, verify and save the private China generation
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          AVTOCENA_CHINA_REGCLOUD_RUNTIME: '1'
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/stage-owned-china-market.mjs "$GITHUB_WORKSPACE/native" "$GITHUB_WORKSPACE/retained" "$GITHUB_WORKSPACE/writer"
      - uses: actions/upload-artifact@v4
        with:
          name: owned-china-stage
          path: ${{ runner.temp }}/owned-china-stage.json
          if-no-files-found: error
