name: Validate hold Georgia live until gallery identity verified

on:
  push:
    branches: [fix/hold-georgia-live-until-gallery-verified-20260811]
    paths:
      - .github/workflows/validate-hold-georgia-live-until-gallery-verified.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hold-georgia-live-until-gallery-verified-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and static safety assertions
        shell: bash
        run: |
          npm run typecheck
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/catalog-live-daily-working-markets.yml').read_text()
          assert s.count('for market in korea china europe; do') == 2
          assert 'for market in korea china europe georgia; do' not in s
          assert '- { market: georgia, source: auto_georgia_open' in s
          assert 'CATALOG_AUDIT_MIN_COUNTS_JSON' in s
          print('Georgia remains collect-only diagnostics; scheduled merge/publish excludes Georgia')
          PY
