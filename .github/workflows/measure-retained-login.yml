name: Measure retained login latency once
# Read-only confirmation after rejected acceptance43111977320.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/measure-retained-login.yml']
permissions:
  contents: read
concurrency:
  group: owner-readonly-login-sample
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '75c2e6f57cfa4022865217e029a1f5d1671842c3'
      - name: Read retained production identity and bounded candidate diagnostics
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'python3 -' <<'REMOTE'
          import json,subprocess,datetime,urllib.request,pathlib,time,os
          expected='a182cd21b21ecf612b63613d263e5bdd817ea4c0'
          def identity():
              value=json.loads(subprocess.check_output(['docker','inspect','avtocena-production'],text=True))[0]
              assert value['State']['Running'] and value['Config']['Labels'].get('org.opencontainers.image.revision')==expected
              port=value['HostConfig']['PortBindings']['3000/tcp'][0]
              assert port['HostIp']=='127.0.0.1' and port['HostPort'] in ['3000','3001']
              return {'source':expected,'image':value['Image'],'port':int(port['HostPort'])}
          before=identity();base='http://127.0.0.1:'+str(before['port'])
          def health():
              with urllib.request.urlopen(base+'/api/health',timeout=15) as response:value=json.load(response)
              assert value.get('ok') is True and value.get('releaseSha')==expected
              return {k:value.get(k) for k in ['ok','releaseSha','calculationVersion']}
          def cpu():
              total=list(map(int,pathlib.Path('/proc/stat').read_text().splitlines()[0].split()[1:9]))
              rows=subprocess.check_output(['docker','top','avtocena-production','-eo','pid,comm'],text=True).splitlines()[1:]
              ticks={}
              for row in rows:
                  fields=row.split()
                  if len(fields)==2 and fields[1]=='node':
                      try:
                          raw=pathlib.Path('/proc/'+fields[0]+'/stat').read_text().rsplit(')',1)[1].split()
                          ticks[fields[0]]=int(raw[11])+int(raw[12])
                      except (OSError,ValueError,IndexError):pass
              return {'total':sum(total),'idle':total[3]+total[4],'node':ticks}
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'identityBefore':before,'healthBefore':health(),'readOnly':True,'scope':'Current retained release on serving host; six bounded serial samples, not original baseline replacement or traffic-free comparison','samples':[]}
          for phase,delay in [('first',0),('repeat1',2),('repeat2',2),('after35s',35),('repeat3',2),('repeat4',2)]:
              if delay:time.sleep(delay)
              c0=cpu();started=time.monotonic();observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
              try:
                  with urllib.request.urlopen(base+'/login',timeout=15) as response:
                      body=response.read();status=response.status
                  seconds=time.monotonic()-started;c1=cpu()
                  nodeTicks=sum(max(0,c1['node'].get(pid,n)-n) for pid,n in c0['node'].items())
                  record={'phase':phase,'at':observed,'seconds':round(seconds,4),'status':status,'bytes':len(body),'complete':status==200 and b'</html>' in body and b'$RX(' not in body and len(body)>50000,'nodeCpuPercent':round(100*nodeTicks/os.sysconf('SC_CLK_TCK')/seconds,2),'hostCpuPercent':round(100*(1-(c1['idle']-c0['idle'])/max(1,c1['total']-c0['total'])),2)}
              except Exception as error:record={'phase':phase,'at':observed,'seconds':round(time.monotonic()-started,4),'errorType':type(error).__name__}
              report['samples'].append(record);print('RETAINED_LOGIN_SAMPLE',json.dumps(record),flush=True)
          report['healthAfter']=health();report['identityAfter']=identity()
          assert before==report['identityAfter'],'retained runtime changed during observation'
          print('RETAINED_LOGIN_REPORT',json.dumps(report),flush=True)
          REMOTE
