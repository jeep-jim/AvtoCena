name: Validate explicit Electro powertrain classification

on:
  push:
    branches:
      - fix/explicit-electro-classification
    paths:
      - ".github/workflows/validate-explicit-electro-classification.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add exact Latin Electro marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/lib/catalog/spec-normalization.ts')
          text = p.read_text()
          old_fuel = r'if (/electric|battery electric|\bbev\b|\bev\b|электро|纯电|전기/.test(text)) return "electric";'
          new_fuel = r'if (/electric|battery electric|\belectro\b|\bbev\b|\bev\b|электро|纯电|전기/.test(text)) return "electric";'
          old_kind = r'if (/battery[ -]?electric|pure[ -]?electric|\bbev\b|\bev\b|электромоб|纯电|전기차/.test(text) && !engineCc) return "electric";'
          new_kind = r'if (/battery[ -]?electric|pure[ -]?electric|\belectro\b|\bbev\b|\bev\b|электромоб|纯电|전기차/.test(text) && !engineCc) return "electric";'
          if text.count(old_fuel) != 1:
              raise SystemExit(f'fuel anchor count={text.count(old_fuel)}')
          if text.count(old_kind) != 1:
              raise SystemExit(f'kind anchor count={text.count(old_kind)}')
          p.write_text(text.replace(old_fuel, new_fuel, 1).replace(old_kind, new_kind, 1))
          PY
      - name: Assert strict classification behavior
        shell: bash
        run: |
          cat > /tmp/assert-electro.mts <<'TS'
          import { normalizeVehicleOfferSpecs } from "${{ github.workspace }}/apps/web/lib/catalog/spec-normalization.ts";
          function check(label: string, input: any, expectedKind: string, expectedFuel?: string) {
            const out: any = normalizeVehicleOfferSpecs(input);
            console.log(JSON.stringify({label, powertrainKind: out.powertrainKind, fuel: out.fuel, engineCc: out.engineCc}));
            if (out.powertrainKind !== expectedKind) throw new Error(`${label}: kind ${out.powertrainKind} != ${expectedKind}`);
            if (expectedFuel && out.fuel !== expectedFuel) throw new Error(`${label}: fuel ${out.fuel} != ${expectedFuel}`);
          }
          check("kia-ev6-electro", {make:"Kia", model:"EV6 I Long Range", trim:"Kia EV6 I Long Range Electro AT"}, "electric", "electric");
          check("audi-q4-electro", {make:"Audi", model:"Q4 e-tron 40", trim:"Audi Q4 e-tron 40 Electro AT"}, "electric", "electric");
          check("byd-dolphin-electro", {make:"BYD", model:"Dolphin", trim:"BYD Dolphin Electro AT"}, "electric", "electric");
          check("combustion-control", {make:"Toyota", model:"Corolla", trim:"Toyota Corolla 2.0 AT", engineCc:2000, fuel:"petrol"}, "combustion", "petrol");
          const neutral: any = normalizeVehicleOfferSpecs({make:"Acme", model:"Sample", trim:"Electronic package"});
          console.log(JSON.stringify({label:"word-boundary-control", powertrainKind:neutral.powertrainKind, fuel:neutral.fuel}));
          if (neutral.powertrainKind === "electric" || neutral.fuel === "electric") throw new Error("electronic must not match exact Electro token");
          TS
          npx tsx /tmp/assert-electro.mts
          npm run typecheck
      - name: Commit validated source patch to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/spec-normalization.ts
          git commit -m "Classify explicit Electro listings as electric"
          git push origin HEAD:fix/explicit-electro-classification
