name: Advertising readiness read-only audit
on:
  push:
    branches: [audit/launch-readiness-20260919]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Read published inventory and source evidence
        run: node --import tsx scripts/catalog-all-market-integrity-audit.mjs
      - name: Read maintenance state
        if: always()
        run: |
          node --import tsx --input-type=module <<'JS'
          import {readDataJson} from './apps/web/lib/data.ts';
          for(const path of ['catalog/storage-maintenance.json','catalog/storage-cleanup-report.json']){
            const r=await readDataJson(path,null); console.log(JSON.stringify({path,report:r}));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advertising-readiness-audit
          path: all-market-audit/
          retention-days: 30
