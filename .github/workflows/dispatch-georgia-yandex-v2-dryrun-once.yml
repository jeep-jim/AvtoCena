name: Dispatch Georgia Yandex v2 dry-run once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-georgia-yandex-v2-dryrun-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Yandex deployment to finish cleanly
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN: "31858091994"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            payload="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN}")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            echo "deploy status=$status conclusion=$conclusion attempt=$attempt"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]]
              exit 0
            fi
            sleep 10
          done
          echo "deployment did not complete in time" >&2
          exit 1
      - name: Dispatch read-only Georgia recovery v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-live-recovery-georgia-yandex-v2.yml/dispatches" \
            -d '{"ref":"main","inputs":{"apply":"false"}}'
      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dispatch-georgia-yandex-v2-dryrun-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-georgia-yandex-v2-dryrun-once.yml
          git commit -m "Remove Georgia Yandex v2 dry-run dispatcher"
          git push origin HEAD:main
