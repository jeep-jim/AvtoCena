name: Catalog Russian descriptions
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Catalog · Five-market full rebuild', 'Catalog independent market worker', 'Catalog refresh china', 'Catalog refresh korea']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: catalog-russian-descriptions
  cancel-in-progress: false
jobs:
  translate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_branch == 'main')
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      TRANSLATION_CHARACTER_BUDGET: '100000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Translate missing descriptions and persist display cache
        run: npx tsx scripts/catalog-translate-descriptions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-translation-report
          path: catalog-translation-report.json
          retention-days: 14
