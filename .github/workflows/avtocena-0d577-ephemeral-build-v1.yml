name: Build exact AvtoCena 0d577 image ephemerally without deployment
on:
  push:
    branches: [main]
    paths: [.github/market-runs/avtocena-0d577-ephemeral-build-v1.sha256]
permissions:
  contents: read
concurrency:
  group: avtocena-0d577-ephemeral-build-only
  cancel-in-progress: false
jobs:
  offsite:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Build exact AvtoCena 0d577 image without exporting or deploying'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BUNDLE_SHA256: '875add65851ff810fa0965c52f573df46dc4a15ea65a4ddded65f51e8d5e7354'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact one-shot marker and operator
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git show -s --format=%P HEAD | wc -w)" == 1 ]]
          readonly marker=.github/market-runs/avtocena-0d577-ephemeral-build-v1.sha256
          readonly op=.github/operations/avtocena-0d577-ephemeral-build-v1
          cmp -s <(git diff-tree --no-commit-id -r --name-status --no-renames -z HEAD^ HEAD) <(printf 'A\0%s\0' "$marker")
          [[ "$(git ls-tree HEAD -- "$marker" | cut -f1 | cut -d' ' -f1-2)" == '100644 blob' ]]
          cmp -s "$marker" <(printf '%s\n' 0d577596d14bbd5c4f6eafa48fb9b153ae7ef2ec a2d52f40104ea8cc3162a21b182478d0225ef997 "$(git rev-parse 'HEAD^^{tree}')" "$BUNDLE_SHA256")
          cd "$op"
          printf '%s  bundle.sha256\n' "$BUNDLE_SHA256" | sha256sum --check --strict --status
          sha256sum --check --strict --status bundle.sha256
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0d577596d14bbd5c4f6eafa48fb9b153ae7ef2ec
          fetch-depth: 6
          path: exact-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Compile exact runtime image without exporting or starting it
        working-directory: exact-app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/operations/avtocena-0d577-ephemeral-build-v1/build.sh"
