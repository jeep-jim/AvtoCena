name: Ops · Audit Japan pricing status 20260814
run-name: Audit Japan pricing status · ${{ github.sha }}

on:
  push:
    branches:
      - ops/audit-japan-pricing-status-20260814

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit Japan calculation statuses and missing fields
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const rows = await readMarketOffers('japan');
          const countBy = (values) => Object.fromEntries([...values.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))));
          const statuses = new Map();
          const pricing = new Map();
          const customs = new Map();
          const missing = new Map();
          const powerConfidence = new Map();
          let customsReadyButPreliminary = 0;
          let combustion = 0;
          let combustionPreliminary = 0;
          let withHp = 0;
          let withHpPreliminary = 0;
          let engineCcKnown = 0;
          let engineCcKnownPreliminary = 0;
          const samples = [];
          for (const offer of rows) {
            const status = String(offer.calculationStatus || '<empty>');
            statuses.set(status, (statuses.get(status)||0)+1);
            const pc = String(offer.calculationSnapshot?.pricingConfidence || '<empty>');
            pricing.set(pc, (pricing.get(pc)||0)+1);
            const cs = String(offer.calculationSnapshot?.customs?.status || '<empty>');
            customs.set(cs, (customs.get(cs)||0)+1);
            const conf = String(offer.powerDataConfidence || offer.calculationSnapshot?.powerConfidence || '<empty>');
            powerConfidence.set(conf, (powerConfidence.get(conf)||0)+1);
            const miss = [...new Set([...(offer.calculationSnapshot?.missing || []), ...(offer.calculationSnapshot?.customs?.missing || [])].map(String))];
            for (const item of miss) missing.set(item, (missing.get(item)||0)+1);
            const preliminary = status === 'preliminary_power_pending' || pc === 'preliminary';
            if (cs === 'ready' && preliminary) customsReadyButPreliminary += 1;
            const fuel = String(offer.fuel || '').toLowerCase();
            const pt = String(offer.powertrainKind || '').toLowerCase();
            const isCombustion = pt === 'combustion' || /petrol|gasoline|diesel|бенз|диз/.test(fuel);
            if (isCombustion) { combustion += 1; if (preliminary) combustionPreliminary += 1; }
            if (Number(offer.powerHp||0) > 0) { withHp += 1; if (preliminary) withHpPreliminary += 1; }
            if (Number(offer.engineCc||0) > 0) { engineCcKnown += 1; if (preliminary) engineCcKnownPreliminary += 1; }
            if (preliminary && samples.length < 30) samples.push({
              id: offer.id, make: offer.make, model: offer.model, trim: offer.trim, year: offer.year,
              engineCc: offer.engineCc, fuel: offer.fuel, powerHp: offer.powerHp, powerKw: offer.powerKw,
              powerDataConfidence: offer.powerDataConfidence, powerDataSource: offer.powerDataSource,
              calculationStatus: status, pricingConfidence: pc, customsStatus: cs, missing: miss,
              totalRub: offer.totalRub, sourceId: offer.sourceId, sourceUrl: offer.operational?.sourceUrl,
            });
          }
          console.log(JSON.stringify({
            total: rows.length,
            statuses: countBy(statuses),
            pricingConfidence: countBy(pricing),
            customsStatus: countBy(customs),
            missing: countBy(missing),
            powerConfidence: countBy(powerConfidence),
            customsReadyButPreliminary,
            combustion, combustionPreliminary,
            withHp, withHpPreliminary,
            engineCcKnown, engineCcKnownPreliminary,
            preliminarySamples: samples,
          }, null, 2));
          NODE
