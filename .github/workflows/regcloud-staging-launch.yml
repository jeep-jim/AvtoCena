name: Regcloud staging — build and start application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-launch.json']

permissions:
  contents: read

concurrency:
  group: regcloud-staging
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build existing application without production credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "avtocena-regcloud:$GITHUB_SHA" .
          docker save "avtocena-regcloud:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/avtocena-image.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum avtocena-image.tar.gz > avtocena-image.tar.gz.sha256
      - name: Install container runtime and load image (no application start)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/staging/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'; test \$(df --output=avail -k / | tail -1) -gt 8388608"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/avtocena-image.tar.gz" "$RUNNER_TEMP/avtocena-image.tar.gz.sha256" "root@151.248.113.177:$remote_dir/"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -s -- '$remote_dir' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          incoming=$1
          release=$2
          exec 9>/run/lock/avtocena-staging-prepare.lock
          flock -n 9
          cd "$incoming"
          sha256sum -c avtocena-image.tar.gz.sha256
          if ! command -v docker >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o DPkg::Lock::Timeout=120 update
            apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends docker.io
          fi
          systemctl enable --now docker
          gzip -dc avtocena-image.tar.gz | docker load
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "avtocena-regcloud:$release")" = "$release"
          docker version --format '{{.Server.Version}}'
          docker image inspect --format 'Image ready: {{.Id}}; size {{.Size}} bytes' "avtocena-regcloud:$release"
          # Remove only this run's transport archive after verified loading.
          rm -- avtocena-image.tar.gz avtocena-image.tar.gz.sha256
          echo 'Prepared only: application is NOT running, production data and DNS are unchanged.'
          REMOTE
      - name: Start isolated application and check current catalog
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          TARGET_ACCESS: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          TARGET_SECRET: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf -- "$task_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$task_dir/key"
          unset SSH_PRIVATE_KEY
          python3 - "$task_dir/app.env" <<'PYENV'
          import os, secrets, sys
          values = {
            'NODE_ENV': 'production', 'HOSTNAME': '0.0.0.0', 'PORT': '3000',
            'NEXT_PUBLIC_SITE_URL': 'https://avtocena.com',
            'AVTOCENA_RELEASE_SHA': os.environ['GITHUB_SHA'],
            'JSON_STORAGE_DRIVER': 'object',
            'YC_OBJECT_STORAGE_ENDPOINT': 'https://s3.regru.cloud',
            'YC_OBJECT_STORAGE_REGION': 'us-east-1',
            'YC_OBJECT_STORAGE_BUCKET': 'avtocena-staging-8120751',
            'YC_OBJECT_STORAGE_PREFIX': 'migration-staging/full-20261011/',
            'YC_OBJECT_STORAGE_ACCESS_KEY_ID': os.environ['TARGET_ACCESS'],
            'YC_OBJECT_STORAGE_SECRET_ACCESS_KEY': os.environ['TARGET_SECRET'],
            'AUTH_SECRET': secrets.token_urlsafe(48), 'AUTH_ACCESS_KEY': secrets.token_urlsafe(48),
            'DEALER_PAYMENTS_ENABLED': 'false', 'ACCOUNT_MAIL_PROVIDER': 'smtp',
            'NEXT_TELEMETRY_DISABLED': '1'
          }
          for name, value in values.items():
              if not value or '\n' in value or '\r' in value: raise SystemExit('Invalid configuration: ' + name)
          with open(sys.argv[1], 'w') as out:
              out.write(''.join(name + '=' + value + '\n' for name, value in values.items()))
          PYENV
          unset TARGET_ACCESS TARGET_SECRET
          ssh_opts=(-i "$task_dir/key" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/staging/runtime/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'"
          scp "${ssh_opts[@]}" "$task_dir/app.env" scripts/regcloud-runtime-smoke.py "root@151.248.113.177:$remote_dir/"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -s -- '$remote_dir' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          umask 077
          runtime_dir=$1
          release=$2
          exec 9>/run/lock/avtocena-migration-copy.lock
          flock -n 9
          test ! -e /opt/avtocena/PRODUCTION_ACTIVE
          python3 - <<'REPORT'
          import json
          with open('/opt/avtocena/staging/migration/last-report.json') as f: r=json.load(f)
          assert r['sourceUnchangedDuringCopy'] is True and r['targetKeysAndSizesMatch'] is True
          assert r['verifiedBytes'] > 0
          REPORT
          chmod 600 "$runtime_dir/app.env"
          # Protect the application prefix from any subsequent initial copy.
          touch /opt/avtocena/STAGING_APP_ACTIVE
          if docker container inspect avtocena-staging >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "avtocena.role" }}' avtocena-staging)" = isolated-staging
            docker stop --time 30 avtocena-staging >/dev/null
            docker rm avtocena-staging >/dev/null
          fi
          docker run -d --name avtocena-staging --label avtocena.role=isolated-staging \
            --restart unless-stopped --memory 10g --cpus 6 --pids-limit 512 \
            --log-opt max-size=10m --log-opt max-file=3 \
            --env-file "$runtime_dir/app.env" -p 127.0.0.1:3000:3000 \
            "avtocena-regcloud:$release" >/dev/null
          python3 "$runtime_dir/regcloud-runtime-smoke.py" "$release"
          REMOTE
