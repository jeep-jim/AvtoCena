name: CRM Telegram runner connectivity
on:
  workflow_dispatch:
  push:
    branches: [fix/crm-webhook-diagnostic-20260915]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Telegram HTTPS from runner without credentials
        run: |
          curl -4 -sS -I --connect-timeout 10 --max-time 20 https://api.telegram.org/ -o /dev/null -w 'Telegram HTTPS status=%{http_code} connect=%{time_connect}s total=%{time_total}s\n'
      - name: Check configured bot identity without logging credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              print("Bot token is not configured in GitHub Secrets")
              raise SystemExit(1)
          try:
              request = urllib.request.Request("https://api.telegram.org/bot" + token + "/getMe", data=b"{}", headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = json.load(response)
              if not body.get("ok") or body.get("result", {}).get("username", "").lower() != "avtocena_bot":
                  print("Bot identity mismatch")
                  raise SystemExit(1)
              print("Telegram getMe OK: @avtocena_bot")
              request = urllib.request.Request("https://api.telegram.org/bot" + token + "/getWebhookInfo", data=b"{}", headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  info = json.load(response)
              if not info.get("ok"):
                  raise ValueError("webhook_info_failed")
              result = info.get("result", {})
              from urllib.parse import urlsplit
              target = urlsplit(result.get("url", ""))
              import re
              error = str(result.get("last_error_message", ""))
              status = re.search(r"\\b[45]\\d{2}\\b", error)
              category = ("http_" + status.group(0)) if status else ("timeout" if "timed out" in error.lower() or "timeout" in error.lower() else ("other" if error else "none"))
              print(json.dumps({"webhook_host": target.hostname, "webhook_path": target.path, "pending_update_count": result.get("pending_update_count", 0), "last_error_date": result.get("last_error_date"), "last_error_category": category, "timeout_kind": next((label for label in ["Connection timed out", "Read timeout expired", "Connection refused", "SSL error"] if label.lower() in error.lower()), "unspecified"), "last_error_after_setup": int(result.get("last_error_date", 0)) > 1789435959}))

          except Exception:
              print("Telegram getMe failed; credentials and response omitted")
              raise SystemExit(1)
          PY
