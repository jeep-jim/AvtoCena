name: Capture catalog v29 wrapper error

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'automation/catalog-listing-first-v29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/catalog-listing-first-v29
      - name: Run wrapper patch in diagnostic mode
        shell: bash
        run: |
          : > tests/estimated-ev-publication.test.ts
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr-apply-catalog-v29-robust.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          Path('/tmp/patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n', encoding='utf-8')
          PY
          set +e
          python /tmp/patch.py > patch-v29-wrapper.log 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> patch-v29-wrapper.log
          cat patch-v29-wrapper.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-v29-wrapper-log
          path: patch-v29-wrapper.log
          retention-days: 1
