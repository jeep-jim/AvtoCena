name: Run regional catalog fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-regional-catalog-fix.yml

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-regional-volume-price-identity
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Execute patch stored in branch workflow
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python <<'RUNNER' 2>&1 | tee patch.log
          from pathlib import Path
          workflow = Path('.github/workflows/apply-regional-catalog-fixes.yml').read_text()
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          raw_lines = [line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines()]
          fixed_lines = []
          for line in raw_lines:
              if line.strip().startswith("usd = '"):
                  fixed_lines.append('usd = """    [/(?:USD|US\\\\$|\\\\$)\\\\s*([0-9][0-9 ,.\' ]{2,})/i, \\\"USD\\\"],"""'.replace(".\\' ", ".\\'"))
              else:
                  fixed_lines.append(line)
          code = '\n'.join(fixed_lines)
          block_start = code.index("old_normalize = '''")
          block_end = code.index("\nenriched = Path", block_start)
          normalize_patch = '''normalize_line = '      market: this.market, offerType: "fixed", status: "active", make: row.make, model: row.model,'
          normalize_replacement = '      market: this.market, offerType: "fixed", status: "active", make: (autoGeorgiaIdentityFromUrl(row.detailUrl).make || row.make), model: (autoGeorgiaIdentityFromUrl(row.detailUrl).model || row.model),'
          if normalize_line not in text:
              raise SystemExit("auto_georgia_normalize_line_not_found")
          auto.write_text(text.replace(normalize_line, normalize_replacement, 1))
          '''
          code = code[:block_start] + normalize_patch + code[block_end:]
          exec(compile(code, 'apply-regional-catalog-fixes.py', 'exec'))
          RUNNER
      - name: Report patch result
        if: always()
        uses: actions/github-script@v7
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('patch.log') ? fs.readFileSync('patch.log', 'utf8').slice(-12000) : 'patch.log отсутствует';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 162,
              body: `### Применение регионального патча: ${process.env.APPLY_OUTCOME}\n\n\`\`\`text\n${log}\n\`\`\`` });
      - name: Stop on patch failure
        if: steps.apply.outcome != 'success'
        run: exit 1
      - name: Validate fixes
        run: |
          node --import tsx --test tests/catalog-regional-production-fixes.test.ts tests/catalog-live-sources-v19.test.ts tests/catalog-source-scale.test.ts tests/catalog-card-contract.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm --workspace=@avtocena/engine exec tsc -- --noEmit
          npm --workspace=@avtocena/web run build
      - name: Commit fixes to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Каталог: исправить региональный объём, цену и соответствие фото"
          git push origin HEAD:fix/catalog-regional-volume-price-identity

# AUTO.GE patch correction triggers this one-shot workflow
