name: Apply footer OSAGO copy once

on:
  push:
    branches:
      - ui/footer-osago-copy-20260814
    paths:
      - .github/workflows/ui-footer-osago-copy-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/footer-osago-copy-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update footer OSAGO copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/components/layout/PublicLegalFooter.tsx')
          text = path.read_text()
          old = 'Рассчитать страховой полис ОСАГО'
          new = 'Рассчитать полис ОСАГО'
          if old not in text:
              raise SystemExit('footer OSAGO copy anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit final UI-only change
        shell: bash
        run: |
          rm .github/workflows/ui-footer-osago-copy-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/layout/PublicLegalFooter.tsx .github/workflows/ui-footer-osago-copy-once.yml
          git commit -m 'Shorten footer OSAGO button copy'
          git push origin HEAD:ui/footer-osago-copy-20260814
