name: Ops · Korea live semantic readonly 20260814
run-name: Korea live semantic readonly · ${{ github.sha }}

on:
  push:
    branches:
      - ops/korea-semantic-live-refresh-v3-20260813
    paths:
      - ".github/workflows/ops-korea-live-semantic-readonly-20260814.yml"

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Live Korea semantic gate
        shell: bash
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { catalogModelYearQuotaKey } = await import('./apps/web/lib/catalog/inventory-quota.ts');
          const rows=await readMarketOffers('korea');
          const dist=(field,subset=rows)=>subset.reduce((o,r)=>{const k=String(r?.[field]??'<missing>').trim()||'<missing>';o[k]=(o[k]||0)+1;return o;},{});
          const text=r=>`${r.make||''} ${r.model||''} ${r.trim||''} ${r.sourceTitle||''} ${JSON.stringify(r?.operational?.raw||{})}`;
          const sources=dist('sourceId');
          const badYears=rows.filter(r=>Number(r.year)<2020);
          const badImages=rows.filter(r=>(Array.isArray(r.images)?r.images.length:0)<5);
          const encar=rows.filter(r=>r.sourceId==='encar_direct');
          const suv=encar.filter(r=>/^(?:suv|crossover)$/i.test(String(r.bodyType||''))).length;
          const ratio=encar.length?suv/encar.length:1;
          const known=r=>/(?:genesis|제네시스)[\s_-]*g80|(?:hyundai|현대)[\s_-]*(?:grandeur|그랜저)|(?:hyundai|현대)[\s_-]*(?:ioniq\s*6|아이오닉\s*6)|(?:kia|기아)[\s_-]*(?:k9|k900|quoris|퀴리스)/i.test(text(r));
          const badSedans=rows.filter(r=>known(r)&&/^(?:suv|crossover|offroad)$/i.test(String(r.bodyType||'')));
          const casper2022=rows.filter(r=>Number(r.year)===2022&&/(?:hyundai|현대)/i.test(text(r))&&/(?:casper|캐스퍼)/i.test(text(r)));
          const quota=new Map();
          for(const r of rows){const k=catalogModelYearQuotaKey(r,'korea');if(k) quota.set(k,(quota.get(k)||0)+1);}
          const maxQuota=Math.max(0,...quota.values());
          const isK933=r=>/(?:\bk9\b|k900|quoris|퀴리스)/i.test(text(r))&&/(?:\b3[.,]3\b[^\n]{0,40}\bgdi\b|\bgdi\b[^\n]{0,40}\b3[.,]3\b)/i.test(text(r));
          const k933=rows.filter(isK933);
          const badK9=k933.filter(r=>[3000,3300].includes(Number(r.engineCc||0)));
          const exactK9=k933.filter(r=>Number(r.engineCc||0)===3342);
          const report={count:rows.length,sources,minYear:rows.length?Math.min(...rows.map(r=>Number(r.year||0))):0,maxPerExactModelYear:maxQuota,below5Images:badImages.length,encar:{count:encar.length,suvOrCrossover:suv,ratio:Number(ratio.toFixed(4))},knownSedanViolations:badSedans.length,casper2022:casper2022.length,k9_3_3_gdi:{count:k933.length,engineCc:dist('engineCc',k933),roundedUnsafe:badK9.length,exact3342:exactK9.length},bodyType:dist('bodyType'),drive:dist('drive'),transmission:dist('transmission'),fuel:dist('fuel')};
          fs.writeFileSync('korea-live-semantic-readonly.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          for(const source of ['encar_direct','kcar_korea_open','kbchachacha_korea_open']) if(!(Number(sources[source]||0)>0)) throw new Error(`live_missing_source:${source}`);
          if(badYears.length||badImages.length||maxQuota>20) throw new Error(`live_age_image_quota:${badYears.length}:${badImages.length}:${maxQuota}`);
          if(ratio>0.75||badSedans.length||!casper2022.length) throw new Error(`live_semantic_gate:${ratio}:${badSedans.length}:${casper2022.length}`);
          if(badK9.length||exactK9.length===0) throw new Error(`live_k9_engine_gate:${badK9.length}:${exactK9.length}`);
          NODE

      - name: Strict all-seven audit snapshot
        continue-on-error: true
        env:
          CATALOG_AUDIT_OUTPUT: korea-live-all7-readonly.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-live-semantic-readonly
          path: |
            korea-live-semantic-readonly.json
            korea-live-all7-readonly.json
          if-no-files-found: warn
          retention-days: 3
