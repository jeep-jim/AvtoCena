name: Audit offer route latency 20260812

on:
  push:
    branches:
      - audit/offer-route-latency-20260812
    paths:
      - .github/workflows/audit-offer-route-latency-20260812.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure live public routes and direct data/enrichment stages
        shell: bash
        run: |
          set -euo pipefail
          api='https://avtocena.com/api/catalog/search?market=korea&pageSize=3'
          json="$(curl --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -fsS "$api")"
          mapfile -t ids < <(jq -r '.items[].id' <<<"$json" | head -3)
          printf 'LIVE_IDS %s\n' "${ids[*]}"
          for id in "${ids[@]}"; do
            for attempt in 1 2 3; do
              curl -sS -o /dev/null --max-time 30 -w "LIVE_ROUTE id=$id attempt=$attempt http=%{http_code} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\n" "https://avtocena.com/cars/offer/$id"
            done
          done
          OFFER_IDS="$(IFS=,; echo "${ids[*]}")" node --import tsx --input-type=module <<'NODE'
          const { getOffer } = await import('./apps/web/lib/catalog/storage.ts');
          const { enrichOfferForDisplay } = await import('./apps/web/lib/catalog/display-enrichment.ts');
          const ids = String(process.env.OFFER_IDS || '').split(',').filter(Boolean);
          for (const id of ids) {
            for (let attempt = 1; attempt <= 2; attempt++) {
              const t0 = performance.now();
              const offer = await getOffer(id);
              const t1 = performance.now();
              const enriched = offer ? await enrichOfferForDisplay(offer) : null;
              const t2 = performance.now();
              console.log(JSON.stringify({event:'direct_offer_timing',id,attempt,found:Boolean(offer),getOfferMs:Number((t1-t0).toFixed(1)),enrichMs:Number((t2-t1).toFixed(1)),totalMs:Number((t2-t0).toFixed(1)),market:enriched?.market,make:enriched?.make,model:enriched?.model}));
            }
          }
          NODE
