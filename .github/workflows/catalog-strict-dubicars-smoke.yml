name: Catalog strict · DubiCars exact source-only smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex-strict-catalog-source-only
    paths:
      - ".github/workflows/catalog-strict-dubicars-smoke.yml"

permissions:
  contents: read

concurrency:
  group: catalog-strict-dubicars-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_STRICT_MARKET: uae
      CATALOG_STRICT_SOURCE_ID: dubicars_uae_exact
      CATALOG_STRICT_TARGET: "10"
      CATALOG_STRICT_MAX_PAGES: "5"
      CATALOG_STRICT_OUTPUT: catalog-strict-dubicars-10.json
      DUBICARS_SHAPE_OUTPUT: dubicars-strict-shape.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_KNOWLEDGE_DISABLED: "1"
      CATALOG_SOURCE_TIMEOUT_MS: "35000"
      CATALOG_STRICT_DUBICARS_VERSION: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck strict catalog changes
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Inspect runner listing and one exact detail
        continue-on-error: true
        run: node scripts/dubicars-strict-shape.mjs
      - name: Verify 10 exact DubiCars cards and source-only RUB calculations
        run: npx tsx scripts/catalog-strict-source-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-strict-dubicars-10
          path: |
            catalog-strict-dubicars-10.json
            dubicars-strict-shape.json
          if-no-files-found: warn
          retention-days: 3
