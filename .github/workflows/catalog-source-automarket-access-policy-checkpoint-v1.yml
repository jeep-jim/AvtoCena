name: Catalog source qualification · AutoMarket access-policy checkpoint v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/automarket-access-policy-v1-20260905
    paths:
      - ".github/workflows/catalog-source-automarket-access-policy-checkpoint-v1.yml"
      - "scripts/catalog-source-automarket-access-policy-checkpoint-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-automarket-access-policy-checkpoint-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply AutoMarket access-policy blocker
        run: node scripts/catalog-source-automarket-access-policy-checkpoint-v1.mjs
      - name: Verify safety, roadmap and next step
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          const row=r.candidates.find(x=>x.sourceId==='automarket_uae_candidate');
          const d=l.decisions.find(x=>x.sourceId==='automarket_uae_candidate');
          if(!row||row.class!=='research_pending'||row.publishAllowed!==false)throw new Error('AutoMarket registry invalid');
          if(row.qualificationBlocker!=='automation_and_commercial_reuse_permission_unproven_no_source_declared_legal_link_on_home')throw new Error('AutoMarket blocker missing');
          if(!d||d.class!=='research_pending'||d.publishAllowed!==false||d.evidence?.runId!==33937794266)throw new Error('AutoMarket ledger invalid');
          const japan=r.candidates.filter(x=>x.market==='japan');
          if(!japan.length||japan.some(x=>x.qualificationPaused!==true))throw new Error('Japan pause missing');
          if(!/Dubizzle UAE/i.test(r.next||''))throw new Error('Dubizzle next missing');
          if(!m.includes('## 40.45 — AutoMarket UAE: public home is reachable, but automation/reuse permission is not proven'))throw new Error('roadmap 40.45 missing');
          if(r.candidates.some(x=>x.publishAllowed===true))throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false)throw new Error('safety changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit checkpoint
        run: |
          if git diff --quiet; then echo "Checkpoint already applied"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Record AutoMarket access-policy blocker"
          git push origin HEAD:chore/automarket-access-policy-v1-20260905
