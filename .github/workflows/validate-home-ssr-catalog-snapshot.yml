name: Validate homepage SSR catalog snapshot

on:
  push:
    branches: [fix/home-ssr-catalog-snapshot-20260811]
    paths:
      - apps/web/app/(public)/page.tsx
      - .github/workflows/validate-home-ssr-catalog-snapshot.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-ssr-catalog-snapshot-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify live snapshot is non-empty and balanced across markets
        run: |
          npx tsx -e 'import {readHomeCatalogSnapshot} from "./apps/web/lib/catalog/storage.ts"; (async()=>{const s=await readHomeCatalogSnapshot(6); const counts=Object.values(s.marketCounts||{}).map(Number); if(!Array.isArray(s.items)||s.items.length<6) throw new Error(`weak items ${s.items?.length}`); if(Object.keys(s.marketCounts||{}).length<7||counts.some(v=>!(v>0))) throw new Error(`bad marketCounts ${JSON.stringify(s.marketCounts)}`); if(!(Number(s.total)>0)) throw new Error(`bad total ${s.total}`); console.log(JSON.stringify({generationId:s.generationId,items:s.items.length,total:s.total,marketCounts:s.marketCounts}));})()'
      - name: Static SSR wiring checks
        run: |
          grep -q 'readHomeCatalogSnapshot(6)' 'apps/web/app/(public)/page.tsx'
          grep -q 'initialOffers={catalog.items}' 'apps/web/app/(public)/page.tsx'
          grep -q 'initialMarketCounts={catalog.marketCounts}' 'apps/web/app/(public)/page.tsx'
          grep -q 'initialCount={catalog.total}' 'apps/web/app/(public)/page.tsx'
