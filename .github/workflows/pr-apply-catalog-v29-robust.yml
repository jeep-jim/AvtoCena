name: Apply catalog v29 robust

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'automation/catalog-listing-first-v29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/catalog-listing-first-v29
          fetch-depth: 0
      - name: Apply idempotent v29 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          warnings = []

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  warnings.append(f'{label}: marker missing')
                  return
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed.append(label)

          replace(
              'apps/web/lib/catalog/storage.ts',
              'function isPublicOffer(o: VehicleOffer) { return o.status === "active" && hasCredibleOfferContent(o) && Boolean(o.totalRub); }',
              'function isPublicOffer(o: VehicleOffer) { return o.status === "active" && hasCredibleOfferContent(o); }',
              'storage pending listings',
          )
          replace(
              'apps/web/app/(public)/cars/page.tsx',
              '.filter((offer) => offer.status === "active" && Boolean(offer.totalRub) && isCrediblePublicOffer(offer))',
              '.filter((offer) => offer.status === "active" && isCrediblePublicOffer(offer))',
              'public cars page pending listings',
          )
          replace(
              'scripts/catalog-publish-source-scale.mjs',
              '    if (!hasExactCalculation(offer)) return { offer: null, reason: "calculation" };',
              '''    const calculationStatus = String(offer.calculationStatus || "");
              const calculationPending = calculationStatus === "needs_data" || calculationStatus.startsWith("needs_");
              if (!hasExactCalculation(offer) && !calculationPending) return { offer: null, reason: "calculation" };''',
              'publish pending calculations',
          )
          replace(
              'apps/web/components/catalog/CatalogCard.tsx',
              '  const estimated = o.calculationStatus === "estimated" || o.calculationSnapshot?.pricingConfidence === "estimated";\n',
              '  const estimated = o.calculationStatus === "estimated" || o.calculationSnapshot?.pricingConfidence === "estimated";\n  const priceLabel = !o.totalRub ? `${yearLabel} · расчёт уточняется` : estimated ? `${yearLabel} · ориентир` : yearLabel;\n',
              'catalog pending price label',
          )
          replace(
              'apps/web/components/catalog/CatalogCard.tsx',
              '          <PriceTrend offer={o} label={estimated ? `${yearLabel} · ориентир` : yearLabel}',
              '          <PriceTrend offer={o} label={priceLabel}',
              'catalog pending price label usage',
          )

          dealer = Path('apps/web/components/dealers/DealerDemoDashboard.tsx')
          text = dealer.read_text(encoding='utf-8')
          if 'function MarketFlag(' not in text:
              marker = 'function VerifiedIcon({ className = "", positive = false }: { className?: string; positive?: boolean }) {'
              if marker in text:
                  flag_component = '''function MarketFlag({ market }: { market: DemoMarketId }) {
            const common = "block h-5 w-7 shrink-0 overflow-hidden rounded-[4px] border border-black/10 shadow-[0_1px_2px_rgba(0,0,0,.12)]";
            if (market === "japan") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Японии"><rect width="28" height="20" fill="#fff" /><circle cx="14" cy="10" r="5" fill="#bc002d" /></svg>;
            if (market === "china") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Китая"><rect width="28" height="20" fill="#de2910" /><polygon points="6,3 7.1,5.4 9.8,5.6 7.7,7.3 8.4,10 6,8.5 3.6,10 4.3,7.3 2.2,5.6 4.9,5.4" fill="#ffde00" /></svg>;
            if (market === "korea") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Южной Кореи"><rect width="28" height="20" fill="#fff" /><circle cx="14" cy="10" r="4.2" fill="#cd2e3a" /><path d="M9.8 10a4.2 4.2 0 0 0 8.4 0c-2.1-1.9-4.2 1.9-6.3 0-1.05-.95-1.4-.95-2.1 0Z" fill="#0047a0" /></svg>;
            if (market === "uae") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг ОАЭ"><rect width="28" height="20" fill="#fff" /><rect width="28" height="6.67" fill="#00732f" /><rect y="13.33" width="28" height="6.67" fill="#000" /><rect width="7" height="20" fill="#ff0000" /></svg>;
            if (market === "europe") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Европейского союза"><rect width="28" height="20" fill="#003399" />{Array.from({ length: 12 }, (_, index) => { const angle = index * Math.PI / 6 - Math.PI / 2; return <circle key={index} cx={14 + Math.cos(angle) * 5.2} cy={10 + Math.sin(angle) * 5.2} r=".7" fill="#ffcc00" />; })}</svg>;
            if (market === "georgia") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Грузии"><rect width="28" height="20" fill="#fff" /><rect x="12" width="4" height="20" fill="#ff0000" /><rect y="8" width="28" height="4" fill="#ff0000" /></svg>;
            return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Кыргызстана"><rect width="28" height="20" fill="#e8112d" /><circle cx="14" cy="10" r="5.2" fill="#ffef00" /><circle cx="14" cy="10" r="2.6" fill="#e8112d" /></svg>;
          }

          '''
                  text = text.replace(marker, flag_component + marker, 1)
                  changed.append('dealer SVG market flags')
              else:
                  warnings.append('dealer flag insertion marker missing')
          old_flag = '<span className="text-2xl">{market.flag}</span>'
          if old_flag in text:
              text = text.replace(old_flag, '<MarketFlag market={market.id} />', 1)
              changed.append('dealer flag rendering')
          dealer.write_text(text, encoding='utf-8')

          replace(
              '.github/workflows/catalog-production-recovery-v15.yml',
              '      CATALOG_PUBLISH_TARGET_PER_MARKET: "3000"\n',
              '      CATALOG_PUBLISH_TARGET_PER_MARKET: "3000"\n      CATALOG_BOOTSTRAP_MIN_TOTAL: "10000"\n',
              'bootstrap 10000 target',
          )
          replace(
              '.github/workflows/catalog-production-recovery-v15.yml',
              "          if (!(Number(report.total || 0) > 0)) throw new Error('catalog_total_empty');\n",
              "          if (!(Number(report.total || 0) > 0)) throw new Error('catalog_total_empty');\n          const minimumTotal = Number(process.env.CATALOG_BOOTSTRAP_MIN_TOTAL || 10000);\n          if (Number(report.total || 0) < minimumTotal) console.warn(`catalog_bootstrap_below_${minimumTotal}: ${report.total}; manifest is kept and the next pass continues accumulation`);\n",
              'bootstrap volume diagnostics',
          )

          test_file = Path('tests/catalog-source-scale.test.ts')
          text = test_file.read_text(encoding='utf-8')
          marker = 'const flatUi = fs.readFileSync(new URL("../apps/web/app/flat-ui.css", import.meta.url), "utf8");\n'
          if 'const storage = fs.readFileSync' not in text and marker in text:
              text = text.replace(marker, marker + '''const storage = fs.readFileSync(new URL("../apps/web/lib/catalog/storage.ts", import.meta.url), "utf8");
          const carsPage = fs.readFileSync(new URL("../apps/web/app/(public)/cars/page.tsx", import.meta.url), "utf8");
          const dealerDemo = fs.readFileSync(new URL("../apps/web/components/dealers/DealerDemoDashboard.tsx", import.meta.url), "utf8");
          ''', 1)
              changed.append('source scale fixtures')
          if 'CATALOG_BOOTSTRAP_MIN_TOTAL' not in text:
              old = '  assert.match(workflow, /CATALOG_PUBLISH_TARGET_PER_MARKET: "3000"/);\n'
              if old in text:
                  text = text.replace(old, old + '  assert.match(workflow, /CATALOG_BOOTSTRAP_MIN_TOTAL: "10000"/);\n', 1)
                  changed.append('source scale target test')
          if 'real listings stay public while exact customs calculation is pending' not in text:
              target = 'test("requested high-volume public sources are registered", () => {'
              insertion = '''test("real listings stay public while exact customs calculation is pending", () => {
            assert.match(offerQuality, /hasPendingCalculation/);
            assert.match(offerQuality, /status\.startsWith\("needs_"\)/);
            assert.doesNotMatch(storage, /hasCredibleOfferContent\(o\) && Boolean\(o\.totalRub\)/);
            assert.doesNotMatch(carsPage, /Boolean\(offer\.totalRub\) && isCrediblePublicOffer/);
            assert.match(publishScript, /calculationPending/);
          });

          test("dealer CRM renders SVG market flags rather than emoji letter codes", () => {
            assert.match(dealerDemo, /function MarketFlag/);
            assert.match(dealerDemo, /Флаг Кыргызстана/);
            assert.doesNotMatch(dealerDemo, /<span className="text-2xl">\{market\.flag\}<\/span>/);
          });

          '''
              if target in text:
                  text = text.replace(target, insertion + target, 1)
                  changed.append('listing-first regression tests')
              else:
                  warnings.append('source scale insertion marker missing')
          test_file.write_text(text, encoding='utf-8')

          pending_test = Path('tests/estimated-ev-publication.test.ts')
          text = pending_test.read_text(encoding='utf-8')
          if 'offer_pending_combustion' not in text:
              text += '''

          test("publishes a real combustion listing while exact total is pending", () => {
            const pending = electricOffer({
              id: "offer_pending_combustion",
              powertrainKind: "combustion",
              fuel: "petrol",
              engineCc: 1998,
              powerHp: undefined,
              powerKw: undefined,
              utilizationPowerKw: undefined,
              powerDataConfidence: undefined,
              powerDataSource: undefined,
              totalRub: null,
              priceMode: "fixed",
              calculationStatus: "needs_power_data",
              calculationSnapshot: { pricingConfidence: "unavailable", missing: ["power_hp"] },
            });
            assert.equal(isCrediblePublicOffer(pending), true);
            assert.equal(isCrediblePublicOffer({ ...pending, calculationStatus: "unknown" }), false);
          });
          '''
              pending_test.write_text(text, encoding='utf-8')
              changed.append('pending listing unit test')

          roadmap = Path('roadmap.md')
          text = roadmap.read_text(encoding='utf-8')
          if 'run #92, опубликовано только 1 158 машин' not in text:
              incident = '''### 2026-07-28 — run #92, опубликовано только 1 158 машин

          Симптом:

          - фактические счётчики: Япония 2, Китай 0, Корея 68, ОАЭ 84, Европа 1 002, Грузия 0, Кыргызстан 2;
          - общий объём 1 158 вместо бизнес-цели минимум 10 000;
          - Европа проходила массово, остальные рынки почти полностью отбрасывались после парсинга.

          Root cause:

          - публичный quality gate требовал `powerHp`, готовый расчёт таможни и утильсбора, полный breakdown и `totalRub` ещё до публикации;
          - реальные объявления без найденной мощности или сертифицированной 30-минутной мощности удалялись;
          - собственная база знаний пока покрывает небольшую долю моделей;
          - emoji-флаги в Windows отображались буквами JP/CN/KR/AE/EU/GE/KG.

          Решение v29:

          - разделить достоверность объявления и готовность расчёта;
          - реальная карточка публикуется со статусом `needs_*` без выдуманного `totalRub`;
          - точная цена появляется только после расчёта действующим движком таможни и утильсбора;
          - карточки с готовой ценой сохраняют строгую проверку мощности, таможни и breakdown;
          - CRM использует детерминированные SVG-флаги;
          - bootstrap-цель — минимум 10 000 реальных карточек суммарно; недобор не откатывает полезный manifest.

          Статус:

          - исправление: PR #133, ветка `automation/catalog-listing-first-v29`;
          - production generationId и market counts записать после завершения нового прохода.

          '''
              target = '### Шаблон новой записи\n'
              if target in text:
                  text = text.replace(target, incident + target, 1)
                  changed.append('roadmap run 92 incident')
              else:
                  warnings.append('roadmap insertion marker missing')
          roadmap.write_text(text, encoding='utf-8')

          print({'changed': changed, 'warnings': warnings})
          PY

          rm -f .github/workflows/pr-apply-catalog-v29-robust.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Каталог: завершить listing-first архитектуру v29"
          git push origin HEAD:automation/catalog-listing-first-v29
