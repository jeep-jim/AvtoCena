name: Verify published date editor on current offers
on:
  push:
    branches: [verify/date-editor-live-20260913]
    paths: ['.github/workflows/verify-current-date-editor.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05e6c86882e621f7475eb86b919882dbcf335781
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/date-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Confirm exact live version and discover a current petrol control
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const root='artifacts/attached-parameters-live';fs.mkdirSync(root,{recursive:true});
          const r=await fetch('https://avtocena.com/api/health',{signal:AbortSignal.timeout(30000)});
          const health=await r.json();
          if(!health.ok||health.releaseSha!=='05e6c86882e621f7475eb86b919882dbcf335781')throw Error('Exact reviewed release no longer live');
          fs.writeFileSync(root+'/release.json',JSON.stringify(health,null,2));
          const response=await fetch('https://avtocena.com/api/catalog/search?market=korea&fuel=petrol&pageSize=6',{signal:AbortSignal.timeout(45000)});
          if(!response.ok)throw Error('Current petrol discovery failed');
          const data=await response.json();
          const offer=data.items?.find(o=>o.id&&o.fuel==='petrol');
          if(!offer)throw Error('No explicitly petrol offer returned');
          fs.writeFileSync(root+'/petrol-source.json',JSON.stringify({id:offer.id,make:offer.make,model:offer.model,fuel:offer.fuel},null,2));
          const file='tests/browser/attached-parameter-dropdowns.mjs';
          let text=fs.readFileSync(file,'utf8');
          const old="/cars/offer/15691a619182935d97aa25c7";
          if(text.split(old).length!==2)throw Error('Expected one fixed retired fixture URL');
          text=text.replace(old,'/cars/offer/'+encodeURIComponent(offer.id));
          fs.writeFileSync(file,text);
          JS
      - name: Run unchanged live geometry and calendar assertions (GET and HEAD only)
        env:
          LIVE_ORIGIN: https://avtocena.com
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/date-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/attached-parameter-dropdowns.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-editor-current-live
          path: artifacts/attached-parameters-live
          retention-days: 7
