name: Inspect Yandex domain resources once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/yandex-domain-readonly-diagnostic-once.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo /opt/yc/bin >> "$GITHUB_PATH"
      - name: Read API Gateway, certificates and DNS configuration
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: b1g9vq73onqb7dp5hgqg
          API_GATEWAY_ID: d5d4tne6a7djd0o5ip14
        shell: bash
        run: |
          set -u
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > /tmp/yc-key.json
          chmod 600 /tmp/yc-key.json
          yc config profile create issue241-domain-readonly >/dev/null 2>&1 || true
          yc config set service-account-key /tmp/yc-key.json >/dev/null
          yc config set folder-id "$YC_FOLDER_ID" >/dev/null
          echo '=== authenticated service account ==='
          jq -r '{service_account_id:.service_account_id,key_id:.id}' /tmp/yc-key.json
          echo '=== api gateway get ==='
          yc serverless api-gateway get "$API_GATEWAY_ID" --format json 2>&1 | tee /tmp/gateway.json || true
          echo '=== api gateway list ==='
          yc serverless api-gateway list --format json 2>&1 | tee /tmp/gateways.json || true
          echo '=== certificate manager list ==='
          yc certificate-manager certificate list --full --format json 2>&1 | tee /tmp/certs.json || true
          echo '=== DNS zones ==='
          yc dns zone list --format json 2>&1 | tee /tmp/zones.json || true
          if jq -e 'type=="array"' /tmp/zones.json >/dev/null 2>&1; then
            jq -r '.[] | select((.zone // "") | test("avtocena\\.com")) | .id' /tmp/zones.json | while read -r zone_id; do
              [[ -n "$zone_id" ]] || continue
              echo "=== DNS records zone $zone_id ==="
              yc dns zone list-records --id "$zone_id" --format json 2>&1 || true
            done
          fi
          rm -f /tmp/yc-key.json
      - name: Remove one-shot Yandex diagnostic
        shell: bash
        run: |
          rm .github/workflows/yandex-domain-readonly-diagnostic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/yandex-domain-readonly-diagnostic-once.yml
          git commit -m "Remove Yandex domain diagnostic workflow"
          git push origin HEAD:main
