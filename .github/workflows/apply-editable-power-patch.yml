name: Apply editable power pricing patch

on:
  push:
    branches:
      - feat/editable-power-pricing-20260824

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editable-power-pricing-20260824
          fetch-depth: 1
      - name: Apply power scenario feature
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          Path('apps/web/lib/catalog/power-scenario.ts').write_text(r'''import type { VehicleOffer } from "./types";

export const DEFAULT_CATALOG_POWER_FALLBACK_HP = 100;
export const CATALOG_POWER_SCENARIO_PREFIX = "power_scenario:";

export type CatalogPowerScenarioSource = "fallback_100" | "knowledge_reference" | "source_peak_estimate" | "customer_input";
export type CatalogPowerScenario = {
  horsepower: number;
  utilizationPowerKw: number;
  source: CatalogPowerScenarioSource;
  requiresConfirmation: true;
  userEditable: true;
};

function positive(value: unknown, max = 2_500) {
  const number = Number(value);
  return Number.isFinite(number) && number >= 20 && number <= max ? number : 0;
}

function powertrainKind(offer: Partial<VehicleOffer> | any) {
  const explicit = String(offer?.powertrainKind || "").toLowerCase();
  if (["combustion", "electric", "series_hybrid", "other_hybrid"].includes(explicit)) return explicit;
  const fuel = String(offer?.fuel || "").toLowerCase();
  if (/series|range|reev|erev|последователь|增程/.test(fuel)) return "series_hybrid";
  if (/hybrid|phev|hev|mhev|гибрид|混合动力/.test(fuel)) return "other_hybrid";
  if (/electric|battery|bev|электро|纯电/.test(fuel) && !Number(offer?.engineCc || 0)) return "electric";
  if (Number(offer?.engineCc || 0) > 0) return "combustion";
  return "unknown";
}

export function readCatalogPowerScenario(offer: Partial<VehicleOffer> | any): CatalogPowerScenario | null {
  const snapshot = offer?.calculationSnapshot?.powerScenario;
  if (snapshot && positive(snapshot.horsepower) && Number(snapshot.utilizationPowerKw) > 0) {
    return {
      horsepower: Math.round(Number(snapshot.horsepower) * 10) / 10,
      utilizationPowerKw: Math.round(Number(snapshot.utilizationPowerKw) * 100) / 100,
      source: String(snapshot.source || "fallback_100") as CatalogPowerScenarioSource,
      requiresConfirmation: true,
      userEditable: true,
    };
  }
  if (!String(offer?.powerDataSource || "").startsWith(CATALOG_POWER_SCENARIO_PREFIX)) return null;
  const horsepower = positive(offer?.powerHp) || DEFAULT_CATALOG_POWER_FALLBACK_HP;
  return {
    horsepower,
    utilizationPowerKw: Math.round(horsepower * 0.73549875 * 100) / 100,
    source: String(offer.powerDataSource).slice(CATALOG_POWER_SCENARIO_PREFIX.length) as CatalogPowerScenarioSource,
    requiresConfirmation: true,
    userEditable: true,
  };
}

export function isCatalogPowerScenario(offer: Partial<VehicleOffer> | any) {
  return Boolean(readCatalogPowerScenario(offer));
}

export function resolveCatalogPowerScenario(
  offer: Partial<VehicleOffer> | any,
  options: { requestedHp?: number; representativeHp?: number } = {},
): CatalogPowerScenario | null {
  const requested = positive(options.requestedHp);
  if (requested) {
    return {
      horsepower: requested,
      utilizationPowerKw: Math.round(requested * 0.73549875 * 100) / 100,
      source: "customer_input",
      requiresConfirmation: true,
      userEditable: true,
    };
  }

  const kind = powertrainKind(offer);
  const peakHp = positive(offer?.powerHp)
    || (Number(offer?.powerKw || 0) > 0 ? Math.round(Number(offer.powerKw) / 0.73549875 * 10) / 10 : 0);
  const utilization = Number(offer?.utilizationPowerKw || 0);
  const thirty = Number(offer?.power30MinKw || 0)
    || (Array.isArray(offer?.power30MinKwByMotor)
      ? offer.power30MinKwByMotor.reduce((sum: number, value: unknown) => sum + Math.max(0, Number(value || 0)), 0)
      : 0);

  const alreadySufficient = kind === "combustion"
    ? peakHp > 0
    : kind === "electric" || kind === "series_hybrid"
      ? peakHp > 0 && (utilization > 0 || thirty > 0)
      : kind === "other_hybrid"
        ? peakHp > 0 && utilization > 0
        : false;
  if (alreadySufficient) return null;

  const representative = positive(options.representativeHp);
  const horsepower = peakHp || representative || DEFAULT_CATALOG_POWER_FALLBACK_HP;
  const source: CatalogPowerScenarioSource = peakHp
    ? "source_peak_estimate"
    : representative
      ? "knowledge_reference"
      : "fallback_100";
  return {
    horsepower,
    utilizationPowerKw: Math.round(horsepower * 0.73549875 * 100) / 100,
    source,
    requiresConfirmation: true,
    userEditable: true,
  };
}

export function applyCatalogPowerScenario<T extends VehicleOffer>(offer: T, scenario: CatalogPowerScenario): T {
  const customerOverride = scenario.source === "customer_input";
  const horsepower = scenario.horsepower;
  const powerKw = Math.round(horsepower * 0.73549875 * 100) / 100;
  return {
    ...offer,
    powerHp: customerOverride || !Number(offer.powerHp || 0) ? horsepower : offer.powerHp,
    powerKw: customerOverride || !Number(offer.powerKw || 0) ? powerKw : offer.powerKw,
    utilizationPowerKw: scenario.utilizationPowerKw,
    powerDataConfidence: "estimated",
    powerDataSource: `${CATALOG_POWER_SCENARIO_PREFIX}${scenario.source}`,
    calculationSnapshot: {
      ...(offer.calculationSnapshot || {}),
      powerScenario: scenario,
      powerRequiresConfirmation: true,
    },
  } as T;
}
''')

          Path('apps/web/components/catalog/EditablePowerTile.tsx').write_text(r'''"use client";

import { FormEvent, useMemo, useState } from "react";
import { usePathname, useRouter, useSearchParams } from "next/navigation";

const COMMON_HP = [50, 75, 90, 100, 110, 120, 130, 140, 150, 160, 180, 200, 220, 250, 300, 350, 400, 500, 600];

export function EditablePowerTile({
  currentHp,
  requiresConfirmation,
  scenarioSource,
  fullWidth = false,
}: {
  currentHp: number;
  requiresConfirmation: boolean;
  scenarioSource?: string | null;
  fullWidth?: boolean;
}) {
  const router = useRouter();
  const pathname = usePathname();
  const search = useSearchParams();
  const current = Math.max(20, Math.min(2500, Math.round(Number(currentHp || 100))));
  const [manual, setManual] = useState(String(current));
  const commonValue = COMMON_HP.includes(current) ? String(current) : "custom";
  const warning = requiresConfirmation;
  const hint = scenarioSource === "fallback_100"
    ? "Мощность не найдена в источнике и Knowledge CORE — временно считаем по 100 л.с. Уточните значение."
    : scenarioSource === "knowledge_reference"
      ? "Использована справочная мощность модели. Для точной цены можно выбрать или ввести мощность конкретного автомобиля."
      : scenarioSource === "source_peak_estimate"
        ? "Источник даёт пиковую/общую мощность, но не все регуляторные данные. Значение можно уточнить вручную."
        : scenarioSource === "customer_input"
          ? "Цена пересчитана по выбранной вами мощности. Перед оплатой значение нужно подтвердить по документам автомобиля."
          : "Мощность можно изменить — цена пересчитается для выбранного сценария.";

  const apply = (value?: number | null) => {
    const params = new URLSearchParams(search.toString());
    if (value && Number.isFinite(value) && value >= 20 && value <= 2500) params.set("powerHp", String(Math.round(value)));
    else params.delete("powerHp");
    const query = params.toString();
    router.replace(query ? `${pathname}?${query}` : pathname, { scroll: false });
  };

  const options = useMemo(() => COMMON_HP, []);
  const submit = (event: FormEvent) => {
    event.preventDefault();
    const value = Number(manual);
    if (Number.isFinite(value) && value >= 20 && value <= 2500) apply(value);
  };

  return <div
    aria-label={`Мощность: ${current} л.с.`}
    className={`ac-offer-spec-tile relative min-w-0 rounded-2xl px-3.5 py-3 ${warning ? "border border-amber-400/45 bg-amber-400/[0.10]" : ""}`}
    style={fullWidth ? { gridColumn: "1 / -1" } : undefined}
  >
    <div className="flex min-w-0 items-center gap-2.5">
      <svg viewBox="0 0 24 24" className={`h-5 w-5 shrink-0 ${warning ? "text-amber-300" : "text-[var(--ac-text)] opacity-50"}`} fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M13.5 2.8 5.8 13h5.1l-.7 8.2L18.3 11h-5.1z" /></svg>
      <div className="min-w-0 flex-1">
        <div className="flex flex-wrap items-center gap-2">
          <span className="text-[11px] font-black uppercase tracking-[0.12em] text-[var(--ac-muted)]">Мощность</span>
          {warning ? <span className="rounded-full bg-amber-300/15 px-2 py-0.5 text-[10px] font-black text-amber-200">уточнить</span> : null}
        </div>
        <div className="mt-2 grid grid-cols-[minmax(0,1fr)_auto] gap-2">
          <select
            aria-label="Выбрать мощность в лошадиных силах"
            value={commonValue}
            onChange={(event) => {
              if (event.target.value === "auto") return apply(null);
              if (event.target.value === "custom") return;
              const value = Number(event.target.value);
              setManual(event.target.value);
              apply(value);
            }}
            className="min-w-0 rounded-xl border border-white/10 bg-black/20 px-2.5 py-2 text-[13px] font-bold text-[var(--ac-text)] outline-none focus:border-white/25"
          >
            <option value="auto">Авто</option>
            {options.map((value) => <option key={value} value={value}>{value} л.с.</option>)}
            {!COMMON_HP.includes(current) ? <option value="custom">{current} л.с.</option> : <option value="custom">Другая…</option>}
          </select>
          <form onSubmit={submit} className="flex items-center gap-1.5">
            <input
              type="number"
              min={20}
              max={2500}
              step={1}
              inputMode="numeric"
              value={manual}
              onChange={(event) => setManual(event.target.value)}
              aria-label="Ввести мощность вручную"
              className="w-[76px] rounded-xl border border-white/10 bg-black/20 px-2 py-2 text-center text-[13px] font-black text-[var(--ac-text)] outline-none focus:border-white/25"
            />
            <button type="submit" className="rounded-xl bg-white/10 px-2.5 py-2 text-[11px] font-black text-[var(--ac-text)] hover:bg-white/15">л.с. ↻</button>
          </form>
        </div>
        {warning ? <p className="mt-2 text-[10px] font-semibold leading-4 text-amber-100/80">{hint}</p> : <p className="mt-2 text-[10px] font-semibold leading-4 text-[var(--ac-muted)]">Можно изменить мощность и сразу пересчитать цену.</p>}
      </div>
    </div>
  </div>;
}
''')

