name: Remaining Yandex data inventory 2026-11-07
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/yandex-retained-data-inventory-20261107.yml']
permissions:
  contents: read
concurrency:
  group: yandex-retained-data-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check boto3==1.40.68
      - name: Read legacy bucket metadata only, never copy customer data into public artifacts
        env:
          SOURCE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          SOURCE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          SOURCE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          SOURCE_ACCESS: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          SOURCE_SECRET: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          SOURCE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
        run: |
          mkdir -p legacy-data-inventory
          python3 - <<'PY'
          import os,json,datetime,hashlib,urllib.parse,boto3
          from botocore.config import Config
          endpoint=os.environ.get('SOURCE_ENDPOINT') or 'https://storage.yandexcloud.net'
          host=urllib.parse.urlparse(endpoint).hostname or ''
          assert host=='storage.yandexcloud.net' or host.endswith('.storage.yandexcloud.net')
          assert os.environ['SOURCE_BUCKET']!='avtocena-staging-8120751'
          client=boto3.client('s3',endpoint_url=endpoint,region_name=os.environ.get('SOURCE_REGION') or 'ru-central1',aws_access_key_id=os.environ['SOURCE_ACCESS'],aws_secret_access_key=os.environ['SOURCE_SECRET'],config=Config(signature_version='s3v4',connect_timeout=15,read_timeout=45,retries={'max_attempts':2,'mode':'standard'},s3={'addressing_style':'path'}))
          report={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'readOnly':True,'provider':'Yandex','complete':False,'objects':0,'bytes':0,'groups':{},'errors':[]}
          def save():
              with open('legacy-data-inventory/bucket-summary.json','w') as f:json.dump(report,f,indent=2)
          prefix=os.environ.get('SOURCE_PREFIX','').strip('/')
          token=None;tokens=set();keys=set();digest=hashlib.sha256();cutoff=datetime.datetime(2026,10,11,tzinfo=datetime.timezone.utc)
          try:
              for page in range(3000):
                  args={'Bucket':os.environ['SOURCE_BUCKET'],'MaxKeys':1000}
                  if token:args['ContinuationToken']=token
                  response=client.list_objects_v2(**args)
                  for row in response.get('Contents',[]):
                      key=row['Key'];assert key not in keys;keys.add(key)
                      size=row['Size'];assert isinstance(size,int) and size>=0
                      relative=key[len(prefix)+1:] if prefix and key.startswith(prefix+'/') else key
                      parts=relative.split('/');group='/'.join(parts[:2]) if parts[0]=='catalog' else parts[0]
                      if len(group)>80 or not all(c.isalnum() or c in '/-_.' for c in group):group='other'
                      if prefix and not key.startswith(prefix+'/'):group='outside-configured-prefix'
                      g=report['groups'].setdefault(group,{'objects':0,'bytes':0,'modifiedAfterCutoverObjects':0,'modifiedAfterCutoverBytes':0})
                      g['objects']+=1;g['bytes']+=size;report['objects']+=1;report['bytes']+=size
                      if row.get('LastModified') and row['LastModified']>=cutoff:g['modifiedAfterCutoverObjects']+=1;g['modifiedAfterCutoverBytes']+=size
                      digest.update(json.dumps([key,size,row.get('ETag'),str(row.get('LastModified'))],ensure_ascii=True).encode())
                  if not response.get('IsTruncated'):
                      report['complete']=True;break
                  token=response.get('NextContinuationToken');assert token and token not in tokens;tokens.add(token)
              assert report['complete'],'incomplete_inventory'
              report['inventoryDigest']=digest.hexdigest()
              try:report['versioning']=client.get_bucket_versioning(Bucket=os.environ['SOURCE_BUCKET']).get('Status','Disabled')
              except Exception as e:report['errors'].append({'stage':'versioning','type':type(e).__name__})
          except Exception as e:report['errors'].append({'stage':'inventory','type':type(e).__name__});raise
          finally:save();print(json.dumps(report))
          PY
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1}
      - name: Read pilot disk identity and registry images without deleting them
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const key=JSON.parse(process.env.YC_SA_JSON_CREDENTIALS||'{}'),iam='https://iam.api.cloud.yandex.net/iam/v1/tokens',now=Math.floor(Date.now()/1000),enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');assert.ok(key.id&&key.service_account_id&&key.private_key);
          const body=enc({alg:'PS256',typ:'JWT',kid:key.id})+'.'+enc({iss:key.service_account_id,aud:iam,iat:now,exp:now+600});
          const sig=crypto.sign('sha256',Buffer.from(body),{key:key.private_key.slice(key.private_key.indexOf('-----BEGIN')),padding:crypto.constants.RSA_PKCS1_PSS_PADDING,saltLength:32}).toString('base64url');
          const ir=await fetch(iam,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jwt:body+'.'+sig}),signal:AbortSignal.timeout(15000)});assert.equal(ir.ok,true);const {iamToken}=await ir.json();
          const headers={Authorization:'Bearer '+iamToken},read=async url=>{const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});assert.equal(r.ok,true,'read_'+r.status);return r.json();};
          const vm=await read('https://compute.api.cloud.yandex.net/compute/v1/instances/fhmvvsmoc6vpu3jbbhkc');
          const disk=await read('https://compute.api.cloud.yandex.net/compute/v1/disks/fhmj3k1481pt5qfu9ek7');
          const ip=await read('https://vpc.api.cloud.yandex.net/vpc/v1/addresses/e9bi1j785vdm42vubl1q');
          const report={at:new Date().toISOString(),readOnly:true,vm:{id:vm.id,name:vm.name,folderId:vm.folderId,status:vm.status,bootDisk:vm.bootDisk,secondaryDisks:vm.secondaryDisks||[],networkInterfaces:(vm.networkInterfaces||[]).map(n=>({index:n.index,address:n.primaryV4Address?.oneToOneNat?.address})),metadataKeys:Object.keys(vm.metadata||{})},disk:{id:disk.id,folderId:disk.folderId,size:disk.size,instanceIds:disk.instanceIds,sourceImageId:disk.sourceImageId},address:{id:ip.id,folderId:ip.folderId,used:ip.used,reserved:ip.reserved,address:ip.externalIpv4Address?.address},images:[]};
          let token='';for(let page=0;page<20;page++){const u=new URL('https://container-registry.api.cloud.yandex.net/container-registry/v1/images');u.searchParams.set('registryId','crp73he0q1blh1mujo4s');u.searchParams.set('pageSize','1000');if(token)u.searchParams.set('pageToken',token);const data=await read(u);report.images.push(...(data.images||[]).map(i=>({id:i.id,name:i.name,createdAt:i.createdAt,compressedSize:i.compressedSize})));token=data.nextPageToken||'';if(!token)break;if(page===19)throw Error('incomplete_registry_inventory');}
          fs.writeFileSync('legacy-data-inventory/resources.json',JSON.stringify(report,null,2));console.log(JSON.stringify({...report,images:{count:report.images.length,names:[...new Set(report.images.map(i=>i.name))]}}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-data-inventory
          path: legacy-data-inventory
          retention-days: 14
