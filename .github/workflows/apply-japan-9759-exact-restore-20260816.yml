name: Apply Japan 9759 exact baseline restore
run-name: Guarded exact Japan 9759 restore · ${{ github.sha }}

on:
  push:
    paths:
      - .github/workflows/apply-japan-9759-exact-restore-20260816.yml

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
      CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
      CATALOG_OFFER_RETENTION_MS: "3600000"
      RECOVERY_PUBLISH_MAX: "30000"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
      RESTORE_GENERATION: gen_1786746182901_54c0a190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Strict seven-market snapshot immediately before restore
        env:
          CATALOG_AUDIT_OUTPUT: japan-9759-restore-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Read exact 9759 Japan offers from the last proven generation
        shell: bash
        run: |
          mkdir -p recovery-input
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const { readDataJson } = await import('./apps/web/lib/data.ts');
          const { offerPath, chunkName } = await import('./apps/web/lib/catalog/storage.ts');
          const generation = process.env.RESTORE_GENERATION;
          const offers = [];
          let misses = 0;
          for (let index = 1; index <= 100; index++) {
            const rows = await readDataJson(offerPath(generation, 'japan', chunkName(index)), null);
            if (!Array.isArray(rows) || !rows.length) {
              misses += 1;
              if (misses >= 2) break;
              continue;
            }
            misses = 0;
            offers.push(...rows);
          }
          const unique = new Map(offers.map((offer) => [offer?.id, offer]));
          if (offers.length !== 9759) throw new Error(`japan_restore_generation_count:${offers.length}:9759`);
          if (unique.size !== offers.length) throw new Error(`japan_restore_generation_duplicates:${offers.length - unique.size}`);
          await fs.writeFile('recovery-input/catalog-rebuild-japan.json', JSON.stringify({ version: 1, market: 'japan', sourceGeneration: generation, offers }));
          console.log({ generation, offers: offers.length });
          NODE
      - name: Repeat the exact read-only proof inside the write job
        env:
          RECOVERY_BATCH_MARKETS: japan
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: japan-9759-restore-dryrun.json
          RECOVERY_BATCH_DRY_RUN: "true"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Fail closed unless the candidate is exactly the proven Japan baseline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('japan-9759-restore-before.json', 'utf8'));
          const dry = JSON.parse(fs.readFileSync('japan-9759-restore-dryrun.json', 'utf8'));
          const japan = dry.byMarket?.japan || {};
          if (dry.dryRun !== true || dry.published !== false) throw new Error('japan_restore_not_dry');
          if (Number(japan.count || 0) !== 9759) throw new Error(`japan_restore_would_not_restore_9759:${japan.count}`);
          if (Number(japan.incomingCount || 0) !== 9759) throw new Error(`japan_restore_incoming_count:${japan.incomingCount}`);
          if (Number(japan.retainedCount || 0) !== 0) throw new Error(`japan_restore_retained_count:${japan.retainedCount}`);
          if (Number(japan.maxOffersPerModelYear || 0) !== 20) throw new Error(`japan_restore_quota_contract:${japan.maxOffersPerModelYear}`);
          if (Number(japan.imageStats?.min || 0) < 5 || Number(japan.imageStats?.belowMinimum || 0) !== 0) throw new Error('japan_restore_image_gate');
          if (Number(japan.sourceCounts?.prestige_japan_auctions_open || 0) !== 9759) throw new Error('japan_restore_source_count');
          for (const market of ['korea','china','uae','europe','georgia','kyrgyzstan']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const planned = Number(dry.preservedByMarket?.[market] || 0);
            if (planned !== expected) throw new Error(`japan_restore_preservation_count:${market}:${planned}:${expected}`);
            if (!String(dry.preservedPublicHashByMarket?.[market] || '')) throw new Error(`japan_restore_preservation_hash:${market}`);
          }
          console.log({ currentJapan: before.markets?.japan?.count, candidateJapan: japan.count, imageStats: japan.imageStats });
          NODE
      - name: Publish exact Japan 9759 and preserve the other six public snapshots
        env:
          RECOVERY_BATCH_MARKETS: japan
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: japan-9759-restore-publish.json
          RECOVERY_BATCH_DRY_RUN: "false"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Strict all-seven audit after persistence
        env:
          CATALOG_AUDIT_OUTPUT: japan-9759-restore-after.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Certify exact Japan baseline and untouched-market preservation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('japan-9759-restore-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('japan-9759-restore-after.json', 'utf8'));
          const publish = JSON.parse(fs.readFileSync('japan-9759-restore-publish.json', 'utf8'));
          if (publish.published !== true || !publish.generationId) throw new Error('japan_restore_publish_missing_generation');
          const planned = publish.byMarket?.japan || {};
          if (Number(planned.count || 0) !== 9759 || Number(planned.incomingCount || 0) !== 9759 || Number(planned.retainedCount || 0) !== 0) throw new Error('japan_restore_publish_counts');
          if (Number(planned.imageStats?.min || 0) < 5 || Number(planned.imageStats?.belowMinimum || 0) !== 0) throw new Error('japan_restore_publish_image_gate');
          const japan = after.markets?.japan || {};
          if (Number(japan.count || 0) !== 9759) throw new Error(`japan_restore_post_count:${japan.count}`);
          if (Number(japan.sourceCounts?.prestige_japan_auctions_open || 0) !== 9759) throw new Error('japan_restore_post_source_count');
          if (Number(japan.belowMarketMinYearCount || 0) !== 0 || Number(japan.nonVehicleCount || 0) !== 0) throw new Error('japan_restore_post_vehicle_gate');
          if (Number(japan.belowFiveImagesCount || 0) !== 0) throw new Error('japan_restore_post_image_gate');
          if (Number(japan.invalidIdentityCount || 0) !== 0 || Number(japan.renderedIdentityFailureCount || 0) !== 0 || Number(japan.japanSoldIdentityFailureCount || 0) !== 0) throw new Error('japan_restore_post_identity_gate');
          if (Number(japan.maxPerExactModelYear || 0) > 20) throw new Error(`japan_restore_post_quota:${japan.maxPerExactModelYear}`);
          for (const market of ['korea','china','uae','europe','georgia','kyrgyzstan']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const actual = Number(after.markets?.[market]?.count || 0);
            if (actual !== expected) throw new Error(`japan_restore_post_preservation:${market}:${actual}:${expected}`);
            if (!String(publish.preservedPublicHashByMarket?.[market] || '')) throw new Error(`japan_restore_publish_hash:${market}`);
          }
          console.log({ generationId: publish.generationId, japan, preservedByMarket: publish.preservedByMarket });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-9759-exact-restore
          path: |
            japan-9759-restore-before.json
            japan-9759-restore-dryrun.json
            japan-9759-restore-publish.json
            japan-9759-restore-after.json
          if-no-files-found: warn
          retention-days: 7
