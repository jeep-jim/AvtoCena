name: Inspect saved UAE and Europe intake metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-saved-intake-readonly-probe
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: regcloud-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the offline probe
        run: node --test tests/catalog-saved-intake-readonly-probe.test.mjs
      - name: Read exact cursors and saved archive metadata only
        env:
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/catalog-saved-intake-readonly-probe.mjs --output "$RUNNER_TEMP/saved-intake-readonly-probe.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-intake-readonly-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/saved-intake-readonly-probe.json
          if-no-files-found: warn
          retention-days: 7
