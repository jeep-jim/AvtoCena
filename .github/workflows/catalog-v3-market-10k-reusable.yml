name: Catalog V3 independent market 10k

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      display_name:
        required: true
        type: string
      retention_ms:
        required: false
        type: string
        default: "259200000"
    secrets:
      YC_OBJECT_STORAGE_ENDPOINT:
        required: false
      YC_OBJECT_STORAGE_REGION:
        required: false
      YC_OBJECT_STORAGE_BUCKET:
        required: true
      YC_OBJECT_STORAGE_ACCESS_KEY_ID:
        required: true
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY:
        required: true
      YC_OBJECT_STORAGE_PREFIX:
        required: false
      CATALOG_IMAGE_CDN_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-v3-market-${{ inputs.market }}
  cancel-in-progress: false

env:
  CATALOG_V2_PRIORITY_TARGET: "1"
  CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"
  CATALOG_PRIORITY_MAX_POWER_HP: "160"
  CATALOG_PRIORITY_MAX_AGE_YEARS: "6"
  CATALOG_V2_RECENT_MAX_AGE_YEARS: "15"
  CATALOG_V2_HARD_MAX_TOTAL_RUB: "100000000"
  CATALOG_REBUILD_TARGET_PER_SOURCE: "10000"
  CATALOG_REBUILD_TARGET_PER_MARKET: "10000"
  CATALOG_PUBLISH_TARGET_PER_MARKET: "10000"
  CATALOG_PUBLISH_MAX_PER_MARKET: "100000"
  CATALOG_OFFER_RETENTION_MS: ${{ inputs.retention_ms }}
  CATALOG_DEFAULT_RETENTION_MS: "259200000"
  CATALOG_JAPAN_RETENTION_MS: "2592000000"
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_REBUILD_PREFERRED_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_COLLECTION_IMAGE_LIMIT: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-probe-source-shard.mjs
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-publish-market.mjs
          node --check scripts/catalog-apply-encyclopedia-identity-master.mjs
          node --import tsx --test \
            tests/catalog-calculation-integrity.test.ts \
            tests/catalog-image-quality.test.ts \
            tests/catalog-v2-market-recovery.test.ts \
            tests/catalog-encyclopedia-identity-application.test.ts \
            tests/catalog-encyclopedia-identity-runtime.test.ts \
            tests/catalog-encyclopedia-identity-data.test.ts \
            tests/catalog-encyclopedia-identity-master.test.ts

  collect:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_MARKET: ${{ inputs.market }}
      CATALOG_REBUILD_SHARD_INDEX: ${{ matrix.shard }}
      CATALOG_REBUILD_SHARD_COUNT: "5"
      CATALOG_V2_SOURCE_SLOTS_ONLY: "0"
      CATALOG_REBUILD_IGNORE_PROBE: "0"
      CATALOG_REBUILD_RESET_CURSOR: "0"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "10000"
      CATALOG_REBUILD_MAX_TOTAL_PAGES: "100000"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "500"
      CATALOG_REBUILD_MAX_SOURCE_ERRORS: "8"
      CATALOG_REBUILD_DETAIL_LIMIT_PER_SOURCE: "10000"
      CATALOG_REBUILD_PREPARE_CONCURRENCY: "30"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "8"
      CATALOG_REBUILD_TIME_LIMIT_MS: "5700000"
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_IMAGE_TIMEOUT_MS: "20000"
      CATALOG_IMAGE_MAX_BYTES: "12000000"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "10"
      CATALOG_GALLERY_FAST_PATH: "true"
      CATALOG_REBUILD_OUTPUT: catalog-rebuild-${{ inputs.market }}-${{ matrix.shard }}.json
      CATALOG_PROBE_OUTPUT: catalog-v3-probe-${{ inputs.market }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/catalog-probe-source-shard.mjs
      - name: Collect real offers
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=90s 6000s npx tsx scripts/catalog-rebuild-source-shard.mjs
          status=$?
          test -s "$CATALOG_REBUILD_OUTPUT" || node -e 'const fs=require("fs");fs.writeFileSync(process.env.CATALOG_REBUILD_OUTPUT,JSON.stringify({market:process.env.CATALOG_REBUILD_MARKET,count:0,partial:true,offers:[],report:{sourceErrors:[{error:`exit_${process.argv[1]}`}]}}))' "$status"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v3-${{ inputs.market }}-${{ matrix.shard }}
          path: |
            catalog-v3-probe-${{ inputs.market }}-${{ matrix.shard }}.json
            catalog-rebuild-${{ inputs.market }}-${{ matrix.shard }}.json
          retention-days: 3
          compression-level: 9

  publish:
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_REBUILD_INPUT_DIR: catalog-v3-input
      CATALOG_REBUILD_MARKETS: ${{ inputs.market }}
      CATALOG_REBUILD_VALIDATION_REPORT: catalog-v3-${{ inputs.market }}-validation-report.json
      CATALOG_REBUILD_PUBLISH_REPORT: catalog-v3-${{ inputs.market }}-publish-report.json
      CATALOG_REBUILD_TARGET_PER_SOURCE: "100000"
      CATALOG_PUBLISH_PREPARE_CONCURRENCY: "24"
      CATALOG_INDEX_WRITE_CONCURRENCY: "12"
      CATALOG_STORAGE_EMERGENCY: "true"
      CATALOG_ENCYCLOPEDIA_IDENTITY_MASTER: "1"
      CATALOG_IDENTITY_PREPARE_CONCURRENCY: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-v3-${{ inputs.market }}-[0-4]
          path: catalog-v3-input
          merge-multiple: true
      - name: Require collected offers
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync(process.env.CATALOG_REBUILD_INPUT_DIR).filter(x=>/^catalog-rebuild-.*-\d+\.json$/.test(x));
          const total=files.reduce((n,f)=>{const p=JSON.parse(fs.readFileSync(path.join(process.env.CATALOG_REBUILD_INPUT_DIR,f)));return n+Number(p.count||p.offers?.length||0)},0);
          console.log({files:files.length,total});
          if(total<=0) process.exit(1);
          NODE
      - name: Apply Encyclopedia Identity Master
        run: npx tsx scripts/catalog-apply-encyclopedia-identity-master.mjs
      - run: npx tsx scripts/catalog-validate-source-scale.mjs
      - name: Publish market
        run: npx tsx scripts/catalog-publish-market.mjs
      - name: Require safe publication
        run: |
          node <<'NODE'
          const fs=require('fs');
          const market=process.env.CATALOG_REBUILD_MARKETS;
          const p=JSON.parse(fs.readFileSync(process.env.CATALOG_REBUILD_PUBLISH_REPORT,'utf8'));
          const count=Number(p.byMarket?.[market]||0);
          const q=p.marketQuality?.[market]||{};
          const state={market,published:p.published===true,generationId:p.generationId||null,count,previousRetainedCount:Number(q.previousRetainedCount||0),generatedCandidates:Number(q.generatedCandidates||0),priorityCount:Number(q.priorityCount||0),recentCount:Number(q.recentCount||0),extendedCount:Number(q.extendedCount||0),regressionBlocked:q.regressionBlocked===true,publicationError:p.publicationError||''};
          console.log(JSON.stringify(state,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Catalog V3 ${market}\n\n\`\`\`json\n${JSON.stringify(state,null,2)}\n\`\`\`\n`);
          if(!state.published||!state.generationId||state.count<=0||state.regressionBlocked||state.publicationError) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v3-${{ inputs.market }}-reports
          path: |
            catalog-v3-${{ inputs.market }}-validation-report.json
            catalog-v3-${{ inputs.market }}-publish-report.json
          retention-days: 3

  health:
    if: always()
    needs: [validate, collect, publish]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "market=${{ inputs.market }}" >> "$GITHUB_STEP_SUMMARY"
          echo "validate=${{ needs.validate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "collect=${{ needs.collect.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "publish=${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.publish.result }}" = "success"
