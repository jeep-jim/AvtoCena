name: Regcloud — read owner rollback failure once
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-owner-rollback-evidence.json']
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the closed failed cutover interval and compare retained settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 python3 - <<'PY'
          import collections, json, re, subprocess
          release='463fd22559a2f9c5acd60f8f5e4b269689215c84'
          previous='008643e8929901e366d079b0d5c394e9b4df2350'
          def run(*args):
              return subprocess.run(args,capture_output=True,text=True,check=True,timeout=30).stdout
          def inspect(name):
              return json.loads(run('docker','inspect',name))[0]
          candidate=inspect('avtocena-release-'+release[:12])
          production=inspect('avtocena-production')
          assert not candidate['State']['Running']
          assert candidate['Config']['Labels']['org.opencontainers.image.revision']==release
          assert production['State']['Running']
          assert production['Config']['Labels']['org.opencontainers.image.revision']==previous
          def state(c):
              return {'name':c['Name'],'image':c['Image'],'running':c['State']['Running'],'oomKilled':c['State']['OOMKilled'],'restarts':c['RestartCount'],'started':c['State']['StartedAt'],'finished':c['State']['FinishedAt'],'exit':c['State']['ExitCode'],'memoryLimit':c['HostConfig']['Memory'],'cpuLimit':c['HostConfig']['NanoCpus']}
          def env(c):
              return dict(x.split('=',1) for x in c['Config']['Env'])
          ids=run('docker','ps','-aq','--filter','label=avtocena.role=production').split()
          retained=json.loads(run('docker','inspect',*ids))
          originals=[c for c in retained if c['Id']!=candidate['Id'] and c['Config'].get('Labels',{}).get('org.opencontainers.image.revision')==release]
          print('CURRENT',json.dumps(state(production)),flush=True)
          print('FAILED_CANDIDATE',json.dumps(state(candidate)),flush=True)
          for original in originals:
              a,b=env(original),env(candidate)
              diff=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
              public={'NODE_OPTIONS','UV_THREADPOOL_SIZE','AVTOCENA_CALCULATION_VERSION','CATALOG_STORAGE_TIMING','CATALOG_RATE_TIMEOUT_MS','AVTOCENA_INTERACTIVE_READ_BUDGET_MS','YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS','JSON_STORAGE_DRIVER'}
              values={k:{'original':a.get(k),'candidate':b.get(k)} for k in diff if k in public}
              print('ORIGINAL_RETAINED',json.dumps(state(original)),flush=True)
              print('ENVIRONMENT_COMPARISON',json.dumps({'sameImage':original['Image']==candidate['Image'],'differentKeys':diff,'publicTuningDifferences':values,'sameMounts':original['Mounts']==candidate['Mounts']}),flush=True)
          categories=['detail_cache_queue_timeout','detail_cache_queue_full','catalog_market_unavailable','catalog_generation_changed','catalog_projection_unavailable','object_storage_response_timeout','read_deadline','ETIMEDOUT','ECONNRESET','TypeError','heap out of memory','FATAL ERROR','ENOMEM','visitor_restricted']
          for label,c in [('failed',candidate),('production',production)]:
              p=subprocess.run(['docker','logs','--since','2026-11-10T15:59:50Z','--until','2026-11-10T16:01:45Z','--tail','12000',c['Id']],capture_output=True,text=True,check=True,timeout=30)
              s=p.stdout+'\n'+p.stderr
              codes=collections.Counter(re.findall(r"(?:code|reason|error):\s*['\x22]([a-zA-Z0-9_]{3,80})['\x22]",s))
              markets=collections.Counter(re.findall(r"market:\s*['\x22](china|korea|japan|europe|uae|georgia)['\x22]",s))
              print('CLOSED_INTERVAL_ERRORS',json.dumps({'target':label,'categories':{k:s.count(k) for k in categories},'codes':dict(codes),'marketMentions':dict(markets)}),flush=True)
          print('CURRENT_RESOURCES',run('docker','stats','--no-stream','--format','memory={{.MemUsage}} cpu={{.CPUPerc}}','avtocena-production').strip(),flush=True)
          print('OWNER_ROLLBACK_READ_ONLY_EVIDENCE_COMPLETE',flush=True)
          PY
