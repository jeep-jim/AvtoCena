name: Diagnose Encar detail pacing

on:
  push:
    branches:
      - fix/encar-detail-pacing-20260810
    paths:
      - "apps/web/lib/catalog/encar-complete-source.ts"
      - ".github/workflows/diag-encar-detail-pacing.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"
  CATALOG_ENCAR_COMPLETE_DETAIL_RPM: "180"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate source code
        run: |
          npx tsc --noEmit --pretty false --project apps/web/tsconfig.json
          node --check scripts/catalog-live-recovery-market.mjs
      - name: Run exact Encar recovery without publishing
        env:
          RECOVERY_MARKET: korea
          RECOVERY_SOURCE_IDS: encar_direct
          RECOVERY_OUTPUT: encar-pacing-smoke.json
          RECOVERY_TARGET: "200"
          RECOVERY_MAX_PAGES: "3"
          RECOVERY_TIME_LIMIT_MS: "900000"
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Assert pagination survived detail traffic
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('encar-pacing-smoke.json', 'utf8'));
          const source = data?.report?.sources?.find((row) => row.sourceId === 'encar_direct');
          if (!source) throw new Error('encar_source_report_missing');
          if (Number(source.pages || 0) < 3) throw new Error(`encar_pages_too_low:${source.pages}`);
          if (String(source.stopReason || '') === 'source_error') throw new Error(`encar_source_error:${JSON.stringify(source.errors || [])}`);
          if (Number(source.seen || 0) < 150) throw new Error(`encar_seen_too_low:${source.seen}`);
          console.log(JSON.stringify({
            pages: source.pages,
            seen: source.seen,
            accepted: source.accepted,
            stopReason: source.stopReason,
            errors: source.errors,
            totalCount: data?.report?.count,
            electricCount: data?.report?.electricCount,
            hybridCount: data?.report?.hybridCount,
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-detail-pacing-smoke
          path: encar-pacing-smoke.json
          if-no-files-found: warn
          retention-days: 2
