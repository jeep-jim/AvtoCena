name: Diagnose blocked source routes
on:
  push:
    branches: [diag/blocked-sources-20260810]
    paths: [.github/workflows/diag-blocked-source-routes.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe indexed Dongchedi routes without publishing
        shell: bash
        run: |
          node <<'NODE'
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
            'accept-language':'zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7',
            'accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
            'cache-control':'no-cache',
          };
          const indexed='/usedcar/x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-59-x-1-1-5-x-x-x-x';
          const targets=[
            ['dong-indexed-www',`https://www.dongchedi.com${indexed}`],
            ['dong-indexed-hl',`https://www-hl.dongchedi.com${indexed}`],
            ['dong-used-filter-root','https://www.dongchedi.com/usedcar/x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x'],
            ['dong-new-home','https://www-hl.dongchedi.com/'],
          ];
          function compact(s,n=1000){return String(s||'').replace(/\s+/g,' ').slice(0,n)}
          for(const [name,url] of targets){
            try{
              const r=await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(20000)});
              const text=await r.text();
              const next=text.match(/<script[^>]+id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i)?.[1]||'';
              const vehicleWords=(text.match(/二手|车源|检测报告|新车指导价|usedcar|series_id|car_id|info_id/gi)||[]).length;
              const links=[...text.matchAll(/href=["']([^"']+)["']/gi)].map(m=>m[1]).filter(x=>/usedcar/i.test(x)).slice(0,40);
              console.log(JSON.stringify({name,status:r.status,finalUrl:r.url,bytes:text.length,title:compact(text.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],300),nextBytes:next.length,vehicleWords,links,nextPreview:compact(next,2500),bodyPreview:compact(text,1800)},null,2));
            }catch(e){console.log(JSON.stringify({name,url,error:String(e)}));}
          }
          NODE