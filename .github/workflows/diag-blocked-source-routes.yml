name: Diagnose blocked source routes
on:
  push:
    branches: [diag/blocked-sources-20260810]
    paths: [.github/workflows/diag-blocked-source-routes.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Dongchedi, MyAuto and AutoPapa without publishing
        shell: bash
        run: |
          node <<'NODE'
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
            'accept-language':'zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7,ka;q=0.6',
            'accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
            'cache-control':'no-cache',
          };
          const targets=[
            ['dong-used','https://www.dongchedi.com/usedcar?page=1'],
            ['dong-used-root','https://www.dongchedi.com/usedcar'],
            ['dong-library','https://www.dongchedi.com/auto/library/x-x-x-x-x-x-x-x-x-x-x?page=1'],
            ['dong-root','https://www.dongchedi.com/'],
            ['myauto-en-main','https://www.myauto.ge/en/main?page=1'],
            ['myauto-en-root','https://www.myauto.ge/en/'],
            ['myauto-root','https://www.myauto.ge/'],
            ['autopapa-en-search','https://autopapa.ge/en/search?page=1'],
            ['autopapa-en-cars','https://autopapa.ge/en/cars?page=1'],
            ['autopapa-search','https://autopapa.ge/search?page=1'],
            ['autopapa-root','https://autopapa.ge/'],
          ];
          function compact(s,n=800){return String(s||'').replace(/\s+/g,' ').slice(0,n)}
          for(const [name,url] of targets){
            try{
              const r=await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(20000)});
              const text=await r.text();
              const scripts=[...text.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]).slice(0,25);
              const links=[...text.matchAll(/href=["']([^"']+)["']/gi)].map(m=>m[1]).filter(x=>/(used|car|auto|vehicle|search|pr\/|detail)/i.test(x)).slice(0,30);
              const api=[...new Set([...text.matchAll(/(?:https?:)?\\?\/\\?\/[^"'\\s<>]*(?:api|usedcar|vehicle|product|search)[^"'\\s<>]*/gi)].map(m=>m[0].replaceAll('\\/','/')))].slice(0,40);
              const next=text.match(/<script[^>]+id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i)?.[1]||'';
              console.log(JSON.stringify({name,status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type'),bytes:text.length,title:compact(text.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],300),scripts,links,api,nextBytes:next.length,nextPreview:compact(next,1000),bodyPreview:compact(text,1200)},null,2));
            }catch(e){console.log(JSON.stringify({name,url,error:String(e)}));}
          }
          NODE