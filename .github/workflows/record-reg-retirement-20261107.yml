name: Record REG retirement checkpoint 2026-11-07
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/record-reg-retirement-20261107.yml']
permissions:
  contents: write
concurrency:
  group: reg-retirement-roadmap-record
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Append actual checkpoint and preserve concurrent history
        run: |
          set -euo pipefail
          tail -n 50 AGENTS.md
          tail -n 60 roadmap.md
          python3 - <<'PY'
          from pathlib import Path
          note=Path('docs/operations/2026-11-07-reg-retirement-checkpoint.md').read_text()
          marker='## 07.11.2026 — REG: очистка и вывод старой инфраструктуры Яндекс'
          note=note.replace('# 07.11.2026 — REG: очистка и вывод старой инфраструктуры Яндекс',marker,1)
          p=Path('roadmap.md');before=p.read_bytes()
          if marker.encode() not in before:p.write_bytes(before+b'\n\n'+note.encode()+b'\n')
          assert p.read_bytes().startswith(before)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: append approved REG cleanup and legacy cloud retirement evidence'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git rebase origin/main
            done
          fi
          git log -1 --format='%H %s'
