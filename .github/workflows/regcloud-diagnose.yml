name: Regcloud — diagnose live request stalls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-diagnose.json']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Temporarily measure request durations, then restore configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          failed_release=$(python3 -c 'import json;print(json.load(open(".github/market-runs/regcloud-diagnose.json")).get("failedRelease", ""))')
          if [ -n "$failed_release" ]; then
            [[ "$failed_release" =~ ^[a-f0-9]{40}$ ]]
            ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
            remote_script="/opt/avtocena/releases/$failed_release/failed-release-diagnostic.py"
            scp "${ssh_opts[@]}" scripts/regcloud-failed-release-diagnostic.py "root@151.248.113.177:$remote_script"
            scp "${ssh_opts[@]}" scripts/regcloud-cpu-sample.mjs "root@151.248.113.177:/opt/avtocena/releases/$failed_release/cpu-sample.mjs"
            probe=$(python3 -c 'import json;v=json.load(open(".github/market-runs/regcloud-diagnose.json"));print("--probe-home" if v.get("probeHome") is True else "--probe-long" if v.get("probeLong") is True else "--probe-gate" if v.get("probeGate") is True else "--probe-catalog" if v.get("probeCatalog") is True else "--probe-ttl" if v.get("probeTTL") is True else "--probe" if v.get("probeSingleMarket") is True else "")')
            ssh "${ssh_opts[@]}" root@151.248.113.177 "python3 '$remote_script' '$failed_release' '$probe'"
            exit 0
          fi
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          exec 9>/run/lock/avtocena-runtime-change.lock
          flock -n 9
          config=/etc/nginx/conf.d/avtocena-prepare.conf
          backup=$(mktemp)
          cp -a "$config" "$backup"
          log=/var/log/nginx/avtocena-diagnostic-access.log
          install -m 600 /dev/null "$log"
          restore(){
            cp -a "$backup" "$config"
            nginx -t && systemctl reload nginx
            rm -f "$backup" "$log"
          }
          trap restore EXIT
          python3 - "$config" "$log" <<'CONFIG'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text()
          assert 'access_log off;' in s
          s=s.replace('access_log off;','access_log '+sys.argv[2]+' avtocena_perf;')
          p.write_text("log_format avtocena_perf '$msec $uri $status $request_time $upstream_response_time';\n"+s)
          CONFIG
          nginx -t
          systemctl reload nginx
          python3 - <<'MEASURE'
          import urllib.request,time,json
          for path in ['/cars?sort=totalRub','/api/catalog/search?market=china&powerTo=160&pageSize=24','/cars/offer/kia-k5-iii-2-0-prestige-2023--c92ac81215cbc82107b7e6fb']:
              start=time.monotonic()
              try:
                  with urllib.request.urlopen('https://avtocena.com'+path,timeout=45) as r:body=r.read();status=r.status
                  print('REQUEST_PROBE',json.dumps({'path':path,'seconds':round(time.monotonic()-start,3),'status':status,'bytes':len(body)}),flush=True)
              except Exception as e: print('REQUEST_PROBE_ERROR',json.dumps({'path':path,'seconds':round(time.monotonic()-start,3),'error':str(e)}),flush=True)
          time.sleep(45)
          MEASURE
          python3 - "$log" <<'REPORT'
          import pathlib,sys,json,collections
          rows=[]
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              parts=line.split()
              if len(parts)<5:continue
              path=parts[1]
              # No IPs, cookies, query strings, private CRM paths or user identities.
              route=path if path.startswith(('/cars','/sitemap','/api/catalog/','/api/health')) else 'other'
              try:rows.append({'route':route,'status':int(parts[2]),'seconds':float(parts[3]),'upstream':parts[4]})
              except ValueError:pass
          counts=collections.Counter(row['route'].split('/offer/')[0] for row in rows)
          print('REQUEST_COUNTS',json.dumps(dict(counts)),flush=True)
          print('SLOW_REQUESTS',json.dumps(sorted(rows,key=lambda r:r['seconds'],reverse=True)[:40]),flush=True)
          REPORT
          docker stats --no-stream --format 'container={{.Name}} memory={{.MemUsage}} cpu={{.CPUPerc}}'
          REMOTE
