name: AUTO.GE exact detail label smoke

on:
  push:
    branches:
      - catalog-electrified-recovery-20260809
    paths:
      - ".github/workflows/catalog-auto-georgia-detail-label-smoke.yml"
      - ".github/patches/fix-auto-georgia-detail-labels.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "2"
  RECOVERY_PREPARE_CONCURRENCY: "4"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact AUTO.GE detail label fix
        run: python .github/patches/fix-auto-georgia-detail-labels.py
      - name: Validate
        run: |
          node --check apps/web/lib/catalog/auto-georgia-strict-source.ts
          node --check scripts/catalog-live-recovery-market.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Smoke first five AUTO.GE pages
        continue-on-error: true
        env:
          RECOVERY_MARKET: georgia
          RECOVERY_SOURCE_IDS: auto_georgia_open
          RECOVERY_OUTPUT: catalog-rebuild-georgia-label-smoke.json
          RECOVERY_TARGET: "80"
          RECOVERY_MAX_PAGES: "5"
          RECOVERY_TIME_LIMIT_MS: "900000"
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Print compact result
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='catalog-rebuild-georgia-label-smoke.json';
          if(!fs.existsSync(p)){console.log('no smoke artifact');process.exit(0)}
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log(JSON.stringify({count:x.report?.count,electricCount:x.report?.electricCount,hybridCount:x.report?.hybridCount,documentedPowerCount:x.report?.documentedPowerCount,rejections:x.report?.sources?.[0]?.rejections,pendingElectrifiedModels:x.report?.pendingElectrifiedModels?.slice(0,30),calculationPendingModels:x.report?.calculationPendingModels?.slice(0,30),errors:x.report?.sources?.[0]?.errors},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-georgia-detail-label-smoke
          path: catalog-rebuild-georgia-label-smoke.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated target parser to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/auto-georgia-strict-source.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Parse exact AUTO.GE engine and fuel detail labels"
          git push origin HEAD:catalog-electrified-recovery-20260809
