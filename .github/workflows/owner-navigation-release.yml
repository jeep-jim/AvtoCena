          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --input-type=module <<'WAIT'
          // Market-scoped derivatives do not change publication aliases or need its lease.
          if(process.env.RELEASE_PREPARATION_MARKETS){console.log('Scoped preparation uses generation fences');process.exit(0);}
          const data=await import('./apps/web/lib/data.ts');
          const getJsonStorage=data.getJsonStorage||data.default?.getJsonStorage;
          if(typeof getJsonStorage!=='function')throw Error('storage_module_unavailable');
          const storage=getJsonStorage(),deadline=Date.now()+40*60_000;
          for (;;) {
            const lock=await storage.readJson('catalog/import-lock.json',null);
            const until=lock?.lockedUntil?Date.parse(lock.lockedUntil):0;
            if (!Number.isFinite(until)) throw Error('publication_lock_invalid');
            if (until<=Date.now()) break;
            console.log('WAIT_FOR_PUBLICATION',JSON.stringify({operationType:lock.operationType,lockedUntil:lock.lockedUntil}));
            if (Date.now()>=deadline) throw Error('publication_wait_deadline');
            await new Promise(resolve=>setTimeout(resolve,30_000));
          }
          WAIT
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS=120000 npx tsx scripts/archive-runtime-reference-sources.mjs
          export AVTOCENA_CALCULATION_VERSION=$(node scripts/catalog-calculation-version.mjs)
          npx tsx scripts/regcloud-verify-conditional-read.ts
          # Offline authoritative parity reads full market projections; keep a bounded
          # two-minute storage deadline here, without changing visitor request budgets.
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS=120000 npx tsx scripts/regcloud-prepare-prices.mjs
          if test -z "$RELEASE_PREPARATION_MARKETS"; then
            npx tsx scripts/prepare-catalog-colors.mjs
          fi
          # Supplier switching belongs to collection operations, never to an app release.
          CATALOG_OVERVIEW_SKIP_READY=true npx tsx scripts/catalog-refresh-generation-pages.mjs
          # Common homepage routes need their complete current-day overview even
          # for a market-scoped release. Reuse only a validated ready generation.
          if test -n "$RELEASE_PREPARATION_MARKETS"; then
            env -u RELEASE_PREPARATION_MARKETS CATALOG_OVERVIEW_SKIP_READY=true npx tsx scripts/catalog-refresh-generation-pages.mjs
          fi
