name: Release isolated stable speed and retained selection

on:
  push:
    branches: [main]
    paths: ['.github/market-runs/owner-navigation-release.json']

permissions:
  contents: read
  actions: read

env:
  RELEASE_SOURCE_SHA: 'f11285ebb378878832be91dd0b14633ade2351c2'

concurrency:
  group: regcloud-production-release
  cancel-in-progress: false

jobs:
  wait-for-astra:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 'f11285ebb378878832be91dd0b14633ade2351c2'
      - name: Require exact open candidate, merged reviews and all source checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'SOURCE_GUARD'
          import json,subprocess,urllib.request
          repo='jeep-jim/AvtoCena'
          sha='f11285ebb378878832be91dd0b14633ade2351c2'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          p=api('pulls/1755')
          assert p['state']=='open' and p['head']['sha']==sha and p['base']['sha']=='a182cd21b21ecf612b63613d263e5bdd817ea4c0', 'candidate closed, superseded or base changed'
          reviews={"publication":"a8e568d694833ca2120f41586c40255ce9237bd7","pricing":"5979a449cb68a04afcc17c4716b1e639103da5a6","speedIntegrity":"23493ce6889916385cd1742ab23b1a98d305145d","modelFixture":"03c95658024a7c6312d56757996befc167cda2b2","overlayHistory":"8778bd38be3f26227c383db5800239beb98f6182","encyclopediaRead":"f738f86d64e6ded24a34f5fd9bdf3940cd53e4bc","loginReads":"933a3ca4c70f934f579bf2ad1d18597507e23314"}
          for number,key in [(1738,'publication'),(1740,'pricing'),(1744,'speedIntegrity'),(1746,'modelFixture'),(1749,'overlayHistory'),(1752,'encyclopediaRead'),(1754,'loginReads')]:
              review=api(f'pulls/{number}')
              assert review['merged'] and review['head']['sha']==reviews[key], f'included review changed: {number}'
          required=[{"id":43123213619,"name":"Verify catalog failure isolation"},{"id":43123213503,"name":"Verify dealer workspace"},{"id":43123213613,"name":"Verify catalog sidebar and search"},{"id":43123213483,"name":"Verify green corner budget"},{"id":43123213566,"name":"Verify sticky catalog controls"},{"id":43123213600,"name":"QR and gallery browser QA"},{"id":43123213334,"name":"Verify offer sharing"},{"id":43123213598,"name":"Verify catalog load more"},{"id":43123213522,"name":"Verify owner UI polish"},{"id":43123213422,"name":"Verify city picker"},{"id":43123213478,"name":"Verify Dubicars paid feed"},{"id":43123213362,"name":"Verify local model suggestions"},{"id":43123213347,"name":"Verify site controls and chat"},{"id":43123213601,"name":"Verify per-car services and edit links"},{"id":43123213640,"name":"Verify dealer selection sharing"},{"id":43123213504,"name":"CI"},{"id":43123213696,"name":"Verify model search controls"},{"id":43123213342,"name":"Verify dealer banner and Yandex map"}]
          runs=api(f'actions/runs?head_sha={sha}&per_page=100')
          assert runs['total_count']<=100, 'unbounded source check inventory'
          actual={r['id']:r for r in runs['workflow_runs']}
          for expected in required:
              r=actual.get(expected['id'])
              assert r and r['head_sha']==sha and r['name']==expected['name'], f'exact source check missing: {expected}'
          assert {'CI','Verify local model suggestions'} <= {r['name'] for r in actual.values()}, 'mandatory check missing'
          for r in actual.values():
              assert r['head_sha']==sha and r['status']=='completed' and r['conclusion']=='success', f'source check not green: {r["id"]} {r["name"]} {r["status"]} {r["conclusion"]}'
          predecessor=api('actions/runs/43079097899')
          assert predecessor['head_sha']=='edcec4b74d8a8ebd45a24a01a723a39f64c19f2b' and predecessor['status']=='completed' and predecessor['conclusion']=='failure', 'rejected predecessor evidence changed'
          failed_transport=api('actions/runs/43090744197')
          assert failed_transport['conclusion']=='failure' and failed_transport['head_sha']=='a51c3c55a7ec759779aabac94739e02cdfa329d6', 'prior transport failure is not final or changed'
          prior_jobs=api('actions/runs/43090744197/jobs?per_page=100')['jobs']
          prior_prepare=[job for job in prior_jobs if job['name']=='prepare']
          assert len(prior_prepare)==1 and prior_prepare[0]['conclusion']=='failure', 'prior preparation not final'
          prior_steps={step['name']:step['conclusion'] for step in prior_prepare[0]['steps']}
          for name in ['Prepare private encyclopedia index for this release','Build existing application without production credentials','Install container runtime and load image (no application start)','Prepare exact price indexes before activating the release']:
              assert prior_steps.get(name)=='success', 'prior source/data preparation failed: '+name
          assert prior_steps.get('Preserve individual market preparation results')=='failure' and prior_steps.get('Deploy with rollback and resource measurements')=='skipped', 'prior activation may have started'
          rejected=api('actions/runs/43111977320')
          assert rejected['status']=='completed' and rejected['conclusion']=='failure' and rejected['head_sha']=='f17101357e14c314df6f197066278cd8ab872b46', 'last rejected release is not terminal or changed'
          rejected_pr=api('pulls/1753')
          assert rejected_pr['state']=='closed' and not rejected_pr['merged'] and rejected_pr['head']['sha']=='75c2e6f57cfa4022865217e029a1f5d1671842c3', 'rejected source metadata changed'
          rejected_jobs=api('actions/runs/43111977320/jobs?per_page=100')['jobs']
          rejected_prepare=[job for job in rejected_jobs if job['name']=='prepare']
          assert len(rejected_prepare)==1 and rejected_prepare[0]['conclusion']=='failure', 'rejected preparation is not final'
          rejected_steps={step['name']:step['conclusion'] for step in rejected_prepare[0]['steps']}
          assert rejected_steps.get('Deploy with rollback and resource measurements')=='failure', 'expected measured acceptance rejection missing'
          for name in ['Prepare exact price indexes before activating the release','Persist verified private evidence for market_prices']:
              assert rejected_steps.get(name)=='success', 'last market preparation/evidence did not pass'
          rollback=api('actions/runs/43121673944')
          assert rollback['status']=='completed' and rollback['conclusion']=='success' and rollback['head_sha']=='a175759b53917ec59dd1b991d66e363fbb91f5a4', 'independent retained-runtime proof changed'
          with urllib.request.urlopen('https://avtocena.com/api/health',timeout=30) as response:
              health=json.load(response)
          assert health.get('releaseSha')=='a182cd21b21ecf612b63613d263e5bdd817ea4c0', 'retained accepted release changed'
          assert health.get('calculationVersion')=='c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6', 'retained calculator changed'
          print(json.dumps({'source':sha,'candidate':1755,'exactGreenChecks':len(actual),'mergedReviews':[1738,1740,1744,1746,1749,1752,1754],'productionBase':health.get('releaseSha')}))
          SOURCE_GUARD
      - name: Verify isolated application source and exact allowed changes
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          git fetch --depth=1 origin a182cd21b21ecf612b63613d263e5bdd817ea4c0
          git fetch --depth=1 origin f738f86d64e6ded24a34f5fd9bdf3940cd53e4bc
          git fetch --depth=1 origin 8778bd38be3f26227c383db5800239beb98f6182
          git fetch --depth=1 origin 933a3ca4c70f934f579bf2ad1d18597507e23314
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('docs/operations/2026-11-11-navigation-release-manifest.json','utf8'));
          assert.equal(m.base,'a182cd21b21ecf612b63613d263e5bdd817ea4c0');
          const changed=execFileSync('git',['diff','--name-only',m.base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(path=>m.allowedPaths.includes(path)),'unexpected source change');
          assert.deepEqual(changed.filter(path=>path.startsWith('apps/')).sort(),m.appPaths.slice().sort());
          assert.equal(m.sourceReviews.encyclopediaRead,'f738f86d64e6ded24a34f5fd9bdf3940cd53e4bc');
          assert.equal(m.sourceReviews.overlayHistory,'8778bd38be3f26227c383db5800239beb98f6182');
          assert.equal(m.sourceReviews.loginReads,'933a3ca4c70f934f579bf2ad1d18597507e23314');
          for(const key of ['encyclopediaRead','overlayHistory','loginReads'])for(const path of m.sourceReviewScope[key]){
            assert.equal(fs.readFileSync(path,'utf8'),execFileSync('git',['show',m.sourceReviews[key]+':'+path],{encoding:'utf8'}),'reviewed content differs: '+path);
          }
          console.log(JSON.stringify({base:m.base,source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),applicationFiles:m.appPaths,changed:changed.length}));
          VERIFY
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm ci
      - name: Wait for the exact ASTRA plan to be fully applied
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx scripts/encyclopedia/wait-astra-apply.mjs
  prepare:
    needs: wait-for-astra
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: regcloud-staging
    steps:
