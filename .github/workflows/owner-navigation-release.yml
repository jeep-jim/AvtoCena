name: Release isolated stable speed and retained selection

on:
  push:
    branches: [main]
    paths: ['.github/market-runs/owner-navigation-release.json']

permissions:
  contents: read
  actions: read

env:
  RELEASE_SOURCE_SHA: '25d072b385e00e1bf093cd29c2d9539e81ffeb9d'

concurrency:
  group: regcloud-production-release
  cancel-in-progress: false

jobs:
  wait-for-astra:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '25d072b385e00e1bf093cd29c2d9539e81ffeb9d'
      - name: Require rejected predecessor, retained base and exact green source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1743" > "$RUNNER_TEMP/candidate-pr.json"
          python3 -c 'import json,sys;p=json.load(open(sys.argv[1]));assert p["state"]=="open" and p["head"]["sha"]=="25d072b385e00e1bf093cd29c2d9539e81ffeb9d","candidate closed or superseded"' "$RUNNER_TEMP/candidate-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43079097899" > "$RUNNER_TEMP/predecessor-release.json"
          curl --fail --silent --show-error --max-time 30 https://avtocena.com/api/health > "$RUNNER_TEMP/predecessor-health.json"
          python3 - "$RUNNER_TEMP/predecessor-release.json" "$RUNNER_TEMP/predecessor-health.json" <<'PREDECESSOR'
          import json,sys
          run=json.load(open(sys.argv[1]));health=json.load(open(sys.argv[2]))
          assert run['id']==43079097899 and run['head_sha']=='edcec4b74d8a8ebd45a24a01a723a39f64c19f2b', 'unexpected rejected predecessor'
          assert run['status']=='completed' and run['conclusion']=='failure', 'rejected predecessor evidence changed'
          assert health.get('releaseSha')=='a182cd21b21ecf612b63613d263e5bdd817ea4c0', 'retained accepted base changed'
          assert health.get('calculationVersion')=='c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6', 'retained calculator changed'
          print('Rejected predecessor and retained accepted base verified; new candidate addresses measured home phases')
          PREDECESSOR
          python3 - <<'EXACT_CI'
          import json,subprocess,time
          required=[(43083658773,'7e53af56b59071e8d793ec15a1617ef579d7838c'),(43084069287,'25d072b385e00e1bf093cd29c2d9539e81ffeb9d')]
          deadline=time.monotonic()+25*60
          while True:
              pending=[]
              for run_id,sha in required:
                  run=json.loads(subprocess.check_output(['gh','api',f'repos/jeep-jim/AvtoCena/actions/runs/{run_id}']))
                  assert run['id']==run_id and run['head_sha']==sha and run['name']=='CI', 'exact CI identity mismatch'
                  if run['status']=='completed':
                      assert run['conclusion']=='success', f'exact CI failed: {run_id}'
                  else: pending.append(run_id)
              if not pending: break
              assert time.monotonic()<deadline, 'exact CI deadline'
              print('Waiting for exact source CI',pending,flush=True)
              time.sleep(30)
          print('Both exact source CI runs passed')
          EXACT_CI
      - name: Verify isolated application source and exact allowed changes
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          git fetch --depth=1 origin a182cd21b21ecf612b63613d263e5bdd817ea4c0
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('docs/operations/2026-11-11-navigation-release-manifest.json','utf8'));
          assert.equal(m.base,'a182cd21b21ecf612b63613d263e5bdd817ea4c0');
          const changed=execFileSync('git',['diff','--name-only',m.base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(path=>m.allowedPaths.includes(path)),'unexpected source change');
          assert.deepEqual(changed.filter(path=>path.startsWith('apps/')).sort(),m.appPaths.slice().sort());
          console.log(JSON.stringify({base:m.base,source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),applicationFiles:m.appPaths,changed:changed.length}));
          VERIFY
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm ci
      - name: Wait for the exact ASTRA plan to be fully applied
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx scripts/encyclopedia/wait-astra-apply.mjs
  prepare:
    needs: wait-for-astra
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '25d072b385e00e1bf093cd29c2d9539e81ffeb9d'
      - name: Verify isolated application source and exact allowed changes
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          git fetch --depth=1 origin a182cd21b21ecf612b63613d263e5bdd817ea4c0
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('docs/operations/2026-11-11-navigation-release-manifest.json','utf8'));
          assert.equal(m.base,'a182cd21b21ecf612b63613d263e5bdd817ea4c0');
          const changed=execFileSync('git',['diff','--name-only',m.base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(path=>m.allowedPaths.includes(path)),'unexpected source change');
          assert.deepEqual(changed.filter(path=>path.startsWith('apps/')).sort(),m.appPaths.slice().sort());
          console.log(JSON.stringify({base:m.base,source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),applicationFiles:m.appPaths,changed:changed.length}));
          VERIFY
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm ci
      - name: Verify exact encyclopedia matching
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --test tests/management-knowledge.test.ts tests/management-save-route.test.ts tests/management-preview-route.test.ts tests/autobot-format.test.ts tests/autobot-knowledge.test.ts tests/autobot-public-answer.test.ts tests/autobot.test.ts tests/encyclopedia-hybrid-default.test.ts tests/power30-precedent-calculation.test.ts tests/encyclopedia-power30-precedents.test.mjs tests/japan-preview-consistency.test.ts tests/encyclopedia-release-batch-verification.test.mjs tests/encyclopedia-spec-consensus.test.ts tests/encyclopedia-technical-match.test.ts tests/catalog-power-normalization.test.ts tests/encyclopedia-public-release.test.mjs tests/encyclopedia-presentation.test.ts tests/permanent-encyclopedia.test.ts tests/encyclopedia-astra-release.test.mjs tests/catalog-independent-certified-power.test.ts tests/encyclopedia-owner-evidence.test.ts tests/encyclopedia-calculation-index.test.ts tests/encyclopedia-astra-power30.test.ts tests/encyclopedia-ambiguous-body.test.ts tests/encyclopedia-reference-reuse.test.ts tests/encyclopedia-reference-publication.test.ts tests/encyclopedia-release-index.test.ts tests/encyclopedia-coverage.test.ts tests/catalog-budget-specifications.test.ts tests/catalog-budget-runtime.test.ts tests/green-corner-page-budget.test.ts tests/green-corner-filters.test.ts tests/catalog-japan-filter-rail.test.ts tests/japan-drive-sql-budget.test.ts tests/japan-drive.test.ts tests/japan-chassis-drive.test.ts tests/japan-default-fuel.test.ts tests/ajes-japan-feed.test.ts tests/ajes-transient-cooldown.test.ts tests/ajes-saved-budget-predicate.test.ts tests/currency-observer-scope.test.ts tests/dealer-platform-membership-read.test.ts
      - name: Verify atomic dated catalog pages before publication
        env:
          JSON_STORAGE_DRIVER: local
        run: |
          test -f tests/catalog-publication-page-window.test.ts
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/catalog-publication-page-window.test.ts
      - name: Verify prepared editorial overview and parallel homepage
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/catalog-home-editorial-overview.test.ts tests/catalog-editorial.test.ts tests/catalog-editorial-price.test.ts tests/catalog-home-compact-snapshot.test.ts tests/home-editorial-empty.test.ts tests/home-initial-catalog.test.ts tests/home-parallel-specials.test.ts tests/home-showcase-priced-first.test.ts tests/catalog-overview-read-model.test.ts
      - name: Verify stream disconnect and gateway buffer regressions
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node scripts/check-runtime-streams.mjs
          python3 tests/regcloud-response-buffers.test.py
          python3 tests/regcloud-performance-gate.test.py
          python3 tests/regcloud-browser-verdict.test.py
          python3 tests/regcloud-browser-handoff.test.py
          python3 tests/regcloud-release-retention.test.py
          node --test tests/accepted-browser-speed.test.mjs
          node --test tests/catalog-refresh-generation-pages.test.mjs
      - name: Verify retained choices and forward/Back navigation on this exact source
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/retention-browser/node_modules/playwright/index.mjs
          RETENTION_BASE_REF: 'a182cd21b21ecf612b63613d263e5bdd817ea4c0'
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --test tests/model-suggestion-search.test.ts tests/catalog-brand-navigation.test.ts tests/japan-filter-retention.test.ts tests/dealer-selection-share.test.ts tests/catalog-filter-scroll.test.ts tests/catalog-filter-single-autoapply.test.ts tests/catalog-filter-followup.test.ts tests/catalog-filter-brand-polish.test.ts tests/catalog-market-page-city.test.ts tests/catalog-market-window.test.ts tests/catalog-market-page-boundary.test.ts tests/card-city-delivery.test.ts
          npm run typecheck
          git fetch --depth=1 origin "$RETENTION_BASE_REF"
          npm install --prefix "$RUNNER_TEMP/retention-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          CURRENCY_OBSERVER_BASE_REF="$RETENTION_BASE_REF" CHROME_BIN=$(command -v google-chrome) node tests/browser/currency-observer-scope.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/catalog-retention.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/catalog-load-more.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/model-search-controls.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/catalog-navigation-recovery.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/dealer-selection.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/dealer-selection-nested-navigation.mjs
      - name: Verify owner catalog search and queue regressions
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test --test-concurrency=1 tests/catalog-navigation-facets.test.ts tests/catalog-market-page-city-cache.test.ts tests/catalog-path-params.test.ts tests/catalog-model-directory.test.ts tests/catalog-compact-sort.test.ts tests/catalog-detail-read-cache.test.ts tests/ajes-model-loader.test.ts tests/model-suggestion-search.test.ts tests/catalog-directory-memory.test.ts tests/catalog-filter-facets-wire.test.ts tests/catalog-shared-budget-prices.test.ts tests/catalog-price-persistence.test.ts tests/catalog-price-snapshot-compression.test.ts tests/performance-regression.test.ts tests/catalog-projection-reuse.test.ts tests/green-corner-snapshot-cache.test.ts tests/catalog-deferred-recommendations.test.ts tests/offer-navigation-performance.test.ts tests/related-offer-selection.test.ts tests/related-model-family.test.ts tests/catalog-card-contract.test.ts
      - name: Verify deferred recommendations before release preparation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/related-browser/node_modules/playwright/index.mjs
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/related-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          CHROME_BIN=$(command -v google-chrome) node tests/browser/deferred-recommendations.mjs
      - name: Verify production dependency security
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm audit --omit=dev --audit-level=high
      - name: Verify catalog storage and bounded projection integrity
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-projection-serial-read.test.ts tests/catalog-projection-parts.test.ts tests/catalog-storage-serialization.test.ts tests/encyclopedia-index-transport.test.ts tests/regcloud-storage-compatibility.test.ts tests/storage.test.ts tests/storage-read-fairness.test.ts
      - name: Prepare private encyclopedia index for this release
        env:
          # Offline preparation reads immutable history; visitor deadlines stay unchanged.
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS: '120000'
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx scripts/encyclopedia/assert-compact-directory.mjs --wait
          node --import tsx scripts/encyclopedia/prepare-calculation-index.mjs
          node --import tsx scripts/encyclopedia/assert-release-batches.mjs
          node --import tsx scripts/encyclopedia/assert-release-astra.mjs
          node --import tsx scripts/encyclopedia/audit-calculation-index.mjs
      - name: Preserve existing encyclopedia coverage and batch membership
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-coverage
          path: |
            reports/encyclopedia-coverage.json
            reports/astra-release-verification.json
          if-no-files-found: ignore
      - name: Build existing application without production credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "avtocena-regcloud:$GITHUB_SHA" .
          docker save "avtocena-regcloud:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/avtocena-image.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum avtocena-image.tar.gz > avtocena-image.tar.gz.sha256
      - name: Install container runtime and load image (no application start)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/staging/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'; test \$(df --output=avail -k / | tail -1) -gt 8388608"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/avtocena-image.tar.gz" "$RUNNER_TEMP/avtocena-image.tar.gz.sha256" "root@151.248.113.177:$remote_dir/"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "bash -s -- '$remote_dir' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          incoming=$1
          release=$2
          exec 9>/run/lock/avtocena-staging-prepare.lock
          flock -n 9
          cd "$incoming"
          sha256sum -c avtocena-image.tar.gz.sha256
          if ! command -v docker >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o DPkg::Lock::Timeout=120 update
            apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends docker.io
          fi
          systemctl enable --now docker
          gzip -dc avtocena-image.tar.gz | docker load
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "avtocena-regcloud:$release")" = "$release"
          docker version --format '{{.Server.Version}}'
          docker image inspect --format 'Image ready: {{.Id}}; size {{.Size}} bytes' "avtocena-regcloud:$release"
          # Remove only this run's transport archive after verified loading.
          rm -- avtocena-image.tar.gz avtocena-image.tar.gz.sha256
          echo 'Image loaded and verified'
          REMOTE
      - name: Verify isolated application source and exact allowed changes
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          git fetch --depth=1 origin a182cd21b21ecf612b63613d263e5bdd817ea4c0
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('docs/operations/2026-11-11-navigation-release-manifest.json','utf8'));
          assert.equal(m.base,'a182cd21b21ecf612b63613d263e5bdd817ea4c0');
          const changed=execFileSync('git',['diff','--name-only',m.base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(path=>m.allowedPaths.includes(path)),'unexpected source change');
          assert.deepEqual(changed.filter(path=>path.startsWith('apps/')).sort(),m.appPaths.slice().sort());
          console.log(JSON.stringify({base:m.base,source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),applicationFiles:m.appPaths,changed:changed.length}));
          VERIFY
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm ci
      - name: Read explicitly requested market scope
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --input-type=module <<'SCOPE'
          import {appendFileSync} from 'node:fs';
          import {markerMarkets} from './scripts/lib/release-market-scope.mjs';
          const markets=markerMarkets('.github/market-runs/regcloud-deploy.json');
          appendFileSync(process.env.GITHUB_ENV,`RELEASE_PREPARATION_MARKETS=${markets?.join(',')||''}\n`);
          console.log('Preparation scope:',markets||'all markets');
          SCOPE
      - name: Prepare exact price indexes before activating the release
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
          AVTOCENA_RELEASE_SHA: 25d072b385e00e1bf093cd29c2d9539e81ffeb9d
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          node --import tsx --input-type=module <<'WAIT'
          // Market-scoped derivatives do not change publication aliases or need its lease.
          if(process.env.RELEASE_PREPARATION_MARKETS){console.log('Scoped preparation uses generation fences');process.exit(0);}
          const data=await import('./apps/web/lib/data.ts');
          const getJsonStorage=data.getJsonStorage||data.default?.getJsonStorage;
          if(typeof getJsonStorage!=='function')throw Error('storage_module_unavailable');
          const storage=getJsonStorage(),deadline=Date.now()+40*60_000;
          for (;;) {
            const lock=await storage.readJson('catalog/import-lock.json',null);
            const until=lock?.lockedUntil?Date.parse(lock.lockedUntil):0;
            if (!Number.isFinite(until)) throw Error('publication_lock_invalid');
            if (until<=Date.now()) break;
            console.log('WAIT_FOR_PUBLICATION',JSON.stringify({operationType:lock.operationType,lockedUntil:lock.lockedUntil}));
            if (Date.now()>=deadline) throw Error('publication_wait_deadline');
            await new Promise(resolve=>setTimeout(resolve,30_000));
          }
          WAIT
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS=120000 npx tsx scripts/archive-runtime-reference-sources.mjs
          export AVTOCENA_CALCULATION_VERSION=$(node scripts/catalog-calculation-version.mjs)
          npx tsx scripts/regcloud-verify-conditional-read.ts
          # Offline authoritative parity reads full market projections; keep a bounded
          # two-minute storage deadline here, without changing visitor request budgets.
          YC_OBJECT_STORAGE_REQUEST_TIMEOUT_MS=120000 npx tsx scripts/regcloud-prepare-prices.mjs
          if test -z "$RELEASE_PREPARATION_MARKETS"; then
            npx tsx scripts/prepare-catalog-colors.mjs
          fi
          # Supplier switching belongs to collection operations, never to an app release.
          CATALOG_OVERVIEW_SKIP_READY=true npx tsx scripts/catalog-refresh-generation-pages.mjs
          # Common homepage routes need their complete current-day overview even
          # for a market-scoped release. Reuse only a validated ready generation.
          if test -n "$RELEASE_PREPARATION_MARKETS"; then
            env -u RELEASE_PREPARATION_MARKETS CATALOG_OVERVIEW_SKIP_READY=true npx tsx scripts/catalog-refresh-generation-pages.mjs
          fi
      - name: Preserve individual market preparation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-market-preparation
          path: release-market-preparation.json
          if-no-files-found: ignore
      - name: Prepare required browser acceptance runtime
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/release-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Deploy with rollback and resource measurements
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/release-browser/node_modules/playwright/index.mjs
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/releases/$GITHUB_SHA"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'"
