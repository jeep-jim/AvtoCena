          rejected_pr=api('pulls/1753')
          assert rejected_pr['state']=='closed' and not rejected_pr['merged'] and rejected_pr['head']['sha']=='75c2e6f57cfa4022865217e029a1f5d1671842c3', 'rejected source metadata changed'
          rejected_jobs=api('actions/runs/43111977320/jobs?per_page=100')['jobs']
          rejected_prepare=[job for job in rejected_jobs if job['name']=='prepare']
          assert len(rejected_prepare)==1 and rejected_prepare[0]['conclusion']=='failure', 'rejected preparation is not final'
          rejected_steps={step['name']:step['conclusion'] for step in rejected_prepare[0]['steps']}
          assert rejected_steps.get('Deploy with rollback and resource measurements')=='failure', 'expected measured acceptance rejection missing'
          for name in ['Prepare exact price indexes before activating the release','Persist verified private evidence for market_prices']:
              assert rejected_steps.get(name)=='success', 'last market preparation/evidence did not pass'
          rollback=api('actions/runs/43121673944')
          assert rollback['status']=='completed' and rollback['conclusion']=='success' and rollback['head_sha']=='a175759b53917ec59dd1b991d66e363fbb91f5a4', 'independent retained-runtime proof changed'
          with urllib.request.urlopen('https://avtocena.com/api/health',timeout=30) as response:
              health=json.load(response)
          assert health.get('releaseSha')=='a182cd21b21ecf612b63613d263e5bdd817ea4c0', 'retained accepted release changed'
          assert health.get('calculationVersion')=='c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6', 'retained calculator changed'
          print(json.dumps({'source':sha,'candidate':1755,'exactGreenChecks':len(actual),'mergedReviews':[1738,1740,1744,1746,1749,1752,1754],'productionBase':health.get('releaseSha')}))
          SOURCE_GUARD
      - name: Deploy with rollback and resource measurements
        id: deploy_acceptance
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/release-browser/node_modules/playwright/index.mjs
        run: |
          export GITHUB_SHA="$RELEASE_SOURCE_SHA"
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          remote_dir="/opt/avtocena/releases/$GITHUB_SHA"
          ssh "${ssh_opts[@]}" root@151.248.113.177 "install -d -m 700 '$remote_dir'"
          scp "${ssh_opts[@]}" scripts/regcloud-deploy-production.sh scripts/regcloud-performance-gate.py scripts/regcloud-resource-sampler.py scripts/regcloud-browser-verdict.py "root@151.248.113.177:$remote_dir/"
          scp "${ssh_opts[@]}" docs/operations/2026-11-11-accepted-speed-baseline.json "root@151.248.113.177:$remote_dir/accepted-speed-baseline.json"
          bash scripts/regcloud-deploy-with-browser.sh "$key_file" "$GITHUB_SHA" "$(node scripts/catalog-calculation-version.mjs)" "$RELEASE_PREPARATION_MARKETS"
