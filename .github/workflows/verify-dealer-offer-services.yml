name: Verify per-car services and edit links
on:
  pull_request:
    paths:
      - 'apps/web/components/dealers/**'
      - 'apps/web/lib/dealers/**'
      - 'tests/browser/dealer-offer-services.mjs'
      - 'tests/browser/dealer-market-orders.mjs'
      - 'tests/browser/dealer-workspace-fixture.tsx'
      - '.github/workflows/verify-dealer-offer-services.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/dealer-showcase.test.ts tests/dealer-editor-v2.test.ts tests/dealer-market-orders.test.ts
      - run: npm install --prefix "$RUNNER_TEMP/dealer-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - run: node scripts/prepare-web-assets.mjs
      - name: Check isolated services, saved selection and edit links at 390 and 1440 pixels
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/dealer-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/dealer-offer-services.mjs
      - name: Check new market offers and ordering
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/dealer-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/dealer-market-orders.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dealer-offer-services
          path: |
            artifacts/dealer-offer-services/*.png
            artifacts/dealer-market-orders/*.png
          retention-days: 7
