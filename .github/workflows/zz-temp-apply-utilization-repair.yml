name: TEMP apply utilization repair

on:
  push:
    branches:
      - fix/russia-utilization-2026-coefficients-20260825

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/russia-utilization-2026-coefficients-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      - name: Restore main engine and apply only coefficient delta
        run: python scripts/zz-repair-utilization-fix.py
      - name: Customs regression suite
        run: node --import tsx --test tests/russia-customs.test.ts
      - name: Commit repaired PR head
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply official 2026 utilization coefficients cleanly'
          git push origin HEAD:fix/russia-utilization-2026-coefficients-20260825
