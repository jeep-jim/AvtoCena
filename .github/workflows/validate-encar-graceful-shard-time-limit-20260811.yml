name: Validate Encar graceful shard time limit
on:
  push:
    branches: [fix/encar-graceful-shard-time-limit-20260811]
    paths:
      - .github/workflows/catalog-live-daily-working-markets.yml
      - .github/workflows/validate-encar-graceful-shard-time-limit-20260811.yml
permissions:
  contents: read
env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/encar-graceful-shard-time-limit-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and static workflow assertions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --check scripts/catalog-live-recovery-market.mjs
          grep -Fq "matrix.source == 'encar_direct' && '4200000' || '5100000'" .github/workflows/catalog-live-daily-working-markets.yml
          test "$(grep -c 'for market in korea china europe; do' .github/workflows/catalog-live-daily-working-markets.yml)" -eq 2
          ! grep -q 'for market in korea china europe georgia; do' .github/workflows/catalog-live-daily-working-markets.yml
      - name: Encar short NO-PUBLISH source smoke
        shell: bash
        env:
          RECOVERY_MARKET: korea
          RECOVERY_SOURCE_IDS: encar_direct
          RECOVERY_OUTPUT: encar-smoke.json
          RECOVERY_TARGET: "5"
          RECOVERY_MAX_PAGES: "3"
          RECOVERY_TIME_LIMIT_MS: "120000"
          RECOVERY_REQUEST_TIMEOUT_MS: "35000"
          RECOVERY_RETRY_ATTEMPTS: "2"
          RECOVERY_PREPARE_CONCURRENCY: "2"
          RECOVERY_PREFERRED_MAX_RUB: "8000000"
        run: |
          set -euo pipefail
          npx tsx scripts/catalog-live-recovery-market.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('encar-smoke.json','utf8'));
          if (!Array.isArray(r.offers) || r.offers.length < 1) throw new Error(`no Encar smoke offers: ${JSON.stringify({count:r.offers?.length,report:r.report})}`);
          const bad=r.offers.filter(o=>String(o.sourceId||'')!=='encar_direct');
          if (bad.length) throw new Error('non-Encar offer in smoke');
          console.log({offers:r.offers.length});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-graceful-time-limit-validation
          path: encar-smoke.json
          if-no-files-found: warn
          retention-days: 2
