name: Apply mobile budget overlay cleanup once

on:
  push:
    branches:
      - ui/mobile-budget-overlay-cleanup-20260814
    paths:
      - .github/workflows/apply-mobile-budget-overlay-cleanup-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-budget-overlay-cleanup-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply mobile budget overlay cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/home/HomePageClient.tsx')
          s = path.read_text()

          old_overlay = '<div className="ac-budget-picker-overlay absolute inset-0 z-[320] overflow-hidden rounded-[1.8rem] p-2.5 backdrop-blur-md lg:hidden">'
          new_overlay = '<div className="absolute inset-0 z-[320] overflow-hidden p-2.5 backdrop-blur-md lg:hidden" style={{ background: "color-mix(in srgb, var(--ac-surface) 90%, transparent)" }}>'
          if old_overlay not in s:
              raise SystemExit('mobile budget overlay anchor not found')
          s = s.replace(old_overlay, new_overlay, 1)

          old_label = '''<label className="ac-filter-option flex min-h-0 cursor-pointer items-center gap-2 rounded-xl px-3 py-1.5 text-left text-[11px] font-black leading-tight">
          <input type="checkbox" checked={tradeIn} onChange={(event) => { setTradeIn(event.target.checked); setOpen(false); }} className="sr-only" />'''
          new_label = '''<label onClick={(event) => { event.preventDefault(); setTradeIn((current) => !current); setOpen(false); }} className="ac-filter-option flex min-h-0 cursor-pointer items-center gap-2 rounded-xl px-3 py-1.5 text-left text-[11px] font-black leading-tight">
          <input type="checkbox" checked={tradeIn} readOnly className="sr-only" />'''
          if old_label not in s:
              raise SystemExit('trade-in checkbox anchor not found')
          s = s.replace(old_label, new_label, 1)

          path.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only cleanup
        shell: bash
        run: |
          rm .github/workflows/apply-mobile-budget-overlay-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/home/HomePageClient.tsx .github/workflows/apply-mobile-budget-overlay-cleanup-once.yml
          git commit -m "Clean up mobile budget overlay"
          git push origin HEAD:ui/mobile-budget-overlay-cleanup-20260814
