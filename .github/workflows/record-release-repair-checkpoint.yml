name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note='\n\n## 16.11.2026, 11:48 Красноярск — продолжение установки купленного Encar, выпуск 43805789766 активен\n\n- Владелец повторно потребовал завершить установку новой Кореи. Действующий порядок: опубликовать купленный Encar, проверить реальные карточки, затем выключить только старый ajes_korea_feed в админке, сохранив encar_feed включённым. Вопрос дальнейшей логики/скорости обсуждать после установки. Это продолжение уже разрешённой публикации, новое разрешение на ту же операцию не требуется.\n- Проверен конкретный отказ release43802836828/job133086827944: после серверных проверок браузер упал на главной из-за 6 !== 5, сообщение Japan must show five overview cards or 24 catalog cards; rollback сообщил old production retained. Три карточки новой Кореи и отключение AJ в этом запуске не достигнуты.\n- Read-only43805670362 подтвердил на сохранённом a182: Japan6/Green6 на главной и /cars, Japan22 в отдельном каталоге. Исходник9cb предусматривает6 обзорных карточек; полная страница поставщика24 дополнительно фильтруется, поэтому фактически принятых строк может быть меньше24. Проверка5/24 перенесена из другого контроллера26d и не соответствует выбранному приложению.\n- Текущий main78f60acee2e87c21103d08fa6e11499f57cfd632 уже исправляет обзор на6/6 и проверяет полную страницу20..24. Его release43805789766/job133096142205 ACTIVE, прошёл source guards/CRM/ASTRA и готовит private index. Не запускать пересекающийся выпуск и не менять приложение9cb в ходе этого запуска. Новый фид пока НЕ объявлять установленным.\n- Точный app source9cb571fcce503c9a3ca1a1496514899839b75395, calc67fe0492c93784b490491f90a9820101959c0a2f39f276a1c4f5798408ac431a; используется проверенный готовый образ44c596a793bb0c75f4c3e30f40a8fe6b6f6a3c9501ab0c3eb0ae38953e682885. Уже реализованная владельцем разрешённая отсрочка только скоростной приёмки сохраняет реальные замеры, функциональные проверки, SHA/nonce и откат.\n- Проверен завершающий verify-finish-paid-encar.yml: 3 разных публичных автомобиля, цены списка/детали, декодирование фото и идентичность Encar; затем CAS сохранение только ajes_korea_feed=false и повтор после5сек кеша (ожидание6сек). Если release успешен, а verify упал, повторять только завершающий verify; полный release ожидает прежний a182.\n- Отдельный аудит кода: автоматический купленный Encar ещё не подключён к обычному3-дневному корейскому сборщику; dedicated paid intake имеет только manual/push. Следующее обычное окно17.11 00:00UTC+7 не является подтверждённым обновлением нового фида. Ежедневное обновление и вывод страховых случаев не объявлять готовыми. Небезопасный старый draft расписания не включать без предрасчёта точной установленной версии до manifest.\n- После завершения наблюдать release + verify-and-retire + resume-existing-china, независимо проверить публичный SHA и фактическую Корею, записать итог. Сохранённый China intake восстанавливается существующим cleanup job, не запускать повторный сбор.\n'
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record active paid Encar installation and remaining refresh scope'
            git push origin HEAD:main
          fi
