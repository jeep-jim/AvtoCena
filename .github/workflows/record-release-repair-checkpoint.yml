name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — measured I/O worker improvement; exact-image continuation43769668589 active\n- Pool comparison first43766934518 stopped safely before clones because original candidate has a read-only metrics mount. Guard narrowed to exactly /opt/avtocena/metrics -> /run/avtocena-metrics:ro (9ee4069), no general mounts allowed. Corrected A/B43767183436/job132974832283 SUCCESS; owner-labelled disposable clones/env0600 removed; production a182 unchanged. Same gen_1794665184205_cfd76b47 in both variants, same d0 image and pricing context.\n- Four fixed dummy PBKDF2 jobs occupied native workers. Original pool4 trials1.024/.9842/1.002s, DNS487–508ms. UV_THREADPOOL_SIZE16,VIPS_CONCURRENCY1 trials.5959/1.0851/.4253s, DNS23–58ms. Median1.002 -> .5959s (~40.5% less). This is controlled synthetic pressure, not proof that every live stall has this cause and NOT production acceptance. Homepage snapshot phase~626–653ms original vs96–108ms reserved I/O. Both full200/endHTML/no stream errors.\n- New controller commitb7532f99cb28ef655a1de44cb9ed5d0843731b16, blob682de56df2d8e3cf046e2389b2abeb4a63b1a454 launched https://github.com/jeep-jim/AvtoCena/actions/runs/43769668589 job132982537180. SOURCE STILL d0dcda944ab9d3acc1cba60660842aa4de3223c7 / exact6f74 /33paths19app / existing10sourceCI green. Only startup UV16/VIPS1 added to donor deployer overrides; computed pricing fingerprint asserted6f74 before any deferral. Offline config generator proved exactly these2 env settings differ, all source prefixes/credentials/NODE_OPTIONS/pricing inputs preserved; YAML/bash/inlinePython/Node syntax PASS.\n- Controller now runs all frozen/offline tests BEFORE temporary China deferral, then captures paid generation. Defer step checks run43753103164 exactheadf1a9 and preserved artifact14178273080/hash62f2..., records current publisher job output, normal cancel then force only if nonresponsive always() job. REQUIRED automatic cleanup job resume-existing-china waits for BOTH release and verify-and-retire terminal and reruns ONLY that cancelled publisher from the saved intake. Do NOT manually resume China while this workflow active; avoid duplicate rerun. If cleanup fails, inspect and restore manually after release terminal.\n- Exact image reuse fast path verifies old run43754659891/headb913 preparation steps all succeeded, current checkout6f74, fixed full image IDsha256:5d4d507918cc3be333f8c33ce73a4f0325213e43d15d459c3696c687e93cd422, revisiond0, fresh local private-index digest vs image header and current VW generation-brand SHA256 byte identity. Read-only/no-network helper container checks files, no app start. ONLY if all match set EXACT_IMAGE_READY1; otherwise original Docker build/transfer executes normally. Source application restore/diff remains unconditional, full private-index/price/home prep and full frozen server/browser/SHA/nonce/rollback remain mandatory.\n- Native prior report at22:10 showed generationold, old cancelled China lock expired21:43. China attempt2 publisher132962827733 was still pre-publish work; new release will temporarily defer it if still active and automatically restore afterwards. No schedules/source flags changed. Latest observed phase of43769668589: Verify frozen release mechanics and catalog changes, no errors yet. Installed new Korea NOT confirmed. AJ retirement and3public cards still pending.\n- Local candidate HEAD remains3109 with d0-equivalent app edits/untracked added files; do not reset. Main checkout has unsafe5-file daily draft (dailySafeToApply=false) plus diagnostic tooling. DO NOT enable daily Korea until exact installed staged-generation prices/selectors are prepared BEFORE manifest cutover. Insurance display still unmapped. Do not claim universal timeout prevention.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
