name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — Korea d0dcda9: проверки пройдены, передача контейнера ещё идёт\n- Локальный полный прогон после исправления обвязок: 2883/2883 PASS, web+engine typecheck PASS,25 script tests PASS. Все10 GitHub checks точного d0dcda944ab9d3acc1cba60660842aa4de3223c7 успешны (CI43754641980). Source33 paths/19app, baseline/guards неизменны.\n- Текущий release43754659891/job132935999910 успешно прошёл source guard, allowlist, private encyclopedia preparation, evidence, generation-pinned brand index и сборку контейнера. На20:30UTC загрузка образа ещё выполнялась; этап подготовки цен и live acceptance не начат. НЕ считать новую Корею установленной.\n- Read-only host inspection43757779500:20:23:34 transfer66,846,720bytes;20:25:06 94,525,440bytes;20:30:07 123,770,880bytes. Активен sftp-server, кандидат ещё не loaded. Свободно12,255,494,144bytes (>8GiB guard), MemAvailable12,602,507,264bytes. Production a182 running, OOM=false. Передача медленная, но доказано продвижение; не отменять/не перезапускать без новой причины.\n- Дополнительный public Korea API probe вернул200/24карточки, total=null. Это текущая старая сборка и не доказательство платного Encar. Следующие шаги: закончить transfer/checksum/load, подготовить exact price/home derivatives, затем серверные warm/35/305с + browser SHA/nonce и3 real paid cards; только после этого AJ Korea retirement. Страховка/ежедневное обновление самого paid feed не подтверждены.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
