name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note='\n\n## 16.11.2026, 12:28 Красноярск — повторный отказ доступности; изолированный профиль и минимальный кандидат\n\n- Выпуск43805789766/job133096142205 FAIL:54 preflight пробы и warm/after35 serving завершились; после паузы305с локальный /api/health в05:08:16UTC не получил заголовки за90,09с. Это отказ доступности, не отложенная владельцем оценка скорости. В05:09:54 сработал rollback; независимо подтверждён публичный a182/c489. Browser/3карточки/retire AJ не достигнуты. resume-existing-china133104497000 SUCCESS; не запускать новый сбор Китая.\n- Read-only аудит43809513484/133107788225:572 detail_cache_queue_timeout, один object_storage_read_deadline для dealer showcase; NEXT_REDIRECT0, OOM0. Аудит43810120588/133109702393 уточнил: первые queue ошибки05:04:25; по минутам05:04=30,05:05=44,05:06=18,05:09=480. Из Nginx warning/error известны Crossfire и /api/catalog/models?scope=makes&limit=500, но access_log выключен, warning counts не равны полному трафику.\n- Профиль43809688798/133108322039 на отдельном owner-labelled clone точного9cb image44c596,6CPU/10GiB/UV16/VIPS1: Crossfire17,3165с полный HTML без streamError; список марок16,9127с,217items; health максимум среди выведенных измерений1,6886с; память пик1,93GB.100сек CPU profile84,46%idle. Этот опыт НЕ воспроизвёл90сек зависание и НЕ является приёмкой установки. Production ID/image/PID/restarts и Nginx hash не изменены; clone/privateenv удалены.\n- Проверяемый риск в9cb: readBudgetCountIndex/aggregate/readBudgetSelection catch ошибок очереди в null может запустить более тяжёлый legacy/full-projection fallback. Локальная узкая правка с регрессионными тестами готовится отдельно, без публикации в приложение и без изменения лимитов/таймаутов. Не объявлять её доказанной причиной инцидента.\n- В main параллельно появился минимальный кандидат9faa6c030251e1c0ce491b01c4d2fcded9d6a736, прямой parenta182, ровно7файлов подключения paid Korea. Verify43810032114 ACTIVE (типизация passed, tests/build далее). Это тестовый workflow, ещё не deploy. Не запускать пересекающийся9cb release или менять точный кандидат во время проверки.\n- Важная подготовка следующего образа: calculationCacheVersion меняется от lib/scripts; нужны exact-source цены и подготовленные селекторы для затронутых рынков. Для9cb прежний437998 запуск действительно прогрел общие цены всех5локальных рынков, но runtime China читал v3 после current v7 ready; наличие общего warmup само по себе не доказывает все rich v7. Проверить фактическую полноту нового ready перед переключением. Не переименовывать образ44c596/артефакт437998 под новый SHA.\n- Ограничение минимального7file варианта: recommendations/data.ts и related-offer-selection всё ещё рассчитаны на AJ Korea; после выключения старого источника связанные предложения Кореи могут быть пустыми/частичными. Основные список/карточка/цены/фото должны быть проверены3карточками. Ежедневное обновление paid feed, insurance и полную миграцию рекомендаций не объявлять завершёнными.\n- Диск перед отдельной retention-операцией:92%, свободно8,45GB. Docker images90,9GB с заявленным reclaimable61,65GB; containers14,58GB/reclaimable8,734GB (слои могут разделяться). Внешнее продолжение уже выполнило retained cleanup43810214104 SUCCESS; сначала прочитать фактический результат, не повторять broad prune и не расширять сервер автоматически.\n- Авторизация владельца прежняя: завершить установку paid Encar, затем после фактической проверки выключить только ajes_korea_feed, оставить encar_feed. Не объявлять успех по CI или старту запуска.\n'
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record availability rollback, profile evidence and minimal Korea candidate'
            git push origin HEAD:main
          fi
