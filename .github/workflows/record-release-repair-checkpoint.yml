name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — установленная Корея сохранена; исправлен воспроизведённый preflight отказ страхового выпуска\n\n- Run 43830103519 / job 133173113381 остановился до build/deploy: readonly lease штатно истёк в 08:48:03 UTC, затем step17 завершился с installed_private_index_reuse_failed/code Error. Deploy step32 SKIPPED, новая версия e4 не запускалась. Независимая проверка после отказа: https://avtocena.com/api/health HTTP200, ok=true, release83ff17075e9188dcf227c8752dc064248d5f42e0, calculator4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90, 8.215s из scratch; это не общий вывод о скорости сайта.\n- Причина точно воспроизведена в отдельном worktree exact e4f2781ed52f12f53430118bea51ef150608ccfe: npm run typecheck успешно завершался, но менял tracked apps/web/tsconfig.tsbuildinfo. Последующий полный git diff --exit-code в helper правильно отклонял изменённое дерево до импорта/обращения к private storage. Это служебный побочный эффект typecheck, не ошибка страховых данных.\n- Always-job 133186742590 успешно запросил rerun только отменённого China publish job133140943205 с прежним intake14178273080, recollection=false. Фактически run43753103164 перешёл к attempt10, publish job133186832419, прежний sourcef1a926e4de5df6502f764150115b8bf9e2a43dd3; plan/collect остаются успешными. На 08:57 UTC он выполнял Publish markets through calculation and retention guards.\n- Опубликован однопутевой controller fix bd4e3b5e584bfe81007fc5c08cf86ba1dc25eb29, workflow blobc71ffaea8a579e93e38159575369bbe5e86ed8ad, SHA256 YAML602a71d31bd79872e502104fd556adf4c5373156150ee6ec44e60119c04d78ee. Web tsc теперь пишет cache в RUNNER_TEMP; engine tsc не менялся. Полный source guard добавлен также после offline tests до China defer, исходный step17 guard сохранён. Диагностика выводит только фиксированную operation, exitStatus и ограниченные имена changed paths, без полного diff/private exception body. Обе копии exact China helper перепривязаны к подтверждённым attempt10/job133186832419, с прежними run/source/intake/digest и always resume.\n- 2 actual Git/tsc regression, 14 reuse/context/diagnostic, 11 publisher, 6 controller с 11 реальными handoff variants и 7 actual-workflow frozen-speed tests PASS. Исправленная реальная последовательность tsc/offline tests сохраняет tracked cache побайтно и все защищённые paths чистыми. Намеренные изменения app или tracked cache по-прежнему отклоняются обоими guards. Независимый read-only review без блокирующих замечаний. Source e4, tree9fd66, PR1775, calculator4654, private storage fences/create-only binding и строгие speed/source/nonce/rollback gates не менялись.\n- Новый run43835614489 / job133191376943 ACTIVE с 08:58 UTC. Insurance UI по-прежнему нельзя называть установленным до фактической live acceptance. Требуется дождаться результата, проверить реальные claims/zero/missing карточки, источник/CRM/каталог/цены и фактический final China resume. Дополнительная очистка и новый сбор поставщика не запускались. Ранее опубликованный штатный paid refresh ae8cefc остаётся без изменений.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record reproduced history preflight fix and retry'
            git push origin HEAD:main
          fi
