name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — уточнение кандидата Кореи и полного прогона\n- Первый полный локальный прогон нового homepage-кода обнаружил два ReferenceError в старых тестовых обвязках home-editorial-empty (не передан новый readEditorialHome). Обвязки подключены; 26 совместных проверок редакционной выдачи и существующего fallback прошли. Полный прогон запущен заново, успех пока не заявлен.\n- Текущий source PR1773: d0dcda944ab9d3acc1cba60660842aa4de3223c7,33 точных пути/19 app. Предыдущий run43754537705 остановлен проверкой изменившегося кандидата до установки. Текущий controller b913075fcd4dc7f793383ad883af4bb4684cea03, run43754659891 ждёт все CI точного SHA. Public health всё ещё a182/c489. Установка новой Кореи не подтверждена.\n- Проверена существующая ежедневная подготовка: main regcloud-overview.yml вызывает catalog-editorial-runtime.mjs, который восстанавливает точный закрытый индекс установленного release, сверяет SHA/calculator/manifest и разрешает запись только его editorial-home производного. Новая функция кандидата совместима с этим механизмом; расписание не менялось. Страховая история, ежедневный paid feed refresh и реальная браузерная приёмка пока не подтверждены.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
