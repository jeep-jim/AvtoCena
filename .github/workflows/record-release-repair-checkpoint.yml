name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 00:34 UTC — 9cb rejected, independently verified rollback; explicit decision needed\nRun43776032107/job133002431648 FAILED. Source9cb571fcce503c9a3ca1a1496514899839b75395/calc67fe0492c93784b490491f90a9820101959c0a2f39f276a1c4f5798408ac431a; 2884 tests and all10 exact-source CI passed. Private index, generation brand layer, fresh build and exact prices/home preparation succeeded. Exact image sha256:44c596a793bb0c75f4c3e30f40a8fe6b6f6a3c9501ab0c3eb0ae38953e682885 size1492540956. Candidate warm homepage0.369624s/after35home0.415253s passed; Korea warm0.0410/after35 0.0432s passed. Earlier advisory preflight Europe after35 0.024321s and after305 0.022873s, but serving after35 Europe BMW page2 API0.118116847s > frozen0.115s: blocking rejection. Full sorted HTML after35 5.3965s, general2s advisory failed, original sorted-route baseline11.0129s passed; do not claim universal2s or stability. Serving after305 and nonce browser/three-card/AJ-retirement not reached. No thresholds, frozen baselines, routes or phases were changed. No unchanged retry.\nIndependent read-only retention43781108426/job133018259771 SUCCESS at00:34:18UTC: production running a182/c489, public health matches, rejected9cb container stopped, no OOM. Diskfree7026180096 bytes (<8GiB transport reserve); no new full image transfer until adequate reserve or exact existing-image conditional reuse; protect accepted images/pins/data. Cleanup133017279875 succeeded: reran ONLY canceled China publisher132999062553 from saved artifact14178273080, no recollection. Do NOT duplicate resume. No Encar daily cron or insurance display completion; daily5file draft remains unsafe/disabled.\nAGENTS.md explicitly prohibits increasing gate thresholds without NEW explicit owner approval and recorded measurements; performance-contract preserves frozen baselines/full routes/35+305/SHA+nonce/browser/rollback. Candidate is concrete and reviewable in PR1773. Proposed OWNER DECISION ONLY, NOT AUTHORIZED/IMPLEMENTED: one-time ceiling0.150s exclusively for Europe BMW page2 search API in this exact9cb continuation, all other frozen checks and browser/3card/rollback remain. Never interpret ordinary prior publication authorization as this exception. Await explicit answer before implementing any exception. If declined/no answer, preserve rollback and diagnose actual serving contention; local execution environment currently unavailable, GitHub tools remain available. Current production/new Korea NOT published.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
