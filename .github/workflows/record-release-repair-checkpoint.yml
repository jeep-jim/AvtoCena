name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — exact paid Korea continuation 43769668589 failed safely\nSource d0dcda944ab9d3acc1cba60660842aa4de3223c7, calculation 6f74ce86dc1521cde8bff465b2a30e76180bab21ec645fe056f2ac341ef9b43f, runtime UV_THREADPOOL_SIZE=16/VIPS_CONCURRENCY=1. Exact image reuse and private/index preparation passed. Full preflight passed; serving warm homepage 0.403922s and after35 homepage 0.432255s passed. Serving after35 Korea HTML 0.4636s passed. Publication was rejected at Europe BMW page2 API after35: 0.120035946s vs frozen ceiling 0.115s; no baseline bypass or change. Serving after305 and browser/three-card/AJ-retirement not reached. Automated rollback retained a182; independently verified public /api/health a182/c489 after failure. Cleanup job132999029151 succeeded and reran only saved China publisher132962827733, artifact14178273080; no recollection. Do not manually duplicate resume. Need profile exact Europe API read/pricing phase, fix proven dependency rather than blindly retry unchanged. Daily paid cron remains UNSAFE DRAFT/not enabled; no insurance display completion claimed.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
