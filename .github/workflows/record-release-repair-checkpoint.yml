name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 14.11.2026 — передача работы в новый чат: факты, история и план\n\nВладелец Антон просит продолжать без повторных разрешений на публикацию. Не считать PR, зелёный CI или запуск установки опубликованной рабочей версией. Нужны точный публичный SHA, серверная и браузерная приёмки. Платные фиды НИКОГДА не отменять без прямого указания владельца.\n\nТЕКУЩИЙ ВЫПУСК: https://github.com/jeep-jim/AvtoCena/actions/runs/43543168871 / PR1770 / source26d640eacbaf9139bb9c53df1dfcccb90c70ffbb / marker762dea226ae93fc8b709a525c503654af8125d4b. На момент этой записи wait-for-astra SUCCESS, prepare IN_PROGRESS, этап Prepare private encyclopedia index for this release. Не запускать пересекающийся выпуск. Девять exact-source workflows SUCCESS; offlineguard43543077792 SUCCESS. Controller закреплён на точном исходнике, исходные speed/completeness/SHA/nonce/rollback проверки сохранены. Перед запуском public health показывал a182cd21b21ecf612b63613d263e5bdd817ea4c0, calculationVersion c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6. Public Korea HTML содержал24offer links. Это моментные проверки старой версии, НЕ приёмка кандидата.\n\nЧТО ПОДГОТОВЛЕНО В PR1770: отсечение Nissan UD SERIES/CONDOR, Mitsubishi Fuso Fighter и теперь Nissan Civilian с вариантами SV/Low/Wheelchair; Japan5+green5 на главной и общем каталоге, Japan24 на отдельной странице; компактный эквивалент транспортного SQL для устранения чрезмерного размера запросов с сохранением исходной SQL-диагностики, cache identity, visitor IP и отказов поставщика; обе правки АвтоБота desktop84x88, подпись под роботом, header64px. Изменены6app-файлов, manifest48paths. Локальные проверки Civilian-вариантов PASS, NOTE/SERENA/X-TRAIL остаются допустимыми. НЕ заявлять, что отсечены все возможные автобусы лишь по этим примерам.\n\nИСТОРИЯ ОТКАЗОВ: PR1768 принят в main e5124150, это не установка. 43388147651 — устаревшие URL браузерного теста, исправлено. 43390493860/source1b2c — empty Korea; в его окне подтверждён Korea makes HTTP414. Позднейшие supplier bot/visitor_restricted не доказывают исходную причину. 43401230797/sourcea661 — CI stale SQL expectation, deploy SKIPPED, установки не было. 43408245426/source52f737 attempt1 и attempt2 — performance_empty_catalog:/cars?market=korea на Deploy with rollback and resource measurements, old production retained. Attempt2 закончился13.11 в13:53UTC, итог уже сообщён. Не повторять эти уведомления. Новый43543168871 — отдельный запуск, итог ещё не сообщён.\n\nАВТОБОТ: прежний draft1771 не опубликован; обе CSS-правки перенесены в1770. Отдельный UI-only PR1772/source258d911d2ef380eb1f2e4991492e7587abd3006f тоже НЕ установлен: общий CI упал на baseline harness ReferenceError projectionModelKeys is not defined в catalog-market-brand-projection.test.ts. Поэтому для текущей установки выбран прошедший проверки1770. Предварительный autobot-session проверяет84x88/подпись/header64px; он не заменяет проверку установленного сайта.\n\nБЛИЖАЙШИЕ ДЕЙСТВИЯ:\n1. Проверить terminal result43543168871 и логи. При failure назвать точный этап/причину, проверить сохранность старой версии; не перезапускать неизменённый выпуск автоматически.\n2. При успехе независимо проверить /api/health точный26d640...; реальные Japan5+green5 на / и /cars, Japan24 на отдельной странице; отсутствие UD SERIES/CONDOR/Fuso Fighter/Civilian в карточках и связанных предложениях.\n3. Отдельно браузером измерить кнопку и шапку АвтоБота на опубликованном сайте, desktop, светлая/тёмная тема; сохранить доказательства. Старый live gate проверяет truck aliases и количество, НО не Civilian и не AutoBot; не выдавать его SUCCESS за эти дополнительные проверки.\n4. Один итог владельцу, затем выключить монитор Automation_a2b9a7715fe481918c3d88b60a1de36d. Он сейчас включён на43543168871; пока выполняется — без уведомлений.\n5. После подтверждённого результата вернуться к Япония<=160: задача НЕ завершена и не входит в текущий минимальный источник. По сообщению Михаила около85000 записей мощности заполнены,5000 пропусков — это слова поставщика, нужен собственный счёт. Не трактовать неизвестную мощность как <=160. Не подменять поиск по всему доступному рынку фильтрацией небольшой загруженной подборки.\n6. Спецпредложения на главной для всех городов владелец уже подтвердил работающими: не ставить снова в невыполненные.\n7. Продолжить безопасную архитектуру локальных разрешённых рынков и готовых расчётов: поколения данных, подготовка индексов/цен до переключения, обновления по расписанию, удаление только неиспользуемого старого поколения, защита действующих/резервных данных. Япония dump исключён по ограничениям поставщика; Корея AutoAPI ожидает покупки/доступа. Китай и ОАЭ платные AutoAPI сохраняются. Исследование самостоятельного ОАЭ/Dubicars — отдельно, без отмены фида.\n8. Ресурсы: повторно измерить диск/RAM/пики перед советом докупать. Не выдавать прежние моментные замеры за текущие. Вопрос1TB и тарифов требует фактических объёмов/запаса/параллельных поколений; окончательная реализация ускорения и свежих выгрузок ещё не подтверждена.\n9. Остальной накопленный backlog сверить с действующей версией: поиск/модели и %20, полнота фильтров, мощность/энциклопедия, сохранение города/фильтров/history, открытие страниц сверху, скорость карточек и блога. Не объявлять всё исправленным без доказательств.\n\nДокументы: docs/operations/current-incident.md и docs/operations/2026-11-14-installation-checkpoint.md. Roadmap большой (>7MB): только безопасное добавление, не перезаписывать усечённым содержимым API. Код и секреты из скриншотов в публичный roadmap не копировать. В новом чате сначала читать этот checkpoint и проверить текущий run, затем продолжать.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: append complete November14 handoff and remaining plan'
            git push origin HEAD:main
          fi
