name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 16.11.2026 — Корея: разбор отката и устранение непрерывной сортировки\n\n- Проверен последний release 43718450187: after_directory_ttl /api/health 0.724715867 с при неизменном пределе 0.4758; функциональный ответ успешен, затем rollback. Публичный health перед изменениями всё ещё a182cd21b21ecf612b63613d263e5bdd817ea4c0/c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6. Новая Корея НЕ установлена.\n- Read-only 43739924770: candidate3109 stopped, OOMKilled=false; в ограниченных логах 141 catalog_storage_read, без найденных timeout codes. Это не доказательство отсутствия всех ошибок. Изолированный профиль43740009346 без переключения: warm health 0.011/0.162с, холодная сортировка /cars?sort=totalRub 14.456с, после подготовки0.183с; профиль прогретого /cars преимущественно idle. Эти измерения не воспроизводят трафик serving и не являются приёмкой.\n- PR1773 source9f89a2f9ca601a4cb5595a832ab2b8a04fb09938: стабильная сортировка короткими порциями с уступкой event loop; прежняя синхронная экспортная функция сохранена, живые search/default/market-landing пути ожидают асинхронную. Локально13 адресных тестов PASS и web+engine TypeScript PASS. Паритет порядок/идентичность/равные ключи и возможность обработки другой I/O покрыты. Синтетические70000 строк: исходный блок314.9мс без timer ticks, новая версия368.5мс с38ticks/max gap28.9мс на этой машине; это измерение отзывчивости, не обещание ускорения полного ответа или доказанная единственная причина отката. Полный локальный набор и точные GitHub checks ещё выполняются.\n- Controller1ed96aa78d0c86b8a05d885ff9f492234e381140 запустил https://github.com/jeep-jim/AvtoCena/actions/runs/43740421224 . Ожидает все exact-source checks перед подготовкой. Только19путей/14app от a182; новый тест добавлен в точный allowlist. Пороги, baseline hashes, SHA/nonce/browser verdict и rollback сохранены. Не повторять прошлый отклонённый исходник и не запускать второй пересекающийся выпуск.\n- После terminal result нужны фактический публичный SHA, server/browser acceptance и три разных публичных Encar предложения с верными KRW/рублями/фото; затем отдельный verify-and-retire. До этого AJ Korea не отключать. Не сообщать успех по одному запуску/CI. Поля истории сохранены в сыром источнике, но их перенос существующим restore-скриптом и показ страховых случаев НЕ подтверждены. Ежедневное обновление и сохранение истории остаются обязательными незавершёнными проверками, повторный сбор сейчас не запускался.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Korea cooperative-sort repair and exact release status'
            git push origin HEAD:main
          fi
