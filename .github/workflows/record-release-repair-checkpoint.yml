name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — важное ограничение staged daily изменений: НЕ ПРИМЕНЯТЬ без pre-manifest runtime preparation\n- Последующая проверка AGENTS.md (checkpoint12Nov16:10UTC) подтвердила: новый цикл свежих выгрузок не активирован; до manifest cutover требуются цены/селекторы точной установленной версии и её энциклопедии. Простое добавление ежедневного cron и post-publication overview/prices НЕ выполняет этот контракт.\n- Поэтому предыдущий план «после успешного приложения применить5 daily файлов» ОТМЕНЁН как недостаточный. Они остаются локальной заготовкой в AvtoCena и functions store dailyChanges; dailySafeToApply=false. Не коммитить/не включать cron только на основании6+25 offline tests. Нужен отдельный проверяемый staged-generation prepublication prepare+receipt на exact installed runtime до CAS manifest, с соблюдением publisher lease/rollback/ресурсных лимитов. Страховая история тоже не реализована.\n- Текущая основная работа НЕ остановлена: release43754659891 точного d0dcda9 продолжает price/home preparation для уже опубликованного gen_1794665184205_cfd76b47. Read-only report43760750318 подтвердил calculation6f74ce86dc1521cde8bff465b2a30e76180bab21ec645fe056f2ac341ef9b43f, неизменный gen и неактивный publisher lock. На20:55UTC появились budget/sort cache записи Европы/ОАЭ/Грузии; editorial-home производного тогда ещё0. Полный успех этапа и активация пока не подтверждены. Не запускать пересекающийся release и не менять frozen thresholds.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
