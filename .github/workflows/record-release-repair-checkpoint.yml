name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — Korea live acceptance started; exact overlapping China publisher temporarily deferred\n- Release43754659891/job132935999910 of d0dcda944ab9d3acc1cba60660842aa4de3223c7 completed exact price/home preparation and is now Deploy with rollback and resource measurements. All earlier steps successful. Do not probe/warm public routes during frozen timing phases. Live install/speed/browser/card acceptance NOT yet confirmed.\n- Scheduled China run43753103164 started19:33:38UTC, collection completed successfully. Artifact catalog-intake-china id14178273080,283660298bytes,digest sha256:62f2ca35af55a75130d661d9a7cc267f282d6132af1c143aeb28b39b6ca974e6, retained until29Nov. Publisher job132942560842 held catalog_v3_publish_china lock from21:03 while Korea acceptance began; last inspected manifest still gen_1794665184205_cfd76b47.\n- One-time coordination workflow .github/workflows/coordinate-paid-korea-release.yml checks exact China head f1a926e4de5df6502f764150115b8bf9e2a43dd3, saved artifact checksum, completed collect job and active exact Korea acceptance before cancellation. Commit ecd6bef20248f38e19609d1b9de9110523c3c020/run43762243675 requested normal cancel but timed out waiting; reason is existing generic publisher job if:always(). GitHub official force-cancel API used after that failed request, guarded by prior exact cancellation receipt; controller commit97ea5b7843206cbaf086efd51270c82977be4bc5. Native job state confirmed China publish completed/cancelled. No source flags/schedules/customer data changed.\n- REQUIRED FOLLOW-UP: after Korea acceptance terminal (success or failure), resume only the existing cancelled China publish job132942560842 via rerun_workflow_job, using its preserved intake, no recollection. This restores the already-running ordinary schedule, not activation of a new paid daily refresh cycle. Observe publication/derived preparations and final active generation. Do not leave China silently suspended. If generation already changed despite cancel, adapt exact Korea preparation rather than fake an old generation.\n- Pending daily paid Korea5-file local draft remains NOT SAFE TO ENABLE (dailySafeToApply=false); needs exact installed staged-generation prices/selectors BEFORE manifest commit. Do not conflate existing China scheduled run restoration with enabling a new paid Korea cycle. Insurance display not implemented.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
