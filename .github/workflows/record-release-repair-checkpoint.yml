name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 13.11.2026 — отказ выпуска 43390493860 и исправление длины запроса\n\nВыпуск 43390493860/source1b2c завершился FAILURE в серверном gate: performance_empty_catalog:/cars?market=korea. Browser gate не достигнут, old production retained. Независимый read-only43400213549 в09:18UTC подтвердил a182 running и1b2c stopped; новый исходник НЕ установлен.\nRead-only43400468374: сохранённый Korea makes HTTP414/query_too_large в09:02:26.590–26.806UTC совпадает с окном отказа. Более поздние list-1 Korea и stats вернули visitor_restricted/bot; они не доказывают причину первоначального пустого списка. Header proxy использует настоящий remote_addr, подмена IP не допускается.\nПо новому разрешению «устанавливай» исправлен PR1770/source a661ca18a16bb798d5e86193979f3a4e79451beb: только транспортная замена развёрнутого truck predicate на существующий эквивалентный compact predicate. Cache identity, admission,visitor IP,limits,source refusals сохранены. Тестовый Korea makes encoded query8385→1946bytes, list8346→1907bytes (fixture credentials/address).68профильных тестов и web TypeScript PASS. Manifest45paths/5app; all-source CI и offlineguard43401066859 ожидаются. Controller staged2ee0106; activation marker ещё не изменён. Не выдавать подготовленный код за установленный.\nСпецпредложения всех городов владелец подтвердил как работающие. Japan<=160 остаётся отдельной незавершённой задачей; AutoBot UI draft1771 подготовлен отдельно, здесь не устанавливается. Платные фиды не отменялись/не переключались. Порогов приёмки не меняли.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record rejected release and compact supplier query repair'
            git push origin HEAD:main
          fi
