name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 14.11.2026 — установка Civilian и АвтоБота запущена\n\nВладелец повторно прямо потребовал установку. Source26d640eacbaf9139bb9c53df1dfcccb90c70ffbb / PR1770: исключение Nissan Civilian и его вариантов, обе правки desktop AutoBot (84x88 с подписью снизу, header64px). Девять exact-source checks SUCCESS. Offlineguard43543077792 SUCCESS. Marker762dea226ae93fc8b709a525c503654af8125d4b запустил https://github.com/jeep-jim/AvtoCena/actions/runs/43543168871. Это ACTIVE, пока НЕ подтверждённая установка. Все исходные server/browser/speed/SHA/nonce/rollback gates сохранены. Предыдущий43408245426 attempt2 FAILED empty Korea, старая версия сохранена. Перед новым запуском public health a182cd21, Korea HTML24offer links; это не приёмка кандидата. PR1772 отдельный UI-only не установлен: CI выявил baseline test harness projectionModelKeys not defined. Устанавливается проверенный1770. Japan<=160 отдельно не завершён, спецпредложения всех городов работают по владельцу, платные фиды не отключались.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record actual Civilian and AutoBot installation launch'
            git push origin HEAD:main
          fi
