name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — новая платная Корея подтверждена на сайте; восстановление страховых отчётов продолжается\n\n- Приложение 83ff17075e9188dcf227c8752dc064248d5f42e0 / calculator 4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90 установлено и сохраняется на сайте. Выпуск 43812759975 действительно прошёл подготовку всех пяти рынков, build, серверную и браузерную функциональную приёмку. После этого отдельный public encyclopedia verifier получил HTTP500 на /api/encyclopedia/7efa3d4933728bc66771084b?year=2022. Именно поэтому общий запуск красный; приложение не откатилось. Повтор этого URL дал200. Read-only incident43821158977 нашёл9 упоминаний read_deadline в53 строках окна06:54:40–06:55:10, без queue_timeout/queue_full/TypeError/OOM; связь каждой ошибки с конкретным URL не доказана. Сам incident-job завершился failure из-за своего5сек health timeout, не из-за изменения сервера.\n- Полный release не повторяли. Точное final-only продолжение43821853604 / controller9ae8bf1e4b97451d18091880e0d39608f4d41e7e SUCCESS: тот же public verifier, без изменения проверок/повторов, подтвердил532 группы,4888 вариантов,22635 полей,3809 сгруппированных вариантов. Артефакт14205286976 SHA256 b119961d5043672c2de0597a29dd3871eda9abd7a6ca3f285b076ea9af8b2299. Затем прежний verify-and-retire проверил3 карточки до/после и финальный health83/4654 в07:17:39UTC.\n- CRM readback07:17:14UTC: korea=true,encar=true,ajesKorea=false,revision15. Revision15 уже была захвачена этим job; не приписывать ему изменение14→15. Артефакт карточек14205575248 SHA256 c0aed2ab4c52f5fcacd9b833e1e29227a3768c6b16da918e4eee89ddc95d4651: одинаковые до/после generation gen_1794665184205_cfd76b47,total69386,триID/цены/фото. Sonata020470161a6a0e925aa65b29=2966341RUB/24800000KRW;BMWX3 004f36a4010fafff30b87f22=5857406RUB/95000000KRW;KiaMorning009c1fcaf73d944a40ce94bc=1201076RUB/19480000KRW. Прямые фото ci.encar.com декодировались,ихEncarID независимо соответствуют sha256(encar_direct:ID)first24;видимые цены списка/карточки равны. Независимый health07:18:57UTC200/83/4654 за6.824сек из рабочей среды. Это моментная проверка, не обещание общей скорости.\n- Скорость не объявляется принятой: прежняя функциональная browserприёмка43812759975 сохранила разрешённые advisory—mobileChina firstcards21.296сек против2.167 и первыйbudget25.116сек против4.437. Requestcount/functionalchecks прошли. Серверные54функциональныепробы прошли;9медленныхзамеров сохранены. Исходные эталоны и измерения не подменялись.\n- Новое уточнение владельца: вернуть прежнюю кнопку «История и состояние» и страховые случаи новогофида. Причина в точном83 подтверждена: offerpage/API допускали только ajes_korea_feed/ajes-korea-ID; catalog-restore-encar-snapshot.mjs сохранял цену/характеристики/фото, но пропускал data.history/inspection/diagnosis. АвтоAPI подтвердил поля; официальный v3описатель https://auto-api.com/ru/encar совпадает с сохранёнными данными. Audit43821757012 SUCCESS прочитал9строк из уже сохранённых страниц1/1000/2000 снапшота43570782014/1:historyobjects9/9,inspectionobjects9/9;конкретные даты/числа/суммыKRW присутствуют. Это выборка, не утверждение100%покрытия. Null не равен0;осмотр не подменяет страховойслучай;суммаистории и выплатаодного случая не пересчитываются другвдруга.\n- Controllercommit49328a36d8943372a684b067346220fd0719a58b запустил43823438297: сохранённыеотчёты готовятся без новогообращения кпоставщику,перезапуска сайта,измененияmanifest/карточек/цен.9тестовPASS,синтаксис/YAMLпроверены,ниодин appdeployworkflow не срабатывает. Отчёты привязаны к точному source observation,ID иprovider;256bucket(4096толькоеслиразмертребует),макс4MiB/2048строк,раздельныеhistory/inspection,immutablecreate+readback,completeпоследним. Передготовностью проверяется покрытие всехтекущих69386машин. На07:24UTC job ещёработает,полноепокрытие/публикацияотчётов НЕподтверждены.\n- UI/APIдоработка готовится отдельно от установленного83/PR1774,на его базе,с прежним расположением кнопки и загрузкой только понажатию. Расчётныеlibs/scripts/packages/data/config в новом appcandidate не меняются;реальныйcalculatorclosure нужно проверить,а не подставлятьстаруюверсию. Новые отчёты на сайте пока НЕобъявлятьдоставленными. Следующийвыпуск должен пройти собственную функциональнуюбраузернуюпроверку истории/осмотра/SHA/rollback.\n- Обычное расписание нового paidEncar ещё не активировано: локально готовый reusableworker сохраняет cadence17UTC/каждые3дня и hooksобзор/цены;нужно включить подготовкуотчётов перед публикацией будущегоснапшота и проверить окончательныйпатч. ИсточникAJ ужевыключен,защитаотнеплатнойпубликации1bb70be действует. Старыйсохранённый China publisher43753103164 возобновлён и ещёработает;свежийChinaсбор не запускали. Оставшиесядействия:закончить insurancebackfill/UI/API,проверитьиустановить,настроитьобычноеpaidобновление,записатьокончательныйпроверенныйрезультат.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record installed paid Korea and insurance repair in progress'
            git push origin HEAD:main
          fi
