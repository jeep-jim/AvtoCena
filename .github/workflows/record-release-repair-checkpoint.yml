name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — 9cb source checks verified, live legacy restriction reproduced\nExact source9cb571fcce503c9a3ca1a1496514899839b75395: local full2884/2884 PASS, both typechecks PASS, nine focused tests PASS, regression test fails with pre-repair membership path and passes with repair. All10 exact-source GitHub runs completed success; continuation43776032107/sourceguard and35-path20-app fence passed. Offline frozen mechanics passed; preparing private encyclopedia index. No production acceptance yet. Current public legacy Korea powerTo160/pageSize3 probe returned503 in8.478s; follow-up6.005s body ok:false/error japan_search_unavailable/reason visitor_restricted. This proves restriction for the diagnostic visitor only, not every real visitor or all incidents; no visitor IP spoofing or supplier identity substitution used. Production remains retained a182 pending fresh image and full gates. Daily unsafe draft still disabled.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
