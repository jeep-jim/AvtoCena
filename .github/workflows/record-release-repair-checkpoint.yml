name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — make-only membership repair candidate, not published\nIsolated exact d0 Europe phase diagnostic43775238076 measured after35 API total0.08476/0.02808/0.07723s; catalog-read48.4/0.2/47.1ms vs pricing12.7/11.8/12.0ms. It did not reproduce0.120s block; these are isolated diagnostics, not acceptance. Measurement loop completed and finally verified a182 production unchanged; job failed after measurements due a diagnostic path-variable cleanup bug, corrected in f1feb592 (no acceptance claim). Source candidate9cb571fcce503c9a3ca1a1496514899839b75395, calculation67fe0492c93784b490491f90a9820101959c0a2f39f276a1c4f5798408ac431a, adds only guarded make-only immutable membership reuse to d0 (35 total allowed paths/20 application). Keeps selector identity/editorial/day fencing, eight-entry bound, existing pricing freshness and rich-filter fallback. Nine focused tests pass, both typechecks pass; new test verifies zero repeated metadata traversal after35 and invalidation for changed editorial/generation. Full local suite and exact10CI checks pending. Controller fb24d58 / run43776032107 active; old d0 image reuse explicitly removed because source changed; full fresh image/build/price/server/browser/3card/rollback gates remain required. Runtime UV16/VIPS1 retained. China cleanup remains mandatory. Daily paid cron stays unsafe draft and disabled; no insurance completion.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
