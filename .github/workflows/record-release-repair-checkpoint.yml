name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — paid Korea daily schedule prepared locally, NOT enabled during pinned release\n- Release43754659891: exact source d0dcda9 passed all CI and33-path/19-app fence;2883/2883 local PASS. Image transport completed, checksum/load/version passed; currently preparing exact price/home indexes. Server/browser/public paid acceptance still pending; production cutover not claimed.\n- Found current paid intake workflow Verify paid Encar inventory has push/manual only, no daily schedule. Generic Korea workflow is a72h planner and has no paid Encar intake route. Last generic schedule43641692603 (14Nov21:13UTC) successful status does not prove new paid daily update.\n- Prepared LOCAL ONLY five files in /workspace/scratch/1feaeb538e87/AvtoCena (do not publish until pinned release finishes/three paid cards and AJ retirement verified): .github/workflows/encar-paid-intake-check.yml (00:15 UTC+7 daily, fixed Node24.22.1, one concurrent job,300min bound, offline policy tests, current CRM source/market guard before API+every30s, storage reserve before intake, existing complete-snapshot publication chain); catalog-market-refresh.yml (skip legacy intake when paid Korea enabled; completed preparedEncar reuse still publishes); regcloud-overview.yml (watch actual paid publication too, so exact installed editorial derivative/regcloud-prices follow); tests/catalog-market-workflow-policy.test.ts and tests/catalog-refresh-generation-pages.test.mjs updated.\n- Focused checks6 policy+25 derivative tests PASS, YAML/bash/inline JS syntax PASS before final credential-scope refinement; rerun final syntax after refinements. Object credentials scoped to required steps; no new secret values. These are NOT remote yet. Do not claim daily enabled or insurance history implemented. After app acceptance, atomically commit these5 workflow/test changes on fresh main tree/lease, observe first full paid intake -> prepare -> publish -> exact installed derivative/prices, and verify public generation. Preserve paid flags/old source until existing three-card cutover guard permits retirement. No new background repair loop or audit schedule.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
