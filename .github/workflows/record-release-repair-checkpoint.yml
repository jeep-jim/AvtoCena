name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — адресная очистка завершена; страховая история устанавливается, обычный сбор Кореи переключён на paid feed\n\n- Run 43829945849 / job 133172595871 завершился SUCCESS. По заранее проверенной инвентаризации удалён только неиспользуемый image sha256:2fa2c913567930cfc0b0e716b27cde6e76a34ca530f42fa383c7ee4870beb1f8. Свободно 8 403 148 800 → 10 863 869 952 bytes; фактически освобождено 2 460 721 152 bytes. Все 25 контейнеров и остальные образы сохранены, включая fc248, production83, a182/e36, 17a, newest9cb и текущий b5. Порог загрузчика не менялся; дополнительная очистка не требуется.\n- По разрешению владельца активирован единственный новый insurance controller aa894da8a5ae1d0f81b0e5cf3e17b9a20521163e: run 43830103519, job 133173113381. Это ACTIVE, ещё не установленная версия. Кандидат e4f2781ed52f12f53430118bea51ef150608ccfe / PR1775 / tree9fd66; calculator4654 остаётся неизменным. Все семь exact-source CI SUCCESS. Ранние 14 фактических шагов — SUCCESS: источник, frozen mechanics, сохранённый private index proof, отчёты и их реальные sample buckets, дисковый preflight.\n- Точный существующий China publisher 43753103164 / attempt9 / job133140943205 приостановлен только после проверки сохранённого intake14178273080 и успешных collect/plan. Step15 defer SUCCESS. В 08:29 UTC controller ещё ожидает истечения publication lease только чтением; lease не удаляется и не меняется. После release отдельный always-job должен возобновить только этот отменённый publish job с тем же intake, без нового сбора. Фактическое восстановление ещё требуется подтвердить.\n- Старые одноразовые installers release-desktop-autobot, release-paid-encar и release-minimal-paid-encar явно выведены из работы; содержимое старого source83 speed-advisory сохранено для истории. Новый страховой выпуск использует строгие исходные frozen speed, функциональные, source/nonce и rollback gates. Он не переносит историческое исключение source83.\n- Опубликован ae8cefc4e6a8fb8430c34ff314d2e6040e9b368b: 11 файлов обычного paid Korea refresh. Сохранены Catalog refresh korea, cron 17:00 UTC, существующий трёхдневный календарь, concurrency и свежие owner CRM switches. Новый workflow_call worker собирает только purchased Encar; первый bounded job продолжает во втором с сохранённого cursor в том же run/producer attempt. Ранее фактический полный сбор занял 5h32m57s, поэтому одного бюджета5h было недостаточно. Два бюджета5h не являются гарантией времени поставщика; реальные отказы и Retry-After остаются блокирующими.\n- Страницы и cursor receipts создаются только ifNoneMatch; частичный raw/receipt разрыв не маскируется успехом и требует нового plan attempt. Restorer проверяет каждую страницу по identity/count/SHA256/receipt chain до нормализации. Подготовка history/inspection/diagnosis из того же snapshot завершается до intake report.json и публикации. Старый сохранённый snapshot43570782014/1 поддерживается по его первоначальному legacy формату; повреждённый новый envelope не получает legacy fallback.\n- 98 связанных offline tests PASS, JS/YAML/shell checks PASS, независимый read-only review не нашёл блокирующих замечаний. Все пять существовавших main blobs проверены до CAS, включая точный export-only delta report writer. После commit ae8cefc head-specific Actions API показывает0 запусков: никакого дополнительного сбора сейчас не запущено. Следующее штатное окно по сохранённому календарю —16.11 в17:00 UTC; затем19.11,17–18 пропускаются cadence guard.\n- Остаётся дождаться actual release terminal, проверить живую кнопку и реальные страховые отчёты, точный установленный SHA, неизменность CRM/каталога/цен и восстановление сохранённого China publisher. Не объявлять insurance UI установленным до этого подтверждения.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record insurance release and paid Korea refresh activation'
            git push origin HEAD:main
          fi
