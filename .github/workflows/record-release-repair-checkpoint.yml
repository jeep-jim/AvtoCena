name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — d0 release rolled back, diagnosis now targets concurrent native I/O pressure\n- Release43754659891/job132935999910 FAILED: serving after_directory_ttl homepage4.005021682009101s > frozen1.8835s. Korea in that phase0.2483s, functionality PASS. Serving warm home recheck median.3736 passed; after35 .4145 passed. Isolated preflight after305 home1.5991 passed. All price/home preparations did complete; derivative preparedtrue21:08:09UTC. Frozen thresholds unchanged. Public health after rollback independently a182/c489. Browser3-card acceptance and AJ retirement NOT reached. Exact d0 source remains PR1773 head,33 paths/19app,10CI green,2883 local tests PASS.\n- d0 exact calculation6f74ce86dc1521cde8bff465b2a30e76180bab21ec645fe056f2ac341ef9b43f; private indexbf2c72cb7a260ef093c0a43c2b0dad9c4c9094a4d6dc3811dd0d7f7626b0d72b. Loaded image sha256:5d4d507918cc3be333f8c33ce73a4f0325213e43d15d459c3696c687e93cd422,size1492544539. No new candidate source/code deployed after d0 failure.\n- REQUIRED China restoration executed: rerun only cancelled publisher job132942560842. Attempt2 publisher132962827733 currently Publish markets through calculation and retention guards. Plan/collect copied prior successful timestamps19:33/19:34 through20:13, no new provider collection. Intake artifact14178273080 remains. Monitor publication + derived follow-ups, do not leave suspended. Ordinary existing China cycle restoration is separate from forbidden unprepared new daily Korea cycle.\n- Isolated d0 home-only profile43763526510/job132963397097 SUCCESS: cold3.264,warm.340,after35.467,after305.866s; lastmem574.7MiB/10GiB,CPU sample2253/2411 idle. Production before/aftera182 unchanged. Gate-order profile43764560906/job132966631799 SUCCESS: last home.780s,mem1.389GiB,2282/2404idle; it did not reproduce serving4s. Note dockerstats after every request adds~2sec gaps, so this is not public concurrency. CPU helper update initially failed RemoteProtocolError; corrected commitd193d296a1d2a2f8851b99e33b29af31a13739e6 after profile head08fbee; that run had old helper/no home phases.\n- Live temporary Nginx observation43765954302/job132970961208 SUCCESS/restored: retained homepage13.106s,sort6.952s,ChinaAPI1.030s.70 /cars requests in bounded observation plus8photo requests; upstream times close request times. Retained production2.355GiB/10GiB. This establishes incumbent load/stalls, not proof of a specific candidate root cause. Do NOT claim image/native-pool cause confirmed yet.\n- NEW one-shot A/B workflow .github/workflows/encar-worker-pool-check.yml commit9b1c37fe776afbdee11c11b8473af5f800f53937. Scriptsregcloud-worker-pool-diagnostic.py (7b30a33),regcloud-pool-stress.mjs(f97e68f) run two disposable exact-image clones sequentially at original10GiB/6CPU. Variant reserved-io adds UV_THREADPOOL_SIZE16,VIPS_CONCURRENCY1; original unchanged pricing SHA/index/source environment. Four fixed dummy PBKDF2 jobs plus DNS numeric timing; after35s request home3times,6s gaps. No real keys returned. Private temp env0600 removed, owner-labelled clones removed in finally, Nginx config + production hash checked unchanged. Await result before any production env change; synthetic A/B is diagnostic, NOT full acceptance.\n- Candidate worktree /workspace/scratch/1feaeb538e87/encar-candidate still contains d0-equivalent app changes relative3109, source objects fetched; do not reset/drop. Main checkout AvtoCena contains5 uncommitted daily drafts plus diagnostic tooling changes. dailySafeToApply=false; DO NOT enable daily Korea until staged exact-runtime pre-manifest prices/selectors exist. Insurance display not implemented.\n"
          old=p.read_bytes()
          assert len(old)>7000000
