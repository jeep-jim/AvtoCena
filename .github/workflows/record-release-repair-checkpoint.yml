name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — строгий speed gate откатил e4; новый кандидат и изолированный фазовый замер\n\n- Corrected controller bd4e3b5e584bfe81007fc5c08cf86ba1dc25eb29, run43835614489/job133191376943: steps1–31 PASS, включая exact-source checks, immutable insurance samples, private content reuse, all selector/price partitions, build и повторный current-context readback. Step32 остановился на strict server acceptance: loopback homepage / после305s, 09:21:59.092448–09:22:02.196875 UTC, 3.1037504649721086s при ceiling1.8835s (reference1.7938+noise0.0897), accepted_speed_regression:/. В том же serving pass warm0.4991222788s<=0.5196 и after35s0.3697506362s<=1.8835 PASS. В 09:22:06.714733 подтверждено Release gate failed: old production retained. Insurance browser helper не запускался: gate упал до ready/verdict.\n- Это фактический rollback e4, в отличие от старого postdeploy encyclopedia отказа source83. После отката public health HTTP200/ok=true, release83ff17075e9188dcf227c8752dc064248d5f42e0/calculator4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90, 5.921s из scratch; это не общий замер сайта. В e4 homepage/layout/catalog/dealers source совпадал с83. Cgroup окно вокруг отказа:6.042436s, CPU12.920012s (~2.1382 cores), throttled delta0, memory+31,350,784bytes. Это не доказывает конкретную причину задержки и не позволяет отнести весь CPU только к homepage.\n- Verified release evidence artifact14211957369, SHA256 ZIP9ea1d4d47424dee32498a9da9d0c25f848b9eefa28982528cf93c4f6506a56d8. Catalog generationgen_1794665184205_cfd76b47 и69,386 paid Korea сохранены, CRMrev15 Encar=true/AJ Korea=false; before/after manifest, controls, private encyclopedia and price readiness readbacks совпали. Always-resume job133203055524 SUCCESS; rerun только прежнего canceled publisher133186832419 с intake14178273080, recollection=false. Actual run43753103164 attempt11, publisher133203143653; на09:53 UTC step16 publication in_progress, старые plan/collect success.\n- PR1775 обновлён до7f9165125edc773221da8e17a5ed39f3592db31c/tree d297f6ada157e493f92c3d29d8c77ca5124a92b0, parent e4. Дополнение только apps/web/app/(public)/page.tsx и tests/home-independent-reads.test.ts: Japan/dealer rail стартуют раньше, green→pricing и snapshot→counts→pricing независимы. Успешный render не добавляет повторных reads; при последующей фатальной ошибке другой ветки ранние операции уже могли начаться. Аргументы, данные, цены, city, fallback и исходная Japan ошибка сохраняются. Полный diff83→7f ровно20 reviewed paths; все6343 calculation-closure entries идентичны, actual calculator4654.\n- Локально14 targeted tests PASS, actual e4 negative control дал2 ожидаемых scheduling FAIL, TypeScript PASS с cache вне source, independent read-only review PASS. Все7 exact7f CI success:43841919133/43841919159/43841919194/43841919184/43841919285/43841919162/43841919243. Это ещё не фактическая production speed acceptance.\n- Единственный diagnostic workflow опубликован495f95c74c5b6391486f99ce547e7b555ab0fa30: .github/workflows/diagnose-paid-korea-home-phases.yml, SHA2565403a1a802e7ffce3f2ae65c573d33401ca9c75d67ad0616e9fc0cd74782b9b7, run43843643412/job133218257139 ACTIVE. Использует существующий e4 VM image93ed4336bd73431ab98e261c078dd3d62d5e5a802940eefa2e055eb7fad55aac на собственной маркированной loopback копии2CPU/8GiB, cold/warm/+35/+305s, full response deadline90s, total900s с75s cleanup. Runtime locks, source/image/mount/resource guards, readonly metrics mount, no public switch/reload; cleanup только своего verified fullID, production83/config/Nginx и original stopped e4 должны остаться прежними. Phase sanitizer точный e4; artifact только bounded sanitized trace. Изолированные timings не являются production acceptance, обычные внутренние cache writes приложения не исключаются. Локально9 safety tests и YAML/shell/Python/inline validation PASS.\n- Строгие frozen server/browser speed gates, source/nonce/context/rollback fences не ослаблялись. Страховая UI ещё НЕ установлена: сначала результат trace и оценка scheduling fix, затем новый exact-source release с настоящими claims/zero/missing browser/API checks и обязательным resume China. Старый e4 controller не перезапускать: PR head уже7f. Отдельный штатный paid refresh ae8cefc остаётся опубликован; требуется exact7f runtime compatibility после проверки. Новый сбор поставщика и дополнительная очистка не запускались.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record strict rollback and reviewed homepage candidate'
            git push origin HEAD:main
          fi
