name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — actual home-phase evidence, confirmed diagnostic cleanup, strict 7f insurance release started\n\n- Diagnostic run43843643412/job133218257139/source495f95c74c5b6391486f99ce547e7b555ab0fa30 завершил4 GET / сHTTP200, закрытым HTML и без stream error: cold12.137458s, warm0.464684s, after35s0.683617s, after305s2.636581s. Это отдельная2CPU/8GiB loopback копия e4, не production acceptance. Artifact14213274443 ZIP SHA2564d0cd85ddab5ed9671a6dfdcfac818c557307403a2e831bd418821fed4dad487; trace.jsonl SHA2567957d78c327f2807617f58247b93f14da372dcad5fa8734a44590eb65b8d85e3,153rows,32page+28snapshot phases, все сопоставлены одному запросу.\n- After305: snapshot1530.9ms (overview924.2ms, editorialUAE391.4ms), counts65.7ms, catalogPricing506.9ms. Dealer data готовы на+222.629ms, но dealerRail начинается лишь+2123.198ms и заканчивается+2511.198ms; EOF+2636.581ms. Это фактическое доказательство лишней последовательности, которую убирает7f. Условно неизменные durations дали бы сокращение конца цепочки примерно398ms, но это НЕ прогноз и НЕ PASS. На2CPU throttle delta1.041715s; вычитать его из wall time нельзя. Дополнительной доказанной appправки не выявлено; independent review раннего greenPricing не нашёл correctness blocker, прежние pricing/city/cache/context semantics сохранены.\n- Диагностический job FAILURE только из-за owned_clone_cleanup_failed; before/after production83/4654, production container/config, Nginx и original stopped e4 unchanged, privateenv removed. Root не выдал это за успешную полную диагностику. Exact cleanup-only controllerf87f42126dd3910850ebe73320f554d2bf448b51/run43845578866/job133224791507 SUCCESS: fullID5111a35a9dfbc417377cfcf5c98cd68d45fc604be802424f196c74bd5927260c уже отсутствовал, wasPresent=false, mutationAttempted=false, absenceVerified=true. Повторного удаления не было. Production83/4654 health200, originalc63cde7396b895212ed6fe4abbee686caceea9952705758366cae235786de393 и NginxSHAadc488cdf1087022310aff6251941d2fd9cf5ee79ccd992425ef3fea9ecbd8c8 unchanged. Artifact14214059984 digestb6c2e2d07d472023e9cff377649922a25e825130328752f76485782ea66e1d73. Локально reproduced lowercase Docker no-such-object parser defect, но trace не доказывает, что это была фактическая причина прежней generic cleanup ошибки.\n- Опубликован controller-main commitd298fe1e9994df084bf1090d3b8ac340c1613cfd/tree42bb8945a4f8d6fc88a7c1b5c43d0a19d4fb4162, ровно3пути: release-paid-korea-history.yml + scripts/catalog-editorial-runtime.mjs + его тест. App source7f9165125edc773221da8e17a5ed39f3592db31c/tree d297f6ada157e493f92c3d29d8c77ca5124a92b0/PR1775/20paths; app calculator4654 неизменён. YAML SHA25626274e42cb17a2fdfbfbcb0c76c919aec2fbee109728ac8662d175289ef59af9. От предыдущегоbd controller изменены только source/tree/exact path list и уже подтверждённые China attempt11/job133203143653 с embedded SHA; остальные release steps, строгие speed gates/nonce/context/rollback/typecheck guards побайтно прежние.6controller tests с11actual handoff variants и11publisher tests PASS; active YAML shell syntax и20-path fact проверены отдельно.\n- Runtime compatibility добавляет только exact7f в существующий pre-editorial-helper list; это не acceptance verdict. Остальные helper statements byte-identical,17offline testsPASS; adjacent unknown SHA и wrong checkout по-прежнему отклоняются, storage writes отсутствуют на отказе. Обновление main не добавлялось в appcandidate. regcloud-overview schedule/workflow_run/push-marker triggers не менялись.\n- Новый release run43845820167/job133225598747 ACTIVE с10:06UTC; exact source/retained83/all7checks gate ужеPASS, tooling restore underway. Пока НЕЛЬЗЯ заявлять insurance UI installed или strict speed accepted. Требуется завершить live claims/zero/missing UI/API и server/browser gates, private/CRM/catalog invariants, public encyclopedia verification и фактический final China resume. Внешняя параллельная VM cleanup commit5cff28c7b28fa73ad89f5f6be8a8347ea233f7eb/run43845182604 SUCCESS сохранена в main; root не инициировал и не менял её scope.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record actual phase proof and strict insurance release'
            git push origin HEAD:main
          fi
