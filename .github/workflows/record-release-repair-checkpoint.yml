name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — страховые отчёты новой Кореи подготовлены; версия интерфейса проверена, установка ещё не выполнена\n\n- Подготовка сохранённых отчётов завершилась успешно: run 43823438297, source 49328a36d8943372a684b067346220fd0719a58b, artifact 14206780690, ZIP SHA-256 b584e16a2c18a36701c4fccc17f4aa05efc4541ccf4d2ffd3283af02c709c79a. Прочитаны 10 270 страниц / 205 385 строк сохранённого snapshot 43570782014/1. Новых запросов поставщику, изменений каталога и цен — 0.\n- Проверено соответствие отчётов всем 69 386 опубликованным автомобилям по provider, публичному ID, номеру лота и времени исходного наблюдения. history present 67 866, history missing 1 520; inspection present 65 759; diagnosis present 50 573. Отсутствие данных не подменяется нулём. Сохранено 512 ограниченных buckets, максимальный размер 3 611 140 bytes.\n- Подготовлена отдельная версия восстановления «История и состояние»: PR 1775, source e4f2781ed52f12f53430118bea51ef150608ccfe, tree 9fd66cec3eee3fa887312dcc68704fe3cacc50b0, parent installed83. Все 7 фактически запускаемых проверок этого source завершились SUCCESS. Калькулятор остался 4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90; 6 343 записи calculation closure совпадают. История загружается только из сохранённых данных по раскрытию панели; источник AJ для платных рекомендаций Кореи заменён на опубликованный paid каталог.\n- Браузерная проверка страховой истории на 390 и 1440 px прошла: run 43825973998, artifact 14206561898, ZIP SHA-256 3b08a87a239667a779f84c234a75b5cc26025ddf4c182128d68e4803692d03a2. Это проверка кандидата, а не заявление об установленной версии.\n- Текущий production всё ещё 83ff17075e9188dcf227c8752dc064248d5f42e0; независимый HTTP200 health подтвердил этот source и calculator4654. Обнаружен блокер диска: около 8.41 GB свободно при существующем loader floor 8.59 GB. Порог не снижен. Старый guarded retention удалил только два допустимых старых failed-b5 контейнера, освободив 6 615 040 bytes.\n- Read-only inventory 43827907874 SUCCESS: все четыре stopped9cb контейнера используют один общий image44c596a793bb0c75f4c3e30f40a8fe6b6f6a3c9501ab0c3eb0ae38953e682885 с самым новым failed9cb. Независимых удаляемых9cb image groups нет, ничего не удалено. Далее проверяются только два осиротевших b5 образа от уже удалённых старых контейнеров; рабочие и резервные версии сохраняются.\n- Следующий шаг: завершить адресную проверку/освобождение диска, установить exact e4-кандидат с прежними строгими speed/rollback gates и реальной проверкой сохранённых страховых случаев на сайте. Будущий paid refresh ещё не опубликован: обнаружен неверный лимит 5h при фактическом исходном сборе 5h32m57s; готовится последовательное продолжение сбора по нескольким jobs без повторного запроса сохранённых страниц.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record verified insurance candidate and deployment prerequisites'
            git push origin HEAD:main
          fi
