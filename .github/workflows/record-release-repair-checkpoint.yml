name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 2026-11-16 — paid Encar release: homepage gate repaired, acceptance pending\n- Release d1e98873b4c7b6db1add61bc21a0eac3269121c8 run 43748027068 rolled back: serving warm home 0.5929708392359316s > frozen 0.5196s; median rechecks 1.0616s. Public production independently confirmed a182cd21b21ecf612b63613d263e5bdd817ea4c0. No browser/card acceptance or AJ Korea retirement completed.\n- Read-only isolated home diagnostic 43752887881 succeeded; production unchanged. Exact candidate home cold 10.267s, warm .523s, after35 .559s, after305 1.418s. Sequential dealer directory/profile GETs and repeated editorial full searches observed. Insurance display/daily refresh remain unverified.\n- Source PR1773 advanced to 3f45be166d9a5b2019c35793d12b68e6b4b86fce (32 exact paths,19 app paths): overlap independent dealer reads; optional exact-generation/day/revision/release/calculation/index editorial homepage derivative with authoritative search fallback; prepare shared homepage for all markets even targeted Korea release. Frozen speed baselines, rollback, source/price/permission rules unchanged. Local 31 focused TS tests,25 derivative script tests and typecheck passed; full suite and remote CI pending at checkpoint.\n- Controller 3f01efe77c6dc673a41c30d1b8c4801bea141ef4 pins this source and restores its derivative scripts after donor tooling. Next: await all source CI, immutable build/price preparation, server expired-cache and browser SHA/nonce checks, 3 real paid Korea cards before AJ Korea retirement. Do not report installed until public SHA and full acceptance verified.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
