name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 16.11.2026 — 43740421224 откатился на Europe API; новый адресный кандидат\n\n- Release43740421224/source9f89a2f9ca601a4cb5595a832ab2b8a04fb09938 FAILED в Deploy, old production retained. Свежий публичныйhealthпослеотказа:a182cd21b21ecf612b63613d263e5bdd817ea4c0/c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6. Блокирующий замер after_ttl /api/catalog/search?market=europe&make=BMW&page=2 =0.11516051786020398с при пределе0.115с, функциональный ответ успешен. Порог НЕ изменён. Под serving warm health0.00324595с, after_ttlhealth0.00410685с прошли; serving305с не достигнут. Нельзя объявлять исходную проблему health полностью исправленной. Корея на serving /cars?market=korea перед отказом0.1838с/functionalPassedtrue; это не завершённая публичная приёмка трёх карточек. Browser verdict и verify-and-retire не достигнуты, AJ Korea не отключён.\n- Все предыдущие подготовительные этапы SUCCESS: private index, Docker build/load, market_prices и общие кеши. Локально2853/2853PASS и all6GitHubchecks9fSUCCESS. Подготовка цен включала создание кешей Корея17:56UTC, Китай18:09UTC, ОАЭ/Европа/Грузия18:13–18:15UTC; это не поставщиковый пересбор. Быстрая публичная работоспособность новой версии НЕ подтверждена.\n- PR1773 новыйsource d1e98873b4c7b6db1add61bc21a0eac3269121c8: независимое чтение effective market settings начинается параллельно search I/O в публичном API. Авторитетный applyActiveBusinessPricingBatch остаётся, ошибки его текущего чтения не скрываются, пустой список не падает из-за ошибки необязательной подготовки. CountOnly/marketPage/invalid pagination не делают лишнюю подготовку.10адресныхтестовPASS, web+engineTS PASS; новые3регрессионныхтеста включены в общий набор. Предыдущая кооперативная сортировка сохранена.\n- Проверен git source closure: calculator обоих9f/d1 одинаковый2a889231e523893886b0da3bc4f6bf33c2d60f7376e2e99588c64dfb250c321c. Это совместимость подготовленного расчётного контекста, не разрешение пропускать runtime acceptance. Controller3de122ea26798ae6f9d374d3b03bc66fd277e099 запустил https://github.com/jeep-jim/AvtoCena/actions/runs/43748027068 . ACTIVE, ожидает exact checks; allowlist21path/14app. Никаких baseline exceptions, пересекающихся выпусков или повторного сбора фида. После terminal result обязательны точный publicSHA, server/browser/SHA/nonce, публичные3карточки/цены/фото и отдельный verify-and-retire. Не выдавать запуск за успех. Страховая история/ежедневная свежая выгрузка остаются отдельными неподтверждёнными требованиями.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Europe API rollback and exact concurrent-read candidate'
            git push origin HEAD:main
          fi
