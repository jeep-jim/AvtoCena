name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 13.11.2026 — CI и АвтоБот: выпуск43401230797 FAILED до установки на exact-source CI43400994011 (2852/2853, старое ожидание SQL). Deploy skipped, серверной/браузерной приёмки не было. Итог сообщён, монитор отключён. По разрешению «делай» PR1770/source52f7375262926f76d719f37945a9c0668d11fe06 исправляет транспортное ожидание, отдельно проверяет полный логический SQL диагностики; IP/пагинация/refusal/cooldown сохранены. Добавлены обе правки АвтоБота изdraft1771: кнопка84x88, подпись под персонажем; шапка64px. Браузерный тест проверяет геометрию. Manifest48paths/6app. Локально8профильных тестов и web TypeScript PASS; полный набор и GitHub checks идут. Chromium локально socket EPERM, визуального локального PASS нет. Controller3f9b5cf/offlineguard43407968357 проверяются, activation marker пока не изменён. Новый исходник НЕ установлен. Спецпредложения всех городов работают по подтверждению владельца; Japan<=160 отдельно не завершён. Фиды и пороги приёмки/rollback сохранены.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record CI repair and desktop AutoBot candidate'
            git push origin HEAD:main
          fi
