name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 16.11.2026 — текущий выпуск новой Кореи: сборка и подготовка выполнены частично, приёмка впереди\n\nPR1773 source9f89a2f9ca601a4cb5595a832ab2b8a04fb09938. Локально2853/2853 тестов PASS, web+engine TypeScript PASS. Все6 exact-source workflows SUCCESS, включая CI43740364551 с production build. Release43740421224/controller1ed96aa78d0c86b8a05d885ff9f492234e381140 ACTIVE. На момент записи: private_index SUCCESS, брендовый индекс SUCCESS, Docker build SUCCESS, образ загружен и проверен SUCCESS; Prepare exact price indexes before activating the release IN_PROGRESS. Новый источник НЕ установлен/НЕ принят: server/browser acceptance и публичные3карточки впереди. Не запускать пересекающийся выпуск, не повторять прошлый3109 без исправления, не ослаблять исходные baseline/SHA/nonce/rollback.\nRead-only43742259063 подтвердил107/107 пакетов,5306/5306моделей, calculationVersion кандидата2a889231e523893886b0da3bc4f6bf33c2d60f7376e2e99588c64dfb250c321c. Read-only43743082475 на17:47:52UTC: productiona182 running/OOMfalse, disk17723940864bytes (требование8589934592), availableRAM12428460032bytes. Это моментный снимок, не обещание отсутствия пиков. Отчёт энциклопедии сохранён артефактом текущего выпуска. Диагностика43743578796 показала передачу312287176bytes в17:53:15UTC; затем этап загрузки завершился успешно. Текущие статусы читать по43740421224, не по старым выпускам. После terminal result записать точный результат и live SHA; при отказе получить конкретные логи и устранять причину. Нельзя выдавать подготовку/CI/запуск за установленную Корею. Страховые поля и ежедневное обновление остаются отдельными неподтверждёнными требованиями.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record exact tested Korea release and pending runtime acceptance'
            git push origin HEAD:main
          fi
