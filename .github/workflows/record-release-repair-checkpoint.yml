name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n## 16.11.2026 — уточнение владельца: сохранить стабильный сайт и полностью заменить только старую Корею\n\n- Владелец показал новый Encar на сайте в 12:08 UTC+7 и спросил, почему он исчез. Проверен полный лог выпуска 43805789766 / job 133096142205: новая версия обслуживала сайт примерно с 05:02 UTC; health начался в 05:08:16, не получил ответа за 90.0906 сек и завершился ошибкой в 05:09:46; в 05:09:54 записано `Release gate failed: old production retained`. Пользователю объяснён возврат к старому приложению. Точная первопричина зависания не объявлена доказанной; ошибка сохранения готовности индексов является отдельно воспроизведённым дефектом.\n- Новое явное разрешение владельца: полностью убрать текущий старый корейский источник и пересадить новый, сохранив прежний работающий сайт и остальные рынки. Скорость и прочая новая логика отложены. Основной план остаётся минимальным кандидатом 83ff17075e9188dcf227c8752dc064248d5f42e0 на базе a182; после публичной проверки отключить только ajes_korea_feed, оставив encar_feed включённым. Повторного согласования не требуется.\n- Правильный активный выпуск 43812759975, controller 3b74fb19958d41273a453a4b6c280c4f13139348: private index, build и image load успешны; с 06:04:45 UTC работает шаг подготовки цен. На 06:30 UTC он ещё не завершён, переключение сайта не началось. Последняя независимая health-проверка около 06:12 дала 200 / a182 / c489. Установку нового источника пока НЕ объявлять завершённой.\n- Для наблюдения длительной подготовки обновлён существующий строго read-only report-encar-release-preparation.yml, commit cdd6f592d204d950c95578889e677384fd70ef49. Он исполняет точный 83ff, блокирует storage.writeJson и читает только CRM, manifest, lock и метаданные подготовленных объектов. Run 43816263164 SUCCESS: attempt1 job 133128893738; attempt2 job 133130701652. Свежие чтения 06:22/06:27: CRM revision14, korea=true, encar=true, ajesKorea=true; provider auto_api_encar, 69386 машин; generation gen_1794665184205_cfd76b47. Publish lock истёк. Calculator 4654386ca34f04041effe31f38259d0fae9c396ecda35c364e3a18dd125a4b90.\n- Сохранённый v7 directory b800bb6848ce5b72270ddfdb3aefb6d148dbdba92e01e0af83322e85cfb6640e содержит ready v4 для всех пяти рынков, 384 объекта; ready обновлён 06:14:27. Файлы Korea budget/sort записаны 06:07:07/06:07:20, China budget 06:20:04, UAE budget/sort 06:23:36/06:23:41, Europe 06:24:25/06:24:52, Georgia 06:24:56/06:24:57. Это подтверждает продвижение подготовки, но не заменяет её итоговый report и public acceptance.\n- Выявлен последующий риск: обычный неплатный publisher Korea мог потерять provider auto_api_encar и тем самым вернуть выбор к AJ. В main атомарно внесён commit 1bb70becbf556359697ebc93cd1e8efa2a8120ed, tree ff65bf9fdf4b98f51d5c7064fb01ee7ac14b5129: только 3 scripts и 2 tests. Защита перечитывает manifest и CRM под существующим publication lease и перед manifest commit; при выбранном платном источнике отклоняет неплатную публикацию с catalog_paid_korea_source_guard_protected. Валидированный paid snapshot, прочие рынки и явное выключение paid source сохраняют прежнее поведение. 8 регрессионных тестов PASS, включая реальный persistCatalogOffers и изменение CRM во время staging. Добавлена точная совместимость 83ff в существующий pre-editorial runtime allowlist; 16 tests PASS. App/packages/PR1774/candidate head не менялись; ни один push workflow не соответствует этим пяти путям. Патч проверен независимо, исходные blobs и SHA256 сверены перед CAS main.\n- Автообновление paid Encar ещё не настроено. Старое обычное расписание Korea имеет due 16.11.2026 17:00 UTC, затем 19.11.2026 17:00 UTC; его сборщик не получает paid Encar. Отдельная paid цепочка пока manual/push → prepare → publish. Простое добавление cron небезопасно: отсутствуют исходные CRM/cadence guards, а дополнительная последовательная workflow_run цепочка превышает допустимую глубину. Локально готовится узкая замена reusable worker существующего Catalog refresh korea на paid-only сбор/restore/publish в том же outer run, с сохранением cadence, имени, concurrency и существующих overview/prices hooks. Требуются точные run/producer-attempt/artifact ID+digest bindings и корректный publish-only retry. Ничего из нового расписания пока не активировано; повторного сбора/API запросов не запускали.\n- Дальше: завершить текущую подготовку и серверную проверку, дождаться release + verify-and-retire, сравнить публичные SHA/calculator, фактические три карточки до/после и CRM readback, проверить resume прежнего China publisher. При успешном deploy и сбое финального verify повторять только его job. После cutover при необходимости read-only disk audit: rerun job133109321042/run43809998612, workflow cd778de6 без изменений сервера. Закрепить окончательный исход новым append-only checkpoint.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record owner Korea-only instruction and verified preparation progress'
            git push origin HEAD:main
          fi
