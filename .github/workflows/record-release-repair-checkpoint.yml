name: Record release repair checkpoint once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-release-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint preserving full roadmap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('roadmap.md')
          note="\n\n### 13.11.2026 — выпуск43408245426 запущен, установка ещё не подтверждена\n\nSource52f7375262926f76d719f37945a9c0668d11fe06 / PR1770, marker a05f548dbf0333aa070e4963dd70614d1fea2f59. https://github.com/jeep-jim/AvtoCena/actions/runs/43408245426. Девять профильных exact-source checks SUCCESS, включая AutoBot43407878087 (геометрия кнопки и шапки), controls/chat43407884870, catalog43407884759; полный CI43407884893 ещё выполняется. Offlineguard43407968357 SUCCESS. Контроллер ждёт все зелёные результаты до подготовки; неизменные server/browser/nonce/rollback обязательны. Монитор Automation_a2b9a7715fe481918c3d88b60a1de36d переведён на новый run и включён; один итог после завершения. Нельзя выдавать запуск за подтверждённую установку. Roadmap checkpoint43408137575 SUCCESS.\n"
          old=p.read_bytes()
          assert len(old)>7000000
          if note.encode() not in old:
              with p.open('ab') as f:f.write(note.encode())
          assert p.read_bytes().startswith(old)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record exact release launch and accepted browser checks'
            git push origin HEAD:main
          fi
