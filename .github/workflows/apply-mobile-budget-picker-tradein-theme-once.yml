name: Apply mobile budget picker tradein theme once

on:
  push:
    branches:
      - ui/mobile-budget-picker-tradein-theme-20260814
    paths:
      - .github/workflows/apply-mobile-budget-picker-tradein-theme-once.yml
      - .github/scripts/apply-mobile-budget-picker-tradein-theme.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-budget-picker-tradein-theme-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 .github/scripts/apply-mobile-budget-picker-tradein-theme.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only change
        shell: bash
        run: |
          rm .github/workflows/apply-mobile-budget-picker-tradein-theme-once.yml
          rm .github/scripts/apply-mobile-budget-picker-tradein-theme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/home/HomePageClient.tsx .github/workflows/apply-mobile-budget-picker-tradein-theme-once.yml .github/scripts/apply-mobile-budget-picker-tradein-theme.py
          git commit -m "Polish mobile budget picker theme and trade-in"
          git push origin HEAD:ui/mobile-budget-picker-tradein-theme-20260814
