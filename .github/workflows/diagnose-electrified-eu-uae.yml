name: Diagnose electrified Europe and UAE

on:
  push:
    branches:
      - diag/electrified-eu-uae-20260810
    paths:
      - ".github/workflows/diagnose-electrified-eu-uae.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "3"
  RECOVERY_PREPARE_CONCURRENCY: "4"

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: europe
            source: autoscout_europe_open
          - market: uae
            source: dubizzle_uae_open
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enable exact Dubizzle host in generic diagnostic only
        if: matrix.market == 'uae'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-market.mjs')
          s=p.read_text()
          needle='  dubicars_uae_exact: ["dubicars.com"],\n'
          if 'dubizzle_uae_open:' not in s:
              if needle not in s: raise SystemExit('expected host map anchor missing')
              s=s.replace(needle, needle+'  dubizzle_uae_open: ["dubizzle.com"],\n', 1)
          p.write_text(s)
          PY
      - name: Validate diagnostic script
        run: node --check scripts/catalog-live-recovery-market.mjs
      - name: Run strict no-publish electrified diagnostic
        continue-on-error: true
        env:
          RECOVERY_MARKET: ${{ matrix.market }}
          RECOVERY_SOURCE_IDS: ${{ matrix.source }}
          RECOVERY_OUTPUT: catalog-rebuild-${{ matrix.market }}-electrified-diagnostic.json
          RECOVERY_TARGET: "300"
          RECOVERY_MAX_PAGES: "6"
          RECOVERY_TIME_LIMIT_MS: "900000"
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Print compact diagnostic
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const market=process.env.MARKET;
          const p=`catalog-rebuild-${market}-electrified-diagnostic.json`;
          if(!fs.existsSync(p)){ console.log(JSON.stringify({market,error:'no_diagnostic_output'})); process.exit(0); }
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const r=x.report||{};
          console.log(JSON.stringify({
            market,
            count:r.count||0,
            electricCount:r.electricCount||0,
            hybridCount:r.hybridCount||0,
            documentedPowerCount:r.documentedPowerCount||0,
            pendingElectrifiedCount:Array.isArray(r.calculationPendingElectrifiedModels)?r.calculationPendingElectrifiedModels.length:0,
            pendingElectrifiedModels:(r.calculationPendingElectrifiedModels||[]).slice(0,80),
            sources:r.sources||[]
          },null,2));
          NODE
        env:
          MARKET: ${{ matrix.market }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrified-${{ matrix.market }}-diagnostic
          path: catalog-rebuild-${{ matrix.market }}-electrified-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
