name: Japan raw fields and China photo diagnosis (bounded, no release)
on:
  push:
    branches: [main]
    paths: [.github/workflows/japan-field-audit-20261125.yml]
permissions:
  contents: read
concurrency:
  group: japan-field-audit-20261125
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: controller
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d536c1547c4d82a339ed68ced7d8503f09b6810b
          persist-credentials: false
          path: application
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Verify the exact source and the diagnostic disclosure guards
        run: |
          set -euo pipefail
          test "$(git -C application rev-parse HEAD)" = d536c1547c4d82a339ed68ced7d8503f09b6810b
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          audit=controller/.github/operations/japan-field-audit-20261125
          printf '%s  %s\n' b0da66117800f543915182208013625411199bedbe1d45ccc9a4b06d80490dda "$audit/raw-field-audit.ts" 61dc30ea49d3342d952247afc833a8b85573eb0cef45008eac011b695409bf71 "$audit/run-audit.mjs" | sha256sum --check --status
          node "$audit/raw-field-audit-selftest.mjs"
          node "$audit/raw-field-audit-guardtest.mjs"
          node --check "$audit/run-audit.mjs"
      - name: Install the exact deployed application's bundler dependencies
        working-directory: application
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle the bounded diagnostic with the actual deployed AJ parser
        working-directory: application
        run: |
          set -euo pipefail
          node --input-type=module <<'BUILD'
          import fs from 'node:fs';
          import path from 'node:path';
          import {build} from 'esbuild';
          await build({stdin:{contents:fs.readFileSync('../controller/.github/operations/japan-field-audit-20261125/raw-field-audit.ts','utf8'),resolveDir:process.cwd(),sourcefile:'japan-raw-field-audit.ts',loader:'ts'},outfile:path.join(process.env.RUNNER_TEMP,'japan-raw-field-audit.cjs'),bundle:true,platform:'node',format:'cjs',external:['geoip-country'],plugins:[{name:'server-only',setup(b){b.onResolve({filter:/^server-only$/},()=>({path:'empty',namespace:'empty'}));b.onLoad({filter:/.*/,namespace:'empty'},()=>({contents:''}));}}]});
          BUILD
          node --check "$RUNNER_TEMP/japan-raw-field-audit.cjs"
      - name: Verify the host identity without repeating the completed supplier reads
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          AUDIT_VERIFY_ONLY: '1'
        run: node controller/.github/operations/japan-field-audit-20261125/run-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-fields-and-china-photo-audit
          path: japan-fields-and-china-photo-audit.log
          if-no-files-found: warn
          retention-days: 7
