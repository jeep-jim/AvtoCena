name: Apply homepage type fix

on:
  push:
    branches:
      - fix/power-ui-home-stability-20260824
    paths:
      - .home-typefix-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/power-ui-home-stability-20260824
          fetch-depth: 1
      - name: Fix Market typing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/home/HomePageClient.tsx')
          s = p.read_text()
          old = 'if (!id || !make || !model || !marketIds.includes(market)) return null;'
          new = 'if (!id || !make || !model || !marketIds.some((marketId) => String(marketId) === market)) return null;'
          if old not in s:
              raise SystemExit('expected marketIds.includes pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/home/HomePageClient.tsx
          git commit -m "Fix homepage market id typing"
          git push origin HEAD:fix/power-ui-home-stability-20260824
