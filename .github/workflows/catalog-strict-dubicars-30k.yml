name: Catalog strict · DubiCars exact source-only 30k

on:
  workflow_dispatch:
  push:
    branches:
      - codex-strict-catalog-source-only
    paths:
      - ".github/workflows/catalog-strict-dubicars-30k.yml"

permissions:
  contents: read

concurrency:
  group: catalog-strict-dubicars-30k
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight exact source-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_STRICT_MARKET: uae
      CATALOG_STRICT_SOURCE_ID: dubicars_uae_exact
      CATALOG_STRICT_TARGET: "10"
      CATALOG_STRICT_MAX_PAGES: "3"
      CATALOG_STRICT_OUTPUT: catalog-strict-dubicars-preflight.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_KNOWLEDGE_DISABLED: "1"
      CATALOG_SOURCE_TIMEOUT_MS: "35000"
      CATALOG_SOURCE_RETRY_ATTEMPTS: "5"
      CATALOG_SOURCE_DETAIL_BATCH_SIZE: "2"
      CATALOG_SOURCE_BATCH_DELAY_MS: "650"
      CATALOG_SOURCE_PAGE_DELAY_MS: "1500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck strict catalog changes
        run: npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
      - name: Verify 10 exact cards before scaling
        run: npx tsx scripts/catalog-strict-source-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-strict-dubicars-30k-preflight
          path: catalog-strict-dubicars-preflight.json
          if-no-files-found: warn
          retention-days: 3

  chunks:
    name: Strict pages ${{ matrix.start }}-${{ matrix.end }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { chunk: 0, start: 1, end: 60 }
          - { chunk: 1, start: 61, end: 120 }
          - { chunk: 2, start: 121, end: 180 }
          - { chunk: 3, start: 181, end: 240 }
          - { chunk: 4, start: 241, end: 300 }
          - { chunk: 5, start: 301, end: 360 }
          - { chunk: 6, start: 361, end: 420 }
          - { chunk: 7, start: 421, end: 480 }
          - { chunk: 8, start: 481, end: 540 }
          - { chunk: 9, start: 541, end: 600 }
          - { chunk: 10, start: 601, end: 660 }
          - { chunk: 11, start: 661, end: 720 }
          - { chunk: 12, start: 721, end: 780 }
          - { chunk: 13, start: 781, end: 840 }
          - { chunk: 14, start: 841, end: 900 }
          - { chunk: 15, start: 901, end: 960 }
          - { chunk: 16, start: 961, end: 1020 }
          - { chunk: 17, start: 1021, end: 1080 }
          - { chunk: 18, start: 1081, end: 1140 }
          - { chunk: 19, start: 1141, end: 1200 }
          - { chunk: 20, start: 1201, end: 1260 }
          - { chunk: 21, start: 1261, end: 1320 }
          - { chunk: 22, start: 1321, end: 1380 }
          - { chunk: 23, start: 1381, end: 1440 }
          - { chunk: 24, start: 1441, end: 1500 }
          - { chunk: 25, start: 1501, end: 1560 }
          - { chunk: 26, start: 1561, end: 1620 }
          - { chunk: 27, start: 1621, end: 1680 }
          - { chunk: 28, start: 1681, end: 1740 }
          - { chunk: 29, start: 1741, end: 1800 }
          - { chunk: 30, start: 1801, end: 1860 }
          - { chunk: 31, start: 1861, end: 1920 }
          - { chunk: 32, start: 1921, end: 1980 }
          - { chunk: 33, start: 1981, end: 2040 }
          - { chunk: 34, start: 2041, end: 2100 }
          - { chunk: 35, start: 2101, end: 2160 }
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_STRICT_MARKET: uae
      CATALOG_STRICT_SOURCE_ID: dubicars_uae_exact
      CATALOG_STRICT_TARGET: "30000"
      CATALOG_STRICT_START_CURSOR: ${{ matrix.start }}
      CATALOG_STRICT_MAX_PAGES: "60"
      CATALOG_STRICT_REQUIRE_TARGET: "0"
      CATALOG_STRICT_STOP_AT_TARGET: "0"
      CATALOG_STRICT_OUTPUT: catalog-strict-dubicars-chunk-${{ matrix.chunk }}.json
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_KNOWLEDGE_DISABLED: "1"
      CATALOG_SOURCE_TIMEOUT_MS: "35000"
      CATALOG_SOURCE_RETRY_ATTEMPTS: "5"
      CATALOG_SOURCE_DETAIL_BATCH_SIZE: "2"
      CATALOG_SOURCE_BATCH_DELAY_MS: "650"
      CATALOG_SOURCE_PAGE_DELAY_MS: "1500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Certify this exact 60-page range
        run: npx tsx scripts/catalog-strict-source-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-strict-dubicars-30k-chunk-${{ matrix.chunk }}
          path: catalog-strict-dubicars-chunk-${{ matrix.chunk }}.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6

  aggregate:
    name: Merge and require 30,000 unique exact cards
    needs: chunks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_STRICT_MARKET: uae
      CATALOG_STRICT_SOURCE_ID: dubicars_uae_exact
      CATALOG_STRICT_TARGET: "30000"
      CATALOG_STRICT_EXPECTED_CHUNKS: "36"
      CATALOG_STRICT_MERGE_INPUT_DIR: catalog-strict-input
      CATALOG_STRICT_MERGE_OUTPUT: catalog-strict-dubicars-30000.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-strict-dubicars-30k-chunk-*
          path: catalog-strict-input
          merge-multiple: true
      - name: Merge strict chunks and enforce 30k unique-card gate
        run: node scripts/catalog-strict-merge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-strict-dubicars-30000
          path: catalog-strict-dubicars-30000.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
