name: Prepare compact budget counts
on:
  workflow_run:
    workflows: [Catalog refresh china, Catalog refresh korea, Catalog refresh georgia, Catalog refresh uae, Catalog refresh europe]
    types: [completed]
  push:
    branches: [main, feature/autocalc-identity-20260927]
    paths: [scripts/backfill-budget-count-index.mjs, scripts/catalog-storage-preflight.mjs, scripts/lib/catalog-preflight-input.mjs, apps/web/lib/catalog/budget-count-index.ts]
permissions:
  contents: read
concurrency:
  group: catalog-budget-index
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - name: Validate compact delivery and budget parity before publishing the derived index
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-budget-count-index.test.ts
      - run: node --import tsx scripts/backfill-budget-count-index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-index-storage-preflight
          path: catalog-storage-preflight.json
          if-no-files-found: ignore
