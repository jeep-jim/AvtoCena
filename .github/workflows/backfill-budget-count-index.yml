name: Prepare compact budget counts
on:
  workflow_run:
    workflows: [Catalog refresh china, Catalog refresh korea, Catalog refresh georgia, Catalog refresh uae, Catalog refresh europe]
    types: [completed]
  push:
    branches: [main, feature/autocalc-identity-20260927]
    paths: [scripts/backfill-budget-count-index.mjs, apps/web/lib/catalog/budget-count-index.ts, .github/workflows/backfill-budget-count-index.yml]
permissions:
  contents: read
concurrency:
  group: catalog-budget-index
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - name: Validate compact delivery and budget parity before publishing the derived index
        run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-budget-count-index.test.ts
      - name: Check bucket reserve before adding derived chunks
        run: node scripts/run-transient-retry.mjs node --import tsx scripts/catalog-storage-preflight.mjs
      - run: node --import tsx scripts/backfill-budget-count-index.mjs
