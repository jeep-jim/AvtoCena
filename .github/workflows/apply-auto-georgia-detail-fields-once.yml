name: Apply AUTO.GE exact detail fields once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-auto-georgia-detail-fields-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply exact AUTO.GE Engine and Fuel fields
        run: python .github/patches/apply-auto-georgia-detail-fields.py

      - name: Validate catalog recovery
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          npm run typecheck

      - name: Commit validated fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/patches/apply-auto-georgia-detail-fields.py
          rm -f .github/workflows/apply-auto-georgia-detail-fields-once.yml
          git add scripts/catalog-live-recovery-market.mjs
          git add -A .github/patches .github/workflows/apply-auto-georgia-detail-fields-once.yml
          git commit -m "Read exact AUTO.GE engine and fuel detail fields"
          git status --short
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Queue next K/C/E/Georgia recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/catalog-live-daily-working-markets.yml/dispatches" -f ref=main
