name: Record AutoBot release run
on:
  push:
    paths: ['.github/workflows/report-autobot-release-status.yml']
  workflow_run:
    workflows: ['Release desktop AutoBot interface']
    types: [requested, completed]
permissions:
  actions: read
  statuses: write
jobs:
  report:
    if: github.repository == 'jeep-jim/AvtoCena'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=e10d583e6e29c47cd6f1b79b274e2d7a412a8a55
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-desktop-autobot.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0]')
          url=$(jq -er .html_url <<< "$run")
          conclusion=$(jq -r .conclusion <<< "$run")
          case "$conclusion" in success) state=success;; null) state=pending;; *) state=failure;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f context='AutoBot production release' -f state="$state" -f target_url="$url"
  public-geometry:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const origin='https://avtocena.com';
          const health=await (await fetch(origin+'/api/health',{cache:'no-store'})).json();
          console.log('Public release',health.releaseSha);
          const browser=await chromium.launch();
          const results=[];
          try{
            for(const colorScheme of ['light','dark']){
              const page=await browser.newPage({colorScheme,viewport:{width:1440,height:900}});
              await page.addInitScript(theme=>localStorage.setItem('avtocena_theme',theme),colorScheme);
              await page.goto(origin,{waitUntil:'domcontentloaded'});
              const launcher=page.locator('.ab-fab');
              await launcher.waitFor();
              const box=await launcher.boundingBox();

              const mascot=await launcher.locator('.ab-mascot').boundingBox();
              const label=await launcher.locator('.ab-fab-label').boundingBox();

              assert.equal(await page.locator('html').getAttribute('data-theme'),colorScheme);
              const publicHeader=await page.locator('header:visible').first().boundingBox();
              await launcher.click();
              const chat=await page.locator('.ab-panel .ta-header').boundingBox();

              console.log({colorScheme,box,mascot,label,publicHeader,chat});
              await page.screenshot({path:'autobot-'+colorScheme+'.png'});
              results.push(box.width===84 && box.height===88 && label.y>=mascot.y+mascot.height-0.5 && publicHeader.height===64 && chat.height===64 && Math.abs(chat.y-publicHeader.y)<1);
              await page.close();
            }
            assert.deepEqual(results,[true,true],'public desktop AutoBot geometry');
          }finally{await browser.close()}
          JS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-autobot-geometry
          path: autobot-*.png
