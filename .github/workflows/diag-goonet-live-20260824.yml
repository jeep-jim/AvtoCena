name: Diagnose live Goo-net listing

on:
  pull_request:
    paths:
      - '.github/workflows/diag-goonet-live-20260824.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Goo-net listing and image families
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.goo-net-exchange.com/usedcars/HONDA/FIT/402026080500704382002/'
          exact_base='https://picture1.goo-net.com/4020260805/00704382/J/402026080500704382002'
          stock_base='https://picture1.goo-net.com/070/0704382/J/0704382A20260804G002'
          tmp=$(mktemp)
          code=$(curl -L -A 'Mozilla/5.0' -sS -o "$tmp" -w '%{http_code}' "$page" || true)
          echo "PAGE_HTTP=$code BYTES=$(wc -c < "$tmp")"
          echo 'PAGE_IMAGE_URLS:'
          grep -Eo 'https?://[^"'"'"' <>]+\.(jpg|jpeg|png|webp)' "$tmp" | grep -E 'goo-net\.com/.*/J/' | head -n 80 || true
          echo 'EXACT_ID_OCCURRENCES:'
          grep -Eo '402026080500704382002[0-9]{2}\.(jpg|jpeg|png|webp)' "$tmp" | sort -u | head -n 40 || true
          echo 'STOCK_FAMILY_OCCURRENCES:'
          grep -Eo '0704382A20260804G002[0-9]{2}\.(jpg|jpeg|png|webp)' "$tmp" | sort -u | head -n 40 || true
          for suffix in 00 01 02 03 10 20 30; do
            u="${exact_base}${suffix}.jpg"
            echo "EXACT_${suffix} $(curl -L -A 'Mozilla/5.0' -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u" || true)"
          done
          for suffix in 01 02 03 10 20 30; do
            u="${stock_base}${suffix}.jpg"
            echo "STOCK_${suffix} $(curl -L -A 'Mozilla/5.0' -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u" || true)"
          done
