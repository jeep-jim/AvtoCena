name: Diagnose live Goo-net listing

on:
  pull_request:
    paths:
      - '.github/workflows/diag-goonet-live-20260824.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Goo-net listing and image families
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.goo-net-exchange.com/usedcars/HONDA/FIT/402026080500704382002/'
          exact_base='https://picture1.goo-net.com/4020260805/00704382/J/402026080500704382002'
          stock_base='https://picture1.goo-net.com/070/0704382/J/0704382A20260804G002'
          code=$(curl -L -A 'Mozilla/5.0' -sS -o page.html -w '%{http_code}' "$page" || true)
          echo "PAGE_HTTP=$code BYTES=$(wc -c < page.html)"
          for suffix in 00 01 02 03 10 20 30; do
            u="${exact_base}${suffix}.jpg"
            echo "EXACT_${suffix} $(curl -L -A 'Mozilla/5.0' -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u" || true)"
          done
          for suffix in 01 02 03 10 20 30; do
            u="${stock_base}${suffix}.jpg"
            echo "STOCK_${suffix} $(curl -L -A 'Mozilla/5.0' -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u" || true)"
          done
          curl -L -A 'Mozilla/5.0' -sS "${exact_base}00.jpg" -o exact00.jpg
          curl -L -A 'Mozilla/5.0' -sS "${stock_base}01.jpg" -o stock01.jpg
          curl -L -A 'Mozilla/5.0' -sS "${stock_base}02.jpg" -o stock02.jpg
          curl -L -A 'Mozilla/5.0' -sS "${stock_base}10.jpg" -o stock10.jpg
          echo "EXACT00_SHA=$(sha256sum exact00.jpg | awk '{print $1}') SIZE=$(wc -c < exact00.jpg) TYPE=$(file -b exact00.jpg)"
          echo "STOCK01_SHA=$(sha256sum stock01.jpg | awk '{print $1}') SIZE=$(wc -c < stock01.jpg) TYPE=$(file -b stock01.jpg)"
      - uses: actions/upload-artifact@v4
        with:
          name: goonet-live-sample
          path: |
            exact00.jpg
            stock01.jpg
            stock02.jpg
            stock10.jpg
          retention-days: 1
