name: Finalize Japan auction statistics v30

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-japan-auction-v30.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch auction detail and permanent roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detail_path = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          marker = '''function MissingOffer() {
'''
          helpers = '''function auctionSourceMoney(value: number, currency: string) {
  const symbols: Record<string, string> = { JPY: "¥", RUB: "₽", USD: "$", EUR: "€" };
  return `${money(value)} ${symbols[currency] || currency}`;
}

function auctionDateLabel(value: unknown) {
  const text = String(value || "").slice(0, 10);
  if (!text) return "";
  const parsed = new Date(`${text}T12:00:00`);
  return Number.isNaN(parsed.getTime()) ? text : parsed.toLocaleDateString("ru-RU");
}

function AuctionResultSummary({ offer }: { offer: any }) {
  const price = Number(offer?.sourcePrice || 0);
  const currency = String(offer?.sourceCurrency || "JPY").toUpperCase();
  const facts = [
    offer?.auctionDate ? `Дата торгов: ${auctionDateLabel(offer.auctionDate)}` : "",
    offer?.auctionName ? `Аукцион: ${offer.auctionName}` : "",
    offer?.lotNumber ? `Лот: ${offer.lotNumber}` : "",
    offer?.auctionGrade ? `Оценка: ${offer.auctionGrade}` : "",
    offer?.frameNumber ? `Кузов: ${offer.frameNumber}` : "",
  ].filter(Boolean);
  return <section className="ac-offer-price-panel rounded-[1.35rem] bg-[var(--ac-surface-2)] p-4 shadow-[0_14px_38px_rgba(0,0,0,.14)]">
    <div className="text-[10px] font-black uppercase tracking-[0.19em] text-[var(--ac-muted)]">Результат состоявшихся торгов</div>
    <div className="mt-1.5 text-3xl font-black leading-none tracking-[-0.05em] text-[var(--ac-text)] md:text-4xl">{price ? auctionSourceMoney(price, currency) : "Цена не опубликована"}</div>
    {facts.length ? <div className="mt-3 flex flex-wrap gap-2">{facts.map((fact) => <span key={fact} className="rounded-full bg-white/[0.06] px-2.5 py-1.5 text-[11px] font-bold text-[var(--ac-muted)]">{fact}</span>)}</div> : null}
    <p className="mt-3 text-xs font-medium leading-5 text-[var(--ac-muted)]">Это опубликованная цена отыгранного лота. Итоговая стоимость с таможней, утильсбором, логистикой и услугами рассчитывается отдельно нашим движком.</p>
    {Number(offer?.totalRub || 0) > 0 ? <div className="mt-3 border-t border-dotted border-[var(--ac-border)] pt-3 text-sm font-black text-[var(--ac-text)]">Расчёт под ключ: {money(Number(offer.totalRub))} ₽</div> : <div className="mt-3 border-t border-dotted border-[var(--ac-border)] pt-3 text-sm font-bold text-[var(--ac-muted)]">Расчёт таможни и утиля уточняется</div>}
  </section>;
}

'''
          if 'function AuctionResultSummary' not in detail:
              if marker not in detail:
                  raise SystemExit('detail_helper_marker_missing')
              detail = detail.replace(marker, helpers + marker, 1)

          old_state = '''  const isHybrid = ["series_hybrid", "other_hybrid"].includes(powertrainKind) || /hybrid|гибрид|phev|hev/.test(fuelKind);
'''
          new_state = old_state + '''  const isAuctionResult = raw.catalogKind === "auction_result" || (raw.offerType === "auction" && raw.auctionResult === "sold");
'''
          if 'const isAuctionResult =' not in detail:
              if old_state not in detail:
                  raise SystemExit('detail_state_marker_missing')
              detail = detail.replace(old_state, new_state, 1)

          old_panel = '''          <PriceTrend offer={o} label="Ориентир стоимости" priceClassName="text-3xl md:text-4xl" className="ac-offer-price-panel" panel />
'''
          new_panel = '''          {isAuctionResult ? <AuctionResultSummary offer={o} /> : <PriceTrend offer={o} label="Ориентир стоимости" priceClassName="text-3xl md:text-4xl" className="ac-offer-price-panel" panel />}
'''
          if old_panel in detail:
              detail = detail.replace(old_panel, new_panel, 1)
          elif new_panel not in detail:
              raise SystemExit('detail_panel_marker_missing')
          detail_path.write_text(detail, encoding='utf-8')

          roadmap_path = Path('roadmap.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = '''### 4.3. Япония

Основные зарегистрированные направления:

- BE FORWARD;
- TCV;
- Goo-net / Goo-net Exchange;
- Carused.jp;
- Car From Japan;
- Japan Partner;
- Car Deal Page;
- PicknBuy24;
- Autocom Japan;
- EveryCar;
- Autorec;
- Nikkyo;
- JPAuc;
- CarVector;
- JP Center;
- Prestige Motorsport;
- другие зарегистрированные экспортные и статистические площадки.

Не смешивать легковые автомобили с грузовиками, автобусами и коммерческой техникой.
'''
          new = '''### 4.3. Япония

Главный публичный раздел Японии — **статистика отыгранных аукционных лотов**, а не смешанная витрина экспортных машин в наличии.

Приоритетные источники статистики:

- Japan Transit / `japantransit_japan_stat_open` — публичные результаты по маркам и моделям;
- JPAuc / `jpauc_japan_past_open` — прошедшие аукционы;
- CarVector / `carvector_japan_stat_open` — аукционная статистика;
- другие статистические источники только после подтверждения актуальным probe.

Дополнительные экспортные каталоги BE FORWARD, TCV, Goo-net, Carused.jp, Car From Japan, Japan Partner, Car Deal Page, PicknBuy24, Autocom Japan, EveryCar, Autorec, Nikkyo, JP Center и Prestige Motorsport могут использоваться для отдельных задач и пополнения базы знаний, но не должны вытеснять статистику торгов из основного японского раздела.

Обязательные поля аукционного результата, когда они опубликованы источником:

- марка, модель и год;
- цена результата торгов и исходная валюта;
- дата торгов;
- аукцион и номер лота;
- аукционная оценка;
- пробег;
- кузов / frame number;
- объём двигателя и коробка;
- фотография именно этого лота;
- ссылка на публичную страницу статистики.

Правила цены:

- `auctionPriceKind=hammer` использовать только для явно опубликованной цены удара молотка / end price;
- если сайт показывает собственную рублёвую цену результата без доказательства, что это чистая цена молотка, хранить `auctionPriceKind=published_result` и не переименовывать её в JPY;
- цена отыгранного лота показывается отдельно от расчёта «под ключ»;
- таможня и утильсбор рассчитываются нашим движком только при достаточных данных; иначе честно показывается статус уточнения;
- нельзя выдавать приблизительную экспортную цену или стартовую ставку за фактическую цену продажи.

Не смешивать легковые автомобили с грузовиками, автобусами и коммерческой техникой. Исторический аукционный результат хранится как активная запись каталога с `catalogKind=auction_result` и `auctionResult=sold`, а не как текущее объявление в продаже.
'''
          if old in roadmap:
              roadmap = roadmap.replace(old, new, 1)
          elif 'Главный публичный раздел Японии — **статистика отыгранных аукционных лотов**' not in roadmap:
              raise SystemExit('roadmap_japan_section_missing')

          journal = '''

### 2026-07-28 — Japan auction statistics v30

Решение владельца продукта:

- публичный каталог Японии показывает статистику уже отыгранных аукционных лотов;
- главная цена карточки — опубликованный результат торгов;
- обычные экспортные объявления не смешиваются с основной японской выдачей, когда доступны результаты торгов.

Реализация:

- специализированный адаптер `japantransit_japan_stat_open` обходит модельные страницы Japan Transit через постоянный cursor;
- JPAuc и CarVector маркируются дополнительными статистическими источниками;
- карточка хранит `catalogKind=auction_result`, `auctionResult=sold` и тип опубликованной цены;
- `/cars?market=japan` фильтрует выдачу до аукционных результатов;
- цена торгов показывается отдельно от таможни, утильсбора и общей цены «под ключ»;
- коммерческие лоты исключаются;
- parser, registry, typecheck и production build прошли в PR #134;
- merge-коммит основной реализации: `c01c53957d8e196d81582f53ac4b9e5274690564`;
- фактический production-объём записать после нового probe/rebuild/publish прохода.
'''
          if '### 2026-07-28 — Japan auction statistics v30' not in roadmap:
              marker = '### Шаблон новой записи'
              pos = roadmap.rfind(marker)
              roadmap = roadmap[:pos] + journal + '\n' + roadmap[pos:] if pos >= 0 else roadmap + journal
          roadmap_path.write_text(roadmap, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify Japan statistics and types
        run: |
          node --import tsx --test tests/japan-auction-statistics-source.test.ts
          node --import tsx --test tests/catalog-source-scale.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm run build
      - name: Commit verified finalization
        shell: bash
        run: |
          rm -f .github/workflows/finalize-japan-auction-v30.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add roadmap.md 'apps/web/app/(public)/cars/offer/[id]/page.tsx' .github/workflows/finalize-japan-auction-v30.yml
          git commit -m "Япония: полная карточка результата торгов и roadmap"
          git push origin HEAD:main
