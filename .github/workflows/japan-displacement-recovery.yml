name: Japan official chassis displacement recovery
on:
  workflow_dispatch:
  push:
    branches: [fix/japan-honda-displacement-20260920, main]
    paths: [.github/workflows/japan-displacement-recovery.yml, data/catalog/triggers/japan-displacement-recovery.json, .github/market-runs/japan-displacement-recovery.json]
permissions:
  contents: read
concurrency:
  group: catalog-japan-displacement-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CATALOG_READ_CONCURRENCY: '4'
      CATALOG_MAINTENANCE_IO_CONCURRENCY: '4'
      CATALOG_PUBLICATION_PROGRESS: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      JSON_STORAGE_DRIVER: object
      CATALOG_SOURCE_INVENTORY_MODE: '1'
      CATALOG_SELLER_INVENTORY: '1'
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_INPUT_DIR: japan-displacement-input
      CATALOG_REBUILD_MARKETS: japan
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: '1'
      CATALOG_PUBLISH_TARGET_PER_MARKET: '100000'
      CATALOG_PUBLISH_MAX_PER_MARKET: '100000'
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Match exact Honda chassis and calculate only verified auction records
        run: node --import tsx scripts/catalog-japan-displacement-recovery.mjs
      - name: Check storage reserve
        if: github.ref == 'refs/heads/main'
        run: node --import tsx scripts/catalog-storage-preflight.mjs
      - name: Publish through all source retention and price guards
        if: github.ref == 'refs/heads/main'
        run: node --import tsx scripts/catalog-publish-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-displacement-recovery
          retention-days: 14
          path: |
            japan-displacement-recovery-report.json
            japan-displacement-input/
            catalog-v2-market-publish-report.json
            catalog-storage-preflight.json
