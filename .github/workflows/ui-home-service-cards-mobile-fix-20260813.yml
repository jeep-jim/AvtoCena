name: UI home service cards mobile fix 20260813

on:
  push:
    branches:
      - ui/home-service-cards-mobile-fix-20260813

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/home-service-cards-mobile-fix-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('apps/web/components/home/HomePageClient.tsx')
          text = home.read_text()

          old_budget = '          <HomeSelect value={budget} options={budgets} onChange={setBudget} />'
          new_budget = '          <div className="w-1/2 min-w-0 lg:w-full"><HomeSelect value={budget} options={budgets} onChange={setBudget} /></div>'
          if text.count(old_budget) != 1:
              raise SystemExit(f'budget selector anchor count={text.count(old_budget)}')
          text = text.replace(old_budget, new_budget, 1)

          old_logo = '<img src="/brands/topavto-logo.png" alt="TopAvto" className="mb-1 hidden h-auto w-[108px] shrink-0 object-contain sm:block" />'
          new_logo = '<img src="/brands/topavto-logo.png" alt="TopAvto" className="mb-1 block h-auto w-[82px] shrink-0 object-contain sm:w-[108px]" />'
          if text.count(old_logo) != 1:
              raise SystemExit(f'TopAvto logo anchor count={text.count(old_logo)}')
          text = text.replace(old_logo, new_logo, 1)

          old_services = '''        <section className="grid min-h-[168px] grid-cols-2 gap-3 md:gap-4" aria-label="Будущие сервисы">
          <div className="ac-executor-block min-h-[168px] rounded-[1.6rem]" aria-hidden="true" />
          <div className="ac-executor-block min-h-[168px] rounded-[1.6rem]" aria-hidden="true" />
        </section>'''
          new_services = '''        <section className="ac-hide-scrollbar -mr-4 flex min-h-[168px] snap-x snap-mandatory gap-3 overflow-x-auto pr-4 md:mr-0 md:grid md:grid-cols-2 md:gap-4 md:overflow-visible md:pr-0" aria-label="Финансовые сервисы">
          <article className="ac-executor-block relative min-h-[168px] min-w-[82%] snap-start overflow-hidden rounded-[1.6rem] p-5 md:min-w-0">
            <div className="flex h-full flex-col">
              <div className="flex items-start justify-between gap-4"><div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-white/[0.055] text-white"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="2.5" stroke="currentColor" strokeWidth="1.8"/><path d="M3.5 10h17M7 14h4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg></div><span className="rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-[10px] font-black uppercase tracking-[.12em] text-white/45">Скоро</span></div>
              <div className="mt-auto pt-5"><h3 className="text-lg font-black leading-tight md:text-xl">Кредитный калькулятор</h3><p className="mt-2 max-w-[330px] text-sm font-medium leading-5 text-white/50">Рассчитайте платёж и подберите удобные условия покупки автомобиля.</p></div>
            </div>
          </article>
          <article className="ac-executor-block relative min-h-[168px] min-w-[82%] snap-start overflow-hidden rounded-[1.6rem] p-5 md:min-w-0">
            <div className="absolute inset-y-5 left-0 w-[3px] rounded-r-full bg-[#ffd21f]" aria-hidden="true" />
            <div className="flex h-full flex-col">
              <div className="flex items-start justify-between gap-4"><div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-[#ffd21f]/10 text-[#ffd21f]"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5 19 6v5.3c0 4.2-2.8 7.5-7 9.2-4.2-1.7-7-5-7-9.2V6l7-2.5Z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg></div><span className="rounded-full border border-[#ffd21f]/20 bg-[#ffd21f]/[0.06] px-3 py-1 text-[10px] font-black uppercase tracking-[.12em] text-[#ffd21f]">ОСАГО</span></div>
              <div className="mt-auto pt-5"><h3 className="text-lg font-black leading-tight md:text-xl">Страховой полис ОСАГО</h3><p className="mt-2 max-w-[330px] text-sm font-medium leading-5 text-white/50">Быстрый расчёт стоимости полиса для выбранного автомобиля.</p></div>
            </div>
          </article>
        </section>'''
          if text.count(old_services) != 1:
              raise SystemExit(f'service placeholder anchor count={text.count(old_services)}')
          text = text.replace(old_services, new_services, 1)
          home.write_text(text)

          rates = Path('apps/web/components/catalog/CurrencyRatesStrip.tsx')
          r = rates.read_text()
          old_shell = '    : "rounded-[1.35rem] px-2 py-3";'
          new_shell = '    : "w-full min-w-0 max-w-full overflow-hidden rounded-[1.35rem] px-2 py-3";'
          if r.count(old_shell) != 1:
              raise SystemExit(f'currency shell anchor count={r.count(old_shell)}')
          r = r.replace(old_shell, new_shell, 1)
          old_rail = '    : "ac-hide-scrollbar flex touch-pan-x gap-2 overflow-x-auto overscroll-x-contain";'
          new_rail = '    : "ac-hide-scrollbar flex w-full min-w-0 touch-pan-x gap-2 overflow-x-auto overscroll-x-contain";'
          if r.count(old_rail) != 1:
              raise SystemExit(f'currency rail anchor count={r.count(old_rail)}')
          r = r.replace(old_rail, new_rail, 1)
          old_tile = '${variant === "desktop" ? "min-w-0 bg-white/[0.045]" : "min-w-[62px] flex-1"}'
          new_tile = '${variant === "desktop" ? "min-w-0 bg-white/[0.045]" : "min-w-[62px] shrink-0"}'
          if r.count(old_tile) != 1:
              raise SystemExit(f'currency tile anchor count={r.count(old_tile)}')
          r = r.replace(old_tile, new_tile, 1)
          rates.write_text(r)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit UI-only changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/home/HomePageClient.tsx apps/web/components/catalog/CurrencyRatesStrip.tsx
          git diff --cached --quiet && exit 1
          git commit -m "Polish home finance cards and mobile layout"
          git push origin HEAD:ui/home-service-cards-mobile-fix-20260813
