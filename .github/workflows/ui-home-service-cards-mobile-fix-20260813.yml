name: UI home service cards mobile fix 20260813

on:
  push:
    branches:
      - ui/home-service-cards-mobile-fix-20260813

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/home-service-cards-mobile-fix-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply UI patch
        run: python3 .github/patches/apply-home-service-cards-mobile-fix.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit UI-only changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/home/HomePageClient.tsx apps/web/components/catalog/CurrencyRatesStrip.tsx
          git diff --cached --quiet && exit 1
          git commit -m "Polish home finance cards and mobile layout"
          git push origin HEAD:ui/home-service-cards-mobile-fix-20260813
