name: One-shot dispatch Japan Prestige live 20260810

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-dispatch-japan-prestige-live-20260810.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch strict Japan live recovery from repaired Prestige artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run catalog-live-recovery-japan-from-prestige.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_run_id=31414742813
          echo "Dispatched strict Japan live recovery from repair run 31414742813"
