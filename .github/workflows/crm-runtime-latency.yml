name: CRM read-only runtime latency
on:
  push:
    branches: [feat/crm-activity-reminders-20260926]
    paths: ['scripts/crm-runtime-latency.mjs', '.github/workflows/crm-runtime-latency.yml']
  workflow_dispatch:
    inputs:
      check_new_endpoints:
        type: boolean
        default: false
        description: Check activity and reminders after release
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure existing public and authenticated CRM pages without writes
        env:
          CRM_RELEASE_CHECK: ${{ inputs.check_new_endpoints && '1' || '0' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
          YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
          YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
        run: node --import tsx scripts/crm-runtime-latency.mjs
