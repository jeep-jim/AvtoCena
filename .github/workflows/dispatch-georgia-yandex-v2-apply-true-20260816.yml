name: Dispatch Georgia Yandex v2 apply true after Japan 9759
run-name: Dispatch guarded Georgia Yandex v2 apply=true · ${{ github.sha }}

on:
  push:
    paths:
      - .github/workflows/dispatch-georgia-yandex-v2-apply-true-20260816.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the production workflow on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"apply":"true"}}'
          code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-live-recovery-georgia-yandex-v2.yml/dispatches" \
            -d "${payload}")"
          if [ "${code}" != "204" ]; then
            cat response.json
            echo "workflow_dispatch_failed_http_${code}" >&2
            exit 1
          fi
          echo "Georgia Yandex v2 apply=true dispatched on main"
