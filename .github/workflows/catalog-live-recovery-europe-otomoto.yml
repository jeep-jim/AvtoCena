name: Catalog live recovery · Europe OTOMOTO
run-name: Europe OTOMOTO recovery · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-live-recovery-europe-otomoto
  cancel-in-progress: true

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_TARGET: "5000"
  RECOVERY_MAX_PAGES: "120"
  RECOVERY_TIME_LIMIT_MS: "5100000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          npm run typecheck
      - name: Collect exact OTOMOTO offers and calculate RUB
        env:
          RECOVERY_OUTPUT: catalog-rebuild-europe.json
        run: npx tsx scripts/catalog-live-recovery-europe-otomoto.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-europe-otomoto-recovery
          path: catalog-rebuild-europe.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: collect
    if: ${{ always() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-europe-otomoto-recovery
          path: recovery-input
      - name: Publish Europe cumulatively while preserving every other market
        env:
          RECOVERY_BATCH_MARKETS: europe
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: catalog-europe-otomoto-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-europe-otomoto-publish-report
          path: catalog-europe-otomoto-publish-report.json
          if-no-files-found: warn
          retention-days: 3
