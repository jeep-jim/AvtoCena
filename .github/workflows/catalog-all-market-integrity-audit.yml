name: All-market stored integrity audit (read only)
on:
  workflow_dispatch:
  push:
    branches: [fix/kcar-power-evidence-20260916]
    paths: [.github/workflows/catalog-all-market-integrity-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      AUDIT_SKIP_SOURCE_SAMPLES: '1'
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Audit every stored record in all six markets
        run: node --import tsx scripts/catalog-all-market-integrity-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-market-integrity-audit
          retention-days: 14
          path: all-market-audit/
