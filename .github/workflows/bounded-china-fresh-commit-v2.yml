name: Publish validated fresh China independently
permissions:
  contents: read
  actions: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
env:
  OPERATIONAL_PACKAGE_BLOB: 7241a973d31cacf241698963ac66f0ffc5b11321
  OPERATIONAL_MANIFEST_SHA256: b349181fe490c472073ee5f1addb63723a2d7cebe3b333df999274284ea11e67
  CONTROLLER_PACKAGE_BLOB: 4c550ca30f073d16b220a5d065e7028f9124a19a
  CI_TEST_PACKAGE_BLOB: f67efc8179e73a63551c10227b876f08e62b60d5
  WATCHDOG_TEST_PACKAGE_BLOB: c2c18785af29b2dfb9374e95c960b4fb15a419ea
  CHINA_COLLECTOR_REVISION: '038574d914de2436cd10871629b1b0a8fe83a92c'
  CHINA_COLLECTOR_RUN: '44457059256'
  CHINA_COLLECTOR_ATTEMPT: '1'
  CHINA_RECEIPT_ARTIFACT: '14500964905'
  CHINA_RECEIPT_ZIP_SHA256: 'c0802faab0b9ecc39e6d44b53d66f76c19cac485258f5ed2c80e5c2b59ac8097'
  CHINA_EXPECTED_ARCHIVE_SHA256: 'b8a2a25dc27390845dd5a423efa323c9472a338b1b97f413ba96aefa7f3b65ca'
  CHINA_EXPECTED_REPORT_FILE_SHA256: '894bb1eb1b37042de7ce611e19d8e33bfd58c01546d2a812f2c87f96cd906caf'
  CHINA_EXPECTED_REPORT_DIGEST: '894bb1eb1b37042de7ce611e19d8e33bfd58c01546d2a812f2c87f96cd906caf'
  CHINA_EXPECTED_RECEIPT_FILE_SHA256: '174893f63c5870628a3df1ab3a5241fe49847f01fa579a84d80a369383c3c49a'
  CHINA_EXPECTED_SOURCE_ROWS: '290044'
  CHINA_EXPECTED_WITNESS_ABSENCE: 'che168_replica_witness_worker_source_unverified'
  CHINA_EXPECTED_BASE_PUBLIC_SHA256: '4c34c20d9784b571414390cab450ceeeaee60b00c168476100419ec5c05cb038'
  CHINA_EXPECTED_BASE_INTERNAL_SHA256: '0aa3524abf2aa0563811a7980ebe9eded7566a1d2ab36b057557dfb7caba6585'
jobs:
  ci:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish verified fresh China with exact-byte guards'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Refuse pending fresh-commit code pins
      run: 'set -euo pipefail

        [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]

        [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$WATCHDOG_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        '
    - uses: actions/checkout@v4
      with:
        ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
        path: publisher
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
        path: runtime
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Materialize exact hash-bound code without storage credentials
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n[[ \"$OPERATIONAL_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CONTROLLER_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CI_TEST_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$OPERATIONAL_MANIFEST_SHA256\" =~ ^[a-f0-9]{64}$ ]]\nmkdir -m700 \"$RUNNER_TEMP/china-job\"\ncat > \"$RUNNER_TEMP/unpack-frozen.py\" <<'PY'\n#!/usr/bin/env python3\n\"\"\"Decode an exact Git blob containing reviewed source only. No archive authority.\"\"\"\nimport base64,hashlib,json,os,pathlib,re,sys\n\ndef unpack(response,expected_blob,destination):\n    if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')\n    response=pathlib.Path(response);destination=pathlib.Path(destination)\n    if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute() or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')\n    envelope=json.loads(response.read_bytes())\n    if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob: raise ValueError('blob_binding')\n    content=base64.b64decode(''.join(envelope['content'].split()),validate=True)\n    if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\\0'+content).hexdigest()!=expected_blob: raise ValueError('blob_hash')\n    bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]\n    if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise ValueError('bundle_schema')\n    for e in entries:\n        name=e['path'];parts=name.split('/')\n        if not re.fullmatch(r'[A-Za-z0-9_.\\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data') for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')): raise ValueError('bundle_path')\n        data=e['contents'].encode('utf-8');total+=len(data)\n        if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']: raise ValueError('bundle_file_binding')\n        prepared.append((parts,data));seen.add(name)\n    destination.mkdir(mode=0o700)\n    # Only immutable hash-pinned controller-authored names enter this fresh private root.\n    for parts,data in prepared:\n        out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)\n        fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)\n        try:\n            view=memoryview(data)\n            while view:\n                n=os.write(fd,view)\n                if n<=0: raise ValueError('bundle_short_write')\n                view=view[n:]\n        finally: os.close(fd)\n    return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}\nif __name__=='__main__':\n    try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))\n    except Exception:\n        print('{\"ok\":false,\"code\":\"frozen_bundle_unpack_failed\"}',file=sys.stderr);sys.exit(1)\nPY\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$OPERATIONAL_PACKAGE_BLOB\" > \"$RUNNER_TEMP/package-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/package-blob.json\" \"$OPERATIONAL_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/package\"\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$CONTROLLER_PACKAGE_BLOB\" > \"$RUNNER_TEMP/controller-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/controller-blob.json\" \"$CONTROLLER_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/controller\"\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$CI_TEST_PACKAGE_BLOB\" > \"$RUNNER_TEMP/tests-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/tests-blob.json\" \"$CI_TEST_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/tests\"\n[[ \"$WATCHDOG_TEST_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$WATCHDOG_TEST_PACKAGE_BLOB\" > \"$RUNNER_TEMP/watchdog-tests-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/watchdog-tests-blob.json\" \"$WATCHDOG_TEST_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/watchdog-tests\"\n"
    - name: Install exact locked test toolchain
      run: 'set -euo pipefail

        test "$(node --version)" = v24.22.1

        npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.9.0

        export PATH="$RUNNER_TEMP/pinned-npm/node_modules/.bin:$PATH"

        echo "$RUNNER_TEMP/pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"

        test "$(npm --version)" = 11.9.0

        (cd publisher && npm ci)

        '
    - name: Run separately pinned portable regression suite
      run: "set -euo pipefail\npython - <<'PY'\nimport base64,hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job'\nmanifest_bytes=(root/'package'/'SOURCE_MANIFEST.json').read_bytes()\nassert hashlib.sha256(manifest_bytes).hexdigest()==os.environ['OPERATIONAL_MANIFEST_SHA256']\nmanifest=json.loads(manifest_bytes);assert manifest['dynamicSitesReviewed'] is True\nfor directory,entries in [(root/'package'/'operational',manifest['operational']['files']),*( (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/k,manifest['native'][k]['files']) for k in ['publisher','runtime'])]:\n    for e in entries:\n        b=(directory/e['path']).read_bytes();assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']\nenvelope=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'tests-blob.json'))\nbundle=json.loads(base64.b64decode(envelope['content']))\nassert bundle['kind']=='selected-portable-ci-tests-not-whole-publication'\ninventory={e['path'] for e in bundle['files']}\ntests=bundle['tests'];assert tests and len(tests)==len(set(tests))\nassert all(t in inventory and t.endswith('.test.mjs') and not t.startswith('-') for t in tests)\nfor e in bundle['files']:\n    source=root/'tests'/e['path'];target=root/'package'/'operational'/e['path']\n    assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True)\n    with target.open('xb') as f:f.write(source.read_bytes())\nsubprocess.run(['node','--test','--test-concurrency=1',*tests],cwd=root/'package'/'operational',check=True)\nPY\n"
    - name: Exercise exact controller watchdog and fresh commit scope
      run: "set -euo pipefail\npython - <<'PYCI'\nimport base64,json,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job'\ne=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'watchdog-tests-blob.json'));bundle=json.loads(base64.b64decode(e['content']))\nassert bundle['kind']=='actual-controller-watchdog-regression-tests'\nallowed={'test.mjs','watchdog.test.mjs','rss-race.test.mjs','independent-rss-review.test.mjs','watchdog.before.mjs'}\nassert {x['path'] for x in bundle['files']}==allowed\nassert set(bundle['tests'])==allowed-{'watchdog.before.mjs'}\nfor f in bundle['files']:\n    dest=root/'controller'/f['path'];assert not dest.exists()\n    with dest.open('xb') as out:out.write((root/'watchdog-tests'/f['path']).read_bytes())\ns=(root/'controller'/'materialize-job.mjs').read_text()\nassert \"mode:'commit',entry\" in s and 'plan.authorizeCommit=plan.configSha256;validateWatchPlan(plan)' in s\nassert all(k not in s for k in ['stopAfterPreauditCheckpoint','stopAfterResourceAdmission','resumePreauditCheckpoint','checkpointLauncherFile','checkpointMetadataFile'])\nsubprocess.run(['node','--test','--test-concurrency=1',*bundle['tests']],cwd=root/'controller',check=True)\nPYCI\n"
  recover:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish verified fresh China with exact-byte guards'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Refuse pending fresh-commit code pins
      run: 'set -euo pipefail

        [[ "$OPERATIONAL_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$OPERATIONAL_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]

        [[ "$CONTROLLER_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$CI_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        [[ "$WATCHDOG_TEST_PACKAGE_BLOB" =~ ^[a-f0-9]{40}$ ]]

        '
    - uses: actions/checkout@v4
      with:
        ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
        path: publisher
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
        path: runtime
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Materialize exact hash-bound code without storage credentials
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n[[ \"$OPERATIONAL_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CONTROLLER_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$CI_TEST_PACKAGE_BLOB\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$OPERATIONAL_MANIFEST_SHA256\" =~ ^[a-f0-9]{64}$ ]]\nmkdir -m700 \"$RUNNER_TEMP/china-job\"\ncat > \"$RUNNER_TEMP/unpack-frozen.py\" <<'PY'\n#!/usr/bin/env python3\n\"\"\"Decode an exact Git blob containing reviewed source only. No archive authority.\"\"\"\nimport base64,hashlib,json,os,pathlib,re,sys\n\ndef unpack(response,expected_blob,destination):\n    if not re.fullmatch('[a-f0-9]{40}',expected_blob): raise ValueError('blob_pin')\n    response=pathlib.Path(response);destination=pathlib.Path(destination)\n    if not response.is_file() or response.stat().st_size>24*1024**2 or not destination.is_absolute() or destination.exists() or destination.parent.resolve()!=destination.parent: raise ValueError('bundle_layout')\n    envelope=json.loads(response.read_bytes())\n    if envelope.get('encoding')!='base64' or envelope.get('sha')!=expected_blob: raise ValueError('blob_binding')\n    content=base64.b64decode(''.join(envelope['content'].split()),validate=True)\n    if len(content)>16*1024**2 or hashlib.sha1(b'blob '+str(len(content)).encode()+b'\\0'+content).hexdigest()!=expected_blob: raise ValueError('blob_hash')\n    bundle=json.loads(content);entries=bundle.get('files');seen=set();total=0;prepared=[]\n    if bundle.get('version')!=1 or not isinstance(entries,list) or not 1<=len(entries)<=10000: raise ValueError('bundle_schema')\n    for e in entries:\n        name=e['path'];parts=name.split('/')\n        if not re.fullmatch(r'[A-Za-z0-9_.\\-/]+',name) or any(p in ('','.','..','.git','.env','node_modules','raw','data') for p in parts) or name in seen or not name.endswith(('.mjs','.cjs','.js','.ts','.json','.py','.md')): raise ValueError('bundle_path')\n        data=e['contents'].encode('utf-8');total+=len(data)\n        if len(data)>8*1024**2 or total>16*1024**2 or hashlib.sha256(data).hexdigest()!=e['sha256']: raise ValueError('bundle_file_binding')\n        prepared.append((parts,data));seen.add(name)\n    destination.mkdir(mode=0o700)\n    # Only immutable hash-pinned controller-authored names enter this fresh private root.\n    for parts,data in prepared:\n        out=destination.joinpath(*parts);out.parent.mkdir(mode=0o700,parents=True,exist_ok=True)\n        fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)\n        try:\n            view=memoryview(data)\n            while view:\n                n=os.write(fd,view)\n                if n<=0: raise ValueError('bundle_short_write')\n                view=view[n:]\n        finally: os.close(fd)\n    return {'files':len(entries),'bytes':total,'gitBlob':expected_blob}\nif __name__=='__main__':\n    try: print(json.dumps(unpack(*sys.argv[1:]),separators=(',',':')))\n    except Exception:\n        print('{\"ok\":false,\"code\":\"frozen_bundle_unpack_failed\"}',file=sys.stderr);sys.exit(1)\nPY\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$OPERATIONAL_PACKAGE_BLOB\" > \"$RUNNER_TEMP/package-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/package-blob.json\" \"$OPERATIONAL_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/package\"\ngh api \"repos/jeep-jim/AvtoCena/git/blobs/$CONTROLLER_PACKAGE_BLOB\" > \"$RUNNER_TEMP/controller-blob.json\"\npython \"$RUNNER_TEMP/unpack-frozen.py\" \"$RUNNER_TEMP/controller-blob.json\" \"$CONTROLLER_PACKAGE_BLOB\" \"$RUNNER_TEMP/china-job/controller\"\n"
    - name: Install exact locked native toolchains without storage credentials
      run: 'set -euo pipefail

        test "$(node --version)" = v24.22.1

        npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.9.0

        export PATH="$RUNNER_TEMP/pinned-npm/node_modules/.bin:$PATH"

        echo "$RUNNER_TEMP/pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"

        test "$(npm --version)" = 11.9.0

        (cd publisher && npm ci)

        (cd runtime && npm ci)

        '
    - name: Refuse competing writers and verify exact terminal collection receipt
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/china-job"
        gh api --paginate --slurp 'repos/jeep-jim/AvtoCena/actions/runs?status=in_progress&per_page=100' > active-runs.json
        python - <<'PYRUN'
        import json,os
        pages=json.load(open('active-runs.json'))
        conflicts=[r['id'] for p in pages for r in p['workflow_runs'] if str(r['id'])!=os.environ['GITHUB_RUN_ID'] and any(x in (r.get('name','')+' '+r.get('path','')).lower() for x in ('regcloud','deploy','catalog','publication','restore','recovery','china'))]
        assert not conflicts,'competing_catalog_workflow'
        PYRUN
        gh api "repos/jeep-jim/AvtoCena/actions/runs/$CHINA_COLLECTOR_RUN" > producer-run.json
        gh api "repos/jeep-jim/AvtoCena/actions/artifacts/$CHINA_RECEIPT_ARTIFACT" > producer-artifact.json
        gh api "repos/jeep-jim/AvtoCena/actions/artifacts/$CHINA_RECEIPT_ARTIFACT/zip" > producer-receipt.zip
        python controller/verify-producer.py
    - name: Restore exact fresh complete archive before publication admission
      working-directory: publisher
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: node --import tsx "$RUNNER_TEMP/china-job/controller/restore-producer.mjs"
    - name: Bind exact package, toolchain, current request and resource ceilings
      run: 'set -euo pipefail

        python - <<''PY''

        import json,os,pathlib

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''china-job'';workspace=pathlib.Path(os.environ[''GITHUB_WORKSPACE''])

        request={''jobRoot'':str(root),''publisherRoot'':str(workspace/''publisher''),''runtimeRoot'':str(workspace/''runtime''),''packageDirectory'':str(root/''package''),''controllerDirectory'':str(root/''controller''),''expectedManifestSha256'':os.environ[''OPERATIONAL_MANIFEST_SHA256''],''runId'':os.environ[''GITHUB_RUN_ID''],''attempt'':os.environ[''GITHUB_RUN_ATTEMPT''],''revision'':os.environ[''GITHUB_SHA''],''receiptFile'':str(root/''producer-receipt.json'')}

        with (root/''request.json'').open(''x'') as f:json.dump(request,f)

        PY

        node "$RUNNER_TEMP/china-job/controller/materialize-job.mjs" "$RUNNER_TEMP/china-job/request.json" > "$RUNNER_TEMP/china-job/materialized.json"

        node "$RUNNER_TEMP/china-job/package/operational/production/runner-resources.mjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TEMP/china-job/evidence/startup-resources.json"

        cat "$RUNNER_TEMP/china-job/evidence/startup-resources.json"

        python - <<''PYRES''

        import json,os,pathlib

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''china-job'';c=json.load(open(root/''config.json''));r=json.load(open(root/''evidence''/''startup-resources.json''))

        m=r[''memory''];status=m[''cgroupMemoryStatus''];assert status in (''finite'',''unlimited''),''startup_cgroup_unverified''

        available=min(m[''availableBytes''],m[''cgroupMemoryAvailable''] if status==''finite'' else m[''availableBytes''])

        assert available>=c[''minMemoryBytes''],''startup_memory_refused''

        assert min(f[''availableBytes''] for f in r[''filesystems''].values())>=c[''minFreeDiskBytes''],''startup_disk_refused''

        print(''startup_resources_verified_no_storage_access'')

        PYRES

        '
    - name: Fresh prepare, audit, numeric readiness and guarded commit
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python - <<''PY''

        import json,os,pathlib,subprocess

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''china-job'';m=json.load(open(root/''materialized.json''))

        subprocess.run([''node'',str(root/''controller''/''run-bounded.mjs''),m[''planFile''],m[''planSha256'']],check=True)

        PY

        '
    - name: Verify live China catalog and sampled active and sold cards
      run: |
        set -euo pipefail
        export job="$RUNNER_TEMP/china-job"
        verified=false
        for attempt in 1 2 3; do
          if python "$job/controller/verify-live-china.py" --terminal "$job/work/terminal.json" > "$job/work/site-acceptance.json"; then
            verified=true; break
          fi
          [[ "$attempt" -eq 3 ]] || sleep 20
        done
        test "$verified" = true
        cat "$job/work/site-acceptance.json"
    - name: Advance only the China cursor after real site acceptance
      working-directory: publisher
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: |
        set -euo pipefail
        export job="$RUNNER_TEMP/china-job"
        node --import tsx "$job/controller/cursor-after-public.mjs" | tee "$job/work/cursor-acceptance.json"
    - name: Retain bounded allowlisted evidence, never raw source
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: china-fresh-commit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/china-job/evidence/*.json

          ${{ runner.temp }}/china-job/work/progress.jsonl

          ${{ runner.temp }}/china-job/work/terminal.json

