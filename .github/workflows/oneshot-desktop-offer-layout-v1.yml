name: One-shot desktop offer layout redesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-desktop-offer-layout-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update from current main
        run: git pull --ff-only origin main

      - name: Apply desktop offer redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gallery = Path('apps/web/components/catalog/VehicleGallery.tsx')
          text = gallery.read_text()

          old = '''  const didSwipe = useRef(false);\n  const activeSideThumb = useRef<HTMLButtonElement | null>(null);'''
          new = '''  const didSwipe = useRef(false);\n  const activeSideThumb = useRef<HTMLButtonElement | null>(null);\n  const mainImageButton = useRef<HTMLButtonElement | null>(null);\n  const lastWheelAt = useRef(0);'''
          assert text.count(old) == 1, 'gallery refs anchor changed'
          text = text.replace(old, new)

          old = '''  useEffect(() => {\n    activeSideThumb.current?.scrollIntoView({ block: "nearest", behavior: "smooth" });\n  }, [activeIndex]);'''
          new = '''  useEffect(() => {\n    activeSideThumb.current?.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });\n  }, [activeIndex]);\n\n  useEffect(() => {\n    const node = mainImageButton.current;\n    if (!node || cleanImages.length < 2) return;\n    const handleWheel = (event: WheelEvent) => {\n      if (window.innerWidth < 1280) return;\n      const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;\n      if (Math.abs(delta) < 1) return;\n      event.preventDefault();\n      const now = performance.now();\n      if (now - lastWheelAt.current < 135) return;\n      lastWheelAt.current = now;\n      if (delta > 0) next();\n      else previous();\n    };\n    node.addEventListener("wheel", handleWheel, { passive: false });\n    return () => node.removeEventListener("wheel", handleWheel);\n  }, [cleanImages.length]);'''
          assert text.count(old) == 1, 'gallery active thumb effect anchor changed'
          text = text.replace(old, new)

          old = '''  const thumbButton = (thumbnail: string, index: number, mode: "side" | "mobile") => ('''
          new = '''  const thumbButton = (thumbnail: string, index: number, mode: "side" | "mobile" | "desktop") => ('''
          assert text.count(old) == 1, 'thumb signature anchor changed'
          text = text.replace(old, new)

          old = '''      ref={mode === "side" && index === activeIndex ? activeSideThumb : undefined}'''
          new = '''      ref={(mode === "side" || mode === "desktop") && index === activeIndex ? activeSideThumb : undefined}'''
          assert text.count(old) == 1, 'thumb ref anchor changed'
          text = text.replace(old, new)

          old = '''      className={`relative w-full shrink-0 cursor-pointer overflow-hidden rounded-xl transition-opacity duration-200 ${\n        mode === "side" ? "h-[82px]" : "h-14 sm:h-16 md:h-24"\n      } ${index === activeIndex ? "opacity-100 ring-2 ring-red-500 ring-offset-2 ring-offset-transparent" : "opacity-55 hover:opacity-90"}`}'''
          new = '''      className={`relative w-full shrink-0 cursor-pointer overflow-hidden rounded-xl transition-opacity duration-200 ${\n        mode === "side" ? "h-[82px]" : mode === "desktop" ? "h-16" : "h-14 sm:h-16 md:h-24"\n      } ${index === activeIndex ? (mode === "desktop" ? "opacity-100" : "opacity-100 ring-2 ring-red-500 ring-offset-2 ring-offset-transparent") : "opacity-55 hover:opacity-90"}`}'''
          assert text.count(old) == 1, 'thumb class anchor changed'
          text = text.replace(old, new)

          old = '''        <div className={`min-w-0 ${cleanImages.length > 1 ? "md:grid md:grid-cols-[minmax(0,1fr)_104px] md:gap-3" : ""}`}>'''
          new = '''        <div className={`min-w-0 ${cleanImages.length > 1 ? "md:grid md:grid-cols-[minmax(0,1fr)_104px] md:gap-3 xl:block" : ""}`}>'''
          assert text.count(old) == 1, 'gallery desktop layout anchor changed'
          text = text.replace(old, new)

          old = '''          <button\n            type="button"\n            onClick={openFullscreen}'''
          new = '''          <button\n            ref={mainImageButton}\n            type="button"\n            onClick={openFullscreen}'''
          assert text.count(old) == 1, 'main image button anchor changed'
          text = text.replace(old, new)

          old = '''            {image}\n            <div className="ac-on-image absolute bottom-3 right-3 rounded-full bg-black/55 px-3 py-1 text-xs font-black text-white/85 backdrop-blur">\n              {activeIndex + 1} / {cleanImages.length}\n            </div>'''
          new = '''            {image}\n            {cleanImages.length > 1 ? <div className="pointer-events-none absolute bottom-4 left-8 right-24 hidden gap-2 xl:flex" aria-hidden="true">\n              {cleanImages.map((_, index) => <span key={`progress-${index}`} className={`h-[3px] min-w-0 flex-1 rounded-full ${index === activeIndex ? "bg-red-500" : "bg-white/85"}`} />)}\n            </div> : null}\n            <div className="ac-on-image absolute bottom-3 right-3 rounded-full bg-black/55 px-3 py-1 text-xs font-black text-white/85 backdrop-blur xl:bottom-4">\n              {activeIndex + 1} / {cleanImages.length}\n            </div>'''
          assert text.count(old) == 1, 'gallery progress anchor changed'
          text = text.replace(old, new)

          old = '''            <div className="ac-vehicle-side-thumbnails ac-hide-scrollbar hidden h-[520px] min-w-0 flex-col gap-2 overflow-y-auto py-1 pr-1 md:flex">'''
          new = '''            <div className="ac-vehicle-side-thumbnails ac-hide-scrollbar hidden h-[520px] min-w-0 flex-col gap-2 overflow-y-auto py-1 pr-1 md:flex xl:hidden">'''
          assert text.count(old) == 1, 'side thumbs anchor changed'
          text = text.replace(old, new)

          old = '''        {cleanImages.length > 1 ? (\n          <div className="ac-vehicle-thumbnails ac-hide-scrollbar -mr-4 mt-3 grid max-w-[calc(100%+1rem)] grid-flow-col auto-cols-[3.75rem] gap-2 overflow-x-auto p-1 pb-2 pr-4 sm:auto-cols-[4.5rem] md:hidden">\n            {cleanImages.map((thumbnail, index) => thumbButton(thumbnail, index, "mobile"))}\n          </div>\n        ) : null}'''
          new = '''        {cleanImages.length > 1 ? <>\n          <div className="ac-vehicle-thumbnails ac-hide-scrollbar -mr-4 mt-3 grid max-w-[calc(100%+1rem)] grid-flow-col auto-cols-[3.75rem] gap-2 overflow-x-auto p-1 pb-2 pr-4 sm:auto-cols-[4.5rem] md:hidden">\n            {cleanImages.map((thumbnail, index) => thumbButton(thumbnail, index, "mobile"))}\n          </div>\n          <div className="relative mt-3 hidden xl:block">\n            <div className="ac-vehicle-desktop-thumbnails ac-hide-scrollbar grid grid-flow-col auto-cols-[78px] gap-3 overflow-x-auto px-1 pb-1 pr-14">\n              {cleanImages.map((thumbnail, index) => thumbButton(thumbnail, index, "desktop"))}\n            </div>\n            <button type="button" onClick={next} className="absolute right-0 top-1/2 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full bg-black/38 text-white backdrop-blur transition hover:bg-black/55" aria-label="Следующее фото">\n              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" /></svg>\n            </button>\n          </div>\n        </> : null}'''
          assert text.count(old) == 1, 'mobile thumbs block anchor changed'
          text = text.replace(old, new)
          gallery.write_text(text)

          actions = Path('apps/web/components/catalog/OfferContactActions.tsx')
          text = actions.read_text()
          old = '''function ActionButtons({ className = "" }: { className?: string }) {'''
          new = '''function ActionButtons({ className = "", stacked = false }: { className?: string; stacked?: boolean }) {'''
          assert text.count(old) == 1, 'actions signature anchor changed'
          text = text.replace(old, new)

          old = '''    <div className={`grid grid-cols-2 gap-3 md:gap-4 ${className}`}>'''
          new = '''    <div className={`grid ${stacked ? "grid-cols-1 gap-3" : "grid-cols-2 gap-3 md:gap-4"} ${className}`}>'''
          assert text.count(old) == 1, 'actions grid anchor changed'
          text = text.replace(old, new)

          old = '''      const mediaColumn = grid?.children?.[0] as HTMLElement | undefined;\n\n      if (!page || !section || !grid || !mediaColumn) {'''
          new = '''      const mediaColumn = grid?.children?.[0] as HTMLElement | undefined;\n      const desktopSlot = page?.querySelector<HTMLElement>("[data-offer-desktop-actions-slot]");\n\n      if (!page || !section || !grid || !mediaColumn) {'''
          assert text.count(old) == 1, 'desktop slot lookup anchor changed'
          text = text.replace(old, new)

          old = '''      mediaColumn.appendChild(desktopHost);'''
          new = '''      (desktopSlot || mediaColumn).appendChild(desktopHost);'''
          assert text.count(old) == 1, 'desktop host anchor changed'
          text = text.replace(old, new)

          old = '''      {hosts.desktop ? createPortal(<ActionButtons className="mt-5 hidden xl:grid" />, hosts.desktop) : null}'''
          new = '''      {hosts.desktop ? createPortal(<ActionButtons stacked className="mt-4 hidden xl:grid" />, hosts.desktop) : null}'''
          assert text.count(old) == 1, 'desktop action portal anchor changed'
          text = text.replace(old, new)
          actions.write_text(text)

          page = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          text = page.read_text()
          old = '''                <span className="mt-1 block xl:whitespace-nowrap">Возможность покупки и финальную стоимость под ключ подтвердит менеджер.</span>\n              </p>\n            </div>\n          </aside>'''
          new = '''                <span className="mt-1 block xl:whitespace-nowrap">Возможность покупки и финальную стоимость под ключ подтвердит менеджер.</span>\n              </p>\n            </div>\n            <div data-offer-desktop-actions-slot className="hidden xl:block" />\n          </aside>'''
          assert text.count(old) == 1, 'offer desktop action slot anchor changed'
          text = text.replace(old, new)
          page.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Verify and publish
        run: |
          grep -q 'data-offer-desktop-actions-slot' 'apps/web/app/(public)/cars/offer/[id]/page.tsx'
          grep -q 'lastWheelAt' apps/web/components/catalog/VehicleGallery.tsx
          grep -q 'ac-vehicle-desktop-thumbnails' apps/web/components/catalog/VehicleGallery.tsx
          grep -q 'stacked className="mt-4 hidden xl:grid"' apps/web/components/catalog/OfferContactActions.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/catalog/VehicleGallery.tsx apps/web/components/catalog/OfferContactActions.tsx 'apps/web/app/(public)/cars/offer/[id]/page.tsx'
          git rm .github/workflows/oneshot-desktop-offer-layout-v1.yml
          git commit -m 'Redesign desktop offer gallery and details layout'
          git pull --rebase origin main
          git push origin main
