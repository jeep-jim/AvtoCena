name: TEMP apply 2026 utilization table

on:
  push:
    branches:
      - fix/russia-utilization-2026-coefficients-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/russia-utilization-2026-coefficients-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply table correction
        run: python scripts/zz-fix-2026-utilization-table.py
      - name: Align corrected 2026 regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/russia-customs.test.ts')
          text = path.read_text()
          swaps = {
            'assert.equal(utilizationPowerKw, 223.59);': 'assert.equal(utilizationPowerKw, 223.59162);',
            'assert.equal(result.utilizationPowerKw, 223.59);': 'assert.equal(result.utilizationPowerKw, 223.59162);',
            'assert.equal(result.utilizationCoefficient, 54.52);': 'assert.equal(result.utilizationCoefficient, 49.56);',
            'assert.equal(result.totalCustomsRub, 1_620_324);': 'assert.equal(result.totalCustomsRub, 1_521_124);',
          }
          for old, new in swaps.items():
            if old not in text:
              raise SystemExit(f'missing expected literal: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run customs tests
        run: node --import tsx --test tests/russia-customs.test.ts
      - name: Commit correction and remove temporary helpers
        shell: bash
        run: |
          git rm .github/workflows/zz-temp-fix-2026-utilization-table.yml
          git rm .github/workflows/zz-temp-fix-2026-utilization-push.yml
          git rm scripts/zz-fix-2026-utilization-table.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/engine/src/calculation/russiaCustoms.ts tests/russia-customs.test.ts
          git commit -m 'Use official 2026 utilization coefficients'
          git push origin HEAD:fix/russia-utilization-2026-coefficients-20260825
