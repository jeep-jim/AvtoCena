name: Diagnose Dongchedi current payload
on:
  push:
    branches: [fix/catalog-shards-preliminary-20260810]
    paths: [.github/workflows/diag-dongchedi-current.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current public Dongchedi pages
        shell: bash
        run: |
          node <<'NODE'
          const headers={
            accept:'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
            'accept-language':'zh-CN,zh;q=0.9,en;q=0.7',
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
            referer:'https://www.dongchedi.com/'
          };
          const urls=[
            'https://www.dongchedi.com/usedcar',
            'https://www.dongchedi.com/usedcar?city_name=%E5%85%A8%E5%9B%BD',
            'https://www.dongchedi.com/auto/library/x-x-x-x-x-x-x-x-x-x-x',
          ];
          const snip=(t,n,r=350)=>{const i=t.indexOf(n);return i<0?'':t.slice(Math.max(0,i-r),i+n.length+r).replace(/\s+/g,' ')};
          for(const url of urls){
            const r=await fetch(url,{headers,redirect:'follow'}); const text=await r.text();
            const hrefs=[...text.matchAll(/href=["']([^"']+)["']/gi)].map(m=>m[1]);
            const used=hrefs.filter(x=>/usedcar|ershou|auto\/series|car\//i.test(x)).slice(0,80);
            const scripts=[...text.matchAll(/<script[^>]*(?:src=["']([^"']+)["'])?[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>({src:m[1]||'',body:(m[2]||'').slice(0,400)}));
            const keys=[...new Set([...text.matchAll(/"([A-Za-z_][A-Za-z0-9_]{2,40})"\s*:/g)].map(m=>m[1]))].filter(k=>/car|vehicle|list|price|series|used|info|data|feed/i.test(k)).slice(0,120);
            const api=[...new Set([...text.matchAll(/(?:https?:)?\\?\/\\?\/[^"'\s<>]+/gi)].map(m=>m[0].replaceAll('\\/','/')).filter(x=>/api|motor|dongchedi|byte|snssdk/i.test(x)))].slice(0,100);
            console.log(JSON.stringify({url,status:r.status,final:r.url,bytes:text.length,title:snip(text,'<title'),usedLinks:used,keys,api,snippets:{next:snip(text,'__NEXT_DATA__'),usedcar:snip(text,'usedcar'),carList:snip(text,'car_list'),price:snip(text,'price'),series:snip(text,'series_id'),motor:snip(text,'motor')},scriptSrc:scripts.map(x=>x.src).filter(Boolean).slice(-30)},null,2));
          }
          NODE
