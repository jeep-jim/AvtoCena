name: Probe MIIT public query contract

on:
  push:
    branches:
      - fix/catalog-core-recovery-20260822
    paths:
      - scripts/catalog-probe-miit-query-contract.mjs
      - .github/workflows/knowledge-miit-query-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-miit-query-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-core-recovery-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/catalog-probe-miit-query-contract.mjs
      - name: Commit discovered public contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/catalog-core-recovery-20260822
          git rebase origin/fix/catalog-core-recovery-20260822
          git add data/catalog/knowledge-source-snapshots/generated/miit/contract
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe MIIT public product query contract"
          git push origin HEAD:fix/catalog-core-recovery-20260822
