# Inspect exact image ownership and all-container references before any cleanup.
name: Inspect failed photo release disk - read only
on:
  push:
    branches: [main]
    paths: [.github/workflows/catalog-next-photo-disk-20261125.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-next-photo-disk-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read bounded disk, rollback and mount evidence
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' 'fd37f98aab3eeb16f131fcd4033adbb56f7e9616208c2f1ab5ef7a446caa4e4c  docs/operations/regcloud-staging-known-hosts' | sha256sum --check --status
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -F /dev/null -T -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 '/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B -' < scripts/catalog-next/diagnose-photo-disk-20261125.py | tee photo-release-disk-report.json
      - name: Preserve aggregate inventory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-release-disk-readonly
          path: photo-release-disk-report.json
          if-no-files-found: ignore
          retention-days: 14
