name: Catalog source smoke · Korea · Encar · 1 card
run-name: Encar one-card smoke · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [codex-encar-one-card-smoke]
    paths:
      - .github/workflows/catalog-v2-korea-smoke10.yml

# The push trigger is temporary and limited to this isolated test branch.
# This workflow never publishes the production catalog.
permissions:
  contents: read

concurrency:
  group: catalog-source-smoke-encar-one-card
  cancel-in-progress: true

jobs:
  smoke:
    name: Parse and verify one real Encar card
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSON_STORAGE_DRIVER: local
      CATALOG_SOURCE_TIMEOUT_MS: "30000"
      CATALOG_ENCAR_DIRECT_PAGE_SIZE: "20"
      CATALOG_ENCAR_DIRECT_LIST_RPM: "30"
      CATALOG_ENCAR_DIRECT_DETAIL_RPM: "30"
      CATALOG_ENCAR_DIRECT_IMAGE_RPM: "60"
      CATALOG_MAX_IMAGES_PER_OFFER: "3"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
      CATALOG_GALLERY_FAST_PATH: "false"
      ENCAR_SMOKE_MAX_PAGES: "3"
      ENCAR_SMOKE_MAX_CANDIDATES: "12"
      ENCAR_SMOKE_REPORT: encar-one-card-smoke-report.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Parse one complete Encar card without knowledge data
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {
            extractEncarImageUrls,
            normalizeEncarPrice,
          } from './apps/web/lib/catalog/adapters.ts';
          import { EncarCompleteAdapter } from './apps/web/lib/catalog/encar-complete-source.ts';

          const reportFile = process.env.ENCAR_SMOKE_REPORT || 'encar-one-card-smoke-report.json';
          const maxPages = Math.max(1, Number(process.env.ENCAR_SMOKE_MAX_PAGES || 3));
          const maxCandidates = Math.max(1, Number(process.env.ENCAR_SMOKE_MAX_CANDIDATES || 12));

          function text(value) {
            return value == null ? '' : String(value).trim();
          }

          function positiveNumber(value) {
            const number = Number(String(value ?? '').replace(/[^0-9.]/g, ''));
            return Number.isFinite(number) && number > 0 ? number : null;
          }

          function deepFind(value, keys, depth = 0) {
            if (value == null || depth > 10 || typeof value !== 'object') return undefined;
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = deepFind(item, keys, depth + 1);
                if (found !== undefined && found !== null && text(found)) return found;
              }
              return undefined;
            }
            for (const key of keys) {
              const direct = value[key];
              if (direct !== undefined && direct !== null && text(direct)) return direct;
            }
            for (const child of Object.values(value)) {
              const found = deepFind(child, keys, depth + 1);
              if (found !== undefined && found !== null && text(found)) return found;
            }
            return undefined;
          }

          function rawYear(raw) {
            const value = text(raw?.FormYear || raw?.Year || raw?.YearMonth).slice(0, 4);
            const year = Number(value);
            return Number.isInteger(year) && year >= 1980 && year <= new Date().getFullYear() + 1 ? year : null;
          }

          function candidateSummary(offer, checks, error = '') {
            return {
              sourceOfferId: offer?.sourceOfferId || null,
              sourceUrl: offer?.operational?.sourceUrl || null,
              make: offer?.make || null,
              model: offer?.model || null,
              checks,
              error,
            };
          }

          const adapter = new EncarCompleteAdapter();
          const attempts = [];
          let cursor = null;
          let pagesScanned = 0;
          let candidatesScanned = 0;
          let selected = null;
          let fatalError = '';

          try {
            for (let pageIndex = 0; pageIndex < maxPages && candidatesScanned < maxCandidates && !selected; pageIndex++) {
              const page = await adapter.fetchPage(cursor);
              pagesScanned += 1;

              for (const raw of page.items || []) {
                if (candidatesScanned >= maxCandidates || selected) break;
                candidatesScanned += 1;

                const offer = adapter.normalizeOffer(raw);
                if (!offer) {
                  attempts.push({ sourceOfferId: text(raw?.Id || raw?.CarId || raw?.carId) || null, error: 'normalize_offer_returned_null' });
                  continue;
                }

                const prechecks = {
                  hasIdentity: Boolean(offer.sourceOfferId && offer.make && offer.model),
                  hasPrice: Number(offer.sourcePrice || 0) > 0,
                  hasYear: Number(offer.year || 0) > 0,
                  hasMileage: Number(offer.mileageKm || 0) > 0,
                  hasSourceUrl: Boolean(offer.operational?.sourceUrl),
                };

                if (!Object.values(prechecks).every(Boolean)) {
                  attempts.push(candidateSummary(offer, prechecks, 'listing_required_fields_missing'));
                  continue;
                }

                try {
                  const images = await adapter.fetchImages(offer);
                  offer.images = images;

                  const nestedRaw = offer.operational?.raw || {};
                  const listing = nestedRaw.offer || raw;
                  const detail = nestedRaw.detail || {};
                  const detailVehicle = detail.vehicle || detail.Vehicle || detail;
                  const exactPower = positiveNumber(deepFind(detailVehicle, ['power', 'Power', 'horsePower', 'horsepower', 'ps']))
                    || positiveNumber(listing?.power || listing?.Power);
                  const exactEngineCc = positiveNumber(deepFind(detailVehicle, ['displacement', 'Displacement', 'EngineDisplacement', 'engineDisplacement', 'cc']))
                    || positiveNumber(listing?.displacement || listing?.Displacement);
                  const expectedPrice = normalizeEncarPrice(listing?.Price);
                  const expectedYear = rawYear(listing);
                  const expectedMileage = positiveNumber(listing?.Mileage);
                  const sourceImageUrls = extractEncarImageUrls(offer, detail);
                  const imageKeys = images.map((image) => text(image.checksum || image.id || image.objectKey || image.url)).filter(Boolean);

                  const checks = {
                    sourceIsEncar: offer.sourceId === 'encar_direct' && offer.market === 'korea',
                    sourceUrlMatchesCard: offer.operational?.sourceUrl === `https://fem.encar.com/cars/detail/${offer.sourceOfferId}`,
                    priceMatchesSource: expectedPrice !== null && Number(offer.sourcePrice) === Number(expectedPrice) && offer.sourceCurrency === 'KRW',
                    yearMatchesSource: expectedYear !== null && Number(offer.year) === expectedYear,
                    mileageMatchesSource: expectedMileage !== null && Number(offer.mileageKm) === expectedMileage,
                    powerExistsInSource: exactPower !== null,
                    powerMatchesSource: exactPower !== null && Number(offer.powerHp) === Number(exactPower),
                    sourceImageUrlsFound: sourceImageUrls.length > 0,
                    cachedImagesFound: images.length > 0,
                    cachedImagesUnique: imageKeys.length === images.length && new Set(imageKeys).size === images.length,
                    cachedImagesHaveBytes: images.length > 0 && images.every((image) => Number(image.size || 0) > 8_000),
                  };

                  if (!Object.values(checks).every(Boolean)) {
                    attempts.push(candidateSummary(offer, checks, 'complete_card_contract_not_met'));
                    continue;
                  }

                  selected = {
                    sourceId: offer.sourceId,
                    sourceOfferId: offer.sourceOfferId,
                    sourceUrl: offer.operational?.sourceUrl,
                    make: offer.make,
                    model: offer.model,
                    trim: offer.trim || null,
                    year: offer.year,
                    productionDate: offer.productionDate || null,
                    sourcePrice: offer.sourcePrice,
                    sourceCurrency: offer.sourceCurrency,
                    mileageKm: offer.mileageKm,
                    powerHp: offer.powerHp,
                    engineCc: offer.engineCc || exactEngineCc || null,
                    fuel: offer.fuel || null,
                    transmission: offer.transmission || null,
                    drive: offer.drive || null,
                    bodyType: offer.bodyType || null,
                    imageCount: images.length,
                    images: images.map((image, index) => ({
                      index: index + 1,
                      sourceUrl: sourceImageUrls[index] || null,
                      objectKey: image.objectKey,
                      mimeType: image.mimeType,
                      size: image.size,
                      checksum: image.checksum,
                    })),
                    checks,
                    provenance: {
                      price: 'Encar listing Price',
                      year: 'Encar listing FormYear/Year/YearMonth',
                      mileage: 'Encar listing Mileage',
                      power: 'Encar vehicle detail power/Power/horsePower/horsepower/ps',
                      photos: 'Encar listing/detail image paths',
                      knowledgeDatabaseUsed: false,
                    },
                  };
                } catch (error) {
                  attempts.push(candidateSummary(offer, {}, error instanceof Error ? error.message : String(error)));
                }
              }

              cursor = page.nextCursor || null;
              if (!cursor || page.finished) break;
            }
          } catch (error) {
            fatalError = error instanceof Error ? error.message : String(error);
          }

          const report = {
            version: 1,
            checkedAt: new Date().toISOString(),
            mode: 'one_real_source_card_no_knowledge_no_publication',
            market: 'korea',
            sourceId: 'encar_direct',
            passed: Boolean(selected),
            pagesScanned,
            candidatesScanned,
            selected,
            attempts: attempts.slice(0, 30),
            fatalError,
          };

          await fs.writeFile(reportFile, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));

          if (process.env.GITHUB_STEP_SUMMARY) {
            const lines = selected
              ? [
                  '### Encar one-card smoke: ✅ passed',
                  '',
                  `- Card: [${selected.make} ${selected.model}](${selected.sourceUrl})`,
                  `- Year: **${selected.year}**`,
                  `- Price: **${selected.sourcePrice} ${selected.sourceCurrency}**`,
                  `- Mileage: **${selected.mileageKm} km**`,
                  `- Power: **${selected.powerHp} hp**`,
                  `- Images: **${selected.imageCount}**`,
                  `- Scanned: **${candidatesScanned} cards / ${pagesScanned} pages**`,
                  '- Knowledge database: **not used**',
                  '- Production catalog: **not published**',
                ]
              : [
                  '### Encar one-card smoke: ❌ failed',
                  '',
                  `- Scanned: **${candidatesScanned} cards / ${pagesScanned} pages**`,
                  `- Fatal error: \`${fatalError || 'none'}\``,
                  '- See the uploaded JSON report for candidate-level checks.',
                ];
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          }

          if (!selected) process.exit(1);
          NODE

      - name: Upload source-card report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encar-one-card-smoke-report
          path: encar-one-card-smoke-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
