        }\nPAYLOAD_EOF\ntest \"$(sha256sum 'archive-code/bounded-archive-restore.mjs' | cut -d' ' -f1)\" =\
        \ 17b6707ac0b2cadad8f05047c7c3e447633597eb0603ca8d0ff7fff483904fda\ncat > 'archive-code/prepare-native-archive.mjs'\
        \ <<'PAYLOAD_EOF'\n/** Offline China source admission using the existing pinned native archive validator\
