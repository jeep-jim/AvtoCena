        \  if(allowed.has(key)&&x.status===200&&(forStorage.tally.uniqueArchivePartCount%100===0||forStorage.tally.uniqueArchivePartCount===shape.parts))\n\
        \   console.log(JSON.stringify({stage:'archive_part_download',parts:forStorage.tally.uniqueArchivePartCount,totalParts:shape.parts,wireBytes:forStorage.tally.partWireBytes}));\n\
