        \   for(const f of m.files)for(const p of f.parts)allowed.add(p.key);\n   acceptedManifest=true;console.log(JSON.stringify({stage:'verified_archive_manifest',files:shape.files,parts:shape.parts,restoredBytes:shape.decoded,manifestWireBytes:x.body.length,receiptBytes:receiptBytes.length,reportBytes:declared.bytes,reportParts:declared.parts}));\n\
