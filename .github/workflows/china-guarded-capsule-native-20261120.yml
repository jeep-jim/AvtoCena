name: Check actual China overlaps and native retention before V2
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/china-guarded-capsule-native-20261120.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: china-guarded-capsule-native-20261120
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref ==
      'refs/heads/main' && github.run_attempt == '1' && github.event.before == '91b124dcf327c798a5ee85f7322c1291d5918ba3'
      && github.event.head_commit.message == 'Check actual China overlaps and native retention before V2'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
    - uses: actions/checkout@v4
      with:
        ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
        path: publisher
        persist-credentials: false
        sparse-checkout: 'scripts/lib

          scripts/publisher-runtime83

          apps/web/lib

          packages/engine/src

          data/catalog

          '
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Observe actual runner resources, do not qualify full restore
      run: 'set -euo pipefail

        python - <<''PY''

        import os,json

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])

        v=os.statvfs(p)

        cg=Path(''/sys/fs/cgroup/memory.max'')

        m=cg.read_text().strip() if cg.is_file() else None

        free=v.f_bavail*v.f_frsize

        print(json.dumps({''observedRunnerTempFreeBytes'':free,''start48GiBRequirementMet'':free>=48*(1024**3),''observedPhysicalMemoryBytes'':os.sysconf(''SC_PHYS_PAGES'')*os.sysconf(''SC_PAGE_SIZE''),''visibleCgroupMemoryMaxBytes'':int(m)
        if m and m.isdigit() else None,''runnerTempDedicatedMountObserved'':os.path.ismount(p),''hardJobDiskQuotaProven'':False,''hardOwnedProcessCgroupProven'':False,''fullRestoreQualified'':False}))

        PY

        '
    - name: Authenticate exact small receipt against completed collector
      env:
        CHINA_COLLECTOR_RUN: '44457059256'
        CHINA_COLLECTOR_ATTEMPT: '1'
        CHINA_COLLECTOR_REVISION: 038574d914de2436cd10871629b1b0a8fe83a92c
        CHINA_RECEIPT_ARTIFACT: '14500964905'
        CHINA_RECEIPT_ZIP_SHA256: c0802faab0b9ecc39e6d44b53d66f76c19cac485258f5ed2c80e5c2b59ac8097
        CHINA_EXPECTED_ARCHIVE_SHA256: b8a2a25dc27390845dd5a423efa323c9472a338b1b97f413ba96aefa7f3b65ca
        CHINA_EXPECTED_REPORT_DIGEST: 894bb1eb1b37042de7ce611e19d8e33bfd58c01546d2a812f2c87f96cd906caf
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\numask 077\ntest \"$(git -C publisher rev-parse HEAD)\" = bb6317bffd1f7b1832681ac78378fe6c3e39e3b5\n\
        mkdir -m 0700 \"$RUNNER_TEMP/china-job\"\ncd \"$RUNNER_TEMP/china-job\"\ngh api repos/jeep-jim/AvtoCena/actions/runs/44457059256\
        \ > producer-run.json\ngh api repos/jeep-jim/AvtoCena/actions/artifacts/14500964905 > producer-artifact.json\n\
        gh api repos/jeep-jim/AvtoCena/actions/artifacts/14500964905/zip > producer-receipt.zip\npython -\
        \ <<'VERIFY'\n#!/usr/bin/env python3\n\"\"\"Bind the small durable receipt to a terminal existing\
        \ collect-only Actions job.\"\"\"\nimport hashlib,json,os,pathlib,re,stat,sys,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'china-job'\n\
        run=json.loads((root/'producer-run.json').read_text())\nmeta=json.loads((root/'producer-artifact.json').read_text())\n\
        def require(ok):\n if not ok: raise SystemExit('fresh_china_producer_binding_refused')\nvid=os.environ['CHINA_COLLECTOR_REVISION'];rid=int(os.environ['CHINA_COLLECTOR_RUN']);att=int(os.environ['CHINA_COLLECTOR_ATTEMPT'])\n\
        aid=int(os.environ['CHINA_RECEIPT_ARTIFACT']);expected_zip=os.environ['CHINA_RECEIPT_ZIP_SHA256']\n\
        require(re.fullmatch('[a-f0-9]{40}',vid) and re.fullmatch('[a-f0-9]{64}',expected_zip))\nrequire(run.get('id')==rid\
        \ and run.get('run_attempt')==att and run.get('head_sha')==vid and run.get('head_branch')=='main'\n\
        \ and run.get('status')=='completed' and run.get('conclusion')=='success' and run.get('event')=='push'\n\
        \ and run.get('path')=='.github/workflows/collect-china-ordinary-20261119.yml'\n and run.get('repository',{}).get('full_name')=='jeep-jim/AvtoCena')\n\
        repo_id=run['repository']['id'];require(repo_id==1289722938);w=meta.get('workflow_run',{})\narchive=root/'producer-receipt.zip'\n\
        require(meta.get('id')==aid and meta.get('expired') is False and meta.get('digest')=='sha256:'+expected_zip\n\
        \        and meta.get('name')==f'china-collection-receipt-{rid}-{att}'\n        and w.get('id')==rid\
        \ and w.get('head_sha')==vid and w.get('head_branch')=='main'\n        and w.get('repository_id')==repo_id\
        \ and w.get('head_repository_id')==repo_id\n        and 0<meta.get('size_in_bytes',0)<=32768\n   \
        \     and archive.stat().st_size==meta['size_in_bytes'] and hashlib.sha256(archive.read_bytes()).hexdigest()==expected_zip)\n\
        with zipfile.ZipFile(archive) as z:\n infos=z.infolist()\n require(len(infos)==1 and infos[0].filename=='own-storage-receipt.json'\
        \ and not infos[0].is_dir()\n         and 0<infos[0].file_size<=32768 and stat.S_IFMT(infos[0].external_attr>>16)\
        \ in (0,stat.S_IFREG))\n data=z.read(infos[0])\nreceipt=json.loads(data);rootkey=f'catalog/nonjp-intake/v1/china/{rid}/{att}'\n\
        require(receipt.get('version')==1 and receipt.get('market')=='china' and receipt.get('root')==rootkey\n\
        \        and receipt.get('owner')=={'runId':str(rid),'attempt':str(att),'revision':vid}\n        and\
        \ receipt.get('manifestSha256')==os.environ['CHINA_EXPECTED_ARCHIVE_SHA256']\n        and receipt.get('reportDigest')==os.environ['CHINA_EXPECTED_REPORT_DIGEST'])\n\
        with (root/'producer-receipt.json').open('xb') as f: f.write(data)\nprint('exact_terminal_collect_only_receipt_verified')\n\
        VERIFY\ntest \"$(sha256sum producer-receipt.json | cut -d' ' -f1)\" = 174893f63c5870628a3df1ab3a5241fe49847f01fa579a84d80a369383c3c49a\n"
    - name: Restore only verified China archive and qualify native local input under hard bounds
      env:
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      run: "set -euo pipefail\numask 077\nroot=\"$RUNNER_TEMP/china-job\"\ncd \"$root\"\nmkdir -m 0700 archive-code\n\
        mkdir -pm 0700 candidate-final/producer/operational/upstream/flow/input\nmkdir -pm 0700 candidate-final/producer/operational/upstream/flow/input\n\
        cat > 'archive-code/guarded-capsule-runner.mjs' <<'PAYLOAD_EOF'\n/** One-shot manifest-pinned archive\
        \ restore and native local input admission. No writes to storage. */\nimport fs from 'node:fs/promises';import\
        \ path from 'node:path';import {createHash,createHmac} from 'node:crypto';import {pathToFileURL} from\
        \ 'node:url';\nimport {actual,prepare,declareNativeArchiveReport} from './prepare-native-archive.mjs';import\
        \ {restoreViaBoundedReads} from './bounded-archive-restore.mjs';\nconst G=1024**3,M=1024**2,ownedMax=64*G,memMax=10*G,pinPath='catalog/raw-feed-pins/v1/nonjp-intake-china-44457059256-1.json',manifestPath=actual.archiveRoot+'/complete.json';\n\
        const policy='catalog/raw-feed-coordination/v1/policy.json',state='catalog/raw-feed-coordination/v1/state.json';\n\
        const shape=Object.freeze({files:582,parts:1758,decoded:2760633543,partWire:386094361});\nconst sourceExpiry=Date.parse(actual.completedAt)+48*3600000;\n\
        const hash=b=>createHash('sha256').update(b).digest('hex'),hmac=(k,s)=>createHmac('sha256',k).update(s).digest(),digest=v=>hash(JSON.stringify(v));\n\
        const need=(b,s)=>{if(!b)throw Error('guarded_capsule_'+s);};\nexport function scopeGet({access,secret,manifestParts,currentTime=Date.now,fetchImpl=globalThis.fetch,known=shape}){\n\
        \ need(typeof access==='string'&&/^[a-zA-Z0-9_+=./-]{1,256}$/.test(access)&&typeof secret==='string'&&secret.length>0&&secret.length<=1024&&!/[\\\
        r\\n\\x00]/.test(secret),'credentials');\n const controls=new Set([pinPath,manifestPath,policy,state]),tally={uniqueArchivePartCount:0,partWireBytes:0},seen=new\
        \ Set();\n const host='s3.regru.cloud',base='/avtocena-staging-8120751/migration-staging/full-20261011/';\n\
        \ return Object.freeze({tally,async get(key,limit){\n  const p=manifestParts.has(key),control=controls.has(key),now=currentTime();\n\
        \  need((p!==control)&&!seen.has(key)&&/^[a-zA-Z0-9_./-]{1,700}$/.test(key)&&key.split('/').every(x=>x&&x!=='.'&&x!=='..')&&Number.isSafeInteger(limit)&&limit>0&&limit<=8*M&&now>=Date.parse(actual.completedAt)&&now<sourceExpiry,'request_scope');\n\
        \  if(p){seen.add(key);need(++tally.uniqueArchivePartCount<=known.parts,'part_count');}\n  const pathname=base+key,dateTime=new\
        \ Date(now).toISOString().replace(/[:-]|\\.\\d{3}/g,''),day=dateTime.slice(0,8),scope=day+'/us-east-1/s3/aws4_request';\n\
        \  const headers={host,'x-amz-content-sha256':hash(''),'x-amz-date':dateTime},names=Object.keys(headers).sort();\n\
        \  const req=['GET',pathname,'',names.map(k=>k+':'+headers[k]+'\\n').join(''),names.join(';'),hash('')].join('\\\
        n'),sign=hmac(hmac(hmac(hmac('AWS4'+secret,day),'us-east-1'),'s3'),'aws4_request');\n  headers.authorization='AWS4-HMAC-SHA256\
        \ Credential='+access+'/'+scope+', SignedHeaders='+names.join(';')+', Signature='+createHmac('sha256',sign).update(['AWS4-HMAC-SHA256',dateTime,scope,hash(req)].join('\\\
        n')).digest('hex');\n  const result=await fetchImpl('https://'+host+pathname,{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(Math.min(30000,Math.max(1,sourceExpiry-now)))});\n\
        \  if(result.status===404){await result.body?.cancel();return{status:404};}\n  const n=Number(result.headers.get('content-length'));\n\
        \  if(result.status!==200||!Number.isSafeInteger(n)||n<=0||n>limit||result.headers.get('content-encoding')){await\
        \ result.body?.cancel();throw Error('guarded_capsule_response');}\n  if(p){tally.partWireBytes+=n;need(tally.partWireBytes<=known.partWire,'wire_cap');}\n\
        \  const b=Buffer.alloc(n);let read=0;\n  for await(const chunk of result.body){need(read+chunk.length<=n,'body_cap');b.set(chunk,read);read+=chunk.length;}\n\
        \  need(read===n&&currentTime()<sourceExpiry,'body_size_or_expired');\n  return {status:200,body:b};\n\
        \ }});\n}\nasync function assertSandbox(scratch,minimumFree=2*G){\n const group=(await fs.readFile('/proc/self/cgroup','utf8')).match(/^0::(\\\
        /system\\.slice\\/china-capsule-[0-9]+-[0-9]+\\.service)$/m);\n need(group,'cgroup_identity');const\
        \ root='/sys/fs/cgroup'+group[1];\n const [memory,swap,mounts,p]=await Promise.all(['/memory.max','/memory.swap.max'].map(x=>fs.readFile(root+x,'utf8')).concat(fs.readFile('/proc/self/mountinfo','utf8'),fs.statfs(scratch,{bigint:true})));\n\
        \ need(memory.trim()===String(memMax)&&swap.trim()==='0','cgroup_hard_limits');\n need(path.isAbsolute(scratch)&&await\
        \ fs.realpath(scratch)===scratch&&mounts.split('\\n').some(l=>{const f=l.split(' ');return f[4]===scratch&&l.includes('\
        \ - ext4 /dev/loop')&&/\\brw\\b/.test(f[5])&&f[5].split(',').includes('nodev')&&f[5].split(',').includes('nosuid')&&f[5].split(',').includes('noexec');}),'scratch_hard_mount');\n\
        \ need(p.blocks*p.bsize>0n&&p.blocks*p.bsize<=BigInt(ownedMax)&&p.bavail*p.bsize>=BigInt(minimumFree),'scratch_hard_size');\n\
        }\nasync function main(){\n need(process.argv.length===6,'args');\n const [nativeRoot,receiptFile,secretFile,scratch]=process.argv.slice(2);\n\
        \ await assertSandbox(scratch,18*G);\n const secretStat=await fs.lstat(secretFile);need(secretStat.isFile()&&secretStat.nlink===1&&secretStat.size<=4096&&(secretStat.mode&0o077)===0,'secret_file_scope');\n\
        \ const {access,secret}=JSON.parse(await fs.readFile(secretFile,'utf8'));\n const receiptBytes=await\
        \ fs.readFile(receiptFile),receipt=JSON.parse(receiptBytes);need(receiptBytes.length===884&&hash(receiptBytes)===actual.receiptSha256,'receipt');\n\
        \ const load=f=>import(pathToFileURL(path.join(nativeRoot,f)));\n const native=await load('scripts/lib/nonjp-intake-archive.mjs');\n\
        \ const allowed=new Set(),forStorage=scopeGet({access,secret,manifestParts:allowed}),nativeFetch=globalThis.fetch;\n\
        \ globalThis.fetch=async()=>{throw Error('guarded_capsule_unexpected_fetch');};\n let acceptedManifest=false;\n\
        \ const scope=async()=>{need(Date.now()<sourceExpiry,'source_expired');await assertSandbox(scratch);};\n\
        \ const readOnlyGet=async(key,cap)=>{\n  const x=await forStorage.get(key,cap);\n  if(key===manifestPath&&x.status===200&&!acceptedManifest){\n\
        \   const raw=JSON.parse(x.body),declared=declareNativeArchiveReport(raw,actual.archiveSha256,actual.reportSha256);\n\
        \   need(declared.bytes===44775200&&declared.parts===22,'report_observed_dimensions');\n   const m=native.validateIntakeArchive(raw,actual.archiveRoot,actual.archiveSha256);\n\
        \   need(m.files.length===shape.files&&m.totalBytes===shape.decoded&&m.files.reduce((n,x)=>n+x.parts.length,0)===shape.parts,'live_census');\n\
        \   for(const f of m.files)for(const p of f.parts)allowed.add(p.key);\n   acceptedManifest=true;console.log(JSON.stringify({stage:'verified_archive_manifest',files:shape.files,parts:shape.parts,restoredBytes:shape.decoded,manifestWireBytes:x.body.length,receiptBytes:receiptBytes.length,reportBytes:declared.bytes,reportParts:declared.parts}));\n\
        \  }\n  if(key===pinPath&&x.status===200)console.log(JSON.stringify({stage:'ready_pin_metadata_read',pinBytes:x.body.length}));\n\
        \  if(allowed.has(key)&&x.status===200&&(forStorage.tally.uniqueArchivePartCount%100===0||forStorage.tally.uniqueArchivePartCount===shape.parts))\n\
        \   console.log(JSON.stringify({stage:'archive_part_download',parts:forStorage.tally.uniqueArchivePartCount,totalParts:shape.parts,wireBytes:forStorage.tally.partWireBytes}));\n\
        \  return x;\n };\n const {createChinaContinuitySnapshotReader}=await import('./read-current-china-proof.mjs');\n\
        \ const {bindConvertedContinuity}=await import('./bind-converted-continuity.mjs');\n const readAuthenticatedSnapshot=createChinaContinuitySnapshotReader({access,secret,fetchImpl:nativeFetch});\n\
        \ await readAuthenticatedSnapshot();console.log(JSON.stringify({stage:'current_china_read_only_baseline_guard_passed',publicationAuthorized:false}));\n\
        \ const capsule=path.join(scratch,'capsule');\n const restored=await restoreViaBoundedReads({native,receipt,expected:actual,readOnlyGet,localCapsule:capsule,assertReadScope:scope});\n\
        \ need(restored.partCount===shape.parts&&restored.archiveBytes===shape.decoded&&forStorage.tally.partWireBytes===shape.partWire,'full_archive_census');\n\
        \ console.log(JSON.stringify({stage:'archive_bytes_verified',parts:shape.parts,totalBytes:shape.decoded}));\n\
        \ const outputDirectory=path.join(scratch,'input-converted');\n const result=await prepare({nativeRoot,receiptPath:receiptFile,archiveManifestPath:path.join(capsule,'complete.json'),rawPinPath:path.join(capsule,'pin.json'),\n\
        \   restoredDirectory:restored.directory,outputDirectory,minimumFree:18*G,minimumMemoryCap:memMax,progress:msg=>console.log(JSON.stringify(msg))});\n\
        \ await scope();\n const raw=await fs.readFile(path.join(outputDirectory,'LOCAL_ADMISSION.json'));\n\
        \ need(result.sourceRows===290044&&result.shards.length===581&&result.outputBytes===2741225874,'observed_native_dimensions');\n\
        \ const p=await bindConvertedContinuity({convertedRoot:outputDirectory,admissionSha256:hash(raw),archiveReportPath:path.join(restored.directory,'report.json'),readAuthenticatedSnapshot});\n\
        \ await p.assertContinuityCurrent();console.log(JSON.stringify({stage:'native_conversion_and_applied_china_ancestry_admitted',rows:p.result.rows,continuitySha256:p.continuitySha256,priorCursor:p.result.applied.value,candidateCursor:p.result.candidate.cursor,requiresV2RetainedMerge:true,cursorAdvanceAuthorized:false,publicationAuthorized:false}));\n\
        \n const {createChinaRetainedTransport,captureChinaRetained,resolveChinaRetainedCapture}=await import('./capture-china-retained.mjs');\n\
        \ const c=await captureChinaRetained({continuity:p,readAuthenticatedSnapshot,transport:createChinaRetainedTransport({access,secret,fetchImpl:nativeFetch}),output:path.join(scratch,'retained-china'),progress:msg=>console.log(JSON.stringify(msg))});\n\
        \ await scope();await p.assertContinuityCurrent();\n const retained=resolveChinaRetainedCapture(c).receipt;\n\
        \ console.log(JSON.stringify({stage:'china_retained_body_snapshot_verified',sha256:c.sha256,objects:retained.objects,bytes:retained.bytes,groups:retained.groups.map(g=>({rows:g.rows,objects:g.files.length})),inventoryV2SealIssued:false,publicationAuthorized:false,cursorAdvanceAuthorized:false}));\n\
        \ const {qualifyNativeChinaRetention}=await import('./qualify-native-china-retention.mjs');\n const\
