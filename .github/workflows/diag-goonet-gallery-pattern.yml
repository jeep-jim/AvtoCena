name: Diagnose Goo-net gallery pattern

on:
  pull_request:
    paths:
      - '.github/workflows/diag-goonet-gallery-pattern.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download retained Japan shard and sample stock frame 04
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input samples
          gh run download 32665797079 -R jeep-jim/AvtoCena -n catalog-v3-japan-2 -D input
          node <<'NODE'
          const fs=require('fs');
          const file=fs.readdirSync('input').find(x=>x.startsWith('catalog-rebuild-japan-2')&&x.endsWith('.json'));
          const data=JSON.parse(fs.readFileSync(`input/${file}`,'utf8'));
          const urls=[];
          for(const offer of data.offers||[]){
            if(offer.sourceId!=='goonet_japan_exact') continue;
            const hit=(offer.images||[]).map(x=>String(x?.url||'')).find(u=>/\/J\/[A-Za-z0-9]{20}04\.(?:jpg|jpeg|png|webp)(?:[?#]|$)/i.test(u));
            if(hit&&!urls.includes(hit)) urls.push(hit);
            if(urls.length>=200) break;
          }
          fs.writeFileSync('urls.txt',urls.join('\n'));
          console.log({sample:urls.length});
          NODE
          i=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            printf -v name 'samples/%03d.jpg' "$i"
            curl --max-time 12 -L -A 'Mozilla/5.0' -sS "$url" -o "$name" || rm -f "$name"
            i=$((i+1))
          done < urls.txt
          echo "DOWNLOADED=$(find samples -type f -name '*.jpg' | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: goonet-frame04-200
          path: samples/*.jpg
          retention-days: 1
