name: Validate sharded catalog recovery before merge
on:
  push:
    branches: [fix/catalog-shards-preliminary-20260810]
    paths: [.github/workflows/oneshot-final-scale-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-shards-preliminary-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate TypeScript and recovery scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          for f in \
            scripts/catalog-live-recovery-market.mjs \
            scripts/catalog-live-recovery-europe-otomoto.mjs \
            scripts/catalog-live-recovery-direct-exact.mjs \
            scripts/catalog-live-recovery-kyrgyzstan-direct.mjs \
            scripts/catalog-live-recovery-japan-prestige.mjs \
            scripts/catalog-live-recovery-publish.mjs \
            scripts/catalog-live-recovery-merge-shards.mjs \
            scripts/catalog-live-postpersist-audit.mjs; do node --check "$f"; done
      - name: Validate workflow safety contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'group: catalog-live-daily-working-markets' .github/workflows/catalog-live-daily-working-markets.yml
          grep -F 'group: catalog-live-daily-working-markets' .github/workflows/catalog-live-recovery-uae-kyrgyzstan.yml
          grep -F 'group: catalog-live-daily-working-markets' .github/workflows/catalog-live-recovery-japan-from-prestige.yml
          ! grep -A8 '^on:' .github/workflows/catalog-live-daily-working-markets.yml | grep -q '^  push:'
          ! grep -A8 '^on:' .github/workflows/catalog-live-recovery-uae-kyrgyzstan.yml | grep -q '^  push:'
          ! grep -A10 '^on:' .github/workflows/catalog-live-recovery-japan-from-prestige.yml | grep -q 'workflow_run:'
          ! grep -A10 '^on:' .github/workflows/catalog-live-recovery-japan-now.yml | grep -q 'workflow_run:'
          grep -F 'RECOVERY_PUBLISH_MAX="30000"' .github/workflows/catalog-live-daily-working-markets.yml
          grep -F 'RECOVERY_PUBLISH_MAX="30000"' .github/workflows/catalog-live-recovery-uae-kyrgyzstan.yml
          grep -F 'PRESTIGE_RECOVERY_TARGET: "30000"' .github/workflows/catalog-live-recovery-japan-from-prestige.yml
          grep -F 'Math.min(30_000' scripts/catalog-live-recovery-japan-prestige.mjs
          grep -F 'preliminary_power_pending' apps/web/lib/catalog/customs-pricing.ts
          grep -F 'Предварительно от' apps/web/components/catalog/CatalogPrice.tsx
          grep -F 'priceIncludesUtilizationFee: false' apps/web/lib/catalog/customs-pricing.ts
      - name: Validate required KCEG adapter registration
        shell: bash
        run: |
          npx tsx -e "import './apps/web/lib/catalog/importer.ts'; import { catalogImportSources } from './apps/web/lib/catalog/importer-impl.ts'; const ids=new Set(catalogImportSources.map((s:any)=>s.sourceId)); const required=['encar_direct','kcar_korea_open','autohome_used_china_open','dongchedi_china_open','guazi_china_open','autohome_new_china_open','mobile_de_open','autoscout_europe_open','otomoto_europe_exact','myauto_georgia_list','autopapa_georgia_open','auto_georgia_open','dubizzle_uae_open','dubicars_uae_exact','mashina_kyrgyzstan_exact']; const missing=required.filter(x=>!ids.has(x)); console.log(JSON.stringify({registered:required.filter(x=>ids.has(x)),missing},null,2)); if(missing.length) process.exit(1);"
      - name: Read current production state without publishing
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-final-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-final-preflight-audit
          path: catalog-final-preflight-audit.json
          if-no-files-found: warn
          retention-days: 3
      - name: Remove validator and commit clean branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/oneshot-final-scale-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize source-sharded seven-market recovery'
          git push origin HEAD:fix/catalog-shards-preliminary-20260810
