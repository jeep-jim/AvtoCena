name: Regcloud — attribute VM storage without changes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/regcloud-vm-storage-inventory.yml']
permissions:
  contents: read
concurrency:
  group: regcloud-failed-encar-retention
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check fixed read-only inventory syntax
        run: python3 -m py_compile scripts/regcloud-vm-storage-inventory.py
      - name: Read VM allocation, stopped writable layers and all image references
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          # Fixed source over stdin: no remote temporary file, input or apply mode.
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'nice -n 15 python3 -' < scripts/regcloud-vm-storage-inventory.py | tee vm-storage-inventory.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-storage-inventory
          path: vm-storage-inventory.jsonl
          retention-days: 14
          if-no-files-found: warn
