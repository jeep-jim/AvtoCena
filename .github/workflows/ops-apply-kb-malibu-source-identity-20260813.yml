name: Ops · apply KB Malibu source identity fix

on:
  push:
    branches:
      - ops/apply-kb-malibu-source-identity-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kb-malibu-source-identity-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch KB source identity
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("apps/web/lib/catalog/kbchachacha-exact-source.ts"); s=p.read_text(); old="  const make = canonicalCatalogBrand(rawMake);\n  const translated = clean(translateCatalogText(rest.join(\" \")));"; new="  const makeToken = rawMake.replace(/^한국GM$/i, \"쉐보레\");\n  const make = canonicalCatalogBrand(clean(translateCatalogText(makeToken)) || makeToken);\n  const modelSource = rest.join(\" \")\n    .replace(/더\\s*뉴\\s*말리부/gi, \"The New Malibu\")\n    .replace(/말리부/gi, \"Malibu\")\n    .replace(/터보/gi, \"Turbo\")\n    .replace(/스페셜/gi, \"Special\");\n  const translated = clean(translateCatalogText(modelSource));"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
      - name: Add KB Malibu regression
        shell: bash
        run: |
          if ! grep -q 'KB ChaChaCha preserves Korean Malibu model identity' tests/kbchachacha-exact-source.test.ts; then
            cat >> tests/kbchachacha-exact-source.test.ts <<'EOF'

          test("KB ChaChaCha preserves Korean Malibu model identity", () => {
            const carSeq = "28512227";
            const images = Array.from({ length: 5 }, (_, index) => `https://img.kbchachacha.com/IMG/carimg/l/x/${carSeq}_${index + 1}.jpeg`);
            const product = {
              "@context": "https://schema.org/",
              "@type": "Product",
              name: "한국GM 더 뉴 말리부 2.0 터보 LT 스페셜 (21년형)",
              image: images,
              description: "21년06월 가솔린",
              brand: { "@type": "Brand", name: "한국GM" },
              offers: { "@type": "Offer", url: `https://www.kbchachacha.com/public/car/detail.kbc?carSeq=${carSeq}`, priceCurrency: "KRW", price: "11990000" },
            };
            const html = `<script type="application/ld+json">${JSON.stringify(product)}</script><table><tbody>
              <tr><th>연식</th><td>21년06월(21년형)</td><th>주행거리</th><td>71,414km</td></tr>
              <tr><th>연료</th><td>가솔린</td><th>변속기</th><td>자동</td></tr>
              <tr><th>차종</th><td>중형차</td><th>배기량</th><td>1,998cc</td></tr>
            </tbody></table>`;
            const detail = parseKbChaChaChaDetail(html, carSeq);
            assert.equal(detail.make, "Chevrolet");
            assert.match(detail.model, /Malibu/i);
            assert.doesNotMatch(detail.model, /Bolt/i);
            assert.equal(detail.engineCc, 1998);
            assert.equal(detail.sourcePrice, 11_990_000);
          });
          EOF
          fi
      - name: Focused KB tests
        run: node --import tsx --test tests/kbchachacha-exact-source.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Push code-only patch
        shell: bash
        run: |
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"
          git add apps/web/lib/catalog/kbchachacha-exact-source.ts tests/kbchachacha-exact-source.test.ts
          git diff --cached --check
          git commit -m "Preserve KB Malibu source identity"
          git push origin HEAD:fix/kb-malibu-source-identity-20260813
