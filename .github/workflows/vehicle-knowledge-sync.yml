name: Vehicle knowledge sync

on:
  pull_request:
    paths:
      - ".github/workflows/vehicle-knowledge-sync.yml"
      - ".github/workflows/vehicle-knowledge-backfill-2011.yml"
      - "apps/web/lib/catalog/vehicle-knowledge.ts"
      - "apps/web/lib/catalog/drom-vehicle-knowledge.ts"
      - "apps/web/lib/replace-chunked-data.ts"
      - "scripts/catalog-sync-vehicle-models.mjs"
      - "scripts/catalog-enrich-drom-vehicle-variants.mjs"
      - "scripts/catalog-build-vehicle-variants.mjs"
      - "data/catalog/vehicle-knowledge/**"
      - "tests/vehicle-knowledge-production-window.test.mjs"
      - "package.json"
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vehicle-knowledge-github-data
  cancel-in-progress: false

jobs:
  validate-or-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: file
      VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: 2011
      VEHICLE_KNOWLEDGE_CHUNK_SIZE: 250
      VEHICLE_KNOWLEDGE_RECENT_YEARS: 15
      DROM_KNOWLEDGE_ONLY_RECENT: 0
      DROM_KNOWLEDGE_LIMIT: ${{ github.event_name == 'pull_request' && '10' || '1000' }}
      DROM_KNOWLEDGE_BATCHES: ${{ github.event_name == 'pull_request' && '1' || '4' }}
      DROM_KNOWLEDGE_DELAY_MS: 700
      DROM_KNOWLEDGE_RETRY_DAYS: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Synchronize every catalog make and model from 2011 onward
        run: npm run catalog:sync-vehicle-models
      - name: Enrich prioritized knowledge batches
        shell: bash
        run: |
          set -euo pipefail
          for batch in $(seq 1 "$DROM_KNOWLEDGE_BATCHES"); do
            echo "Knowledge batch ${batch}/${DROM_KNOWLEDGE_BATCHES}"
            status=0
            npm run catalog:enrich-drom-variants || status=$?
            if [ "$status" -eq 2 ]; then
              echo "Source rate-limited; saved progress will continue on the next run."
              break
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done
      - name: Build variants from verified live offers
        run: npm run catalog:build-vehicle-variants
      - name: Validate knowledge and production window
        run: node --import tsx --test tests/vehicle-knowledge.test.ts tests/drom-vehicle-knowledge.test.ts tests/vehicle-knowledge-production-window.test.mjs
      - name: Commit versioned knowledge to GitHub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/vehicle-knowledge data/catalog/power-knowledge data/catalog/power-reference data/models
          if git diff --cached --quiet; then
            echo "Vehicle knowledge is already current."
            exit 0
          fi
          git commit -m "data: refresh vehicle knowledge 2011+"
          git push origin HEAD:main
