name: Vehicle knowledge sync

on:
  pull_request:
    paths:
      - ".github/workflows/vehicle-knowledge-sync.yml"
      - "apps/web/lib/catalog/vehicle-knowledge.ts"
      - "apps/web/lib/replace-chunked-data.ts"
      - "scripts/catalog-sync-vehicle-models.mjs"
      - "scripts/catalog-build-vehicle-variants.mjs"
      - "data/catalog/vehicle-knowledge/**"
      - "package.json"
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download and chunk the full canonical model catalogue
        env:
          JSON_STORAGE_DRIVER: local
          VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: 1990
          VEHICLE_KNOWLEDGE_CHUNK_SIZE: 250
        run: npm run catalog:sync-vehicle-models
      - name: Validate model volume, chunks and aliases
        id: validate_models
        continue-on-error: true
        env:
          JSON_STORAGE_DRIVER: local
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          let report = { models: 0, indexTotal: 0, chunkSize: null, chunks: 0, largestChunk: 0, hrv: [], errors: [] };
          try {
            const dataModule = await import('./apps/web/lib/data.ts');
            const dataApi = dataModule.default || dataModule;
            const vehicleModule = await import('./apps/web/lib/catalog/vehicle-knowledge.ts');
            const vehicleApi = vehicleModule.default || vehicleModule;
            const models = await dataApi.readChunkedDataJson('catalog/vehicle-knowledge/models.json', []);
            const index = await dataApi.readDataJson('catalog/vehicle-knowledge/models-index.json', null);
            const hrv = await vehicleApi.resolveVehicleModelQuery('hrv', undefined, 10);
            const errors = [];
            if (models.length < 5000) errors.push(`vehicle_knowledge_too_small_${models.length}`);
            if (!index || index.maxRecordsPerChunk !== 250) errors.push('vehicle_knowledge_chunk_size_invalid');
            if (Array.isArray(index?.chunks) && index.chunks.some((chunk) => Number(chunk.count || 0) > 250)) errors.push('vehicle_knowledge_chunk_overflow');
            if (!hrv.some((row) => row.make === 'Honda' && row.model === 'HR-V')) errors.push('vehicle_knowledge_hrv_alias_missing');
            report = {
              models: models.length,
              indexTotal: index?.total,
              chunkSize: index?.maxRecordsPerChunk,
              chunks: index?.chunks?.length,
              largestChunk: Math.max(0, ...(index?.chunks || []).map((chunk) => Number(chunk.count || 0))),
              hrv: hrv.slice(0, 10),
              errors,
            };
          } catch (error) {
            report.errors = [`validation_exception:${error?.message || String(error)}`];
            report.stack = String(error?.stack || '');
          }
          await fs.writeFile('vehicle-knowledge-validation.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.errors.length) process.exitCode = 1;
          NODE
      - name: Upload vehicle knowledge validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-knowledge-validation
          path: vehicle-knowledge-validation.json
      - name: Publish validation summary to pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vehicle-knowledge-validation -->';
            const report = fs.existsSync('vehicle-knowledge-validation.json')
              ? JSON.parse(fs.readFileSync('vehicle-knowledge-validation.json', 'utf8'))
              : { errors: ['validation_report_missing'] };
            const status = Array.isArray(report.errors) && report.errors.length ? '❌ ошибка' : '✅ готово';
            const body = `${marker}\n## База знаний автомобилей: ${status}\n\n` +
              `- моделей: **${report.models ?? 0}**\n` +
              `- чанков: **${report.chunks ?? 0}**\n` +
              `- размер чанка: **${report.chunkSize ?? '—'}**\n` +
              `- самый большой чанк: **${report.largestChunk ?? '—'}**\n` +
              `- поиск \`hrv\`: \`${JSON.stringify(report.hrv || [])}\`\n` +
              `- ошибки: \`${JSON.stringify(report.errors || [])}\`\n` +
              (report.stack ? `\n<details><summary>Стек</summary>\n\n\`\`\`\n${report.stack}\n\`\`\`\n</details>` : '');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail on vehicle knowledge validation errors
        if: steps.validate_models.outcome != 'success'
        run: exit 1

  sync-production-json:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vehicle-knowledge-production-json
      cancel-in-progress: false
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: 1990
      VEHICLE_KNOWLEDGE_CHUNK_SIZE: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check object storage configuration
        shell: bash
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Synchronize canonical makes and models
        run: npm run catalog:sync-vehicle-models
      - name: Build generations, variants and representative horsepower
        run: npm run catalog:build-vehicle-variants
      - name: Validate canonical model search
        run: node --import tsx --test tests/vehicle-knowledge.test.ts
