name: Hotfix China public titles and home model diversity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-offer-ui-model-diversity-v3.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: ui-hotfix-china-home-diversity
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Patch China display labels and home market round-robin
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/ui_hotfix.py
          python /tmp/ui_hotfix.py

      - name: Verify China public titles contain no Han
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/china_title_smoke.ts
          npx tsx /tmp/china_title_smoke.ts
          npm run typecheck

      - name: Commit UI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/presentation.ts apps/web/components/home/HomePageClient.tsx
          if git diff --cached --quiet; then
            echo "No UI changes needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Fix China public titles and diversify home market cards"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "China titles sanitized and home market cards round-robin by exact make+model." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy UI only
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-yandex.yml/dispatches" -f ref=main
          echo "UI deploy dispatched. No catalog writer was dispatched." >> "$GITHUB_STEP_SUMMARY"
