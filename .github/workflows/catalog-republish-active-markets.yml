name: Catalog maintenance · republish active markets
run-name: Atomically remove retired markets · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
  CATALOG_REQUIRE_RETIRED_MARKET: "true"

jobs:
  republish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate active-market publication contract
        run: |
          node --check scripts/catalog-republish-active-markets.mjs
          node --import tsx --test tests/catalog-six-market-contract.test.ts tests/catalog-required-sources-contract.test.ts
          npm run typecheck
      - name: Preserve six active markets and atomically replace the manifest
        env:
          CATALOG_ACTIVE_MARKETS_REPORT: catalog-active-markets-report.json
        run: npx tsx scripts/catalog-republish-active-markets.mjs
      - name: Audit all six active markets
        env:
          CATALOG_AUDIT_OUTPUT: catalog-active-markets-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-active-markets-republish
          path: |
            catalog-active-markets-report.json
            catalog-active-markets-audit.json
          if-no-files-found: warn
          retention-days: 7
