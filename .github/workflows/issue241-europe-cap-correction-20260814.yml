name: Issue241 Europe cap correction 20260814

on:
  push:
    branches: [ops/issue241-europe-cap-fast-audit-20260814]
    paths:
      - '.github/workflows/issue241-europe-cap-correction-20260814.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_PUBLISH_LOCK_WAIT_MS: '7200000'

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate one-shot correction
        run: node --check scripts/issue241-europe-cap-one-shot.mjs
      - name: Fail if another catalog writer is active or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const https=require('node:https');
          const token=process.env.GH_TOKEN;
          const current=Number(process.env.GITHUB_RUN_ID||0);
          const get=(path)=>new Promise((resolve,reject)=>{const req=https.request({hostname:'api.github.com',path,headers:{'user-agent':'AvtoCena-issue241-europe-writer-guard','authorization':`Bearer ${token}`,'accept':'application/vnd.github+json'}},res=>{let body='';res.on('data',d=>body+=d);res.on('end',()=>res.statusCode>=200&&res.statusCode<300?resolve(JSON.parse(body)):reject(new Error(`github_${res.statusCode}:${body.slice(0,200)}`)));});req.on('error',reject);req.end();});
          (async()=>{
            const all=[];
            for(const status of ['in_progress','queued']){const data=await get(`/repos/jeep-jim/AvtoCena/actions/runs?status=${status}&per_page=100`);for(const r of data.workflow_runs||[])if(Number(r.id)!==current)all.push(r);}
            const readOnly=(r)=>/(?:dry[- ]?run|audit|smoke|diagnos|read[- ]?only|proof|gate)/i.test(`${r.name||''} ${r.path||''} ${r.display_title||''}`)
              && !/(?:publish|publication|recovery|repair|writer|certified power|global model-year cap)/i.test(`${r.name||''} ${r.path||''} ${r.display_title||''}`);
            const writer=(r)=>!readOnly(r)&&/(?:catalog.*(?:daily|recovery|publish|publication|repair|certified|global.*cap)|(?:daily|recovery|publish|publication|repair|certified|global.*cap).*catalog|korea.*(?:publish|publication))/i.test(`${r.name||''} ${r.path||''} ${r.display_title||''}`);
            const writers=all.filter(writer);
            console.log(JSON.stringify({otherActiveOrQueued:all.map(r=>({id:r.id,status:r.status,name:r.name,path:r.path,readOnly:readOnly(r)})),writers:writers.map(r=>({id:r.id,status:r.status,name:r.name,path:r.path}))},null,2));
            if(writers.length)throw new Error(`other_catalog_writer_present:${writers.map(r=>r.id).join(',')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Guarded atomic Europe quota correction
        env:
          ISSUE241_EUROPE_CAP_REPORT: issue241-europe-cap-correction.json
        run: npx tsx scripts/issue241-europe-cap-one-shot.mjs
      - name: Strict all-seven audit after Europe correction
        env:
          CATALOG_AUDIT_OUTPUT: issue241-europe-cap-postaudit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: '20'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-europe-cap-correction
          path: |
            issue241-europe-cap-correction.json
            issue241-europe-cap-postaudit.json
          if-no-files-found: warn
          retention-days: 3
