name: Apply Goo-net page-bound gallery fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-goonet-page-bound-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/goonet-page-bound-gallery-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch Goo-net gallery binding
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          quality = Path('apps/web/lib/catalog/offer-quality.ts')
          text = quality.read_text()
          old = r'''function coherentGoonetImages(input: CatalogImage[]) {
            const groups = new Map<string, Map<string, { frame: number; image: CatalogImage }>>();
            let sawGoonet = false;
            for (const image of input || []) {
              try {
                const url = new URL(String(image?.url || "").replace(/&amp;/g, "&"));
                const host = url.hostname.toLowerCase();
                if (host !== GOONET_CATALOG_IMAGE_HOST && !GOONET_PICTURE_HOST_RE.test(host)) continue;
                sawGoonet = true;
                if (!GOONET_PICTURE_HOST_RE.test(host)) continue;
                const match = url.pathname.match(/\/J\/(\d{21})(\d{2})\.(?:jpe?g|png|webp|avif)$/i);
                if (!match) continue;
                const listingId = match[1];
                const frame = Number(match[2]);
                if (!groups.has(listingId)) groups.set(listingId, new Map());
                const bucket = groups.get(listingId)!;
                if (!bucket.has(url.pathname)) bucket.set(url.pathname, { frame, image });
              } catch { /* ignore non-source URLs */ }
            }
            if (!sawGoonet) return null;
            if (groups.size !== 1) return [];
            const bucket = [...groups.values()][0];
            const rows = [...bucket.values()].sort((a, b) => a.frame - b.frame);
            if (!rows.some((row) => row.frame === 0)) return [];
            return rows.map((row) => row.image);
          }
'''.replace('          ', '')
          new = r'''function coherentGoonetImages(input: CatalogImage[]) {
  const exactGroups = new Map<string, Map<string, { frame: number; image: CatalogImage }>>();
  const pageGroups = new Map<string, Map<string, { frame: number; image: CatalogImage }>>();
  let sawGoonet = false;
  for (const image of input || []) {
    try {
      const url = new URL(String(image?.url || "").replace(/&amp;/g, "&"));
      const host = url.hostname.toLowerCase();
      if (host !== GOONET_CATALOG_IMAGE_HOST && !GOONET_PICTURE_HOST_RE.test(host)) continue;
      sawGoonet = true;
      if (!GOONET_PICTURE_HOST_RE.test(host)) continue;

      const exact = url.pathname.match(/\/J\/(\d{21})(\d{2})\.(?:jpe?g|png|webp|avif)$/i);
      if (exact) {
        const listingId = exact[1];
        const frame = Number(exact[2]);
        if (!exactGroups.has(listingId)) exactGroups.set(listingId, new Map());
        const bucket = exactGroups.get(listingId)!;
        if (!bucket.has(url.pathname)) bucket.set(url.pathname, { frame, image });
        continue;
      }

      // Goo-net's exact detail page stores the real multi-photo J gallery under
      // a long alphanumeric stock family (for example .../J/0704382A...01.jpg).
      // Keep only a coherent sequential family; short dealer assets such as
      // D00701.jpg and catalogphoto URLs never qualify.
      const pageFrame = url.pathname.match(/\/J\/([A-Z0-9]{12,})(\d{2})\.(?:jpe?g|png|webp|avif)$/i);
      if (!pageFrame || !/[A-Z]/i.test(pageFrame[1])) continue;
      const family = pageFrame[1].toUpperCase();
      const frame = Number(pageFrame[2]);
      if (!pageGroups.has(family)) pageGroups.set(family, new Map());
      const bucket = pageGroups.get(family)!;
      if (!bucket.has(url.pathname)) bucket.set(url.pathname, { frame, image });
    } catch { /* ignore non-source URLs */ }
  }
  if (!sawGoonet) return null;
  if (exactGroups.size > 1) return [];

  const exactRows = exactGroups.size === 1
    ? [...[...exactGroups.values()][0].values()].sort((a, b) => a.frame - b.frame)
    : [];
  const exactCover = exactRows.find((row) => row.frame === 0);
  if (exactRows.length >= 2 && exactCover) return exactRows.map((row) => row.image);

  const rankedPageGroups = [...pageGroups.entries()].sort((a, b) => b[1].size - a[1].size || a[0].localeCompare(b[0]));
  if (!rankedPageGroups.length || rankedPageGroups[0][1].size < 2) return [];
  if (rankedPageGroups[1] && rankedPageGroups[1][1].size === rankedPageGroups[0][1].size) return [];
  const pageRows = [...rankedPageGroups[0][1].values()].sort((a, b) => a.frame - b.frame);
  if (!pageRows.some((row) => row.frame === 1)) return [];
  return [
    ...(exactCover ? [exactCover.image] : []),
    ...pageRows.map((row) => row.image),
  ];
}
'''
          if old not in text:
            raise SystemExit('offer-quality Goo-net sanitizer block not found')
          quality.write_text(text.replace(old, new, 1))

          source = Path('apps/web/lib/catalog/goonet-exact-source.ts')
          text = source.read_text()
          old = r'''/**
 * Only images whose filename contains the exact 21-digit listing id may enter a
 * Goo-net offer. This drops dealer banners, option comics and unrelated assets.
 * Frame 00 is always the cover and we never fall back to a dashboard/interior
 * image when that source-bound primary cannot be verified.
 */
export function coherentGoonetImages(urls: string[], limit: number, pageUrl = "") {
  const listingId = goonetListingId(pageUrl)
    || urls.map((value) => value.match(/\/J\/(\d{21})\d{2}\.(?:jpe?g|png|webp)$/i)?.[1] || "").find(Boolean)
    || "";
  if (!listingId) return [];
  const primary = urls.find((value) => isSourcePrimaryImage(value, listingId)) || goonetPrimaryImageUrl(pageUrl);
  if (!primary || !isSourcePrimaryImage(primary, listingId)) return [];
  const exactFrames = [...new Set(urls.filter((value) => isGoonetListingFrame(value, listingId)))];
  const secondary = exactFrames.filter((value) => !isSourcePrimaryImage(value, listingId)).sort((left, right) => left.localeCompare(right, "en"));
  return [primary, ...secondary].slice(0, limit);
}
'''
          new = r'''function coherentPageBoundGoonetJImages(urls: string[]) {
  const groups = new Map<string, Map<string, { frame: number; url: string }>>();
  for (const value of urls || []) {
    try {
      const parsed = new URL(value);
      if (!/(?:^|\.)picture\d*\.goo-net\.com$/i.test(parsed.hostname)) continue;
      const match = parsed.pathname.match(/\/J\/([A-Z0-9]{12,})(\d{2})\.(?:jpe?g|png|webp)$/i);
      if (!match || !/[A-Z]/i.test(match[1])) continue;
      const family = match[1].toUpperCase();
      const frame = Number(match[2]);
      if (!groups.has(family)) groups.set(family, new Map());
      const bucket = groups.get(family)!;
      if (!bucket.has(parsed.pathname)) bucket.set(parsed.pathname, { frame, url: parsed.toString() });
    } catch { /* ignore unrelated source assets */ }
  }
  const ranked = [...groups.entries()].sort((a, b) => b[1].size - a[1].size || a[0].localeCompare(b[0]));
  if (!ranked.length || ranked[0][1].size < 2) return [];
  if (ranked[1] && ranked[1][1].size === ranked[0][1].size) return [];
  const rows = [...ranked[0][1].values()].sort((a, b) => a.frame - b.frame);
  if (!rows.some((row) => row.frame === 1)) return [];
  return rows.map((row) => row.url);
}

/**
 * Goo-net exposes one deterministic 21-digit frame-00 cover, while the exact
 * detail page's real multi-photo gallery uses a coherent long alphanumeric J
 * family. The page-bound family is accepted only when it has a unique dominant
 * sequence beginning at frame 01; dealer/banner/catalog families are ignored.
 */
export function coherentGoonetImages(urls: string[], limit: number, pageUrl = "") {
  const listingId = goonetListingId(pageUrl)
    || urls.map((value) => value.match(/\/J\/(\d{21})\d{2}\.(?:jpe?g|png|webp)$/i)?.[1] || "").find(Boolean)
    || "";
  if (!listingId) return [];
  const primary = urls.find((value) => isSourcePrimaryImage(value, listingId)) || goonetPrimaryImageUrl(pageUrl);
  if (!primary || !isSourcePrimaryImage(primary, listingId)) return [];

  const exactFrames = [...new Set(urls.filter((value) => isGoonetListingFrame(value, listingId)))];
  const exactSecondary = exactFrames
    .filter((value) => !isSourcePrimaryImage(value, listingId))
    .sort((left, right) => left.localeCompare(right, "en"));
  if (exactSecondary.length) return [primary, ...exactSecondary].slice(0, limit);

  const pageBound = coherentPageBoundGoonetJImages(urls);
  if (!pageBound.length) return [primary].slice(0, limit);
  return [primary, ...pageBound].slice(0, limit);
}
'''
          if old not in text:
            raise SystemExit('goonet-exact-source coherent gallery block not found')
          source.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/apply-goonet-page-bound-fix.yml
          git diff --check
          git diff -- apps/web/lib/catalog/offer-quality.ts apps/web/lib/catalog/goonet-exact-source.ts
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apps/web/lib/catalog/offer-quality.ts apps/web/lib/catalog/goonet-exact-source.ts .github/workflows/apply-goonet-page-bound-fix.yml
          git commit -m 'Fix Goo-net exact page gallery binding'
          git push origin HEAD:${{ github.head_ref }}
