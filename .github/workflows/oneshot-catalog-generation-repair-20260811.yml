name: One-shot canonical Japan generation repair
run-name: Canonical Japan catalog repair · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-catalog-generation-repair-20260811.yml

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REPAIR_SOURCE_GENERATION: gen_1786426826475_e390aa80
  CATALOG_REPAIR_MARKETS: japan

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check scripts/catalog-generation-repair.mjs
      - name: Reconfirm old Japan generation while preserving current other six markets
        env:
          CATALOG_REPAIR_DRY_RUN: "1"
        run: npx tsx scripts/catalog-generation-repair.mjs | tee catalog-generation-repair-preflight.json
      - name: Publish repaired Japan plus canonical current other six markets
        env:
          CATALOG_REPAIR_DRY_RUN: "0"
        run: npx tsx scripts/catalog-generation-repair.mjs | tee catalog-generation-repair-live.json
      - name: Post-persist all-seven invariant audit
        env:
          CATALOG_AUDIT_OUTPUT: catalog-generation-repair-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-generation-repair-report
          path: |
            catalog-generation-repair-preflight.json
            catalog-generation-repair-live.json
            catalog-generation-repair-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
