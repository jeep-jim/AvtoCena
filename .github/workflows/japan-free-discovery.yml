name: Japan free sources discovery
on:
  push:
    branches: [ops/japan-free-sweep-20260916]
    paths: [.github/workflows/japan-free-discovery.yml]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read public catalog pages
        run: |
          mkdir -p data/japan-free-discovery
          python - <<'PY'
          import urllib.request,json,pathlib,concurrent.futures
          urls={
            'jptrade-js':'https://jptrade.ru/netcat_template/template/jptrade/js/scripts.js?v=26.03.26',
            'jptrade-new-js':'https://jptrade.ru/netcat_template/template/jptrade/js/scripts_new.js?v=16.09.26',
            'tokai-js':'https://tokai-auto.ru/netcat_template/template/10/js/scripts_custom1.js',
            'tokai-dev-js':'https://tokai-auto.ru/netcat_template/template/10/js/dev.js?111',
            'jptrade':'https://jptrade.ru/stat/',
            'jptrade-detail':'https://jptrade.ru/stat/30124028',
            'tokai':'https://tokai-auto.ru/statistika/',
            'tokai-detail':'https://tokai-auto.ru/toyota/copen/?auc_id=1882655979',
            'prestige':'https://prestigemotorsport.com.au/auctions/',
            'jpauc':'https://jpauc.com/auction/past',
            'carvector':'https://carvector.com/stat/',
            'jpcarshub':'https://jpcarshub.co.nz/history-cars',
            'cyprus':'https://buycarincyprus.com.cy/stats/cars/toyota/aqua/'
          }
          root=pathlib.Path('data/japan-free-discovery')
          def read(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'AvtoCena catalog research/1.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=35) as r:
                body=r.read(3000000).decode('utf-8','replace')
                (root/(name+'.html')).write_text(body)
                return {'source':name,'url':url,'status':r.status,'bytes':len(body)}
            except Exception as e:return {'source':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: results=list(pool.map(read,urls.items()))
          (root/'summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-free-discovery
          path: data/japan-free-discovery
          retention-days: 14
      - name: Save research evidence on collection branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan-free-discovery
          git diff --cached --quiet || git commit -m "Record public Japan source discovery"
          git push origin HEAD:ops/japan-free-sweep-20260916
