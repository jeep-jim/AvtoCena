name: Dispatch Georgia Yandex dry-run once 20260815

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-georgia-yandex-dryrun-once-20260815.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch guarded Georgia recovery in dry-run mode only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-live-recovery-georgia-yandex.yml --repo jeep-jim/AvtoCena --ref main -f apply=false
