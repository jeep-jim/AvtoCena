name: Audit brand server dependencies 20260812

on:
  push:
    branches:
      - audit/brand-route-prod-latency-20260812
    paths:
      - .github/workflows/audit-brand-server-dependencies-20260812.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Time raw brand page server dependencies
        shell: bash
        run: |
          cat >/tmp/audit-brand-deps.ts <<'TS'
          const time = async (label: string, fn: () => Promise<any>) => {
            const start = performance.now();
            const value = await fn();
            const ms = performance.now() - start;
            const size = Array.isArray(value) ? value.length : value?.models?.length ?? Object.keys(value?.counts || {}).length ?? null;
            console.log(JSON.stringify({ label, ms: Math.round(ms * 10) / 10, size }));
            return value;
          };
          (async () => {
            const storage = await import(process.cwd() + '/apps/web/lib/catalog/storage.ts');
            const knowledge = await import(process.cwd() + '/apps/web/lib/catalog/vehicle-knowledge.ts');
            const power = await import(process.cwd() + '/apps/web/lib/catalog/power-knowledge.ts');
            await time('brandModelCounts BMW cold', () => storage.readCatalogBrandModelCounts('BMW'));
            await time('knowledgeModels cold', () => knowledge.readVehicleKnowledgeModels());
            await time('knowledgeVariants cold', () => knowledge.readVehicleKnowledgeVariants());
            await time('powerKnowledge cold', () => power.readVehiclePowerKnowledge());
            await time('brandModelCounts Audi warm projection', () => storage.readCatalogBrandModelCounts('Audi'));
            await time('knowledgeModels warm', () => knowledge.readVehicleKnowledgeModels());
            await time('knowledgeVariants warm', () => knowledge.readVehicleKnowledgeVariants());
            await time('powerKnowledge warm', () => power.readVehiclePowerKnowledge());
          })().catch((error) => { console.error(error); process.exit(1); });
          TS
          npx tsx /tmp/audit-brand-deps.ts
