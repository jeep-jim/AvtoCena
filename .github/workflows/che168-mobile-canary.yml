name: Che168 domestic mobile transport canary
on:
  pull_request:
    paths:
      - scripts/che168-mobile-canary.mjs
      - scripts/lib/che168-mobile-*.mjs
      - .github/workflows/che168-mobile-canary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser dependency
        run: npm install --prefix "$RUNNER_TEMP/che168-browser" --no-save --package-lock=false playwright@1.63.0
      - name: Verify preinstalled sandboxed Chrome
        run: google-chrome --version
      - name: Probe ordinary domestic mobile pages without publication
        env:
          CHE168_PLAYWRIGHT_MODULE: ${{ runner.temp }}/che168-browser/node_modules/playwright/index.mjs
          CHE168_CANARY_OUTPUT: ${{ runner.temp }}/che168-mobile-canary
        run: node scripts/che168-mobile-canary.mjs
      - name: Retain complete DOM and named tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-domestic-mobile-canary
          path: ${{ runner.temp }}/che168-mobile-canary
          if-no-files-found: warn
          retention-days: 7
