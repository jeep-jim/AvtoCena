name: Ops · Korea model-year live refresh v2 20260813
run-name: Korea model-year live refresh v2 · ${{ github.sha }}

on:
  push:
    branches:
      - ops/korea-model-year-live-refresh-v2-20260813
    paths:
      - ".github/workflows/ops-korea-model-year-live-refresh-v2-20260813.yml"

permissions:
  contents: read
  actions: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"
  CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate current quota and preliminary-power recovery paths
        run: |
          set -euo pipefail
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-recovery-publish-batch.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          node --import tsx --test tests/catalog-model-year-quota.test.ts tests/catalog-global-model-cap.test.ts
      - name: Strict current all-seven audit
        env:
          CATALOG_AUDIT_OUTPUT: korea-v2-preflight-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v2-preflight
          path: korea-v2-preflight-all7.json
          if-no-files-found: warn
          retention-days: 3

  collect_encar:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RECOVERY_MARKET: korea
      RECOVERY_SOURCE_IDS: encar_direct
      RECOVERY_OUTPUT: catalog-shard-korea-encar_direct.json
      RECOVERY_TARGET: "2500"
      RECOVERY_MAX_PAGES: "120"
      RECOVERY_TIME_LIMIT_MS: "2700000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect Encar with coverage-first and generic preliminary-power support
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - name: Prove Encar shard now retains Casper 2022
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('catalog-shard-korea-encar_direct.json','utf8'));
          const rows=Array.isArray(p.offers)?p.offers:[];
          const isHyundai=(v)=>/hyundai|현대|хенд[эе]/i.test(String(v||''));
          const isCasper=(v)=>/casper|캐스퍼|каспер/i.test(String(v||''));
          const c=rows.filter(o=>o.sourceId==='encar_direct' && Number(o.year)===2022 && isHyundai(o.make) && isCasper(o.model));
          const report={count:rows.length,casper2022:c.length,sample:c.slice(0,5).map(o=>({id:o.id,sourceOfferId:o.sourceOfferId,make:o.make,model:o.model,year:o.year,mileage:o.mileage,images:o.images?.length||0,calculationStatus:o.calculationStatus,pricingConfidence:o.pricingConfidence,priceIncludesUtilizationFee:o.priceIncludesUtilizationFee,powerHp:o.powerHp,engineCc:o.engineCc}))};
          fs.writeFileSync('korea-v2-encar-casper-gate.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(c.length<1) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v2-encar
          path: |
            catalog-shard-korea-encar_direct.json
            korea-v2-encar-casper-gate.json
          if-no-files-found: warn
          retention-days: 3

  merge_and_gate:
    needs: [preflight, collect_encar]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: korea-v2-encar
          path: korea-shards/encar
      - name: Reuse successful K Car shard from failed proof run
        uses: actions/download-artifact@v4
        with:
          name: korea-model-year-source-kcar_korea_open
          path: korea-shards/kcar
          github-token: ${{ github.token }}
          run-id: 31676956404
      - name: Reuse successful KB ChaChaCha shard from failed proof run
        uses: actions/download-artifact@v4
        with:
          name: korea-model-year-source-kbchachacha_korea_open
          path: korea-shards/kb
          github-token: ${{ github.token }}
          run-id: 31676956404
      - name: Merge Korea shards
        env:
          RECOVERY_MERGE_MARKET: korea
          RECOVERY_MERGE_INPUT_DIR: korea-shards
          RECOVERY_MERGE_OUTPUT: catalog-rebuild-korea.json
        run: node scripts/catalog-live-recovery-merge-shards.mjs
      - name: Require real Casper 2022 including Encar before publication
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('catalog-rebuild-korea.json','utf8'));
          const rows=Array.isArray(p.offers)?p.offers:[];
          const isHyundai=(v)=>/hyundai|현대|хенд[эе]/i.test(String(v||''));
          const isCasper=(v)=>/casper|캐스퍼|каспер/i.test(String(v||''));
          const all=rows.filter(o=>Number(o.year)===2022 && isHyundai(o.make) && isCasper(o.model));
          const encar=all.filter(o=>o.sourceId==='encar_direct');
          const badYears=rows.filter(o=>Number(o.year)<2020);
          const foreign=rows.filter(o=>o.market!=='korea');
          const report={merged:rows.length,sourceCounts:p.report?.sourceCounts||{},casper2022:all.length,encarCasper2022:encar.length,badYears:badYears.length,foreign:foreign.length,sample:encar.slice(0,5).map(o=>({id:o.id,sourceOfferId:o.sourceOfferId,year:o.year,images:o.images?.length||0,calculationStatus:o.calculationStatus,pricingConfidence:o.pricingConfidence,powerHp:o.powerHp,engineCc:o.engineCc}))};
          fs.writeFileSync('korea-v2-merged-gate.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!rows.length || badYears.length || foreign.length || all.length<1 || encar.length<1) process.exit(1);
          NODE
      - name: Snapshot current all-seven state for dry-run comparison
        env:
          CATALOG_AUDIT_OUTPUT: korea-v2-dryrun-before-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Make batch dry-run preserve the six untouched public markets exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-publish-batch.mjs')
          s=p.read_text()
          old='''    .filter((offer) => offer.id && offer.make && offer.model && isCatalogYearAllowed(offer.year, other) && offer.images.length > 0 && withinRetention(offer) && canonicalPublic(offer) && isCatalogOfferBusinessLiquid(offer))'''
          new='''    .filter((offer) => offer.id && offer.make && offer.model && isCatalogYearAllowed(offer.year, other) && offer.images.length > 0)'''
          if s.count(old)!=1:
              raise SystemExit('batch preservation block not found exactly once')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/catalog-live-recovery-publish-batch.mjs
      - name: Dry-run cumulative Korea publication
        env:
          RECOVERY_BATCH_MARKETS: korea
          RECOVERY_BATCH_INPUT_DIR: .
          RECOVERY_BATCH_REPORT: korea-v2-publish-dry-run.json
          RECOVERY_BATCH_DRY_RUN: "1"
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Require dry-run to preserve all six other market counts
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const before=JSON.parse(fs.readFileSync('korea-v2-dryrun-before-all7.json','utf8'));
          const dry=JSON.parse(fs.readFileSync('korea-v2-publish-dry-run.json','utf8'));
          const k=dry.byMarket?.korea||{};
          if(!dry.dryRun || Number(k.count||0)<=0 || Number(k.maxOffersPerModelYear||0)!==20) throw new Error('korea_dry_run_invalid');
          for(const market of ['china','japan','uae','europe','georgia','kyrgyzstan']) {
            const expected=Number(before.markets?.[market]?.count||0);
            const preserved=Number(dry.preservedByMarket?.[market]||0);
            if(expected!==preserved) throw new Error(`dry_run_would_change_${market}:${expected}->${preserved}`);
          }
          console.log(JSON.stringify({korea:k,preserved:dry.preservedByMarket},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v2-merged
          path: |
            catalog-rebuild-korea.json
            korea-v2-merged-gate.json
            korea-v2-dryrun-before-all7.json
            korea-v2-publish-dry-run.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: merge_and_gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: korea-v2-merged
          path: korea-input
      - name: Fresh strict all-seven baseline at the write edge
        env:
          CATALOG_AUDIT_OUTPUT: korea-v2-write-edge-before-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Make targeted publisher preserve other six public markets exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-publish.mjs')
          s=p.read_text()
          old='''  const preserved = rows\n    .filter((offer) => ["active", "stale"].includes(String(offer?.status || "")))\n    .map(normalizeVisible)\n    .filter((offer) => offer.id && offer.make && offer.model && isCatalogYearAllowed(offer.year, other) && offer.images.length > 0 && withinRetention(offer) && isCatalogOfferBusinessLiquid(offer))\n    .slice(0, CATALOG_MAX_PUBLIC_OFFERS_PER_MARKET || 100_000);'''
          new='''  const preserved = rows\n    .filter((offer) => ["active", "stale"].includes(String(offer?.status || "")))\n    .map(normalizeVisible)\n    .filter((offer) => offer.id && offer.make && offer.model && isCatalogYearAllowed(offer.year, other) && offer.images.length > 0)\n    .slice(0, CATALOG_MAX_PUBLIC_OFFERS_PER_MARKET || 100_000);'''
          if s.count(old)!=1:
              raise SystemExit('targeted preservation block not found exactly once')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/catalog-live-recovery-publish.mjs
      - name: Publish Korea as one atomic seven-market generation
        env:
          RECOVERY_PUBLISH_MARKET: korea
          RECOVERY_PUBLISH_INPUT: korea-input/catalog-rebuild-korea.json
          RECOVERY_PUBLISH_REPORT: korea-v2-publish-report.json
          RECOVERY_PUBLISH_MAX: "30000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Strict all-seven audit after write
        env:
          CATALOG_AUDIT_OUTPUT: korea-v2-after-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
          CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Prove other six counts unchanged and Casper 2022 is live from Encar
        run: |
          npx tsx --eval '
            import fs from "node:fs";
            import { readMarketOffers } from "./apps/web/lib/catalog/storage.ts";
            (async () => {
              const before=JSON.parse(fs.readFileSync("korea-v2-write-edge-before-all7.json","utf8"));
              const after=JSON.parse(fs.readFileSync("korea-v2-after-all7.json","utf8"));
              for(const market of ["china","japan","uae","europe","georgia","kyrgyzstan"]) {
                const a=Number(before.markets?.[market]?.count||0), b=Number(after.markets?.[market]?.count||0);
                if(a!==b) throw new Error(`preservation_failed:${market}:${a}->${b}`);
              }
              const rows=await readMarketOffers("korea");
              const isHyundai=(v:any)=>/hyundai|현대|хенд[эе]/i.test(String(v||""));
              const isCasper=(v:any)=>/casper|캐스퍼|каспер/i.test(String(v||""));
              const c=rows.filter((o:any)=>Number(o.year)===2022 && isHyundai(o.make) && isCasper(o.model));
              const e=c.filter((o:any)=>o.sourceId==="encar_direct");
              console.log(JSON.stringify({korea:rows.length,casper2022:c.length,encarCasper2022:e.length,sample:e.slice(0,5).map((o:any)=>({id:o.id,sourceOfferId:o.sourceOfferId,year:o.year,images:o.images?.length||0,calculationStatus:o.calculationStatus,pricingConfidence:o.pricingConfidence,powerHp:o.powerHp,engineCc:o.engineCc}))},null,2));
              if(c.length<1 || e.length<1) throw new Error(`casper_2022_not_live:${c.length}:${e.length}`);
            })().catch((error)=>{console.error(error);process.exit(1);});
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-v2-publish
          path: |
            korea-v2-write-edge-before-all7.json
            korea-v2-publish-report.json
            korea-v2-after-all7.json
          if-no-files-found: warn
          retention-days: 3
