name: Ops · Refresh current display identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/lib/catalog/display-identity.ts"
      - "tests/catalog-display-identity.test.ts"
      - ".github/workflows/ops-refresh-current-display-identity.yml"

permissions:
  contents: read

concurrency:
  group: catalog-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_DISPLAY_IDENTITY_APPLY: "1"
      CATALOG_DISPLAY_IDENTITY_REPORT: catalog-current-display-identity-refresh.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate identity regressions
        run: node --import tsx --test tests/catalog-display-identity.test.ts tests/catalog-display-enrichment.test.ts tests/catalog-public-offer-deduplication.test.ts
      - name: Refresh current public read models without changing catalog generation
        run: node --import tsx scripts/catalog-refresh-current-display-identity.mjs
      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-display-identity-refresh
          path: catalog-current-display-identity-refresh.json
          if-no-files-found: warn
          retention-days: 7
