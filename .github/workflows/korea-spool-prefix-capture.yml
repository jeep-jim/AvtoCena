name: Korea bounded raw spool capture
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/korea-spool-prefix-capture.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: korea-spool-prefix-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || github.event.head_commit.message == 'Qualify bounded Korea raw spool capture')
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 12
    env:
      QUALIFICATION_MODE: capture
      QUALIFICATION_RUNTIME_ROOT: ${{ github.workspace }}/qualification-tools/source
      QUALIFICATION_CAPTURE_RUN: ''
      QUALIFICATION_CAPTURE_ATTEMPT: ''
      QUALIFICATION_CAPTURE_CONTROLLER_SHA: ''
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
    - name: Verify exact source CI and original snapshot ownership
      uses: actions/github-script@v7
      with:
        script: "const source='f9cd0a60545026d7fe7bf2b241e94720aa110bd9';\nconst contractSource='62dd048cfc492572e204191e7b5ed4bc5c4b478a';\n\
          const contractPins={\".github/workflows/korea-producer-contract.yml\": \"\
          f550d55f220b20bef59e3213f9a5044a851ad719\", \"apps/bot/package.json\": \"\
          f0c8f240b1a0322c60716f3fd5cc4d92d134fca9\", \"apps/bot/tsconfig.json\":\
          \ \"a0217ff90320ebf2105cd33fbba66607a2a68e39\", \"apps/web/lib/catalog/adapters.ts\"\
          : \"1211abaec6c0a9ed09345932c5b23ea6012bf6bd\", \"apps/web/lib/catalog/customer-parameters.ts\"\
          : \"2116c3262083a8b18b634826457f1c0a745c6bf5\", \"apps/web/lib/catalog/encar-sale-contract.ts\"\
          : \"cfbffed1d4a4170d2cf9380d2066d19298b5a57b\", \"apps/web/lib/catalog/offer-parameter-draft.ts\"\
          : \"4476126af1671daa5bd8bea9a89dd2032d97393d\", \"apps/web/lib/catalog/power-sanity.ts\"\
          : \"6fdd5dc6ea4e9a39ca1f913d00c476f144eb19ac\", \"apps/web/lib/catalog/powertrain-safety.ts\"\
          : \"e88fad24193067fb389f00d30e060afeea227279\", \"apps/web/lib/catalog/production-month.ts\"\
          : \"1d6b83b53b7cb03298e62000ed54afa1bbc98373\", \"apps/web/lib/catalog/spec-normalization.ts\"\
          : \"cbf3140710d7a837a0c582f826a4d016c6a7351c\", \"apps/web/lib/catalog/storage.ts\"\
          : \"2f436fa7035ae2aba1d81aa2f6c3d53ce6592564\", \"apps/web/package.json\"\
          : \"a66bc7dc145df71aceeec42fb66eadc1d607d796\", \"apps/web/tsconfig.json\"\
          : \"e9b5c8ac5dcdad71b87bb4eb318c1d1b3a0503d9\", \"package-lock.json\": \"\
          f60b4a7b321400b449e3bfdda02d0af972adc103\", \"package.json\": \"c4992f2ac64606e886871ea24de9d2363e612308\"\
          , \"packages/engine/package.json\": \"b9df1f1d6cd8a0d3a40de312b1682e25c79ab94a\"\
          , \"packages/engine/src/calculation/calculateAvtocena.ts\": \"85e590b4b7468cb98eef55e85cf0979d17b0f19a\"\
          , \"packages/engine/src/calculation/russiaCustoms.ts\": \"c4a65f561be343458312e08a5f1e7bb8bcd1c370\"\
          , \"packages/engine/src/calculation/russiaCustomsV2.ts\": \"55e9fb0633baa49fafe08536f373df12b0fcc17d\"\
          , \"packages/engine/tsconfig.json\": \"182181f2f4a4d5b9b77d2f76fe2a29507f1ca446\"\
          , \"packages/ui/package.json\": \"b9c7fa00410b0c643f44e1430422e15740c9a149\"\
          , \"scripts/lib/paid-encar-offer.mjs\": \"9be32148db67f4f23e6d22b8b6c952cb70cf6209\"\
          , \"services/browser-pilot/package.json\": \"780d043d1651f64b66405b45ed4060a170593ee2\"\
          , \"tests/propane-actual-projections.json\": \"38b78720d3056c0f4b8bc22d0cfe212d3b59c342\"\
          , \"tests/propane-producer.test.mjs\": \"b49f843b912c5a7e8bd766f7d305cf153edbb005\"\
          , \"tests/propane-runtime-pins.json\": \"1bfd34e2693d9f327cae6cc677daf145a796f092\"\
          };\nconst pr=(await github.rest.pulls.get({...context.repo,pull_number:1797})).data;\n\
          if(pr.head.sha!==source)throw Error('qualification_source_changed');\nconst\
          \ comparison=(await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:contractSource+'...'+source})).data;\n\
          if(!['ahead','identical'].includes(comparison.status)||comparison.merge_base_commit?.sha!==contractSource)throw\
          \ Error('qualification_contract_lineage');\nfor(const sha of [contractSource,source]){\n\
          \ const tree=(await github.rest.git.getTree({...context.repo,tree_sha:sha,recursive:'true'})).data;\n\
          \ if(tree.truncated)throw Error('qualification_contract_tree_truncated');\n\
          \ const entries=new Map(tree.tree.map(x=>[x.path,x]));\n for(const [file,blob]\
          \ of Object.entries(contractPins)){const x=entries.get(file);if(x?.type!=='blob'||x.sha!==blob||!['100644','100755'].includes(x.mode))throw\
          \ Error('qualification_contract_dependency_changed');}\n}\nfor(const [sha,name]\
          \ of [[source,'CI'],[contractSource,'Korea date and propane producer contract']]){\n\
          \ const runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:sha,per_page:100})).data.workflow_runs;\n\
          \ const run=runs.filter(x=>x.name===name).sort((a,b)=>b.id-a.id)[0];\n if(!run||run.head_sha!==sha||run.status!=='completed'||run.conclusion!=='success'||(name!=='CI'&&run.path!=='.github/workflows/korea-producer-contract.yml'))throw\
          \ Error('qualification_source_ci_not_green');\n}\nfor(const job_id of [133727443324,133845674226]){const\
          \ j=(await github.rest.actions.getJobForWorkflowRun({...context.repo,job_id})).data;if(j.run_id!==43989797288||j.conclusion!=='success')throw\
          \ Error('qualification_original_collection_identity');}\n"
    - uses: actions/checkout@v4
      with:
        ref: f9cd0a60545026d7fe7bf2b241e94720aa110bd9
        path: qualification-tools/source
        persist-credentials: false
    - name: Materialize hashed qualification tools
      run: 'python3 - <<''PY''

        import base64,hashlib

        from pathlib import Path

        f=Path(''qualification-tools/qualify-spool-prefix.mjs'');f.parent.mkdir(parents=True,exist_ok=True);b=base64.b64decode('''');assert
        hashlib.sha256(b).hexdigest()==''095ab85cd02eff355472134c94f4318e876028179b6d1d51bb2e62b2fee80917'';f.write_bytes(b)

        f=Path(''qualification-tools/run-spool-prefix-qualification.mjs'');f.parent.mkdir(parents=True,exist_ok=True);b=base64.b64decode('''');assert
        hashlib.sha256(b).hexdigest()==''f0600a4467846659550daee123cacf651e98c2a475d005b6f30c7ab7a9094cab'';f.write_bytes(b)

        f=Path(''qualification-tools/tests/qualification.test.mjs'');f.parent.mkdir(parents=True,exist_ok=True);b=base64.b64decode('''');assert
        hashlib.sha256(b).hexdigest()==''38f8761e3d1b19b06291f4d2fb4ce616978c5f7f5ad74f85eb17bbe3a9b58400'';f.write_bytes(b)

        PY

        '
    - name: Install exact lockfile before storage credentials
      working-directory: qualification-tools/source
      run: npm ci
    - name: Offline fixed-prefix and ownership fault tests
      run: node --import ./qualification-tools/source/node_modules/tsx/dist/loader.mjs
        --test qualification-tools/tests/qualification.test.mjs
    - name: Qualify only32 original pages without full receipt or cleanup
      env:
        JSON_STORAGE_DRIVER: object
        YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
        YC_OBJECT_STORAGE_REGION: us-east-1
        YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
        YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011
        YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
        YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY
          }}
      run: 'mkdir -p saved-encar-checkpoint

        timeout --signal=TERM --kill-after=5s 300s node --import ./qualification-tools/source/node_modules/tsx/dist/loader.mjs
        qualification-tools/run-spool-prefix-qualification.mjs > saved-encar-checkpoint/qualification.log
        2>&1

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: korea-spool-prefix-capture-${{ github.run_id }}
        path: saved-encar-checkpoint/
        if-no-files-found: warn
        retention-days: 7
