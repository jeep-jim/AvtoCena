name: Diagnose Georgia blocked source routes
on:
  push:
    branches: [diag/georgia-blocked-routes-20260810]
    paths:
      - .github/workflows/diag-georgia-blocked-routes-20260810.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact public routes from GitHub runner
        shell: bash
        run: |
          node <<'NODE'
          const routes = [
            ['myauto-www-main','https://www.myauto.ge/en/main?page=1'],
            ['myauto-main','https://myauto.ge/en/main?page=1'],
            ['myauto-www-search','https://www.myauto.ge/en/s/?page=1'],
            ['myauto-search','https://myauto.ge/en/s/?page=1'],
            ['myauto-www-home','https://www.myauto.ge/'],
            ['myauto-home','https://myauto.ge/'],
            ['autopapa-search','https://autopapa.ge/search?q=&page=1'],
            ['autopapa-ge-search','https://autopapa.ge/ka/search?q=&page=1'],
            ['autopapa-home','https://autopapa.ge/'],
          ];
          const headerSets = [
            ['desktop', {
              'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
              'accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'accept-language':'en-US,en;q=0.9,ka;q=0.8',
              'cache-control':'no-cache',
            }],
            ['mobile', {
              'user-agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
              'accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'accept-language':'en-US,en;q=0.9,ka;q=0.8',
            }],
          ];
          for (const [label,url] of routes) {
            for (const [headersLabel,headers] of headerSets) {
              try {
                const r = await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(20000)});
                const text = await r.text();
                const summary = {
                  label, headers:headersLabel, status:r.status, finalUrl:r.url, bytes:text.length,
                  contentType:r.headers.get('content-type')||'',
                  prLinks:(text.match(/\/en\/pr\//g)||[]).length,
                  searchLinks:(text.match(/\/search|\/s\//g)||[]).length,
                  hasNextData:text.includes('__NEXT_DATA__'),
                  challenge:/captcha|cloudflare|access denied|forbidden|verify you are human|robot/i.test(text.slice(0,20000)),
                  title:(text.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]||'').replace(/\s+/g,' ').slice(0,180),
                  preview:text.replace(/\s+/g,' ').slice(0,240),
                };
                console.log(JSON.stringify(summary));
              } catch(e) {
                console.log(JSON.stringify({label,headers:headersLabel,error:String(e)}));
              }
            }
          }
          NODE
