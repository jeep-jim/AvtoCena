name: Check saved China preparation archive
on:
  push:
    branches: [main]
    paths: [.github/market-runs/china-prepare-v3-archive-readonly-v1.sha256]
permissions:
  contents: read
concurrency:
  group: china-prepare-v3-archive-readonly-exclusive-v1
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'jeep-jim/AvtoCena' && github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.event.head_commit.message == 'Check saved China preparation archive'
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            .github/operations/china-prepare-v3-archive-readonly-v1
            .github/market-runs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Validate sole immutable read-only marker and exact actor
        shell: bash
        run: |
          set -euo pipefail
          p=.github/market-runs/china-prepare-v3-archive-readonly-v1.sha256
          body=.github/operations/china-prepare-v3-archive-readonly-v1/archive-readonly-reconcile.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$p")"
          test "$(git log -1 --format=%B)" = "Check saved China preparation archive"
          test "$(git cat-file -s "HEAD:$p")" -eq 106
          actual="$(sha256sum "$body" | cut -d ' ' -f1)"
          test "$actual" = f7e5ec7e216b0cd26bd11126ef3ddc0c6cc3b97de67dfad56f5bfef11f024deb
          printf '%s\n%s\n' "$actual" "$(git rev-parse HEAD^)" | cmp -s "$p" -
          node --check "$body"
      - name: Read only exact V3 archive metadata and raw producer pin
        env:
          REG_ACCESS: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          REG_SECRET: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/operations/china-prepare-v3-archive-readonly-v1/archive-readonly-reconcile.mjs
