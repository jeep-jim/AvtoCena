name: Validate preliminary electrified mode

on:
  push:
    branches:
      - fix/preliminary-electrified-20260810
    paths:
      - ".github/workflows/validate-preliminary-electrified.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply preliminary EV/HEV patch
        run: python scripts/apply-preliminary-electrified-mode.py
      - name: Typecheck and script syntax
        shell: bash
        run: |
          npm run typecheck
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
      - name: Verify preliminary customs contract
        shell: bash
        run: |
          cat > .tmp-preliminary-electrified-smoke.ts <<'TS'
          import { calculateRussiaCustomsForIndividual } from "./packages/engine/src/calculation/russiaCustoms.ts";
          import { isPreliminaryElectrifiedCalculation } from "./apps/web/lib/catalog/customs-pricing.ts";
          import { catalogOfferVisibleRub, catalogPublicPriority } from "./apps/web/lib/catalog/public-priority.ts";

          const customs = calculateRussiaCustomsForIndividual({
            customsValueRub: 3_000_000,
            eurRateRub: 95,
            powerHp: 250,
            powerKw: 184,
            powertrainKind: "electric",
            year: 2024,
          });
          if (customs.status !== "needs_data") throw new Error(`expected needs_data, got ${customs.status}`);
          if (!(customs.importDutyRub > 0)) throw new Error("EV import duty disappeared when 30-min power is absent");
          if (!(customs.knownCustomsRub > customs.customsClearanceFeeRub)) throw new Error("known EV customs should include more than clearance");
          if (customs.totalCustomsRub !== undefined) throw new Error("unknown utilization fee must not become exact total");
          if (!customs.missing.includes("certified_30_minute_power_kw")) throw new Error("missing 30-min power not preserved");

          const breakdownIds = ["car","topavto-commission","broker","svh","laboratory","sbkts","epts","rf-delivery","customs"];
          const offer:any = {
            id:"smoke", market:"korea", make:"Kia", model:"EV6", year:2024, status:"active",
            sourcePrice:30_000_000, sourceCurrency:"KRW", totalRub:3_500_000,
            powertrainKind:"electric", calculationStatus:"preliminary_power_pending",
            images:[{url:"https://example.com/car.jpg"}],
            calculationSnapshot:{
              pricingConfidence:"preliminary", priceIncludesUtilizationFee:false,
              missing:["certified_30_minute_power_kw"], excludedPriceItems:["utilization-fee"],
              customs:{status:"needs_data", missing:["certified_30_minute_power_kw"], knownCustomsRub:900_000},
              breakdown:breakdownIds.map((id,index)=>({id,amountRub:index===0?2_000_000:100_000})),
            },
          };
          if (!isPreliminaryElectrifiedCalculation(offer)) throw new Error("preliminary helper rejected explicit power-pending EV");
          if (catalogOfferVisibleRub(offer) !== 3_500_000) throw new Error("preliminary EV price is not publicly visible");
          const priority = catalogPublicPriority(offer);
          if (!priority.eligible || !priority.preliminary || priority.calculated) throw new Error(`bad preliminary priority ${JSON.stringify(priority)}`);
          console.log(JSON.stringify({customs, priority}, null, 2));
          TS
          npx tsx .tmp-preliminary-electrified-smoke.ts
          rm -f .tmp-preliminary-electrified-smoke.ts
      - name: Verify collectors accept only explicit preliminary mode
        shell: bash
        run: |
          grep -q 'isPreliminaryElectrifiedCalculation(calculated)' scripts/catalog-live-recovery-market.mjs
          grep -q 'isPreliminaryElectrifiedCalculation(calculated)' scripts/catalog-live-recovery-japan-prestige.mjs
          grep -q 'isPreliminaryElectrifiedCalculation(calculated)' scripts/catalog-live-recovery-direct-exact.mjs
          grep -q 'isPreliminaryElectrifiedCalculation(calculated)' scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
          grep -q 'isPreliminaryElectrifiedCalculation(calculated)' scripts/catalog-live-recovery-europe-otomoto.mjs
          grep -q 'publishableCalculation' scripts/catalog-live-recovery-publish.mjs
      - name: Commit validated source changes to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/engine/src/calculation/russiaCustoms.ts \
            apps/web/lib/catalog/customs-pricing.ts \
            apps/web/lib/catalog/public-priority.ts \
            apps/web/components/catalog/CatalogPrice.tsx \
            'apps/web/app/(public)/cars/offer/[id]/page.tsx' \
            scripts/catalog-live-recovery-market.mjs \
            scripts/catalog-live-recovery-japan-prestige.mjs \
            scripts/catalog-live-recovery-direct-exact.mjs \
            scripts/catalog-live-recovery-kyrgyzstan-direct.mjs \
            scripts/catalog-live-recovery-europe-otomoto.mjs \
            scripts/catalog-live-recovery-publish.mjs
          git commit -m "Publish truthful preliminary EV and hybrid prices"
          git reset --hard HEAD
          git clean -fd
          git push origin HEAD:fix/preliminary-electrified-20260810
