name: One-shot Georgia gallery cleanup live
run-name: Georgia exact gallery cleanup live · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-georgia-gallery-cleanup-live-20260811.yml

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_IMAGES_PER_OFFER: "30"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck current production code
        run: npm run typecheck
      - name: Refresh all retained Georgia low-photo rows and publish atomically
        run: npx tsx scripts/oneshot-georgia-gallery-cleanup-live.mts
      - name: Audit all seven markets after cleanup
        env:
          CATALOG_AUDIT_OUTPUT: catalog-georgia-gallery-cleanup-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: georgia
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
