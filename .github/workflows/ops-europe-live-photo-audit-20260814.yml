name: Ops · Europe live photo audit 20260814

on:
  push:
    branches:
      - ops/europe-live-photo-audit-20260814
    paths:
      - ".github/workflows/ops-europe-live-photo-audit-20260814.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_READ_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit live Europe source photo quality without writes
        shell: bash
        run: |
          cat > audit-europe-photos.ts <<'TS'
          import fs from "node:fs";
          import { readAllOffersForMaintenance } from "./apps/web/lib/catalog/storage";

          const urls = (offer: any) => (Array.isArray(offer?.images) ? offer.images : [])
            .map((image: any) => String(image?.url || ""))
            .filter(Boolean);
          const uniq = (values: string[]) => [...new Set(values)];
          const sourceStats = (rows: any[]) => {
            const allUrls = rows.flatMap(urls);
            const uniqueUrls = uniq(allUrls);
            const cardsBelow5 = rows.filter((row) => uniq(urls(row)).length < 5);
            const withKnownDimensions = rows.filter((row) => (row.images || []).some((image: any) => Number(image?.width || 0) > 0 && Number(image?.height || 0) > 0));
            const allKnownHq = rows.filter((row) => {
              const images = row.images || [];
              return images.length >= 5 && images.every((image: any) => Number(image?.width || 0) >= 900 && Number(image?.height || 0) >= 600);
            });
            return {
              cards: rows.length,
              images: allUrls.length,
              uniqueImages: uniqueUrls.length,
              cardsBelow5: cardsBelow5.length,
              cardsWithKnownDimensions: withKnownDimensions.length,
              cardsAllKnownHq: allKnownHq.length,
              photoIdentityVerified: rows.filter((row) => row?.operational?.photoIdentityVerified === true || row?.operational?.raw?.photoIdentityVerified === true).length,
              photoResolutionVerified: rows.filter((row) => row?.operational?.photoResolutionVerified === true || row?.operational?.raw?.photoResolutionVerified === true).length,
              sampleBelow5: cardsBelow5.slice(0, 10).map((row) => ({id: row.sourceOfferId, title: row.sourceTitle, images: uniq(urls(row)).length, first: urls(row)[0]})),
            };
          };

          async function main() {
            const all = await readAllOffersForMaintenance();
            const europe = all.filter((offer: any) => offer.market === "europe" && offer.status === "active");
            const bySource = new Map<string, any[]>();
            for (const offer of europe) {
              const key = String(offer.sourceId || "unknown");
              bySource.set(key, [...(bySource.get(key) || []), offer]);
            }
            const autoscout = bySource.get("autoscout_europe_open") || [];
            const autoUrls = autoscout.flatMap(urls);
            const autoscout250 = autoscout.filter((row) => urls(row).some((url) => /\/250x188(?:\.|\/|\?|$)/i.test(url)));
            const autoscoutHqUrlCards = autoscout.filter((row) => urls(row).length >= 5 && urls(row).every((url) => /\/(?:9\d\d|1\d{3,})x(?:6\d\d|7\d\d|8\d\d|9\d\d|1\d{3,})(?:\.|\/|\?|$)/i.test(url)));
            const mobile = bySource.get("mobile_de_open") || [];
            const otomoto = [...bySource.entries()].filter(([key]) => /otomoto/i.test(key)).flatMap(([, rows]) => rows);

            const report = {
              generatedAt: new Date().toISOString(),
              totalEurope: europe.length,
              sources: Object.fromEntries([...bySource.entries()].sort(([a],[b]) => a.localeCompare(b)).map(([sourceId, rows]) => [sourceId, sourceStats(rows)])),
              autoscout: {
                ...sourceStats(autoscout),
                cardsWith250x188: autoscout250.length,
                imagesWith250x188: autoUrls.filter((url) => /\/250x188(?:\.|\/|\?|$)/i.test(url)).length,
                cardsWithOnlyHqUrlRenditions: autoscoutHqUrlCards.length,
                sample250x188: autoscout250.slice(0, 20).map((row) => ({id: row.sourceOfferId, title: row.sourceTitle, first: urls(row)[0], sourceUrl: row?.operational?.sourceUrl})),
              },
              mobile: {
                ...sourceStats(mobile),
                cardsWithMo1600: mobile.filter((row) => urls(row).some((url) => /(?:rule=mo-1600|mo-1600)/i.test(url))).length,
              },
              otomoto: {
                ...sourceStats(otomoto),
                cardsWith1200x800: otomoto.filter((row) => urls(row).some((url) => /(?:1200x800|s=1200x800)/i.test(url))).length,
              },
            };
            fs.writeFileSync("europe-live-photo-audit.json", JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          TS
          npx tsx audit-europe-photos.ts
          rm audit-europe-photos.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-live-photo-audit
          path: europe-live-photo-audit.json
          if-no-files-found: error
          retention-days: 3
