name: Regcloud — block owner-reported crawlers
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-owner-bot-block.json']
permissions:
  contents: write
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  block:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify narrow owner scope and unchanged scheduled workflows
        run: |
          set -euo pipefail
          python3 .github/owner-bot-block/apply.py --self-test
          python3 - <<'PY'
          import json, pathlib, subprocess, hashlib
          marker=json.load(open('.github/market-runs/regcloud-owner-bot-block.json'))
          assert marker['release']=='463fd22559a2f9c5acd60f8f5e4b269689215c84'
          assert marker['bots']==['Amazonbot','Reflectionbot']
          for path,digest in marker['sha256'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest, path
          baseline='c88508faedbd84b730dc9a2b40e696643216d894'
          scheduled=[]
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              if '\n  schedule:' in path.read_text():
                  old=subprocess.check_output(['git','show',baseline+':'+str(path)])
                  assert old==path.read_bytes(), str(path)
                  scheduled.append(str(path))
          assert len(scheduled)==19, len(scheduled)
          assert subprocess.check_output(['git','diff',baseline,'HEAD','--','apps','packages','scripts','tests','docker']).strip()==b''
          print('UNCHANGED_APPLICATION_AND_SCHEDULES',len(scheduled))
          PY
      - name: Block crawlers in nginx and verify retained historical container
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          tar -czf "$RUNNER_TEMP/owner-bot-block.tar.gz" -C .github/owner-bot-block apply.py amazonbot.json reflectionbot.json
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 "set -eu; umask 077; work=\$(mktemp -d /tmp/avtocena-owner-bot-block.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; tar -xzf - -C \"\$work\"; python3 \"\$work/apply.py\" '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/owner-bot-block.tar.gz" | tee owner-bot-block-run.log
      - name: Verify public crawler rejection and exact November 8 release
        run: python3 .github/owner-bot-block/verify-public.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-bot-block-evidence
          path: |
            owner-bot-block-run.log
            owner-bot-block-public.json
          if-no-files-found: ignore
      - name: Record actual outcome in roadmap and current incident
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B owner-bot-block-result origin/main
          python3 .github/owner-bot-block/record-result.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roadmap.md docs/operations/current-incident.md
          if test -f docs/operations/2026-11-11-owner-bot-block.json; then git add docs/operations/2026-11-11-owner-bot-block.json; fi
          git commit -m 'docs: record verified November 8 rollback and crawler-block outcome'
          git push origin HEAD:main
