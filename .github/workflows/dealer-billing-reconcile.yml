name: Dealer billing reconciliation
on:
  schedule:
    # Hourly; 17:07 UTC = 00:07 Asia/Krasnoyarsk. Scheduler timing is not guaranteed.
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avtocena-dealer-billing
  cancel-in-progress: false
jobs:
  reconcile:
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile immutable dealer charges and payments
        env:
          JSON_STORAGE_DRIVER: object
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          DEALER_YOOKASSA_SHOP_ID: ${{ secrets.DEALER_YOOKASSA_SHOP_ID }}
          DEALER_YOOKASSA_SECRET: ${{ secrets.DEALER_YOOKASSA_SECRET }}
          DEALER_PAYMENTS_ENABLED: ${{ vars.DEALER_PAYMENTS_ENABLED }}
          DEALER_PAYMENTS_MODE: ${{ vars.DEALER_PAYMENTS_MODE }}
          DEALER_RECEIPTS_CONFIRMED: ${{ vars.DEALER_RECEIPTS_CONFIRMED }}
          DEALER_FISCAL_FLOW_CONFIRMED: ${{ vars.DEALER_FISCAL_FLOW_CONFIRMED }}
        run: node --import tsx scripts/dealer-billing-reconcile.ts
