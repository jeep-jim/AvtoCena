name: Validate hard public exact-model cap 20 · 20260812

on:
  push:
    branches: [fix/hard-public-model-cap-20-20260812-validation]
    paths:
      - scripts/catalog-live-recovery-publish.mjs
      - .github/workflows/validate-hard-public-model-cap-20-20260812.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Publisher source smoke
        run: |
          node --check scripts/catalog-live-recovery-publish.mjs
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('scripts/catalog-live-recovery-publish.mjs','utf8');
          if (!/const maxOffersPerModel = 20;/.test(s)) throw new Error('hard cap 20 missing');
          if (/process\.env\.CATALOG_MAX_OFFERS_PER_MODEL/.test(s)) throw new Error('unsafe model-cap env override remains');
          console.log('hard_public_model_cap_20_source_ok');
          NODE
      - name: Model-cap regression smoke
        run: node --import tsx --test tests/catalog-global-model-cap.test.ts
      - name: Read-only all7 audit
        env:
          CATALOG_AUDIT_OUTPUT: catalog-model-cap-readonly-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-public-model-cap-20-validation-20260812
          path: catalog-model-cap-readonly-audit.json
          if-no-files-found: warn
          retention-days: 2
