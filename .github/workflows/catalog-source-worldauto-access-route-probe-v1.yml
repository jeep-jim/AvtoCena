name: Catalog source qualification · WorldAuto access and route probe v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/worldauto-detail-route-probe-v1-20260904
    paths:
      - ".github/workflows/catalog-source-worldauto-access-route-probe-v1.yml"
      - "scripts/catalog-source-worldauto-access-route-probe-v1.mjs"
      - "tests/catalog-source-worldauto-access-route-probe-v1.test.ts"
      - "scripts/catalog-source-access-probe-v1.mjs"
      - "data/catalog/source-qualification-v1.json"

permissions:
  contents: read

concurrency:
  group: catalog-source-worldauto-access-route-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify WorldAuto route and restriction extraction contract
        run: node --import tsx --test tests/catalog-source-worldauto-access-route-probe-v1.test.ts
      - name: Probe only robots and registry-declared WorldAuto search page
        env:
          CATALOG_SOURCE_WORLDAUTO_TIMEOUT_MS: "15000"
          CATALOG_SOURCE_WORLDAUTO_MAX_BODY_BYTES: "900000"
        run: node scripts/catalog-source-worldauto-access-route-probe-v1.mjs
      - name: Verify permission-first no-write envelope
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('catalog-source-worldauto-access-route-probe-v1.json','utf8'));
          for (const key of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) {
            if (p[key] !== false) throw new Error(`${key} must be false`);
          }
          if (p.sourceId !== 'worldauto_georgia_candidate') throw new Error(`sourceId ${p.sourceId}`);
          if (![1,2].includes(p.requestCount)) throw new Error(`requestCount ${p.requestCount}`);
          if (p.detailRequests !== 0 || p.paginationRequests !== 0 || p.scriptRequests !== 0) throw new Error('probe escaped permission-first envelope');
          if (!p.robots?.policy) throw new Error('robots policy missing');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-worldauto-access-route-probe-v1
          path: catalog-source-worldauto-access-route-probe-v1.json
          if-no-files-found: error
          retention-days: 7
