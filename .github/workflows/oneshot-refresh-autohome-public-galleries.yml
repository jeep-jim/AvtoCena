name: One-shot refresh AutoHome public galleries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-refresh-autohome-public-galleries.yml

permissions:
  contents: write

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_MAX_IMAGES_PER_OFFER: 30
      CATALOG_MAX_OFFERS_PER_MODEL: 20
      CATALOG_OFFER_RETENTION_MS: 259200000
      GALLERY_REFRESH_LIMIT: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load validated gallery refresh script
        run: |
          git fetch origin fix/autohome-public-gallery-refresh-20260810
          git show origin/fix/autohome-public-gallery-refresh-20260810:scripts/catalog-refresh-autohome-galleries.mts > scripts/catalog-refresh-autohome-galleries.mts
      - name: Re-fetch stale AutoHome galleries by exact spec id
        run: npx tsx scripts/catalog-refresh-autohome-galleries.mts
      - name: Require meaningful exact upgrades
        run: |
          node - <<'NODE'
          const r=require('./catalog-autohome-gallery-refresh-report.json');
          if (!r.passed || r.refreshed < 10) throw new Error(`gallery refresh too weak ${JSON.stringify({attempted:r.attempted,refreshed:r.refreshed,failed:r.failed})}`);
          console.log({attempted:r.attempted,refreshed:r.refreshed,failed:r.failed,beforeBelow5:r.beforeBelow5});
          NODE
      - name: Publish refreshed China rows while preserving all seven markets
        env:
          RECOVERY_PUBLISH_MARKET: china
          RECOVERY_PUBLISH_INPUT: catalog-autohome-gallery-refresh.json
          RECOVERY_PUBLISH_REPORT: catalog-autohome-gallery-refresh-publish-report.json
          RECOVERY_PUBLISH_MAX: 30000
          RECOVERY_PREFERRED_MAX_RUB: 8000000
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Audit all seven after gallery write
        env:
          CATALOG_AUDIT_OUTPUT: catalog-autohome-gallery-refresh-postpersist.json
          CATALOG_AUDIT_ASSERT_MARKETS: china
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":2832,"china":8132,"japan":423,"uae":173,"europe":4704,"georgia":51,"kyrgyzstan":2337}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autohome-public-gallery-refresh-live-report
          path: |
            catalog-autohome-gallery-refresh-report.json
            catalog-autohome-gallery-refresh-publish-report.json
            catalog-autohome-gallery-refresh-postpersist.json
          retention-days: 3
      - name: Remove one-shot workflow
        if: always()
        run: |
          git pull --rebase origin main
          rm .github/workflows/oneshot-refresh-autohome-public-galleries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oneshot-refresh-autohome-public-galleries.yml
          git commit -m "Remove one-shot AutoHome gallery refresher [skip actions]"
          git push origin HEAD:main
