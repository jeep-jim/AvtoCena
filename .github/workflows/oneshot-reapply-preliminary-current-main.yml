name: Reapply preliminary EV hybrid current main
on:
  push:
    branches: [fix/catalog-shards-preliminary-20260810]
    paths: [.github/workflows/oneshot-reapply-preliminary-current-main.yml]
permissions:
  contents: write
jobs:
  apply_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-shards-preliminary-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reapply only PR234 production changes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'apps/web/app/(public)/cars/offer/[id]/page.tsx'
            'apps/web/components/catalog/CatalogPrice.tsx'
            'apps/web/lib/catalog/customs-pricing.ts'
            'apps/web/lib/catalog/public-priority.ts'
            'packages/engine/src/calculation/russiaCustoms.ts'
            'scripts/catalog-live-recovery-direct-exact.mjs'
            'scripts/catalog-live-recovery-europe-otomoto.mjs'
            'scripts/catalog-live-recovery-japan-prestige.mjs'
            'scripts/catalog-live-recovery-kyrgyzstan-direct.mjs'
            'scripts/catalog-live-recovery-market.mjs'
            'scripts/catalog-live-recovery-publish.mjs'
          )
          git diff --binary 530db038a64cb9e78f82b6eb3521e73e907a9eb6 76ea2758e807552aac1dfba019d41601fd704b40 -- "${files[@]}" > /tmp/preliminary.patch
          test -s /tmp/preliminary.patch
          git apply --3way /tmp/preliminary.patch
          grep -R "preliminary_power_pending" "${files[@]}" >/dev/null
          grep -F 'priceIncludesUtilizationFee: false' apps/web/lib/catalog/customs-pricing.ts
          grep -F 'Предварительно от' apps/web/components/catalog/CatalogPrice.tsx
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-kyrgyzstan-direct.mjs
          node --check scripts/catalog-live-recovery-japan-prestige.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Commit validated production changes
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/oneshot-reapply-preliminary-current-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web packages/engine scripts
          git commit -m 'Restore preliminary EV hybrid pricing on current main'
          git push origin HEAD:fix/catalog-shards-preliminary-20260810
