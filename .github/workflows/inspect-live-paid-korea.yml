name: Inspect live paid Korea after release
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-live-paid-korea.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: regcloud-staging
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 83ff17075e9188dcf227c8752dc064248d5f42e0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - name: Read public health, paid search, CRM and encyclopedia
        run: |
          node --import tsx --input-type=module <<'CHECK'
          import {getJsonStorage} from './apps/web/lib/data.ts';
          import {readCollectionControls} from './apps/web/lib/catalog/collection-controls.ts';
          const storage=getJsonStorage();
          const controls=await readCollectionControls(storage);
          const manifest=await storage.readJson('catalog/manifest.json',null);
          console.log('STORAGE_STATE',JSON.stringify({generation:manifest?.generationId,korea:manifest?.markets?.korea?.count,provider:manifest?.markets?.korea?.provider,revision:controls.revision,market:controls.markets.korea.enabled,paid:controls.sources.encar_feed.enabled,old:controls.sources.ajes_korea_feed?.enabled===true}));
          for(const path of ['/api/health','/api/catalog/search?market=korea&marketPage=1&page=1&pageSize=3','/api/encyclopedia/7efa3d4933728bc66771084b?year=2022']){
           for(let attempt=1;attempt<=3;attempt++){
            const start=Date.now();
            try{
             const response=await fetch('https://avtocena.com'+path,{signal:AbortSignal.timeout(45000),headers:{'Cache-Control':'no-cache'}});
             const body=await response.json().catch(()=>({}));
             console.log('PUBLIC',JSON.stringify({path,attempt,status:response.status,ms:Date.now()-start,release:body.releaseSha,calculator:body.calculationVersion,total:body.total,paidRows:Array.isArray(body.items)?body.items.filter(x=>x.paidEncar===true).length:undefined,error:body.error}));
            }catch(error){console.log('PUBLIC',JSON.stringify({path,attempt,ms:Date.now()-start,error:error.name}));}
            if(attempt<3)await new Promise(r=>setTimeout(r,3500));
           }
          }
          CHECK
      - name: Read active container and disk without mutation
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          chmod 600 "$key_file"
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'df -B1 /; docker ps --format "{{.Names}} {{.Image}} {{.Status}}" | head -12'
