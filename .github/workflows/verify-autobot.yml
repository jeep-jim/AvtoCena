name: Verify Autobot tools and tab memory
on:
  push:
    paths: ['apps/web/lib/autobot/**', 'apps/web/components/autobot/**', 'apps/web/lib/autocalc/source.ts', 'tests/autobot.test.ts', 'tests/catalog-japan-filter-rail.test.ts', 'tests/browser/autobot-session.mjs', '.github/workflows/verify-autobot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/autobot.test.ts tests/autocalc-route.test.ts tests/autocalc-enrichment.test.ts tests/ajes-model-loader.test.ts tests/catalog-japan-filter-rail.test.ts tests/ajes-count-display.test.ts tests/public-page-recovery.test.ts tests/catalog-home-count.test.ts
      - run: npm run typecheck
      - run: npm install --prefix "$RUNNER_TEMP/autobot-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Verify tab lifetime in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/autobot-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/autobot-session.mjs
