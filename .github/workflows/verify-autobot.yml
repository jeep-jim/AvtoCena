name: Verify Autobot tools and tab memory
on:
  push:
    paths: ['apps/web/lib/autobot/**', 'apps/web/components/autobot/**', 'apps/web/lib/autocalc/source.ts', 'tests/autobot.test.ts', 'tests/catalog-japan-filter-rail.test.ts', 'tests/browser/autobot-session.mjs', 'tests/browser/analytics-choice*', 'apps/web/components/analytics/AnalyticsChoiceNotice.tsx', 'apps/web/components/layout/PublicLegalFooter.tsx', 'tests/browser/team-assistant.mjs', 'apps/web/components/crm/assistant/**', 'apps/web/lib/team-assistant/**', '.github/workflows/verify-autobot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/autobot.test.ts tests/autocalc-route.test.ts tests/autocalc-enrichment.test.ts tests/ajes-model-loader.test.ts tests/catalog-japan-filter-rail.test.ts tests/ajes-count-display.test.ts tests/public-page-recovery.test.ts tests/catalog-home-count.test.ts
      - run: npm run typecheck
      - run: npm install --prefix "$RUNNER_TEMP/autobot-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Verify tab lifetime in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/autobot-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/autobot-session.mjs
      - name: Verify mobile cookie layout and hidden Autobot recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/autobot-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/analytics-choice.mjs
      - name: Verify confirmed form filling without submitting
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/autobot-browser/node_modules/playwright/index.mjs
        run: CHROME_BIN=$(command -v google-chrome) node tests/browser/team-assistant.mjs

      - name: Preserve assistant presentation check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-presentation
          path: |
            /tmp/avtocena-autobot-session/structured-answer-desktop.png
            artifacts/analytics-choice/*.png
            artifacts/analytics-choice/results.json
          if-no-files-found: ignore
