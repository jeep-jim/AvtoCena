name: Vehicle knowledge backfill 2011+

on:
  workflow_dispatch:
  schedule:
    - cron: "40 1 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/vehicle-knowledge-backfill-2011.yml

# rollout-marker: drom-parser-v2-backfill-2026-08-05-1725

permissions:
  contents: write

concurrency:
  group: vehicle-knowledge-backfill-2011
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: file
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: 2011
      VEHICLE_KNOWLEDGE_CHUNK_SIZE: 250
      VEHICLE_KNOWLEDGE_RECENT_YEARS: 15
      DROM_KNOWLEDGE_ONLY_RECENT: 0
      DROM_KNOWLEDGE_LIMIT: 1000
      DROM_KNOWLEDGE_BATCHES: 4
      DROM_KNOWLEDGE_DELAY_MS: 700
      DROM_KNOWLEDGE_RETRY_DAYS: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Hydrate verified production offers from Object Storage
        run: |
          node --import tsx <<'NODE'
          const { ObjectJsonStorage, LocalJsonStorage } = await import('./apps/web/lib/data.ts');
          const remote = new ObjectJsonStorage();
          const local = new LocalJsonStorage();
          const manifestPath = 'catalog/internal/manifest.json';
          const manifest = await remote.readJson(manifestPath, { generationId: '', sources: {} });
          const chunks = [...new Set(Object.values(manifest.sources || {}).flatMap((source) => source?.chunks || []))];
          if (!manifest.generationId || chunks.length === 0) {
            throw new Error(`production_catalog_not_ready: generationId=${manifest.generationId || 'empty'}, chunks=${chunks.length}`);
          }
          await local.writeJson(manifestPath, manifest);
          let offers = 0;
          for (const chunk of chunks) {
            const rows = await remote.readJson(chunk, []);
            if (!Array.isArray(rows)) throw new Error(`invalid_production_catalog_chunk:${chunk}`);
            offers += rows.length;
            await local.writeJson(chunk, rows);
          }
          console.log(JSON.stringify({ generationId: manifest.generationId, chunks: chunks.length, offers }, null, 2));
          if (offers <= 0) throw new Error('production_catalog_has_no_offers');
          NODE
      - name: Synchronize every catalog make and model from 2011 onward
        run: npm run catalog:sync-vehicle-models
      - name: Enrich prioritized batches without skipping older 2011+ models
        shell: bash
        run: |
          set -euo pipefail
          for batch in $(seq 1 "$DROM_KNOWLEDGE_BATCHES"); do
            echo "Knowledge batch ${batch}/${DROM_KNOWLEDGE_BATCHES}"
            npm run catalog:enrich-drom-variants || status=$?
            status=${status:-0}
            if [ "$status" -eq 2 ]; then
              echo "Source rate-limited; progress is saved and the next daily run will continue."
              break
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            unset status
          done
      - name: Build missing variants from verified live catalog offers
        run: npm run catalog:build-vehicle-variants
      - name: Reject false-green empty knowledge runs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const enrichment = JSON.parse(fs.readFileSync('data/catalog/vehicle-knowledge/drom-enrichment-report.json', 'utf8'));
          const build = JSON.parse(fs.readFileSync('data/catalog/vehicle-knowledge/variant-build-report.json', 'utf8'));
          const ready = Number(enrichment.ready || 0);
          const enrichedVariants = Number(enrichment.variants || 0);
          const totalVariants = Number(build.totalVariants || 0);
          const scannedOffers = Number(build.scannedOffers || 0);
          console.log(JSON.stringify({ ready, enrichedVariants, totalVariants, scannedOffers }, null, 2));
          if (ready < 1 || enrichedVariants < 1 || totalVariants < 10 || scannedOffers < 1) {
            throw new Error(`vehicle_knowledge_not_ready: ready=${ready}, enrichedVariants=${enrichedVariants}, totalVariants=${totalVariants}, scannedOffers=${scannedOffers}`);
          }
          NODE
      - name: Validate knowledge and Drom parsing
        run: node --import tsx --test tests/vehicle-knowledge.test.ts tests/drom-vehicle-knowledge.test.ts tests/vehicle-knowledge-production-window.test.mjs
      - name: Commit versioned vehicle knowledge to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/vehicle-knowledge data/catalog/power-knowledge data/catalog/power-reference data/models
          if git diff --cached --quiet; then
            echo "Vehicle knowledge is already current."
            exit 0
          fi
          git commit -m "data: refresh vehicle knowledge 2011+"
          git push origin HEAD:main
