name: Vehicle knowledge backfill 2011+

on:
  workflow_dispatch:
  schedule:
    - cron: "40 1 * * *"

permissions:
  contents: read

concurrency:
  group: vehicle-knowledge-backfill-2011
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      VEHICLE_KNOWLEDGE_MIN_MODEL_YEAR: 2011
      VEHICLE_KNOWLEDGE_CHUNK_SIZE: 250
      VEHICLE_KNOWLEDGE_RECENT_YEARS: 15
      DROM_KNOWLEDGE_ONLY_RECENT: 0
      DROM_KNOWLEDGE_LIMIT: 1000
      DROM_KNOWLEDGE_BATCHES: 4
      DROM_KNOWLEDGE_DELAY_MS: 700
      DROM_KNOWLEDGE_RETRY_DAYS: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Object Storage configuration
        run: |
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
      - name: Synchronize every catalog make and model from 2011 onward
        run: npm run catalog:sync-vehicle-models
      - name: Enrich prioritized batches without skipping older 2011+ models
        shell: bash
        run: |
          set -euo pipefail
          for batch in $(seq 1 "$DROM_KNOWLEDGE_BATCHES"); do
            echo "Knowledge batch ${batch}/${DROM_KNOWLEDGE_BATCHES}"
            npm run catalog:enrich-drom-variants || status=$?
            status=${status:-0}
            if [ "$status" -eq 2 ]; then
              echo "Source rate-limited; progress is saved and the next daily run will continue."
              break
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            unset status
          done
      - name: Build missing variants from verified live catalog offers
        run: npm run catalog:build-vehicle-variants
      - name: Validate knowledge and Drom parsing
        run: node --import tsx --test tests/vehicle-knowledge.test.ts tests/drom-vehicle-knowledge.test.ts tests/vehicle-knowledge-production-window.test.mjs
      - name: Reindex live catalog with updated knowledge
        run: npm run catalog:reindex-vehicle-knowledge
