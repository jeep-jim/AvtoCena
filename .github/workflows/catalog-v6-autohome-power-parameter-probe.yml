name: Catalog V6 · Autohome power parameter probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/catalog-v6-autohome-power-parameter-probe.yml"
      - "scripts/autohome-config-power-parameter-probe.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-v6-autohome-power-parameter-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/autohome-config-power-parameter-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autohome-config-power-parameter-probe
          path: autohome-config-power-parameter-probe.json
          if-no-files-found: error
          retention-days: 3
