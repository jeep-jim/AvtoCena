name: Diagnose DubiCars electrified groups

on:
  push:
    branches:
      - diag/electrified-eu-uae-20260810
    paths:
      - ".github/workflows/diagnose-uae-dubicars-electrified.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scan exact DubiCars detail rows without publishing
        shell: bash
        run: |
          cat > .tmp-uae-dubicars-electrified.mts <<'TS'
          import fs from "node:fs/promises";
          import { dubicarsUaeCurrentSource as source } from "./apps/web/lib/catalog/dubicars-current-source.ts";
          import { normalizeVehicleOfferSpecs } from "./apps/web/lib/catalog/spec-normalization.ts";
          import { calculateOfferWithRussiaCustoms } from "./apps/web/lib/catalog/customs-pricing.ts";

          const rows:any[]=[];
          const errors:any[]=[];
          let cursor:string|null=null;
          for(let pageNo=0;pageNo<4;pageNo++){
            try{
              const page:any=await source.fetchPage(cursor);
              for(const raw of page.items||[]){
                const normalized=source.normalizeOffer(raw);
                const offer:any=normalized ? normalizeVehicleOfferSpecs(normalized) : null;
                if(!offer) continue;
                let calc:any=offer;
                try { calc=normalizeVehicleOfferSpecs(await calculateOfferWithRussiaCustoms(offer)); }
                catch(e:any){ errors.push({stage:"calculate",id:offer.sourceOfferId,error:String(e?.message||e)}); }
                rows.push({
                  make:calc.make,model:calc.model,trim:calc.trim,year:calc.year,sourceOfferId:calc.sourceOfferId,
                  sourceUrl:calc.operational?.sourceUrl,sourcePrice:calc.sourcePrice,sourceCurrency:calc.sourceCurrency,
                  fuel:calc.fuel,powertrainKind:calc.powertrainKind,engineCc:calc.engineCc||null,powerHp:calc.powerHp||null,
                  power30MinKw:calc.power30MinKw||null,utilizationPowerKw:calc.utilizationPowerKw||null,icePowerKw:calc.icePowerKw||null,
                  calculationStatus:calc.calculationStatus,missing:calc.calculationSnapshot?.missing||calc.calculationSnapshot?.customs?.missing||[],
                });
              }
              if(!page.nextCursor||page.finished) break;
              cursor=String(page.nextCursor);
            } catch(e:any){ errors.push({stage:"page",cursor,error:String(e?.message||e)}); break; }
          }
          const electrified=rows.filter(r=>["electric","series_hybrid","other_hybrid"].includes(String(r.powertrainKind||"")));
          const unknownExplicit=rows.filter(r=>String(r.powertrainKind||"")==="unknown" && /electric|hybrid|phev|hev|\bev\b/i.test(`${r.fuel||""} ${r.trim||""} ${r.sourceUrl||""}`));
          const groups=(input:any[])=>Object.values(input.reduce((m:any,r:any)=>{const k=`${r.make}|${r.model}|${r.powertrainKind}`; if(!m[k])m[k]={make:r.make,model:r.model,powertrainKind:r.powertrainKind,count:0,sample:r};m[k].count++;return m;},{})).sort((a:any,b:any)=>b.count-a.count);
          const report={seen:rows.length,electrifiedCount:electrified.length,electrifiedGroups:groups(electrified),unknownExplicitCount:unknownExplicit.length,unknownExplicitGroups:groups(unknownExplicit),errors};
          await fs.writeFile("uae-dubicars-electrified-diagnostic.json",JSON.stringify({report,rows},null,2));
          console.log(JSON.stringify(report,null,2));
          TS
          npx tsx .tmp-uae-dubicars-electrified.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uae-dubicars-electrified-diagnostic
          path: uae-dubicars-electrified-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
