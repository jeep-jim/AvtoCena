name: Catalog live daily · working markets
# recovery-trigger: Autohome deferred exact identity live validation 2026-08-10
run-name: Daily cumulative catalog · Korea China Europe Georgia · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-live-daily-working-markets.yml"
      - "scripts/catalog-live-recovery-market.mjs"
      - "scripts/catalog-live-recovery-europe-otomoto.mjs"
      - "scripts/catalog-live-recovery-direct-exact.mjs"
      - "scripts/catalog-live-recovery-publish.mjs"
      - "apps/web/lib/catalog/auto-georgia-strict-source.ts"

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-direct-exact.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          npm run typecheck

  collect:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - market: korea
            mode: generic
            source_ids: encar_direct,kcar_korea_open
            target: 5000
            max_pages: 300
          - market: china
            mode: generic
            source_ids: autohome_used_china_open,guazi_china_open,autohome_new_china_open
            target: 5000
            max_pages: 300
          - market: europe
            mode: europe_otomoto
            source_ids: otomoto_europe_exact
            target: 5000
            max_pages: 120
          - market: georgia
            mode: generic
            source_ids: auto_georgia_open
            target: 3000
            max_pages: 240
    env:
      RECOVERY_MARKET: ${{ matrix.market }}
      RECOVERY_SOURCE_IDS: ${{ matrix.source_ids }}
      RECOVERY_DIRECT_MARKET: ${{ matrix.market }}
      RECOVERY_OUTPUT: catalog-rebuild-${{ matrix.market }}.json
      RECOVERY_TARGET: ${{ matrix.target }}
      RECOVERY_MAX_PAGES: ${{ matrix.max_pages }}
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact calculated market inventory
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.mode }}" in
            generic) npx tsx scripts/catalog-live-recovery-market.mjs ;;
            europe_otomoto) npx tsx scripts/catalog-live-recovery-europe-otomoto.mjs ;;
            direct) npx tsx scripts/catalog-live-recovery-direct-exact.mjs ;;
            *) echo "Unknown collection mode" >&2; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-daily-${{ matrix.market }}
          path: catalog-rebuild-${{ matrix.market }}.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [validate, collect]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-daily-*
          path: daily-input
          merge-multiple: true
      - name: Publish each successful market cumulatively
        shell: bash
        run: |
          set +e
          published=""
          failed=""
          for market in korea china europe georgia; do
            input="daily-input/catalog-rebuild-${market}.json"
            if [ ! -s "$input" ]; then
              echo "$market: no usable artifact; preserving current market"
              failed="$failed $market(no-artifact)"
              continue
            fi
            export RECOVERY_PUBLISH_MARKET="$market"
            export RECOVERY_PUBLISH_INPUT="$input"
            export RECOVERY_PUBLISH_REPORT="catalog-daily-${market}-publish-report.json"
            export RECOVERY_PUBLISH_MAX="100000"
            if npx tsx scripts/catalog-live-recovery-publish.mjs; then
              published="$published $market"
            else
              failed="$failed $market"
            fi
          done
          echo "published=$published" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          test -n "$published"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-daily-publish-reports
          path: catalog-daily-*-publish-report.json
          if-no-files-found: warn
          retention-days: 3
