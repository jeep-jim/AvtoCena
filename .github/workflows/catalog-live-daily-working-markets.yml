name: Catalog live daily · working markets
run-name: Source-sharded cumulative catalog · Korea China Europe Georgia · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "4"
  RECOVERY_PREPARE_CONCURRENCY: "6"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-europe-otomoto.mjs
          node --check scripts/catalog-live-recovery-publish.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          npx tsx -e "import { catalogImportSources } from './apps/web/lib/catalog/importer.ts'; const ids=new Set(catalogImportSources.map(s=>s.sourceId)); const required=['encar_direct','kcar_korea_open','autohome_used_china_open','dongchedi_china_open','guazi_china_open','autohome_new_china_open','mobile_de_open','autoscout_europe_open','otomoto_europe_exact','myauto_georgia_list','autopapa_georgia_open','auto_georgia_open']; const missing=required.filter(x=>!ids.has(x)); console.log({registered:required.filter(x=>ids.has(x)),missing}); if(missing.length) process.exit(1);"
      - name: Verify current seven-market baseline before any write
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-preflight-audit.json
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-kceg-preflight-audit
          path: catalog-preflight-audit.json
          if-no-files-found: warn
          retention-days: 3

  collect_generic:
    needs: validate
    if: needs.validate.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { market: korea, source: encar_direct, target: 5000, max_pages: 300 }
          - { market: korea, source: kcar_korea_open, target: 5000, max_pages: 300 }
          - { market: china, source: autohome_used_china_open, target: 5000, max_pages: 300 }
          - { market: china, source: dongchedi_china_open, target: 5000, max_pages: 300 }
          - { market: china, source: guazi_china_open, target: 5000, max_pages: 300 }
          - { market: china, source: autohome_new_china_open, target: 5000, max_pages: 300 }
          - { market: europe, source: mobile_de_open, target: 5000, max_pages: 300 }
          - { market: europe, source: autoscout_europe_open, target: 5000, max_pages: 300 }
          - { market: georgia, source: myauto_georgia_list, target: 5000, max_pages: 300 }
          - { market: georgia, source: autopapa_georgia_open, target: 5000, max_pages: 300 }
          - { market: georgia, source: auto_georgia_open, target: 5000, max_pages: 300 }
    env:
      RECOVERY_MARKET: ${{ matrix.market }}
      RECOVERY_SOURCE_IDS: ${{ matrix.source }}
      RECOVERY_OUTPUT: catalog-shard-${{ matrix.market }}-${{ matrix.source }}.json
      RECOVERY_TARGET: ${{ matrix.target }}
      RECOVERY_MAX_PAGES: ${{ matrix.max_pages }}
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect one exact source shard
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-${{ matrix.market }}-${{ matrix.source }}
          path: catalog-shard-${{ matrix.market }}-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3

  collect_otomoto:
    needs: validate
    if: needs.validate.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      RECOVERY_MARKET: europe
      RECOVERY_SOURCE_IDS: otomoto_europe_exact
      RECOVERY_OUTPUT: catalog-shard-europe-otomoto_europe_exact.json
      RECOVERY_TARGET: "5000"
      RECOVERY_MAX_PAGES: "300"
      RECOVERY_TIME_LIMIT_MS: "5100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect OTOMOTO exact shard
        run: npx tsx scripts/catalog-live-recovery-europe-otomoto.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-europe-otomoto_europe_exact
          path: catalog-shard-europe-otomoto_europe_exact.json
          if-no-files-found: warn
          retention-days: 3

  merge:
    needs: [validate, collect_generic, collect_otomoto]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-shard-*
          path: shard-input
      - name: Merge successful source shards per market
        shell: bash
        run: |
          set -euo pipefail
          merged=""
          for market in korea china europe georgia; do
            export RECOVERY_MERGE_MARKET="$market"
            export RECOVERY_MERGE_INPUT_DIR="shard-input"
            export RECOVERY_MERGE_OUTPUT="catalog-rebuild-${market}.json"
            if node scripts/catalog-live-recovery-merge-shards.mjs; then merged="$merged $market"; fi
          done
          echo "merged=$merged" >> "$GITHUB_STEP_SUMMARY"
          test -n "$merged"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-kceg-merged
          path: catalog-rebuild-*.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [validate, merge]
    if: always() && needs.validate.result == 'success' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catalog-kceg-merged
          path: daily-input
      - name: Publish markets serially, preserving all seven
        shell: bash
        run: |
          set +e
          published=""
          failed=""
          for market in korea china europe georgia; do
            input="daily-input/catalog-rebuild-${market}.json"
            if [ ! -s "$input" ]; then failed="$failed $market(no-artifact)"; continue; fi
            export RECOVERY_PUBLISH_MARKET="$market"
            export RECOVERY_PUBLISH_INPUT="$input"
            export RECOVERY_PUBLISH_REPORT="catalog-daily-${market}-publish-report.json"
            export RECOVERY_PUBLISH_MAX="30000"
            if npx tsx scripts/catalog-live-recovery-publish.mjs; then published="$published $market"; else failed="$failed $market"; fi
          done
          echo "published=$published" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          test -n "$published"
      - name: Rebuild stored K Car galleries with exterior-first covers
        env:
          CATALOG_GALLERY_MARKETS: korea
          CATALOG_GALLERY_SOURCE_IDS: kcar_korea_open
          CATALOG_GALLERY_MAX_OFFERS: "500"
          CATALOG_GALLERY_MAX_PER_MARKET: "500"
          CATALOG_GALLERY_MIN_IMAGES: "1"
          CATALOG_MAX_IMAGES_PER_OFFER: "30"
          CATALOG_GALLERY_PERSIST_EVERY: "500"
          CATALOG_GALLERY_REPORT_FILE: catalog-kcar-exterior-gallery-refresh.json
        run: npx tsx scripts/catalog-refresh-galleries.mjs
      - name: Audit all seven markets after publish
        if: always()
        shell: bash
        env:
          CATALOG_AUDIT_OUTPUT: catalog-kceg-postpersist-audit.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,europe,georgia
          CATALOG_AUDIT_MIN_COUNTS_JSON: '{"korea":1890,"china":2914,"japan":193,"uae":173,"europe":2623,"georgia":4,"kyrgyzstan":1873}'
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-kceg-publish-reports
          path: |
            catalog-daily-*-publish-report.json
            catalog-kcar-exterior-gallery-refresh.json
            catalog-kceg-postpersist-audit.json
          if-no-files-found: warn
          retention-days: 3
