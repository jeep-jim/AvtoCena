# Non-publishing readiness rerun marker: 2026-08-08T04:58Z
name: Catalog V6 · required source production readiness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/catalog-v6-required-source-production-readiness.yml"

permissions:
  contents: read

concurrency:
  group: catalog-v6-required-source-production-readiness
  cancel-in-progress: false

jobs:
  readiness:
    name: ${{ matrix.market }} · ${{ matrix.source_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { market: uae, source_id: dubizzle_uae_open }
          - { market: uae, source_id: dubicars_uae_exact }
          - { market: korea, source_id: encar_direct }
          - { market: korea, source_id: kcar_korea_open }
          - { market: europe, source_id: mobile_de_open }
          - { market: europe, source_id: autoscout_europe_open }
          - { market: georgia, source_id: myauto_georgia_list }
          - { market: georgia, source_id: autopapa_georgia_open }
          - { market: china, source_id: autohome_used_china_open }
          - { market: china, source_id: dongchedi_china_open }
          - { market: china, source_id: guazi_china_open }
          - { market: china, source_id: autohome_new_china_open }
          - { market: japan, source_id: jpauc_japan_past_open }
          - { market: japan, source_id: carvector_japan_stat_open }
          - { market: japan, source_id: prestige_japan_auctions_open }
          - { market: japan, source_id: auctiondatasearch_japan_open }
          - { market: japan, source_id: jpcenter_japan_catalog_open }
    env:
      CATALOG_REBUILD_MARKET: ${{ matrix.market }}
      CATALOG_REBUILD_SOURCE_IDS: ${{ matrix.source_id }}
      CATALOG_REBUILD_OUTPUT: readiness-${{ matrix.market }}-${{ matrix.source_id }}.json
      CATALOG_REBUILD_TARGET_PER_MARKET: "3"
      CATALOG_REBUILD_MAX_PAGES_PER_SOURCE: "5"
      CATALOG_REBUILD_MAX_EMPTY_PAGES: "3"
      CATALOG_REBUILD_SOURCE_CONCURRENCY: "1"
      CATALOG_IMAGE_FETCH_CONCURRENCY: "4"
      CATALOG_REBUILD_TIME_LIMIT_MS: "600000"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_JPAUC_PAGE_TIMEOUT_MS: "120000"
      CATALOG_GALLERY_TIMEOUT_MS: "30000"
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_COLLECTION_IMAGE_LIMIT: "30"
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_KNOWLEDGE_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect exact source cards without publishing
        run: npx tsx scripts/catalog-simple-source-market.mjs
      - name: Enforce production-quality source readiness
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.CATALOG_REBUILD_OUTPUT;
          const expected = process.env.CATALOG_REBUILD_SOURCE_IDS;
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const report = data.report || {};
          const source = (report.sources || []).find((row) => row.sourceId === expected);
          const evidenceOnly = expected === 'carvector_japan_stat_open';
          const identityGallery = expected === 'jpauc_japan_past_open';
          const problems = [];
          if (!source) problems.push('source_report_missing');
          if (!offers.length && !identityGallery) problems.push('zero_production_cards');
          if (source && Number(source.saved || 0) < 1 && !identityGallery) problems.push(`saved_${source.saved || 0}`);
          if (offers.some((offer) => offer.sourceId !== expected)) problems.push('source_identity_mismatch');
          if (offers.some((offer) => !/^https?:\/\//i.test(String(offer?.operational?.sourceUrl || '')))) problems.push('source_url_missing');
          if (offers.some((offer) => Number(offer?.sourcePrice || 0) <= 0 || !offer?.sourceCurrency)) problems.push('source_price_missing');
          const normalMinimum = expected === 'jpauc_japan_past_open' ? 3 : 5;
          if (!evidenceOnly && offers.some((offer) => !Array.isArray(offer.images) || offer.images.length < normalMinimum)) problems.push('gallery_below_minimum');
          if (evidenceOnly && offers.some((offer) =>
            offer.status !== 'sold'
              || offer.catalogKind !== 'auction_result'
              || offer.auctionResult !== 'sold'
              || offer.auctionPriceKind !== 'published_result'
              || offer.calculationStatus !== 'needs_data'
              || !Array.isArray(offer.images)
              || offer.images.length !== 0
              || offer?.operational?.raw?.carvectorEvidenceOnly !== true
              || offer?.operational?.raw?.galleryOwner !== 'jpauc_japan_past_open_after_exact_identity_join'
          )) problems.push('carvector_evidence_contract_invalid');
          if (identityGallery && (
            source?.readinessRole !== 'identity_gallery_after_exact_price_join'
              || Number(source?.evidenceAccepted || 0) < 3
              || Number(source?.evidenceRejected || 0) !== 0
              || (report.errors || []).some((row) => row.sourceId === expected)
          )) problems.push('jpauc_identity_gallery_contract_invalid');
          console.log(JSON.stringify({ expected, count: offers.length, source, problems, errors: report.errors || [] }, null, 2));
          if (problems.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-${{ matrix.market }}-${{ matrix.source_id }}
          path: readiness-${{ matrix.market }}-${{ matrix.source_id }}.json
          if-no-files-found: warn
          retention-days: 3
