name: Knowledge CORE MLIT passenger PDF extraction

on:
  push:
    branches:
      - fix/catalog-core-recovery-20260822
    paths:
      - scripts/catalog-extract-mlit-pdf-knowledge.mjs
      - .github/workflows/knowledge-mlit-pdf-extract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-core-source-snapshot
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-core-recovery-20260822
          fetch-depth: 0
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract source-backed Japanese passenger tables
        env:
          KNOWLEDGE_OUTPUT_ROOT: data/catalog/knowledge-source-snapshots/generated
          KNOWLEDGE_MLIT_PDF_MAX: "350"
        run: node scripts/catalog-extract-mlit-pdf-knowledge.mjs
      - name: Commit extracted MLIT text evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s data/catalog/knowledge-source-snapshots/generated/mlit/pdf-text-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/catalog-core-recovery-20260822
          git rebase origin/fix/catalog-core-recovery-20260822
          git add data/catalog/knowledge-source-snapshots/generated/mlit/pdf-text data/catalog/knowledge-source-snapshots/generated/mlit/pdf-text-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract MLIT passenger vehicle source tables"
          git push origin HEAD:fix/catalog-core-recovery-20260822
