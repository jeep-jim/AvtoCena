name: Catalog refresh europe
on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Novokuznetsk (UTC+7); existing source/cadence guards remain.
    - cron: "0 17 * * *"
  push:
    branches: [main]
    paths: ['.github/market-runs/europe-refresh.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-europe
  cancel-in-progress: false
jobs:
  refresh:
    uses: ./.github/workflows/catalog-market-refresh.yml
    with:
      market: europe
    secrets: inherit
