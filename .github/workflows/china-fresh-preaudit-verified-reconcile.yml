        \  elif typ=='Group':\n   uri=gr.findtext('URI');assert uri in ['http://acs.amazonaws.com/groups/global/AllUsers','http://acs.amazonaws.com/groups/global/AuthenticatedUsers','http://acs.amazonaws.com/groups/s3/LogDelivery'];own=False;public=public\
