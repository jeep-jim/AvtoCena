name: Apply catalog filter redesign once

on:
  push:
    branches:
      - fix/catalog-filter-redesign-20260811
    paths:
      - .github/workflows/apply-catalog-filter-redesign-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply redesign
        run: python .github/patches/apply-catalog-filter-redesign.py

      - name: Filter UI regression tests
        run: node --import tsx --test tests/catalog-filter-ui.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/patches/apply-catalog-filter-redesign.py
          rm -f .github/patches/catalog-filter-redesign.part1 .github/patches/catalog-filter-redesign.part2 .github/patches/catalog-filter-redesign.part3 .github/patches/catalog-filter-redesign.part4 .github/patches/catalog-filter-redesign.part5
          rm -f .github/workflows/apply-catalog-filter-redesign-once.yml
          git add -A
          git diff --cached --check
          git commit -m "Redesign catalog filters for desktop and mobile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
