name: Audit current Georgia gallery identity

on:
  push:
    branches:
      - audit/georgia-gallery-identity-20260811
    paths:
      - .github/workflows/catalog-georgia-current-gallery-identity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  GEORGIA_GALLERY_AUDIT_OUTPUT: catalog-georgia-gallery-identity-audit.json
  GEORGIA_GALLERY_AUDIT_CONCURRENCY: 4
  GEORGIA_GALLERY_AUDIT_TIMEOUT_MS: 25000

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/georgia-gallery-identity-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck current code
        run: npm run typecheck
      - name: Audit production Georgia exact gallery identity without writes
        run: npx tsx scripts/catalog-georgia-current-gallery-identity-audit.mjs
      - name: Summarize safety gate
        run: |
          node - <<'NODE'
          const r=require('./catalog-georgia-gallery-identity-audit.json');
          console.log(JSON.stringify({
            productionCount:r.productionCount,
            autoGeorgiaCount:r.autoGeorgiaCount,
            exactFetchSuccessCount:r.exactFetchSuccessCount,
            exactFetchFailureCount:r.exactFetchFailureCount,
            identityFailureCount:r.identityFailureCount,
            listingMismatchRowCount:r.listingMismatchRowCount,
            currentMismatchRowCount:r.currentMismatchRowCount,
            duplicateCurrentFingerprintCount:r.duplicateCurrentFingerprintCount,
            duplicateRawFingerprintCount:r.duplicateRawFingerprintCount,
            passed:r.passed
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-georgia-gallery-identity-audit
          path: catalog-georgia-gallery-identity-audit.json
          if-no-files-found: error
          retention-days: 3
