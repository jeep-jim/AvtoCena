name: ProAuctions detail and price contract
on:
  push:
    branches: [fix/proauctions-detail-contract-20260917]
    paths: ['.github/workflows/proauctions-contract-probe.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: proauctions-contract-readonly
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: japan-saved-packages-qualification
          path: saved-evidence
          run-id: 35246306276
          github-token: ${{ github.token }}
      - run: python3 -m pip install Pillow==11.3.0
      - run: python3 scripts/proauctions-contract-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proauctions-detail-contract
          path: proauctions-contract
          retention-days: 14
