name: Audit AJES placeholder HEAD 20260812

on:
  push:
    branches:
      - audit/catalog-nuance-scan-20260812

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Compare placeholder and real image ranged GET responses
        run: |
          set -euo pipefail
          for url in \
            'https://8.ajes.com/imgs/5KyLtsy0x1tDGe9LaPkQlwFYeimgtn7ZbTeLPpkuuYNmoaSJJVCZ2h7MH' \
            'https://8.ajes.com/imgs/pqf8kxMtGvcqkJdcaSoQz2ukcXf52tBQoeKI0gtp72uSZV40aFp'; do
            echo "URL=$url"
            echo '--- first response ---'
            curl -sS --max-time 20 -r 0-5 -D - -o /dev/null "$url" | tr -d '\r' | grep -Ei '^(HTTP/|location:|content-type:|content-length:|content-range:|etag:|last-modified:)' || true
            echo '--- followed response ---'
            curl -sSL --max-time 20 -r 0-5 -D - -o /tmp/ajes-prefix.bin "$url" | tr -d '\r' | grep -Ei '^(HTTP/|location:|content-type:|content-length:|content-range:|etag:|last-modified:)' || true
            echo -n 'prefix='; od -An -tx1 -N6 /tmp/ajes-prefix.bin | tr -d ' \n'; echo
            echo -n 'downloaded='; wc -c < /tmp/ajes-prefix.bin
          done
