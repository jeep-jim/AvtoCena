name: Catalog exact restore · Georgia Kyrgyzstan once
run-name: Exact restore Georgia Kyrgyzstan · ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-restore-georgia-kyrgyzstan-once.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "1"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_MAX_OFFERS_PER_MODEL: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture serialized pre-restore market counts
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { PUBLIC_CATALOG_MARKETS } = await import('./apps/web/lib/catalog/runtime-config.ts');
          const counts = {};
          for (const market of PUBLIC_CATALOG_MARKETS) counts[market] = (await readMarketOffers(market)).length;
          fs.writeFileSync('catalog-restore-before.json', JSON.stringify(counts, null, 2));
          console.log(JSON.stringify(counts, null, 2));
          NODE
      - name: Download exact successful collector artifacts only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p recovery-input .restore-zips
          for spec in \
            "9030691531:catalog-daily-georgia.zip" \
            "9032103485:catalog-recovery-kyrgyzstan.zip"; do
            artifact_id="${spec%%:*}"
            zip_name="${spec#*:}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output ".restore-zips/$zip_name"
            unzip -qo ".restore-zips/$zip_name" -d recovery-input
          done
          test -s recovery-input/catalog-rebuild-georgia.json
          test -s recovery-input/catalog-rebuild-kyrgyzstan.json
      - name: Republish Georgia from exact calculated artifact
        env:
          RECOVERY_PUBLISH_MARKET: georgia
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-georgia.json
          RECOVERY_PUBLISH_REPORT: catalog-restore-georgia-report.json
          RECOVERY_PUBLISH_MAX: "100000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Republish Kyrgyzstan from exact calculated artifact
        env:
          RECOVERY_PUBLISH_MARKET: kyrgyzstan
          RECOVERY_PUBLISH_INPUT: recovery-input/catalog-rebuild-kyrgyzstan.json
          RECOVERY_PUBLISH_REPORT: catalog-restore-kyrgyzstan-report.json
          RECOVERY_PUBLISH_MAX: "100000"
        run: npx tsx scripts/catalog-live-recovery-publish.mjs
      - name: Verify both restored markets and every unrelated market
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const { readMarketOffers } = await import('./apps/web/lib/catalog/storage.ts');
          const { PUBLIC_CATALOG_MARKETS } = await import('./apps/web/lib/catalog/runtime-config.ts');
          const before = JSON.parse(fs.readFileSync('catalog-restore-before.json', 'utf8'));
          const georgia = JSON.parse(fs.readFileSync('catalog-restore-georgia-report.json', 'utf8'));
          const kyrgyzstan = JSON.parse(fs.readFileSync('catalog-restore-kyrgyzstan-report.json', 'utf8'));
          const actual = {};
          for (const market of PUBLIC_CATALOG_MARKETS) actual[market] = (await readMarketOffers(market)).length;
          const problems = [];
          for (const market of PUBLIC_CATALOG_MARKETS) {
            if (market === 'georgia' || market === 'kyrgyzstan') continue;
            if (actual[market] !== Number(before[market] || 0)) problems.push(`${market}:${actual[market]}!=${before[market]}`);
          }
          if (actual.georgia !== Number(georgia.count || 0)) problems.push(`georgia:${actual.georgia}!=${georgia.count}`);
          if (actual.kyrgyzstan !== Number(kyrgyzstan.count || 0)) problems.push(`kyrgyzstan:${actual.kyrgyzstan}!=${kyrgyzstan.count}`);
          if (actual.georgia < Number(before.georgia || 0)) problems.push(`georgia_regressed:${actual.georgia}<${before.georgia}`);
          if (actual.kyrgyzstan < Number(before.kyrgyzstan || 0)) problems.push(`kyrgyzstan_regressed:${actual.kyrgyzstan}<${before.kyrgyzstan}`);
          console.log(JSON.stringify({ before, georgiaGenerationId: georgia.generationId, kyrgyzstanGenerationId: kyrgyzstan.generationId, actual, problems }, null, 2));
          if (problems.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-exact-restore-georgia-kyrgyzstan-reports
          path: |
            catalog-restore-before.json
            catalog-restore-georgia-report.json
            catalog-restore-kyrgyzstan-report.json
          if-no-files-found: warn
          retention-days: 3
