name: Catalog source qualification · enforce Japan pause v1

on:
  workflow_dispatch:
  push:
    branches:
      - chore/yallamotor-access-policy-v1-20260904
    paths:
      - ".github/workflows/catalog-source-japan-pause-enforce-v1.yml"
      - "scripts/catalog-source-japan-pause-enforce-v1.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-source-japan-pause-enforce-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Persist machine-readable Japan qualification pause
        run: node scripts/catalog-source-japan-pause-enforce-v1.mjs
      - name: Normalize roadmap EOF
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p='roadmap.md';
          fs.writeFileSync(p, `${fs.readFileSync(p,'utf8').replace(/\s*$/,'')}\n`);
          NODE
      - name: Verify Japan pause and safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/catalog/source-qualification-v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('data/catalog/source-partial-classification-v1.json','utf8'));
          const m=fs.readFileSync('roadmap.md','utf8');
          if(!r.pausedMarkets?.includes('japan')) throw new Error('Japan not in registry pausedMarkets');
          if(!l.pausedMarkets?.includes('japan')) throw new Error('Japan not in ledger pausedMarkets');
          if(r.marketControls?.japan?.status!=='paused_by_owner'||r.marketControls?.japan?.automatedQualificationAllowed!==false) throw new Error('Japan market control invalid');
          const jp=(r.candidates||[]).filter(x=>x.market==='japan');
          if(!jp.length||jp.some(x=>x.qualificationPaused!==true)) throw new Error('Japan candidate pause flags invalid');
          if(!m.includes('## 40.37 — Japan qualification pause is machine-readable and must be honored by every new source probe')) throw new Error('roadmap 40.37 missing');
          if((r.candidates||[]).some(x=>x.publishAllowed===true)) throw new Error('unexpected publishAllowed=true');
          if(r.productionWrites!==false||l.productionWrites!==false||l.publishAllowedMutations!==false) throw new Error('safety flag changed');
          NODE
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit pause guard
        run: |
          if git diff --quiet; then echo "Pause already enforced"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/source-qualification-v1.json data/catalog/source-partial-classification-v1.json roadmap.md
          git commit -m "Enforce Japan qualification pause in registry"
          git push origin HEAD:chore/yallamotor-access-policy-v1-20260904
