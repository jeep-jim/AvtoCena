name: Audit Georgia AutoPapa exact detail configuration 20260812

on:
  push:
    branches:
      - audit/georgia-power-batch-coverage-20260812

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read-only exact AutoPapa detail configuration
        shell: bash
        run: |
          set -euo pipefail
          url="https://avtocena.com/api/internal/georgia-power-a91f72?audit=20260812-detail-config"
          curl --connect-timeout 10 --max-time 180 --retry 2 --retry-delay 3 --retry-all-errors -fsS \
            -H 'cache-control: no-cache' "$url" -o detail.json
          jq -e '.runtime == "yandex-serverless" and .mode == "read-only-exact-autopapa-power-detail"' detail.json >/dev/null
          jq '{liveGeorgia, inspected, results: [.results[] | {sourceOfferId,make,model,year,engineCc,fuel,powertrainKind,currentPowerHp,detailPowerHp,status,error,snippets,structured}]}' detail.json
