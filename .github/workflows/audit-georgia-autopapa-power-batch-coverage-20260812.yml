name: Audit Georgia AutoPapa exact power batch coverage 20260812

on:
  push:
    branches:
      - audit/georgia-power-batch-coverage-20260812

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read-only exact AutoPapa power batches
        shell: bash
        run: |
          set -euo pipefail
          : > rows.ndjson
          for offset in 0 80 160 240 320; do
            url="https://avtocena.com/api/internal/georgia-power-a91f72?batch=1&offset=${offset}&limit=80&audit=20260812-consensus-coverage"
            curl --connect-timeout 10 --max-time 150 --retry 2 --retry-delay 3 --retry-all-errors -fsS \
              -H 'cache-control: no-cache' "$url" -o "batch-${offset}.json"
            jq -e '.runtime == "yandex-serverless" and .mode == "read-only-exact-autopapa-power-batch"' "batch-${offset}.json" >/dev/null
            jq -c '.results[]' "batch-${offset}.json" >> rows.ndjson
            jq '{offset,totalCandidates,inspected,parsedExactPowerCount,nextOffset}' "batch-${offset}.json"
          done
          jq -s '
            def cfgkey: [(.make // "" | ascii_downcase), (.model // "" | ascii_downcase), ((.year // 0)|tostring), ((.engineCc // 0)|tostring), (.fuel // "" | ascii_downcase)] | join("|");
            (map(. + {cfg: cfgkey})) as $rows |
            ($rows | group_by(.cfg) | map(
              . as $g |
              ([ $g[] | select((.detailPowerHp // 0) >= 20) | .detailPowerHp ] | unique) as $powers |
              select(($powers | length) == 1) |
              {
                cfg: $g[0].cfg,
                powerHp: $powers[0],
                rows: ($g|length),
                donors: ([ $g[] | select((.detailPowerHp // 0) >= 20) ] | length),
                additionalMissingCoverable: ([ $g[] | select((.detailPowerHp // 0) < 20) ] | length)
              }
            )) as $consensus |
            {
              inspected: ($rows|length),
              parsedExactPowerCount: ([$rows[] | select((.detailPowerHp // 0) >= 20)] | length),
              parsedExactPowerPct: (([$rows[] | select((.detailPowerHp // 0) >= 20)] | length) * 100 / (($rows|length)|if .==0 then 1 else . end)),
              httpOk: ([$rows[] | select(.status == 200)] | length),
              errors: ([$rows[] | select(.error != null)] | length),
              consensusGroupCount: ($consensus|length),
              consensusRows: (($consensus|map(.rows)|add) // 0),
              consensusAdditionalMissingCoverable: (($consensus|map(.additionalMissingCoverable)|add) // 0),
              consensusGroups: ($consensus | sort_by(-.additionalMissingCoverable, -.rows) | .[:30]),
              sampleParsed: ([$rows[] | select((.detailPowerHp // 0) >= 20) | {sourceOfferId,make,model,year,engineCc,fuel,detailPowerHp}] | .[:30]),
              sampleMissing: ([$rows[] | select((.detailPowerHp // 0) < 20) | {sourceOfferId,make,model,year,engineCc,fuel,status,error}] | .[:20])
            }
          ' rows.ndjson | tee summary.json
