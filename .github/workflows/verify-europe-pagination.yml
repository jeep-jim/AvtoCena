name: Verify Europe source pagination
on:
  workflow_dispatch:
  push:
    branches: [fix/catalog-budget-continuation-20260925]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Verify advertised continuation against two real listing pages
        run: node --import tsx scripts/catalog-mobile-pagination-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-pagination-probe
          path: europe-pagination-probe.json
          retention-days: 14
