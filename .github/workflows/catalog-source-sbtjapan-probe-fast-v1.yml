name: Catalog source qualification · SBT Japan fast probe v1

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sbtjapan-japan-qualification-v1-20260904
    paths:
      - ".github/workflows/catalog-source-sbtjapan-probe-fast-v1.yml"
      - "scripts/catalog-source-sbtjapan-qualification-v1.mjs"
      - "scripts/catalog-source-access-probe-v1.mjs"

permissions:
  contents: read

concurrency:
  group: catalog-source-sbtjapan-fast-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke SBT source contract without dependencies
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { parseSbtDetailUrl, parseSbtDetailEvidence, buildSbtFieldMatrix } from './scripts/catalog-source-sbtjapan-qualification-v1.mjs';
          assert.equal(parseSbtDetailUrl('https://www.sbtjapan.com/used-cars/DQW2874')?.stockId, 'DQW2874');
          const e=parseSbtDetailEvidence('<h1>1991/5 NISSAN BLUEBIRD</h1> Stock Id:DQW2874 Inventory location: Kanagawa, JAPAN Vehicle Price USD 5,160 Mileage 119,158km Engine 1,800cc Fuel PETROL Door 4 Seats 5 Vehicle Details Make NISSAN Model EU12 Body color WHITE Body Type Sedan Doors 4');
          assert.equal(e.priceUsd,5160); assert.equal(e.engineCc,1800); assert.equal(e.bodyType,'Sedan');
          const m=buildSbtFieldMatrix({stockId:'DQW2874'}, {...e, imageCount:10, powerTokens:[]});
          assert.ok(m.deficits.includes('power'));
          NODE
      - name: Probe SBT Japan inventory and details read-only
        env:
          CATALOG_SOURCE_SBTJAPAN_TIMEOUT_MS: "18000"
          CATALOG_SOURCE_SBTJAPAN_MAX_BODY_BYTES: "1900000"
          CATALOG_SOURCE_SBTJAPAN_SAMPLE_COUNT: "4"
        run: node scripts/catalog-source-sbtjapan-qualification-v1.mjs
      - name: Verify strict no-write envelope
        run: |
          node - <<'NODE'
          const p=require('./catalog-source-sbtjapan-qualification-v1.json');
          for(const k of ['productionWrites','classificationMutations','publishAllowedMutations','objectStorageWrites','catalogGenerationWrites','rawBodiesStored','guessedRoutes']) if(p[k]!==false) throw new Error(`${k} must be false`);
          if(p.sourcePublishAllowed!==false) throw new Error('sourcePublishAllowed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-sbtjapan-fast-probe-v1
          path: catalog-source-sbtjapan-qualification-v1.json
          if-no-files-found: error
          retention-days: 7
