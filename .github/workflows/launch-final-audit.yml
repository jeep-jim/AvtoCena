name: Launch final catalog and storage audit
on:
  workflow_dispatch:
  push:
    branches: [fix/launch-final-audit-20260920]
    paths: [.github/workflows/launch-final-audit.yml, .github/market-runs/launch-final-audit.json]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JSON_STORAGE_DRIVER: object
      CATALOG_READ_CONCURRENCY: '4'
      AUDIT_SKIP_SOURCE_SAMPLES: '1'
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Read storage and collector checkpoints
        run: node --import tsx scripts/catalog-launch-status.mjs
      - name: Audit every stored market record
        run: node --import tsx scripts/catalog-all-market-integrity-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-final-audit
          retention-days: 14
          path: |
            catalog-launch-status.json
            all-market-audit/
