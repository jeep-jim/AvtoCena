name: Ops · AutoScout live HQ proof v4 20260814

on:
  push:
    branches:
      - ops/autoscout-live-hq-proof-v4-20260814
    paths:
      - ".github/workflows/ops-autoscout-live-hq-proof-v4-20260814.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_SOURCE_TIMEOUT_MS: "35000"
      CATALOG_GALLERY_TIMEOUT_MS: "35000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh current AutoScout galleries and prove exact candidate
        shell: bash
        run: |
          cat > autoscout-live-hq-proof-v4.ts <<'TS'
          import fs from "node:fs";
          import { execSync } from "node:child_process";
          import { autoscoutEuropeExactSource } from "./apps/web/lib/catalog/autoscout-exact-source";
          import { readAllOffersForMaintenance } from "./apps/web/lib/catalog/storage";
          import { readDataJson } from "./apps/web/lib/data";
          import { canonicalSourceModelIdentity } from "./apps/web/lib/catalog/open-source-normalizer";
          import { hasCredibleOfferContent, isCatalogYearAllowed } from "./apps/web/lib/catalog/offer-quality";
          import { catalogModelYearQuotaKey, CATALOG_MAX_OFFERS_PER_MODEL_YEAR } from "./apps/web/lib/catalog/inventory-quota";
          import { PUBLIC_CATALOG_MARKETS } from "./apps/web/lib/catalog/runtime-config";

          const SOURCE_ID = "autoscout_europe_open";
          const sleep = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));
          const imageUrls = (offer: any) => (Array.isArray(offer?.images) ? offer.images : []).map((image: any) => String(image?.url || "")).filter(Boolean);
          const unique = (values: string[]) => [...new Set(values)];
          const genericMercedesModel = (value: unknown) => /^(?:benz|mercedes|mercedes[-\s]?benz)$/i.test(String(value || "").trim());
          const isMercedes = (value: unknown) => /mercedes|benz/i.test(String(value || ""));
          function sourceBoundTitle(offer: any) {
            const raw = offer?.operational?.raw || {};
            return String(offer?.sourceTitle || raw?.originalCatalogTitle || raw?.title || raw?.name || offer?.trim || "").replace(/\s+/g, " ").trim();
          }
          function applyProvenModel(offer: any, corrections: any[]) {
            const before = String(offer?.model || "").trim();
            const title = sourceBoundTitle(offer);
            if (!title) return offer;
            const after = canonicalSourceModelIdentity(title, String(offer?.make || ""), before);
            if (!after || after === before) return offer;
            corrections.push({ id: offer.id, sourceId: offer.sourceId, sourceOfferId: offer.sourceOfferId, title, make: offer.make, before, after, year: offer.year });
            return { ...offer, model: after };
          }
          function exactHqImage(image: any, sourceOfferId: string) {
            const url = String(image?.url || "");
            if (!url || /\/250x188(?:\.|\/|\?|$)/i.test(url)) return false;
            let parsed: URL;
            try { parsed = new URL(url); } catch { return false; }
            if (parsed.hostname.toLowerCase() !== "prod.pictures.autoscout24.net") return false;
            if (!sourceOfferId) return false;
            if (!parsed.pathname.toLowerCase().startsWith(`/listing-images/${sourceOfferId.toLowerCase()}_`)) return false;
            return Number(image?.width || 0) >= 900 && Number(image?.height || 0) >= 600;
          }
          async function pool<T>(rows: T[], limit: number, worker: (row: T, index: number) => Promise<void>) {
            let cursor = 0;
            await Promise.all(Array.from({ length: Math.min(limit, rows.length) }, async () => {
              while (true) {
                const index = cursor++;
                if (index >= rows.length) return;
                await worker(rows[index], index);
              }
            }));
          }
          async function galleryWithRetry(offer: any) {
            let lastError: unknown;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try { return await autoscoutEuropeExactSource.fetchImages!(offer); }
              catch (error) {
                lastError = error;
                if (attempt < 3) await sleep(500 * attempt);
              }
            }
            throw lastError;
          }
          function idSet(rows: any[]) { return new Set(rows.map((row) => String(row?.id || "")).filter(Boolean)); }
          function exactSet(left: Set<string>, right: Set<string>) { return left.size === right.size && [...left].every((id) => right.has(id)); }
          function comparable(offer: any, allowImages: boolean) {
            const clone = structuredClone(offer);
            delete clone.model;
            if (allowImages) delete clone.images;
            return JSON.stringify(clone);
          }
          function failureBucket(error: unknown) {
            const text = String((error as any)?.message || error);
            const match = text.match(/\b(?:http|status)[_ :\-]*(\d{3})\b/i) || text.match(/\b(4\d\d|5\d\d)\b/);
            return match?.[1] ? `http_${match[1]}` : text.slice(0, 120);
          }

          async function main() {
            const manifestStart: any = await readDataJson("catalog/manifest.json", null);
            if (!manifestStart?.generationId) throw new Error("autoscout_hq_v4_manifest_missing");
            const baselineGenerationId = String(manifestStart.generationId);
            const codeHead = execSync("git rev-parse HEAD", { encoding: "utf8" }).trim();
            const all = await readAllOffersForMaintenance();
            const active = all.filter((offer: any) => offer?.status === "active");
            const baselineCounts = Object.fromEntries(PUBLIC_CATALOG_MARKETS.map((market) => [market, active.filter((offer: any) => offer.market === market).length]));
            const europeBefore = active.filter((offer: any) => offer.market === "europe");
            const autoscoutBefore = europeBefore.filter((offer: any) => offer.sourceId === SOURCE_ID);
            const nonAutoscoutBefore = europeBefore.filter((offer: any) => offer.sourceId !== SOURCE_ID);
            if (!autoscoutBefore.length) throw new Error("autoscout_hq_v4_no_live_rows");

            const corrections: any[] = [];
            const nonAutoscoutCandidate = nonAutoscoutBefore.map((offer: any) => applyProvenModel(offer, corrections));
            const refreshed = new Map<string, any>();
            const failures: any[] = [];
            const failureCounts = new Map<string, number>();
            let completed = 0;
            await pool(autoscoutBefore, 8, async (sourceOffer: any) => {
              const fetchOffer = structuredClone(sourceOffer);
              try {
                const images = await galleryWithRetry(fetchOffer);
                const sourceOfferId = String(sourceOffer.sourceOfferId || "");
                const dedup = new Map<string, any>();
                for (const image of Array.isArray(images) ? images : []) {
                  const url = String(image?.url || "");
                  if (url && !dedup.has(url)) dedup.set(url, image);
                }
                const exactImages = [...dedup.values()].slice(0, 30);
                if (exactImages.length < 5) throw new Error(`hq_gallery_below5_${exactImages.length}`);
                if (!exactImages.every((image) => exactHqImage(image, sourceOfferId))) throw new Error("hq_gallery_identity_or_resolution_failed");
                let updated = applyProvenModel(sourceOffer, corrections);
                updated = { ...updated, images: exactImages };
                if (!isCatalogYearAllowed(updated.year, "europe")) throw new Error(`year_gate_${updated.year}`);
                if (!hasCredibleOfferContent(updated)) throw new Error("public_quality_failed");
                if (comparable(sourceOffer, true) !== comparable(updated, true)) throw new Error("unrelated_autoscout_field_change");
                refreshed.set(String(updated.id), updated);
              } catch (error) {
                const bucket = failureBucket(error);
                failureCounts.set(bucket, Number(failureCounts.get(bucket) || 0) + 1);
                if (failures.length < 600) failures.push({ id: sourceOffer.id, sourceOfferId: sourceOffer.sourceOfferId, title: sourceBoundTitle(sourceOffer), sourceUrl: sourceOffer?.operational?.sourceUrl, error: String((error as any)?.message || error) });
              }
              completed++;
              if (completed % 100 === 0 || completed === autoscoutBefore.length) console.log(JSON.stringify({ completed, total: autoscoutBefore.length, success: refreshed.size, failed: completed - refreshed.size }));
            });

            const refreshedRows = [...refreshed.values()];
            const candidateEurope = [...nonAutoscoutCandidate, ...refreshedRows];
            const successRatio = refreshedRows.length / autoscoutBefore.length;
            const candidateAutoscout = candidateEurope.filter((offer: any) => offer.sourceId === SOURCE_ID);
            const candidate250 = candidateAutoscout.filter((offer: any) => imageUrls(offer).some((url) => /\/250x188(?:\.|\/|\?|$)/i.test(url))).length;
            const candidateBelow5 = candidateEurope.filter((offer: any) => unique(imageUrls(offer)).length < 5).length;
            const invalidHq = candidateAutoscout.filter((offer: any) => {
              const images = Array.isArray(offer?.images) ? offer.images : [];
              return images.length < 5 || unique(imageUrls(offer)).length !== images.length || !images.every((image: any) => exactHqImage(image, String(offer?.sourceOfferId || "")));
            });

            const countByModelYear = new Map<string, number>();
            for (const offer of candidateEurope) {
              const key = catalogModelYearQuotaKey(offer, "europe");
              if (!key) continue;
              countByModelYear.set(key, Number(countByModelYear.get(key) || 0) + 1);
            }
            const quotaViolations = [...countByModelYear.entries()].filter(([, count]) => count > CATALOG_MAX_OFFERS_PER_MODEL_YEAR).sort((a, b) => b[1] - a[1]);
            const maxModelYear = Math.max(0, ...countByModelYear.values());

            const provableMalformed = candidateEurope.filter((offer: any) => {
              if (!isMercedes(offer?.make) || !genericMercedesModel(offer?.model)) return false;
              const title = sourceBoundTitle(offer);
              const resolved = title ? canonicalSourceModelIdentity(title, String(offer?.make || ""), String(offer?.model || "")) : String(offer?.model || "");
              return resolved && !genericMercedesModel(resolved) && resolved !== String(offer?.model || "");
            });
            const unresolvedGenericMercedes = candidateEurope.filter((offer: any) => isMercedes(offer?.make) && genericMercedesModel(offer?.model));

            const nonAutoscoutAfter = candidateEurope.filter((offer: any) => offer.sourceId !== SOURCE_ID);
            const nonAutoscoutIdsExact = exactSet(idSet(nonAutoscoutBefore), idSet(nonAutoscoutAfter));
            const nonAutoscoutNoUnrelatedChanges = nonAutoscoutBefore.every((before: any) => {
              const after = nonAutoscoutAfter.find((row: any) => row.id === before.id);
              return after && comparable(before, false) === comparable(after, false);
            });
            const refreshedNoUnrelatedChanges = refreshedRows.every((after: any) => {
              const before = autoscoutBefore.find((row: any) => row.id === after.id);
              return before && comparable(before, true) === comparable(after, true);
            });

            const otherMarketChecks: Record<string, any> = {};
            for (const market of PUBLIC_CATALOG_MARKETS.filter((market) => market !== "europe")) {
              const before = active.filter((offer: any) => offer.market === market);
              const after = active.filter((offer: any) => offer.market === market);
              otherMarketChecks[market] = { count: before.length, idsExact: exactSet(idSet(before), idSet(after)), jsonExact: JSON.stringify(before) === JSON.stringify(after) };
            }
            const allCandidate = [...active.filter((offer: any) => offer.market !== "europe"), ...candidateEurope];
            const badYears = allCandidate.filter((offer: any) => Number(offer?.year || 0) < 2020);

            const manifestEnd: any = await readDataJson("catalog/manifest.json", null);
            const generationStable = String(manifestEnd?.generationId || "") === baselineGenerationId;
            const report = {
              version: 4,
              mode: "autoscout_current_generation_live_hq_source_bound_model_readonly",
              generatedAt: new Date().toISOString(),
              codeHead,
              baselineGenerationId,
              endingGenerationId: String(manifestEnd?.generationId || ""),
              baselineCounts,
              europe: {
                baselineCount: europeBefore.length,
                baselineAutoscout: autoscoutBefore.length,
                baselineNonAutoscout: nonAutoscoutBefore.length,
                refreshedAutoscout: refreshedRows.length,
                failedAutoscout: autoscoutBefore.length - refreshedRows.length,
                successRatio: Number(successRatio.toFixed(4)),
                candidateEuropeCount: candidateEurope.length,
                candidateAutoscout: candidateAutoscout.length,
                candidateAutoscout250: candidate250,
                candidateBelow5,
                invalidHq: invalidHq.length,
                maxModelYear,
                quotaViolationCount: quotaViolations.length,
                modelCorrections: corrections.length,
                provableMalformedMercedes: provableMalformed.length,
                unresolvedGenericMercedes: unresolvedGenericMercedes.length,
                nonAutoscoutIdsExact,
                nonAutoscoutNoUnrelatedChanges,
                refreshedNoUnrelatedChanges,
              },
              failureCounts: Object.fromEntries([...failureCounts.entries()].sort((a, b) => b[1] - a[1])),
              failures,
              modelCorrections: corrections,
              unresolvedGenericMercedesSamples: unresolvedGenericMercedes.slice(0, 100).map((offer: any) => ({ id: offer.id, sourceId: offer.sourceId, sourceOfferId: offer.sourceOfferId, title: sourceBoundTitle(offer), make: offer.make, model: offer.model, year: offer.year })),
              quotaViolations: quotaViolations.map(([key, count]) => ({ key, count })),
              otherMarkets: otherMarketChecks,
              badYearSamples: badYears.slice(0, 100).map((offer: any) => ({ id: offer.id, market: offer.market, make: offer.make, model: offer.model, year: offer.year })),
              gates: {
                generationStable,
                enoughRefreshCoverage: refreshedRows.length >= 1000 && successRatio >= 0.5,
                noAutoscoutThumbnails: candidate250 === 0,
                exactHqGalleries: invalidHq.length === 0,
                noBelowFive: candidateBelow5 === 0,
                modelYearQuota: quotaViolations.length === 0 && maxModelYear <= CATALOG_MAX_OFFERS_PER_MODEL_YEAR,
                noProvableMalformedMercedes: provableMalformed.length === 0,
                nonAutoscoutIdsExact,
                noUnrelatedEuropeChanges: nonAutoscoutNoUnrelatedChanges && refreshedNoUnrelatedChanges,
                untouchedMarketsExact: Object.values(otherMarketChecks).every((row: any) => row.idsExact && row.jsonExact),
                allYears2020Plus: badYears.length === 0,
              },
            };
            fs.writeFileSync("autoscout-hq-v4-candidate.json", JSON.stringify({ version: 4, baselineGenerationId, codeHead, sourceId: SOURCE_ID, count: candidateEurope.length, refreshedAutoscout: refreshedRows.length, modelCorrections: corrections, offers: candidateEurope }, null, 2));
            fs.writeFileSync("autoscout-hq-v4-report.json", JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (!Object.values(report.gates).every(Boolean)) throw new Error(`autoscout_hq_v4_gate_failed:${JSON.stringify(report.gates)}`);
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          TS
          npx tsx autoscout-live-hq-proof-v4.ts
          rm autoscout-live-hq-proof-v4.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-live-hq-proof-v4
          path: |
            autoscout-hq-v4-candidate.json
            autoscout-hq-v4-report.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6