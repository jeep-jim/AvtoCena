name: Ops · Issue241 invalid identity migration 20260815

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Persist the exact validated 36 repairs + 2 Europe drops"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      ISSUE241_IDENTITY_APPLY: "0"
      ISSUE241_IDENTITY_OUTPUT: issue241-invalid-identity-migration-plan.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate exact migration plan without writes
        run: npx tsx scripts/issue241-invalid-identity-migrate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: issue241-invalid-identity-migration-plan
          path: issue241-invalid-identity-migration-plan.json
          if-no-files-found: error
          retention-days: 3

  apply:
    needs: plan
    if: ${{ inputs.apply == true && needs.plan.result == 'success' }}
    concurrency:
      group: catalog-live-daily-working-markets
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      ISSUE241_IDENTITY_APPLY: "1"
      ISSUE241_IDENTITY_OUTPUT: issue241-invalid-identity-migration-apply.json
      CATALOG_PUBLISH_LOCK_WAIT_MS: "7200000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refuse to overlap another active writer-capable workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ["REPOSITORY"]
          this_run = int(os.environ["THIS_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          writer = re.compile(r"(?:catalog.*(?:v6|recovery|repair|publish|refresh|writer|scale|global)|(?:recovery|publish|writer).*catalog)", re.I)
          blockers = []
          for status in ("in_progress", "queued", "waiting", "requested", "pending"):
              url = f"https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100"
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except Exception as error:
                  raise SystemExit(f"writer_guard_github_api_failed:{status}:{error}")
              for run in payload.get("workflow_runs", []):
                  if int(run.get("id", 0)) == this_run:
                      continue
                  haystack = f"{run.get('name', '')} {run.get('path', '')}"
                  if writer.search(haystack):
                      blockers.append({"id": run.get("id"), "name": run.get("name"), "status": run.get("status"), "path": run.get("path")})
          if blockers:
              print(json.dumps({"writerBlockers": blockers}, ensure_ascii=False, indent=2))
              raise SystemExit("active_catalog_writer_guard_failed")
          print("No other active/queued writer-capable workflow detected.")
          PY
      - name: Apply exact identity migration under shared catalog lock
        run: npx tsx scripts/issue241-invalid-identity-migrate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-invalid-identity-migration-apply
          path: issue241-invalid-identity-migration-apply.json
          if-no-files-found: warn
          retention-days: 3
