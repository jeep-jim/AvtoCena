name: Regcloud — diagnose public connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-connectivity.json']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public DNS and connection timings
        run: |
          set -eu
          for resolver in ns1.reg.ru ns2.reg.ru 1.1.1.1 8.8.8.8; do
            for name in avtocena.com www.avtocena.com; do
              for type in A AAAA; do
                echo "DNS resolver=$resolver name=$name type=$type"
                dig +time=3 +tries=1 +noall +answer "@$resolver" "$name" "$type" || true
              done
            done
          done
          for url in http://avtocena.com/api/health https://avtocena.com/api/health https://www.avtocena.com/api/health; do
            curl -sS --max-time 15 -o /dev/null -w "$url status=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} first=%{time_starttransfer} total=%{time_total}\n" "$url" || true
          done
          curl -sS --max-time 15 --resolve avtocena.com:443:151.248.113.177 -o /dev/null -w "PINNED_REG status=%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" https://avtocena.com/api/health || true
      - name: Read-only server listeners and aggregate errors
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'bash -s' <<'REMOTE'
          set -eu
          systemctl is-active nginx
          ss -lnt '( sport = :80 or sport = :443 )'
          ss -s
          free -m
          df -h /
          docker inspect --format 'running={{.State.Running}} oomKilled={{.State.OOMKilled}} restarts={{.RestartCount}} started={{.State.StartedAt}}' avtocena-production
          nginx -T 2>&1 | awk '/^[[:space:]]*(listen|server_name|worker_connections|worker_processes|limit_conn|limit_req|proxy_connect_timeout|proxy_read_timeout|proxy_pass)[[:space:]]/ {print}'
          if command -v ufw >/dev/null; then ufw status; fi
          python3 - <<'PY'
          import collections,re,subprocess
          from pathlib import Path
          p=Path('/var/log/nginx/error.log')
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()[-1000:]
              patterns=['upstream timed out','connect() failed','worker_connections are not enough','too many open files','no live upstreams','SSL_do_handshake() failed','limiting requests','limiting connections']
              print('NGINX_LAST_1000_ERROR_COUNTS',{s:sum(s in line for line in lines) for s in patterns})
          raw=subprocess.run(['docker','logs','--since','15m','--tail','1000','avtocena-production'],capture_output=True,text=True)
          s=raw.stdout+raw.stderr
          print('APP_LAST_15M_ERROR_COUNTS',{p:s.count(p) for p in ['heap out of memory','FATAL ERROR','object_storage_response_timeout']})
          PY
          curl -sS --max-time 15 --resolve avtocena.com:443:127.0.0.1 -o /dev/null -w 'LOCAL_HTTPS health=%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' https://avtocena.com/api/health
          REMOTE
