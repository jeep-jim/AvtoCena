name: One-shot China public labels patch

on:
  push:
    branches:
      - fix/china-public-names-20260810
    paths:
      - .github/workflows/oneshot-china-public-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/china-public-names-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/oneshot-china-public-labels.py
      - name: Smoke public presentation
        run: npx tsx scripts/smoke-china-public-labels.mts
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/presentation.ts
          git diff --cached --quiet && exit 0
          git commit -m "Expand China public labels [skip actions]"
          git push origin HEAD:fix/china-public-names-20260810
