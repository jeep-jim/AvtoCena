name: Dealer green renderer verification 2026-11-07
on:
  push:
    branches: [audit/catalog-reference-20261107]
    paths: ['.github/workflows/dealer-green-renderer-check-20261107.yml']
permissions:
  contents: read
concurrency:
  group: dealer-green-renderer-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f3a870834a746fb3cacade4553585fbde121099
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/green-renderer --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Exercise real mounted components and original-bug negative control
        env:
          PLAYWRIGHT_MODULE: /tmp/green-renderer/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome) node tests/browser/green-dealer-layout.mjs > green-renderer.log 2>&1 || { cat green-renderer.log; exit 1; }
          cat green-renderer.log
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('artifacts/green-dealer-layout/report.json','utf8'));
          assert.equal(r.results.length,10);assert.ok(r.results.every(x=>x.root&&x.roundTrip&&!x.overflow));assert.equal(r.standalone,true);assert.equal(r.negativeControl.root,false);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dealer-green-renderer
          path: |
            artifacts/green-dealer-layout
            green-renderer.log
          retention-days: 7
