name: Validate KCEG source shards no publish
on:
  push:
    branches: [fix/catalog-shards-preliminary-20260810]
    paths: [.github/workflows/oneshot-validate-kceg-source-shards.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-shards-preliminary-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extend recovery source-host contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-market.mjs')
          s=p.read_text()
          changes=[
            ('  autohome_new_china_open: ["autohome.com.cn"],\n', '  autohome_new_china_open: ["autohome.com.cn"],\n  dongchedi_china_open: ["dongchedi.com"],\n'),
            ('  autoscout_europe_open: ["autoscout24.com", "autoscout24.de", "autoscout24.it", "autoscout24.fr", "autoscout24.nl"],\n', '  autoscout_europe_open: ["autoscout24.com", "autoscout24.de", "autoscout24.it", "autoscout24.fr", "autoscout24.nl"],\n  mobile_de_open: ["mobile.de"],\n'),
            ('  auto_georgia_open: ["auto.ge"],\n', '  auto_georgia_open: ["auto.ge"],\n  myauto_georgia_list: ["myauto.ge"],\n  autopapa_georgia_open: ["autopapa.ge"],\n'),
          ]
          for old,new in changes:
            if old not in s and new not in s: raise SystemExit(f'anchor missing: {old}')
            if new not in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Static checks
        run: |
          node --check scripts/catalog-live-recovery-market.mjs
          node --check scripts/catalog-live-recovery-merge-shards.mjs
          node --check scripts/catalog-live-postpersist-audit.mjs
          npm run typecheck
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Probe every configured KCEG shard list endpoint without publishing
        shell: bash
        run: |
          cat > probe-kceg.mts <<'TS'
          import fs from 'node:fs/promises';
          import { catalogImportSources } from './apps/web/lib/catalog/importer.ts';
          const ids=['encar_direct','kcar_korea_open','autohome_used_china_open','dongchedi_china_open','guazi_china_open','autohome_new_china_open','mobile_de_open','autoscout_europe_open','otomoto_europe_exact','myauto_georgia_list','autopapa_georgia_open','auto_georgia_open'];
          const map=new Map(catalogImportSources.map((s:any)=>[s.sourceId,s]));
          const results:any[]=[];
          await Promise.all(ids.map(async id=>{
            const source:any=map.get(id);
            if(!source){ results.push({id,ok:false,error:'adapter_missing'}); return; }
            try {
              const page:any=await Promise.race([
                source.fetchPage(null),
                new Promise((_,reject)=>setTimeout(()=>reject(new Error('probe_timeout_30s')),30000)),
              ]);
              const items=Array.isArray(page?.items)?page.items:[];
              results.push({id,market:source.market,ok:items.length>0,count:items.length,finished:Boolean(page?.finished),nextCursor:Boolean(page?.nextCursor),health:page?.health?.message||''});
            } catch(e:any) { results.push({id,market:source?.market,ok:false,error:String(e?.message||e).slice(0,500)}); }
          }));
          results.sort((a,b)=>a.id.localeCompare(b.id));
          await fs.writeFile('catalog-kceg-source-probe.json',JSON.stringify({checkedAt:new Date().toISOString(),results},null,2));
          console.log(JSON.stringify(results,null,2));
          if(results.some(x=>x.error==='adapter_missing')) process.exit(2);
          TS
          npx tsx probe-kceg.mts
          rm probe-kceg.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-kceg-source-probe
          path: catalog-kceg-source-probe.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated host contracts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/oneshot-validate-kceg-source-shards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/catalog-live-recovery-market.mjs
          git commit -m 'Enable independent required KCEG source shards'
          git push origin HEAD:fix/catalog-shards-preliminary-20260810
