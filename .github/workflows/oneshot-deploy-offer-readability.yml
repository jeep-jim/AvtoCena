name: One-shot deploy offer readability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-deploy-offer-readability.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch web deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-yandex.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Remove dispatcher
        run: |
          git pull --rebase origin main
          rm .github/workflows/oneshot-deploy-offer-readability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oneshot-deploy-offer-readability.yml
          git commit -m "Remove one-shot offer deploy dispatcher [skip actions]"
          git push origin HEAD:main
