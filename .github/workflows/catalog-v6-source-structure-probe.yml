name: Catalog V6 · Japan China source structure probe

on:
  workflow_dispatch:
  # Live source diagnostics require an explicit manual run.
permissions:
  contents: read

concurrency:
  group: catalog-v6-source-structure-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe source structures without publishing
        run: npx tsx scripts/catalog-source-structure-probe.mjs
      - name: Probe exact Encar detail power fields without publishing
        run: node scripts/encar-power-field-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-source-structure-probe
          path: |
            catalog-source-structure-probe.json
            encar-power-field-probe.json
          if-no-files-found: warn
          retention-days: 3
