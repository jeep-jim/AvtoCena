name: China publication lock metadata readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/china-lock-metadata-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: china-lock-metadata-readonly-44121174584
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Inspect current China publication metadata only')
    environment: regcloud-staging
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact approved source
        run: test "$(git rev-parse HEAD)" = bb6317bffd1f7b1832681ac78378fe6c3e39e3b5
      - name: Prepare bounded metadata reader
        run: |
          cat > "$RUNNER_TEMP/china-lock-probe.mjs" <<'PROBE_JS'
          import {createHash,createHmac} from 'node:crypto';
          import {writeFile} from 'node:fs/promises';
          import {pathToFileURL} from 'node:url';
          const ENDPOINT='https://s3.regru.cloud',BUCKET='avtocena-staging-8120751',PREFIX='migration-staging/full-20261011/';
          export const KEYS=['catalog/import-lock.json','catalog/manifest.json'];
          const sha=s=>createHash('sha256').update(s).digest('hex'),hmac=(key,s)=>createHmac('sha256',key).update(s).digest();
          export function signedGet(key,credentials,date=new Date()){
           if(!KEYS.includes(key))throw Error('probe_key_denied');
           if(!credentials.accessKeyId||!credentials.secretAccessKey)throw Error('probe_credentials_missing');
           const pathname='/'+BUCKET+'/'+PREFIX+key,url=ENDPOINT+pathname;
           const stamp=date.toISOString().replace(/[:-]|\.\d{3}/g,''),day=stamp.slice(0,8),scope=`${day}/us-east-1/s3/aws4_request`;
           const headers={host:'s3.regru.cloud','x-amz-content-sha256':sha(''),'x-amz-date':stamp};
           const names=Object.keys(headers).sort(),canonical=names.map(k=>`${k}:${headers[k]}\n`).join('');
           const request=['GET',pathname,'',canonical,names.join(';'),sha('')].join('\n');
           const signing=hmac(hmac(hmac(hmac('AWS4'+credentials.secretAccessKey,day),'us-east-1'),'s3'),'aws4_request');
           const signature=createHmac('sha256',signing).update(`AWS4-HMAC-SHA256\n${stamp}\n${scope}\n${sha(request)}`).digest('hex');
           headers.authorization=`AWS4-HMAC-SHA256 Credential=${credentials.accessKeyId}/${scope}, SignedHeaders=${names.join(';')}, Signature=${signature}`;
           return {url,options:{method:'GET',headers,redirect:'error'}};
          }
          export async function boundedJson(key,{credentials,fetchImpl=fetch,timeoutMs=10000}={}){
           const request=signedGet(key,credentials),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
           try{
            const response=await fetchImpl(request.url,{...request.options,signal:controller.signal});
            if(response.status===404){await response.body?.cancel();return null;}
            if(response.status!==200){await response.body?.cancel();throw Error('probe_http_'+response.status);}
            const limit=key===KEYS[0]?16384:1048576;
            if(Number(response.headers.get('content-length')||0)>limit){await response.body?.cancel();throw Error('probe_body_limit');}
            const reader=response.body.getReader();let bytes=0;const chunks=[];
            try{while(true){const {done,value}=await reader.read();if(done)break;bytes+=value.length;if(bytes>limit)throw Error('probe_body_limit');chunks.push(value);}}
            finally{await reader.cancel().catch(()=>{});reader.releaseLock();}
            return JSON.parse(Buffer.concat(chunks,bytes).toString('utf8'));
           }finally{clearTimeout(timer);controller.abort();}
          }
          function safeString(value){return typeof value==='string'&&value.length<=180&&/^[a-zA-Z0-9_:.,+\-TZ ]*$/.test(value)?value:null;}
          export function redact(lock,manifest){return {lock:lock?{operationId:safeString(lock.operationId),operationType:safeString(lock.operationType),lockedUntil:safeString(lock.lockedUntil),heartbeatAt:safeString(lock.heartbeatAt),startedAt:safeString(lock.startedAt),updatedAt:safeString(lock.updatedAt)}:null,generationId:safeString(manifest?.generationId)};}
          export async function sample({credentials,fetchImpl=fetch,sleep=ms=>new Promise(r=>setTimeout(r,ms)),output=()=>{}}={}){
           let requests=0;const counted=(...args)=>{if(++requests>4)throw Error('probe_request_limit');return fetchImpl(...args);};const samples=[];
           for(let i=0;i<2;i++){
            const lock=await boundedJson(KEYS[0],{credentials,fetchImpl:counted});
            const manifest=await boundedJson(KEYS[1],{credentials,fetchImpl:counted});
            const row={sample:i+1,checkedAt:new Date().toISOString(),...redact(lock,manifest),requests};samples.push(row);output(row);
            if(i===0)await sleep(20000);
           }
           return {producerRun:44121174584,samples,requests,storageWrites:0,supplierRequests:0,listRequests:0};
          }
          if(process.argv[1]&&import.meta.url===pathToFileURL(process.argv[1]).href){
           try{const report=await sample({credentials:{accessKeyId:process.env.YC_OBJECT_STORAGE_ACCESS_KEY_ID,secretAccessKey:process.env.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY},output:row=>console.log(JSON.stringify(row))});await writeFile('china-lock-probe.json',JSON.stringify(report,null,2));}
           catch(error){const code=/^probe_(body_limit|request_limit|key_denied|credentials_missing|http_\d{3})$/.test(error?.message||'')?error.message:'probe_read_failed';console.error(JSON.stringify({error:code,storageWrites:0}));process.exitCode=1;}
          }
          PROBE_JS
      - name: Read two metadata samples without storage writes
        env:
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: timeout --signal=TERM --kill-after=5s 90s node "$RUNNER_TEMP/china-lock-probe.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-lock-metadata-44121174584
          path: china-lock-probe.json
          retention-days: 7
