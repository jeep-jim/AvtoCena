name: TEMP UAE required source test patch

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-uae-required-testpatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update canonical UAE anchor regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/catalog-source-scale.test.ts')
          s=p.read_text()
          old='assert.deepEqual([...urls("uae")].filter((url) => /dubizzle|dubicars/.test(url)), ["https://uae.dubizzle.com/", "https://www.dubicars.com/"]);'
          new='assert.deepEqual([...urls("uae")].filter((url) => /carswitch|dubicars/.test(url)), ["https://carswitch.com/", "https://www.dubicars.com/"]);'
          if old not in s: raise SystemExit('old UAE anchor assertion missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/catalog-source-scale.test.ts
          git diff --cached --check
          git commit -m 'Update UAE anchor source regression'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
