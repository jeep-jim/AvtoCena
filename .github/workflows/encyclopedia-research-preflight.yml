name: Encyclopedia — bounded research preflight
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/encyclopedia-research-preflight.json']
permissions:
  contents: read
concurrency:
  group: encyclopedia-research-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: regcloud-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read selected full-record digests without exposing provenance
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/encyclopedia/research-preflight.mjs
