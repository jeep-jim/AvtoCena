name: Audit catalog integrity after failed writers 20260813
run-name: Audit failed-writer catalog integrity · ${{ github.sha }}

on:
  push:
    branches:
      - audit/catalog-integrity-after-failed-writers-20260813
    paths:
      - .github/workflows/audit-catalog-integrity-after-failed-writers-20260813.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect manifest, current read models, and generation capacity read-only
        run: |
          node --import tsx --input-type=module <<'NODE'
          const dataModule = await import('./apps/web/lib/data.ts');
          const data = dataModule.default || dataModule;
          const storageModule = await import('./apps/web/lib/catalog/storage.ts');
          const storageApi = storageModule.default || storageModule;
          const runtimeModule = await import('./apps/web/lib/catalog/runtime-config.ts');
          const runtime = runtimeModule.default || runtimeModule;
          const objectStorage = data.getJsonStorage();
          const read = data.readDataJson;
          const markets = [...runtime.PUBLIC_CATALOG_MARKETS];
          const manifest = await read('catalog/manifest.json', {generationId:'',markets:{}});
          const internalManifest = await read('catalog/internal/manifest.json', {generationId:'',sources:{}});
          const current = {};
          current.facets = await read('catalog/public/facets.json', {generationId:''});
          current.brandSummary = await read('catalog/public/brand-summary.json', {generationId:''});
          current.allProjection = await read('catalog/public/projection/all.json', {generationId:'',items:[]});
          current.projections = {};
          for (const market of markets) current.projections[market] = await read(`catalog/public/projection/${market}.json`, {generationId:'',items:[]});
          const liveCounts = {};
          for (const market of markets) liveCounts[market] = (await storageApi.readMarketOffers(market)).length;
          const generationObjects = await objectStorage.listObjects('catalog/generations');
          const byGeneration = new Map();
          for (const item of generationObjects) {
            const id = String(item.key||'').match(/^catalog\/generations\/(gen_\d+_[-a-z0-9]+)\//i)?.[1];
            if (!id) continue;
            const row = byGeneration.get(id) || {objects:0,bytes:0,lastModified:''};
            row.objects += 1;
            row.bytes += Number(item.size||0);
            const lm = String(item.lastModified||item.modifiedAt||'');
            if (lm && lm > row.lastModified) row.lastModified = lm;
            byGeneration.set(id,row);
          }
          const generations = [...byGeneration.entries()].map(([generationId,v])=>({generationId,...v}))
            .sort((a,b)=>Number(b.generationId.match(/^gen_(\d+)_/)?.[1]||0)-Number(a.generationId.match(/^gen_(\d+)_/)?.[1]||0));
          const publicOfferObjects = await objectStorage.listObjects('catalog/public/offers');
          const recentOfferShards = publicOfferObjects
            .map(x=>({key:x.key,size:Number(x.size||0),lastModified:String(x.lastModified||x.modifiedAt||'')}))
            .filter(x=>x.lastModified >= '2026-08-13T02:20:00')
            .sort((a,b)=>a.lastModified.localeCompare(b.lastModified));
          const report = {
            manifestGeneration: manifest.generationId,
            manifestCounts: Object.fromEntries(markets.map(m=>[m,Number(manifest.markets?.[m]?.count||0)])),
            liveCounts,
            internalGeneration: internalManifest.generationId,
            currentGenerations: {
              facets: current.facets.generationId,
              brandSummary: current.brandSummary.generationId,
              allProjection: current.allProjection.generationId,
              projections: Object.fromEntries(markets.map(m=>[m,{generationId:current.projections[m].generationId,count:(current.projections[m].items||[]).length}]))
            },
            generationCount: generations.length,
            newestGenerations: generations.slice(0,10),
            totalGenerationBytes: generations.reduce((s,x)=>s+x.bytes,0),
            publicOfferShardCount: publicOfferObjects.length,
            recentOfferShardWrites: recentOfferShards.length,
            recentOfferShardSamples: recentOfferShards.slice(0,30),
          };
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Run all-seven current catalog audit read-only
        env:
          CATALOG_AUDIT_OUTPUT: current-all7.json
          CATALOG_AUDIT_ASSERT_MARKETS: ""
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-writer-integrity-audit
          path: current-all7.json
          if-no-files-found: warn
          retention-days: 3
