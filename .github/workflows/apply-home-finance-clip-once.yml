name: Apply home finance clipping fix once

on:
  push:
    branches:
      - fix/finance-ui-final-20260813
    paths:
      - '.finance-ui/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-ui-final-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact homepage fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/home/HomePageClient.tsx')
          s = p.read_text()

          top_old = '<div className="hidden w-full min-w-0 max-w-none lg:block"><HomeSelect value={budget} options={budgets} onChange={setBudget} /></div>'
          top_new = '<div className="ac-budget-desktop hidden w-full min-w-0 max-w-none lg:block"><HomeSelect value={budget} options={budgets} onChange={setBudget} /></div>'
          if top_old in s:
              s = s.replace(top_old, top_new, 1)
          elif top_new not in s:
              raise SystemExit('top budget selector anchor missing')

          s = s.replace(
              'ac-executor-block relative min-h-[206px] overflow-hidden rounded-[1.6rem] px-6 py-6',
              'ac-finance-card relative min-h-[206px] overflow-hidden rounded-[1.6rem] bg-[var(--ac-surface)] px-6 py-6',
          )
          s = s.replace('bottom-[-2px]', 'bottom-0').replace('bottom-[-3px]', 'bottom-0')

          css_anchor = '@media(max-width:1023px){.ac-home-page .ac-budget-mobile'
          if css_anchor in s:
              s = s.replace(css_anchor, '@media(max-width:1023px){.ac-home-page .ac-budget-desktop{display:none!important}.ac-home-page .ac-budget-mobile', 1)
          elif '.ac-budget-desktop{display:none!important}' not in s:
              raise SystemExit('mobile budget CSS anchor missing')

          required = [
              'ac-budget-desktop hidden',
              '.ac-budget-desktop{display:none!important}',
              'emptyLabel="Бюджет"',
              'ac-finance-card relative min-h-[206px] overflow-hidden',
              '/home/credit-mascot.webp',
              '/home/osago-mascot.webp',
              'bottom-0',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing required token: {token}')
          if 'bottom-[-2px]' in s or 'bottom-[-3px]' in s:
              raise SystemExit('negative mascot bottom remains')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit verified UI-only fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .finance-ui
          rm -f .github/workflows/apply-home-finance-clip-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/home/HomePageClient.tsx
          git add -u .finance-ui .github/workflows/apply-home-finance-clip-once.yml || true
          git commit -m 'Clip finance mascots and remove mobile budget duplicate'
          git push origin HEAD:fix/finance-ui-final-20260813
