name: TEMP run AutoPapa v2 patch

on:
  push:
    branches:
      - fix/autopapa-primary-price-v2-20260824
    paths:
      - '.github/workflows/zz-temp-run-autopapa-v2-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autopapa-primary-price-v2-20260824
          fetch-depth: 0
      - name: Execute patch body from temporary PR workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/zz-temp-selfpatch-autopapa-v2.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'autopapa-v2-selfpatch', 'exec'))
          PY
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/catalog/autopapa-georgia-source.ts scripts/catalog-rebuild-source-shard.mjs .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'patch already applied'
            exit 0
          fi
          git commit -m 'Bind AutoPapa V3 prices to exact detail title'
          git push origin HEAD:fix/autopapa-primary-price-v2-20260824
