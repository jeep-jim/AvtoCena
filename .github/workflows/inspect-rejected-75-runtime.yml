name: Inspect rejected 3d01 runtime once
# Read-only confirmation after rejected acceptance43348310517.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-rejected-75-runtime.yml']
permissions:
  contents: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '3d01d708dc47fc9ff0465021110f940383e0369e'
      - name: Read retained production identity and bounded candidate diagnostics
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts" root@151.248.113.177 'python3 -' <<'REMOTE'
          import json,subprocess,datetime,urllib.request,pathlib,re,collections
          print(json.dumps({'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          for name in ['avtocena-production','avtocena-release-3d01d708dc47']:
              value=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
              print(json.dumps({'container':name,'image':value['Image'],'revision':value['Config']['Labels'].get('org.opencontainers.image.revision'),'state':{k:value['State'].get(k) for k in ['Status','Running','OOMKilled','ExitCode','StartedAt','FinishedAt']}}))
          with urllib.request.urlopen('https://avtocena.com/api/health',timeout=20) as response:
              value=json.load(response)
          print(json.dumps({'publicHealth':{k:value.get(k) for k in ['ok','releaseSha','calculationVersion']}}))
          assert value.get('ok') is True and value.get('releaseSha')=='a182cd21b21ecf612b63613d263e5bdd817ea4c0'
          assert value.get('calculationVersion')=='c489dff0d41ef0933b4f2bef140a318d4ce68493587afc8113a9993e5a18b0b6'
          print(json.dumps({'resources':json.loads(pathlib.Path('/opt/avtocena/metrics/resources.json').read_text())}))
          process=subprocess.run(['docker','logs','--timestamps','--tail','4000','avtocena-release-3d01d708dc47'],capture_output=True,text=True,check=True)
          rows=[];errors=collections.Counter();diagnostics=[]
          for line in (process.stdout+process.stderr).splitlines():
              if 'catalog_storage_read ' in line:
                  try:
                      value=json.loads(line.split('catalog_storage_read ',1)[1])
                      path=value.get('path','')
                      if re.fullmatch(r'catalog/[a-zA-Z0-9_./-]+',path):
                          rows.append({'time':line.split(' ',1)[0],'path':path,'ms':value.get('ms'),'found':value.get('found')})
                  except (ValueError,TypeError):pass
              if any(token in line for token in ['ajes_', 'catalog_failure', 'catalog_render']):
                  clean=re.sub(r'(api_key|code|token|key)=([^&\s]+)',r'\1=[redacted]',line)
                  diagnostics.append(clean[:1500])
              for token in ['TimeoutError','AbortError','TypeError','SyntaxError','RangeError','ECONNRESET','ETIMEDOUT','EAI_AGAIN','ENOMEM']:
                  if token in line:errors[token]+=1
          print(json.dumps({'boundedLogLines':len((process.stdout+process.stderr).splitlines()),'diagnostics':diagnostics[-60:],'errorCounts':dict(errors),'catalogReads':rows[-80:]}))
          REMOTE
