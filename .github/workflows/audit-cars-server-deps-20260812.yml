name: Audit cars SSR dependencies 20260812

on:
  push:
    branches:
      - audit/offer-route-latency-20260812-r2
    paths:
      - .github/workflows/audit-cars-server-deps-20260812.yml

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure cold-process catalog SSR dependencies
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5; do
            ITERATION="$iteration" node --import tsx --input-type=module <<'NODE'
            const { readCatalogFacets, searchOffers } = await import('./apps/web/lib/catalog/storage.ts');
            const markets = ['korea','china','japan','uae','europe','georgia','kyrgyzstan'];
            const iteration = Number(process.env.ITERATION || 0);
            const start = performance.now();
            const timed = async (name, fn) => {
              const t0 = performance.now();
              try {
                const value = await fn();
                const ms = performance.now() - t0;
                console.log(JSON.stringify({event:'cars_dep',iteration,name,ok:true,ms:Number(ms.toFixed(1)),count:Number(value?.total ?? value?.makes?.length ?? 0)}));
                return value;
              } catch (error) {
                const ms = performance.now() - t0;
                console.log(JSON.stringify({event:'cars_dep',iteration,name,ok:false,ms:Number(ms.toFixed(1)),error:String(error?.message || error)}));
                return null;
              }
            };
            const tasks = [
              timed('facets', () => readCatalogFacets({})),
              ...markets.map((market) => timed(`search:${market}`, () => searchOffers({ market, page:1, pageSize:24, sort:'updatedAt' }))),
            ];
            await Promise.all(tasks);
            console.log(JSON.stringify({event:'cars_dep_iteration',iteration,totalMs:Number((performance.now()-start).toFixed(1))}));
NODE
          done
