name: Apply Russia mass-market catalog priority

on:
  push:
    branches: [fix/catalog-russia-mass-market-priority]
    paths:
      - .github/workflows/apply-russia-mass-market-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-russia-mass-market-priority
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply mass-market, price consistency and knowledge patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              if old not in text: raise SystemExit(f"snippet_not_found:{path}:{old[:100]}")
              p.write_text(text.replace(old, new, count))

          def regex_replace(path, pattern, replacement, count=1):
              p = Path(path); text = p.read_text()
              next_text, changed = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if changed != count: raise SystemExit(f"regex_not_found:{path}:{pattern[:100]}:{changed}")
              p.write_text(next_text)

          # Rebuild: one shared tiered priority, hard public budget and diagnostic reasons.
          replace("scripts/catalog-rebuild-source-shard.mjs",
              'const { credibleCatalogImages, isCrediblePublicOffer } = await import("../apps/web/lib/catalog/offer-quality.ts");',
              'const { credibleCatalogImages, isCrediblePublicOffer } = await import("../apps/web/lib/catalog/offer-quality.ts");\nconst { catalogPublicPriority, compareCatalogPublicPriority } = await import("../apps/web/lib/catalog/public-priority.ts");')
          regex_replace("scripts/catalog-rebuild-source-shard.mjs",
              r'function rubValue\(offer\) \{.*?\n\}\nfunction quality\(a, b\) \{.*?\n\}',
              '''function isMassMarketPriority(offer) {
            const priority = catalogPublicPriority(offer);
            return priority.eligible && priority.tier <= 4;
          }
          function quality(a, b) {
            return compareCatalogPublicPriority(a, b)
              || currentTime(b) - currentTime(a);
          }''')
          replace("scripts/catalog-rebuild-source-shard.mjs",
              '    const live = [...fresh.get(sourceId).values()].sort(quality);\n    const old = [...retained.get(sourceId).values()].filter((offer) => !fresh.get(sourceId).has(offer.id)).sort(quality);',
              '    const live = [...fresh.get(sourceId).values()].filter((offer) => catalogPublicPriority(offer).eligible).sort(quality);\n    const old = [...retained.get(sourceId).values()].filter((offer) => !fresh.get(sourceId).has(offer.id) && catalogPublicPriority(offer).eligible).sort(quality);')
          replace("scripts/catalog-rebuild-source-shard.mjs",
              '  const priorityOffers = offers.filter(isMassMarketPriority).length;',
              '  const priorityOffers = offers.filter(isMassMarketPriority).length;\n  const priorityTiers = offers.reduce((acc, offer) => { const key = String(catalogPublicPriority(offer).tier); acc[key] = Number(acc[key] || 0) + 1; return acc; }, {});')
          replace("scripts/catalog-rebuild-source-shard.mjs",
              '      priorityMaxTotalRub, priorityMaxPowerHp, priorityMinYear, priorityOffers,',
              '      priorityMaxTotalRub, priorityMaxPowerHp, priorityMinYear, priorityOffers, priorityTiers,')

          # Publisher: reject fixed-price offers outside the customer budget before publication.
          replace("scripts/catalog-publish-source-scale.mjs",
              'const { isCrediblePublicOffer } = await import("../apps/web/lib/catalog/offer-quality.ts");',
              'const { isCrediblePublicOffer } = await import("../apps/web/lib/catalog/offer-quality.ts");\nconst { catalogPublicPriority, compareCatalogPublicPriority } = await import("../apps/web/lib/catalog/public-priority.ts");')
          regex_replace("scripts/catalog-publish-source-scale.mjs",
              r'function businessPriority\(offer\) \{.*?\n\}\n\nfunction qualityOrder\(left, right\) \{.*?\n\}',
              '''function qualityOrder(left, right) {
            return compareCatalogPublicPriority(left, right)
              || freshness(right) - freshness(left)
              || String(left?.id || "").localeCompare(String(right?.id || ""));
          }''')
          replace("scripts/catalog-publish-source-scale.mjs",
              '    if (!isCrediblePublicOffer(offer)) return { offer: null, reason: "quality" };\n    return { offer, reason: "ok" };',
              '''    if (!isCrediblePublicOffer(offer)) return { offer: null, reason: "quality" };
            const priority = catalogPublicPriority(offer);
            if (!priority.eligible) return { offer: null, reason: `priority_${priority.reason}` };
            offer.operational = {
              ...(offer.operational || {}),
              raw: {
                ...(typeof offer.operational?.raw === "object" && offer.operational.raw ? offer.operational.raw : {}),
                publicPriority: priority,
              },
            };
            return { offer, reason: "ok" };''')
          regex_replace("scripts/catalog-publish-source-scale.mjs",
              r'  const priorityCount = selected\.filter\(\(offer\) => Number\(offer\.totalRub \|\| 0\) > 0.*?\.length;',
              '  const priorityCount = selected.filter((offer) => catalogPublicPriority(offer).tier <= 4).length;')
          replace("scripts/catalog-publish-source-scale.mjs",
              '    priorityCount,\n    priorityMaxTotalRub,',
              '    priorityCount,\n    priorityTiers: selected.reduce((acc, offer) => { const key = String(catalogPublicPriority(offer).tier); acc[key] = Number(acc[key] || 0) + 1; return acc; }, {}),\n    priorityMaxTotalRub,')

          # Knowledge: preserve popularity and years on every enriched offer.
          replace("apps/web/lib/catalog/vehicle-knowledge.ts",
              '        vehicleKnowledgeModel: { id: model.id, matchedBy: match.matchedBy, score: match.score },',
              '''        vehicleKnowledgeModel: {
                  id: model.id,
                  matchedBy: match.matchedBy,
                  score: match.score,
                  popularityDecile: model.popularityDecile,
                  representativePowerHp: model.representativePowerHp,
                  yearFrom: model.yearFrom,
                  yearTo: model.yearTo,
                },''')

          # Knowledge sync: first all models relevant to the latest ten production years, then older history.
          replace("scripts/catalog-sync-vehicle-models.mjs",
              '''const models = [...upstream.values()].sort((left, right) =>
            Number(left.popularityDecile || 10) - Number(right.popularityDecile || 10)
            || left.make.localeCompare(right.make, "en")
            || left.model.localeCompare(right.model, "en"));''',
              '''const recentKnowledgeYear = new Date().getFullYear() - 9;
          function recentKnowledgeRank(model) {
            const yearTo = Number(model.yearTo || 0);
            const yearFrom = Number(model.yearFrom || 0);
            if (yearTo >= recentKnowledgeYear || yearFrom >= recentKnowledgeYear) return 0;
            if (!yearTo && !yearFrom) return 1;
            return 2;
          }
          const models = [...upstream.values()].sort((left, right) =>
            recentKnowledgeRank(left) - recentKnowledgeRank(right)
            || Number(left.popularityDecile || 10) - Number(right.popularityDecile || 10)
            || Number(right.yearTo || right.yearFrom || 0) - Number(left.yearTo || left.yearFrom || 0)
            || left.make.localeCompare(right.make, "en")
            || left.model.localeCompare(right.model, "en"));
          const recentModels = models.filter((model) => recentKnowledgeRank(model) === 0).length;
          const undatedModels = models.filter((model) => recentKnowledgeRank(model) === 1).length;''')
          replace("scripts/catalog-sync-vehicle-models.mjs",
              '  carModels: models.length,\n  preservedManualRecords: manual.size,',
              '  carModels: models.length,\n  recentKnowledgeYear,\n  recentModels,\n  undatedModels,\n  olderModels: models.length - recentModels - undatedModels,\n  preservedManualRecords: manual.size,')

          # Same ruble price on catalog card and offer page, without changing layout.
          replace("apps/web/components/catalog/CatalogCard.tsx",
              'import { catalogPowerDisplay } from "@/lib/catalog/power-display";',
              'import { catalogPowerDisplay } from "@/lib/catalog/power-display";\nimport { catalogOfferVisibleRub } from "@/lib/catalog/public-priority";')
          regex_replace("apps/web/components/catalog/CatalogCard.tsx",
              r'\nfunction sourcePriceRub\(offer: any\) \{.*?\n\}\n\nexport function CatalogCard',
              '\nexport function CatalogCard')
          replace("apps/web/components/catalog/CatalogCard.tsx",
              '  const visibleRub = exactTotalRub || sourcePriceRub(o);',
              '  const visibleRub = exactTotalRub || catalogOfferVisibleRub(normalizedOffer);')

          replace("apps/web/app/(public)/cars/offer/[id]/page.tsx",
              'import { catalogPowerDisplay } from "@/lib/catalog/power-display";',
              'import { catalogPowerDisplay } from "@/lib/catalog/power-display";\nimport { catalogOfferVisibleRub } from "@/lib/catalog/public-priority";')
          replace("apps/web/app/(public)/cars/offer/[id]/page.tsx",
              '  const o = { ...presentCatalogOffer(raw), images: rankedCatalogImageUrls(raw) };',
              '''  const presented = presentCatalogOffer(raw);
            const exactTotalRub = Number(presented.totalRub || 0);
            const visibleRub = exactTotalRub || catalogOfferVisibleRub(raw);
            const o = {
              ...presented,
              totalRub: visibleRub || null,
              previousTotalRub: exactTotalRub ? presented.previousTotalRub : null,
              priceDeltaRub: exactTotalRub ? presented.priceDeltaRub : null,
              images: rankedCatalogImageUrls(raw),
            };''')
          replace("apps/web/app/(public)/cars/offer/[id]/page.tsx",
              'budgetTo: raw.totalRub ? Math.round(raw.totalRub * 1.25) : undefined',
              'budgetTo: visibleRub ? Math.round(visibleRub * 1.25) : undefined')

          # Explicit production policy.
          workflow = Path(".github/workflows/catalog-production-recovery-v15.yml")
          text = workflow.read_text()
          text = text.replace('      CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"\n', '      CATALOG_PRIORITY_MAX_TOTAL_RUB: "6000000"\n      CATALOG_PUBLIC_MAX_TOTAL_RUB: "6000000"\n      CATALOG_PUBLIC_ABSOLUTE_MAX_TOTAL_RUB: "15000000"\n      CATALOG_PRIORITY_POPULARITY_DECILE: "5"\n')
          workflow.write_text(text)

          # Focused regression tests, no design changes.
          test = Path("tests/catalog-source-scale.test.ts")
          t = test.read_text()
          t = t.replace('const catalogCard = fs.readFileSync(new URL("../apps/web/components/catalog/CatalogCard.tsx", import.meta.url), "utf8");', 'const catalogCard = fs.readFileSync(new URL("../apps/web/components/catalog/CatalogCard.tsx", import.meta.url), "utf8");\nconst offerPage = fs.readFileSync(new URL("../apps/web/app/(public)/cars/offer/[id]/page.tsx", import.meta.url), "utf8");\nconst publicPriority = fs.readFileSync(new URL("../apps/web/lib/catalog/public-priority.ts", import.meta.url), "utf8");')
          anchor = 'test("cards convert source prices to rubles while customs calculation is pending", () => {'
          addition = '''test("public catalog is tiered for the Russian mass market and excludes fixed offers above 6m", () => {
            assert.match(publicPriority, /popular_recent_economical_calculated/);
            assert.match(publicPriority, /CATALOG_PUBLIC_MAX_TOTAL_RUB \\|\\| 6_000_000/);
            assert.match(publicPriority, /above_public_price_limit/);
            assert.match(publicPriority, /japan_auction_unchanged/);
            assert.match(rebuildScript, /compareCatalogPublicPriority/);
            assert.match(publishScript, /priority_\\$\\{priority.reason\\}/);
            assert.match(workflow, /CATALOG_PRIORITY_POPULARITY_DECILE: "5"/);
          });

          test("offer detail uses the same ruble fallback as the catalog card", () => {
            assert.match(catalogCard, /catalogOfferVisibleRub\\(normalizedOffer\\)/);
            assert.match(offerPage, /const visibleRub = exactTotalRub \\|\\| catalogOfferVisibleRub\\(raw\\)/);
            assert.match(offerPage, /totalRub: visibleRub \\|\\| null/);
          });

          '''
          if addition not in t:
              if anchor not in t: raise SystemExit("test_anchor_missing")
              t = t.replace(anchor, addition + anchor, 1)
          test.write_text(t)

          knowledge_test = Path("tests/vehicle-knowledge.test.ts")
          kt = knowledge_test.read_text()
          anchor = 'test("public brand and model pages render knowledge power, kW and 30-minute fields", () => {'
          addition = '''test("vehicle knowledge exposes popularity and prioritizes the latest ten model years", () => {
            assert.match(modelDirectory, /popularityDecile/);
            const knowledgeSource = fs.readFileSync(new URL("../apps/web/lib/catalog/vehicle-knowledge.ts", import.meta.url), "utf8");
            const syncSource = fs.readFileSync(new URL("../scripts/catalog-sync-vehicle-models.mjs", import.meta.url), "utf8");
            assert.match(knowledgeSource, /representativePowerHp: model.representativePowerHp/);
            assert.match(syncSource, /recentKnowledgeYear = new Date\\(\\)\\.getFullYear\\(\\) - 9/);
            assert.match(syncSource, /recentKnowledgeRank/);
          });

          '''
          if addition not in kt:
              if anchor not in kt: raise SystemExit("knowledge_test_anchor_missing")
              kt = kt.replace(anchor, addition + anchor, 1)
          knowledge_test.write_text(kt)

          Path(".github/workflows/apply-russia-mass-market-priority.yml").unlink()
          PY
      - name: Validate priority, prices, knowledge and build
        run: |
          node --check scripts/catalog-rebuild-source-shard.mjs
          node --check scripts/catalog-publish-source-scale.mjs
          node --check scripts/catalog-sync-vehicle-models.mjs
          node --import tsx --test tests/catalog-source-scale.test.ts tests/vehicle-knowledge.test.ts tests/russia-customs.test.ts tests/catalog-calculation-integrity.test.ts
          npm --workspace=@avtocena/web exec tsc -- --noEmit --pretty false
          npm --workspace=@avtocena/engine exec tsc -- --noEmit
          npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Каталог: приоритизировать массовые авто для рынка РФ"
          git push origin HEAD:fix/catalog-russia-mass-market-priority
