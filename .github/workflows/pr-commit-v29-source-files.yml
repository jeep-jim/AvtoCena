name: Commit catalog v29 source changes

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  commit-source:
    if: github.head_ref == 'automation/catalog-listing-first-v29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/catalog-listing-first-v29
          fetch-depth: 0
      - name: Apply and commit non-workflow changes
        shell: bash
        run: |
          : > tests/estimated-ev-publication.test.ts
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr-apply-catalog-v29-robust.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          exec(compile(code, 'catalog-v29.py', 'exec'), {'__name__': '__main__'})
          PY
          rm -f tests/estimated-ev-publication.test.ts
          git checkout -- .github/workflows/catalog-production-recovery-v15.yml
          git config user.name "jeep-jim"
          git config user.email "173029176+jeep-jim@users.noreply.github.com"
          git add apps/web/lib/catalog/offer-quality.ts \
            apps/web/lib/catalog/storage.ts \
            'apps/web/app/(public)/cars/page.tsx' \
            scripts/catalog-publish-source-scale.mjs \
            apps/web/components/catalog/CatalogCard.tsx \
            apps/web/components/dealers/DealerDemoDashboard.tsx \
            tests/catalog-source-scale.test.ts \
            roadmap.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Каталог: публиковать реальные объявления до готового расчёта"
          git push origin HEAD:automation/catalog-listing-first-v29
