name: Ops · Korea KB read-only retry 20260813
run-name: Korea KB read-only retry · ${{ github.sha }}

on:
  push:
    branches:
      - ops/korea-kb-only-retry-20260813
    paths:
      - ".github/workflows/ops-korea-kb-only-retry-20260813.yml"

permissions:
  contents: read

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_IMAGE_STORAGE_MODE: source_urls_only
  CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
  CATALOG_MAX_IMAGES_PER_OFFER: "30"
  CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
  CATALOG_OFFER_RETENTION_MS: "259200000"
  RECOVERY_PREFERRED_MAX_RUB: "8000000"
  RECOVERY_REQUEST_TIMEOUT_MS: "35000"
  RECOVERY_RETRY_ATTEMPTS: "5"
  RECOVERY_PREPARE_CONCURRENCY: "4"
  RECOVERY_MARKET: korea
  RECOVERY_SOURCE_IDS: kbchachacha_korea_open
  RECOVERY_TARGET: "2000"
  RECOVERY_MAX_PAGES: "150"
  RECOVERY_TIME_LIMIT_MS: "2100000"

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect KB ChaChaCha read-only attempt ${{ matrix.attempt }}
        env:
          RECOVERY_OUTPUT: catalog-shard-korea-kbchachacha-attempt-${{ matrix.attempt }}.json
        run: npx tsx scripts/catalog-live-recovery-market.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-kb-retry-${{ matrix.attempt }}
          path: catalog-shard-korea-kbchachacha-attempt-${{ matrix.attempt }}.json
          if-no-files-found: warn
          retention-days: 3
