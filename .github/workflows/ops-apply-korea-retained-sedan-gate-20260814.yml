name: Ops · apply Korea retained sedan semantic gate

on:
  push:
    branches:
      - fix/korea-retained-sedan-semantic-gate-20260814
    paths:
      - ".github/workflows/ops-apply-korea-retained-sedan-gate-20260814.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/korea-retained-sedan-semantic-gate-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch recovery semantic retention gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/catalog-live-recovery-publish-batch.mjs')
          s=p.read_text()
          anchor='''function withinRetention(offer) {\n  const timestamp = freshness(offer);\n  return timestamp > 0 && timestamp >= retentionCutoff;\n}\n'''
          helper='''function withinRetention(offer) {\n  const timestamp = freshness(offer);\n  return timestamp > 0 && timestamp >= retentionCutoff;\n}\n\nfunction koreaKnownSedanIdentity(offer) {\n  const make = String(offer?.make || "").trim();\n  const identity = [offer?.model, offer?.trim, offer?.sourceTitle].filter(Boolean).join(" ");\n  if (/^(?:genesis|제네시스)$/i.test(make)) return /\\bG80\\b/i.test(identity);\n  if (/^(?:hyundai|현대)$/i.test(make)) return /(?:\\bGrandeur\\b|그랜저|\\bIoniq\\s*6\\b|아이오닉\\s*6)/i.test(identity);\n  if (/^(?:kia|기아)$/i.test(make)) return /(?:\\bK9\\b|\\bK900\\b|\\bQuoris\\b|퀴리스)/i.test(identity);\n  return false;\n}\nfunction semanticBodyValid(offer, market) {\n  if (market !== "korea") return true;\n  if (!koreaKnownSedanIdentity(offer)) return true;\n  return !/^(?:suv|crossover|offroad)$/i.test(String(offer?.bodyType || ""));\n}\n'''
          if 'function semanticBodyValid(offer, market)' not in s:
              if s.count(anchor)!=1: raise SystemExit(f'withinRetention anchor count={s.count(anchor)}')
              s=s.replace(anchor,helper,1)
          incoming='''    if (!offer.make || !offer.model) { reject("visible_core"); continue; }\n    if (offer.images.length < minImagesPerOffer) { reject("images"); continue; }'''
          incoming_new='''    if (!offer.make || !offer.model) { reject("visible_core"); continue; }\n    if (!semanticBodyValid(offer, market)) { reject("semantic_body"); continue; }\n    if (offer.images.length < minImagesPerOffer) { reject("images"); continue; }'''
          if 'reject("semantic_body")' not in s:
              if s.count(incoming)!=1: raise SystemExit(f'incoming anchor count={s.count(incoming)}')
              s=s.replace(incoming,incoming_new,1)
          retained='''    if (!withinRetention(offer) || !publicExistingStillValid(offer)) continue;\n    candidates.set(offer.id, offer);'''
          retained_new='''    if (!withinRetention(offer) || !publicExistingStillValid(offer)) continue;\n    if (!semanticBodyValid(offer, market)) { reject("retained_semantic_body"); continue; }\n    candidates.set(offer.id, offer);'''
          if 'reject("retained_semantic_body")' not in s:
              if s.count(retained)!=1: raise SystemExit(f'retained anchor count={s.count(retained)}')
              s=s.replace(retained,retained_new,1)
          p.write_text(s)

          t=Path('tests/catalog-recovery-publisher-min-images.test.ts')
          s=t.read_text()
          marker='batch recovery publisher excludes impossible Korean sedan body types from incoming and retained rows'
          if marker not in s:
              s += r'''

test("batch recovery publisher excludes impossible Korean sedan body types from incoming and retained rows", () => {
  assert.match(source, /function koreaKnownSedanIdentity\(offer\)/);
  assert.match(source, /G80/);
  assert.match(source, /Grandeur/);
  assert.match(source, /Ioniq/);
  assert.match(source, /K900/);
  assert.match(source, /Quoris/);
  assert.match(source, /function semanticBodyValid\(offer, market\)/);
  assert.match(source, /\^\(\?:suv\|crossover\|offroad\)\$/);
  assert.match(source, /!semanticBodyValid\(offer, market\)\) \{ reject\("semantic_body"\); continue; \}/);
  assert.match(source, /!semanticBodyValid\(offer, market\)\) \{ reject\("retained_semantic_body"\); continue; \}/);
});
'''
          t.write_text(s)
          PY
      - name: Focused tests
        run: node --import tsx --test tests/catalog-recovery-publisher-min-images.test.ts tests/catalog-global-model-cap.test.ts
      - name: Syntax check
        run: node --check scripts/catalog-live-recovery-publish-batch.mjs
      - name: Push code-only patch
        shell: bash
        run: |
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"
          git rm .github/workflows/ops-apply-korea-retained-sedan-gate-20260814.yml
          git add scripts/catalog-live-recovery-publish-batch.mjs tests/catalog-recovery-publisher-min-images.test.ts
          git diff --cached --check
          git commit -m "Reject stale Korea sedan body misclassification"
          git push origin HEAD:fix/korea-retained-sedan-semantic-gate-20260814
