name: Encyclopedia — addressed body parity inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/encyclopedia-body-parity.json']
permissions:
  contents: read
concurrency:
  group: encyclopedia-body-parity-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect one saved offer and installed index without writing storage
        env:
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/encyclopedia/inspect-offer-body.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encyclopedia-body-parity
          path: reports/encyclopedia-body-parity.json
          if-no-files-found: ignore
