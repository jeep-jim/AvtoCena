name: Validate homepage projection snapshot fastpath

on:
  push:
    branches: [fix/home-snapshot-projection-20260811]
    paths:
      - .github/workflows/validate-home-snapshot-projection.yml

permissions:
  contents: write

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-snapshot-projection-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch-home-snapshot-projection.py
      - run: npm run typecheck
      - name: Benchmark current generation homepage snapshot
        run: |
          npx tsx -e 'import {performance} from "node:perf_hooks"; import {readHomeCatalogSnapshot} from "./apps/web/lib/catalog/storage.ts"; (async()=>{const rows=[]; for(let i=0;i<3;i++){const t=performance.now(); const s=await readHomeCatalogSnapshot(6); rows.push({ms:Math.round((performance.now()-t)*10)/10,items:s.items.length,total:s.total,markets:Object.keys(s.marketCounts||{}).length}); if(s.items.length<6||Object.keys(s.marketCounts||{}).length<7||!(s.total>0)) throw new Error(`bad snapshot ${JSON.stringify(rows.at(-1))}`);} console.log(JSON.stringify(rows)); if(rows[1].ms>2000||rows[2].ms>2000) throw new Error(`warm snapshot too slow ${JSON.stringify(rows)}`);})()'
      - name: Commit validated production file only
        run: |
          git checkout -- . || true
          python3 scripts/patch-home-snapshot-projection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/catalog/storage.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use compact projections for homepage snapshot [skip actions]"
          git push origin HEAD:fix/home-snapshot-projection-20260811
