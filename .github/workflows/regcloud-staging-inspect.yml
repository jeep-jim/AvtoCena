name: Regcloud staging — inspect connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regcloud-staging
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: regcloud-staging
    steps:
      - name: Inspect new staging server (no installation or application writes)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          # Initial trust-on-first-use only. Record this host fingerprint and pin it
          # before later deployment runs; never disable host-key verification.
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$hosts_file" \
            root@151.248.113.177 \
            'id; uname -sr; cat /etc/os-release; df -h /; free -m; command -v docker || true'
          echo 'Initial server host key (public):'
          cat "$hosts_file"
          ssh-keygen -lf "$hosts_file"
