name: Apply desktop AutoBot styles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/autobot-desktop-styles.yml']
permissions:
  contents: read
concurrency:
  group: regcloud-production-release
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: regcloud-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/autobot" --no-save playwright@1.55.0 && "$RUNNER_TEMP/autobot/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prepare public geometry checks
        run: |
          cat > verify-autobot.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const origin='https://avtocena.com';
          const health=await (await fetch(origin+'/api/health',{cache:'no-store'})).json();
          console.log('Public release',health.releaseSha);
          const browser=await chromium.launch();
          const results=[];
          try{
            for(const colorScheme of ['light','dark']){
              const page=await browser.newPage({colorScheme,viewport:{width:1440,height:900}});
              await page.addInitScript(theme=>localStorage.setItem('avtocena_theme',theme),colorScheme);
              await page.goto(origin,{waitUntil:'domcontentloaded'});
              const launcher=page.locator('.ab-fab');
              await launcher.waitFor();
              const box=await launcher.boundingBox();
          
              const mascot=await launcher.locator('.ab-mascot').boundingBox();
              const label=await launcher.locator('.ab-fab-label').boundingBox();
          
              assert.equal(await page.locator('html').getAttribute('data-theme'),colorScheme);
              const publicHeader=await page.locator('header:visible').first().boundingBox();
              await launcher.click();
              await page.locator('.ab-panel .ta-header').waitFor();
              await page.locator('.ab-panel').evaluate(el=>Promise.all(el.getAnimations().map(a=>a.finished.catch(()=>{}))));
              const chat=await page.locator('.ab-panel .ta-header').boundingBox();
          
              console.log({colorScheme,box,mascot,label,publicHeader,chat});
              await page.screenshot({path:'autobot-'+colorScheme+'.png'});
              results.push(box.width===84 && box.height===88 && label.y>=mascot.y+mascot.height-0.5 && publicHeader.height===chat.height && Math.abs(chat.y-publicHeader.y)<1);
              await page.close();
            }
            const css=process.env.PROPOSED_HEADER_CSS;
            let offerPath;
            for(const width of [320,360,375,390,430,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              let staff=false;
              await page.route('**/api/auth/me',route=>route.fulfill({json:{user:staff?{role:'owner',id:'layout-fixture',displayName:'Staff'}:null}}));
              await page.route('**/api/account/auth',route=>route.fulfill({json:{account:null}}));
              for(const kind of ['guest','staff','offer']){
                staff=kind!=='guest';
                const path=kind==='offer'?offerPath:'/';
                assert.ok(path,'offer link on home');
                await page.goto(origin+path,{waitUntil:'domcontentloaded'});
                if(css)await page.addStyleTag({content:css});
                const header=page.locator('.ac-public-header:visible').filter({has:page.locator('a[href="/"] > div:last-child > div:first-child').filter({hasText:'АвтоЦена'})}).first();
                await header.waitFor();
                if(staff)await header.getByRole('button',{name:'Кабинет сотрудника'}).waitFor();
                if(!offerPath)offerPath=await page.locator('a[href*="/cars/offer/"]').first().getAttribute('href');
                await page.evaluate(()=>document.fonts.ready);
                const m=await header.evaluate(h=>{
                  const brand=h.querySelector('a[href="/"] > div:last-child');
                  const title=brand.firstElementChild, sub=brand.lastElementChild;
                  const rect=el=>{const r=document.createRange();r.selectNodeContents(el);const b=r.getBoundingClientRect();return {x:b.x,y:b.y,right:b.right,bottom:b.bottom,height:b.height}};
                  const mark=brand.previousElementSibling.getBoundingClientRect();
                  const lineCount=el=>{const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const tops=new Set();
                    while(walker.nextNode()){const r=document.createRange();r.selectNodeContents(walker.currentNode);for(const b of r.getClientRects())if(b.width)tops.add(Math.round(b.top));}return tops.size};
                  return {title:rect(title),sub:rect(sub),mark:[mark.x,mark.y,mark.width,mark.height],titleLines:lineCount(title),subtitleLines:lineCount(sub),
                    actions:h.firstElementChild.lastElementChild.getBoundingClientRect().left,
                    size:getComputedStyle(title.firstElementChild).fontSize,weight:getComputedStyle(title.firstElementChild).fontWeight,
                    subSize:getComputedStyle(sub).fontSize,back:!!h.querySelector('button[aria-label="Назад"]')};
                });
                console.log(JSON.stringify({width,kind,...m}));
                assert.equal(m.weight,'900');
                if(kind==='offer'){assert.ok(m.back);continue}
                if(width>=768){assert.equal(m.size,'20px');continue}
                assert.equal(m.titleLines,1,'wordmark wraps');
                assert.equal(m.subtitleLines,1,'subtitle wraps');
                assert.ok(m.sub.y>m.title.y && m.sub.bottom>m.title.bottom,'subtitle below name');
                assert.ok(Math.max(m.title.right,m.sub.right)<=m.actions,'logo overlaps actions at '+width);
                const geometry=[m.title,m.sub,m.mark,m.size,m.subSize];
                if(!staff)page.guestGeometry=geometry;
                else assert.deepEqual(geometry,page.guestGeometry,'guest and staff logo geometry');
                if(width===360)await header.screenshot({path:'mobile-header-'+kind+'.png'});
              }
              await page.close();
            }
            assert.deepEqual(results,[true,true],'public desktop AutoBot geometry');
          }finally{await browser.close()}
          JS
          cp verify-autobot.mjs "$RUNNER_TEMP/autobot/"
      - name: Preview the same header with signed-out and staff controls before installation
        env:
          PROPOSED_HEADER_CSS: '@media(max-width:767px){.ac-home-page .ac-public-header a[href="/"]>div:last-child>div:last-child{white-space:nowrap}}@media(max-width:399px){.ac-home-page .ac-public-header>div>div:last-child:has(.ac-staff-tools),.ac-home-page .ac-public-header .ac-staff-tools{column-gap:2px!important}}'
        run: node "$RUNNER_TEMP/autobot/verify-autobot.mjs"
      - name: Apply only the style overlay and verify the public page
        env:
          DEPLOY_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          remote=(ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=docs/operations/regcloud-staging-known-hosts root@151.248.113.177)
          trap 'rm -f "$key"' EXIT
          # Keep rollback on the server until the external browser has verified both themes.
          "${remote[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          exec 9>/run/lock/avtocena-runtime-change.lock
          flock -n 9
          conf=/etc/nginx/conf.d/avtocena-prepare.conf
          dir=/var/lib/avtocena-autobot-style
          install -d -m 700 "$dir"
          test ! -e "$dir/pending"
          cp -p "$conf" "$dir/original"
          python3 - "$conf" "$dir/proposed" <<'PY'
          import pathlib, sys
          source,target=map(pathlib.Path,sys.argv[1:])
          s=source.read_text()
          anchor='  location / {\n'
          assert s.count(anchor)==1 and s.count('autobot-desktop-v1')==1
          css='.ac-public-header a[href="/"]>div:last-child>div:first-child:has(>span.text-red-500),.ac-public-header a[href="/"]>div:last-child>div:first-child:has(>span.text-red-500)>span{font-size:1.25rem!important;font-weight:900!important}@media(min-width:900px){.ab-fab{display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:88px;padding:6px;gap:2px;box-sizing:border-box}.ab-fab .ab-mascot{width:52px;height:52px}.ab-fab-label{line-height:18px;text-align:center}.ab-panel .ta-header{height:65px;min-height:65px;max-height:65px;flex:0 0 65px;padding:7px 14px;box-sizing:border-box}}'
          old_css=css
          css+="@media(max-width:767px){ html body .ac-public-header a[href=\"/\"]{gap:4px!important} html body .ac-public-header a[href=\"/\"]>svg{width:28px!important;height:28px!important} html body .ac-public-header a[href=\"/\"]>div:last-child>div:first-child:has(>span.text-red-500), html body .ac-public-header a[href=\"/\"]>div:last-child>div:first-child:has(>span.text-red-500)>span{font-size:clamp(14px,4vw,17px)!important;font-weight:900!important} html body .ac-home-page .ac-public-header a[href=\"/\"]>div:last-child>div:last-child{white-space:nowrap!important;font-size:10px!important} } @media(max-width:399px){ html body .ac-public-header>div{padding-inline:6px!important;gap:4px!important} html body .ac-public-header>div>div,html body .ac-public-header .ac-staff-tools{gap:3px!important} html body .ac-public-header .ac-icon-button,html body .ac-public-header .ac-favorite-nav,html body .ac-public-header .ac-staff-account,html body .ac-public-header .ac-staff-tools button,html body .ac-public-header button[aria-label=\"Назад\"]{width:32px!important;min-width:32px!important;padding-inline:0!important} }"
          css+="@media(max-width:767px){html body .ac-public-header.ac-public-header:not(:has(button[aria-label=\"Назад\"])) a[href=\"/\"]>div:last-child>div:first-child:has(>span.text-red-500){display:flex!important;flex-flow:row nowrap!important;line-height:1!important;white-space:nowrap!important}html body .ac-public-header.ac-public-header:not(:has(button[aria-label=\"Назад\"])) a[href=\"/\"]>div:last-child>div:last-child{display:block!important;white-space:nowrap!important;line-height:1.1!important;font-size:10px!important}}"
          css+="@media(max-width:359px){html body .ac-public-header.ac-public-header a[href=\"/\"]>div:last-child>div:first-child:has(>span.text-red-500),html body .ac-public-header.ac-public-header a[href=\"/\"]>div:last-child>div:first-child:has(>span.text-red-500)>span{font-size:13px!important}html body .ac-public-header.ac-public-header a[href=\"/\"]>svg{width:24px!important;height:24px!important}html body .ac-public-header.ac-public-header>div>div:last-child{gap:2px!important}}"
          old_css=css
          original_desktop=old_css.split('@media(min-width:900px)',1)
          assert len(original_desktop)==2
          desktop_bot=original_desktop[1].split('@media(max-width:767px)',1)[0]
          css=".ac-public-header a[href=\"/\"]>div:last-child>div:first-child:has(>span.text-red-500)>span{font-weight:900!important}"+'@media(min-width:768px){'+original_desktop[0]+'}@media(min-width:900px)'+desktop_bot
          old_css=css
          css+="@media(max-width:767px){.ac-home-page .ac-public-header a[href=\"/\"]>div:last-child>div:last-child{white-space:nowrap}}@media(max-width:399px){.ac-home-page .ac-public-header>div>div:last-child:has(.ac-staff-tools),.ac-home-page .ac-public-header .ac-staff-tools{column-gap:2px!important}}"
          directives = ["    proxy_set_header Accept-Encoding \"\";", "    sub_filter_once on;", f"""    sub_filter '</head>' '<style id="autobot-desktop-v1">{css}</style></head>';"""]
          old_tag=f'<style id="autobot-desktop-v1">{old_css}</style>'
          assert s.count(old_tag)==1
          target.write_text(s.replace(old_tag,f'<style id="autobot-desktop-v1">{css}</style>'))
          PY
          cat > "$dir/rollback" <<'ROLLBACK'
          #!/bin/bash
          set -eu
          cd /var/lib/avtocena-autobot-style
          conf=/etc/nginx/conf.d/avtocena-prepare.conf
          if test -f pending && cmp -s proposed "$conf"; then
            cp -p original "$conf"
            nginx -t && systemctl reload nginx
          fi
          rm -f pending
          ROLLBACK
          chmod 700 "$dir/rollback"
          touch "$dir/pending"
          systemd-run --unit="autobot-style-revert-$(date +%s)" --on-active=6min "$dir/rollback"
          trap '"$dir/rollback"' ERR
          cat "$dir/proposed" > "$conf"
          nginx -t
          systemctl reload nginx
          REMOTE
          if node "$RUNNER_TEMP/autobot/verify-autobot.mjs"; then
            "${remote[@]}" 'cd /var/lib/avtocena-autobot-style && cmp -s proposed /etc/nginx/conf.d/avtocena-prepare.conf && rm -f pending'
          else
            "${remote[@]}" '/var/lib/avtocena-autobot-style/rollback'
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-autobot-public
          path: |
            autobot-*.png
            mobile-header-*.png
