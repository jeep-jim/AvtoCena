name: Telegram subscription alerts

on:
  workflow_dispatch:

concurrency:
  group: avtocena-telegram-subscriptions
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send new matching cars to Telegram subscribers
        env:
          AUTH_ACCESS_KEY: ${{ secrets.AUTH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 -fsS \
            -X POST \
            -H "x-auth-key: ${AUTH_ACCESS_KEY}" \
            -H 'content-type: application/json' \
            'https://avtocena.com/api/internal/telegram/subscriptions'
