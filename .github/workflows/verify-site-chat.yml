name: Verify site controls and chat
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/site-chat*'
      - 'tests/browser/site-chat*'
      - 'tests/browser/customer-chat*'
      - '.github/workflows/verify-site-chat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/crm-new-section-access.test.ts tests/crm-staff-permissions-route.test.ts tests/crm-permissions-activity.test.ts tests/site-chat-dealer-routing.test.ts tests/dealer-showcase.test.ts tests/crm-relay.test.ts tests/crm-relay-worker.test.ts
      - run: npm install --prefix "$RUNNER_TEMP/chat-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Check customer chat and color
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/chat-browser/node_modules/playwright/index.mjs
        run: |
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/customer-conversation.test.ts
          CHROME_BIN=$(command -v google-chrome) node tests/browser/customer-chat.mjs
      - name: Check desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/chat-browser/node_modules/playwright/index.mjs
        run: |
          CHROME_BIN=$(command -v google-chrome) node --import tsx tests/browser/collection-controls.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/site-chat.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/site-chat-rooms.mjs
          CHROME_BIN=$(command -v google-chrome) node tests/browser/account-entrance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-chat-screenshots
          path: |
            artifacts/collection-controls/*.png
            artifacts/site-chat/*.png
            artifacts/customer-chat/*.png
            artifacts/site-chat-rooms/*.png
            artifacts/account-entrance/*.png
