name: One-shot apply primary market galleries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-apply-primary-market-galleries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply gallery patch but hold unverified KCar change
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/fix-primary-market-galleries.py
          git checkout -- apps/web/lib/catalog/kcar-exact-source.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-gallery-source-smoke.ts')
          text = p.read_text()
          start = text.index('const kcarPage:')
          end = text.index('const ahOffer:', start)
          p.write_text(text[:start] + text[end:])
          PY
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Live Encar and exact Autohome smoke without publishing
        env:
          CATALOG_MAX_IMAGES_PER_OFFER: "30"
          CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
          CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "35000"
          CATALOG_SOURCE_TIMEOUT_MS: "35000"
        shell: bash
        run: |
          mv scripts/tmp-gallery-source-smoke.ts scripts/tmp-gallery-source-smoke.mts
          npx tsx scripts/tmp-gallery-source-smoke.mts
      - name: Commit verified Encar and Autohome source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp-gallery-source-smoke.ts scripts/tmp-gallery-source-smoke.mts
          rm -f .github/workflows/oneshot-fix-market-galleries.yml
          rm -f .github/workflows/oneshot-fix-market-galleries-v2.yml
          rm -f .github/workflows/oneshot-apply-primary-market-galleries.yml
          rm -f .github/patches/fix-primary-market-galleries.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/lib/catalog/adapters.ts \
            apps/web/lib/catalog/encar-complete-source.ts \
            apps/web/lib/catalog/autohome-new-exact-source.ts \
            .github/workflows/oneshot-fix-market-galleries.yml \
            .github/workflows/oneshot-fix-market-galleries-v2.yml \
            .github/workflows/oneshot-apply-primary-market-galleries.yml \
            .github/patches/fix-primary-market-galleries.py
          git commit -m "Use source primary galleries for Encar and Autohome"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
