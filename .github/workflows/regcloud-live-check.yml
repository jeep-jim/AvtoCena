name: Regcloud — verify live production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/market-runs/regcloud-live-check.json']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: regcloud-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify running service without restart
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/docs/operations/regcloud-staging-known-hosts")
          ssh "${ssh_opts[@]}" root@151.248.113.177 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker logs --since 12h --tail 3000 avtocena-production 2>&1 | python3 -c 'import sys,re,collections; s=sys.stdin.read(); patterns=["heap out of memory","Reached heap limit","FATAL ERROR","object_storage_response_timeout","home_initial_catalog_failed","home_initial_pricing_failed","green_invalid_snapshot"]; print("LOG_COUNTS",{p:s.count(p) for p in patterns}); print("FATAL_LINES",[line[:240] for line in s.splitlines() if re.search(r"FATAL ERROR|Reached heap limit|Mark-Compact|Scavenge",line)][-12:])'
          docker inspect --format 'started={{.State.StartedAt}} exit={{.State.ExitCode}} memoryLimit={{.HostConfig.Memory}} cpuLimit={{.HostConfig.NanoCpus}}' avtocena-production
          uptime
          free -m
          df -h /
          docker top avtocena-production -eo pid,pcpu,pmem,rss,comm
          docker inspect --format 'running={{.State.Running}} oomKilled={{.State.OOMKilled}} restarts={{.RestartCount}}' avtocena-production
          docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}}' avtocena-production
          for path in /api/health / /cars /login; do
            curl --fail --silent --show-error --max-time 30 -o /dev/null -w "LOCAL $path code=%{http_code} first=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n" --resolve avtocena.com:443:127.0.0.1 "https://avtocena.com$path"
          done
          python3 - <<'PERF'
          import urllib.request,time,json
          paths=['/api/catalog/search?market=korea&pageSize=24&sort=totalRub','/api/catalog/search?market=korea&pageSize=24&sort=totalRubDesc','/api/catalog/search?market=china&pageSize=24&sort=totalRub','/api/catalog/search?market=korea&pageSize=24&budgetTo=3000000','/cars/offer/kia-k5-iii-benzin-2-0-prestige-2021--a877bac6f6ecedcd6101bca2']
          for path in paths:
              for repeat in range(2):
                  start=time.monotonic()
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:3001'+path,timeout=90) as r:
                          body=r.read(); result={'path':path,'repeat':repeat,'seconds':round(time.monotonic()-start,3),'status':r.status,'bytes':len(body),'timing':r.headers.get('Server-Timing')}
                          if path.startswith('/api/'):
                              value=json.loads(body);result.update(total=value.get('total'),items=len(value.get('items',[])),shards=value.get('usedIndexShards',[])[:3])
                          print(json.dumps(result),flush=True)
                  except Exception as error:print(json.dumps({'path':path,'seconds':round(time.monotonic()-start,3),'error':str(error)}),flush=True)
          PERF
          systemctl is-active nginx
          systemctl is-active certbot.timer
          openssl x509 -in /etc/letsencrypt/live/avtocena.com/cert.pem -noout -dates -issuer -ext subjectAltName
          curl --fail --silent --show-error --max-time 20 --resolve avtocena.com:443:127.0.0.1 https://avtocena.com/api/health
          printf '\n'
          REMOTE
      - name: Check complete public pages and six market responses
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,time,json
          for path in ['/api/health','/','/cars','/login']+[f'/api/catalog/search?market={m}&pageSize=1' for m in ['japan','china','korea','uae','europe','georgia']]:
              started=time.monotonic()
              with urllib.request.urlopen('https://avtocena.com'+path,timeout=40) as response:
                  data=response.read(); assert response.status==200
              duration=time.monotonic()-started
              if path.startswith('/api/'):
                  value=json.loads(data); assert value['ok']
                  if 'search?' in path: assert value['items'] and value['total']>0
              else: assert b'</html>' in data and b'$RX(' not in data and len(data)>50000
              print(json.dumps({'path':path,'seconds':round(duration,3),'bytes':len(data)}),flush=True)
          try: urllib.request.urlopen('https://avtocena.com/api/crm/leads',timeout=15); raise AssertionError('CRM not protected')
          except urllib.error.HTTPError as error: assert error.code==401
          print('Anonymous CRM access rejected')
          PYCODE
