name: Catalog emergency · restore verified 28k generation
run-name: Restore verified 28,354 public cars · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-restore-verified-generation.yml
      - apps/web/lib/catalog/storage.ts
      - scripts/catalog-restore-verified-generation.mjs

permissions:
  contents: read

concurrency:
  group: catalog-live-daily-working-markets
  cancel-in-progress: false

env:
  JSON_STORAGE_DRIVER: object
  YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
  YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
  YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
  YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
  YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
  YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
  CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
  CATALOG_RESTORE_GENERATION: gen_1787240511367_a8c268d3
  CATALOG_RESTORE_EXPECTED_TOTAL: "28354"
  CATALOG_RESTORE_EXPECTED_COUNTS_JSON: '{"korea":7553,"china":5673,"japan":1478,"uae":3171,"europe":5744,"georgia":2605,"kyrgyzstan":2130}'
  CATALOG_RESTORE_REPORT: catalog-restore-verified-generation-report.json

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recovery code
        run: |
          node --check scripts/catalog-restore-verified-generation.mjs
          node --import tsx --test tests/catalog-production-hardening.test.ts tests/catalog-display-identity.test.ts
          npm run typecheck
      - name: Preflight and atomically restore verified generation
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/catalog-restore-verified-generation.mjs | tee catalog-restore-verified-generation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-restore-verified-generation
          path: |
            catalog-restore-verified-generation.log
            catalog-restore-verified-generation-report.json
          if-no-files-found: warn
          retention-days: 7
