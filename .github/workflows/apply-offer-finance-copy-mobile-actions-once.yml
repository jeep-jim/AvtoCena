name: Apply offer finance UI patch once

on:
  push:
    branches:
      - ui/offer-finance-copy-mobile-actions-20260814
    paths:
      - .github/workflows/apply-offer-finance-copy-mobile-actions-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/offer-finance-copy-mobile-actions-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply UI-only offer finance changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          finance = Path('apps/web/components/catalog/OfferFinanceCards.tsx')
          s = finance.read_text()
          replacements = [
              ('className="relative z-10 h-full min-h-[158px] pr-[205px]"', 'className="relative z-10 h-full min-h-[158px] pr-[150px]"'),
              ('className="relative z-10 h-full min-h-[158px] pr-[215px]"', 'className="relative z-10 h-full min-h-[158px] pr-[150px]"'),
              ('>Рассчитайте платёж и подберите<br className="hidden xl:block" /> удобные условия покупки автомобиля.</p>', '>Рассчитайте платёж и подберите удобные условия покупки автомобиля.</p>'),
              ('>Быстрый расчёт стоимости полиса<br className="hidden xl:block" /> для выбранного автомобиля.</p>', '>Быстрый расчёт стоимости полиса для выбранного автомобиля.</p>'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'OfferFinanceCards target not found: {old}')
              s = s.replace(old, new, 1)
          finance.write_text(s)

          page = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          p = page.read_text()
          old = '''    {detailLines.length ? <div className="ac-offer-breakdown-lines border-t border-dotted border-[var(--ac-border)] px-4 pb-3 pt-2">{detailLines.map((line, index) => <div key={`${line.id || line.title}-${index}`} className="grid grid-cols-[minmax(0,1fr)_auto] items-baseline gap-2 py-1.5 text-[12px] font-medium md:text-[13px]"><span className="ac-offer-breakdown-label flex min-w-0 items-baseline gap-2 text-[var(--ac-muted)]"><span className="min-w-0 truncate">{line.title}</span><span className="ac-offer-dotted-line mb-1 min-w-3 flex-1 border-b border-dotted border-[var(--ac-border)]" /></span><span className="ac-offer-breakdown-value whitespace-nowrap font-bold text-[var(--ac-text)]">{money(line.amountRub)} ₽</span></div>)}</div> : null}
  </details>;'''
          new = '''    {detailLines.length ? <div className="ac-offer-breakdown-lines border-t border-dotted border-[var(--ac-border)] px-4 pb-3 pt-2">{detailLines.map((line, index) => <div key={`${line.id || line.title}-${index}`} className="grid grid-cols-[minmax(0,1fr)_auto] items-baseline gap-2 py-1.5 text-[12px] font-medium md:text-[13px]"><span className="ac-offer-breakdown-label flex min-w-0 items-baseline gap-2 text-[var(--ac-muted)]"><span className="min-w-0 truncate">{line.title}</span><span className="ac-offer-dotted-line mb-1 min-w-3 flex-1 border-b border-dotted border-[var(--ac-border)]" /></span><span className="ac-offer-breakdown-value whitespace-nowrap font-bold text-[var(--ac-text)]">{money(line.amountRub)} ₽</span></div>)}</div> : null}
    <div className="grid gap-2 px-4 pb-4 pt-1 xl:hidden" aria-label="Финансовые сервисы">
      <button type="button" aria-disabled="true" data-credit-placeholder="calculator" className="relative flex h-12 w-full cursor-default items-center justify-center rounded-xl bg-[#0d1117] px-10 text-center text-[12px] font-black leading-tight text-white" style={{ backgroundColor: "#0d1117", color: "#ffffff", WebkitTextFillColor: "#ffffff" }}>
        <span className="absolute left-4 text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.25" y="5.25" width="17.5" height="13.5" rx="2.75" stroke="currentColor" strokeWidth="1.8" /><path d="M3.8 9.4H20.2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /><path d="M7 14H11" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /></svg></span>
        <span className="text-center">Кредитный калькулятор</span>
      </button>
      <button type="button" aria-disabled="true" data-insurance-placeholder="osago" className="relative flex h-12 w-full cursor-default items-center justify-center rounded-xl bg-[#FFD400] px-10 text-center text-[12px] font-black leading-tight text-[#111111]" style={{ backgroundColor: "#FFD400", color: "#111111", WebkitTextFillColor: "#111111" }}>
        <span className="absolute left-4 text-[#111111]"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.2 19 6v5.2c0 4.4-2.7 7.6-7 9.6-4.3-2-7-5.2-7-9.6V6l7-2.8Z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" /><path d="m8.8 12.1 2.1 2.1 4.5-4.6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
        <span className="text-center">Рассчитать полис ОСАГО</span>
      </button>
    </div>
  </details>;'''
          if old not in p:
              raise SystemExit('OfferPriceBreakdown insertion target not found')
          page.write_text(p.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only changes
        shell: bash
        run: |
          rm .github/workflows/apply-offer-finance-copy-mobile-actions-once.yml
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/catalog/OfferFinanceCards.tsx 'apps/web/app/(public)/cars/offer/[id]/page.tsx' .github/workflows/apply-offer-finance-copy-mobile-actions-once.yml
          git diff --cached --check
          git commit -m "Polish offer finance cards and mobile price actions"
          git push origin HEAD:ui/offer-finance-copy-mobile-actions-20260814
