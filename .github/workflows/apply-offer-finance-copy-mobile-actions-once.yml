name: Apply offer finance UI patch once

on:
  push:
    branches:
      - ui/offer-finance-copy-mobile-actions-20260814
    paths:
      - .github/workflows/apply-offer-finance-copy-mobile-actions-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/offer-finance-copy-mobile-actions-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 .github/scripts/apply_offer_finance_copy_mobile_actions.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified UI-only changes
        run: |
          rm .github/workflows/apply-offer-finance-copy-mobile-actions-once.yml
          rm .github/scripts/apply_offer_finance_copy_mobile_actions.py
          git checkout -- apps/web/tsconfig.tsbuildinfo 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/catalog/OfferFinanceCards.tsx 'apps/web/app/(public)/cars/offer/[id]/page.tsx' .github/workflows/apply-offer-finance-copy-mobile-actions-once.yml .github/scripts/apply_offer_finance_copy_mobile_actions.py
          git diff --cached --check
          git commit -m "Polish offer finance cards and mobile price actions"
          git push origin HEAD:ui/offer-finance-copy-mobile-actions-20260814
