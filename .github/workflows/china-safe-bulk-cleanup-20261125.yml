name: China safe obsolete bulk cleanup (one shot)
on:
  push:
    branches: [main]
    paths: ['.github/market-runs/china-safe-bulk-cleanup-20261125.json']
permissions:
  contents: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.repository_id == '1289722938'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == '1'
      && github.event.head_commit.message == 'Clean only verified superseded China duplicate databases after disk-full proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: regcloud-staging
    env:
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
      YC_OBJECT_STORAGE_REGION: us-east-1
      YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
      YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Syntax and inherited market state protections
        run: |
          node --check scripts/catalog-next/china-exact-safe-bulk-cleanup-20261125.mjs
          node --test tests/catalog-next-china-state.test.mjs
      - name: One-shot proof-bound disposal of old China duplicates only
        run: node scripts/catalog-next/china-exact-safe-bulk-cleanup-20261125.mjs
