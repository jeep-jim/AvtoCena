name: Prove Japan 9759 restore candidate read-only

on:
  push:
    paths:
      - .github/workflows/diagnose-japan-9759-restore-dryrun-20260816.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_IMAGE_CDN_URL: ${{ secrets.CATALOG_IMAGE_CDN_URL }}
      CATALOG_IMAGE_STORAGE_MODE: source_urls_only
      CATALOG_REBUILD_MIN_IMAGES_PER_OFFER: "5"
      CATALOG_MAX_IMAGES_PER_OFFER: "30"
      CATALOG_MAX_OFFERS_PER_MODEL_YEAR: "20"
      CATALOG_AUDIT_MAX_PER_MODEL_YEAR: "20"
      CATALOG_OFFER_RETENTION_MS: "259200000"
      RECOVERY_PUBLISH_MAX: "30000"
      RECOVERY_PREFERRED_MAX_RUB: "8000000"
      RESTORE_GENERATION: gen_1786746182901_54c0a190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Snapshot current seven markets
        env:
          CATALOG_AUDIT_OUTPUT: japan-9759-current-before.json
          CATALOG_AUDIT_ASSERT_MARKETS: korea,china,japan,uae,europe,georgia,kyrgyzstan
        run: npx tsx scripts/catalog-live-postpersist-audit.mjs
      - name: Read exact Japan snapshot from the proven generation
        shell: bash
        run: |
          mkdir -p recovery-input
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const { readDataJson } = await import('./apps/web/lib/data.ts');
          const { offerPath, chunkName } = await import('./apps/web/lib/catalog/storage.ts');
          const generation = process.env.RESTORE_GENERATION;
          const offers = [];
          let misses = 0;
          for (let index = 1; index <= 100; index++) {
            const rows = await readDataJson(offerPath(generation, 'japan', chunkName(index)), null);
            if (!Array.isArray(rows) || !rows.length) {
              misses += 1;
              if (misses >= 2) break;
              continue;
            }
            misses = 0;
            offers.push(...rows);
          }
          const unique = new Map(offers.map((offer) => [offer?.id, offer]));
          if (offers.length !== 9759) throw new Error(`japan_restore_generation_count:${offers.length}:9759`);
          if (unique.size !== offers.length) throw new Error(`japan_restore_generation_duplicates:${offers.length - unique.size}`);
          await fs.writeFile('recovery-input/catalog-rebuild-japan.json', JSON.stringify({ version: 1, market: 'japan', sourceGeneration: generation, offers }));
          console.log({ generation, offers: offers.length });
          NODE
      - name: Dry-run current production publisher with the 9759 candidate
        env:
          RECOVERY_BATCH_MARKETS: japan
          RECOVERY_BATCH_INPUT_DIR: recovery-input
          RECOVERY_BATCH_REPORT: japan-9759-restore-dryrun.json
          RECOVERY_BATCH_DRY_RUN: "true"
        run: npx tsx scripts/catalog-live-recovery-publish-batch.mjs
      - name: Require exact 9759 restoration and exact preservation of the other six
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('japan-9759-current-before.json', 'utf8'));
          const dry = JSON.parse(fs.readFileSync('japan-9759-restore-dryrun.json', 'utf8'));
          const japan = dry.byMarket?.japan || {};
          if (dry.dryRun !== true || dry.published !== false) throw new Error('japan_restore_not_dry');
          if (Number(japan.count || 0) !== 9759) throw new Error(`japan_restore_would_not_restore_9759:${japan.count}`);
          if (Number(japan.maxOffersPerModelYear || 0) !== 20) throw new Error(`japan_restore_quota_contract:${japan.maxOffersPerModelYear}`);
          if (Number(japan.imageStats?.min || 0) < 5 || Number(japan.imageStats?.belowMinimum || 0) !== 0) throw new Error('japan_restore_image_gate');
          if (Number(japan.sourceCounts?.prestige_japan_auctions_open || 0) !== 9759) throw new Error('japan_restore_source_count');
          for (const market of ['korea','china','uae','europe','georgia','kyrgyzstan']) {
            const expected = Number(before.markets?.[market]?.count || 0);
            const planned = Number(dry.preservedByMarket?.[market] || 0);
            if (planned !== expected) throw new Error(`japan_restore_preservation_count:${market}:${planned}:${expected}`);
            if (!String(dry.preservedPublicHashByMarket?.[market] || '')) throw new Error(`japan_restore_preservation_hash:${market}`);
          }
          console.log({ currentJapan: before.markets?.japan?.count, restoredJapan: japan.count, imageStats: japan.imageStats, sourceCounts: japan.sourceCounts });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-9759-restore-readonly-proof
          path: |
            japan-9759-current-before.json
            japan-9759-restore-dryrun.json
          if-no-files-found: warn
          retention-days: 3
