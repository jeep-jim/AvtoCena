name: UI · canonical catalog market flags

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ui-catalog-market-flags-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch all public catalog renderers to SVG market flags
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"missing expected pattern in {path}: {old[:120]!r}")
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"no changes in {path}")
              p.write_text(text)

          patch("apps/web/components/catalog/PriceTrend.tsx", [
              (
                  '  if (code === "USD") return',
                  '  if (code === "KGS") return <svg viewBox="0 0 28 20" className={common} role="img" aria-label="Флаг Кыргызстана"><rect width="28" height="20" fill="#d52b1e" /><circle cx="14" cy="10" r="4.4" fill="#ffdf00" /><circle cx="14" cy="10" r="2.3" fill="#d52b1e" /><g stroke="#ffdf00" strokeWidth=".8"><path d="M14 3.2v3M14 13.8v3M7.2 10h3M17.8 10h3M9.2 5.2l2.1 2.1M16.7 12.7l2.1 2.1M18.8 5.2l-2.1 2.1M11.3 12.7l-2.1 2.1" /></g></svg>;\n  if (code === "USD") return'
              ),
          ])

          patch("apps/web/components/catalog/CatalogCard.tsx", [
              (
                  'import { CatalogPrice } from "@/components/catalog/CatalogPrice";\n',
                  'import { CatalogPrice } from "@/components/catalog/CatalogPrice";\nimport { CatalogMarketFlag } from "@/components/catalog/CatalogMarketFlag";\n'
              ),
              (
                  '<div className={`ac-on-image absolute font-black uppercase tracking-[0.12em] text-white/90 ${dense ? "left-2 top-2 text-[8px] sm:left-3 sm:top-3 sm:text-[10px]" : "left-3 top-3 text-[10px]"}`}>{o.marketLabel}</div>',
                  '<div className={`ac-on-image absolute font-black uppercase tracking-[0.12em] text-white/90 ${dense ? "left-2 top-2 text-[8px] sm:left-3 sm:top-3 sm:text-[10px]" : "left-3 top-3 text-[10px]"}`}><span className="md:hidden">{o.marketLabel}</span><span className="hidden items-center gap-2 md:inline-flex"><CatalogMarketFlag market={normalizedOffer.market} className="h-4 w-6" /><span>{o.marketLabel}</span></span></div>'
              ),
          ])

          patch("apps/web/components/home/HomePageClient.tsx", [
              (
                  'import { CatalogCard } from "@/components/catalog/CatalogCard";\n',
                  'import { CatalogCard } from "@/components/catalog/CatalogCard";\nimport { CatalogMarketFlag } from "@/components/catalog/CatalogMarketFlag";\n'
              ),
              (
                  'import { CATALOG_MARKET_FLAGS, CATALOG_MARKET_LABELS, PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";',
                  'import { CATALOG_MARKET_LABELS, PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";'
              ),
              (
                  'if (make) params.set("brand", make);',
                  'if (make) params.set("make", make);'
              ),
              (
                  'if (body && !model) params.set("body", body);',
                  'if (body && !model) params.set("bodyType", body);'
              ),
              (
                  'router.push(`/results${params.toString() ? `?${params}` : ""}`);',
                  'router.push(`/cars${params.toString() ? `?${params}` : ""}`);'
              ),
              (
                  'return <main className="ac-home-page ac-page-copy min-h-screen overflow-x-hidden bg-[#07080d] text-white">',
                  'return <main className="ac-home-page ac-page-copy min-h-screen overflow-x-hidden bg-[#0f172a] text-white">'
              ),
              (
                  '<span>{CATALOG_MARKET_FLAGS[group.id]}</span><span>{CATALOG_MARKET_LABELS[group.id]}</span>',
                  '<CatalogMarketFlag market={group.id} className="h-5 w-7 md:h-6 md:w-9" /><span>{CATALOG_MARKET_LABELS[group.id]}</span>'
              ),
          ])

          patch("apps/web/app/(public)/cars/page.tsx", [
              (
                  'import { CatalogCard } from "@/components/catalog/CatalogCard";\n',
                  'import { CatalogCard } from "@/components/catalog/CatalogCard";\nimport { CatalogMarketFlag } from "@/components/catalog/CatalogMarketFlag";\n'
              ),
              (
                  'import { CATALOG_MARKET_FLAGS, CATALOG_MARKET_LABELS, PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";',
                  'import { CATALOG_MARKET_LABELS, PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";'
              ),
              (
                  '  flag: CATALOG_MARKET_FLAGS[id],\n',
                  ''
              ),
              (
                  'return <main className="ac-catalog-page ac-page-copy min-h-screen bg-[#07080d] text-white">',
                  'return <main className="ac-catalog-page ac-page-copy min-h-screen bg-[#0f172a] text-white">'
              ),
              (
                  '<span aria-hidden="true">{market.flag}</span><span>{market.label}</span>',
                  '<CatalogMarketFlag market={market.id} className="h-5 w-7 md:h-6 md:w-9" /><span>{market.label}</span>'
              ),
          ])

          patch("apps/web/app/(public)/results/results-impl.tsx", [
              (
                  'import { CATALOG_MARKET_FLAGS, CATALOG_MARKET_LABELS, PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";',
                  'import { CATALOG_MARKET_LABELS, PUBLIC_CATALOG_MARKETS } from "@/lib/catalog/runtime-config";'
              ),
              (
                  'import { CatalogCard } from "@/components/catalog/CatalogCard";\n',
                  'import { CatalogCard } from "@/components/catalog/CatalogCard";\nimport { CatalogMarketFlag } from "@/components/catalog/CatalogMarketFlag";\n'
              ),
              (
                  '  flag: CATALOG_MARKET_FLAGS[id],\n',
                  ''
              ),
              (
                  'return <main className="ac-results-page ac-page-copy min-h-screen overflow-x-hidden bg-[#07080d] text-white">',
                  'return <main className="ac-results-page ac-page-copy min-h-screen overflow-x-hidden bg-[#0f172a] text-white">'
              ),
              (
                  '<span aria-hidden="true">{group.flag}</span><span>{group.label}</span>',
                  '<CatalogMarketFlag market={group.id} className="h-5 w-7 md:h-6 md:w-9" /><span>{group.label}</span>'
              ),
          ])
          PY
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify canonical flag wiring
        run: |
          grep -q 'CatalogMarketFlag market={group.id}' apps/web/components/home/HomePageClient.tsx
          grep -q 'CatalogMarketFlag market={market.id}' 'apps/web/app/(public)/cars/page.tsx'
          grep -q 'CatalogMarketFlag market={group.id}' 'apps/web/app/(public)/results/results-impl.tsx'
          grep -q 'CatalogMarketFlag market={normalizedOffer.market}' apps/web/components/catalog/CatalogCard.tsx
          grep -q 'code === "KGS"' apps/web/components/catalog/PriceTrend.tsx
      - name: Commit UI normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/catalog/PriceTrend.tsx apps/web/components/catalog/CatalogCard.tsx apps/web/components/home/HomePageClient.tsx 'apps/web/app/(public)/cars/page.tsx' 'apps/web/app/(public)/results/results-impl.tsx'
          git commit -m "Use SVG market flags across catalog views"
          git push origin HEAD:main
