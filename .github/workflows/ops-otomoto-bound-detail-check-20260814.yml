name: Ops · OTOMOTO bound detail check 20260814

on:
  push:
    branches:
      - fix/otomoto-listing-bound-detail-gallery-20260814
    paths:
      - ".github/workflows/ops-otomoto-bound-detail-check-20260814.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/otomoto-listing-bound-detail-gallery-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Focused OTOMOTO regression
        run: node --import tsx --test tests/catalog-otomoto-bound-detail.test.ts
