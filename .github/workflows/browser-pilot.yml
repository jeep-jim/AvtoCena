name: Browser pilot
on:
  pull_request:
    paths:
      - 'services/browser-pilot/**'
      - 'apps/web/lib/browser-pilot/**'
      - 'scripts/browser-pilot-provision.ts'
      - '.github/workflows/browser-pilot.yml'
  push:
    branches: [main]
    paths: ['.github/browser-pilot-run.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avtocena-browser-${{ github.event_name == 'pull_request' && github.ref || 'pilot' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test services/browser-pilot/test/*.test.mjs
      - run: node --import tsx --test tests/browser-pilot.test.ts
      - run: docker build -t browser-pilot-test services/browser-pilot
      - name: Verify Chromium sandbox without visiting external sites
        run: |
          docker run --rm --init --memory 2g --shm-size 512m --security-opt seccomp=services/browser-pilot/seccomp_profile.json --cap-drop ALL --cap-add SYS_CHROOT --read-only --tmpfs /tmp:rw,nosuid,size=536870912 --tmpfs /home/browser:rw,nosuid,uid=1001,gid=1001,size=16777216 browser-pilot-test node --input-type=module -e 'import {chromium} from "playwright"; const b=await chromium.launch({chromiumSandbox:true,timeout:15000}); await b.close(); console.log("Sandbox launch and cleanup passed");'
  provision:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: cr.yandex/crp73he0q1blh1mujo4s/avtocena-browser:${{ github.sha }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
      - name: Build and push browser service
        run: |
          docker build -t "$IMAGE" services/browser-pilot
          docker push "$IMAGE"
      - name: Install Yandex Cloud CLI
        run: |
          curl -fsSL --max-time 60 https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o "$RUNNER_TEMP/yc-install.sh"
          bash "$RUNNER_TEMP/yc-install.sh" -i "$RUNNER_TEMP/yc" -n
          echo "YC_BIN=$RUNNER_TEMP/yc/bin/yc" >> "$GITHUB_ENV"
      - name: Configure existing deployment credentials
        env:
          YC_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/browser-yc-key.json",process.env.YC_CREDENTIALS,{mode:0o600})'
          "$YC_BIN" config profile create browser-pilot
          "$YC_BIN" config set service-account-key "$RUNNER_TEMP/browser-yc-key.json"
      - name: Provision bounded pilot and publish encrypted configuration
        run: node --import tsx scripts/browser-pilot-provision.ts
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/browser-yc-key.json"
