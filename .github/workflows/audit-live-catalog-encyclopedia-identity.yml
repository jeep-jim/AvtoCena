name: Audit Live Catalog Encyclopedia Identity

on:
  push:
    branches:
      - recovery/encyclopedia-v2-staging-20260818
    paths:
      - .github/workflows/audit-live-catalog-encyclopedia-identity.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
      CATALOG_ENCYCLOPEDIA_IDENTITY_MODE: shadow
      CATALOG_ENCYCLOPEDIA_IDENTITY_SAMPLE_LIMIT: "500"
      CATALOG_ENCYCLOPEDIA_IDENTITY_AUDIT_OUTPUT: /tmp/catalog-encyclopedia-identity-audit.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-encyclopedia-identity-resolver-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify read-only prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YC_OBJECT_STORAGE_BUCKET"
          test -n "$YC_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$YC_OBJECT_STORAGE_SECRET_ACCESS_KEY"
          node scripts/vehicle-encyclopedia/validate.mjs
      - name: Audit live offers without publication
        shell: bash
        run: |
          set -euo pipefail
          npm run catalog:audit-encyclopedia-identity
          test -s "$CATALOG_ENCYCLOPEDIA_IDENTITY_AUDIT_OUTPUT"
          node -e 'const r=require(process.env.CATALOG_ENCYCLOPEDIA_IDENTITY_AUDIT_OUTPUT); console.log(JSON.stringify({catalog:r.catalog,resolution:r.resolution,duplicateClusters:r.duplicateMakeClusters?.length,reviewQueue:r.reviewQueue&&{queued:r.reviewQueue.queued,uniqueItems:r.reviewQueue.uniqueItems}},null,2))'
      - name: Persist read-only audit result to recovery branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin recovery/encyclopedia-v2-staging-20260818
          git worktree add /tmp/recovery origin/recovery/encyclopedia-v2-staging-20260818
          cd /tmp/recovery
          mkdir -p recovery-assets/encyclopedia-v2-20260818/audits
          if [ -s /tmp/catalog-encyclopedia-identity-audit.json ]; then
            cp /tmp/catalog-encyclopedia-identity-audit.json recovery-assets/encyclopedia-v2-20260818/audits/live-catalog-identity-shadow.json
          fi
          printf 'verified_feature_sha=%s\nstatus=%s\nmode=shadow_read_only\nverified_at=%s\n' "$VERIFIED_SHA" "$JOB_STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > recovery-assets/encyclopedia-v2-20260818/audits/live-catalog-identity-shadow.meta.txt
          git add recovery-assets/encyclopedia-v2-20260818/audits/live-catalog-identity-shadow.meta.txt
          if [ -f recovery-assets/encyclopedia-v2-20260818/audits/live-catalog-identity-shadow.json ]; then git add recovery-assets/encyclopedia-v2-20260818/audits/live-catalog-identity-shadow.json; fi
          git commit -m 'chore(recovery): record live catalog identity shadow audit result' || true
          git push origin HEAD:recovery/encyclopedia-v2-staging-20260818
