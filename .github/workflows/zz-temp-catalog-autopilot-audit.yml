name: TEMP catalog autopilot final audit

on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-catalog-autopilot-audit.yml'

permissions:
  actions: read
  contents: read

jobs:
  schedule-failures:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect last scheduled queue failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/jeep-jim/AvtoCena'
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          for run in 32668061153 32600106926 32529628020; do
            echo "=== schedule run $run ==="
            curl -fsS "${hdr[@]}" "$api/actions/runs/$run/jobs?per_page=100" | jq '[.jobs[]|{id,name,status,conclusion,failedSteps:[.steps[]?|select(.conclusion=="failure")|.name]}] | {failed:[.[]|select(.conclusion=="failure")], successCount:([.[]|select(.conclusion=="success")]|length), skippedCount:([.[]|select(.conclusion=="skipped")]|length)}'
          done

  uae-live-source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe UAE source adapters from the production collector environment
        env:
          CATALOG_REBUILD_MARKET: uae
          CATALOG_RAW_LISTING_MODE: "1"
          CATALOG_SOURCE_TIMEOUT_MS: "25000"
        shell: bash
        run: |
          node --import tsx <<'NODE'
          const { dubicarsUaeCurrentSource } = await import('./apps/web/lib/catalog/dubicars-current-source.ts');
          const { dubizzleUaeExactSource } = await import('./apps/web/lib/catalog/dubizzle-exact-source.ts');
          const { scaleMarketSources } = await import('./apps/web/lib/catalog/scale-market-sources.ts');
          const sources=[dubicarsUaeCurrentSource,dubizzleUaeExactSource,...scaleMarketSources.filter(x=>x.market==='uae' && x.sourceId!=='dubizzle_uae_open')];
          const dedup=[...new Map(sources.map(s=>[s.sourceId,s])).values()];
          for(const s of dedup){
            const out={id:s.sourceId,market:s.market,accessMode:s.accessMode};
            try{const h=await s.healthCheck?.(); out.health=h||null;}catch(e){out.healthError=String(e?.message||e);}
            try{
              const p=await s.fetchPage('1');
              out.count=Number(p?.count||p?.items?.length||0); out.finished=Boolean(p?.finished); out.nextCursor=p?.nextCursor||null; out.pageHealth=p?.health||null;
              out.sample=(p?.items||[]).slice(0,5).map(raw=>{try{const o=s.normalizeOffer(raw);return o?{sourceOfferId:o.sourceOfferId,make:o.make,model:o.model,year:o.year,sourcePrice:o.sourcePrice,sourceCurrency:o.sourceCurrency,images:o.operational?.raw?.images?.length||o.operational?.raw?.parsed?.images?.length||o.images?.length||0,sourceUrl:o.operational?.sourceUrl}:null;}catch(e){return {normalizeError:String(e?.message||e)}}});
            }catch(e){out.fetchError=String(e?.message||e);}
            console.log(JSON.stringify(out));
          }
          NODE

  production-now:
    runs-on: ubuntu-latest
    steps:
      - name: Check Georgia run and seven market totals
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/jeep-jim/AvtoCena'
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          curl -fsS "${hdr[@]}" "$api/actions/runs/32728973874/jobs?per_page=100" | jq '{jobs:[.jobs[]|{id,name,status,conclusion,failedSteps:[.steps[]?|select(.conclusion=="failure")|.name]}]}'
          for market in japan korea china uae europe georgia kyrgyzstan; do
            payload="$(curl -L --retry 2 --max-time 45 -fsS "https://avtocena.com/api/catalog/search?market=$market&pageSize=1")"
            jq -n --arg market "$market" --argjson p "$payload" '{market:$market,total:($p.total//0),firstId:($p.items[0].id//null)}'
          done
          curl -L --retry 2 --max-time 45 -fsS 'https://avtocena.com/cars/offer/243f5ab811ee7e86251ba6f7' -o offer.html || true
          grep -Eo '.{0,120}(299.?216|4935|12900|12.?900|seller_declared_cena).{0,120}' offer.html 2>/dev/null | head -40 || true

  object-storage:
    runs-on: ubuntu-latest
    env:
      JSON_STORAGE_DRIVER: object
      YC_OBJECT_STORAGE_ENDPOINT: ${{ secrets.YC_OBJECT_STORAGE_ENDPOINT }}
      YC_OBJECT_STORAGE_REGION: ${{ secrets.YC_OBJECT_STORAGE_REGION }}
      YC_OBJECT_STORAGE_BUCKET: ${{ secrets.YC_OBJECT_STORAGE_BUCKET }}
      YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.YC_OBJECT_STORAGE_ACCESS_KEY_ID }}
      YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.YC_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      YC_OBJECT_STORAGE_PREFIX: ${{ secrets.YC_OBJECT_STORAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit current stored inventory and price provenance
        shell: bash
        run: |
          node --import tsx <<'NODE'
          const { readAllOffersForMaintenance } = await import('./apps/web/lib/catalog/storage.ts');
          const { REQUIRED_CATALOG_SOURCES } = await import('./apps/web/lib/catalog/required-catalog-sources.ts');
          const markets=['japan','korea','china','uae','europe','georgia','kyrgyzstan'];
          const rows=await readAllOffersForMaintenance(); const out={checkedAt:new Date().toISOString(),total:rows.length,markets:{}};
          for(const market of markets){const m=rows.filter(o=>o.market===market);const bySource={};let latest=null;for(const o of m){bySource[o.sourceId]=(bySource[o.sourceId]||0)+1;const t=String(o.operational?.sourcePublishedAt||o.updatedAt||o.firstSeenAt||'');if(t&&(!latest||t>latest))latest=t;}out.markets[market]={count:m.length,latest,required:REQUIRED_CATALOG_SOURCES[market].map(s=>({sourceId:s.sourceId,count:bySource[s.sourceId]||0})),topSources:Object.entries(bySource).sort((a,b)=>b[1]-a[1]).slice(0,10)};}
          const target=rows.find(o=>o.id==='243f5ab811ee7e86251ba6f7'||String(o.sourceOfferId)==='958003');
          out.target=target?{id:target.id,sourceId:target.sourceId,sourceOfferId:target.sourceOfferId,sourcePrice:target.sourcePrice,sourceCurrency:target.sourceCurrency,totalRub:target.totalRub,updatedAt:target.updatedAt,sourceUrl:target.operational?.sourceUrl,priceVerified:target.operational?.raw?.autoPapaDetailPriceVerified,detailPriceUsd:target.operational?.raw?.autoPapaDetailPriceUsd,priceAuthority:target.operational?.raw?.autoPapaDetailPriceAuthority,sellerDeclaredPriceUsd:target.operational?.raw?.autoPapaSellerDeclaredPriceUsd,structuredPriceUsd:target.operational?.raw?.autoPapaStructuredPriceUsd,carBreakdown:target.calculationSnapshot?.breakdown?.find?.(x=>x?.id==='car')?.amountRub}:null;
          const autopapa=rows.filter(o=>o.sourceId==='autopapa_georgia_open');out.autoPapa={count:autopapa.length,verified:autopapa.filter(o=>o.operational?.raw?.autoPapaDetailPriceVerified===true).length,sellerCena:autopapa.filter(o=>o.operational?.raw?.autoPapaDetailPriceAuthority==='seller_declared_cena').length,structured:autopapa.filter(o=>o.operational?.raw?.autoPapaDetailPriceAuthority==='structured_primary').length};console.log(JSON.stringify(out,null,2));
          NODE
