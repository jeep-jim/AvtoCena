name: Publish reviewed catalog code with accepted China data
on:
  push:
    branches: [main]
    paths: [.github/market-runs/catalog-next-china-photo-release.json]
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Exact reviewed main controller commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-next-china
  cancel-in-progress: false
jobs:
  release:
    if: github.repository_id == '1289722938' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: regcloud-staging
    env:
      EXPECTED_CONTROLLER_SHA: ${{ inputs.controller_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify exact invocation and all publication contracts before host contact
        run: |
          node --import tsx --input-type=module -e "import {verifyChinaCodeInvocation} from './scripts/catalog-next/code-entry.mjs'; verifyChinaCodeInvocation();"
          node scripts/verify-frozen-speed-baselines.mjs
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --test tests/catalog-next-*.test.mjs tests/release-speed-guard-contract.test.mjs
          node --import tsx scripts/catalog-next/code-entry.mjs --checkout
          node --import tsx scripts/catalog-next/code-entry.mjs --verify
      - name: Select the verified code scope for image preparation
        id: photo_scope
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {checkedCatalogCodeScope} from './scripts/catalog-next/photo-code-scope.mjs';
          const plan = JSON.parse(fs.readFileSync('.github/operations/catalog-next/china-code-serving-plan.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'scope=' + checkedCatalogCodeScope(plan) + '\n');
          JS
      - name: Prepare real mobile and desktop browser acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/photo-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const chrome=execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_ENV,'CHROME_BIN='+fs.realpathSync(chrome)+'\nPLAYWRIGHT_MODULE='+process.env.RUNNER_TEMP+'/photo-browser/node_modules/playwright/index.mjs\n');
          JS
      - name: Match the proven production Docker image store
        id: photo_docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.1.3
          runtime-basedir: ${{ runner.temp }}/photo-docker
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Verify China CRM controls on the exact candidate before building
        if: steps.photo_scope.outputs.scope == 'catalog-crm-china-operations-v1' || steps.photo_scope.outputs.scope == 'catalog-crm-japan-photo-retry-v1'
        run: |
          set -euo pipefail
          CRM_SHA=$(node -p "JSON.parse(require('fs').readFileSync('.github/operations/catalog-next/china-code-serving-plan.json')).runtimeSha")
          cd "$RUNNER_TEMP/china-serving-runtime-$CRM_SHA"
          COLLECTION_CONTROLS_REPORT="$RUNNER_TEMP/china-crm-collection-controls-report.json" node --import tsx tests/browser/collection-controls.mjs
          cd "$GITHUB_WORKSPACE"
          node --import tsx --import ./tests/helpers/offline-fetch.mjs --input-type=module <<'JS'
          import fs from 'node:fs';
          import {checkedCrmChinaBrowserFixture, verifyCrmChinaMiddleware} from './scripts/catalog-next/crm-china-status-proof.mjs';
          checkedCrmChinaBrowserFixture(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/china-crm-collection-controls-report.json')));
          const plan = JSON.parse(fs.readFileSync('.github/operations/catalog-next/china-code-serving-plan.json'));
          await verifyCrmChinaMiddleware(process.env.RUNNER_TEMP + '/china-serving-runtime-' + plan.runtimeSha);
          JS
      - name: Verify bounded Japan image recovery on the exact candidate before building
        if: steps.photo_scope.outputs.scope == 'catalog-crm-japan-photo-retry-v1'
        run: |
          set -euo pipefail
          PHOTO_SHA=$(node -p "JSON.parse(require('fs').readFileSync('.github/operations/catalog-next/china-code-serving-plan.json')).runtimeSha")
          cd "$RUNNER_TEMP/china-serving-runtime-$PHOTO_SHA"
          JAPAN_PHOTO_RETRY_REPORT="$RUNNER_TEMP/japan-photo-retry-browser-report.json" node --import tsx tests/browser/catalog-photo-retry.mjs
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'JS'
          import {readJapanPhotoRetryFixture} from './scripts/catalog-next/japan-photo-retry-proof.mjs';
          await readJapanPhotoRetryFixture(process.env.RUNNER_TEMP + '/japan-photo-retry-browser-report.json');
          JS
      - name: Build the verified source and check its image roundtrip
        if: steps.photo_scope.outputs.scope == 'catalog-photo-recovery-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-recovery-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-completion-v1' || steps.photo_scope.outputs.scope == 'catalog-japan-completion-v2' || steps.photo_scope.outputs.scope == 'catalog-japan-usability-v1' || steps.photo_scope.outputs.scope == 'catalog-crm-china-operations-v1' || steps.photo_scope.outputs.scope == 'catalog-crm-japan-photo-retry-v1'
        env:
          CHINA_BUILD_DOCKER_HOST: ${{ steps.photo_docker.outputs.sock }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/catalog-next/code-entry.mjs --build
      - name: Restore the exact previously built combined image and repeat its isolated roundtrip
        if: steps.photo_scope.outputs.scope == 'catalog-photo-japan-power-v1'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          CHINA_BUILD_DOCKER_HOST: ${{ steps.photo_docker.outputs.sock }}
        run: node --import tsx scripts/catalog-next/restore-photo-image.mjs --run
      - name: Publish the code with existing China bytes and automatic rollback
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGCLOUD_SSH_KEY }}
          JSON_STORAGE_DRIVER: object
          YC_OBJECT_STORAGE_ENDPOINT: https://s3.regru.cloud
          YC_OBJECT_STORAGE_REGION: us-east-1
          YC_OBJECT_STORAGE_BUCKET: avtocena-staging-8120751
          YC_OBJECT_STORAGE_PREFIX: migration-staging/full-20261011/
          YC_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          YC_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: node scripts/run-node-with-resources.mjs --import tsx scripts/catalog-next/code-entry.mjs --run
      - name: Preserve bounded saved Japan failure metadata after an unsuccessful publication
        if: failure()
        env:
          REGCLOUD_S3_ACCESS_KEY_ID: ${{ secrets.REGCLOUD_S3_ACCESS_KEY_ID }}
          REGCLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.REGCLOUD_S3_SECRET_ACCESS_KEY }}
        run: |
          node scripts/catalog-next/japan-usability-saved-failure-20261126.mjs --run > catalog-next-japan-source-failure-report.json
      - name: Preserve aggregate publication and image proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-photo-code-release-result
          path: |
            catalog-next-china-photo-release-report.json
            catalog-next-crm-china-operations-report.json
            catalog-next-japan-photo-retry-report.json
            ${{ runner.temp }}/china-crm-collection-controls-report.json
            ${{ runner.temp }}/japan-photo-retry-browser-report.json
            catalog-next-photo-browser-report.json
            artifacts/catalog-photo-live/**
            catalog-next-photo-japan-browser-report.json
            artifacts/catalog-photo-japan-live/**
            catalog-next-japan-browser-report.json
            catalog-next-japan-source-failure-report.json
            artifacts/catalog-japan-live/**
            ${{ runner.temp }}/china-release-build/image-receipt.json
            ${{ runner.temp }}/china-release-build/image-storage-proof.json
            ${{ runner.temp }}/china-release-build/image-restoration-report.json
          if-no-files-found: ignore
          retention-days: 14
