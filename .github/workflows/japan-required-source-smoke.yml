name: JPAuc past form diagnostic
run-name: JPAuc past form diagnostic · ${{ github.sha }}

on:
  push:
    branches:
      - codex-japan-required-source-smoke
    paths:
      - ".github/workflows/japan-required-source-smoke.yml"
      - "scripts/jpauc-past-form-diagnostic.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect public JPAuc form and scripts
        run: node scripts/jpauc-past-form-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpauc-past-form-diagnostic
          path: jpauc-past-form-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
