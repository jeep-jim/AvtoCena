name: Japan required sources smoke
run-name: Japan required sources smoke · ${{ github.sha }}

on:
  push:
    branches:
      - codex-japan-required-source-smoke
    paths:
      - ".github/workflows/japan-required-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source_id:
          - jpauc_japan_past_open
          - carvector_japan_stat_open
          - prestige_japan_auctions_open
          - auctiondatasearch_japan_open
          - jpcenter_japan_catalog_open
    env:
      CATALOG_CERTIFY_MARKET: japan
      CATALOG_CERTIFY_SOURCE_ID: ${{ matrix.source_id }}
      CATALOG_CERTIFY_OUTPUT: catalog-certify-japan-${{ matrix.source_id }}.json
      CATALOG_CERTIFY_PAGE_LIMIT: "3"
      CATALOG_CERTIFY_ROWS_PER_PAGE: "50"
      CATALOG_SOURCE_REQUEST_TIMEOUT_MS: "30000"
      CATALOG_GALLERY_TIMEOUT_MS: "30000"
      CATALOG_SOURCE_TIMEOUT_MS: "25000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Certify one real source card
        continue-on-error: true
        run: npx tsx scripts/catalog-certify-required-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-${{ matrix.source_id }}-smoke
          path: catalog-certify-japan-${{ matrix.source_id }}.json
          if-no-files-found: warn
          retention-days: 3
