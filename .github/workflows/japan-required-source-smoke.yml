name: JPAuc real adapter smoke
run-name: JPAuc real adapter smoke · ${{ github.sha }}

on:
  push:
    branches:
      - codex-japan-required-source-smoke
    paths:
      - ".github/workflows/japan-required-source-smoke.yml"
      - "apps/web/lib/catalog/jpauc-past-source.ts"
      - "scripts/jpauc-past-adapter-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify one real recent priced JPAuc card
        run: npx tsx scripts/jpauc-past-adapter-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpauc-real-adapter-smoke
          path: jpauc-past-adapter-smoke.json
          if-no-files-found: warn
          retention-days: 3
