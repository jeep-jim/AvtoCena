name: Apply power detail fix

on:
  push:
    branches:
      - fix/power-fullwidth-user-recalc-20260824
    paths:
      - .power-detail-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/power-fullwidth-user-recalc-20260824
          fetch-depth: 1
      - name: Make power tile full width and expose user scenario price
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page = Path('apps/web/app/(public)/cars/offer/[id]/page.tsx')
          s = page.read_text()
          old = '''  const raw: any = normalizeVehicleOfferSpecs(publicOffer(pricedOffer));\n  const presented = presentCatalogOffer(raw);\n  const visibleRub = catalogOfferVisibleRub(raw);\n'''
          new = '''  const raw: any = normalizeVehicleOfferSpecs(publicOffer(pricedOffer));\n  const presented = presentCatalogOffer(raw);\n  const powerScenario = readCatalogPowerScenario(raw);\n  // A user-entered horsepower value is an explicit on-page calculation scenario.\n  // It never mutates the stored/catalog price, but the detail page must show the\n  // resulting estimate instead of reverting to “Цена по запросу”.\n  const customerScenarioRub = safeRequestedPowerHp\n    && powerScenario?.source === "customer_input"\n    && Number(raw.totalRub || 0) > 0\n    && Number(raw.totalRub || 0) <= 15_000_000\n      ? Math.round(Number(raw.totalRub))\n      : 0;\n  const visibleRub = customerScenarioRub || catalogOfferVisibleRub(raw);\n'''
          if old not in s:
              raise SystemExit('price visibility block not found')
          s = s.replace(old, new, 1)
          duplicate = '  const powerScenario = readCatalogPowerScenario(raw);\n'
          first = s.find(duplicate)
          second = s.find(duplicate, first + len(duplicate))
          if second < 0:
              raise SystemExit('second powerScenario declaration not found')
          s = s[:second] + s[second + len(duplicate):]
          old_tile = '<EditablePowerTile key={spec.label} currentHp={editablePowerHp} requiresConfirmation={Boolean(powerScenario) || !safePowerHp} scenarioSource={powerScenario?.source || null} fullWidth={specs.length % 2 === 1 && index === specs.length - 1} />'
          new_tile = '<EditablePowerTile key={spec.label} currentHp={editablePowerHp} requiresConfirmation={Boolean(powerScenario) || !safePowerHp} scenarioSource={powerScenario?.source || null} fullWidth />'
          if old_tile not in s:
              raise SystemExit('EditablePowerTile placement not found')
          s = s.replace(old_tile, new_tile, 1)
          page.write_text(s)

          test = Path('tests/catalog-editable-power-scenario.test.ts')
          t = test.read_text()
          addition = '''\n\ntest("customer-entered horsepower stays visible as an on-page preliminary calculation", () => {\n  assert.match(offerPage, /const customerScenarioRub = safeRequestedPowerHp/);\n  assert.match(offerPage, /powerScenario\?\.source === "customer_input"/);\n  assert.match(offerPage, /customerScenarioRub \|\| catalogOfferVisibleRub\(raw\)/);\n  assert.match(offerPage, /scenarioSource=\{powerScenario\?\.source \|\| null\} fullWidth/);\n  assert.match(editableTile, /style=\{\{ gridColumn: "1 \/ -1" \}\}/);\n});\n'''
          if 'customer-entered horsepower stays visible' not in t:
              test.write_text(t + addition)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'apps/web/app/(public)/cars/offer/[id]/page.tsx' tests/catalog-editable-power-scenario.test.ts
          git commit -m "Show user horsepower scenario price and span full width"
          git push origin HEAD:fix/power-fullwidth-user-recalc-20260824
