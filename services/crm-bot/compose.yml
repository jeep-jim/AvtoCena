services:
  bot:
    build:
      context: ../..
      dockerfile: services/crm-bot/Dockerfile
    env_file: /etc/avtocena-bot.env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
