<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Продажи Toyota и Lexus в отчёте TME за январь–сентябрь 2026 года</title><desc id="desc">Всего 936042 автомобиля. Электрифицированные 813623, включая 104832 батарейных электромобиля. Группы вложенные и не складываются.</desc>
<rect width="1200" height="750" fill="#f3f5f7"/><g font-family="Arial, sans-serif" fill="#18212b">
<text x="100" y="100" font-size="32" font-weight="700">Toyota и Lexus · январь–сентябрь 2026</text>
<text x="100" y="150" font-size="24">Три числа из отчёта Toyota Motor Europe</text>
<text x="100" y="225" font-size="27">Все автомобили</text><text x="1100" y="225" text-anchor="end" font-size="32" font-weight="700">936 042</text>
<rect x="100" y="250" width="1000" height="44" rx="8" fill="#97a7b8"/>
<text x="100" y="350" font-size="27">Электрифицированные · 86,9%</text><text x="1100" y="350" text-anchor="end" font-size="32" font-weight="700">813 623</text>
<rect x="100" y="375" width="869.216" height="44" rx="8" fill="#19796b"/>
<text x="100" y="475" font-size="27">В том числе BEV · 11,2% от всех</text><text x="1100" y="475" text-anchor="end" font-size="32" font-weight="700">104 832</text>
<rect x="100" y="500" width="111.995" height="44" rx="8" fill="#dc3444"/>
<text x="100" y="615" font-size="23">Группы вложенные: складывать три числа нельзя.</text>
<text x="100" y="657" font-size="21">Источник: Toyota Motor Europe. Расчёт долей: редакция АвтоЦены.</text>
</g></svg>