<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>BMW iX4: план запуска</title><rect width="1200" height="675" fill="#14232d"/><g font-family="DejaVu Sans, sans-serif"><rect x="48" y="43" width="10" height="33" rx="4" fill="#ef4a45"/><text x="76" y="68" font-size="24" fill="#a8b9be" font-weight="400">АвтоЦена · Редакционная схема</text><text x="48" y="142" font-size="46" fill="#f5f1e8" font-weight="700">BMW iX4: план запуска</text><text x="48" y="190" font-size="25" fill="#a8b9be" font-weight="400">Даты анонса и дата получения автомобиля — разные вещи</text><path d="M140 330 L1050 330" fill="none" stroke="#b8e5cf" stroke-width="7"/><circle cx="140" cy="330" r="18" fill="#ef4a45"/><circle cx="900" cy="330" r="18" fill="#ef4a45"/><text x="50" y="282" font-size="48" fill="#f5f1e8" font-weight="700">Март 2027</text><text x="750" y="282" font-size="48" fill="#f5f1e8" font-weight="700">Позднее</text><text x="50" y="407" font-size="34" fill="#f5f1e8" font-weight="400">Два варианта</text><text x="50" y="452" font-size="29" fill="#a8b9be" font-weight="400">силовой установки</text><text x="750" y="407" font-size="34" fill="#f5f1e8" font-weight="400">M60 xDrive</text><text x="750" y="452" font-size="25" fill="#a8b9be" font-weight="400">Точная дата не названа</text><rect x="50" y="509" width="1100" height="67" rx="16" fill="#213842"/><text x="78" y="553" font-size="28" fill="#b8e5cf" font-weight="400">План запуска BMW не подтверждает срок конкретной поставки.</text><path d="M48 604 L1152 604" fill="none" stroke="#344650" stroke-width="2"/><text x="48" y="642" font-size="21" fill="#a8b9be" font-weight="400">По анонсу BMW от 08.10.2026 · Архивный разбор</text></g></svg>