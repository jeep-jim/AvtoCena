<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>Электрический Kangoo</title><rect width="1200" height="750" fill="#14232d"/><g transform="translate(0,37)" font-family="DejaVu Sans, sans-serif"><rect x="48" y="43" width="10" height="33" rx="4" fill="#ef4a45"/><text x="76" y="68" font-size="24" fill="#a8b9be" font-weight="400">АвтоЦена · Редакционная схема</text><text x="48" y="142" font-size="46" fill="#f5f1e8" font-weight="700">Электрический Kangoo</text><text x="48" y="190" font-size="25" fill="#a8b9be" font-weight="400">Что заявил производитель — и что ещё предварительно</text><rect x="50" y="250" width="465" height="300" rx="16" fill="#213842"/><rect x="102" y="307" width="345" height="157" rx="20" fill="#b8e5cf"/><rect x="447" y="355" width="22" height="62" rx="4" fill="#b8e5cf"/><text x="139" y="376" font-size="52" fill="#14232d" font-weight="700">52 кВт·ч</text><text x="139" y="423" font-size="29" fill="#14232d" font-weight="400">Батарея NMC</text><text x="575" y="305" font-size="56" fill="#f5f1e8" font-weight="700">до 354 км</text><text x="575" y="355" font-size="27" fill="#a8b9be" font-weight="400">WLTP · ожидает омологации</text><text x="575" y="445" font-size="54" fill="#b8e5cf" font-weight="700">100 кВт</text><text x="575" y="491" font-size="27" fill="#a8b9be" font-weight="400">Предел быстрой зарядки DC</text><text x="50" y="583" font-size="26" fill="#f5f1e8" font-weight="400">Проверяйте конкретные кузов, версию и итоговую спецификацию.</text><path d="M48 604 L1152 604" fill="none" stroke="#344650" stroke-width="2"/><text x="48" y="642" font-size="21" fill="#a8b9be" font-weight="400">По анонсу Renault от 12.10.2026 · Не гарантия дальности в поездке</text></g></svg>