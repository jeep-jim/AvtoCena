<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>HVO: начать с допуска</title><rect width="1200" height="750" fill="#14232d"/><g transform="translate(0,37)" font-family="DejaVu Sans, sans-serif"><rect x="48" y="43" width="10" height="33" rx="4" fill="#ef4a45"/><text x="76" y="68" font-size="24" fill="#a8b9be" font-weight="400">АвтоЦена · Редакционная схема</text><text x="48" y="142" font-size="46" fill="#f5f1e8" font-weight="700">HVO: начать с допуска</text><text x="48" y="190" font-size="25" fill="#a8b9be" font-weight="400">Три пункта проверки перед заправкой</text><rect x="50" y="250" width="350" height="200" rx="16" fill="#213842"/><text x="75" y="310" font-size="45" fill="#ef4a45" font-weight="700">01</text><text x="75" y="368" font-size="30" fill="#f5f1e8" font-weight="400">Двигатель</text><text x="75" y="417" font-size="25" fill="#b8e5cf" font-weight="400">Поколение B</text><rect x="425" y="250" width="350" height="200" rx="16" fill="#213842"/><text x="450" y="310" font-size="45" fill="#ef4a45" font-weight="700">02</text><text x="450" y="368" font-size="30" fill="#f5f1e8" font-weight="400">Топливо</text><text x="450" y="417" font-size="25" fill="#b8e5cf" font-weight="400">EN 15940</text><rect x="800" y="250" width="350" height="200" rx="16" fill="#213842"/><text x="825" y="310" font-size="45" fill="#ef4a45" font-weight="700">03</text><text x="825" y="368" font-size="30" fill="#f5f1e8" font-weight="400">Автомобиль</text><text x="825" y="417" font-size="25" fill="#b8e5cf" font-weight="400">Проверить допуск</text><text x="50" y="515" font-size="30" fill="#f5f1e8" font-weight="400">79,5% — показатель CO₂-эквивалента цепочки топлива</text><text x="50" y="563" font-size="27" fill="#a8b9be" font-weight="400">Он не означает такое же снижение расхода автомобиля.</text><path d="M48 604 L1152 604" fill="none" stroke="#344650" stroke-width="2"/><text x="48" y="642" font-size="21" fill="#a8b9be" font-weight="400">По соглашению BMW и Eni от 13.07.2026 · Архивный разбор</text></g></svg>